<body>
<div class="intro">
  <h1>Interfaccia: seconda serie di proposte</h1>
  <p>Sei direzioni diverse, ognuna con una fonte reale anni 60-70: terminale mainframe, cartella da dossier militare, carta operativa, modernismo italiano (Vignelli/Olivetti), rapporto declassificato, telescrivente. Dati veri, vista dalla Serbia.</p>
</div>
<div id="themes"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(async function () {
  const [data, world] = await Promise.all([fetch("data.json").then(r => r.json()), fetch("world.geojson").then(r => r.json())]);
  const actors = Object.fromEntries(data.actors.map(a => [a.id, a]));
  const POV = "SRB", srb = actors[POV];
  const stances = Object.fromEntries((data.stances[POV] || []).map(s => [s.toward, s]));
  const FRAC = { ally: .85, reluctant_ally: .3, partner: .5, reluctant_partner: .15, rival: .25, adversary: .8 };
  const SIDE = { ally: "ally", reluctant_ally: "ally", partner: "partner", reluctant_partner: "partner", rival: "hostile", adversary: "hostile" };
  const rel = (data.relations || []).filter(r => r.from === POV);
  const byTo = d3.group(rel, r => r.to);
  const cps = [...byTo.keys()].sort((a, b) => byTo.get(b).length - byTo.get(a).length).slice(0, 4);
  const stamp = `Situation map · in construction<br>compiled ${data.generated} · ${data.progress ? data.progress.cards + " of " + data.progress.total + " cards" : ""}`;
  const GRADES = ["ally", "reluctant_ally", "partner", "reluctant_partner", "rival", "adversary"];
  const sw = (v, g) => { const r = Math.sqrt(16 * FRAC[g] / Math.PI); return `radial-gradient(${v[SIDE[g]]} ${r.toFixed(2)}px, transparent ${(r + .15).toFixed(2)}px) 0 0 / 4px 4px ${v.land}`; };
  const legend = v => GRADES.map(g => `<div class="row"><span class="sw" style="background:${sw(v, g)}"></span>${g.replace("_", " ")}</div>`).join("") + `<div class="row"><span class="sw" style="background:repeating-linear-gradient(45deg,${v.hostile} 0 1.6px,transparent 1.6px 5px) ${v.land}"></span>claimed, not controlled</div>`;
  const bonds = v => `<div class="row"><span class="sw" style="box-shadow:inset 0 0 0 2.5px ${v.partner}"></span>kin</div><div class="row"><span class="sw" style="box-shadow:inset 0 0 0 2.5px ${v.hostile}"></span>grievance</div>`;
  const cards = () => cps.map(id => { const a = actors[id], s = stances[id], rows = byTo.get(id); return `<div class="card"><b>${a.name}</b>${s ? `${s.grade.replace("_", " ")} · ${s.trend} · ${s.bond}` : "no stance"}<br><i>${rows[0].since}</i> ${(rows[0].summary || "").slice(0, 80)}…<br>${rows.length} rows</div>`; }).join("");
  const obj = (srb.grand_strategy.objectives[0].text || "").slice(0, 230), par = (srb.grand_strategy.paradoxes[0].text || "").slice(0, 230);
  const nav = `<nav><a class="on">Map</a><a>Organisations</a><a>Issues</a><a>Luttwak</a></nav>`;

  const THEMES = [
    { id: "mf", cls: "mf", name: "A · Mainframe 3270", desc: "Terminale IBM a fosfori verdi: tutto a spaziatura fissa, barra di stato in basso, cursore che lampeggia, righe di scansione sopra lo schermo. Ambra per i partner, rosso per gli ostili. Il più radicale: zero decorazione, solo testo e mappa.",
      v: { sea: "#050a06", land: "#0f2414", coast: "#2a8a46", ally: "#4dff7a", partner: "#ffb000", hostile: "#ff4a3d", pov: "#4dff7a", paper: "#050a06", ink: "#4dff7a", font: "'IBM Plex Mono', monospace" },
      html: v => `<div class="top"><div><div class="brand">GRAND <span>STRATEGY</span></div><div class="tag">What the world's actors want and do, and where it collides</div></div>${nav}<div class="stamp">${stamp.replace("<br>", "<br>")}</div></div>
        <div class="body"><div class="side"><h3>Point of view</h3><div class="sel">THE WORLD AS SERBIA SEES IT</div><h3>Posture</h3>${legend(v)}<h3>Bond</h3>${bonds(v)}</div>
        <div><svg id="m-mf"></svg><div class="cards">${cards()}</div></div></div>
        <div class="dossier"><h2>SERBIA</h2><h4>Objectives, ranked</h4><p>1. ${obj} [1]</p><h4>Paradoxes</h4><p>${par} [2]</p></div>
        <div class="status"><span>GS/370 · SITUATION MAP · POV=SRB · LENS=POSTURE</span><span><b>READY</b> <span class="cur"></span></span></div>` },
    { id: "ds", cls: "ds", name: "B · Dossier militare", desc: "Cartella manila con fori, linguette laterali per le sezioni, graffetta sulla mappa, timbro rosso inclinato, macchina da scrivere. La mappa è una fotocopia: due inchiostri su carta. Il tema più materico.",
      v: { sea: "#f3efe3", land: "#e4ddc8", coast: "#1d1b17", ally: "#3d4a2a", partner: "#2a3a6b", hostile: "#b4271d", pov: "#1d1b17", paper: "#f3efe3", ink: "#1d1b17", font: "'Courier Prime', monospace" },
      html: v => `<div class="folder"><div class="tabs"><a class="on">Map</a><a>Organisations</a><a>Issues</a><a>Luttwak</a></div><div class="holes"><i></i><i></i><i></i></div>
        <div class="top"><div><div class="brand">GRAND STRATEGY</div><div class="tag">What the world's actors want and do, and where it collides.</div></div><div class="stamp">${stamp}</div></div>
        <div class="body"><div class="side"><h3>Point of view</h3><div class="sel">The world as Serbia sees it</div><h3>Posture of Serbia</h3>${legend(v)}<h3>Bond</h3>${bonds(v)}<h3>Classification</h3><div><span class="redact">xxxxxxxxxxxxxxxx</span> open sources only</div></div>
        <div><div class="mapwrap"><div class="clip"></div><svg id="m-ds"></svg><div class="cap">Fig. 1 - Posture as recorded, ${data.generated}. Two inks. Hatched = claimed, not controlled.</div></div><div class="cards">${cards()}</div></div></div>
        <div class="dossier"><h2>SERBIA</h2><h4>Objectives, ranked</h4><p>1. ${obj} [1]</p><h4>Paradoxes</h4><p>${par} [2]</p></div></div>` },
    { id: "op", cls: "op", name: "C · Carta operativa", desc: "Carta nautica militare: blu notte con griglia, segni d'angolo gialli, ciano per gli alleati, giallo per i partner, rosso per gli ostili. Barlow Condensed maiuscolo spaziato, come le stampe DIN. Serio, leggibile, non decorativo.",
      v: { sea: "#0b1b33", land: "#16305a", coast: "#5b7fb0", ally: "#7fd1ff", partner: "#ffd23f", hostile: "#ff4e3a", pov: "#ffd23f", paper: "#0b1b33", ink: "#d8e6f5", font: "'Barlow Condensed', sans-serif", grat: "#ffffff14" },
      html: v => `<div class="top"><div><div class="brand">Grand <span>Strategy</span></div><div class="tag">Chart 01 · What the world's actors want and do, and where it collides</div></div>${nav}<div class="stamp">${stamp}</div></div>
        <div class="body"><div class="side"><h3>Point of view</h3><div class="sel">The world as Serbia sees it</div><h3>Posture of Serbia</h3>${legend(v)}<h3>Bond</h3>${bonds(v)}</div>
        <div><div class="mapwrap"><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div><svg id="m-op"></svg></div><div class="cards">${cards()}</div></div></div>
        <div class="dossier"><h2>Serbia</h2><h4>Objectives, ranked</h4><p>1. ${obj}<sup>1</sup></p><h4>Paradoxes</h4><p>${par}<sup>2</sup></p></div>` },
    { id: "vg", cls: "vg", name: "D · Vignelli / Olivetti", desc: "Modernismo italiano: nero, Helvetica pesante, una sola riga blu elettrico, nessun bordo decorativo, gerarchia fatta solo di peso e dimensione. La mappa in nero con bianco alleati, blu partner, rosso ostili. Il più pulito.",
      v: { sea: "#0d0d0d", land: "#262626", coast: "#4a4a4a", ally: "#ffffff", partner: "#1f5bff", hostile: "#ff3b30", pov: "#1f5bff", paper: "#0d0d0d", ink: "#ffffff", font: "Inter, sans-serif" },
      html: v => `<div class="top"><div><div class="brand">Grand<br><span>Strategy</span></div><div class="tag">What the world's actors want and do, and where it collides.</div></div>${nav}<div class="stamp"><b>Situation map</b> · in construction<br>${data.generated} · ${data.progress ? data.progress.cards + " of " + data.progress.total + " cards" : ""}</div></div>
        <div class="body"><div class="side"><h3>Point of view</h3><div class="sel">Serbia</div><h3>Posture</h3>${legend(v)}<h3>Bond</h3>${bonds(v)}</div>
        <div><svg id="m-vg"></svg><div class="cards">${cards()}</div></div></div>
        <div class="dossier"><h2>Serbia</h2><h4>Objectives, ranked</h4><p>1. ${obj}<sup>1</sup></p><h4>Paradoxes</h4><p>${par}<sup>2</sup></p></div>` },
    { id: "dc", cls: "dc", name: "E · Rapporto declassificato", desc: "Carta grigio-bianca, nero, una fascia 'approved for release' in alto, timbro rosso, piè di pagina con numerazione. Colori della mappa smorzati come nelle carte CIA degli anni 70. Il più istituzionale, da leggere a lungo.",
      v: { sea: "#cfd8e3", land: "#f6f5ee", coast: "#141414", ally: "#5b7a4a", partner: "#4a5f8e", hostile: "#c0392b", pov: "#141414", paper: "#ecebe3", ink: "#141414", font: "Inter, sans-serif" },
      html: v => `<div class="bar">Approved for release · open sources only · ${data.generated}</div><div class="top"><div><div class="brand">Grand Strategy</div><div class="tag">What the world's actors want and do, and where it collides.</div></div>${nav}<div class="stamp">${stamp}</div></div>
        <div class="body"><div class="side"><h3>Point of view</h3><div class="sel">The world as Serbia sees it ▾</div><h3>Posture of Serbia</h3>${legend(v)}<h3>Bond</h3>${bonds(v)}</div>
        <div><svg id="m-dc"></svg><div class="cards">${cards()}</div></div></div>
        <div class="dossier"><h2>Serbia</h2><h4>Objectives, ranked</h4><p>1. ${obj}<sup>1</sup></p><h4>Paradoxes</h4><p>${par}<sup>2</sup></p></div>
        <div class="foot"><span>Grand Strategy · situation map</span><span>Serbia · card verified ${srb.last_verified || ""}</span><span>page 1 of 205</span></div>` },
    { id: "tt", cls: "tt", name: "F · Telescrivente", desc: "Carta gialla da telescrivente con i fori di trascinamento, tutto maiuscolo a spaziatura fissa, 'END OF TRANSMISSION' in fondo. Blu carbone per i partner, rosso per gli ostili. Tra il dossier e il mainframe, ma su carta.",
      v: { sea: "#faf4d9", land: "#eadfae", coast: "#1c1c1c", ally: "#1c1c1c", partner: "#2c4e9b", hostile: "#b4271d", pov: "#1c1c1c", paper: "#f3e9bf", ink: "#1c1c1c", font: "'IBM Plex Mono', monospace" },
      html: v => `<div class="paper"><div class="inner"><div class="top"><div><div class="brand">GRAND <span>STRATEGY</span></div><div class="tag">What the world's actors want and do, and where it collides</div></div>${nav}<div class="stamp">${stamp}</div></div>
        <div class="body"><div class="side"><h3>Point of view</h3><div class="sel">SERBIA</div><h3>Posture</h3>${legend(v)}<h3>Bond</h3>${bonds(v)}</div>
        <div><div class="mapwrap"><svg id="m-tt"></svg></div><div class="cards">${cards()}</div></div></div>
        <div class="dossier"><h2>Serbia</h2><h4>Objectives, ranked</h4><p>1. ${obj} [1]</p><h4>Paradoxes</h4><p>${par} [2]</p></div><div class="eot">=== END OF TRANSMISSION · 37 OF 205 CARDS · NNNN ===</div></div></div>` },
    { id: "wg", cls: "wg", name: "G · WarGames 1983 (schermo vettoriale NORAD)", desc: "Nero assoluto, paesi disegnati solo come contorni luminosi, niente riempimenti: il punto di vista in bianco-azzurro acceso, gli alleati in verde, i partner in azzurro, gli ostili in rosso, con il bagliore del fosforo. Blocco di lettura in basso a destra come sul WOPR. Caratteri da display, righe di scansione. Il più cinematografico.",
      v: { sea: "#000", land: "none", coast: "#8fb0c8", ally: "#7fff8a", partner: "#4fb3ff", hostile: "#ff5a4a", pov: "#e6f6ff", paper: "#000", ink: "#cfeaff", font: "'Share Tech Mono', monospace" }, draw: "vector",
      html: v => `<div class="top"><div><div class="brand">GRAND <span>STRATEGY</span></div><div class="tag">What the world's actors want and do, and where it collides</div></div><nav><a class="on" data-n="01">Map</a><a data-n="02">Organisations</a><a data-n="03">Issues</a><a data-n="04">Luttwak</a></nav><div class="stamp">${stamp}</div></div>
        <div class="body"><div class="side"><h3>Point of view</h3><div class="sel">SERBIA</div><h3>Posture</h3>${GRADES.map(g => `<div class="row"><span class="sw" style="border-color:${v[SIDE[g]]};box-shadow:0 0 ${FRAC[g] > .5 ? 8 : 3}px ${v[SIDE[g]]}"></span>${g.replace("_", " ")}</div>`).join("")}<div class="row"><span class="sw" style="border-color:${v.hostile};border-style:dashed"></span>claimed, not controlled</div><h3>Bond</h3><div class="row"><span class="sw" style="border-color:${v.partner};border-width:3px"></span>kin</div><div class="row"><span class="sw" style="border-color:${v.hostile};border-width:3px"></span>grievance</div></div>
        <div><div class="mapwrap"><svg id="m-wg"></svg><div class="readout">STS D: SERBIA · POSTURE<br>ALLIES 00 · PARTNERS 05 · HOSTILE 03<br>LENS: POSTURE / UN VOTES / CLUBS<br>BN DTA AVLB: 43 ROWS · SELECT 012</div></div><div class="cards">${cards()}</div></div></div>
        <div class="dossier"><h2>SERBIA</h2><h4>Objectives, ranked</h4><p>1. ${obj} [1]</p><h4>Paradoxes</h4><p>${par} [2]</p></div>` },
  ];

  // WarGames: outlines only, glow by posture strength
  function drawVector(svg, v) {
    const { width, height } = svg.node().getBoundingClientRect();
    const proj = d3.geoNaturalEarth1().fitExtent([[6, 6], [width - 6, height - 6]], world);
    const path = d3.geoPath(proj);
    svg.append("rect").attr("width", width).attr("height", height).attr("fill", "#000");
    const defs = svg.append("defs");
    const glow = defs.append("filter").attr("id", `${svg.attr("id")}-glow`).attr("x", "-20%").attr("y", "-20%").attr("width", "140%").attr("height", "140%");
    glow.append("feGaussianBlur").attr("stdDeviation", 1.6).attr("result", "b");
    const m = glow.append("feMerge"); m.append("feMergeNode").attr("in", "b"); m.append("feMergeNode").attr("in", "SourceGraphic");
    const [[x0, y0], [x1, y1]] = path.bounds(world.features.find(f => f.id === POV));
    const k = Math.min(14, Math.min(width, height) / (Math.max(x1 - x0, y1 - y0) * 8));
    const g = svg.append("g").attr("transform", `translate(${width / 2 - k * (x0 + x1) / 2},${height / 2 - k * (y0 + y1) / 2}) scale(${k})`);
    g.append("path").attr("d", path(d3.geoGraticule10())).attr("fill", "none").attr("stroke", "#1f4a6e").attr("stroke-width", .5 / k).attr("stroke-dasharray", `${2 / k} ${3 / k}`);
    g.selectAll("path.c").data(world.features).join("path").attr("d", path).attr("fill", "none").attr("stroke", v.coast).attr("stroke-width", .6 / k).attr("stroke-opacity", .7);
    const sc = world.features.filter(f => f.id === POV || (stances[f.id] && stances[f.id].grade !== "neutral"));
    const col = f => f.id === POV ? v.pov : stances[f.id].grade === "claimed_territory" ? v.hostile : v[SIDE[stances[f.id].grade]];
    g.selectAll("path.p").data(sc).join("path").attr("d", path).attr("fill", f => f.id === POV ? v.pov : col(f)).attr("fill-opacity", f => f.id === POV ? .18 : (FRAC[stances[f.id].grade] || .3) * .22)
      .attr("stroke", col).attr("stroke-width", f => (f.id === POV ? 2.2 : stances[f.id].grade === "claimed_territory" ? 1.2 : 1 + (FRAC[stances[f.id].grade] || .3) * 1.4) / k)
      .attr("stroke-dasharray", f => f.id !== POV && stances[f.id].grade === "claimed_territory" ? `${3 / k} ${2 / k}` : null)
      .attr("filter", `url(#${svg.attr("id")}-glow)`);
    const labels = data.actors.filter(a => a.id === POV || (stances[a.id] && stances[a.id].grade !== "neutral")).filter(a => world.features.find(f => f.id === a.id));
    g.selectAll("text").data(labels).join("text").attr("transform", a => { const [x, y] = path.centroid(world.features.find(f => f.id === a.id)); return `translate(${x},${y}) scale(${1 / k})`; })
      .attr("text-anchor", "middle").attr("font-family", v.font).attr("font-size", 11).attr("letter-spacing", ".12em").attr("fill", a => a.id === POV ? v.pov : col(world.features.find(f => f.id === a.id))).attr("paint-order", "stroke").attr("stroke", "#000").attr("stroke-width", 3)
      .text(a => (a.short || a.name).toUpperCase());
  }

  function drawPosture(svg, v) {
    const { width, height } = svg.node().getBoundingClientRect();
    const proj = d3.geoNaturalEarth1().fitExtent([[6, 6], [width - 6, height - 6]], world);
    const path = d3.geoPath(proj);
    svg.append("rect").attr("width", width).attr("height", height).attr("fill", v.sea);
    const defs = svg.append("defs");
    const [[x0, y0], [x1, y1]] = path.bounds(world.features.find(f => f.id === POV));
    const k = Math.min(14, Math.min(width, height) / (Math.max(x1 - x0, y1 - y0) * 9));
    const tx = width / 2 - k * (x0 + x1) / 2, ty = height / 2 - k * (y0 + y1) / 2;
    Object.entries(FRAC).forEach(([g, frac]) => {
      const r = Math.sqrt(16 * frac / Math.PI);
      defs.append("pattern").attr("id", `${svg.attr("id")}-s-${g}`).attr("width", 4).attr("height", 4).attr("patternUnits", "userSpaceOnUse").attr("patternTransform", `scale(${1 / k})`)
        .append("circle").attr("cx", 2).attr("cy", 2).attr("r", r).attr("fill", v[SIDE[g]]);
    });
    const hatch = defs.append("pattern").attr("id", `${svg.attr("id")}-h`).attr("width", 5).attr("height", 5).attr("patternUnits", "userSpaceOnUse").attr("patternTransform", `rotate(45) scale(${1 / k})`);
    hatch.append("rect").attr("width", 1.8).attr("height", 5).attr("fill", v.hostile);
    const g = svg.append("g").attr("transform", `translate(${tx},${ty}) scale(${k})`);
    if (v.grat) g.append("path").attr("d", path(d3.geoGraticule10())).attr("fill", "none").attr("stroke", v.grat).attr("stroke-width", .6 / k);
    g.selectAll("path.c").data(world.features).join("path").attr("d", path).attr("fill", v.land).attr("stroke", v.coast).attr("stroke-width", .5 / k);
    const sc = world.features.filter(f => f.id === POV || stances[f.id]);
    g.selectAll("path.p").data(sc).join("path").attr("d", path).attr("fill", f => f.id === POV ? v.pov : stances[f.id].grade === "neutral" ? "none" : stances[f.id].grade === "claimed_territory" ? `url(#${svg.attr("id")}-h)` : `url(#${svg.attr("id")}-s-${stances[f.id].grade})`);
    const bonded = world.features.filter(f => stances[f.id] && ["kin", "grievance"].includes(stances[f.id].bond));
    bonded.forEach(f => defs.append("clipPath").attr("id", `${svg.attr("id")}-clip-${f.id}`).append("path").attr("d", path(f)));
    g.selectAll("path.b").data(bonded).join("path").attr("d", path).attr("fill", "none").attr("stroke", f => stances[f.id].bond === "kin" ? v.partner : v.hostile).attr("stroke-width", 3.4 / k).attr("clip-path", f => `url(#${svg.attr("id")}-clip-${f.id})`);
    const labels = data.actors.filter(a => a.id === POV || stances[a.id]).filter(a => world.features.find(f => f.id === a.id));
    g.selectAll("text").data(labels).join("text").attr("transform", a => { const [x, y] = path.centroid(world.features.find(f => f.id === a.id)); return `translate(${x},${y}) scale(${1 / k})`; })
      .attr("text-anchor", "middle").attr("font-family", v.font).attr("font-weight", 700).attr("font-size", 10).attr("letter-spacing", ".1em").attr("fill", a => a.id === POV ? v.paper : v.ink).attr("paint-order", "stroke").attr("stroke", a => a.id === POV ? v.pov : v.land).attr("stroke-width", 2.5).attr("stroke-opacity", .9)
      .text(a => (a.short || a.name).toUpperCase());
  }

  const host = document.getElementById("themes");
  THEMES.forEach(t => {
    const sec = document.createElement("section"); sec.className = "prop";
    sec.innerHTML = `<p class="lbl">${t.name}</p><p class="desc">${t.desc}</p><div class="ui ${t.cls}">${t.html(t.v)}</div>`;
    host.appendChild(sec);
    (t.draw === "vector" ? drawVector : drawPosture)(d3.select(`#m-${t.id}`), t.v);
  });
})();
</script>
</body>
</html>
