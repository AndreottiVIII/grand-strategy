# The questions that split the world, as the atlas can show them today. Each one is a
# lens on the home map: `recognition` colours by who recognises `target`; `vote`
# colours by how each member voted on `symbol` (a landmark in unga-landmarks.yaml).
# Add an issue when a card makes it visible; keep `added` so the list reads as history.
issues:
  - id: TWN
    title: Taiwan
    subtitle: who recognises the Republic of China
    kind: recognition
    target: TWN
    why: Twelve governments keep formal ties with Taipei; everyone else has chosen Beijing. The list shrinks every few years.
    added: 2026-10-12
  - id: PSE
    title: Palestine
    subtitle: who recognises the State of Palestine
    kind: recognition
    target: PSE
    why: The 2024-25 wave of Western recognitions moved the line that had stood since 1988.
    added: 2026-10-12
  - id: XKX
    title: Kosovo
    subtitle: who recognises it
    kind: recognition
    target: XKX
    why: Recognition is Serbia's and Kosovo's whole contest; five EU members still refuse, Belgrade campaigns for withdrawals.
    added: 2026-10-12
  - id: UKR
    title: Ukraine
    subtitle: the last General Assembly vote on the war
    kind: vote
    symbol: A/RES/ES-11/10
    why: The February 2026 vote, with the United States abstaining, shows where the coalition stands four years in.
    added: 2026-10-12
  - id: UKR2022
    title: Ukraine, March 2022
    subtitle: the first vote on the aggression
    kind: vote
    symbol: A/RES/ES-11/1
    why: The baseline - 141 in favour - against which every later vote on Ukraine is read.
    added: 2026-10-12
  - id: ANNEX
    title: Annexations
    subtitle: the October 2022 vote on Russia's annexation of Ukrainian regions
    kind: vote
    symbol: A/RES/ES-11/4
    why: Territorial integrity is the one principle almost every state will vote for, even those close to Moscow.
    added: 2026-10-12
  - id: SREB
    title: Srebrenica
    subtitle: the 2024 genocide remembrance vote
    kind: vote
    symbol: A/RES/78/282
    why: Serbia campaigned against it and counted the 68 abstentions as a victory; the vote maps the Balkans' memory wars onto the world.
    added: 2026-10-12
  - id: GAZA
    title: Gaza
    subtitle: the 2024 vote to end Israel's presence in the territories
    kind: vote
    symbol: A/RES/ES-10/24
    why: The clearest line of the Gaza war in the Assembly, with the West split in three.
    added: 2026-10-12
  - id: PSE2026
    title: Palestine at the UN
    subtitle: the September 2026 vote on Palestine's participation
    kind: vote
    symbol: A/RES/81/1
    why: After the recognitions, the procedural vote that measures them.
    added: 2026-10-12
