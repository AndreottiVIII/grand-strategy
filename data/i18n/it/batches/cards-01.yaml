- hash: 6aedba67
  kind: cards
  en: 'China in October 2026 is the case Luttwak wrote the book about, read from the inside.

    At the technical level the instruments are the best in the world and growing: the

    largest navy by hulls, a third carrier, a coast guard with a licence to fire, a

    monopoly on the magnets everyone''s motors need, a trade surplus of USD 1.2 trillion.

    At the level of theatre strategy the record is mixed by design: the Taiwan Strait is

    rehearsed twice a year and never crossed, the shoals are taken by water cannon and

    nature reserves rather than by landings, the Senkakus are visited 357 days a year.

    At the level of grand strategy the paradox Luttwak predicted is visible in every

    file of this atlas: Japan calls China its greatest challenge, fourteen states

    reaffirm an award Beijing calls null, the EU keeps ''systemic rival'', and the one

    rival that matters, the United States, had to be bought into three truces with the

    rare-earth lever that each truce spends. What is new in 2025-26 is that Beijing

    appears to have read the logic: the thaws with India, Australia, South Korea,

    Britain, Vietnam and even Brussels are a great state lowering its weight on the

    scale, and the handling of Trump - hospitality, soybeans, a Board of Trade, ''healthy

    competition kept within bounds'' - is relational manoeuvre of a high order. What is

    old is the reflex: one sentence from Takaichi brought back the whole arsenal of

    coercion against the neighbour whose rearmament costs China most, and the

    Philippine shoals got batons in the same summer. The constraints are heavier than

    the rhetoric admits - deflation, 7.9 million births, a purged high command, a strait

    it does not control and a chip embargo it cannot answer in kind - and they are why

    the squeeze stays short of war. Three signals that are not rows: Beijing has let the

    Power of Siberia 2 price wait for over a year, the measure of who is senior; it

    asked Tehran, not Washington, to reopen Hormuz; and it made its best offer to Trump

    on Taiwan not with a threat but with a request. The question the card leaves open

    is Luttwak''s own: whether a state can keep learning the logic of strategy faster

    than its own weight teaches the others.'
  it: ''
- hash: 0b676614
  kind: cards
  en: 'Keep the Ouattara system: a fourth term won on 25 October 2025 with the two strongest rivals kept off the ballot. Thiam was removed from the electoral roll over his nationality, and Laurent Gbagbo
    was excluded after a criminal conviction; Simone Gbagbo stood. The provisional result gave Ouattara about 89.8% on turnout of about 50%, and the opposition called for new elections.'
  it: ''
- hash: 7bd694be
  kind: cards
  en: Recover the six Ivorian officials reported detained in Burkina Faso in late August 2025, and keep the feud with Ouagadougou from escalating. Abidjan rejects the destabilisation charges and says Burkina
    has offered no proof; the officials' return was under negotiation.
  it: ''
- hash: d34ba048
  kind: cards
  en: ECOWAS as the channel in its quarrels with the Sahel juntas. In 2022-23 the bloc set Mali a deadline over the 46 Ivorian soldiers and then did not impose sanctions; Bamako pardoned the men in early
    January 2023.
  it: ''
- hash: a9988cb8
  kind: cards
  en: The army as a peacekeeping contributor abroad. The 46 men held in Mali were, by Abidjan's account, a backup force for the UN mission MINUSMA; Bamako called them mercenaries who had entered without
    permission.
  it: ''
- hash: c07c7144
  kind: cards
  en: 'The 2028 succession and the constitution. The current constitution bars a third term and ends Tshisekedi''s mandate at the close of 2028. The court''s clearance of a referendum route (July 2026)
    is contested: the Catholic bishops'' conference (CENCO) said on 20 June 2026 that a ''forced passage'' risked the balkanisation of the country, the C64 opposition bloc called the move ''high treason'',
    and the ruling Sacred Union of the Nation answered that a few bishops cannot substitute themselves for the institutions. Any Kinshasa deal with Kigali or the M23 is read in that light.'
  it: ''
- hash: 3754810b
  kind: cards
  en: 'The church as the national voice that the state cannot command. The Catholic bishops'' conference (CENCO) is the one national body the sources show acting against the constitutional change: its statement
    of June 2026 and its 2024 memorandum against changing core articles. Kinshasa cannot silence or command the bishops, and a forced referendum would, in our reading, bring them into open opposition (C:
    the sources record the statements, not the consequence).'
  it: ''
- hash: c5525a79
  kind: cards
  en: The minerals deal that is meant to buy Washington's protection exposes its partners to the war. The US partnership ties preferential access to critical minerals to security cooperation, yet the Chemaf
    purchase by a US firm drew Reuters questions over due diligence (March 2026) and analysts say the minerals-for-security model will not stop the fighting, because the mines are in the territory the M23
    and its backers control or contest.
  it: ''
- hash: e16b6c10
  kind: cards
  en: The partner it needs against the M23 is the state it has taken to the International Court of Justice. Kinshasa fights beside the Ugandan army in Operation Shujaa and accepts Kampala's troops, although
    the ICJ ordered Uganda to pay USD 325m for its 1998-2003 occupation (judgment of 9 February 2022), and the UN experts say Ugandan units shielded the M23 (July 2025, Uganda denies it).
  it: ''
- hash: 10ef3e72
  kind: cards
  en: The more Kinshasa negotiates the peace, the less it controls the state that would keep it. The Washington and Doha tracks require an inclusive national dialogue and internal reform, yet the constitutional
    route to a third term turns the opposition and the bishops against the presidency just as the eastern front needs unity. A deal signed in Doha or Washington is only as strong as the Kinshasa politics
    that implement it.
  it: ''
- hash: a8f2c66b
  kind: cards
  en: 'Kinshasa has lost its two largest eastern cities to a rebellion that its neighbour backs, and it cannot retake them alone, so it has spent 2025-2026 buying partners: Burundian troops in South Kivu,
    Ugandan operations against the ADF, Qatar''s Doha track, Washington''s minerals-for-security deal and an Angolan mediation that has come and gone. Every track gives it a seat and gives its enemies one
    too, which is why the strategy works by keeping the initiative with others rather than by winning on the ground. The minerals are the currency of the whole effort and the reason the outside powers are
    present, with China already holding most of the cobalt through Sicomines and the United States now seeking access. The 2028 succession has moved the decisive contest from the eastern front to the capital,
    where the Catholic bishops and the opposition are the only national forces able to stop a third term, and that is the constraint no foreign mediator can remove.'
  it: ''
- hash: 50de57b9
  kind: cards
  en: Keep Denis Sassou Nguesso in power to 2031. He won a fifth term on 15 March 2026 with 94.82% of the vote and 84.65% turnout (official count, as reported by Chronicle.lu) after several opposition parties
    were suspended and the internet was cut on election day; most opposition parties fielded no candidate.
  it: ''
- hash: 70afe810
  kind: cards
  en: Refinance the debt and keep oil income flowing. Moody's raised Congo's outlook in May 2026 on a refinancing of $850 million of bonds due 2036 at 9.5%, with a tender for $575 million of bonds due 2032.
    Debt is about 98% of GDP, arrears about 13% of GDP (Moody's, as carried by allAfrica).
  it: ''
- hash: 7c5c2519
  kind: cards
  en: 'Oil as the lever. Congo is Africa''s third-largest oil exporter, shipping 236,000 to 252,000 barrels a day; oil earns more than 80% of export revenue (World Bank, as cited by Al Jazeera). Moody''s
    puts oil at about 90% of exports: the sources differ, so the share is approximate.'
  it: ''
- hash: 710e1c47
  kind: cards
  en: Several capitals at once. Al Jazeera names Paris, Beijing and Moscow among the alliances that have brought Nguesso investment; China is the main buyer of Congolese oil (36% in 2024, Coface); a pipeline
    between Pointe-Noire and Brazzaville, 90% Russian-owned, was approved in 2024 (Coface).
  it: ''
- hash: 1f2793f2
  kind: cards
  en: Debt. About 98% of GDP in May 2026, with arrears of about 13% of GDP; a parliamentary report gives 98.03% for end-May 2026 and external debt about 42% of the total (Moody's, as carried by allAfrica).
  it: ''
- hash: 5131d1ab
  kind: cards
  en: 'Oil dependence. Oil is more than 80% of export revenue (World Bank via Al Jazeera), so the budget, the debt service and the patronage all run on one commodity''s price and volume. Our reading: a
    fall in either is the first shock the state faces.'
  it: ''
- hash: 0d3fde05
  kind: cards
  en: The buyer that funds the state is also a creditor. China takes the largest share of Congolese oil exports and is a large lender (Coface), so the relation that pays the budget is also one whose claims
    the refinancing has to manage.
  it: ''
- hash: 2a91ac5c
  kind: cards
  en: 'Sassou Nguesso''s aim is to keep the system he has run for decades in power to 2031, and the oil income that pays for it is also the tightest constraint: more than 80% of export revenue against debt
    near 98% of GDP. He plays the great powers against each other for money and cover, Paris for aid and a long tie that also carries its own legal exposure over the family''s assets, Beijing as oil buyer
    and creditor, and Moscow for the 2024 pipeline, and none of them is a treaty patron. The test of the next years is whether the refinancing buys enough time for oil to hold its price, and the paradox
    is that the buyer who funds the state is also a creditor whose claims it must manage.'
  it: ''
- hash: 1f2dbc6c
  kind: cards
  en: 'Win the drug war with Washington behind it: cut cocaine output through fumigation, strikes on labs and boats, and extraditions. Abelardo de la Espriella, who won the 21 Jun 2026 runoff by about one
    point (49.66% to 48.70%), took office on 7 Aug 2026 and promised this line in his inaugural speech, ending Petro''s negotiating approach. US officials described the coca and cocaine output as at ''all-time
    records'' in the Sept 2025 decertification memo.'
  it: ''
- hash: d69c22a3
  kind: cards
  en: 'Recover the security and trade partnership with the United States after the 2025-26 rupture: US aid, the Shield of the Americas bloc, and an end to decertification. Under Petro, Washington decertified
    Colombia as a counternarcotics partner (Sept 2025) and sanctioned the president and his support network (OFAC, 24 Oct 2025); the new government has pledged to join the Shield of the Americas from its
    first day. Not yet achieved on the decertification: on 16 Sep 2026 Washington kept Colombia on the list for a second year, with a national-interest waiver (see constraint 5).'
  it: ''
- hash: ec85287e
  kind: cards
  en: Take back the Venezuelan border and the Catatumbo from the ELN. After the US strike on Caracas (3 Jan 2026) the group pulled back from Venezuela into Colombia; Petro's government activated a plan
    against attacks and warned the ELN that joint military action with Venezuela would follow if it did not leave Venezuelan territory.
  it: ''
- hash: ddc14623
  kind: cards
  en: 'End ''total peace'' and break the armed groups by force or surrender. On 25 Jun 2026, as president-elect, de la Espriella gave the armed groups an ultimatum to submit to the rule of law and ruled
    out negotiating with the Clan del Golfo; the Clan answered by letter on 29 Jun that submission was ''inevitable'' and the debate was over its terms. Since the inauguration he has ordered four air strikes:
    the first on the night of 10 Aug on ELN structures in Tibú and San Calixto (Catatumbo), the fourth on 11 Oct on the dissident Frente 33 (Calarcá), which he says he ordered directly. The Doha talks with
    the Clan and the temporary location zones in Córdoba and Chocó, Petro''s instruments, are the process being dismantled; the Tierralta zone planned for 25 Jun never opened and, by mid-September, the
    submission bill promised since July had not been filed.'
  it: ''
- hash: 235760c0
  kind: cards
  en: 'Re-anchor Colombian diplomacy in the US-led camp and against the left-wing bloc. Foreign minister Omar Bula Escobar (named on 8 Jul 2026) told the Atlantic Council that the priority is to rebuild
    the relations Colombia had with the United States and Israel. Behind that: a roadmap with Israel agreed in Washington on 15 Jul (relations restored from 7 Aug, ambassadors, visa waiver, the embassy
    moved to Jerusalem, coal exports resumed, withdrawal from South Africa''s ICJ case, which the ICJ page records on 22 Sep 2026); ties with Cuba and Nicaragua cut from 7 Aug (''tyrannies''); 14 embassies
    closed for budget reasons and the planned mission in Ramallah cancelled; relations with the Sahrawi Republic frozen on 10 Aug, to Morocco''s advantage.'
  it: ''
- hash: 390d05f9
  kind: cards
  en: 'Turn the economy outward through trade and investment diplomacy. The foreign ministry will concentrate on economic, trade and cyber diplomacy, working with the finance ministry to make Colombia a
    trade-oriented country. The base is narrow: in 2025 exports were USD 50.2 billion (+1.3%), the United States took 29.6% of them (followed by Panama, India, Brazil, the Netherlands, Ecuador and China),
    extractives were 38.2% of the total and falling (-17% to October), while coffee rose 65.7%.'
  it: ''
- hash: dc12e042
  kind: cards
  en: 'Security and intelligence with the United States: the armed forces and police, the Plan Colombia legacy, and a US security package after the swearing-in. The new government also proposes to let US
    forces operate from Colombian territory, to bomb cocaine labs in the jungle and to speed extraditions of armed-group leaders wanted in the US.'
  it: ''
- hash: 5c687c77
  kind: cards
  en: 'Energy as a lever: electricity exports to Ecuador (about 8% of its demand, more than USD 400 million in sales 2024-25) were suspended for six months during the 2026 tariff war and resumed on 5 Aug
    2026.'
  it: ''
- hash: 8d74d6bb
  kind: cards
  en: 'Air power and a new fighter fleet: the president personally orders the strikes (four since 7 Aug 2026), and the Gripen E/F contract of 14 Nov 2025 (17 jets, EUR 3.1 billion, programmed at COP 16.86
    trillion for 2026-2032) stands. The government opened a review of the offsets (solar power for off-grid areas, water in La Guajira, the San Juan de Dios hospital), reported as aiming to turn part of
    them into sensors, target identification and ground-attack capability for the air force, not to stop the purchase; a popular action to halt the contract was filed in September.'
  it: ''
- hash: bd6a76e5
  kind: cards
  en: 'Courts, extradition and surrender as a way to split the armed groups: the extradition to the United States of the Clan del Golfo chief ''Chiquito Malo'' was reactivated by Petro''s decree in July
    2026, a card the new government inherits, and on 17 Sep 2026 four Clan members of the Juan de Dios Úsuga structure surrendered in Briceño (Antioquia) and handed over weapons. The submission bill that
    would regulate this path had not been filed by mid-September.'
  it: ''
- hash: ba8e7936
  kind: cards
  en: 'Alignment as currency: the Shield of the Americas pledge (a US-led regional security coalition created in March 2026 after the Caracas operation, with Argentina, El Salvador, Chile and Ecuador among
    the members), a US delegation at the inauguration in Cali (the interim attorney general Todd Blanche), Rubio in Barranquilla on 8 Sep 2026 and a US-announced authorisation of joint military operations
    against drug traffickers, and a diplomatic offer to Israel (embassy in Jerusalem, visa waiver, coal exports). The joint-operations item rests on headlines seen in search results only.'
  it: ''
- hash: eb85c0a5
  kind: cards
  en: 'Cocaine output at record levels, as the US memo of Sept 2025 stated, so force alone does not shrink supply. Update of 16 Oct 2026: the coca area reached 261,386 hectares in 2024 (+3.5% on 253,000
    in 2023; the UNODC-government report, published in June 2026, dropped the cocaine output estimate), and the new government''s tools have been tested only in part: air strikes began on 10 Aug 2026 (four
    by 11 Oct, against armed groups), while fumigation and shoot-downs of suspect planes are not documented as running in any source found; the coca-spraying question is contested, Petro arguing that demand
    must be cut.'
  it: ''
- hash: 25be93e5
  kind: cards
  en: 'A border it does not hold: the ELN moves between Venezuela and Catatumbo, and cooperation with the government in Caracas is partial and conditional, so the armed groups on the frontier cannot be
    cleared from one side.'
  it: ''
- hash: d36a9a90
  kind: cards
  en: 'An export economy whose crude leaves through Ecuador: Colombian crude runs through Ecuador''s SOTE pipeline, and during the 2026 dispute Ecuador raised the transit fee from 3 to 30 dollars a barrel.'
  it: ''
- hash: a84e71d1
  kind: cards
  en: 'A razor-thin mandate and a predecessor who contests it: de la Espriella won the 21 Jun 2026 runoff with 49.66% (about 12.9 million votes) against 48.70% (about 12.7 million) for Iván Cepeda, Petro''s
    candidate; Petro did not recognise the result and promised to lead the opposition and ''civil disobedience''. The government has a minority coalition in Congress, so its hardest promises (leaving the
    UN or the OAS, among others) are unlikely to pass; that last point is an analyst''s reading seen in a search summary of a Colombia Reports piece that was not opened.'
  it: ''
- hash: 4ea15676
  kind: cards
  en: 'Washington''s patience is conditional and annual. On 16 Sep 2026 Trump kept Colombia on the list of countries that failed demonstrably to meet their anti-drug obligations, for a second year, with
    a national-interest waiver that avoids an automatic aid suspension; he blamed Petro''s ''incompetence and chaos'', praised de la Espriella, and said he would consider lifting the designation if eradication
    and the dismantling of ''narcoterrorist'' networks progress over the next year. The sanctions on Petro have not moved: on 7 Oct 2026 Petro, his son Nicolás, Verónica Alcocer and Armando Benedetti were
    still on the SDN list, after OFAC''s clean-up of 5 Oct removed dozens of Colombian persons and firms (reports differ: 73, or 125 in all) without including them.'
  it: ''
- hash: 1f7065dd
  kind: cards
  en: 'Force has civilian and legal costs. The first strike (10 Aug 2026, Tibú and San Calixto) wounded three farmers according to the Defensoría del Pueblo and fell during an earthquake emergency, drawing
    criticism; the strike of 11 Oct raised again the question of minors among the targets, and the army had no official tally the day after. The groups hit back: on 5 Sep a rebel attack on a military post
    in Catatumbo killed three soldiers.'
  it: ''
- hash: b56cbcb3
  kind: cards
  en: Petro's sovereignty stand against the boat strikes brought the decertification, the sanctions on the president and the loss of aid, leaving Bogotá less able to fight the cocaine economy that his own
    policy wanted to end by negotiation.
  it: ''
- hash: 7966c00c
  kind: cards
  en: 'Its tariff war with Ecuador, justified by Bogotá''s lack of drug-control reciprocity, was fought with the lever that hurt Colombia''s own exports: the electricity cut, plus 30% reciprocal tariffs
    on Ecuadorian goods, while Colombia''s crude still depends on Ecuador''s pipeline.'
  it: ''
- hash: fc61ed62
  kind: cards
  en: Washington rewards Caracas and keeps its loyal ally on probation. On 16 Sep 2026 the United States removed Venezuela from the decertification list, crediting steps by Delcy Rodríguez's interim government,
    while Colombia, whose president campaigned on Washington's line and put his Venezuela policy under the State Department, stayed on it. Yet Colombia cannot close the ELN's border sanctuary without the
    cooperation of the same authorities in Caracas, so the alignment that buys US favour leaves Bogotá more dependent on Washington's management of the Venezuelan file than on its own.
  it: ''
- hash: fef95bf7
  kind: cards
  en: The hard line is justified by Petro's record, but the latest figures cut both ways. In 2024 forced eradication fell 54% (from 20,325 to 9,403 hectares) and the coca area still rose only 3.5%, the
    smallest rise in four years, while cocaine seizures hit a record 889,201 kg (+19%). The joint UNODC-government report also dropped the cocaine output estimate for the first time, after a year-long technical
    dispute with Petro, so the yardstick by which Trump will judge the new line within a year is itself blurred.
  it: ''
- hash: 56cd9058
  kind: cards
  en: Bombing to free communities from the armed groups costs the support of the communities. The first strike wounded three farmers during an earthquake emergency; the groups answer in kind (three soldiers
    killed on 5 Sep) and the Clan del Golfo, instead of fleeing, bargains over the terms of its submission and invites the United States and the United Kingdom into the process. A state that has ruled out
    negotiation but not surrender hands the groups the terms of the bargain.
  it: ''
- hash: baa4ecbb
  kind: cards
  en: A trade-led foreign policy that closes posts where trade could grow. The ministry's stated priority is economic and trade diplomacy, yet the 14 closures for budget reasons take in Algeria, Azerbaijan,
    Ghana, Hungary, Malaysia and South Africa, besides Cuba and Nicaragua, when the United States already takes 29.6% of exports and extractives, 38.2% of them, are falling. The diversification those posts
    could serve is the one the objective needs (our reading of the two sets of figures; the saving itself is not quantified in any source found).
  it: ''
- hash: 3440c7c9
  kind: cards
  en: 'Colombia changed its partner in 2026 without changing its problem: the cocaine economy and the armed groups on the Venezuelan border are the same, and a hard-line Trump ally sworn in on 7 Aug 2026
    has bet that Washington''s force can do what negotiation did not. The reset reverses the Petro-era rupture (decertification, sanctions on the president, the tariff war with Ecuador), and the energy
    lever is back in use, while the Belt and Road pact of May 2025 is a non-binding letter that the new government has not yet addressed in any source found. The paradox is that the rupture cost Colombia
    its aid and its standing, and the reset buys security cooperation at a price that the policy itself may push across the borders, into Venezuela and Ecuador (an inference, not yet sourced).


    Added on 16 Oct 2026, after ten weeks of the new government. The reset has two faces. At home, it replaces negotiation with force (four air strikes since 7 Aug, an ultimatum to the Clan del Golfo, extradition
    and surrender as the exits) and bets that Washington''s backing will outlast a 49.66% mandate and a minority in Congress. Abroad, it prices alignment in ideological currency: Israel restored and its
    embassy moved to Jerusalem, Cuba and Nicaragua cut, the Sahrawi Republic frozen, South Africa''s ICJ case abandoned, the Palestine vote abstained, 14 embassies closed. The payoff so far is thin and
    probationary: a waiver instead of recertification on 16 Sep, Petro still on the SDN list on 7 Oct, and a Venezuela that Washington took off the list while Colombia stayed on it. The test comes within
    a year, when the coca hectares of 2025 and 2026 will be counted against a promise that supply can be cut by force, and the 2024 data (a 54% fall in forced eradication with the smallest rise in coca
    area in four years) do not yet say it can. What the new government''s line on China, Russia and the Belt and Road letter of May 2025 will be remains unsourced; so does the status of the ELN''s Venezuelan
    sanctuary after the change of government.'
  it: ''
- hash: 284e6f67
  kind: cards
  en: Keep Azali Assoumani's personal rule intact after the disputed January 2024 vote. The electoral commission first announced 63% for him (16 January 2024); the Supreme Court confirmed 57.2% (24 January);
    the opposition's annulment demand and the protests were answered with a curfew from 18 January and at least one death.
  it: ''
- hash: abf449cd
  kind: cards
  en: Keep the claim to Mayotte on the record. Comoros put the claim before the UN General Assembly in its 2012 general-debate statement, and France's 1976 Security Council veto of a draft recognising Comorian
    sovereignty (11 votes in favour) has blocked the one UN route to it ever since.
  it: ''
- hash: 901c90d3
  kind: cards
  en: 'The UN General Assembly podium: Comoros restates the Mayotte claim in the general debate (2012 statement), and the General Assembly resolutions of the 1970s that rejected continued French rule are
    the record it rests on, read through a pointer (tier 4) that needs corroboration.'
  it: ''
- hash: ff3fbab7
  kind: cards
  en: 'Chinese assistance and diplomacy: a Chinese-assisted malaria programme on Moheli (New York Times, 2007), a 2008 military-cooperation pledge after a Comorian army delegation met China''s defence minister
    (Xinhua), and Beijing''s congratulations on the January 2024 re-election (Xinhua).'
  it: ''
- hash: 0ecbd012
  kind: cards
  en: No resident US embassy since 2006. The embassy in Moroni (opened 1985) closed on 30 September 1993, and US responsibilities for Comoros moved to Antananarivo on 6 March 2006, so Washington's presence
    is run from Madagascar.
  it: ''
- hash: 12154efa
  kind: cards
  en: Post-electoral fragility. The January 2024 protests left at least one dead and at least 25 injured, a curfew ran from 18 January, and internet access was disrupted (Reuters and AP reports, as cited
    by Wikipedia; not opened). A regime that has to hold its own result has less room in the external arena where the Mayotte claim is argued.
  it: ''
- hash: 4172fb03
  kind: cards
  en: Beijing congratulated Azali on his re-election on 29 January 2024, in the same month the US embassy asked the authorities for full transparency and clarification of the results. The claim to Mayotte
    gains its audience in New York, where France's 1976 veto has blocked it, and loses credibility on the ballot that the government had to defend with a curfew.
  it: ''
- hash: 0b8bed80
  kind: cards
  en: Comoros is a small state whose founding claim to Mayotte is its main diplomatic asset, pursued at the UN because a 1976 French veto closed the Security Council to it. Under Azali the regime's international
    standing rests on a patron that does not ask about elections (Beijing congratulated him in January 2024, while the US embassy asked for clarification) and on a presidency that the 2024 vote and the
    curfew left more personal, not less. The succession to his son, the Gulf and Indian Ocean ties and the French flows the brief lists are not covered by the sources read in this pass, so they stay open.
  it: ''
- hash: f0ce34bb
  kind: cards
  en: Keep the economy growing under the new PAICV government. After its 17 May 2026 win, the party promised a 'novo Cabo Verde' of growth with all islands taking part in governance, not only Praia.
  it: ''
- hash: c78271f3
  kind: cards
  en: Bring Portuguese investment into renewable energy and a technology park in Praia. Prime Minister Montenegro, in Cabo Verde in April 2024, urged Portuguese investors to use the diversification strategy,
    and the country is a founding partner of the AIR Centre.
  it: ''
- hash: be8e5d67
  kind: cards
  en: 'Portugal as the channel into Europe''s funds and investors: the AIR Centre (founded 2017, Cabo Verde a founding partner) and the Portuguese investment courted in 2024. The Atlantic-island diplomacy
    runs mainly through Lisbon, and the sources read show no other channel in 2025-2026.'
  it: ''
- hash: ef42767d
  kind: cards
  en: A bare majority. The PAICV won 37 of the 72 National Assembly seats (48.04% of the vote) and the MpD kept 33 (44.75%). Thirty-seven is exactly the majority line, so the new government has no margin
    for a lost vote in the house; turnout was 46.5%.
  it: ''
- hash: e88a8c70
  kind: cards
  en: Opposition on the other side of a near-even split. The MpD, which had sought a third term for Ulisses Correia e Silva, keeps 33 seats and nearly 45% of the vote, so each foreign or fiscal decision
    will be argued in the house at close quarters.
  it: ''
- hash: 2c54ec19
  kind: cards
  en: 'Courting Portuguese investors to carry the diversification plan ties the economy to the former metropole''s capital, while the new government promises a ''new Cape Verde'' with a role for all islands.
    Our reading (confidence C): the Lisbon channel is what the sources show, and the promise is about the archipelago''s own economy, so the two may pull apart.'
  it: ''
- hash: d3e25f88
  kind: cards
  en: 'Cape Verde''s 17 May 2026 election ended the MpD''s bid for a third term: the PAICV won 37 of 72 seats, and Francisco Carvalho was named prime minister-designate, with 19 June given as the swearing-in
    date by one search summary that no second source confirmed. The state''s external ties that the sources read here run through Lisbon (the AIR Centre and Portuguese investment), with China and the United
    States present but not sourced in this pass. The EU, ECOWAS, Brazil and the CPLP, the Chinese port and debt, the MCC compacts and the remittance and tourism figures are open gaps for a second pass.'
  it: ''
- hash: ad2567cd
  kind: cards
  en: 'Bring the murder rate down. Laura Fernández, sworn in on 8 May 2026 as the successor of Rodrigo Chaves, ran on crime and copies the Bukele model: a mega-prison, states of emergency in gang-held areas
    and more cargo scanners at ports and airports. Homicides rose by over 50% under Chaves, who took office in 2022.'
  it: ''
- hash: d64dfa7c
  kind: cards
  en: Keep China ties warm while the security track stays with Washington. Beijing congratulated her on the result and calls the relation one that has 'developed smoothly'.
  it: ''
- hash: 9700e3f2
  kind: cards
  en: 'Security law and policy at home: a mega-prison, emergency declarations in gang-controlled areas, and cargo scanners at ports and airports, the Bukele toolkit, announced in the campaign. Not yet confirmed
    by a government source.'
  it: ''
- hash: cd1ead27
  kind: cards
  en: 'Diplomatic congratulations as a channel: Secretary of State Marco Rubio praised her ''tough stance on drug trafficking'' and China''s president congratulated her, so both capitals were engaged on
    the day of the result.'
  it: ''
- hash: 1c42a13a
  kind: cards
  en: 'The homicide problem is the one the government must answer, and it grew under the government she continues: a murder rate up by over 50% since 2022 makes security the test of the new term.'
  it: ''
- hash: 3f83e58c
  kind: cards
  en: The campaign promises to end the rise in homicides with the same agenda that Chaves ran on in 2022, and the murder rate rose on his watch. The security line she inherits is the one that has not yet
    worked, and its praise in Washington rests on the same drug-trafficking issue.
  it: ''
- hash: 3e567693
  kind: cards
  en: 'Costa Rica under Laura Fernández is a security government first: her campaign centred on crime after a murder rate up by over 50% under her predecessor Rodrigo Chaves, and she promises the Bukele
    method to reverse it. Washington praises the tough line on drug trafficking and Beijing congratulates her in the smooth language it uses for a relation it wants to keep, so both partners are judged
    on the same security test. The paradox is that the agenda she inherits is the one that did not stop the murders, so the closer the tie to Washington''s anti-drug agenda, the less it touches the homicide
    rate that justifies it.'
  it: ''
- hash: 9b018e9e
  kind: cards
  en: Keep the one-party system, the presidency and every official's post off any deal with Washington. On 20 March 2026 a deputy foreign minister said these were not negotiable, after reports that the
    administration wanted Díaz-Canel out with two years of his term left.
  it: ''
- hash: 45e9acc3
  kind: cards
  en: Get fuel through the blockade. The energy minister said on 13 May 2026 that Cuba had run out of diesel and fuel oil and was still negotiating fuel imports, which rising oil prices linked to the US-Israeli
    war with Iran complicate.
  it: ''
- hash: 29588e19
  kind: cards
  en: 'Keep the outside lifelines open, whichever partner can still send them: a Russian crude tanker, Vietnamese rice, Spanish hotel operators, and a Mexican offer, made in June 2026, to restart shipments
    through commercial firms with no timeline.'
  it: ''
- hash: 4b29133f
  kind: cards
  en: Channels that stay open under pressure. Havana confirmed high-level talks with Washington on 13 March 2026, while holding its political line. Vatican-linked mediation preceded the release of 51 prisoners
    in March 2026.
  it: ''
- hash: 636eed31
  kind: cards
  en: Tourism, run largely by foreign hotel chains. Spanish chains run much of the sector; Meliá, with 34 hotels, announced in July 2026 that it would cease operations in Cuba amid US sanctions and the
    fuel squeeze, after Iberostar had stopped managing hotels.
  it: ''
- hash: '49735234'
  kind: cards
  en: No fuel reserves. On 13 May 2026 the energy minister said Cuba had 'no reserves' of fuel; many Havana neighbourhoods were without power for 20 to 22 hours a day, and the grid runs on domestic crude,
    gas and renewables.
  it: ''
- hash: 94e2ae76
  kind: cards
  en: The US fuel blockade. The executive order of 29 January 2026 declared Cuba an 'unusual and extraordinary threat' and authorised tariffs on any country selling it oil. UN human rights experts called
    the measure unlawful in February 2026, and by May the blockade had run for four months.
  it: ''
- hash: afe2dd4e
  kind: cards
  en: Out-migration. With US doors largely closed to Cubans, they travel to Brazil, often through Guyana, which admits them without a visa. Brazilian police intercepted 108 Cubans in one day in June 2026.
  it: ''
- hash: d51e0ee0
  kind: cards
  en: The fuel tariff is meant to starve Havana's grid, but it works through Havana's suppliers. Mexico's shipments stopped in January 2026 under US pressure, and Sheinbaum warned in February that tariffs
    could trigger a humanitarian crisis. The harder Havana refuses Washington, the fewer ships reach its grid.
  it: ''
- hash: b1690267
  kind: cards
  en: Tourism is the hard-currency earner, yet it runs through foreign chains that US sanctions can drive out. The Meliá exit shrinks the sector Havana most needs in order to pay for fuel.
  it: ''
- hash: 4ca3912b
  kind: cards
  en: 'Cuba''s strategy is to outlast the fuel blockade without changing its political order, and it keeps every channel open, from a Russian tanker and Vietnamese rice to a Mexican offer and Vatican mediation,
    while refusing to negotiate the system itself. Its means are thin: tourism run by foreign chains and a few diplomatic channels, against a US that has turned the fuel supply itself into the lever. The
    paradox is structural: the pressure meant to make Havana bend works through its suppliers, so each partner who hesitates leaves the grid darker and pushes more Cubans out.'
  it: ''
- hash: 19257b8b
  kind: cards
  en: 'End the division of the island on the UN formula - a bizonal, bicommunal federation with political equality - and with it the Turkish occupation of the north (outside the Republic''s control though
    inside its claimed sovereignty): withdrawal of Turkish troops, and an end to the Treaty of Guarantee system. The track is open again (Guterres on the island 27-29 Jul 2026, repeated leaders'' meetings
    with Erhurman, a ''convergence document'' said to be in final form) but Nicosia''s own line is to resume from where Crans-Montana stopped in 2017.'
  it: ''
- hash: 9aedad58
  kind: cards
  en: 'Buy physical security the Republic cannot supply: a Greek air-and-naval shield under the joint defence doctrine, French forces under a strategic partnership and a Status of Forces Agreement, access
    to US arms (annual embargo waiver), Israeli air defence, and a push for NATO''s Partnership for Peace. The Iranian-made drone that hit RAF Akrotiri on 2 Mar 2026 turned this from a long-term wish into
    the daily agenda.'
  it: ''
- hash: 698cc936
  kind: cards
  en: 'Turn offshore gas into a place at Europe''s energy table: Aphrodite (Chevron, NewMed, Shell) and Cronos (Eni, TotalEnergies) through Egyptian pipelines and liquefaction, a final investment decision
    on Block 12 in 2027, first Cronos gas to Egypt around 2028, and the Great Sea Interconnector power cable to Greece as the physical tie to the EU grid.'
  it: ''
- hash: 7fb46e21
  kind: cards
  en: 'Use EU membership as the lever that Cyprus lacks bilaterally: the 2026 Council presidency (1 Jan - 30 Jun, motto ''An Autonomous Union - Open to the World''), a veto over Turkey''s access to SAFE
    defence funds and to the customs-union upgrade, and an EU role in the Cyprus talks. Cyprus''s price for relaxing the veto is a settlement track and PfP.'
  it: ''
- hash: 64dd3c9c
  kind: cards
  en: 'Keep a high-income services economy (tourism, shipping, finance, ICT; IMF 2026 growth 3%, public debt falling toward 51% of GDP from 113.6% in 2020) while living down the Russian-money reputation:
    account closures, shell-company strike-offs and the end of the golden passports.'
  it: ''
- hash: f58efd64
  kind: cards
  en: 'Be the Western door to the eastern Mediterranean: a bridge to Egypt, Lebanon, Syria, Israel and the Gulf (the 24 Apr 2026 Nicosia summit with Middle East partners), the Amalthea maritime corridor
    and the Estia evacuation plan, a seat in every room while taking no part in the Iran war.'
  it: ''
- hash: 0c2a8d20
  kind: cards
  en: The UN good-offices track, run through direct leaders' meetings with the Turkish Cypriot leader Tufan Erhurman (elected 19 Oct 2025 with 62.8% over the Ankara-backed Tatar), a personal envoy (Maria
    Angela Holguin) and a hoped-for 5+1 conference with the guarantors; 19 'new ideas' presented to Guterres in New York in September 2026.
  it: ''
- hash: e1b006b9
  kind: cards
  en: 'The EU Council presidency of January-June 2026 as a stage: three summits, 19 informal and 52 formal ministerial meetings, the Nicosia informal European Council with Middle East partners (24 Apr),
    a Kyiv visit (4 Dec 2025) with 19 proposals for Ukraine, and enlargement as a top priority.'
  it: ''
- hash: fa361825
  kind: cards
  en: 'Borrowed shields: Greek F-16s and a frigate left in Cyprus indefinitely after 2 Mar 2026, a French frigate and anti-drone systems (March 2026) and a SOFA with France moving to signature, Israeli
    weapons systems (three types) and trilateral drills with Greece and Israel, US arms access restored by an annual waiver. The National Guard itself is small and the 2027 defence budget is cut.'
  it: ''
- hash: 6a86bbb9
  kind: cards
  en: 'Energy diplomacy: a framework agreement with Egypt (30 Mar 2026) covering Cronos and Aphrodite, with Cyprus agreeing in February to pay the full USD 2bn pipeline cost in exchange for using Egyptian
    liquefaction; an unsigned unitisation deal with Israel over the Aphrodite-Yishai overlap; a maritime boundary treaty with Lebanon (26 Nov 2025).'
  it: ''
- hash: cb1f6378
  kind: cards
  en: 'The occupier frame: the president''s line that ''no country that occupies territories or threatens the security of member states can benefit from European financial instruments in the field of defence''
    (SAFE), with Turkish media and Fidan answering that Nicosia abuses the veto; and a Gaza line of humanitarian access (Amalthea) combined with full support for Trump''s plan.'
  it: ''
- hash: fbb7e647
  kind: cards
  en: 'The north is not Nicosia''s to give or to take: Turkey keeps troops there, backs a two-state line (Erhurman himself says no Cyprus decision is taken without consulting Ankara), holds a de facto veto
    on Cyprus''s NATO route, and Devlet Bahceli called on the northern parliament to join Turkey after Erhurman''s win. The Republic can veto Turkey in the EU but cannot move it on the island.'
  it: ''
- hash: d91c3b75
  kind: cards
  en: 'Two British sovereign base areas (Akrotiri, Dhekelia) sit on the island under the 1960 Treaty of Establishment and are not Cyprus''s to command: London says their status ''is not in question'', and
    Washington was allowed to use them in the Iran war. Nicosia can ask for transparency and a joint technical committee, not for the territory back (Reuters saw no sign it will ask for closure).'
  it: ''
- hash: 07c74168
  kind: cards
  en: 'Size and money: an army that cannot deter Turkey, air defence supplied by Greece and France, a one-year US arms waiver that the president says makes strategy impossible, and a 2027 defence budget
    with a ''huge decrease''.'
  it: ''
- hash: 946dd4ac
  kind: cards
  en: 'The gas has no road of its own: Aphrodite and Cronos depend on Egyptian pipelines and liquefaction, Aphrodite on a still-unsigned deal with Israel on the Yishai overlap (up to 10% of the field, over
    EUR 1bn), and the Great Sea Interconnector has slipped (Nexans guidance assumes no work in 2026; the EIB has reviewed its finances since April).'
  it: ''
- hash: 86bb207f
  kind: cards
  en: 'Reputation and law: ICIJ''s ''Cyprus Confidential'' (71 post-2022 sanctioned Russians with funds handled in Cyprus), a January 2026 leaked video suspected of Kremlin origin that shadowed the presidency,
    and EU sanctions enforcement that Cyprus must be seen to apply.'
  it: ''
- hash: 5516a9df
  kind: cards
  en: 'Domestic opinion pulls both ways: AKEL attacks the deepening ties with Israel and demonstrators chant ''British bases out of here'' after the Akrotiri strike, while a Gaza-solidarity public clashes
    with a government that backs Trump''s plan.'
  it: ''
- hash: 67ee1c2a
  kind: cards
  en: The veto that protects Cyprus is the reason Turkey has no stake in a settlement. By keeping Turkey out of SAFE and the customs-union upgrade Nicosia holds the one card that costs Ankara something;
    but it also lets Fidan present Cyprus as the obstacle to Turkey-EU normalisation and removes the EU reward that could make Ankara pay for a deal. Christodoulides' December 2025 trade-off (PfP and the
    EU thaw for a resumed settlement) is an admission that the veto alone does not work.
  it: ''
- hash: 1bd062af
  kind: cards
  en: Security bought from outside brings the war inside. Hosting British (and in the Iran war, US-used) bases and tying itself to Israel and the Western air shield is what makes Cyprus safe from Turkey
    on paper, and what drew Iranian-made drones onto the island on 1-4 Mar 2026; the government says it takes no part in any operation and was not told of the threat.
  it: ''
- hash: '89673091'
  kind: cards
  en: The more it arms and aligns, the less likely the settlement it says it wants. The SOFA with France, Israeli weapons and the Greece-Israel-Cyprus drills give Ankara its stock argument that the Greek
    Cypriot side is militarising the island, while Erhurman's election is the first real opening since 2017 and depends on Ankara letting him talk.
  it: ''
- hash: 3610c2ac
  kind: cards
  en: An 'Autonomous Union' presidency whose own security is bilateral and non-European. Nicosia chaired the push for European defence autonomy while its air defence came from Greece and France, its arms
    access from a US waiver renewed every year, its air-defence upgrade from Israel and its NATO door held shut by Turkey - the EU Article 42.7 clause it wants to activate has not yet protected it.
  it: ''
- hash: 01fb1805
  kind: cards
  en: The energy bridge makes Cyprus a client of its partners. To get the gas out Nicosia accepted Egypt's terms (the full USD 2bn pipeline bill in return for Egyptian liquefaction, a Brent-linked price,
    buyers dominated by Egypt) and has to settle the Aphrodite overlap with Israel, so the resource that was meant to give leverage over Turkey and Europe has to be negotiated with Cairo and Jerusalem first.
  it: ''
- hash: 7af62436
  kind: cards
  en: Cleaning house on Russian money costs the model it protects. Closing accounts (reported at 82% of Russian clients between 2014 and 2022) and stripping golden passports cut sanctions risk and move
    Cyprus into the Western column, but the services economy that grew on that capital now leans on UK and Israeli visitors and on EU funds, both more exposed to a Middle East war.
  it: ''
- hash: 51bc7ef7
  kind: cards
  en: 'Cyprus runs the grand strategy of a small member state of the EU that is also half

    an occupied island: it cannot change facts on the ground, so it multiplies the

    number of actors whose interests are tied to the island and hopes that one of them

    will, in the end, move Turkey. The EU is the main multiplier (membership, the

    presidency, the veto on SAFE and the customs union), the Greek-French-Israeli-US

    ring is the second (air defence, arms, drills), gas is the third (Egypt, Israel,

    Greece, Chevron, Eni). Each of them works, and each of them has a Luttwak cost:

    the veto gives Ankara a grievance, the ring gives it a pretext, the gas makes

    Cyprus a client of Cairo and Jerusalem, and the bases that tie Britain and the

    United States to the island are the ones that drew Iranian-made drones onto it on

    1-4 March 2026. The year''s two facts pull in opposite directions: the election of

    Erhurman (19 Oct 2025, 62.8%) and a UN track that is moving, against a Turkey that

    is more entrenched in the EU''s defence and trade files and a Gaza-and-Iran war

    that has made Cyprus a front-line state. Two signals that are not rows: Guterres

    leaves office on 31 Dec 2026, so Nicosia has a deadline it did not set, and the

    president''s own praise for Trump (''you know where you stand'') comes with a defence

    budget cut at home. The north is not an actor in the atlas: it is recorded through

    Turkey''s stance, rows and troop presence, not as a territory with its own grade.'
  it: ''
