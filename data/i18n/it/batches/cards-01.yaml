- hash: 6c41c858
  kind: cards
  en: 'China in October 2026 is the case Luttwak wrote the book about, read from the inside.

    At the technical level the instruments are the best in the world and growing: the

    largest navy by hulls, a third carrier, a coast guard with a licence to fire, a

    monopoly on the magnets everyone''s motors need, a trade surplus of USD 1.2 trillion.

    At the level of theatre strategy the record is mixed by design: the Taiwan Strait is

    rehearsed twice a year and never crossed, the shoals are taken by water cannon and

    nature reserves rather than by landings, the Senkakus are visited 357 days a year.

    At the level of grand strategy the paradox Luttwak predicted is visible in every

    file of this atlas: Japan calls China its greatest challenge, fourteen states

    reaffirm an award Beijing calls null, the EU keeps ''systemic rival'', and the one

    rival that matters, the United States, had to be bought into three truces with the

    rare-earth lever that each truce spends. What is new in 2025-26 is that Beijing

    appears to have read the logic: the thaws with India, Australia, South Korea,

    Britain, Vietnam and even Brussels are a great state lowering its weight on the

    scale, and the handling of Trump - hospitality, soybeans, a Board of Trade, ''healthy

    competition kept within bounds'' - is relational manoeuvre of a high order. What is

    old is the reflex: one sentence from Takaichi brought back the whole arsenal of

    coercion against the neighbour whose rearmament costs China most, and the

    Philippine shoals got batons in the same summer. The constraints are heavier than

    the rhetoric admits - deflation, 7.9 million births, a purged high command, a strait

    it does not control and a chip embargo it cannot answer in kind - and they are why

    the squeeze stays short of war. Three signals that are not rows: Beijing has let the

    Power of Siberia 2 price wait for over a year, the measure of who is senior; it

    asked Tehran, not Washington, to reopen Hormuz; and it made its best offer to Trump

    on Taiwan not with a threat but with a request. The question the card leaves open

    is Luttwak''s own: whether a state can keep learning the logic of strategy faster

    than its own weight teaches the others.


    19 November 2026: in Shenzhen, on the sidelines of the APEC summit, Xi, Trump and Putin

    held their first trilateral meeting (90 minutes, after two one-to-one meetings) and

    issued a joint declaration of peace. The text says nuclear war cannot be won and must

    never be fought, that the three will increase petroleum production and supply, that they

    are committed to reform the UN, and it warns that the International Criminal Court must

    not abuse its jurisdiction. Xi, per CCTV, called the meeting positive, constructive and

    highly productive, and said positive interaction among major powers is a mandatory

    requirement. The caveat is the BBC''s own: high on spectacle, short on substance. Source:

    BBC News, 19 Nov 2026.'
  it: ''
- hash: ea9fa28a
  kind: cards
  en: 'Estonia runs the grand strategy of a front-line state that has decided to spend its way to being un-attackable rather than hope for a guarantor: 5.43% of GDP, a fortified border, a deep-strike arsenal
    and a dense net of partners (UK, Finland, Poland, Germany, Korea) around an American umbrella it publicly trusts and privately hedges. The Luttwak pattern is that each hardening has a cost that returns
    on the same front: the forward posture raises exposure, enforcement at sea shows the limits of the law, grid independence concentrates risk in cables, and the defence of the nation-state against Russian
    leverage on the minority hands Moscow a grievance narrative. Russia is graded a rival, not an adversary: Estonia seeks deterrence, a Russian defeat in Ukraine and a Russia that pays, not the end of
    the Russian state, and keeps an embassy and a border regime open. The Kremlin''s line that Russia ''poses no threat'' to Estonia and the Estonian intelligence judgement that Moscow has no intention
    of attacking in the coming year are signals, not rows: both sides are reading the other''s limits. The open question for 2027 is the American presence after the end-2026 rotation and an election that
    a weak coalition may lose. After the attempted arson at Threod Systems (15 Nov 2026), Tallinn announced the closure of its three road border crossings with Russia from 1 December 2026: a defensive measure
    that cuts Russia''s means of sabotage and sanctions evasion, not a new objective. Russia called it ''Russophobia'' (TASS, via Al Jazeera, 15 Nov 2026).'
  it: ''
- hash: '72206957'
  kind: cards
  en: 'Russia in 2026 runs a grand strategy with one fixed aim - a Ukraine that is not a

    state in the Western sense - and a shrinking set of means to reach it. At the

    technical and tactical levels the war is being won slowly: Kursk retaken, 0.72% of

    Ukraine gained in 2025, Oreshnik over Kyiv. At the level of theatre strategy it has

    stalled: the front moves by villages, the price is a budget 40% military, a key rate that peaked at 21% (14% now) and civilian investment in collapse, and the manpower comes from Pyongyang. At

    the level of grand strategy the picture inverts, as Luttwak says it must: the move

    meant to push NATO back brought Finland and Sweden in and Germany to rearm; the move

    meant to free Russia from the West handed its trade, its currency and its machine

    tools to China; the levers that hold Belarus pushed Armenia and Azerbaijan away. The

    one genuine success since 2025 is diplomatic - the bilateral channel to Washington,

    Riyadh to Anchorage to the 28-point plan - and it rests on a paradox too: the demand

    for the Donbas is what keeps Trump talking and what keeps any talk from ending. Three

    signals that are not rows: Ushakov quietly dropped the ''spirit of Anchorage'' slogan

    in mid-2026; the New Delhi BRICS declaration dropped Ukraine altogether; and Vucic

    stayed away from the 2026 parade while Fico came and did not watch it. The culminating

    point of this attrition war is visible from Moscow as from Kyiv; what Moscow has not

    yet decided is whether the thaw with Washington is a way to stop before it or a way

    to pass it.


    19 November 2026: Putin takes part in the first trilateral with Xi and Trump, in Shenzhen on the sidelines of APEC, the first international gathering with Western leaders that he has attended since
    the invasion of Ukraine (Canada, Japan and Australia were present, according to the BBC). Russian papers call it a diplomatic victory. The joint declaration says nuclear war cannot be won and must never
    be fought. At his press conference Putin called it an important chapter in the history of diplomacy, said Ukraine and Europe are not yet ready to make compromises, invited EU representatives to Moscow,
    and vowed a far more painful retaliation for the Ukrainian attacks on the Crimean bridge. On Yalta he said nobody divided up the world there and that the realities on the ground will have to be accepted.
    Source: BBC News, 19 Nov 2026.'
  it: ''
- hash: 0dd9bb5b
  kind: cards
  en: 'The United States in October 2026 runs the most explicit grand strategy it has published since the Cold War, and the one most at odds with its own means. The ends are written down: a hemisphere held
    under a Trump Corollary, trade rebalanced by tariff, China kept a rival ''within bounds'', Europe''s defence handed to Europeans, the Middle East managed without forever wars, migration ended. At the
    technical level the instruments work - the border is quieter than in fifty years, allies have pledged trillions and 5% of GDP, Maduro sits in a Brooklyn cell, Khamenei is dead. At the level of grand
    strategy the picture inverts, as Luttwak says it must when a strategy succeeds: coercion used on everyone reached its culminating point in a year (Davos, Spain, the Supreme Court), the allies who paid
    became hedgers, the war of choice against Iran consumed the year that was reserved for the hemisphere and China, and the hemisphere itself produced a Venezuela that Washington now administers. Three
    signals that are not rows: the NDS never names Taiwan; the USMCA was left unrenewed on 1 July without any plan for what follows; and the same government that sanctioned Rosneft is buying Russian diesel.
    Washington''s stances read accordingly: two adversaries (Iran and Hamas), fifteen rivals of which the two it talks to more than to its allies are China and Russia, and a ring of treaty allies graded
    reluctant not because they resist the alliance but because Washington does - the first great power in the atlas whose friction with its allies is mostly its own.

    After the midterms of 3 November 2026 the home front of the strategy changes sign. Democrats win the Senate (54-44 with two races open on 4 Nov, seven seats flipped) and the House (228 called, 260 or
    more likely), and Trump, at 38% approval in exit polls, says the Iran war was ''a part of it'', that he will work with Democrats and veto what they pass. Neither side has two-thirds, so the likely effect
    is not new law but the end of unchecked executive foreign policy: subpoenas (Wyden: ''Subpoenas''; Garcia, set to chair House Oversight, told Republicans to ''lawyer up'') and the power of the purse,
    whose foreign targets are still unnamed, and a Congress that can no longer be counted on to say nothing. Luttwak''s point applies: an administration that has coerced everyone abroad now meets its own
    culminating point at home. What the sources do not yet say, and the card therefore does not claim, is how the new majorities will vote on Ukraine aid, Taiwan, NATO or tariffs; those stances are unchanged
    until a vote or a statement shows it.

    After the week of 18-19 November 2026: the new Congress has begun to name its foreign-policy priorities but has voted on nothing yet. Democratic aides name Ukraine aid as a priority, and Reuters judges
    that a package would probably need a two-thirds majority to override a veto (cited in Al Jazeera, 4 Nov 2026); CFR notes that tariffs under Section 122 last 150 days unless Congress extends them, and
    that the President keeps most tariff control. No 2026 source found on Taiwan policy from the new majorities. At the APEC summit in Shenzhen the White House confirmed a first three-way meeting of Trump,
    Xi and Putin on 19 November, framed as an opening on arms control; Beijing rejected joining trilateral nuclear talks at this stage (Al Jazeera, 14 Nov 2026). No source found yet reports what was agreed
    on tariffs, rare earths, Taiwan or fentanyl, nor any signed US-Venezuela military agreement on 18 November: the talks reported by the New York Times (3 Nov 2026) are on a status of forces agreement,
    not yet signed. Stances unchanged; a statement or readout would be needed to move them.

    19 November 2026: the first trilateral of Trump, Xi and Putin, in Shenzhen, produced a joint declaration of peace (nuclear war cannot be won, petroleum, UN reform, a warning to the ICC). Trump had met
    Putin one-to-one beforehand, their first meeting since August 2025, and called the trip highly consequential. Republican Senator John Curtis was encouraged by the nuclear commitment but said Putin and
    Xi are not our friends. The BBC judges the summit high on spectacle and short on substance. Source: BBC News, 19 Nov 2026.'
  it: ''
