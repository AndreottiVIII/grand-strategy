items:
- hash: 8ad5a8b7
  it: |
    La fuoriuscita dalla categoria LDC è un successo che elimina il privilegio su cui si reggeva. L'uscita, effettiva il 24 nov 2026, certifica un'economia che le preferenze per l'abbigliamento hanno costruito; nello stesso momento la finestra di esenzione doganale UE si riduce fino al 2029, e il regime sostitutivo GSP+ chiede valore aggiunto, rispetto del lavoro e dei diritti umani, requisiti che il percorso di riforme del periodo transitorio non ha ancora dimostrato. Dhaka ha chiesto un rinvio di tre anni, ma la data di uscita resta confermata.
- hash: f34ade31
  it: |
    Il dialogo con l'Arakan Army per rimandare a casa i rohingya legittima la forza che oggi controlla il confine e che è accusata di reclutamento forzato e di discriminazione contro gli stessi rohingya. Nel 2025 Dhaka ha respinto un 'corridoio umanitario' dell'UN per non diventare parte della guerra nel Rakhine; nel 2026 si è poi rivolta al dialogo sia con Naypyidaw sia con l'Arakan Army, e la giunta risponde che il rientro richiede sicurezza nel Rakhine e la fine dei procedimenti internazionali.
- hash: 4222f9c0
  it: |
    Indipendenza energetica che passa per i cavi e i prestiti di altri. Rooppur (USD 12.65bn, prestito russo, allacciamento alla rete previsto per fine 2026 contro le previsioni precedenti del 2027, rimborso rinviato al 2028-29) e l'idroelettrico nepalese importato (40 MW, attraverso una linea indiana, con un aumento di 20 MW bloccato dal regolatore della rete indiana) dovrebbero ridurre la dipendenza dal gas e dall'India, ma entrambi dipendono dal credito di Mosca e dalla trasmissione di Delhi.
- hash: 7fd603ee
  it: |
    Il Bangladesh è uno Stato tra due giganti che, per quindici anni, ha esportato la propria dipendenza da uno di essi e dal 2024 sta mettendo alla prova l'altro. Sotto Hasina, sicurezza, confine, acque e rete elettrica erano stati affidati all'India in cambio della protezione del regime - 'un assegno in bianco', secondo un accademico di Dhaka - e il conto è arrivato con la rivolta di luglio-agosto 2024, quando l'India che aveva garantito il governo è diventata il luogo in cui questo è fuggito. Ciò che Dhaka ha fatto da allora è, a livello di grand strategy, un manuale luttwakiano: trasforma il suo unico punto di leva, la persona di Hasina, in una rivendicazione diplomatica, e amplia il ventaglio delle proprie opzioni (Pechino per i fondi e i combattenti, Islamabad per un segnale, Ankara e Tokyo per l'industria, Washington per il mercato) in modo che l'India non fissi più il prezzo. Ma ogni ampliamento si paga nella valuta che controlla l'India - il Gange in dicembre, il Teesta, il gasolio, il confine di 4.096 km, i valichi terrestri - e l'India ha mostrato che è disposta a usarla (aprile-giugno 2025). Il governo BNP di febbraio 2026 ha finora tenuto socchiuse entrambe le porte: un ripristino dei toni con Delhi, una visita di Stato di quattro giorni a Pechino e un accordo commerciale con Washington che la Corte suprema ha annullato in undici giorni. I test di fine anno sono concreti e datati: il Ganges Water Treaty scade a dicembre, l'uscita dalla categoria LDC ha effetto dal 24 novembre, Rooppur dovrebbe entrare in rete e la prima visita di Rahman in India (accantonata intorno al vertice BRICS di New Delhi di settembre) non è avvenuta. Due segnali che non sono righe: Dhaka ha declinato l'invito indiano ai BRICS per il modo in cui era stato formulato (attraverso la presidenza BIMSTEC), e l'alto commissario indiano ha detto di attendersi che le questioni su acque e commercio si muovano 'una volta che il primo ministro avrà fatto visita'. Il rischio è che uno Stato che vuole non essere il cliente di nessuno finisca come terreno conteso tra le visioni che tre clienti hanno di esso: il timore indiano di una convergenza Cina-Pakistan-Bangladesh sul Siliguri Corridor, il desiderio cinese di Mongla e Teesta, il desiderio americano che Dhaka non acquisti armi da Pechino.
- hash: 96be6594
  it: |
    Mantenere l'ancoraggio euro-atlantico e incassarne i dividendi: l'euro (21º membro, dal 1 gen 2026, al cambio di 1.95583 lev), Schengen pieno (confini terrestri aperti dal 1 gen 2025) e la NATO, il cui obiettivo di spesa il gabinetto Radev dice di voler raggiungere (2% 'raggiunto', 5% entro il 2035 nel piano del ministro della Difesa). L'ancoraggio è l'unico punto fermo in un sistema politico che ha prodotto otto elezioni in cinque anni.
- hash: b6ac708a
  it: |
    Porre fine al ciclo di governi instabili e riprendere lo Stato dalle reti oligarchiche che le proteste di piazza del 2025 avevano indicato. Rumen Radev si è dimesso dalla presidenza (gennaio 2026) per fondare Progressive Bulgaria, che ha conquistato 131 seggi su 240 il 19 aprile 2026 e governa da sola; il DPS di Delyan Peevski, perno del gabinetto precedente, è sceso a 21 seggi ed è all'opposizione.
- hash: be917b99
  it: |
    Garantire carburante e gas senza la Russia e senza fermare gli impianti: mantenere in funzione la raffineria di Burgas sotto commissari speciali nominati dallo Stato, mentre pesano le sanzioni statunitensi su Lukoil (vendita di Lukoil International in attesa), sganciare Kozloduy dal combustibile russo (Westinghouse per l'unità 5) e proporre il Paese come snodo del gas (IGB, Vertical Corridor, Alexandroupolis, l'interconnessione con la Serbia).
- hash: 7eefdd98
  it: |
    Tenere la linea sulla Macedonia del Nord: riconoscimento costituzionale dei bulgari, commissione storica e nessuna modifica al consenso del luglio 2022 sulla proposta francese, come prezzo per togliere il blocco ai suoi negoziati con l'UE (in vigore dal novembre 2020). Radev, da primo ministro, ha rifiutato perfino di incontrare Mickoski.
- hash: 30baa2a7
  it: |
    Lasciare spazio a una linea 'pragmatica' verso Mosca dentro UE e NATO: sospendere gli aiuti militari statali all'Ucraina e uscire dalla Coalition of the Willing (14 lug 2026), bloccare l'inserimento nelle liste del Patriarca Kirill e di Alekperov di Lukoil nel 21º pacchetto di sanzioni, senza però bloccare il cammino europeo dell'Ucraina né i pacchetti precedenti.
- hash: 3a7c89e1
  it: |
    Difendere il fianco del Mar Nero e l'industria della difesa che lo paga: ospitare il battlegroup NATO a Novo Selo (con l'Italia come nazione quadro, da far crescere fino alla dimensione di brigata), ricevere 16 F-16 Block 70 (otto in servizio entro dicembre 2025), comandare dal luglio 2026 il gruppo di contromisure antimina Romania-Bulgaria-Turchia e mantenere attivo il flusso delle esportazioni per la difesa (circa EUR 2.5bn nel 2025).
- hash: 2f96508c
  it: |
    Il veto, usato con selettività: il blocco del novembre 2020 sui negoziati della Macedonia del Nord, mantenuto sia da Zhelyazkov sia da Radev; il rifiuto del luglio 2026 di inserire nelle liste il Patriarca Kirill e Alekperov, sostenuto dalla minaccia di porre il veto sull'intero 21º pacchetto; l'uscita dalla Coalition of the Willing. Ciascuno è un uso dell'unanimità UE per un interesse nazionale, non una rottura con il club.
- hash: 4e11529c
  it: |
    Diplomazia di snodo regionale: Mitsotakis è stato il primo leader europeo a visitare la Sofia di Radev (4 giu 2026); l'incontro di Ankara con Erdogan (6 lug) ha ottenuto una sospensione di 15 mesi del contratto Bulgargaz-BOTAS; la Bulgaria ha aderito al Board of Peace di Trump (firmato a Davos il 22 gen 2026, ratifica rinviata al nuovo parlamento).
- hash: 24023d5a
  it: |
    La cornice della sovranità: Radev definisce la sua linea su Russia e Ucraina 'interesse nazionale' difeso 'in un formato collettivo', sostiene che l'Europa debba guidare i negoziati di pace e ha definito la Crimea 'attualmente russa' (dichiarazioni in campagna elettorale); la lettura di Mosca (Zakharova) è che Sofia è 'troppo debole' per aiutare l'Ucraina, non che si stia orientando verso la Russia.
- hash: 568ee8c8
  it: |
    Più un ospite in prima linea che una potenza: il battlegroup NATO a Novo Selo (fino a circa 800 militari italiani approvati), otto F-16 Block 70 consegnati entro il 17 dic 2025 e altri otto previsti entro il 2027, un team di pianificazione NATO a Sofia (febbraio 2026) per Eastern Sentry, il comando del gruppo di contromisure antimina del Mar Nero dal 9 lug 2026 e un piano per la difesa che raggiunga il 5% del PIL entro il 2035.
- hash: f9ce86fe
  it: |
    Controllo di strozzature che già possiede: il commissario commerciale speciale di Lukoil Neftochim Burgas (unica raffineria, con un impatto stimato in oltre BGN 15bn l'anno), il corridoio di transito Balkan Stream/TurkStream (ricavi da transito di circa EUR 800m tra gennaio 2022 e marzo 2024, stima romena), le interconnessioni IGB e con la Serbia, e un'industria della difesa le cui esportazioni hanno raggiunto circa EUR 2.5bn nel 2025.
- hash: d2ce9fa2
  it: |
    Diritto delle sanzioni che non scrive: le misure del Tesoro USA su Lukoil, la vendita in attesa di Lukoil International a Carlyle e le licenze OFAC/OFSI decidono se Burgas può acquistare greggio e vendere carburante; Sofia può solo chiedere deroghe e nel novembre 2025 aveva 11 giorni per presentarne una. Qualsiasi vendita che appaia come una nazionalizzazione espone la Bulgaria a ricorsi russi fondati sui trattati di investimento.
- hash: e6c36114
  it: |
    Demografia e povertà: la popolazione era di 6,423,207 alla fine del 2025 (in calo di 14,153), con 50,241 nascite contro 99,479 morti, il 24.3% di età pari o superiore a 65 anni e circa 344,000 persone perse per emigrazione nel decennio fino al censimento del 2021. Il membro più povero dell'EU ha ogni anno meno forza lavoro, meno coscritti e una base fiscale più ristretta.
- hash: c8c1515e
  it: |
    Un'opinione pubblica divisa sull'euro e una base fiscale fragile: a maggio 2025 i favorevoli erano il 46.5% e i contrari il 46.8% (Alpha Research); Vazrazhdane ha condotto la campagna contro l'euro definendolo 'tradimento'; il bilancio 2026, pensato per adeguarsi al nuovo regime (tassa sui dividendi e contributi più alti), ha fatto cadere il gabinetto Zhelyazkov nel dicembre 2025.
- hash: 32c6c877
  it: |
    Un contratto take-or-pay con la Turchia: Bulgargaz ha prenotato 106.4 GWh al giorno di capacità di rigassificazione nei terminali turchi fino al 2035 (circa BGN 1m al giorno), deve a BOTAS circa BGN 300m di arretrati, e la rescissione dell'accordo potrebbe costare quasi BGN 3bn; la sospensione del luglio 2026 vale solo per 15 mesi.
- hash: f1cdd3d5
  it: |
    Una base nucleare di progettazione russa e una lunga transizione del combustibile: le due unità VVER-1000 di Kozloduy forniscono circa un terzo dell'elettricità bulgara; l'unità 5 usa combustibile Westinghouse (contratto decennale del dicembre 2022), l'unità 6 seguirà con Framatome, e le nuove unità AP1000 7 e 8 non sono attese prima del 2034-2037.
- hash: 5fd9a5e1
  it: |
    Dipendenza da partner che la irritano anche: la Bulgaria è il membro più povero dell'EU e un beneficiario netto, ospita forze NATO e statunitensi, e ha bisogno contemporaneamente di Washington (F-16, AP1000, GNL) e di Bruxelles (euro, Schengen, fondi di coesione); il veto brandito sul 21º pacchetto di sanzioni è stato abbandonato quando Kirill e Alekperov sono stati tolti dalla lista, il che mostra quanto arrivi la leva.
- hash: 711c41d6
  it: |
    Il sequestro di Lukoil per salvare la raffineria mette lo Stato contro la propria costituzione e contro i creditori. La legge sui commissari speciali ha eliminato il controllo giudiziario (un problema costituzionale per il Centre for the Study of Democracy), e una vendita che appaia come una nazionalizzazione potrebbe attirare ricorsi russi nell'ambito del trattato bilaterale sugli investimenti; eppure senza il commissario la raffineria si fermerebbe nel giro di poche settimane dalle sanzioni USA. Controllo acquistato al prezzo di un rischio legale.
- hash: 3a03a246
  it: |
    Il blocco alla Macedonia del Nord protegge l'identità bulgara e consuma l'influenza bulgara. Dopo sei anni Skopje risponde con controcondizioni (diritti per i macedoni in Bulgaria, nessun ulteriore veto) e con un incendio doloso contro le auto dell'ambasciata bulgara (15 giu 2026); Radev dice ora che non c'è 'nulla più da discutere' con Mickoski. Sofia, che vuole i Balcani occidentali stabili e ancorati all'EU, si è fatta il primo ostacolo su quella strada.
- hash: faccead8
  it: |
    La Bulgaria guadagna dal gas russo che dice di voler smettere di trasportare. Il tratto europeo di TurkStream rifornisce Serbia e Ungheria attraverso la Bulgaria (52 mcm/giorno all'ingresso Turchia-Bulgaria nel gennaio 2026, un record); la tariffa di transito ha fruttato circa EUR 800m nel 2022-24, e Zhelyazkov ha promesso di chiudere i contratti di transito nel 2026 e il gas russo sul mercato interno entro il 2028, mentre il Vertical Corridor che sta costruendo per sostituire quei flussi costava quasi tre volte di più delle rotte concorrenti verso l'Ucraina fino alla revisione tariffaria di marzo 2026.
- hash: 59deca31
  it: |
    La Bulgaria arma l'Ucraina attraverso le sue fabbriche e la disarma attraverso il suo governo. Secondo il conteggio di von der Leyen, la sua industria della difesa ha fornito circa un terzo delle armi dell'EU destinate all'Ucraina ed esporta circa EUR 2.5bn l'anno; eppure Radev ha bloccato gli aiuti militari statali (9 giu 2026), è uscito dalla Coalition of the Willing (14 lug) e il suo ministro dell'Economia dice che non ci sono fondi per lo stabilimento Rheinmetall di Sopot, che dovrebbe ancorare la prossima generazione dell'industria.
- hash: 91e2bd53
  it: |
    L'euro ottenuto è costato caro al governo che lo ha ottenuto. L'adozione del 1 gen 2026 è stata il risultato centrale del gabinetto Zhelyazkov, ma il bilancio necessario per restare nel nuovo regime (tassa sui dividendi e contributi più alti) ha scatenato le più grandi proteste degli ultimi trent'anni e le dimissioni del gabinetto l'11 dic 2025, tre settimane prima del passaggio. A beneficiarne è stato un outsider, Radev, che si era opposto al sistema dei partiti che aveva portato l'euro.
- hash: 190ef71b
  it: |
    Impegno al 5% per la NATO mentre l'ammodernamento dell'esercito è sospeso. Radev ha detto a Rutte che il 2% era stato raggiunto e che il 5% (entro il 2035 nel piano del ministro della Difesa) era l'obiettivo, e ad Ankara ha presentato la Bulgaria come 'ancora di stabilità' nel Mar Nero; sei settimane dopo il ministro dell'Economia ha dichiarato che non c'erano fondi per lo stabilimento di Sopot e il gabinetto ha messo in pausa l'ammodernamento.
- hash: 4b8c8609
  it: |
    La strategia della Bulgaria è quella di un membro piccolo, povero e in calo di due club, che ha appena scelto una guida che vende distanza da entrambi pur conservando i benefici di ciascuno. L'euro (1 gen 2026), Schengen pieno (1 gen 2025), il battlegroup NATO, gli F-16 e il combustibile Westinghouse sono l'ancoraggio, e nessuno al potere propone seriamente di tagliarlo; ciò che si muove è il margine. Rumen Radev, eletto il 19 aprile 2026 con una maggioranza monopartitica, usa l'unica cosa che uno Stato piccolo ha dentro la EU, il veto, sul Patriarca Kirill, sul fondatore di Lukoil e sulla Macedonia del Nord, e lo paga lasciando la coalizione ucraina e congelando gli aiuti militari statali, mentre le fabbriche continuano a vendere. Lo schema luttwakiano è chiaro: ogni guadagno di leva (il veto, il commissario speciale a Burgas, il corridoio di transito, l'industria della difesa) si paga con una perdita di fiducia presso gli stessi partner che garantiscono l'ancoraggio, e il paradosso del blocco alla Macedonia del Nord mostra la fine di quella strada. Segnali che non sono righe: il 29 mag 2026 Zakharova ha detto che Sofia non mostrava alcun segno di ripristinare il dialogo con Mosca, e il 14 lug che era 'troppo debole' per aiutare l'Ucraina, non che si stesse orientando verso la Russia; il perno è quindi verso la prudenza, non verso il Cremlino. La rete oligarchica di Peevski, inserito nella lista Magnitsky dagli USA nel giugno 2021, ha perso il suo posto nel governo nell'aprile 2026, ma la fragilità di fondo (otto elezioni in cinque anni, un gabinetto abbattuto da un bilancio nel dicembre 2025) non è ancora stata messa alla prova da un bilancio rigoroso sotto Radev. Da osservare: le licenze su Lukoil (secondo quanto riferito fino alla fine di ottobre 2026), la fase finale del 21º pacchetto, se Skopje e Sofia torneranno a parlarsi prima del prossimo rapporto del Consiglio sull'allargamento, e se la sospensione BOTAS di 15 mesi si chiuderà con un contratto rinegoziato o con un contratto oggetto di contenzioso.
- hash: 7913680d
  it: |
    Tenere lontani dal proprio territorio gli attacchi iraniani e le reti legate all'Iran. L'Iran ha colpito direttamente il Bahrein nel febbraio-marzo 2026, e il Bahrein ha incarcerato persone per collaborazione con i Revolutionary Guards iraniani.
- hash: 21ae21f6
  it: |
    Mantenere l'ombrello di sicurezza USA: l'accordo di integrazione della sicurezza USA-Bahrein, il quartier generale della Quinta Flotta sul proprio territorio e la decisione britannica di aderire all'accordo nel dicembre 2024.
- hash: fa2fb935
  it: |
    Usare il seggio nel Consiglio di sicurezza UN per il 2026-27, ottenuto il 3 giugno 2025, per accrescere il peso oltre le proprie dimensioni.
- hash: c499f7f9
  it: |
    Integrazione della sicurezza con gli Stati Uniti: l'accordo USA-Bahrein (cui il Regno Unito ha aderito nel 2024) e il quartier generale della Quinta Flotta, che secondo le notizie sarebbe stato colpito nel febbraio 2026.
- hash: 842bca99
  it: |
    Difesa aerea e antimissile: il Bahrein dichiara di aver intercettato 70 missili balistici e 59 droni entro il 3 marzo 2026.
- hash: b1c82985
  it: |
    Diplomazia con Israele e il Golfo: relazioni diplomatiche con Israele dal comunicato congiunto del 18 ottobre 2020 (Abraham Accords), e legami ristabiliti con il Qatar nel 2023.
- hash: 542caa74
  it: |
    Da solo non può bilanciare l'Iran: la sua deterrenza poggia sul patto con gli USA e sulla Quinta Flotta, quindi gli attacchi iraniani colpiscono la sicurezza che ha acquistato.
- hash: 9c6c7aad
  it: |
    Coesione interna: la revoca della cittadinanza nel 2016 al religioso sciita Isa Qassim e le condanne del 2019 contro un gruppo 'sostenuto dall'Iran' mostrano che la questione iraniana è anche una questione sulla propria popolazione sciita.
- hash: 4a9c6b80
  it: |
    Il legame con Israele resta formale: l'inviato è tornato in patria nel novembre 2023 per Gaza, e Israele ha dichiarato che i legami sono rimasti stabili.
- hash: e2fb785c
  it: |
    Ospitare la Quinta Flotta e il patto con gli USA compra sicurezza, ma rende il Bahrein un bersaglio: lo stesso legame che lo protegge è la ragione per cui gli attacchi iraniani lo raggiungono.
- hash: 73decaf2
  it: |
    La scheda del Bahrein poggia su un ombrello di sicurezza USA e su un'apertura formale a Israele, e l'Iran è il rivale strutturale: alla rottura del 2016 è seguito un attacco diretto contro il Bahrein nel 2026. I suoi strumenti di hedging diplomatico sono il legame con Israele del 2020 e un seggio nel Consiglio di sicurezza UN per il 2026-27. Questa scheda è scarna e sottile: non sono riportati Arabia Saudita, Houthi, il blocco del Qatar e il dispiegamento del 2011, i negoziati con l'Iran del 2024-25, la guerra del giugno 2025 e la base britannica, perché in questa sessione non è stata trovata alcuna fonte per essi.
- hash: c5fe6994
  it: |
    Governare con il mandato del 12 maggio 2026: il Progressive Liberal Party guidato da Philip Davis è stato rieletto per un secondo mandato consecutivo, con 33 seggi su 41 nel conteggio preliminare, dopo che Davis ha indetto un voto anticipato. Questo mandato è il vincolo di ogni scelta che segue.
- hash: 733b4f04
  it: |
    Controllare la migrazione irregolare, soprattutto da Haiti: dopo le elezioni di maggio 2026 il governo ha intensificato i rimpatri (107 haitiani allontanati per via aerea a maggio, 116 il 27 agosto 2026) e ha annunciato un sistema di immigrazione biometrico, sanzioni più severe per i datori di lavoro e multe giornaliere per il soggiorno oltre i termini.
- hash: adbf677c
  it: |
    Mantenere gli Stati Uniti come partner di riferimento: sono la principale fonte di visitatori (circa l'80 per cento nel 2014, l'ultimo dato reperito), e l'ambasciatore USA definisce le Bahamas un partner prezioso (gennaio 2026).
- hash: 87faae74
  it: |
    Far rispettare sul proprio territorio le regole d'ingresso che Washington stabilisce, rifiutando al tempo stesso di accogliere i deportati statunitensi: il governo ha dichiarato alla fine del 2024 di non voler né poter accettare voli di rimpatrio USA, eppure nel settembre 2025 ha vietato agli haitiani di entrare per richiedere visti statunitensi, dopo che Washington aveva limitato l'ingresso degli haitiani.
- hash: 15210f70
  it: |
    Il turismo come principale fonte di reddito, ora orientato alle crociere: la Banca mondiale segnala arrivi da crociera in aumento dell'11.6% su base annua fino a ottobre 2025, mentre i visitatori con pernottamento sono calati dell'1.9%.
- hash: 021240df
  it: |
    Il turismo è gran parte dell'economia: una guida del US Commercial Service colloca il turismo intorno al 50% del PIL (di più con i servizi collegati), e la base dei visitatori con pernottamento è piatta, quindi un uragano, un cambiamento delle regole di viaggio USA o uno spostamento nel mix delle crociere colpiscono lo stesso settore.
- hash: d2e8f683
  it: |
    Debito: il debito del governo centrale è di circa il 74% del PIL nell'esercizio FY2024/25, e l'IMF dice che servono ulteriori misure per raggiungere l'obiettivo del governo del 50% entro FY2030/31.
- hash: 2c8b4171
  it: |
    Le restrizioni USA all'ingresso degli haitiani plasmano le regole di Nassau sugli haitiani: nel settembre 2025 le Bahamas hanno vietato l'ingresso ai richiedenti visto haitiani che intendevano presentare domanda per i visti statunitensi, quindi la politica di frontiera segue la politica dei visti di Washington.
- hash: 89cf7008
  it: |
    Le Bahamas rifiutano di accogliere i deportati statunitensi, ma rimpatriano haitiani sui propri voli su larga scala (107 nel maggio 2026, 116 il 27 agosto 2026). Dicono di non poter ricevere migranti da Washington mentre svolgono in proprio lo stesso tipo di rimpatri, quindi il loro rifiuto e i loro rimpatri stanno fianco a fianco.
- hash: 3f2f8aa1
  it: |
    Le Bahamas sono un piccolo Stato dipendente dal turismo, il cui governo è stato rinnovato nel maggio 2026 con un'ampia maggioranza; il suo obiettivo è quindi la continuità e il controllo della migrazione più che un cambio di rotta. Il suo test più duro riguarda Haiti e gli Stati Uniti: Nassau rimpatria haitiani su larga scala e vieta l'ingresso ai richiedenti visto haitiani, in linea con le regole d'ingresso di Washington, mentre rifiuta di accogliere i deportati USA. Questa scheda riporta solo ciò che è stato documentato in questo passaggio; le sue posizioni su Cuba, Cina, CARICOM e Ucraina o Gaza non sono scritte, perché non è stata letta alcuna fonte in merito.
- hash: 13317d8d
  it: |
    Tenere in vita lo Stato contro una delle sue entità. L'obiettivo delle istituzioni statali (la maggioranza a guida bosniaca nella Presidenza e la coalizione Troika del Consiglio dei ministri, la Corte costituzionale, la Corte statale, la Commissione elettorale centrale) è difendere l'ordine di Dayton, l'integrità territoriale e l'autorità della giustizia statale contro la dirigenza della Republika Srpska, che dopo la condanna di Dodik del 26 feb 2025 ha vietato alla magistratura e alla polizia statali l'accesso all'entità (l'OHR ha parlato di 'hint[s] at de facto secession') e ora chiede la restituzione di esercito, polizia di frontiera, intelligence e sistema fiscale. Non sono questi gli obiettivi del membro serbo della Presidenza né della dirigenza HDZ BiH (vedi lettura).
- hash: 8e36920e
  it: |
    Aderire all'EU: l'unico obiettivo che tutti e tre i popoli costitutivi condividono sulla carta e il principale ancoraggio delle riforme. Lo status di candidato è arrivato nel dicembre 2022 e il Consiglio ha deciso di aprire i negoziati nel marzo 2024, ma la prima conferenza intergovernativa non si è ancora tenuta, non è stato nominato alcun negoziatore capo e il quadro negoziale attende le leggi di riforma della giustizia.
- hash: 167148b7
  it: |
    Mantenere in vigore la garanzia esterna: l'Ufficio dell'Alto rappresentante (OHR) e i suoi poteri di Bonn, la forza EU EUFOR Althea, mandata dall'UN, e l'unità del Consiglio di sicurezza sulla sovranità della Bosnia (dichiarazione presidenziale del 29 dic 2025). Sarajevo ha bisogno del garante perché da sola non può far rispettare l'ordine costituzionale all'interno dell'entità, e il garante è in movimento (Schmidt si è dimesso nel maggio 2026; gli USA vogliono che il suo successore trasferisca i poteri alle istituzioni bosniache).
- hash: d8ee3b48
  it: |
    Ottenere il riconoscimento del genocidio di Srebrenica e impedirne la negazione e l'esaltazione dei criminali di guerra: la giornata di commemorazione dell'Assemblea generale UN (A/RES/78/282, 23 mag 2024) e la risposta diplomatica ai funerali di Mladic a Belgrado nel settembre 2026 (due diplomatici serbi espulsi, la maggior parte del personale dell'ambasciata bosniaca ritirato, il memorandum di buon vicinato non firmato).
- hash: 10ed5b15
  it: |
    Ancorare lo Stato alla NATO come seconda garanzia dopo l'EU. La Bosnia è stata invitata a un Membership Action Plan nel 2010, ma la NATO non lo ha attivato perché la Republika Srpska rifiuta di registrare i beni della difesa come beni statali; nell'ottobre 2025 NATO e Bosnia hanno concordato un nuovo Individually Tailored Partnership Programme. L'adesione non è sul tavolo finché l'entità la blocca.
- hash: 0c3937f0
  it: |
    Impedire che economia e popolazione si svuotino: incassare i fondi del Growth Plan dell'EU (EUR 976.6m ancora disponibili, EUR 373.9m a rischio dopo il 31 dic 2026), ridurre la dipendenza dall'unica fornitura di gas russo attraverso la Southern Interconnection con la Croazia (prevista entro fine 2027, prima del divieto dell'EU sul gas russo) e tenere in piedi un'economia sostenuta dalle rimesse mentre la popolazione diminuisce.
- hash: 45059b7c
  it: |
    Leve giuridiche e istituzionali usate come prima linea di difesa: la sentenza della Corte statale su Dodik (1 anno, interdizione di 6 anni; confermata in appello il 1 ago 2025), la rimozione di Dodik dalla presidenza della RS da parte della Commissione elettorale centrale (ago 2025), la sospensione e l'annullamento da parte della Corte costituzionale delle leggi della RS contro le istituzioni statali (mar-mag 2025) e il rigetto del ricorso di Dodik (nov 2025).
- hash: 72db472e
  it: |
    Diplomazia del ministero degli Esteri e della Presidenza, condotta dalla parte a guida bosniaca: la campagna per la risoluzione su Srebrenica (Becirovic: 'a great diplomatic battle'), l'incontro d'emergenza di Becirovic con Erdogan a Istanbul (14 mar 2025) durante la crisi Dodik, e la risposta di Konakovic ai funerali di Mladic nel settembre 2026: espulsioni, un ritiro parziale da Belgrado e il lavoro trasferito alle ambasciate di Zagabria e Podgorica.
- hash: 9c67bd1c
  it: |
    Allineamento con l'EU e le sue capitali: Germania e Austria hanno vietato a Dodik e a due collaboratori l'ingresso nel maggio 2025, e Berlino ha sostenuto le decisioni di Schmidt; l'EU ha confermato la prospettiva di adesione al vertice EU-Balcani occidentali del giugno 2026. L'EU è l'unica potenza esterna la cui linea politica coincide con quella di Sarajevo.
- hash: 1643bdf5
  it: |
    Politica della memoria come strumento di sicurezza: la giornata di Srebrenica dell'11 luglio, la richiesta che Serbia e Republika Srpska smettano di esaltare comandanti condannati, e la lettura dell'agenda della RS come 'decostruzione' dello Stato (Schmidt, maggio 2026). Il ministro degli Esteri sostiene inoltre che Dodik ha fatto pressioni su Washington per l'indipendenza della RS e l'abolizione dell'OHR (feb 2026), un'affermazione che presenta l'entità come un progetto sostenuto dall'estero.
- hash: b76d7243
  it: |
    Quasi nulla di proprio: la sicurezza poggia su EUFOR Althea (24 paesi contributori, circa 1,000 militari secondo un conteggio, 1,500 secondo un altro; le forze di riserva europee sono state trasferite per circa 300 in più nel marzo 2025, quando la crisi Dodik si aggravò), rinnovata all'unanimità dal Consiglio di sicurezza il 31 ott 2025 e in scadenza di nuovo entro il 31 ott 2026.
- hash: be716337
  it: |
    Denaro e accesso al mercato dell'EU come leva sui propri politici: fondi del Growth Plan condizionati a passi di riforma, un accordo sullo status con Frontex (giugno 2025) che sposta il controllo migratorio su basi sostenute dall'EU, e una struttura commerciale in cui l'EU assorbe circa il 73% delle esportazioni. La Southern Interconnection con la Croazia, sostenuta dagli USA, è la contromossa energetica al gas russo.
- hash: 2726617c
  it: |
    La macchina di Dayton dà all'entità un veto sulla politica estera dello Stato. Una Presidenza a tre membri (bosniaco, croato, serbo) decide sul riconoscimento e sugli ambasciatori; nel 2020 il membro serbo ha rifiutato di riconoscere il Kosovo e la Republika Srpska ha invocato un veto per interesse vitale, e l'accordo sui visti con il Kosovo non è ancora ratificato perché la RS lo blocca. Sarajevo non può richiamare il proprio ambasciatore a Belgrado senza la Presidenza.
- hash: 59ace615
  it: |
    I garanti sono divisi e in uscita. L'OHR è guidato da un Alto rappresentante ad interim dal 1 lug 2026 (il Peace Implementation Council non è riuscito a concordare un successore il 4 giugno e il 14 luglio; gli USA hanno sostenuto Antonio Zanardi Landi, mentre Francia, Regno Unito e Germania hanno sostenuto Rene Troccaz); Russia e Cina non riconoscono la nomina di Schmidt e chiedono la chiusura dell'OHR; Washington dice che è 'no longer pursuing nation-building'.
- hash: '68988421'
  it: |
    La Republika Srpska ha potere e patroni. L'SNSD, il partito di Dodik, ha mantenuto l'entità il 4 ott 2026 (Savo Minic eletto presidente della RS); le sanzioni USA contro Dodik e altri 47 sono state revocate il 29 ott 2025; l'entità gode di relazioni parallele speciali con Belgrado, del sostegno aperto di Mosca e, fino all'aprile 2026, dell'Ungheria di Orban. Dodik, interdetto dalle cariche, resta leader del partito e dice che il suo partito 'will not change course'.
- hash: 2844533f
  it: |
    La condizionalità dell'EU colpisce i blocchi dello Stato stesso: la legge sui tribunali della BiH e la legge sull'HJPC non sono state adottate, il negoziatore capo non è stato nominato, lo stanziamento del Growth Plan è già stato ridotto del 10% nel 2025 e EUR 373.9m andranno persi dopo il 31 dic 2026. La Commissione dice che il prossimo passo spetta alla Bosnia.
- hash: c1eab07d
  it: |
    Un'economia ristretta e dipendente dalle importazioni: il deficit di beni del 2025 è stato di KM 12.98bn (esportazioni pari al 56.7% delle importazioni), e ogni metro cubo di gas arriva dalla Russia attraverso la Serbia su un unico gasdotto del 1979. La legge sulla Southern Interconnection è stata approvata nella Federazione nel gennaio 2025, ma l'accordo interstatale con la Croazia non era ancora firmato nel 2026, dopo le controversie su chi dovrà gestirla.
- hash: c14fecc8
  it: |
    La popolazione si sta svuotando: una stima di 2.90 milioni nel 2023 contro 3.53 milioni al censimento del 2013 (nessun censimento da allora), più della metà delle persone di origine bosniaca vive all'estero, e l'affluenza alle elezioni del 4 ott 2026 è scesa a circa il 42%, il minimo storico. Le rimesse (KM 4.46bn nel 2025) tengono a galla l'economia mentre l'emigrazione prosegue.
- hash: 923e8b9f
  it: |
    Lo Stato si difende prendendo in prestito i poteri di uno straniero non eletto. I poteri di Bonn dell'OHR hanno dato a Sarajevo lo strumento più forte contro l'entità, ma ogni uso permette a Banja Luka, Mosca e Pechino di chiamare la Bosnia un protettorato; la Russia dice che l'OHR è 'incompatible with the sovereignty of [BiH]', e quando il garante si indebolisce - Schmidt fuori nel maggio 2026, Washington 'no longer pursuing nation-building' - lo Stato scopre che la sua capacità era in prestito.
- hash: 8dcd004e
  it: |
    Vincere la causa giudiziaria ha rafforzato l'imputato. La Corte statale ha condannato Dodik, la CEC lo ha rimosso, la Corte costituzionale ha annullato le leggi della RS e l'entità ha fatto marcia indietro - eppure Washington ha revocato le sue sanzioni il 29 ott 2025 come 'misura di risposta' a quella ritirata, e il 4 ott 2026 il suo partito ha ripreso l'entità. Le istituzioni hanno vinto ogni sentenza, e la politica che avrebbero dovuto proteggere si è mossa nella direzione opposta.
- hash: 53600fcc
  it: |
    L'obiettivo che i tre popoli condividono è tenuto in ostaggio da chi può porvi il veto. L'adesione all'EU è l'unica agenda che sulla carta unisce Sarajevo, Banja Luka e Mostar, ma aprire i negoziati richiede un negoziatore capo che parli per 'the whole country with one voice' e leggi sulla giustizia che il potere di blocco dell'entità e dell'HDZ può far stallare; i soggetti con potere di veto non perdono nulla quando EUR 373.9m vanno persi, lo Stato sì.
- hash: 9f9e5015
  it: |
    Rompere i rapporti con Belgrado non può farlo lo Stato che vorrebbe farlo. Konakovic ha detto che romperebbe le relazioni con la Serbia 'if I could', ma l'ambasciatore e il console servono al piacere della Presidenza, quindi lo Stato ha espulso due addetti, svuotato l'ambasciata e abbandonato il tavolo regionale (il memorandum di buon vicinato): una protesta che costa a Sarajevo peso regionale e lascia intatto il patronato di Belgrado sulla RS.
- hash: 9838c5f6
  it: |
    Sanare la ferita croata elimina il voto oscillante dei croati. Il blocco civico (il DF di Komsic) ha difeso un modello elettorale in cui i voti bosniaci contribuivano a scegliere il membro croato della Presidenza; l'HDZ BiH lo ha attaccato per anni con il sostegno di Zagabria. Il 4 ott 2026 Filipovic dell'HDZ ha conquistato il seggio direttamente: così si chiude la ferita, ma finisce anche il membro croato che nel 2020 si è unito al membro bosniaco per sostenere il riconoscimento del Kosovo e che definisce il Kosovo indipendente. La prossima Presidenza non ha altro voto per la linea statale oltre a quello del membro bosniaco.
- hash: 3675ad97
  it: |
    Uscire dal gas russo richiede proprio gli attori che dividono lo Stato. La diversificazione passa dalla Croazia e da una concessione americana, ma il progetto è stato rallentato dalle controversie nella Federazione su chi lo gestirà, mentre la Republika Srpska tratta con Gazprom su un proprio gasdotto dalla Serbia; il Dipartimento di Stato USA ha messo in guardia Sarajevo contro i ritardi nel giugno 2026. Fino ad allora Serbia e Russia tengono l'unico rubinetto.
- hash: 4814972f
  it: |
    La strada verso l'Europa è la strada fuori dal Paese. L'adesione è lo scopo politico dello Stato, eppure la libertà di lavoro in Germania e nell'EU attira via i medici, gli infermieri e i giovani lavoratori di cui lo Stato ha bisogno per funzionare: la popolazione è calata di circa il 18% in un decennio, e le rimesse di KM 4.46bn nel 2025 finanziano i consumi mentre l'esodo continua.
- hash: 15ed2be1
  it: |
    La Bosnia-Erzegovina non ha una grand strategy unica, e una scheda che fingesse di averne una sarebbe sbagliata. Gli obiettivi sopra indicati sono quelli delle istituzioni statali così come li legge la maggioranza a guida bosniaca: il membro della Presidenza Becirovic, il ministro degli Esteri Konakovic, la Corte costituzionale e la Corte statale, la Commissione elettorale centrale, i partiti SDA/SDP/Troika. Nello stesso Stato convivono altre due agende. La dirigenza della Republika Srpska dell'SNSD di Dodik, appena rieletta, vuole svuotare lo Stato: competenze di nuovo all'entità, OHR eliminato, status definito a Washington e a Mosca, e mantiene il seggio serbo nella Presidenza (Cvijanovic) per porre il veto su ciò che non può vincere. La dirigenza dell'HDZ BiH di Covic, sostenuta da Zagabria, vuole una legge elettorale che impedisca ai non croati di scegliere il membro croato, e ha appena ottenuto il seggio direttamente. Il paradosso dell'intera scheda è che uno Stato deve difendere la propria esistenza contro una delle sue entità, con strumenti (i poteri di Bonn, EUFOR, la copertura del Consiglio di sicurezza, i tribunali) che in parte appartengono ad altri, in un anno in cui i garanti si sono indeboliti - Schmidt si è dimesso a maggio e a metà luglio non era stato concordato alcun successore, gli USA hanno revocato le sanzioni e hanno detto di aver chiuso con la costruzione dello Stato, Orban è caduto ad aprile - mentre l'elettorato è rimasto a casa (42%). Segnali che non sono righe: il voto del Consiglio di sicurezza su EUFOR del 31 ott 2026 (il rinnovo di ottobre 2025 è stato 15-0, quindi il caso base è il rinnovo; la posizione russa sull'OHR è ciò da osservare), l'identità del prossimo Alto rappresentante, se l'Ungheria di Magyar manterrà la linea di Orban verso Banja Luka, e se la nuova Presidenza riuscirà ancora a esprimere una maggioranza sulle questioni di politica estera dopo che il seggio di Komsic è andato all'HDZ. Lo spazio di manovra di Sarajevo è reale solo dove l'EU e l'entità non possono porre il veto: i tribunali, la politica della memoria e la capacità di dire no a Belgrado.
- hash: 809a3984
  it: |
    Sopravvivenza del regime e continuità del potere personale di Lukashenko: un settimo mandato ottenuto il 26 gen 2025 (87.48%, affluenza 85.7%, in un'elezione che l'Alto rappresentante dell'EU ha definito una farsa priva di legittimità), un apparato repressivo che tiene ancora circa 850-1,000 prigionieri politici, e una successione che resta interna al sistema: la questione di chi lo seguirà (un figlio, un tecnocrate fedele o la scelta di Mosca) è deliberatamente lasciata aperta.
- hash: 2e4e7b0f
  it: |
    Tenere la Russia come scudo e finanziatore senza farsi assorbire: il trattato sulle garanzie di sicurezza dello Union State (firmato il 6 dic 2024, ratificato tra febbraio e marzo 2025) pone la Bielorussia sotto l'ombrello nucleare russo e obbliga ciascuna parte a sostenere l'ordine costituzionale dell'altra; la stessa settimana la Russia ha ratificato il rinvio di circa USD 800m di rimborsi di prestiti statali. Lukashenko paga in lealtà ('we have never been traitors') mantenendo 'my own understanding' della guerra.
- hash: 24fd9707
  it: |
    Restare fuori dalla guerra combattuta pur ospitandola: le truppe bielorusse non sono entrate in Ucraina (Lukashenko ripete che non lo faranno a meno che la Bielorussia non venga attaccata), eppure il territorio è servito da area di schieramento nel 2022 e ospita (secondo Kiev) stazioni russe di ritrasmissione dei droni, Iskander con capacità nucleare e, dal dicembre 2025, l'Oreshnik; il prezzo di questa linea è un'Ucraina ostile che fortifica 1,084 km di confine, e la 'mobilitazione mirata' dichiarata da Lukashenko (maggio 2026) è il segno della tensione.
- hash: 0460d200
  it: |
    Scambiare prigionieri con un'apertura verso Washington: alleggerimento delle sanzioni su Belavia (set 2025), sulla potassa (dic 2025) e su banche, Ministero delle Finanze e Banca di sviluppo (19 mar 2026), riapertura dell'ambasciata USA a Minsk e una possibile visita di Lukashenko negli Stati Uniti. L'inviato Coale ha detto a Minsk il 19 mar 2026 che si stavano discutendo un viaggio di Lukashenko negli USA e la riapertura dell'ambasciata.
- hash: b17ce734
  it: |
    Proteggere l'economia d'esportazione: la potassa (la principale fonte di valuta estera, oggi spedita attraverso porti russi perché la Lituania ha chiuso Klaipeda nel 2022), i prodotti petroliferi raffinati da due raffinerie che lavorano greggio russo, e un mercato russo che assorbe circa il 61% del commercio estero di beni. L'obiettivo è riaprire le rotte occidentali (alleggerimento USA, un accordo di transito su Klaipeda, la richiesta di arbitrato da EUR 12bn contro la Lituania) perché la Russia non sia l'unica porta.
- hash: 0ee696f0
  it: |
    Diversificare verso l'esterno perché la Russia non sia l'unico partner: piena adesione alla SCO dal 4 lug 2024, un 'all-weather strategic partnership' con la Cina (2025), la Cina come secondo partner commerciale (circa l'11% del commercio estero), più legami cauti con la Corea del Nord e un seggio nell'EAEU e nella CIS. Pechino offre mercati e una forma di hedging, non sicurezza o denaro sulla scala di Mosca.
- hash: 1ebcf6ff
  it: |
    Prigionieri politici come moneta: lotti di scarcerazioni (52 nel set 2025, 123 nel dic 2025 tra cui Bialiatski, Kalesnikava e Babaryka, 250 il 19 mar 2026 con Tsikhanouski tra loro, 15 inviati in Lituania) vengono scambiati con l'alleggerimento delle sanzioni USA attraverso il canale Coale; uno scambio di prigionieri con la Polonia (Poczobut, 28 apr 2026) e una telefonata con Macron (24 mag 2026) estendono lo stesso metodo verso l'Europa.
- hash: fac01674
  it: |
    Appartenenza multivettoriale: lo Union State, il CSTO (Minsk ha ospitato il vertice del 2023), l'EAEU (Consiglio intergovernativo eurasiatico a Minsk il 2 ott 2026), la CIS (vertice in Turkmenistan 8-9 ott 2026) e la SCO, usate per presentare la Bielorussia come parte di un ordine post-occidentale e non come una provincia russa.
- hash: 66aad4e3
  it: |
    Controllo totale del campo informativo: media indipendenti vietati, una lista di 'estremisti' di 6,650 nomi (maggio 2026), condanne in contumacia per analisti esiliati, persino l'European Humanities University in esilio etichettata come estremista; il regime presenta le scarcerazioni come 'humanitarian' e nega le accuse ucraine (la pretesa di Valfovich di 116 incidenti con droni ucraini in una settimana è stata definita 'absurd' da Kiev).
- hash: bb9e35f4
  it: |
    Ospitare come leva: armi nucleari tattiche russe (consegna annunciata da giugno 2023 in base a un accordo di stoccaggio del maggio 2023; Lukashenko ha affermato 'several dozen' testate nel dic 2024, non verificato), lanciatori Iskander, la brigata Oreshnik dichiarata in servizio di combattimento nel dicembre 2025 (subordinata alle Forze missilistiche strategiche russe secondo Jamestown), l'esercitazione Zapad-2025 del 12-16 set 2025 e un Gruppo regionale di forze con la Russia dall'ottobre 2022.
- hash: d8fd16e6
  it: |
    Pressione ibrida sul confine dell'EU: la strumentalizzazione dei migranti del 2021 (base giuridica dell'EU per le sanzioni nel nov 2021), i combattenti Wagner accolti dopo l'ammutinamento del giugno 2023 (Morawiecki ha detto il 29 lug 2023 che più di 100 si erano spostati verso il Suwalki gap, circostanza contestata dagli osservatori bielorussi), i palloncini per il contrabbando di sigarette che hanno chiuso più volte l'aeroporto di Vilnius nel 2025-26.
- hash: 54036a01
  it: |
    Potassa, prodotti raffinati e un'unione doganale come leve e ancore di salvezza: la Bielorussia esporta potassa verso mercati non occidentali attraverso porti russi e tratta con gli USA il sollievo sanzionatorio su di essa; ritorce contro la Lituania trattenendo camion (circa 200 ancora fermi nel maggio 2026); usa l'EAEU per collocare merci nel mercato russo e nei mercati cinesi di macchinari e alimentari.
- hash: 32dfecef
  it: |
    Ostaggio economico della Russia: circa il 61% del commercio estero di beni e circa il 93% del commercio con la CIS (dati Belstat citati dal capo di gabinetto di Lukashenko, 2025), prestiti statali russi (circa USD 800m di rimborsi differiti nell'inverno 2024-25) e greggio russo per entrambe le raffinerie; il sistema di conferma delle spedizioni pianificato da Mosca (SPOT, feb 2026) può complicare gli scambi a piacimento.
- hash: e9f66bbc
  it: |
    Il muro dell'EU: l'EU ha rinnovato le sanzioni contro la Bielorussia il 26 feb 2026 fino al 28 feb 2027 (312 persone, 57 entità, misure settoriali inclusi i fertilizzanti), e il ministro degli Esteri lituano ha detto il 26 mag 2026 che nessuna revisione arriverà prima di febbraio 2027; l'alleggerimento USA non apre le rotte europee.
- hash: 13f4326b
  it: |
    Nessun controllo sulle armi che ospita: il battaglione Oreshnik è subordinato alle Russian Strategic Missile Forces secondo Jamestown e l'intelligence ucraina (la pretesa di Lukashenko che 'targets will be determined by us' non è verificata), le testate nucleari restano in custodia russa, e il trattato consente basi e truppe russe 'to repel aggression'.
- hash: 816485f6
  it: |
    Un confine occidentale che si chiude: la Polonia ha sigillato tutti i valichi durante lo Zapad-2025 (12 set 2025) e ne ha riaperti due il 17 nov 2025 solo per un traffico limitato; la Lituania ha chiuso gli ultimi due valichi per tre settimane (27 ott - 20 nov 2025); la Lettonia ha tenuto chiuso Silene dal set 2023 e conta oltre 9,000 tentativi di attraversamento illegale nel 2026; nel frattempo è stato bloccato il transito ferroviario Cina-Europa.
- hash: 3ac60bbd
  it: |
    Una base interna ristretta: il 52% dei bielorussi, secondo un sondaggio iSANS, vuole la normalizzazione con l'EU; c'è un esilio di massa dal 2020 (l'ufficio di Tsikhanouskaya ora è a Varsavia oltre che a Vilnius, e una Missione della Bielorussia democratica è stata aperta a Kiev il 27 mag 2026), e una repressione che funziona solo finché i servizi di sicurezza restano fedeli. La chiamata alle armi dei riservisti del 2026, secondo fonti ucraine e dell'opposizione, è avvenuta sotto la copertura di ispezioni di prontezza al combattimento.
- hash: eaf84a7a
  it: |
    La Cina è uno strumento di hedging, non un soccorritore: interscambio bilaterale di USD 8.85bn nel 2025 con un deficit di USD 5.53bn per la Bielorussia, investimenti diretti di circa USD 550m in dieci anni (contro USD 17.45bn in Russia), prestiti cinesi non superiori all'1.3% degli investimenti industriali, risultati del parco Great Stone definiti minimi, 11 dei 13 allevamenti di pollame certificati esclusi dalla Cina.
- hash: 42a80972
  it: |
    Comprare la protezione russa elimina l'autonomia che avrebbe dovuto proteggere. Il trattato sulle garanzie di sicurezza, l'ombrello nucleare e la brigata Oreshnik rendono impensabile un'invasione della Bielorussia, ma pongono i lanciatori sotto comando russo, aprono la strada a basi russe e impegnano la Bielorussia a 'support' l'ordine costituzionale dell'altra parte, così che Mosca, non Minsk, ha l'ultima parola sulla successione.
- hash: 36a7eaed
  it: |
    La pressione alla frontiera, pensata per strappare concessioni, ha prodotto i confini chiusi che soffocano la Bielorussia. La spinta migratoria del 2021, la presenza Wagner del 2023 e i palloncini del contrabbando del 2025 hanno attirato l'attenzione a Bruxelles e a Vilnius, ma hanno anche comprato sanzioni, la chiusura dei valichi polacchi, lituani e lettoni, circa 200 camion lituani trattenuti che mantengono Vilnius ostile, e l'arresto del transito ferroviario Cina-Europa che la Bielorussia voleva vendere.
