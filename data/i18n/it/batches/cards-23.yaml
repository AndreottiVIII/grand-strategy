# Translate every `en` into it. Write the translations to the file cards-23.out.yaml next to this one,
# as `items:` of `- hash: <same hash>` / `it: <translation>`, appending one item at a time (valid YAML at
# every step), never editing this file. Keep names, dates, numbers and quotes; register of a foreign-office
# brief: dry, precise, no flourish.
lang: it
items:
- hash: 758bf87d
  kind: cards
  en: Push Israel back to the 1974 lines and sign a security arrangement that keeps the Golan claim alive and does not restrict Syria's right to rebuild its army or choose its alliances; in the meantime
    avoid war with a stronger neighbour.
  it: ''
- hash: 6c9dc058
  kind: cards
  en: 'Hold a multi-patron balance: Turkey for the army and the north, the Gulf for money, Washington for legitimacy and sanctions relief, Moscow kept at a distance (Hmeimim and the Tartus berth converted
    into joint training centres, memorandum of 9 Aug 2026), Europe for markets and a partnership agreement.'
  it: ''
- hash: 1fa83c11
  kind: cards
  en: 'Make Syria useful rather than a threat: joined the counter-ISIS coalition (10 Nov 2025), took over the ISIS prisons, seizes Hezbollah-bound arms on the Lebanese and Iraqi borders, and pitches itself
    as a transit corridor (Gulf gas via Jordan, Azerbaijani gas via Turkey, Iraqi oil via Baniyas).'
  it: ''
- hash: 4b73c050
  kind: cards
  en: 'Leader-level multi-alignment: Trump in Riyadh (May 2025) and the White House (10 Nov 2025), Macron in Paris (7 May 2025), Putin in Moscow twice (Oct 2025, 28 Jan 2026), Merz in Berlin and Starmer
    in London (March 2026), Gulf capitals, and a Kallas visit to Damascus (29 Sep 2026). Foreign Minister Shaibani works the Israeli, EU and Chinese files.'
  it: ''
- hash: c22d8940
  kind: cards
  en: 'Self-presentation as a counter-terror partner and a stabiliser rather than a security threat (al-Sharaa to Fox News: Syria should be seen as a geopolitical ally); national fact-finding committee
    and public trials (from 17 Nov 2025) to answer the accusations over the March 2025 coastal killings; SANA as the channel for all positions.'
  it: ''
- hash: '56889875'
  kind: cards
  en: 'A new army built by absorption, not conquest: ex-rebel factions, six thousand registered SDF fighters by July 2026 (government source, unconfirmed officially), Turkish training under the 13 Aug 2025
    agreement, hand-over of the Tanf base (Feb 2026) and the al-Hol camp, and thousands of troops moved to the Lebanese border in March 2026.'
  it: ''
- hash: 3130b3e7
  kind: cards
  en: 'Concessions and corridors paid for by others: DP World''s 30-year Tartus concession (USD 800m pledged), AD Ports'' 20% of the Latakia container terminal, Eagle Hills'' USD 20bn property plans, Qatari-funded
    gas via Jordan and via Turkey, Saudi telecom and airline deals, Saudi and Qatari payment of Syria''s World Bank arrears (USD 15.5m, 2025) that reopened multilateral lending.'
  it: ''
- hash: 59c51c31
  kind: cards
  en: 'A ruined economy: the World Bank counts USD 108bn of direct physical damage and USD 216bn (range 140-345bn) to rebuild, about ten times the 2024 economy; aid cuts and a low power supply (gas deliveries
    add only a few hours a day) leave the state dependent on pledges, many of them unconfirmed MoUs.'
  it: ''
- hash: 6e32f6ad
  kind: cards
  en: Israel holds a security zone in the south (nine bases and outposts from Mount Hermon to Daraa and Quneitra per ACLED, June 2026; 84 ground incursions in May 2026 alone) and its defence minister says
    the troops stay 'for an unlimited period'; Syria has no air defence to contest it and the 1974 line is unenforced.
  it: ''
- hash: 692e369c
  kind: cards
  en: 'Unfinished minority files: the March 2025 coastal killings (about 1,400 dead per the UN Commission of Inquiry, which found probable war crimes by government-linked forces and by Assad loyalists),
    Suwayda outside state control since the July 2025 Druze-Bedouin-government clashes (a National Guard under Sheikh Hijri, fighting again on 31 Aug 2026), and a Kurdish integration still more declared
    than tested.'
  it: ''
- hash: a14eedab
  kind: cards
  en: 'A thin counter-terror capacity and a US exit: US forces left Tanf (11 Feb 2026) and reportedly Shaddadi, about 1,000 remain, and more than 5,700 ISIS detainees were moved to Iraq (21 Jan - 12 Feb
    2026) because the camps could not be held; analysts doubt Damascus can fill the gap. A US soldier-and-interpreter killing at Palmyra (13 Dec 2025) shows the exposure.'
  it: ''
- hash: 7dffd7bd
  kind: cards
  en: 'Sanctions relief is conditional on conduct: the Caesar repeal carries a review every 180 days for four years (counter-ISIS, minority rights) and allows targeted sanctions if Damascus ''is off track'';
    the EU keeps Assad-related and security listings; Egypt rejected a Syrian ambassador in June 2026 and Iraq''s Shia factions blocked al-Sharaa from the 2025 Baghdad Arab League summit.'
  it: ''
- hash: 27f76190
  kind: cards
  en: 'Refugee and foreign-fighter pressure from outside: Germany''s chancellor said 80% of the 900,000 Syrians in Germany should return within three years (March 2026), which Damascus says it cannot absorb,
    and China presses to remove about 20,000 Uyghurs it fears (and Damascus has pledged that no group will threaten Chinese interests).'
  it: ''
- hash: d9a88c49
  kind: cards
  en: Turkish protection against Israel draws the Israeli fire it is meant to deter. Ankara's training, air-defence and base plans are the reason Damascus feels able to resist Israeli demands, yet Israel
    struck the runway of Abu al-Duhur eight times on 18 Aug 2026 precisely because Syria was about to host Turkish troops ('we will not tolerate a Turkish military foothold moving south'); Damascus then
    cut contact with Israel before returning to the talks on 23 Aug.
  it: ''
- hash: f1525f1f
  kind: cards
  en: Winning the east removed the buffer that held the Islamic State. Taking over the SDF's territory, camps and prisons in January 2026 gave Damascus unity on paper, but the US then left Tanf and Shaddadi
    and moved the detainees to Iraq, so the state that wanted to show itself as an indispensable counter-ISIS partner now carries the weight of the fight with a young army and fewer American eyes.
  it: ''
- hash: 5a543852
  kind: cards
  en: Using force to unify the state produces the violence that Western money and Israel's pretext depend on. The coastal killings of March 2025 and the Suwayda clashes of July 2025 each came out of an
    attempt to extend control, and each handed critics a condition (the 180-day Caesar review, the UN inquiry) and handed Israel a protector's role over the Druze; Sweida's Hijri now rallies for Israel.
  it: ''
- hash: 3adf8f5d
  kind: cards
  en: Closing the door on Moscow weakens the one great power that could police the south. The 9 Aug 2026 memorandum turns Hmeimim and the Tartus berth into joint training centres and wins Western favour,
    but a Syrian source said before the January 2026 Moscow talks that al-Sharaa might ask for Russian military police as a guarantor against Israeli encroachment (reported, not confirmed), and the exiled
    Assad is still in Russia. Distancing Russia raises Syria's exposure to the Israel and Turkey pair it has to balance.
  it: ''
- hash: dc1ebdad
  kind: cards
  en: The same army cannot face every front. The brigades sent against the Kurdish militias in January 2026 were moved to the Lebanese border in March, when the Iran war began; Trump's idea that Syria 'finish
    the job' against Hezbollah was disowned by al-Sharaa, who needs the border quiet to sell Syria as a corridor but would lose his Western credit if Hezbollah's supply line reopened.
  it: ''
- hash: ebc9f7ac
  kind: cards
  en: 'Dependence is the price of the independence on offer: every patron funds a different Syria. Qatar pays for gas to run the grid, Saudi Arabia and the UAE for ports and telecoms, Turkey for the army,
    Washington for the sanctions waiver, Brussels and Berlin ask for refugee return in exchange for the partnership deal. Diversifying the patrons protects al-Sharaa from any one of them and leaves him
    answerable to all of them at once (Damascus told Israel it will not accept limits on its alliances; the commitments already made are the limits).'
  it: ''
- hash: 4c45ed3a
  kind: cards
  en: 'Syria under Ahmed al-Sharaa runs the grand strategy of a victorious insurgency

    that has to become a state before its patrons lose patience. The rank order of the

    objectives is the order of the dangers: first the monopoly of force (the SDF

    deal, Suwayda, the coast), then legitimacy (delistings, sanctions relief, Caesar

    repeal), then money. The method is multi-alignment at the leader level, with no

    patron allowed to own the state: Turkey for the army, the Gulf for the cash,

    Washington for the permission to trade, Russia kept only as a training partner,

    Iran expelled. The Luttwak pattern is that each move that builds the state

    also invites an outsider into it: the Turkish umbrella draws the Israeli strike,

    the conquest of the east takes away the American cover, the pressure on

    minorities supplies the conditions that Western money carries. Signals that are

    not rows: the Syrian army''s deployment to the Lebanese border in March 2026,

    al-Sharaa''s refusal to attend the 2025 Baghdad summit, and Egypt''s refusal of a

    Syrian ambassador. Open question for the next review: whether the 25 Aug SDF

    dissolution survives its first test in Hasakah and Kobani, and whether an

    Israeli security agreement is signed or the south settles into a frozen

    occupation. Not read in this pass: Crisis Group and Carnegie analyses of 2026

    (the search budget ran out), so grades on Israel, Russia and China rest on press

    and official statements.'
  it: ''
- hash: c7ab9234
  kind: cards
  en: Keep the regime of Mahamat Idriss Déby in power. Putin praised him in January 2024 for having stabilised the country and offered help; the 2025 accounts of attacks near the presidential palace are
    not sourced here.
  it: ''
- hash: fccf6e6b
  kind: cards
  en: Keep the Sudan war off Chadian soil. The eastern border was closed indefinitely on 23 Feb 2026, citing Sudanese armed groups after fighting at al-Tina; Chad had expelled four Sudanese diplomats in
    December 2023, and Khartoum accuses N'Djamena of aiding the RSF.
  it: ''
- hash: 9c725e3d
  kind: cards
  en: 'Hold the Lake Chad and Libyan borders with partners: the MNJTF with Cameroon and Nigeria, mandated against Boko Haram and ISWAP, and a joint border force with Haftar''s LNA in the east (14 Nov 2025).
    The June 2026 preview says Chad has threatened to reduce or leave the MNJTF.'
  it: ''
- hash: 16b5480e
  kind: cards
  en: 'The Chadian army as the regional force: a column on the Niger-Libya border (press-reported ambush, 27 Feb 2026), the joint border force with the LNA, and the MNJTF contingent. The Lake Chad force
    has capability gaps, so the army carries the weight.'
  it: ''
- hash: bc9897ff
  kind: cards
  en: 'Multi-vector patronage since the French exit: Abu Dhabi''s field hospital at Amdjarass and rising military aid (2023-24), Putin''s welcome of January 2024, a planned Hungarian training mission of
    about 200 soldiers, and a Tripoli embassy. Each patron buys access; none has been shown to buy a guarantee.'
  it: ''
- hash: a1b826dd
  kind: cards
  en: The French guarantor is gone. Chad ended the defence accord in November 2024 (Le Monde, 29 Nov 2024), and France handed over its Faya base on 26 Dec 2024 and finished withdrawal in January 2025 (Stratfor).
    The army now needs other patrons for its own defence.
  it: ''
- hash: '65539510'
  kind: cards
  en: The shared security framework is thin. The MNJTF has persistent capability gaps (air assets, counter-drone systems, IED disposal) and its membership is contested in the sources; Chad's threat to pull
    out is the sharpest sign. Chad cannot count on the force as a shield.
  it: ''
- hash: d5597a9b
  kind: cards
  en: Chad closes the border against the Sudanese side of the RSF supply while taking Abu Dhabi's hospital, aid and cargo flights, which Khartoum and the reports call the RSF's western door. The closure
    answers a threat that the patron relation helps sustain.
  it: ''
- hash: 5b078045
  kind: cards
  en: Leaving France to gain room has brought promises rather than troops. Moscow and Budapest offered cooperation, but no Africa Corps presence in Chad is confirmed in sources found and the Hungarian mission
    had no confirmed start; the exit from a guarantor leaves the army with patrons it cannot see on the ground.
  it: ''
- hash: 2faedc96
  kind: cards
  en: 'Chad''s grand strategy is the survival of the Déby regime on borders it cannot seal: Sudan''s war, the Libyan east and the Lake Chad jihadists all press on one army. Having lost France as guarantor,
    N''Djamena spreads its patronage across Abu Dhabi, Moscow, Budapest and Haftar, and buys access more than protection. The gaps are the Zaghawa question (the clan''s Darfur kin among the RSF''s victims,
    a reading taken from the SDN card and not sourced here), the oil corridor, the Central African Republic, Cameroon and the United States, none yet sourced for this card.'
  it: ''
- hash: 2bf31d41
  kind: cards
  en: 'Be the bridge between the Sahel and the Gulf of Guinea: the Togo-Sahel strategy for 2026-2028, presented in Lomé on 18 April 2026 under the patronage of Council President Faure Gnassingbé, replaces
    the 2021 plan, aims to strengthen political dialogue with the Sahel states and presents Togo as a credible mediator.'
  it: ''
- hash: 23ddb505
  kind: cards
  en: 'Keep jihadist violence on the northern border from spreading south: the strategy names the persistent terrorist threat and its spread toward the coastal Gulf of Guinea states as the reason for updating
    its Sahel policy.'
  it: ''
- hash: cb355834
  kind: cards
  en: 'Mediation and dialogue: a six-session meeting in Lomé in April 2026 with governments, regional and international organisations, special envoys and civil society, meant to present the strategy and
    build political dialogue with the Sahel states.'
  it: ''
- hash: 429261cb
  kind: cards
  en: 'The terrorist threat is on its own border: the same strategy says insecurity is spreading toward the coastal states, so Togo''s Sahel diplomacy is also a security problem it must manage with the
    states it is talking to.'
  it: ''
- hash: 3f0aab87
  kind: cards
  en: 'The bridge runs to the states whose exit from ECOWAS and whose insecurity the strategy names as the problem: the strategy''s own reasons are the persistent terrorist threat, its spread toward the
    coast, and the Sahel states'' departure from ECOWAS. The closer Lomé draws to the AES, the more it takes on the exposure it wants to manage from outside.'
  it: ''
- hash: ad874f08
  kind: cards
  en: 'Togo''s strategy, as far as the sources opened for this card show, is to turn a small Gulf of Guinea state into the broker between the Sahel juntas and the coastal states, so that the jihadist war
    on its northern border is handled through talks rather than only through troops. The card is thin: one government-announced strategy (April 2026) is the only source opened, and the constitution and
    the 2025 protests, the Alliance of Sahel States membership question, the Port of Lomé''s role for landlocked Sahel states, and the Nigeria, ECOWAS, Ghana, Benin, France and China relations are not yet
    sourced at the level the card needs. Those are the gaps for the next pass.'
  it: ''
- hash: 86f56c43
  kind: cards
  en: 'Keep the established order at home intact: a monarchy protected by the lese-majeste law, and an army, courts and Senate that can remove or dissolve what the voters elect, with a conservative-business
    coalition in government. The 2025-26 cycle is the proof: Paetongtarn Shinawatra was removed by the Constitutional Court (6-3, 29 Aug 2025), Anutin Charnvirakul took over (5 Sep 2025), called a snap
    election and won it (Bhumjaithai 192 of 499 seats on 8 Feb 2026), and an amnesty law in force from 24 Aug 2026 covers political offences from 2005 to July 2025 but excludes Section 112.'
  it: ''
- hash: b80c5593
  kind: cards
  en: 'Settle the Cambodian frontier on Thai terms and keep it bilateral: hold the positions taken in 2025, send boundary questions only to the Joint Boundary Commission, and make demining, no new violations
    and action on the scam compounds the price of normal relations. Bangkok cannot be seen to concede: the leaked call with Hun Sen cost Paetongtarn her office, and the Cambodian fighting was the setting
    in which Anutin called his election.'
  it: ''
- hash: 905bf354
  kind: cards
  en: 'Stay on good terms with every great power and join none of their blocs: treaty ally and Major Non-NATO Ally of the United States (Cobra Gold, a tariff framework), China''s economic and now defence
    partner (high-speed rail, a 2+2 mechanism, a Chinese submarine), a summit with Putin in Kazan, an EU free-trade agreement in the making, and Swedish jets instead of American ones.'
  it: ''
- hash: d2959978
  kind: cards
  en: 'Protect an export-and-tourism economy that sells abroad the equivalent of 71% of GDP: lock in market access (a US framework at a 19% reciprocal rate, an EU agreement with 15 of 24 chapters closed
    by June 2026, a Eurasian Economic Union agreement mooted) and manage the shift of its largest industry, cars, from Japanese to Chinese brands.'
  it: ''
- hash: 3e6317af
  kind: cards
  en: 'Contain the Myanmar collapse and the criminal economy that grew on the 2,400 km frontier (scam compounds, drugs, refugees) by working with whoever holds the ground: the junta first (''it''s not about
    legitimacy, it''s about reality''), while keeping a dual track with the other side of the border.'
  it: ''
- hash: 4e707049
  kind: cards
  en: 'End the southern insurgency without internationalising it: a Malaysia-facilitated dialogue with the BRN, a new chief negotiator (the intelligence chief, appointed in May 2026) and a high-level round
    planned in Malaysia in September, with decentralisation and amnesties reportedly on the table.'
  it: ''
- hash: 9bf460bc
  kind: cards
  en: 'Omnidirectional hedging at leader level: Xi Jinping received Anutin in Shanghai on 17 Jul 2026 (joint statement, a new 2+2 mechanism for foreign affairs and defence); Putin met him in Kazan on 18
    Jun 2026; Trump and he exchanged letters and agreed a trade framework on 26 Oct 2025; Modi''s strategic partnership (Apr 2025) and Vietnam''s comprehensive strategic partnership (May 2025) complete
    the set. Nothing is added to the American treaty and no bloc is joined.'
  it: ''
- hash: 6f8fe325
  kind: cards
  en: 'ASEAN as an envelope, not a referee: Bangkok accepted Malaysia''s chairmanship mediation (Putrajaya talks and ceasefire from 28 Jul 2025; Kuala Lumpur declaration of 26 Oct 2025) when Washington''s
    tariff threat made refusal costly, then kept the boundary question bilateral through the Joint Boundary Commission; both sides use ASEAN Observer Teams to support competing accounts (Crisis Group).'
  it: ''
- hash: a86cbf8e
  kind: cards
  en: Force on the frontier and diversified kit. Thai forces hold much of the high ground and land on both sides of the contested line (Crisis Group), after air strikes in the 2025 fighting; the air force
    chose Swedish Gripen E/F over the American F-16 despite US lobbying (four aircraft, about SEK 5.3bn, signed 25 Aug 2025, inside a 12-aircraft plan); the navy buys a Chinese S26T submarine. Cobra Gold
    2026 (24 Feb-6 Mar, about 8,000 troops from 30 nations) keeps the American channel open.
  it: ''
- hash: 96bcc466
  kind: cards
  en: Border trade as a lever and market access as a shield. Bilateral trade with Cambodia fell 40% to USD 1.3bn in the first half of 2026 as relations froze; power, internet and fuel to five Myanmar border
    areas were cut on 5 Feb 2025 to pressure the scam compounds; and the tariff framework with Washington (tariff barriers removed on about 99% of US goods, USD 5.4bn a year of energy, 80 Boeing aircraft)
    is the price of the 19% rate.
  it: ''
- hash: 2e6f63be
  kind: cards
  en: 'A nationalist frame for the Cambodian war, a realist frame for Myanmar. The foreign ministry''s weekly briefing publishes Thailand''s version of each incident (6 Jan 2026 Chong Bok shooting: no retaliation,
    a formal protest); Anutin''s snap election was called during the fighting, which analysts read as an attempt to capitalise on nationalism; on Myanmar the line is ''it''s not about legitimacy, it''s
    about reality''.'
  it: ''
- hash: 9f539159
  kind: cards
  en: The establishment's veto over any prime minister. The Constitutional Court removed Paetongtarn over a leaked call with Hun Sen (June 2025), on a petition that had reached it through the Senate president;
    no government can be seen to yield on Cambodia. The People's Party (120 seats, the largest opposition) is outside, and Anutin governs with the party of the Shinawatras the court removed.
  it: ''
- hash: 44a67e7f
  kind: cards
  en: 'The monarchy and the lese-majeste law are off the table. The amnesty in force from 24 Aug 2026 (about 6,000 people) excludes Section 112: of roughly 290 people charged since 2020, only about 10 were
    expected to benefit, and on 16 Jul 2026 the Chiang Mai appeal court upheld Arnon Nampa''s conviction. The same taboo caps what any government can say about reform at home and what partners can press.'
  it: ''
- hash: 9d6c10e6
  kind: cards
  en: 'A war that cannot be won or ended alone. The frontier has been quiet since the ceasefire of 27 Dec 2025 but is unsettled: Crisis Group rates the immediate prospects for a settlement as poor, bilateral
    trade has collapsed, the Joint Boundary Commission is stalled, and Cambodia keeps protesting Thai trenches and a power-grid extension (10 Aug 2026). The first truce came only after Washington told both
    sides there would be no trade deal while the fighting went on.'
  it: ''
- hash: 132dae31
  kind: cards
  en: 'Dependence on foreign demand: goods and services exports were 71.1% of GDP in 2025, and tourism receipts were 19.9% of exports in 2019, the last year with a value in the World Bank series. The United
    States imposed a 12.5% tariff on Thai imports in July 2026 and the reciprocal agreement is still unsigned; Japanese carmakers, the industry''s core, are losing share to Chinese brands.'
  it: ''
- hash: 411dcda7
  kind: cards
  en: A frontier it cannot seal, beside a neighbour it cannot govern. The scam compounds of Myawaddy and Shwe Kokko were the target of the Feb 2025 power cut, which analysts expected would only make them
    move or find other power and internet; the war in Myanmar has killed more than 100,000 people (ACLED, quoted by Al Jazeera); and Bangkok's engagement with Naypyidaw draws fire from the Special Advisory
    Council for Myanmar.
  it: ''
- hash: aaf3f7bc
  kind: cards
  en: 'An insurgency in the Malay-Muslim south that has outlasted every government: violence continued through June 2026 (a roadside bomb at Tak Bai on 29 June injured two Malaysians) while the BRN says
    the talks remain the route; the facilitator is Malaysia, which was also the ASEAN mediator on Cambodia, so one neighbour holds two of Bangkok''s problems.'
  it: ''
- hash: 9d1302fc
  kind: cards
  en: The patron treated the ally like the foe. Thailand holds the 1954 treaty and Major Non-NATO Ally status, yet in July 2025 Trump told both Bangkok and Phnom Penh that there would be no trade deal while
    the fighting went on; the ceasefire of 28 Jul followed his calls, and Washington then branded the October accord as its own. Bangkok held the ground but not the terms of the ending.
  it: ''
- hash: f98e5883
  kind: cards
  en: Diversifying away from American arms created a Chinese dependency. The Gripen order (Aug 2025) displaced the F-16, but the S26T submarine ordered from China was specified with a German MTU engine
    that Germany would not release for it; a revised contract (September 2025) substitutes the Chinese CHD620 and delivery is expected at the end of 2028, with further boats left to be decided after the
    first. The hedge meant to reduce reliance on one supplier puts the navy's first submarine in the hands of another supplier's engine.
  it: ''
- hash: 60d470bd
  kind: cards
  en: The deportation that pleased Beijing cost goodwill in Washington. On 27 Feb 2025 Thailand sent 40 Uyghur men to China despite assurances that it would not; on 14 Mar 2025 Rubio announced visa restrictions
    on the current and former Thai officials responsible, and Bangkok could only say that it had 'received assurances' from China about their safety.
  it: ''
- hash: 9a8c751d
  kind: cards
  en: The border closure punishes the economy it is meant to protect. Bilateral trade with Cambodia fell 40% to USD 1.3bn in the first half of 2026, yet Crisis Group finds that Thailand has little incentive
    to change the status quo because it holds the high ground; the cost falls on the border provinces while the dispute stays open.
  it: ''
- hash: 0c943ff6
  kind: cards
  en: The court that removed a Shinawatra made the Shinawatras indispensable. After Paetongtarn's removal (Aug 2025) the conservatives won 192 seats in February 2026 but, short of a majority, formed the
    government with Pheu Thai, Thaksin's party, which took the coalition to about 292 of 499 seats; Anutin was re-elected prime minister on 19 Mar 2026 with 293 votes.
  it: ''
- hash: 21b841b5
  kind: cards
  en: Engagement with the junta in the name of order may disturb the order on the border. Bangkok hosted Min Aung Hlaing and then the new army chief Ye Win Oo in August 2026 to secure cooperation on drugs
    and scams, eighteen months after cutting power to its border towns; Burma News International weighs that the engagement may heighten pressure on the border, and the Special Advisory Council for Myanmar
    says Thailand 'torched its credibility'.
  it: ''
- hash: a3a57dfa
  kind: cards
  en: 'Thailand is the textbook of a state that survives by bending: treaty ally of the

    United States, economic partner and now arms customer of China, summit

    partner of Putin and Modi, comprehensive strategic partner of Vietnam, and it

    has not paid the price of joining any camp. What 2025 added is the rest of

    Luttwak''s lesson: the same state that yields to every great power fought its

    small neighbour, and in that war the bending came back. Bangkok held the ground

    (Crisis Group: it holds the high ground and land on both sides of the line)

    but the end of the war was set in Washington and Putrajaya, by a tariff threat

    to both belligerents, and the accord that Trump named for Kuala Lumpur was

    suspended by Thailand within a fortnight of signing. The domestic cycle runs on

    the same logic. The courts that removed Paetongtarn over a telephone call to

    Hun Sen made the border a test of loyalty, Anutin took office on it, called his

    election in the middle of the fighting and won 192 seats, and has to govern

    with Thaksin''s party; the monarchy and Section 112 stay outside every bargain,

    the 2026 amnesty included. Adversary or rival: Thailand''s grade of Cambodia is

    rival, because neither government seeks the other''s end (the 27 Dec 2025

    statement commits both to demarcation through the Joint Boundary Commission and

    ICG''s recommendations are about a thaw), though the fighting was the deadliest

    between the two in decades. Three signals are not rows: Anutin was the first

    ASEAN leader to congratulate Min Aung Hlaing as president (April 2026) and

    hosted him in August, a thaw that reverses the 2025 power cut; the United

    States put a 12.5% tariff on Thai goods in July 2026 while the reciprocal

    agreement is described as ''at the last paragraph''; and the Cambodian frontier

    stays shut to trade while both sides insist that the ceasefire holds. Relational

    manoeuvre against Thailand therefore does not pass through its alliances but

    through its seams: a treaty ally that buys Chinese submarines and Swedish jets,

    a neighbour of Cambodia that needs a Malaysian mediator and an American

    patron to end its own war, and a junta it needs more than it respects.'
  it: ''
- hash: e9068862
  kind: cards
  en: Keep the Rahmon line and hand it to the family. Rustam Emomali, Dushanbe mayor since 2017 and Senate chairman since April 2020, is the constitutional successor if his father cannot serve; a 2025 personnel
    reshuffle is read as a glide path toward him. Rahmon, 73, has no successor outside the family.
  it: ''
- hash: c5e0776d
  kind: cards
  en: Keep Afghan soil from serving the armed opposition. The NRF (mostly ethnic Tajik, leadership reported in Tajikistan) and Jamaat Ansarullah fight in the north-east of Afghanistan, and Dushanbe wants
    Kabul to stop the harbouring and cross-border raids that reach its own frontier.
  it: ''
- hash: 8aaedded
  kind: cards
  en: Turn water and power into the national project and into leverage over the downstream states. Rogun, to be the world's tallest dam at 335 m, is the flagship; Uzbekistan has signed a 20-year power purchase
    framework for it.
  it: ''
- hash: e453096f
  kind: cards
  en: Russia's 201st base, about 7,000 Russian troops in Dushanbe, Qurghonteppa and Kulob under a lease to at least 2042, plus a reported Chinese security installation at Shaimak in Gorno-Badakhshan that
    both governments deny. The base is the only large foreign garrison in the country; the Chinese post is reported, not confirmed.
  it: ''
- hash: 24882d11
  kind: cards
  en: Labour exports and hydropower. Remittances, about 48% of GDP in 2024 and mostly earned in Russia, keep the budget and households afloat; Rogun is the state's bid to sell power downstream, with Uzbekistan
    contracting 20 years at USD 0.034/kWh (the price per Fergana and Eurasianet reporting, not verified against the contract).
  it: ''
- hash: 62121cd3
  kind: cards
  en: 'Border settlement as a tool: a Treaty on Allied Relations with Uzbekistan (18 Apr 2024), and the Kyrgyz border treaty of 13 Mar 2025, which closes the most dangerous frontier in the region after
    the 2021-22 clashes.'
  it: ''
- hash: 526c240f
  kind: cards
  en: A labour market it does not control. Remittances are about 48% of GDP, most from Russia; after the Crocus attack of March 2024, Russian police raided Central Asian workers and deported Tajik citizens,
    which hits the money that keeps the state solvent.
  it: ''
- hash: 2a65f3fd
  kind: cards
  en: A frontier it cannot hold alone. The Afghan border saw the first direct firefight with the Taliban since 2021 (24 Aug 2025, Panj River), further clashes in October and December 2025, and an attack
    that killed Chinese workers on 26 Nov 2025. Dushanbe depends on Russian and Chinese help to police it.
  it: ''
- hash: f9052e7e
  kind: cards
  en: Debt to its first creditor. China holds the largest share of external debt, over USD 700m of about USD 3.04bn at 1 Oct 2026 (Times of Central Asia; share in 2016 was about half). The Chinese loans
    are the reason Beijing has leverage in Dushanbe.
  it: ''
- hash: 9f7787ce
  kind: cards
  en: Russia guards the regime and the border and also takes the wages that feed it. Its 201st base and CSTO membership keep Rahmon in power, while Russia's post-Crocus crackdown on migrants (raids, expulsions)
    cuts the remittances that carry the budget; the protector is also the squeeze.
  it: ''
- hash: 4991b22d
  kind: cards
  en: 'Tajikistan is a small, poor, landlocked state run as a family business and kept alive by the labour of its men in Russia. Its survival rests on three outside pillars: the Russian garrison and the
    CSTO, a Chinese creditor and security presence in the Pamirs, and the water and power it hopes to sell downstream. The Taliban are its only open enemy in the region, and the threat Dushanbe fears most
    - ISIS-K and Tajik jihadists - is also the one that Russia''s crackdown on migrants made worse.'
  it: ''
- hash: ea20178a
  kind: cards
  en: 'Keep the permanent neutrality recognised by the United Nations in 1995 as the whole strategy: no bloc, no troops, no basing, so that every great power can deal with Ashgabat and none can make it
    take sides.'
  it: ''
- hash: a006c874
  kind: cards
  en: 'Sell gas through several pipes at once so that no single buyer can cut the flow: China takes most of it, Iran and Turkey take a swap, Afghanistan is to take TAPI, and the EU is the hoped-for Trans-Caspian
    outlet.'
  it: ''
- hash: 7e728aab
  kind: cards
  en: 'Hand power from father to son without visible rupture: Serdar Berdimuhamedov has been president since 19 March 2022 while Gurbanguly Berdimuhamedov holds the title of National Leader and chairs the
    People''s Council.'
  it: ''
- hash: 02c65f77
  kind: cards
  en: 'Multi-vector diplomacy as the neutrality in practice: the US-Central Asia (C5+1) summit in Washington in November 2025, observer status in the Organization of Turkic States since 2021, a sitting
    member of the UN, IMF, World Bank, ECO and OSCE, and an INOGATE partnership with the EU.'
  it: ''
- hash: 5cddb0cb
  kind: cards
  en: 'Gas as the only instrument of foreign policy: exports to China through the Central Asia-China pipeline are the main source of foreign exchange, and every other route (the Iran swap to Turkey, the
    TAPI line to Afghanistan, the Trans-Caspian pipeline) is a bid for a second buyer.'
  it: ''
- hash: 5a9c80a1
  kind: cards
  en: 'Landlocked and boxed in: the Caspian legal status is unsettled, and Russia and Iran oppose the Trans-Caspian line on environmental and legal grounds, so the only route to Europe is blocked by two
    of its neighbours.'
  it: ''
- hash: e51b0c25
  kind: cards
  en: 'One dominant buyer: China takes more than three-quarters of Turkmen gas exports, so the pipeline to China carries almost all the revenue; the Iran swap to Turkey was expected to reach only 1.3 bcm
    in 2025.'
  it: ''
- hash: e717b94a
  kind: cards
  en: 'Transit dependence: every second route passes through a state that Ashgabat cannot control (Iran for the swap to Turkey, Afghanistan for TAPI, whose Herat segment was 101 km laid by July 2026, self-reported).'
  it: ''
- hash: a08c8b27
  kind: cards
  en: The neutrality that keeps Ashgabat out of blocs also leaves it without a guarantor. The Trans-Caspian route to Europe needs the Caspian consensus that Russia and Iran withhold, and the Iran swap needs
    Iran's goodwill, so the policy that protects the regime also makes its export routes hostage to the very neighbours it refuses to join.
  it: ''
- hash: 5f751e11
  kind: cards
  en: 'Turkmenistan runs the strategy of a state that has bought its safety with one rule, neutrality, and spends it on gas: every great power gets a stake in the pipeline, none gets a base. Two decades
    of this have made China the decisive partner and left the other routes as options rather than income. The dynastic handover of 2022 has not changed the rule, so the card reads the leadership as a continuity
    of the same strategy.'
  it: ''
- hash: 68d7daad
  kind: cards
  en: Make the state budget outlive oil and gas. The Petroleum Fund stood at US$18.43bn at end-June 2026, but cumulative withdrawals (US$19.66bn) exceed what it has earned (US$12.65bn), and the IMF lists
    gradual fiscal consolidation to avoid its depletion as an urgent priority.
  it: ''
- hash: 076bbc06
  kind: cards
  en: 'Capture Greater Sunrise on Timor-Leste''s own soil: a pipeline to a new facility on the south coast rather than the Darwin route Woodside prefers, one production-sharing contract, a final investment
    decision targeted for 2029 and first gas in 2034-35.'
  it: ''
- hash: 96678b38
  kind: cards
  en: 'Anchor the state in Southeast Asia and the Portuguese-speaking world: full ASEAN membership from 26 Oct 2025 as the regional frame, and the CPLP as a Lusophone frame that is not a security alliance.'
  it: ''
- hash: 856c9d0d
  kind: cards
  en: A coordinated line between Prime Minister Xanana Gusmao (in office in 2026) and President Jose Ramos-Horta (in office since 2022), who hold regular coordination meetings. The line runs the ASEAN and
    CPLP agendas, and the president led the CPLP mission to Bissau after the Nov 2025 coup.
  it: ''
- hash: ac993975
  kind: cards
  en: 'The Petroleum Fund as the main instrument: US$600m was transferred to the budget in Q2 2026 alone. Timor Gap agreed to buy Osaka Gas Australia''s 10% of Greater Sunrise, which would raise its holding
    to 66.56%, subject to the single production-sharing agreement.'
  it: ''
- hash: 8d08c100
  kind: cards
  en: 'Grants and packages rather than loans: Japanese grants (440m yen of road machinery, Dec 2025; 3,093m yen for the Guido Valadares hospital, 2024) and an Australian package of US$220m for human development
    and US$80m for private-sector development (Jan 2026). Chinese Eximbank pledges for the Suai highway and Dili airport never became signed loan agreements.'
  it: ''
- hash: 20a2fbff
  kind: cards
  en: 'Fund arithmetic: the IMF projects the Petroleum Fund at US$12.8bn in 2030 against US$18.3bn in 2024, and oil production ceased in 2025, so nothing replaces the drawdown before the gas arrives.'
  it: ''
- hash: 8de29eac
  kind: cards
  en: 'No revenue from the main field before 2034: Greater Sunrise first gas has slipped to 2034-35, and the fiscal regime and production-sharing contract were still open in 2026.'
  it: ''
- hash: 514369fa
  kind: cards
  en: 'Small market, outside supplier: about 70% of goods on the market are Indonesian-origin, and USAID, a significant funder, was dismantled in 2025, so the bilateral packages from Canberra and Tokyo
    carry more of the weight.'
  it: ''
- hash: aa0d4f43
  kind: cards
  en: 'The pipeline demand can lift the value most and is also what delays first gas: each round of the Darwin-versus-south-coast dispute pushes production further out, while the fund that must bridge the
    gap keeps shrinking.'
  it: ''
- hash: 603848a3
  kind: cards
  en: 'Timor-Leste is a small, young state whose money is an oil fund spent faster than it grows, and whose one large asset is a gas field across a sea border settled in 2018 that it still cannot turn into
    revenue. Its foreign policy is a small state''s hedging: Indonesia is the market and the former occupier, Australia the paymaster with an open grievance over the 2004 spying case, China the source of
    finance it has mostly not signed for, and Portugal the language and identity it shares with the CPLP. ASEAN membership (October 2025) is the frame that makes it a regional state rather than a dependent
    one, and the bet is Greater Sunrise: if Canberra pays for a pipeline to the south coast, the gas becomes a bridge out of the fund; if it waits past the fund, Dili has no second currency.'
  it: ''
- hash: b3f287b1
  kind: cards
  en: Keep the monarchy's hand on the state while elected governments change. Prime Minister Sovaleni resigned in December 2024 hours before a no-confidence motion, after a clash with King Tupou VI; Eke
    stayed caretaker until the December 2025 vote, when parliament chose Lord Fakafanua, a noble and former Speaker, by 16 votes to 10.
  it: ''
- hash: 53c07054
  kind: cards
  en: Cut the debt to China and buy fiscal room. Over US$120 million is owed to Beijing (2024), roughly a quarter of GDP; about 80% of the payments due fall to China, and the bulk of the principal is due
    by 2028.
  it: ''
- hash: '68974770'
  kind: cards
  en: Lead the Pacific agenda through the Forum. Tonga hosted the 53rd Pacific Islands Forum Leaders Meeting in Nuku'alofa, 26-30 August 2024, with its prime minister as chair.
  it: ''
- hash: 0360a3b0
  kind: cards
  en: 'Labour mobility as a lever. Tongans work seasonally in Australia''s PALM scheme (2,680 in December 2025, down from about 6,035 in April 2022) and in New Zealand''s RSE scheme (about 1,676 in 2025/26
    per 1News; about 1,000 per the Deputy Prime Minister in July 2025: the two figures conflict).'
  it: ''
- hash: 343ed849
  kind: cards
  en: Balancing donors. Australia and New Zealand give aid and budget support (Australia added A$30 million of budget support, per Lowy); China lends and offers police help; the United States opened an
    embassy in May 2023 and signed a maritime security agreement in February 2026. Tonga draws on all of them and aligns with none.
  it: ''
- hash: e90a2b81
  kind: cards
  en: 'Forum and multilateral seats: a full member of the Pacific Islands Forum and its 2024 host, alongside the Commonwealth, UN and WTO memberships already in the datasets.'
  it: ''
- hash: c23977a4
  kind: cards
  en: Debt service. Lowy reports that in 2024 Tonga spends more on debt service than on health, and that repayments take more than a fifth of non-aid revenue at the peak.
  it: ''
- hash: 33044ec2
  kind: cards
  en: Small economy, exposed to disaster. The 15 January 2022 eruption and tsunami caused about US$90 million of damage, about 18.5% of GDP (World Bank rapid estimate), and cut the international cable for
    five weeks.
  it: ''
- hash: c6d84aa9
  kind: cards
  en: Remittance dependence. Remittances were about 44% of GDP in 2021 (about US$220 million), mostly from Tongans working seasonally abroad, so a shrinking labour scheme is a macroeconomic shock, not a
    side issue.
  it: ''
- hash: e45e8ca0
  kind: cards
  en: To secure its 2024 Forum, Tonga welcomed a Chinese police role while Australia, a principal patron, said China had no role in Pacific policing. The security help that looked useful for the summit
    cost goodwill with the patron whose labour schemes and budget support Tonga most needs.
  it: ''
- hash: 366fb5df
  kind: cards
  en: 'Tonga''s strategy is survival by balancing, not alignment: no treaty ties it to any patron, which is why every stance it holds is partner. Its money comes from Chinese loans it wants to shrink, Australian
    and New Zealand labour schemes and budget support it cannot do without, and remittances that make its economy a function of others'' payrolls. The King is the fixed point of Tongan politics; governments
    change by parliamentary vote inside the room the monarchy leaves them, and the eruption recovery and the China debt are the two tests of the next years.'
  it: ''
- hash: 3a158f69
  kind: cards
  en: 'Keep Atlantic LNG running on gas from Venezuela. The Dragon field is the route: Atlantic LNG produces below nameplate capacity for want of gas, and the energy minister puts the first Dragon deliveries
    at Q3 2027. Caracas froze the gas arrangements in October 2025, so the goal depends on Venezuela''s consent.'
  it: ''
- hash: b2e8c17a
  kind: cards
  en: Keep Washington close while Caracas is hostile. Persad-Bissessar backed the US boat strikes of 2025, and a US warship docked in Trinidad in October 2025 despite the protests from Caracas. The US security
    tie is what Port of Spain offers for the gas it needs from Venezuela.
  it: ''
- hash: 45335c20
  kind: cards
  en: 'Access to Washington. The US Treasury licence (OFAC) for the Dragon project, which the attorney general announced in October 2025, and the US warship visit of the same month are the two levers. Nation
    News later reports the licence revoked in April 2026, while the Trinidad Express account describes it as ongoing: the sources conflict and both are kept.'
  it: ''
- hash: b00e60d1
  kind: cards
  en: Gas shortage and one neighbour. The nearest gas is the Dragon field, shared with Venezuela, and Caracas froze the 2025 accord and declared the prime minister persona non grata. Venezuela's vice president
    had already said any gas exported has to be paid for.
  it: ''
- hash: f40a0a40
  kind: cards
  en: 'A small energy economy with one market for its gas. The Trinidad economy is mainly industrial and built on oil and gas reserves (Wikipedia, tier 4: a pointer, not a source of record). The gas-shortage
    constraint is the same fact seen from the plant: the LNG train runs below capacity.'
  it: ''
- hash: 9afc8cfa
  kind: cards
  en: The moves that bought US backing for the Dragon licence, the support for the boat strikes and the warship visit, are the moves Caracas used to freeze the gas accord. The alignment that unlocks Washington's
    permission is the one that closes the Venezuelan molecules Trinidad needs.
  it: ''
- hash: 2ba80f85
  kind: cards
  en: Trinidad and Tobago plays for gas. Its LNG plant runs below capacity, and the field it needs, Dragon, is shared with Venezuela, so the strategy is to buy Venezuelan molecules with a visible loyalty
    to Washington. That loyalty brought a US licence and a warship visit, and Caracas answered in the same month by freezing the accord; the first deliveries, due in 2027, depend on a neighbour Port of
    Spain has angered and a patron it has courted.
  it: ''
- hash: 8781de9f
  kind: cards
  en: 'Keep the presidency in control after the 2021 power grab: Saied took 90.69% of the vote in October 2024 on a turnout of 28.8%, and the April 2025 conspiracy case jailed dozens of opposition figures
    and lawyers, with 34 sentences of 5 to 45 years upheld on appeal in November 2025.'
  it: ''
- hash: baa46509
  kind: cards
  en: 'Finance the state without the IMF: the 2022 accord collapsed over subsidy cuts Saied refused, so Tunis services its debt (a EUR 740m tranche repaid in mid-July 2026) with bilateral and Afreximbank
