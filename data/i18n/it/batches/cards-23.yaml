  it: ''
- hash: 5fd5e51e
  kind: cards
  en: 'Turn migration control into European money and legal mobility: the July 2023 EU memorandum (EUR 150m paid in 2024 once the Commission judged its conditions met), the Italian memorandum of January
    2026 (4,000 legal work entries a year), and the visas Tunisians still need (Schengen refusals were 19.6% in 2025).'
  it: ''
- hash: d306b165
  kind: cards
  en: 'Migration as currency: memoranda with the EU and Italy trade departures for legal channels and money; the Algeria-Egypt-Tunisia format on Libya (Cairo, May 2025) gives Tunis a seat on its neighbour''s
