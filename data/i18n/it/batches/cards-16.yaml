# Translate every `en` into it. Write the translations to the file cards-16.out.yaml next to this one,
# as `items:` of `- hash: <same hash>` / `it: <translation>`, appending one item at a time (valid YAML at
# every step), never editing this file. Keep names, dates, numbers and quotes; register of a foreign-office
# brief: dry, precise, no flourish.
lang: it
items:
- hash: 64af5b99
  kind: cards
  en: 'A Saudi camp that has stopped containing and is organising: a 14-state naval defence coalition announced on 30 July 2026 and operating from Jeddah since 13 August, a defensive pact with Pakistan
    and Turkey not yet tested, roughly doubled arms and logistics for the government, US intelligence and targeting data (though Trump declined a Saudi request for air strikes on 10 September), and an end
    to the Saudi-Emirati rivalry that fragmented the anti-Houthi camp, by the Emirati exit of 30 December 2025.'
  it: ''
- hash: e65f9e00
  kind: cards
  en: 'Recognised pariah status: a UN Security Council sanctions regime with an arms embargo, asset freeze and travel ban (renewed 13 Nov 2025, 13 votes, Russia and China abstaining), the US FTO/SDGT designation,
    and the detention of at least 69 UN staff (4 Jan 2026), which led the UN to suspend operations in Saada and keeps aid money away.'
  it: ''
- hash: 710da5f3
  kind: cards
  en: The deal they wanted died of the pressure that was meant to win it. Sana'a Center experts read the July-October 2026 escalation as a bid to force Riyadh back to the 2023 roadmap before a US-Iran deal;
    the result was Riyadh's switch 'from containment and negotiated roadmaps to sustained pressure' (a Saudi-organised naval coalition, a doubled arms flow, air strikes on Sanaa airport, and on Mocha according
    to Houthi media), and the roadmap is, in the Sana'a Center's words of April, 'no longer viable'. The harder they hit the Kingdom, the less it can pay.
  it: ''
- hash: 0a1cac80
  kind: cards
  en: 'Leverage over shipping is a wasting asset: every closure teaches the world to bypass it. The Red Sea campaign (November 2023 - 2025) pushed carriers around the Cape and Egypt lost about USD 7bn of
    canal revenue, but the 2026 blockade doubled insurance rates, sent Aramco crude through Sidi Kerir, brought 14 states into a naval coalition and pushed Egypt and Saudi Arabia into closer alignment.
    The strait is worth most to the Houthis unclosed, with the threat in reserve - which is how they used it between October 2025 and July 2026.'
  it: ''
- hash: 89f4cb87
  kind: cards
  en: 'A war fought ''for Gaza'' that left them without a cause when Gaza went quiet. The Houthis halted attacks on Israel and shipping after the ceasefire of 10 October 2025 (a letter from chief of staff
    al-Madani promised to resume if Israel did), kept off the shipping lanes (firing on Israel again only on 28 March 2026, in the Iran war), and then needed a new casus belli: the Saudi ''siege'' of Yemen,
    from July 2026. The Palestinian justification was borrowed; the Saudi one is real and far more dangerous.'
  it: ''
- hash: 06a1346e
  kind: cards
  en: Dependence on Iran grows exactly when Iran may sell them. The Houthis moved on Riyadh and the coast while Iran held the Hormuz card, with IRGC advisers in Sanaa and a Mahan Air flight from Tehran;
    but a US-Iran settlement, which Sana'a Center experts expect to come at their expense, would strip the patron's cover. Escalation is a race to be paid for before the patron settles, and by staking everything
    on that race they lose the autonomy the Houthis most prize.
  it: ''
- hash: 801774d7
  kind: cards
  en: They answer a 'siege' by besieging themselves. The July 2026 trigger was an unauthorised Iranian Mahan Air flight to Sanaa airport, which the government and Saudi coalition struck on 13 July; the
    airport was already shut by Israeli strikes; the Houthis replied with missiles on Abha and a blockade of Saudi shipping, which shut Riyadh airport in October and invited the very air campaign they say
    is the siege. The detention of UN staff cut aid to Saada while the leader blames Riyadh for hunger.
  it: ''
- hash: 4bfa459c
  kind: cards
  en: A movement that rules by fear is spending its recruiting base. Child recruitment (62 documented cases in the second quarter of 2026), 'human waves' on the west coast, tribal gatherings against Houthi
    abuses and the Sana'a Center's own verdict that internal discontent is the group's 'most enduring threat' show the cost of a war machine that needs ever more sons from a population it cannot pay.
  it: ''
- hash: 192cb278
  kind: cards
  en: 'The Houthis are the clearest case in the atlas of a small actor that turned a

    distant war into leverage over world shipping, and 2026 is the year in which

    that leverage reached its culminating point. The Gaza war gave them a

    justification, an audience and a free hand against the one trade route that

    ties Asia to Europe; the 2025 US and Israeli campaigns cost them ports,

    ministers and a chief of staff but not the capacity to hurt; the Iran war and

    the closing of Hormuz then made Bab al-Mandab the only maritime outlet of the

    Gulf, and on 3-11 September 2026 they took the whole Yemeni coast and Mayyun

    to sit on it. In Luttwak''s terms the movement has gone past the point where

    each further success buys proportionally more: it has stretched its lines

    into districts it cannot hold with consent, turned the Saudi restraint of

    2022-25 into a Saudi-run coalition, and made the Kingdom an enemy it cannot

    pay off, while the patron whose war created the opening is negotiating with

    Washington. What it can still do is keep the threat of closure alive and

    sell its absence, which is precisely what it did between the Gaza ceasefire

    and July 2026 and what it needs to restore. Signals that are not rows: Iran''s

    foreign minister said in March that Tehran did not need its allies to join

    its self-defence, the Houthis stayed out of the June 2025 war and waited four

    weeks in 2026 before firing on Israel, and the Houthi leadership told China

    and Russia their ships were not targets. All of it shows an actor that

    chooses its wars; the open question for the autumn of 2026 is whether it

    still can.'
  it: ''
- hash: ad9e809f
  kind: cards
  en: 'Take the state in Khartoum by force and replace the army-led government with its own. The RSF built a parallel Government of Peace and Unity (charter signed in Nairobi in Feb 2025, announced by Hemedti
    on 15 Apr 2025, seat Nyala). On 22 Sep 2026 Reuters reported Hemedti telling his troops that the time for fighting had come. The aim is the state, not a truce: its humanitarian truce of 6 Nov 2025 was
    a tactical pause.'
  it: ''
- hash: a465817d
  kind: cards
  en: 'Win recognition for the parallel government. The African Union Peace and Security Council, the Arab League, Saudi Arabia, Qatar and Egypt rejected it in 2025, so the RSF has no state standing: its
    diplomacy runs through Nairobi, the Quad truce track and its allied groups (SPLM-N of al-Hilu) rather than through recognised embassies.'
  it: ''
- hash: f6d1e082
  kind: cards
  en: Hold Darfur and open the road to Kordofan and El Obeid. The RSF holds almost all of Darfur and parts of Kordofan; the army has been retaking Kordofan since January 2026 (Kadugli, Dilling, the Khartoum-El
    Obeid road in late July, al-Mazroub on 2 Oct 2026). Losing Kordofan would cut the RSF off from the centre, so the western and southern front is where the objective is decided.
  it: ''
- hash: 56db7573
  kind: cards
  en: Gold. The RSF seized key mines, the Sudan Gold Refinery and control of gold processing and exports through the RSF-linked Al Gunade company. Smuggled gold reaches the UAE, the main buyer, by routes
    through Libya, Chad, South Sudan and Egypt, with Dubai as the entry point. Gold revenue finances the war; the figures are reported, not audited.
  it: ''
- hash: 3663a072
  kind: cards
  en: The Darfur base and the supply lines that reach it. The base is Darfur and the Nyala seat; the reported arms and fighter routes run through Amdjarass in Chad and Kufra in eastern Libya (about 600
    flights to Kufra in 2025 by RFI count, UAE denied). The UN fact-finding mission of 3 Sep 2026 names Benghazi, Kufra and Jufra as hubs and says RSF fighters trained in Libya took part in the Zamzam attack
    (Apr 2025) and the El Fasher assault (Oct 2025).
  it: ''
- hash: c6e14d62
  kind: cards
  en: 'No recognised state and no sovereign routes. The parallel government is rejected by the African Union, the Arab League and most of the region, and the RSF has neither port nor airspace of its own:
    every reported supply line runs through a third state (Chad, eastern Libya, Ethiopia). Those doors can close: Chad shut its eastern border on 23 Feb 2026 and Kufra airport was shut for a month in Jan
    2026.'
  it: ''
- hash: 7ad7a614
  kind: cards
  en: Exposure to atrocity findings and sanctions. The US determined on 7 Jan 2025 that the RSF and allied militias committed genocide and sanctioned Hemedti; the El Fasher capture of Oct 2025 was followed
    by reports that more than 2,000 civilians were executed and by satellite images of burial and burning. Any patron that backs the RSF openly pays for it, and the record closes the Western door to any
    settlement that leaves the RSF with power.
  it: ''
- hash: 533ec2cb
  kind: cards
  en: The patron that arms the RSF is the reason it cannot be recognised. Abu Dhabi supplies the RSF, but the UAE is inside the Quad and Egypt, Saudi Arabia and the AU reject the parallel government as
    the UAE's creature. The more the UAE backs the RSF, the less the RSF can become a state, and the truce it accepts (6 Nov 2025) is one it negotiated through the same Quad.
  it: ''
- hash: 1c1848a4
  kind: cards
  en: Territory taken by massacre cannot be governed. El Fasher (Oct 2025) gave the RSF the army's last Darfur base and control of almost all of Darfur, but the atrocities made the genocide finding the
    frame of any settlement, and the army has since retaken Kordofan towns and claims momentum. A state needs the population it has terrorised; the means it used to take the territory are the ones that
    stop it from holding the state.
  it: ''
- hash: 9eedd676
  kind: cards
  en: 'The RSF is a militia that has tried to become a state: it took Darfur and the gold fields, and it declared its own government in 2025, but it has no recognition, its supply runs through the neighbours
    of Sudan, and the El Fasher record has made the genocide finding the frame of any settlement.

    On the Luttwak reading its central paradox is that the patron that makes it strong, the UAE, is also the reason it cannot be recognised, and the army''s retaking of Kordofan since January 2026 shows
    that a massacre can take territory without making a state.

    Its truces are tactical pauses, not a change of aim, so the state in Khartoum remains the objective and the war continues.'
  it: ''
- hash: a1d16736
  kind: cards
  en: 'Keep a Kurdish-run security and administrative core alive inside the Syrian state it has just joined: the January 2026 deal left Kurdish security forces in the cities of Hasakah and Qamishli, a Kobani
    brigade, a Hasakah governor chosen by the SDF (Noureddin Issa Ahmed, confirmed 13 Feb 2026) and a deputy defence minister (Sipan Hamo, 10 Mar 2026). Abdi announced the SDF''s dissolution as an independent
    force on 25 Aug 2026 and became an adviser to the presidency on 27-28 Aug; the aim is now to turn those posts into permanent guarantees.'
  it: ''
- hash: 9598688f
  kind: cards
  en: Write Kurdish language and political rights, and a decentralised state, into the constitution that Damascus is drafting. Abdi told Rudaw on 15 Aug 2026 that centralisation had failed and said after
    the dissolution that the struggle for the people's rights in the constitution 'will continue'; al-Sharaa's decree of 16 Jan 2026 (Kurdish a national language, Nowruz a holiday, citizenship for the stateless)
    is a decree, not a constitutional guarantee, and Kurdish-language education was still being negotiated in September 2026.
  it: ''
- hash: b2031c71
  kind: cards
  en: Stay indispensable to a patron. From 2015 the SDF's whole security rested on being the US ground force against ISIS (about 2,000 US troops in Dec 2024, under 1,000 after 2025, none after 16 Apr 2026).
    Washington's envoy said on 20 Jan 2026 that the SDF's 'original purpose' as the primary anti-ISIS force 'had largely expired'; the SDF now tries to convert the counter-ISIS record into standing with
    France, the Barzani family in Erbil and the US Congress.
  it: ''
- hash: b04baaae
  kind: cards
  en: 'Hold the Kurdish national camp together: reconcile the PYD and the KDP-backed Kurdish National Council (the 26 Apr 2025 Kurdish unity conference in Qamishli, 130 delegates each, with a KDP envoy
    present; Abdi-Barzani meeting in Erbil on 16 Jan 2025) and widen the front to other minorities (the Hasakah ''unity of components'' conference, 8-9 Aug 2025, with the Druze leader Hijri and the Alawite
    sheikh Ghazal by video).'
  it: ''
- hash: 7abbef2a
  kind: cards
  en: 'Protect the population of the Kurdish heartland (Kobani, Qamishli, Hasakah, Afrin returnees, Sheikh Maqsoud) from a second Afrin: the government assault on Sheikh Maqsoud (6-10 Jan 2026) displaced
    tens of thousands, Kobani was besieged in January, and the deal gives it a brigade of its own and a demilitarisation clause.'
  it: ''
- hash: 3819690a
  kind: cards
  en: Keep an economic base (oil and gas, border crossings, the Tishrin and Tabqa dams) - now largely lost. Damascus took the Omar and Conoco fields, Tabqa, Raqqa and eastern Deir ez-Zor between 17 and
    19 Jan 2026 and the 18 Jan agreement handed over every field, crossing and prison; what is left is the Hasakah heartland and a place on the state payroll.
  it: ''
- hash: cd7abc83
  kind: cards
  en: 'The YPG/YPJ core and an Arab-majority wider force built and trained under the US-led coalition since 2015: it took Raqqa (2017) and Baghuz (2019), held Tishrin Dam and Kobani against the SNA and
    Turkish drones in December 2024-April 2025, then chose not to fight the government in January 2026 - Abdi withdrew from Deir Hafer on 16-17 Jan ''on calls from friendly countries'' and from Raqqa and
    Deir ez-Zor on 18 Jan ''to prevent civil war''. About 6,000 members had entered the army by July 2026 (a government source) and four brigades by 3 Aug.'
  it: ''
- hash: 02e00dbb
  kind: cards
  en: 'Patron-hopping through three channels: Washington (CENTCOM, Barrack, Rubio at Munich on 13 Feb 2026, Senators Graham and others), Erbil (Masoud and Nechirvan Barzani as hosts of the 17 and 22 Jan
    2026 meetings and offered guarantors) and Paris (Macron, 13 Feb 2026), with the Autonomous Administration''s foreign-relations head Ilham Ehmed writing to the Security Council on 21 Jan 2026. It never
    won recognition: only Russia occasionally backed federalisation.'
  it: ''
- hash: 3d5a3572
  kind: cards
  en: Own media (SDF Press Center, Hawar News, North Press) and the Rojava Information Center - all partisan, tier 3 or statements only - carried the case that Damascus broke the 18 Jan withdrawal agreement
    and that Turkey flew drones over Hasakah; Western press picked up the 'abandoned ally' frame (The National, 6 Feb 2026).
  it: ''
- hash: 7a235b5d
  kind: cards
  en: 'Until January 2026 the oil and gas fields of Deir ez-Zor and Raqqa, the border crossings (including Semalka to the Kurdistan Region) and the Tabqa and Tishrin dams paid the administration''s bills;
    the 18 and 30 Jan agreements moved all of it to Damascus, and civil servants went onto the state payroll (3 Aug 2026: integration 70% complete). The ISIS detention system was a liability and a bargaining
    chip that the SDF gave up in the same weeks.'
  it: ''
- hash: 91e077c9
  kind: cards
  en: 'Geography and demography: an enclave without a port or a friendly border (Turkey to the north, Damascus to the south and west), whose Arab-majority provinces were held by consent that evaporated.
    Arab tribal leaders in Deir ez-Zor told Reuters on 17 Jan 2026 they were ready to take up arms against the SDF; Arab units in Raqqa defected; tribal forces took Raqqa, Shaddadi and the southern villages
    of Hasakah while the army advanced.'
  it: ''
- hash: ea0bdc46
  kind: cards
  en: 'The patron has left: the US completed its withdrawal on 16 Apr 2026 (Trump ordered it in February), Syria joined the Global Coalition against ISIS on 10 Nov 2025, and Washington now treats al-Sharaa
    as its primary partner in Syria; its remaining instruments are a $130m request for local counter-ISIS forces and mediation.'
  it: ''
- hash: bc71625f
  kind: cards
  en: 'Turkey''s veto over the Syrian settlement: Ankara called the SDF a PKK branch and a ''terrorist organisation'', backed the Dawn of Freedom offensive (30 Nov 2024) and Syria''s January 2026 attack
    (''one state, one army''), and Erdogan said on 21 Jan 2026 that the Kurdish forces ''must lay down arms and disband now''. Damascus''s own conduct (the YPJ refused entry to the army, Arab units left
    out) tracks Turkish preferences.'
  it: ''
- hash: 27346dbd
  kind: cards
  en: 'The ISIS detainee burden: up to 7,000 detainees and a camp (al-Hol, over 23,000 people at end-2025) could not be guarded once the front collapsed. Shaddadi prison fell on 19-20 Jan 2026 (about 120
    escapees by the interior ministry''s count, 1,500 by the SDF''s), the SDF left al-Hol on 20 Jan citing ''international indifference'', and the US moved 5,700+ detainees to Iraq by 12 Feb.'
  it: ''
- hash: f94bbefd
  kind: cards
  en: 'The PKK shadow and the Kurdish split: the YPG''s cadre came from the PKK, which Turkey, the US and the EU list as terrorist; the 18 Jan deal obliged the SDF to expel non-Syrian PKK-affiliated members,
    and the PKK''s own dissolution (12 May 2025) both removed Ankara''s pretext and left the SDF without a movement behind it. The PYD, the KDP-backed ENKS and the PUK still compete.'
  it: ''
- hash: 8aa6d6ce
  kind: cards
  en: 'Usefulness was the security. The SDF lived on being the ground force of a coalition fighting ISIS; the better it did that job (Raqqa, Baghuz), the less the coalition needed it, and the moment the
    host state itself joined the coalition (10 Nov 2025) its protection was void. Barrack''s ''original purpose had largely expired'' (20 Jan 2026) is Luttwak''s patron logic in one sentence: a client that
    cannot survive its patron''s exit was never an ally, only an instrument.'
  it: ''
- hash: c20f8625
  kind: cards
  en: The prisoners were the chip and the pretext. Guarding thousands of ISIS fighters and al-Hol made the SDF indispensable to Washington, Baghdad and Europe; but a prison break threatens everyone, so
    the government's advance on Shaddadi and al-Hol could be presented as protecting the prisons, and the SDF ended by handing the detainees to Damascus and the US in the same fortnight.
  it: ''
- hash: 692a9136
  kind: cards
  en: The territory won from ISIS decided its fate. East of the Euphrates the SDF governed Arab provinces that gave it oil and a claim to speak for 'North and East Syria'; in January 2026 the same Arab
    tribes and defecting Arab units took Raqqa, Deir ez-Zor and the fields with little SDF defence, and the Kurdish core was left with Hasakah.
  it: ''
- hash: 62804d99
  kind: cards
  en: Delay to win decentralisation bought a worse settlement. The 10 Mar 2025 deal had an end-2025 deadline; the SDF used the year to push a decentralised line (the Hasakah components conference, 8-9 Aug
    2025, which Damascus said 'dealt a blow' to the talks and answered by skipping the Paris round) while clashes in Aleppo in October and December 2025 hardened the opposite line. The January 2026 terms
    (individual absorption, no autonomy, all fields and prisons) were harsher than those of March 2025.
  it: ''
- hash: 32754ad6
  kind: cards
  en: The PKK link was both cohesion and casus belli. The YPG's PKK-trained cadre gave the SDF its discipline, and the same lineage justified Turkey's war on it; when the PKK dissolved (12 May 2025) and
    Turkey's peace process advanced, the demand shifted to 'disband the SDF too', and the last PKK-lineage commanders ended as officials in Damascus (Sipan Hamo, deputy defence minister; Abdi, adviser)
    while the KCK's Bayik criticised the choice.
  it: ''
- hash: da6ab789
  kind: cards
  en: Joining the state to escape Turkey put Turkey's partner in charge. Integration was the way to stop Ankara's drones and the SNA at Kobani, but it makes Ankara's 'one state, one army' ally, Damascus,
    the arbiter of Kurdish rights; the cost was visible within weeks (the YPJ refused entry to the army, pro-SDF Arab units left out) while Turkey took Abdi off its wanted list only after he had become
    a Syrian official.
  it: ''
- hash: 08f24eb5
  kind: cards
  en: 'The SDF is a case study of a client whose usefulness to a patron was its entire

    security. Built by the United States in 2015 as the ground force against ISIS, it

    held a quarter of Syria and an oil-and-prison economy without the attributes of a

    state: no recognition, no port, no friendly border, an Arab-majority hinterland held

    by consent. Luttwak''s rule - a patron''s help lasts as long as the client serves the

    patron''s strategy, not its own - played out in three steps: Turkey and the SNA tested

    it in December 2024 (Manbij lost, Tishrin and Kobani held with US mediation); the new

    Damascus offered integration in March 2025 and the SDF stalled for decentralisation;

    and when Syria joined the anti-ISIS coalition in November 2025 the counter-ISIS role

    that justified the SDF was duplicated and then disowned. The January 2026 offensive

    met no external opposition: the US called for a halt, brokered the terms and, within

    three months, left. What remains is a negotiated afterlife: the force dissolved on

    25 Aug 2026, its commander is a presidential adviser, Kurdish units survive as

    brigades and local security, and the contest has moved from the battlefield to the

    constitution. Signals that are not rows: the YPJ is still outside the army, and the

    Kobani prison riot of 12 Sep 2026 shows the security vacuum in the Kurdish towns. The

    grades in this card are those of an actor that no longer controls territory; read

    them as a legacy card with live consequences.'
  it: ''
- hash: f3aa1483
  kind: cards
  en: Keep the Cook Islands, its realm partner, inside New Zealand's security orbit after the February 2025 Cook Islands-China partnership, which excluded security and defence
  it: ''
- hash: 8101b137
  kind: cards
  en: Keep the defence link with Australia close (closer defence relations, Anzac integration) while staying nuclear-free
  it: ''
- hash: 8cd3b9c3
  kind: cards
  en: Diversify export markets through the India free trade agreement, signed in April 2026
  it: ''
- hash: cfaf8921
  kind: cards
  en: 'Defence Capability Plan 2025: NZ$12 billion over four years (NZ$9 billion new), taking defence spending from just over 1% of GDP toward 2% (2032 in press reporting, 2032/33 in Budget terms); Budget
    2025 set aside NZ$2.7 billion capital and NZ$563 million operating for priority projects'
  it: ''
- hash: f5fa7425
  kind: cards
  en: 'Development funding as leverage over the Cook Islands: NZ$18.2 million for 2025/26 held back in June 2025 and about NZ$30 million restored in April 2026'
  it: ''
- hash: bb4a6fff
  kind: cards
  en: Russia sanctions under the Russia Sanctions Act 2022 (latest amendments 7 August 2026), and an NZDF training contribution to Ukraine (Operation Tīeke, extended to 30 June 2028)
  it: ''
- hash: 1b180673
  kind: cards
  en: The nuclear-free law of 1987 bars nuclear-armed and nuclear-powered ships; the United States suspended its ANZUS security obligations to New Zealand in 1986 over the ban
  it: ''
- hash: 93061e11
  kind: cards
  en: 'A small defence base: spending just over 1% of GDP before the 2025 plan, and the plan is a floor rather than a ceiling, with commitments still subject to future budgets and business cases'
  it: ''
- hash: 730f4c8c
  kind: cards
  en: 'Exposure to US tariffs: 15% from August 2025 (10% in April), against 10% for Australia and the UK; the government expected no quick cut'
  it: ''
- hash: c6456635
  kind: cards
  en: 'Holding aid back to make the Cook Islands answer for its China deal gave Wellington leverage but not the outcome it wanted: the China partnership stayed in place, and the money came back in April
    2026'
  it: ''
- hash: e98ebcc6
  kind: cards
  en: 'New Zealand is a small, trade-dependent state whose security has rested on Australia and, at arm''s length since the 1986 rift, on the United States, the nuclear-free law being the price it chose
    to pay. Its real frontier is the Pacific: the Cook Islands'' partnership with China and the Chinese naval live-fire drill in the Tasman Sea in February 2025 show where its strategy is tested, and it
    answers with money, a defence build-up toward 2% of GDP and a closer defence relationship with Australia. Its commitments further afield (Ukraine training, Russia sanctions, the Philippines visiting-forces
    pact, the India trade deal) are real but modest, and on Palestine it held back recognition in September 2025.'
  it: ''
- hash: c7e94995
  kind: cards
  en: 'Stay out of other people''s wars and keep the sultanate intact under Sultan Haitham: neutrality is not a posture but the survival strategy of a small Gulf state with Iran across the Strait of Hormuz,
    Saudi Arabia on its land border and the United States on its ports. The test of the doctrine is the 2026 Iran war, in which Oman condemned the US-Israeli strikes of 28 Feb (''undermining active and
    serious negotiations''), was itself hit by Iranian drones at Duqm, Salalah and Sohar, and still refused to join either camp.'
  it: ''
- hash: 367993fb
  kind: cards
  en: 'Remain the Gulf''s indispensable go-between, above all between Washington and Tehran and between the Houthis and Riyadh: host the talks (Muscat 12 Apr 2025 to 6 Feb 2026, Rome, Geneva), broker the
    Houthi-US ceasefire of May 2025, the Yemeni prisoner exchange (Jan 2026) and detainee releases. Mediation is both Oman''s security insurance (everyone needs it unharmed) and its diplomatic capital.'
  it: ''
- hash: b7179744
  kind: cards
  en: 'Share the management of the Strait of Hormuz with Iran rather than leave it to Iran alone or to a US-led coalition: keep the southern shipping lane through Omani waters, accept an Iranian approval
    only for ships entering Iranian waters, charge no transit fees. The 17 Jun 2026 US-Iran memorandum endorsed a 60-day Iranian-Omani mechanism; Muscat and Tehran announced an ''understanding'' on a transit
    route map on 17 Aug.'
  it: ''
- hash: d4092c82
  kind: cards
  en: 'Keep the US and UK security cover without becoming a platform for it: formal access for the US Navy and Air Force (1980 facilities agreement; 2019 Strategic Framework Agreement for Duqm and Salalah),
    a UK Joint Defence Agreement (21 Feb 2019) and a British naval base at Duqm, an Indian naval zone at Duqm (Jan 2024). Each patron is given a berth, none a base for offensive use against a neighbour.'
  it: ''
- hash: 7d3a3c5a
  kind: cards
  en: 'Turn geography into rent and diversify from oil under Vision 2040 (launched Dec 2020): the Duqm special economic zone, Sohar and Salalah as ports outside the Strait of Hormuz, rail to the UAE (Hafeet
    Rail), the India CEPA (18 Dec 2025), LNG to Turkey, and a fiscal repair of which the personal income tax from 2028 is the symbol. Oil is still about half of GDP and 45% of government revenue.'
  it: ''
- hash: b220fdfd
  kind: cards
  en: 'Guard its autonomy against its larger Gulf neighbours: keep the borderlands of Musandam and Mahra out of Emirati hands (royal decree of Nov 2018 barring foreigners from land in strategic border areas),
    refuse Saudi-led groupings (no troops in the Yemen coalition, no part in the 2017 Qatar blockade, absent from the GCC leaders'' meeting in Jeddah on 28 Apr 2026) and keep the Gulf union an idea, not
    a structure.'
  it: ''
- hash: faf3a269
  kind: cards
  en: 'The sultanate as venue and channel: Foreign Minister Badr Albusaidi relays messages between Araghchi and Witkoff (Muscat 12 Apr 2025, Rome 19 Apr, Muscat 6 Feb 2026, Geneva 26 Feb 2026 at Oman''s
    UN residence), the Houthi negotiator lives in Muscat, US officials met Houthis at the US embassy in Muscat in September 2026 with Omani help. UN Secretary-General Guterres calls Oman an ''honest broker''.'
  it: ''
- hash: 17e6f4f8
  kind: cards
  en: 'Quiet statements through the foreign ministry and the Omani press, and rare public speech when the stakes are existential: Albusaidi''s Economist article of 18 Mar 2026 (the US ''lost control of
    its own foreign policy''), the call to ''reject escalation'' of 20 Aug 2026 after Trump''s second threat. The government did not answer Trump publicly; Omani commentators did.'
  it: ''
- hash: e0ef8615
  kind: cards
  en: 'A small professional force (Sultan''s Armed Forces) whose real weight is basing and training rights granted to others: US access to Duqm, Salalah and Masirah, the UK Joint Training Area and Duqm
    naval base, India''s naval zone at Duqm, joint Saif Sareea exercises with Britain. Oman does not fight in coalitions; it hosts and escorts. Defence rests on friends, not on force.'
  it: ''
- hash: 89b0615e
  kind: cards
  en: 'Ports and corridors as instruments: Sohar, Salalah and Duqm lie on or beyond the Gulf of Oman, so they became the bypass when Hormuz traffic collapsed (Omani ports handled 117% more exports from
    other GCC states after 28 Feb 2026). China takes about 90% of Oman''s oil exports and invests in Duqm; the UAE, India and Turkey are tied in by rail, CEPA and LNG.'
  it: ''
- hash: 697ad128
  kind: cards
  en: 'Exposed ports and no air defence worth the name against Iran: drones hit Duqm (1 and 3 Mar 2026), Salalah (3 and 11 Mar), a tanker off Muscat (2 Mar) and Sohar (13 Mar, two migrant workers killed);
    the IRGC claimed a ''heavy and surprise attack'' on Duqm logistics on 12 Jul 2026. The sultanate cannot retaliate and cannot leave the war.'
  it: ''
- hash: 96c2765c
  kind: cards
  en: 'US power: Trump threatened on 27 May 2026 that Oman would ''behave'' or be blown up, and again in the week of 17 Aug if it ''gets in the way''; former ambassador Sievers says Oman ''has not behaved
    as a neutral mediator''. The ports and arms depend on Washington; the US even moved its main channel to Pakistan.'
  it: ''
- hash: f148b928
  kind: cards
  en: 'A narrow fiscal base: oil is about 50% of GDP and 45% of government income; the income tax from 2028 and Omanisation of the workforce (in place since 1999) are slow fixes in a country with 5.3 million
    people, many of them expatriates.'
  it: ''
- hash: eea6d48f
  kind: cards
  en: 'Geography: Musandam, an Omani exclave, sits on the Strait of Hormuz, so any Iranian-US escalation lands on Omani soil and shipping; the Strait is, by Araghchi''s words of 15 May 2026, in the ''territorial
    waters of Iran and Oman''.'
  it: ''
- hash: 48e9919f
  kind: cards
  en: 'Isolation within the Gulf: the UAE-Oman rivalry in Musandam and Mahra (a 2019 spy trial of five Emiratis), Oman not present at the GCC meeting in Jeddah, and a Saudi Red Sea coalition (30 Jul 2026)
    in which Oman is not named among those who joined. Saudi Arabia and the UAE can squeeze it but cannot afford to push it into Tehran''s arms.'
  it: ''
- hash: '36423054'
  kind: cards
  en: The access that makes Oman safe makes it a target. The 2019 agreement that opened Duqm and Salalah to the US Navy is the reason Iran struck Duqm on 12 Jul 2026 (logistics and carrier-refuelling facilities)
    and warned that logistical support for US forces 'would be treated as war'; neutrality that is armed with a foreign base is neutral only so long as the other side believes it.
  it: ''
- hash: 643add6d
  kind: cards
  en: The more Oman delivers for Iran, the less Washington can use it. The Hormuz mechanism that Muscat accepted in the 17 Jun memorandum is read by Tehran as a recognition of its right to manage the whole
    strait and by Washington as a guarantee of free navigation; by August Trump threatened to bomb the mediator, and Pakistan, not Oman, had become the main channel.
  it: ''
- hash: f8a1da9b
  kind: cards
  en: Sharing the Strait legitimises the lever Oman fears most. A joint Iranian-Omani mechanism gives a veneer of sovereignty to the 'Persian Gulf Strait Authority' (5 May 2026) and to Iranian fees; Iranian
    lawmakers then say Iran would act 'with or without Oman'. Muscat wanted a condominium and got a precedent.
  it: ''
- hash: 756971c7
  kind: cards
  en: Standing apart from the Gulf bloc bought Oman its freedom and left it alone under fire. Refusing the 2017 Qatar boycott and the Yemen coalition made Oman the Gulf's bypass and broker; in March 2026
    it took drones at Salalah and Sohar with no GCC shield, and the Saudi-UAE-Qatar response was discussed in Jeddah without a clear Omani presence.
  it: ''
- hash: 6d44d8de
  kind: cards
  en: Every patron's berth raises the others' suspicion. China buys about 90% of Oman's oil and sits in Duqm's SEZ (reports of a Chinese base plan in 2023); the US holds access in the same port; India has
    its own zone; Britain its naval base. Oman sells all of them what they most want, which is why each suspects it of selling the others more.
  it: ''
- hash: b4c96d75
  kind: cards
  en: Keeping the Houthi door open protects the Yemeni border and Oman's reputation, but it cushions a group that on 22 Jul 2026 hit a Saudi ship (Oman answered the next day that it was working to resume
    the talks) and that took a stretch of Red Sea coast from Saudi-backed forces in September. Riyadh needs the channel and resents what it carries.
  it: ''
- hash: ec071b22
  kind: cards
  en: 'Oman in October 2026 is a neutral whose neutrality has been put under live fire.

    Its whole strategy since Qaboos is to be useful to every side and enemy to none:

    a venue for the Americans and the Iranians, a door to the Houthis, a berth for

    the US, British and Indian navies, an oil seller to China, a land bridge for

    the Gulf. The Iran war of 28 February 2026 tested each of those at once. Iranian

    drones hit three Omani ports while Muscat was still hosting the talks, Trump

    threatened twice to bomb the mediator, and the Hormuz deal Oman helped write

    on 17 June was read by Tehran and Washington as two opposite things. Luttwak''s

    logic shows in that gap: the instruments of a small state''s security (access,

    mediation, a share of the Strait) are the same instruments that make it a

    target and a suspect. What holds is that all sides still need Oman more than

    they distrust it: the US needs a channel on Hormuz and the Houthis, Iran needs

    the one Arab neighbour that answers its calls, the Saudis and Emiratis need a

    southern flank that does not break. Signals that are not rows: the government

    never answered Trump in public; Sultan Haitham flew to Abu Dhabi on 17 Aug,

    the day of Trump''s second threat, and to London on 2 July; the fiscal tax

    reform of 2028 shows the leadership expects the oil rent to shrink. Open gaps in

    this pass: Egypt, Jordan, Iraq, Pakistan, France and Russia (no sourced

    reading yet), the exact terms of the Saudi road link, and a primary text for

    the 2023 anti-normalisation measure.'
  it: ''
- hash: c3741eeb
  kind: cards
  en: 'Stop Russia winning in Ukraine and make Europe safe from it: 21 sanctions packages (the 21st on 23 Jul 2026, 218 listings), about EUR 210bn of Russian central-bank assets immobilised indefinitely
    (Dec 2025), a EUR 90bn Ukraine loan for 2026-27, a legal ban on Russian gas (LNG from 1 Jan 2027, pipeline gas by 30 Sep 2027) and, as the European Council wrote in June 2026, a response to Russian
    drones, sabotage and threats against EU diplomats. The stated aim is a ceasefire on Ukraine''s terms, compensation and accountability - not the end of the Russian state.'
  it: ''
- hash: 9c768ab4
  kind: cards
  en: 'Become able to defend itself without waiting for Washington: Readiness 2030 (defence ready within five years), SAFE (EUR 150bn of loans, taken up by 19 states, Poland EUR 43.7bn, Romania EUR 16.7bn,
    France about EUR 15bn), the drone defence initiative and Eastern Flank Watch, defence-industrial preference (''buy European''), and a NATO that Rutte and von der Leyen now say must ''become more European''.
    The goal is a European pillar inside NATO, not a replacement for it.'
  it: ''
- hash: 4c2e2bcd
  kind: cards
  en: 'Restore growth and weight: implement the Draghi agenda (Savings and Investments Union, a 28th corporate regime ''EU Inc.'', simplification, the digital euro) and raise the euro''s international role.
    Implementation is partial (about 30% of recommendations by June 2026 on one count) and the 2028-34 budget fight (Commission EUR 1,763bn against six frugal states asking for cuts of several hundred billion)
    decides how much of it is funded.'
  it: ''
- hash: 07dd5350
  kind: cards
  en: 'Diversify trade away from dependence on one market or one supplier: EU-Mercosur (signed 17 Jan 2026, interim trade agreement applied provisionally since 1 May 2026), the EU-India FTA (concluded 27
    Jan 2026, signature and ratification pending), a Gulf bloc deal, Canada and Japan partnerships, a managed truce with Washington (Turnberry, 15% ceiling) and a managed de-risking of China (EV duties
    and price undertakings, rare-earth licence channels).'
  it: ''
- hash: 1b0c0c47
  kind: cards
  en: 'Enlarge - and fix the institutions so that enlargement does not paralyse them: Ukraine and Moldova opened their first clusters on 15 Jun 2026 and Hungary lifted its veto on Ukraine''s clusters 2
    and 3 on 7 Oct 2026; Montenegro has 18 of 33 chapters closed and a 2028-29 target, Albania aims for 2030; Georgia is frozen, Serbia on hold after the Mladic funeral, North Macedonia blocked by the Bulgarian
    dispute. Enlargement is the Union''s main instrument of foreign policy and its most visible stress test.'
  it: ''
- hash: 8e29f035
  kind: cards
  en: 'Deliver the internal agenda that holds the Union together politically: the Migration and Asylum Pact (fully applicable 12 Jun 2026, safe-countries list adopted Feb 2026), the legally binding 2040
    climate target (-90% net, ETS2 postponed to 2028) and the single market. Both files cost votes at home - governments in Prague and Bratislava reject relocation and the Green Deal - so they are also
    a test of whether the centre can still legislate.'
  it: ''
- hash: e9e90975
  kind: cards
  en: 'Convening and legitimacy rather than command: the European Council under Costa (summits, the Ankara and Tivat formats, the first EU-GCC and EU-Armenia summits), Kallas''s External Action Service,
    and security-and-defence partnerships with Moldova (the first ever), Norway, Canada and Japan. In Ukraine diplomacy the Union is a payer kept near the table, not a party: leaders could not agree on
    an envoy to Moscow in June 2026.'
  it: ''
- hash: eb11063d
  kind: cards
  en: 'Enlargement and association as a standing offer: candidate status, cluster openings, Growth Plan money paid against reform steps (Moldova EUR 157m on 5 Oct 2026, Montenegro EUR 383.5m envelope, Bosnia
    EUR 976.6m at risk), visa liberalisation and suspension (Georgia, 6 Mar 2026).'
  it: ''
- hash: 806565a7
  kind: cards
  en: 'Regulatory power as influence: the Digital Services Act (first fine, EUR 120m on X, 5 Dec 2025; TikTok proceedings over Romania''s election), the Brussels effect on standards, and the Commission''s
    monopoly of trade policy. The same instruments are what Washington attacks.'
  it: ''
- hash: beb4eb4a
  kind: cards
  en: 'Little hard power of its own, much borrowed: EUFOR Althea in Bosnia (about 1,000 troops, mandate to 31 Oct 2026), the civilian mission EUMA in Armenia (about 225, to Feb 2027), Operation Aspides
    in the Red Sea (extended to Feb 2027), the European Peace Facility (Moldova EUR 317m, Armenia EUR 30m) and the drone-defence and Eastern Flank Watch programmes; the real military instrument is the sum
    of national armies and NATO.'
  it: ''
- hash: 4ee82631
  kind: cards
  en: 'Money, access and rules: sanctions (21 Russia packages, Belarus regime to Feb 2027), immobilised central-bank assets, EU-budget borrowing (EUR 90bn), SAFE loans, the market itself (countervailing
    duties on Chinese EVs since Oct 2024, EUR 93bn of suspended counter-tariffs on the US, the unused Anti-Coercion Instrument), macro-financial assistance (Egypt up to EUR 5bn) and conditionality on cohesion
    funds (Hungary EUR 4.2bn proposed for release on 23 Sep 2026).'
  it: ''
- hash: 5e1e7491
  kind: cards
  en: 'Unanimity: sanctions, foreign policy, the budget and every enlargement step need 27 votes. Hungary delayed the 20th package until April 2026 and blocked Ukraine''s clusters until 7 Oct; Slovakia
    blocked the 18th package six times; Czechia, Hungary and Slovakia opted out of the EUR 90bn loan guarantees (Article 20 TEU) and Bulgaria''s Radev cabinet uses the veto on listings. The April 2026 change
    of government in Budapest eased, not removed, the constraint.'
  it: ''
- hash: 4116b723
  kind: cards
  en: 'The security guarantee is American: Article 42(7) TEU is a political clause, NATO is the operative guarantee, and Washington is signalling a smaller footprint (troop-reduction review announced June
    2026; Trump ''mused'' about cutting a third). European rearmament still buys US kit, and NATO''s 5% target (3.5% core) is set in Washington''s terms.'
  it: ''
- hash: 1f8e2001
  kind: cards
  en: 'Money: the 2028-34 budget is a zero-sum quarrel (Commission EUR 1,763bn; Cyprus box EUR 1,730bn; Germany, Netherlands, Austria, Denmark, Finland and Sweden ask for cuts of several hundred billion;
    Poland and the south want cohesion and farm money). The Union has no tax of its own and its borrowing, as in the EUR 90bn loan, is fought over each time; Belgium refused the legal risk of the Euroclear
    assets.'
  it: ''
- hash: 9bf61878
  kind: cards
  en: 'Energy and critical inputs still come from others: Norway 30.9% of EU gas imports in 2025, the United States 26.2% (57.9% of LNG, heading to two-thirds), Russia 12.5% until the ban bites; 8.5% of
    EU LNG and 40% of jet fuel and diesel transit Hormuz; rare-earth magnets depend on Chinese licences (about 2,000 priority applications sent by EU firms in October 2025, just over half processed).'
  it: ''
- hash: 60c68683
  kind: cards
  en: 'Politics at home: Eurosceptic or sovereigntist governments in Prague and Bratislava, a Parliament that referred Mercosur to the Court (334-324, Jan 2026), Poland''s suit against provisional application
    (C-460/26 R), farmers, and an Icelandic referendum (29 Aug 2026, 52.8% no) as a reminder that enlargement is not a one-way street.'
  it: ''
- hash: 1eb34ad1
  kind: cards
  en: 'No single voice or command: the President of the Commission, the President of the European Council and the High Representative overlap; leaders in June 2026 could not agree on who would speak to
    Moscow, and the Council President''s own office reopened contacts with the Kremlin that several leaders criticised. The Union cannot negotiate peace, it can only finance and sanction.'
  it: ''
- hash: e0a084ff
  kind: cards
  en: 'Strategic autonomy built on American dependence: the Union can afford to rearm, to sanction Russia and to keep the Ukraine war financed only because the US guarantee and US LNG are still there. It
    bought tariff peace at Turnberry (15% ceiling, preferences cut first, Parliament''s sunrise clause and suspension right added later) and is shifting from Russian to American gas just as Washington questions
    the guarantee - the more it gives to keep the umbrella open, the more it needs one.'
  it: ''
- hash: 7ceed51c
  kind: cards
  en: 'The Union''s rule of consent is also its exposure: unanimity makes every package, every cluster and every budget line hostage to the smallest spoiler, so the centre has learned to route around it
    (enhanced cooperation for the EUR 90bn loan, Article 122 for the assets, trade-policy bases for the gas ban). Each workaround is legally contestable - Hungary and Slovakia sued at the Court over the
    gas phase-out - and so trades a political veto for a judicial one.'
  it: ''
- hash: 6fa6de7a
  kind: cards
  en: 'Sanctions that cost the sanctioner: ending Russian gas by 2027 (and Russian LNG from 1 Jan 2027) moves dependence to US LNG and to Gulf supply that passes through Hormuz, which the Iran war (since
    late February 2026) has closed or disrupted; the immobilised EUR 210bn is its best lever on Moscow but sits in one Belgian depository and cannot be used without Belgian risk, so Ukraine is financed
    by EU borrowing that only Russian reparations will repay.'
  it: ''
- hash: 452dc015
  kind: cards
  en: 'Enlargement is the Union''s best foreign policy and its largest threat to decision-making: nine candidates would roughly double the number of vetoes, and each step already needs unanimity. Freezing
    the files because the institutions are not ready (North Macedonia, Georgia, Serbia) pushes candidates toward Moscow and Beijing - the outcome enlargement was supposed to prevent - while rapid accession
    of a war-torn Ukraine is rejected by Hungary, Poland''s farmers and others.'
  it: ''
