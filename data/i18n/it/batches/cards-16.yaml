lang: it
items:
- hash: 8ad5a8b7
  kind: cards
  en: Graduation is a success that removes the privilege behind it. LDC exit on 24 Nov 2026 certifies the economy the garment preferences built, and at the same moment the EU duty-free window shortens to
    2029 and the GSP+ replacement demands value addition and labour and human-rights compliance that the interim period's reform record has not yet shown. Dhaka asked for a three-year delay while the exit
    date still stands.
  it: ''
- hash: f34ade31
  kind: cards
  en: Engaging the Arakan Army to send the Rohingya home legitimises the force that now holds the border and has been accused of forced recruitment and discrimination against the same people. Dhaka refused
    a UN 'humanitarian corridor' in 2025 so as not to become party to the Rakhine war, then turned in 2026 to dialogue with both Naypyidaw and the Arakan Army, and the junta answers that return needs security
    in Rakhine and the end of international cases.
  it: ''
- hash: 4222f9c0
  kind: cards
  en: Energy independence that runs through someone else's wires and loans. Rooppur (USD 12.65bn, Russian loan, grid connection targeted end-2026 against earlier forecasts of 2027, repayment pushed back
    to 2028-29) and imported Nepali hydro (40 MW, through an Indian line, a 20 MW increase held up by India's grid regulator) are meant to reduce dependence on gas and India, but both depend on Moscow's
    credit and Delhi's transmission.
  it: ''
- hash: 7fd603ee
  kind: cards
  en: 'Bangladesh is a state between two giants that, for fifteen years, exported its

    dependence on one of them and has since 2024 been testing the other. Under

    Hasina, security, the border, the water and the grid were handed to India in

    exchange for regime protection - ''a blank cheque'', as a Dhaka academic put it -

    and the cost came due in the uprising of July-August 2024, when the same India

    that had underwritten the government became the place where it fled. What

    Dhaka has done since is textbook Luttwak at the level of grand strategy: it

    converts its single point of leverage, Hasina''s person, into a diplomatic

    claim, and it widens its menu (Beijing for money and fighters, Islamabad for

    a signal, Ankara and Tokyo for industry, Washington for the market) so that

    India no longer sets the price. But each widening is paid in the currency India

    controls - the Ganges in December, the Teesta, diesel, the 4,096 km border,

    the land ports - and India has shown it will use it (April-June 2025). The

    BNP government of February 2026 has so far kept both doors ajar: a reset of

    tone with Delhi, a four-day state visit to Beijing, and a trade deal with

    Washington that the Supreme Court unmade within eleven days. The year-end

    tests are concrete and dated: the Ganges Water Treaty lapses in December, LDC

    graduation takes effect on 24 November, Rooppur is meant to reach the grid, and

    the first Rahman visit to India (set aside around the BRICS summit in New Delhi

    in September) has not happened. Two signals that are not rows: Dhaka declined

    India''s BRICS invitation on the ground of how it was extended (through the

    BIMSTEC chair), and India''s high commissioner has said he expects the water

    and trade questions to move ''once the prime minister visits''. The risk is

    that a state which wants to be nobody''s client ends up as the disputed ground

    between three clients'' views of it - India''s fear of a China-Pakistan-

    Bangladesh convergence at the Siliguri Corridor, China''s wish for Mongla and

    Teesta, America''s wish to see Dhaka not buy arms from Beijing.'
  it: ''
- hash: 96be6594
  kind: cards
  en: 'Keep the Euro-Atlantic anchor and cash in its dividends: the euro (21st member, 1 Jan 2026, at 1.95583 lev), full Schengen (land borders open from 1 Jan 2025) and NATO, whose spending target Radev''s
    cabinet says it will reach (2% ''reached'', 5% by 2035 in the defence minister''s plan). The anchor is the one fixed point in a political system that produced eight elections in five years.'
  it: ''
- hash: b6ac708a
  kind: cards
  en: End the cycle of unstable governments and take the state back from the oligarchic networks that the 2025 street protests named. Rumen Radev quit the presidency (January 2026) to found Progressive
    Bulgaria, which won 131 of 240 seats on 19 April 2026 and governs alone; Delyan Peevski's DPS, the pivot of the previous cabinet, fell to 21 seats and opposition.
  it: ''
- hash: be917b99
  kind: cards
  en: 'Secure fuel and gas without Russia and without a shutdown: keep the Burgas refinery running under state-appointed special managers while the US sanctions on Lukoil (the sale of Lukoil International
    pending), move Kozloduy off Russian fuel (Westinghouse for unit 5), and sell the country as a gas gateway (IGB, Vertical Corridor, Alexandroupolis, the interconnector to Serbia).'
  it: ''
- hash: 7eefdd98
  kind: cards
  en: 'Hold the line on North Macedonia: constitutional recognition of Bulgarians, the history commission and no change to the July 2022 French-proposal consensus as the price of lifting the block on its
    EU negotiations (in place since November 2020). Radev as prime minister has refused even to meet Mickoski.'
  it: ''
- hash: 30baa2a7
  kind: cards
  en: 'Keep room for a ''pragmatic'' line toward Moscow inside the EU and NATO: stop state arms aid to Ukraine and leave the Coalition of the Willing (14 Jul 2026), block the listing of Patriarch Kirill
    and Lukoil''s Alekperov in the 21st sanctions package, while still not blocking Ukraine''s EU path or earlier packages.'
  it: ''
- hash: 3a7c89e1
  kind: cards
  en: 'Defend the Black Sea flank and the defence industry that pays for it: host the NATO battlegroup at Novo Selo (Italy framework nation, to grow to brigade size), take delivery of 16 F-16 Block 70 (eight
    in service by December 2025), command the Romania-Bulgaria-Turkey mine-countermeasures group from July 2026 and keep defence exports (about EUR 2.5bn in 2025) flowing.'
  it: ''
- hash: 2f96508c
  kind: cards
  en: 'The veto, used selectively: the November 2020 block on North Macedonia''s negotiations, kept by both Zhelyazkov and Radev; the July 2026 refusal to list Patriarch Kirill and Alekperov, backed by
    a threat to veto the whole 21st package; exit from the Coalition of the Willing. Each is a use of EU unanimity for a national interest, not a break with the club.'
  it: ''
- hash: 4e11529c
  kind: cards
  en: 'Regional hub diplomacy: Mitsotakis was the first European leader to visit Radev''s Sofia (4 Jun 2026); the Ankara meeting with Erdogan (6 Jul) bought a 15-month suspension of the Bulgargaz-BOTAS
    contract; Bulgaria joined Trump''s Board of Peace (signed in Davos, 22 Jan 2026, ratification left to the new parliament).'
  it: ''
- hash: 24023d5a
  kind: cards
  en: 'The sovereignty frame: Radev calls his Russia and Ukraine line ''national interest'' defended ''in a collective format'', says Europe should lead peace talks and has called Crimea ''currently Russian''
    (campaign statements); Moscow''s own reading (Zakharova) is that Sofia is ''too weak'' to help Ukraine rather than turning toward Russia.'
  it: ''
- hash: 568ee8c8
  kind: cards
  en: 'A frontline host more than a power: the NATO battlegroup at Novo Selo (up to about 800 Italian troops approved), eight F-16 Block 70 delivered by 17 Dec 2025 and eight more due by 2027, a NATO planning
    team in Sofia (February 2026) for Eastern Sentry, command of the Black Sea mine-countermeasures task group from 9 Jul 2026 and a defence plan to reach 5% of GDP by 2035.'
  it: ''
- hash: f9ce86fe
  kind: cards
  en: 'Control of chokepoints it already has: the special commercial manager of Lukoil Neftochim Burgas (the only refinery, impact put at over BGN 15bn a year), the Balkan Stream/TurkStream transit corridor
    (transit income about EUR 800m January 2022 - March 2024, Romanian estimate), the IGB and Serbia interconnectors, and a defence industry whose exports reached about EUR 2.5bn in 2025.'
  it: ''
- hash: d2ce9fa2
  kind: cards
  en: 'Sanctions law it does not write: the US Treasury''s measures on Lukoil, the pending sale of Lukoil International to Carlyle and OFAC/OFSI licences decide whether Burgas can buy crude and sell fuel;
    Sofia can only ask for waivers, and in November 2025 had 11 days to apply for one. Any sale that looks like nationalisation exposes Bulgaria to Russian investment-treaty claims.'
  it: ''
- hash: e6c36114
  kind: cards
  en: 'Demography and poverty: the population was 6,423,207 at the end of 2025 (down 14,153), with 50,241 births against 99,479 deaths, 24.3% aged 65 or more, and about 344,000 people lost to emigration
    in the decade to the 2021 census. The EU''s poorest member has less labour, fewer conscripts and a narrower tax base each year.'
  it: ''
- hash: c8c1515e
  kind: cards
  en: 'A public split on the euro and a fragile fiscal base: opinion was 46.5% for and 46.8% against in May 2025 (Alpha Research); Vazrazhdane campaigned against it as ''treason''; the 2026 budget meant
    to meet the new regime (higher dividend tax and contributions) toppled the Zhelyazkov cabinet in December 2025.'
  it: ''
- hash: 32c6c877
  kind: cards
  en: 'A take-or-pay contract with Turkey: Bulgargaz booked 106.4 GWh/day of regasification capacity at Turkish terminals through 2035 (about BGN 1m a day), owes BOTAS about BGN 300m in arrears, and rescinding
    the deal could cost close to BGN 3bn; the July 2026 suspension is for 15 months only.'
  it: ''
- hash: f1cdd3d5
  kind: cards
  en: 'Russian-designed nuclear base and a long fuel transition: Kozloduy''s two VVER-1000 units supply about a third of Bulgaria''s electricity; unit 5 is on Westinghouse fuel (10-year contract of December
    2022), unit 6 is to follow with Framatome, and the new AP1000 units 7 and 8 are not expected before 2034-2037.'
  it: ''
- hash: 5fd9a5e1
  kind: cards
  en: 'Dependence on partners it also irritates: Bulgaria is the EU''s poorest member and a net recipient, hosts NATO and US forces, and needs Washington (F-16, AP1000, LNG) and Brussels (euro, Schengen,
    cohesion money) at once; the veto it brandished on the 21st sanctions package was dropped once Kirill and Alekperov were removed from the list, which shows how far leverage goes.'
  it: ''
- hash: 711c41d6
  kind: cards
  en: Seizing Lukoil to save the refinery puts the state against its own constitution and creditors. The special-manager law removed judicial oversight (a constitutional problem for the Centre for the Study
    of Democracy) and a sale that looks like nationalisation could draw Russian claims under the bilateral investment treaty; yet without the manager the refinery would stop within weeks of US sanctions.
    Control bought with legal risk.
  it: ''
- hash: 3a03a246
  kind: cards
  en: The block on North Macedonia protects Bulgarian identity and spends Bulgarian influence. After six years Skopje answers with counter-conditions (rights for Macedonians in Bulgaria, no further vetoes)
    and an arson attack on Bulgarian embassy cars (15 Jun 2026); Radev now says there is 'nothing more to discuss' with Mickoski. Sofia, which wants the Western Balkans stable and anchored in the EU, has
    made itself the first obstacle on that road.
  it: ''
- hash: faccead8
  kind: cards
  en: Bulgaria earns from the Russian gas it says it will stop carrying. TurkStream's European string delivers to Serbia and Hungary through Bulgaria (52 mcm/day at the Turkey-Bulgaria entry in January
    2026, a record), the transit fee paid about EUR 800m in 2022-24, and Zhelyazkov promised to end transit contracts in 2026 and Russian gas in the domestic market by 2028 - while the Vertical Corridor
    it builds to replace those flows cost almost three times more than rival routes to Ukraine until the March 2026 tariff revision.
  it: ''
- hash: 59deca31
  kind: cards
  en: Bulgaria arms Ukraine through its factories and disarms it through its government. Its defence industry supplied by von der Leyen's count about a third of the EU's weapons to Ukraine and exports about
    EUR 2.5bn a year, yet Radev froze state military aid (9 Jun 2026), left the Coalition of the Willing (14 Jul) and his economy minister says there are no funds for the Rheinmetall plant at Sopot that
    would anchor the industry's next generation.
  it: ''
- hash: 91e2bd53
  kind: cards
  en: The euro it won cost the government that won it. Adoption on 1 Jan 2026 was the central achievement of the Zhelyazkov cabinet, but the budget needed to stay inside the new regime (higher dividend
    tax and contributions) triggered the largest protests in three decades and the cabinet's resignation on 11 Dec 2025 - three weeks before the changeover. The beneficiary was an outsider, Radev, who had
    opposed the party system that carried the euro.
  it: ''
- hash: 190ef71b
  kind: cards
  en: Pledging 5% to NATO while the army's modernisation is on hold. Radev told Rutte that 2% was reached and 5% (by 2035 in the defence minister's plan) was the aim, and presented Bulgaria at Ankara as
    a 'stability anchor' on the Black Sea; six weeks later the economy minister said there was no money for the Sopot plant and the cabinet put modernisation on hold.
  it: ''
- hash: 4b8c8609
  kind: cards
  en: 'Bulgaria''s strategy is that of a small, poor, shrinking member of two clubs

    that has just chosen a leader who sells distance from both while keeping the

    benefits of each. The euro (1 Jan 2026), full Schengen (1 Jan 2025), the NATO

    battlegroup, the F-16s and the Westinghouse fuel are the anchor and nobody in

    power is seriously proposing to cut it; what moves is the margin. Rumen Radev,

    elected on 19 April 2026 with a single-party majority, uses the one thing a

    small state has inside the EU, the veto, on Patriarch Kirill, on Lukoil''s

    founder and on North Macedonia, and pays for it by leaving Ukraine''s

    coalition and freezing state arms aid, while the factories keep selling.

    The Luttwakian pattern is plain: each gain in leverage (the veto, the special

    manager at Burgas, the transit corridor, the defence industry) is bought

    with a loss in trust among the same partners who guarantee the anchor, and

    the paradox of the North Macedonia block shows the end of that road.

    Signals that are not rows: Zakharova said on 29 May 2026 that Sofia showed

    no sign of restoring dialogue with Moscow and on 14 Jul that it was ''too weak''

    to help Ukraine, not turning toward Russia; the pivot is therefore toward

    caution, not toward the Kremlin. The oligarch network of Peevski, Magnitsky-listed

    by the US in June 2021, lost its place in government in April 2026, but the

    underlying fragility (eight elections in five years, a cabinet toppled by a

    budget in December 2025) has not yet been tested by a hard budget under Radev.

    What to watch: the Lukoil licences (reported to run to the end of October 2026),

    the 21st-package endgame, whether Skopje and Sofia talk again before the

    Council''s next enlargement report, and whether the 15-month BOTAS suspension

    ends with a renegotiated or a litigated contract.'
  it: ''
- hash: 7913680d
  kind: cards
  en: Keep Iranian strikes and Iran-linked networks away from its territory. Iran hit Bahrain directly in February-March 2026, and Bahrain has jailed people for collaborating with Iran's Revolutionary Guards.
  it: ''
- hash: 21ae21f6
  kind: cards
  en: 'Keep the US security umbrella: the US-Bahrain security integration agreement, the Fifth Fleet headquarters on its soil, and the British decision to join the agreement in December 2024.'
  it: ''
- hash: fa2fb935
  kind: cards
  en: Use its seat on the UN Security Council for 2026-27, elected on 3 June 2025, to add weight beyond its size.
  it: ''
- hash: c499f7f9
  kind: cards
  en: 'Security integration with the United States: the US-Bahrain agreement (joined by the UK in 2024) and the Fifth Fleet headquarters, which reports say was hit in February 2026.'
  it: ''
- hash: 842bca99
  kind: cards
  en: 'Air and missile defence: Bahrain says it intercepted 70 ballistic missiles and 59 drones by 3 March 2026.'
  it: ''
- hash: b1c82985
  kind: cards
  en: 'Diplomacy with Israel and the Gulf: diplomatic relations with Israel since the joint communique of 18 October 2020 (Abraham Accords), and restored ties with Qatar in 2023.'
  it: ''
- hash: 542caa74
  kind: cards
  en: 'It cannot balance Iran alone: its deterrence rests on the US pact and the Fifth Fleet, so Iran''s strikes target the security it has bought.'
  it: ''
- hash: 9c6c7aad
  kind: cards
  en: 'Domestic cohesion: the 2016 stripping of citizenship from the Shia cleric Isa Qassim and the 2019 sentences for an ''Iran-backed'' group show that the Iran question is also a question about its own
    Shia population.'
  it: ''
- hash: 4a9c6b80
  kind: cards
  en: 'The Israel tie stays formal: the envoy returned home in November 2023 over Gaza, and Israel said the ties remained stable.'
  it: ''
- hash: e2fb785c
  kind: cards
  en: 'Hosting the Fifth Fleet and the US pact buys security but makes Bahrain a target: the same tie that protects it is the reason Iran''s strikes reach it.'
  it: ''
- hash: 73decaf2
  kind: cards
  en: 'Bahrain''s card rests on a US security umbrella and a formal opening to Israel, and Iran is the structural rival: the 2016 rupture was followed by direct strikes on Bahrain in 2026. Its diplomatic
    hedges are the 2020 Israel tie and a UN Security Council seat for 2026-27. This card is minor and thin: Saudi Arabia, the Houthis, the Qatar blockade and the 2011 deployment, the 2024-25 Iran talks,
    the June 2025 war and the British base are not written because no source was found for them in this session.'
  it: ''
- hash: c5fe6994
  kind: cards
  en: 'Govern on the mandate of 12 May 2026: the Progressive Liberal Party under Philip Davis was re-elected for a second straight term, with 33 of 41 seats in the preliminary count, after Davis called
    an early vote. That mandate is the constraint on every choice below.'
  it: ''
- hash: 733b4f04
  kind: cards
  en: 'Control irregular migration, above all from Haiti: after the May 2026 election the government stepped up removals (107 Haitians flown out in May, 116 on 27 August 2026) and announced a biometric
    immigration system, stiffer penalties for employers and daily overstay fines.'
  it: ''
- hash: adbf677c
  kind: cards
  en: 'Keep the United States as the anchor partner: it is the main source of visitors (about 80 per cent in 2014, the latest figure found), and the US ambassador calls the Bahamas a valued partner (January
    2026).'
  it: ''
- hash: 87faae74
  kind: cards
  en: 'Enforce on its own soil the entry rules Washington sets, while refusing to take US deportees: the government said in late 2024 it is unwilling and unable to accept US deportation flights, yet in
    September 2025 it barred Haitians from entering to apply for US visas after Washington restricted Haitian entry.'
  it: ''
- hash: 15210f70
  kind: cards
  en: 'Tourism as the main earner, now tilted to cruise: the World Bank reports cruise arrivals up 11.6 per cent year on year through October 2025, while stayover visitors fell 1.9 per cent.'
  it: ''
- hash: 021240df
  kind: cards
  en: 'Tourism is most of the economy: a US Commercial Service guide puts tourism at about 50 per cent of GDP (more with related services), and the stayover base is flat, so a hurricane, a change in US
    travel rules or a shift in the cruise mix hits the same sector.'
  it: ''
- hash: d2e8f683
  kind: cards
  en: 'Debt: central government debt is about 74 per cent of GDP in FY2024/25, and the IMF says more measures are needed to reach the government''s target of 50 per cent by FY2030/31.'
  it: ''
- hash: 2c8b4171
  kind: cards
  en: 'US restrictions on Haitian entry shape Nassau''s own Haiti rules: in September 2025 the Bahamas barred Haitian visa applicants from entering to apply for US visas, so its border policy follows Washington''s
    visa policy.'
  it: ''
- hash: 89cf7008
  kind: cards
  en: The Bahamas refuses to take US deportees, yet removes Haitians on its own flights at scale (107 in May 2026, 116 on 27 August 2026). It says it cannot receive migrants from Washington while it runs
    the same kind of removals itself, so its refusal and its removals sit side by side.
  it: ''
- hash: 3f2f8aa1
  kind: cards
  en: 'The Bahamas is a small, tourism-dependent state whose government was renewed in May 2026 with a large majority, so its aim is continuity and control of migration rather than a change of course. Its
    sharpest test is with Haiti and the United States: Nassau removes Haitians at scale and bars Haitian visa applicants, in line with Washington''s entry rules, while it refuses to take US deportees. This
    card holds only what was sourced in this pass; its positions on Cuba, China, CARICOM and Ukraine or Gaza are not written, because no source for them was read.'
  it: ''
- hash: 13317d8d
  kind: cards
  en: Keep the state alive against one of its own entities. The objective of the state-level institutions (the Bosniak-led majority in the Presidency and the Council of Ministers' Troika coalition, the
    Constitutional Court, the State Court, the Central Election Commission) is to defend the Dayton order, territorial integrity and the writ of state justice against the Republika Srpska leadership, which
    after Dodik's 26 Feb 2025 conviction banned the state judiciary and police from the entity (the OHR said this 'hint[s] at de facto secession') and now asks for the army, border police, intelligence
    and fiscal system back. These are not the objectives of the Serb member of the Presidency or of the HDZ BiH leadership (see reading).
  it: ''
- hash: 8e36920e
  kind: cards
  en: 'Join the EU: the only goal that all three constituent peoples nominally share and the main anchor of reform. Candidate status came in December 2022 and the Council decided to open negotiations in
    March 2024, but the first intergovernmental conference has not been held, no chief negotiator has been named and the negotiating framework waits for judicial-reform laws.'
  it: ''
- hash: 167148b7
  kind: cards
  en: 'Keep the external guarantee in place: the Office of the High Representative and its Bonn powers, the UN-mandated EU force EUFOR Althea, and Security Council unity on Bosnia''s sovereignty (presidential
    statement of 29 Dec 2025). Sarajevo needs the guarantor because it cannot enforce the constitutional order inside the entity on its own - and the guarantor is in flux (Schmidt resigned in May 2026;
    the US wants his successor to hand powers to Bosnian institutions).'
  it: ''
- hash: d8ee3b48
  kind: cards
  en: 'Win recognition for the Srebrenica genocide and block its denial and the glorification of war criminals: the UN General Assembly day of remembrance (A/RES/78/282, 23 May 2024) and the diplomatic
    response to Mladic''s September 2026 funeral in Belgrade (two Serbian diplomats expelled, most Bosnian embassy staff withdrawn, the good-neighbourly memorandum unsigned).'
  it: ''
- hash: 10ed5b15
  kind: cards
  en: Anchor the state in NATO as the second guarantee after the EU. Bosnia was invited into a Membership Action Plan in 2010, but NATO did not activate it because Republika Srpska refuses to register defence
    property as state property; in October 2025 NATO and Bosnia agreed a new Individually Tailored Partnership Programme. Membership is not on the table while the entity blocks it.
  it: ''
- hash: 0c3937f0
  kind: cards
  en: 'Keep the economy and the population from draining away: capture the EU Growth Plan money (EUR 976.6m still available, EUR 373.9m at risk after 31 Dec 2026), cut dependence on the single Russian gas
    supply through the Southern Interconnection with Croatia (due by end-2027, ahead of the EU ban on Russian gas), and hold the remittance-fed economy together while the population falls.'
  it: ''
- hash: 45059b7c
  kind: cards
  en: 'Legal and institutional levers used as the first line of defence: the State Court''s verdict on Dodik (1 year, 6-year ban; upheld on appeal 1 Aug 2025), the Central Election Commission''s removal
    of Dodik from the RS presidency (Aug 2025), the Constitutional Court''s suspension and annulment of the RS laws against state institutions (Mar-May 2025) and its rejection of Dodik''s appeal (Nov 2025).'
  it: ''
- hash: 72db472e
  kind: cards
  en: 'Foreign-ministry and Presidency diplomacy by the Bosniak-led side: the campaign for the Srebrenica resolution (Becirovic: ''a great diplomatic battle''), Becirovic''s emergency meeting with Erdogan
    in Istanbul (14 Mar 2025) during the Dodik crisis, and Konakovic''s September 2026 response to Mladic''s funeral - expulsions, a partial withdrawal from Belgrade and work moved to the embassies in Zagreb
    and Podgorica.'
  it: ''
- hash: 9c67bd1c
  kind: cards
  en: 'Alignment with the EU and its capitals: Germany and Austria banned Dodik and two aides from entry in May 2025 and Berlin backed Schmidt''s decisions; the EU confirmed the membership perspective at
    the June 2026 EU-Western Balkans summit. The EU is the only outside power whose political line matches Sarajevo''s.'
  it: ''
- hash: 1643bdf5
  kind: cards
  en: 'Memory politics as a security instrument: the 11 July Srebrenica day, the demand that Serbia and Republika Srpska stop glorifying convicted commanders, and the framing of the RS agenda as ''deconstruction''
    of the state (Schmidt, May 2026). The Foreign Minister also says Dodik lobbied Washington for RS independence and the abolition of the OHR (Feb 2026), a claim that casts the entity as a foreign-backed
    project.'
  it: ''
- hash: b76d7243
  kind: cards
  en: 'Almost none of its own: security rests on EUFOR Althea (24 contributing nations, about 1,000 troops by one count, 1,500 by another; the European reserve forces were flown in for about 300 more in
    March 2025 when the Dodik crisis worsened), renewed unanimously by the Security Council on 31 Oct 2025 and due again by 31 Oct 2026.'
  it: ''
- hash: be716337
  kind: cards
  en: 'EU money and market access as the lever on its own politicians: Growth Plan funds conditional on reform steps, an EU Frontex status agreement (June 2025) that shifts migration control onto an EU-backed
    footing, and a trade structure in which the EU takes about 73% of exports. The US-backed Southern Interconnection with Croatia is the energy counter-move to Russian gas.'
  it: ''
- hash: 2726617c
  kind: cards
  en: The Dayton machine gives the entity a veto over the state's foreign policy. A three-member Presidency (Bosniak, Croat, Serb) decides on recognition and ambassadors; in 2020 the Serb member refused
    to recognise Kosovo and Republika Srpska invoked a vital-interest veto, and the Kosovo visa agreement is still unratified because RS blocks it. Sarajevo cannot recall its Belgrade ambassador without
    the Presidency.
  it: ''
- hash: 59ace615
  kind: cards
  en: The guarantors are divided and leaving. The OHR has been led by an acting High Representative since 1 July 2026 (the Peace Implementation Council failed to agree a successor on 4 June and 14 July;
    the US backed Antonio Zanardi Landi, France, the UK and Germany Rene Troccaz); Russia and China do not recognise Schmidt's appointment and call for the OHR's closure; Washington says it is 'no longer
    pursuing nation-building'.
  it: ''
- hash: '68988421'
  kind: cards
  en: Republika Srpska has power and patrons. SNSD, Dodik's party, kept the entity on 4 Oct 2026 (Savo Minic elected RS president), US sanctions on Dodik and 47 others were lifted on 29 Oct 2025, and the
    entity has Belgrade's special parallel relations, Moscow's open support and, until April 2026, Orban's Hungary. Dodik barred from office is still the party leader and says his party 'will not change
    course'.
  it: ''
- hash: 2844533f
  kind: cards
  en: 'EU conditionality bites on the state''s own blockages: the Courts of BiH law and the HJPC law have not been adopted, the chief negotiator is unnamed, the Growth Plan allocation was already cut by
    10% in 2025 and EUR 373.9m will be lost after 31 Dec 2026. The Commission says the next step belongs to Bosnia.'
  it: ''
- hash: c1eab07d
  kind: cards
  en: 'A narrow, import-dependent economy: the 2025 goods deficit was KM 12.98bn (exports 56.7% of imports), and every cubic metre of gas arrives from Russia through Serbia over a single 1979 pipeline.
    The Southern Interconnection law passed the Federation in January 2025 but the interstate agreement with Croatia was still unsigned in 2026 after disputes over who runs it.'
  it: ''
- hash: c14fecc8
  kind: cards
  en: 'The population is draining: an estimated 2.90 million in 2023 against 3.53 million at the 2013 census (no census since), more than half of people of Bosnian origin live abroad, and turnout at the
    4 Oct 2026 election fell to about 42%, a record low. Remittances (KM 4.46bn in 2025) keep the economy afloat and the exit continuing.'
  it: ''
- hash: 923e8b9f
  kind: cards
  en: The state defends itself by borrowing an unelected foreigner's powers. The OHR's Bonn powers gave Sarajevo its strongest tool against the entity, but every use lets Banja Luka, Moscow and Beijing
    call Bosnia a protectorate; Russia says the OHR is 'incompatible with the sovereignty of [BiH]', and when the guarantor weakens - Schmidt out in May 2026, Washington 'no longer pursuing nation-building'
    - the state discovers that its capacity was on loan.
  it: ''
- hash: 8dcd004e
  kind: cards
  en: Winning the legal case strengthened the defendant. The State Court convicted Dodik, the CEC removed him, the Constitutional Court annulled the RS laws and the entity retreated - yet Washington lifted
    its sanctions on him on 29 Oct 2025 as a 'responsive measure' to that retreat, and on 4 Oct 2026 his party took the entity again. The institutions won every ruling and the politics they were meant to
    protect moved the other way.
  it: ''
- hash: 53600fcc
  kind: cards
  en: The goal all three peoples share is held hostage by those who can veto it. EU accession is the one agenda that unites Sarajevo, Banja Luka and Mostar on paper, but opening talks needs a chief negotiator
    who speaks for 'the whole country with one voice' and judicial laws that the entity's and HDZ's blocking power can stall; the veto players lose nothing when EUR 373.9m is forfeited, the state does.
  it: ''
- hash: 9f9e5015
  kind: cards
  en: Cutting ties with Belgrade cannot be done by the state that wants to. Konakovic said he would sever relations with Serbia 'if I could', but the ambassador and consul serve at the Presidency's pleasure,
    so the state expelled two attaches, emptied the embassy and left the regional table (the good-neighbour memorandum) - a protest that costs Sarajevo regional standing and leaves Belgrade's patronage
    of RS intact.
  it: ''
- hash: 9838c5f6
  kind: cards
  en: Fixing the Croat grievance removes the Croat swing vote. The civic bloc (Komsic's DF) defended an election model in which Bosniak votes helped choose the Croat Presidency member; HDZ BiH attacked
    it for years with Zagreb's backing. On 4 Oct 2026 HDZ's Filipovic won the seat outright - ending the grievance, but also ending the Croat member who in 2020 joined the Bosniak member to back recognition
    of Kosovo and who calls Kosovo independent. The next Presidency has no vote for the state line other than the Bosniak member.
  it: ''
- hash: 3675ad97
  kind: cards
  en: Leaving Russian gas needs the very actors who split the state. Diversification runs through Croatia and an American concession, but the project was slowed by disputes inside the Federation over who
    operates it, while Republika Srpska talks to Gazprom about its own pipeline from Serbia; the US State Department warned Sarajevo in June 2026 against delay. Until then Serbia and Russia hold the only
    tap.
  it: ''
- hash: 4814972f
  kind: cards
  en: 'The road into Europe is the road out of the country. Accession is the state''s political purpose, yet freedom of work in Germany and the EU draws away the doctors, nurses and young workers the state
    needs to function: the population fell by about 18% in a decade and remittances of KM 4.46bn in 2025 finance consumption while the exodus continues.'
  it: ''
- hash: 15ed2be1
  kind: cards
  en: 'Bosnia and Herzegovina has no single grand strategy, and a card that pretends it

    has one would be wrong. The objectives above are those of the state-level

    institutions as the Bosniak-led majority reads them: the Presidency member

    Becirovic, the foreign minister Konakovic, the Constitutional and State Courts,

    the Central Election Commission, the SDA/SDP/Troika parties. Two other agendas

    sit inside the same state. The Republika Srpska leadership of Dodik''s SNSD,

    which has just won again, wants to hollow the state out - competences back to

    the entity, the OHR gone, status defined in Washington and Moscow - and keeps

    the Serb seat in the Presidency (Cvijanovic) to veto what it cannot win. The

    HDZ BiH leadership of Covic, backed by Zagreb, wants an election law that stops

    non-Croats from choosing the Croat member and has just obtained the seat

    outright. The paradox of the whole card is that a state must defend its

    existence against one of its own entities, with tools (the Bonn powers, EUFOR,

    Security Council cover, the courts) that belong in part to others, in a year in

    which the guarantors weakened - Schmidt resigned in May and no successor was

    agreed by mid-July, the US lifted its sanctions and said it was done with

    nation-building, Orban fell in April - while the electorate stayed home (42%).

    Signals that are not rows: the 31 Oct 2026 Security Council vote on EUFOR (the

    October 2025 renewal was 15-0, so the base case is renewal; Russia''s line on the

    OHR is the thing to watch), the identity of the next High Representative,

    whether Hungary under Magyar keeps Orban''s line toward Banja Luka, and whether

    the new Presidency can still produce a majority on foreign-policy questions

    after Komsic''s seat goes to HDZ. Sarajevo''s room for manoeuvre is real only

    where the EU and the entity cannot veto it: the courts, memory politics and the

    capacity to say no to Belgrade.'
  it: ''
- hash: 809a3984
  kind: cards
  en: 'Regime survival and continuity of Lukashenko''s personal power: a seventh term won on 26 Jan 2025 (87.48%, turnout 85.7%, in an election the EU''s High Representative called a sham with no legitimacy),
    a repressive apparatus that still holds roughly 850-1,000 political prisoners, and a succession that stays inside the system - the question of who follows him (a son, a loyal technocrat, or Moscow''s
    choice) is deliberately left open.'
  it: ''
- hash: 2e4e7b0f
  kind: cards
  en: 'Keep Russia as shield and paymaster without being absorbed: the Union State security-guarantees treaty (signed 6 Dec 2024, ratified Feb-Mar 2025) puts Belarus under Russia''s nuclear umbrella and
    obliges each side to support the other''s constitutional order; the same week Russia ratified a deferral of about USD 800m of state-loan repayments. Lukashenko pays in loyalty (''we have never been
    traitors'') while keeping ''my own understanding'' of the war.'
  it: ''
- hash: 24fd9707
  kind: cards
  en: 'Stay out of the shooting war while hosting it: Belarusian troops have not entered Ukraine (Lukashenko repeats they will not unless Belarus is attacked), yet territory served as the 2022 staging area,
    hosts (according to Kyiv) Russian drone relay stations, nuclear-capable Iskanders and, since December 2025, the Oreshnik; the price of that line is a hostile Ukraine fortifying 1,084 km of border, and
    Lukashenko''s declared ''targeted mobilisation'' (May 2026) is the sign of the strain.'
  it: ''
- hash: 0460d200
  kind: cards
  en: 'Trade prisoners for an opening to Washington: sanctions relief on Belavia (Sep 2025), potash (Dec 2025) and banks, the Finance Ministry and the Development Bank (19 Mar 2026), reopening of the US
    embassy in Minsk and a possible Lukashenko visit to the United States. Envoy Coale said in Minsk on 19 Mar 2026 that a Lukashenko trip to the US and the reopening of the embassy were being discussed.'
  it: ''
- hash: b17ce734
  kind: cards
  en: 'Protect the export economy: potash (the largest foreign-currency earner, now shipped through Russian ports because Lithuania closed Klaipeda in 2022), refined oil products from two refineries run
    on Russian crude, and a Russian market that takes about 61% of foreign goods trade. The target is to reopen the Western routes (US relief, a Klaipeda transit deal, the EUR 12bn arbitration claim against
    Lithuania) so Russia is not the only door.'
  it: ''
- hash: 0ee696f0
  kind: cards
  en: 'Diversify outward so that Russia is not the only partner: full SCO membership since 4 Jul 2024, an ''all-weather strategic partnership'' with China (2025), China as the second trading partner (about
    11% of external trade), plus tentative ties with North Korea and a seat in the EAEU and CIS. Beijing offers markets and a hedge, not security or money on Moscow''s scale.'
  it: ''
- hash: 1ebcf6ff
  kind: cards
  en: 'Political prisoners as currency: batches of releases (52 in Sep 2025, 123 in Dec 2025 including Bialiatski, Kalesnikava and Babaryka, 250 on 19 Mar 2026 with Tsikhanouski among them, 15 sent to Lithuania)
    are traded for US sanctions relief through the Coale channel; a prisoner swap with Poland (Poczobut, 28 Apr 2026) and a telephone call with Macron (24 May 2026) extend the same method toward Europe.'
  it: ''
- hash: fac01674
  kind: cards
  en: 'Multi-vector membership: the Union State, CSTO (Minsk hosted the 2023 summit), EAEU (Eurasian Intergovernmental Council in Minsk on 2 Oct 2026), CIS (summit in Turkmenistan 8-9 Oct 2026) and SCO,
    used to present Belarus as part of a post-Western order rather than a Russian province.'
  it: ''
- hash: 66aad4e3
  kind: cards
  en: 'Total control of the information field: independent media banned, a list of ''extremists'' of 6,650 names (May 2026), in-absentia sentences for exiled analysts, even the exiled European Humanities
    University labelled extremist; the regime frames the prisoner releases as ''humanitarian'' and denies Ukrainian claims (Valfovich''s claim of 116 Ukrainian drone incidents in a week was called ''absurd''
    by Kyiv).'
  it: ''
- hash: bb9e35f4
  kind: cards
  en: 'Hosting as leverage: Russian tactical nuclear weapons (delivery announced from June 2023 under a May 2023 storage agreement; Lukashenko claimed ''several dozen'' warheads in Dec 2024, unverified),
    Iskander launchers, the Oreshnik brigade declared on combat duty in December 2025 (subordinate to Russian Strategic Missile Forces according to Jamestown), the Zapad-2025 exercise of 12-16 Sep 2025,
    and a Regional Group of Forces with Russia since Oct 2022.'
  it: ''
- hash: d8fd16e6
  kind: cards
  en: 'Hybrid pressure on the EU''s border: the 2021 instrumentalisation of migrants (EU legal basis for sanctions in Nov 2021), Wagner fighters hosted after the June 2023 mutiny (Morawiecki said on 29
    Jul 2023 that over 100 moved toward the Suwalki gap, disputed by Belarusian monitors), cigarette-smuggling balloons that closed Vilnius airport repeatedly in 2025-26.'
  it: ''
- hash: 54036a01
  kind: cards
  en: 'Potash, refined products and a customs union as levers and lifelines: Belarus exports potash to non-Western markets via Russian ports and bargains for US relief on it; it retaliates against Lithuania
    by detaining trucks (about 200 still held in May 2026); it uses the EAEU to place goods in Russia''s market and China''s markets for machinery and food.'
  it: ''
- hash: 32dfecef
  kind: cards
  en: 'Economic hostage to Russia: about 61% of foreign goods trade and about 93% of trade with the CIS (Belstat figures cited by Lukashenko''s chief of staff, 2025), Russian state loans (about USD 800m
    of repayments deferred in the winter of 2024-25) and Russian crude for both refineries; Moscow''s planned shipment-confirmation system (SPOT, Feb 2026) can complicate trade at will.'
  it: ''
- hash: e9f66bbc
  kind: cards
  en: 'The EU wall: the EU renewed its Belarus sanctions on 26 Feb 2026 until 28 Feb 2027 (312 persons, 57 entities, sectoral measures incl. fertilisers) and Lithuania''s foreign minister said on 26 May
    2026 that no review comes before February 2027; US relief does not open the European routes.'
  it: ''
- hash: 13f4326b
  kind: cards
  en: 'No control over the weapons it hosts: the Oreshnik battalion is subordinate to Russian Strategic Missile Forces according to Jamestown and Ukrainian intelligence (Lukashenko''s claim that ''targets
    will be determined by us'' is unverified), the nuclear warheads stay under Russian custody, and the treaty allows Russian bases and troops ''to repel aggression''.'
  it: ''
- hash: 816485f6
  kind: cards
  en: 'A closing western border: Poland sealed all crossings during Zapad-2025 (12 Sep 2025) and reopened two on 17 Nov 2025 only for limited traffic, Lithuania shut its last two crossings for three weeks
    (27 Oct - 20 Nov 2025), Latvia has kept Silene closed since Sep 2023 and counts over 9,000 illegal-crossing attempts in 2026; China-Europe rail transit was blocked in the process.'
  it: ''
- hash: 3ac60bbd
  kind: cards
  en: 'A narrow domestic base: 52% of Belarusians in an iSANS survey want normalisation with the EU, a mass exile since 2020 (Tsikhanouskaya''s office now in Warsaw as well as Vilnius, a Mission of Democratic
    Belarus opened in Kyiv on 27 May 2026), and repression that only works while the security services are loyal - and the 2026 call-up of reservists was reported by Ukrainian and opposition sources to
    be done under cover of combat-readiness inspections.'
  it: ''
- hash: eaf84a7a
  kind: cards
  en: 'China is a hedge, not a rescuer: bilateral trade of USD 8.85bn in 2025 with a USD 5.53bn deficit for Belarus, direct investment of about USD 550m over ten years (against USD 17.45bn in Russia), Chinese
    loans at no more than 1.3% of industrial investment, Great Stone park results described as minimal, 11 of 13 certified poultry farms barred from China.'
  it: ''
- hash: 42a80972
  kind: cards
  en: Buying Russian protection removes the autonomy it was meant to protect. The security-guarantees treaty, the nuclear umbrella and the Oreshnik brigade make an invasion of Belarus unthinkable - and
    place the launchers under Russian command, open the way to Russian bases and commit Belarus to help 'support' the other side's constitutional order, so that Moscow, not Minsk, holds the last word over
    succession.
  it: ''
- hash: 36a7eaed
  kind: cards
  en: Border pressure meant to extract concessions has produced the closed borders that choke Belarus. The 2021 migrant push, the 2023 Wagner presence and the 2025 smuggling balloons won attention in Brussels
    and Vilnius, but they also bought sanctions, the closing of Polish, Lithuanian and Latvian crossings, about 200 detained Lithuanian trucks that keep Vilnius hostile, and a halt to the China-Europe rail
    transit that Belarus wanted to sell.
  it: ''
- hash: a55b6e2b
  kind: cards
  en: Releasing prisoners to win relief exports the opposition leadership. Each batch (Bialiatski, Kalesnikava, Babaryka, then Tikhanovsky) goes to Lithuania, Poland or Ukraine, where the exile network
    has grown to a Warsaw office, a Kyiv mission and an ambassador-at-large for Belarusian democratic forces; meanwhile Viasna still counts 854 political prisoners, because new arrests refill the cells.
  it: ''
- hash: be78be33
  kind: cards
  en: The 2020 crackdown that secured the regime cost it the potash route that paid for the regime. Lithuania closed Klaipeda in 2022 and Belaruskali's exports moved to Ust-Luga and St Petersburg, shifting
    transit revenue from Lithuania to Russia and deepening the dependence on Moscow that Lukashenko wants to reduce; the EUR 12bn arbitration claim against Lithuania will not be decided before 2027.
  it: ''
- hash: f7a71d13
  kind: cards
  en: Staying 'neutral' in the war while hosting it earned the enmity of Kyiv without the gratitude of Moscow. Zelensky said on 7 Nov 2025 that Lukashenko 'will pay' for enabling the offensive; Ukraine
    mans a fortified border and opened a Belarusian democratic mission in Kyiv, while Moscow's own measures (the SPOT shipment-confirmation system that Lukashenko admits 'may complicate' trade) show its
    trust has limits.
  it: ''
- hash: 392c079e
  kind: cards
  en: The opening to the West and the arming against it run side by side. While Coale negotiates, Lukashenko announced a 'targeted mobilisation' (12 May 2026), Western Operational Command was put on readiness
    in February 2026, and the EU added listings in April and July 2026 - the very behaviour that keeps European sanctions in place until at least February 2027 and leaves the US as the only door.
  it: ''
- hash: c6ecbe14
  kind: cards
  en: 'Belarus runs the strategy of a regime that has no allies except the one that

    can also swallow it. Every move is a trade of the same thin assets - territory,

    prisoners, potash, nuclear hosting, the capacity to make trouble at the

    border - for survival, and the Luttwak pattern is that each trade sells a part

    of the autonomy it was meant to protect: protection from Russia is bought with

    the right to decide on launchers and on succession, and the hybrid pressure on

    Poland and Lithuania, meant to be a lever, has closed the doors Minsk wanted

    to sell (transit, rail, Klaipeda). Since September 2025 Lukashenko has found a

    second buyer in Trump''s Washington, which pays in sanctions relief for batches

    of prisoners and which neither Moscow nor Brussels can yet outbid; the question

    for 2026-27 is whether the American channel (embassy, Lukashenko''s possible US

    trip, a potash deal) is a real exit from Moscow''s orbit or only a premium on the

    old rent. The evidence says the second: the Oct 2026 statements promise ''full

    support'' to Putin, the Oreshnik is on duty, mobilisation is under way and the

    EU wall stands until February 2027. Two signals that are not rows: Lukashenko''s

    remark that he has ''my own understanding'' of the Ukraine war (2 Oct 2026), and

    the unanswered succession question - no heir has been designated, the minimum

    age for the presidency was raised, and the treaty''s clause on mutual support for the constitutional order gives Moscow a say

    in how it will be answered.'
  it: ''
- hash: 727325e1
  kind: cards
  en: Keep the 1859 boundary against Guatemala's claim, and have it settled by the International Court of Justice rather than by force or by bilateral bargaining. The 2008 pact sent the question to the
    court; the referendums passed in both countries by May 2019, written arguments closed in June 2023, and oral arguments began in November 2025 (Wikipedia). The ICJ case page redirected and was not read,
    so the hearing dates are tier 4.
  it: ''
- hash: 5db67aba
  kind: cards
  en: Keep the economy solvent with tourism and the 2021 debt-for-nature swap. Belize bought back its commercial debt with blue bonds of about US$364 million, financed by a Nature Conservancy loan, and
    committed to marine protection on 30% of its waters by 2026 (search summary of IMF and press coverage; the IMF page was not read).
  it: ''
- hash: 9d45cd80
  kind: cards
  en: 'Legal track at The Hague: the 2008 special agreement with Guatemala, the court as referee, and no bilateral concession on the boundary. This is the instrument Belize uses instead of military or treaty
    backing; its diplomatic seats (Commonwealth, OAS, UN, WTO, CELAC) are already in the datasets, with the citations there.'
  it: ''
- hash: 9888ac23
  kind: cards
  en: Tourism as the main earner of foreign exchange, with the United States and retired US residents as the core visitors and expatriate remittances as a second channel (Coface, search summary). Tourism
    is the lever of the economy, and it is exposed to hurricanes.
  it: ''
- hash: 72b1193d
  kind: cards
  en: No army of its own to hold the line. Britain stationed troops in British Honduras against a Guatemalan invasion; since 1999 both states have kept troops on a one-kilometre adjacency zone along the
    1859 line (Wikipedia, tier 4 pointer). The British garrison and the ICJ are the two forms of protection, and neither is a treaty guarantee in any source read.
  it: ''
- hash: 79c47e21
  kind: cards
  en: Small, hurricane-exposed economy. Coface lists dependence on tourism and on US visitors and remittances as the main weaknesses, and notes the exposure of farming and tourism to severe weather.
  it: ''
- hash: 995044eb
  kind: cards
  en: The 2008 pact was meant to take the claim off the bilateral table. The referendums took eleven years and the hearings have not closed, so the claim stays open in every bilateral and multilateral meeting
    while the court deliberates. Waiting for law is also what keeps the dispute alive.
  it: ''
- hash: 1fd87e7e
  kind: cards
  en: 'Belize''s strategy is to keep its 1859 boundary by making law the arena: since the 2008 pact the claim has been before the ICJ, and Guatemala has not accepted the treaty that settled the line. Its
    money is tourism and a debt swap that bought room without ending its dependence on outside creditors and on the British garrison for protection. Briceño''s PUP was re-elected on 12 March 2025 with 26
    of 31 seats (Jamaica Observer, search summary), so the policy of waiting for the court is set to run through the next term.'
  it: ''
- hash: b5e5d7d3
  kind: cards
  en: 'Keep the state solvent in a fuel and dollar crisis: restore fuel supply and foreign credit by re-normalising relations with Washington (ambassadors, the DEA, a fuel channel), reversing the 2008 expulsions
    that defined the MAS era.'
  it: ''
- hash: ea5902bf
  kind: cards
  en: 'Turn lithium and gas into an export economy under a legal regime: certify the reserves, pass a lithium law, and review the Chinese and Russian contracts that Congress had blocked, keeping what can
    be salvaged.'
  it: ''
- hash: 8cafe952
  kind: cards
  en: Re-normalisation with the United States, announced by Paz and Deputy Secretary of State Christopher Landau in November 2025 with an exchange of ambassadors to follow; the DEA's return was announced
    by the new drug czar, not yet confirmed as implemented. Washington's public backing against the 2026 protests is the visible return.
  it: ''
- hash: 60025f89
  kind: cards
  en: 'Lithium as the bargaining chip: the contracts with CATL (a 2023 deal worth USD 1.4bn) and with Uranium One, a Russian firm, are under review, neither approved by the legislature, and neither close
    to commercial production.'
  it: ''
- hash: 5b9156f5
  kind: cards
  en: 'The fuel and dollar crisis: Bolivia needs US fuel and foreign loans now, which gives Washington leverage and limits what the lithium review can cancel without losing supply. Protests over the economic
    and fuel crisis in 2026 show the cost of the wait.'
  it: ''
- hash: 4b9e97cd
  kind: cards
  en: 'Closed in law: the ICJ held on 1 Oct 2018 (12 votes to 3) that Chile has no obligation to negotiate sovereign access to the Pacific, so the sea route is shut in law; the 1 Dec 2022 Silala judgment
    did not settle the status of the river waters. Congress has blocked earlier China and Russia lithium agreements, so any new deal needs a legislature that has already said no once.'
  it: ''
- hash: 1e9f49e3
  kind: cards
  en: The pivot to Washington for fuel and dollars reverses the 2008 expulsions that defined the MAS sovereignty story, while the lithium review that must attract capital means renegotiating the Chinese
    and Russian contracts that the same government is leaving behind.
  it: ''
- hash: 5dd13540
  kind: cards
  en: 'Rodrigo Paz, in office since 8 November 2025, is trying to end the MAS era by buying

    his way out of the fuel and dollar crisis: re-normalising relations with the United

    States, reviewing the Chinese and Russian lithium contracts, and accepting a sea claim

    that is closed in law, which keeps Chile a rival rather than an enemy. The real

    constraint is the balance sheet, not the alignment: the lithium and gas that could

    repay the debt are slow to monetise, and Washington''s fuel and loans come at the price

    of a sovereignty signal that the country built carefully since 2008. Not written in

    this pass: the 2025-26 terms with Argentina, Brazil, Peru (the Ilo port) and Iran (the

    2023 agreement), for which no source was read.'
  it: ''
- hash: a7e96dde
  kind: cards
  en: 'Win the 25 October 2026 runoff, or at least keep the Lula line in office: in the first round on 4 October Flávio Bolsonaro took 47.03% and Lula 45.16%. The vote is the constraint on every choice
    below.'
  it: ''
- hash: 72402d00
  kind: cards
  en: 'Sell to Europe and Asia without losing the Mercosur bloc: the EU-Mercosur partnership agreement was signed on 17 January 2026, provisionally applied from 1 May 2026, and referred by the European
    Parliament to the EU''s top court on 21 January. Argentina''s Milei pulls the bloc towards the US and the EU instead of Asia.'
  it: ''
- hash: 945ed197
  kind: cards
  en: 'Make the Amazon the leadership card: a joint pledge with France (March 2024) to halt Amazon deforestation by 2030 with EUR 1 billion over four years for the Brazilian and Guyanese Amazon, and COP30
    hosted in Belém in November 2025 as the stage.'
  it: ''
- hash: b6f049e1
  kind: cards
  en: 'Contain the US coercion of 2025-2026 without a rupture: the 50% tariff of 30 July 2025 over the Bolsonaro trial, partly rolled back, and the 25% Section 301 duty of 15 July 2026 are the costs; the
    delisting of Justice de Moraes (12 Dec 2025) is the sign that the pressure can be negotiated.'
  it: ''
- hash: 0ea97fff
  kind: cards
  en: 'Turn weight into a seat at the top table: a permanent place on a reformed UN Security Council (with Germany, India and Japan in the G4) and the BRICS as the vehicle for reforming global governance.
    Lula opened the 81st General Assembly debate on 22 September 2026, the tenth time, with multilateralism, sovereignty and Security Council reform as the themes.'
  it: ''
- hash: d7b9b074
  kind: cards
  en: 'Keep the minerals and the energy on Brazilian terms: Lula pitches Brazil as a reliable supplier of critical raw materials (niobium, graphite, rare earths) but wants them processed at home, refuses
    exclusivity, and has left the US request for a federal critical-minerals agreement without a ''political response''; the Chamber passed a critical-minerals bill in May 2026 (343-97), now with the Senate.
    Partners courted in parallel: Germany, India, Japan.'
  it: ''
- hash: da75841b
  kind: cards
  en: 'Agribusiness: soybeans and beef sold to China, which replaced American soybean buyers in 2025 and is the largest trading partner. China''s 55% tariff on Brazilian beef after the quota was reached
    (30 Sep 2026) shows the lever runs both ways.'
  it: ''
- hash: 5e94d35d
  kind: cards
  en: 'Multilateral platforms: a BRICS co-founder (Rio summit July 2025; the New Delhi declaration of September 2026 dropped any mention of Ukraine), Mercosur, and the COP30 host. Brazil abstained on the
    UN General Assembly text on Ukraine of 24 February 2026.'
  it: ''
- hash: 31b1fbd3
  kind: cards
  en: 'Sovereignty language: Lula called the US removal of Maduro in January 2026 an ''unacceptable line'' and a grave affront to Venezuela''s sovereignty, and asked the UN to respond. It is the argument
    the government uses against US pressure in general.'
  it: ''
- hash: 1d18f424
  kind: cards
  en: 'A defence industry that buys autonomy slowly: SIPRI puts 2025 spending at USD 23.9bn (+13% in real terms, the largest in South America, 1.1% of GDP). The assets are the French-built Riachuelo-class
    submarines and the nuclear-powered boat under construction at Itaguai (first steel cut June 2025), 36 Saab Gripen assembled at Embraer''s Gaviao Peixoto line (a heads of agreement for 20 more signed
    21 July 2026) and the KC-390 transport (Embraer defence backlog USD 6.1bn in Q2 2026). The means are long-dated and none is a deterrent against a great power.'
  it: ''
- hash: 1486833d
  kind: cards
  en: 'The forest as a diplomatic credential: COP30 in Belem (November 2025) launched the Tropical Forest Forever Facility, with more than USD 5.5bn pledged at launch (Norway USD 3bn, Indonesia and Brazil
    USD 1bn each, France EUR 500m; Germany EUR 1bn announced later), 53 countries endorsing the declaration and a target of USD 125bn (USD 25bn sponsors, USD 100bn private). Brazil''s finance minister expects
    USD 10bn before the COP presidency passes on in November 2026.'
  it: ''
- hash: 50de19cf
  kind: cards
  en: 'The bloc as a trade-negotiating vehicle: Brazil''s Senate approved the EU-Mercosur agreement unanimously on 4 March 2026 and it has applied provisionally since 1 May 2026 (Mercosur removes 93% of
    tariffs on EU goods over up to 15 years; the EU opens a 99,000 t beef quota at 7.5%); Mercosur launched economic partnership talks with Japan on 30 June 2026, a second market opened through the same
    bloc. It is the most direct answer to the US tariff of 2025.'
  it: ''
- hash: 8a2dd7b7
  kind: cards
  en: 'The runoff: the winner of 25 October decides which foreign policy line the next government carries. Every choice above is a bet on Lula''s re-election, and the first round put him 1.9 points behind.'
  it: ''
- hash: 2a523c55
  kind: cards
  en: 'Dependence on China as a buyer: China takes the soybeans and beef that carry the trade balance, and it can hit them with tariffs (the 55% beef duty of 30 Sep 2026). Brasilia cannot choose freely
    between Washington and Beijing on trade.'
  it: ''
- hash: f5fb8c37
  kind: cards
  en: 'US market access: the 2025 tariff was partly rolled back, but the Section 301 case ended in a 25% duty on Brazilian goods (15 July 2026). Washington chooses the sectors and the timing of the pressure.'
  it: ''
- hash: 94533ad2
  kind: cards
  en: 'A hollow sword: the defence minister said on 4 August 2026 that if the US invaded Brazil would have to ''open the gate'', for it has neither the equipment nor the money to repair it. A budget decree
    froze BRL 4.36bn of discretionary defence spending in May 2026, a November 2025 law allows up to BRL 30bn over six years outside the fiscal limit (a ceiling, not a transfer), and spending is 1.1% of
    GDP (1.3% in 2016). Brasilia can resist Washington in words and in trade, not by force.'
  it: ''
- hash: a9fb5e3b
  kind: cards
  en: 'A neighbourhood turning right: Argentina, Chile, Paraguay, Bolivia and Ecuador are governed from the right, Colombia (Abelardo de la Espriella, inaugurated in August) and Peru (Keiko Fujimori, 28
    July) have joined, Kast chose Argentina for his first trip as a ''conservative axis'' against Brazil and Milei met Fujimori in Lima weeks after calling Lula a ''thief''. Lula skipped the Chilean, Colombian
    and Peruvian inaugurations. Brazil''s regional leadership is a hand the neighbours can decline to take.'
  it: ''
- hash: 1a3f1b44
  kind: cards
  en: 'Energy that lives in the neighbours'' hands: Bolivia is Brazil''s largest gas supplier (a 3,150 km pipeline of up to 30 million cubic metres a day) while Petrobras now operates only 25% of Bolivian
    gas output against 60% once, and the Itaipu tariff (Annex C review, 50 years after the treaty) is still open with Paraguay, which wants to sell its surplus on the Brazilian free market. Lula reportedly
    will not raise the Itaipu price before the vote, so the dossier waits.'
  it: ''
- hash: b6c64a15
  kind: cards
  en: The sovereignty case against Washington's pressure over the Bolsonaro trial gives Lula an issue, yet his runoff rival is Jair Bolsonaro's son Flávio. The fight with the US keeps the Bolsonaro question
    at the centre of the vote.
  it: ''
- hash: 5ba2434d
  kind: cards
  en: 'The Amazon agenda depends on the commodities that drive clearing: the COP30 and France pledges are credible only if the agribusiness that earns the trade surplus does not push the forest back. China''s
    beef duty shows how exposed that trade is.'
  it: ''
- hash: 6614d1ab
  kind: cards
  en: 'Brazil needs the EU deal most, and its own bloc blocks it: Milei called Lula a ''thief'' and a ''convict'' at a July 2026 rally in São Paulo for Flávio Bolsonaro, and the European Parliament''s referral
    to the court slows the agreement Brasilia wants.'
  it: ''
- hash: dd2e8284
  kind: cards
  en: 'The tariff war that feeds the rival it was meant to starve: Washington''s 50% tariff of 2025 cut Brazilian exports to the US (-20.3% in September 2025) while exports to China grew 14.7% in the same
    month and China took nearly 80% of the soybean exports through October 2025. Pressure meant to bring Brazil back towards the US market pushed the farm sector into the arms of Beijing, which in turn
    hit Brazilian beef with a 55% duty on 30 September 2026. The US coercion made the second dependency, and Brazil now owes both.'
  it: ''
- hash: d8ee726c
  kind: cards
  en: 'The BRICS frame earns a stage and costs a market: Brazil hosted the Rio summit in July 2025 as the Global South''s convenor, and within hours Trump threatened an extra 10% tariff on any state aligning
    with BRICS ''anti-American policies''; Brasilia then declined the Belt and Road (October 2024) and signed a New Delhi declaration in September 2026 that dropped Ukraine to keep the group together. The
    group lends Lula a voice on governance, but the EU, the US and Japan are where the market is, so Brazil must keep its BRICS posture loud enough to lead and quiet enough not to be taxed.'
  it: ''
- hash: 0aad51b2
  kind: cards
  en: 'The sovereignty argument that protects Caracas also shields a government Washington runs: Lula called the US removal of Maduro an ''unacceptable line'' and recognised Delcy Rodriguez as head of state
    on 4 January 2026, offering himself as mediator. But Rodriguez governs under Treasury licences and oil money that Washington holds, so Brazil''s defence of Venezuelan sovereignty props up a state whose
    real decisions are made elsewhere, and its offer of mediation has little to broker. The same line leaves Brasilia armed with words only (see the defence constraint).'
  it: ''
- hash: e1768564
  kind: cards
  en: 'The Amazon is a credential and a bargaining chip, and Petrobras is drilling at its mouth: Brazil hosts COP30, launches the forest fund and shows the lowest deforestation alerts in a decade (INPE''s
    DETER: 2,874 sq km between August 2025 and July 2026, more than a third below the previous year), while Petrobras announced hydrocarbons in the Foz do Amazonas basin on 14 August 2026 and Ibama added
    three wells in September. The forest brings the donors'' money; the oil at the river mouth pays for the state; and Washington lists ''illegal deforestation'' among the grounds of its Section 301 duty,
    so the same forest that justifies the leadership also gives others a handle on Brazil.'
  it: ''
- hash: 2e402983
  kind: cards
  en: 'Brazil plays the strategy of a continental power that will not take sides. It sells soybeans and beef to China, trades with the EU, speaks for the Global South in the BRICS and wants to lead on the
    Amazon, while US tariffs and sanctions and Argentina''s feud push it to lean on its own bloc. The 25 October runoff is the constraint that decides how long this holds, because the sovereignty line that
    works against Washington is also the line that the Bolsonaro camp contests. Brazil''s partners are many and none is a bloc of its own, so its room is the room that the vote leaves.


    Enriched 2026-10-16 (protagonist pass). Read through Luttwak, Brazil is a country whose paradoxes all come from one fact: it is strong enough to be courted by every pole and too weak in arms to be feared
    by any. Each coercion has found it a substitute (China for the US soybean trade, the EU and Japan through Mercosur for the US market, the forest fund for the money of the rich states), and each substitute
    has made a new dependency (China''s beef duty, the Brussels court, Argentina''s veto in the bloc). The seams are visible: Washington presses it with tariffs and a Section 301 duty while Berlin, Madrid,
    London and Tokyo court it as a supplier of minerals and a partner in governance; Beijing buys what it grows and taxes it when it grows too much. The neighbourhood has turned right (Argentina, Chile,
    Paraguay, Bolivia, now Colombia and Peru) just as Brasilia needs it most, which makes the 25 October runoff a hinge for the whole card: a Flavio Bolsonaro victory would put the sovereignty line against
    Washington, the BRICS posture and the Gaza line in question at once (our reading: the campaign coverage read does not set out either candidate''s foreign policy), while a Lula victory keeps the card
    as it stands, with the neighbours cooler and the tariff in place. The runoff polls are tight and lean to Flavio (Datafolha, 6-7 October: 49% to 45%, margin 2 points).'
  it: ''
- hash: da5e6c48
  kind: cards
  en: Turn climate finance into a reform of the World Bank and IMF. The Bridgetown Initiative, first set out in 2022 by a group led by Prime Minister Mia Mottley, asks for emergency liquidity against debt
    crises, about US$1 trillion more multilateral lending for climate and social development, and guarantees to draw private capital into climate projects. Its later version, 3.0, was launched at the Small
    Island Developing States conference in Antigua and Barbuda.
  it: ''
- hash: c41a9d5b
  kind: cards
  en: Keep the Caribbean out of a US military frame. In September 2025 Mottley told the UN General Assembly that the Caribbean 'must remain a zone of peace' and warned that the build-up of military assets
    'could occasion just an accident'. In October she called the situation 'extremely dangerous and untenable' and urged regional leaders to reject US strikes on alleged drug traffickers, which she called
    extrajudicial killings.
  it: ''
- hash: a0965d38
  kind: cards
  en: The UN and climate stages. Mottley's General Assembly speech and the Bridgetown name make a small state heard far beyond its size. In the same speech she praised Kenya's leadership of the Haiti security
    mission and asked the UN Security Council and the OAS for more support.
  it: ''
- hash: 086488d7
  kind: cards
  en: The Commonwealth link to London. Barbados became a republic in 2021 but stays in the Commonwealth and keeps a High Commission in London; it is the UK's fourth-largest export market in the Caribbean.
    The shared history (1627-1966) gives the channel its weight.
  it: ''
- hash: 8970363e
  kind: cards
  en: A small state asking large shareholders for money. The Bridgetown reform needs the votes and capital of the large economies that run the World Bank and IMF. Its ideas have gained traction among them,
    but the sources say they are still being debated, and one German-language source calls parts of them contested.
  it: ''
- hash: cab53ccf
  kind: cards
  en: A split region on the US file. Trinidad and Tobago's prime minister played down talk of aggression and called the USS Gravely's visit part of planned cooperation with Washington, so the Caribbean
    does not speak with one voice on the US deployment.
  it: ''
- hash: f0a06cc8
  kind: cards
  en: Her climate case runs through the institutions whose governance is set by large shareholders, the governments whose military posture she calls 'untenable'. Pressing Washington on the Caribbean build-up
    while needing its support for the World Bank and IMF reform pulls two ways. This is our reading; no source states the US weight in those votes.
  it: ''
