# Translate every `en` into it. Write the translations to the file cards-04.out.yaml next to this one,
# as `items:` of `- hash: <same hash>` / `it: <translation>`, appending one item at a time (valid YAML at
# every step), never editing this file. Keep names, dates, numbers and quotes; register of a foreign-office
# brief: dry, precise, no flourish.
lang: it
items:
- hash: 7e5093ba
  kind: cards
  en: 'Rabuka''s Fiji takes the Pacific frame as its own instrument: it chairs the Melanesian

    Spearhead Group, carried the Ocean of Peace through the Forum and opened an embassy in

    Jerusalem, while selling security to Canberra and Wellington and seeking money and tariff

    relief from Washington. The open question is whether a no-alliance posture survives a

    Vuvale treaty, closer policing with Australia and a general election due at the turn of

    2026-27.'
  it: ''
- hash: 100f37e7
  kind: cards
  en: 'Remain a sovereign great power whose nuclear deterrent is its own: ''strategic autonomy'' at the centre, now extended to Europe as ''forward deterrence'' (2 Mar 2026: more warheads ordered, arsenal
    size no longer published, temporary deployment of nuclear-capable aircraft to allies, talks with eight partners) while the decision to use stays with the French president alone.'
  it: ''
- hash: 3616212e
  kind: cards
  en: 'Contain Russia and keep Ukraine in the war and out of Russian hands: the 2025 National Strategic Review names Russia the main threat, and France co-leads the Coalition of the Willing with the UK
    (Paris Declaration, 6 Jan 2026) whose post-ceasefire force is conditional on a ceasefire Moscow has not accepted.'
  it: ''
- hash: 3182689b
  kind: cards
  en: 'Make the EU, not NATO alone, the frame of European defence and industry, with France at the centre: European preference in procurement, the SAFE loan (about EUR 15.1bn for France), arms exports (Rafale,
    SAMP/T, Caesar) and a veto-style opposition to Mercosur to protect farmers.'
  it: ''
- hash: 2cf3b658
  kind: cards
  en: 'Keep the United States inside European security while preparing for its partial exit: the 2026 tariff threat over Greenland, the US troop review (June 2026) and the ''NATO 3.0'' idea of Europe taking
    primary responsibility push Paris to build the European pillar it has always wanted, on a timetable it did not choose.'
  it: ''
- hash: 0b811cc5
  kind: cards
  en: 'Hold the overseas territories and the Indo-Pacific position (New Caledonia first) and stay a Mediterranean and Middle Eastern power after the African retreat: Bougival accord (12 Jul 2025) and its
    supplement, post-UNIFIL force in Lebanon, renewed defence pact with Greece (25 Apr 2026), recognition of Palestine (22 Sep 2025).'
  it: ''
- hash: 6be7121e
  kind: cards
  en: 'Pay for all this: bring the 2027 deficit toward 5% of GDP with a record debt near 120%, in a hung Assembly, while defence spending rises to about EUR 63-64bn in 2027. The foreign policy is exercised
    by a president who leaves office in May 2027 and is the least popular since 2017.'
  it: ''
- hash: 805021a9
  kind: cards
  en: 'Seats and formats: permanent member of the UN Security Council, nuclear power, co-lead of the Coalition of the Willing with the UK, Weimar triangle, bilateral treaties (Quirinale with Italy, Nancy
    with Poland in May 2025, the April 2026 Enhanced Strategic Partnership with Greece with a mutual-assistance clause), the Northwood Declaration (10 Jul 2025) with the UK and the 2026 ''nuclear'' talks
    with eight partners.'
  it: ''
- hash: f12ca1e0
  kind: cards
  en: 'Recognition and mediation: recognition of Palestine (22 Sep 2025) at the UN conference co-chaired with Saudi Arabia, hosting the Lebanon support talks (Sept 2026) and a push to keep an international
    presence in south Lebanon after UNIFIL ends on 31 Dec 2026.'
  it: ''
- hash: 8257795b
  kind: cards
  en: 'Public framing by the president: speeches that call the Russian hybrid threat ''intensifying'' and promise it ''will not go unanswered'' (Sept 2026), an Elysee that denounces tariffs as ''unacceptable''
    (Jan 2026) and the 2025 National Strategic Review as the doctrinal text.'
  it: ''
- hash: 42ab773b
  kind: cards
  en: 'A full-spectrum army with its own deterrent: roughly 290 warheads (SIPRI estimate cited by Euronews, now no longer published by Paris), a defence budget rising to about EUR 63-64bn in 2027 under
    the updated military programming law (+EUR 36bn over 2026-30), the lead of the multinational battlegroup in Romania, a ground rotation into Forward Land Forces Finland announced at the July 2026 Ankara
    summit, and a contingent in the January 2026 Greenland deployment.'
  it: ''
- hash: fc5ad7f7
  kind: cards
  en: 'Arms exports and EU money as instruments: Rafale to Serbia (12, EUR 2.7bn) and Croatia (12), SAMP/T to Denmark (about DKK 58bn), Caesar to Armenia (36), a pending 114-Rafale deal with India, and
    a SAFE ceiling of about EUR 15.1bn that must be spent largely on European kit.'
  it: ''
- hash: d6936dd8
  kind: cards
  en: 'Public finances: deficit 5.4% of GDP expected in 2026, about 6.5% in 2027 without EUR 54bn of cuts, debt close to 120% of GDP; budgets pass only after no-confidence motions fail (the 2026 budget
    in February 2026) and the Socialist Party calls the 2027 plan austerity.'
  it: ''
- hash: 9052ced1
  kind: cards
  en: 'A weak domestic base: no majority in the Assembly since the 2024 snap election, successive prime ministers (Lecornu reappointed in October 2025), and a presidential race in which Marine Le Pen, whose
    appeal left her eligible in July 2026, leads first-round polls.'
  it: ''
- hash: 01cc034f
  kind: cards
  en: 'The nuclear promise is narrow: France keeps sole control of use, offers no treaty-style guarantee and has an arsenal of a few hundred warheads, so partners such as Poland''s presidency doubt it can
    replace the American umbrella and Warsaw calls hosting nuclear-capable aircraft ''not my dream''.'
  it: ''
- hash: 7c0737c9
  kind: cards
  en: 'The African position is gone: bases handed back in Chad (2025), Senegal (17 Jul 2025) and Cote d''Ivoire, forces expelled from Mali, Burkina Faso and Niger, with Russia''s Africa Corps in their place;
    only Djibouti and Gabon keep French troops (reported).'
  it: ''
- hash: 17a5ffe1
  kind: cards
  en: 'Dependence on American enablers and on the American decision on Ukraine: the Paris Declaration''s ceasefire enforcement runs through the United States, and Washington is reviewing its troops in Europe
    and tying NATO dues to spending.'
  it: ''
- hash: 8558ef0f
  kind: cards
  en: 'Germany: the flagship fighter FCAS collapsed (April-July 2026) over work share, export rules and carrier and nuclear-delivery requirements, leaving the Franco-German motor without its main project
    even as a nuclear steering group is created.'
  it: ''
- hash: aa733dd6
  kind: cards
  en: The nuclear umbrella offered to Europe is also what makes it uncredible. France insists on sole decision and no guarantee to keep its freedom of action; the same caveat is what leads Warsaw and Berlin
    to doubt it can replace the American umbrella, so the offer widens the field of talks without moving any ally off dependence on Washington.
  it: ''
- hash: dec5434f
  kind: cards
  en: Strategic autonomy is built on American cover. Paris co-leads the force for Ukraine and calls for European sovereignty, yet the force exists only after a ceasefire and the Paris Declaration leaves
    ceasefire enforcement to the United States; autonomy is exercised where Washington lets it.
  it: ''
- hash: 9e27aecc
  kind: cards
  en: Defending its industrial centre broke the European project. Insisting on a work share of about 80% and on carrier-compatibility and nuclear delivery for the common fighter ended FCAS, the symbol of
    the Franco-German motor, in the year Paris asked Berlin to join its nuclear dialogue.
  it: ''
- hash: 682f1a61
  kind: cards
  en: Leaving Africa to escape the 'neo-colonial' label handed the ground to Russia. The withdrawals of 2022-2025 (Mali, Burkina Faso, Niger, Chad, Senegal, Cote d'Ivoire) ended the Sahel counter-terrorism
    role and let the Africa Corps in; the junta in Mali is now besieged by jihadists and France is reduced to telling its nationals to leave.
  it: ''
- hash: 25349d11
  kind: cards
  en: 'Backing Morocco on Western Sahara (2024) won a partner and cost Algeria: recall of ambassadors, the Sansal imprisonment (pardoned 12 Nov 2025 through German mediation) and a migration crisis over
    the 1968 accord, all of which Paris had to start repairing in 2025-26 with the French ambassador recalled in April 2025 and, in March 2026, only reported as possibly returning.'
  it: ''
- hash: e190446a
  kind: cards
  en: Recognising Palestine to regain weight in the Middle East lowered it. Israel's foreign minister said there was 'no room' for a Macron visit while France persisted, and in Lebanon, where France is
    the historic patron, Washington built the June 2026 Israel-Lebanon framework without Paris.
  it: ''
- hash: 9885c403
  kind: cards
  en: Defending French farmers against Mercosur weakens the EU's answer to American tariffs. Paris led the opposition (Parliament sent the deal to the Court of Justice 334-324) at the moment Berlin and
    Madrid wanted new markets to offset US tariffs and dependence on China.
  it: ''
- hash: fb1c32b6
  kind: cards
  en: 'France runs the strategy of a medium power with a first-rank vocabulary: nuclear, permanent seat, an army meant to be ''feared'' (Macron, July 2025), and a claim that Europe must become sovereign.
    The pattern in Luttwak''s terms is that each assertion of autonomy needs a partner it cannot dominate. The 2 March 2026 offer of forward deterrence needs Germany and Poland, who also want Washington;
    the Coalition of the Willing needs the United States for the ceasefire; the arms-export drive needs EU money that Mercosur and the deficit make harder to unite. Since 2022 the centre of gravity has
    moved north and east (Finland, Romania, Poland, Denmark, Greenland) as the African position collapsed, and the Mediterranean (Greece, Cyprus, Lebanon, Morocco) is the compensation. Two signals that
    are not rows: the 2027 election is the main unknown, with Macron the least popular president since 2017 and Marine Le Pen eligible and leading, so every commitment made in 2025-26 (Paris Declaration,
    nuclear talks, Greece pact) will be tested by a successor; and no French ambassador has been reported back in Algiers despite the thaw. The fiscal squeeze is the single constraint that touches every
    objective.'
  it: ''
- hash: 909ef020
  kind: cards
  en: Keep the Compact of Free Association with the United States in force and funded. The 2024 renewal gives the FSM US$3.3 billion over 20 years, through 2043 (Interior Department). The aim is read from
    that outcome, not from a statement of the government's own.
  it: ''
- hash: c7e08148
  kind: cards
  en: Hold the relation with Beijing, in place since 1989, as a second source of trade and aid. China was the FSM's third-largest trade partner in the government's own 2009 account.
  it: ''
- hash: b44a5c2b
  kind: cards
  en: 'Economic: the renewed Compact package, US$3.3 billion over 20 years through 2043 (about US$165 million a year, our arithmetic).'
  it: ''
- hash: 65dae2ab
  kind: cards
  en: 'Diplomatic: recognition of Beijing since 1989, and votes taken alongside Washington. In September 2025 the FSM was one of ten states that voted against the General Assembly endorsement of the New
    York Declaration on the two-state solution.'
  it: ''
- hash: 083ee995
  kind: cards
  en: Money on a fixed clock. The renewed package runs for 20 years, through 2043, so the FSM plans its budget around an amount agreed with Washington and cannot change it alone.
  it: ''
- hash: 93ae7639
  kind: cards
  en: 'Small trade base. Trade with China was about US$9.5 million in 2007, and the sourced trade figures are all from before 2022: no recent trade share has been read.'
  it: ''
- hash: 7a24e76a
  kind: cards
  en: Voting with the Compact patron costs standing with the wider UN. The September 2025 vote placed the FSM among the ten states against the New York Declaration, while 142 states endorsed it; the alignment
    that the US money rewards is the one that isolates it on Palestine.
  it: ''
- hash: 51df0457
  kind: cards
  en: 'Federated States of Micronesia runs its foreign policy inside a treaty: the Compact with the United States, renewed and funded in 2024 with US$3.3 billion over 20 years, is the anchor, and the one
    stance here sourced at B. Its second relation, with Beijing since 1989, is a small trade and aid tie whose recent record this pass did not read, and the other two Compact states (Marshall Islands and
    Palau), Japan, Australia and the Pacific Islands Forum are open gaps. The one dated action read so far, the September 2025 vote against the New York Declaration, shows the Compact alignment at work
    in the UN.'
  it: ''
- hash: eb711cae
  kind: cards
  en: Turn the French military camp at Libreville into a Gabonese-run training hub. Under Brice Oligui Nguema, who took power in the August 2023 coup and was elected in April 2025, the De Gaulle camp is
    described as shared with the host nation, with Gabonese military institutions integrated into it and the French role being reduced.
  it: ''
- hash: 1f044d96
  kind: cards
  en: 'Move from raw to processed manganese: a ban on raw manganese exports from 2029 was announced as part of a national industrial plan. The ban and its date come from search summaries of 2025 press reporting;
    the article was not opened, so this objective is a pointer until it is read.'
  it: ''
- hash: e7b48e81
  kind: cards
  en: Manganese through Eramet, the French miner. Eramet extracts about 7 to 7.5 million tonnes of raw manganese a year; local processing capacity is only 65,000 tonnes of silicomanganese and 20,000 tonnes
    of ferromanganese. The figures come from a search summary, not an opened page, so they are a pointer until checked.
  it: ''
- hash: da5e7389
  kind: cards
  en: 'Monetary and regional membership: the CFA franc zone and the Central African customs and economic bloc (UDEAC/CEMAC). Listed in Wikipedia''s foreign-relations article only, which is tier 4 and cited
    as a pointer. The bloc''s own record and the ECCAS seat were not read.'
  it: ''
- hash: 839171c2
  kind: cards
  en: A French security pact on short leash. The pact was renewed for two years by the junta after the 2023 coup and needs further approval after the presidential vote, so Libreville's main security partner
    holds its terms on a timetable Gabon does not fully set.
  it: ''
- hash: 355f5ebf
  kind: cards
  en: Processing capacity is the bottleneck. Local smelting covers a small fraction of the raw ore Eramet extracts, so a raw-export ban depends on plants that do not yet exist.
  it: ''
- hash: 8a48884b
  kind: cards
  en: The shrinking French camp is meant to make Gabon's security its own, yet the camp stays the place where Gabonese forces are trained, so the sovereignty the junta sells rests on French instructors.
    Fewer French tanks, more French teaching.
  it: ''
- hash: 49ab719a
  kind: cards
  en: 'Gabon under Oligui Nguema is trying to turn a French-era security relationship and a single extractive commodity into a sovereign model: the camp is shrinking into a Gabonese training hub, and manganese
    is to be processed at home rather than exported raw. The relationships with China and the United States are not yet written: no source for them was read in this pass, and the gap is logged in the journal.
    The two constraints the card cannot yet price, oil decline and public debt, are the first things to read before the card can be called complete.'
  it: ''
- hash: f833b530
  kind: cards
  en: 'Deter Russia and keep the Euro-Atlantic order whole, on a ''NATO first'' footing: lead inside the alliance (the Tapa battlegroup in Estonia, the nuclear role), co-lead the Coalition of the Willing
    with France so that a post-ceasefire force for Ukraine exists as a plan and, if a ceasefire comes, as troops. The Strategic Defence Review of June 2025 made this the organising principle of British
    defence.'
  it: ''
- hash: 86f0df0f
  kind: cards
  en: 'Keep Washington close and engaged, and insure against it at the same time: trade carve-outs and tech and nuclear-energy deals bought with a state visit, intelligence and Trident ties that cannot
    be replaced, and a European backstop (France, Germany, Poland, the Nordics) built in parallel. The ''special relationship'' is the asset the whole strategy is priced on.'
  it: ''
- hash: bc2aa344
  kind: cards
  en: 'Growth through trade: the EU reset (security and defence partnership, a sanitary and phytosanitary area, Erasmus+ from 2027, a youth scheme and carbon-market linkage under negotiation) and a fan
    of agreements elsewhere (India in force on 15 July 2026, the Gulf Cooperation Council concluded on 20 May 2026). Prime Minister Burnham has said ''all options'' on the EU are on the table, a step beyond
    the 2025 reset.'
  it: ''
- hash: 446c1f29
  kind: cards
  en: 'Rebuild mass and industry behind the deterrent: defence spending of 2.5% of GDP by 2027, 3% in the next Parliament and the NATO 3.5% (plus 1.5%) by 2035, up to 12 SSN-AUKUS submarines, F-35A for
    the nuclear role, the GCAP fighter with Japan and Italy, Type 26 frigates for Norway, and drones for Ukraine and for the Royal Navy.'
  it: ''
- hash: 532ef1fe
  kind: cards
  en: 'Hold the territorial and constitutional settlement while trading its edges: Gibraltar (the EU-UK treaty signed 14 July 2026 removed the land border fence without prejudice to sovereignty), the Falklands
    (sovereignty ''not up for negotiation''), the Chagos/Diego Garcia base (treaty signed 2025, ratification stalled for lack of US consent), Northern Ireland under the Windsor Framework, and the Union
    itself (SNP re-elected in Scotland in May 2026).'
  it: ''
- hash: 1dd94b7b
  kind: cards
  en: 'Defuse the domestic anger that Reform UK feeds on - small-boat migration above all - and shut the door on hostile-state activity at home (Russian sabotage and espionage, Chinese espionage, Iranian
    plots). Both are now foreign-policy files: the Channel is managed with France, Germany, Albania and China, and hybrid threats with Poland and the Nordics.'
  it: ''
- hash: f0ad7077
  kind: cards
  en: 'A web of bilateral treaties around the EU''s centre: Lancaster House and the Northwood Declaration with France (10 July 2025, nuclear policy coordinated under national control), the Kensington Treaty
    with Germany (17 July 2025), a defence and security treaty with Poland (signed 27 May 2026), the 100-Year Partnership with Ukraine (16 January 2025), the Lunna House agreement with Norway (4 December
    2025) and the Geelong Treaty with Australia (26 July 2025). Together with the Joint Expeditionary Force and the Coalition of the Willing they make London the organiser of the ''coalition'' layer of
    European security.'
  it: ''
- hash: a20263af
  kind: cards
  en: 'The E3 hold on Iran: with France and Germany the UK triggered the UN ''snapback'' on 28 August 2025 and UN sanctions returned on 27-28 September; in 2026 it pairs a legal reading of the war (no British
    role in the first US strikes, bases opened only for ''specific and limited defensive purposes'') with a push for a US-Iran ceasefire and free passage through Hormuz.'
  it: ''
- hash: 1c8b1927
  kind: cards
  en: 'Public attribution as a weapon: the June 2026 sanctions package named a GRU front, Neptune, and shadow-fleet and procurement networks; courts have convicted a Russian-run Bulgarian spy ring (sentences
    May 2025) and the Wagner-organised arson of a Ukraine-bound warehouse in London (convictions July 2025). The Foreign Office''s line on China pairs engagement with public statements on Hong Kong (Jimmy
    Lai, 20 years).'
  it: ''
- hash: 9554c915
  kind: cards
  en: 'Forward presence and the nuclear role: the Tapa battlegroup in Estonia since 2017 (over 1,000 troops, 4th Brigade to train there in 2027), Typhoons and F-35s on NATO air policing, the Trident submarines
    and a planned F-35A dual-capable fleet, and in 2026 the first boarding of a sanctioned shadow-fleet tanker in the Channel (14 June), minehunters and HMS Dragon for a Hormuz mission and counter-drone
    batteries sent to Kuwait and Bahrain.'
  it: ''
- hash: 2761e76c
  kind: cards
  en: 'Sanctions and market access as levers: more than 500 shadow-fleet vessels designated (Ministry of Defence count, June 2026), a US Economic Prosperity Deal of May 2025 with sector carve-outs, a Tech
    Prosperity Deal (September 2025) and about GBP 150bn of US investment pledges, gas from Norway (27 bcm in 2025), and the UK-India (in force 15 July 2026) and UK-GCC (concluded 20 May 2026) agreements.'
  it: ''
- hash: 4737105f
  kind: cards
  en: The money does not match the mission. The Defence Investment Plan projects 2.7% of GDP on defence by 2029-30 (2.68% in Healey's resignation letter) against a NATO path to 3.5% by 2035; a funding gap
    of about GBP 4.7bn over five years remains, and the Defence Secretary Streeting refuses to promise 3% by 2030 without a funding plan.
  it: ''
- hash: 183f3477
  kind: cards
  en: 'Dependence on the United States for the hardest things: Trident missiles (a shared US-made pool, with US support for navigation and maintenance), the F-35A that will carry US-owned B61-12 bombs,
    the intelligence relationship and, through AUKUS, the submarine programme. A dependence that cannot be traded away makes every disagreement with Washington costly.'
  it: ''
- hash: 3d15f9f9
  kind: cards
  en: 'A fragile centre in London: Labour lost heavily in the May 2026 local and devolved elections (Reform won more than 1,400 English council seats; Plaid Cymru first and Reform second in Wales; SNP re-elected
    in Scotland), Keir Starmer resigned on 22 June after the least popular premiership on record, and Andy Burnham took office on 20 July. Polls in late September had Labour and Reform level (YouGov 24-25%,
    Survation Labour ahead) - the ''Burnham bounce'' is real but not firm.'
  it: ''
- hash: 1faa0630
  kind: cards
  en: 'Thin hulls and readiness: Iran''s drone strike on RAF Akrotiri in March 2026 and HMS Dragon''s late departure exposed how few ships and air-defence assets are available; the Royal Navy withdrew its
    last mine-countermeasures vessel from the Gulf in early 2026 and depends on uncrewed systems for Hormuz.'
  it: ''
- hash: b088c16e
  kind: cards
  en: 'The EU is open but not generous: the reset of May 2025 left the youth scheme and the SPS text unfinished, the second summit planned for 22 July 2026 was postponed after Starmer''s fall (a new date
    is sought for November or year-end), the UK is still outside the SAFE defence-loan scheme beyond third-country terms (up to 35% UK content), and Brussels warns that a customs union means full alignment.'
  it: ''
- hash: 3ba52d62
  kind: cards
  en: 'Law and legitimacy bind the use of force: the British government refused US use of its bases for the first strikes on Iran on legal grounds, paused Caribbean intelligence sharing over the US boat
    strikes, and cannot ratify the Chagos treaty because of a Parliament that ran out of time and a US administration that has not consented.'
  it: ''
- hash: 25ecd325
  kind: cards
  en: The country that organises Europe's 'coalition' layer cannot fund the force it organises. The UK leads the Coalition of the Willing, the JEF and the Estonia battlegroup, and signed treaties with France,
    Germany and Poland, but its own spending path (2.7% of GDP by 2029-30) is below the Hague pledge, a Defence Secretary resigned in June over exactly this, and the prime minister who inherited the problem
    will not date the 3%. Leadership by treaties is paid for in promises.
  it: ''
- hash: 236ea25b
  kind: cards
  en: Courting Trump to keep the American umbrella, then losing his goodwill by obeying the law. The state visit, the Tech Prosperity Deal and GBP 150bn of pledges (September 2025) were the price of protection,
    but the March 2026 refusal of bases for the first strikes on Iran - taken on legal advice to protect British standing and forces - brought Trump's 'the relationship is obviously not what it was', talk
    of a Pentagon review of the Falklands position, and a US that withholds consent on Chagos. Doing what the alliance's own rules require costs the alliance.
  it: ''
- hash: 3e653d7f
  kind: cards
  en: The Chagos treaty was meant to secure Diego Garcia and ended by making it contestable. Ceding sovereignty to Mauritius for a 99-year lease was London's way of protecting the base from adverse legal
    rulings; instead the US president called it 'an act of great stupidity', the Bill ran out of time in the Lords and the government has said it cannot satisfy the condition of US consent. In March 2026
    London opened the base to the US for 'specific and limited defensive purposes' under the old arrangement.
  it: ''
- hash: 20e2ebef
  kind: cards
  en: Engaging China for growth bought neither security nor sales. The government approved the Royal Mint Court embassy (20 January 2026) just before Starmer's Beijing visit (visa-free entry, whisky tariff
    cut to 5%), after a China spying case collapsed in 2025 because no official would say China was a threat; Jimmy Lai, a British citizen, was sentenced to 20 years, and Jaguar Land Rover, the flagship
    British exporter to China, halted its local production in June 2026 and calls the market 'challenging'. Each concession to the trade case weakens the security case at home and with Washington.
  it: ''
- hash: 57fe4bfe
  kind: cards
  en: 'A border that France polices and Reform punishes. The ''one in, one out'' returns deal (August 2025 - 30 September 2026) was the government''s answer to the Channel, but it returned about 1,100 people
    against almost 28,000 arrivals by small boat, cost about GBP 56,000 per return and was ended because France wants a European arrangement instead. At the same time London signed the Northwood nuclear
    declaration with the same Paris and still depends on it for the border: the relationship is deepest on the hardest subject and shallowest on the one that decides British elections.'
  it: ''
- hash: 1f06b27a
  kind: cards
  en: A Europe reset that Brexit voters cannot see. The government draws closer to the EU (SPS area, Erasmus+, Gibraltar in Schengen, Burnham's 'all options') to raise growth, but Labour's manifesto ruled
    out the single market and customs union, and Reform led YouGov's polls through the spring and was level with Labour again by late September. Each step toward Brussels is visible to the voter as a concession
    and invisible as a gain until the SPS text takes effect (alignment planned for mid-2027).
  it: ''
- hash: 7ef6082f
  kind: cards
  en: 'The United Kingdom runs the grand strategy of a power that has lost the

    weight to act alone and the habit of not acting, and has decided to make

    itself the organiser of the coalitions in which others'' weight is added to its

    own: the Coalition of the Willing for Ukraine with France, the JEF in the

    north, bilateral treaties with Berlin, Warsaw, Paris, Oslo and Canberra, and

    a nuclear role it now coordinates with Paris while it rents the delivery

    system from Washington. Luttwak''s reversal is everywhere. The more the UK

    organises, the more it needs the American umbrella it is trying to insure

    against; the more it obeys international law toward Washington (Iran bases,

    Caribbean intelligence) the less Washington obliges it (Chagos, the Falklands

    hints, tariffs); the more it engages China and the EU for growth, the more the

    security and political price rises at home. Underneath is a politics

    that has not found its centre: 2026 saw the May rout, Starmer''s fall on

    22 June and Burnham''s arrival on 20 July with a poll bounce that Reform had

    erased in YouGov''s last September poll. Three signals that are not rows: the postponement of the

    July UK-EU summit until Brussels knew who would be in Downing Street; the

    Healey resignation that turned the 3% question into a government-wide problem;

    and Washington''s ''neutrality'' statement on the Falklands only after a leaked

    Pentagon email suggested otherwise. For the next review: whether a UK-EU summit

    in November-December fixes the SPS and youth texts, whether the Autumn Budget

    funds the Defence Investment Plan, and whether Burnham''s ''all options'' survives

    contact with a Reform lead.'
  it: ''
- hash: f7f19075
  kind: cards
  en: 'Keep Georgian Dream in power and the Ivanishvili system intact: win the 2024 election outcome, neutralise street opposition, and remove the parliamentary opposition by law (a Constitutional Court
    case, filed in 2025 and widened to five parties by September-October 2026, seeks to ban UNM, Ahali, Lelo, the Federalists and Gakharia''s For Georgia) while eight opposition leaders face a ''sabotage''
    trial.'
  it: ''
- hash: b3edd912
  kind: cards
  en: 'Stay out of the Russia-West war and keep Moscow from turning on Georgia: no Western sanctions on Russia, no ''second front'', trade, flights and tourism with Russia restored, and a refusal to restore
    diplomatic relations while Abkhazia and South Ossetia stay as they are. Kobakhidze presents this as peace policy and accuses a ''deep state'' of pushing Georgia into confrontation.'
  it: ''
- hash: cab24851
  kind: cards
  en: 'Keep the Western economic and security shell without the political conditions: candidate status, the free-trade area, visa-free travel for citizens and NATO practical ties, while rejecting the EU''s
    demands (repeal of the foreign-agents law) and asking Washington for a reset ''from a clean slate''. Stated goal: EU membership by 2030, with talks suspended until the end of 2028.'
  it: ''
- hash: 794b30ec
  kind: cards
  en: 'Make Georgia the Middle Corridor hub between Central Asia, the Caspian and Europe: Poti and Batumi ports, the Baku-Tbilisi-Kars railway, the Anaklia deep-sea port (state-owned ''landlord'' model
    announced 6 July 2026) and transit of Azerbaijani gas and oil. Freight along the corridor through Georgia rose 21% in January-May 2026 and ports handled 9.7 million tonnes in H1 2026, a decade high.'
  it: ''
- hash: ab1b498f
  kind: cards
  en: 'Diversify patrons so that no single capital can set the price of survival: a comprehensive strategic partnership with China (2023), strategic partnerships with Azerbaijan and Armenia, the Georgia-Turkey-Azerbaijan
    trilateral (Istanbul Declaration, 8 June 2026) and trade with Russia, Turkey and the US, each about a tenth of turnover or more.'
  it: ''
- hash: 4cf5354a
  kind: cards
  en: 'Claim back Abkhazia and South Ossetia (about 20% of the territory, held by Russian forces since 2008) without force and without recognising the loss: no recognition of the two as states, no diplomatic
    ties with Moscow on that basis, peaceful ''de-occupation'' as a long-term aim. In practice the claim is frozen, and Moscow says it sees no grounds for political dialogue as long as Tbilisi refuses recognition.'
  it: ''
- hash: e9f1229d
  kind: cards
  en: 'Hedged multi-vector diplomacy: strategic-partnership declarations with China (July 2023), Armenia (January 2024) and Azerbaijan, the tenth Georgia-Turkey-Azerbaijan ministerial in Istanbul (8 June
    2026), a quiet reset track with Washington (Congressional staff January 2026, State Department delegations in November 2025 and May 2026) and, on the Russian side, the first Kobakhidze-Putin co-presence
    at an international forum since 2008 (Ashgabat, 11-12 December 2025).'
  it: ''
- hash: 78b50f37
  kind: cards
  en: 'Control of the narrative and of the civic space: the 2024 foreign-influence law (NGOs and media with over 20% foreign funding must register as bearers of foreign interests), a wave of follow-on laws
    on grants, assemblies, masks and broadcasting, and a ''deep state / global war party'' story in which the West and Ukraine try to open a second front against Russia on Georgian soil.'
  it: ''
- hash: 3a4d4ab9
  kind: cards
  en: 'No external power projection: a small defence force with NATO cooperation partly retained (Rutte, March 2026: better to keep the relationship; the Substantial NATO-Georgia Package under review),
    and an internal security apparatus (riot police, special forces, courts) used against protesters and the 4 October 2025 ''coup attempt'' defendants.'
  it: ''
- hash: b888bbd6
  kind: cards
  en: 'Growth and transit as political capital: real GDP +7.5% in 2025 and a projected 6.5% in 2026, public debt below 35% of GDP (IMF, June 2026), remittances of USD 3.65bn, trade and re-exports with Russia
    (10.4% of turnover; 34,600 used cars exported to Russia in 2025 according to Russian media), and control of the corridor cargo and gas-transit chokepoints.'
  it: ''
- hash: 56a4ec50
  kind: cards
  en: 'Russian forces on 20% of the territory and total dependence on Moscow''s restraint: Russia supplied 97% of imported oil in 2025, took 10.3% of exports and 13% of remittances (USD 468m), and its gas
    deliveries rose 40.4% in 2025. A hostile Moscow can hurt Georgia in a way no Western measure can.'
  it: ''
- hash: 25aa9df8
  kind: cards
  en: 'The EU and the US have made political conditions the price of every benefit: the Commission calls Georgia a ''candidate country in name only'', has downgraded political contacts and suspended assistance
    directly benefiting the authorities; visa-free travel is suspended for diplomatic and service passports (6 March 2026) and the Commission''s December 2025 report finds the benchmarks breached; Washington
    sanctioned Ivanishvili (27 December 2024) and the House passed the MEGOBARI Act 349-42 (5 May 2025).'
  it: ''
- hash: dd6f1abd
  kind: cards
  en: 'A contested mandate: the October 2024 election is documented in an ODIHR final report and the European Parliament (28 November 2024, 444 for, 72 against) refused to recognise it, the presidency is
    disputed (Zourabichvili says she remains the only legitimate president and the EU and Ukraine still treat her as such), and protests have gone on since 28 November 2024.'
  it: ''
- hash: 553b6b98
  kind: cards
  en: 'A corridor with structural limits: Carnegie finds the Middle Corridor handles about 6% of the Northern Corridor''s capacity, Georgian port capacity is near its limit, the 2026 budget for Anaklia
    was cut from GEL 150m to 50m, and the US TRIPP route through Armenia could end Georgia''s position as the only gateway to Europe. PMC Research puts 2025 transit through Georgia at 4.6 million tonnes,
    down 5.2%.'
  it: ''
- hash: 14a4ef20
  kind: cards
  en: 'Money and people that flow from abroad: remittances of USD 3.646bn in 2025 (US 19%, Italy 17%, Russia 13%) and a trade deficit of about USD 11bn (imports 18.5bn, exports 7.3bn) mean that visa access
    and bank links to the EU and the US matter more to households than any political slogan.'
  it: ''
- hash: 1d2c315c
  kind: cards
  en: 'Few friends who are free to help: China''s Anaklia consortium (CCCC, 49% in 2024) has reportedly stepped away from Anaklia, Hungary, the EU veto player that shielded Tbilisi, reportedly changed course
    with its May 2026 change of government, and Washington''s attention went to Armenia (the Vice President''s February 2026 South Caucasus trip skipped Georgia).'
  it: ''
- hash: 65d6f564
  kind: cards
  en: A law passed to defend sovereignty from 'foreign agents' put Georgia's sovereign choices into foreign hands. The 2024 foreign-influence law made the European Council describe the accession process
    as de facto halted, froze EUR 30m of EU peace-facility aid, and led the Commission in November 2025 to call Georgia a candidate 'in name only'; the party that campaigned on keeping Georgia out of war
    now depends more on Russian oil, gas, exports and remittances than it did before.
  it: ''
- hash: 40fd717b
  kind: cards
  en: Neutrality does not buy Russian goodwill. Tbilisi refused Western sanctions, restored flights and visa-free travel in May 2023, let Russian trade grow and was photographed near Putin in Ashgabat,
    yet Russia's foreign ministry said on 3 December 2025 that there are no grounds for political dialogue while Georgia does not recognise Abkhazia and South Ossetia, and Moscow reopened direct flights
    to Sukhumi in May 2025 over Georgian protests. Georgia paid the Western price for accommodation and got no territorial or security return.
  it: ''
- hash: 139edaca
  kind: cards
  en: The Middle Corridor bet needs the Western finance and security guarantees the government is alienating. Anaklia has stalled for years (funding cut to GEL 50m, no contractor as of March 2026), the
    Chinese consortium that the government licensed in 2024 against US objections has walked away, and the US route through Armenia (TRIPP) is the first rival gateway; being the only door to Europe holds
    only as long as nobody builds another.
  it: ''
- hash: 392c0fe8
  kind: cards
  en: Banning the opposition to secure power removes the loyal opposition that made the system look plural. For Georgia (12 seats) is the only opposition party that took its mandates; adding it to the Constitutional
    Court case, after nine parties formed an alliance on 2 March 2026, hands Brussels and Washington a one-party picture and the Court restarts its nine-month clock with each amendment.
  it: ''
- hash: 0d379ec4
  kind: cards
  en: The 'clean slate' with Washington is requested while the narrative that explains Georgian Dream's survival blames a Western 'deep state'. Kobakhidze asks the State Department for a reset (25 May 2026)
    while in August 2026 he blames a Western 'deep state' for pushing Georgia toward conflict with Russia; Congress, which holds the MEGOBARI Act, and the Treasury, which holds Ivanishvili, are not the
    interlocutors that a reset with the administration reaches.
  it: ''
- hash: cb938ea4
  kind: cards
  en: The China hedge failed on the one project that mattered. The July 2023 comprehensive strategic partnership was meant to give Tbilisi a non-Western investor for Anaklia; in 2025-26 the project drew
    US objections, the consortium reportedly left, and the government fell back on a state-owned model while the Chinese ambassador and the economy minister still talk of Chinese participation.
  it: ''
- hash: 9b2c4387
  kind: cards
  en: 'Georgia is run by a party that has decided its own survival, and a particular

    idea of order, come before the country''s formal strategy of Euro-Atlantic membership

    (on paper still the constitutional line). Since the May 2024 foreign-influence law the

    state has behaved as a hedging regime: it keeps every Western instrument it can without

    paying the political price (candidate status, free trade, citizens'' visa-free travel,

    NATO contacts), keeps Russia calm (no sanctions, flights, trade, no talk of the

    territories) and looks for other patrons (China, Turkey, Azerbaijan, the Gulf) and for a

    different America. That is Luttwak''s pattern of a move that works against its own end:

    each step that protects power at home (the foreign-agents law, the arrests after

    28 November 2024 and 4 October 2025, the party-ban case) lowers the value of the Western

    shell that the economy rests on, and raises the weight of the one actor, Russia, whose

    forces hold a fifth of the territory. Three signals that are not rows: the party ban was

    widened to For Georgia in September-October 2026, a year after the first filing; Moscow

    still says no dialogue without recognition of Abkhazia and South Ossetia; and a Hungarian

    change of government in May 2026 reportedly removes the veto that protected Tbilisi from EU

    sanctions. The Middle Corridor is the economic bet that holds the arrangement together:

    cargo is up and the IMF sees 6.5% growth, but the corridor itself is not Georgia''s to

    secure, and its Western users are the ones being pushed away.'
  it: ''
- hash: 87ca04ad
  kind: cards
  en: Close the IMF track and keep the fiscal room it leaves. The Extended Credit Facility (US$3bn, 39 months, approved May 2023) ended with the sixth and final review on 27 July 2026, releasing about US$371m;
    a 36-month non-financing Policy Coordination Instrument follows, with a 2026 primary surplus target of 1.5% of GDP and a debt goal of 45% of GDP by 2034.
  it: ''
- hash: 7cead7a5
  kind: cards
  en: 'Finish the external debt restructuring with the commercial creditors who remain: about US$2.7bn, under 5% of pre-restructuring public debt, as the IMF put it in the 2025 review. Domestic restructuring
    was completed in 2023 and the Eurobonds in October 2024; bilateral deals are largely in place.'
  it: ''
