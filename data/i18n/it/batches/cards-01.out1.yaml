items:
- hash: 6aedba67
  it: |
    La Cina nell'ottobre 2026 è il caso su cui Luttwak ha scritto il suo libro, letto dall'interno. Sul piano tecnico gli strumenti sono i migliori del mondo e in crescita: la marina più grande per numero di unità, una terza portaerei, una guardia costiera autorizzata a far fuoco, il monopolio dei magneti di cui hanno bisogno i motori di tutti, un surplus commerciale di USD 1.2 trilioni. Sul piano della strategia di teatro il bilancio è misto per scelta: lo stretto di Taiwan viene esercitato due volte l'anno e mai attraversato, le secche vengono occupate con cannoni ad acqua e riserve naturali più che con sbarchi, le Senkaku sono visitate 357 giorni l'anno. Sul piano della grand strategy il paradosso previsto da Luttwak è visibile in ogni scheda di questo atlante: il Giappone definisce la Cina la sua sfida maggiore, quattordici Stati riaffermano un lodo arbitrale che Pechino considera nullo, l'UE mantiene la formula 'systemic rival', e l'unico rivale che conta, gli Stati Uniti, è stato portato a tre tregue con la leva delle terre rare che ogni tregua consuma. Ciò che è nuovo nel 2025-26 è che Pechino sembra aver letto la logica: il disgelo con India, Australia, Corea del Sud, Gran Bretagna, Vietnam e perfino Bruxelles è un grande Stato che abbassa il proprio peso sulla bilancia, e la gestione di Trump - ospitalità, soia, un Board of Trade, 'healthy competition kept within bounds' - è una manovra relazionale di alto livello. Ciò che è antico è il riflesso: una frase di Takaichi ha riportato in campo l'intero arsenale della coercizione contro il vicino il cui riarmo costa di più alla Cina, e le secche delle Filippine hanno ricevuto manganelli nella stessa estate. I vincoli sono più pesanti di quanto ammetta la retorica - deflazione, 7.9 milioni di nascite, un alto comando epurato, uno stretto che non controlla e un embargo sui chip a cui non può rispondere allo stesso modo - ed è per questo che la pressione resta al di sotto della guerra. Tre segnali che non sono righe: Pechino ha lasciato attendere per oltre un anno il prezzo del Power of Siberia 2, misura di chi conta di più; ha chiesto a Teheran, non a Washington, di riaprire Hormuz; e ha fatto a Trump la sua offerta migliore su Taiwan non con una minaccia ma con una richiesta. La domanda che la scheda lascia aperta è quella dello stesso Luttwak: se uno Stato possa imparare la logica della strategia più in fretta di quanto il suo peso insegni agli altri.
- hash: 0b676614
  it: |
    Mantenere il sistema Ouattara: un quarto mandato ottenuto il 25 ottobre 2025 con i due rivali più forti esclusi dalla scheda elettorale. Thiam è stato cancellato dalle liste elettorali per la sua nazionalità, e Laurent Gbagbo è stato escluso dopo una condanna penale; Simone Gbagbo si è candidata. Il risultato provvisorio ha assegnato a Ouattara circa l'89.8% con un'affluenza di circa il 50%, e l'opposizione ha chiesto nuove elezioni.
- hash: 7bd694be
  it: |
    Recuperare i sei funzionari ivoriani segnalati come detenuti in Burkina Faso alla fine di agosto 2025, e impedire che la faida con Ouagadougou si intensifichi. Abidjan respinge le accuse di destabilizzazione e afferma che il Burkina non ha offerto alcuna prova; il rientro dei funzionari era oggetto di negoziato.
- hash: d34ba048
  it: |
    La ECOWAS come canale nelle sue controversie con le giunte del Sahel. Nel 2022-23 il blocco ha fissato al Mali una scadenza per i 46 soldati ivoriani e poi non ha imposto sanzioni; Bamako ha graziato gli uomini all'inizio di gennaio 2023.
- hash: a9988cb8
  it: |
    L'esercito come contributore alle missioni di pace all'estero. I 46 uomini trattenuti in Mali erano, secondo Abidjan, una forza di riserva per la missione UN MINUSMA; Bamako li ha definiti mercenari entrati senza autorizzazione.
- hash: c07c7144
  it: |
    La successione del 2028 e la costituzione. La costituzione vigente vieta un terzo mandato e fa terminare quello di Tshisekedi alla fine del 2028. Il via libera della Corte a una via referendaria (luglio 2026) è contestato: la conferenza dei vescovi cattolici (CENCO) ha dichiarato il 20 giugno 2026 che un 'forced passage' rischiava la balcanizzazione del Paese, il blocco d'opposizione C64 ha definito la mossa 'high treason', e la coalizione al governo, Sacred Union of the Nation, ha risposto che alcuni vescovi non possono sostituirsi alle istituzioni. Ogni accordo di Kinshasa con Kigali o con l'M23 va letto in questa luce.
- hash: 3754810b
  it: |
    La Chiesa come voce nazionale che lo Stato non può comandare. La conferenza dei vescovi cattolici (CENCO) è l'unico organismo nazionale che le fonti mostrano in azione contro la modifica costituzionale: la sua dichiarazione del giugno 2026 e il suo memorandum del 2024 contro la modifica degli articoli fondamentali. Kinshasa non può zittire né comandare i vescovi, e un referendum forzato, a nostra lettura, li porterebbe all'opposizione aperta (C: le fonti registrano le dichiarazioni, non la conseguenza).
- hash: c5525a79
  it: |
    L'accordo sui minerali destinato a comprare la protezione di Washington espone i suoi partner alla guerra. Il partenariato con gli Stati Uniti lega l'accesso preferenziale ai minerali critici alla cooperazione in materia di sicurezza, eppure l'acquisto di Chemaf da parte di una società statunitense ha sollevato domande di Reuters sulla due diligence (marzo 2026), e gli analisti sostengono che il modello minerali in cambio di sicurezza non fermerà i combattimenti, perché le miniere si trovano nel territorio che l'M23 e i suoi sostenitori controllano o contestano.
- hash: e16b6c10
  it: |
    Il partner di cui ha bisogno contro l'M23 è lo Stato che ha portato davanti alla International Court of Justice (ICJ). Kinshasa combatte al fianco dell'esercito ugandese nell'Operazione Shujaa e accetta le truppe di Kampala, benché la ICJ abbia ordinato all'Uganda di pagare USD 325m per la sua occupazione del 1998-2003 (sentenza del 9 febbraio 2022), e gli esperti UN sostengano che unità ugandesi abbiano protetto l'M23 (luglio 2025; l'Uganda lo nega).
- hash: 10ef3e72
  it: |
    Più Kinshasa negozia la pace, meno controlla lo Stato che dovrebbe mantenerla. I tavoli di Washington e Doha richiedono un dialogo nazionale inclusivo e riforme interne, eppure la via costituzionale verso un terzo mandato mette l'opposizione e i vescovi contro la presidenza proprio quando il fronte orientale ha bisogno di unità. Un accordo firmato a Doha o a Washington vale solo quanto la politica di Kinshasa che lo attua.
- hash: a8f2c66b
  it: |
    Kinshasa ha perso le due città orientali più grandi a favore di una ribellione sostenuta dal vicino, e non può riprenderle da sola; così ha speso il 2025-2026 nel comprare partner: truppe burundesi nel Sud Kivu, operazioni ugandesi contro le ADF, il tavolo di Doha sostenuto dal Qatar, l'accordo di Washington minerali in cambio di sicurezza e una mediazione angolana andata e venuta. Ogni tavolo le dà un posto e ne dà uno anche ai suoi nemici, per questo la strategia consiste nel lasciare l'iniziativa agli altri piuttosto che vincere sul terreno. I minerali sono la valuta dell'intero sforzo e la ragione per cui le potenze esterne sono presenti, con la Cina che già detiene gran parte del cobalto tramite Sicomines e gli Stati Uniti che ora ne cercano l'accesso. La successione del 2028 ha spostato la contesa decisiva dal fronte orientale alla capitale, dove i vescovi cattolici e l'opposizione sono le uniche forze nazionali in grado di fermare un terzo mandato, ed è il vincolo che nessun mediatore straniero può rimuovere.
- hash: 50de57b9
  it: |
    Mantenere Denis Sassou Nguesso al potere fino al 2031. Ha ottenuto un quinto mandato il 15 marzo 2026 con il 94.82% dei voti e un'affluenza dell'84.65% (conteggio ufficiale, secondo Chronicle.lu), dopo che diversi partiti di opposizione erano stati sospesi e internet era stato interrotto il giorno del voto; la maggior parte dei partiti di opposizione non ha presentato alcun candidato.
- hash: 70afe810
  it: |
    Rifinanziare il debito e mantenere il flusso delle entrate petrolifere. Moody's ha migliorato la prospettiva del Congo nel maggio 2026 in occasione di un rifinanziamento di $850 milioni di obbligazioni in scadenza nel 2036 al 9.5%, con un'offerta di riacquisto per $575 milioni di obbligazioni in scadenza nel 2032. Il debito è circa il 98% del GDP, gli arretrati circa il 13% del GDP (Moody's, riportato da allAfrica).
- hash: 7c5c2519
  it: |
    Il petrolio come leva. Il Congo è il terzo esportatore di petrolio dell'Africa, con spedizioni tra 236,000 e 252,000 barili al giorno; il petrolio genera più dell'80% dei ricavi da esportazione (World Bank, citata da Al Jazeera). Moody's colloca il petrolio intorno al 90% delle esportazioni: le fonti divergono, quindi la quota è approssimativa.
- hash: 710e1c47
  it: |
    Più capitali insieme. Al Jazeera cita Parigi, Pechino e Mosca tra le alleanze che hanno portato investimenti a Nguesso; la Cina è il principale acquirente di petrolio congolese (36% nel 2024, Coface); un oleodotto tra Pointe-Noire e Brazzaville, di proprietà russa al 90%, è stato approvato nel 2024 (Coface).
- hash: 1f2793f2
  it: |
    Debito. Circa il 98% del GDP nel maggio 2026, con arretrati di circa il 13% del GDP; una relazione parlamentare riporta il 98.03% a fine maggio 2026 e il debito estero circa il 42% del totale (Moody's, riportato da allAfrica).
- hash: 5131d1ab
  it: |
    Dipendenza dal petrolio. Il petrolio è più dell'80% dei ricavi da esportazione (World Bank tramite Al Jazeera), quindi bilancio, servizio del debito e sistema clientelare dipendono tutti dal prezzo e dal volume di un'unica materia prima. Nostra lettura: un calo dell'uno o dell'altro è il primo shock che lo Stato deve affrontare.
- hash: 0d3fde05
  it: |
    L'acquirente che finanzia lo Stato è anche un creditore. La Cina assorbe la quota maggiore delle esportazioni petrolifere congolesi ed è un importante creditore (Coface), dunque la relazione che paga il bilancio è anche una relazione i cui crediti il rifinanziamento deve gestire.
- hash: 2a91ac5c
  it: |
    L'obiettivo di Sassou Nguesso è mantenere al potere fino al 2031 il sistema che governa da decenni, e il reddito petrolifero che lo finanzia è anche il vincolo più stretto: oltre l'80% dei ricavi da esportazione contro un debito vicino al 98% del GDP. Gioca le grandi potenze l'una contro l'altra per denaro e copertura: Parigi per gli aiuti e un legame di lunga data che porta con sé una propria esposizione giudiziaria sui beni della famiglia, Pechino come acquirente di petrolio e creditore, Mosca per l'oleodotto del 2024, e nessuna di loro è un patrono sancito da un trattato. La prova dei prossimi anni è se il rifinanziamento compra tempo sufficiente perché il petrolio tenga il suo prezzo, e il paradosso è che l'acquirente che finanzia lo Stato è anche un creditore i cui crediti deve gestire.
- hash: 1f2dbc6c
  it: |
    Vincere la guerra alla droga con Washington al fianco: ridurre la produzione di cocaina con la fumigazione, attacchi a laboratori e imbarcazioni, ed estradizioni. Abelardo de la Espriella, che ha vinto il ballottaggio del 21 giugno 2026 per circa un punto (49.66% contro 48.70%), si è insediato il 7 agosto 2026 e ha promesso questa linea nel discorso di insediamento, ponendo fine all'approccio negoziale di Petro. I funzionari statunitensi hanno descritto la produzione di coca e cocaina come 'all-time records' nel memorandum di decertificazione del settembre 2025.
- hash: d69c22a3
  it: |
    Recuperare il partenariato per la sicurezza e il commercio con gli Stati Uniti dopo la rottura del 2025-26: aiuti USA, la coalizione Shield of the Americas e la fine della decertificazione. Sotto Petro, Washington ha decertificato la Colombia come partner nella lotta al narcotraffico (settembre 2025) e ha sanzionato il presidente e la sua rete di sostegno (OFAC, 24 ottobre 2025); il nuovo governo si è impegnato ad aderire allo Shield of the Americas fin dal primo giorno. Non ancora ottenuto sulla decertificazione: il 16 settembre 2026 Washington ha mantenuto la Colombia nell'elenco per un secondo anno, con una deroga per interesse nazionale (si veda vincolo 5).
- hash: ec85287e
  it: |
    Riprendere il confine venezuelano e il Catatumbo dall'ELN. Dopo l'attacco USA a Caracas (3 gennaio 2026) il gruppo si è ritirato dal Venezuela verso la Colombia; il governo di Petro ha attivato un piano contro gli attacchi e ha avvertito l'ELN che, se non avesse lasciato il territorio venezuelano, sarebbe seguita un'azione militare congiunta con il Venezuela.
- hash: ddc14623
  it: |
    Porre fine alla 'total peace' e spezzare i gruppi armati con la forza o con la resa. Il 25 giugno 2026, da presidente eletto, de la Espriella ha intimato ai gruppi armati di sottomettersi allo Stato di diritto ed ha escluso di negoziare con il Clan del Golfo; il Clan ha risposto per lettera il 29 giugno che la sottomissione era 'inevitable' e che il dibattito riguardava solo le sue condizioni. Dall'insediamento ha ordinato quattro attacchi aerei: il primo nella notte del 10 agosto contro strutture dell'ELN a Tibú e San Calixto (Catatumbo), il quarto l'11 ottobre contro il Frente 33 dissidente (Calarcá), che dice di aver ordinato personalmente. I colloqui di Doha con il Clan e le zone di ubicazione temporanea in Córdoba e Chocó, strumenti di Petro, sono il processo che si sta smantellando; la zona di Tierralta prevista per il 25 giugno non ha mai aperto e, a metà settembre, il disegno di legge sulla sottomissione promesso da luglio non era ancora stato depositato.
- hash: 235760c0
  it: |
    Riportare la diplomazia colombiana nel campo guidato dagli USA e contro il blocco di sinistra. Il ministro degli Esteri Omar Bula Escobar (nominato l'8 luglio 2026) ha detto all'Atlantic Council che la priorità è ricostruire le relazioni che la Colombia aveva con Stati Uniti e Israele. Ne fanno parte: una tabella di marcia con Israele concordata a Washington il 15 luglio (relazioni ristabilite dal 7 agosto, ambasciatori, esenzione dai visti, ambasciata trasferita a Gerusalemme, ripresa delle esportazioni di carbone, ritiro dal caso intentato dal Sudafrica davanti alla ICJ, che la pagina ICJ registra il 22 settembre 2026); legami con Cuba e Nicaragua tagliati dal 7 agosto ('tyrannies'); 14 ambasciate chiuse per motivi di bilancio e la missione prevista a Ramallah annullata; relazioni con la Repubblica Sahrawi congelate il 10 agosto, a vantaggio del Marocco.
- hash: 390d05f9
  it: |
    Orientare l'economia verso l'esterno attraverso la diplomazia commerciale e degli investimenti. Il ministero degli Esteri si concentrerà sulla diplomazia economica, commerciale e cibernetica, lavorando con il ministero delle Finanze per fare della Colombia un Paese orientato al commercio. La base è ristretta: nel 2025 le esportazioni sono state USD 50.2 miliardi (+1.3%), di cui gli Stati Uniti hanno assorbito il 29.6% (seguiti da Panama, India, Brasile, Paesi Bassi, Ecuador e Cina); le industrie estrattive pesavano il 38.2% del totale e sono in calo (-17% fino a ottobre), mentre il caffè è cresciuto del 65.7%.
- hash: dc12e042
  it: |
    Sicurezza e intelligence con gli Stati Uniti: forze armate e polizia, l'eredità del Plan Colombia e un pacchetto di sicurezza USA dopo il giuramento. Il nuovo governo propone inoltre di consentire alle forze statunitensi di operare dal territorio colombiano, di bombardare i laboratori di cocaina nella giungla e di accelerare le estradizioni dei capi di gruppi armati ricercati negli Stati Uniti.
- hash: 5c687c77
  it: |
    L'energia come leva: le esportazioni di elettricità verso l'Ecuador (circa l'8% della sua domanda, più di USD 400 milioni di vendite nel 2024-25) sono state sospese per sei mesi durante la guerra tariffaria del 2026 e sono riprese il 5 agosto 2026.
- hash: 8d74d6bb
  it: |
    Potenza aerea e nuova flotta di caccia: il presidente ordina di persona gli attacchi (quattro dal 7 agosto 2026), e il contratto per i Gripen E/F del 14 novembre 2025 (17 velivoli, EUR 3.1 miliardi, previsti in COP 16.86 trilioni per il 2026-2032) resta in vigore. Il governo ha avviato una revisione delle compensazioni industriali (energia solare per le aree non collegate alla rete, acqua nella Guajira, l'ospedale San Juan de Dios), che secondo quanto riportato mirerebbe a convertire parte di esse in sensori, identificazione di obiettivi e capacità di attacco al suolo per l'aeronautica, non a fermare l'acquisto; a settembre è stata presentata un'azione popolare per bloccare il contratto.
- hash: bd6a76e5
  it: |
    Tribunali, estradizione e resa come modo per dividere i gruppi armati: l'estradizione negli Stati Uniti del capo del Clan del Golfo 'Chiquito Malo' è stata riattivata dal decreto di Petro nel luglio 2026, una carta che il nuovo governo eredita, e il 17 settembre 2026 quattro membri del Clan della struttura Juan de Dios Úsuga si sono arresi a Briceño (Antioquia) consegnando le armi. Il disegno di legge sulla sottomissione che dovrebbe regolare questa via non era stato depositato a metà settembre.
- hash: ba8e7936
  it: |
    L'allineamento come moneta di scambio: l'impegno nello Shield of the Americas (una coalizione regionale per la sicurezza guidata dagli USA, creata nel marzo 2026 dopo l'operazione di Caracas, con Argentina, El Salvador, Cile ed Ecuador tra i membri), una delegazione statunitense all'insediamento a Cali (il procuratore generale ad interim Todd Blanche), Rubio a Barranquilla l'8 settembre 2026 e un'autorizzazione annunciata dagli USA per operazioni militari congiunte contro i trafficanti di droga, e un'offerta diplomatica a Israele (ambasciata a Gerusalemme, esenzione dai visti, esportazioni di carbone). La voce sulle operazioni congiunte si basa solo su titoli visti nei risultati di ricerca.
- hash: eb85c0a5
  it: |
    La produzione di cocaina è a livelli record, come affermava il memorandum USA di settembre 2025, perciò la sola forza non riduce l'offerta. Aggiornamento del 16 ottobre 2026: la superficie coltivata a coca ha raggiunto 261,386 ettari nel 2024 (+3.5% rispetto ai 253,000 del 2023; il rapporto UNODC-governo, pubblicato nel giugno 2026, ha eliminato la stima della produzione di cocaina), e gli strumenti del nuovo governo sono stati messi alla prova solo in parte: gli attacchi aerei sono iniziati il 10 agosto 2026 (quattro entro l'11 ottobre, contro gruppi armati), mentre la fumigazione e l'abbattimento di aerei sospetti non risultano documentati in alcuna fonte trovata; la questione dell'irrorazione della coca è controversa, e Petro sostiene che la domanda debba essere ridotta.
- hash: 25be93e5
  it: |
    Un confine che non controlla: l'ELN si muove tra Venezuela e Catatumbo, e la cooperazione con il governo di Caracas è parziale e condizionata, quindi i gruppi armati di frontiera non possono essere eliminati da un solo lato.
- hash: d36a9a90
  it: |
    Un'economia esportatrice il cui greggio esce attraverso l'Ecuador: il greggio colombiano transita nell'oleodotto SOTE dell'Ecuador e, durante la disputa del 2026, l'Ecuador ha alzato la tariffa di transito da 3 a 30 dollari al barile.
- hash: a84e71d1
  it: |
    Un mandato di misura e un predecessore che lo contesta: de la Espriella ha vinto il ballottaggio del 21 giugno 2026 con il 49.66% (circa 12.9 milioni di voti) contro il 48.70% (circa 12.7 milioni) di Iván Cepeda, candidato di Petro; Petro non ha riconosciuto il risultato e ha promesso di guidare l'opposizione e la 'civil disobedience'. Il governo ha una coalizione di minoranza in Congresso, quindi le promesse più dure (uscire dall'UN o dall'OAS, tra le altre) difficilmente passeranno; quest'ultimo punto è la lettura di un analista, vista in un riassunto di ricerca di un articolo di Colombia Reports che non è stato aperto.
- hash: 4ea15676
  it: |
    La pazienza di Washington è condizionata e annuale. Il 16 settembre 2026 Trump ha mantenuto la Colombia nell'elenco dei Paesi che non hanno dimostrato di rispettare gli obblighi antidroga, per il secondo anno, con una deroga per interesse nazionale che evita la sospensione automatica degli aiuti; ha attribuito a Petro 'incompetence and chaos', ha lodato de la Espriella e ha detto che valuterà di revocare la designazione se nel prossimo anno progrediranno l'eradicazione e lo smantellamento delle reti 'narcoterrorist'. Le sanzioni su Petro non si sono mosse: il 7 ottobre 2026 Petro, il figlio Nicolás, Verónica Alcocer e Armando Benedetti erano ancora nell'elenco SDN, dopo che la pulizia OFAC del 5 ottobre ha rimosso decine di persone e aziende colombiane (le fonti divergono: 73, oppure 125 in tutto) senza includere anche loro.
- hash: 1f7065dd
  it: |
    La forza ha costi civili e giuridici. Il primo attacco (10 agosto 2026, Tibú e San Calixto) ha ferito tre contadini secondo la Defensoría del Pueblo ed è avvenuto durante un'emergenza sismica, attirando critiche; l'attacco dell'11 ottobre ha riaperto la questione dei minori tra gli obiettivi, e il giorno dopo l'esercito non aveva ancora un bilancio ufficiale. I gruppi hanno reagito: il 5 settembre un attacco ribelle a un posto militare nel Catatumbo ha ucciso tre soldati.
- hash: b56cbcb3
  it: |
    La posizione di sovranità di Petro contro gli attacchi alle imbarcazioni ha portato alla decertificazione, alle sanzioni contro il presidente e alla perdita degli aiuti, lasciando Bogotá meno in grado di combattere l'economia della cocaina che la sua stessa politica voleva porre fine con il negoziato.
- hash: 7966c00c
  it: |
    La guerra tariffaria con l'Ecuador, giustificata dalla mancanza di reciprocità di Bogotá nel controllo della droga, è stata combattuta con la leva che ha colpito le esportazioni colombiane stesse: il taglio dell'elettricità, più dazi reciproci del 30% sulle merci ecuadoriane, mentre il greggio colombiano dipende ancora dall'oleodotto ecuadoriano.
- hash: fc61ed62
  it: |
    Washington premia Caracas e tiene il suo fedele alleato in prova. Il 16 settembre 2026 gli Stati Uniti hanno tolto il Venezuela dall'elenco della decertificazione, riconoscendo i passi del governo ad interim di Delcy Rodríguez, mentre la Colombia, il cui presidente ha fatto campagna sulla linea di Washington e ha messo la propria politica verso il Venezuela sotto il Dipartimento di Stato, vi è rimasta. Eppure la Colombia non può chiudere il santuario di frontiera dell'ELN senza la cooperazione delle stesse autorità di Caracas, quindi l'allineamento che compra il favore degli USA rende Bogotá più dipendente dalla gestione del dossier venezuelano da parte di Washington che dalla propria.
- hash: fef95bf7
  it: |
    La linea dura è giustificata dal bilancio di Petro, ma gli ultimi dati si prestano a letture opposte. Nel 2024 l'eradicazione forzata è calata del 54% (da 20,325 a 9,403 ettari) e la superficie coltivata a coca è cresciuta ancora solo del 3.5%, l'aumento più contenuto in quattro anni, mentre i sequestri di cocaina hanno toccato il record di 889,201 kg (+19%). Anche il rapporto congiunto UNODC-governo ha eliminato per la prima volta la stima della produzione di cocaina, dopo un contenzioso tecnico durato un anno con Petro, quindi il parametro con cui Trump giudicherà la nuova linea entro un anno è esso stesso sfocato.
- hash: 56cd9058
  it: |
    Bombardare per liberare le comunità dai gruppi armati costa il sostegno delle comunità stesse. Il primo attacco ha ferito tre contadini durante un'emergenza sismica; i gruppi rispondono con la stessa moneta (tre soldati uccisi il 5 settembre) e il Clan del Golfo, invece di fuggire, tratta sulle condizioni della propria sottomissione e invita Stati Uniti e Regno Unito a entrare nel processo. Uno Stato che ha escluso il negoziato ma non la resa consegna ai gruppi le condizioni della trattativa.
- hash: baa4ecbb
  it: |
    Una politica estera guidata dal commercio che chiude sedi diplomatiche dove il commercio potrebbe crescere. La priorità dichiarata del ministero è la diplomazia economica e commerciale, eppure le 14 chiusure per motivi di bilancio riguardano Algeria, Azerbaigian, Ghana, Ungheria, Malaysia e Sudafrica, oltre a Cuba e Nicaragua, quando gli Stati Uniti assorbono già il 29.6% delle esportazioni e le industrie estrattive, il 38.2% di esse, sono in calo. La diversificazione che quelle sedi potrebbero servire è quella di cui l'obiettivo ha bisogno (nostra lettura dei due insiemi di dati; il risparmio in sé non è quantificato in alcuna fonte trovata).
- hash: 3440c7c9
  it: |
    La Colombia ha cambiato partner nel 2026 senza cambiare il proprio problema: l'economia della cocaina e i gruppi armati al confine venezuelano sono gli stessi, e un alleato di Trump di linea dura, insediatosi il 7 agosto 2026, ha scommesso che la forza di Washington possa fare ciò che il negoziato non ha fatto. La svolta rovescia la rottura dell'era Petro (decertificazione, sanzioni al presidente, la guerra tariffaria con l'Ecuador), e la leva energetica è di nuovo in uso, mentre il patto Belt and Road del maggio 2025 è una lettera non vincolante che il nuovo governo non ha ancora affrontato in alcuna fonte trovata. Il paradosso è che la rottura è costata alla Colombia aiuti e reputazione, e la svolta compra cooperazione per la sicurezza a un prezzo che la politica stessa può spingere oltre le frontiere, in Venezuela e in Ecuador (un'inferenza, non ancora documentata).
- hash: 284e6f67
  it: |
    Mantenere intatto il potere personale di Azali Assoumani dopo il voto contestato del gennaio 2024. La commissione elettorale ha dapprima annunciato il 63% per lui (16 gennaio 2024); la Corte suprema ha confermato il 57.2% (24 gennaio); alla richiesta di annullamento dell'opposizione e alle proteste si è risposto con un coprifuoco dal 18 gennaio e con almeno un morto.
- hash: abf449cd
  it: |
    Tenere agli atti la rivendicazione su Mayotte. Le Comore hanno portato la rivendicazione davanti all'Assemblea generale UN nel dibattito generale del 2012, e il veto francese del 1976 in Consiglio di sicurezza su un progetto di risoluzione che riconosceva la sovranità comoriana (11 voti favorevoli) blocca da allora l'unica via UN che vi conduce.
- hash: 901c90d3
  it: |
    La tribuna dell'Assemblea generale UN: le Comore ribadiscono la rivendicazione su Mayotte nel dibattito generale (dichiarazione del 2012), e le risoluzioni dell'Assemblea generale degli anni Settanta che respingevano il dominio francese continuato sono il precedente su cui essa poggia, letto attraverso un rimando indiretto (livello 4) che richiede conferme.
- hash: ff3fbab7
  it: |
    Assistenza e diplomazia cinesi: un programma antimalarico assistito dalla Cina a Moheli (New York Times, 2007), un impegno di cooperazione militare del 2008, dopo che una delegazione dell'esercito comoriano aveva incontrato il ministro della Difesa cinese (Xinhua), e le congratulazioni di Pechino per la rielezione del gennaio 2024 (Xinhua).
- hash: 0ecbd012
  it: |
    Nessuna ambasciata USA residente dal 2006. L'ambasciata a Moroni (aperta nel 1985) ha chiuso il 30 settembre 1993, e le competenze statunitensi sulle Comore sono passate ad Antananarivo il 6 marzo 2006, quindi la presenza di Washington è gestita dal Madagascar.
- hash: 12154efa
  it: |
    Fragilità post-elettorale. Le proteste del gennaio 2024 hanno causato almeno un morto e almeno 25 feriti, un coprifuoco è durato dal 18 gennaio e l'accesso a internet è stato disturbato (resoconti di Reuters e AP, come citati da Wikipedia; non consultati direttamente). Un regime costretto a difendere il proprio risultato ha meno spazio nell'arena esterna in cui si discute la rivendicazione su Mayotte.
- hash: 4172fb03
  it: |
    Pechino ha congratulato Azali per la rielezione il 29 gennaio 2024, nello stesso mese in cui l'ambasciata USA chiedeva alle autorità piena trasparenza e chiarimenti sui risultati. La rivendicazione su Mayotte trova il suo pubblico a New York, dove il veto francese del 1976 l'ha bloccata, e perde credibilità nel voto che il governo ha dovuto difendere con un coprifuoco.
