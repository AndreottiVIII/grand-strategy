- hash: 66a9a34a
  it: "L'Estonia conduce la grande strategia di uno Stato in prima linea che ha deciso di spendere per diventare inattaccabile, anziché sperare in un garante: il 5,43% del PIL, una frontiera fortificata, un arsenale per colpire in profondità e una fitta rete di partner (Regno Unito, Finlandia, Polonia, Germania, Corea) intorno a un ombrello americano di cui si fida pubblicamente e che in privato mette in dubbio. Lo schema di Luttwak è che ogni irrigidimento ha un costo che ritorna sullo stesso fronte: la postura avanzata aumenta l'esposizione, il controllo in mare mostra i limiti del diritto, l'indipendenza della rete concentra il rischio nei cavi, e la difesa dello Stato-nazione dalla leva russa sulla minoranza offre a Mosca una narrazione di torto subito. La Russia è valutata come rivale, non come avversario: l'Estonia cerca deterrenza, una sconfitta russa in Ucraina e una Russia che paghi il prezzo, non la fine dello Stato russo, e mantiene aperta un'ambasciata e il regime di frontiera. La linea del Cremlino secondo cui la Russia «non costituisce alcuna minaccia» per l'Estonia e il giudizio dell'intelligence estone secondo cui Mosca non intende attaccare nel prossimo anno sono segnali, non righe: entrambe le parti leggono i limiti dell'altra. La questione aperta per il 2027 è la presenza americana dopo la rotazione di fine 2026 e un'elezione che una coalizione debole potrebbe perdere. Dopo il tentativo di incendio alla Threod Systems (15 nov 2026), Tallinn ha annunciato la chiusura dei valichi di frontiera con la Russia dal 1° dicembre 2026: una misura difensiva che riduce i mezzi russi di sabotaggio e di elusione delle sanzioni, non un nuovo obiettivo. Mosca l'ha definita «russofobia» (TASS, tramite Al Jazeera, 15 nov 2026)."
- hash: 6d53b008
  it: "Il Qatar conduce la strategia di un micro-Stato ricco che non ha un esercito in grado di competere con i vicini e quindi vende servizi in cambio di protezione: gas al mondo, mediazione alle grandi potenze, denaro ai deboli e una base a Washington. La strategia ha funzionato per trent'anni perché il conto veniva pagato in influenza anziché in forza; dal giugno 2025 il conto è arrivato. Israele ha colpito la capitale con gli Stati Uniti avvisati, l'Iran l'ha colpita tre volte e ha distrutto un sesto della capacità di GNL, e Hormuz ha mostrato che l'intera attività passa attraverso un unico stretto che l'aggressore controlla. La risposta è una ricostruzione della deterrenza: una garanzia scritta degli Stati Uniti (EO 14353, un ordine presidenziale e non un trattato), un legame con la Turchia, una difesa aerea che ha ormai abbattuto aerei, e un lessico di autosufficienza del Golfo che Doha condivide con Abu Dhabi. Lo schema di Luttwak è quello paradossale: ogni asset che compra sicurezza (Al Udeid, Hamas come interlocutore, l'Iran come vicino, il GNL come leva) è proprio ciò che attira il fuoco. Due segnali che non sono righe: nel marzo 2026 il Qatar ha rifiutato di guidare la mediazione tra USA e Iran, perché attaccarlo non procurasse a Teheran condizioni migliori, e vi è tornato al tavolo entro agosto; e Doha spende il capitale di mediazione dove ha ancora leva (Gaza, RDC, i bambini ucraini, l'Afghanistan) mentre il dossier iraniano spetta al Pakistan. Il prossimo test è se la garanzia scritta reggerà e se Hormuz riaprirà prima che i compratori decidano che il Qatar è un rischio da coprire con l'hedging. Dopo il patto di Istanbul del 13 nov 2026, Doha ha un impegno di difesa reciproca dalla Turchia, il primo oltre il trattato del 2014 e l'ordine statunitense: Ankara concorda una posizione unificata contro qualsiasi attacco armato esterno a una delle due parti. Un memorandum di sicurezza con il Pakistan (19 nov 2026) riguarda la sicurezza interna, non la difesa. La garanzia statunitense è ancora un ordine esecutivo; la clausola turca è il primo impegno reciproco scritto."
- hash: 873ce600
  it: "Gli Stati Uniti nell'ottobre 2026 conducono la più esplicita grande strategia che abbiano pubblicato dalla Guerra fredda, e quella più in contrasto con i propri mezzi. I fini sono messi per iscritto: un emisfero tenuto sotto un Corollario Trump, il commercio riequilibrato con i dazi, la Cina tenuta come rivale «entro limiti», la difesa europea affidata agli europei, il Medio Oriente gestito senza guerre senza fine, la migrazione fermata. Sul piano tecnico gli strumenti funzionano: la frontiera è più tranquilla che da cinquant'anni, gli alleati hanno promesso migliaia di miliardi e il 5% del PIL, Maduro siede in una cella di Brooklyn, Khamenei è morto. Sul piano della grande strategia il quadro si rovescia, come Luttwak dice che deve avvenire quando una strategia riesce: la coercizione usata con tutti ha raggiunto il suo punto culminante in un anno (Davos, la Spagna, la Corte Suprema), gli alleati che hanno pagato sono diventati hedger, la guerra di scelta contro l'Iran ha consumato l'anno riservato all'emisfero e alla Cina, e l'emisfero stesso ha prodotto un Venezuela che Washington ora amministra. Tre segnali che non sono righe: la NDS non nomina mai Taiwan; l'USMCA è stato lasciato non rinnovato il 1° luglio senza alcun piano per il seguito; e lo stesso governo che ha sanzionato Rosneft compra gasolio russo. Le posizioni di Washington si leggono di conseguenza: due avversari (Iran e Hamas), quindici rivali, di cui i due con cui parla più che con gli alleati sono Cina e Russia, e un anello di alleati per trattato valutati come riluttanti non perché oppongano resistenza all'alleanza, ma perché la oppone Washington: è la prima grande potenza dell'atlante il cui attrito con gli alleati è soprattutto suo. Dopo le elezioni di medio termine del 3 novembre 2026 il fronte interno della strategia cambia segno. I democratici vincono il Senato (54-44, con due sfide aperte il 4 novembre, sette seggi conquistati) e la Camera (228 assegnati, 260 o più probabili), e Trump, con il 38% di approvazione nei sondaggi all'uscita, dice che la guerra in Iran è stata «una parte» del tutto e che lavorerà con i democratici e porrà il veto su ciò che approveranno. Nessuna delle due parti ha i due terzi, quindi l'effetto probabile non è una nuova legge ma la fine della politica estera esecutiva senza controlli: citazioni in giudizio (Wyden: «Subpoenas»; Garcia, destinata a presiedere la commissione di vigilanza della Camera, ha detto ai repubblicani di «lawyer up») e il potere di bilancio, i cui obiettivi esteri non sono ancora nominati, e un Congresso su cui non si può più contare perché taccia. Vale il punto di Luttwak: un'amministrazione che ha costretto tutti all'estero incontra ora il proprio punto culminante in patria. Ciò che le fonti non dicono ancora, e la scheda quindi non afferma, è come le nuove maggioranze voteranno sugli aiuti all'Ucraina, su Taiwan, sulla NATO o sui dazi; quelle posizioni restano invariate finché un voto o una dichiarazione non lo mostrino. Dopo la settimana del 18-19 novembre 2026: il nuovo Congresso ha cominciato a indicare le proprie priorità di politica estera, ma non ha ancora votato nulla. Collaboratori democratici indicano gli aiuti all'Ucraina come priorità, e Reuters giudica che un pacchetto richiederebbe probabilmente una maggioranza di due terzi per superare un veto (citato da Al Jazeera, 4 nov 2026); il CFR osserva che i dazi ai sensi della Sezione 122 durano 150 giorni salvo proroga del Congresso, e che il Presidente mantiene gran parte del controllo sui dazi. Non è stata trovata alcuna fonte del 2026 sulla politica verso Taiwan delle nuove maggioranze. Al vertice APEC di Shenzhen la Casa Bianca ha confermato un primo incontro trilaterale tra Trump, Xi e Putin il 19 novembre, presentato come un'apertura sul controllo degli armamenti; Pechino ha rifiutato per ora di unirsi a colloqui nucleari trilaterali (Al Jazeera, 14 nov 2026). Nessuna fonte trovata finora riferisce cosa sia stato concordato su dazi, terre rare, Taiwan o fentanyl, né alcun accordo militare USA-Venezuela firmato il 18 novembre: i colloqui riferiti dal New York Times (3 nov 2026) riguardano uno status of forces agreement, non ancora firmato. Posizioni invariate; servirebbe una dichiarazione o un resoconto per muoverle."
