items:
- hash: 89173b88
  it: |
    Capitale sovrano e centro finanziario usato come strumento: il portafoglio di Temasek ammontava a S$518 miliardi al 31 marzo 2026 (rendimento a 20 anni del 6,8%), il rendimento reale a 20 anni di GIC è stato del 3,4% (in calo dal 3,8%), e i rendimenti netti degli investimenti del governo finanziano in parte il bilancio. Lo stesso centro ha applicato le sanzioni del 2022 contro le banche russe e i canali delle criptovalute, ed è la sede dei processi per le frodi legate ai server per l'IA.
- hash: e7127f07
  it: |
    Acqua: l'accordo del 1962 sul fiume Johor è valido fino al 2061 (fino a 250 milioni di galloni al giorno), e anche quello del 1990 arriva al 2061; il piano di Singapore è sostituire le importazioni con NEWater e la dissalazione, ma fino ad allora il rubinetto è nelle mani di un altro Stato. Wong, gennaio 2025: l'acqua è «not a pressing issue», ma la portata e la qualità del fiume Johor sono un interesse condiviso; il Joint Technical Committee continua a lavorare.
- hash: 9ae07416
  it: |
    Energia: nessun combustibile nazionale. Il gas produce più del 90% dell'elettricità; nel 2025 il gas da gasdotto proveniente da Malesia e Indonesia è stato il 43% delle importazioni di gas e il GNL il 57%, di cui circa il 47% dal Qatar. QatarEnergy ha dichiarato forza maggiore il 4 marzo 2026 e Singapore ha acquistato carichi sostitutivi per tutto il 2026; i contratti per il gasdotto indonesiano scadono entro il 2028 e quelli malesi potrebbero scadere entro il 2027.
- hash: 592fb532
  it: |
    Demografia: il tasso di fecondità dei residenti è sceso allo 0,87 nel 2025 (0,97 nel 2024); la popolazione dei cittadini potrebbe contrarsi entro i primi anni Quaranta; il 21,4% dei cittadini ha 65 anni o più, e i non residenti (1,98 milioni su 6,21 milioni di persone nel giugno 2026) colmano il vuoto di manodopera di cui il modello ha bisogno.
- hash: 3a11244c
  it: |
    Dimensioni e profondità: nessuna risorsa naturale, nessun entroterra e territorio, mare e spazio aereo insufficienti per addestrare una forza moderna; per questo le SAF si addestrano in Australia, Stati Uniti e Taiwan, e per questo ciascuno di questi Paesi ospitanti dispone di una leva.
- hash: 4013fd2e
  it: |
    La guerra tecnologica tra Stati Uniti e Cina: Washington insiste sul dirottamento dei chip per l'IA (il segretario al Commercio Lutnick ha affrontato i controlli sulle esportazioni con il ministro del Commercio Gan nel 2025); la tariffa di base statunitense è del 10% dall'aprile 2025, con un'aliquota del 15% annunciata nel febbraio 2026 ma non ancora disposta a marzo; e le operazioni informatiche riconducibili a Pechino contro le infrastrutture critiche di Singapore (UNC3886, luglio 2025) mettono alla prova il confine tra i due.
- hash: 84a8fb2e
  it: |
    L'indispensabilità è l'esposizione. Più Singapore ospita entrambe le grandi potenze nella propria economia e nelle proprie basi — l'accesso statunitense a Changi e gli F-35, la Cina come primo partner commerciale e fonte crescente di investimenti — più ciascuna può chiedere e più perde quando entrano in collisione. Wong prevede che il commercio tra Stati Uniti e Cina si bloccherà e avverte di un errore di calcolo su Taiwan; Balakrishnan definisce Hormuz una possibile prova generale per il Pacifico. Il piccolo Stato che non può scegliere è il primo a essere stretto quando la scelta diventa obbligata.
- hash: 4faa04fd
  it: |
    Risolvere il problema del territorio all'estero crea leve in patria. Le SAF si addestrano a Taiwan (dal 1975), in Australia e negli Stati Uniti perché l'isola è troppo piccola; quando le dogane di Hong Kong sequestrarono nove veicoli Terrex di ritorno da Taiwan nel novembre 2016, Pechino usò l'addestramento come arma diplomatica e i veicoli furono restituiti solo nel gennaio 2017. Più parte della forza vive all'estero, più i suoi ospiti — e i nemici degli ospiti — hanno in mano un ostaggio.
- hash: 381b30c8
  it: |
    La regola che protegge il piccolo Stato lega la sua stessa mano. Singapore ha sanzionato la Russia nel 2022 perché «cannot accept» le violazioni della sovranità e dell'integrità territoriale — ed è finita nella lista di Mosca dei Paesi ostili nel giro di pochi giorni — eppure aziende della difesa israeliane hanno esposto al suo Airshow nel 2024 e nel 2026, mentre il suo ministro degli Esteri definiva «unconscionable» la condotta di Israele a Gaza. Applicare il principio in modo uniforme costa; applicarlo in modo selettivo indebolisce la tesi secondo cui le regole devono valere allo stesso modo per tutti.
- hash: 32bb0942
  it: |
    Singapore è lo Stato piccolo di Luttwak che non può vincere una gara di peso e quindi gioca l'altra partita: si rende indispensabile a tutti. Ospita la marina statunitense a Changi, acquista gli F-35 americani, commercia più con la Cina che con chiunque altro, firma un partenariato con ogni capitale che conta e mantiene un bilancio per la difesa vicino al 3% del PIL per una forza che si addestra sul territorio altrui. La logica regge finché le grandi potenze competono a distanza; si rovescia quando entrano in collisione, perché lo Stato che ha servito entrambe è il primo luogo in cui ciascuna può essere negata all'altra (i casi di dirottamento dei chip e l'intrusione informatica sono le prime scosse premonitrici). La dottrina di Wong per un mondo disordinato è dirlo apertamente — regole per tutti, nessuna scelta forzata, «useful but not used» — e spendere il capitale politico di un mandato del 65,57% in ammortizzatori: ricchezza accantonata, GNL sostitutivo, un orizzonte idrico al 2061 e una zona nel Johor che trasforma il vicino da leva a parte interessata. Ciò che la strategia non può correggere è l'aritmetica di fondo: un tasso di fecondità dello 0,87 e una forza lavoro che deve continuare ad arrivare dall'estero.
- hash: c4fcbc0d
  it: |
    Costruire una forza di polizia propria e smettere di dipendere da un solo patrono: la Royal Solomon Islands Police Force deve crescere, finanziata dal pacchetto di Canberra del dicembre 2024 e dall'accordo del 2023 con la Cina.
- hash: cc046d15
  it: |
    Trasformare il legname e l'oro in entrate statali e ridurre il peso dei prestiti: il legname è la base delle esportazioni, Gold Ridge è la nuova storia di crescita e il debito pubblico è in aumento.
- hash: 7775c5ba
  it: |
    Fissare i termini della diplomazia del forum del Pacifico alle condizioni di Honiara: come ospite del vertice dei leader del 2025 ha tenuto fuori tutti i partner di dialogo, Taiwan e Cina compresi.
- hash: 16487c9c
  it: |
    Leva nel forum: ospite e presidente nel 2025, ha escluso tutti i partner di dialogo dal vertice dei leader di Honiara e ha rinviato il loro dialogo al 2026, un modo per fissare i termini del coinvolgimento esterno.
- hash: 34f54aa8
  it: |
    Polizia acquistata da due parti: un accordo di cooperazione di polizia del 2023 con la Cina (sicurezza informatica, polizia di comunità, droni, secondo il governo) e il pacchetto australiano del dicembre 2024 per le forze di polizia; nel luglio 2026 è seguito un accordo di shiprider con la US Coast Guard.
- hash: 62a9d4c0
  it: |
    Rendite delle risorse e capitale cinese: legname esportato per lo più in Cina, la miniera di Gold Ridge a maggioranza cinese, un prestito cinese di 66 milioni di USD per le torri di telecomunicazione di Huawei e lo stadio dei Pacific Games finanziato dalla Cina (una donazione, secondo il governo).
- hash: b7c295ce
  it: |
    Debito: il debito pubblico è quasi triplicato rispetto al periodo precedente al COVID e le riserve di cassa sono state erose; l'UN prevede un debito del governo centrale vicino al 27,8% del PIL entro il 2028.
- hash: bb5598f8
  it: |
    Esaurimento delle risorse: l'IMF prevede un calo della produzione di legname, mentre le entrate del governo e i ricavi dell'export dipendono proprio da essa.
- hash: 453ecf0b
  it: |
    Autorità contestata dall'interno: i disordini di Honiara alla fine del 2021 (decine di edifici incendiati) hanno portato forze di polizia cinesi e australiane; Malaita ha spinto per l'indipendenza a causa della presenza cinese (2020) e il suo premier ha detto che la provincia ha rifiutato una tangente da Pechino (2021); Choiseul vuole unirsi al Bougainville della PNG; i governi cambiano con mozioni di sfiducia (Manele è uscito, Wale è entrato il 15 maggio 2026).
- hash: 58bc7095
  it: |
    Il patto con la Cina doveva garantire Honiara; ha spinto Canberra verso un pacchetto di contromisure presentato come risposta a quel patto (dicembre 2024), e il governo che lo ha firmato ora lo definisce sotto revisione (giugno 2026).
- hash: 5ff7915d
  it: |
    Le Isole Salomone vendono il legname soprattutto alla Cina e si indebitano con essa, mentre polizia e sicurezza sono spartite tra Pechino (il patto del 2022 e l'accordo di polizia del 2023) e Canberra (il trattato del 2017 e il pacchetto da 190 milioni di A$ del dicembre 2024). La sua leva è il forum che ha ospitato nel 2025: in qualità di ospite del Pacific Islands Forum ha tenuto fuori tutti i partner di dialogo, e l'analisi del CSIS legge quel compromesso come modellato dalla pressione cinese, con Taiwan tra gli esclusi. Il governo Manele, che aveva resistito a legami più stretti con l'Australia, è caduto con una mozione di sfiducia; Matthew Wale è entrato in carica il 15 maggio 2026, definisce il patto con la Cina sotto revisione e cerca un trattato di partenariato strategico globale con l'Australia, mentre l'accordo di shiprider con gli Stati Uniti del luglio 2026 mostra un governo che non vuole più scegliere un unico patrono.
- hash: b5b4f6d2
  it: |
    Mantenere il controllo del governo Bio dopo l'attacco all'arsenale di Freetown del novembre 2023, che il governo ha definito un tentativo di colpo di Stato sventato. Gli arresti di ufficiali dell'esercito segnalati indicano una minaccia all'interno delle forze di sicurezza.
- hash: 8c95736d
  it: |
    Guidare l'ECOWAS: Bio è diventato presidente della ECOWAS Authority of Heads of State il 22 giugno 2025 per un mandato di un anno, succedendo a Bola Tinubu.
- hash: 30f745be
  it: |
    Mantenere aperti i partenariati occidentali: un trattato bilaterale di investimento con il Regno Unito firmato nel 2000 e l'accoglienza degli Stati Uniti nella Partnership for Atlantic Cooperation nel dicembre 2023.
- hash: cca81a1b
  it: |
    La presidenza dell'ECOWAS: una piattaforma regionale che dà a Freetown una voce oltre le sue dimensioni, detenuta da Bio dal giugno 2025.
- hash: 5c2e2367
  it: |
    Il trattato bilaterale di investimento del 2000 con il Regno Unito, cornice giuridica per gli investimenti britannici. Il suo uso concreto non è verificato in questa fase.
- hash: 26904cc2
  it: |
    Le forze di sicurezza sono il primo vincolo: dopo l'attacco all'arsenale del novembre 2023, tra gli arresti segnalati figurano 13 ufficiali dell'esercito, con altri 34 ricercati. Un regime che dipende dall'esercito deve gestire una forza che ha dovuto tenere sotto controllo.
- hash: f6d00257
  it: |
    Le norme dell'ECOWAS vincolano il regime: il blocco ha condannato il complotto, ha espresso «zero tolerance for unconstitutional change of government» e ha inviato una missione di solidarietà a Freetown. Ogni mossa che somigli a un aggiramento delle regole attira pressioni regionali.
- hash: bb388a48
  it: |
    Bio presiede ora l'ECOWAS, il blocco la cui regola della tolleranza zero contro i cambi di governo incostituzionali ha invocato nel 2023 proprio nel caso della Sierra Leone. Il ruolo regionale conferisce una credibilità che il problema della sicurezza interna continua a mettere alla prova.
- hash: 49d9e73d
  it: |
    Sotto Bio, la Sierra Leone trasforma una posizione interna fragile in prestigio regionale: la presidenza dell'ECOWAS dal giugno 2025 e un quadro di investimenti occidentali le danno una voce oltre le sue dimensioni. L'attacco all'arsenale del novembre 2023 mostra che il vincolo principale è in patria, all'interno delle forze di sicurezza, e che le regole regionali che ora presiede valgono anche per essa. Non verificati in questa fase: il seggio all'UN Security Council, la controversia elettorale del 2023, i tagli statunitensi a visti e aiuti del 2025, il porto peschereccio cinese, Guinea e Yenga, la Liberia oltre il patto del 2007 e l'epidemia di kush.
- hash: 0db62c02
  it: |
    Mantenere Nayib Bukele alla presidenza oltre i vecchi limiti. Il 31 luglio 2025 la Legislative Assembly, con la supermaggioranza del partito al governo New Ideas, ha approvato modifiche costituzionali che consentono la rielezione presidenziale indefinita e mandati di sei anni, e che eliminano il ballottaggio (57 voti favorevoli, 3 contrari). Le modifiche propongono anche di far terminare il mandato in corso il 1° giugno 2027 anziché nel 2029.
- hash: '11390172'
  it: |
    Mantenere la repressione delle bande e lo stato di emergenza come nucleo del bilancio del governo. Il resoconto dell'AP sulla riforma indica entrambi come caratteristica centrale del governo di Bukele; la data di inizio dello stato di emergenza non compare nella fonte letta.
- hash: 3ae425c6
  it: |
    Cooperazione migratoria con Washington. El Salvador ha accolto oltre 200 deportati provenienti da altri Paesi in base a un accordo con gli Stati Uniti (AP, 2025). La US National Security Strategy del novembre 2025 cita gli accordi di deportazione con El Salvador tra le sue intese migratorie. La data e i termini dell'accordo non compaiono nelle fonti lette.
- hash: aec877c8
  it: |
    Lo stato di emergenza come strumento permanente. Sospende alcuni diritti costituzionali e dà al governo uno strumento continuo contro le bande. L'AP lo chiama stato di emergenza, non stato di eccezione; il nome usato qui è nostro.
- hash: 6a7623d6
  it: |
    La tolleranza di Washington, non un trattato. L'accordo migratorio poggia sulla politica dell'amministrazione statunitense. L'AP riferisce che la preoccupazione di Washington sotto Biden ha lasciato il posto a un'accettazione silenziosa mentre Bukele si avvicinava alla rielezione (letto in un riepilogo di ricerca dello stesso articolo AP, non nella pagina recuperata).
- hash: 1b9cd85e
  it: |
    Costo reputazionale. L'AP riferisce che una nota organizzazione per i diritti ha trasferito le proprie attività fuori dal Paese, citando una «wave of repression». Le posizioni dell'EU e dell'UN non sono state lette, quindi questa è l'unica critica sui diritti contenuta nella scheda.
- hash: 4f62e432
  it: |
    Lo stato di emergenza che dà al governo la sua principale rivendicazione di merito per la repressione delle bande è anche ciò che ha spinto una nota organizzazione per i diritti fuori dal Paese. Il bilancio usato per giustificare la rielezione indefinita è proprio quello che gli costa credibilità all'estero.
- hash: 632fe69d
  it: |
    Il governo di El Salvador poggia su una sola prova di efficacia, la repressione delle bande sotto lo stato di emergenza, e la trasforma in una pretesa di restare in carica: la riforma del 2025 elimina il limite di mandato che quella prova doveva giustificare. I suoi legami con l'estero sono transazionali e, in questa scheda, poggiano su un solo accordo con Washington per i deportati. Il punto debole è quello che la scheda non riesce ancora a misurare bene: se uno Stato che dipende dalla cooperazione migratoria con gli Stati Uniti possa mantenere una repressione che una nota organizzazione per i diritti definisce ormai repressione.
- hash: 08052b63
  it: |
    Mantenere l'indipendenza formale nell'abbraccio dell'Italia. La Convenzione di amicizia e buon vicinato del 1939, l'unione doganale EEC del 1991 e l'accordo monetario sull'euro legano lo Stato all'Italia e all'EU; la sopravvivenza come microstato sovrano dipende dalla tenuta di questo quadro.
- hash: 25f359ad
  it: |
    Garantire l'accesso al mercato unico dell'EU e al suo settore finanziario tramite l'Accordo di associazione, senza piena adesione all'EU. I negoziati si sono conclusi nel dicembre 2023; il Consiglio ha autorizzato la firma il 16 luglio 2026; la firma è prevista il 19 ottobre 2026 a Bruxelles, e la conclusione del Consiglio richiede ancora il consenso dell'European Parliament.
- hash: 3e9d2cc5
  it: |
    Mantenere vitale il centro finanziario sotto la pressione dell'EU e dell'Italia: completare la riforma bancaria che l'IMF riconosce in corso, ottenere il dialogo con la ECB e la Banca d'Italia che l'Accordo di associazione richiede, e attrarre investitori qualificati in un settore ancora carente di capitale ed efficienza.
- hash: 64ef6174
  it: |
    Diplomazia attraverso i Captains Regent, due capi di Stato congiunti con un veto reciproco e senza potere esecutivo, che rappresentano il Paese e garantiscono l'ordine costituzionale (Wikipedia, Captains Regent, rinvio di livello 4).
- hash: bb95228e
  it: |
    Strumenti economici che non sono strumenti sovrani: l'unione doganale del 1991 con l'EEC e l'intesa sull'euro con le regole monetarie italiane e dell'EU. Danno accesso al mercato unico e costano allo Stato la propria moneta e la propria politica commerciale.
- hash: bec35da8
  it: |
    Un settore bancario e finanziario che è la principale fonte di entrate e il principale punto di pressione. L'IMF rileva che le riforme degli ultimi anni hanno ridotto le vulnerabilità ereditate dal passato, ma la redditività resta al di sotto degli omologhi regionali.
- hash: 630389f8
  it: |
    Geografia: San Marino è interamente circondata dall'Italia e non ha sbocco sul mare, quindi l'Italia è la via per il commercio, i trasporti e le persone (Wikipedia, Relazioni tra Italia e San Marino, livello 4).
- hash: 646dd53c
  it: |
    Dimensione e capacità: la Commissione aveva già giudicato nel 2013 che l'adesione all'EU non fosse adatta a Stati così piccoli, e la Norvegia ha messo in dubbio la loro capacità amministrativa per l'adesione all'EEA (Wikipedia, Relazioni UE, rinvio di livello 4).
- hash: 95bbb530
  it: |
    Ratifica: l'Accordo di associazione ha competenze miste, quindi richiede l'European Parliament e i parlamenti nazionali oltre al Grand and General Council, e il calendario dipende da essi.
- hash: fff144d9
  it: |
    Il centro finanziario che ha procurato allo Stato le sue entrate è anche ciò che l'Italia e l'EU prendono di mira. L'Accordo di associazione apre il settore finanziario solo per fasi e soltanto dopo una valutazione del quadro normativo e di vigilanza; quindi le riforme necessarie a conservare il settore sono quelle che limitano la riservatezza su cui ha costruito i propri affari.
- hash: a857ebd3
  it: |
    San Marino non ha una moneta propria né una politica commerciale indipendente, poiché l'euro e l'unione doganale la vincolano alle regole italiane e dell'EU. La sua grand strategy consiste nel mantenere i quadri italiano e dell'EU che garantiscono la sua esistenza, trasformando il settore finanziario da fonte di distinzione in mercato regolato. I Captains Regent parlano a nome dello Stato e il Secretariat porta avanti il lavoro. La sua mossa più importante, l'Accordo di associazione, è stata conclusa ma non ancora firmata né ratificata, quindi la lettura dei passi del 2026 resta provvisoria.
- hash: 7d489edc
  it: |
    Restare il governo riconosciuto. Il mandato quadriennale del presidente Hassan Sheikh Mohamud è scaduto il 15 maggio 2026 secondo il conteggio dell'opposizione; gli emendamenti del parlamento di marzo 2026 lo trasformano in un mandato quinquennale, quindi egli dichiara di restare in carica fino al 15 maggio 2027, e il piano prevede un'elezione a un voto per persona, al posto del voto indiretto su base clanica. L'opposizione (Deni del Puntland, l'ex presidente Sharif Sheikh Ahmed, il Somali Future Council) definisce unilaterali gli emendamenti e non lo riconosce più; i colloqui mediati da Stati Uniti e Regno Unito a Halane sono falliti il 15 maggio.
- hash: e775cbab
  it: |
    Tenere il centro-sud contro al-Shabaab e ISIS-Somalia con forze altrui: truppe dell'AUSSOM, droni e addestratori turchi, truppe egiziane (in ritardo), attacchi aerei statunitensi (almeno 124 nel 2025, 63 entro il 29 maggio 2026). L'offensiva di al-Shabaab del 2025 da Hiran e Medio Scebeli ha annullato gran parte dei guadagni del 2022-23; il 9 ottobre 2026 al-Shabaab ha preso Hees, in Hiran, e ha tagliato una strada di rifornimento dell'esercito.
- hash: dd4a36eb
  it: |
    Annullare la separazione del Somaliland e impedirne il riconoscimento. Mogadiscio considera il Somaliland parte integrante della Somalia; le minacce sono il riconoscimento israeliano del 26 dicembre 2025 (il primo da parte di un membro dell'UN), gli uffici Taiwan-Somaliland (uno nuovo aperto nel giugno 2026) e le ipotesi di una base navale statunitense a Berbera in cambio del riconoscimento. La coalizione contraria è ampia ma per lo più retorica: Cina, Turchia, Arabia Saudita, Egitto, Gibuti, OIC e AU sostengono tutti l'unità somala.
- hash: d00950fd
  it: |
    Riportare gli Stati membri federali sotto il nuovo ordine costituzionale. Il Puntland ha ritirato il riconoscimento del governo federale tra marzo e aprile 2024; il Jubaland ha respinto gli emendamenti del marzo 2026, ha ripreso Balad Hawo e controlla le località di Gedo di Dolow, Luuq ed El Wak; nel Southwest State il governo federale ha sciolto l'assemblea dopo un voto controverso di marzo, e le forze del leader deposto Laftagareen hanno poi preso Qansax Dheere e Burhakabo. Gli strumenti di Mogadiscio sono un'amministrazione parallela a Gedo (un piano di 45 giorni dell'ottobre 2025), nomine ad interim e la legge elettorale.
- hash: 24433dbc
  it: |
    Mantenere finanziata la transizione della sicurezza: AUSSOM (mandato fino al 31 dicembre 2026), l'ufficio logistico dell'UN, UNSOS, che lo alimenta, e il programma IMF che ha sostituito gli aiuti perduti. L'EU ha riattivato ad aprile 2026 i fondi dell'European Peace Facility (75 milioni di EUR, un ponte di alcuni mesi), mentre Washington ha dichiarato l'1 luglio che smetterà di pagare l'UNSOS alla fine del 2026 e si opporrà al suo rinnovo.
- hash: 3963acfc
  it: |
    Impedire che l'Etiopia usi le faglie somale contro Mogadiscio, senza una guerra. Mogadiscio ha scambiato la rottura del gennaio 2024 sul MoU dell'Etiopia con il Somaliland con la Dichiarazione di Ankara del dicembre 2024 (accesso etiope al mare solo sotto l'autorità sovrana somala), mantiene truppe etiopi nell'AUSSOM e bilancia Addis Abeba con l'asse Egitto-Eritrea, la Turchia e il Golfo. Il 4 ottobre 2026 Hassan Sheikh si è incontrato a El Alamein con Sisi, Burhan e Isaias, poi si è congratulato con Abiy per la sua rielezione.
- hash: f0a03f46
  it: |
    Cambio di patroni come metodo. Turchia (la Dichiarazione di Ankara, l'accordo di cooperazione in materia di difesa ed economia del 2024, mediatrice dei colloqui governo-opposizione di luglio 2026), Egitto ed Eritrea (il trilaterale di Asmara dell'ottobre 2024, il quadrilaterale di Alamein del 4 ottobre 2026), Qatar e Arabia Saudita (i colloqui di Riad dell'11 gennaio 2026, l'adesione alla coalizione del Mar Rosso guidata dall'Arabia Saudita annunciata il 30 luglio 2026), Cina (la telefonata di Wang Yi del 12 gennaio 2026). Ciascuno viene acquistato con un pezzo di sovranità somala o con un voto contro il Somaliland.
- hash: 4073028a
  it: |
    Copertura giuridica e religiosa collettiva contro il riconoscimento del Somaliland: la dichiarazione congiunta di 21 Stati che respinge il passo di Israele, sostenuta dall'OIC, la protesta di Gibuti all'UN Security Council e la chiusura dell'ufficio di collegamento del Somaliland, e la carta One-China (il resoconto di Pechino del 12 gennaio 2026 e i moniti della sua ambasciata a Hargeisa sull'ufficio di Taiwan).
- hash: 4a0eac91
  it: |
    Delegittimare la periferia e l'opposizione con una cornice di sicurezza: l'affermazione del presidente, che cita informazioni di intelligence, secondo cui il Somaliland avrebbe accettato di reinsediare palestinesi e ospitare una base israeliana in cambio del riconoscimento (dicembre 2025, non verificata), e l'affermazione del ministro della Difesa del 13 ottobre 2026 secondo cui 260 uomini armati sono stati allontanati dalle case dei leader dell'opposizione a Mogadiscio.
- hash: 6e2c2051
  it: |
    Una forza straniera come esercito: Turchia (base di addestramento TURKSOM a Mogadiscio, droni Bayraktar TB2 e Akinci, elicotteri T129, mandato delle truppe rinnovato fino al 27 luglio 2028), Stati Uniti (63 attacchi AFRICOM entro il 29 maggio 2026 contro al-Shabaab e, nel Puntland, contro ISIS-Somalia), AUSSOM (mandato fino al 31 dicembre 2026) e un contingente egiziano ritardato per mancanza di fondi.
- hash: 180399d5
  it: |
    Spostamenti di truppe federali nelle periferie contese (località di Gedo nel 2025; Bardere e Garbaharey sono ancora tenute da forze vicine al governo federale) e la dimostrazione di forza intorno alle case dei leader dell'opposizione a Mogadiscio l'11 ottobre 2026.
- hash: 24b02344
  it: |
    Risorse e concessioni come patronato: gli accordi di esplorazione con TPAO (tre blocchi offshore e un'area a terra di circa 16.000 km²; la nave di perforazione Cagri Bey ha avviato il pozzo Curad-1 nell'aprile 2026), lo spazioporto di Warsheikh, un'offerta permanente a Washington di Berbera, Balidogle e Bosaso, e l'annullamento di tutti gli accordi con gli Emirati Arabi Uniti del 12 gennaio 2026.
- hash: cb2be1df
  it: |
    Risanamento dei bilanci come fonte di leva: il punto di completamento HIPC del dicembre 2023 (4,5 miliardi di USD di sgravio; debito estero passato dal 64% del PIL nel 2018 a meno del 6% alla fine del 2023), un accordo ECF dell'IMF portato a circa 140 milioni di USD nel dicembre 2025, e una diaspora che ha inviato 3,13 miliardi di USD nel 2025 secondo il conteggio della banca centrale.
- hash: f8d67c79
  it: |
    Lo Stato non controlla il proprio territorio. Il divieto d'ingresso statunitense del giugno 2025 afferma di per sé che la Somalia non dispone di un'autorità centrale competente né del controllo sul proprio territorio; al-Shabaab controlla o tassa ampie parti del sud e del centro, il Puntland gestisce i propri affari dal 2024, il Jubaland controlla Dolow, Luuq, El Wak e Balad Hawo, il Somaliland è fuori dal controllo federale e il Southwest è in rivolta.
