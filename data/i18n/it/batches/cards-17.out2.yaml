items:
- hash: 'bd83ed24'
  it: |
    L'esercito che garantisce lo Stato svuota lo Stato civile di cui ha bisogno. Il 27° emendamento consolida Munir come Chief of Defence Forces (cinque anni, comando del braccio nucleare, immunità a vita, rimovibile solo con il voto dei due terzi) proprio mentre l'IMF, la revisione del GSP+ dell'EU (l'EU assorbe circa il 28% delle esportazioni; la valutazione della Commissione del 16 Jul 2026 e l'avvertimento dell'ambasciatore dell'EU di September indicano che l'accesso non è garantito) e i partner occidentali giudicano il Pakistan in base alle istituzioni e allo stato di diritto. Più il potere si concentra in un uomo solo, più il denaro estero che paga l'esercito dipende dalla sua reputazione personale.
- hash: '97e20417'
  it: |
    Una battaglia aerea vinta, una partita sull'acqua persa. Lo scontro di May 2025 ha messo in mostra i caccia cinesi e ha dato al Pakistan una narrazione di vittoria e un posto al tavolo di Trump, ma la risposta indiana a Pahalgam, che è durata più del cessate il fuoco, non è stata militare: l'Indus Waters Treaty è rimasto sospeso da 17 mesi, Delhi dice che resterà così finché il Pakistan non abiurerà 'credibly and irrevocably' il terrorismo, e il Pakistan ha soltanto minacce ('act of war') con cui rispondere a una leva che non può eguagliare. Il successo tattico ha spostato la disputa sul terreno dove l'India è più forte.
- hash: '0cb8bdee'
  it: |
    La profondità strategica si è trasformata in esposizione strategica. Il Pakistan ha sostenuto i talebani per guadagnare profondità contro l'India; oggi i talebani danno rifugio al TTP, trattano con Delhi e subiscono i bombardamenti pakistani. La risposta di Islamabad (attacchi aerei su Kabul, 'open war', l'espulsione di 2.4 milioni di afghani) approfondisce l'ostilità del governo di cui ha bisogno per negare al TTP una base, e spinge Kabul verso l'India.
- hash: '7a370104'
  it: |
    Quattro patroni, quattro prezzi. Ogni patrono compra un Pakistan diverso: Pechino vuole che i suoi lavoratori siano protetti e i suoi debiti onorati, Riad e Ankara vogliono truppe e un'ombra nucleare, Washington vuole minerali, Gaza e un accordo sull'Iran, e il Golfo vuole manodopera. La neutralità del mediatore, che Washington e Teheran apprezzano, è compromessa dal patto di difesa con Riad (Al Jazeera elenca tra le difficoltà il conciliare la mediazione con l'impegno verso l'Arabia Saudita), e il patto a sua volta è una scommessa su un'America che potrebbe disimpegnarsi. Ogni patrono rafforzato è un margine di libertà speso con un altro.
- hash: '968a8746'
  it: |
    Il CPEC crea il nemico contro cui deve difendersi. Gwadar e i progetti cinesi in Belucistan sono il miglior argomento del BLA, perciò più la Cina investe, più i cittadini cinesi diventano bersagli (circa 20 morti in 14 attacchi dal 2021), più l'esercito devia risorse per proteggerli, e più la pazienza di Pechino diventa il rischio principale per il 'iron brother'; allo stesso tempo, i crediti non pagati dei produttori cinesi di energia elettrica (Rs560bn) alimentano il debito circolare del settore elettrico che il programma IMF cerca di contenere.
- hash: '7a839bef'
  it: |
    La mediazione procura favore, ma la guerra che media costa al Pakistan più di quasi chiunque altro. La spola di Munir tra Washington e Teheran ha guadagnato il favore di Trump, che ha portato il dazio al 19% e un posto nel Board of Peace, eppure la chiusura dello Stretto di Hormuz colpisce un'economia che importa energia attraverso lo stretto e vive delle rimesse dal Golfo, e i colloqui si sono bloccati dopo che il memorandum di Islamabad di 60 giorni è scaduto a metà agosto 2026.
- hash: '5e565007'
  it: |
    Il Pakistan gioca il gioco più antico dello Stato più debole accanto a un vicino più forte, e lo gioca più duramente di chiunque altro: non cerca di eguagliare l'India, cerca di rendere costosa ogni sua mossa moltiplicando le relazioni che stanno dietro di essa. In termini luttwakiani si tratta di manovra relazionale, non di logoramento. La Cina fornisce l'hardware, l'Arabia Saudita e la Turchia i patti e il denaro, gli Stati Uniti la copertura che arriva in ritardo, e il deterrente nucleare il fondamento di tutto. Da May 2025 la manovra ha reso in modo insolitamente buono: un feldmaresciallo siede al vertice delle forze armate, Washington e Teheran usano entrambi il suo canale, e un trattato con Riad ha trasformato un legame saudo-pakistano lungo decenni, fatto di manodopera in cambio di denaro, in una garanzia di difesa. I paradossi vengono dalla stessa fonte. Il controllo politico dell'esercito è la sua grande responsabilità strategica: dà allo Stato un'unica voce decisiva in una crisi, ma lega l'accesso al denaro occidentale, al mercato dell'EU e all'IMF alla reputazione di un solo uomo e di una sola istituzione, e mantiene in emergenza permanente l'economia civile su cui deve appoggiarsi. Il secondo paradosso è geografico: la vittoria di May 2025 è stata reale nell'aria, ma l'India ha risposto con il fiume, e uno Stato più debole non ha una buona risposta a una leva che non può toccare. Terzo, il fronte occidentale ha ribaltato la vecchia strategia: i talebani che un tempo nutriva come profondità sono oggi il suo vicino più pericoloso, e ogni colpo che sferra a Kabul rende più sicuro il santuario del TTP. I quattro patroni del Pakistan sono anche quattro creditori d'influenza, e il patto saudo-turco, firmato mentre il Pakistan media la pace per l'Iran, è il primo segno che possono essere giocati l'uno contro l'altro con la stessa facilità con cui il Pakistan li gioca. Ciò che va osservato non è la prossima crisi con l'India, ma se i tre vincoli (il bilancio, il confine afghano, l'acqua) si stringano nello stesso momento mentre un solo uomo tiene in mano ogni leva.
- hash: 'a985b148'
  it: |
    Mantenere il canale panamense, neutrale e aperto a tutte le bandiere. I trattati Torrijos-Carter del 1977 hanno consegnato la via d'acqua a Panama; nel 2025 Trump ha parlato di 'taking back' il canale, e il presidente Mulino ha risposto che Panama ne avrebbe mantenuto la proprietà. L'obiettivo è difendere questa linea senza combattere, ed è per questo che la concessione è andata alla sicurezza anziché alla sovranità.
- hash: 'acbd6434'
  it: |
    Mantenere le concessioni portuali sotto la legge panamense e i proventi in patria. Un ricorso panamense ha cercato di annullare per incostituzionalità il contratto di 25 anni con CK Hutchison per i porti alle due imboccature del canale, mentre l'acquisto da parte di BlackRock è stato spinto avanti come la soluzione che Washington ha lodato.
- hash: 'd7175c79'
  it: |
    Sicurezza per sovranità, scambiata. Il memorandum dell'April 2025 con il US Defence Department riapre una presenza statunitense a rotazione in tre ex basi lungo il canale e registra una dichiarazione di primo e libero transito per le navi da guerra statunitensi. Il prezzo è stata una presenza militare statunitense che la stessa storia dei trattati panamensi aveva posto fine.
- hash: 'ac85c8a7'
  it: |
    La revisione dei porti come leva. Mulino ha accettato di esaminare le imprese legate alla Cina presenti a Panama, compresi i porti di CK Hutchison, dopo l'ultimatum di Rubio del February 2025; la revisione è una leva regolatoria che Panama può accendere e spegnere.
- hash: '8ddaced6'
  it: |
    Costo nelle piazze e nella società. Uno sciopero a tempo indeterminato dal 28 April 2025 contro la riforma delle pensioni e l'ingerenza statunitense ha paralizzato Bocas del Toro; Chiquita ha perso più di US$75 milioni e ha licenziato migliaia dei suoi circa 6,500 lavoratori panamensi; Panama ha dichiarato lo stato di emergenza nel June 2025 dopo scontri mortali. Il governo non può fare una mossa rivolta agli Stati Uniti senza un prezzo interno.
- hash: '9808d7d4'
  it: |
    L'opposizione al patto con gli Stati Uniti. L'opposizione definisce il memorandum sulla sicurezza una 'camouflaged invasion', e le proteste hanno indicato l'accordo tra le loro ferite aperte. L'allineamento di cui Mulino ha bisogno per il canale è quello che la sua stessa politica respinge.
- hash: '53fe117d'
  it: |
    I trattati che nel 1977 hanno restituito il canale vietavano le basi straniere che il memorandum del 2025 riporta lungo la via d'acqua. Panama difende la propria sovranità sul canale con la presenza che la sovranità doveva eliminare, e le proteste mostrano che il costo è pagato in patria.
- hash: '49d8a8ec'
  it: |
    La strategia di Panama è mantenere il canale panamense e i suoi proventi in movimento, e nel 2025 l'unico garante di entrambi è stata la potenza che aveva minacciato di riprendersi il canale. Mulino ha pagato la copertura statunitense con una presenza militare e una rottura con la Belt and Road di Pechino, e ha tenuto sotto revisione i porti legati alla Cina anziché confiscarli. Il costo si vede in patria, nello sciopero, nello stato di emergenza e nella parola 'invasion', perciò la prossima prova è se la neutralità del canale sopravviverà a un patrono che è anche il suo più rumoroso rivendicatore.
- hash: 'ec24323b'
  it: |
    Vendere i minerali su due mercati insieme: gli scambi con la Cina attraverso il porto di Chancay, e il rame verso gli Stati Uniti sotto la minaccia dei dazi. I minerali sono l'economia; il resto ne discende. La Cina ha assorbito il 36.2% delle esportazioni del 2025 (Mincetur, come riportato; un estratto precedente indicava il 32%, vedi la nota sulle relazioni); il settore minerario ha rappresentato US$61.8bn dei record US$90.1bn esportati, con il rame al 45% e l'oro al 38% di quella cifra (SNMPE); il rame destinato agli Stati Uniti è meno del 5% delle esportazioni di rame, ma gli Stati Uniti fissano il dazio e hanno acquistato US$10.15bn di tutti i beni nel 2025.
- hash: '6171d87f'
  it: |
    Un esecutivo stabile dopo una serie di rimozioni. Il Congress ha rimosso Boluarte nell'October 2025 e José Jerí nel February 2026; José María Balcázar è succeduto a Jerí come presidente ad interim; Keiko Fujimori (Fuerza Popular) ha vinto il ballottaggio del 7 June 2026 con il 50.14% contro il 49.87% di Roberto Sánchez, con uno scarto di 49,641 voti; la giuria elettorale (JNE) l'ha proclamata il 3 July e ha giurato il 28 July 2026 per il mandato 2026-2031, 'the ninth president in a decade' secondo il conteggio di AP. Luis Galarreta, suo primo vicepresidente, è primo ministro; Elmer Cuba (già a capo della banca centrale) è all'Economia e Carlos Espá agli Affari esteri. Secondo la nostra lettura della sequenza, la stabilità è l'obiettivo.
- hash: 'fda4d75c'
  it: |
    Ricostruire l'anello delle relazioni regionali che i governi precedenti hanno spezzato. Le relazioni con il Messico erano state interrotte dopo che il Messico aveva accolto nella propria ambasciata l'ex primo ministro Betssy Chávez (November 2025) e sono state ripristinate il 7 August 2026, quando Lima le ha concesso un salvacondotto come gesto di distensione; le relazioni consolari con il Venezuela, interrotte da Caracas in July 2024, sono state annunciate come riprese il 24 July, e il consolato a Caracas doveva riaprire il 1 September. Espá ha indicato Messico e Venezuela tra i suoi primi compiti.
- hash: 'a0bb0e42'
  it: |
    Mettere la sicurezza al primo posto e presidiare il confine. Il programma inaugurale di Fujimori prevede una stretta contro la criminalità con un maggiore coinvolgimento militare e una riforma delle carceri; il suo ministro dell'Interno è un generale in pensione, che ha anche ottenuto un seggio al Senate; con l'Ecuador ha concordato il 28 July di lavorare su sensori e droni per il confine meridionale e sulla gestione delle carceri. La sicurezza è la piattaforma con cui intende attrarre investimenti.
- hash: '55352368'
  it: |
    Ottenere una revisione del dazio statunitense e mantenere Washington come partner strategico. Gli Stati Uniti hanno applicato al Perù un dazio aggiuntivo del 12.5% il 24 July 2026 (Section 301, sui divieti di importazione di beni prodotti con lavoro forzato); il Perù ha inviato al Congress un disegno di legge sul lavoro forzato, e Espá ha dichiarato che una volta approvato Lima sarà in una posizione migliore per chiedere una revisione. Gli Stati Uniti sono il secondo mercato (US$10.15bn di esportazioni nel 2025), e Lima sta muovendosi per aderire allo Shield of the Americas sostenuto dagli Stati Uniti contro la criminalità transnazionale.
- hash: '950c61e1'
  it: |
    Chancay, il terminal COSCO Shipping Ports (60% di proprietà, concessione di 30 anni, 1 million TEU l'anno), il primo terminal COSCO in Sud America, inaugurato in videocollegamento da Xi e Boluarte il 14 Nov 2024. Rame e oro sono la base delle esportazioni.
- hash: '8c606553'
  it: |
    Cooperazione in materia di sicurezza con gli Stati Uniti: programmi antidroga, il Patto di Rio e la partecipazione al RIMPAC (articolo sulle relazioni USA-Perù su Wikipedia, indicazione di livello 4, non verificata sui testi primari statunitensi o peruviani).
- hash: 'bd7382e8'
  it: |
    Una rete di accordi commerciali e una base di esportazioni record. Le esportazioni di beni sono state US$90.08bn nel 2025 (+21%, 27.3% del PIL), con Cina, EU e Stati Uniti come tre destinazioni principali (oltre il 60% insieme); accordi di libero scambio con il Giappone (in vigore dal 2012; il Giappone ha assorbito il 4.5% delle esportazioni nel 2024) e la Corea del Sud (firmato nel 2010, in vigore dal 2011) affiancano quelli con Cina e Stati Uniti. In January-May 2026 le esportazioni di minerali sono cresciute del 53.1% fino a US$33.4bn, quindi lo strumento coincide con il valore delle esportazioni stesse.
- hash: '566ee22a'
  it: |
    Diplomazia regionale come riparazione e come blocco. Il Binational Cabinet con l'Ecuador, previsto dagli accordi di Brasilia del 1998 (il prossimo incontro è previsto a Lima verso la fine del 2026), il riavvicinamento con il Messico del 7 August 2026, la riapertura consolare a Caracas e la dichiarazione di Santiago del 28 August 2026 sui minerali strategici (rame e litio), firmata con Cile, Argentina e Bolivia.
- hash: 'a9b7d0fc'
  it: |
    Le forze armate si rivolgono all'interno. Il programma inaugurale affida ai militari una parte più ampia nella lotta alla criminalità organizzata; il ministro della Difesa (Rafael Belaúnde Llosa, senza un passato militare) supervisiona le pattuglie nelle strade e nei nodi di trasporto, e il ministro dell'Interno è un generale in pensione che ha guidato il Joint Command nel 2018-2021. Fujimori intende inoltre chiedere al Congress poteri legislativi in materia di criminalità e di El Niño.
- hash: '33eef333'
  it: |
    Il Congress è il vincolo. La vaga causa di 'moral incapacity' prevista dalla costituzione del 1993 consente al Congress di rimuovere il presidente, e lo ha fatto: Castillo nel December 2022, Boluarte nell'October 2025 e Jerí nel February 2026. Ogni rimozione riporta a zero l'agenda dell'esecutivo, e la transizione del 2026 è avvenuta sotto Balcázar, un presidente ad interim scelto dal Congress.
- hash: '071d2bf1'
  it: |
    Esposizione alle esportazioni. Rame e oro sono l'economia, e il dazio statunitense sul rame è fissato a Washington: Andina ha riportato un dazio del 50% sul rame a July 2025, mentre i tassi del 2026 nelle fonti trovate sono in contrasto (un dato del 50% e uno del 53% su siti commerciali di tariffe, un dazio universale graduale proposto in un brief del CFR). Tassi non verificati; il vincolo è la dipendenza, non la cifra.
- hash: 'a8ca9ee1'
  it: |
    Chancay è un asset controllato dalla Cina che il Perù non può facilmente controllare né riesaminare. COSCO detiene il 60% con una concessione di 30 anni; all'inizio del 2026 un giudice peruviano ha stabilito che il regolatore Ositrán non può supervisionare il porto oltre le tariffe del servizio, e il US State Department ha dichiarato di essere preoccupato che il Perù possa perdere il controllo su un'infrastruttura critica. Lima risponde che il porto deve rispettare le regole peruviane; la Cina ha replicato con 'strong dissatisfaction'. Nel 2025 il porto ha anche perso US$10.8m su ricavi di US$57.1m.
- hash: '9ffe0aed'
  it: |
    Un mandato ristretto e un Congress diviso. Fujimori ha vinto con 49,641 voti; il suo rivale Roberto Sánchez ha vinto in Perù con circa 32,000 voti di scarto, mentre lei ha vinto con il voto dall'estero (circa 81,000), e lui denuncia brogli senza presentare prove (MercoPress) e ha parlato di rivolgersi al sistema inter-American human rights system. Il suo partito ha 22 dei 60 seggi del Senate ricostituito, meno dei 31 necessari per la maggioranza, quindi ogni riforma e ogni richiesta di poteri legislativi ha bisogno di alleati nella camera che ha rimosso tre presidenti.
- hash: '7ead4429'
  it: |
    Confini e migrazione che non riesce a chiudere. Il Perù ospita circa 1.54 milioni di venezuelani (UNHCR, fine 2023; l'aggiornamento regionale R4V di August 2026 attribuisce al Perù 1.63 milioni, un altro rapporto 1.22 milioni), il 32% dei quali in povertà monetaria, e il confine cileno è un secondo fronte: nel November 2025 il Perù ha dichiarato lo stato di emergenza per bloccare i valichi di frontiera cileni, mentre i flussi migratori si accumulavano verso il Cile. Il peso ricade su Lima, le decisioni sono a Santiago e a Caracas.
- hash: '1272d012'
  it: |
    Chancay porta il denaro cinese e il commercio cinese, e il legame con la Cina è diventato un peso politico. Il presidente Jerí è stato rimosso dal Congress nel February 2026 per incontri non dichiarati con Zhihua Yang, un imprenditore cinese sottoposto a verifiche governative. Gli investimenti di cui lo Stato ha bisogno sono anche ciò che fa cadere i suoi leader.
- hash: '1a650d5e'
  it: |
    Chancay è il dono che attira i sospetti di Washington. Il porto è stato costruito per portare i minerali peruviani su una rotta di 23 giorni verso Shanghai e nel 2025 ha movimentato 336,200 TEU (obiettivo: oltre 350,000), ma lo stesso terminal è diventato oggetto di avvertimenti statunitensi: la testimonianza del 2024 di Southern Command su un possibile uso militare, la dichiarazione del State Department del February 2026 secondo cui i 'cheap money' cinesi costano sovranità, e un appello del Congress statunitense dell'April 2026 affinché il governo peruviano successivo lo riprenda (l'ultimo da un rapporto secondario). Gli Stati Uniti sono il mercato della frutta e dell'oro peruviani (US$10.15bn nel 2025) e sono quelli che hanno applicato un dazio del 12.5% al Perù il 24 July 2026; la motivazione dichiarata è l'applicazione contro il lavoro forzato, non Chancay, e il legame tra i due è una nostra lettura.
- hash: 'c8b06884'
  it: |
    Lo Stato del rame senza un governo stabile. Le esportazioni peruviane hanno stabilito un record per cinque anni di seguito (US$90.08bn nel 2025, +21%; attività mineraria il 66% del totale; il solo rame US$28.1bn) e sono cresciute di nuovo in January-May 2026 (minerali +53.1%), mentre il Perù ha avuto nove presidenti in un decennio. La ricchezza arriva chiunque governi, quindi nessuno a Lima è costretto a costruire lo Stato che dovrebbe custodirla, e il Congress che rimuove i presidenti è pagato dallo stesso boom.
- hash: '336a7531'
  it: |
    La migrazione venezuelana trascina Lima verso il governo da cui i suoi migranti sono fuggiti. Il Perù ha accolto circa 1.5 milioni di venezuelani e l'UNHCR ha elogiato il suo permesso di soggiorno temporaneo nell'August 2026; Caracas ha interrotto le relazioni nel July 2024 dopo che Lima ha riconosciuto l'esponente dell'opposizione Edmundo González, e il Perù ora riapre un consolato a Caracas perché i migranti hanno bisogno di documenti e un eventuale rimpatrio volontario richiede lo Stato venezuelano (Plasencia, 14 August 2026). Occuparsi dei migranti significa trattare con il regime che la linea precedente del Perù condannava.
- hash: 'ee2c6758'
  it: |
    La questione del mare boliviano mette il Perù su entrambi i fronti. Secondo il Trattato di Lima del 1929 l'accesso della Bolivia al Pacifico è bloccato dal Cile e dal Perù (informazioni di contesto dalle fonti lette, testo del trattato non letto); nel 2010 Perù e Bolivia hanno firmato il protocollo di Ilo, una zona marittima franca di 99 anni per la Bolivia nel porto peruviano (la ratifica peruviana non è verificata). Nel January 2026 il presidente Paz ha detto che il Pacifico, 'through Chile or Peru', deve essere la porta d'accesso della Bolivia, e il 28 August 2026 il Perù ha firmato la dichiarazione sui minerali con Cile e Bolivia. Il Perù offre alla Bolivia il mare che può dare dalla propria costa, mentre una rivendicazione boliviana sulla costa cilena riaprirebbe l'accordo del 1929 firmato anche da Lima.
- hash: 'fd6ce216'
  it: |
    Il Perù è governato dal 28 July 2026 da Keiko Fujimori, che ha vinto il ballottaggio con 49,641 voti dopo che il Congress ha rimosso Boluarte (October 2025) e Jerí (February 2026): un presidente di destra con il blocco più numeroso in un nuovo Senate ma senza maggioranza, un primo ministro che è il suo vicepresidente, e un governo costruito su investimenti e sicurezza. Il Perù è un'economia mineraria con due mercati: la Cina ha assorbito il 36.2% delle esportazioni del 2025, in gran parte attraverso il Chancay di COSCO, e gli Stati Uniti, secondo mercato, applicano ora un dazio del 12.5% al Perù, quindi Lima deve tenere aperti entrambi allo stesso tempo; la sua risposta finora è definire gli Stati Uniti un partner strategico, ricucire con Messico e Venezuela, e non dire nulla in pubblico sulla Cina. La strategia è frenata meno dai nemici che dal proprio Congress e dai confini che non riesce a chiudere (Cile, migrazione venezuelana), e il porto cinese è un rischio politico oltre che un guadagno commerciale. Non verificati per questa scheda: le rimozioni di Boluarte e Jerí e gli incontri con Zhihua Yang oltre l'indice di Wikipedia, i dati sul commercio con l'Iran, il dazio sul rame ai sensi della Section 232 in vigore oggi, le tappe con Brasile, Spagna, Regno Unito e APEC, l'attività mineraria illegale e i resti di Shining Path (nessuna fonte letta), e se il Congress peruviano abbia ratificato il protocollo di Ilo.
- hash: 'e205aa35'
  it: |
    Mantenere ciò che ha nel West Philippine Sea senza una guerra: la BRP Sierra Madre sul Second Thomas Shoal (Ayungin), l'accesso a Scarborough (Bajo de Masinloc) e a Sabina, e la zona economica esclusiva confermata dal lodo arbitrale del 2016. L'obiettivo è rendere ogni mossa cinese una violazione del diritto visibile, così che un fatto compiuto (la 'nature reserve' di Scarborough del September 2025, la piattaforma galleggiante del May-June 2026) costi a Pechino più di quanto guadagni.
- hash: '413c9d1a'
  it: |
    Mantenere lo scudo americano credibile, esplicito e fisicamente presente: il Mutual Defense Treaty del 1951 letto come copertura delle navi della guardia costiera filippina ovunque nel Mar Cinese Meridionale, nove siti EDCA, la Task Force Philippines e le batterie missilistiche Typhon e NMESIS rimaste sul suolo filippino dal 2024. Manila chiede a Washington ciò che il testo del trattato lascia indefinito.
- hash: 'f007cfd7'
  it: |
    Rendere lo scudo plurale, così che nessun singolo patrono o amministrazione americana ne costituisca l'intero: trattati di accesso reciproco o di forze in visita con gli Stati Uniti (1998), l'Australia (2012), il Giappone (RAA in vigore dall'11 Sep 2025), la Nuova Zelanda e il Canada (firmati nel 2025, ratificati dal Senate l'11 Aug 2026) e la Francia (firmato il 26 Mar 2026, ratificato l'8 Oct 2026), un negoziato sulle forze in visita con il Regno Unito, e armamenti da Corea del Sud e India.
- hash: '493da8e6'
  it: |
    Usare la presidenza ASEAN del 2026 per concludere un Codice di condotta nel Mar Cinese Meridionale che sia 'effective, substantive' e ancorato all'UNCLOS, e per tenere insieme l'ASEAN (le contestate elezioni in Myanmar, il cessate il fuoco thailandese-cambogiano). Il vertice è previsto a Manila il 16-18 Nov 2026; gli analisti del CSIS e di Foreign Policy si aspettano poco più che simbolismo.
- hash: 'ae32af9b'
  it: |
    Tenere unito il governo nonostante la frattura Marcos-Duterte: il processo di impeachment al Senate contro la vicepresidente Sara Duterte (secondo impeachment, voto della House dell'11 May 2026), il processo Duterte alla ICC (si apre il 30 Nov 2026), lo scandalo di corruzione sui progetti anti-inondazione e la successione del 2028. La linea di politica estera verso la Cina è in gioco in tutti questi nodi.
- hash: '2f7e3564'
  it: |
    Evitare che l'economia e la pace nel sud diventino leve contro il Paese: diversificare i mercati (i negoziati di libero scambio con l'EU, ora alla sesta tornata), proteggere i lavoratori all'estero (2.19 milioni, con rimesse di USD 35.6bn, pari al 7.3% del PIL nel 2025) e completare l'accordo per il Mindanao, la cui prima elezione parlamentare si è tenuta il 14 Sep 2026.
- hash: '295b1366'
  it: |
    'Assertive transparency' dal February 2023: la Coast Guard (portavoce Jay Tarriela) e la National Task Force for the West Philippine Sea pubblicano video e immagini satellitari di quasi ogni incidente, integrano giornalisti nelle missioni di rifornimento e protestano formalmente per ogni atto. L'arma è l'esposizione, rivolta al pubblico estero e a quello interno; il National Security Council stesso ha giudicato nel 2024 che essa aumentava la consapevolezza ma non modificava il comportamento cinese.
- hash: 'e8358f7c'
  it: |
    Diritto e coalizione: il lodo del 2016 come riferimento fisso (una dichiarazione congiunta di 14 paesi ne ha celebrato il decimo anniversario nel July 2026), proteste formali accanto a canali aperti (Lazaro ha incontrato Wang Yi il 22 Jul 2026, il primo bilaterale tra ministri degli Esteri in due anni, dopo aver protestato per l'incidente del baton ad Ayungin), la presidenza ASEAN e una rete di status-of-forces agreements.
