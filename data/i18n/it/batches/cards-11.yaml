  it: ''
- hash: e78e2829
  kind: cards
  en: 'Rebuild an economy that lives on imports and remittances: Growth Plan money (up to EUR 1.9bn for 2025-27, paid against reforms), export reorientation to the EU (64.2% of goods exports in H1 2026),
