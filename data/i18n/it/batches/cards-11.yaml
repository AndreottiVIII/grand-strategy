  it: ''
- hash: b77a4d55
  kind: cards
  en: 'EU accession as the organising frame, tied to Ukraine''s: first cluster opened on the same day, the same dossier for the Hungarian veto. Romania is the sponsor inside the Union and the Chișinău trilateral
    of 27 Aug 2026 (Sandu, Dan, Zelensky) was billed as the first at presidential level. Exit from the Russia-led CIS: law promulgated 6 Apr 2026, effective 8 Apr 2027.'
  it: ''
- hash: e32628ef
  kind: cards
  en: 'Calibrated rupture with Moscow rather than a break: 45 Russian diplomatic staff expelled in July 2023, the ambassador in Moscow recalled for consultations on 11 Aug 2026 after a drone exploded at
    Crocmaz, but the embassy stays open and Russia''s own embassy says it is open to dialogue.'
  it: ''
- hash: 18ac8fa7
  kind: cards
  en: 'Lawfare and public attribution against the Russian-funded network: Shor''s party banned (2023) and Shor convicted in absentia; Gagauzia''s Evghenia Gutsul sentenced to seven years (5 Aug 2025) for
    passing Russian money to it; 74 detained on 22 Sep 2025 for alleged training abroad to stage unrest; Sandu''s public warning that the Kremlin spent hundreds of millions of euros on votes; two opposition
    parties disqualified two days before the poll.'
  it: ''
- hash: ba0d5c2e
  kind: cards
  en: 'A small army with borrowed shields: EU air-defence financing (EUR 120m, July 2026; EUR 317m in all under the Peace Facility), US security aid approved by Congress in the 2026 budget (USD 36.5m, as
    reported), training from NATO members that the 2023 strategy names as ''security and defense partners''. Moldova fields no combat aircraft; drones from the Odesa front crossed its airspace repeatedly
    in 2026.'
  it: ''
- hash: 1054a6c8
  kind: cards
  en: 'Conditional EU money and market access as the substitute for Russian rents: Growth Plan tranches (EUR 189m in March 2026, EUR 157m in October 2026; about EUR 661m cumulative performance-based financing),
    EU 64.2% of exports and over 72% of foreign investment, and Moldovagaz as the legal channel that keeps gas flowing to Tiraspol (mandate to 31 Dec 2026) and with it a lever over the left bank.'
  it: ''
- hash: d77cced9
  kind: cards
  en: 'Russian troops sit on Moldovan soil and nobody has a means to remove them: about 1,500 soldiers of the Operational Group of Russian Forces in Transnistria (up to 11% of Moldovan territory outside
    Chișinău''s control), a promised 1999 withdrawal never carried out, FSB officers commanding the local security services, and no diplomatic path the Carnegie analysts can name. The OSW notes that unanimous
    EU consent for a country that does not control its own territory is ''highly unlikely''.'
  it: ''
- hash: e19dfe33
  kind: cards
  en: Neutrality is in the constitution and public opinion defends it. PAS has no two-thirds majority to change it, and polls put NATO support at about 20-30%; Sandu has said any change must come through
    a democratic process. The result is a state with no collective-defence guarantee, no combat aircraft, and air-defence capacity 'limited to protecting individual critical infrastructure sites' by Sandu's
    own account.
  it: ''
- hash: b840298f
  kind: cards
  en: The EU runs on unanimity and Moldova rides in Ukraine's slipstream. Hungary held the first cluster for almost two years; Budapest's new government lifted the veto in June 2026 but is still dosing
    the pace, so four clusters (internal market, competitiveness, green agenda, resources and cohesion) were not yet open in July 2026 and cluster three was released only through a letter on 17 Jul.
  it: ''
- hash: 43b78c58
  kind: cards
  en: An energy architecture that still passes through the breakaway region. Until 2024, Cuciurgan (Inter RAO-owned, in Transnistria) produced 60-80% of Moldova's electricity; even after Moldova stopped
    buying from it in January 2025 the Romanian power it imports travels over Transnistrian lines until the Vulcănești-Chișinău line is finished (still unfinished in June 2026). Replacement power costs
    more, and the Ministry of Economic Development now sees 2026 average inflation at 7.3%.
  it: ''
- hash: 21647eb2
  kind: cards
  en: 'A small, import-heavy economy with a thin cushion: IMF 2026 growth 2.3% in April and about 1.5% by August, a current-account deficit near 20% of GDP, a goods trade deficit of about EUR 1.6bn in Q1
    2026 alone, and remittances equal to 10.5% of GDP in 2024 (down from 14% in 2022), falling mainly from Russia while EU-origin flows grow.'
  it: ''
- hash: 35f68a78
  kind: cards
  en: 'A divided electorate and a rebellious autonomy: the pro-Russian Patriotic Bloc took 24.2% in September 2025, authorities say EUR 15m reached 130,000 people in the 2024 vote-buying scheme, and Gagauzia
    is in open conflict with Chișinău (Constitutional Court ruling of 9 Jul 2026 curtailing its powers, Bashkan post declared vacant on 17 Aug, election set for 15 Nov 2026 with a Romanian-language test
    for candidates).'
  it: ''
- hash: 8725a534
  kind: cards
  en: Waiting for Tiraspol to become unsustainable destroys the thing worth reintegrating. Gas stopped on 1 Jan 2025 and Transnistria's GDP fell 23% in H1, industrial output 33%, exports 42% in ten months;
    the Sheriff-linked business elite that sends about 80% of the region's exports to the EU is ruined first, and Carnegie warns the region may end as 'a deserted subsidized Russian military base' that
    Moldova will have to rebuild with a budget that 'cannot handle these expenses alone'. Success in squeezing the left bank raises the cost of winning it.
  it: ''
- hash: 766f1107
  kind: cards
  en: Neutrality, meant to keep war away, is the reason the army cannot get a shield and the Russian garrison cannot be challenged. The 2023 strategy ignores neutrality and cites Finland and Sweden; Russia
    reads every EU air-defence euro and training programme as NATO alignment; and the only rival garrison on the territory is the Russian one that neutrality is supposed to exclude.
  it: ''
- hash: 5ba4cdf1
  kind: cards
  en: Hitching the EU path to Ukraine's gives momentum and hostages. Both cleared the first cluster on the same day, but Moldova lost two years to a veto aimed at Kyiv, and the Foreign Minister (Popsoi)
    warns that putting Transnistria into a Ukraine-Russia settlement, as Sandu proposed in June 2026, would 'give the Kremlin a tool of influence and effectively a veto' over EU accession.
  it: ''
- hash: 5ff247c5
  kind: cards
  en: Protecting the vote with hard tools feeds the narrative of the people it protects against. Banning the Shor party, disqualifying two parties two days before the 2025 vote, jailing the Gagauz governor
    and curtailing Gagauz powers by court order are defensible against a funded network, but they hand the Patriotic Bloc, Comrat and Moscow the line of 'political persecution', in the autonomy where the
    Kremlin has long had its most reliable audience.
  it: ''
- hash: 43a3630f
  kind: cards
  en: The Romania card helps and harms. Sandu says she would vote for unification and Bucharest is Moldova's patron in the EU and on energy (Odesa Triangle, price caps on Romanian power), yet only 33-44%
    of Moldovans back union in the polls (IMAS July 2026; ATES March 2026) and Gagauzia's leader has threatened secession if Moldova joins Romania. Every Romanian gesture strengthens the case of those who
    call the EU path a 'Romanianisation'.
  it: ''
- hash: b064d9eb
  kind: cards
  en: The emigrants keep the state afloat and also decide its fate. Remittances equal 10.5% of GDP and the diaspora vote tipped the 2024 referendum to a 50.3% yes, so the pro-EU majority depends on citizens
    living abroad, while the departure of working-age Moldovans, the very thing that sends the money, shrinks the base that the 2028-30 EU timetable needs to reform.
  it: ''
- hash: 7f8af0d4
  kind: cards
  en: 'Moldova is a state whose strategy is to turn its geography into a European fact before Russia turns it into a Russian one. PAS and Sandu hold three keys at once: a parliamentary majority renewed
    on 28 September 2025 despite a funded opposition, a candidate status that became real negotiations in June 2026, and a security web (EU, Romania, Ukraine, the US in Congress) that substitutes for the
    alliance that neutrality forbids. The central Luttwakian pattern is that every victory in the East is paid for on the Transnistrian and Gagauz flanks: cutting Gazprom and Cuciurgan freed the right bank
    from blackmail but ruined the left bank it hopes to reintegrate; defending elections with courts and bans hardens the audience Moscow has always had in Comrat; and tying accession to Ukraine''s carries
    both momentum and the Hungarian veto. Two signals that are not rows: the decision to recall the ambassador from Moscow rather than expel the Russian embassy, which keeps the channel that Russia''s own
    embassy says it wants; and Sandu''s June 2026 call to put the Russian withdrawal into any Ukraine settlement, which her own foreign minister resists. Whether Moscow is an adversary is a question the
    ontology answers by structure: Russia''s declared aim in Chișinău is a compliant government, not the end of Moldova, and Moldova''s aim is a Russian departure, not Russian defeat, so the grade is rival,
    the hardest rival on the map.'
  it: ''
- hash: 1f9b408a
  kind: cards
  en: 'Carry the military takeover of October 2025 to a civilian-branded exit. Col. Michael Randrianirina, a military leader, took over after the Gen Z protests (the Guardian headline of 15 October 2025:
    ''military leader set to be sworn in as president''). His two-year roadmap, released at the end of February 2026, sets consultations to the end of 2026, a new constitution, and presidential elections
    due in late 2027. In March 2026 he dismissed the prime minister and the cabinet without giving a reason, and the Gen Z movement voiced concern about the ''militarisation'' of the regime.'
  it: ''
