  it: ''
- hash: 594991d8
  kind: cards
  en: 'Buy hard security without leaving neutrality: EU Security and Defence Partnership (first ever, 21 May 2024), EUR 317m of European Peace Facility money including a EUR 120m mid-range air-defence package
