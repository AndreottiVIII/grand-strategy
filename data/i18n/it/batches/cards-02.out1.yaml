items:
- hash: '9294a98c'
  it: |
    Restare dentro il perimetro di sicurezza euro-atlantico (NATO dal 1999, UE), con la Russia indicata come principale minaccia, ma a costo più basso: il governo Babiš mantiene il contratto per gli F-35 e l'adesione alla NATO, mentre taglia il bilancio della difesa a circa l'1.8% del PIL nel 2026 (metodo NATO) e promette il 2% solo per il 2027.
- hash: '108acbc9'
  it: |
    Sicurezza energetica attraverso il nucleare e la fine dei combustibili russi: due unità APR-1000 a Dukovany dalla KHNP sudcoreana (contratto firmato il 4 Jun 2025, CZK 407bn, costruzione prevista per il 2029), nessun petrolio russo via oleodotto dall'April 2025 dopo il potenziamento del TAL, nessun gas russo dal 2023, uscita dal carbone entro il 2033 e una quota nucleare del 68% entro il 2040.
- hash: '40194fec'
  it: |
    Proteggere l'industria esportatrice e automobilistica legata alla Germania dalle regole climatiche dell'UE: il programma di coalizione definisce il Green Deal insostenibile nella sua forma attuale, respinge il divieto dei motori a combustione dal 2035 e l'ETS2, e promette energia più economica.
- hash: 'd901ff90'
  it: |
    Tenere i contribuenti cechi fuori dal conto ucraino senza rinunciare al canale delle munizioni: in January 2026 Babiš ha mantenuto l'iniziativa a guida ceca come «coordinatore», senza fondi statali, si è sottratto alle garanzie sul prestito UE da EUR 90bn (19 Dec 2025) e vuole che la NATO se ne faccia carico in misura maggiore; in ogni caso il fornitore è l'industria degli armamenti ceca (CSG).
- hash: '26097a3f'
  it: |
    Chiudere la porta alla migrazione: respingere la ricollocazione prevista dal patto UE, applicare la «tolleranza zero» sulla migrazione irregolare e inasprire le regole sulla protezione temporanea per i rifugiati ucraini (un disegno di legge in prima lettura in June 2026, con la maggior parte delle modifiche previste per 1 Jan 2027).
- hash: 'bbd0eaa2'
  it: |
    Ricostruire il peso regionale con i «tre moschettieri» (Slovacchia, Polonia) e con un Gruppo di Visegrad rilanciato dopo la caduta di Orbán in April 2026, oltre al formato di Slavkov con l'Austria, mentre si cercano legami economici «pragmatici» con Pechino e una linea apertamente filoisraeliana (trasferimento dell'ambasciata a Gerusalemme annunciato come previsto nel 2026).
- hash: '32771562'
  it: |
    Coordinatore e intermediario più che finanziatore: Praga gestisce il canale di acquisto per l'Ucraina tramite società di comodo (oltre 4 milioni di colpi dal 2024, fino alla metà delle munizioni di grosso calibro ucraine), mentre il governo ottiene consenso interno chiamandosi fuori dalle garanzie UE (articolo 20 TUE) insieme a Slovacchia e Ungheria. Il presidente gestisce un secondo canale, separato (vertice NATO, incontro con il Dalai Lama in July 2025).
- hash: 'ed98c88b'
  it: |
    L'attribuzione pubblica delle operazioni russe, ora più debole al centro: Vrbětice (2021), l'incendio al deposito di autobus di Praga (2024), le sanzioni nazionali contro Medvedchuk e «Voice of Europe» (March 2024) e i rapporti annuali del BIS, che indicano la Russia come principale minaccia e mettono in guardia contro «agenti una tantum» diretti contro le imprese che forniscono aiuti all'Ucraina. Contropressione: il ministro degli Esteri Macinka ha sciolto l'unità del ministero dedicata alle sanzioni e all'influenza russa.
- hash: '7e729b84'
  it: |
    Equipaggiamenti e industria: 24 F-35A (CZK 150bn, consegne 2031-2035) mantenuti da Babiš in February 2026 perché la cancellazione costerebbe circa CZK 30bn; un bilancio della difesa di CZK 154.8bn nel 2026 (circa l'1.8% del PIL secondo il metodo NATO, il 2.06% secondo quello del governo); un piano da CZK 190bn per il 2027. L'industria degli armamenti (CSG) ha prodotto 2.7 milioni dei 3.7 milioni di colpi consegnati all'Ucraina attraverso il canale ceco.
- hash: '5f6fc56b'
  it: |
    Costruzione energetica guidata dallo Stato e un modello di esportazione legato alla Germania: un prestito statale stimato in EUR 23-30bn più un contratto bidirezionale per differenza di 40 anni per Dukovany (notificato il 2 Oct 2025, in esame formale da parte della Commissione); Škoda e la filiera che fa capo a Volkswagen; la Germania assorbe circa un terzo delle esportazioni. Il potenziamento dell'oleodotto TAL (EUR 61m, capacità di 8 Mt l'anno) ha sostituito Druzhba.
- hash: '8130ab70'
  it: |
    Un esecutivo diviso: il governo (ANO, SPD, Motorists; 108 seggi su 200) e il presidente non concordano sulla politica estera. Pavel ha rifiutato di nominare ministro Filip Turek dei Motorists, il governo ha superato una mozione di sfiducia in February 2026 (84 voti a favore, 101 necessari), e Pavel ha posto il veto su una legge sulle regole di bilancio; Macinka ha minacciato di impedirgli di partecipare ai vertici NATO.
- hash: '4cc8162b'
  it: |
    Dipendenza industriale dalla Germania e dalla filiera automobilistica: nel 2023 la Germania ha assorbito merci ceche per EUR 77.8bn (circa un terzo delle esportazioni) e la sola Škoda vale quasi un decimo dell'economia; un calo della domanda tedesca o un dazio statunitense sulle auto colpisce direttamente la produzione ceca.
- hash: '024e6164'
  it: |
    Il canale delle munizioni vive di denaro altrui: Praga ha bisogno di circa EUR 5bn nel 2026 e ne aveva EUR 1.4bn entro febbraio; i finanziatori sono scesi da 18 a circa nove dopo il ritorno di Babiš al governo; Germania, Danimarca e Paesi Bassi ne sostengono la maggior parte (la Germania ha aggiunto EUR 300m in June 2026).
- hash: 'd260c1df'
  it: |
    Bruxelles controlla il finanziamento nucleare: la Commissione ha avviato un'indagine approfondita sugli aiuti di Stato sul pacchetto Dukovany a due unità (prestito EUR 23-30bn, CfD di 40 anni), ritiene che il sostegno possa essere troppo generoso e prevede una decisione entro la fine del 2026; l'approvazione del 2024 riguardava una sola unità.
- hash: '137dea18'
  it: |
    Scarsa capacità di contrasto alla Russia e una minaccia ibrida che prende di mira l'industria degli armamenti ceca: il BIS afferma che il rischio di sabotaggio si concentra sulle imprese che producono o consegnano aiuti all'Ucraina; il ministero della Difesa russo e Medvedev hanno indicato aziende ceche come possibili obiettivi; l'unità del ministero dedicata alle sanzioni è stata chiusa e le norme più severe per i diplomatici russi sono state rinviate fino a quando Mosca non ha inasprito quelle contro il personale ceco nel 2026.
- hash: '6ba5282f'
  it: |
    Isolamento nell'UE se segue Bratislava: la formula usata da Politico per Cechia, Slovacchia e Ungheria dopo December 2025 è stata «status di paria»; con Orbán battuto alle elezioni di April 2026, i partner di Praga per un rilancio del V4 sono Tusk e Magyar, filoeuropei e filoucraini.
- hash: '1a4470d0'
  it: |
    Coordinare il canale delle munizioni senza pagarlo lo svuota. La linea «nessuna corona ceca» ha raccolto consensi, ma il numero dei finanziatori è sceso da 18 a circa nove, e entro febbraio erano stati raccolti solo EUR 1.4bn su EUR 5bn necessari per il 2026; ciò che dava a Praga leva con Berlino e Washington (oltre 4 milioni di colpi, metà della fornitura ucraina) è proprio ciò che il governo sta lasciando deperire.
- hash: 'f38a200b'
  it: |
    Risparmiare sulla difesa mentre si blinda l'arma più costosa della storia del Paese. Babiš ha tagliato il bilancio della difesa 2026 sotto la soglia NATO (circa l'1.8%, contro il 2.35% previsto da Fiala) e «certamente» respinge il percorso verso il 3.5%, ma i pagamenti anticipati per gli F-35 non sono rimborsabili: il denaro speso va a un sistema americano la cui prima consegna è prevista per il 2031 - si paga il prezzo della credibilità senza ottenerne la credibilità.
- hash: '81a4021a'
  it: |
    L'indipendenza energetica ha bisogno della Bruxelles che il governo attacca. Praga si è sottratta al petrolio e al gas russi e ha scelto la Corea rispetto a Francia e Stati Uniti per Dukovany, ma il prestito da EUR 23-30bn e la garanzia sul prezzo per 40 anni richiedono l'approvazione della Commissione; un governo che definisce il Green Deal «insostenibile», respinge l'ETS2 e ricorre agli opt-out chiede alla stessa Commissione un prestito statale fino a EUR 30bn.
- hash: 'd9a6c573'
  it: |
    L'opt-out sull'Ucraina porta un successo interno e fa perdere spazio di manovra. Schierarsi con Fico e Orbán sul prestito da EUR 90bn ha reso Cechia, nella formula di Politico, quasi un paria proprio mentre Orbán cadeva in April 2026; il rilancio del V4 che Babiš vuole dipende ora da Tusk e Magyar, le cui condizioni sono l'opposto dell'opt-out.
- hash: '19b439c3'
  it: |
    Una linea «pragmatica» verso la Cina che costa i rapporti con Taiwan e rende poco. Il governo ha negato un aereo di Stato per il viaggio a Taiwan del presidente del Senato Vystrčil (April 2026) e Okamura è andato in Cina (July 2026), eppure Pechino aveva già interrotto i contatti con Pavel, la strategia di sicurezza del 2023 considera ancora la Cina un problema di sicurezza, il BIS segnala più attività di intelligence cinese, e i vantaggi visibili sono turisti, voli e un regime senza visto.
- hash: 'bd8b5d43'
  it: |
    Ridurre l'apparato antirusso mentre la Russia prende di mira le aziende che producono armi ceche. L'unità del ministero dedicata alle sanzioni e all'influenza russa è stata sciolta, le norme sui diplomatici russi sono ferme, e lo stesso governo coordina un programma che il BIS indica come principale obiettivo di sabotaggio; le misure di reciprocità annunciate il 3 Sep 2026 sono arrivate solo dopo che Mosca ha reso più difficile la vita ai diplomatici cechi.
- hash: '84dd0100'
  it: |
    La Cechia nel 2026 conduce due politiche estere da un solo Stato. Il governo di Andrej Babiš (ANO con SPD e Motorists, in carica dal December 2025) vuole una Repubblica Ceca più economica, più interna e più bilaterale: nessun denaro ceco per l'Ucraina, nessuna ricollocazione prevista dal patto migratorio, nessun Green Deal, un'apertura cauta verso Pechino e una più calorosa verso Gerusalemme. Il presidente Petr Pavel, i servizi di intelligence e la maggior parte dell'industria degli armamenti mantengono la linea precedente: la Russia come minaccia, la NATO e Berlino come cornice, la guerra in Ucraina come guerra propria della Cechia. Lo schema di Luttwak è la stretta tra questi due poli: ogni risparmio fatto per l'elettore (il canale delle munizioni lasciato senza fondi, la difesa all'1.8%, l'opt-out dal prestito UE) erode una leva che Praga ha bisogno altrove - peso a Berlino e a Washington, credibilità nella NATO, buona volontà a Bruxelles di cui il prestito per Dukovany avrà bisogno prima della fine del 2026. Ciò che non è cambiato è la struttura: il petrolio e il gas russi sono fuori, la costruzione del nucleare coreano è in corso, la Germania assorbe ancora un terzo delle esportazioni, e ogni atto ostile di Mosca (gli avvertimenti del BIS, le misure di reciprocità del September 2026) spinge il governo a tornare verso la linea che ha combattuto. Due segnali che non sono righe della scheda: Babiš ha dichiarato in March 2026 di non avere in programma una visita alla Casa Bianca e che l'UE è «sempre la più importante»; e il suggerimento di Pavel, in June 2026, che la Cechia abbandoni la corona per l'euro se questo la trattiene, suggerimento che il governo, che ha soppresso il rapporto annuale sulla prontezza all'euro, non seguirà.
- hash: '7b5b1418'
  it: |
    Ricostruire una Bundeswehr capace di dissuadere la Russia e difendere il fianco orientale della NATO: la riforma costituzionale di March 2025 ha escluso dal freno al debito la spesa per la difesa oltre l'1% del PIL, il progetto di bilancio 2027 porta il bilancio ordinario della difesa a EUR 109.7bn (più EUR 30bn dal fondo speciale), e Berlino punta a raggiungere l'obiettivo centrale NATO del 3.5% nel 2029, sei anni prima. La 45th Panzer Brigade è il progetto di punta (circa 4.800 soldati in Lituania entro la fine del 2027).
- hash: '0c0062b5'
  it: |
    Tenere gli Stati Uniti impegnati in Europa rendendo la NATO «più europea», la formula del cancelliere al vertice di Ankara (7-8 Jul 2026): condivisione nucleare tramite l'F-35, una richiesta di sistemi di fuoco a lungo raggio Typhon/Tomahawk e un gruppo franco-tedesco di indirizzo nucleare che deve integrare, non sostituire, la deterrenza NATO.
- hash: '0706779d'
  it: |
    Fare in modo che l'Ucraina non perda e la Russia non vinca, senza diventare belligerante: primo donatore militare europeo secondo il Kiel tracker, EUR 11.6bn per l'Ucraina nel progetto di bilancio 2027, una linea che pone il cessate il fuoco prima di tutto sulle garanzie, truppe tedesche solo in uno Stato NATO confinante dopo un cessate il fuoco, nessuna fornitura di Taurus.
- hash: '19d844e8'
  it: |
    Ripristinare la base economica: recessione industriale, energia cara, un fondo per le infrastrutture da EUR 500bn in dodici anni, un prezzo dell'energia per l'industria sovvenzionato (fino a EUR 3.8bn entro il 2028), l'uscita dal gas russo e la riduzione dei rischi con la Cina senza perdere il mercato cinese.
- hash: 'be07a001'
  it: |
    Mantenere in moto il motore dell'UE e aperta la porta dell'allargamento: il tandem franco-tedesco (FCAS, cooperazione nucleare), il prestito da EUR 90bn per l'Ucraina, il sostegno all'adesione del Montenegro entro il 2028 e al Processo di Berlino, un ripristino dei rapporti con un'Ungheria post-Orban.
- hash: 'cd90702f'
  it: |
    Tenere il centro politico contro l'AfD governando con una maggioranza risicata: controlli alle frontiere e calo delle domande d'asilo (113,236 prime domande nel 2025 contro 229,751 nel 2024), una riforma delle pensioni e del welfare che la SPD vuole ammorbidire, e un'AfD che il 6 Sep 2026 ha vinto in Sassonia-Anhalt con il 43.8%.
- hash: 'b14e5653'
  it: |
    Berlino come cerniera dei formati ad hoc europei: la coalizione dei volenterosi per le garanzie all'Ucraina (Parigi, Jan 2026), l'E5, il Consiglio dei ministri franco-tedesco, il Processo di Berlino (il Montenegro presiede nel 2026), i testi bilaterali sulla difesa con la Polonia (17 Jun 2026) e la Lituania, e la rapida ricomposizione dei rapporti con Budapest (Magyar a Berlino, Jun 2026).
- hash: 'a8f54407'
  it: |
    Staatsraeson come strumento e come vincolo: retorica incondizionata su Israele, poi una sospensione parziale delle forniture di armi (Aug-Nov 2025), critiche alle misure di annessione in Cisgiordania (Feb 2026) e una porta aperta a Netanyahu nonostante il mandato di arresto della CPI.
- hash: '17844dcf'
  it: |
    Acquisti e presenza avanzata: 35 F-35A ordinati (la Luftwaffe ne vuole altri 15) per il ruolo di condivisione nucleare, 44 Leopard 2A8 per la Croazia, l'approvazione dell'export di Eurofighter per la Turchia, genieri della Bundeswehr sull'East Shield polacco dal 22 Jun 2026, fino a 50 militari nell'EUFOR Althea e un ampio contingente KFOR, e una richiesta d'acquisto di Typhon/Tomahawk (stima di circa EUR 3.4bn).
- hash: '55ead3f2'
  it: |
    Legge sul personale: la legge di modernizzazione del servizio militare (prima su base volontaria; un questionario per ogni diciottenne dal 2026, visita medica obbligatoria per gli uomini nati dal 2008 in poi dal 1 Jul 2027, un meccanismo di coscrizione legato alle necessità che il Bundestag potrebbe attivare) e, da September 2026, assegnazioni obbligatorie alla brigata in Lituania.
- hash: '4bc1651f'
  it: |
    Il bilancio come arma: esclusione dal freno al debito, fondo per le infrastrutture da EUR 500bn, la quota maggiore dei finanziamenti UE per l'Ucraina, EUR 1.2bn+ per l'iniziativa ceca sulle munizioni, EUR 660m+ di cooperazione con il Kosovo dal 1999, e l'uscita graduale dal gas russo concordata a Bruxelles (divieto del GNL dalla fine del 2026, gas via gasdotto dall'autunno 2027).
- hash: '784fedee'
  it: |
    Inquadramento della minaccia per orientare l'opinione pubblica: la finestra del 2029 (forse prima) indicata da Pistorius per un attacco russo alla NATO, la linea del «maggiore sforzo che abbiamo mai fatto» sulla difesa, e una risposta alla minaccia ibrida contro il sabotaggio (165+ episodi sospetti nel 2026 secondo un conteggio del BKA riportato dalla SZ).
- hash: '474c0e8c'
  it: |
    Politica: una coalizione con una maggioranza di circa dodici seggi, una SPD che vuole ammorbidire il pacchetto su pensioni e welfare dopo il successo dell'AfD, un cancelliere con consensi bassi e un'AfD che nei sondaggi è davanti alla CDU e ha ottenuto il 43.8% in Sassonia-Anhalt.
- hash: '9fec1132'
  it: |
    Uomini, non denaro: la Bundeswehr non riesce a coprire i suoi posti. Circa 2,000 dei 4,800 posti della brigata in Lituania non avevano personale confermato nel 2026, i volontari hanno coperto solo una parte del fabbisogno e Pistorius ha approvato le assegnazioni obbligatorie in September 2026; la coscrizione resta un meccanismo di attivazione, non una decisione.
- hash: '0d44c2b6'
  it: |
    Dipendenza da Washington per ciò che l'Europa non può ancora sostituire: l'ombrello nucleare e la condivisione delle B61, F-35, Patriot, sistemi di fuoco a lungo raggio. Gli Stati Uniti hanno annunciato il 1 May 2026 il ritiro di circa 5,000 dei loro 36,436 militari in Germania nell'arco di sei-dodici mesi, e Trump ha detto che il taglio sarebbe andato «molto oltre».
- hash: '443b4818'
  it: |
    Un modello esportativo stretto da entrambi i lati: le esportazioni verso gli Stati Uniti sono calate di circa il 9.3% nel 2025 con l'accordo tariffario UE-USA al 15%, la Cina è tornata il principale partner commerciale con un deficit di circa EUR 90bn, e i controlli cinesi sulle terre rare hanno esposto la catena di fornitura.
- hash: '1c032c61'
  it: |
    Energia: il gas russo è sparito, l'uscita dal nucleare è «irreversibile» nelle parole di Merz (January 2026: «un errore strategico»), l'industria paga l'energia molto più dei concorrenti statunitensi, e la crisi di Hormuz del 2026 ha spinto al rialzo i prezzi del GNL e portato gli stoccaggi al 42.9% a inizio luglio; la Germania importa dagli Stati Uniti la maggior parte del suo GNL.
- hash: '2ba0178d'
  it: |
    Storia e diritto: la richiesta di riparazioni della Polonia (per Berlino: chiusa), il processo ad Amburgo per Nord Stream contro un sospettato ucraino a partire da October 2026, mentre la Polonia ha rifiutato l'estradizione di un secondo sospettato; un'ampia maggioranza dell'opinione pubblica chiede controlli più stretti sull'export di armi verso Israele, e i tribunali hanno iniziato ad annullare i controlli alle frontiere.
- hash: '66400070'
  it: |
    La Dominica è un piccolo Stato la cui politica estera è un insieme di accordi separati più che un allineamento: Pechino ha comprato il riconoscimento nel 2004 con aiuti, Washington e Londra mantengono i legami più antichi attraverso canali di assistenza e trattati, e gli organismi caraibici (CARICOM e OECS) sono la sede in cui parla come uno dei tanti. Il suo peso strategico è basso, quindi le sue mosse sono scelte per ciò che portano, e la scheda può dire poco dell'economia (cittadinanza per investimento, progetto geotermico) o del vincolo degli uragani finché queste voci non saranno documentate. Le lacune sono il punto di questa prima passata: la postura statunitense del 2025 e il debito verso la Cina non sono ancora letti in una fonte che possa sostenerli.
- hash: '9e8b0085'
  it: |
    Il modello di esportazione verde è in difficoltà: la gara del 2024 per l'eolico offshore (almeno 6 GW) non ha ricevuto offerte, il governo ha cancellato i turni restanti all'inizio del 2025 e ha ridotto l'obiettivo offshore 2030 da 9 GW a 2-3 GW, e l'isola energetica di Bornholm è in ritardo; il collegamento con la Germania sul Fehmarn Belt non si aprirà prima del 2031.
- hash: '7540de78'
  it: |
    Le concessioni che chiudono la crisi sono quelle che la alimentano. Ogni prova di lealtà (l'accordo sulle basi del 2023, gli F-35, altre due Defence Areas statunitensi a Narsarsuaq e Mestersvig nell'accordo del 2026) allarga la presenza americana che Trump definisce «controllo permanente»; la Danimarca scambia l'accesso militare con una sovranità solo sulla carta e potrebbe finire con una sovranità che è un titolo senza le chiavi.
- hash: 'fed9407c'
  it: |
    Cautelarsi nei confronti dell'America è ciò che Washington legge come slealtà. Acquistare SAMP/T al posto dei Patriot e mettere in comune la deterrenza nucleare con la Francia rendono la Danimarca meno dipendente dagli Stati Uniti, ma arrivano mentre la Danimarca compra ancora altri 16 F-35 americani e ha bisogno degli USA per l'Artico; i media danesi hanno sostenuto che la scelta dei Patriot riguardava prezzo e tempi di consegna, mentre Politico l'ha letta come una risposta alla Groenlandia.
- hash: '229c56e1'
  it: |
    La voce della Groenlandia, che la Danimarca pretende, è anche la via d'uscita della Groenlandia dalla Danimarca. La carta più forte di Copenaghen contro Washington è che «decidono solo i groenlandesi e i danesi»; ma più mette Nuuk al tavolo dei negoziati (il gruppo di lavoro di January 2026, la presidenza del Consiglio artico affidata a un groenlandese per il Regno, Nielsen che definisce l'accordo del 2026 un «win-win-win»), più la Groenlandia agisce come uno Stato, e Naleraq chiede già un dialogo con Washington senza la Danimarca.
- hash: '0b7c933c'
  it: |
    La Danimarca invoca il diritto internazionale contro Trump mentre ne spinge l'allentamento in patria. Il programma di governo promette di «difendere con fermezza» sovranità, integrità territoriale e convenzioni internazionali, eppure Frederiksen ha co-promosso la lettera di May 2025 con cui si chiedeva al Consiglio d'Europa di riesaminare come viene letta la Convenzione europea dei diritti dell'uomo in materia di espulsioni; l'ordine basato sulle regole è lo scudo sulla Groenlandia e l'ostacolo sulla migrazione.
- hash: '45477374'
  it: |
    Dare tutto all'Ucraina assottiglia l'Artico e il Baltico. La Danimarca ha donato l'intera flotta di F-16 e la propria artiglieria e finanzia fabbriche ucraine, proprio mentre i suoi stessi servizi di intelligence dicono che la Russia potrebbe mettere alla prova i vicini della NATO e la Groenlandia ha bisogno di navi, radar e aerei; il modello danese è la risposta (il denaro compra produzione in Ucraina, non scorte danesi), ma il bilancio è uno solo.
- hash: 'f7e7b26c'
  it: |
    La Danimarca è un piccolo Stato la cui grande strategia, da January 2025, si è ridotta a una domanda: come restare nel sistema di sicurezza americano mentre un presidente americano rivendica una parte del suo territorio. La risposta danese ha tre livelli. Mantenere immobile la posizione formale (sovranità sulla Groenlandia e sulle Fær Øer, autodeterminazione per i groenlandesi), pagare il prezzo in beni utilizzabili (basi, F-35, un potenziamento artico da decine di miliardi di corone) e spostare la disputa nella NATO e in Europa, dove Rutte e i leader europei possono assorbirla. L'accordo trilaterale del 22 September 2026 mostra il metodo in funzione e il suo costo: la crisi è più calma, la bandiera del Regno sventola ancora, e le due parti pubblicano letture opposte dello stesso testo. Dietro il dossier Groenlandia c'è il secondo pilastro, che è la Russia: un Paese che controlla l'unica uscita del Baltico, subisce i colpi ibridi (droni sugli aeroporti, razzi illuminanti contro un elicottero, cavi) ed è al tempo stesso uno dei principali donatori europei per l'Ucraina (il Kiel tracker lo indica, con i Paesi Bassi, subito dietro la Germania per May-June 2026) e un costruttore di una base europea minima all'interno della NATO. La debolezza è interna e strutturale: una coalizione di minoranza, una Groenlandia che non è più una colonia di cui parlare al posto suo, e un'economia esportatrice che vive dei mercati americano e tedesco. I giudizi su questa scheda seguono la struttura: gli Stati Uniti sono un alleato riluttante (un alleato per trattato con una ferita aperta, non un rivale), la Russia un rivale (non un avversario, perché la Danimarca cerca la moderazione di Mosca più che la sua caduta), la Cina un partner riluttante.
- hash: '8b60d342'
  it: |
    Presidiare il confine haitiano con muri, truppe e regole più severe. In April 2025 Abinader ha annunciato quindici misure: accelerare la costruzione del muro di confine, 1,500 soldati per la sorveglianza delle frontiere e pene più dure per chi aiuta i migranti a entrare o a restare.
- hash: 'e6f5e884'
  it: |
    Tenere Washington coinvolta su sicurezza, migrazione e commercio. Abinader ha ringraziato gli Stati Uniti per l'aiuto contro il traffico di droga, la criminalità organizzata e la migrazione irregolare; la visita di Rubio del 6 February 2025 ha toccato questi temi, il commercio e le opportunità economiche nelle terre rare e nei semiconduttori.
- hash: '39fd2a04'
  it: |
    Mantenere in funzione la missione multinazionale ad Haiti insieme ad altri. Il ministro degli Esteri dominicano ha detto che le truppe ciadiane sostituiranno gradualmente quelle keniote fino a ottobre; i colloqui con Rubio hanno messo in agenda la prosecuzione della missione.
- hash: 'ea4c89e7'
  it: |
    Forza di confine e muro: un rafforzamento di 1,500 soldati per la sorveglianza e un muro in costruzione, annunciati in April 2025.
- hash: '47788951'
  it: |
    Il canale di sicurezza con Washington: la visita di Rubio del February 2025 ha fatto della cooperazione su droga, criminalità e migrazione l'agenda di lavoro.
- hash: '618c757b'
  it: |
    La crisi del vicino detta l'agenda. Nell'incontro di February 2025 il ministro degli Esteri ha informato Rubio sulla crisi di Haiti e sul suo impatto sulla Repubblica Dominicana prima dei colloqui con il presidente.
