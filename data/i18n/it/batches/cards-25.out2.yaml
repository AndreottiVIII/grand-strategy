items:
- hash: bbb30c1d
  it: |
    Corteggiare capitali da ogni direzione: il Golfo (progetti legati all'Arabia Saudita, 56 progetti congiunti per USD 27.2bn secondo Tashkent; un portafoglio degli UAE di circa 100 progetti oltre USD 20bn), la Corea (oltre 700 imprese, USD 8bn+ cumulati), il Giappone (ODA e prestiti oltre USD 3.7bn), gli US (Boeing, un Joint Investment Framework sui minerali critici del febbraio 2026) e l'EU (Global Gateway).
- hash: 165f0e4c
  it: |
    Una storia di riforme di marca «New Uzbekistan», diffusa dal servizio stampa della presidenza e dalle agenzie d'informazione statali, rivolta agli investitori e al pubblico occidentale; la costituzione del 2023 si presenta come «social state» con habeas corpus e un divieto costituzionale della pena capitale, mentre il sistema politico resta presidenziale.
- hash: c054e004
  it: |
    Doppiamente senza sbocco sul mare: ogni esportazione attraversa almeno due confini, e il suo portafoglio di corridoi (Russia, Cina, Afghanistan-Pakistan, Iran, Caucaso) esiste perché nessuno di essi basta da solo. Carnegie legge l'elenco dei partner come la risposta alla geografia.
- hash: 4ecb99b6
  it: |
    A valle di un fiume che non controlla: il canale Qosh Tepa dovrebbe deviare una stima del 20-30% dell'Amu Darya una volta completato (2028), non esiste un trattato sulle acque e, poiché nessuno stato dell'Asia centrale riconosce i Talebani, un accordo giuridico sull'uso delle acque non è attualmente possibile. Il ministro delle acque di Tashkent ha dichiarato che non farà la guerra per questo.
- hash: fcb21c6d
  it: |
    Lo scambio lavoro-rimesse con la Russia: USD 18.9bn di rimesse nel 2025 (circa il 78% dalla Russia; il 72.4% nel primo trimestre 2026), il 14.4% del GDP nel 2024, 1.34 million di uzbeki che lavorano in Russia con brevetti nel primo trimestre 2026, e il registro russo del 2025 di «controlled persons», le espulsioni senza controllo giudiziario e i divieti d'ingresso pluriennali, oltre al reclutamento di cittadini uzbeki per la guerra.
- hash: 7aaef99d
  it: |
    Una base energetica in contrazione: la produzione nazionale di gas è scesa del 15% su base annua nel gen-mar 2026 (9.6 bcm contro 11.3 bcm), il paese è importatore netto dal 2023, la rotta di Gazprom attraverso il Kazakistan ha raggiunto la sua massima capacità tecnica nel quarto trimestre 2025, e la Russia fornisce più di un quarto della sua benzina proprio mentre le raffinerie russe subiscono guasti.
- hash: 7f759784
  it: |
    Il peso della Cina: ha superato la Russia come primo partner commerciale nel 2023 e nel primo trimestre 2026 l'Uzbekistan ha importato dalla Cina circa USD 4.0bn a fronte di esportazioni per USD 0.64bn; la ferrovia è costruita da China Railways, il finanziamento è condiviso con creditori internazionali, e Pechino e Tashkent puntano a USD 30bn di scambi.
- hash: 4a99620d
  it: |
    Limiti politici all'abbraccio occidentale: una presidenza azzerata da un plebiscito limita quanto i partner occidentali possano avvicinarla, l'emendamento Jackson-Vanik limita ancora gli scambi con gli US (disegni di legge S.3103 e H.R.5917 pendenti, con il sostegno dell'amministrazione), e l'adesione alla WTO è scivolata oltre l'obiettivo di marzo 2026, mentre lo status di partner dei BRICS aggiunge attrito con Washington.
- hash: 18ef54d3
  it: |
    Diversifica l'approvvigionamento energetico affidandosi al suo fornitore principale. Per sostituire il gas nazionale in calo importa gas russo (6.48 bcm nel 2025, su una rotta al massimo tecnico) e costruisce la sua prima centrale nucleare con Rosatom (due unità VVER-1000 e due RITM-200N nel sito di Jizzakh, primo getto di calcestruzzo a marzo 2026): così la mossa che cura la scarsità di energia approfondisce la dipendenza dal partner la cui presa stava allentando.
- hash: 23c0889e
  it: |
    La ferrovia che la libera dalla Russia la incatena alla Cina. La linea Cina-Kirghizistan-Uzbekistan evita il percorso attraverso il territorio russo e fa di Tashkent un hub, ma è costruita da un appaltatore cinese, si inserisce in uno schema commerciale in cui l'Uzbekistan acquista USD 4.0bn e vende USD 0.64bn in un trimestre, e consegna a Pechino il corridoio che Mosca un tempo controllava. Diversificare rispetto a un patrono significa anche dipendere dal successivo.
- hash: 3c756f46
  it: |
    Coinvolgere i Talebani per fare dell'Afghanistan un corridoio rafforza il vicino a monte che sta prosciugando il suo fiume. Termez e la linea Hairatan trasportano USD 1.7bn di scambi, e la ferrovia verso il Pakistan; eppure più Tashkent tratta Kabul come un partner normale senza riconoscimento formale, meno è giuridicamente possibile un trattato vincolante sull'acqua, e più Kabul può completare Qosh Tepa secondo i propri tempi.
- hash: edefd10e
  it: |
    Le rimesse finanziano l'apertura e consegnano a Mosca la leva. I trasferimenti dei migranti sono triplicati fino a USD 18.9bn in cinque anni e pagano le importazioni che rendono sostenibile il disavanzo commerciale con la Cina, ma il 72-78% di essi proviene dalla Russia, che dal 2025 ha reso più difficile la condizione dei lavoratori uzbeki (registro, espulsioni senza controllo giudiziario, divieti d'ingresso). Tashkent può protestare («absolutely incompatible with friendly relations», giugno 2025), ma non può reagire senza danneggiare le proprie famiglie.
- hash: 97ce267b
  it: |
    L'oro lo rende ricco e a corto di dollari. Il prezzo dell'oro ha spinto le riserve a un record di USD 77.1bn nel marzo 2026, ma la banca centrale ha tenuto il metallo in patria: nessuna esportazione d'oro ad agosto, l'oro solo il 12.3% delle esportazioni nel gen-ago 2026 (35.2% un anno prima), e le esportazioni totali nel gen-mag 2026 in calo del 15.5%; la sicurezza di una riserva costa il flusso in valuta pregiata che pagava le importazioni.
- hash: 946ab4e1
  it: |
    Partner di tutti, rivendicazione di tutti. Ogni patrono annuncia più di quanto Tashkent confermi (i USD 35bn in tre anni e USD 100bn in un decennio annunciati da Trump dopo il 6 nov 2025, senza conferma uzbeka dei totali), e le adesioni che piacciono a uno (partner dei BRICS, SCO, osservatore nell'EAEU) sono segnalate dagli analisti come un freno a quelle che piacciono a un altro (l'adesione alla WTO ha mancato l'obiettivo di marzo 2026, Jackson-Vanik non abrogato). L'equidistanza funziona solo finché nessuna capitale impone una gerarchia.
- hash: 13cc789d
  it: |
    L'Uzbekistan è l'unico stato della regione la cui strategia è una strategia di posizione: doppiamente senza sbocco sul mare, il più popoloso dell'Asia centrale e il più giovane tra le grandi popolazioni (un'età mediana intorno ai 27 anni), ha trasformato la sua geografia da prigione in pedaggio. La logica di Luttwak corre in direzione opposta rispetto a quella delle grandi potenze: i deboli non vincono con la forza ma essendo il punto di attraversamento di cui hanno bisogno più attori forti, nessuno dei quali può prenderlo. Dal 2016 Mirziyoyev ha scambiato l'isolamento dell'era Karimov con un portafoglio di partner (questa è la definizione di Carnegie): ferrovia verso la Cina, ferrovia verso il Pakistan attraverso l'Afghanistan, Rosatom e Gazprom per l'energia, il denaro del Golfo per il solare, Washington e Bruxelles per i minerali e la legittimità, Seul e Tokyo per le fabbriche, Delhi per la rotta dell'Oceano Indiano, e un Treaty on Allied Relations con ciascun vicino turcico che non è un'alleanza in senso militare. La costituzione del 2023 è il perno interno: l'apertura all'estero è il mezzo con cui una presidenza azzerata mantiene la propria stabilità. I paradossi hanno tutti la stessa forma: ogni uscita da una dipendenza è un ingresso in un'altra (potenza russa per il gas russo, ferrovia cinese per merci cinesi, il corridoio talebano per il canale dei talebani, le rimesse per la leva russa). La riserva d'oro è l'unico cuscinetto che appartiene solo a Tashkent, e la decisione della banca centrale di tenerla in patria dice come legga il rischio. Due segnali da seguire che non sono righe: il 17% della ferrovia cinese costruito entro agosto 2026 (la prima prova reale che il pedaggio funzioni) e il vertice di Ankara degli stati turcici del 29-30 ott, dopo il viaggio di Mirziyoyev ad Ashgabat per il vertice della CIS (7-9 ott, esiti non confermati).
- hash: 4ece0794
  it: |
    Mantenere la rete diplomatica della Santa Sede e il suo status di soggetto sovrano: relazioni con 184 stati, un accordo del 2015 con lo Stato di Palestina, e la sovranità sull'enclave secondo il Trattato del Laterano del 1929.
- hash: 1631d82f
  it: |
    Mantenere la Chiesa presente e libera dove è limitata: l'accordo provvisorio del 2018 con la Cina sui vescovi (rinnovato il 22 ott 2024 per quattro anni), l'espulsione del nunzio e la chiusura dell'ambasciata in Nicaragua, e le comunità cristiane del Libano.
- hash: 103efbf6
  it: |
    Cessate il fuoco e un posto al tavolo delle guerre in Ucraina e a Gaza, attraverso appelli papali, inviati e offerte di ospitare colloqui tra Russia e Ucraina, senza alcun potere di imporli.
- hash: a9e3d6ff
  it: |
    Diplomazia attraverso le nunziature e la Segreteria di Stato sotto il cardinale Pietro Parolin: 184 stati con relazioni, e l'accreditamento della Santa Sede presso il sistema UN.
- hash: be462f82
  it: |
    Autorità morale del papa: il primo viaggio di Leo XIV in Turchia (27-30 nov 2025, anniversario di Nicea con il Patriarch Bartholomew) e in Libano (30 nov-2 dic 2025); un tour in Africa annunciato per aprile 2026; appelli pubblici su Gaza, Ucraina e migrazione negli US.
- hash: a9a3150e
  it: |
    Canali discreti e inviati: la missione del cardinale Matteo Zuppi sui bambini ucraini, e i colloqui legati al Vaticano che hanno preceduto la liberazione di 51 detenuti a Cuba (marzo 2026).
- hash: 8dd20ed0
  it: |
    Reti ecclesiali e donazioni: Peter's Pence ha raccolto entrate per EUR 57.6 million nel 2025 e finanzia una quota del bilancio papale; la Chiesa in senso più ampio (diocesi, Caritas) porta avanti il lavoro umanitario.
- hash: 596c0999
  it: |
    Nessun esercito e nessuna alleanza: la sicurezza dell'enclave poggia sulla cooperazione italiana e sulla Swiss Guard, 135 uomini reclutati in Svizzera, riportata a pieno organico nel 2024 con 34 nuove reclute.
- hash: a31568a8
  it: |
    Disavanzo strutturale di bilancio di circa EUR 50-60 million l'anno (AP, giugno 2025), coperto in parte da Peter's Pence, che nel 2025 ha speso EUR 59.8 million a fronte di EUR 57.6 million di entrate.
- hash: c01610e9
  it: |
    Non può far rispettare i propri accordi: il testo dell'intesa con la Cina non è pubblicato, e Pechino ha nominato vescovi senza l'accordo di Roma (Shanghai, la diocesi del Jiangxi), cosa che la Santa Sede ha riconosciuto.
- hash: bec50167
  it: |
    Il suo partner più forte si sta raffreddando: Leo XIV ha appoggiato i vescovi statunitensi contro la stretta migratoria di Trump nel novembre 2025, e Vance ha definito preoccupanti le posizioni del Vaticano sull'immigrazione.
- hash: e47e84e8
  it: |
    L'accordo con la Cina assicura una presenza ai cattolici cinesi al prezzo di accettare vescovi che Pechino nomina da sola; ogni rinnovo (2018, 2020, 2022, 2024) mantiene aperto il canale, mentre la prassi si allontana dal testo.
- hash: 0e699607
  it: |
    Difendere i migranti e allo stesso tempo il diritto di ogni stato a controllare le proprie frontiere: sostenere i vescovi statunitensi tutela la voce della Chiesa in America, ma alimenta la linea Vance-Trump secondo cui il Vaticano sbaglia sull'immigrazione.
- hash: 89363c59
  it: |
    La Santa Sede non ha esercito e nessun alleato militare, quindi la sua grand strategy è diplomatica e morale: tenere 184 stati in dialogo con sé, mantenere viva la Chiesa dove è limitata, e far contare la voce del papa nelle guerre che non può fermare. Sotto Leo XIV, eletto l'8 maggio 2025 come primo papa nato negli Stati Uniti, la linea prosegue quella di Francesco ma è più netta su migrazione e Gaza, e accetta relazioni più fredde con Washington come prezzo. I punti deboli sono il denaro (un disavanzo strutturale coperto dal Peter's Pence) e la Cina, dove l'accordo del 2018 è il dossier principale e il caso più chiaro di un canale tenuto aperto al costo del suo testo. Il riconoscimento è la moneta che scambia: Taiwan (uno dei pochi stati con relazioni con la Repubblica di Cina), la Palestina dal 2015, e il viaggio in Libano e Turchia della fine del 2025 come modo per parlare ai cristiani del Medio Oriente. Non-eventi da seguire: nel 2026 non era previsto alcun viaggio negli US, e l'offerta di colloqui sull'Ucraina in Città del Vaticano non è stata accettata da Mosca.
- hash: adfb590c
  it: |
    Mantenere il riconoscimento della Repubblica di Cina (Taiwan), che l'indice di riconoscimento di Wikipedia registra come relazioni diplomatiche piene senza data. Se il governo insediatosi dopo le elezioni di novembre 2025 lo manterrà, non è documentato in questa sede.
- hash: a5fb917a
  it: |
    Restare dentro il Commonwealth, l'OAS e l'UN, i forum in cui il voto di un piccolo stato vale quanto quello di qualsiasi altro. È la nostra lettura del perché queste appartenenze contano; le appartenenze stesse sono documentate nei mezzi.
- hash: eb4466a6
  it: |
    Seggi multilaterali: membro delle United Nations, dell'Organization of American States e del Commonwealth of Nations, con le date di adesione nei dataset. Wikipedia aggiunge stretti legami con il Regno Unito e la cooperazione con l'OECS e il CARICOM, senza data (livello 4).
- hash: 37c7c9c5
  it: |
    Transito di stupefacenti. La pagina sulle relazioni estere di Wikipedia afferma che il paese è un punto di transito per stupefacenti sudamericani illeciti diretti verso gli US e l'Europa. Livello 4: un indizio, non ancora verificato con una fonte governativa o ONU.
- hash: 4943bd35
  it: |
    La rotta della droga che rende rilevante il legame con gli US è anche ciò che espone un piccolo stato alle pressioni del partner di cui ha bisogno per il contrasto al narcotraffico. È la nostra lettura, basata solo sull'indizio di Wikipedia.
- hash: b4940a8b
  it: |
    Saint Vincent e Grenadine è un piccolo stato caraibico il cui peso si basa sui suoi seggi nell'UN, nell'OAS e nel Commonwealth e sul riconoscimento di Taipei, che i dataset registrano senza data. Le fonti raccolte il 16 ottobre 2026 non coprono il governo insediatosi dopo le elezioni di novembre 2025, i legami dell'era Gonsalves con Venezuela e Cuba, la Cina, né i vincoli legati a uragani e vulcani; per questo la scheda è una prima bozza sottile e ogni voto è la nostra lettura. La fase successiva richiede una pagina di agenzia sulla politica estera post-elettorale, che lo strumento di ricerca non ha raggiunto.
- hash: 578dcea5
  it: |
    Mantenere in piedi il governo di Delcy Rodriguez senza un secondo attacco e senza una data elettorale che non controlla. Gli US hanno catturato Maduro nel raid di Caracas del 3 gennaio 2026, poi hanno scelto di lavorare con il suo governo (giurata come presidente ad interim il 5 gennaio) e hanno annullato una seconda ondata di attacchi per «cooperation» il 9 gennaio. All'UN il 24 settembre 2026 ha promesso elezioni senza indicarne la data.
- hash: d15c3f59
  it: |
    Trasformare le licenze petrolifere in entrate e tenere i proventi a portata di Caracas. PDVSA vende con le licenze generali degli US (GL 46 del 29 gen 2026, GL 46B del 13 mar, GL 52 del 18 mar), e il governo ha bisogno del denaro: il Financial Times riferisce di circa USD 13bn di proventi petroliferi venezuelani incassati dagli US, e di un debito fino a circa USD 240bn che Caracas vuole ristrutturare prima della fine del 2026, una scadenza che pochi si aspettano di rispettare.
- hash: 5165eefe
  it: |
    Tenere l'Essequibo, i due terzi del territorio della Guyana che il Venezuela rivendica dal lodo arbitrale del 1899, che respinge. La rivendicazione viene portata davanti a una corte che Caracas dice di non riconoscere: la ICJ si è dichiarata competente e ha emesso misure provvisorie contro le elezioni nella regione (maggio 2025), mentre il Venezuela sostiene ancora che l'Accordo di Ginevra del 1966 richieda colloqui diretti. La sentenza è attesa tra novembre 2026 e gennaio 2027.
- hash: c2113751
  it: |
    Petrolio sotto licenza. Il petrolio venezuelano è venduto tramite PDVSA con licenze generali degli US che il Treasury può revocare in qualsiasi momento; i pagamenti al governo confluiscono in conti Foreign Government Deposit Funds o in altri conti designati dal Treasury. Le licenze, non i barili, sono lo strumento, e i barili sono il prezzo della sopravvivenza del governo.
- hash: 800d8964
  it: |
    Vicini e riconoscimento. Petro è venuto a Caracas il 24 aprile 2026, primo incontro di persona con Rodriguez, per parlare di confine (Catatumbo), intelligence e gas. Il Brasile ha riconosciuto Rodriguez come capo di stato il 4 gennaio 2026 e Lula l'ha chiamata nello stesso mese. Sono le due capitali che danno al governo un seggio fuori da quello di Washington, e l'ambasciata brasiliana ha partecipato alla sua investitura.
- hash: c030f0e9
  it: |
    La propria coercizione e la scorta straniera fallita. Il raid ha superato le difese di Caracas, e le difese aeree russe dello stato di Maduro hanno fallito durante l'operazione, mentre 32 agenti di sicurezza cubani vi hanno perso la vita. Ciò che resta nelle mani venezuelane sono le forze di sicurezza del governo superstite, che mantengono l'ordine interno da cui dipendono le licenze (nostra lettura: le fonti non descrivono in dettaglio la lealtà delle forze).
- hash: 4d8a200f
  it: |
    Tutela. Il Segretario di Stato «effectively controls Venezuela's finances, the distribution of its natural resources and its government» (New York Times, luglio 2026). Qualsiasi licenza può essere revocata da OFAC, quindi il governo non ha alcuna garanzia giuridica sui propri proventi petroliferi.
- hash: 5041061b
  it: |
    Debito. Il debito estero è stimato dal mercato in USD 150-200bn e, secondo il riconoscimento dello stesso governo, fino a circa USD 240bn; alla Cina sono dovuti circa USD 10-15bn (stima S&P Global, giugno 2026), con prestiti garantiti dal petrolio rimborsati tramite un conto controllato da Pechino, e non sono stati trovati termini per il 2026 sul debito russo. I creditori che accettano tagli sono un problema per l'unica ristrutturazione di cui il governo ha bisogno nel 2027.
- hash: 387623e5
  it: |
    Un governo senza mandato nazionale. Rodriguez non ha vinto un'elezione presidenziale a livello nazionale, e le elezioni promesse non hanno una data; la legittimità che le serve all'estero è ciò che garantiscono i riconoscimenti brasiliano e colombiano, ed è condizionata alle elezioni che lei non ha indetto. La rivendicazione sull'Essequibo non può essere risolta dalla ICJ alle condizioni di Caracas, dato che Caracas sostiene che la corte non ha competenza.
- hash: 245d9b48
  it: |
    La licenza pagata con il petrolio destinato a Cuba. Per soddisfare le richieste di Washington, Caracas ha interrotto il greggio che era la prima fonte di approvvigionamento di Cuba (26,500 bpd nel 2025, circa un terzo del fabbisogno dell'isola): l'ultimo carico è partito a metà dicembre 2025 e l'amministrazione Trump ha applicato dazi a qualsiasi paese terzo che fornisca petrolio a Cuba. I 32 agenti di sicurezza cubani morti nel raid sull'abitazione di Maduro sono stati l'ultimo prezzo di quella vecchia alleanza, pagato prima che il petrolio fosse tagliato.
- hash: 30ad2b0c
  it: |
    Il partenariato con l'Iran ha comprato la tutela degli US che avrebbe dovuto contrastare. Il piano di cooperazione ventennale del giugno 2022 ha fatto dell'Iran il partner latinoamericano del Venezuela nel petrolio, nella petrolchimica e nella difesa; Washington ha chiesto a Caracas di tagliare questi legami come prezzo per il petrolio, e il 29 luglio 2026 il Venezuela ha convocato l'ambasciatore iraniano per un commento. Il taglio è la condizione delle licenze, non una scelta che Caracas ha fatto liberamente.
- hash: 259de1f9
  it: |
    L'Essequibo è l'unica causa che unisce la base chavista, e viene perseguita davanti a una corte la cui sentenza Caracas non riconoscerà. Una sentenza a favore della Guyana (attesa da novembre 2026 a gennaio 2027) arriva mentre Washington tiene i cordoni della borsa, quindi la rivendicazione nazionale che raccoglie il governo può solo indebolire l'unica relazione esterna di cui il governo ha bisogno.
- hash: c937065d
  it: |
    Il Venezuela dopo il 3 gennaio 2026 è uno stato governato dall'esterno attraverso i suoi fondi: gli US hanno preso il presidente e hanno lasciato che il suo successore governasse con licenze che il Treasury può revocare e con proventi petroliferi che Washington detiene. I suoi obiettivi sono la sopravvivenza di quel governo, le entrate del suo petrolio e una ristrutturazione del debito che può arrivare a USD 240bn, mentre la rivendicazione sull'Essequibo è l'unica causa che tiene unita la base chavista. La vecchia rete esterna è stata recisa anziché sostituita: Cuba ha perso il petrolio, l'Iran è stato convocato per un commento, Russia e Cina sono creditori con poco da offrire, e Brasile e Colombia danno riconoscimento e colloqui. Le questioni aperte sono le elezioni promesse senza una data e la sentenza della ICJ attesa entro l'inizio del 2027.
