items:
- hash: 7e5093ba
  it: |
    Le Figi di Rabuka usano la cornice del Pacifico come strumento proprio: presiedono il Melanesian Spearhead Group, hanno fatto passare l'Ocean of Peace nel Forum e aperto un'ambasciata a Gerusalemme, mentre vendono sicurezza a Canberra e Wellington e cercano denaro e sollievo tariffario da Washington. La domanda aperta è se una postura senza alleanze regga di fronte a un trattato Vuvale, a una cooperazione di polizia più stretta con l'Australia e a elezioni generali previste a cavallo tra il 2026 e il 2027.
- hash: 100f37e7
  it: |
    Restare una grande potenza sovrana il cui deterrente nucleare è proprio: al centro «strategic autonomy», ora estesa all'Europa come «forward deterrence» (2 mar 2026: ordinate altre testate, dimensione dell'arsenale non più pubblicata, dispiegamento temporaneo di aerei a capacità nucleare presso gli alleati, colloqui con otto partner), mentre la decisione di farne uso resta nelle mani del solo presidente francese.
- hash: 3616212e
  it: |
    Contenere la Russia, mantenere l'Ucraina nella guerra e fuori dalle mani russe: la National Strategic Review del 2025 indica la Russia come minaccia principale, e la Francia co-guida con il Regno Unito la Coalition of the Willing (Paris Declaration, 6 gen 2026), la cui forza successiva al cessate il fuoco è condizionata a un cessate il fuoco che Mosca non ha accettato.
- hash: 3182689b
  it: |
    Fare dell'EU, e non della sola NATO, la cornice della difesa e dell'industria europee, con la Francia al centro: preferenza europea negli appalti, il prestito SAFE (circa EUR 15.1bn per la Francia), le esportazioni di armamenti (Rafale, SAMP/T, Caesar) e un'opposizione di tipo veto al Mercosur per proteggere gli agricoltori.
- hash: 2cf3b658
  it: |
    Mantenere gli Stati Uniti dentro la sicurezza europea mentre ci si prepara alla loro uscita parziale: la minaccia tariffaria del 2026 sulla Groenlandia, la revisione delle truppe statunitensi (giugno 2026) e l'idea di una «NATO 3.0», in cui l'Europa assume la responsabilità primaria, spingono Parigi a costruire il pilastro europeo che ha sempre voluto, su una tempistica che non ha scelto.
- hash: 0b811cc5
  it: |
    Mantenere i territori d'oltremare e la posizione nell'Indo-Pacifico (Nuova Caledonia in primo luogo) e restare una potenza mediterranea e mediorientale dopo il ritiro africano: accordo di Bougival (12 lug 2025) e relativo supplemento, forza successiva a UNIFIL in Libano, patto di difesa rinnovato con la Grecia (25 apr 2026), riconoscimento della Palestina (22 set 2025).
- hash: 6be7121e
  it: |
    Pagare tutto questo: portare il deficit del 2027 verso il 5% del GDP, con un debito record vicino al 120%, in un'Assemblea senza maggioranza, mentre la spesa per la difesa sale a circa EUR 63-64bn nel 2027. La politica estera è esercitata da un presidente che lascia l'incarico nel maggio 2027 ed è il meno popolare dal 2017.
- hash: 805021a9
  it: |
    Seggi e formati: membro permanente del Consiglio di sicurezza UN, potenza nucleare, co-guida della Coalition of the Willing con il Regno Unito, triangolo di Weimar, trattati bilaterali (Quirinale con l'Italia, Nancy con la Polonia nel maggio 2025, la Enhanced Strategic Partnership con la Grecia dell'aprile 2026, con clausola di assistenza reciproca), la Northwood Declaration (10 lug 2025) con il Regno Unito e i colloqui «nuclear» del 2026 con otto partner.
- hash: f12ca1e0
  it: |
    Riconoscimento e mediazione: riconoscimento della Palestina (22 set 2025) alla conferenza UN co-presieduta con l'Arabia Saudita, ospitalità ai colloqui di sostegno al Libano (set 2026) e la spinta a mantenere una presenza internazionale nel Libano meridionale dopo la conclusione della missione UNIFIL il 31 dic 2026.
- hash: 8257795b
  it: |
    Inquadramento pubblico da parte del presidente: discorsi che definiscono «intensifying» la minaccia ibrida russa e promettono che «will not go unanswered» (set 2026), un Eliseo che denuncia i dazi come «unacceptable» (gen 2026) e la National Strategic Review del 2025 come testo dottrinale.
- hash: 42ab773b
  it: |
    Un esercito a pieno spettro con un deterrente proprio: circa 290 testate (stima SIPRI citata da Euronews, ora non più pubblicata da Parigi), un bilancio della difesa in crescita fino a circa EUR 63-64bn nel 2027 ai sensi della legge di programmazione militare aggiornata (+EUR 36bn nel periodo 2026-30), la guida del battlegroup multinazionale in Romania, una rotazione di terra nelle Forward Land Forces Finland annunciata al vertice di Ankara del luglio 2026 e un contingente nel dispiegamento in Groenlandia del gennaio 2026.
- hash: fc5ad7f7
  it: |
    Esportazioni di armamenti e denaro EU come strumenti: Rafale alla Serbia (12, EUR 2.7bn) e alla Croazia (12), SAMP/T alla Danimarca (circa DKK 58bn), Caesar all'Armenia (36), un accordo in sospeso per 114 Rafale con l'India e un tetto SAFE di circa EUR 15.1bn che deve essere speso in gran parte in materiale europeo.
- hash: d6936dd8
  it: |
    Finanze pubbliche: deficit del 5.4% del GDP previsto per il 2026, circa il 6.5% nel 2027 senza tagli per EUR 54bn, debito vicino al 120% del GDP; le leggi di bilancio passano solo dopo che le mozioni di sfiducia sono state respinte (la legge di bilancio 2026 nel febbraio 2026) e il Partito socialista definisce austerità il piano 2027.
- hash: 9052ced1
  it: |
    Una base interna debole: nessuna maggioranza in Assemblea dalle elezioni anticipate del 2024, primi ministri che si sono succeduti (Lecornu riconfermato nell'ottobre 2025) e una corsa presidenziale in cui Marine Le Pen, il cui ricorso l'ha resa eleggibile nel luglio 2026, guida i sondaggi del primo turno.
- hash: 01cc034f
  it: |
    La promessa nucleare è limitata: la Francia mantiene il controllo esclusivo sull'impiego, non offre una garanzia sancita da un trattato e dispone di un arsenale di alcune centinaia di testate, perciò partner come la presidenza polacca dubitano che possa sostituire l'ombrello americano, e Varsavia definisce «not my dream» l'ospitare aerei a capacità nucleare.
- hash: 7c0737c9
  it: |
    La posizione africana è scomparsa: basi restituite in Ciad (2025), Senegal (17 lug 2025) e Costa d'Avorio, forze espulse da Mali, Burkina Faso e Niger, con al loro posto l'Africa Corps russo; solo Gibuti e Gabon conservano truppe francesi (secondo quanto riferito).
- hash: 17a5ffe1
  it: |
    Dipendenza da fattori abilitanti americani e dalla decisione americana sull'Ucraina: l'applicazione del cessate il fuoco prevista dalla Paris Declaration passa per gli Stati Uniti, e Washington sta rivedendo le proprie truppe in Europa e legando i contributi alla NATO alla spesa.
- hash: 8558ef0f
  it: |
    Germania: il caccia di punta FCAS è crollato (aprile-luglio 2026) su ripartizione del lavoro, regole di esportazione e requisiti per l'impiego su portaerei e per il vettore nucleare, lasciando il motore franco-tedesco senza il suo progetto principale, mentre viene creato un gruppo di orientamento nucleare.
- hash: aa733dd6
  it: |
    L'ombrello nucleare offerto all'Europa è anche ciò che lo rende poco credibile. La Francia insiste sulla decisione esclusiva e sull'assenza di garanzie per conservare la propria libertà d'azione; la stessa riserva porta Varsavia e Berlino a dubitare che possa sostituire l'ombrello americano, sicché l'offerta amplia il campo dei colloqui senza spostare nessun alleato dalla dipendenza da Washington.
- hash: dec5434f
  it: |
    L'autonomia strategica poggia sulla copertura americana. Parigi co-guida la forza per l'Ucraina e invoca la sovranità europea, ma la forza esiste solo dopo un cessate il fuoco e la Paris Declaration lascia l'applicazione del cessate il fuoco agli Stati Uniti; l'autonomia si esercita dove Washington la lascia fare.
- hash: 9e27aecc
  it: |
    Difendere il proprio centro industriale ha spezzato il progetto europeo. Insistere su una quota di lavoro di circa l'80% e sulla compatibilità con le portaerei e sul vettore nucleare per il caccia comune ha posto fine a FCAS, simbolo del motore franco-tedesco, nell'anno in cui Parigi ha chiesto a Berlino di unirsi al suo dialogo nucleare.
- hash: 682f1a61
  it: |
    Lasciare l'Africa per sfuggire all'etichetta di «neo-colonial» ha lasciato il campo libero alla Russia. I ritiri del 2022-2025 (Mali, Burkina Faso, Niger, Ciad, Senegal, Costa d'Avorio) hanno posto fine al ruolo antiterrorismo nel Sahel e hanno fatto entrare l'Africa Corps; la giunta in Mali è ora assediata dai jihadisti e la Francia si è ridotta a invitare i propri connazionali a lasciare il paese.
- hash: 25349d11
  it: |
    Il sostegno al Marocco sul Sahara occidentale (2024) ha procurato un partner e ha avuto un costo per l'Algeria: richiamo degli ambasciatori, la detenzione di Sansal (graziato il 12 nov 2025 con la mediazione tedesca) e una crisi migratoria legata all'accordo del 1968: tutto ciò che Parigi ha dovuto iniziare a riparare nel 2025-26, con l'ambasciatore francese richiamato nell'aprile 2025 e, nel marzo 2026, soltanto segnalato come possibile rientro.
- hash: e190446a
  it: |
    Riconoscere la Palestina per riguadagnare peso in Medio Oriente lo ha ridimensionato. Il ministro degli Esteri israeliano ha dichiarato che per una visita di Macron c'era «no room» finché la Francia persisteva, e in Libano, dove la Francia è il patrono storico, Washington ha costruito il quadro Israele-Libano del giugno 2026 senza Parigi.
- hash: 9885c403
  it: |
    Difendere gli agricoltori francesi dal Mercosur indebolisce la risposta dell'EU ai dazi americani. Parigi ha guidato l'opposizione (il Parlamento ha deferito l'accordo alla Corte di giustizia con 334-324) nel momento in cui Berlino e Madrid volevano nuovi mercati per compensare i dazi statunitensi e la dipendenza dalla Cina.
- hash: fb1c32b6
  it: |
    La Francia conduce la strategia di una potenza media con un vocabolario di primo rango: nucleare, seggio permanente, un esercito destinato a essere «feared» (Macron, lug 2025) e la tesi che l'EU debba diventare sovrana. Nei termini di Luttwak, lo schema è che ogni affermazione di autonomia ha bisogno di un partner che non può dominare. L'offerta di forward deterrence del 2 mar 2026 ha bisogno di Germania e Polonia, che vogliono anche Washington; la Coalition of the Willing ha bisogno degli Stati Uniti per il cessate il fuoco; la spinta all'export di armamenti ha bisogno di denaro EU che Mercosur e il deficit rendono più difficile da mettere insieme. Dal 2022 il baricentro si è spostato a nord e a est (Finlandia, Romania, Polonia, Danimarca, Groenlandia) mentre la posizione africana crollava, e il Mediterraneo (Grecia, Cipro, Libano, Marocco) ne è la compensazione. Due segnali che non sono righe: le elezioni del 2027 sono l'incognita principale, con Macron il presidente meno popolare dal 2017 e Marine Le Pen eleggibile e in testa, sicché ogni impegno assunto nel 2025-26 (Paris Declaration, colloqui nucleari, patto con la Grecia) sarà messo alla prova da un successore; e nessun ambasciatore francese è stato segnalato di nuovo ad Algeri nonostante il disgelo. La stretta fiscale è l'unico vincolo che tocca ogni obiettivo.
- hash: 909ef020
  it: |
    Mantenere in vigore e finanziato il Compact of Free Association con gli Stati Uniti. Il rinnovo del 2024 assegna alla FSM US$3.3 billion in 20 anni, fino al 2043 (Interior Department). L'obiettivo si ricava da quell'esito, non da una dichiarazione del governo stesso.
- hash: c7e08148
  it: |
    Mantenere il rapporto con Pechino, in essere dal 1989, come seconda fonte di commercio e aiuti. Nel resoconto del governo stesso relativo al 2009, la Cina era il terzo partner commerciale della FSM per dimensione.
- hash: b44a5c2b
  it: |
    Economia: il pacchetto rinnovato del Compact, US$3.3 billion in 20 anni fino al 2043 (circa US$165 million l'anno, calcolo nostro).
- hash: 65dae2ab
  it: |
    Diplomazia: riconoscimento di Pechino dal 1989 e voti espressi insieme a Washington. Nel settembre 2025 la FSM è stata uno dei dieci stati che hanno votato contro l'approvazione da parte dell'Assemblea generale della New York Declaration sulla soluzione a due stati.
- hash: 083ee995
  it: |
    Denaro con un calendario fisso. Il pacchetto rinnovato copre 20 anni, fino al 2043, perciò la FSM pianifica il proprio bilancio attorno a una cifra concordata con Washington e non può modificarla da sola.
- hash: 93ae7639
  it: |
    Base commerciale ridotta. Il commercio con la Cina è stato di circa US$9.5 million nel 2007, e le cifre commerciali documentate risalgono tutte a prima del 2022: non è stata letta alcuna quota commerciale recente.
- hash: 7a24e76a
  it: |
    Votare con il patrono del Compact costa credito presso le Nazioni Unite nel loro complesso. Il voto del settembre 2025 ha collocato la FSM tra i dieci stati contrari alla New York Declaration, mentre 142 stati l'hanno approvata; l'allineamento premiato dal denaro statunitense è quello che la isola sulla Palestina.
- hash: 51df0457
  it: |
    Gli Stati Federati di Micronesia conducono la propria politica estera all'interno di un trattato: il Compact con gli Stati Uniti, rinnovato e finanziato nel 2024 con US$3.3 billion in 20 anni, ne è il perno, ed è l'unica posizione qui documentata con grado B. Il secondo rapporto, con Pechino dal 1989, è un legame commerciale e di aiuti ridotto, la cui storia recente questo passaggio non ha letto; gli altri due stati del Compact (Isole Marshall e Palau), il Giappone, l'Australia e il Pacific Islands Forum sono lacune aperte. L'unica azione datata letta finora, il voto del settembre 2025 contro la New York Declaration, mostra l'allineamento legato al Compact in azione alle Nazioni Unite.
- hash: eb711cae
  it: |
    Trasformare il campo militare francese di Libreville in un centro di addestramento a guida gabonese. Sotto Brice Oligui Nguema, salito al potere con il colpo di stato dell'agosto 2023 ed eletto nell'aprile 2025, il campo De Gaulle è descritto come condiviso con il paese ospitante, con istituzioni militari gabonesi integrate al suo interno e con un ruolo francese ridotto.
- hash: 1f044d96
  it: |
    Passare dal manganese grezzo a quello trasformato: un divieto di esportazione del manganese grezzo dal 2029 è stato annunciato nell'ambito di un piano industriale nazionale. Il divieto e la sua data provengono da sintesi di ricerca sulla stampa del 2025; l'articolo non è stato aperto, perciò questo obiettivo è un semplice rinvio finché non sarà letto.
- hash: e7b48e81
  it: |
    Il manganese tramite Eramet, la società mineraria francese. Eramet estrae circa 7-7.5 milioni di tonnellate di manganese grezzo l'anno; la capacità di trasformazione locale è di sole 65,000 tonnellate di silicomanganese e 20,000 tonnellate di ferromanganese. Le cifre provengono da una sintesi di ricerca, non da una pagina aperta, perciò sono un semplice rinvio finché non vengono verificate.
- hash: da5e7389
  it: |
    Appartenenza monetaria e regionale: la zona del franco CFA e il blocco doganale ed economico dell'Africa centrale (UDEAC/CEMAC). Compare solo nell'articolo di Wikipedia sulle relazioni estere, che è di livello 4 ed è citato come semplice rinvio. Non sono stati letti la documentazione propria del blocco né l'adesione alla ECCAS.
- hash: 839171c2
  it: |
    Un patto di sicurezza francese al guinzaglio corto. Il patto è stato rinnovato per due anni dalla giunta dopo il colpo di stato del 2023 e richiede un'ulteriore approvazione dopo il voto presidenziale; così il principale partner di sicurezza di Libreville ne tiene i termini su una tempistica che il Gabon non stabilisce del tutto.
- hash: 355f5ebf
  it: |
    La capacità di trasformazione è il collo di bottiglia. La fusione locale copre una piccola frazione del minerale grezzo estratto da Eramet, perciò un divieto di esportazione del grezzo dipende da impianti che non esistono ancora.
- hash: 8a48884b
  it: |
    Il campo francese, in via di restringimento, dovrebbe rendere la sicurezza del Gabon una questione propria, eppure resta il luogo in cui vengono addestrate le forze gabonesi, quindi la sovranità che la giunta vende poggia su istruttori francesi. Meno carri armati francesi, più addestramento francese.
- hash: 49ab719a
  it: |
    Il Gabon di Oligui Nguema sta cercando di trasformare un rapporto di sicurezza dell'epoca francese e un'unica materia prima estrattiva in un modello sovrano: il campo si sta restringendo fino a diventare un centro di addestramento gabonese, e il manganese deve essere trasformato in patria anziché esportato grezzo. I rapporti con la Cina e con gli Stati Uniti non sono ancora descritti: in questo passaggio non è stata letta alcuna fonte in merito, e la lacuna è registrata nel JOURNAL. I due vincoli che la scheda non può ancora quantificare, il calo del petrolio e il debito pubblico, sono le prime cose da leggere prima che la scheda possa dirsi completa.
- hash: f833b530
  it: |
    Dissuadere la Russia e mantenere integro l'ordine euro-atlantico, su una base di «NATO first»: guidare all'interno dell'alleanza (il battlegroup di Tapa in Estonia, il ruolo nucleare), co-guidare con la Francia la Coalition of the Willing affinché una forza successiva al cessate il fuoco per l'Ucraina esista come piano e, se arriva un cessate il fuoco, come truppe. La Strategic Defence Review del giugno 2025 ha fatto di questo il principio organizzativo della difesa britannica.
- hash: 86f0df0f
  it: |
    Tenere Washington vicina e coinvolta, e allo stesso tempo assicurarsi contro di essa: esenzioni commerciali e accordi tecnologici e sull'energia nucleare ottenuti con una visita di Stato, legami nell'intelligence e con Trident che non possono essere sostituiti, e una rete di sicurezza europea (Francia, Germania, Polonia, paesi nordici) costruita in parallelo. La «special relationship» è il bene su cui è calibrata l'intera strategia.
- hash: bc2aa344
  it: |
    Crescita attraverso il commercio: il reset con l'EU (partenariato su sicurezza e difesa, un'area sanitaria e fitosanitaria, Erasmus+ dal 2027, un programma per i giovani e un collegamento con il mercato del carbonio in fase di negoziato) e un ventaglio di accordi altrove (India, in vigore dal 15 lug 2026; Gulf Cooperation Council, concluso il 20 mag 2026). Il primo ministro Burnham ha dichiarato che «all options» sull'EU sono sul tavolo, un passo oltre il reset del 2025.
- hash: 446c1f29
  it: |
    Ricostruire massa e industria a sostegno del deterrente: spesa per la difesa al 2.5% del GDP entro il 2027, 3% nella prossima legislatura e il 3.5% della NATO (più l'1.5%) entro il 2035, fino a 12 sottomarini SSN-AUKUS, F-35A per il ruolo nucleare, il caccia GCAP con Giappone e Italia, fregate Type 26 per la Norvegia e droni per l'Ucraina e per la Royal Navy.
- hash: 532ef1fe
  it: |
    Mantenere l'assetto territoriale e costituzionale trattando sui propri margini: Gibilterra (il trattato EU-UK firmato il 14 lug 2026 ha rimosso la recinzione di frontiera terrestre senza pregiudizio per la sovranità), le Falkland («not up for negotiation»), la base di Chagos/Diego Garcia (trattato firmato nel 2025, ratifica bloccata per mancanza del consenso statunitense), l'Irlanda del Nord ai sensi del Windsor Framework e la stessa Unione britannica (SNP rieletto in Scozia nel maggio 2026).
- hash: 1dd94b7b
  it: |
    Disinnescare la rabbia interna di cui si nutre Reform UK, soprattutto per la migrazione con piccole imbarcazioni, e chiudere la porta alle attività di Stati ostili sul territorio nazionale (spionaggio e sabotaggi russi, spionaggio cinese, complotti iraniani). Entrambi sono ormai dossier di politica estera: la Manica è gestita con Francia, Germania, Albania e Cina, e le minacce ibride con Polonia e paesi nordici.
- hash: f0ad7077
  it: |
    Una rete di trattati bilaterali attorno al nucleo dell'EU: Lancaster House e la Northwood Declaration con la Francia (10 lug 2025, politica nucleare coordinata sotto controllo nazionale), il Kensington Treaty con la Germania (17 lug 2025), un trattato di difesa e sicurezza con la Polonia (firmato il 27 mag 2026), la 100-Year Partnership con l'Ucraina (16 gen 2025), l'accordo di Lunna House con la Norvegia (4 dic 2025) e il Geelong Treaty con l'Australia (26 lug 2025). Insieme alla Joint Expeditionary Force e alla Coalition of the Willing, fanno di Londra l'organizzatrice del livello «coalition» della sicurezza europea.
- hash: a20263af
  it: |
    La linea dell'E3 sull'Iran: insieme a Francia e Germania il Regno Unito ha attivato lo «snapback» UN il 28 ago 2025, e le sanzioni UN sono tornate in vigore il 27-28 set; nel 2026 abbina una lettura giuridica della guerra (nessun ruolo britannico nei primi attacchi statunitensi, basi aperte solo per «specific and limited defensive purposes») a una pressione per un cessate il fuoco USA-Iran e per il libero passaggio attraverso Hormuz.
- hash: 1c8b1927
  it: |
    L'attribuzione pubblica come arma: il pacchetto di sanzioni del giugno 2026 ha indicato un fronte del GRU, Neptune, e reti di flotta ombra e di approvvigionamento; i tribunali hanno condannato una rete di spionaggio bulgara controllata dalla Russia (condanne nel maggio 2025) e l'incendio doloso, organizzato dalla Wagner, di un magazzino destinato all'Ucraina a Londra (condanne nel luglio 2025). La linea del Foreign Office sulla Cina abbina l'impegno a dichiarazioni pubbliche su Hong Kong (Jimmy Lai, 20 anni).
- hash: 9554c915
  it: |
    Presenza avanzata e ruolo nucleare: il battlegroup di Tapa in Estonia dal 2017 (oltre 1,000 militari, con la 4th Brigade che vi si addestrerà nel 2027), Typhoon e F-35 nell'air policing della NATO, i sottomarini Trident e una flotta F-35A a doppia capacità prevista, e nel 2026 il primo abbordaggio di una petroliera della flotta ombra sanzionata nella Manica (14 giugno), cacciamine e la HMS Dragon per una missione a Hormuz e batterie di contrasto ai droni inviate in Kuwait e Bahrein.
- hash: 2761e76c
  it: |
    Sanzioni e accesso al mercato come leve: più di 500 navi della flotta ombra designate (conteggio del Ministry of Defence, giugno 2026), un US Economic Prosperity Deal del maggio 2025 con esclusioni settoriali, un Tech Prosperity Deal (settembre 2025) e circa GBP 150bn di impegni di investimento statunitensi, gas dalla Norvegia (27 bcm nel 2025) e gli accordi UK-India (in vigore dal 15 lug 2026) e UK-GCC (conclusi il 20 mag 2026).
- hash: 4737105f
  it: |
    Il denaro non corrisponde alla missione. Il Defence Investment Plan prevede il 2.7% del GDP per la difesa entro il 2029-30 (2.68% nella lettera di dimissioni di Healey), rispetto a un percorso NATO verso il 3.5% entro il 2035; resta un vuoto di finanziamento di circa GBP 4.7bn in cinque anni, e il Defence Secretary Streeting rifiuta di promettere il 3% entro il 2030 senza un piano di finanziamento.
