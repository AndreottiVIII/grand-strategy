# Translate every `en` into it. Write the translations to the file cards-15.out.yaml next to this one,
# as `items:` of `- hash: <same hash>` / `it: <translation>`, appending one item at a time (valid YAML at
# every step), never editing this file. Keep names, dates, numbers and quotes; register of a foreign-office
# brief: dry, precise, no flourish.
lang: it
items:
- hash: 759a2e59
  kind: cards
  en: 'Reform has to be shown to Washington, not only announced: the proclamation names the programme itself and names Dominica with it, while St Kitts and Nevis, Grenada and Saint Lucia run similar programmes
    and are not named.'
  it: ''
- hash: 1362ddba
  kind: cards
  en: 'No collective cover on the hard questions: CARICOM''s October 2025 statement on the US build-up was reached after weeks of silence, Trinidad and Tobago declined to back it, and Browne is publicly
    challenged on whether CARICOM, Antigua included, aligned with the Maduro government.'
  it: ''
- hash: a72000d4
  kind: cards
  en: The programme that brings in the revenue is the reason Washington restricts its citizens, and the China hedge is credible only while Washington accepts the reform. Each step towards Beijing tests
    the US tie the island most needs.
  it: ''
- hash: 806f02ad
  kind: cards
  en: 'Antigua and Barbuda plays a hedge with a small toolkit: a vote in CARICOM, an embassy in Beijing, and a passport programme that keeps a seat at Washington''s table only while it is reformed. In 2026
    the United States answered that hedge with visa restrictions tied to the programme; the government''s response has been to request a review and promise tighter residency rules, not to change its line.
    The card is thin on the UK, Ukraine and Gaza, and on current trade and tourism shares, because those sources were not available within the flash budget.'
  it: ''
- hash: 653ce550
  kind: cards
  en: 'Keep the United States committed to Australia''s defence and present in the region, and bind it with things it cannot easily withdraw: AUKUS Pillar 1 (the Pentagon''s review of December 2025 endorsed
    the sale of at least three Virginia-class boats from 2032), the critical-minerals framework signed with Trump on 20 Oct 2025, and the AUSMIN process (Washington, 8 Dec 2025).'
  it: ''
- hash: 34719a52
  kind: cards
  en: 'Build, in parallel, a ring of treaty partners that does not depend on Washington: Papua New Guinea (Pukpuk, signed 6 Oct 2025, in force July 2026), Fiji (Ocean of Peace Alliance, 6 Jul 2026), Tuvalu
    (Falepili Union), Nauru, Vanuatu (Nakamal, 29 Jun 2026), Indonesia (Treaty on Common Security, 6 Feb 2026) and the UK (Geelong Treaty, 26 Jul 2025), with Japan, the Philippines, Singapore and India
    as access and industrial partners.'
  it: ''
- hash: 22a2e308
  kind: cards
  en: 'Deny China a military or policing foothold in the south-west Pacific and on the northern approaches: vetoes over third-party security deals in the Nauru and Tuvalu treaties, a ban on foreign bases
    in the Vanuatu agreement, a treaty bid for the Solomon Islands against the 2022 China policing pact, and the pledge to return Port Darwin to Australian control.'
  it: ''
- hash: 7f68c2e5
  kind: cards
  en: Keep the China trade flowing while doing so. Albanese went to Beijing on 12-18 Jul 2025 for the Annual Leaders' Meeting after Beijing had removed the barriers that cost exporters more than A$20bn
    a year; China is almost a third of Australia's total trade.
  it: ''
- hash: bdcee14a
  kind: cards
  en: 'Rebuild the Australian Defence Force fast enough to matter before the submarines arrive: the 2026 National Defence Strategy (16 Apr 2026) lifts defence spending to 3% of GDP by 2033 on the NATO accounting
    method (A$14bn extra over four years, A$53bn over the decade), with eleven Mogami-class frigates (about A$10bn), 129 Redback vehicles, long-range strike and air and missile defence.'
  it: ''
- hash: f24600a5
  kind: cards
  en: 'Diversify an economy tied to one customer and one supply chain: the EU free trade agreement (concluded 24 Mar 2026; 98% of exports duty free once ratified), India (ECTA and the July 2026 summit''s
    economic-cooperation, minerals and uranium agenda) and the Quad Critical Minerals Framework (26 May 2026).'
  it: ''
- hash: e3ebecc4
  kind: cards
  en: Treaty-making as the main instrument. Since 2023 Canberra has converted partnerships into texts - Falepili (Tuvalu), Nauru, Pukpuk (PNG), Nakamal (Vanuatu), Ocean of Peace Alliance (Fiji), Indonesia,
    Geelong (UK) - each with a clause that lets Australia screen third-party security links, and a bid for a comprehensive treaty with the Solomon Islands.
  it: ''
- hash: b7c691fd
  kind: cards
  en: 'A ''Pacific-led'' frame for Australian power: the Pacific Policing Initiative (endorsed August 2024; Brisbane hub, police centres of excellence, a deployable regional force) and public backing for
    the Pacific Islands Forum, with Albanese at the Palau leaders'' meeting (31 Aug-3 Sep 2026). Visible distance from Washington and Jerusalem where the home audience demands it: recognition of Palestine
    (21 Sep 2025).'
  it: ''
- hash: 866c9ed4
  kind: cards
  en: 'Intelligence disclosed as policy: ASIO''s public attribution (26 Aug 2025) of two antisemitic attacks to Iran preceded the expulsion of the ambassador and a new law to list the IRGC; the same disclosure
    habit ran through the response to the Biak report (Marles naming his Indonesian counterpart''s denial) and the Tasman live-fire (a formal protest after an initial ''complied with international law'').'
  it: ''
- hash: 4dd32faa
  kind: cards
  en: 'The submarine as the strategic bet: SSN-AUKUS with the UK (Geelong Treaty, 50 years, Submarine Rotational Force-West from 2027) and at least three Virginia-class boats from 2032; ADF crews already
    train aboard US boats (three personnel were aboard the submarine that sank the Iranian frigate Dena, March 2026). Surface and land fleet bought from allies: Mogami frigates (Japan), Redback vehicles
    (Korea), plus the Abrams tanks given to Ukraine.'
  it: ''
- hash: 1d9f0016
  kind: cards
  en: 'Presence and exercises in the near abroad: Exercise Alon with the Philippines (about 3,600 personnel, August 2025), Singapore''s training grounds in Queensland, Guardian-class patrol boats and Australian
    Federal Police officers inside the Fiji police, police and defence advisers across the islands.'
  it: ''
- hash: '86121975'
  kind: cards
  en: 'Finance as statecraft: the critical-minerals framework (at least US$1bn of co-financing from EXIM, the DFC and Export Finance Australia in six months toward a US$8.5bn pipeline), budget and policing
    money in the island treaties (Nauru A$100m + A$40m; Vanuatu about A$500m over ten years; a A$190m police package for the Solomons; about A$500m for Fiji for 2025-29), and a 10% share of Greater Sunrise
    revenue offered to Timor-Leste.'
  it: ''
- hash: f732cb69
  kind: cards
  en: 'Market access and labour mobility as the soft half of the island treaties and of the regional ring: a pathway for up to 280 Tuvaluans a year, 10,000 Timorese workers by 2027-28, an EU deal (24 Mar
    2026), an India agenda for 2026, and resource exports (coal to Vietnam: 44% of its imports in 2024).'
  it: ''
- hash: 2240256b
  kind: cards
  en: 'Time and numbers: the Virginia-class boats come from 2032 and the SSN-AUKUS fleet in the 2040s, so Australia is exposed in the 2030s to a gap that only an allied rotational force can cover; the Virginia
    programme is behind schedule and over budget (a 2024 congressional estimate: two years late and US$17bn over to 2030), and an ASPI fellow said Canberra might not receive the boats. Defence spending
    reaches 3% of GDP only by 2033, and then on the NATO accounting method.'
  it: ''
- hash: 593f5df6
  kind: cards
  en: 'Trade dependence: China is almost a third of total trade, which is why the Tasman live-fire (49 flights diverted) drew a protest but not a break, and why Beijing''s warning over the Darwin port (Jan
    2026) is a real cost. The brief''s iron-ore and LNG shares were not sourced in this pass.'
  it: ''
- hash: 4b62f551
  kind: cards
  en: 'An unpredictable guarantor: the 10% tariff of April 2025, a five-month Pentagon review of the flagship programme, the request for 3.5% of GDP, a reported demand for a Taiwan pre-commitment, and a
    president who rebuked Australia''s own ambassador in front of the press - each answered, none resolved.'
  it: ''
- hash: 420a7143
  kind: cards
  en: 'Island sovereignty: Vanuatu rejected the first draft of its agreement (nine months before the signing of 29 Jun 2026) and the final text was reportedly watered down; the Solomon Islands keep the
    2022 China pact under review, not cancelled; Beijing is Vanuatu''s largest external creditor; and Fiji''s text, finalised in May 2026, left open whether it limits Chinese engagement.'
  it: ''
- hash: d73f5930
  kind: cards
  en: 'A hedging near neighbour: Indonesia is signed to a modest treaty with no common-danger clause and denied a Russian basing request at Biak only after the story was out; the Papua question sits under
    the relation. The northern approaches depend on a partner Canberra does not control.'
  it: ''
- hash: e6373872
  kind: cards
  en: 'The home front: a record Labor majority (94 of 150 seats, May 2025) gives room to act, but the response to the Tasman drills was attacked as ''weak'', the Bondi Beach attack of 14 Dec 2025 (15 killed)
    led to a royal commission on antisemitism (first hearing 24 Feb 2026), and the Israel and Iran lines are fought in the same public arena.'
  it: ''
- hash: 5d2fb9de
  kind: cards
  en: 'Paying for the guarantee makes it harder to refuse the guarantor. The more of its defence Australia builds around US-designed boats, US training and US-held consent (the Abrams for Ukraine waited
    on Washington), the more it is drawn into the guarantor''s wars without the guarantor being bound in return: ADF personnel were aboard the US submarine that sank the Iranian frigate Dena in March 2026,
    while Colby is reported to have asked Canberra for a Taiwan pre-commitment.'
  it: ''
- hash: 2161c4df
  kind: cards
  en: The route to sovereign submarines runs through lent sovereignty. SSN-AUKUS is the guarantee of independence, but until it exists Australia relies on the Submarine Rotational Force-West (from 2027)
    and on boats bought from a US navy whose own Virginia programme is late and over budget; the nearer the deadline, the more Canberra depends on the exact capital whose reliability is the question.
  it: ''
- hash: 9e455423
  kind: cards
  en: 'Vetoes breed hedging. Each island treaty buys Australia a say over third-party security deals (Nauru, Tuvalu, Vanuatu, perhaps Fiji and the Solomons), but the price in sovereignty makes the islands
    bargain: Vanuatu said no first and signed a softer text nine months later while talking to China about a separate economic arrangement; the Solomon Islands review the China pact rather than cancel it.
    The tighter the net, the more reason to keep a second door.'
  it: ''
- hash: 7f9cc58e
  kind: cards
  en: The customer funds the deterrent aimed at it. China's near-third of Australian trade pays for the build-up to 3% of GDP that is directed at China, and the pledge to take back Port Darwin (Beijing's
    ambassador warned in January 2026 of measures to protect the owner) puts the restored trade at risk in exchange for a symbolic denial of a foothold.
  it: ''
- hash: cea4f32e
  kind: cards
  en: 'A sovereign number shaped like the American one. Canberra answered Hegseth''s 3.5% by saying it would decide capability first, and then adopted 3% by 2033 on the NATO method, which counts defence-adjacent
    spending: the form of the US demand is met, the content is not, and nobody can say which of the two Washington will read.'
  it: ''
- hash: 6a7e4280
  kind: cards
  en: Courting Jakarta strengthens the neighbour that also courts Moscow. The Treaty on Common Security (February 2026) is the insurance for the northern approaches, yet it has no common-danger clause and
    a Russian basing request at Biak was alarm enough in April 2025 to enter the election campaign; a closer Indonesia is not a more predictable Indonesia.
  it: ''
- hash: cbee9bd6
  kind: cards
  en: 'Australia is the ally that pays for a guarantor that may not come, and the regional order it is building is the insurance on that premium. Everything since 2023 reads as one move: lock the United
    States in with submarines, minerals and a statute that survived a Pentagon review (AUKUS, endorsed December 2025; the framework signed on 20 Oct 2025), while turning every neighbour into a treaty partner
    that screens out China - Papua New Guinea as a mutual-defence ally (2025), Fiji as the fourth ally (6 Jul 2026), vetoes in Nauru and Tuvalu, no foreign bases in Vanuatu, a treaty bid for the Solomon
    Islands, a security treaty with Indonesia. The Albanese government has a free hand to do this: re-elected in May 2025 with 94 of 150 seats, it faces an opposition that attacks it for weakness on China
    rather than for the direction. The Luttwakian pattern is in the gap between the two halves. The guarantee is bought at the price of entanglement (an Australian crew aboard the submarine that sank the
    Dena) and is still conditional (3.5% asked, a Taiwan pre-commitment reportedly asked for, a 10% tariff in April 2025, a five-month review of the flagship programme), while the insurance is built by
    buying sovereignty from the very islands it is meant to protect, who answer by bargaining. Two signals that are not rows: Albanese''s first reply to the Tasman drills was to stress that China had complied
    with international law, and the New Delhi Quad meeting of May 2026 spoke of tolls in the Strait of Hormuz and the Red Sea, which points to the Iran war rather than the Taiwan Strait. The question for
    2027 is whether the ring of treaties and the submarine timetable hold long enough to outlast the guarantor''s moods; the first stress test is the Solomon Islands treaty, which a Solomon Islands minister
    floated for the end of 2026.'
  it: ''
- hash: d5ed9ea8
  kind: cards
  en: 'Keep permanent neutrality as the working definition of national security while buying protection inside the EU''s tent: no NATO, no mutual-assistance treaty, no foreign bases, but air defence bought
    jointly with Germany (European Sky Shield Initiative, a non-binding memorandum), a defence budget rising toward 2% of GDP by 2032 and a Bundesheer rebuilt under the ''Aufbauplan 2032+''. The Stocker
    coalition (ÖVP, SPÖ, NEOS, sworn in March 2025) kept Austria in Sky Shield after the FPÖ''s first place in 2024 had put it in doubt.'
  it: ''
- hash: 58b8e4ae
  kind: cards
  en: 'Cut the dependence on Russian energy and keep the money in the bank: pipeline gas from Russia stopped in January 2025 after OMV ended its Gazprom contract (16 Nov 2024 cut-off, 11 Dec 2024 termination),
    supply was re-routed through Germany and Italy and storage is filled; the open file is Raiffeisen Bank International, which still runs a Russian bank under an ECB wind-down demand and has taken a EUR
    2bn Russian judgment, and which on 23 Jul 2026 announced a EUR 3.15bn claim in Austria against Rasperia (the Deripaska company that holds a frozen Strabag stake).'
  it: ''
- hash: 820fcfa7
  kind: cards
  en: Lead the EU's enlargement to the Western Balkans, Austria's declared foreign-policy pillar, in the form of 'gradual integration' (single-market access sector by sector, equal conditions for all) with
    Montenegro and Albania as frontrunners; Stocker took part in the EU-Western Balkans summit in Tivat in June 2026, after state visits to Podgorica and Belgrade in August 2025. Austria is the third largest
    investor in Serbia and still supplies EUFOR Althea.
  it: ''
- hash: 27e8264e
  kind: cards
  en: 'Shrink the migration inflow and the bill for it: border controls kept since 2015 (Stocker to Merz: Schengen does not yet give ''robust external border protection''), family reunification suspended
    since March 2025 under the EU emergency clause, deportations of Syrians, and a Schengen deal in which Austria lifted its veto on Romania and Bulgaria (12 Dec 2024) once interceptions had fallen.'
  it: ''
- hash: d43b6e8b
  kind: cards
  en: 'Hold the line on the budget: as a net contributor Austria asks for a 2028-2034 EU budget of about 1% of gross national income, no larger Commission staff and an extended rebate, together with Germany,
    the Netherlands, Denmark, Finland and Sweden, while the government is losing in the polls to the FPÖ (34-36% in recent surveys against 21-23% for the ÖVP).'
  it: ''
- hash: 20bcab4e
  kind: cards
  en: 'Keep the trade machine running through the tariff storm: Germany takes about 30% of exports and the United States is the second market (EUR 12.9bn); the economy minister asks the EU to repeal the
    US steel tariffs, to keep suspension rights over the 2025 Turnberry framework and not to be ''blackmailed'' over the threatened rise of US car tariffs from 15% to 25% (May 2026), while seeking fair
    terms for 650 Austrian firms in China.'
  it: ''
- hash: c2300bfb
  kind: cards
  en: 'Seat diplomacy: Vienna houses the OSCE, the IAEA, OPEC and a UN headquarters (UNOV), almost 50 international organisations in all; Switzerland chairs the OSCE in 2026 but the secretariat is Austrian
    soil. Neutrality is sold as the licence to host and to mediate, and the Western Balkans file gives the foreign ministry a regional agenda inside the EU.'
  it: ''
- hash: b2cff073
  kind: cards
  en: 'Neighbour formats that give a small state a larger voice: the Slavkov/Austerlitz format with Czechia and Slovakia (Stocker''s first summit in it was Bratislava, 10 Feb 2026, on energy prices and
    competitiveness), the trilateral with Hungary on migration, joint cabinet meetings (a government session with Hungary in Gödöllő planned for September 2026) and the ''frugal'' letter on the EU budget.'
  it: ''
- hash: 344c27cd
  kind: cards
  en: 'Austria answers Russia''s influence operations with courts and expulsions rather than rhetoric: the former BVT officer Egisto Ott was convicted in Vienna in May 2026 of espionage and abuse of office
    (four years and one month) for passing data to Jan Marsalek''s Russian network, and on 4 May 2026 three Russian diplomats were expelled over an ''antenna forest'' on embassy roofs, 14 since 2020.'
  it: ''
- hash: 2df9e366
  kind: cards
  en: 'A Bundesheer built for territorial defence and peace support, not for war abroad: about 290 soldiers in EUFOR Althea in Bosnia (Austrian generals commanded the mission from December 2009 to January
    2024), a defence budget of about EUR 5.2-5.3bn in 2027 (Tanner: the largest ever; Finance Minister Marterbauer: around 1.2% of GDP, not 2% by 2032), air defence bought jointly with Germany.'
  it: ''
- hash: e6979a04
  kind: cards
  en: 'Money as soft power: EUR 3bn counted as support to Ukraine since 2022 (EUR 294m bilateral, humanitarian and reconstruction, no weapons), direct investment in the Western Balkans (third in Serbia),
    bank balance sheets in Central and Eastern Europe (Raiffeisen above all), and gas-storage capacity that serves Central Europe (82.8 TWh injected by 8 Sep 2025).'
  it: ''
- hash: 230bbc5e
  kind: cards
  en: 'Neutrality is constitutional and popular: the 1955 law bars membership of a military alliance, participation in war and foreign bases; 74-75% of Austrians prefer neutrality to NATO (Gallup March
    2024, Defence Ministry survey 2025) and only 14% want NATO, so no government can move on it, even while three quarters think the country is badly prepared to defend itself.'
  it: ''
- hash: 5f10151f
  kind: cards
  en: 'A three-party coalition squeezed by the FPÖ: ÖVP, SPÖ and NEOS govern after Kickl''s party won 2024 and talks with it collapsed; the FPÖ now polls 34-36% against 21-23% for the ÖVP, opposes sanctions
    on Russia and aid to Ukraine in the name of neutrality (Kickl called Zelensky''s Vienna visit of June 2025 ''neutrality-eroding''), and the three partners disagree on defence money.'
  it: ''
- hash: 95fc2c1b
  kind: cards
  en: 'Germany is the market and the supply chain: about 30% of goods exports (EUR 56.2bn in 2025) go to Germany, which also takes much of the car-parts output that is finished there and re-exported to
    the United States, so a German slowdown or a US auto tariff lands in Austria twice. The trade balance with China is the widest deficit (EUR 12.6bn in 2025).'
  it: ''
- hash: 88491c5a
  kind: cards
  en: 'Public finances: Agenda Austria projects the financing need rising from 15.3% of GDP in 2026 to about 21.3% in 2036; the budget leaves little for the army, the EU bill or Ukraine and is the reason
    for Vienna''s hard line on the EU budget.'
  it: ''
- hash: b98a1e6a
  kind: cards
  en: 'Alpine geography and a Brenner problem: the Inntal and Brenner motorways carry Italy''s trade with northern Europe and Tyrol''s truck bans are under attack in the EU Court of Justice (Italy v Austria,
    C-524/24; Advocate General opinion of 16 Jul 2026 finds three of four measures contrary to the free movement of goods). Rome refuses the cross-border slot system Vienna wants.'
  it: ''
- hash: 1d168522
  kind: cards
  en: 'Bank exposure it cannot unwind: Raiffeisen Bank Russia has cut loans from EUR 13.7bn to EUR 4.5bn, but its sale needs Russian state approval, a Russian court froze 100% of its shares in January 2025,
    and the ECB demanded a 65% cut of its loan book; Vienna twice failed in EU sanctions talks to release Rasperia''s frozen Strabag stake as compensation, so the state cannot choose between pressure on
    Moscow and the interests of its largest banks.'
  it: ''
- hash: baf2543a
  kind: cards
  en: Neutrality buys no safety and costs a seat. Austria cannot join NATO or any mutual-defence pact, but it sits under the EU's Article 42(7) clause and buys its air shield from a German-led club; it
    therefore depends on the alliance it will not join for the protection it needs, while the party that promises to protect neutrality (FPÖ) would take it out of Sky Shield and so make the Bundesheer both
    weaker and costlier (estimated EUR 100m extra for leaving).
  it: ''
- hash: 54081eb1
  kind: cards
  en: The gas break was won by OMV's own lawsuit, and it worked because the old dependence had already been replaced. OMV set off its EUR 230m ICC award against Gazprom invoices, expecting the cut-off,
    and Gazprom stopped deliveries on 16 Nov 2024; but the state that for decades relied on the Gazprom contract had to rebuild a gas system through Germany and Italy, and its banks still earn money in
    Russia, so the energy break from Moscow is complete while the financial one is not.
  it: ''
- hash: 4810422e
  kind: cards
  en: The Schengen veto that Vienna used as leverage ended up unblocking the countries it wanted to discipline. Austria held Romania and Bulgaria out of Schengen for two years in the name of migration control,
    dropped the veto on 12 Dec 2024 after Karner showed interceptions falling from 70,000 to 4,000, and still keeps its own internal border controls, in place since 2015, on the argument that Schengen does
    not yet protect the external frontier; the leverage worked, but Vienna now keeps the checks it had said the veto would make unnecessary.
  it: ''
- hash: 539966f4
  kind: cards
  en: Backing the Balkans into the EU while insisting on the EU's strictest terms. Austria champions Montenegro, Albania and Serbia and wants 'gradual integration', but asks for the same criteria for all,
    caps the EU budget it would take to pay for enlargement at about 1% of GNI and, by blocking Schengen for two years, showed candidates that membership can be held hostage to migration; Belgrade's irritation
    at Stocker's press questions in August 2025 shows the limits of leverage.
  it: ''
- hash: 765ca708
  kind: cards
  en: Fighting the Brenner lorries in Luxembourg is a fight against its own single-market gains. Tyrol's truck bans protect health and air quality but Italy sued in 2024 and the Commission took Rome's side;
    the Advocate General's July 2026 opinion suggests most of the bans fall, so the member state that leads the 'frugal' push for a tighter EU must defend its transit policy against the EU's own court and
    against the neighbour it needs for the Brenner Base Tunnel and the slot system.
  it: ''
- hash: eb46f7de
  kind: cards
  en: 'Austria''s banking footprint in Russia has kept it from using sanctions against Russia as an instrument: the state backs every EU package, yet its largest foreign-exposed lender is suing in Austrian
    courts for compensation from a sanctioned Russian company.'
  it: ''
- hash: '49903031'
  kind: cards
  en: 'Austria is a middle-sized trading state that has made a security policy out of not having one, and the two things that held that bargain up - cheap Russian gas and a post-1989 buffer of friendly
    neighbours - are gone. The gas is gone by the company''s own choice and the market''s help (December 2024); the buffer is being rebuilt through the Slavkov format, the Magyar reset in Hungary, the Balkan
    enlargement file and a Germany that now agrees with Vienna on borders. Neutrality remains untouchable at 75% public support, so the Stocker government, squeezed by an FPÖ polling at 34-36%, does what
    the Cold War Austria did: it moves with the West in everything except the vocabulary (EU sanctions yes, weapons no; Sky Shield yes, NATO no; a 2% defence goal on paper and about 1.2% in the budget).
    The real strategic exposure is economic, not military: Germany for the market, the United States for the second-largest outlet, China for the deficit, and the Brenner for the lorries. The Russia file
    shows the paradox best: the espionage cases (Ott, the embassy antennas) are taken to court and the diplomats expelled, but Raiffeisen''s Russian bank and its EUR 3.15bn claim keep one Austrian foot
    in Moscow. For the atlas, Austria is a partner of almost everyone and an ally of a few by treaty, and its grade toward each follows the structure (EU membership, trade, geography), not the declaration
    of neutrality.'
  it: ''
- hash: fedd23c0
  kind: cards
  en: 'Turn the 2023 military victory in Karabakh into a settlement on Baku''s terms: a peace treaty that Armenia can sign only after rewriting the constitutional preamble that points to the 1989 unification
    act, mutual withdrawal of international legal claims, no third-party monitors on the border, and a land link to Nakhchivan (the Trump Route, TRIPP). Aliyev says he would sign ''the very next day'' once
    the constitution is amended.'
  it: ''
- hash: 5148cc9b
  kind: cards
  en: 'Keep the Aliyev family''s rule unchallenged: an early 2024 election won with about 92% in what ODIHR called a restrictive, non-competitive environment, and a sweeping case against independent media
    (more than two dozen journalists jailed in 2026, sentences of up to 15 years). Domestic control comes before every foreign-policy choice.'
  it: ''
- hash: 5cae547d
  kind: cards
  en: 'Keep hydrocarbon rents flowing while output falls: gas to Europe through the Southern Gas Corridor (25.2 bcm exported in 2025, more than half to the EU), a sovereign fund of about USD 73bn, and a
    gradual shift to transit, renewables and the ''non-oil'' economy. Oil production fell 4.8% in 2025 and growth is 1.2-2.2% in 2026.'
  it: ''
- hash: 9f81a4fe
  kind: cards
  en: 'Strategic autonomy by having no patron: Turkey as the treaty ally, Israel and Pakistan as arms and oil partners, the United States as a new charter partner, the EU as customer, China and Central
    Asia as markets, Russia as a neighbour to be managed. After 2023 the aim is that no single capital can dictate Baku''s choices.'
  it: ''
- hash: c083bd49
  kind: cards
  en: 'Become the hub of Eurasian east-west transit: the Middle Corridor (3 million tonnes in January-August 2026, up 22%), the TRIPP link through Syunik to Nakhchivan and Turkey, a Caspian-Black Sea role
    with Georgia, and a full seat in the Central Asian leaders'' format (''Central Asia and Azerbaijan'') since November 2025.'
  it: ''
- hash: 727c2b98
  kind: cards
  en: 'Keep a decisive military edge over Armenia and the ability to deter Iran and Russia: a defence and security budget of about AZN 8.7bn in 2026 (about 21% of the state budget), Turkish and Israeli
    systems, and a large JF-17 order from Pakistan.'
  it: ''
- hash: c9e49c40
  kind: cards
  en: 'Hub diplomacy with every camp at once: founding seat on Trump''s Board of Peace (22 Jan 2026), the Charter on Strategic Partnership with Washington (10 Feb 2026), the Shusha alliance with Ankara,
    a full seat in the Central Asian format, host of COP29 (2024) and Baku Energy Week as a stage. Counter-pressure against Western critics: the Milli Majlis suspended all cooperation with the European
    Parliament in May 2026 after its resolution on Armenia.'
  it: ''
- hash: 63eff065
  kind: cards
  en: 'State-controlled narrative: the term ''Western Azerbaijan'' for the Armenian republic (a university department on its ''economic potential''), the Baku Initiative Group against ''French colonialism''
    (founded July 2023), denial that Azerbaijani territory is used against Iran, and closure or prosecution of independent and foreign-linked media (Abzas, Meydan TV, Toplum TV; Sputnik Azerbaijan raided
    in June 2025).'
  it: ''
- hash: a1bf1b87
  kind: cards
  en: 'Proven coercion and a growing arsenal: the 24-hour offensive of 19-20 Sep 2023 ended Karabakh''s de facto state, Russian peacekeepers left on 12 Jun 2024, joint exercises with Turkey (Unwavering
    Brotherhood, March-April 2026), Israeli drones and loitering munitions (Israel supplied about 69% of arms imports in 2016-2021), Turkish systems and JF-17 jets (up to 40 ordered, delivery started 2024).'
  it: ''
- hash: ff7e143c
  kind: cards
  en: 'Energy and transit as leverage: Southern Gas Corridor gas to 14 countries (Italy leads; Bulgaria, Greece, Serbia, Germany since January 2026), Israel''s main crude supplier through the BTC pipeline,
    a sovereign fund that financed 6.4bn manat of the budget in the first half of 2026, and the power to open or close transit to Armenia (all restrictions lifted on 21 Oct 2025; fuel exports to Armenia
    since 2025).'
  it: ''
- hash: f38868fa
  kind: cards
  en: 'The resource curve: oil output is in structural decline (-4.8% in 2025), the Southern Gas Corridor delivered about 12.8 bcm to the EU in 2025 against the 20 bcm the 2022 memorandum ''aspired'' to
    by 2027, no final investment decision on an expansion exists, and the extra TAP capacity of January 2026 is already allocated to Italian buyers. World Bank (October 2026) puts 2026 growth at 1.2%.'
  it: ''
- hash: 1087ddbd
  kind: cards
  en: 'Geography between two giants: Iran to the south (Azeris are Iran''s largest minority, Tabriz was hit by Israeli strikes, drones struck Nakhchivan on 5 Mar 2026 and IRGC media called the BTC pipeline
    a target) and Russia to the north. Baku has no friendly land border on the south and must keep its territory out of any Israeli-Iranian operation to keep the pipeline and Nakhchivan safe.'
  it: ''
- hash: 6ee89ac9
  kind: cards
  en: 'The peace is not in Baku''s hands: the constitutional precondition has to pass an Armenian referendum, and Civil Contract won 64 of 105 seats on 7 June 2026, short of the 70 seats it wanted for a
    constitutional majority; the referendum is expected in 2027 at the earliest. Baku can set the pace of transit and pressure but cannot vote in Armenia.'
  it: ''
- hash: 6694dba2
  kind: cards
  en: 'Dependence on partners that are also each other''s rivals: Turkish alliance and Israeli arms and oil trade pull in different directions as Ankara and Tel Aviv drift apart, and the US charter coexists
    with a Section 907 restriction that is waived rather than repealed (waiver renewed in 2025, repeal still on the Baku agenda in July 2026).'
  it: ''
- hash: 8a70351f
  kind: cards
  en: 'Reputation among the paying customers: the European Parliament passed its fourteenth critical resolution since 2021, PACE has refused the delegation''s credentials since 2024, and a Council of Europe
    or EU concession on human rights would cost the regime at home, so Baku keeps the executive channel (gas, Partnership Priorities 2026-2030) open and the parliamentary one shut.'
  it: ''
- hash: 95cfa20b
  kind: cards
  en: Russia has no base in Azerbaijan any more (the Gabala radar, then the Karabakh peacekeepers, which left on 12 Jun 2024), but keeps leverage through trade, labour, transit corridors, an Azerbaijani
    diaspora and the North-South route; Baku settled the AZAL case in April 2026 without the punishment of those responsible.
  it: ''
- hash: 41b934eb
  kind: cards
  en: Victory that cannot be banked. Winning Karabakh by force in 2023 gave Baku everything it fought for except what it now needs, the Armenian constitutional change. Continuing to use 'Western Azerbaijan',
    demolishing Armenian churches in Karabakh and sentencing the former Karabakh leaders (Vardanyan 20 years, February 2026) hands Pashinyan's opponents the arguments against a referendum, and Pashinyan's
    failure to win a 70-seat majority on 7 June 2026 leaves the signature in the hands of Armenian voters.
  it: ''
- hash: ff22584c
  kind: cards
  en: The corridor Baku demanded for thirty years now comes under an American company. TRIPP gives Azerbaijan its link to Nakhchivan through Syunik, but with exclusive long-term development rights in Armenian
    territory held by a US-controlled company, so the passage is open because Washington stands behind it, not because Baku controls it, and Iran reads it as an American foothold on its northern border.
  it: ''
- hash: 6c91eccb
  kind: cards
  en: 'The Israeli partnership that sharpened the army also endangered the pipeline. Israeli drones and oil sales (Azerbaijan supplies more than half of Israel''s crude) are the base of the relationship,
    but they made Baku the object of Tehran''s suspicion: the Nakhchivan drone strike of 5 Mar 2026, the foiled IRGC-linked plots against the BTC pipeline and the Israeli embassy, and the withdrawal of
    Azerbaijan''s diplomats from Tehran and Tabriz. Baku then repaired relations with Iran (Bishkek meeting on 31 Aug 2026) and denies hosting Israeli forces.'
  it: ''
- hash: 22fcfdb8
  kind: cards
  en: Gas diplomacy outruns gas. Azerbaijan sells itself as the answer to Europe's Russian-gas exit, with Serbia, Bulgaria, Italy and now Germany as customers and COP29 as the stage, while its own production
    plateaus; every new buyer (Serbia asked for up to 0.9-1.4 bcm a year) competes for volumes that are already contracted, and the 20 bcm target of 2022 has become a political promise rather than a capacity.
  it: ''
- hash: 10b73e75
  kind: cards
  en: Repression funds the stability that Europe pays for. The jailing of journalists protects the regime and the Karabakh narrative, but it is why the European Parliament and PACE are closed to Baku, so
    Azerbaijan has to buy its European standing through the executive channel alone (Kallas in May, von der Leyen on 1 July 2026) and accept a human-rights file that Brussels trades against gas.
  it: ''
- hash: 8cc1ef98
  kind: cards
  en: Humiliating Moscow then settling with it. Baku turned the AZAL shoot-down (25 Dec 2024), the Yekaterinburg deaths (27 Jun 2025) and the Sputnik raids into a campaign for responsibility and punishment,
    won an acknowledgement in Dushanbe (9 Oct 2025) and compensation in April 2026, but dropped the demand to punish those responsible and restored working relations, because a Russia with no base in Azerbaijan
    still controls the northern border, Armenia's grain route and the diaspora.
  it: ''
- hash: 73c6daf1
  kind: cards
  en: A quarrel with France that helped build the camp it fought. The Baku Initiative Group and the alleged New Caledonia campaign (2023-24) punished Paris for arming Armenia, but France stayed Armenia's
    main Western arms supplier and the dispute sealed the EU's critical stance until a thaw began in 2026 (Aliyev-Macron call in May, Bayramov-Barrot in September).
  it: ''
- hash: 7cdd0e38
  kind: cards
  en: 'Azerbaijan runs the strategy of a state that won its central war and is

    now converting a position of force into a durable order without a patron.

    The 2023 recovery of Karabakh and the exodus of about 100,000 Armenians

    closed the territorial question on the ground; what remains is to make

    the settlement legal (the Armenian constitution, the treaty, TRIPP) and

    to keep the rents that pay for it while oil declines. The method is

    multi-vector balancing: a treaty alliance with Turkey, arms and oil with

    Israel, jets from Pakistan, a charter with Washington, gas to Europe,

    transit with China and Central Asia, and a managed truce with Russia

    after the AZAL crisis. Luttwak''s pattern shows in each: every success

    attracts the counter-pressure that limits it. The Israeli link brought

    Iranian drones, the American corridor puts Washington on Azerbaijan''s

    border with Armenia, the argument won against Moscow ended in a

    settlement without punishment, and a regime that jails journalists is

    trading the European Parliament for the European Commission. Two

    signals that are not rows: Aliyev skipped the Moscow Victory Day

    parade in May 2025, and in 2026 the contacts with Russia reported to

    us run through a deputy prime minister and foreign ministers, with no

    head-of-state meeting found; and the peace is still a text initialled

    but unsigned while Azerbaijani fuel and Russian grain already cross

    the old front line. The test of the next year is whether Baku lets

    Armenia reach the referendum on its own terms or keeps raising the price of signing.'
  it: ''
- hash: 1dc57f3c
  kind: cards
  en: Keep the CNDD-FDD in power under President Ndayishimiye. A 2018 constitutional referendum let Nkurunziza stay in office until 2034 (New York Times, 2018), and the ruling party won the 2020 presidential
    election (Reuters, 2020). The aim is our reading of that record (C); the 2025 legislative vote is not yet sourced here.
  it: ''
- hash: 91e467b1
  kind: cards
  en: Hold the Congolese army's line in South Kivu against M23. Burundi deployed thousands of soldiers to help the Congolese army (Reuters, January 2025), and when M23 seized Uvira on 10 December 2025 tens
    of thousands of Congolese crossed into Burundi (Al Jazeera, December 2025). The objective is our inference from the deployment.
  it: ''
- hash: 2d8de518
  kind: cards
  en: Keep Rwanda from backing armed opposition against Bujumbura. Burundi accused Rwanda of backing the 2015 coup attempt (Reuters, January 2025), and Al Jazeera reports Rwanda is described as backing
    the M23 offensive, which Rwanda denies (December 2025). The objective is inferred (C).
  it: ''
- hash: 5b58facd
  kind: cards
  en: Thousands of soldiers in South Kivu beside the Congolese army (Reuters, January 2025), and troop contributions to the African Union mission in Somalia, which the Somali president acknowledged in February
    2019 (Burundi presidency, a tier-1 statement). The revenue value of the Somali contribution is not sourced here.
  it: ''
- hash: bed7c8db
  kind: cards
  en: 'Little economic lever. GDP was about USD 6.75bn in 2025, about USD 489 a head (IMF, April 2025). External support is thin: the sourced Belgian cooperation is EUR 75m for 2024-28 (Belga, 2023; North
    Africa Post, 2023).'
  it: ''
- hash: 446b636e
  kind: cards
  en: 'A small, farm-based economy: about USD 6.75bn of GDP and about USD 489 a head (IMF, April 2025), with agriculture about half of GDP (EEAS, 2017 figure; the page is undated).'
  it: ''
- hash: 7690b8ee
  kind: cards
  en: 'The Congo war reaches the border: tens of thousands of Congolese crossed into Burundi after M23 seized Uvira on 10 December 2025, and UNHCR said on 19 December that Burundi had reached a ''critical
    point'' (Al Jazeera, December 2025).'
  it: ''
- hash: e54580d0
  kind: cards
  en: Fighting M23 puts Burundi on the side opposite the Rwanda-backed rebels, so the Congo war becomes the Rwanda rivalry; and the same fighting sends refugees across the Burundian border (Al Jazeera,
    December 2025).
  it: ''
- hash: 9d9dceb7
  kind: cards
  en: Burundi's grand strategy is to keep the CNDD-FDD in power, which the 2018 referendum and the 2020 election secured for the long term, and to keep the Congo war off its own soil by fighting beside
    Kinshasa. That alignment puts Bujumbura against the side Kigali is described as backing, so the rivalry with Rwanda now runs through the M23 war as well as through the 2015 coup accusation. The weak
    point is the economy, a farm-based state of about USD 6.75bn that hosts the refugees the war pushes across its border; the 2025 legislative election, the Rwanda border closure and the sanctions record
    are not yet verified here.
  it: ''
- hash: 7803add2
  kind: cards
  en: 'Stay inside the Western security order while rearming from the bottom of the NATO table: the Strategic Vision 2025 (approved 18 Jul 2025) sets the budget at 2% of GDP in 2025 (EUR 12.8bn, up from
    1.29% in 2024), rising to EUR 21.3bn in 2034, 11 more F-35s (45 in all), NASAMS air defence and a third frigate. In July 2026 Francken committed to hold 2% until 2029 and to draw a roadmap to the NATO
    3.5% core target, which he calls ''particularly difficult'' in the current budget climate; the government also counts ''resilience'' spending (railways, cyber) to claim a total of about 3.4%.'
  it: ''
- hash: 1c68679a
  kind: cards
  en: 'Never be left alone holding the legal and financial risk of the Russian central-bank assets: about EUR 185bn of the EUR 210bn immobilised in the EU sits at Euroclear in Brussels. De Wever blocked
    the Commission''s EUR 140-210bn ''reparations loan'' in Oct-Dec 2025 until risk was shared by all member states and Euroclear was guaranteed against having to repay Moscow. The summit of 18-19 Dec 2025
    chose a EUR 90bn loan raised on EU borrowing instead, and the question of the assets stayed open.'
  it: ''
- hash: 572a9bd4
  kind: cards
  en: 'Keep Ukraine fighting and Russia deterred at a price Belgium can carry: a ten-year bilateral security agreement (28 May 2024), military aid of at least about EUR 1bn a year announced by De Wever
    for the legislature, F-16s (seven promised for 2026, three of them to fly), PURL contributions, EUR 6.6bn of Euroclear windfall contributions passed on since Feb 2024, and a post-ceasefire offer of
    air, maritime and training capabilities to the Coalition of the Willing (6 Jan 2026) on condition that US leadership backs it.'
  it: ''
- hash: 8558777f
  kind: cards
  en: 'Defend a trading economy that lives on open ports and the single market: Antwerp-Bruges, Zeebrugge, the Liege air hub, pharmaceuticals (more than half of the EUR 27bn of goods sold to the US in 2024).
    The US 15% tariff already cut exports to the US by 12% in May-July 2025; De Wever asks Brussels for a firmer line on Chinese trade practices while Belgium keeps the Chinese logistics flows that pass
    through its ports.'
  it: ''
- hash: 170ca6bd
  kind: cards
  en: 'Stay heard in the Great Lakes, where Belgium is the former colonial power and, through Brussels, the diplomatic gateway to Europe: defend the territorial integrity of the DRC, lead the EU push to
    sanction Rwanda over the M23 (which cost it its ties with Kigali from March 2025 to September 2026), and renew development cooperation with Congo (about EUR 50m a year, 2023-27) and Burundi (EUR 75m,
    2024-28).'
  it: ''
- hash: bf9694bc
  kind: cards
  en: 'Keep the five-party Arizona coalition (N-VA, MR, Les Engagés, Vooruit, CD&V) together while closing a budget hole of about EUR 10bn: pension reform (bonus-malus) went through committee in April 2026,
    unions strike regularly, and Vooruit, CD&V and Les Engagés are the cautious voices on higher military spending. Foreign policy is run by a government that has to buy peace at home before it commits
    money abroad.'
  it: ''
- hash: 5ecc804e
  kind: cards
  en: 'The seat of the EU institutions and NATO headquarters, and a foreign minister (Prevot) who uses national packages to push the EU: on 2 Sep 2025 a 12-measure package on Israel (conditional recognition
    of Palestine, entry bans on two Israeli ministers and violent settlers, a settlement-goods import ban), with the settlement-goods ban approved by the cabinet in July 2026 after Prevot called the Commission''s
    proposal a ''token gesture''; a Joint Declaration with Morocco (Brussels, 23 Oct 2025) backing the autonomy plan; mediation channels to Kigali through Qatar.'
  it: ''
- hash: c84a5222
  kind: cards
  en: 'A small, high-end force being rebuilt: 26,200 troops at the start of 2025, 34,500 planned for 2034; F-35s (45 on order), NASAMS (a EUR 3.1bn deal with the Netherlands signed at the Ankara summit,
    July 2026), two ASW frigates with the Netherlands (BeNeSam), a MQ-9B drone; F-16s donated to Ukraine as the F-35s arrive; a medium brigade to be NATO-deployable by 2030.'
  it: ''
- hash: 0617f2c7
  kind: cards
  en: 'Custody of the financial centre of gravity: Euroclear passes the windfall profit on the redeposited Russian cash (EUR 744m in Q1 2026; about EUR 6.6bn since Feb 2024) to the European Fund for Ukraine
    and pays Belgian tax on it; sanctions enforcement at the ports (Russian diamonds banned since Jan 2024, Russian LNG ban from 1 Jan 2027); trade missions headed by Queen Mathilde (Turkey, May 2026);
    development agencies (Enabel) as instruments in Congo and Burundi.'
  it: ''
- hash: 73d4750a
  kind: cards
  en: 'A security service that names the threats in public: the State Security (VSSE) Intelligence Report 2025 (January 2026) puts Russia first, with a hybrid arsenal of influence and espionage, and treats
    China''s economic espionage and transnational repression (''From Brussels to Beijing'') as the second line; the prime minister uses open letters (to von der Leyen on Chinese trade and on the Russian
    assets) to set the EU agenda.'
  it: ''
- hash: e880facd
  kind: cards
  en: 'The exposure it cannot hedge: Euroclear holds the assets, so any seizure by the EU lands first on Belgium (investment treaties with Russia, Moscow court judgments: the Bank of Russia won in the Moscow
    arbitration court on 15 May 2026 for about 18 trillion roubles and Euroclear lost its appeal on 16 Jul 2026, by Euroclear''s own report). Russia''s ambassador threatened ''severe retaliation'' in Nov
    2025.'
  it: ''
- hash: 51a0c01c
  kind: cards
  en: 'Money and capacity: defence at 2% only to 2029, 3.5% ''particularly difficult''; a public deficit the prime minister called ''dramatic''; only 12 of 34 F-35s delivered by March 2026 (eight of them
    parked at Luke AFB in Arizona), so the F-16s cannot leave until replacements arrive and are retired by 2028.'
  it: ''
- hash: 288aec7f
  kind: cards
  en: 'Dependence on the US for the high end (F-35, nuclear sharing) and on American goodwill for trade: only about 7% of the 2026 defence budget is committed to US contracts, but it is the F-35 core; the
    US takes about 7.6% of Belgian goods exports, led by pharmaceuticals.'
  it: ''
- hash: a0bebedb
  kind: cards
  en: 'A five-party, two-language coalition: any deployment, budget line or recognition needs consensus between a Flemish nationalist prime minister, Francophone liberals and centrists, and two Flemish
    parties of the centre and the left. Defence minister Francken is more forward-leaning than De Wever on troops for Ukraine; the Palestine recognition has waited a year on conditions.'
  it: ''
- hash: e1403f17
  kind: cards
  en: 'Hybrid exposure of a host state: drones closed Brussels and Liege airports and flew over the Kleine-Brogel, Florennes and Schaffen air bases in Nov 2025 (Belgium did not attribute them publicly;
    security services suspected a state actor, probably Russia); the UK sent RAF counter-drone specialists. The VSSE names Russia and China as the main threats in the capital of the EU and NATO.'
  it: ''
- hash: 9e65870c
  kind: cards
  en: 'A colonial name that is both an asset and a handicap: Belgium is listened to in Kinshasa and Bujumbura, but Kigali reads its Great Lakes policy as ''neo-colonial'', and the Lumumba case (a Brussels
    court sent Etienne Davignon to trial on 17 Mar 2026) keeps the past in the courtroom.'
  it: ''
- hash: 41b144c1
  kind: cards
  en: 'The veto that protected Belgium isolated it. By holding out against the reparations loan to avoid being left with Russia''s claims, De Wever made Belgium the obstacle in the eyes of Berlin, Helsinki,
    Warsaw and the Baltics, while Moscow went on suing Euroclear and threatening Belgium anyway: the EU froze the assets indefinitely on 12 Dec 2025 by qualified majority (so no veto was left on the freezing),
    the loan went through as EU debt, and Russia''s courts ruled against Euroclear in May and July 2026. Belgium bears the risk it refused to share and kept none of the thanks.'
  it: ''
- hash: 206cc30b
  kind: cards
  en: 'The jet that buys Washington''s goodwill delays the aid to Ukraine. The F-35 order (45 jets, 11 added in 2025) is the price of staying close to the US and keeping NATO''s nuclear sharing at home,
    but the F-16s promised to Kyiv can leave only when F-35s arrive: three years after joining the fighter-jet coalition, no Belgian aircraft had been delivered, and the 2024 pledge of 30 jets by 2028 has
    shrunk to seven in 2026.'
  it: ''
- hash: 05220ca7
  kind: cards
  en: Moral leadership on Congo cost the influence to use it. Belgium led the EU call for sanctions on Rwanda and suspended aid in early 2025; Kigali expelled its diplomats within 48 hours (March 2025)
    and the Washington and Doha processes went on with Qatar and the US as brokers, while Prevot warned that adding another agreement would not stop the bloodshed. Eighteen months later Belgium restores
    ties (22 Sep 2026) without having changed the facts in the Kivus, and with Qatar as the broker.
  it: ''
- hash: 7c01a29d
  kind: cards
  en: 'A sanctioning port that leaks. Antwerp is the capital of the diamond trade and Zeebrugge the Belgian gate for Russian LNG: the Russian diamond ban (2024) pushed dealers to Dubai rather than ending
    the trade, Zeebrugge was the top EU importer of Russian LNG cargoes in the first half of 2026 (Belgian imports reportedly fell to zero in August, ahead of the EU ban from 1 Jan 2027), and Russia''s
    cash is both frozen in Brussels and replenished at Belgian quays.'
  it: ''
- hash: 88f72ee1
  kind: cards
  en: A firmer line on China from the prime minister, a Chinese backbone in the ports. De Wever asks the Commission to harden its stance on Chinese trade practices, while COSCO runs the Zeebrugge container
    terminal, Alibaba's Cainiao has its European e-hub at Liege and some 400 Belgian companies have Chinese majority owners; Huawei is at the centre of the bribery probe that Belgian prosecutors opened
    on the European Parliament in March 2025.
  it: ''
- hash: 72fa6420
  kind: cards
  en: The conditional formula pleased no one. Belgium announced recognition of Palestine at the UN in September 2025 but tied the royal decree to the release of the last hostage and the exclusion of Hamas
    from government, which left the act in the hands of Hamas and Israel; a year later it had still not been signed, while the sanctions that were national and unconditional (entry bans, settlement-goods
    ban) took ten months to reach the cabinet. Belgium has the cost of the announcement without the credit of an act done.
  it: ''
- hash: '83595628'
  kind: cards
  en: 'Belgium is a small power whose geography made it a host: the seat of the European

    institutions and of NATO, the port of Antwerp, and the Euroclear depository that

    keeps the greater part of Russia''s frozen reserves. Its grand strategy is the

    strategy of a host that must stay useful to everyone who matters and exposed to

    none of them. That works while the host''s guests agree; in 2025-26 they stopped

    agreeing, and the host has been made to choose in public. The Euroclear file is the

    clearest case in Luttwak''s terms: a defensive refusal, motivated by fear of

    liability, which gave Belgium the opposite of what it wanted (the loss of

    influence among partners, a Russian pressure campaign that no EU decision

    has lifted, and an indefinite freezing it can no longer veto).


    The second thread is a late and under-funded rearmament. The F-35 decision, the

    NASAMS purchase and the French nuclear-deterrence opening all point the same way,

    but the 2% is a floor and the 3.5% an unfunded promise, and the F-35 delivery

    schedule holds back the F-16s promised to Kyiv. The third is the empire''s

    afterimage: in Congo, Rwanda and Burundi Belgium speaks with moral authority and

    little leverage, and each time it has used the one (sanctions, a public stance)

    it has paid in the other. Non-events matter here: Belgium sent one officer, not

    troops, to Greenland (January 2026) and did not join the eight NATO states hit by

    Trump''s tariff threat; it signed the New York Declaration on Palestine and has not

    yet signed the decree.'
  it: ''
- hash: 37d495b9
  kind: cards
  en: Keep the succession inside Talon's coalition. Romuald Wadagni, his finance minister, won the April 2026 presidential election in the first round with about 94% (provisional), since Talon was barred
    by term limits. The main opposition party fielded no candidate, and the January 2026 parliamentary vote gave Talon's two allied parties all 109 seats in the National Assembly.
  it: ''
- hash: 98e05676
  kind: cards
  en: Keep the north and the Niger corridor open. Jihadist attacks from Burkina Faso killed dozens of Beninese soldiers in 2025, and the Niger pipeline's outlet at Sèmè-Kpodji depends on the border. Benin
    enforced ECOWAS sanctions on Niger after the 2023 coup; on 2 June 2026 President Wadagni went to Niamey, and both leaders agreed an expert committee, given 15 days, to prepare the border's reopening.
  it: ''
- hash: 9abbaeb5
  kind: cards
  en: The army is the front against JNIM in the north. ACLED counts at least 88 military personnel killed in the first four months of 2025, more than the total it reports for 2024. A 2022-23 agreement with
    Rwanda covers coaching and training; no Rwandan deployment is confirmed.
  it: ''
- hash: ae9762e4
  kind: cards
  en: The coastal outlet and the pipeline as leverage. The Sèmè-Kpodji terminal carries Niger's crude, and in May 2024 Benin blocked Niger's crude loading until Niger reopened its side of the border, as
    reported. The closure that followed disrupted trade on a major West African transit corridor, so the leverage also costs Benin.
  it: ''
- hash: b417eee4
  kind: cards
  en: Its border is also its trade route. The Niger border has been shut since the July 2023 coup, and Niamey kept it closed even after ECOWAS lifted its sanctions. The closure disrupted trade on a major
    West African transit corridor.
  it: ''
- hash: 549d683b
  kind: cards
  en: It cannot hold power without outside force. In the failed coup attempt of December 2025, when soldiers seized state television, loyalist forces reversed it within hours with Nigerian airstrikes and
    ECOWAS support (reported).
  it: ''
- hash: 2b17c807
  kind: cards
  en: Benin squeezed Niger over the pipeline and the border, and in June 2026 it reopened talks because jihadist violence on both sides of the border made the squeeze costly. A June 2026 analysis reads
    the jihadist threat as at least as much a cause of the thaw as economic need.
  it: ''
- hash: 29917ed7
  kind: cards
  en: 'Benin''s grand strategy is to hold a Talon-backed succession at home and to keep its north and its oil and transit outlet open against a jihadist belt that now reaches from Burkina Faso. It treats
    Niger as a rival it can squeeze with the border and the pipeline, and it reopens to Niger when the jihadist threat makes the squeeze costly, which is the paradox of the 2026 thaw. France and Rwanda
    are security partners it needs but cannot lean on openly: the French link is under street pressure, and the Rwandan training is confirmed only as an agreement from 2022-23.'
  it: ''
- hash: 6589d16c
  kind: cards
  en: 'Build a sovereign bloc outside ECOWAS and French influence: Burkina Faso, Mali and Niger turned their backs on ECOWAS in January 2024 and signed a pact in July 2024 to form their own confederation,
    the Alliance of Sahel States.'
  it: ''
- hash: 38924d9d
  kind: cards
  en: Contain JNIM in the north and centre of the country. The JNIM attack on Barsalogho in August 2024 killed up to 200 people, and the junta condemned it without giving a soldier casualty figure.
  it: ''
- hash: 8d9b9237
  kind: cards
  en: Turn gold into state revenue. In June 2025 the state completed the takeover of five gold assets (two operating mines and three exploration licences held by Endeavour and Lilium subsidiaries), placed
    in SOPAMIB, its state-owned mining vehicle.
  it: ''
- hash: ddffc74a
  kind: cards
  en: Russian Africa Corps instructors and a contingent that Africa Corps itself put at about 100 men, flown in during 2024 to guard the head of state and train Burkinabe troops. Burkina did not confirm
    the deployment. The army is the regime's base and the instrument against JNIM.
  it: ''
- hash: ec48003b
  kind: cards
  en: Gold, nationalised in part. The state took over five gold assets in June 2025 and officials said further nationalisation would bring the state more income; Burkina is Africa's fourth-largest gold
    producer (more than 57 t in 2023, Reuters). The mining code was revised in 2024, as in Mali and Niger.
  it: ''
- hash: 3c9fdfab
  kind: cards
  en: The army cannot hold the rural north and centre against JNIM. The Barsalogho attack of August 2024 and the use of Burkinabe provinces as staging grounds for raids into Benin (ACLED) show the reach
    of the armed group.
  it: ''
- hash: 24eac806
  kind: cards
  en: Few formal channels are left. Burkina has left ECOWAS (2024) and cut diplomatic relations with France (26 June 2026), so its formal ties now run through the Alliance of Sahel States, Russia and its
    neighbours, with Ghana and Côte d'Ivoire the two it deals with most, one by security pact and one by open accusation.
  it: ''
- hash: ab3cbd4a
  kind: cards
  en: Taking the mines into state hands to capture more of the gold rent alarmed the Western investors whose capital the mines need. Reuters names IAMGOLD, Nordgold and West African Resources among the
    companies affected.
  it: ''
- hash: 0e0b3924
  kind: cards
  en: Russian units sent in 2024 to protect Traoré personally, by Africa Corps' own account, put part of the foreign security effort around the head of state while the army fights JNIM in the field. The
    protection of the regime and the defence of the territory compete for the same troops.
  it: ''
- hash: 60dcd211
  kind: cards
  en: 'Burkina Faso''s grand strategy is sovereignty by rupture: it has left ECOWAS and France, built a confederation with Mali and Niger, and taken Russian instructors to guard the regime while the state
    takes over the gold mines to pay for the war. The ruptures buy autonomy at the cost of the channels that once held its security and its capital, and the mine takeover frightens the investors that the
    mines need. The war against JNIM is the test that the sovereignty doctrine has not yet passed, and this card rests on 2024 to mid-2026 sources without verified 2026 battlefield data, so the transition
    timetable and the 2025 US aid cut are not confirmed here.'
  it: ''
- hash: e7b98e87
  kind: cards
  en: 'Consolidate the post-uprising order: an elected BNP government with a two-thirds majority (212 of 297 declared seats on 12 Feb 2026, Jamaat''s alliance 77, turnout 59.88%), the July Charter reforms
    approved by referendum the same day (about 68% yes), the Awami League kept out of politics (activities banned under the Anti-Terrorism Act on 10 May 2025, registration suspended 12 May) and Sheikh Hasina
    brought to justice (death sentence in absentia, 17 Nov 2025).'
  it: ''
- hash: 0cfe24bf
  kind: cards
  en: 'Keep the garment-export economy alive through graduation from least-developed-country status on 24 Nov 2026: EU duty-free access holds to 2029 and then depends on GSP+ or a free-trade agreement;
    the US tariff was cut to 19% in the 9 Feb 2026 reciprocal deal; an IMF programme (about USD 3.64bn disbursed) is being replaced by a new USD 4.5-5bn package.'
  it: ''
- hash: acb22e86
  kind: cards
  en: Reset the relationship with India on terms of equality - the Ganges Water Treaty (expires December 2026), the unsigned Teesta accord, the end of border killings, the lifting of the May-June 2025 Indian
    import restrictions, visas, Hasina's extradition - without losing Indian electricity, diesel, fertiliser and transit on which the economy runs. Dhaka's line is 'Bangladesh First', based on sovereign
    equality.
  it: ''
- hash: 55fb1fd6
  kind: cards
  en: 'Diversify patrons so that no single power can set the terms: Chinese finance and arms (Teesta, Mongla, Anwara, J-10CE), a Pakistani opening, Turkish defence industry, Japanese ports, American market
    access, Gulf and Malaysian labour markets. The post-2024 reading of the Hasina years is that India held ''a blank cheque'' in Dhaka; the aim is to end that without handing it to Beijing.'
  it: ''
- hash: 0fd282d0
  kind: cards
  en: 'Move the Rohingya burden: about 1.2 million refugees in Cox''s Bazar (nine years after 2017), repatriation stalled (Myanmar verified 308,797 of 828,824 names in August 2026), the UN appeal shrinking
    from USD 934m to USD 710.5m. Rahman''s five-point plan was put to the UN on 23 Sep 2026: voluntary-return roadmap, end of violence in Rakhine, predictable funding, accountability, regional action against
    trafficking and scam networks.'
  it: ''
- hash: 3d370f25
  kind: cards
  en: 'Make the country a connector of the Bay of Bengal rather than a cul-de-sac: BIMSTEC chair since 4 Apr 2025, Matarbari deep-sea port with Japan, Mongla and Chattogram with China, Nepali hydropower
    (40 MW) and Bhutanese hydro over Indian grid, and labour markets abroad that already send USD 35.6bn a year in remittances.'
  it: ''
- hash: 3ef6db5d
  kind: cards
  en: '''Bangladesh First'' equidistance: Rahman''s first trip abroad was Malaysia (22 Jun 2026) then China (Dalian, Beijing, 23-26 Jun), India''s invitation was declined on 10 Sep 2026 when it came through
    the BIMSTEC chair, and Dhaka holds the Hasina extradition file as its main card with New Delhi. The BIMSTEC chair (to 2027) and the UN Rohingya side event of 23 Sep 2026 give it a regional and a multilateral
    stage.'
  it: ''
- hash: a1861949
  kind: cards
  en: 'Narrative control over the uprising and the trial: the death sentence on Hasina is presented as justice for the July 2024 killings, Indian claims of 2,900 attacks on minorities are called ''inaccurate,
    exaggerated or motivated'' (28 Dec 2025), and border killings by India''s BSF are pressed in the press and by rights groups (ASK, Odhikar) as a sovereignty issue.'
  it: ''
- hash: 83dd1011
  kind: cards
  en: 'Arms diversification, not alliance: 20 Chinese J-10CE fighters (about USD 2.2bn, committee formed April 2026), JF-17 talks with Pakistan (16-24 aircraft reported, ''rudimentary'' per the Bangladeshi
    military), Turkish T129 helicopters and Hisar-O+ air defence (reported USD 600m), a CETC drone facility in Dhaka (Jan 2026) and the Chinese-built Pekua submarine base - while still running the Bongosagar
    exercise with the Indian Navy and accepting US help to modernise (ambassador Christensen, Feb 2026).'
  it: ''
- hash: 76d995e5
  kind: cards
  en: 'The export machine and the diaspora are the currency: garments earned USD 38.7bn of USD 48.0bn merchandise exports in FY2025-26, remittances reached a record USD 35.59bn (Saudi Arabia 5.85, UK 5.07,
    UAE 4.58, Malaysia 3.40, US 3.01), and purchase pledges to Washington (wheat, soy, LNG, 14 Boeing aircraft for USD 3.7bn) were traded for tariff relief.'
  it: ''
- hash: 37f92a16
  kind: cards
  en: 'Geography: India surrounds the country on three sides along a 4,096 km border (about 3,271 km fenced), controls the upstream of the Ganges and Teesta and the grid and pipelines through which Bangladesh
    buys power (India''s share in the power mix hit a record 15.6% in 2025; Adani''s Godda plant alone supplied 8.2%), diesel, fertiliser and the transit to Nepal and Bhutan. The 22 km Siliguri Corridor
    makes every Chinese project in the north a security issue for Delhi.'
  it: ''
- hash: 043f7483
  kind: cards
  en: 'A one-sector economy: garments are more than 80% of merchandise exports (USD 38.7bn in FY26, down 1.64%), about half of them to the EU, a fifth to the US; preferential access ends with LDC graduation
    on 24 Nov 2026 (EU transition to 2029, then GSP+ with tougher labour and origin rules), and the US tariff rests on an executive deal whose legal base, IEEPA, the Supreme Court annulled on 20 Feb 2026.'
  it: ''
- hash: 6b3e059d
  kind: cards
  en: 'Fragile external accounts: gross reserves about USD 27.3bn (USD 22.2bn on the IMF definition) in June 2026, a cap of USD 8.44bn on new external borrowing in FY2026, the IMF withholding a tranche
    of about USD 1.3bn in April 2026 over revenue, exchange-rate and banking reforms, and a new three-year package being negotiated.'
  it: ''
- hash: dcfa3ed1
  kind: cards
  en: 'The Rohingya: 1.2 million refugees who cannot be returned without Myanmar''s junta and the Arakan Army, which holds the whole 271 km Myanmar side of the border since December 2024; Min Aung Hlaing
    ties return to a rollback of international legal cases, and donor money is falling. Dhaka has to refuse a ''humanitarian corridor'' (Yunus, June 2025) that would make it party to the Rakhine war.'
  it: ''
- hash: b3f9fb06
  kind: cards
  en: 'Climate: the World Bank projects 13.3 million internal climate migrants and the loss of a third of agricultural GDP by 2050, with cyclone damage near USD 1bn a year; the rivers that bring this water
    arrive from India, which turns a physical vulnerability into a diplomatic one.'
  it: ''
- hash: 9585f895
  kind: cards
  en: 'Domestic legitimacy: an election without the Awami League (the party of the previous 15 years, banned), a Jamaat-led opposition of 77 seats that favours Pakistan and ''vigilance'' toward the BNP,
    a July Charter whose 48 constitutional amendments not all parties accepted, and an Indian narrative of minority persecution that the government has to answer.'
  it: ''
- hash: 6b1d3a07
  kind: cards
  en: The extradition demand is the lever that blocks the reset it is meant to win. Dhaka's central ask of India is Hasina; India answers that the request is 'under examination' (17 Apr, 17 Jul, 12 Aug
    2026), the extradition treaty has a political-offence exception, and her virtual press conference of 5 Aug 2026 ('I will return') led Dhaka to stall Rahman's first visit. The Ganges treaty that lapses
    in December and the Teesta accord wait for that visit.
  it: ''
- hash: 39f3f2e0
  kind: cards
  en: Courting China to gain leverage over India triggers the Indian leverage that hurts most. After Yunus's Beijing visit (27-29 Mar 2025) and his remarks on the north-east, India withdrew transhipment
    rights (9 Apr 2025), restricted garment and food imports to two seaports (17 May) and barred jute and woven fabric by land (June) - about USD 770m of trade - while Dhaka's Teesta, Mongla and J-10CE
    files keep the Siliguri fear alive.
  it: ''
- hash: cf19af95
  kind: cards
  en: The US trade deal buys tariff relief with commitments that collide with the other bet. The 9 Feb 2026 agreement (19% tariff, about USD 3.5bn of farm purchases, USD 15bn of energy over 15 years, 14
    Boeing aircraft) limits purchases from countries the US sees as threats and Trump's 18 Feb letter pressed Dhaka for defence accords (GSOMIA, ACSA), while the same government finalises 20 Chinese J-10CE
    jets; and the 19% rate itself rested on IEEPA, struck down on 20 Feb 2026, so Dhaka paid in advance for a tariff that no longer had a legal base.
  it: ''
