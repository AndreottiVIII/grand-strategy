# Translate every `en` into it. Write the translations to the file cards-15.out.yaml next to this one,
# as `items:` of `- hash: <same hash>` / `it: <translation>`, appending one item at a time (valid YAML at
# every step), never editing this file. Keep names, dates, numbers and quotes; register of a foreign-office
# brief: dry, precise, no flourish.
lang: it
items:
- hash: 9fe181c5
  kind: cards
  en: 'The ultimate guarantor is also a source of insecurity: Norway depends on US P-8s, F-35s and Article 5, while Trump threatened a tariff wave in January 2026 on countries backing Denmark over Greenland
    (Norway included), told Støre he no longer felt obliged to think ''purely of peace'' after the Nobel Prize went elsewhere, and faces a US tariff on its goods (15% announced in April 2025 and the rate
    on the table in July 2025; the rate in force was not confirmed).'
  it: ''
- hash: 8d553080
  kind: cards
  en: 'A minority government on borrowed votes: Labour won 53 seats (28%) on 8 Sep 2025 and needs four smaller left parties (87 seats together) for every budget; the 2026 budget nearly fell in December
    2025 over oil phase-out and the fund''s Israel holdings, and the Progress Party (about 24%) is the main opposition.'
  it: ''
- hash: 43fd6cf3
  kind: cards
  en: 'The fund cannot be used as a weapon: more than 15% of its equity is in seven large US technology groups, the Storting froze ethics exclusions in Nov 2025 after the State Department called the Caterpillar
    decision ''based on illegitimate claims'', and Støre ruled out using the fund as a guarantee for the EU reparations loan.'
  it: ''
- hash: e671b1aa
  kind: cards
  en: 'Outside the EU by vote, inside it by law: the EEA gives full single-market access without a seat at the table, and support for membership stays below opposition (37% yes, 49% no in an August 2026
    poll; 38% yes, 48% no in February). Norway has refused membership twice (1972, 1994).'
  it: ''
- hash: a99faf53
  kind: cards
  en: 'Small industry and long delivery times: submarines in 2029, frigates in 2030 and 2032, long-range air defence acquisition from 2029; the government itself delayed anti-ballistic air defence and maritime
    surveillance drones in March 2026 despite the extra money.'
  it: ''
- hash: 556117c2
  kind: cards
  en: Europe's gas station is also its target. The more Norway fills the gap left by Russia (31% of EU gas imports in 2025, up from 24% in 2021), the more its platforms, pipelines and cables become what
    the Intelligence Service says Russia would spy on or sabotage, and the more it has to spend on defence of infrastructure it cannot hide.
  it: ''
- hash: 9908d3fe
  kind: cards
  en: A war funded by the war. Norway's Ukraine money (NOK 85bn a year) comes out of an oil-and-gas income inflated by the Russian invasion, which brings the 'war profiteer' charge and pressure to put the
    sovereign fund behind the EU reparations loan; giving more raises the pressure to give still more.
  it: ''
- hash: 62678dac
  kind: cards
  en: Enforcing the law in Svalbard tests the treaty it protects. A Norwegian court seized the Russian state vessel Professor Molchanov at Barentsburg (2 Sep 2026) to satisfy Naftogaz's USD 4.22bn award,
    and Putin called it 'state terrorism'; Moscow now says Russians on Svalbard live under 'blockade' and a Treaty breach, giving it the pretext Oslo has worked a century to deny.
  it: ''
- hash: 1bc6c829
  kind: cards
  en: An ethical fund held hostage by its own size. The exclusion of Caterpillar and Israeli banks drew a US rebuke; the next candidates (Amazon, Microsoft, Alphabet) are too large to sell without hurting
    the fund that pays for the welfare state, so the Storting suspended the council's work in Nov 2025. Norway's moral instrument is disarmed exactly when it starts to bite.
  it: ''
- hash: 5b62e64b
  kind: cards
  en: Hedging against Washington with Washington's equipment. Greenland, the Nobel dispute and tariffs push Norway toward London, Berlin and Brussels (Type 26, Type 212CD, the EU partnership), yet every
    flank still rests on US-built P-8s, F-35s and US reinforcement, so the new pillars add capacity without removing the old dependency.
  it: ''
- hash: 5ce6396c
  kind: cards
  en: Reassurance requires visibility. Cold Response, Arctic Sentry and prepositioned US equipment deter, but they feed the Russian story of NATO militarisation of the Arctic and of the Svalbard Treaty,
    while Norway's own policy is to tell Moscow (at the OSCE, in person) that its exercises are transparent and defensive.
  it: ''
- hash: a81050e7
  kind: cards
  en: 'Norway runs the strategy of a rich small state on the edge of a hostile great power: its security is borrowed from the Atlantic alliance, its wealth comes from the thing Europe needs most, and both
    are now wielded under pressure. Since 2022 it has turned its income into the three things it can use: gas for Europe''s grid, the Nansen programme for Ukraine, and a defence budget heading for 3.5%
    of GDP. The classic Luttwakian pattern is that each lever works against the next: gas and the fund make Norway central and rich, but also a target and, for Washington, an object to press (tariffs, the
    fund''s ethics, the Greenland episode). In response it is pluralising its guarantors (UK frigates and Lunna House, German submarines, the EU defence partnership, Nordic integration with Sweden and Finland),
    while remaining dependent on US aircraft and US reinforcement. With Russia the policy is firm and unromantic: sanctions, public naming of GPS jamming and espionage, but also a fisheries regime and a
    Svalbard Treaty that Oslo wants to keep working. The seizure of the Professor Molchanov on 2 Sep 2026 shows the limits of that dual policy; it will be tested next by the Russian appeal and by how far
    Moscow pushes Svalbard. Domestically the Støre minority government depends on left parties whose priorities (oil phase-out, divestment from Israel) cut across the fund and the energy exports that give
    Norway its influence; the 2027 budget will test it again. Two signals that are not rows: Norway refused a seat on the Board of Peace on principle, and its Arctic Council chairship ended in May 2025
    with Russia still excluded from political dialogue, so the forum Norway invested in is now under Danish-Greenlandic stewardship in the middle of the Greenland dispute. Gaps: the rate of the US tariff
    now in force, the US Marine rotation (only prepositioning and exercises are sourced), the 2024-25 restrictions on Chinese investment (no source found; only Security Act screening, the Telenor-Huawei
    decision of 2019 and the 2026 threat assessments are documented), and the US share of the fund''s equity.'
  it: ''
- hash: c1ed4da2
  kind: cards
  en: 'Turn hydropower into the main export and revenue line, with India as the buyer: 1,011 MW approved for export to India in July 2026, a 10,000 MW agreement over ten years, and a government roadmap
    of about 15,000 MW exported to India and Bangladesh by FY2034/35.'
  it: ''
- hash: a2ab0fe6
  kind: cards
  en: 'Hold the Lipulekh, Kalapani and Limpiyadhura claims: the 2020 official map that Parliament endorsed, and protests against the India-China trade route through Lipulekh (August 2025, and again in 2026).
    India rejects the claims as ''unjustified cartographic assertion''.'
  it: ''
- hash: 79d5f3d4
  kind: cards
  en: 'Finance the infrastructure it lacks without debt it cannot carry: Chinese money under the BRI (ten projects to be expedited after the December 2024 framework) and the US MCC compact (USD 500m for
    a 400kV transmission line and roads), both on grant terms that Beijing and Washington have each tested.'
  it: ''
- hash: 052b9bea
  kind: cards
  en: 'Multi-alignment rather than a single patron: deals and visits with India, China, the US, the EU and the UK, with a stated aim of ''strategic autonomy''. Balendra Shah''s government followed a June
    2026 foreign-minister visit to Delhi that reaffirmed cooperation while Lipulekh stayed contested.'
  it: ''
- hash: 682e9a64
  kind: cards
  en: 'Export earnings from water and labour: electricity sold to India (Rs 29.32bn in the last fiscal year, per the Kathmandu Post) and migrant workers in the Gulf, Malaysia, Japan and South Korea, whose
    remittances the World Bank puts at about a quarter of GDP.'
  it: ''
- hash: 790e0c73
  kind: cards
  en: 'Gurkha recruitment as leverage: Nepali soldiers serve in the Indian and British armies under the 1947 tripartite agreement; Kathmandu asked India to postpone recruitment rallies after Agnipath (2022),
    which it argues falls outside that treaty, and it asks Russia to stop recruiting its citizens.'
  it: ''
- hash: 068ce50e
  kind: cards
  en: 'Geography and India''s grid: landlocked between India and China, Nepal''s trade, fuel and power run through India, and transmission lines, not generation, cap the export volumes (India''s approval
    is 1,011 MW; Bangladesh''s deal is 40 MW a year, its 20 MW expansion held back by India''s transmission limits).'
  it: ''
- hash: c6ccb466
  kind: cards
  en: 'Tibet and the northern border: China presses Kathmandu to restrict Tibetan refugees and their passage to India; the policy is reported, but the sources are undated or advocacy pieces, so the point
    is tier 4 and the confidence is low.'
  it: ''
- hash: facf7b03
  kind: cards
  en: 'Fragile growth: remittances are about a quarter of GDP (the Gulf takes most workers), the 2015 earthquake needed donor pledges of around USD 3bn led by India and China, and floods on the Trishuli
    River have delayed the MCC transmission project.'
  it: ''
- hash: 25c95e1b
  kind: cards
  en: 'Domestic legitimacy after the uprising: the Gen Z protests of September 2025 (social-media ban, parliament set on fire, 76-77 killed) brought down Oli; the interim government under Sushila Karki
    ran to the 5 March 2026 election, won by the RSP (182 of 275 seats) under Balendra Shah, sworn in on 27 March 2026. A government in its first year, with a new mandate and no coalition history, has little
    room to trade away claims or to take on new loans (inference: confidence B on the facts, the consequence is our reading).'
  it: ''
- hash: 5786cf0e
  kind: cards
  en: 'Its own claims raise the cost of the power trade it needs: the Lipulekh and Kalapani map gives India a reason to resist, while India is the only buyer large enough to make the hydropower roadmap
    work.'
  it: ''
- hash: aeca5566
  kind: cards
  en: Nepal is a landlocked hedger between India and China, and its grand strategy has been to get paid for its water and its people while keeping its border claims alive. The September 2025 Gen Z uprising,
    which brought down Oli and put Sushila Karki in charge of a six-month interim, ended with the March 2026 election, won outright by the Rastriya Swatantra Party (182 of 275 seats) and its prime minister
    Balendra Shah. The new government has to show that the India-China balance survives its own warmer reset with Delhi and the Lipulekh friction, and that the power and labour economy can carry the state
    through the next earthquake or flood.
  it: ''
- hash: cb0fe405
  kind: cards
  en: Live on Australian money. The December 2024 treaty brings A$100m for the budget and A$40m for policing and security over five years, and the Regional Processing Centre adds payments under the August
    2025 memorandum on people from Australia's NZYQ cohort.
  it: ''
- hash: 26d798e1
  kind: cards
  en: Turn the seabed into revenue. Nauru sponsors Nauru Ocean Resources Inc. (NORI), the exploration subsidiary of The Metals Company, in the Clarion-Clipperton Zone, under a revised agreement that promises
    Nauruans a share of any future benefit. The commercial step waits on International Seabed Authority rules that are still unfinished.
  it: ''
- hash: 9b63d475
  kind: cards
  en: Recognition as currency (diplomatic). Nauru severed relations with Taipei on 15 January 2024, two days after the Taiwan election, and restored them with Beijing on 24 January 2024, leaving Taipei
    with three Pacific allies.
  it: ''
- hash: 6fc15044
  kind: cards
  en: The Regional Processing Centre as the economy and the lever (economic). Australia pays Nauru to host its asylum-seeker processing; the August 2025 memorandum extends that to people from the NZYQ cohort.
    Seabed sponsorship is the second, slower lever, and the only one outside Canberra's hands.
  it: ''
- hash: b9d560c8
  kind: cards
  en: Canberra's veto. The December 2024 treaty requires mutual agreement for any engagement in Nauru's security, banking and telecommunications sectors, so Nauru cannot take a third-party security or banking
    deal without Australia's consent.
  it: ''
- hash: f2d7e3da
  kind: cards
  en: The seabed rules are not written. Commercial sponsorship depends on the ISA's exploitation rules; the ISA delayed them in July 2026 while extending NORI's exploration contract, and the Seabed Disputes
    Chamber of the International Tribunal for the Law of the Sea issued provisional orders in the dispute over the company's compliance.
  it: ''
- hash: f04bbb41
  kind: cards
  en: 'The switch bought a second patron, and the treaty capped it. The January 2024 move to Beijing was followed by a treaty that gives Australia an effective veto over any Chinese role in Nauru''s security,
    banking and telecoms: the price of the new tie was a ceiling set by the old patron.'
  it: ''
- hash: a7cc321b
  kind: cards
  en: Nauru has a small economy, and its budget and its migration business come from Canberra; its one lever outside Australia is the seabed sponsorship, which waits on rules the International Seabed Authority
    has not written. The January 2024 switch from Taipei to Beijing shows that recognition is sold to whoever pays, but the December 2024 treaty capped the new patron by giving Australia a veto over security,
    banking and telecoms. Nauru therefore sells to several buyers while Canberra keeps the veto, and the Regional Processing Centre is at once its economy and its lever.
  it: ''
- hash: ea4fcbec
  kind: cards
  en: 'Survive as an armed organisation with its weapons. Hamas accepted the Board of Peace roadmap on 30-31 Jul 2026 and says it will hand heavy weapons to a Palestinian authority, but it rejects the disarmament
    clause as written: the 3 Apr 2026 framework (a gradual handover over eight months tied to IDF withdrawal) was largely refused in May and countered with a handover that ends in a Palestinian state. Disarmament
    has not begun.'
  it: ''
- hash: b65a364b
  kind: cards
  en: 'Stay a political actor in Gaza after it stops being its administrator: hand civil government to a technocratic body (the National Committee for the Administration of Gaza, 15 members under Ali Shaath,
    still waiting in Cairo) and announce the dissolution of its own government (6 Jul 2026), while keeping its security apparatus, its police and its social networks. It accepted a technocratic body already
    on 3 Oct 2025.'
  it: ''
- hash: 29b240f9
  kind: cards
  en: 'End the war on its own terms: a permanent ceasefire, full Israeli withdrawal from the Yellow Line (Israel holds about 60% of the Strip in Oct 2026), the reopening of Rafah, 600 aid trucks a day and
    reconstruction - and the claim that Palestinians ''defeated'' Israel''s war aims.'
  it: ''
- hash: a00d2cdb
  kind: cards
  en: 'Replace the PLO and the Palestinian Authority as the representative of the Palestinians: the Beijing Declaration of 23 Jul 2024 (14 factions, a transitional unity government), a bid to join the PLO,
    a national bloc with Democratic Reform (Dahlan), Islamic Jihad and the PFLP for the legislative elections that Abbas postponed on 10 Oct 2026 to Sep 2027.'
  it: ''
- hash: 1b76de3a
  kind: cards
  en: 'Keep a safe leadership base abroad and a patron network that outlives the Gaza fighting force: the political bureau in Doha (since 2012), Istanbul, Cairo; Khalil al-Hayya, elected head of the bureau
    on 20 Jul 2026 against Khaled Meshaal, runs both the negotiation and the foreign relations.'
  it: ''
- hash: ebeaf52f
  kind: cards
  en: 'The standing aim: ending Israel and ''expelling the occupation'' from all of historic Palestine. Hayya hailed 7 Oct as a ''military accomplishment'' on 15 Jan 2025 and said in Apr 2024 that a state
    on the 1967 lines would only be a temporary stage, since Palestinians keep their ''historic right to all Palestinian lands''.'
  it: ''
- hash: 95ae3238
  kind: cards
  en: 'Mediated bargaining through Qatar, Egypt and Turkey (guarantors of the 9-10 Oct 2025 Sharm el-Sheikh deal) and direct channels to Cairo (Hayya-Rashad) and, once, to Washington (Adam Boehler in early
    2025). Its replies are always ''yes, but'': the 3 Oct 2025 answer accepted hostages and a technocratic body and left out disarmament; the 30-31 Jul 2026 answer accepted the roadmap and tied it to Israeli
    withdrawal.'
  it: ''
- hash: 90ce2ce5
  kind: cards
  en: 'Messaging through Al Jazeera and Hamas spokesmen (Hazem Qassem, Basem Naim, Abu Obeida): victory claims for each ceasefire, denunciation of the Board of Peace as ''alignment with the Zionist position''
    (UNRWA, Sep 2026), and the 7 Oct framing as ''Al-Aqsa Storm''.'
  it: ''
- hash: 14f119f2
  kind: cards
  en: 'A degraded but surviving Qassam force: it redeployed across the zones Israel left within hours of the 10 Oct 2025 ceasefire and moved against Israel-backed militias and clans; the tunnels remain
    ''the most important weapons'' (the Popular Forces militia started destroying them in Feb 2026) and Mladenov told the Security Council on 26 Aug 2026 that ''every tunnel still worked on'' sets the process
    back.'
  it: ''
- hash: b6f4244c
  kind: cards
  en: 'Internal coercion as a way to assert authority: public executions of alleged collaborators (19-22 Sep and 13 Oct 2025, about 33 killed by mid-October according to the index source), clashes with
    the Doghmush and Abu Werda clans and with the Popular Forces, then a pause in public executions on 21 Oct 2025 to deny Israel a pretext.'
  it: ''
- hash: 8f3e7f3b
  kind: cards
  en: Qatari money (Netanyahu says the funds he let in were about 2% of what entered Gaza; Qatar denies they fed the 7 Oct plot) plus the leverage of the hostages - all 20 living hostages were freed on
    13 Oct 2025 and the remains of the dead returned over the following weeks, the largest bargaining chip Hamas has now spent.
  it: ''
- hash: bcd38e0a
  kind: cards
  en: 'Israel''s military hold and its right to strike: the Yellow Line has been pushed from about 53% (Oct 2025) to about 60% of the Strip, the IDF killed 1,481 Palestinians in the ceasefire year by Gaza''s
    count, and since September 2026 it has stepped up the killing of commanders (al-Beik on 29 Sep, the strike on Gaza''s de facto chief Ali al-Amoudi on 2-3 Oct). Netanyahu says Israel will not withdraw
    until Hamas disarms.'
  it: ''
- hash: 64a22084
  kind: cards
  en: 'Decapitation and attrition: Haniyeh (Tehran, 31 Jul 2024), Mohammed Deif, Yahya Sinwar (16 Oct 2024), Mohammed Sinwar (2025), Abu Obeida (Aug 2025) and a stream of brigade commanders; the Doha strike
    of 9 Sep 2025 killed Hayya''s son and his office director and showed that no capital is safe. Leadership now rests on an elected head in Doha and a Gaza chief whose election was suspended in dispute.'
  it: ''
- hash: 9cfbc113
  kind: cards
  en: 'Dependence on mediators who are themselves squeezed: Qatar was bombed and apologised to by Netanyahu under Trump''s pressure, Turkey is barred by an Israeli veto from the stabilisation force, Egypt
    wants Hamas out of power in Gaza and holds the Rafah door. Each can sell the bargain Hamas wants only if it also delivers the disarmament.'
  it: ''
- hash: 0382f4bd
  kind: cards
  en: 'A patron in decline: the 2026 war on Iran, the death of Khamenei and the collapse of the Assad corridor leave Tehran short of money and weapons for allies; analysts speak of a decentralised axis
    relying on local constraints, and the Houthis and Hezbollah are consumed by their own wars.'
  it: ''
- hash: b9b3d20b
  kind: cards
  en: 'Eroding popular support and a ruined society: PCPSR''s Poll 97 (5-8 Aug 2026) reports that Hamas has lost substantial support although most Palestinians still reject disarming before Israeli withdrawal;
    the IPC projects 1.4 million people facing hunger and only about 227 aid trucks a day reach Gaza against a target of 600.'
  it: ''
- hash: 540f57f4
  kind: cards
  en: 'Internal division at the top: Hayya (close to Iran, ''armed conflict until withdrawal'') beat Meshal (closer to Qatar, compromise) in a run-off of the Shura Council, after the 2025 acting five-man
    council; the Gaza chief election (Amoudi against Awadallah) stalled with blank ballots and a challenge to the vote.'
  it: ''
- hash: fedeb7b6
  kind: cards
  en: 'The attack that destroyed the attacker''s base changed the strategic map. 7 Oct 2023 cost Hamas its government, most of its commanders and half of Gaza, yet it put the Palestinian question back at
    the centre: a wave of recognitions of Palestine in Sep 2025 (Portugal on 21 Sep, Belgium announced on 2 Sep, the UK upgrading its mission to an embassy on 5 Jan 2026) came with strings (Belgium made
    its royal decree conditional on the release of the last hostage and the exclusion of Hamas from government). The movement that brought the question back is the one the recognisers keep out of the settlement.'
  it: ''
- hash: ac854a6f
  kind: cards
  en: The weapons that keep Hamas alive keep Israel in. Refusing to disarm preserves its leverage and the loyalty of its fighters, but it gives Netanyahu the reason not to withdraw from the Yellow Line
    (60% of the Strip), keeps the stabilisation force from deploying (no troops by Oct 2026) and keeps the technocratic committee out of Gaza; the longer it holds the guns the less territory it has to rule.
  it: ''
- hash: e355183f
  kind: cards
  en: Reasserting order undermines the handover it signed. Executions, raids on clans and the redeployment of the police in Oct 2025 proved that Hamas is the only functioning authority, which is exactly
    the point the Trump plan and the Board of Peace treat as the problem; Trump first shrugged ('a couple of gangs') then threatened to 'go in and kill them'. The same force is its bargaining asset and
    the reason the Board of Peace will not work with it.
  it: ''
- hash: 525f9b25
  kind: cards
  en: Safe havens abroad make the leadership hittable and expose its hosts. Doha, Istanbul and Cairo give Hamas diplomats immunity from Gaza's fate, but the Israeli strike of 9 Sep 2025 in a Doha residential
    compound and Netanyahu's boast of 5 Sep 2026 ('I attacked Qatar') turn the hosts into targets and push Qatar toward pressing Hamas as guarantor of its own deals.
  it: ''
- hash: 6951ebdb
  kind: cards
  en: The route to legitimacy runs through the rival it deposed. Hamas needs the PLO umbrella (Beijing Declaration, national bloc, elections) to be a Palestinian actor again, but its coup of 2007 and its
    2025 executions are the reason Abbas treats it as a threat and the Palestinian Authority is a condition of every international plan; on 10 Oct 2026 Abbas postponed the vote to Sep 2027 and deprived
    Hamas of its best ballot.
  it: ''
- hash: 369d6f00
  kind: cards
  en: Claiming victory commits it to a settlement it cannot deliver. Hayya called the Jan 2025 ceasefire a defeat for Israel and 7 Oct a 'military accomplishment'; two years on, 74,000 dead, the Strip in
    tents and no reconstruction (pledges of 7bn dollars against an estimated 70bn need) leave the claim hard to sell and the PCPSR poll of Aug 2026 finds that Hamas has lost substantial support.
  it: ''
- hash: cfd28597
  kind: cards
  en: 'Hamas is a movement that lost the war it started and is trying to win the settlement. On the Luttwak reading, 7 Oct 2023 was an attack that destroyed its attacker''s base and still redrew the map:
    Gaza is ruins, the military command was decapitated repeatedly (Deif, Yahya Sinwar, then his brother), Hezbollah and Iran were crippled, yet the Palestinian question is back on the table, recognitions
    of Palestine multiplied in 2025 and a US president personally owns a plan for Gaza. The cost of that outcome falls on Hamas, because every route to the state it helped bring back runs through its exclusion
    and its disarmament. Its strategy in 2026 is therefore delay with concessions on form: it gives up the hostages (the last bargaining chip, spent between 13 Oct 2025 and early 2026), dissolves its administration,
    accepts a technocratic committee and says yes to the 15-point roadmap, but holds the weapons and the tunnels as insurance, and tests whether the Board of Peace can force Israel to leave the Yellow Line
    first. Israel reads the same facts the other way (no withdrawal until disarmament), so the ceasefire exists on paper and bleeds on the ground: Hamas has not disarmed, Israel holds about 60% of the Strip,
    no stabilisation force and no technocratic committee has entered, and Israeli strikes on commanders have escalated since Sep 2026 ahead of Israel''s 27 Oct election. Underneath sits a leadership choice
    made in July 2026: Hayya, the negotiator close to Iran, over Meshal, the Qatar-leaning pragmatist. The patrons are weaker or squeezed (Iran at war, Qatar bombed and pressed, Turkey vetoed from the force,
    Egypt hostile to Brotherhood rule), and the rival Palestinian Authority has just postponed the elections that might have given Hamas a legitimate way back. One signal that is not a row: Hamas announced
    a pause in public executions on 21 Oct 2025, days after Trump threatened to ''go in and kill them'', so the order it keeps is partly a function of Washington''s attention.'
  it: ''
- hash: df65d270
  kind: cards
  en: 'Keep its arsenal outside the state: no disarmament while Israel occupies Lebanese land and strikes. It treated the cabinet''s decision of 5-7 August 2025 ''as if it did not exist'', walked out of
    the cabinet on 5 September 2025, offered in April 2025 to discuss weapons only after Israeli withdrawal from the five hill positions, and in 2026 rejects the Washington framework (26 June), its pilot
    zones and its verification committee. Qassem on 29 August 2026: ''we will not surrender''.'
  it: ''
- hash: 1f6a7e46
  kind: cards
  en: 'Force Israel out and restore deterrence: Israeli withdrawal from the area it holds since March 2026 (about 608 sq km, 6% of Lebanon, per Carnegie) and from the five points held since February 2025,
    an end to the strikes that never stopped after the November 2024 truce, and new rules of engagement on the model of the 1996 April Understanding.'
  it: ''
- hash: a75ba626
  kind: cards
  en: 'Hold the Shia community and pay for it: keep the displaced (over 1.2 million in the 2026 war) and the Dahieh, south and Bekaa base loyal by rehousing and compensating them under its own banner (the
    ''Promise and Commitment'' housing project announced on 13 October 2026), and keep the Hezbollah-Amal duo as the Shia veto in the confessional system.'
  it: ''
- hash: 2239b5d4
  kind: cards
  en: 'Stay inside Iran''s axis and rebuild the supply and money lines the loss of Syria cut: Iranian cash (US Treasury: about USD 1bn in the first ten months of 2025; two Reuters sources: USD 200m in September
    2026), cash couriers through Turkey and the UAE, the Al-Qard al-Hassan network, and Iraq as the new land route.'
  it: ''
- hash: 15eb02ec
  kind: cards
  en: 'Keep political weight in Beirut to make the state its shield rather than its enemy: ministers in the Salam cabinet, a parliament whose mandate was extended to May 2028 on 9 March 2026, a veto through
    Speaker Berri''s Amal, and the line that disarmament must come through a ''national defence strategy'' and not through a Washington-brokered deal.'
  it: ''
- hash: 19a50e4a
  kind: cards
  en: 'The standing maximum, formally unrevoked: the destruction of Israel and the expulsion of American power from Lebanon and the region (1985 manifesto, reiterated in 2009). In practice it is subordinated
    to ranks 1-5: since September 2024 the movement fights to survive as an armed actor, not to win.'
  it: ''
- hash: c9761951
  kind: cards
  en: 'Obstruction from inside the system rather than outside it: cabinet walkouts (7 August and 5 September 2025), Berri as channel and brake, the proposal of parallel withdrawal south of the Litani (4-5
    June 2026), and the Iranian card - Tehran made a Lebanon ceasefire a condition of its own deal with Washington (the 15 June 2026 Islamabad memorandum), which Qassem uses to call the Israel-Lebanon framework
    ''null and void''.'
  it: ''
- hash: ebad333f
  kind: cards
  en: 'The ''resistance'' narrative against the state''s ''sovereignty'' narrative: the cabinet decision is ''US-Israeli orders'', the framework a ''surrender'', the army is ''humiliated'' by verification;
    Al-Manar and Qassem''s speeches keep the frame while Israeli demolitions of Shia villages and strikes under the truce supply the proof.'
  it: ''
- hash: 9f70d887
  kind: cards
  en: 'What is left after 2024-26: attrition inside the Israeli-held zone (ambushes, IEDs, drones), lighter arms and anti-tank missiles it signalled it would keep in July 2025, tunnel belts such as Ali
    al-Taher (Israel says it destroyed the complex on 10 September 2026 with 1,100 tons of explosives), and reported rearmament through Beirut''s port and Syrian smuggling routes (WSJ, October 2025). Independent
    estimates put its dead in the 2026 war above 1,000; the IDF claims it has lost a third of its forces since 2023.'
  it: ''
- hash: deff06df
  kind: cards
  en: 'A parallel welfare state: compensation (over USD 50m paid to war-affected families by December 2024), Al-Qard al-Hassan loans, pharmacies and housing, paid with Iranian cash moved by courier and
    hawala (Treasury, 20 August 2026: couriers on flights between Lebanon, Turkey, the UAE and Iran, ''hundreds of millions'' through one network). Its funds were strained by July 2025 (cheques bouncing
    at Al-Qard al-Hassan).'
  it: ''
- hash: aacfead7
  kind: cards
  en: 'Penetrated and hollowed out: the September 2024 pager and radio attacks, the killing of Nasrallah (27 September 2024) and of his designated successor within days, then a stream of commanders; the
    IDF says a third of its forces are gone since 2023, independent counts put 1,000+ dead in 2026 alone. Analysts say rebuilding requires answering the intelligence breach first, and it has not been shown
    to have done so.'
  it: ''
- hash: f5d5bbee
  kind: cards
  en: 'The land bridge is gone and the neighbour is hostile: Assad fell in December 2024 and Qassem said on 14 December that the Syrian supply route was lost; the new Syrian authorities fought Hezbollah-linked
    clans on the border (February 2025), seize Hezbollah-bound arms (16 July 2026), and refused, but also did not join, US and Israeli pressure to attack it. Lebanon barred Beirut-Tehran flights in February
    2025.'
  it: ''
- hash: e9545333
  kind: cards
  en: 'Money is short and conditioned: Iran, itself decapitated (Khamenei killed in the war that began on 28 February 2026), pays less reliably; the US Treasury re-designated Hezbollah as an IRGC-QF instrument
    on 20 August 2026; Lebanese reconstruction aid, Gulf money and US army aid are tied to a state monopoly on arms (Riyadh waits for disarmament; the State Department said reconstruction ''cannot happen''
    without it).'
  it: ''
- hash: 01e917f2
  kind: cards
  en: 'A state that has turned against its weapons and a public that follows it only in part: the cabinet banned its military activity on 2 March 2026, expelled the IRGC and the Iranian ambassador (24 March),
    and signed the framework; 58% of Lebanese back a state monopoly on arms in a May 2026 poll (most Shia and Sunni respondents opposed disarmament), and CFR notes that relatively few Lebanese support the
    group in Arab Barometer 2024 polling.'
  it: ''
- hash: 70a6cc0f
  kind: cards
  en: 'Its own base is displaced and its geography is occupied: over 1.2 million people displaced, Dahieh and the south emptied, Israel holding about 608 sq km and razing villages, evacuation orders north
    of the Litani and into the Bekaa; Carnegie notes the Shia identity has become ''securitised'' even among fellow Lebanese. The Shia veto that protects it also binds it to Amal and to Berri''s more cautious
    line.'
  it: ''
- hash: 50a26812
  kind: cards
  en: 'Designated and sanctioned beyond Lebanon: US (FTO since 1997, SDGT since 2001), EU military wing (2013), GCC (2016), United Kingdom and Germany in full (2019, 2020), Argentina (2019), Costa Rica
    (April 2026). The listings shut formal finance and travel and give every host government a reason to act against its networks.'
  it: ''
- hash: 055596ae
  kind: cards
  en: The deterrent that provoked the war it was meant to deter. A hidden arsenal of rockets and missiles, built after 2006 so that Israel would never again attack Lebanon at scale, was the thing Israel
    could not leave alone once the Gaza war had changed its threshold; the 'support front' opened on 8 October 2023 turned the arsenal into a target list. In November 2024 the deterrent was gone, in March
    2026 Hezbollah fired again to support Iran and brought the Israeli ground campaign to the Litani it had deterred for twenty years.
  it: ''
- hash: e237813b
  kind: cards
  en: Relational manoeuvre defeated by intelligence penetration. Hezbollah's whole method was to out-manoeuvre a stronger army by hiding in the network - in the community, in the Syria-Iran land bridge,
    in dispersed command. Nasrallah told members in February 2024 to drop smartphones because of Israeli infiltration; the replacement, thousands of pagers and radios bought in a supply chain Israel had
    built, was the weapon of 17-18 September 2024, and the killing of the leadership ten days later followed from the same penetration. The security measure became the vector.
  it: ''
- hash: 78442d30
  kind: cards
  en: Defending the Assad regime made the next Syria an enemy. The 2012 intervention secured the land bridge and cost Hezbollah its image as a purely Lebanese resistance; when Assad fell in December 2024
    the successors were Sunni forces who had fought Hezbollah, and they closed the route, seize its shipments and have Beirut's blessing.
  it: ''
- hash: 2b00361b
  kind: cards
  en: The shield of the state is cut by the sword it keeps. Hezbollah stays in the cabinet and parliament to be protected from the army and to claim state-funded reconstruction; its refusal to disarm makes
    that money conditional (Riyadh, Washington, the EU), so the community it feeds with Iranian cash has to wait for a state that Hezbollah's arms keep poor, while an Israeli buffer zone stays until it
    disarms.
  it: ''
- hash: 3ae04e7c
  kind: cards
  en: 'The more Israel punishes the community, the stronger the argument for weapons and the weaker the means to defend them. Carnegie''s reading: an open-ended Israeli occupation lets Hezbollah present
    itself as the only force that can end it; the same war has killed its commanders, emptied the Shia heartland and handed the army the zones where it deploys. Each Israeli strike under the truce confirms
    the case for the arsenal and removes some of the arsenal.'
  it: ''
- hash: '53917439'
  kind: cards
  en: Loyalty to the patron that is itself in extremis. By pledging allegiance to Mojtaba Khamenei on 11 March 2026 and entering the Iran war nine days earlier, Hezbollah tied its fate to a regime that
    lost its leader, its air defence and its Syrian corridor; the state's expulsion of the Iranian ambassador and IRGC officers followed from that choice, and in June Tehran bargained Lebanon into its own
    ceasefire instead of the reverse.
  it: ''
- hash: d6880064
  kind: cards
  en: 'Hezbollah in October 2026 is a movement that has lost the war it was built to deter and has not yet lost the argument that justifies its weapons. Luttwak''s logic shows twice. First, deterrence is
    a paradoxical good: an arsenal big enough to frighten Israel was also big enough to make destroying it Israel''s priority, and the ''support front'' of October 2023 handed Jerusalem the moment. Second,
    relational manoeuvre - the hidden, dispersed, community-embedded network, tied to Iran by a land bridge - beat Israeli firepower for eighteen years until Israeli intelligence penetrated the network
    itself: the pagers of 17 September 2024 and the decapitation that followed were less a military victory than the demonstration that the network had been read. Since then its position is that of a besieged
    political party with an army: the land route through Syria is shut by a hostile neighbour, Iranian cash comes by courier, the Lebanese state has banned its military activity and signed a framework that
    trades Israeli withdrawal for its disarmament, and its constituency is displaced and occupied. What keeps it from collapse is not strength but structure: a confessional system that cannot decide against
    the Shia community, an army that will not fight it, Amal as a brake on the state, and an Israeli occupation that supplies the justification. The open question for the next stage is whether the Lebanese
    state, with Gulf, US and European money behind its army, can turn the pilot zones into a precedent without provoking the clash both sides say they want to avoid, or whether Israel''s tunnels-and-demolition
    campaign forces Hezbollah to choose between its arms and its place in the state.'
  it: ''
- hash: e2bf649a
  kind: cards
  en: 'Keep and consolidate one-group rule over Sanaa and the populous north (the Houthis have held the capital since September 2014): no power-sharing that dilutes it, no return of the Presidential Leadership
    Council to Sanaa. The 2023 Saudi roadmap was acceptable only because, in the reading of Sana''a Center analysts, it would have left the Houthis in unilateral control of the north.'
  it: ''
- hash: 60c40400
  kind: cards
  en: 'Turn military leverage into a settlement with Riyadh on Houthi terms: an end to what Sanaa calls the Saudi ''blockade'' (airspace, ports, banks), payment of public salaries from a share of Yemen''s
    oil and gas revenue, the roadmap of 2023, and in effect tacit recognition as Yemen''s government in the north. The July 2026 escalation was read by Sana''a Center experts as a bid to close this deal
    before any US-Iran settlement.'
  it: ''
- hash: 36bfaa1b
  kind: cards
  en: 'Take the rest of Yemen that matters: the Red Sea coast (done, 3-11 September 2026: Mocha, Dhubab, Mayyun/Perim, the Hanish islands), then Taiz city and Marib with its oil and gas. Against it the
    government''s Operation Dawn (4 October 2026) and the Saudi air campaign are the first serious attempt since 2022 to push them back.'
  it: ''
- hash: f524ad27
  kind: cards
  en: 'Own the terms of passage through Bab al-Mandab. After the Gaza-justified campaign of November 2023 - 2025, the 2026 aim is a permanent chokepoint position: a Hudaydah coordination centre that claims
    exclusive authority over ship dealings (statement of 1 August 2026), a blockade declared on Saudi Arabia (20 July 2026), assurances to China and Russia that their ships are safe, and Mayyun island in
    the middle of the strait.'
  it: ''
- hash: 418d9e47
  kind: cards
  en: 'Be the Arab front of the ''axis of resistance'' and, with Hezbollah broken and Iran bruised, its centre of gravity: attacks on Israel ''in support of Gaza'' (2023 - October 2025, resumed on 28 March
    2026 in the Iran war), a growing presence in Iraq and Lebanon, training of allied militants from Sudan to Iraq, ties with al-Shabaab. The aim is status and leverage, not a mandate from Tehran: analysts
    stress the decision to act is the Houthis'' own.'
  it: ''
- hash: d996282d
  kind: cards
  en: 'Keep Iran as patron but not as master, and widen the circle of backers: China and Russia (contacts on ship passage, 2026), Oman as window and mediator, and the tribes at home. The group is ''fiercely
    nationalist and protective of its autonomy'', and Iran may trade it away in a deal with Washington, so the hedge is structural.'
  it: ''
- hash: c130a387
  kind: cards
  en: A channel through Oman that delivered the US-Houthi ceasefire of 6 May 2025 (it left attacks on Israel outside the deal), indirect talks with Riyadh since 2022 (the roadmap), a prisoner-exchange deal
    with the government (signed 14 May 2026, 1,680 detainees, postponed since 10 July), and, in 2026, direct approaches to China and Russia to keep their ships out of the target list.
  it: ''
- hash: a8e7449e
  kind: cards
  en: 'Total control of the message at home - propaganda in schools, funerals, weddings and public institutions (Sana''a Center) - and abroad the ''equation'' framing: attacks are ''in support of Gaza'',
    against a ''Saudi siege of nearly twelve years'', ''an eye for an eye''. Statements come from the military spokesman Yahya Saree and Abdelmalek al-Houthi''s televised speeches; Saba and al-Masirah are
    tier 1 for what the movement says, not for facts. Claims such as 5,400 square km taken on 3 September 2026 could not be verified.'
  it: ''
- hash: b9f3ba3a
  kind: cards
  en: 'Ballistic and cruise missiles, drones, explosive boats and, from 2025, sinking of merchant ships (Eternity C, July 2025); a ground arm that takes mountains over the coast, uses local fighters first
    and elite units after, and children in ''human waves''; amphibious drills on the Hudaydah coast in late 2025. In 2026 the targets moved from Israel to Saudi Arabia: Abha, Jazan, Yanbu, Najran, King
    Khalid airport in Riyadh (10 October 2026, 13 killed). Armed with Iranian supply and, by Yemeni government accounts, direct IRGC guidance.'
  it: ''
- hash: 626606c2
  kind: cards
  en: 'Recruitment by pressure on poverty and tribes: families are made to hand over sons, rural Sanaa, Amran and Dhamar are the pool, a recruiter offered a 16-year-old a rifle, a month of training and
    YER 50,000 (about USD 210); the government''s office documented 62 child recruitment cases in the second quarter of 2026. The elite is drawn from the families of the Sa''ada wars, trained in the Quranic
    Sciences Academy; five security services (Preventive Security, Security and Intelligence, Military Intelligence, Revolutionary Security, Police Intelligence) watch each other under Abdelmalek al-Houthi.'
  it: ''
- hash: c3fd2479
  kind: cards
  en: 'A centralised extraction system run since 2014: taxes, customs, zakat, endowment revenue, fuel sales, ''war effort'' levies. The Mokha Center put the parallel economy at about USD 2.5bn a year (USD
    800m taxes and customs, 600m fees and levies, 300m war contributions, 100m mobilisation events, 700m indirect costs to business); the Sana''a Center reports 4,225 trade agencies stripped of licences
    in 2026 in favour of affiliated firms. The US Treasury alleged in January 2026 that Iranian oil, partly free of charge and routed through Dubai companies, earns the group over USD 2bn a year; the Houthis
    deny it. Hudaydah and Al-Salif ports (hit by Israel in 2025) remain the gate, with clandestine landings along the coast.'
  it: ''
- hash: 0a478955
  kind: cards
  en: A starving, bankrupt hinterland. 22 million people need aid and 18.3 million face acute food insecurity (2026 UN plan); the 2025 aid plan got USD 687.9m of 2.48bn (28%), the 2026 plan under 20% by
    July; public salaries paid in part, irregularly, for years; the US Foreign Terrorist Organization designation (2025) made thousands of businesses close or move. Abdelmalek al-Houthi admitted people
    eat tree leaves and blames the Saudi 'blockade', not mismanagement.
  it: ''
- hash: 3fc9da9a
  kind: cards
  en: The patron's own weakness and its bargaining. Iranian oil exports fell to a six-year low in June 2026 (Reuters, cited by the Sana'a Center), Iran is under a US-Iran memorandum (June 2026) and may
    trade the Houthis away; Araghchi said in March that Iran did not want allies to help its self-defence, and Sana'a Center analysts argue Yemen is less critical to Tehran than Iraq or Lebanon.
  it: ''
- hash: 250a880c
  kind: cards
  en: Decapitation and penetration. Israel's strike on a Sanaa apartment on 28 August 2025 killed prime minister Ahmed al-Rahawi and, in the Sana'a Center count, about a dozen ministers and officials; chief
    of staff al-Ghamari's death was announced on 16 October 2025; US and Israeli strikes in 2025 showed deep intelligence penetration and destroyed Hudaydah and Al-Salif ports and fuel reserves. Abdelmalek
    al-Houthi's inner circle was spared and he has named no successor.
  it: ''
- hash: 92a44a99
  kind: cards
  en: An unwelcome occupier outside the northern heartland. The Houthis lack the social and security influence of their strongholds on the west coast, lost 332 confirmed dead by funeral notices by 13 September
    (the government-aligned NRF claims over 1,000), were forced to redeploy after heavy air strikes, and have 200,000-plus newly displaced behind them; tribes are 'troublesome' (the Al-Rayyan gathering
    of June 2026, an attempt on a sheikh on 14 July).
  it: ''
