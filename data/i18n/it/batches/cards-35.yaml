  kind: cards
  en: Lithium and gold. Zimbabwe exported 1.128 million tonnes of lithium-bearing spodumene concentrate in the year to December 2025, up 11% on the year before, most of it to China for processing into battery
    materials. The raw-material export ban (February 2026) is the state's lever over that flow.
  it: ''
