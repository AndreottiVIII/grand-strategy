  en: US sanctions and ZIDERA. In March 2024 the US designated eight individuals, Mnangagwa among them, and three businesses under the Global Magnitsky Act. Washington said it would sanction fewer people
    from then on, but the Zimbabwe Democracy and Economic Recovery Act (ZIDERA) still restricts access to international financial institution loans and investment.
