items:
- hash: d77d5a3a
  it: |
    La Russia è il mercato del lavoro e il denaro. Le rimesse hanno rappresentato circa un quarto del GDP nel 2024 (dal 24 al 25 per cento nelle fonti che citano la World Bank), e la Russia ha fornito il 94 per cento dei flussi in entrata nel periodo gennaio-maggio 2025. Le norme russe in vigore dal 2024 (soggiorni di 90 giorni, rilevamento delle impronte digitali, espulsione di circa 157,000 migranti irregolari nel 2024) hanno ridotto il numero ufficiale di lavoratori kirghisi da circa 650,000 a circa 350,000, sebbene le stime non ufficiali siano più alte.
- hash: 1060722f
  it: |
    Un'economia piccola con dipendenza dal Cremlino: l'economia dipende dalla Russia direttamente e attraverso il Kazakistan, il che limita ciò che Bishkek può rifiutare a Mosca. Il CSTO e la base di Kant sono il versante della sicurezza della stessa dipendenza.
- hash: 389405a8
  it: |
    L'acqua e la diga comune: Kambarata-1 (1,860 MW) è una joint venture con Kazakistan e Uzbekistan (Kirghizistan 34 per cento, 33 ciascuno per gli altri). L'accordo intergovernativo era ancora in preparazione nel 2025-26 e il costo è contestato (da $4.2bn a $5bn), quindi la leva idrica non è ancora nelle mani di Bishkek.
- hash: 973d0263
  it: |
    Lo strumento anti-elusione dell'EU è stato usato per la prima volta contro il Kirghizistan nell'aprile 2026, contro le riesportazioni verso la Russia. Il commercio che porta reddito a Bishkek è lo stesso commercio che oggi attira le sanzioni europee.
- hash: a09377a0
  it: |
    Il Kirghizistan è un piccolo Stato senza sbocco sul mare il cui regime ha concentrato il potere attorno a Japarov da quando questi ha licenziato Tashiev nel febbraio 2026, in vista di un'elezione presidenziale il 27 gennaio 2027, dopo una stretta del 2025 sulla stampa indipendente. La sicurezza e il mercato del lavoro passano entrambi attraverso la Russia (CSTO, Kant, rimesse), mentre la Cina (ferrovia e finanziamenti), l'Uzbekistan e il Tagikistan (trattati di confine del 2023 e del 2025) e gli Stati Uniti (commercio e visti) offrono margini di manovra. Le sue leve sono oro, transito e acqua; il suo vincolo più stringente è Mosca.
- hash: b55ca39d
  it: |
    Mantenere la famiglia Hun al controllo dello Stato. Hun Sen è passato alla presidenza del Senato nel 2024 e resta di rango superiore al figlio Hun Manet, primo ministro (CFR, luglio 2025); la carica al Senato gli offre anche una via per agire da capo di Stato ad interim (commento RFA).
- hash: 8fdc82c8
  it: |
    Mantenere le rivendicazioni di confine, incluso il territorio del tempio di Preah Vihear, e porre fine ai combattimenti con la Thailandia tramite un cessate il fuoco che tenga. Gli scontri di luglio 2025 e i combattimenti di dicembre hanno lasciato aperta la disputa; Phnom Penh ha chiesto a Bangkok di riprendere i colloqui (aprile 2026).
- hash: ade7e8a1
  it: |
    Trasformare il capitale cinese in una marina, un canale e delle strade: la base navale di Ream è stata riaperta all'inizio di aprile 2025 e il canale Funan Techo (USD 1.15bn PPP) è entrato nella sua seconda fase nell'aprile 2026.
- hash: 4dc6d812
  it: |
    La repressione dei centri di truffa come moneta di scambio: il governo riferisce di 190 siti sigillati, 173 persone arrestate e circa 11,000 lavoratori deportati dall'avvio della campagna alla fine del 2025. Sono cifre del governo, e sono la carta che la Cambogia gioca con Washington e Bangkok.
- hash: 988e4d49
  it: |
    Accesso navale cinese: navi da guerra della PLA hanno attraccato a Ream da dicembre 2023 (AP, maggio 2024), e nel 2024 la Cina ha annunciato due navi da guerra come dono alla marina cambogiana.
- hash: 17b2344b
  it: |
    Il canale Trump: Hun Manet ha formalmente candidato Trump al Premio Nobel per la pace il 7 agosto 2025, attribuendo al suo ruolo il cessate il fuoco. La Malaysia e gli Stati Uniti hanno mediato la prima tregua (CSIS).
- hash: c85afc72
  it: |
    Debito verso Pechino: circa USD 3.4bn dovuti a creditori cinesi a fine 2024, quasi un terzo del debito pubblico estero e circa il 7% del GDP. Limita quanto Phnom Penh possa rifiutare i progetti di Pechino (nostra lettura; la cifra va verificata, si veda la nota sulla relazione).
- hash: ebc6115a
  it: |
    L'economia della truffa è insieme entrata e passività: ricavi superiori a USD 12.5bn l'anno, circa la metà del GDP formale (USIP, come citato da CSIS). Le sanzioni statunitensi e britanniche contro il Prince Group (14 ottobre 2025) hanno trasformato questa dipendenza in una prova internazionale.
- hash: adffec5a
  it: |
    Pressione militare thailandese senza un accordo: la Thailandia ha colpito almeno sei complessi di casinò e hotel che definisce centri di truffa (CSIS), e i colloqui erano in stallo già nell'aprile 2026, quando Phnom Penh chiedeva ancora che riprendessero.
- hash: '63504580'
  it: |
    L'economia della truffa è insieme il denaro che alimenta la rete clientelare e il pretesto per gli attacchi thailandesi e per le sanzioni statunitensi e britanniche. Chen Zhi, il capo del Prince Group che consigliava sia Hun Sen sia Hun Manet (CSIS), è stato arrestato e inviato in Cina nel gennaio 2026.
- hash: dfb7d356
  it: |
    La Cambogia segue una strategia dinastica: la presidenza del Senato di Hun Sen e la guida del governo del figlio funzionano come un unico sistema, e la moneta di scambio dello Stato è l'accesso: capitali cinesi e basi navali da un lato, la repressione dei centri di truffa dall'altro. Il paradosso è che il denaro che ha costruito lo Stato (credito cinese, ricavi della truffa) offre anche a Bangkok un pretesto per gli attacchi e a Washington motivi per le sanzioni. La prova decisiva è se il cessate il fuoco al confine, con Malaysia e Stati Uniti come mediatori, possa reggere mentre il debito cinese e la base di Ream tengono Phnom Penh legata a Pechino.
- hash: 11340cc7
  it: |
    Trasformare la riserva delle Phoenix Islands in entrate: riaprire l'area protetta alla pesca commerciale, che secondo il governo porterà decine di milioni di dollari. I funzionari stimano i diritti di licenza persi dalla chiusura del 2015 in circa US$150 million; un rapporto ne indica US$205 million. Entrambe sono cifre del governo, e le fonti non confermano se la riapertura sia già entrata in vigore.
- hash: a3b05ca5
  it: |
    Accettare l'aiuto cinese in materia di sicurezza senza perdere i patroni: una nave ospedale della marina cinese ha attraccato a Tarawa nel luglio 2023, e la polizia cinese in uniforme lavora con la polizia di Kiribati dall'inizio del 2024, una presenza che ha attirato critiche da Washington e Canberra.
- hash: 56ea72ba
  it: |
    Scandire il ritmo dei colloqui sulla sicurezza con l'Australia: i colloqui di polizia sono stati accantonati su richiesta di Kiribati, il cui presidente voleva attendere l'elezione di un nuovo governo dopo le elezioni del 2024.
- hash: 95c8614f
  it: |
    Il riconoscimento come leva: Kiribati ha spostato il riconoscimento da Taiwan alla Cina nel settembre 2019 (annunciato il 20 settembre); il ministero degli Esteri cinese registra la ripresa dei rapporti il 27 settembre 2019.
- hash: 566e2252
  it: |
    L'accesso alla pesca come leva: la riserva delle Phoenix Islands, chiusa alla pesca commerciale dal 2015, è la leva di entrate del governo, e la chiusura è costata, secondo le cifre del governo, circa US$150 million di diritti di licenza.
- hash: 8bf341a1
  it: |
    Entrate dall'accesso alla pesca: oltre il 70% delle entrate governative non legate agli aiuti proviene dai diritti di accesso al tonno, e si prevede che i tassi di cattura del tonno calino di quasi un terzo entro il 2050 (scienziati, come riportato da RNZ; cifre tratte da un estratto di ricerca, articolo non aperto).
- hash: 9928e0e7
  it: |
    Non può lasciare facilmente i patroni: Australia e Nuova Zelanda mantengono ciascuna un'Alta commissione a Tarawa, e i colloqui di polizia del 2024 con l'Australia e il dissidio del 2025 sulla visita con la Nuova Zelanda mostrano che gli attriti costano buona volontà senza interrompere i legami.
- hash: b2868131
  it: |
    La presenza della polizia cinese ha attirato critiche statunitensi e australiane nel 2024, e nel 2025 è seguito un dissidio con la Nuova Zelanda: l'aiuto alla sicurezza venuto da Pechino è costato buona volontà presso i patroni da cui Kiribati dipende ancora.
- hash: 55e7c07d
  it: |
    Kiribati gioca le grandi potenze l'una contro l'altra: nel 2019 ha spostato il riconoscimento da Taipei a Pechino, accetta l'aiuto navale e di polizia cinese e dipende ancora dai legami con Australia e Nuova Zelanda e dai diritti che le flotte straniere pagano per il tonno. La scommessa del governo Maamau è sul mare, con la riapertura della riserva delle Phoenix Islands alla pesca, e le fonti danno quelle entrate solo come cifre del governo, per cui la scommessa è difficile da verificare. L'esposizione più acuta riguarda i patroni: la disputa sulla polizia con Canberra e il dissidio sulla visita con Wellington mostrano che l'aiuto cinese costa buona volontà proprio dove nascono gli aiuti e i legami.
- hash: 85191555
  it: |
    Mantenere in funzione il programma di cittadinanza per investimento come principale fonte esterna di denaro dello Stato e del valore del passaporto. Le guide di settore indicano le modalità d'accesso come un contributo di almeno US$250,000 a un fondo governativo oppure immobili per almeno US$325,000 (la soglia immobiliare sarebbe stata abbassata da US$400,000 nell'ottobre 2024). Si tratta di indicazioni di settore, non del testo del programma stesso.
- hash: 64b0c3a4
  it: |
    Mantenere aperta ai propri cittadini la via verso gli Stati Uniti mentre Washington restringe i visti per immigrati. Il governo sostiene che la misura statunitense del 2026 riguarda solo i visti per immigrati (residenza di lungo periodo), non quelli turistici, d'affari o di studio, e che le domande continuano a essere accettate ma respinte come dinieghi procedurali.
- hash: b9d60a70
  it: |
    Riconoscimento e seggi istituzionali come moneta di scambio. Relazioni diplomatiche piene con la Repubblica di Cina (Taiwan) dal 23 settembre 1983 e con il Regno Unito dal 19 settembre 1983; appartenenza al Commonwealth, condivisa con il Regno Unito in quanto reame del Commonwealth; legami con la CARICOM; la Caribbean Development Bank, l'ICC e il WTO. L'OECS non è coperta dalla pagina letta.
- hash: 996245c5
  it: |
    Il varco dei visti e il percorso degli investimenti sono lo stesso mercato. La misura statunitense sui visti per immigrati del 2026, come la descrive il governo, colpisce chi cerca la residenza di lungo periodo e non i turisti, quindi il costo ricade sul commercio dei passaporti piuttosto che sui visitatori. Letto solo nella dichiarazione del governo e in sintesi di ricerca; il testo statunitense originale non è stato letto.
- hash: d0d61a50
  it: |
    Il programma che porta denaro attira anche la pressione. I passaporti venduti ad acquirenti esterni ai Caraibi sono ciò contro cui Washington inasprisce le regole sui visti, e quelle regole riducono l'accesso ai visti per cui il passaporto viene venduto. Nostra lettura; le fonti forniscono i singoli elementi, non il nesso.
- hash: 244f08f6
  it: |
    Saint Kitts e Nevis vende il proprio passaporto e il proprio turismo caraibico, e la sua politica estera poggia su un lungo riconoscimento di Taipei dal 1983, sul legame britannico e del Commonwealth e su un varco dei visti statunitensi che ora si restringe per gli immigrati. Il commercio dei passaporti è insieme la sua entrata e ciò che attira la pressione, quindi le regole statunitensi sui visti e il mercato degli investimenti vanno letti insieme. La pressione cinese e la questione della secessione di Nevis non sono documentate in questo passaggio e restano aperte.
- hash: 4295dc37
  it: |
    Mantenere la penisola in pace e il Nord sotto deterrenza, abbassando al tempo stesso la temperatura: coesistenza pacifica, nessuna unificazione per assorbimento, nessun atto ostile, una fine formale della guerra di Corea attraverso colloqui tra le parti coinvolte e, come obiettivo più lungo, la moderazione nucleare. Pyongyang non ha risposto a nulla di questo da quando Kim ha definito le due Coree 'hostile states' nel dicembre 2023.
- hash: bd8079fb
  it: |
    Mantenere credibile la garanzia americana al prezzo più basso, acquistando al tempo stesso autonomia al suo interno: la presenza statunitense di 28,500 uomini e la deterrenza estesa, il trasferimento del controllo operativo in tempo di guerra, una flotta di sottomarini a propulsione nucleare e il diritto di arricchire uranio e riprocessare il combustibile esaurito.
- hash: 79b3d7ad
  it: |
    Proteggere un'economia esportatrice (esportazioni per USD 709.7bn nel 2025, chip ora circa il 41% del totale) dalla leva tariffaria americana e dalla ritorsione cinese insieme: acquistare il tetto del 15% sui dazi statunitensi con un impegno di investimento da USD 350bn, ripristinare il rapporto con la Cina e allargarsi a ASEAN, India e Golfo.
- hash: a837f17c
  it: |
    Trasformare armi, centrali nucleari e cantieri navali in asset strategici: Polonia (K2, K9, FA-50), i reattori cechi di Dukovany, Romania, Estonia, Croazia, le vendite di difesa aerea nel Golfo e le Filippine, con la partnership cantieristica statunitense (MASGA) come legame con Washington.
- hash: 9765b61e
  it: |
    Normalizzare i rapporti con la Cina senza uscire dal campo americano: una 'full restoration' dei legami nel 2026, la fine del divieto non ufficiale sull'hallyu e delle strutture nel Mar Giallo, rifiutando al tempo stesso di schierarsi nella disputa Cina-Giappone su Taiwan.
- hash: 28cff78e
  it: |
    Chiudere il capitolo della legge marziale e ricostruire la legittimità democratica: Yoon Suk Yeol condannato all'ergastolo per insurrezione (19 feb 2026, appello in corso), la vittoria del Democratic Party alle elezioni locali di giugno 2026 e un presidente il cui consenso è sceso al 37%.
- hash: 46f7ef97
  it: |
    Diplomazia a spola e vertici a più binari: vertici nelle città natali con Takaichi, premier giapponese (Nara, 13-14 gen 2026; Andong, 19-20 mag 2026), una visita di Stato a Pechino (4-7 gen 2026) e Wang Yi a Seul (19-20 ago), il vertice NATO di Ankara (7 lug 2026), il primo vertice Asia Centrale-Corea (set 2026), visite di Stato nelle Filippine (mar), in India e in Vietnam (apr) e un vertice EU (10 giu). La proposta di colloqui per porre fine alla guerra di Corea (15 ago, ripetuta all'UN il 22 set) è la carta della penisola.
- hash: 2caae303
  it: |
    Autocontenimento come segnale: gli altoparlanti di frontiera sono stati zittiti l'11 giu 2025 e smantellati ad agosto, un divieto di volantini e palloni, il rammarico ufficiale verso Pyongyang per i voli civili di droni (feb 2026), la formula 'respect the North's system, no absorption' dell'Unification Ministry, e una Freedom Shield 2026 con meno della metà delle esercitazioni sul terreno del 2025.
- hash: 581ecc71
  it: |
    Una deterrenza convenzionale acquistata in patria e una nucleare presa in affitto da Washington: 28,500 soldati statunitensi (un minimo fissato per legge nel NDAA FY2026), un comando combinato con controllo statunitense in tempo di guerra, la tabella di marcia del ministro della Difesa (26 mag 2026) per un sottomarino a propulsione nucleare costruito in patria a metà degli anni 2030, regole d'ingaggio con colpi di avvertimento per ogni attraversamento della MDL, e l'impegno ad acquistare armi statunitensi per USD 25bn.
- hash: 63ea2829
  it: |
    Capitale e industria come moneta di scambio: il Korea-US Strategic Investment Corp da USD 350bn (avviato a giugno 2026; primi progetti annunciati il 30 set: un impianto a gas in Texas da USD 22.3bn, un quadro nucleare fino a USD 120bn, Alaska LNG in attesa), il boom dei semiconduttori (USD 173.4bn di chip nel 2025, 41% delle esportazioni tra gennaio e agosto 2026), l'export di armi e reattori, e la diversificazione energetica lontana dal Golfo dopo l'interruzione di Hormuz.
- hash: 506d7562
  it: |
    Il garante fissa le condizioni. Il controllo operativo in tempo di guerra è ancora statunitense, il minimo di truppe regge solo per una clausola del NDAA che il Pentagono può revocare dopo 60 giorni con una relazione, e Washington spinge per la 'strategic flexibility' (forze capaci di agire contro la Cina) come parte della 'alliance modernisation'. All'inizio del 2026 le dotazioni Patriot della USFK sono state trasferite in Medio Oriente nonostante le obiezioni di Seul.
- hash: 0c0f4205
  it: |
    Leva tariffaria che non scade: un tetto del 15% in cambio di USD 350bn, con Trump che a gennaio 2026 minacciava di nuovo il 25% e prima dei primi progetti di investimento di settembre, e con Washington che chiede progetti oltre il totale concordato.
- hash: f53d45ec
  it: |
    La Cina può colpire in cambio, e ha mostrato come: le restrizioni hallyu successive al THAAD restano in vigore in modo non ufficiale (vietati i concerti), Pechino ha sanzionato il 14 ott 2025 cinque unità statunitensi di Hanwha Ocean per aver aiutato la cantieristica statunitense, e la Cina resta il mercato di esportazione singolo più grande (USD 130.8bn nel 2025).
- hash: caf53ca5
  it: |
    Un avversario che ha smesso di parlare: Pyongyang rifiuta ogni offerta, ha reso 'hostile states' parte della sua prassi (Ninth Party Congress, febbraio 2026; costituzione riveduta, marzo 2026) e rafforza la linea stessa: mine posate a sud del confine un anno fa, circa 20 attraversamenti della MDL ad agosto e 30 a settembre 2026, un'esplosione di mina il 21 set che ha ferito tre soldati sudcoreani.
- hash: af8872a0
  it: |
    Energia e una base demografica in calo. Circa il 61% delle importazioni di greggio dipendeva dallo Stretto di Hormuz quando la guerra con l'Iran l'ha chiuso nella primavera del 2026 (110 milioni di barili acquistati altrove per aprile-maggio); e un tasso di fertilità di 0.80 nel 2025 (nascite 254,300, decessi 363,400, calo naturale 108,900) ridurrà il bacino dei coscritti e la base fiscale proprio per il bilancio della difesa che Washington vuole aumentare.
- hash: 42691ffb
  it: |
    Un fronte interno diviso e freni legali: consenso al 35-37% nell'ottobre 2026, con il Democratic Party al suo livello più basso dall'insediamento, l'opposizione che controlla Seul dopo le elezioni locali di giugno, un divieto di legge sugli aiuti letali ai paesi in guerra e un 123 Agreement che esclude l'uso militare di materiale di origine statunitense.
- hash: cdbf2215
  it: |
    L'alleato che paga il proprio garante indebolisce ciò che compra. Seul si è impegnata a USD 350bn di investimenti, USD 25bn di armi statunitensi e USD 33bn di sostegno alle forze statunitensi per mantenere i dazi al 15% e le truppe in loco; ogni pagamento trasforma la garanzia in un servizio a prezzo, e la ricerca del sottomarino a propulsione nucleare e dell'arricchimento è una forma di hedging che dice a Washington (e a Pyongyang) che Seul non si fida pienamente del prodotto.
- hash: 2b9f113f
  it: |
    Rassicurare il Nord allenta la deterrenza che lo trattiene. Seul ha ridotto le proprie esercitazioni sul campo del 2026 da 51 a 22; poi Trump ha ordinato di chiudere Ulchi Freedom Shield una settimana prima, per corteggiare Kim, e Pyongyang ha risposto rafforzando la linea e attraversandola. Più Seul disarma la retorica, più Washington può trattare al di sopra della sua testa: gli editorialisti prevedono che Kim preferisca i colloqui con gli Stati Uniti a quelli con il Sud.
- hash: f51e1000
  it: |
    Il miglior mercato delle armi nasce dalla guerra che arma il nemico. Polonia, Romania e gli acquirenti baltici si riarmano per la guerra della Russia contro l'Ucraina (la Polonia ha preso il 47% delle sue importazioni dalla Corea del Sud nel 2021-25), mentre la stessa guerra ha prodotto l'alleanza Russia-Corea del Nord, tra 11,000-14,000 soldati nordcoreani in Russia e i pagamenti in tecnologia che minacciano Seul. Intanto il divieto di aiuti letali di Seul la tiene fuori dalla guerra che alimenta i suoi ordini, e la sua disputa con Kiev sui prigionieri nordcoreani (ott 2026) è ormai costata buona volontà a entrambe le parti.
- hash: 29e7d47e
  it: |
    L'indispensabilità invita alla coercizione. I chip sono passati dal 21% delle esportazioni (2024) a circa il 41% (gennaio-agosto 2026), il che dà a Seul leva su Washington e Pechino ma concentra anche il rischio: più chip di memoria il mondo chiede alla Corea, più Washington domanda la rilocalizzazione e scambi tra dazi e investimenti, e più Pechino punisce i cantieri che servono la strategia americana.
- hash: dcb7d1ec
  it: |
    Il bilanciamento richiede un'equidistanza che l'alleanza non consente. Lee dice che non si schiererà nella disputa Cina-Giappone su Taiwan, e Wang Yi ha detto a Seul il 19-20 ago 2026 di mostrare 'genuine strategic autonomy'; ma la 'strategic flexibility' di Washington per la USFK e la partnership cantieristica (MASGA) legano l'industria coreana alla stessa rivalità da cui Seul vuole restare fuori, e Pechino ha già messo un prezzo a quella scelta.
- hash: e352a3d0
  it: |
    La Corea del Sud è una potenza media che si è trasformata in qualcosa di cui ogni grande potenza ha bisogno (chip di memoria, cantieri navali, reattori, obici), e poi ha scoperto che essere necessari non equivale a essere al sicuro. La lettura di Luttwak riguarda un'alleanza che paga il proprio garante: il trattato del 1953 e i 28,500 soldati restano il fatto su cui poggia tutto, ma dal 2025 il garante fissa un prezzo in dazi, impegni di investimento, acquisti di armi e pagamenti di sostegno, taglia di propria iniziativa le esercitazioni alleate per corteggiare l'avversario e sposta batterie di difesa aerea in un altro teatro. Seul risponde con l'unica mossa strategica aperta a un dipendente ricco: rendersi più utile (MASGA, il fondo da USD 350bn) e più autonoma (sottomarini nucleari, arricchimento, controllo in tempo di guerra) insieme, il che costituisce segnali contraddittori per un garante. Sull'altro fronte c'è una deterrenza che affronta un avversario che ha smesso di parlare: Pyongyang ha sostituito un'ostilità da negoziare con un confine da costruire, con denaro russo ed esperienza di combattimento alle spalle, e l'apertura di Lee (altoparlanti spenti, rammarico per i droni, una proposta per porre fine alla guerra) incontra un muro di mine e silenzio. Il ripristino dei rapporti con Cina e Giappone nel 2026 è la terza gamba: un hedging, non un allineamento, e quella che lo stesso Wang Yi, ministro degli Esteri cinese, descrive come 'strategic autonomy'. Segnali che non rientrano in una riga: il desiderio di Putin, nel gennaio 2026, di 'restore ties' e l'ambasciatore di Seul a Vladivostok, mentre l'opzione Hyundai sullo stabilimento di San Pietroburgo è decaduta; e la rivelazione di due prigionieri nordcoreani trasferiti dall'Ucraina, che nel settembre-ottobre 2026 ha trasformato Kiev da causa in una disputa.
