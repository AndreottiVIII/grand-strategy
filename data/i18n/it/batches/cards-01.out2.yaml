items:
- hash: 0b8bed80
  it: |
    Le Comore sono un piccolo Stato la cui rivendicazione originaria su Mayotte è il suo principale capitale diplomatico, perseguita all'UN perché il veto francese del 1976 ha sbarrato al Consiglio di sicurezza la strada della rivendicazione. Con Azali la posizione internazionale del regime poggia su un patrono che non chiede conto delle elezioni (Pechino ha congratulato il presidente nel gennaio 2024, mentre l'ambasciata USA chiedeva chiarimenti) e su una presidenza che il voto del 2024 e il coprifuoco hanno reso più personale, non meno. La successione al figlio, i legami con il Golfo e l'Oceano Indiano e i flussi francesi che la scheda elenca non sono coperti dalle fonti lette in questa fase, quindi restano aperti.
- hash: f0ce34bb
  it: |
    Mantenere in crescita l'economia con il nuovo governo PAICV. Dopo la vittoria del 17 maggio 2026, il partito ha promesso un 'novo Cabo Verde' di crescita, con tutte le isole partecipi della governance, non solo Praia.
- hash: c78271f3
  it: |
    Portare investimenti portoghesi nelle energie rinnovabili e in un parco tecnologico a Praia. Il primo ministro Montenegro, a Capo Verde nell'aprile 2024, ha esortato gli investitori portoghesi a usare la strategia di diversificazione, e il Paese è partner fondatore dell'AIR Centre.
- hash: be8e5d67
  it: |
    Il Portogallo come canale verso i fondi e gli investitori europei: l'AIR Centre (fondato nel 2017, con Capo Verde partner fondatore) e gli investimenti portoghesi corteggiati nel 2024. La diplomazia delle isole atlantiche passa soprattutto per Lisbona, e le fonti lette non mostrano altri canali nel 2025-2026.
- hash: ef42767d
  it: |
    Una maggioranza di misura. Il PAICV ha conquistato 37 dei 72 seggi dell'Assemblea nazionale (48.04% dei voti) e il MpD ne ha mantenuti 33 (44.75%). Trentasette è esattamente la soglia della maggioranza, quindi il nuovo governo non ha margini in caso di un voto perso in aula; l'affluenza è stata del 46.5%.
- hash: e88a8c70
  it: |
    Un'opposizione dall'altra parte di una divisione quasi paritaria. Il MpD, che aveva puntato a un terzo mandato per Ulisses Correia e Silva, mantiene 33 seggi e quasi il 45% dei voti, quindi ogni decisione in materia estera o fiscale sarà discussa in aula corpo a corpo.
- hash: 2c54ec19
  it: |
    Corteggiare gli investitori portoghesi perché portino avanti il piano di diversificazione lega l'economia al capitale dell'ex metropoli, mentre il nuovo governo promette un 'new Cape Verde' con un ruolo per tutte le isole. Nostra lettura (confidenza C): il canale di Lisbona è ciò che mostrano le fonti, e la promessa riguarda l'economia dell'arcipelago stesso, quindi i due aspetti potrebbero divergere.
- hash: d3e25f88
  it: |
    Le elezioni di Capo Verde del 17 maggio 2026 hanno chiuso l'ambizione del MpD a un terzo mandato: il PAICV ha conquistato 37 seggi su 72, e Francisco Carvalho è stato indicato come primo ministro designato, con il 19 giugno indicato come data del giuramento secondo un riassunto di ricerca che nessuna seconda fonte ha confermato. I legami esterni dello Stato che le fonti qui lette passano per Lisbona (l'AIR Centre e gli investimenti portoghesi), mentre Cina e Stati Uniti sono presenti ma non documentati in questa fase. UE, ECOWAS, Brasile e CPLP, il porto e il debito cinesi, gli accordi MCC e i dati sulle rimesse e sul turismo sono lacune aperte per una seconda fase.
- hash: ad2567cd
  it: |
    Far scendere il tasso di omicidi. Laura Fernández, insediatasi l'8 maggio 2026 come successora di Rodrigo Chaves, ha fatto campagna sulla criminalità e copia il modello Bukele: un mega-carcere, stati di emergenza nelle aree controllate dalle bande e più scanner per i carichi nei porti e negli aeroporti. Gli omicidi sono cresciuti di oltre il 50% sotto Chaves, entrato in carica nel 2022.
- hash: d64dfa7c
  it: |
    Tenere calde le relazioni con la Cina mentre il fronte della sicurezza resta con Washington. Pechino le ha fatto le congratulazioni per il risultato e definisce il rapporto come uno che ha 'developed smoothly'.
- hash: 9700e3f2
  it: |
    Legge e politica di sicurezza interne: un mega-carcere, dichiarazioni di emergenza nelle aree controllate dalle bande e scanner per i carichi nei porti e negli aeroporti, il pacchetto di strumenti Bukele annunciato in campagna elettorale. Non ancora confermato da una fonte governativa.
- hash: cd1ead27
  it: |
    Le congratulazioni diplomatiche come canale: il segretario di Stato Marco Rubio ha lodato la sua 'tough stance on drug trafficking' e il presidente cinese si è congratulato con lei, così entrambe le capitali sono state coinvolte il giorno del risultato.
- hash: 1c42a13a
  it: |
    Il problema degli omicidi è quello a cui il governo deve rispondere, e si è aggravato sotto il governo che lei prosegue: un tasso di omicidi cresciuto di oltre il 50% dal 2022 fa della sicurezza la prova del nuovo mandato.
- hash: 3f83e58c
  it: |
    La campagna promette di porre fine alla crescita degli omicidi con la stessa agenda con cui Chaves si era presentato nel 2022, e il tasso di omicidi è salito sotto il suo mandato. La linea di sicurezza che eredita è quella che non ha ancora funzionato, e il suo apprezzamento a Washington poggia sullo stesso tema del narcotraffico.
- hash: 3e567693
  it: |
    La Costa Rica di Laura Fernández è innanzitutto un governo della sicurezza: la sua campagna si è concentrata sulla criminalità dopo che il tasso di omicidi è cresciuto di oltre il 50% con il suo predecessore Rodrigo Chaves, e promette il metodo Bukele per invertire la tendenza. Washington loda la linea dura sul narcotraffico e Pechino si congratula con il linguaggio sereno che usa per una relazione che vuole mantenere, quindi entrambi i partner sono giudicati sullo stesso banco di prova della sicurezza. Il paradosso è che l'agenda che eredita è quella che non ha fermato gli omicidi, quindi più il legame con l'agenda antidroga di Washington è stretto, meno tocca il tasso di omicidi che la giustifica.
- hash: 9b018e9e
  it: |
    Tenere il sistema a partito unico, la presidenza e ogni incarico ufficiale fuori da qualsiasi accordo con Washington. Il 20 marzo 2026 un vice ministro degli Esteri ha detto che non erano negoziabili, dopo le notizie secondo cui l'amministrazione voleva Díaz-Canel fuori con due anni di mandato ancora da scontare.
- hash: 45e9acc3
  it: |
    Far arrivare il carburante attraverso il blocco. Il ministro dell'Energia ha dichiarato il 13 maggio 2026 che Cuba aveva esaurito il diesel e l'olio combustibile e stava ancora negoziando le importazioni di carburante, che il rialzo dei prezzi petroliferi legato alla guerra USA-Israele con l'Iran rende più difficili.
- hash: 29588e19
  it: |
    Mantenere aperte le linee di sopravvivenza esterne, da qualunque partner ancora in grado di inviarle: una petroliera di greggio russo, riso vietnamita, gli operatori spagnoli degli alberghi e un'offerta messicana, formulata nel giugno 2026, di riprendere le spedizioni tramite imprese commerciali senza un calendario.
- hash: 4b29133f
  it: |
    Canali che restano aperti sotto pressione. L'Avana ha confermato colloqui ad alto livello con Washington il 13 marzo 2026, pur mantenendo la propria linea politica. Una mediazione legata al Vaticano ha preceduto il rilascio di 51 prigionieri nel marzo 2026.
- hash: 636eed31
  it: |
    Il turismo, gestito in gran parte da catene alberghiere straniere. Le catene spagnole gestiscono gran parte del settore; Meliá, con 34 hotel, ha annunciato nel luglio 2026 che cesserà le attività a Cuba in un contesto di sanzioni USA e di stretta sul carburante, dopo che Iberostar aveva smesso di gestire alberghi.
- hash: '49735234'
  it: |
    Nessuna riserva di carburante. Il 13 maggio 2026 il ministro dell'Energia ha detto che Cuba non aveva 'no reserves' di carburante; molti quartieri dell'Avana sono rimasti senza corrente per 20-22 ore al giorno, e la rete funziona con greggio nazionale, gas e rinnovabili.
- hash: 94e2ae76
  it: |
    Il blocco USA sul carburante. L'ordine esecutivo del 29 gennaio 2026 ha dichiarato Cuba una 'unusual and extraordinary threat' e ha autorizzato dazi su qualsiasi Paese che le vendesse petrolio. Gli esperti UN per i diritti umani hanno definito la misura illegale nel febbraio 2026, e a maggio il blocco durava da quattro mesi.
- hash: afe2dd4e
  it: |
    Emigrazione. Con le porte statunitensi in gran parte chiuse ai cubani, essi raggiungono il Brasile, spesso passando per la Guyana, che li ammette senza visto. La polizia brasiliana ha intercettato 108 cubani in un solo giorno nel giugno 2026.
- hash: d51e0ee0
  it: |
    Il dazio sul carburante è pensato per far mancare energia alla rete dell'Avana, ma agisce attraverso i fornitori dell'Avana. Le spedizioni messicane si sono fermate nel gennaio 2026 sotto la pressione USA, e Sheinbaum ha avvertito nel febbraio che i dazi potrebbero far scattare una crisi umanitaria. Più l'Avana si oppone a Washington, meno navi raggiungono la sua rete.
- hash: b1690267
  it: |
    Il turismo è la principale fonte di valuta pregiata, eppure passa attraverso catene straniere che le sanzioni USA possono far uscire dal Paese. L'uscita di Meliá restringe il settore di cui l'Avana ha più bisogno per pagare il carburante.
- hash: 4ca3912b
  it: |
    La strategia di Cuba è resistere al blocco del carburante senza cambiare il proprio ordine politico, e tiene aperto ogni canale, da una petroliera russa e riso vietnamita a un'offerta messicana e alla mediazione vaticana, rifiutando però di negoziare il sistema stesso. I suoi mezzi sono ridotti: il turismo gestito da catene straniere e pochi canali diplomatici, a fronte degli Stati Uniti, che hanno trasformato la fornitura di carburante in sé nella leva. Il paradosso è strutturale: la pressione destinata a far piegare l'Avana agisce attraverso i suoi fornitori, quindi ogni partner che esita lascia la rete più al buio e spinge altri cubani a partire.
- hash: 19257b8b
  it: |
    Porre fine alla divisione dell'isola secondo la formula UN: una federazione bizonale e bicomunitaria con uguaglianza politica, e con essa l'occupazione turca del Nord (fuori dal controllo della Repubblica, pur rientrando nella sovranità che essa rivendica): ritiro delle truppe turche e fine del sistema dei Trattati di garanzia. Il tavolo è di nuovo aperto (Guterres sull'isola dal 27 al 29 luglio 2026, incontri ripetuti tra i leader con Erhurman, un 'convergence document' che si dice in forma definitiva), ma la linea di Nicosia è riprendere da dove si era fermato Crans-Montana nel 2017.
- hash: 9aedad58
  it: |
    Procurarsi la sicurezza fisica che la Repubblica non può fornire: uno scudo aereo e navale greco nell'ambito della dottrina di difesa congiunta, forze francesi in base a un partenariato strategico e a un Status of Forces Agreement (SOFA), accesso alle armi USA (deroga annuale all'embargo), difesa aerea israeliana e la spinta verso il Partnership for Peace della NATO. Il drone di fabbricazione iraniana che ha colpito la RAF Akrotiri il 2 marzo 2026 ha trasformato questo obiettivo da desiderio a lungo termine in agenda quotidiana.
- hash: 698cc936
  it: |
    Trasformare il gas offshore in un posto al tavolo energetico europeo: Aphrodite (Chevron, NewMed, Shell) e Cronos (Eni, TotalEnergies) attraverso gasdotti e liquefazione egiziani, una decisione finale di investimento sul Blocco 12 nel 2027, il primo gas di Cronos verso l'Egitto intorno al 2028, e il cavo elettrico Great Sea Interconnector verso la Grecia come legame fisico con la rete UE.
- hash: 7fb46e21
  it: |
    Usare l'appartenenza all'UE come leva che a Cipro manca a livello bilaterale: la presidenza del Consiglio 2026 (1 gennaio - 30 giugno, motto 'An Autonomous Union - Open to the World'), un veto sull'accesso della Turchia ai fondi di difesa SAFE e all'ammodernamento dell'unione doganale, e un ruolo dell'UE nei negoziati su Cipro. Il prezzo che Cipro chiede per allentare il veto è un percorso di soluzione e il PfP.
- hash: 64dd3c9c
  it: |
    Mantenere un'economia dei servizi ad alto reddito (turismo, trasporto marittimo, finanza, ICT; crescita prevista dall'IMF per il 2026 del 3%, debito pubblico in calo verso il 51% del GDP dal 113.6% del 2020) lasciandosi alle spalle la reputazione di rifugio per il denaro russo: chiusura di conti, cancellazione delle società di comodo (shell company) e fine dei passaporti d'oro.
- hash: f58efd64
  it: |
    Essere la porta occidentale del Mediterraneo orientale: un ponte verso Egitto, Libano, Siria, Israele e Golfo (il vertice di Nicosia del 24 aprile 2026 con i partner mediorientali), il corridoio marittimo Amalthea e il piano di evacuazione Estia, un posto in ogni sala senza prendere parte alla guerra con l'Iran.
- hash: 0c2a8d20
  it: |
    Il canale dei buoni uffici UN, condotto attraverso incontri diretti tra i leader con il leader turco-cipriota Tufan Erhurman (eletto il 19 ottobre 2025 con il 62.8% contro Tatar, sostenuto da Ankara), un inviato personale (Maria Angela Holguin) e una conferenza 5+1 con i garanti auspicata; 19 'new ideas' presentate a Guterres a New York nel settembre 2026.
- hash: e1b006b9
  it: |
    La presidenza del Consiglio dell'UE da gennaio a giugno 2026 come palcoscenico: tre vertici, 19 riunioni informali e 52 formali dei ministri, il Consiglio europeo informale di Nicosia con i partner mediorientali (24 aprile), una visita a Kiev (4 dicembre 2025) con 19 proposte per l'Ucraina, e l'allargamento come priorità assoluta.
- hash: fa361825
  it: |
    Scudi in prestito: F-16 greci e una fregata lasciati a Cipro a tempo indeterminato dopo il 2 marzo 2026, una fregata francese e sistemi antidrone (marzo 2026) e un SOFA con la Francia in avvicinamento alla firma, sistemi d'arma israeliani (tre tipi) ed esercitazioni trilaterali con Grecia e Israele, accesso alle armi USA ripristinato da una deroga annuale. La Guardia Nazionale è essa stessa piccola e il bilancio della difesa 2027 è tagliato.
- hash: 6a86bbb9
  it: |
    Diplomazia energetica: un accordo quadro con l'Egitto (30 marzo 2026) che copre Cronos e Aphrodite, con Cipro che ha accettato a febbraio di pagare l'intero costo del gasdotto, pari a USD 2bn, in cambio dell'uso della liquefazione egiziana; un accordo di unitizzazione non firmato con Israele sulla sovrapposizione Aphrodite-Yishai; un trattato di delimitazione marittima con il Libano (26 novembre 2025).
- hash: cb1f6378
  it: |
    La cornice dell'occupazione: la linea del presidente secondo cui 'no country that occupies territories or threatens the security of member states can benefit from European financial instruments in the field of defence' (SAFE), con i media turchi e Fidan che rispondono che Nicosia abusa del veto; e una linea su Gaza fondata sull'accesso umanitario (Amalthea), unita al pieno sostegno al piano di Trump.
- hash: fbb7e647
  it: |
    Il Nord non è di Nicosia da dare o da prendere: la Turchia mantiene truppe lì, sostiene una linea a due Stati (lo stesso Erhurman afferma che nessuna decisione su Cipro viene presa senza consultare Ankara), detiene un veto de facto sul percorso di Cipro verso la NATO, e Devlet Bahceli ha chiesto al parlamento del Nord di unirsi alla Turchia dopo la vittoria di Erhurman. La Repubblica può porre il veto alla Turchia nell'UE, ma non può smuoverla sull'isola.
- hash: d91c3b75
  it: |
    Due Sovereign Base Areas britanniche (Akrotiri, Dhekelia) sorgono sull'isola in base al Trattato di stabilimento del 1960 e non sono di Cipro da comandare: Londra afferma che il loro status 'is not in question', e a Washington è stato consentito di usarle nella guerra con l'Iran. Nicosia può chiedere trasparenza e un comitato tecnico congiunto, non la restituzione del territorio (Reuters non ha visto segnali che chieda la chiusura delle basi).
- hash: 07c74168
  it: |
    Dimensioni e denaro: un esercito che non può dissuadere la Turchia, la difesa aerea fornita da Grecia e Francia, una deroga di un anno alle armi USA che il presidente dice rende impossibile la strategia, e un bilancio della difesa 2027 con un 'huge decrease'.
- hash: 946dd4ac
  it: |
    Il gas non ha una strada propria: Aphrodite e Cronos dipendono dai gasdotti e dalla liquefazione egiziani, Aphrodite da un accordo ancora non firmato con Israele sulla sovrapposizione di Yishai (fino al 10% del giacimento, oltre EUR 1bn), e il Great Sea Interconnector è slittato (le indicazioni di Nexans presuppongono nessun lavoro nel 2026; la EIB ha riesaminato le proprie finanze da aprile).
- hash: 86bb207f
  it: |
    Reputazione e diritto: 'Cyprus Confidential' dell'ICIJ (71 russi sanzionati dopo il 2022 con fondi gestiti a Cipro), un video trapelato nel gennaio 2026, sospettato di essere riconducibile al Cremlino, che ha gettato un'ombra sulla presidenza, e l'applicazione delle sanzioni UE che Cipro deve mostrare di attuare.
- hash: 5516a9df
  it: |
    L'opinione interna tira in due direzioni: l'AKEL attacca il rafforzamento dei legami con Israele e i manifestanti scandiscono 'British bases out of here' dopo l'attacco ad Akrotiri, mentre un pubblico solidale con Gaza si scontra con un governo che sostiene il piano di Trump.
- hash: 67ee1c2a
  it: |
    Il veto che protegge Cipro è il motivo per cui la Turchia non ha interesse in un accordo. Tenendo la Turchia fuori da SAFE e dall'ammodernamento dell'unione doganale, Nicosia detiene l'unica carta che costa qualcosa ad Ankara; ma permette anche a Fidan di presentare Cipro come l'ostacolo alla normalizzazione tra Turchia e UE, e toglie il premio UE che potrebbe far pagare ad Ankara un accordo. Il compromesso proposto da Christodoulides nel dicembre 2025 (PfP e il disgelo con l'UE in cambio di una ripresa del negoziato) è un'ammissione che il solo veto non funziona.
- hash: 1bd062af
  it: |
    La sicurezza comprata dall'esterno porta la guerra all'interno. Ospitare basi britanniche (e, nella guerra con l'Iran, usate dagli USA) e legarsi a Israele e allo scudo aereo occidentale è ciò che rende Cipro sicura dalla Turchia solo sulla carta, ed è ciò che ha attirato sull'isola droni di fabbricazione iraniana dal 1 al 4 marzo 2026; il governo afferma di non prendere parte ad alcuna operazione e di non essere stato informato della minaccia.
- hash: '89673091'
  it: |
    Più si arma e si allinea, meno probabile diventa l'accordo che dice di volere. Il SOFA con la Francia, le armi israeliane e le esercitazioni Grecia-Israele-Cipro forniscono ad Ankara il suo argomento di repertorio: che la parte greco-cipriota sta militarizzando l'isola; mentre l'elezione di Erhurman è la prima vera apertura dal 2017 e dipende dal fatto che Ankara lo lasci trattare.
- hash: 3610c2ac
  it: |
    Una presidenza 'Autonomous Union' la cui sicurezza è bilaterale e non europea. Nicosia ha presieduto la spinta verso l'autonomia di difesa europea mentre la sua difesa aerea veniva da Grecia e Francia, il suo accesso alle armi da una deroga USA rinnovata ogni anno, il suo ammodernamento della difesa aerea da Israele e la porta verso la NATO tenuta chiusa dalla Turchia; la clausola dell'articolo 42.7 UE che vuole attivare non l'ha ancora protetta.
- hash: 01fb1805
  it: |
    Il ponte energetico fa di Cipro un cliente dei suoi partner. Per far uscire il gas, Nicosia ha accettato le condizioni dell'Egitto (l'intero costo del gasdotto da USD 2bn in cambio della liquefazione egiziana, un prezzo indicizzato al Brent, acquirenti dominati dall'Egitto) e deve regolare la sovrapposizione Aphrodite con Israele, quindi la risorsa che avrebbe dovuto dare leva su Turchia ed Europa va prima negoziata con Il Cairo e Gerusalemme.
- hash: 7af62436
  it: |
    Fare pulizia sul denaro russo costa il modello che proteggeva. La chiusura dei conti (riportata per l'82% dei clienti russi tra il 2014 e il 2022) e l'abolizione dei passaporti d'oro riducono il rischio di sanzioni e collocano Cipro nel fronte occidentale, ma l'economia dei servizi cresciuta su quel capitale ora dipende da visitatori britannici e israeliani e dai fondi UE, entrambi più esposti a una guerra in Medio Oriente.
- hash: 51bc7ef7
  it: |
    Cipro conduce la grand strategy di un piccolo Stato membro dell'UE che è anche per metà un'isola occupata: non può modificare i fatti sul terreno, quindi moltiplica il numero di attori i cui interessi sono legati all'isola e spera che uno di essi finisca per muovere la Turchia. L'UE è il principale moltiplicatore (appartenenza, presidenza, veto su SAFE e unione doganale), l'anello greco-francese-israeliano-statunitense è il secondo (difesa aerea, armi, esercitazioni), il gas è il terzo (Egitto, Israele, Grecia, Chevron, Eni). Ciascuno funziona, e ciascuno ha un costo luttwakiano: il veto dà ad Ankara una ferita aperta, l'anello le dà un pretesto, il gas fa di Cipro un cliente del Cairo e di Gerusalemme, e le basi che legano Gran Bretagna e Stati Uniti all'isola sono quelle che hanno attirato sull'isola droni di fabbricazione iraniana dal 1 al 4 marzo 2026. I due fatti dell'anno tirano in direzioni opposte: l'elezione di Erhurman (19 ottobre 2025, 62.8%) e un tavolo UN che si muove, contro una Turchia più radicata nei dossier di difesa e commercio dell'UE e una guerra che coinvolge Gaza e l'Iran e ha fatto di Cipro uno Stato di prima linea. Due segnali che non sono righe: Guterres lascia l'incarico il 31 dicembre 2026, quindi Nicosia ha una scadenza che non ha fissato, e le lodi del presidente per Trump ('you know where you stand') accompagnano un taglio del bilancio della difesa in patria. Il Nord non è un attore dell'atlante: è registrato attraverso la posizione della Turchia, le righe e la presenza di truppe, non come territorio con un grado proprio.
