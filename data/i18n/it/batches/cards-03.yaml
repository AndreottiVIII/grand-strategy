  it: ''
- hash: 851c78d1
  kind: cards
  en: 'Open threat assessment and public resilience: Supo''s annual overview names Russia the main threat and warns that Russian influencing will grow after the war; Finland''s public line is calibrated
    (Valtonen, April 2025: Russia is not regarded as an enemy, but its actions and breaches of international law are opposed) while Stubb tells Finns to ''mentally prepare'' for an eventual thaw.'
  it: ''
- hash: c534e95c
  kind: cards
  en: 'Geography: the longest EU/NATO land border with Russia, and a southern coast on a gulf where Russian-linked shipping passes freely. Reinforcement is partly offshore - the Forward Land Forces battlegroup
    (about 600 Swedish soldiers, expandable to 1,200) is based at Boden in Sweden and rotates into Finland, it is not stationed there.'
  it: ''
- hash: 77e9f7fe
  kind: cards
  en: 'Public finances: the general government deficit was 4.4% of GDP in 2024 and 4.3% in 2025; the Orpo coalition (National Coalition, Finns Party, Christian Democrats, Swedish People''s Party; 108 of
    200 seats) is cutting EUR 6bn over the term while raising defence spending, which is why the 2030 target is 3.2% and not more.'
  it: ''
- hash: 3bbf65d8
  kind: cards
  en: 'Dependence on a patron it cannot discipline: the F-35, the DCA, the Arctic cutter contract and the Atlantic guarantee all run through Washington, which in January 2026 threatened an extra 10% tariff
    on Finland and seven other countries over Greenland and already charges 15% on EU goods. Stubb called the Greenland crisis the hardest for Finland, since it opposes a close ally on sovereignty and territorial
    integrity.'
  it: ''
- hash: 70ac19e3
  kind: cards
  en: 'Law at sea: UNCLOS limits what a coastal state can do in its exclusive economic zone. The Helsinki District Court threw out the Eagle S case on 3 Oct 2025 for lack of jurisdiction (EEZ, not territorial
    waters); the Court of Appeal revived it in 2026, but the crew has left Finland and the Supreme Court may still intervene. Deterring cable sabotage by prosecution is slow and uncertain.'
  it: ''
- hash: 82b7c035
  kind: cards
  en: 'Coalition politics: the Finns Party and the Christian Democrats block recognition of Palestine that President Stubb says he would sign, and have criticised the 2025 vote declaring settlements illegal;
    the 2027 election is the next test. Foreign policy is shared between a president who speaks and a government that pays.'
  it: ''
- hash: f5ebb3dc
  kind: cards
  en: 'The north is also a domestic frontier: five of the 15 DCA sites are in Lapland and the first F-35s are based at the Lapland Air Wing in Rovaniemi, while the Sami Truth and Reconciliation Commission
    delivered its 700-page report with 68 proposals on 4 Dec 2025 and Orpo said a state apology should follow. Defending the Arctic cannot be done against the Sami homeland (our inference from the two facts).'
  it: ''
- hash: 80276b22
  kind: cards
  en: 'The shut border protects and isolates in the same stroke. Closing every crossing ended the instrumentalised migration Helsinki calls a Russian hybrid attack, but it also ended contact: on 1 Jul 2026
    Russia closed five of its rail crossings with Finland (leaving only Vainikkala) and sent the formal notice on 9 July, while Stubb says Finns must prepare mentally for an eventual thaw. Finland''s best
    card for a future bargain, the border, is the one it has locked.'
  it: ''
- hash: 1409d847
  kind: cards
  en: Joining NATO ended Finland's exposure and created a front. Peskov says Finland and Sweden 'reduced relations to zero' by bringing NATO infrastructure to their soil, and Ukrainian drones, diverted
    by Russian GNSS jamming in the eastern Gulf of Finland, crossed into Finnish airspace in spring 2026, forcing the army to close airspace and sea lanes three times in a month. The alliance that guarantees
    Finland also ties it to the spillover of someone else's war.
  it: ''
- hash: 8106d870
  kind: cards
  en: The Trump channel buys access and exposes Finland to the man it courts. Stubb's rapport produced the icebreaker memorandum and the Washington hearing, yet in January 2026 Trump put Finland on the
    list of eight countries facing an extra tariff over Greenland, and Stubb named that crisis the hardest for Finland. The more Finland bets on one American president, the more it must defend Denmark against
    him.
  it: ''
- hash: 5cbb2217
  kind: cards
  en: A rules-based order defended with tools the rules do not give. Finland seized the Eagle S (Dec 2024) and the Fitburg (31 Dec 2025) to deter cable sabotage, but the district court ruled it had no jurisdiction
    in the EEZ and ordered the state to pay the crew's costs; the Fitburg was released after investigation. Each seizure tests the law of the sea that Finland needs to stay intact.
  it: ''
