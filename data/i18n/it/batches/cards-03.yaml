  it: ''
- hash: 4faaf7a3
  kind: cards
  en: 'Turn a small economy''s niches into access in Washington and Berlin: Arctic icebreaker know-how (the 9 Oct 2025 Stubb-Trump memorandum for up to 11 Arctic Security Cutters, about USD 6.1bn; Rauma
