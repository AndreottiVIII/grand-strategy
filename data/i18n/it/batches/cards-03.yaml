  it: ''
- hash: c4c19fdb
  kind: cards
  en: 'Nordic-Baltic and northern-flank groupings: the revised NORDEFCO memorandum of 6 May 2025, a Nordic combined air-operations concept (around 250 combat aircraft, a combined air operations centre at
