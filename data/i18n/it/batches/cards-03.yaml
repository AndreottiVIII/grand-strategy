  it: ''
- hash: e4fd5072
  kind: cards
  en: 'Hardware and basing: 64 F-35A Block 4 (contract about EUR 8.3bn, December 2021, initial operational capability planned early 2028), David''s Sling air defence (about EUR 316m), US access to 15 sites
