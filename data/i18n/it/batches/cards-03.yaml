  it: ''
- hash: 57826e32
  kind: cards
  en: 'The presidential channel to Trump: Stubb''s golf and Mar-a-Lago diplomacy, the White House meeting of 9 Oct 2025 with Orpo present, and a stated aim of passing European messages to Washington. It
