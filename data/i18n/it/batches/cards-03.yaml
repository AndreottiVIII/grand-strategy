  en: Arming against Russia with Israeli weapons while voting against Israeli policy. Over 40% of additional Finnish defence procurement after 2022 came from Israel (David's Sling, Gabriel 5, Spike), the
    defence memorandum with Israel was extended for ten years, and Defence Minister Hakkanen said in September 2026 that long-term cooperation must continue; yet Finland voted in 2025 that settlements are
