# Translate every `en` into it. Write the translations to the file cards-03.out.yaml next to this one,
# as `items:` of `- hash: <same hash>` / `it: <translation>`, appending one item at a time (valid YAML at
# every step), never editing this file. Keep names, dates, numbers and quotes; register of a foreign-office
# brief: dry, precise, no flourish.
lang: it
items:
- hash: 281c0fc3
  kind: cards
  en: Diversifying patrons strains the one that pays for the army. The Xi visit of Sept 2026 (a third phase of the TEDA zone, Chinese jets in the air in 2025 and the J-35 talked about) invites the US Congress
    to question the USD 1.3bn aid that nothing else replaces; neutrality in the Iran war keeps Washington and Tehran talking to Cairo but irritates the Gulf that funds it.
  it: ''
- hash: 496ec053
  kind: cards
  en: Peace made the canal reopen and war closes it again. Egypt's Sharm el-Sheikh summit (Oct 2025) ended the Houthi attacks and brought Maersk back; by Sept 2026 the Houthis hold the Bab al-Mandab shore,
    so the revenue Cairo was forecasting (about USD 8bn in 2026/27) depends on the wars it mediates but does not control.
  it: ''
- hash: e4f25957
  kind: cards
  en: 'Egypt is a state that sells its position. It cannot feed, fuel or finance itself,

    so the strategy of the Sisi regime is to be too central to be allowed to fail:

    the Suez Canal and the Rafah crossing, the Gaza table, the Arab League seat,

    a Mediterranean liquefaction hub, an army that can be lent to the Gulf. Each

    of the payers is a different patron (the IMF and the EU for the

    balance sheet, the Gulf for cash, Washington for the army, Paris and Berlin for

    the equipment, Moscow for the nuclear plant, Beijing for industry) and the cost

    is that none of them is aligned with the others on Sudan, Israel or Iran. The year

    2026 widened every gap at once: the US-Iran war doubled the energy bill and put

    Egyptian jets on Emirati soil while Cairo called itself neutral; the Israeli gas

    that was meant to be the bridge is the lever Jerusalem uses against the Sinai

    buildup; the Houthis, not Egypt, decide whether the canal pays; and the Nile has

    turned from a water dispute into a Horn-wide alliance contest with Ethiopia in civil

    war. The Luttwak reading is that Egypt''s moves are rational at each level and

    self-defeating across levels: tactical gains (a summit, a deposit, a contract) are

    paid for by a strategic dependency that will be called in when the IMF programme

    ends in December 2026. Gaps in this card: Jordan, Iraq, India, the UK, Djibouti, and

    the status of Tiran and Sanafir were not researched (no source retrieved).'
  it: ''
- hash: f1b76887
  kind: cards
  en: 'Stop Ethiopia''s Red Sea access drive from becoming an attack on Eritrean territory: Abiy''s sea-access claim is read in Asmara as a claim on Assab, so the aim is to keep the port and the border
    closed to it.'
  it: ''
- hash: 9f622fac
  kind: cards
  en: 'Keep an armed Tigrayan force from reforming next to the border: Asmara was left out of the 2022 Pretoria settlement that disarmed the TPLF, and it treats any renewed Tigrayan army as a threat on
    its border.'
  it: ''
- hash: 1b357ace
  kind: cards
  en: 'End the isolation and turn the Red Sea into partners and money: the Asmara ring with Egypt, Somalia and Sudan, the Chinese partners in the Bisha and Colluli mines, and Russia''s support at the UN.'
  it: ''
- hash: 5447c1ba
  kind: cards
  en: 'The Asmara ring: the trilateral with Egypt and Somalia (Asmara, October 2024), the four-way El Alamein summit with Sudan (4 October 2026), and membership of the Saudi-led Red Sea Council, whose 2020
    charter covers piracy and smuggling, not defence.'
  it: ''
- hash: 166b3ea7
  kind: cards
  en: A conscript army (see constraints) that, on unverified reports of 7 October 2026, moved into Tigray around Adigrat and Idaga Hamus; the information minister did not deny the crossing and called Ethiopia's
    self-defence framing a 'fallacious narrative'.
  it: ''
- hash: f06a37f0
  kind: cards
  en: 'State capital from mines and the diaspora: Zijin Mining (China) holds 55% of the Bisha copper-zinc-gold mine and the state miner ENAMCO 45%; the Colluli potash project passed in 2023 from Danakali
    to China''s Sichuan Road and Bridge Group (the other half presumed ENAMCO''s); the 2% tax on Eritreans abroad, which the government calls a rehabilitation levy, was a UN sanctions target from 2011 until
    the UN lifted its measures in 2018.'
  it: ''
- hash: 94efb675
  kind: cards
  en: 'Indefinite national service: the 1995 proclamation sets 18 months for citizens over 18, but no fixed end is applied; Human Rights Watch says the open-ended service traps successive generations in
    forced labour, and the UN Special Rapporteur (June 2026) reports grave abuses and grounds to believe crimes against humanity continue.'
  it: ''
- hash: 6505be13
  kind: cards
  en: 'No constitution in force: the 1997 constitution, approved by referendum, was never implemented; the People''s Front for Democracy and Justice is the only party tolerated; Isaias Afwerki has ruled
    since independence in 1993 with no written succession, and Human Rights Watch dates the last legislative sitting to 2010.'
  it: ''
- hash: 81b53389
  kind: cards
  en: 'Isolation with a memory: UN measures from December 2009 (resolution 1907, over the Djibouti border and support to Somali armed groups) ran until 2018; the EU listed the National Security Office on
    22 March 2021; the US full entry ban on Eritrean nationals has applied since June 2025 and survived the December 2025 expansion.'
  it: ''
- hash: b1e536f2
  kind: cards
  en: 'The ring that keeps Ethiopia off the Red Sea is the evidence Addis Ababa uses against Eritrea: on 1 October 2026 Ethiopia accused Egypt, Eritrea and Sudan of backing the TPLF, and the rupture that
    followed, with troops reported at the border, is the escalation the ring was meant to deter.'
  it: ''
- hash: ac63f1aa
  kind: cards
  en: 'Eritrea runs the strategy of a garrison state that has turned isolation into method: an army with no end date, a constitution never applied, and a ring of partners (Egypt, Somalia, Sudan, with Russia
    at the UN) built to keep Ethiopia off the Red Sea. The structural problem is that it holds the coast and the port that Ethiopia wants, so each Ethiopian move on Assab reads in Asmara as an attack, and
    each Eritrean move in Tigray reads in Addis as an invasion. The 1-2 October 2026 rupture shows the paradox at full size: the ring is Addis Ababa''s proof of encirclement, and the ''no war, no peace''
    that Asmara kept from 2000 to 2018 is ending on the border.'
  it: ''
- hash: f24c82ef
  kind: cards
  en: 'Hold the southern flank: keep Morocco cooperative on migration and quiet on Ceuta and Melilla (which Madrid says are not negotiable), and keep Algerian gas flowing, by courting both Maghreb capitals
    at once. Madrid backs Morocco''s autonomy plan for Western Sahara (2022 joint declaration, welcomed UNSCR 2797 in Dec 2025) and in July 2026 reopened the relationship with Algiers.'
  it: ''
- hash: e1b9e4e2
  kind: cards
  en: 'Stay at the centre of the EU and make the Iberian peninsula less of an energy island: Bay of Biscay interconnector with France (due 2028), the EU-Mercosur deal Madrid wants applied at once, EU cover
    on trade (Brussels, not Madrid, answers US tariffs) and on migration.'
  it: ''
- hash: b248c3d5
  kind: cards
  en: 'Keep the Atlantic guarantee cheap: stay in NATO and in the US base arrangement while holding defence spending near 2.1% of GDP instead of the 3.5%+1.5% target agreed at The Hague in June 2025, to
    protect the welfare state and public finances.'
  it: ''
- hash: 911ee086
  kind: cards
  en: 'Be a rule-of-law, anti-war middle power on Gaza and Iran: recognise Palestine (May 2024), embargo arms to Israel by law (Oct 2025), refuse the US use of Rota and Moron for the Iran war (Mar 2026),
    decline Trump''s Board of Peace. The line also holds the left of the governing coalition together.'
  it: ''
- hash: 8fd919f6
  kind: cards
  en: 'Stay in office and keep the territorial settlement together: a minority coalition (PSOE and Sumar) that needs Catalan, Basque and other regional votes, with a snap general election called for 29
    November 2026 after the housing decrees fell, and Puigdemont''s return now cleared by the Constitutional Court.'
  it: ''
- hash: d9a7d528
  kind: cards
  en: 'Rebuild an Ibero-American and Mediterranean voice: the Ibero-American summit in Madrid (4-5 Nov 2026) with Delcy Rodriguez invited, the thaw with Mexico after the King''s March 2026 acknowledgement
    of abuses, migration pacts with Mauritania, and Gibraltar reopened under the July 2026 EU-UK treaty while the sovereignty claim stays.'
  it: ''
- hash: c8ba716f
  kind: cards
  en: 'Recognition and legal diplomacy rather than force: Palestine recognised on 28 May 2024, a total arms embargo on Israel passed by Congress 178-169 on 8 Oct 2025, the ambassador to Israel removed in
    March 2026, a ''No to the war'' line at the UN (23 Sep 2026), and joint declarations with Rabat (2022) and Algiers (treaty of friendship reactivated March 2026).'
  it: ''
- hash: 40e0f28c
  kind: cards
  en: 'Moral framing aimed at a domestic audience as much as a foreign one: Sanchez''s ''genocide'' language on Gaza, the published Rutte letter used to argue that Spain has an exemption from the 5% goal,
    and ''You cannot play Russian roulette with the destiny of millions'' to Trump (4 Mar 2026). Reuters found the anti-war stance gained the PSOE ground in April 2026 polls.'
  it: ''
- hash: d0341622
  kind: cards
  en: 'A modest force used as a veto and a hedge: the government says defence spending reached EUR 35.4bn in 2026 (about 2% of GDP, tripled since 2018), troops in Latvia, Slovakia, Romania, Bulgaria and
    Turkey instead of a higher percentage, and sovereign control over the joint-use bases at Rota and Moron, which Madrid refused for the Iran war and from which the US moved 15 aircraft.'
  it: ''
- hash: 63f6ec7b
  kind: cards
  en: 'Energy and migration bargaining: Medgaz gas from Algeria (34.5% of imports in 2025), a regasified-LNG reverse flow to Morocco, circular-migration pacts (Mauritania, Aug 2024), an extraordinary regularisation
    of undocumented migrants (about 900,000 applications by mid-June 2026), purchases that double as diplomacy (30 Turkish Hurjet trainers, Dec 2025) and a pragmatic opening to China (19 agreements in April
    2026).'
  it: ''
- hash: b7f22717
  kind: cards
  en: 'A fragile parliamentary base: no majority of its own, Junts (the Catalan right-nationalists) broke with the government in October 2025, no new budget is passing, and the snap election of 29 November
    2026 points, in current polls, to a PP-led coalition with Vox that would put the far right in central government for the first time since Franco. Every foreign-policy line is read as an election move.'
  it: ''
- hash: 187008bc
  kind: cards
  en: 'Corruption cases in the party and the family: the Koldo/Abalos/Cerdan mask and public-works cases (Abalos resigned his seat in January 2026 and was tried at the Supreme Court from April), Begona
    Gomez sent to a jury trial on 21 Sep 2026 for embezzlement and influence peddling. They hand the opposition, and Israeli ministers, a line against the government''s moral claims.'
  it: ''
- hash: 19d814f1
  kind: cards
  en: 'Energy dependence and the ''energy island'': Algeria supplied 34.5% of gas imports in 2025 and 29.2% in early 2026, and Medgaz is the line that Algeria reduced by 25% in May 2022 after the Sahara
    turn; the peninsula has only about 3% of its electricity connected to neighbours against an EU target of 15% by 2030, and the 28 Apr 2025 blackout (ENTSO-E: a voltage surge chain, ''perfect storm'')
    showed the exposure.'
  it: ''
- hash: ccc3ce8d
  kind: cards
  en: 'Dependence on the United States for hard security and on the EU for trade: Washington can threaten (Trump on 3-4 Mar 2026: cut off all trade; 8 Jul 2026: Spain ''came back all the way''), but only
    Brussels can act, so Madrid hides behind Commission competence, as Merz said (''no way to treat Spain particularly badly''). The defence industrial base is thin: FCAS collapsed in June 2026 and the
    new fighter and trainer buys come from partners.'
  it: ''
- hash: 34568c8b
  kind: cards
  en: 'Migration politics inside the EU: after the July 2026 Ceuta crossing Italy suspended Schengen arrangements with Spain for August and 22 member states wrote to the Commission calling the regularisation
    a pull factor. Spain cannot be both the humanitarian outlier and the hand that holds the southern border without Morocco''s policing.'
  it: ''
- hash: bc1f9a47
  kind: cards
  en: 'Weak leverage over Morocco on the one issue it cannot trade: Rabat reopened the Ceuta and Melilla claim in August 2026 through ministers, Spain summoned the ambassador, and Madrid says it ''will
    never speak'' about its territorial integrity, but it relies on Moroccan police to hold the border and on Moroccan goodwill for the Canary route.'
  it: ''
- hash: 027d2341
  kind: cards
  en: The Sahara turn bought quiet in Rabat and cost Algeria. In March 2022 Sanchez backed Morocco's autonomy plan; Algiers recalled its ambassador, suspended the friendship treaty and trimmed Medgaz, and
    Spain made up the gas elsewhere. In July 2026, after the thaw with Algiers, a Ceuta crossing of tens of thousands followed with Moroccan patrols reported absent, some analysts reading it as Rabat's
    irritation at the Algerian rapprochement. The two Maghreb capitals cannot both be courted without the one noticing.
  it: ''
- hash: '70897355'
  kind: cards
  en: Saving on defence to protect the welfare state makes Spain the one ally Trump names. The 2.1% line lets Madrid spend on pensions, but it turned a spending dispute into a trade and bases dispute (Oct
    2025 tariff threat, Mar 2026 'cut off all trade') and into the argument of those who say Spain free-rides on Europe's border and on NATO's umbrella. Madrid then raised the budget by billions in the
    weeks before Ankara, conceding in practice what it refused in principle.
  it: ''
- hash: 9aaff03d
  kind: cards
  en: Refusing the bases earned votes and cost cover. The Iran-war refusal and the Gaza embargo gained the PSOE ground at home (Reuters poll, April 2026), yet they pushed the US to move tankers out of Rota
    and Moron, put Madrid against Paris, Berlin and London on Iran, and left it with no channel to the White House just as Washington reviews its European posture. The base that makes Spain useful to the
    US is the one Spain has now shown it can close.
  it: ''
- hash: 11d167d5
  kind: cards
  en: The amnesty that bought the government now helps end it. The 2023 amnesty law won Catalan votes for Sanchez's investiture; Junts left in October 2025 over its non-application, and on 6 Oct 2026 the
    Constitutional Court ordered the Supreme Court to apply it 'preferentially and urgently', lifting Puigdemont's warrant three weeks before the 29 November vote. The same logic keeps Spain from recognising
    Kosovo, which Madrid reads through Catalonia, while its government depends on Catalan votes.
  it: ''
- hash: e219075b
  kind: cards
  en: Regularisation strengthens the labour market and weakens the Schengen standing. About 900,000 applications by mid-June 2026 gave Spain workers and tax base, but on 1 Aug 2026 22 states called it a
    pull factor, Italy and France reimposed checks after Ceuta, and the Commission found no direct link. Spain gains workers and loses standing with the governments it must work with inside the EU.
  it: ''
- hash: 073a4a0c
  kind: cards
  en: 'The China hedge feeds the American grievance it was meant to offset. Sanchez went to Beijing four times in four years (April 2026: 19 agreements, a strategic dialogue) and sells Spain as the pragmatic
    EU voice, while the Interior Ministry''s EUR 12.3m Huawei contract for storing court-ordered wiretaps drew a letter from the US intelligence committee chairs asking whether intelligence sharing with
    Spain should continue.'
  it: ''
- hash: 06654aa0
  kind: cards
  en: 'Spain''s grand strategy is the strategy of a middle power that has chosen to be

    ruled by its law and its domestic coalition rather than by its geography, and

    geography is now collecting. Madrid''s south is a border with a monarchy it

    cannot afford to quarrel with and a gas pipeline from a republic that cannot

    be ignored; its east is an energy island; its west an ally; its north a

    grudging partner (France) and a flat refusal of the Atlantic bill (2.1%

    against 5%). The Sanchez government answered each pressure with a legal

    gesture (the Sahara letter of 2022, Palestine in 2024, the arms embargo of

    2025, the bases refusal of 2026, regularisation), which won votes and

    moral standing but accumulated debts: Trump now names Spain as the outlier,

    Israel and Spain have downgraded embassies, Morocco reopened Ceuta and

    Melilla in August 2026 after a mass crossing, Italy suspended Schengen

    arrangements for a month. The Luttwak reading is that the gestures were

    cheap while the system was friendly, and became expensive when friction

    arrived in a pile - Iran war, Ceuta, NATO summit, Trump, an election. Two

    signals that are not rows: the government itself justifies the 2.1% line by the welfare

    state and public finances, so it is a domestic bargain as much as a

    strategy, and the snap election of 29 Nov 2026 makes every position here

    provisional: polls point to a PP-led government with Vox, whose foreign

    line on Gaza, Iran and Latin America would likely differ.'
  it: ''
- hash: 50587bb3
  kind: cards
  en: 'Make an attack on Estonia unthinkable and, if it comes, survivable: defence spending at 5.43% of GDP in 2026, a forward defence on the Russian border (Baltic Defence Line, 1st Brigade headquarters
    moved to Johvi 50 km from the border, a 1,000-troop base planned in Narva) and a deep-strike arsenal (HIMARS and Chunmoo launchers).'
  it: ''
- hash: 8ecfa419
  kind: cards
  en: 'Keep allied forces and the US guarantee physically in Estonia: the UK-led NATO battlegroup at Tapa (UK reinforcement brigade promised for 2027), the rotational US presence, and a European hedge (Nordic-Baltic,
    Polish, German and Korean suppliers) against an American drawdown.'
  it: ''
- hash: 3ff92aff
  kind: cards
  en: 'Ensure Russia loses in Ukraine and pays for it: aid fixed at 0.25% of GDP a year in the 2024 bilateral security agreement (0.28% planned for 2026, 0.35% in 2025), confiscation of frozen Russian assets,
    joint defence-industrial production with Kyiv, and no deal over Ukraine''s head.'
  it: ''
- hash: 3d646c08
  kind: cards
  en: 'Cut every strategic dependence on Russia and harden the infrastructure that replaces it: Baltic exit from the Russian grid (February 2025), a ban on Russian gas from 2026, protection of Estlink and
    the Gulf of Finland cables, Rail Baltica toward 2030.'
  it: ''
- hash: 89950bf3
  kind: cards
  en: 'Hold the home front against Russian leverage on the Russian-speaking minority: constitutional removal of local voting rights from Russian and Belarusian citizens (March 2025), a church law forcing
    the Orthodox Church to cut its administrative tie to the Moscow Patriarchate (Supreme Court upheld, June 2026), closed or restricted border crossings.'
  it: ''
- hash: 2b6f5198
  kind: cards
  en: 'Turn a small state into an agenda-setter: put the eastern flank at the top of EU and NATO priorities (Kaja Kallas as EU High Representative; Michal''s line that Europe''s defence now begins on the
    EU''s eastern border), export a defence industry (EUR 1.4bn a year by 2030) and the digital-state and cyber brand (Locked Shields, CCDCOE).'
  it: ''
- hash: eb5c9af1
  kind: cards
  en: 'NATO and EU forums used as multipliers: the Article 4 request after the MiG-31 intrusion of 19 Sep 2025, the Kallas post in Brussels, the push for confiscation of Russian assets (the EU kept about
    EUR 210bn frozen in December 2025, but chose a EUR 90bn borrowed loan instead of the reparations loan Tallinn wanted), bilateral security agreement with Ukraine.'
  it: ''
- hash: 7745a1fa
  kind: cards
  en: 'Public attribution and a public intelligence cycle: yearly reports of the Foreign Intelligence Service, the Milrem arson blamed on Russian special services (29 Sep 2026) with the ambassador summoned,
    the Kapo expulsion of a Russian recruit (Feb 2026); the same reports calibrate the message that Russia ''has no intention'' of attacking in the coming year while treating it as the main threat.'
  it: ''
- hash: 6c8eb67a
  kind: cards
  en: 'Forward defence and long reach: Baltic Defence Line (600 bunkers and about 40 km of obstacles planned by end-2027, joint procurement with Latvia), nine HIMARS and nine Chunmoo launchers contracted
    (about 300 km range), the 1st Brigade moved to Johvi, a UK-led battlegroup integrated in the Estonian brigade, an air-defence buy from Germany (IRIS-T, about EUR 400m) and a cyber-defence centre of
    excellence in Tallinn.'
  it: ''
- hash: 080c2ec2
  kind: cards
  en: 'Defence budget and industry as policy: EUR 2.4bn in 2026 with a 4.5% of GDP deficit accepted to pay for it; 90% of Ukraine aid (EUR 110.7m in 2026) spent on orders from Estonian defence firms; export
    goal EUR 1.4bn by 2030; energy sanctions on Russia (gas ban from 2026) and grid integration with Finland and continental Europe.'
  it: ''
- hash: 90203ce5
  kind: cards
  en: 'Size and distance: the main force sits in Tapa and Jõhvi within reach of Russian artillery and drones, and officials themselves rule out a Narva seizure but not provocations meant to test NATO''s
    Article 5; reinforcement depends on allied arrival time.'
  it: ''
- hash: 292c6b86
  kind: cards
  en: 'The American variable: the Pentagon cancelled a brigade rotation to Poland from which some US troops for Estonia were to come (part of the 5,000-troop drawdown of May 2026); Estonian opinion doubts
    that Trump would rush to defend the Baltics, while Pevkur says he trusts Washington. Deterrence rests on a guarantor whose commitment is the open question.'
  it: ''
- hash: bdb9161c
  kind: cards
  en: 'Hybrid attacks stay below the Article 5 line and the law of the sea limits the answer: GPS jamming, airspace violations, cable cuts and sabotage draw Article 4 consultations and expulsions, but not
    a military response; the Helsinki court dismissed the Eagle S case for lack of jurisdiction in the EEZ (3 Oct 2025).'
  it: ''
- hash: fc689da4
  kind: cards
  en: 'Money and politics: a defence budget of 5.43% of GDP with a 4.5% deficit while the Reform-Eesti 200 coalition polled 12% (record low, May 2026) with a parliamentary election due in 2027; opposition
    parties (Isamaa, Centre, SDE, EKRE) all poll above Reform.'
  it: ''
- hash: 0f1a6e18
  kind: cards
  en: 'War on every flank at once: the TPLF in Tigray and Afar, Fano in Amhara, the OLA in Oromia, the ONLF, the Afar, Benishangul and Gumuz movements, all joined in one alliance on 20 Sep 2026; the alliance''s
    drones reportedly struck military sites in Addis Ababa on 1 Oct (unconfirmed by Reuters). A mandate won in June on 438 of the 486 seats contested (547 in all), with no voting in Tigray (Al Jazeera).'
  it: ''
- hash: '33964692'
  kind: cards
  en: 'Landlocked: Djibouti handled 96.7% of Ethiopia''s external freight in FY2025/26 (17.57 million tonnes) and the Addis-Djibouti road and railway carry it; every alternative (Berbera, Tadjoura, Lamu)
    is marginal. The state that wants to end the dependence cannot afford to offend Djibouti.'
  it: ''
- hash: 8655a05d
  kind: cards
  en: 'The debt is restructured, not cleared: the 2023 default, official creditors'' USD 8.4bn deal in 2025, a Eurobond swap still preliminary, and IMF conditions (fuel subsidies to be phased out, no non-concessional
    borrowing except Koysha, debt restructuring to be completed in good faith with creditors) that leave no room for a war economy.'
  it: ''
- hash: c2470101
  kind: cards
  en: 'The Horn is organising against it: Egypt, Eritrea, Sudan and Somalia declared on 4-5 Oct 2026 that the Red Sea is ''the exclusive responsibility of its coastal states'', rejected any support for
    Somaliland and unilateral measures that harm Egypt''s and Sudan''s Nile uses; Egypt''s AUSSOM allocation (1,091 troops) and its reported sites in Eritrea reach Ethiopia''s flanks.'
  it: ''
- hash: b8e3b5e2
  kind: cards
  en: 'Patrons are divided or distracted: Riyadh and Abu Dhabi are rivals and Riyadh named Ethiopia among places where Emirati aircraft operate; Egypt is the UAE''s largest creditor; Washington has cut
    aid (Ethiopia was the largest USAID recipient in sub-Saharan Africa), toured Cairo, Mogadishu and Asmara in July 2026 without Addis Ababa and is reported to weigh easing sanctions on Eritrea.'
  it: ''
- hash: 5dedbfe2
  kind: cards
  en: 'Humanitarian load and weak aid: up to 80% of Tigray''s people need emergency support after the aid cuts (WFP), more than 100,000 South Sudanese fled into Gambella in 2026 (UNHCR), and the new war
    displaced tens of thousands in Afar.'
  it: ''
- hash: d012ea7c
  kind: cards
  en: 'Naming sea access as an existential right summoned the very coalition that closes it. Abiy''s demand turned Eritrea into a declared enemy (Asmara called Ethiopia''s UN letter a ''declaration of war''
    and fears for Assab) and merged Egypt''s Nile grievance with Eritrea''s and Somalia''s fear for their coast: the El Alamein summit of 4 Oct 2026, the day before Abiy repeated the demand in parliament,
    writes the ''coastal states only'' principle into a four-power text. A landlocked power cannot win a port by making every coastal state its neighbour in arms.'
  it: ''
- hash: 2c37e335
  kind: cards
  en: The separate peace that ended one war created the coalition for the next. Pretoria (2 Nov 2022) swapped the Eritrean ally of 2020-22 for the TPLF; Asmara, excluded from the deal and long hostile to
    the TPLF, is now accused by Addis Ababa of financing, arming and directing the armed groups - the TPLF Pretoria was meant to pacify, now allied with Fano and the OLA - that fight the government (Eritrea
    denies it; the allegation is unverified). Making peace with one enemy turned the old ally into a suspect and left a coalition of the excluded.
  it: ''
- hash: 52754d6e
  kind: cards
  en: 'Completing the GERD moved Egypt''s pressure from the Nile to the Horn. Water is no longer a lever once the dam is full; the lever became Ethiopia''s flanks: the Somalia pact, AUSSOM troops, Eritrea,
    Sudan. Announcing three more Blue Nile dams in March 2026 told Cairo that the cascade would continue, which is exactly what the ''firm and decisive response'' (Sisi, Dec 2025) was promised against.'
  it: ''
- hash: 359f2131
  kind: cards
  en: The landslide did not settle the question it was held to settle. The Prosperity Party took 438 of the 486 seats contested (547 in all) in June 2026, with no voting in Tigray and conflict in other
    regions; three months later the people excluded from the count were an armed alliance of seven, chaired by a Fano commander, and the mandate Abiy was sworn into on 5 Oct was a mandate over a country
    at war with a part of itself.
  it: ''
- hash: 89f7c06c
  kind: cards
  en: Gulf money buys drones and enmities in the same transaction. Emirati backing (finance, infrastructure and, alleged, aircraft at Bahir Dar) earned Ethiopia a Sudanese ambassador's recall and the threat
    of 'open confrontation' (May 2026), a Saudi public accusation (January 2026) and the position of being the Emirati client against Egypt, the UAE's largest creditor. The patron that arms the federal
    campaign also makes the ring against it.
  it: ''
- hash: 2b464e8c
  kind: cards
  en: Playing Mogadishu and Hargeisa against each other leaves Ethiopia with neither. The MoU with Somaliland (1 Jan 2024) gave it a port option and an enemy in Somalia; Ankara (Dec 2024) repaired Somalia
    and left the MoU unburied; after Israel recognised Somaliland (26 Dec 2025) Addis Ababa kept what a Somaliland-aligned outlet calls 'studied silence'. Within a week Hassan Sheikh Mohamud met Abiy in
    Addis Ababa (about 29 Sep) and signed at El Alamein (4 Oct) a text that rejects any support for Somaliland, then congratulated Abiy on his oath (5 Oct) and said Somalia does not object to Ethiopian
    access through Somali territory if it is negotiated formally.
  it: ''
- hash: 7037f8d7
  kind: cards
  en: 'Ethiopia is Luttwak''s landlocked power that named its sea access a right and, by naming it, summoned the Red Sea coalition against itself. Abiy''s strategy rests on one national project, the GERD,
    and one national claim, an outlet to the sea; both are legitimate to Addis Ababa and both are read abroad as a threat. The Nile gave Egypt a motive; the sea claim gave Eritrea, Somalia and Sudan a common
    text (El Alamein, 4 Oct 2026); and the one war Abiy cannot afford, the internal one, gave Eritrea and Egypt a way to hurt him that no treaty forbids. The pattern is the paradox of success in strategy:
    each win (the dam built, the election won, Mekelle retaken after the TPLF withdrew) raised the price the neighbours would pay to stop the next.


    Signals that are not rows. Abiy swore the oath on 5 Oct 2026 and repeated the sea claim the day after the Alamein summit, so the speech was an answer, not a plan; he softened it by ''give and take''
    and by the March 2026 pledge of no bullet at Eritrea, Somalia, Djibouti or Kenya, but the UN letter of 8-9 Oct invoked Article 51 against Eritrea and the diplomatic channel is closed since 1 Oct. Somalia
    sat at both tables within a week. Washington''s July envoy tour took in Cairo, Mogadishu and Asmara, not Addis Ababa. Whether Eritrea is truly behind the alliance is Addis Ababa''s allegation, unverified
    in the sources, and Cairo says it is ''a domestic crisis''. The Pretoria agreement, signed by Addis Ababa and the TPLF but not by Eritrea, is now the document everyone cites and nobody observes. Open
    question: does the dam, the election and the war on four fronts leave the army enough force to take a port, or only enough to threaten one - and is the threat itself what will keep the ring closed?'
  it: ''
- hash: 9096fa42
  kind: cards
  en: 'Deter a Russian attack and be able to repel one: the Government Defence Report (19 Dec 2024) treats Russia as a long-term threat to Europe and Finland that will outlast the war in Ukraine, and a
    June 2026 parliamentary working group repeated it. Money follows: defence spending 2.5% of GDP in 2025, 3.2% planned by 2030 (3% by 2029 was the April 2025 pledge), and an estimated 2.4% of GDP in defence-
    and security-related spending in 2026 against NATO''s 1.5% target.'
  it: ''
- hash: '22758292'
  kind: cards
  en: 'Make the Atlantic guarantee physical on the northern flank: NATO membership since 4 April 2023 (the longest land border Russia shares with an EU or NATO state, about 1,340 km), the 15-site US Defence
