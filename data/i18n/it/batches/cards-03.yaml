  it: ''
- hash: 044557bc
  kind: cards
  en: 'Sanctions and decoupling from Russia: electricity imports ended in May 2022 and gas on 21 May 2022 (floating LNG terminal at Inkoo since 2023), rail trade throttled after the border closure and Russian
