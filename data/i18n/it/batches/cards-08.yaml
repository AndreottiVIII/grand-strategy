# Translate every `en` into it. Write the translations to the file cards-08.out.yaml next to this one,
# as `items:` of `- hash: <same hash>` / `it: <translation>`, appending one item at a time (valid YAML at
# every step), never editing this file. Keep names, dates, numbers and quotes; register of a foreign-office
# brief: dry, precise, no flourish.
lang: it
items:
- hash: 378e2de6
  kind: cards
  en: 'A divided demos: Palestinian-origin Jordanians drive the economy but have little political voice, the electoral system favours tribal rural districts, and the Brotherhood - the largest opposition
    party with 31 of 138 seats in 2024 - is now banned and has announced its own dissolution (22 Jul 2025). Any new wave of Palestinians would demand citizenship and representation.'
  it: ''
- hash: e4a9de2e
  kind: cards
  en: 'A fragile balance sheet: public debt about 83% of GDP in the Foreign Policy account and ''well over 100%'' in CRS''s (net versus gross, unreconciled), poverty about 24%, youth unemployment about
    45%, growth of 2.9% in Q1 2026, and a UNHCR operation funded at only 29% for 2026.'
  it: ''
- hash: bed6f474
  kind: cards
  en: 'Indefensible geography: the West Bank border is about 60 miles of rugged terrain roughly 20 miles from Amman, where nearly half the population lives, with no equivalent of Egypt''s Sinai buffer;
    and the kingdom sits under the path of Iran''s missiles to Israel and of its strikes on US bases (nearly 300 projectiles by August 2026 on one count).'
  it: ''
- hash: cb5cd502
  kind: cards
  en: 'Dependence on patrons who want different things: Washington (aid, F-16s, bases) leaned on Jordan to accept Gazans in February 2025 and is accused of working to strip it of the Al-Aqsa custodianship;
    the Gulf monarchies provide direct aid, soft loans and work permits. Jordan cannot refuse the US basing that also makes it a target.'
  it: ''
- hash: 16e4a4eb
  kind: cards
  en: 'Israel holds levers over the kingdom: gas (a 15-year Leviathan supply contract), water, the bridges and crossings; Israeli officials have floated cutting gas, electricity and water and some civilian
    officials have floated militarising the border and occupying the Jordan Valley.'
  it: ''
- hash: d7d5e01d
  kind: cards
  en: 'Water poverty and refugees: among the most water-poor states in the world; about 345,000 Syrian refugees still registered with UNHCR in October 2026 (about 460,000 in November 2025) and a funding
    gap on the operation.'
  it: ''
- hash: 0f80f79c
  kind: cards
  en: 'The shield is the target. Hosting about 4,000 US troops, Muwaffaq Salti air base and a regional air-defence screen buys aid and protection, but it put Jordan in Iran''s line of fire: nearly 300 Iranian
    projectiles by August 2026, the 17 July 2026 strike that killed US soldiers at Muwaffaq Salti, and a petition by more than 100 activists asking US forces to leave. The more useful Amman is to Washington,
    the less it can claim the neutrality it asserts.'
  it: ''
- hash: d25d64c6
  kind: cards
  en: Banning the Brotherhood to protect order closes the one legal channel for Islamist and Palestinian anger just as Gaza and the West Bank inflame it. The movement was the largest opposition bloc (31
    of 138 seats); Chatham House read the ban as domestic and calibrated, but it also pushes the movement underground, and the government's own story ties the plot to Lebanon and Iran.
  it: ''
- hash: d6fdb0f0
  kind: cards
  en: The humanitarian corridor that earns goodwill also hands Israel the means to shut it. Aid convoys through the Allenby crossing prove Jordan's role, yet two Jordanian drivers carrying aid killed Israelis
    at the crossing (September 2024, September 2025); Israel closed the bridge and its chief of staff urged halting aid from Jordan until screening was revised.
  it: ''
- hash: 9e568e90
  kind: cards
  en: 'Cutting ties with Israel punishes Israel and exposes Jordan. The kingdom refused the water-for-energy swap (November 2023) and keeps its ambassador home, but Israel reportedly offers water solutions
    in exchange for the ambassador''s return and is described as ready to cut gas, electricity and water: the symbolic moves removed the kingdom''s own leverage over its most vital supplies.'
  it: ''
- hash: 273026ce
  kind: cards
  en: The same air defence that wins Washington's trust costs legitimacy at home. Intercepting Iranian missiles aimed at Israel (April 2024, June 2025) is read in Jordan as defending Israel, while Israel's
    government is what Jordanians consider the principal threat; the kingdom has to be useful to the Israeli security system and its victim at once.
  it: ''
- hash: 8bb9d9ac
  kind: cards
  en: Refusing displacement depends on the patron that proposed it. Jordan's firmest red line is no resettlement of Gazans or West Bankers, yet its USD 1.45bn a year and its weapons come from the administration
    that floated aid cuts in February 2025 and is said to be working on the Al-Aqsa custodianship; the cost of saying no rises with every year of dependence.
  it: ''
- hash: 4a356467
  kind: cards
  en: 'Jordan runs the grand strategy of a small, resource-poor monarchy whose

    neighbours are bigger than its means and whose population is not the one its

    state was built for. It has no leverage of its own, so it sells position: a

    border no one else can hold, airspace over which wars are fought, a port, a

    training ground, a seat for mediation, and a King who is received everywhere.

    Everything is organised around one fear, that the Palestinian question be

    settled on its territory - by annexation of the West Bank, by displacement

    from Gaza, or by a security ''substitute'' arrangement that makes the army the

    jailer of the West Bank. That fear explains why a treaty partner of 32 years

    is now treated as the main threat (no ambassadors since November 2023, the

    energy-for-water swap refused, the annexation ''red line''), why the kingdom

    still shoots down Iranian missiles over its own land, and why it will not

    break with Tehran. The Luttwak pattern is that each safeguard enlarges the

    exposure it was meant to cover: patrons make it a target, the ban on the

    Brotherhood removes a valve, the aid corridor invites closure, the diplomatic

    snub removes the leverage over the supplies that Israel can still cut. Two

    signals that are not rows: the King travelled to Malaysia and Australia on

    11 October 2026 while a Houthi strike on Riyadh airport killed a Jordanian,

    so the King''s presence abroad rather than at home is itself a choice; and

    Israeli elections are due in October 2026, so the annexation threat will be

    tested by the next coalition, not by this one.'
  it: ''
- hash: b3761e65
  kind: cards
  en: Deter, and if deterrence fails defeat, a Chinese use of force around Japan, above all in a Taiwan contingency. Takaichi told the Diet on 7 Nov 2025 that a Chinese blockade or an operation against
    US forces could be a 'survival-threatening situation' permitting collective self-defence, and refused to retract it; Tokyo has since fixed a date (March 2031) for surface-to-air missiles on Yonaguni,
    110 km from Taiwan, and the 2026 Defense White Paper calls China the 'greatest strategic challenge'.
  it: ''
- hash: 2171c36a
  kind: cards
  en: 'Keep the United States bound to Japan''s defence and to the Indo-Pacific: the 1960 treaty (Article 5 covers the Senkakus), the ''New Golden Age'' documents of 28 Oct 2025, a USD 550bn investment
    pledge through January 2029 as the price of tariffs and goodwill, a place in Golden Dome, and acceptance of the Henoko replacement base after the LDP-backed Koja won Okinawa on 13 Sep 2026.'
  it: ''
- hash: 5fc14edb
  kind: cards
  en: 'Rebuild military and legal capacity: 2% of GDP reached early (FY2025 supplementary budget), the three security documents rewritten by end-2026 with a 3.5% figure on the table, a review of the non-nuclear
    principles and of nuclear-powered submarines, and a constitutional amendment to name the Self-Defense Forces in Article 9.'
  it: ''
- hash: 256d47d0
  kind: cards
  en: 'Secure what an island economy cannot make: energy (94% of crude from the Middle East in 2025, 93% of it through Hormuz, shut in March 2026) and critical minerals (63% of rare-earth imports from China
    in 2024). The answer is stockpiles, US crude, bypass pipelines funded through JOGMEC, and the US-Japan critical-minerals framework.'
  it: ''
- hash: 9e595dad
  kind: cards
  en: 'Thicken the circle of partners round China so that no single capital carries the weight: the Philippines (reciprocal access in force 11 Sep 2025), Australia (Mogami frigates, April 2026), India (first
    defence co-development pact, July 2026), the UK and Italy (GCAP), the EU, Central Asia, ASEAN and the CPTPP, and a Free and Open Indo-Pacific ''evolved'' towards economic security (Hanoi, 2 May 2026).'
  it: ''
- hash: '31402307'
  kind: cards
  en: 'Close the residues of 1945 on Japan''s terms: the abductee issue through a summit with Kim Jong Un (Takaichi asked Trump on 6 Oct 2026 to broker one), the four Northern Territories in Russian hands,
    and a Korea kept calm by shuttle diplomacy while Takeshima stays Japanese territory in Tokyo''s text.'
  it: ''
- hash: 80e2f949
  kind: cards
  en: 'Summitry as the main instrument: Trump in Tokyo (27-28 Oct 2025) and at the White House (19 Mar 2026), Xi at Gyeongju (31 Oct 2025, before the crisis), Lee in Nara and Takaichi in Andong, the first
    Central Asia + Japan summit (Dec 2025), Vietnam (May 2026) and Merz due in late October 2026. The line to Beijing is ''calm and appropriate'' response, open to talks at every level, no retraction.'
  it: ''
- hash: eb067cd6
  kind: cards
  en: 'Naming threats in official text: the 2026 Defense White Paper (4 Aug) keeps China as the ''unprecedented and greatest strategic challenge'' and warns that Ukraine-type aggression could occur in East
    Asia; a February 2026 speech on Chinese ''coercion''. Beijing answered with a formal protest.'
  it: ''
- hash: ed31a65c
  kind: cards
  en: Southwest-islands build-up (Yonaguni missiles by March 2031), the Joint Operations Command (24 Mar 2025) paired with the upgrade of US Forces Japan to a joint force headquarters, counterstrike and
    missile production, Official Security Assistance (radar to Mongolia, boats, radars and TC-90 trainers to the Philippines) and defence exports (Mogami frigates to Australia, GCAP with the UK and Italy).
  it: ''
- hash: ab6d4a68
  kind: cards
  en: 'Capital as currency: USD 550bn for US industry (36bn first tranche, about 73bn second tranche in March 2026), JPY 10 trillion over ten years for India, ODA and loans from Matarbari to Tashkent, plus
    economic-security tools: oil stockpile releases, subsidies and bypass pipelines.'
  it: ''
- hash: b73cdd1a
  kind: cards
  en: The constitution and the arithmetic. Article 9 is unamended; revision needs two-thirds of each chamber and a referendum. The LDP alone holds 316 of 465 lower-house seats after the 8 Feb 2026 election,
    but the upper house is short, Ishin (a partner that stayed outside the cabinet until its first minister on 17 Sep 2026) wants more than the SDF clause, and large demonstrations took place on Constitution
    Memorial Day for the pacifist text. Takaichi has set the start of revision about a year ahead.
  it: ''
- hash: 4b657173
  kind: cards
  en: 'Demography: 671,236 births in 2025 (record low, tenth year running, fertility 1.14) and a census population of about 123 million, down 2.5% in five years, faster than official forecasts. Fewer recruits
    and taxpayers, more pensioners, for every yen of defence.'
  it: ''
- hash: b86f863c
  kind: cards
  en: Debt, yen and rates. Gross government debt near 230% of GDP; the Bank of Japan raised its rate to 1% on 16 Jun 2026 (highest since 1995) with the yen at about 160 per dollar after Finance Ministry
    intervention in April and May. A 3.5% defence target would take spending above JPY 20 trillion a year.
  it: ''
- hash: 43d2a325
  kind: cards
  en: 'Energy and minerals with no home supply: Hormuz was effectively closed to crude tankers from March 2026, Middle East imports fell 67% in April (lowest since 1979), and Japan''s combined state and
    private stock release, inside an IEA-coordinated 412 million barrels, was likely its largest ever; Sakhalin-2 LNG (about 9% of LNG imports, long-term contracts to 2028-2033) makes a full break with
    Russia costly.'
  it: ''
- hash: 5639f311
  kind: cards
  en: 'Exposure to China: 23.6% of 2025 imports, 63% of rare-earth imports, a travel advisory against Japan still in force, and a Beijing that tightened dual-use export controls on 6 Jan 2026 and listed
    20 Japanese entities on 24 Feb 2026 (Mitsubishi Heavy and Kawasaki Heavy aerospace units among them), with 20 more on a watch list.'
  it: ''
- hash: b14a55fa
  kind: cards
  en: 'A transactional patron: the Supreme Court struck down the IEEPA tariffs on 20 Feb 2026 yet Tokyo keeps its pledge; Washington pushes for 3.5% of GDP (5% with related costs) and a bigger host-nation-support
    bill before the current agreement expires in March 2027; Trump praised Japan on Hormuz while adding ''unlike NATO''.'
  it: ''
- hash: ced4575d
  kind: cards
  en: Naming the contingency summoned the coalition it was meant to deter. For decades Tokyo kept ambiguity on Taiwan; on 7 Nov 2025 Takaichi spoke it aloud and Beijing answered with a travel advisory (14
    Nov), a re-imposed seafood ban (19 Nov) and a dual-use export ban (6 Jan 2026) - and China and Russia issued a joint statement against Japanese 'militarism' (Dec 2025). The retaliation struck exactly
    the dependencies (rare earths, Chinese demand) that the declaration had not first reduced.
  it: ''
- hash: a4472feb
  kind: cards
  en: Rearming on credit feeds the weakness that rearming is meant to cure. The 2% target was reached with a supplementary budget; a 3.5% target would exceed JPY 20 trillion a year; the Bank of Japan has
    had to raise rates to 1% with the yen near 160 and long-bond yields climbing. A power that borrows 230% of GDP buys deterrence with the currency its enemies can pressure.
  it: ''
- hash: 36cdd483
  kind: cards
  en: Paying the patron in capital protects the alliance and weakens the base that the alliance defends. The USD 550bn pledge (36bn plus about 73bn already allocated) goes into US reactors, gas plants and
    diamonds while Japan's own oil, minerals and demography need investment; and when the Supreme Court removed the legal basis of the 15% tariff Tokyo still did not reopen the deal, because the purchase
    was the alliance, not the tariff.
  it: ''
- hash: '49290261'
  kind: cards
  en: Partner-building towards Seoul and Manila sits beside a history text that Seoul can read as provocation. Takaichi restated in Dec 2025 that Takeshima is Japanese territory and has resisted acknowledging
    wartime aggression, yet Japan needs Korea in the trilateral and as a supplier-partner in the energy crisis; the calm is Lee Jae-myung's two-track choice, revocable, not a settled bond.
  it: ''
- hash: 2d77223e
  kind: cards
  en: Pressure on Russia is limited by the stakes it keeps. Takaichi called Putin's visit to Iturup (Aug 2026) 'absolutely unacceptable' and weighs an additional package, yet Mitsui (12.5%) and Mitsubishi
    (10%) stay in Sakhalin-2 because leaving would hand them to Chinese firms, and with Hormuz shut Sakhalin Blend became more valuable, not less.
  it: ''
- hash: '55995134'
  kind: cards
  en: Fortifying the islands nearest Taiwan makes them the first target of the war they are meant to deter. Yonaguni's missile unit and the Okinawa settlement strengthen the tripwire, but a base 110 km
    from the Taiwanese coast is also the object that Beijing's own white-paper protests and daily Coast Guard presence (357 days in 2025 at the Senkakus) are organised around.
  it: ''
- hash: 5b28b2ca
  kind: cards
  en: 'Japan is the case of a power that rearmed by naming its contingency, and then met the coalition the naming provoked. Luttwak''s logic of strategy says that what is declared is not what is deterred:
    Takaichi''s sentence of 7 November 2025 turned a quiet ambiguity into a position, and a position can be answered. Beijing answered on every lever that Japan had left exposed (tourists, seafood, rare
    earths, dual-use exports), recruited Moscow in a single sentence about ''militarism'', and then waited; eleven months later the retraction it demands has not come and neither has the thaw (Wang Yi to
    Iwaya, 28 September 2026). Tokyo''s compensation is the oldest one in its strategy, the American alliance, now bought with USD 550bn and paid in installments, and a ring of lesser partnerships (Manila,
    Canberra, New Delhi, London and Rome, Seoul) that each add a little weight and none a guarantee. The constraint that matters is not Article 9, which the February 2026 landslide has put in play, but
    arithmetic: a shrinking population, a debt of 230% of GDP, a yen at 160, and a Strait of Hormuz that closed in March. The grand strategy therefore has the shape of a lever with a short arm: the deterrent
    is credible, the base that pays for it is not yet. The test of the next twelve months is whether the rewritten security documents (due by the end of 2026) and a possible Xi-Takaichi meeting at the APEC
    summit in Shenzhen (18-19 November) can turn the naming into a negotiated line before the bill comes due.'
  it: ''
- hash: 05583066
  kind: cards
  en: 'Keep sovereignty and territorial integrity without ever choosing a patron: the official ''multi-vector'' line of 2020-2030 and Tokayev''s practice of being received by Putin, Xi and Trump within
    weeks of one another (Washington 6 Nov 2025, Moscow 11-12 Nov 2025, Tianjin Sept 2025). Territorial integrity is the one principle Astana will not trade, which is why it refused to recognise the Donetsk
    and Luhansk ''republics'' in Putin''s presence.'
  it: ''
- hash: 79f4e59c
  kind: cards
  en: Keep the oil flowing and find more than one way out for it. About 80% of crude exports leave through the Russian-controlled CPC pipeline to Novorossiysk (Russian companies hold 51% of the consortium);
    the answers are the China pipelines, the Trans-Caspian Middle Corridor (about 3 Mt in January-August 2026, +22%), and Kazakh crude to Germany by Druzhba and to Ust-Luga. Ukrainian drones on the CPC
    terminal (29 Nov 2025) and on KazMunayGas tankers (January 2026) cost the 2026 output target 2 Mt.
  it: ''
- hash: 843d9d08
  kind: cards
  en: 'Manage the succession and the regime''s legitimacy after January 2022: a new constitution approved on 15 Mar 2026 (87.15% yes, turnout 73.12%) in force from 1 Jul 2026, with a single-chamber Kurultai
    of 145 deputies, a restored vice-presidency and wider presidential appointment power, so that the multi-vector policy outlives Tokayev (term to 2029).'
  it: ''
- hash: 0dd9dd5f
  kind: cards
  en: 'Turn the subsoil into leverage: critical minerals and uranium (Kazatomprom produced about 25,800 tU in 2025, roughly a fifth of world primary output) sold to whoever pays and builds, with Washington
    (Cove tungsten, USD 1.1bn, 70% Cove), Brussels (raw-materials roadmap) and Beijing all invited in, and Chevron''s Tengiz expansion (FGP completed 2025) as the anchor of US capital.'
  it: ''
- hash: f7550021
  kind: cards
  en: 'Build a first nuclear plant to cover the baseload gap: a referendum on 6 Oct 2024 (71.12% yes, turnout about 63.7%) and an agreement signed with Rosatom on 28 May 2026 for a plant at Ulken on Lake
    Balkhash (Russia to finance 85%, commissioning around 2035-36), chosen over CNNC, EDF and KHNP.'
  it: ''
- hash: b4f298a1
  kind: cards
  en: 'Be the convener of Central Asia and a useful neutral: C5+1 and China-Central Asia summits, the Aral and water agreements with Uzbekistan, Kyrgyzstan and Tajikistan, a railway to Herat, an offer to
    host Russia-Ukraine talks ''if both leaders agree'' (Tokayev, ''not a mediator''), the Abraham Accords (6 Nov 2025) and a founding seat on Trump''s Board of Peace (22 Jan 2026).'
  it: ''
- hash: 2a253d08
  kind: cards
  en: 'Summit stacking: the C5+1 in Washington (6 Nov 2025), a state visit to Moscow five days later where a declaration raised ties to ''comprehensive strategic partnership and alliance'' (Lavrov absent
    from the talks), Xi in Astana (June 2025) and Shanghai (16 Jul 2026), Brussels (June 2026), Erdogan in Astana (14 May 2026). Each patron gets a document, none gets exclusivity; OSCE, SCO, OTS and OIC
    observers were invited to the March 2026 referendum.'
  it: ''
- hash: f86ce3ea
  kind: cards
  en: 'Principle as shield: territorial integrity invoked against the Donetsk and Luhansk ''republics'' (17 Jun 2022, ''quasi-state formations'', in Putin''s presence), ''not a mediator'' on Ukraine, a
    foreign ministry that calls the CPC terminal ''an exclusively civilian facility''; at home, a push of Kazakh over Russian in broadcasting (draft media law raising the state-language quota from 50% to
    70%).'
  it: ''
- hash: ec6a6959
  kind: cards
  en: 'Collective-security membership kept as insurance (CSTO, whose 2,500-strong force, about 2,000 of them Russian, secured Astana''s strategic sites on 6-19 Jan 2022) while hardware diversifies: the
    Turkish ANKA drone, first ordered in 2021 and since May 2026 to be built in Kazakhstan by a Kazakhstan Engineering - Turkish Aerospace joint venture.'
  it: ''
- hash: 00636dce
  kind: cards
  en: 'Contracts as currency: 29 agreements worth about USD 17bn signed with US firms in Washington (John Deere, Boeing, Cove tungsten), 50 Airbus aircraft for EUR 7.1bn and USD 12bn of agreements in Brussels,
    a Chinese trade of about USD 49bn and USD 30bn of Chinese investment, Rosatom for the plant. Transit is the other coin: Kazakh grain as the first cargo through Azerbaijan to Armenia, uranium and oil
    rerouted via the Trans-Caspian.'
  it: ''
- hash: 1609beb2
  kind: cards
  en: The debt of January 2022. Tokayev asked the CSTO for troops on 5 Jan 2022 as protests turned deadly; Russian-led troops arrived the next day and left by 19 Jan. Analysts at the time read the intervention
    as strengthening Tokayev at home and Russia's leverage in the region, and Russian commentators have treated it since as a rescue Astana must repay; Tokayev himself rebuked 'discord' sown by Russian
    politicians in June 2022.
  it: ''
- hash: 2746a845
  kind: cards
  en: 'Export geography: about 80% of oil exports go by the CPC to Novorossiysk, 51% owned by Russian companies; the China pipelines carry only about 28% of the CPC''s capacity; the Middle Corridor was
    designed for 6 Mt against 100 Mt+ on the Russian route; the Karachaganak gas is processed at Orenburg under a contract running to 2038 (up to 9 bcm a year). Moscow can squeeze (CPC stoppages in 2022,
    the reported halt of Druzhba transit to Germany from 1 May 2026) without a shot.'
  it: ''
- hash: bdd04bc7
  kind: cards
  en: 'A neighbour that is also a minority: ethnic Russians are about 15% of the population and Russian remains widely spoken; Russian television figures attacked Astana''s Ukraine line in 2022 and a Russian
    deputy hinted at the northern regions. Every language or identity measure is read in Moscow as a signal.'
  it: ''
- hash: 6c46a980
  kind: cards
  en: Sanctions exposure inside a customs union. As an EAEU member Kazakhstan shares a border regime with Russia; EU listings reached Kazakh entities (Kazstanex and Metallstan in the 16th package, 2025)
    and US Treasury listed CBD-Technologies for drone components. Astana's line is that re-export of sanctioned goods is barred and, per its customs service, unproven; critics point to parallel imports
    and a draft enforcement procedure withdrawn from the legal base.
  it: ''
- hash: 198258c1
  kind: cards
  en: China's weight and the Xinjiang silence. China is the first trading partner (about USD 49bn in 2025) and the source of about USD 30bn of investment; Astana says nothing about the treatment of ethnic
    Kazakhs in Xinjiang, a sensitive point for the public, in a society where sinophobic sentiment has been a recurring worry for the government.
  it: ''
- hash: b8a2e23e
  kind: cards
  en: 'A legitimacy deficit at home: the January 2022 unrest left an official toll of 164 dead, the 2024 nuclear vote saw 25% turnout in Almaty amid detentions of activists, and the 2026 constitution widens
    presidential powers while narrowing protected speech. A government that must justify itself needs external patrons less hostile to its methods.'
  it: ''
- hash: 0760b2df
  kind: cards
  en: The troops that saved the regime fixed the price of every later act of independence. Calling in the CSTO in January 2022 gave Tokayev control at home and Moscow a claim on him; since then each defiance
    (no recognition of the Donetsk and Luhansk 'republics', 'not a mediator' on Ukraine) has been followed by a gesture of allegiance, up to the 'alliance' declaration of 12 Nov 2025 and the Rosatom contract
    of 28 May 2026. Independence is bought in instalments of loyalty.
  it: ''
- hash: 0476abec
  kind: cards
  en: Energy security through the one supplier it wanted to dilute. The nuclear plant is meant to cut the baseload gap, and the 2024 referendum was framed as the country's own decision; the winner is Rosatom
    (85% Russian financing, a 2035-36 horizon), beating the Chinese, French and Korean bids. Kazakhstan thereby adds the biggest single Russian tie of the decade to its pipeline and gas dependence on Moscow.
  it: ''
- hash: 1fbdc189
  kind: cards
  en: 'The Western hedge is exposed to the war it avoids. Chevron, Exxon and others invest in the oil that leaves by a pipeline Russia controls and Ukraine now bombs: the drone strike of 29 Nov 2025 on
    the CPC terminal and the January 2026 attacks on KazMunayGas tankers produced Kazakhstan''s first serious quarrel with Kyiv, a USD 1.5bn January loss and a cut in the 2026 oil target, because the multi-vector
    policy ships through a single bottleneck.'
  it: ''
- hash: 7d565a99
  kind: cards
  en: The bypass cannot carry the traffic it exists to bypass. Astana champions the Middle Corridor and Azerbaijan, Georgia and the EU fund it, but its designed capacity is 6 Mt against more than 100 Mt
    on the Russian route and the China pipelines hold about 28% of the CPC's capacity; as long as that is true, every Western or Turkic route is a signal, not an exit, and Moscow knows which of the two
    moves the barrels.
  it: ''
- hash: bda7586b
  kind: cards
  en: Pledging compliance to the West from inside Russia's customs union. Tokayev promised Berlin (Sept 2023) that sanctioned goods would not reach Russia, yet EAEU membership removes the border checks
    that would prove it; each EU or US listing of a Kazakh firm then strengthens the argument for secondary measures the hedge was supposed to avoid.
  it: ''
- hash: e59533ed
  kind: cards
  en: Asserting a Kazakh identity strains the one tie it cannot cut. Raising the Kazakh quota in broadcasting from 50% to 70% and the 2022 non-recognition of the 'republics' answer a nationalist public,
    but they hand Russian commentators, who already hinted at the northern regions, their favourite grievance against the neighbour that holds 15% Russians and the pipelines.
  it: ''
- hash: f309bb48
  kind: cards
  en: 'Kazakhstan is the small-state manoeuvre between three great powers, played by a

    state that is not small in size but is in leverage: its long northern border

    and its pipelines belong to the neighbour it must not offend, its money

    comes more and more from China and the West, and its security was lent to it by

    Russia in January 2022. In Luttwak''s terms Astana practises the weaker party''s

    relational manoeuvre: it never chooses, because each patron''s offer is worth

    more as long as the others are watching. The constraint that disciplines the

    whole system is the 2022 debt, which is paid not in money but in language: an

    ''alliance'' declaration (12 Nov 2025), a Russian reactor (28 May 2026), CSTO and

    EAEU seats kept. Every clear no (the ''republics'', the sanctions pledge, the

    Kazakh language) is balanced by a visible yes. Since 2025 the structure has

    thickened on all three sides at once, which is the best test of a hedge: Trump

    received the five presidents and Kazakhstan joined the Abraham Accords and the

    Board of Peace; Xi came to Astana and then received Tokayev in Shanghai

    (16 Jul 2026); Putin returned the Moscow visit with a state visit to Astana

    (27-29 May 2026). The weak point is not a patron but a place: the CPC terminal

    at Novorossiysk, where Russian ownership, Western capital and Ukrainian drones

    meet. Signals that are not rows: Lavrov did not attend the Moscow talks of

    11-12 Nov 2025 (an unusual absence), and the Druzhba stoppage of Kazakh oil to

    Germany reported for 1 May 2026 arrived while Rosatom''s contract was being

    finished. With the new constitution in force since 1 July 2026, the open question

    is whether the system survives the man: a presidential succession in 2029 would

    reopen the question of who owes what to whom.'
  it: ''
- hash: 10f93ba1
  kind: cards
  en: 'Keep the government standing until and through the 2027 general election: hold the broad-based coalition with Raila Odinga''s ODM after his death on 15 October 2025 (the party is split between those
    who want to stay with Ruto and Secretary General Sifuna and Governor Orengo, who refuse to back him), and keep the post-2024 street (Gen Z protests, the Finance Bill 2024 withdrawn, 38 dead on Saba
    Saba 2025, a second anniversary march in June 2026) from turning into a vote against the president. Every external choice below is priced against this one.'
  it: ''
- hash: c0c4bc4c
  kind: cards
  en: 'Stay the region''s indispensable broker and host: sell mediation, venues and uniformed personnel (Tumaini talks for South Sudan, the Nairobi process for eastern DRC, the RSF charter meetings of February
    2025, the Haiti mission from June 2024, 1,410 troops allocated to AUSSOM) and turn the UN presence in Nairobi (UNEP, UN-Habitat, and UNICEF, UNFPA and UN Women global offices announced for relocation)
    into the permanent capital of a middle power.'
  it: ''
- hash: 241c1cd0
  kind: cards
  en: 'Keep al-Shabaab off Kenyan soil and keep a buffer on the Somali side of the border: Jubaland under Ahmed Madobe is that buffer, the KDF sits in southern Somalia inside AUSSOM, and the ICJ''s October
    2021 maritime ruling is rejected ''in totality'' rather than implemented. Mandera and Lamu still lose soldiers and police to roadside bombs (five security personnel killed in Mandera in late July 2026,
    three KDF soldiers in Lamu in July 2025).'
  it: ''
- hash: 4bb123fc
  kind: cards
  en: 'Stay solvent without a breach with the creditors or the street: public debt passed KSh 13 trillion in May 2026 (about 70% of GDP on the IMF''s projection), interest alone is about 45% of 2026/27
    ordinary revenue, and the USD 3.6bn IMF programme ended in April 2025 before its last review. Hence the yuan conversion of the SGR loans (October 2025), Gulf supplier credit, Eurobond issues, and a
    new IMF programme that the Treasury says it has not counted on in its budget.'
  it: ''
- hash: 68ac2dd6
  kind: cards
  en: 'Widen market access so no single patron holds the exit: the EU-Kenya EPA in force since 1 July 2024 (duty-free, quota-free), AGOA (lapsed 30 September 2025, renewed to 31 December 2026), a US reciprocal
    trade framework (first round February 2026), the UAE CEPA (14 January 2025), the LAPSSET corridor to give Ethiopia an outlet through Lamu, and labour export (583,868 Kenyans placed abroad between 2022
    and early 2026, remittances about USD 5bn).'
  it: ''
- hash: 98bd317e
  kind: cards
  en: 'Hedge between the West and the East without paying the price of choosing: Major Non-NATO Ally status and the Haiti lead for Washington, BATUK training for London, and at the same time the April 2025
    state visit to Beijing, Chinese loans converted to yuan, Gulf fuel credit. The tone is ''a bridge between East and West'' (Ruto in China, April 2025); the new foreign policy sessional paper of 2025
    is read in Nairobi as a neutral, non-aligned course.'
  it: ''
- hash: 0aeae27f
  kind: cards
  en: 'Convening power: Nairobi hosts the Tumaini talks that Kiir asked Ruto to take over from Sant''Egidio (December 2023), the former president Uhuru Kenyatta''s EAC-facilitated DRC track (merged with
    Luanda by the EAC-SADC summit of February 2025), a special envoy to Juba after Riek Machar''s arrest (March 2025), and the RSF charter meetings of February 2025. The venue is the product.'
  it: ''
- hash: 1152c9b2
  kind: cards
  en: 'Security provider for hire: Kenya led the Multinational Security Support mission in Haiti from June 2024 (the UN Security Council turned it into the Gang Suppression Force in September-October 2025;
    Rubio said that would not have been possible without Kenya) and contributes to AUSSOM; the reward is patrons'' goodwill, not payment: Major Non-NATO Ally status announced on 23 May 2024, a USD 1.6bn
    health framework on 4 December 2025.'
  it: ''
- hash: 702cbd46
  kind: cards
  en: 'The KDF in southern Somalia since 2011 (1,410 troops allocated to AUSSOM in the AU-Somalia agreement of February 2025), the Jubaland forces as an unofficial second line (Nairobi denies arming them),
    and BATUK training in Laikipia, which also trains the KDF for Somalia. AUSSOM is underfunded: the Security Council ceiling is 11,826 uniformed personnel.'
  it: ''
- hash: 44d19931
  kind: cards
  en: 'Financial engineering and trade pacts rather than aid: the SGR loans of about USD 5bn converted from dollars to yuan on 7 October 2025 (about USD 215m a year saved, according to the Treasury as reported),
    Gulf fuel supply on 180-day credit renewed for two years, the EU EPA (July 2024), the UAE CEPA (January 2025), AGOA, and a labour-export policy (583,868 placements between 2022 and early 2026) that
    returns about USD 5bn a year.'
  it: ''
- hash: ec528c38
  kind: cards
  en: 'A foreign-policy story of non-alignment and global-south voice: Ruto''s April 2025 Peking University speech (the world order ''broken, dysfunctional and no longer fit for purpose''), the ''bridge
    between East and West'' line, the sessional paper of 2025 and a UNGA recognition of Palestinian statehood (September 2025). Abroad the story is confident; at home the police are the message (Ruto''s
    ''shoot in the leg'' order of 9 July 2025).'
  it: ''
- hash: e7ffb476
  kind: cards
  en: Debt. Public debt passed KSh 13 trillion in May 2026; the IMF projects 71.6% of GDP for 2026 against a legal anchor of 55% by 2028; in the 2026/27 budget interest is KSh 1.254 trillion, about 45%
    of projected ordinary revenue (83% with principal), and MPs were told that total debt service will take 91% of ordinary revenue in 2026/27 on the wider 'consolidated fund services' count. The IMF programme
    ended in April 2025 before its last review; the Treasury has not counted IMF money in the current or next budget.
  it: ''
- hash: fe1c091d
  kind: cards
  en: The street. The Finance Bill 2024 was withdrawn after the protests of June 2024; the anniversary of 25 June 2025 left at least 19 dead (KNCHR, as cited by Amnesty) and Saba Saba (7 July 2025) 38 by
    the Nation's count; the second anniversary on 25 June 2026 passed under heavy policing and arrests outside Parliament. Any new tax or subsidy cut is a protest, so the IMF route is narrow and foreign
    financing is the only margin.
  it: ''
- hash: bb9c6adf
  kind: cards
  en: The 2027 arithmetic after Odinga. The coalition with ODM was Raila's personal pact with Ruto (an MoU of March 2025, according to People Daily); he died on 15 October 2025 and the party now argues
    in public about whether to back Ruto (a TIFA survey of December 2025 found only 19% of ODM supporters wanted that), with Gachagua and Kalonzo outside. Ruto's foreign policy has to produce wins before
    the vote and cannot afford a visible humiliation.
  it: ''
- hash: d329c100
  kind: cards
  en: 'Fuel and money from the Gulf, security from the West, credit from China: no single supplier can be offended. Gulf state companies (ADNOC, ENOC, Aramco) supply fuel on 180-day credit; the US supplies
    the health money and the market preference that depend on a yearly AGOA decision and a governance review (July 2026); the UK can move its exercise out of Laikipia; China holds the SGR debt.'
  it: ''
- hash: 0e38a5b3
  kind: cards
  en: Al-Shabaab's reach into Kenya and a Somali settlement that Nairobi does not control. The border counties (Mandera, Garissa, Lamu) keep suffering roadside bombs, AUSSOM's funding is uncertain and its
    mandate ends on 31 December 2026 unless renewed, and the ICJ ruling and Jubaland tie Nairobi to a quarrel with the Mogadishu government that it also needs as the host of its troops.
  it: ''
- hash: c3c7a5f9
  kind: cards
  en: A capital with limited coercive reach beyond its neighbourhood. Sudan could punish Kenya for hosting the RSF with an import ban (14 March 2025, still in force in August 2026, with about 3.44 million
    kg of tea stuck in Mombasa); Tanzania restricts foreign traders in 14 mining services (April 2026) and banned Kenyan poultry and cigarettes; neither is answered. Nairobi can host and talk but has few
    instruments to retaliate.
  it: ''
- hash: a38e61f1
  kind: cards
  en: The broker who takes a side loses the room. Nairobi hosted the RSF's founding charter in February 2025 as part of 'efforts to end the war'; the SAF government recalled its ambassador (20 February),
    banned every Kenyan import (14 March, tea alone about KSh 9bn a year) and accuses Ruto of undermining Sudan. The same convening power that earns Kenya a seat at every table made it a party to the Sudan
    war in one capital's eyes, and the closer it sits to the UAE (CEPA, fuel credit) the harder it is to show neutrality.
  it: ''
- hash: a775b449
  kind: cards
  en: Policing Port-au-Prince while the police shoot at home. The Haiti mission bought Kenya Washington's thanks (Rubio, December 2025) and a UN force that carries its name, but the same service answered
    the 2024-26 protests with live fire, 'shoot in the leg' on 9 July 2025, and the Haitians who tried to stop the last Kenyan police leaving in April 2026 are the reverse image of the Kenyans who march
    every 25 June. A security export that depends on a police force the public does not trust turns the credential into a liability at the election.
  it: ''
- hash: e338b721
  kind: cards
  en: Guarding the Somali buffer feeds the quarrel that endangers it. Backing Madobe and refusing the ICJ ruling give Kenya a friendly strip along its border, but Mogadishu has accused Nairobi of arming
    militias, Jubaland fighters beaten at Balad Hawo fled to Mandera, and in 2026 the Gedo fighting again reached the border at El Wak, so the buffer is exactly where the federal-local war is hottest. Kenya's
    1,410 AUSSOM troops serve the government that Kenya's client resists.
  it: ''
- hash: 1d04b190
  kind: cards
  en: The hedge brings the scrutiny it hoped to avoid. After the April 2025 Beijing visit and the yuan conversion of the SGR debt, which cut the cost of service, the IMF warned of currency risk in such
    swaps, AGOA lapsed and was renewed only for 2026, Washington started a review of Ruto's governance record (July 2026), and the US embassy in Nairobi has been without a confirmed ambassador for a long
    stretch. The East gives cheaper money; the West holds the market and the security umbrella, and notices.
  it: ''
- hash: 0ac3b430
  kind: cards
  en: Shielding the budget from the IMF raises the price of money. The USD 3.6bn programme ended in April 2025 without its last review, a year after the street defeated the Finance Bill 2024, and to fund
    development projects the Treasury securitised revenue streams, which Reuters reported initially complicated the talks on a new programme (the prospectus of a USD 2.25bn Eurobond in 2026 listed them).
    The workaround for financing is the obstacle to the one seal that would make financing cheaper.
  it: ''
- hash: 0d9bcf0d
  kind: cards
  en: A friend of the UAE and a contributor to the mission of the UAE's Somali adversary. Kenya's CEPA with Abu Dhabi (14 January 2025) and its Gulf fuel credit sit beside 1,410 troops in a Somali mission
    whose host government annulled every agreement with the UAE on 12 January 2026. On the one side the UAE is Kenya's financier and the RSF's patron, on the other Mogadishu is Kenya's host and Khartoum's
    friend; Nairobi is the seam in Luttwak's sense.
  it: ''
- hash: 6f2142ce
  kind: cards
  en: 'Kenya plays the strategy of a middle power without a hegemon''s resources: it

    has no oil, an exhausted treasury and a restless street, and what it can sell

    is the room itself. It hosts the talks nobody else can host (South Sudan''s

    Tumaini track, the DRC process, even the founding charter of the Sudanese army''s enemy), supplies

    police and soldiers to missions that other states design (Haiti, AUSSOM),

    shelters the UN''s Nairobi offices, and takes money from everyone who wants a

    voice in East Africa - China''s yuan loans, Gulf fuel credit, Washington''s

    health compact, London''s training ground, Brussels'' preferences. Luttwak''s

    reading is that the position is rented, not owned: the broker is indispensable

    only while the great powers need a neutral address, and each act that proves

    indispensability - the RSF charter, Madobe''s Jubaland, the Haiti command - is

    the one that draws a retaliation (Sudan''s import ban), a quarrel (Mogadishu)

    or a bill (Haitian crowds, Gen Z at home). Domestically the clock is the 2027

    election: the Odinga pact that carried Ruto''s broad-based government died

    with Raila on 15 October 2025, and every foreign choice is made with the

    street and the debt service (interest about 45% of ordinary revenue) in view.

    Signals that are not rows. First, a ''two pillars'' formula attributed to Ruto

    was not found in any source read; what the sources do record is

    ''a bridge between East and West'' (Beijing, April 2025), which is a hedge

    rather than a choice. Second, the US embassy in Nairobi lacked a confirmed

    ambassador for a long stretch of 2026 although the December 2025 health

    compact was signed in Washington: the American attention is real but thin.

    Third, Kenya recognised Morocco''s sovereignty over Western Sahara in April

    2026 and Kosovo in March 2025: recognition looks like a currency Nairobi spends

    where partners pay, an unsentimental turn from its old non-aligned posture

    (our reading, not a sourced motive). The

    open question is the Odinga succession: if ODM fractures, the foreign

    portfolio loses its domestic anchor before the vote.'
  it: ''
- hash: f8586f31
  kind: cards
  en: Keep Sadyr Japarov in power through the presidential election of 27 January 2027. His former partner Kamchybek Tashiev was sacked on 10 February 2026 and convicted in July 2026 of plotting to seize
    power by force. In February 2026 the Constitutional Court ruled that Japarov's current mandate counts as his first term, so he can run again.
  it: ''
- hash: f18867fc
  kind: cards
  en: 'Keep the Russian security umbrella and the labour market open at the same time: CSTO membership with the Kant air base near Bishkek, and the wages of migrants who work mostly in Russia. Bishkek wants
    the protection without Moscow''s political control.'
  it: ''
- hash: 2f96fba0
  kind: cards
  en: 'Turn its position between China, Uzbekistan and Kazakhstan into income: the China-Kyrgyzstan-Uzbekistan railway, the Kambarata-1 hydropower project, and the Kumtor gold mine, now under full state
    control.'
  it: ''
- hash: cf5e89fa
  kind: cards
  en: 'Multi-vector diplomacy: CSTO and EAEU membership with Russia, the railway and Chinese financing, Turkic bodies with Turkey, and a Washington channel (C5+1 summit, November 2025) that Bishkek presents
    as trade, fintech and visas rather than minerals. Military: the CSTO framework: Russian forces at the Kant air base, which Moscow says is enough for the southern flank with no expansion needed; Russian
    personnel took part in the Rubezh-2025 exercise. Turkish drones (TB2 bought in 2021, more ordered after the 2022 clashes with Tajikistan) add a second air arm.'
  it: ''
- hash: eb62ae95
  kind: cards
  en: 'Control of the press: Kloop, whose liquidation a court ordered in February 2024 (it kept working under another entity), had its current and former staff detained in May 2025 in the so-called Kempir-Abad
    case. Two former employees were jailed for five years in September 2025. Critics call the charges baseless; the government says closing Kloop does not jeopardise press freedom.'
  it: ''
- hash: 256f0c2c
  kind: cards
  en: 'Gold: the Kumtor mine, the largest in Central Asia, came under state control in May 2021 and passed to 100 per cent Kyrgyz ownership in April 2022 through a settlement with Centerra. It is the country''s
    main private employer and taxpayer.'
  it: ''
