# Translate every `en` into it. Write the translations to the file cards-33.out.yaml next to this one,
# as `items:` of `- hash: <same hash>` / `it: <translation>`, appending one item at a time (valid YAML at
# every step), never editing this file. Keep names, dates, numbers and quotes; register of a foreign-office
# brief: dry, precise, no flourish.
lang: it
items:
- hash: a9637d80
  kind: cards
  en: The government that owned the crime issue lost the election while crime fell. Homicides were 84 in 2025, the lowest since 2012, and shootings are far below 2022, yet the right bloc lost its majority
    and the Sweden Democrats lost votes for the first time since 2010; security succeeded as a policy and failed as an electoral asset.
  it: ''
- hash: bcfc2b5e
  kind: cards
  en: A hard China line with a Chinese-owned flagship. Sweden excluded Huawei and ZTE from 5G (upheld in court in 2021), rates China a principal threat and expelled a journalist, while Geely holds about
    78.9% of Volvo Cars and will build Geely-group cars in Volvo's European plants from 2028.
  it: ''
- hash: da434df7
  kind: cards
  en: The anchor Sweden bought in the DCA is the one that coerced it. Washington gains unimpeded access to Swedish bases while Trump threatened the same ally with tariffs over its Greenland deployment;
    Sweden's reply was to lean harder on Europe (Poland, Finland, the Nordics) for the defence the US pledge was meant to supply.
  it: ''
- hash: b6c415ec
  kind: cards
  en: 'Sweden after 2022 runs the strategy of a small, rich, technologically capable state that has given up the protection of neutrality for the protection of numbers, and is spending to make the swap
    pay. The organising idea is the Baltic as a NATO lake: Finland, Poland and Denmark are treated as one theatre, the Gripen, the A26 and the CV90 are the instruments of alignment as much as of defence,
    and the United States is kept inside the system by treaty (the DCA) while Europe is built up for the day it steps back. The Luttwakian pattern is that every step that raises Sweden''s value to the alliance
    also raises its exposure and its bills (the front-line host, the donated Gripens, the loans behind 3.5%), and that the bargains that bought the membership (Turkey, Hungary) taught others that a veto
    has a price. Two signals are not rows. First, the 13 September 2026 vote ended the Tidö era without producing a successor: the next government will probably keep NATO, Ukraine and the 3.5% target (all
    large Riksdag majorities) but will change the Israel line and perhaps the EU budget posture, so the card''s stability is higher on security than on foreign economic policy. Second, the brief''s ''Ukraine
    100-year partnership'' is not in the record: Sweden''s agreement with Ukraine is a ten-year security agreement of May 2024; a 100-year format belongs to the United Kingdom. The Kurdish question behind
    the accession has faded from the news but not from the memorandum Ankara still holds.'
  it: ''
- hash: a74d6d09
  kind: cards
  en: Keep the Taiwan tie, which pays. Eswatini has recognised the Republic of China since 1968 and is the last African state still doing so; Taipei's aid and trade are the return. The April 2026 visit
    by Taiwan's president, cancelled after overflight was revoked, shows how much the tie depends on others' airspace.
  it: ''
- hash: b67bf2b0
  kind: cards
  en: Turn hosting US deportees into money and goodwill in Washington. A memorandum of understanding reportedly takes up to 160 third-country nationals removed from the United States for US$5.1 million
    of border and migration help; the text is unpublished, and the figures come from press reports, not from the two governments.
  it: ''
- hash: 59045a0e
  kind: cards
  en: Recognition as a bargaining chip. Taiwan's aid and trade are traded for the tie, which makes Eswatini Taipei's only African ally on the Taiwanese reading (Presidential Office, via Stimson and the
    Kyunghyang report).
  it: ''
- hash: 35ebc21d
  kind: cards
  en: Hosting third-country deportees. Groups have arrived from the United States since July 2025 (further flights in October 2025, March 2026, July 2026 and August 2026); totals differ between reports,
    from at least 30 to more than 30.
  it: ''
- hash: 4a0ad1b0
  kind: cards
  en: Access depends on other states' airspace. In April 2026 Seychelles, Madagascar and Mauritius revoked overflight for Taiwan's president's plane, which the Presidential Office blames on Chinese pressure;
    the trip was not rescheduled months later.
  it: ''
- hash: 0a3487a3
  kind: cards
  en: Domestic legal and rights pressure over the deal. Civic groups have taken the government to court over holding foreign nationals without charge, and lawyers say some deportees remain detained after
    serving US sentences; nationalities and legal status are not disclosed.
  it: ''
- hash: cd711217
  kind: cards
  en: The deal wins Washington's money and goodwill, but its secrecy and detentions without charge give civic groups and courts a case against the government at home, the very legitimacy a monarchy without
    elections depends on.
  it: ''
- hash: 703d8ccb
  kind: cards
  en: 'Eswatini is an absolute monarchy with no treaty partner to protect it, so it trades what it has: a recognition of Taiwan that Beijing would like to buy, and a place for deportees that Washington
    pays for in secret. Taipei is the patron the state has kept since 1968, and the United States is the new one, paying for a service no one else is offering. The weak point is that both bargains rest
    on others'' airspace, courts and goodwill rather than on anything Eswatini controls.'
  it: ''
- hash: 59fe245d
  kind: cards
  en: Turn the outer islands into investment without giving up control of them. A long-term lease of about 100 acres on Assomption went to a Qatari company to build a luxury hotel and rebuild an airstrip
    for international flights. Activists sued over it a week before the 2025 first round, and critics said it favours foreign interests over Seychelles' welfare and sovereignty.
  it: ''
- hash: cdfe17c8
  kind: cards
  en: Build maritime security and drug interdiction with partners. India's state visit of June 2026 ended with defence and technology agreements; the new US chargé d'affaires discussed maritime security
    and illicit drug trafficking with President Herminie; and the 2025 campaign was fought on a drug-addiction crisis.
  it: ''
- hash: 800e0f2b
  kind: cards
  en: Upgrade the Chinese partnership at the 50th anniversary of ties. Xi Jinping and Patrick Herminie exchanged messages on 30 June 2026 to mark fifty years of diplomatic relations; the government's line
    is one China and Belt and Road cooperation.
  it: ''
- hash: ff1d1252
  kind: cards
  en: Diplomacy by recognition. The foreign ministry formalised diplomatic relations with Cameroon and Liberia in February 2026, and with The Bahamas in October 2024.
  it: ''
- hash: c1408278
  kind: cards
  en: Sea surveillance through India. India announced in May 2022 a coast-guard radar system for the Seychelles Coast Guard, and Seychellois personnel were trained on the new equipment.
  it: ''
- hash: 35cbc715
  kind: cards
  en: A domestic veto on foreign bases. The Indian plan for a base on Assumption Island, under a 2015 agreement amended in January 2018, was never built; sources disagree on whether the government withdrew
    it or the opposition blocked it, and local opposition feared an influx of Indian workers and a sovereignty affront.
  it: ''
- hash: 9aeafca7
  kind: cards
  en: Drug addiction is the domestic emergency. The 2025 campaign turned on environmental damage and a crisis of drug addiction.
  it: ''
- hash: b2b81375
  kind: cards
  en: 'The lease meant to bring investment to Assomption became a source of opposition: critics said it favoured foreign interests, and the opposition candidate won the 2025 runoff with 52.7% of the vote.'
  it: ''
- hash: 7462be2f
  kind: cards
  en: 'Seychelles has no treaty ally and keeps several partners at once: India for coast-guard and maritime security, China for the Belt and Road and its fifty years of ties, the United States and the United
    Kingdom for security and economic partnership, and Qatari capital for a hotel on Assomption. The 2025 runoff, won by Patrick Herminie, was fought partly over a lease that critics said favoured foreign
    interests, and his government has since pursued the Indian, Chinese and American files at once. Every partner meets the same veto: a foreign base stalled in 2018 under public fears for sovereignty,
    and the Assomption lease shows that foreign money in the islands carries the same cost.'
  it: ''
- hash: 8ec5afca
  kind: cards
  en: 'Monopolise force over the whole territory: fold the SDF and the Autonomous Administration into the army (the SDF announced its dissolution on 25 Aug 2026, self-reported), bring Suwayda (the last
    area outside Damascus''s control) and the coast under the state, and absorb the former rebel factions into one army.'
  it: ''
- hash: bccf6793
  kind: cards
  en: 'Win international legitimacy and shed the terrorist past: UN delisting of al-Sharaa and his interior minister (resolution 2799, 6 Nov 2025), the US sanctions programme terminated by executive order
    (30 Jun 2025) and the Caesar Act repealed in the FY2026 NDAA (December 2025), EU economic sanctions lifted (May 2025), a White House visit (10 Nov 2025).'
  it: ''
- hash: 61cf8841
  kind: cards
  en: 'Finance reconstruction without a new patron-dependence: the World Bank puts the physical reconstruction bill at USD 216bn (baseline), against an economy of roughly a tenth of that; Damascus claims
    USD 28bn of foreign investment in 2026 and courts Gulf, Turkish and Western capital (ports, power, telecom, property).'
  it: ''
- hash: 758bf87d
  kind: cards
  en: Push Israel back to the 1974 lines and sign a security arrangement that keeps the Golan claim alive and does not restrict Syria's right to rebuild its army or choose its alliances; in the meantime
    avoid war with a stronger neighbour.
  it: ''
- hash: 6c9dc058
  kind: cards
  en: 'Hold a multi-patron balance: Turkey for the army and the north, the Gulf for money, Washington for legitimacy and sanctions relief, Moscow kept at a distance (Hmeimim and the Tartus berth converted
    into joint training centres, memorandum of 9 Aug 2026), Europe for markets and a partnership agreement.'
  it: ''
- hash: 1fa83c11
  kind: cards
  en: 'Make Syria useful rather than a threat: joined the counter-ISIS coalition (10 Nov 2025), took over the ISIS prisons, seizes Hezbollah-bound arms on the Lebanese and Iraqi borders, and pitches itself
    as a transit corridor (Gulf gas via Jordan, Azerbaijani gas via Turkey, Iraqi oil via Baniyas).'
  it: ''
- hash: 4b73c050
  kind: cards
  en: 'Leader-level multi-alignment: Trump in Riyadh (May 2025) and the White House (10 Nov 2025), Macron in Paris (7 May 2025), Putin in Moscow twice (Oct 2025, 28 Jan 2026), Merz in Berlin and Starmer
    in London (March 2026), Gulf capitals, and a Kallas visit to Damascus (29 Sep 2026). Foreign Minister Shaibani works the Israeli, EU and Chinese files.'
  it: ''
- hash: c22d8940
  kind: cards
  en: 'Self-presentation as a counter-terror partner and a stabiliser rather than a security threat (al-Sharaa to Fox News: Syria should be seen as a geopolitical ally); national fact-finding committee
    and public trials (from 17 Nov 2025) to answer the accusations over the March 2025 coastal killings; SANA as the channel for all positions.'
  it: ''
- hash: '56889875'
  kind: cards
  en: 'A new army built by absorption, not conquest: ex-rebel factions, six thousand registered SDF fighters by July 2026 (government source, unconfirmed officially), Turkish training under the 13 Aug 2025
    agreement, hand-over of the Tanf base (Feb 2026) and the al-Hol camp, and thousands of troops moved to the Lebanese border in March 2026.'
  it: ''
- hash: 3130b3e7
  kind: cards
  en: 'Concessions and corridors paid for by others: DP World''s 30-year Tartus concession (USD 800m pledged), AD Ports'' 20% of the Latakia container terminal, Eagle Hills'' USD 20bn property plans, Qatari-funded
    gas via Jordan and via Turkey, Saudi telecom and airline deals, Saudi and Qatari payment of Syria''s World Bank arrears (USD 15.5m, 2025) that reopened multilateral lending.'
  it: ''
- hash: 59c51c31
  kind: cards
  en: 'A ruined economy: the World Bank counts USD 108bn of direct physical damage and USD 216bn (range 140-345bn) to rebuild, about ten times the 2024 economy; aid cuts and a low power supply (gas deliveries
    add only a few hours a day) leave the state dependent on pledges, many of them unconfirmed MoUs.'
  it: ''
- hash: 6e32f6ad
  kind: cards
  en: Israel holds a security zone in the south (nine bases and outposts from Mount Hermon to Daraa and Quneitra per ACLED, June 2026; 84 ground incursions in May 2026 alone) and its defence minister says
    the troops stay 'for an unlimited period'; Syria has no air defence to contest it and the 1974 line is unenforced.
  it: ''
- hash: 692e369c
  kind: cards
  en: 'Unfinished minority files: the March 2025 coastal killings (about 1,400 dead per the UN Commission of Inquiry, which found probable war crimes by government-linked forces and by Assad loyalists),
    Suwayda outside state control since the July 2025 Druze-Bedouin-government clashes (a National Guard under Sheikh Hijri, fighting again on 31 Aug 2026), and a Kurdish integration still more declared
    than tested.'
  it: ''
- hash: a14eedab
  kind: cards
  en: 'A thin counter-terror capacity and a US exit: US forces left Tanf (11 Feb 2026) and reportedly Shaddadi, about 1,000 remain, and more than 5,700 ISIS detainees were moved to Iraq (21 Jan - 12 Feb
    2026) because the camps could not be held; analysts doubt Damascus can fill the gap. A US soldier-and-interpreter killing at Palmyra (13 Dec 2025) shows the exposure.'
  it: ''
- hash: 7dffd7bd
  kind: cards
  en: 'Sanctions relief is conditional on conduct: the Caesar repeal carries a review every 180 days for four years (counter-ISIS, minority rights) and allows targeted sanctions if Damascus ''is off track'';
    the EU keeps Assad-related and security listings; Egypt rejected a Syrian ambassador in June 2026 and Iraq''s Shia factions blocked al-Sharaa from the 2025 Baghdad Arab League summit.'
  it: ''
- hash: 27f76190
  kind: cards
  en: 'Refugee and foreign-fighter pressure from outside: Germany''s chancellor said 80% of the 900,000 Syrians in Germany should return within three years (March 2026), which Damascus says it cannot absorb,
    and China presses to remove about 20,000 Uyghurs it fears (and Damascus has pledged that no group will threaten Chinese interests).'
  it: ''
- hash: d9a88c49
  kind: cards
  en: Turkish protection against Israel draws the Israeli fire it is meant to deter. Ankara's training, air-defence and base plans are the reason Damascus feels able to resist Israeli demands, yet Israel
    struck the runway of Abu al-Duhur eight times on 18 Aug 2026 precisely because Syria was about to host Turkish troops ('we will not tolerate a Turkish military foothold moving south'); Damascus then
    cut contact with Israel before returning to the talks on 23 Aug.
  it: ''
- hash: f1525f1f
  kind: cards
  en: Winning the east removed the buffer that held the Islamic State. Taking over the SDF's territory, camps and prisons in January 2026 gave Damascus unity on paper, but the US then left Tanf and Shaddadi
    and moved the detainees to Iraq, so the state that wanted to show itself as an indispensable counter-ISIS partner now carries the weight of the fight with a young army and fewer American eyes.
  it: ''
- hash: 5a543852
  kind: cards
  en: Using force to unify the state produces the violence that Western money and Israel's pretext depend on. The coastal killings of March 2025 and the Suwayda clashes of July 2025 each came out of an
    attempt to extend control, and each handed critics a condition (the 180-day Caesar review, the UN inquiry) and handed Israel a protector's role over the Druze; Sweida's Hijri now rallies for Israel.
  it: ''
- hash: 3adf8f5d
  kind: cards
  en: Closing the door on Moscow weakens the one great power that could police the south. The 9 Aug 2026 memorandum turns Hmeimim and the Tartus berth into joint training centres and wins Western favour,
    but a Syrian source said before the January 2026 Moscow talks that al-Sharaa might ask for Russian military police as a guarantor against Israeli encroachment (reported, not confirmed), and the exiled
    Assad is still in Russia. Distancing Russia raises Syria's exposure to the Israel and Turkey pair it has to balance.
  it: ''
- hash: dc1ebdad
  kind: cards
  en: The same army cannot face every front. The brigades sent against the Kurdish militias in January 2026 were moved to the Lebanese border in March, when the Iran war began; Trump's idea that Syria 'finish
    the job' against Hezbollah was disowned by al-Sharaa, who needs the border quiet to sell Syria as a corridor but would lose his Western credit if Hezbollah's supply line reopened.
  it: ''
- hash: ebc9f7ac
  kind: cards
  en: 'Dependence is the price of the independence on offer: every patron funds a different Syria. Qatar pays for gas to run the grid, Saudi Arabia and the UAE for ports and telecoms, Turkey for the army,
    Washington for the sanctions waiver, Brussels and Berlin ask for refugee return in exchange for the partnership deal. Diversifying the patrons protects al-Sharaa from any one of them and leaves him
    answerable to all of them at once (Damascus told Israel it will not accept limits on its alliances; the commitments already made are the limits).'
  it: ''
- hash: 4c45ed3a
  kind: cards
  en: 'Syria under Ahmed al-Sharaa runs the grand strategy of a victorious insurgency

    that has to become a state before its patrons lose patience. The rank order of the

    objectives is the order of the dangers: first the monopoly of force (the SDF

    deal, Suwayda, the coast), then legitimacy (delistings, sanctions relief, Caesar

    repeal), then money. The method is multi-alignment at the leader level, with no

    patron allowed to own the state: Turkey for the army, the Gulf for the cash,

    Washington for the permission to trade, Russia kept only as a training partner,

    Iran expelled. The Luttwak pattern is that each move that builds the state

    also invites an outsider into it: the Turkish umbrella draws the Israeli strike,

    the conquest of the east takes away the American cover, the pressure on

    minorities supplies the conditions that Western money carries. Signals that are

    not rows: the Syrian army''s deployment to the Lebanese border in March 2026,

    al-Sharaa''s refusal to attend the 2025 Baghdad summit, and Egypt''s refusal of a

    Syrian ambassador. Open question for the next review: whether the 25 Aug SDF

    dissolution survives its first test in Hasakah and Kobani, and whether an

    Israeli security agreement is signed or the south settles into a frozen

    occupation. Not read in this pass: Crisis Group and Carnegie analyses of 2026

    (the search budget ran out), so grades on Israel, Russia and China rest on press

    and official statements.'
  it: ''
- hash: c7ab9234
  kind: cards
  en: Keep the regime of Mahamat Idriss Déby in power. Putin praised him in January 2024 for having stabilised the country and offered help; the 2025 accounts of attacks near the presidential palace are
    not sourced here.
  it: ''
- hash: fccf6e6b
  kind: cards
  en: Keep the Sudan war off Chadian soil. The eastern border was closed indefinitely on 23 Feb 2026, citing Sudanese armed groups after fighting at al-Tina; Chad had expelled four Sudanese diplomats in
    December 2023, and Khartoum accuses N'Djamena of aiding the RSF.
  it: ''
- hash: 9c725e3d
  kind: cards
  en: 'Hold the Lake Chad and Libyan borders with partners: the MNJTF with Cameroon and Nigeria, mandated against Boko Haram and ISWAP, and a joint border force with Haftar''s LNA in the east (14 Nov 2025).
    The June 2026 preview says Chad has threatened to reduce or leave the MNJTF.'
  it: ''
- hash: 16b5480e
  kind: cards
  en: 'The Chadian army as the regional force: a column on the Niger-Libya border (press-reported ambush, 27 Feb 2026), the joint border force with the LNA, and the MNJTF contingent. The Lake Chad force
    has capability gaps, so the army carries the weight.'
  it: ''
- hash: bc9897ff
  kind: cards
  en: 'Multi-vector patronage since the French exit: Abu Dhabi''s field hospital at Amdjarass and rising military aid (2023-24), Putin''s welcome of January 2024, a planned Hungarian training mission of
    about 200 soldiers, and a Tripoli embassy. Each patron buys access; none has been shown to buy a guarantee.'
  it: ''
- hash: a1b826dd
  kind: cards
  en: The French guarantor is gone. Chad ended the defence accord in November 2024 (Le Monde, 29 Nov 2024), and France handed over its Faya base on 26 Dec 2024 and finished withdrawal in January 2025 (Stratfor).
    The army now needs other patrons for its own defence.
  it: ''
- hash: '65539510'
  kind: cards
  en: The shared security framework is thin. The MNJTF has persistent capability gaps (air assets, counter-drone systems, IED disposal) and its membership is contested in the sources; Chad's threat to pull
    out is the sharpest sign. Chad cannot count on the force as a shield.
  it: ''
- hash: d5597a9b
  kind: cards
  en: Chad closes the border against the Sudanese side of the RSF supply while taking Abu Dhabi's hospital, aid and cargo flights, which Khartoum and the reports call the RSF's western door. The closure
    answers a threat that the patron relation helps sustain.
  it: ''
- hash: 5b078045
  kind: cards
  en: Leaving France to gain room has brought promises rather than troops. Moscow and Budapest offered cooperation, but no Africa Corps presence in Chad is confirmed in sources found and the Hungarian mission
    had no confirmed start; the exit from a guarantor leaves the army with patrons it cannot see on the ground.
  it: ''
- hash: 2faedc96
  kind: cards
  en: 'Chad''s grand strategy is the survival of the Déby regime on borders it cannot seal: Sudan''s war, the Libyan east and the Lake Chad jihadists all press on one army. Having lost France as guarantor,
    N''Djamena spreads its patronage across Abu Dhabi, Moscow, Budapest and Haftar, and buys access more than protection. The gaps are the Zaghawa question (the clan''s Darfur kin among the RSF''s victims,
    a reading taken from the SDN card and not sourced here), the oil corridor, the Central African Republic, Cameroon and the United States, none yet sourced for this card.'
  it: ''
- hash: 2bf31d41
  kind: cards
  en: 'Be the bridge between the Sahel and the Gulf of Guinea: the Togo-Sahel strategy for 2026-2028, presented in Lomé on 18 April 2026 under the patronage of Council President Faure Gnassingbé, replaces
    the 2021 plan, aims to strengthen political dialogue with the Sahel states and presents Togo as a credible mediator.'
  it: ''
- hash: 23ddb505
  kind: cards
  en: 'Keep jihadist violence on the northern border from spreading south: the strategy names the persistent terrorist threat and its spread toward the coastal Gulf of Guinea states as the reason for updating
    its Sahel policy.'
  it: ''
- hash: cb355834
  kind: cards
  en: 'Mediation and dialogue: a six-session meeting in Lomé in April 2026 with governments, regional and international organisations, special envoys and civil society, meant to present the strategy and
    build political dialogue with the Sahel states.'
  it: ''
- hash: 429261cb
  kind: cards
  en: 'The terrorist threat is on its own border: the same strategy says insecurity is spreading toward the coastal states, so Togo''s Sahel diplomacy is also a security problem it must manage with the
    states it is talking to.'
  it: ''
- hash: 3f0aab87
  kind: cards
  en: 'The bridge runs to the states whose exit from ECOWAS and whose insecurity the strategy names as the problem: the strategy''s own reasons are the persistent terrorist threat, its spread toward the
    coast, and the Sahel states'' departure from ECOWAS. The closer Lomé draws to the AES, the more it takes on the exposure it wants to manage from outside.'
  it: ''
- hash: ad874f08
  kind: cards
  en: 'Togo''s strategy, as far as the sources opened for this card show, is to turn a small Gulf of Guinea state into the broker between the Sahel juntas and the coastal states, so that the jihadist war
    on its northern border is handled through talks rather than only through troops. The card is thin: one government-announced strategy (April 2026) is the only source opened, and the constitution and
    the 2025 protests, the Alliance of Sahel States membership question, the Port of Lomé''s role for landlocked Sahel states, and the Nigeria, ECOWAS, Ghana, Benin, France and China relations are not yet
    sourced at the level the card needs. Those are the gaps for the next pass.'
  it: ''
- hash: 86f56c43
  kind: cards
  en: 'Keep the established order at home intact: a monarchy protected by the lese-majeste law, and an army, courts and Senate that can remove or dissolve what the voters elect, with a conservative-business
    coalition in government. The 2025-26 cycle is the proof: Paetongtarn Shinawatra was removed by the Constitutional Court (6-3, 29 Aug 2025), Anutin Charnvirakul took over (5 Sep 2025), called a snap
    election and won it (Bhumjaithai 192 of 499 seats on 8 Feb 2026), and an amnesty law in force from 24 Aug 2026 covers political offences from 2005 to July 2025 but excludes Section 112.'
  it: ''
- hash: b80c5593
  kind: cards
  en: 'Settle the Cambodian frontier on Thai terms and keep it bilateral: hold the positions taken in 2025, send boundary questions only to the Joint Boundary Commission, and make demining, no new violations
    and action on the scam compounds the price of normal relations. Bangkok cannot be seen to concede: the leaked call with Hun Sen cost Paetongtarn her office, and the Cambodian fighting was the setting
    in which Anutin called his election.'
  it: ''
- hash: 905bf354
  kind: cards
  en: 'Stay on good terms with every great power and join none of their blocs: treaty ally and Major Non-NATO Ally of the United States (Cobra Gold, a tariff framework), China''s economic and now defence
    partner (high-speed rail, a 2+2 mechanism, a Chinese submarine), a summit with Putin in Kazan, an EU free-trade agreement in the making, and Swedish jets instead of American ones.'
  it: ''
- hash: d2959978
  kind: cards
  en: 'Protect an export-and-tourism economy that sells abroad the equivalent of 71% of GDP: lock in market access (a US framework at a 19% reciprocal rate, an EU agreement with 15 of 24 chapters closed
    by June 2026, a Eurasian Economic Union agreement mooted) and manage the shift of its largest industry, cars, from Japanese to Chinese brands.'
  it: ''
- hash: 3e6317af
  kind: cards
  en: 'Contain the Myanmar collapse and the criminal economy that grew on the 2,400 km frontier (scam compounds, drugs, refugees) by working with whoever holds the ground: the junta first (''it''s not about
    legitimacy, it''s about reality''), while keeping a dual track with the other side of the border.'
  it: ''
- hash: 4e707049
  kind: cards
  en: 'End the southern insurgency without internationalising it: a Malaysia-facilitated dialogue with the BRN, a new chief negotiator (the intelligence chief, appointed in May 2026) and a high-level round
    planned in Malaysia in September, with decentralisation and amnesties reportedly on the table.'
  it: ''
- hash: 9bf460bc
  kind: cards
  en: 'Omnidirectional hedging at leader level: Xi Jinping received Anutin in Shanghai on 17 Jul 2026 (joint statement, a new 2+2 mechanism for foreign affairs and defence); Putin met him in Kazan on 18
    Jun 2026; Trump and he exchanged letters and agreed a trade framework on 26 Oct 2025; Modi''s strategic partnership (Apr 2025) and Vietnam''s comprehensive strategic partnership (May 2025) complete
    the set. Nothing is added to the American treaty and no bloc is joined.'
  it: ''
- hash: 6f8fe325
  kind: cards
  en: 'ASEAN as an envelope, not a referee: Bangkok accepted Malaysia''s chairmanship mediation (Putrajaya talks and ceasefire from 28 Jul 2025; Kuala Lumpur declaration of 26 Oct 2025) when Washington''s
    tariff threat made refusal costly, then kept the boundary question bilateral through the Joint Boundary Commission; both sides use ASEAN Observer Teams to support competing accounts (Crisis Group).'
  it: ''
- hash: a86cbf8e
  kind: cards
  en: Force on the frontier and diversified kit. Thai forces hold much of the high ground and land on both sides of the contested line (Crisis Group), after air strikes in the 2025 fighting; the air force
    chose Swedish Gripen E/F over the American F-16 despite US lobbying (four aircraft, about SEK 5.3bn, signed 25 Aug 2025, inside a 12-aircraft plan); the navy buys a Chinese S26T submarine. Cobra Gold
    2026 (24 Feb-6 Mar, about 8,000 troops from 30 nations) keeps the American channel open.
  it: ''
- hash: 96bcc466
  kind: cards
  en: Border trade as a lever and market access as a shield. Bilateral trade with Cambodia fell 40% to USD 1.3bn in the first half of 2026 as relations froze; power, internet and fuel to five Myanmar border
    areas were cut on 5 Feb 2025 to pressure the scam compounds; and the tariff framework with Washington (tariff barriers removed on about 99% of US goods, USD 5.4bn a year of energy, 80 Boeing aircraft)
    is the price of the 19% rate.
  it: ''
- hash: 2e6f63be
  kind: cards
