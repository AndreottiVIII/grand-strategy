  kind: cards
  en: 'A ''Terror-Free Türkiye'' and a terror-free border: end the PKK insurgency by negotiated disarmament inside Turkey (Öcalan''s call of Feb 2025, the PKK''s May 2025 dissolution decision, a parliamentary
    commission from August 2025, Law No. 7595 passed 468-600 on 10 Aug 2026) and dissolve the YPG/SDF as an autonomous armed force in Syria (Damascus-SDF integration deal of 30 Jan 2026; Mazloum Abdi announced
    the integration complete on 25 Aug 2026). The law offers conditional suspension of sentences and does not touch Öcalan''s status or wider Kurdish rights.'
  it: ''
- hash: 5d1e486e
  kind: cards
  en: 'Stay anchored in NATO and the Western arms market while keeping the Russian relationship: win back F-35 access and the lifting of CAATSA sanctions (Trump said on 7 Jul 2026 in Ankara ''we''re going
    to be taking the sanctions off''; Erdoğan says he received ''a promise''), buy fighters wherever they are sold (40 F-16 Block 70 approved Jan 2024, 20 Eurofighter Typhoons ordered Oct 2025) and keep
    the S-400, Gazprom gas and the Akkuyu plant.'
  it: ''
- hash: 3d9c2168
  kind: cards
  en: 'Regional primacy by presence and claim: a friendly government in Damascus (a military training agreement of 13 Aug 2025 with the post-Assad authorities), the ''Blue Homeland'' maritime doctrine in
    the Aegean and Eastern Mediterranean (marine-park decrees of 15 Aug 2026 around Lemnos-Samothrace and Kastellorizo, a Blue Homeland law expected before parliament in October 2026), a foothold on both
    sides of the Libyan divide, troops and a spaceport in Somalia (mandate renewed to July 2028), and the treaty alliance with Azerbaijan.'
  it: ''
- hash: 3ca7039b
  kind: cards
  en: 'Be the indispensable crossing point and go-between: the Iraq Development Road and the water-for-projects mechanism with Baghdad, the Middle Corridor through Azerbaijan and Georgia, Istanbul as the
    venue of Russia-Ukraine talks (2025; Ankara hoped in Sept 2026 to bring them back), an offer in July 2026 to help demine the Strait of Hormuz, a seat for Fidan on the Gaza executive board and the Makkah
    defence pact with Saudi Arabia and Pakistan (7 Aug 2026).'
  it: ''
- hash: 262c9818
  kind: cards
  en: 'Stabilise the economy and build an industrial base that pays for autonomy: disinflation under the Şimşek programme (official inflation 31.51% in August 2026 against a revised year-end target of 28.4%;
    policy rate held at 37% on 10 Sep 2026, fifth straight hold) and a defence-and-aerospace export line that passed USD 10bn in 2025 (3.6% of total exports) and USD 11bn on a rolling 12-month basis in
    2026.'
  it: ''
- hash: 7fce7359
  kind: cards
  en: 'Host-and-bridge diplomacy: the NATO summit in Ankara (7-8 Jul 2026, Ankara Declaration adopted by all 32 allies with Trump present), phone mediation between Erdoğan and Trump on Iran (17 Aug 2026),
    contact with Washington, Tehran, Pakistan and Qatar in the Iran war, and a rotating set of ''high-level cooperation councils'' (North Macedonia, Montenegro) and trilaterals (Georgia-Azerbaijan, Istanbul
    Declaration of 8 Jun 2026).'
  it: ''
- hash: 0eae2ac0
  kind: cards
  en: 'Alliance-building outside the West: the Makkah Joint Defense Agreement with Saudi Arabia and Pakistan (an attack on one is an attack on all; signed 7 Aug 2026, Erdoğan wants Egypt and others added),
    the Organization of Turkic States (12th summit in Gabala on 7 Oct 2025; a regular summit in Türkiye and an informal one in Kazakhstan planned for 2026) and the Shusha treaty with Baku.'
  it: ''
- hash: be25fecd
  kind: cards
  en: 'The ''Terror-Free Türkiye and Terror-Free Region'' frame (Erdoğan at Malazgirt, 26 Aug 2026: Turkey ''tied our horse''s tail'' and is ''shaping history''), plus religious soft power through Diyanet
    (the Namazgah mosque in Tirana, about EUR 30m) and the state press (Anadolu, Daily Sabah, TRT).'
  it: ''
- hash: 53075af9
  kind: cards
  en: 'A large NATO army and a drone-led defence industry projected abroad: NATO estimates put 2026 defence spending at about USD 48bn (eighth in the alliance; the finance ministry budgets 2.33% of GDP);
    troops and training missions in Somalia (to July 2028), Syria (training agreement), Libya (Efes-2026, over 500 soldiers from East and West trained), Kosovo (420 in KFOR) and Bayraktar sales (Kosovo,
    Albania, Azerbaijan, Ukraine).'
  it: ''
- hash: 35c1ab81
  kind: cards
  en: 'Trade as leverage: the customs union with the EU (modernisation relaunched in Feb and June 2026), the Gazprom and BOTAŞ gas portfolio (22 bcm of Russian contracts extended a year; a 20-year LNG deal
    with Mercuria for US gas), contractors and investment in the Balkans, Caucasus and Gulf, and the Iraqi water-for-projects mechanism financed by Iraqi oil sales.'
  it: ''
- hash: 5756ffde
  kind: cards
  en: 'A fragile macro position: inflation 31.5% (August 2026) against an official year-end target of 28.4%, a policy rate stuck at 37%, a current-account deficit of USD 34.6bn in the first half of 2026
    and an energy bill that the Iran war made worse. Every confrontation that costs the lira or reserves limits what Ankara can afford.'
  it: ''
- hash: 4ee50927
  kind: cards
  en: 'US law, not just US mood: the CAATSA sanctions on the defence procurement agency (SSB) date from December 2020 and the F-35 ban was codified by Congress; the S-400 is still in Turkish hands, so lifting
    sanctions or readmitting Turkey to the F-35 programme needs more than a presidential statement (on 2 Oct 2026 Trump gave no timetable).'
  it: ''
- hash: 0fc444da
  kind: cards
  en: 'EU unanimity with Athens and Nicosia in the room: customs-union modernisation and any Turkish access to the EUR 150bn SAFE defence instrument need unanimity, and Greece and Cyprus are described as
    entrenched opponents; visa liberalisation has not moved, accession has been frozen for years.'
  it: ''
- hash: 4f4b4ac5
  kind: cards
  en: 'Israel''s veto and reach: Israel has pushed Washington to exclude Turkey from the Gaza arrangements (''no Turkish or Qatari soldiers in the Gaza Strip'', Netanyahu) and struck the Abu al-Duhur airbase
    in Idlib on 18 Aug 2026 to stop a Turkish foothold in Syria.'
  it: ''
- hash: 4a748a2d
  kind: cards
  en: 'Energy dependence on the powers it balances: Russian gas contracts of 22 bcm a year (under 40% of the gas mix, down from over 50% in 2018), Russia still the largest petroleum supplier (47.5% of imports
    in December 2025) and the Rosatom-built Akkuyu plant, whose first unit is due by the end of 2026.'
  it: ''
- hash: b8785e83
  kind: cards
  en: 'The unfinished Kurdish settlement: Law 7595 gives conditional relief only after verified disarmament and a National Security Council confirmation, and leaves Öcalan, anti-terror legislation and Kurdish
    political and cultural rights open; a Syrian Kurdish and Iranian Kurdish (PJAK) question remains outside Turkey''s control, and Turkey hosts nearly 4 million Syrian refugees.'
  it: ''
- hash: 44cfb18e
  kind: cards
  en: The S-400 bought for autonomy bound Ankara tighter to everyone it wanted to bargain with. It earned the F-35 expulsion (2019) and CAATSA sanctions (2020); Turkey then spent seven years assembling
    an air force from three suppliers (F-16s from the US, Typhoons from Britain, a domestic KAAN), and in 2026 the price of readmission is still the S-400 it will not give up.
  it: ''
- hash: 4a039c70
  kind: cards
  en: 'Winning in Syria creates the collision it feared there. Ankara got a friendly government in Damascus and the SDF''s integration, but its reach toward bases such as Abu al-Duhur drew eight Israeli
    air strikes on 18 Aug 2026 and Netanyahu''s ''we will not tolerate a Turkish military foothold moving south'': the more Turkey consolidates Syria, the nearer it comes to a clash with a nuclear-armed
    state backed by the US it needs.'
  it: ''
- hash: 67477e3b
  kind: cards
  en: The Israel boycott that buys the Arab street costs Turkey the seat it wants in Gaza. Ankara cut all trade (May 2024, announced complete on 29 Aug 2025) and closed ports and airspace, and now Israel
    vetoes Turkish soldiers in the stabilisation force and lobbies against Turkey on the Board of Peace, although Fidan sits on its executive board; Fidan himself says trade will resume once the war ends.
  it: ''
- hash: 05079811
  kind: cards
  en: Marine-park decrees against the EU door. The Greek détente (Mitsotakis in Ankara on 11 Feb 2026, customs-union talks relaunched) is what could unlock modernisation and SAFE, which need Greek and Cypriot
    consent; the 15 Aug 2026 decrees around Lemnos-Samothrace and Kastellorizo, and a Blue Homeland law due in October, hand Athens the argument to block them.
  it: ''
- hash: b4fc88fa
  kind: cards
  en: Mediator at the edge of two wars, paying for both. Ankara refused to take sides in Ukraine and Iran, kept the straits closed to warships and a channel to every capital, yet the Iran war raised oil
    prices, pushed analysts' inflation forecasts above 30% and put three Iranian missiles into its airspace; the neutrality that makes Turkey useful also makes it the neighbour that pays the energy and
    refugee bill.
  it: ''
- hash: 4b699497
  kind: cards
  en: Removing the rival to secure power taxes the economy that power rests on. The prosecution of İmamoğlu and the CHP keeps the main challenger off the field, but it sits beside an economy where the central
    bank cannot cut (37% for five meetings, forecast raised to 28% year-end), foreign capital is 'fragile' and the Western doors Ankara wants opened (EU modernisation, SAFE) are tied to rule-of-law talk.
  it: ''
- hash: d1d33ce0
  kind: cards
  en: 'Türkiye runs the grand strategy of a middle power that has decided to be a hinge

    rather than a bloc member: it keeps the second-largest army in NATO and hosts its

    2026 summit, buys Russian gas and an S-400, signs a mutual-defence pact with

    Riyadh and Islamabad, and offers itself as the venue and mediator that every

    side needs. The currency is indispensability, and it works because nobody can

    afford to push Ankara out. Luttwak''s pattern appears at each seam: the S-400 that

    proved autonomy cost the F-35; the victory in Syria draws Israeli bombs on its

    airbase; the Blue Homeland decrees imperil the customs union; the boycott of

    Israel closes the Gaza seat. Underneath sits regime security. The two things the

    leadership most needs in 2026 - the end of the PKK war (Law 7595, the SDF''s

    dissolution) and a path to keep power (the İmamoğlu trial) - are domestic

    before they are foreign, and they set the tone of the external line: a

    ''Terror-Free Türkiye'' that justifies Syrian and Iraqi policy, and a Western

    reconciliation (Trump''s promise of sanctions relief and the F-35) pursued

    without conditions on rule of law. Signals that are not rows: Ankara has not

    joined Western sanctions on Russia and cut Russian crude only after Trump''s

    appeal of Sept 2025; Washington''s envoy to Syria is also its ambassador in

    Ankara, which makes Turkey the channel for US policy in Damascus. The open

    questions for the next quarter are whether Trump''s promise becomes a legal

    instrument, whether the Blue Homeland law passes in October, and whether the

    Israel-Turkey deconfliction mechanism in Syria is built before the next strike.'
  it: ''
