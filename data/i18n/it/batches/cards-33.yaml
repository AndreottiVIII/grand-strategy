- hash: 0c943ff6
  kind: cards
  en: The court that removed a Shinawatra made the Shinawatras indispensable. After Paetongtarn's removal (Aug 2025) the conservatives won 192 seats in February 2026 but, short of a majority, formed the
    government with Pheu Thai, Thaksin's party, which took the coalition to about 292 of 499 seats; Anutin was re-elected prime minister on 19 Mar 2026 with 293 votes.
