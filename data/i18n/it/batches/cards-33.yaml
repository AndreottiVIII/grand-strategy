- hash: 4991b22d
  kind: cards
  en: 'Tajikistan is a small, poor, landlocked state run as a family business and kept alive by the labour of its men in Russia. Its survival rests on three outside pillars: the Russian garrison and the
    CSTO, a Chinese creditor and security presence in the Pamirs, and the water and power it hopes to sell downstream. The Taliban are its only open enemy in the region, and the threat Dushanbe fears most
