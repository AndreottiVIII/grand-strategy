items:
- hash: e22c4e36
  it: |
    Sopravvivenza del regime e monopolio del potere da parte della cerchia dell'Emiro a Kandahar: nessun governo inclusivo, nessuna concessione sull'ordine sociale (donne, istruzione, tribunali) e sconfitta dei rivali armati (lo Stato islamico nel Khorasan, il National Resistance Front, l'Afghanistan Freedom Front).
- hash: 02644be7
  it: |
    Riconoscimento e seggio alle Nazioni Unite senza pagarne il prezzo: relazioni normali con il maggior numero possibile di capitali (la Russia ha riconosciuto; Cina, Golfo, Asia centrale e ora India e EU trattano con l'Emirato) rifiutando i parametri che l'Occidente vi collega, soprattutto sulle donne. Il modello che Zelin chiama 'recognition without concessions'.
- hash: 5cbab95c
  it: |
    Indurre il Pakistan a cessare la coercizione su Kabul e a non essere più l'unica porta: far terminare gli attacchi aerei e con droni (compresi quelli su Kabul e Kandahar), riaprire il confine e il commercio di transito, mantenendo la linea per cui i talebani pachistani (TTP) sono un problema interno del Pakistan e non spetta all'Afghanistan disarmarli.
- hash: 811c43cf
  it: |
    Trasformare la geografia in reddito: essere lo Stato di transito e di risorse di cui tutti hanno bisogno (ferrovia transafghana, gas TAPI, ferrovie dell'Asia centrale, rame di Mes Aynak, esplorazione di gas appaltata a un'impresa saudita) e spostare il commercio dal Pakistan verso Iran, Asia centrale, Turchia e India.
- hash: 1341b2e4
  it: |
    Conservare e vendere l'unico servizio che i talebani offrono contro nemici peggiori: la repressione dello Stato islamico nel Khorasan (e, per Pechino e Mosca, la promessa che il suolo afghano non sarà usato contro i vicini), scambiata con denaro, riconoscimento e manutenzione degli armamenti.
- hash: 91a5bb51
  it: |
    Raggiungere un accordo con Washington: riaprire l'ambasciata US, sbloccare le riserve della banca centrale, ottenere investimenti da imprese americane, rifiutando però di restituire Bagram e di accettare le altre condizioni di Washington.
- hash: 9261c471
  it: |
    Bilateralismo multivettoriale condotto dal ministro degli Esteri Muttaqi: ogni capitale disposta a parlare riceve una visita o un diplomatico (Moscow Format a ottobre 2025 e di nuovo il 5 ott 2026, Nuova Delhi a ottobre 2025, colloqui tecnici a Bruxelles a giugno 2026), un incaricato d'affari a Nuova Delhi (gennaio 2026) e l'accettazione di mediatori nella disputa con il Pakistan (Qatar, Turchia, Arabia Saudita, Cina). L'accesso consolare per i voli di espulsione è esso stesso una carta negoziale (la Germania ha accettato altri diplomatici talebani a giugno 2026).
- hash: b6eacea0
  it: |
    Una linea disciplinata dei portavoce (Mujahid, Fitrat, Balkhi): negare che qualsiasi gruppo militante straniero operi dal suolo afghano ('Pakistan's domestic problem'), invocare contro Washington l'Accordo di Doha del 2020, ribattezzare le battaglie a modo proprio ('Radd al-Zulm'), respingere senza appello l'ICC e promuovere presso Mosca e Pechino il proprio bilancio in materia di sicurezza e lotta alla droga. Il Gruppo di monitoraggio delle Nazioni Unite ha definito la smentita 'not credible'.
- hash: 9cf5577e
  it: |
    Una forza leggera e ideologicamente coesa, dotata di armi catturate e di materiale di epoca sovietica, ora sostenuta dalla Russia (accordo tecnico-militare del 27 maggio 2026, in prevalenza riparazione di equipaggiamenti sovietici e russi), con droni e artiglieria di frontiera impiegati contro postazioni pachistane e la rivendicazione di missili in grado di raggiungere città pachistane. Crisis Group la giudica nettamente inferiore al Pakistan per potenza di fuoco.
- hash: c332c90f
  it: |
    Concessioni di transito e di risorse come politica estera: il contratto di esplorazione del gas con Delta International (25 anni, prima fase da USD 200m, blocchi Kushk-Tirpul), il rame cinese a Mes Aynak, la gestione degli aeroporti da parte degli UAE, la ferrovia transafghana, le ferrovie kazaka e uzbeka, il tratto TAPI a Herat; più il divieto sul papavero (superficie a papavero di 10,200 ha nel 2025 contro 232,000 ha nel 2022) che procura benevolenza e costa reddito rurale.
- hash: 737c253a
  it: |
    L'ordine sociale è il prezzo dell'esclusione: i divieti a ragazze e donne hanno procurato all'Emiro e al presidente della Corte suprema mandati d'arresto da parte dell'ICC (8 lug 2025), bloccano il seggio all'UN e l'impegno degli US e danno a ogni partner occidentale un motivo per mantenere il contatto 'technical'. Kandahar non li scambierà, quindi la legittimità resta limitata.
- hash: 05ff984d
  it: |
    Un'economia che si contrae pro capite: PIL reale in crescita stimata del 4.8% nel 2025, ma prodotto pro capite in calo del 5.6% con il rientro di circa 3.7 milioni di afghani (da Iran e Pakistan); disavanzo di conto corrente pari al 36.1% del PIL; inflazione al 7.6% a marzo 2026; appello umanitario 2026 da USD 1.71bn finanziato solo per circa un quarto; 21.9 milioni di persone in stato di bisogno. Gli Stati Uniti hanno posto fine ai propri aiuti nel 2025.
- hash: 56dac75c
  it: |
    Il Pakistan dispone dell'esercito più forte, dell'aeronautica e delle chiavi del mare: i valichi terrestri sono in gran parte chiusi dai combattimenti dell'ottobre 2025, il Pakistan ha colpito Kabul e, per la prima volta, Kandahar nel febbraio 2026, e la sua posizione è che i confini riapriranno solo a fronte di 'decisive and verifiable action' contro il TTP.
- hash: 75c0191e
  it: |
    Senza sbocco al mare e dipendente dalle importazioni: ogni rotta (Pakistan, Iran, Asia centrale) appartiene a qualcuno che dispone di una leva. L'Iran è ora il primo partner commerciale secondo i dati dei talebani (USD 3.6bn l'anno) ed espelle centinaia di migliaia di persone l'anno trattenendo l'acqua dell'Helmand.
- hash: b38f8f24
  it: |
    Un'opposizione armata in crescita nel nord-est: tre fronti antitalebani (NRF, AFF, Sepahiyan-e Mihan) hanno rivendicato almeno 50 attacchi in un mese, un centro distrettuale (Yaftali Sufla) è caduto per breve tempo a luglio 2026 e parte della leadership si trova oltre il confine tagico. L'EUAA continua a ritenere che nessun gruppo controlli territorio.
- hash: 8069c229
  it: |
    Il fardello dei gruppi terroristici: gli osservatori delle Nazioni Unite riferiscono che al-Qaida mantiene una presenza stabile, che i talebani continuano a sostenere il TTP e che combattenti dell'ETIM (la preoccupazione di Pechino) si trovano nel nord; il rifugio concesso a questi gruppi è ciò che ogni vicino, patrono e mediatore chiede a Kabul di far cessare.
- hash: cd837da7
  it: |
    Il rifugio concesso al TTP è il costo della lealtà ideologica e la fonte della minaccia. Tenere i talebani pachistani come fratelli d'armi evita una spaccatura tra i comandanti talebani, ma ha trasformato il Pakistan da patrono nel principale nemico militare dell'Emirato: attacchi su Kabul (ott 2025), 'open war' (26-27 feb 2026, con Kandahar colpita per la prima volta), un mese di combattimenti, poi nuovi attacchi a settembre 2026.
- hash: bf2ee314
  it: |
    Affermare l'ordine islamista non vale alcun riconoscimento. Il divieto di istruzione secondaria per le ragazze e di lavoro per le donne tiene unito il movimento attorno a Kandahar, ma è la sola condizione che blocca il seggio all'UN, il denaro americano e la piena normalizzazione che India, Cina e Golfo potrebbero altrimenti concedere.
- hash: 28b592c1
  it: |
    Sottrarsi al Pakistan rende Kabul dipendente da Iran e India, e l'India è la carta che spinge il Pakistan a colpire più duramente. L'Iran è ora il primo partner commerciale (USD 3.6bn) ma ha espulso circa 2 milioni di afghani in un anno e trattiene l'acqua dell'Helmand; l'elevazione al rango di ambasciata della sede di Delhi e la linea del ministro pachistano secondo cui l'Afghanistan è 'a colony of India' alimentano le ragioni pachistane per l'uso della forza.
- hash: 00e6a2a9
  it: |
    Il canale di Qosh Tepa irriga le aziende agricole afghane con l'acqua dell'Amu Darya e incrina i rapporti con l'unico vicino settentrionale che offre ferrovia, energia e commercio. Il ministro afghano dell'Acqua afferma che nessun accordo vincola i suoi prelievi; l'Uzbekistan ha firmato con Balkh un quadro di gestione del fiume a maggio 2025 e ora sollecita negoziati urgenti perché la portata del fiume è in calo.
- hash: e1ac5752
  it: |
    A ciascuno viene offerta l'unica cosa che gli altri vietano. La Russia ottiene 'no NATO infrastructure' e un accordo tecnico-militare; Washington chiede Bagram e non offre nulla; Riad firma sul gas mentre l'Arabia Saudita è legata al Pakistan da un patto di difesa; Pechino vuole l'ETIM soppresso mentre Dushanbe denuncia attacchi dal suolo afghano. Giocare con tutti tiene in vita l'Emirato ma lo lascia senza garante quando il Pakistan colpisce.
- hash: 26b0cfb4
  it: |
    L'esodo è insieme un peso e una carta negoziale. Iran, Pakistan e Germania respingono le persone (circa 3.7 milioni di rientri, PIL pro capite in calo del 5.6%), ma gli stessi voli di espulsione fanno pagare all'Europa un prezzo in legittimazione consolare: la Germania ha accettato altri diplomatici talebani e l'EU ha incontrato una delegazione talebana a Bruxelles. Quanto più l'Emirato è danneggiato dai rientri, tanto più può vendere la cooperazione su di essi.
- hash: 8c6bbcdf
  it: |
    L'Afghanistan dei talebani è il paria che sopravvive a chi vorrebbe isolarlo. L'Emirato non ha alleati, non ha un seggio all'UN e ha una cerchia di governo incriminata dall'ICC, eppure a ottobre 2026 è corteggiato da Mosca (riconoscimento, accordo tecnico-militare), Pechino, Delhi, Riad, Doha e persino Bruxelles e Berlino. La lampada di Luttwak ne mostra il motivo: è utile contro nemici peggiori (lo Stato islamico nel Khorasan) e detiene ciò di cui tutti hanno bisogno (transito, acqua, minerali, un ponte terrestre tra Asia centrale e meridionale), così che ogni potenza che vorrebbe isolarlo ha una ragione concorrente per trattare con esso. La strategia consiste nel vendere accesso senza cedere sull'ordine sociale, ed è per questo che Zelin la chiama recognition without concessions. La debolezza sta nel rapporto che un tempo lo proteggeva. Il patrono pachistano è diventato il principale nemico militare a causa del TTP, e il paradosso è luttwakiano in senso puro: la lealtà verso l'organizzazione sorella del movimento costa all'Emirato il confine, la principale via verso il mare e, a febbraio 2026, i raid aerei sulla stessa Kandahar. Kabul costruisce ora un anello di alternative (Iran, Asia centrale, India, Golfo, Russia), ma ogni anello ha un prezzo: dipendenza dall'Iran ed espulsioni, una contesa sull'acqua con l'Uzbekistan, un vicino tagico che ospita la resistenza del Panjshir. Due segnali che non sono righe: la presenza di Khalilzad alla firma saudita sul gas il 7 set 2026, che il Dipartimento di Stato ha sconfessato, e il Moscow Format del 5 ott 2026, in cui gli inviati pachistani e talebani si sono scambiati accuse nella stessa sala. La questione aperta per il prossimo anno è se i mediatori del Golfo e cinesi riusciranno a trasformare gli attacchi in un accordo sul TTP prima che la presa dell'Emirato sul nord-est si sfilacci.
- hash: b7d29d22
  it: |
    Usare la presidenza dell'Unione africana e il processo di Luanda per fare dell'Angola il mediatore delle guerre dell'Africa centrale. Il presidente Lourenco ha presieduto l'AU nel 2025. L'Angola ha condotto i colloqui tra DRC e Ruanda a partire dalla Luanda Roadmap del 2022 e a marzo 2025 ha annunciato di farsi da parte come mediatore per concentrarsi sulla presidenza dell'AU. Ha tentato di rientrare a febbraio 2026 con una proposta di cessate il fuoco che l'M23 ha respinto.
- hash: 9b7f388b
  it: |
    Trasformare il corridoio di Lobito in finanza occidentale e in una via di esportazione che non si regga su prestiti cinesi. La US Development Finance Corporation ha firmato il 17 dicembre 2025 un prestito da USD 553m per il consorzio Lobito Atlantic Railway, e il debito garantito dal petrolio verso la Cina è sceso da USD 10.1bn a fine 2024 a circa USD 7.7bn a fine 2025 (dati del ministero delle Finanze, come riportati).
- hash: 4f46ae44
  it: |
    La presidenza dell'AU e la sede di Luanda. Lourenco ha presieduto l'Unione africana nel 2025 e Luanda ha ospitato la roadmap DRC-Ruanda del 2022 che ha attenuato le tensioni. Il ruolo di mediatore è stato lasciato a marzo 2025, per cui lo strumento è ora un titolo e una sede, non un ruolo negoziale stabile.
- hash: fe1d676b
  it: |
    Il petrolio è la rendita che paga lo Stato. La produzione è scesa da 1.42 a 1.1 milioni di barili al giorno tra il 2019 e il 2023, e la Cina assorbe quasi il 72% delle esportazioni petrolifere angolane. L'Angola è uscita dall'OPEC il 1° gennaio 2024 dopo una controversia sulle quote: l'OPEC+ ha fissato il suo obiettivo 2024 a 1.11m barili al giorno, al di sotto degli 1.18m richiesti dall'Angola.
- hash: 5e1bdd8d
  it: |
    I sussidi ai carburanti incontrano la piazza. L'aumento del prezzo dei carburanti del 1° luglio 2025 ha innescato uno sciopero dei minibus-taxi trasformatosi in saccheggi e scontri a Luanda e in altre città; la presidenza ha riferito 22 morti, 197 feriti e 1,214 arresti. La riforma dei sussidi, avviata nel 2023, ha un costo politico visibile.
- hash: d87ade52
  it: |
    I prestiti garantiti dal petrolio sono ancora in corso di rimborso e se ne cercano di nuovi. Il debito verso la Cina garantito dal petrolio scende al calare della produzione, e a febbraio 2026 Sonangol risultava in cerca di un prestito cinese da USD 4.8bn per una raffineria a Lobito: lo Stato continua a indebitarsi contro il petrolio mentre dichiara di volerne dipendere meno.
- hash: 25fd71e9
  it: |
    Il corridoio destinato a portare all'Angola capitali occidentali e un ruolo regionale sbocca nella cintura mineraria della DRC, dove c'è la guerra. Luanda ha lasciato il ruolo di mediatore per la DRC a marzo 2025, nella stessa primavera in cui si definiva il finanziamento di Lobito, per cui lo Stato che vuole pacificare la regione mineraria ne è anche il partner ferroviario.
- hash: e64aed46
  it: |
    La grand strategy dell'Angola consiste nel trasformare la rendita petrolifera e una presidenza continentale in un ruolo regionale e occidentale mentre si estinguono i prestiti cinesi degli ultimi vent'anni. I suoi strumenti sono la presidenza dell'AU, la sede di Luanda e il corridoio di Lobito; i suoi limiti sono la produzione di petrolio, scesa da 1.42 a 1.1 milioni di barili al giorno, e le rivolte dei carburanti del 2025, che mostrano quanto poco spazio abbia la riforma dei sussidi. Non verificati in questo passaggio: l'eredità dell'epoca sovietica e il raffreddamento con Mosca, la successione del 2027, la postura dell'era Trump al di là del finanziamento di Lobito, la tendenza dello Zambia (la scheda ZMB indica in riscaldamento, non riportata qui) e i diamanti come prodotto di esportazione, tutti elementi che richiedono fonti proprie.
- hash: cbf96cff
  it: |
    Entrare rapidamente nell'Unione europea: tutti i cluster negoziali aperti entro il 2025, i primi tre capitoli (25, 26, 30) chiusi provvisoriamente il 14 lug 2026, con il governo che punta a concludere i negoziati entro fine 2027 e ad aderire entro il 2030 (commissaria Kos: 'realistic' se gli standard dello Stato di diritto reggono). L'adesione è la promessa centrale del regime e la via d'uscita da un'economia piccola e in contrazione.
- hash: '25545232'
  it: |
    Mantenere l'ancoraggio di sicurezza euro-atlantico e il canale personale con Washington: membro della NATO dal 2009, una base aerea finanziata dalla NATO a Kucova (riaperta il 4 mar 2024), spesa per la difesa portata a un promesso 2.6% del PIL nel 2026, un seggio fondatore nel Board of Peace di Trump (gen 2026) e un vertice NATO da ospitare nel 2027, ora in dubbio.
- hash: 3cd3a54c
  it: |
    Restare lo Stato di parentela e il patrono di sicurezza del Kosovo senza assumersene la responsabilità: la dichiarazione trilaterale di difesa con Croazia e Kosovo del 18 mar 2025, la visita di Rama a Pristina del 16 feb 2026, il linguaggio della 'one nation'; ma nessuna politica di unificazione e un formato di governo congiunto che lo stesso Rama ha cancellato nel 2023.
- hash: c699d5f0
  it: |
    Consolidare la presa del Partito socialista sul potere dopo le elezioni dell'11 maggio 2025 (quarto mandato consecutivo, 52.6% su risultati parziali) e tenere il governo fuori dalla portata della procura anticorruzione SPAK: Rama ha definito il caso Balluku una 'witch hunt', ha rifiutato di revocarle l'immunità e ha proposto immunità più forti per i ministri.
- hash: 61ba45d3
  it: |
    Far girare la crescita su turismo, edilizia e capitali immobiliari esteri in un paese che si svuota: 12.4 milioni di visitatori stranieri nel 2025, FDI per EUR 1.64bn (il 37% nel settore immobiliare), progetti di prestigio con gli UAE (Durres) e la famiglia Kushner (Sazan e Zvernec), e accordi migratori (Italia, UK) che trasformano la pressione all'emigrazione in valuta diplomatica.
- hash: 39e1a892
  it: |
    Evitare che le controversie bilaterali con la Grecia (delimitazione marittima, il dossier Himara/Beleri, la proprietà delle minoranze, la greca 'law of war') si trasformino in un veto sul percorso verso l'EU: Rama parla di un nuovo partenariato strategico con Atene nel 2026 mentre Atene afferma che la delimitazione non è più una priorità.
- hash: 06739886
  it: |
    Diplomazia personale del leader da parte di Rama: membro fondatore del Board of Peace (il parlamento albanese ha votato con 110 voti su 140 il 22 gen 2026, senza quota di adesione), il primo vertice intergovernativo Italia-Albania a Roma (13 nov 2025) e l'articolo di opinione congiunto Rama-Vucic sulla FAZ che chiedeva l'accesso al mercato unico e a Schengen senza veto, senza commissario e senza eurodeputati (pubblicato intorno al 28 feb 2026) - richiesta che la Commissione e gli Stati membri hanno respinto.
- hash: 7eec75ee
  it: |
    Pieno allineamento sulla carta alla politica estera dell'EU: tutte le decisioni CFSP sulla Russia recepite nell'ordinamento (la decisione di governo 597/2025 elenca oltre 2,500 persone ed entità sanzionate); rottura delle relazioni con l'Iran (set 2022) dopo gli attacchi informatici. L'audit di BIRN di luglio 2026 non rileva quasi alcun caso di applicazione.
- hash: 21818afa
  it: |
    Difesa incentrata sulla NATO: base aerea tattica di Kucova (la NATO ha pagato circa EUR 50m), sostegno turco con droni ed equipaggiamenti annunciato da Erdogan a Tirana il 10 ott 2024, bilancio della difesa portato da meno del 2% (2025) al 2.6% del PIL, di cui 2.2% di difesa in senso stretto (impegno 2026), e la dichiarazione trilaterale con Croazia e Kosovo su addestramento, istruzione ed esercitazioni.
- hash: 2a008f31
  it: |
    Turismo e capitali immobiliari come strategia di Stato: un record di 12.4 milioni di visitatori (dall'Italia 1.2 milioni, dal UK circa 932,000), un progetto di porto turistico e portuale da EUR 2bn a Durres con Eagle Hills (Abu Dhabi), firmato a gen 2023 (allo Stato spetta il 33%), e il resort di Sazan/Zvernec legato a Kushner, che nel 2026 ha ricevuto un'approvazione preliminare. Gli accordi bilaterali sulla migrazione con l'Italia (2023) e il UK (2022) vengono scambiati con sostegno politico.
- hash: 4d55b1d3
  it: |
    Controllo statale dello spazio informativo per decreto: un divieto di TikTok dal 13 mar 2025 dopo l'uccisione di un adolescente, revocato a feb 2026 in pendenza di un ricorso giudiziario di giornalisti e di una NGO; i partiti di opposizione lo hanno definito motivato politicamente a poche settimane dalle elezioni del 2025, il che il governo ha negato. Un elenco di domini bloccati di 13,440 indirizzi comprende RT e Sputnik.
- hash: 88350ad8
  it: |
    La prova dello Stato di diritto e i punti di veto all'interno dell'EU: nove Stati membri hanno bloccato la trasmissione dell'Interim Benchmark Assessment Report per ragioni legate all'indipendenza della magistratura; la Commissione afferma che la corruzione resta diffusa e che la pressione sulla magistratura è 'a serious concern'; l'Albania è scesa di 11 posizioni, al 91° posto su 182 nel Corruption Perceptions Index, e solo tre capitoli sono chiusi provvisoriamente.
- hash: 80e2faa4
  it: |
    Un paese in contrazione e in invecchiamento: la popolazione è calata del 14.5% tra i censimenti del 2011 e del 2023 e di altre 28,500 persone nel 2025, fino a circa 2.33 milioni, quasi interamente per emigrazione netta; età mediana 42.5 anni. Le rimesse (circa EUR 1.1bn, il 4.2% del PIL) e il turismo coprono un disavanzo di beni di EUR 5.96bn. La disoccupazione scende in parte perché la forza lavoro se ne va.
- hash: 9890c197
  it: |
    Forze armate ridotte e un ombrello americano incerto: nel 2025 l'Albania era sotto l'obiettivo NATO del 2% (Rutte, 2026), nel 2024 la Serbia ha speso circa cinque volte più dell'Albania (SIPRI, come citato) e il vertice NATO del 2027 previsto in Albania è stato stralciato dalla bozza di dichiarazione di Ankara a fronte della riluttanza US.
- hash: e59ac99a
  it: |
    Un veto ad Atene: la Grecia può legare il percorso dell'Albania verso l'EU al caso Beleri, alla proprietà della minoranza a Himara e alla legge di guerra greca, ancora formalmente in vigore; Mitsotakis ha detto nel 2023 che il percorso dell'Albania verso l'EU 'passes through Greece' (come riportato). La delimitazione marittima è bloccata da quando la Corte costituzionale ha annullato l'accordo del 2009 e l'impegno del 2020 di ricorrere all'ICJ non è mai stato attuato.
- hash: a8756dcf
  it: |
    Un profilo commerciale concentrato: l'Italia assorbe circa il 42% delle esportazioni ed è il primo partner commerciale; la Cina ha fornito circa il 10% degli scambi nel periodo gen-lug 2025 e le sue importazioni sono cresciute del 21.8%; le esportazioni verso l'EU sono il 72.5%. Gli scambi US sono modesti: un dazio del 10% ha colpito le esportazioni verso gli US di circa il 30% ad aprile 2025. Le esportazioni sono calate del 6.1% nel 2025.
- hash: bb8292d0
  it: |
    Esposizione verso l'Iran attraverso l'MEK: Ashraf-3, vicino a Tirana, ospita circa 2,800-3,000 membri del gruppo di opposizione iraniano; gli attacchi informatici iraniani del 2022 hanno interrotto le relazioni e nel 2026 l'ambasciata US ha segnalato minacce legate all'Iran (1 apr), mentre i media iraniani hanno riferito di ipotesi di un attacco al campo avanzate dall'IRGC; Tirana ha definito l'avvertimento speculativo.
- hash: e0931d5f
  it: |
    La corsa verso Bruxelles passa per la procura con cui il governo è in conflitto. L'Albania ha bisogno dei risultati della SPAK per chiudere i capitoli, eppure Rama ha definito il caso Balluku una 'witch hunt', ha proposto immunità più forti e ha accusato dei giudici di legami con l'opposizione; nove Stati membri hanno quindi bloccato il rapporto di valutazione dei benchmark. Quanto più Tirana avanza sulla carta, tanto più il Consiglio ne legge il bilancio in materia di Stato di diritto.
- hash: 65d73ac9
  it: |
    Lo scudo del Kosovo affila la spada della Serbia. La firma della dichiarazione di difesa del 18 mar 2025 ha reso l'Albania co-garante del Kosovo, e Vucic ha risposto con l'accusa di 'arms race' e, ad aprile 2026, con un programma di riarmo diretto contro la 'Tirana-Zagreb-Pristina alliance'. Il ruolo di Rama come unico leader regionale con cui Vucic scrive un articolo di opinione congiunto (feb 2026) è indebolito dal patto che Belgrado definisce la propria 'greatest threat'; uno Stato di 2.3 milioni di abitanti entra in una corsa contro uno che spende cinque volte tanto.
- hash: 0c430879
  it: |
    Il canale con Trump rende in prestigio e costa in patria. Rama ha comprato l'accesso con il seggio nel Board of Peace e la concessione di Sazan/Zvernec alla famiglia Kushner, ma il resort ha prodotto le più grandi proteste del suo governo, un'indagine della SPAK, un monito dell'EU e una sospensione dei lavori di cui si ha notizia, mentre i segnali della stessa Washington (il vertice NATO del 2027 stralciato dalla bozza, dazi al 10%) mostrano scarso ritorno.
- hash: f9ae1cdd
  it: |
    Esportare persone fa alleati e indebolisce lo Stato. Il comunicato con il UK del 2022 ha ridotto di oltre il 90% gli arrivi di albanesi con piccole imbarcazioni e i centri italiani di Shengjin e Gjader hanno procurato il sostegno pubblico di Roma all'ingresso dell'Albania nell'EU (il ministro degli Esteri italiano, feb 2026: Albania e Montenegro prima di Ucraina e Moldova), ma l'Albania ora presta il proprio territorio a un dispositivo che i tribunali italiani, la CJEU e il Parlamento europeo hanno contestato, mentre la stessa emigrazione drena la forza lavoro da cui dipende il modello di crescita.
- hash: debd14e4
  it: |
    Il boom del turismo divora la costa che lo vende. Visitatori record e il 37% delle FDI nel settore immobiliare convivono con una popolazione in calo e con una concessione sulla zona umida protetta di Vjosa-Narta; la reazione (la 'Flamingo Revolution') ha trasformato un modello di crescita nella principale minaccia interna per il partito di governo, il cui consenso nei sondaggi è sceso di 6 punti dalle elezioni.
- hash: '26486235'
  it: |
    Il rifugio concesso all'MEK ha procurato il favore di Washington e la guerra cibernetica di Teheran. Ospitare il campo su richiesta americana ha collocato l'Albania nell'elenco dei bersagli dell'Iran (attacco del 2022, minacce del 2026), mentre l'allineamento pro-US che Rama approfondisce alza la posta per un paese privo di difesa aerea propria.
- hash: c87a697c
  it: |
    L'Albania conduce la strategia di un piccolo Stato che ha puntato tutto sull'essere il partner più utile e meglio allineato di chiunque conti, e su Edi Rama come l'uomo che rende personale quella scommessa. Ogni relazione della scheda ne discende: la NATO e il canale americano per la sicurezza, l'EU per il futuro, Italia e UK per la moneta della migrazione, il Golfo e i Kushner per i capitali, la Turchia per le armi e la religione, il Kosovo per la nazione. Lo schema di Luttwak è che ogni fonte di leva genera una contropressione che si scarica sullo stesso pilastro. Il percorso verso l'EU è veloce solo quanto lo consente lo Stato di diritto, che è il fronte su cui Rama combatte i propri procuratori; il patto sul Kosovo accresce la sicurezza dell'Albania e il riarmo della Serbia; il canale con Trump porta insieme il Board of Peace e le proteste di Sazan. Nel 2026 il fronte EU si muove (tre capitoli chiusi il 14 lug, con la Commissione che definisce Albania e Montenegro i candidati più vicini) mentre il fronte americano si raffredda (il vertice NATO del 2027 stralciato dalla bozza, dazi al 10%). Due segnali che non sono righe: gli stessi ministri albanesi hanno ridimensionato l'avvertimento dell'ambasciata US sull'Iran del 1 apr 2026, e fonti diplomatiche greche hanno preso pubblicamente le distanze, a nome di Atene, dall'affermazione di Rama a Delfi secondo cui sarebbe stato concordato un rinvio all'Aia. La prova è se il percorso verso l'EU sopravviva alla collisione tra la bozza di Rama sulle immunità e i benchmark, con la Grecia come possibile veto in fondo.
- hash: 9ac3ec51
  it: |
    Trasformare l'Accordo di associazione con l'EU in un'intesa sul mercato unico senza piena adesione. Il Consiglio ne ha autorizzato la firma il 16 luglio 2026, la firma è attesa a fine settembre 2026, il Parlamento europeo deve ancora dare il proprio consenso e il governo ha promesso un referendum su un testo su cui i sondaggi si dividono quasi a metà. L'EU è l'unica via di accesso al mercato oltre ai due vicini.
- hash: 5cc2fe92
  it: |
    Mantenere il coprincipato e i due vicini come cornice dello Stato. Il presidente francese e il vescovo di Urgell condividono la funzione di capo di Stato ai sensi della costituzione, e Francia e Spagna sono le sole vie terrestri di accesso e di uscita. Sicurezza, mobilità e visti sono gestiti con loro: la convenzione franco-ispano-andorrana del 2003 coordina le norme su visti e soggiorno, e a giugno 2026 l'Andorra ha firmato con la Catalogna un piano di lavoro 2026-2030 su orari aeroportuali e mobilità.
- hash: 6d8db885
  it: |
    Mantenere l'economia del turismo: shopping duty-free, imposte basse e stazioni turistiche invernali ed estive. I dati UNWTO collocano il turismo al 71.8 per cento del PIL, la quota più alta della sua classifica, il che rende il modello una dipendenza oltre che uno strumento. Le banche, terzo pilastro, sono ora sotto la pressione di EU e US e non possono essere l'unico motore di crescita.
- hash: 8d7c07e3
  it: |
    Unione doganale con l'EU dal 1° luglio 1991, che tratta i beni manifatturieri come interni all'unione, e l'euro come valuta in base a un accordo monetario firmato nel 2011 e in vigore dal 2012, con monete in euro andorrane emesse dal 2015. Entrambi sono gli strumenti che consentono a uno Stato privo di moneta e di dazi propri di commerciare e vendere.
- hash: 79c0960d
  it: |
    Presenza multilaterale ben superiore alle proprie dimensioni: membro a pieno titolo dell'UN dal 1993, con il Consiglio d'Europa e l'OSCE come fori europei. Acquista visibilità con piccoli contributi volontari, come EUR 10,000 al Piano d'azione del Consiglio d'Europa per l'Ucraina firmato a giugno 2025, e con sovvenzioni umanitarie veicolate attraverso agenzie internazionali.
- hash: ab65ee11
  it: |
    Nessuna forza armata, come registra il rapporto dell'Andorra stessa all'UN. La sicurezza è delegata di fatto ai due vicini che ne sono i coprincipi: Francia e Spagna sono i soli punti di ingresso terrestri, e l'Andorra non dispone di alcuna capacità militare propria per difendere i propri confini.
- hash: bfb856c6
  it: |
    Nessuna forza armata e nessun aeroporto per velivoli ad ala fissa sul territorio. L'accesso avviene per strada o in elicottero attraverso la Francia o la Spagna, e l'aeroporto commerciale più vicino è La Seu d'Urgell in Catalogna, di proprietà del governo catalano. Uno Stato che dipende dai vicini per l'accesso aereo e per la sicurezza ha poco margine di azione senza di loro.
- hash: cf1a1c5f
  it: |
    Nessuna via d'accesso all'EEA. L'adesione è aperta solo ai membri dell'EU e dell'EFTA, e il rapporto della Commissione del 2013 ha giudicato non praticabile, allo stato attuale, la partecipazione dei piccoli Stati. L'accesso al mercato unico di cui il Liechtenstein dispone tramite l'EEA deve quindi venire da un Accordo di associazione bilaterale, più lento e ancora non ratificato.
- hash: 9877a442
  it: |
    Il settore bancario dipende dall'accettazione US. Nel marzo 2015 FinCEN ha qualificato Banca Privada d'Andorra come motivo di preoccupazione per il riciclaggio di denaro, le autorità andorrane hanno assunto il controllo della banca e la sua controllata spagnola è fallita; S&P ha quindi declassato l'Andorra. L'Andorra non compare nella tabella degli accordi intergovernativi FATCA del Tesoro US nella pagina consultata, per cui la conformità agli standard US si gestisce banca per banca.
- hash: 97632eff
  it: |
    Imposte basse e vendite duty-free hanno costruito lo Stato, e l'accordo con l'EU e la pressione US gli chiedono di ridurre proprio quei vantaggi. Il caso BPA ha mostrato che la clientela da paradiso fiscale di una sola banca può costare all'intero settore finanziario l'accesso ai rapporti di banca corrispondente, ed è per questo che l'Accordo di associazione, pensato per assicurare l'accesso al mercato, costringe il settore ad aprire i propri libri contabili.
- hash: 90e2e39f
  it: |
    L'Andorra prende in prestito la propria sicurezza e la propria mobilità dai due vicini che ne sono anche i coprincipi, e vende turismo e shopping duty-free all'interno di un'unione doganale con l'EU. Il suo problema strutturale è che il lato bancario, che ha finanziato buona parte dello Stato, deve ora rispettare gli standard dell'EU e degli US per mantenere l'accesso al mercato, e l'Accordo di associazione è il prezzo di quell'accesso. Monaco si è bloccata nel 2023 mentre Andorra e San Marino sono andate avanti, perciò il percorso dei microstati non è un club chiuso; la firma del 2026 e il referendum che segue sono la prova.
- hash: 12a4c088
  it: |
    Sopravvivere alla guerra con l'Iran con lo Stato, l'hub e l'ombrello americano intatti: l'Iran ha lanciato circa 2,800 missili e droni contro gli UAE dal 28 feb 2026 (551 missili balistici, 2,265 droni e 29 missili da crociera al 10 maggio, 15 morti), e il primo obiettivo di Abu Dhabi è dissuadere da una ripetizione e conservare l'impegno di sicurezza di Washington (Rubio, 24 giu 2026) perseguendo in pubblico la de-escalation.
- hash: 3c894eb5
  it: |
    Diventare il nodo indispensabile del Golfo per l'economia dell'AI e dei capitali come scommessa post-petrolio: il quadro AI US-UAE di maggio 2025 (fino a 500,000 chip Nvidia l'anno, un campus AI UAE-US da 5 GW, Stargate UAE con una prima fase da 200 MW), accesso senza licenze per G42 e Core42 da metà 2026, un impegno di USD 1.4tn verso gli Stati Uniti in dieci anni.
- hash: 2625542e
  it: |
    Presidiare le rotte marittime e i porti alle spalle di Hormuz e del Mar Rosso - la rete 'little Sparta' di terminal DP World, basi e clienti locali da Berbera a Bosaso, Assab, Bengasi e Mukalla - affinché commercio ed energia raggiungano gli UAE chiunque controlli lo stretto.
- hash: a4d1bf65
  it: |
    Tenere fuori dal potere lungo quei corridoi gli attori islamisti e allineati all'Iran sostenendo uomini forti laici ed eserciti locali: le RSF in Sudan (cosa che Abu Dhabi nega), Haftar nella Libia orientale, il Southern Transitional Council nello Yemen fino a gennaio 2026 e, dal 2026, le autorità post-Assad a Damasco.
- hash: 950857ae
  it: |
    Essere il polo modernizzatore guida del Golfo senza una rottura aperta con Riad: uscire dall'OPEC e dall'OPEC+ (con effetto dal 1° maggio 2026) per monetizzare la capacità ampliata, mantenendo al tempo stesso funzionante il rapporto con l'Arabia Saudita (lo sceicco Mansour a Riad il 29 set 2026, Dh107bn di scambi non petroliferi nel primo semestre 2026).
- hash: cd4e24ea
  it: |
    Recuperare Abu Musa e le isole Tunb Maggiore e Minore, occupate dall'Iran il 30 nov 1971, per via negoziale o presso l'ICJ - mai con la forza; Gargash ha ribadito la rivendicazione il 4 ott 2026 e gli UAE l'hanno riaffermata all'Assemblea generale dell'UN a settembre.
- hash: c9737650
  it: |
    Convocatore e mediatore: 26 mediazioni di scambi di prigionieri russo-ucraini (7,997 prigionieri al 19 ago 2026), i colloqui trilaterali US-Russia-Ucraina ad Abu Dhabi (gennaio-febbraio 2026), l'incontro Pashinyan-Aliyev del 4 feb 2026 e uno Zayed Award per entrambi i leader.
