items:
- hash: 48e55e74
  it: |
    Gas e credito dall'Algeria: un deposito di USD 150m presso la banca centrale (febbraio 2020), un prestito di USD 300m (dicembre 2021) e un contratto gas con Sonatrach esteso al 2027.
- hash: 68cae635
  it: |
    Partenariato cinese: il partenariato strategico del maggio 2024, suggellato da sette memorandum (salute, energia pulita, acqua, agricoltura, media) e da un accordo che collega le due agenzie di stampa.
- hash: e9460ed2
  it: |
    Nessun programma IMF: l'intesa provvisoria del 2022 da USD 1.9bn è stata ritirata prima del voto del consiglio esecutivo dell'IMF di dicembre 2022, dopo che Saied ha rifiutato i tagli ai sussidi che definiva diktat stranieri; ora lo Stato vive di rinnovi e di fondi bilaterali.
- hash: bd9639b3
  it: |
    La migrazione è la sua unica leva e il suo costo: la stretta di Sfax del luglio 2023 e le espulsioni verso i confini libico e algerino hanno lasciato centinaia di persone bloccate, e gli operatori umanitari hanno contato almeno 27 morti entro l'inizio di agosto 2023.
- hash: 3f8ace76
  it: |
    Un unico vicino per gas e credito: l'Algeria è il suo principale sostenitore economico e detiene il contratto gas fino al 2027, quindi Tunisi non può rompere con Algeri sulla questione libica o sul dossier maghrebino senza un costo.
- hash: f823dbf4
  it: |
    L'Europa paga per la frontiera mentre il suo Parlamento e le NGO criticano il regime che finanzia: la risoluzione EP del 2024 chiedeva perché fossero stati pagati EUR 150m, e la lettera delle NGO del giugno 2026 chiedeva alla Commissione di riesaminare un approccio che ha reso possibile la repressione.
- hash: adf13bcc
  it: |
    Saied ha trasformato la presidenza tunisina in un regime che processa i propri oppositori, e paga la propria sopravvivenza con le due cose che i vicini e l'Europa sono disposti a comprare: il controllo dei flussi migratori e una linea di gas e credito dall'Algeria. Rifiutare l'IMF conserva i sussidi ma lascia lo Stato con fondi bilaterali, quindi Tunisi vende servizi anziché allineamento. I suoi legami con Libia, Italia e Cina ripetono lo stesso scambio: ogni acquirente ottiene un servizio e nessuno ottiene un posto nel nucleo.
- hash: 038e49b7
  it: |
    Mantenere al potere Erdoğan e il blocco AKP-MHP. Lo sfidante più forte, il sindaco di Istanbul Ekrem İmamoğlu, è stato arrestato nel marzo 2025 e rimosso dalla carica, il suo diploma universitario (requisito per la presidenza) è stato annullato, e dal 9 marzo 2026 è sotto processo insieme a 406 coimputati per aver guidato un'organizzazione criminale (407 imputati, 105 in custodia); il governo nega di pilotare i tribunali.
- hash: e996cfe9
  it: |
    Una 'Terror-Free Türkiye' e una frontiera senza terrorismo: porre fine all'insurrezione del PKK con un disarmo negoziato all'interno della Turchia (l'appello di Öcalan del febbraio 2025, la decisione di scioglimento del PKK del maggio 2025, una commissione parlamentare dall'agosto 2025, la Legge 7595 approvata 468-600 il 10 agosto 2026) e sciogliere le YPG/SDF come forza armata autonoma in Siria (accordo di integrazione Damasco-SDF del 30 gennaio 2026; Mazloum Abdi ha annunciato il completamento dell'integrazione il 25 agosto 2026). La legge prevede la sospensione condizionata delle pene e non incide sullo status di Öcalan né sui più ampi diritti curdi.
- hash: 5d1e486e
  it: |
    Restare ancorata alla NATO e al mercato occidentale degli armamenti, mantenendo il rapporto con la Russia: recuperare l'accesso agli F-35 e la revoca delle sanzioni CAATSA (Trump ha detto il 7 luglio 2026 ad Ankara 'we're going to be taking the sanctions off'; Erdoğan afferma di aver ricevuto 'a promise'), acquistare caccia ovunque siano in vendita (40 F-16 Block 70 approvati nel gennaio 2024, 20 Eurofighter Typhoon ordinati nell'ottobre 2025) e conservare gli S-400, il gas di Gazprom e la centrale di Akkuyu.
- hash: 3d9c2168
  it: |
    Primato regionale per presenza e rivendicazione: un governo amico a Damasco (un accordo di addestramento militare del 13 agosto 2025 con le autorità post-Assad), la dottrina marittima 'Blue Homeland' nell'Egeo e nel Mediterraneo orientale (decreti sui parchi marini del 15 agosto 2026 attorno a Lemno-Samotracia e Castellorizo, una legge Blue Homeland attesa in Parlamento nell'ottobre 2026), una presenza su entrambi i lati della frattura libica, truppe e una base di lancio spaziale in Somalia (mandato rinnovato fino al luglio 2028), e l'alleanza sancita da un trattato con l'Azerbaigian.
- hash: 3ca7039b
  it: |
    Essere il punto di passaggio indispensabile e l'intermediario: la Iraq Development Road e il meccanismo acqua-per-progetti con Baghdad, il Middle Corridor attraverso Azerbaigian e Georgia, Istanbul come sede dei colloqui Russia-Ucraina (2025; Ankara sperava nel settembre 2026 di riavviarli), un'offerta del luglio 2026 di aiutare a sminare lo Stretto di Hormuz, un seggio per Fidan nel comitato esecutivo per Gaza e il patto di difesa di Makkah con Arabia Saudita e Pakistan (7 agosto 2026).
- hash: 262c9818
  it: |
    Stabilizzare l'economia e costruire una base industriale che finanzi l'autonomia: disinflazione sotto il programma Şimşek (inflazione ufficiale al 31.51% nell'agosto 2026 contro un obiettivo di fine anno rivisto al 28.4%; tasso di riferimento confermato al 37% il 10 settembre 2026, quinta conferma consecutiva) e una linea di esportazioni della difesa e dell'aerospazio che ha superato USD 10bn nel 2025 (3.6% delle esportazioni totali) e USD 11bn su base mobile di 12 mesi nel 2026.
- hash: 7fce7359
  it: |
    Diplomazia da ospite e da ponte: il vertice NATO ad Ankara (7-8 luglio 2026, Ankara Declaration adottata da tutti i 32 alleati alla presenza di Trump), la mediazione telefonica tra Erdoğan e Trump sull'Iran (17 agosto 2026), i contatti con Washington, Teheran, Pakistan e Qatar nella guerra in Iran, e una serie a rotazione di 'high-level cooperation councils' (Macedonia del Nord, Montenegro) e di trilaterali (Georgia-Azerbaigian, Istanbul Declaration dell'8 giugno 2026).
- hash: 0eae2ac0
  it: |
    Costruire alleanze al di fuori dell'Occidente: il Makkah Joint Defense Agreement con Arabia Saudita e Pakistan (un attacco contro uno è un attacco contro tutti; firmato il 7 agosto 2026, Erdoğan vuole aggiungervi l'Egitto e altri), l'Organization of Turkic States (dodicesimo vertice a Gabala il 7 ottobre 2025; un vertice ordinario in Türkiye e uno informale in Kazakistan previsti per il 2026) e il trattato di Shusha con Baku.
- hash: be25fecd
  it: |
    La cornice 'Terror-Free Türkiye and Terror-Free Region' (Erdoğan a Malazgirt, 26 agosto 2026: la Turchia 'tied our horse's tail' e sta 'shaping history'), più il soft power religioso attraverso la Diyanet (la moschea di Namazgah a Tirana, circa EUR 30m) e la stampa statale (Anadolu, Daily Sabah, TRT).
- hash: '53075af9'
  it: |
    Un grande esercito NATO e un'industria della difesa guidata dai droni proiettata all'estero: le stime della NATO fissano la spesa per la difesa del 2026 a circa USD 48bn (ottava nell'Alleanza; il ministero delle Finanze stanzia il 2.33% del PIL); truppe e missioni di addestramento in Somalia (fino al luglio 2028), Siria (accordo di addestramento), Libia (Efes-2026, con oltre 500 soldati dell'Est e dell'Ovest addestrati), Kosovo (420 nella KFOR) e vendite di Bayraktar (Kosovo, Albania, Azerbaigian, Ucraina).
- hash: 35c1ab81
  it: |
    Il commercio come leva: l'unione doganale con l'EU (modernizzazione rilanciata nel febbraio e nel giugno 2026), il portafoglio gas di Gazprom e BOTAŞ (22 bcm di contratti russi prorogati di un anno; un contratto GNL ventennale con Mercuria per gas statunitense), appaltatori e investimenti nei Balcani, nel Caucaso e nel Golfo, e il meccanismo acqua-per-progetti iracheno finanziato dalle vendite di petrolio iracheno.
- hash: 5756ffde
  it: |
    Una posizione macroeconomica fragile: inflazione al 31.5% (agosto 2026) contro un obiettivo ufficiale di fine anno del 28.4%, un tasso di riferimento fermo al 37%, un disavanzo di parte corrente di USD 34.6bn nel primo semestre 2026 e una bolletta energetica aggravata dalla guerra in Iran. Ogni scontro che costa alla lira o alle riserve limita ciò che Ankara può permettersi.
- hash: 4ee50927
  it: |
    Legge statunitense, non solo umore americano: le sanzioni CAATSA contro l'agenzia per gli acquisti della difesa (SSB) risalgono al dicembre 2020 e il divieto sugli F-35 è stato codificato dal Congresso; gli S-400 sono ancora in mano turca, quindi la revoca delle sanzioni o il reinserimento della Turchia nel programma F-35 richiedono più di una dichiarazione presidenziale (il 2 ottobre 2026 Trump non ha fornito alcuna scadenza).
- hash: 0fc444da
  it: |
    Unanimità EU con Atene e Nicosia al tavolo: la modernizzazione dell'unione doganale e qualsiasi accesso turco allo strumento per la difesa SAFE da EUR 150bn richiedono l'unanimità, e Grecia e Cipro sono descritte come oppositori radicati; la liberalizzazione dei visti non si è mossa, l'adesione è congelata da anni.
- hash: 4f4b4ac5
  it: |
    Il veto e la portata di Israele: Israele ha spinto Washington a escludere la Turchia dagli assetti per Gaza ('no Turkish or Qatari soldiers in the Gaza Strip', Netanyahu) e ha colpito la base aerea di Abu al-Duhur a Idlib il 18 agosto 2026 per fermare una posizione turca in Siria.
- hash: 4a748a2d
  it: |
    Dipendenza energetica dalle potenze che essa bilancia: contratti russi di gas per 22 bcm l'anno (sotto il 40% del mix gas, in calo da oltre il 50% nel 2018), la Russia resta il primo fornitore di petrolio (47.5% delle importazioni nel dicembre 2025) e la centrale di Akkuyu costruita da Rosatom, la cui prima unità è prevista entro la fine del 2026.
- hash: b8785e83
  it: |
    La soluzione incompiuta della questione curda: la Legge 7595 concede un alleggerimento condizionato solo dopo un disarmo verificato e la conferma del National Security Council, e lascia aperti Öcalan, la legislazione antiterrorismo e i diritti politici e culturali curdi; resta fuori dal controllo turco la questione dei curdi siriani e iraniani (PJAK), e la Turchia ospita quasi 4 milioni di rifugiati siriani.
- hash: 44cfb18e
  it: |
    Gli S-400 acquistati per l'autonomia hanno legato Ankara più strettamente a tutti quelli con cui voleva trattare. Gli sono costati l'esclusione dal programma F-35 (2019) e le sanzioni CAATSA (2020); la Turchia ha poi trascorso sette anni a mettere insieme un'aeronautica con tre fornitori (F-16 dagli Stati Uniti, Typhoon dalla Gran Bretagna, il KAAN nazionale), e nel 2026 il prezzo della riammissione è ancora rappresentato dagli S-400 che essa non intende cedere.
- hash: 4a039c70
  it: |
    Vincere in Siria crea lo scontro che essa temeva lì. Ankara ha ottenuto un governo amico a Damasco e l'integrazione delle SDF, ma la sua proiezione verso basi come Abu al-Duhur ha provocato otto attacchi aerei israeliani il 18 agosto 2026 e il 'we will not tolerate a Turkish military foothold moving south' di Netanyahu: più la Turchia consolida la Siria, più si avvicina a uno scontro con uno Stato dotato di armi nucleari e sostenuto dagli Stati Uniti, di cui la Turchia ha bisogno.
- hash: 67477e3b
  it: |
    Il boicottaggio di Israele che si guadagna il favore della piazza araba costa alla Turchia il seggio che desidera a Gaza. Ankara ha interrotto tutti gli scambi commerciali (maggio 2024, dichiarato completato il 29 agosto 2025) e ha chiuso porti e spazio aereo; ora Israele pone il veto ai soldati turchi nella forza di stabilizzazione e fa pressione contro la Turchia nel Board of Peace, sebbene Fidan sieda nel suo comitato esecutivo; Fidan stesso dice che il commercio riprenderà quando la guerra sarà finita.
- hash: '05079811'
  it: |
    I decreti sui parchi marini contro la porta dell'EU. La distensione greca (Mitsotakis ad Ankara l'11 febbraio 2026, colloqui sull'unione doganale rilanciati) è ciò che potrebbe sbloccare la modernizzazione e SAFE, che richiedono il consenso greco e cipriota; i decreti del 15 agosto 2026 attorno a Lemno-Samotracia e Castellorizo, e una legge Blue Homeland prevista per ottobre, forniscono ad Atene l'argomento per bloccarli.
- hash: b4fc88fa
  it: |
    Mediatrice ai margini di due guerre, che paga per entrambe. Ankara ha rifiutato di schierarsi in Ucraina e in Iran, ha tenuto chiusi gli stretti alle navi da guerra e ha mantenuto un canale con ogni capitale, eppure la guerra in Iran ha fatto salire i prezzi del petrolio, ha spinto le previsioni degli analisti sull'inflazione oltre il 30% e ha portato tre missili iraniani nel proprio spazio aereo; la neutralità che rende utile la Turchia la rende anche il vicino che paga la bolletta energetica e quella dei rifugiati.
- hash: 4b699497
  it: |
    Eliminare il rivale per assicurarsi il potere grava sull'economia su cui quel potere si regge. Il processo a İmamoğlu e al CHP tiene fuori dal campo il principale sfidante, ma coesiste con un'economia in cui la banca centrale non può tagliare i tassi (37% per cinque riunioni, previsione alzata al 28% a fine anno), i capitali esteri sono 'fragile' e le porte occidentali che Ankara vuole aprire (modernizzazione EU, SAFE) sono legate ai discorsi sullo stato di diritto.
- hash: d1d33ce0
  it: |
    La Turchia conduce la grand strategy di una potenza media che ha deciso di essere una cerniera anziché un membro di blocco: conserva il secondo esercito più numeroso della NATO e ospita il suo vertice 2026, acquista gas russo e un S-400, firma un patto di difesa reciproca con Riad e Islamabad, e si offre come sede e mediatore di cui ogni parte ha bisogno. La valuta è l'indispensabilità, e funziona perché nessuno può permettersi di spingere Ankara fuori. Il modello di Luttwak compare in ogni giuntura: l'S-400, che ha dimostrato l'autonomia, è costato l'F-35; la vittoria in Siria attira bombe israeliane sulla sua base aerea; i decreti 'Blue Homeland' mettono in pericolo l'unione doganale; il boicottaggio di Israele chiude il seggio su Gaza. Sotto c'è la sicurezza del regime. Le due cose di cui la leadership ha più bisogno nel 2026 - la fine della guerra con il PKK (Legge 7595, lo scioglimento delle SDF) e una via per conservare il potere (il processo a İmamoğlu) - sono questioni interne prima che esterne, e ne determinano il tono: una 'Terror-Free Türkiye' che giustifica la politica siriana e irachena, e una riconciliazione con l'Occidente (la promessa di Trump sulle sanzioni e sugli F-35) perseguita senza condizioni sullo stato di diritto. Segnali che non sono righe: Ankara non ha aderito alle sanzioni occidentali contro la Russia e ha tagliato il greggio russo solo dopo l'appello di Trump del settembre 2025; l'inviato di Washington in Siria è anche il suo ambasciatore ad Ankara, il che fa della Turchia il canale della politica statunitense a Damasco. Le questioni aperte per il prossimo trimestre sono se la promessa di Trump diventerà uno strumento giuridico, se la legge Blue Homeland sarà approvata in ottobre e se il meccanismo di deconfliction Israele-Turchia in Siria sarà costruito prima del prossimo attacco.
- hash: c6206c4c
  it: |
    Mantenere il riconoscimento di Taiwan e respingere l'attrazione di Pechino. Il governo di Teo, in carica dal febbraio 2024, ha mantenuto i legami con Taipei dopo le elezioni, ha escluso un passaggio alla PRC e ha respinto l'opzione 'two-China'; il legame con Taiwan è la linea che Pechino contesta.
- hash: ba3e660e
  it: |
    Mantenere in vigore le garanzie australiane di sicurezza e mobilità. La Falepili Union (in vigore dal 28 agosto 2024) obbliga l'Australia a rispondere quando Tuvalu chiede aiuto in caso di grave calamità, pandemia o aggressione militare, e apre un percorso per fino a 280 tuvaluani l'anno.
- hash: 93a3ff44
  it: |
    Preservare la statualità in perpetuo nonostante l'innalzamento del livello del mare, e portare il caso climatico all'UN. Le cronache pre-visita del novembre 2025 descrivono un quadro di trattati con Taiwan per assicurare il riconoscimento della statualità di Tuvalu mentre il mare sale; l'UN è la sua piattaforma dal protocollo di Copenaghen del 2009.
- hash: cfbc5684
  it: |
    Riconoscimento e trattato come le due leve esterne. Taiwan mantiene un'ambasciata residente e ha versato US$7.06 milioni nel bilancio nel 2019; la Falepili Union impone che ogni nuovo impegno di difesa o sicurezza con paesi terzi sia concordato con Canberra, la clausola che rende decisivo il parere australiano.
- hash: 73455e76
  it: |
    Rendite delle risorse come bilancio. L'accesso al tonno è la voce di entrata più importante: i proventi delle licenze hanno raggiunto US$43 milioni nel 2023 e circa tre quinti delle entrate pubbliche generate localmente provengono dalle licenze per il tonno. La concessione del dominio .tv è il secondo pilastro, con circa A$11 milioni nelle proiezioni di bilancio 2025-26 (una lettura secondaria, non ancora verificata sui documenti di bilancio).
- hash: cff71593
  it: |
    Entrate volatili. Le licenze per il tonno si riducono man mano che gli stock si spostano in acque internazionali: i proventi sono calati di circa il 40% in cinque anni, quindi la fonte di entrate più importante è anche la meno stabile.
- hash: be79b6de
  it: |
    Dipendenza dai donatori per il bilancio. Taiwan ha versato US$7.06 milioni nel bilancio nel 2019 (Reuters) e l'Australia è un donatore importante di aiuti e assistenza tecnica (DFAT, 2019); lo Stato non può sostituire da solo questi finanziatori.
- hash: 251bc1a7
  it: |
    La Falepili Union protegge lo Stato ma vincola le scelte che esso desidera di più. Tuvalu concorda con l'Australia ogni nuovo impegno di difesa o sicurezza con paesi terzi, quindi un trattato più solido con Taiwan, o qualsiasi passo di sicurezza al di fuori dell'orbita australiana, richiede l'assenso di Canberra.
- hash: 2dc2c1c3
  it: |
    La strategia di Tuvalu è la sopravvivenza attraverso il riconoscimento e il trattato, non la potenza: tiene Taipei contro l'attrazione di Pechino, si lega a Canberra attraverso la Falepili Union e trasforma il caso climatico in una rivendicazione della statualità in perpetuo. Il suo bilancio si regge sull'accesso al tonno, che si riduce man mano che il pesce si sposta, su una concessione del .tv e su donatori che non può sostituire, sicché la sua libertà d'azione è in gran parte presa in prestito. Il paradosso è che il trattato che garantisce la sicurezza dello Stato richiede anche l'assenso dell'Australia per ogni nuovo passo di sicurezza, quindi più si rafforzano i legami con Taiwan, più conta l'assenso di Canberra.
- hash: 623825aa
  it: |
    Restare una democrazia autogovernata e rendere un attacco o un blocco troppo costoso da tentare: mantenere lo status quo (Lai: la Repubblica di Cina e la Repubblica popolare cinese non sono subordinate l'una all'altra), offrire colloqui a Pechino solo su una base 'an equal and dignified', e costruire il deterrente - un bilancio della difesa pari al 3.32% del PIL nel 2026 e l'impegno al 5% entro il 2030.
- hash: 8ebe42e4
  it: |
    Tenere gli Stati Uniti impegnati e fare in modo che per Washington abbandonare quell'impegno costi più che mantenerlo: armamenti (un pacchetto record da USD 11.1bn notificato nel dicembre 2025, un ulteriore USD 14bn in attesa della firma di Trump), un impegno di investimento da USD 250bn più garanzie di credito per USD 250bn in cambio di un dazio del 15%, e il Taiwan Relations Act come soglia giuridica minima.
- hash: 44902f93
  it: |
    Restare indispensabile: mantenere sull'isola la punta avanzata dei semiconduttori e dei server per l'IA, esportandone abbastanza (il piano di TSMC da USD 165bn per l'Arizona) da acquistare buona volontà. Taipei definisce 'impossible' l'obiettivo di Lutnick di spostare negli Stati Uniti il 40% della catena di fornitura dei chip e insiste che la capacità interna continui a crescere.
- hash: db598625
  it: |
    Allargare la cerchia di Stati che trattano Taiwan come partner: mantenere i 12 alleati diplomatici, riconquistare l'Honduras (il governo Asfura sta riesaminando gli accordi con la Cina del 2023) e spingere per una 'meaningful participation' negli organismi internazionali attraverso le dichiarazioni europee, giapponesi, tedesche e australiane del 2026.
- hash: 79796c6b
  it: |
    Ridurre l'ostaggio economico rappresentato dalla Cina: gli Stati Uniti hanno superato la Cina e Hong Kong come primo mercato di esportazione nel 2025 (server per l'IA), si allargano i canali del New Southbound e dell'India, e si acquista GNL da Stati Uniti e Australia per diluire il peso del Qatar, mentre il boom delle esportazioni legate all'IA rende l'economia più stretta, non più ampia.
- hash: e303ebf3
  it: |
    Tenere unito il fronte interno: un governo diviso (una maggioranza KMT-TPP contro un presidente del DPP) va gestito abbastanza bene da finanziare la difesa, mantenere in funzione la rete elettrica e addestrare la popolazione civile; le votazioni di revoca del 2025, lo scontro sul bilancio del 2026 e il tentativo di messa in stato d'accusa del maggio 2026 ne sono la prova.
- hash: 6806ddf4
  it: |
    Diplomazia di riconoscimento e di partenariato in piccolo: visite di Stato (il presidente Peña a Taipei, 7-10 maggio 2026), una dichiarazione congiunta con Palau, Isole Marshall e Tuvalu (2 settembre 2026), uffici non ufficiali nei Paesi baltici e nell'Europa centrale, e un raccolto di dichiarazioni di analogo tenore da Berlino, Canberra e Strasburgo. I viaggi all'estero sono il punto debole: il viaggio di Lai in Eswatini dell'aprile 2026 è stato annullato quando Seychelles, Madagascar e Mauritius hanno revocato il sorvolo.
- hash: 57777f05
  it: |
    Nominare la minaccia nella legge e nei discorsi: le 17 misure di Lai del 13 marzo 2025 hanno dichiarato la Cina una 'foreign hostile force' ai sensi dell'Anti-Infiltration Act e hanno ripristinato i tribunali militari per lo spionaggio; il discorso di Capodanno 2026 ha risposto alle esercitazioni di dicembre con un appello a colloqui su un piano di parità; il Mainland Affairs Council risponde a ogni elenco o regola di Pechino. L'obiettivo è tenere davanti al pubblico occidentale la storia democratica, non la rivendicazione di sovranità.
- hash: 0172994e
  it: |
    Un bilancio della difesa di NT$949.5bn nel 2026 (3.32% del PIL secondo il metodo in stile NATO), una proposta per il 2027 di NT$1.1225tn (3.01% sulla nuova base del PIL) e un bilancio speciale approvato l'8 maggio 2026 per NT$780bn anziché NT$1.25tn (esclusi T-Dome e droni). Gli armamenti sono americani (un record di USD 11.1bn notificato nel dicembre 2025). Han Kuang 2026 è iniziata il 5 agosto e si è svolta per dieci giorni, abbinata a esercitazioni civili di allarme aereo e di resilienza urbana.
- hash: 7a88f47a
  it: |
    I chip come valuta: le imprese taiwanesi si sono impegnate per almeno USD 250bn di investimenti diretti negli Stati Uniti più USD 250bn di garanzie di credito, in cambio di un taglio dei dazi USA dal 20% al 15% (gennaio 2026), e hanno aggiunto USD 20bn a settembre; il piano di TSMC per gli Stati Uniti vale USD 165bn.
- hash: ec5a78b2
  it: |
    Governo diviso. KMT e TPP controllano il parlamento (62 seggi su 113, con due indipendenti): hanno bloccato il bilancio speciale della difesa almeno otto volte dal 2 dicembre 2025, lo hanno tagliato da NT$1.25tn a NT$780bn l'8 maggio 2026 senza T-Dome e droni, hanno subordinato il resto alle lettere d'offerta statunitensi e hanno tentato la prima messa in stato d'accusa di un presidente nella storia di Taiwan (56-50 a favore, 76 necessari, 19 maggio 2026).
- hash: '41801444'
  it: |
    Un garante che tratta la garanzia come una pedina negoziale. Trump ha messo il pacchetto da USD 14bn 'in abeyance' dopo il vertice di Pechino (14-16 maggio 2026), lo ha definito 'a very good negotiating chip', ha dichiarato di 'not looking to have somebody go independent' e ha ospitato Xi a Washington il 23-25 settembre, dove Pechino ha affermato che Xi ha chiesto agli Stati Uniti di opporsi all'indipendenza e la scheda informativa della Casa Bianca non ha menzionato Taiwan.
- hash: 6cc5edb1
  it: |
    L'energia che un blocco taglierebbe per prima: circa il 97% dell'energia è importato, le scorte di gas coprono 10-11 giorni, il Qatar fornisce circa un terzo del GNL e l'ultimo reattore nucleare ha chiuso nel maggio 2025. Il referendum del 23 agosto 2025 per mantenere in funzione Maanshan ha raccolto il 74% delle schede ma non ha raggiunto la soglia del 25% degli aventi diritto (affluenza del 29.53%).
