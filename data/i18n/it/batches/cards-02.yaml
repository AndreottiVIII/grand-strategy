lang: it
items:
- hash: 9294a98c
  kind: cards
  en: 'Stay inside the Euro-Atlantic security perimeter (NATO since 1999, EU) with Russia as the named principal threat, but at a lower price: the Babiš cabinet keeps the F-35 contract and the NATO membership
    while cutting the defence budget to about 1.8% of GDP in 2026 (NATO method) and promising 2% only for 2027.'
  it: ''
- hash: 108acbc9
  kind: cards
  en: 'Energy security through nuclear power and the end of Russian fuel: two APR-1000 units at Dukovany from Korea''s KHNP (contract signed 4 Jun 2025, CZK 407bn, construction aimed at 2029), no Russian
    pipeline oil since April 2025 after the TAL upgrade, no Russian gas since 2023, coal exit by 2033 and a nuclear share of 68% by 2040.'
  it: ''
- hash: 40194fec
  kind: cards
  en: 'Protect the German-linked export and car industry from EU climate rules: the coalition programme calls the Green Deal unsustainable in its current form, rejects the 2035 combustion-engine ban and
    ETS2, and promises cheaper energy.'
  it: ''
- hash: d901ff90
  kind: cards
  en: 'Keep Czech taxpayers out of Ukraine''s bill without giving up the ammunition channel: Babiš kept the Czech-led initiative in January 2026 as ''coordinator'' with no state money, opted out of the
    EUR 90bn EU loan guarantees (19 Dec 2025) and wants NATO to carry more of it; the Czech arms industry (CSG) is the supplier either way.'
  it: ''
- hash: 26097a3f
  kind: cards
  en: 'Close the migration door: reject the EU pact''s relocation, apply ''zero tolerance'' on illegal migration, and tighten the temporary-protection rules for Ukrainian refugees (a bill in first reading
    in June 2026, most changes planned for 1 Jan 2027).'
  it: ''
- hash: bbd0eaa2
  kind: cards
  en: Rebuild regional weight with the 'three musketeers' (Slovakia, Poland) and a revived Visegrad Group after Orbán's fall in April 2026, plus the Slavkov format with Austria, while seeking 'pragmatic'
    business ties with Beijing and an openly pro-Israel line (embassy move to Jerusalem announced as expected in 2026).
  it: ''
- hash: '32771562'
  kind: cards
  en: 'Coordinator and broker rather than payer: Prague runs the shell-procurement channel for Ukraine (more than 4 million rounds since 2024, up to half of Ukraine''s large-calibre ammunition), while the
    cabinet wins domestic credit by opting out of EU guarantees (Article 20 TEU) alongside Slovakia and Hungary. The president runs a second, separate channel (NATO summit, the Dalai Lama meeting of July
    2025).'
  it: ''
- hash: ed98c88b
  kind: cards
  en: 'Public attribution of Russian operations, now weaker at the centre: Vrbětice (2021), the Prague bus-depot arson (2024), national sanctions on Medvedchuk and ''Voice of Europe'' (March 2024) and the
    annual BIS reports, which rate Russia the main threat and warn of ''one-time agents'' aimed at firms that make aid for Ukraine. Counter-pressure: Foreign Minister Macinka dissolved the ministry unit
    on sanctions and Russian influence.'
  it: ''
- hash: 7e729b84
  kind: cards
  en: 'Equipment and industry: 24 F-35A (CZK 150bn, deliveries 2031-2035) kept by Babiš in February 2026 because cancellation would cost about CZK 30bn; a defence budget of CZK 154.8bn in 2026 (about 1.8%
    of GDP by NATO''s method, 2.06% by the government''s); a plan for CZK 190bn in 2027. The arms industry (CSG) produced 2.7 million of the 3.7 million rounds delivered to Ukraine through the Czech channel.'
  it: ''
- hash: 5f6fc56b
  kind: cards
  en: 'State-led energy build and an export model tied to Germany: a state loan estimated at EUR 23-30bn plus a 40-year two-way contract for difference for Dukovany (notified 2 Oct 2025, under formal Commission
    review); Škoda and the supply chain behind Volkswagen; Germany takes about a third of exports. The TAL pipeline upgrade (EUR 61m, capacity 8 Mt a year) replaced Druzhba.'
  it: ''
- hash: 8130ab70
  kind: cards
  en: 'A divided executive: the cabinet (ANO, SPD, Motorists; 108 of 200 seats) and the president disagree on foreign policy. Pavel refused to appoint Motorists'' Filip Turek as minister, the government
    survived a no-confidence vote in February 2026 (84 votes for, 101 needed), and Pavel vetoed a budget-rules law; Macinka threatened to keep him from NATO summits.'
  it: ''
- hash: 4cc8162b
  kind: cards
  en: 'Industrial dependence on Germany and the car chain: Germany took EUR 77.8bn of Czech goods in 2023 (about a third of exports) and Škoda alone is close to a tenth of the economy; a slump in German
    demand or a US car tariff reaches Czech output directly.'
  it: ''
- hash: 024e6164
  kind: cards
  en: 'The ammunition channel lives on other people''s money: Prague needs about EUR 5bn in 2026 and had EUR 1.4bn by February; funders fell from 18 to about nine after Babiš''s return; Germany, Denmark
    and the Netherlands carry most of it (Germany added EUR 300m in June 2026).'
  it: ''
- hash: d260c1df
  kind: cards
  en: 'Brussels holds the nuclear financing: the Commission opened an in-depth State-aid investigation into the two-unit Dukovany package (loan EUR 23-30bn, 40-year CfD), says the support may be too generous
    and expects a decision by end-2026; the 2024 approval covered only one unit.'
  it: ''
- hash: 137dea18
  kind: cards
  en: 'Weak counter-Russia capacity and a hybrid threat that targets the Czech arms industry: BIS says sabotage risk centres on firms producing or delivering aid to Ukraine; Russia''s Defence Ministry and
    Medvedev named Czech companies as possible targets; the ministry''s sanctions unit was closed and tighter rules for Russian diplomats were delayed until Moscow tightened those on Czech staff in 2026.'
  it: ''
- hash: 6ba5282f
  kind: cards
  en: 'Isolation inside the EU if it follows Bratislava: Politico''s phrase for Czechia, Slovakia and Hungary after December 2025 was ''pariah status''; with Orbán beaten in the April 2026 election, Prague''s
    partners for a V4 revival are Tusk and Magyar, who are pro-EU and pro-Ukraine.'
  it: ''
- hash: 1a4470d0
  kind: cards
  en: Coordinating the ammunition channel without paying for it hollows out the channel. The 'no Czech crown' line won votes, yet the number of funders fell from 18 to about nine, only EUR 1.4bn of the
    EUR 5bn needed for 2026 had been raised by February; the thing that gave Prague leverage with Berlin and Washington (more than 4 million rounds, half of Ukraine's supply) is the thing the cabinet is
    letting wither.
  it: ''
- hash: f38a200b
  kind: cards
  en: Saving on defence while locking in the most expensive weapon in the country's history. Babiš cut the 2026 defence budget below the NATO line (about 1.8%, against 2.35% planned by Fiala) and 'certainly'
    rejects the 3.5% path, but the F-35 prepayments are not refundable, so the money that is spent goes to an American system whose first delivery is 2031 - paying the price of credibility without getting
    the credibility.
  it: ''
- hash: 81a4021a
  kind: cards
  en: Energy independence needs the Brussels the cabinet attacks. Prague escaped Russian oil and gas and chose Korea over France and the US for Dukovany, but the loan of EUR 23-30bn and the 40-year price
    guarantee need Commission approval; a government that calls the Green Deal 'unsustainable', rejects ETS2 and takes opt-outs is asking the same Commission for a state loan of up to EUR 30bn.
  it: ''
- hash: d9a6c573
  kind: cards
  en: The Ukraine opt-out buys a domestic win and loses the room. Standing with Fico and Orbán on the EUR 90bn loan made Czechia, in Politico's phrase, nearly a pariah just as Orbán fell in April 2026;
    the V4 revival Babiš wants now depends on Tusk and Magyar, whose terms are the opposite of the opt-out.
  it: ''
- hash: 19b439c3
  kind: cards
  en: A 'pragmatic' China line that costs Taiwan ties and buys little. The cabinet refused a government aircraft for Senate President Vystrčil's Taiwan trip (April 2026) and Okamura went to China (July
    2026), yet Beijing had already cut contact with Pavel, the 2023 security strategy still treats China as a security problem, BIS reports more Chinese intelligence activity, and the visible gains are
    tourists, flights and a visa-free regime.
  it: ''
- hash: bd8b5d43
  kind: cards
  en: Cutting the anti-Russia apparatus while Russia targets the companies that make Czech weapons. The ministry unit on sanctions and Russian influence was dissolved, rules on Russian diplomats were stalled,
    and the same cabinet coordinates a programme that BIS names as the main sabotage target; the reciprocal measures announced on 3 Sep 2026 came only after Moscow tightened life for Czech diplomats.
  it: ''
- hash: 84dd0100
  kind: cards
  en: 'Czechia in 2026 runs two foreign policies out of one state. The government

    of Andrej Babiš (ANO with the SPD and the Motorists, in office since December

    2025) wants a cheaper, more domestic and more bilateral Czech Republic: no

    Czech money for Ukraine, no migration pact relocation, no Green Deal, a

    cautious opening to Beijing and a warm one to Jerusalem. The president, Petr

    Pavel, the intelligence services and most of the arms industry keep the older

    line: Russia as the threat, NATO and Berlin as the frame, Ukraine''s war as

    Czechia''s own. Luttwak''s pattern is the squeeze between them: each saving

    made for the voter (the ammunition channel left unfunded, defence at 1.8%,

    the opt-out from the EU loan) erodes a lever that Prague needs elsewhere -

    leverage in Berlin and Washington, credibility in NATO, goodwill in Brussels

    that the Dukovany loan will need before the end of 2026. What has not

    changed is the structure: Russian oil and gas are out, the Korean nuclear

    build is under way, Germany still takes a third of exports, and every

    hostile act from Moscow (the BIS warnings, the September 2026 reciprocal

    measures) pushes the cabinet back toward the line it ran against. Two signals

    that are not rows: Babiš said in March 2026 that he was not planning a White

    House visit and that the EU is ''always the most important''; and Pavel''s

    own suggestion in June 2026 that Czechia should drop the koruna for the

    euro if it holds the country back, which the cabinet (which dropped the

    annual euro-readiness report) will not follow.'
  it: ''
- hash: 7b5b1418
  kind: cards
  en: 'Rebuild a Bundeswehr able to deter Russia and defend NATO''s eastern flank: the March 2025 constitutional amendment lifted defence above 1% of GDP out of the debt brake, the 2027 draft budget lifts
    the regular defence budget to EUR 109.7bn (plus EUR 30bn from the special fund), and Berlin plans to reach NATO''s 3.5% core target in 2029, six years early. The 45th Panzer Brigade is the flagship
    (about 4,800 soldiers in Lithuania by end-2027).'
  it: ''
- hash: 0c0062b5
  kind: cards
  en: 'Keep the United States committed to Europe while making NATO ''more European'', the chancellor''s formula at the Ankara summit (7-8 Jul 2026): nuclear sharing via the F-35, a request for Typhon/Tomahawk
    long-range fires, and a Franco-German nuclear steering group meant to complement, not replace, NATO deterrence.'
  it: ''
- hash: 0706779d
  kind: cards
  en: 'Make sure Ukraine does not lose and Russia does not win, without becoming a belligerent: largest European military donor in the Kiel tracker, EUR 11.6bn for Ukraine in the 2027 draft budget, a ceasefire-first
    line on guarantees, German troops only in a neighbouring NATO state after a ceasefire, no Taurus.'
  it: ''
- hash: 19d844e8
  kind: cards
  en: 'Restore the economic base: industrial recession, expensive energy, a EUR 500bn infrastructure fund over twelve years, a subsidised industrial power price (up to EUR 3.8bn to 2028), the exit from
    Russian gas and de-risking from China without losing the Chinese market.'
  it: ''
- hash: be07a001
  kind: cards
  en: 'Keep the EU engine running and the enlargement door open: the Franco-German tandem (FCAS, nuclear cooperation), the EUR 90bn Ukraine loan, support for Montenegro''s accession by 2028 and for the
    Berlin Process, a reset with a post-Orban Hungary.'
  it: ''
- hash: cd90702f
  kind: cards
  en: 'Hold the political centre against the AfD while governing with a thin majority: border controls and the asylum fall (113,236 first applications in 2025 against 229,751 in 2024), a pension and welfare
    reform the SPD wants softened, and an AfD that won Saxony-Anhalt with 43.8% on 6 Sep 2026.'
  it: ''
- hash: b14e5653
  kind: cards
  en: 'Berlin as the hinge of Europe''s ad hoc formats: the coalition of the willing for Ukraine''s guarantees (Paris, Jan 2026), the E5, the Franco-German Council of Ministers, the Berlin Process (Montenegro
    chairs in 2026), bilateral defence texts with Poland (17 Jun 2026) and Lithuania, and quick repair of ties with Budapest (Magyar in Berlin, Jun 2026).'
  it: ''
- hash: a8f54407
  kind: cards
  en: 'Staatsraeson as an instrument and a constraint: unconditional rhetoric on Israel, then a partial arms pause (Aug-Nov 2025), criticism of West Bank annexation steps (Feb 2026) and an open door for
    Netanyahu despite the ICC warrant.'
  it: ''
- hash: 17844dcf
  kind: cards
  en: 'Procurement and forward presence: 35 F-35A on order (the Luftwaffe wants 15 more) for the nuclear-sharing role, 44 Leopard 2A8 for Croatia, the Eurofighter export approval for Turkey, Bundeswehr
    engineers on Poland''s East Shield from 22 Jun 2026, up to 50 soldiers in EUFOR Althea and a large KFOR contingent, and a Typhon/Tomahawk purchase request (about EUR 3.4bn estimate).'
  it: ''
- hash: 55ead3f2
  kind: cards
  en: 'Manpower law: the Military Service Modernisation Act (voluntary first; a questionnaire for every 18-year-old from 2026, mandatory medical screening for men born 2008 or later from 1 Jul 2027, a needs-based
    conscription trigger the Bundestag could pull) and, since September 2026, compulsory postings to the Lithuania brigade.'
  it: ''
- hash: 4bc1651f
  kind: cards
  en: 'The balance sheet as a weapon: debt-brake carve-out, EUR 500bn infrastructure fund, the largest share of the EU''s Ukraine funding, EUR 1.2bn+ for the Czech ammunition initiative, EUR 660m+ of cooperation
    with Kosovo since 1999, and the Russian-gas phase-out agreed in Brussels (LNG ban from end-2026, pipeline gas from autumn 2027).'
  it: ''
- hash: 784fedee
  kind: cards
  en: 'Threat framing to carry public opinion: Pistorius''s 2029 (possibly earlier) window for a Russian attack on NATO, the ''greatest effort we have ever made'' line on defence, and a hybrid-threat response
    to sabotage (165+ suspected incidents in 2026 on a BKA count reported by SZ).'
  it: ''
- hash: 474c0e8c
  kind: cards
  en: 'Politics: a coalition with a majority of about twelve seats, an SPD that wants the pension and welfare package softened after the AfD''s win, a Chancellor with weak ratings, and an AfD that is ahead
    of the CDU in polls and took 43.8% in Saxony-Anhalt.'
  it: ''
- hash: 9fec1132
  kind: cards
  en: 'People, not money: the Bundeswehr cannot fill its posts. About 2,000 of the 4,800 posts in the Lithuania brigade had no confirmed personnel in 2026, volunteers covered only part of the need and Pistorius
    approved compulsory postings in September 2026; conscription stays a trigger, not a decision.'
  it: ''
- hash: 0d44c2b6
  kind: cards
  en: 'Dependence on Washington for what Europe cannot yet replace: the nuclear umbrella and B61 sharing, F-35, Patriot, long-range fires. The US announced on 1 May 2026 a withdrawal of about 5,000 of its
    36,436 troops in Germany over six to twelve months, and Trump said the cut would go ''a lot further''.'
  it: ''
- hash: 443b4818
  kind: cards
  en: 'An export model squeezed from both sides: exports to the US fell about 9.3% in 2025 under the 15% EU-US tariff deal, China is back as the largest trading partner with a deficit of roughly EUR 90bn,
    and Chinese rare-earth controls exposed the supply chain.'
  it: ''
- hash: 1c032c61
  kind: cards
  en: 'Energy: Russian gas is gone, the nuclear exit is ''irreversible'' in Merz''s words (January 2026: ''a strategic mistake''), industry pays far more for power than US rivals, and the 2026 Hormuz crisis
    pushed LNG prices up and left storage at 42.9% in early July; Germany gets most of its LNG from the USA.'
  it: ''
- hash: 2ba0178d
  kind: cards
  en: 'History and law: Poland''s reparations claim (Berlin: closed), a Nord Stream trial of a Ukrainian suspect in Hamburg from October 2026 while Poland refused extradition of a second suspect, a large
    public majority that wants tighter arms-export control toward Israel, and courts that have begun striking down border controls.'
  it: ''
- hash: '66400070'
  kind: cards
  en: 'Dominica is a small state whose foreign policy is a set of separate deals rather than an alignment: Beijing bought recognition in 2004 with aid, Washington and London hold the older ties through
    assistance channels and treaties, and the Caribbean bodies (CARICOM and the OECS) are where it speaks as one of many. Its strategic weight is low, so its moves are chosen for what they bring in, and
    the card can say little about the economy (citizenship by investment, the geothermal project) or the hurricane constraint until those are sourced. The gaps are the point of this first pass: the 2025
    US posture and the China debt are not yet read in a source that could support them.'
  it: ''
- hash: 9e8b0085
  kind: cards
  en: 'The green export model is slipping: the 2024 offshore-wind tender (at least 6 GW) drew no bids, the government cancelled the remaining rounds in early 2025 and cut the 2030 offshore goal from 9 GW
    to 2-3 GW, and the Bornholm energy island is delayed; the Fehmarn Belt link to Germany now opens no earlier than 2031.'
  it: ''
- hash: 7540de78
  kind: cards
  en: The concessions that end the crisis are the ones that feed it. Every proof of loyalty (the 2023 basing agreement, the F-35s, two more US Defence Areas at Narsarsuaq and Mestersvig in the 2026 deal)
    widens the American footprint that Trump then describes as 'permanent control'; Denmark trades military access for sovereignty on paper and may end with sovereignty that is a title without the keys.
  it: ''
- hash: fed9407c
  kind: cards
  en: Hedging against America is what Washington reads as disloyalty. Buying SAMP/T instead of Patriot and pooling nuclear deterrence with France make Denmark less dependent on the US, but they come while
    Denmark still buys 16 more American F-35s and needs the US for the Arctic; Danish media argued the Patriot decision was about price and delivery time, Politico framed it as a reply to Greenland.
  it: ''
- hash: 229c56e1
  kind: cards
  en: Greenland's voice, which Denmark insists on, is also Greenland's exit. Copenhagen's strongest card against Washington is that 'only Greenlanders and Danes decide'; but the more it puts Nuuk at the
    negotiating table (the working group of January 2026, a Greenlander-led Arctic Council chairship for the Kingdom, Nielsen calling the 2026 deal a 'win-win-win'), the more Greenland acts as a state,
    and Naleraq already asks for a dialogue with Washington without Denmark.
  it: ''
- hash: 0b7c933c
  kind: cards
  en: Denmark invokes international law against Trump while pressing to loosen it at home. The government programme promises to 'firmly uphold' sovereignty, territorial integrity and international conventions,
    yet Frederiksen co-led the May 2025 letter asking the Council of Europe to revisit how the European Convention on Human Rights is read on expulsions; the rules-based order is the shield on Greenland
    and the obstacle on migration.
  it: ''
- hash: '45477374'
  kind: cards
  en: Giving everything to Ukraine thins the Arctic and the Baltic. Denmark donated its whole F-16 fleet and its artillery and funds Ukrainian factories, just as its own intelligence says Russia may test
    NATO's neighbours and Greenland needs ships, radars and aircraft; the Danish model is the answer (the money buys output in Ukraine, not Danish stocks), but the budget is one budget.
  it: ''
- hash: f7e7b26c
  kind: cards
  en: 'Denmark is a small state whose grand strategy has been reduced, since January 2025, to one question: how to stay in the American security system while an American president claims part of its territory.
    The Danish answer has three layers. Keep the formal position unmovable (sovereignty over Greenland and the Faroes, self-determination for Greenlanders), pay the price in usable goods (bases, F-35s,
    an Arctic build-up of tens of billions of kroner), and move the quarrel into NATO and Europe, where Rutte and the European leaders can absorb it. The 22 September 2026 trilateral agreement shows the
    method working and its cost: the crisis is calmer, the Kingdom''s flag still flies, and both sides publish opposite readings of the same text. Behind the Greenland file stands the second pillar, which
    is Russia: a country that sits on the Baltic''s only exit, takes the hybrid blows (drones over airports, flares at a helicopter, cables) and is both one of Ukraine''s leading European donors (the Kiel
    tracker names it, with the Netherlands, right behind Germany for May-June 2026) and a builder of a European floor under NATO. The weakness is domestic and structural: a minority coalition, a Greenland
    that is no longer a colony to be spoken for, and an export economy that lives on American and German markets. The grades on this card follow the structure: the United States is a reluctant ally (a treaty
    ally with an open grievance, not a rival), Russia a rival (not an adversary, because Denmark seeks Moscow''s restraint rather than its fall), China a reluctant partner.'
  it: ''
- hash: 8b60d342
  kind: cards
  en: 'Hold the Haitian border with walls, troops and tougher rules. In April 2025 Abinader announced fifteen measures: accelerating the border wall, 1,500 soldiers for border surveillance, and tougher
    penalties for people who help migrants enter or stay.'
  it: ''
- hash: e6f5e884
  kind: cards
  en: Keep Washington engaged on security, migration and trade. Abinader thanked the United States for help against drug smuggling, organised crime and irregular migration; the 6 February 2025 Rubio visit
    covered those, trade, and economic opportunities in rare earths and semiconductors.
  it: ''
- hash: 39fd2a04
  kind: cards
  en: Keep the multinational mission in Haiti running with others. The Dominican foreign minister said Chadian troops would gradually replace the Kenyan force through October; the Rubio talks put the mission's
    continuation on the agenda.
  it: ''
- hash: ea4c89e7
  kind: cards
  en: 'Border force and wall: a 1,500-soldier surveillance reinforcement and a wall under construction, announced in April 2025.'
  it: ''
- hash: '47788951'
  kind: cards
  en: 'Washington''s security channel: the February 2025 Rubio visit made drug, crime and migration cooperation the working agenda.'
  it: ''
- hash: 618c757b
  kind: cards
  en: The crisis next door sets the agenda. At the February 2025 meeting the foreign minister briefed Rubio on Haiti's crisis and its impact on the Dominican Republic before the presidential talks.
  it: ''
- hash: a44f3dc8
  kind: cards
  en: Foreign contingents carry the Haitian mission. Kenyan police are rotating out and Chadian troops are replacing them gradually, a rotation announced by the Dominican foreign minister.
  it: ''
- hash: 2c76972c
  kind: cards
  en: Walling Haiti off buys Santo Domingo a closer security tie to Washington, but the same agenda that brings it to Rubio also puts the Haitian mission, which it does not run, at the centre of the talks.
  it: ''
- hash: 12bb205b
  kind: cards
  en: 'Santo Domingo treats Haiti as a border to be fenced and policed rather than a neighbour to be governed, and it pays part of its security bill with Washington, which thanks it publicly and sets the
    agenda. The wall, the troops and the tougher penalties are the visible answer to the crisis next door, while the mission that might end that crisis runs on other countries'' contingents. Confidence
    C throughout: the sources read cover the 2025 measures, the February 2025 visit and the 2026 mission rotation, not yet the economy, Spain, the EU, China or the Caribbean bloc.'
  it: ''
- hash: 3e59fa91
  kind: cards
  en: 'Keep the regime whole: a civilian presidency with the army behind it. Tebboune was re-elected on 7 Sep 2024 with 84.3% on an official 46.1% turnout that all three campaigns, his own included, called
    irregular; the July 2026 parliament was elected on about 21% turnout after roughly a third of prospective candidates were barred. Legitimacy is thin, so the order rests on the security apparatus (defence
    takes 21% of public spending) and on hydrocarbon rents; a constitutional revision to lengthen the presidential term beyond 2029 was reported in preparation.'
  it: ''
- hash: 416d34c7
  kind: cards
  en: Defeat Morocco's claim to Western Sahara at the UN and keep the Sahrawi referendum alive. Algiers hosts the Polisario and argues that S/RES/2797 (31 Oct 2025) never endorsed implementing the autonomy
    plan and that MINURSO remains mandated to organise a referendum; it did not take part in the 11-0-3 vote.
  it: ''
- hash: 504d0648
  kind: cards
  en: 'Stay the Maghreb''s military pivot and keep the balance with Morocco: Africa''s largest military budget (USD 21.8bn in 2024, +12%, against Morocco''s USD 5.5bn; about USD 25bn budgeted for 2026),
    in a rivalry that SIPRI calls a major driver of both states'' arms imports.'
  it: ''
- hash: 3875b2f5
  kind: cards
  en: 'Use gas to buy European partners on Algeria''s terms: reward Italy (Transmed), keep Spain on Medgaz, and resist the EU''s legal pressure over the Association Agreement. Algeria is the EU''s third-largest
    natural gas supplier; the EU is 49.6% of Algeria''s trade, and 93.2% of what it imports from Algeria is mineral products (oil and gas).'
  it: ''
- hash: b10423d3
  kind: cards
  en: Extract recognition of colonial crimes from France without losing the migration, security and consular channels. A law of 24 Dec 2025 criminalises colonisation and demands apology and reparations;
    in 2026 ministers, an ambassador and judicial dialogue are being restored while the jailed French journalist Christophe Gleizes is still held.
  it: ''
- hash: c13b9918
  kind: cards
  en: 'Keep the Sahel and Libya from reaching Algerian soil without owning the juntas'' quarrels: the Malian drone shot down at Tin Zaouatine (31 Mar 2025), the Sahel alliance''s ambassadors withdrawn in
    April 2025, ties restored on 11 Jul 2026; Attaf reaffirmed Mali''s territorial integrity in April 2026 and officials cite border insecurity for the defence budget.'
  it: ''
- hash: 1047e74f
  kind: cards
  en: 'Rupture as signal: the ambassador recalled from Paris (30 Jul 2024) when Macron endorsed the autonomy plan, relations cut with Morocco (24 Aug 2021) and with the UAE (10 Sep 2026); abstention from
    the vote on S/RES/2797 rather than a vote it could not win; refusal of US mediation toward Rabat (''bilateral dialogue with Morocco is not on the agenda'', Attaf, Nov 2025) while reportedly asking for
    time; patronage of the Polisario and of Tunisia (USD 150m deposit 2020, USD 300m loan 2021).'
  it: ''
- hash: 2ae36b1f
  kind: cards
  en: 'Memory and sovereignty as public argument: the 24 Dec 2025 law criminalising French colonisation; the terrorist label on the Kabylie movement MAK and the public attribution of ''hostile acts'' to
    Morocco, Israel and the UAE; the prosecutions of Boualem Sansal (5 years, March 2025, pardoned 12 Nov 2025) and of Christophe Gleizes (7 years for ''glorifying terrorism'') treated as domestic law.'
  it: ''
- hash: f7c43097
  kind: cards
  en: The largest military budget in Africa, supplied by Russia (39% of 2021-25 imports), China (27%) and Germany (18%) with a secrecy SIPRI says may hide deals; a military cooperation memorandum with AFRICOM
    (22 Jan 2025); the 'Fakhr 2026' live-fire drill near the Moroccan border; the shoot-down of a Malian drone near Tin Zaouatine.
  it: ''
- hash: 419c90cd
  kind: cards
  en: 'Gas as reward and sanction: the Maghreb-Europe pipeline contract through Morocco left to lapse (31 Oct 2021); flows to Spain trimmed by about 25% in May 2022 but never stopped on Medgaz; Italy rewarded
    with the July 2025 summit; trade and air measures as penalties (end of free premises for the French embassy and of the 2013 diplomatic-passport visa waiver, Aug 2025; air-services deal with the UAE
    terminated, airspace closed to Emirati aircraft in Sep 2026).'
  it: ''
- hash: b11ecbf2
  kind: cards
  en: 'Diversified patrons and partners instead of a bloc: China (the 2014 comprehensive strategic partnership, a 6,000 km rail programme announced in Aug 2023, 27% of arms imports), Turkey (more than USD
    6bn of Turkish investment), Egypt (Sonatrach-EGPC crude and products memorandum, 5 May 2026), OPEC+ with Russia and the Gulf producers.'
  it: ''
- hash: 8a41af34
  kind: cards
  en: 'A one-product export economy sold to the very continent it sometimes tries to coerce: the EU takes 49.6% of Algeria''s trade and 93.2% of EU imports from Algeria are oil and gas. Every cut has been
    bounded by it: gas to Spain kept flowing through Medgaz during the 2022 freeze.'
  it: ''
- hash: 44af29fa
  kind: cards
  en: 'Hostile or unstable borders on every side: the Moroccan frontier has been closed since 1994, Mali was in rupture for fifteen months (April 2025 to July 2026) and Niger and Burkina Faso withdrew their
    ambassadors in solidarity, while Libya is split between rival governments.'
  it: ''
- hash: fb1ffb34
  kind: cards
  en: 'A shrinking arms pipeline: arms imports fell 78% between 2016-20 and 2021-25 and the first supplier, Russia, accounts for 39% (48% in the previous period) as Russian exports to Algeria fall sharply;
    Morocco''s imports, from the USA (60%) and Israel (24%), now exceed Algeria''s by SIPRI''s estimate, though Algiers is secretive about its deals.'
  it: ''
- hash: 00274a0e
  kind: cards
  en: 'Thin legitimacy at the ballot box: 46.1% disputed turnout in 2024 after the preliminary 94.7% was revised down, about 21% in July 2026; the Hirak of 2019 forced Bouteflika out within two months and
    was then stifled by Covid restrictions and a crackdown, which Amnesty says continues.'
  it: ''
- hash: 985f3070
  kind: cards
  en: 'Isolation on the Sahara file: S/RES/2797 passed 11-0-3 with Russia, China and Pakistan abstaining and no veto from Algeria''s two arms suppliers on the Council; the penholder, Washington, is also
    the mediator and presses Algiers to open its market to US firms.'
  it: ''
- hash: 0e9e032e
  kind: cards
  en: 'Legal and fiscal pressure from Brussels and Washington: the EU''s arbitration request over Algeria''s trade and investment restrictions (announced 16 Jul 2025), Algeria''s listing as a high-risk
    money-laundering jurisdiction (June 2025) and a 12.5% US tariff (24 Jul 2026).'
  it: ''
- hash: 1c87c70f
  kind: cards
  en: Cutting the pipeline to punish Morocco cut Algeria's own reach. Letting the Maghreb-Europe contract lapse (31 Oct 2021) moved Spain's gas onto Medgaz; when Madrid turned toward Rabat's autonomy plan
    in 2022, Algiers could only trim flows (about 25% in May 2022), freeze the 2002 treaty and watch the supply continue. It reactivated the treaty in March 2026 with Spain's Sahara position unchanged.
  it: ''
- hash: 2a5ce62c
  kind: cards
  en: The harder Algiers fights the Sahara file at the UN, the more it is left alone there. The text it refused to vote on passed 11-0-3 and names Algeria among the parties asked to negotiate, its two arms
    suppliers on the Council abstained instead of vetoing, and the penholder is now also the mediator asking Algiers for market access. Staying outside the vote kept the doctrine clean and gave up the room
    where the text was written.
  it: ''
- hash: 71841f65
  kind: cards
  en: The Morocco rivalry buys Algeria the weakest arms pipeline. SIPRI calls the tension a major driver of both states' imports, yet Algeria's fell 78% while Morocco's rose 12%, the biggest African budget
    buying less from a first supplier whose exports to Algeria collapsed, as Rabat adds US and Israeli kit; Algiers has tied Israel to its charges against Rabat since 2021, and Morocco's military links
    with Israel keep growing.
  it: ''
- hash: 030fa9c8
  kind: cards
  en: The rupture meant to win dignity from France has cost the channels that deliver it. Twelve-for-twelve expulsions (April 2025) and the colonisation law (December 2025) did not move Paris on the Sahara,
    Sansal was freed through Germany's president and not France, and in May 2026 Algiers welcomed back France's ambassador and a stream of French ministers while Paris's alignment with Resolution 2797 stood
    (as Moroccan sources report) and Gleizes remained in prison.
  it: ''
- hash: c439f55f
  kind: cards
  en: Defending its border sovereignty cost Algiers the role of Sahel mediator. Shooting down the Malian drone (31 Mar 2025) united Mali, Burkina Faso and Niger against it (ambassadors out on 6 Apr 2025;
    Mali's prime minister said Algiers 'sponsors international terrorism'), led Algiers to step back from the Tuareg mediation and left the north to Russian mercenaries Algiers itself criticises; the July
    2026 restoration was announced without stated conditions or any word on resuming mediation.
  it: ''
- hash: 7874413f
  kind: cards
  en: Breaking with the UAE to stop foreign meddling produced the second Arab rupture in five years, after Tebboune said in July 2026 that Algiers had put off a break for years to avoid deepening Arab divisions.
    Abu Dhabi threatens arbitration over its companies, hopes the break is temporary, and keeps the first Arab consulate opened in Western Sahara (2020) as a Moroccan asset.
  it: ''
- hash: 538c736a
  kind: cards
  en: 'Algeria runs the grand strategy of a rentier state whose army is the regime and whose two standing antagonists, Morocco and France, are the two neighbours it cannot choose: one across a border closed
    since 1994, the other across a sea that carries its gas, its diaspora and its memory. The 1962 identity of anti-colonial sovereignty, the Sahrawi referendum and the colonisation law substitute for the
    votes it does not get (46.1% disputed in 2024, about 21% in 2026), so every rupture is domestic currency as much as foreign policy. The paradoxical logic shows at each step: the tap that was meant to
    punish (the Maghreb pipeline, Spain in 2022) was also the only income, so it ran on; each door shut (Morocco, the UAE, France''s embassy premises, Mali''s airspace) removes a seat at the table where
    Washington, Paris and Rabat then decide without Algiers. Two signals that are not rows: Algiers did not vote on Resolution 2797 and has not answered the US push for talks with Rabat, and the chief of
    staff''s reported absence from the December 2025 council on a term-extending revision (Yabiladi, single source) is a possible seam inside the regime. The thaws of 2026 (Spain, Mali, France) are not
    reconciliation; they are the rentier state discovering that its leverage is bounded by its customers. Grading note: Morocco stays a rival, not an adversary, by the ontology''s own test: the aim Algiers
    declares is Sahrawi self-determination and security, not Moroccan defeat, and the Kabylie charge is the nearest it comes to an existential accusation.'
  it: ''
- hash: 2b2eff3e
  kind: cards
  en: 'Win the security fight with US help: lift the constitutional ban on foreign military bases (in force since the Correa era). Noboa, re-elected in the April 2025 run-off, put the question to voters
    on 16 November 2025; they rejected it by about 60%, and all four referendum questions failed.'
  it: ''
- hash: fd1b3f46
  kind: cards
  en: Break the gangs by force. On 9 January 2024, after an armed attack on a live TV station and the escape of Los Choneros leader Fito, Noboa declared an internal armed conflict against organised crime.
  it: ''
- hash: 21dbaaa1
  kind: cards
  en: 'The armed forces, deployed under the internal armed conflict declared in January 2024. The foreign-base referendum of November 2025 marks the limit: Quito wanted US bases for this fight and voters
    refused them.'
  it: ''
- hash: 5b2553d3
  kind: cards
  en: 'Trade and transit as leverage over Colombia: a 30% security tariff on Colombian imports (January 2026), raised to 100% from 1 May 2026 and repealed on 31 May 2026, and a higher transit fee on Colombian
    crude through the SOTE pipeline (reported as from USD 3 to USD 30 a barrel; one Spanish-language report, not yet corroboated against the SOTE tariff filing).'
  it: ''
- hash: a167710c
  kind: cards
  en: 'The electricity link to Colombia: Colombian power, about 8% of Ecuador''s demand, was suspended for six months after 22 January 2026 and resumed on 5 August 2026. Ecuador repealed its 100% tariffs
    on 31 May 2026, before the power came back; the sequence is reported, the causation is not proven.'
  it: ''
- hash: c4e10431
  kind: cards
  en: 'No foreign bases under the present constitution: the 16 November 2025 vote kept the ban, so the US basing route Noboa wanted is closed for now.'
  it: ''
- hash: 294e5dba
  kind: cards
  en: 'A security act cost a diplomatic channel: the entry into the Mexican embassy in Quito in April 2024 to arrest former vice-president Jorge Glas led Mexico to sever relations on 5 April 2024. A state
    fighting trafficking gave up an embassy channel for one arrest.'
  it: ''
- hash: 0013f4f9
  kind: cards
  en: 'Ecuador''s grand strategy is to hold the state together against gangs that now fight it as an armed conflict, and to find a stronger patron for that fight than its own police and army. The route
    it wanted, US bases, was refused by voters in November 2025, and the other tools it used, the raid on the Mexican embassy and the tariff war with Colombia, produced a rupture and then a truce. Not verified
    for this card: oil and bananas as the economy, the debt, the 2025-26 energy crisis, the Chinese FTA and loans, the EU, Peru, and the US tariff.'
  it: ''
- hash: 959d9699
  kind: cards
  en: 'Keep the state solvent and the regime in place: the IMF programme (USD 8bn, extended to 15 Dec 2026; the seventh review completed in July 2026 releasing about USD 1.77bn), Gulf money (the USD 35bn
    UAE Ras El Hekma deal of 2024, Qatar''s USD 29.7bn Alam El Roum), the EU''s EUR 7.4bn package, and a debt of USD 164.8bn (38.9% of GDP) against record reserves of USD 55bn.'
  it: ''
- hash: 758c9cb1
  kind: cards
  en: Stop the displacement of Palestinians into Sinai (the declared red line) and remain the indispensable broker of Gaza - reconstruction plan, Rafah crossing, police training, a seat for intelligence
    chief Hassan Rashad on the Gaza executive board - while keeping the 1979 treaty with Israel intact.
  it: ''
- hash: 39ca4658
  kind: cards
  en: 'Secure the Nile: force Ethiopia into a binding framework on the filling and operation of the Grand Ethiopian Renaissance Dam (inaugurated Sept 2025) and against the three further Blue Nile dams announced
    in March 2026, by diplomacy first and, failing that, by encircling Ethiopia with Eritrea, Somalia and Sudan.'
  it: ''
- hash: 931dd3b1
  kind: cards
  en: 'Keep the two long borders quiet: preserve a Sudan whose army stays in power and whole (against the RSF and its Emirati backers) and a Libya whose east, under Haftar, stays a buffer and is kept out
    of the RSF''s supply lines.'
  it: ''
- hash: 5a0fb666
  kind: cards
  en: 'Rebuild the Suez Canal and the gas-hub income: canal revenue recovered to USD 4.67bn in FY2025/26 (from USD 10.2bn in 2023) and is exposed again by the Houthi capture of the Yemeni Red Sea coast
    and the island of Mayyun (Sept 2026); gas is sought from Israel (the USD 35bn Leviathan contract), Cyprus (Aphrodite, Cronos) and Eni (Zohr).'
  it: ''
- hash: d5f3a8f4
  kind: cards
  en: 'Stay the regional pivot without a patron: keep USD 1.3bn a year of US military financing while buying from France, Germany, Russia, China and Turkey, mediate (Gaza, US-Iran) and host the Arab League,
    so that no capital can afford to lose Cairo.'
  it: ''
- hash: c548c011
  kind: cards
  en: 'Convening power: the Cairo Arab summit of 4 Mar 2025 that adopted Egypt''s USD 53bn Gaza plan against Trump''s ''Riviera'', the Sharm el-Sheikh summit of 13 Oct 2025 co-chaired with Trump, a seat
    on the Board of Peace (accepted Jan 2026), a secondary mediation role in the US-Iran war, and the El Alamein quadrilateral of 4 Oct 2026 with Eritrea, Somalia and Sudan.'
  it: ''
- hash: cb11cf0a
  kind: cards
  en: 'Red-line signalling and framing through the presidency and the State Information Service: displacement into Sinai is ''the end of the Palestinian cause'', Sinai deployments are counter-terrorism
    within treaty limits, Ethiopian unrest is ''a domestic crisis'' with which Cairo has ''nothing to do''.'
  it: ''
- hash: ec0561f8
  kind: cards
  en: 'Forces placed as signals: the Sinai deployments (reported at up to 40,000 troops, contested), a contingent of Rafale F3R fighters stationed in the UAE against Iranian drones (announced 8 May 2026),
    a contribution of 1,091 troops allocated to AUSSOM in Somalia under the 2024 defence pact, the first Egypt-China air drill (April 2025) and the first Egypt-Turkey naval drill in 13 years (Sept 2025),
    and a Rafale fleet that Cairo reportedly wants to raise to 78.'
  it: ''
- hash: f57a538c
  kind: cards
  en: 'Selling the coast and the gas: land-for-cash deals with the UAE and Qatar, the Suez Canal Economic Zone for Chinese industry (about 200 companies, USD 4bn), the Zohr field and the Damietta liquefaction
    plant as a hub for Cypriot and Israeli gas, and the Suez Canal toll as the one revenue Egypt can raise when peace returns.'
  it: ''
- hash: 0955ea38
  kind: cards
  en: 'A war economy without a war: the Iran conflict of 2026 doubled the energy import bill (USD 1.2bn in January to USD 2.5bn in March), forced fuel price rises of 14-30% and evening shutdowns, while
    the external debt service of USD 28.3bn in nine months and a current-account deficit that widened keep Egypt dependent on the IMF programme that ends in December 2026.'
  it: ''
- hash: 1b50893e
  kind: cards
  en: 'Israel holds the gas tap and the border: Leviathan was shut in June 2025 and again from 2 March 2026 (production resumed 2 April) (supplies to Egypt were about 830 mmcf/d in January 2026), Netanyahu
    froze the USD 35bn contract in Sept 2025 over the Sinai buildup and later approved it, and Israel controls the Rafah crossing''s operation.'
  it: ''
- hash: 5437e5bc
  kind: cards
  en: 'The Red Sea is not Egypt''s to guard: the Houthis took the whole Yemeni Red Sea coast and Mayyun (Perim) in September 2026, about 20 km from the African shore, after two years in which canal revenue
    fell sharply (the IMF put the 2024 loss at about USD 6bn; Al Jazeera reports about USD 7bn, about 60%); Cairo can only ask Riyadh and Washington to act.'
  it: ''
- hash: 15089a2d
  kind: cards
  en: 'Patrons that pull in different directions: Riyadh (identical views on Yemen and Sudan, MBS in Cairo on 15 Sep 2026) and Abu Dhabi (Egypt''s largest foreign investor, the backer of the RSF Egypt fights
    in Sudan, which expects ''backup'' on Iran); Washington (USD 1.3bn aid, no treaty) watching Chinese jets; Gulf criticism of Cairo''s neutrality in the Iran war.'
  it: ''
- hash: 9384c744
  kind: cards
  en: 'A downstream state: GERD is built and full, further dams are planned, and Egypt''s lever is not water but the Horn - where Ethiopia now answers with accusations of Egyptian backing for the TPLF,
    the expulsion of an Egyptian diplomat (1 Oct 2026) and a war on its own northern front.'
  it: ''
- hash: afe7ef55
  kind: cards
  en: 'Refugees and borders it cannot close: UNHCR registers about 852,000 Sudanese in Egypt (30 Jun 2026) and the government counts 1.5 million arrivals since 2023, with UNHCR funded at 29% of its needs;
    Gaza''s border remains a displacement risk.'
  it: ''
- hash: e632c196
  kind: cards
  en: 'The Sinai buildup meant to deter a displacement of Palestinians gives Israel its argument against Egypt: Jerusalem calls it a breach of the Camp David annex, Netanyahu froze the USD 35bn gas contract
    in Sept 2025 and asked Washington to press Cairo to scale back. The shield raises the price of the one revenue (gas) that would pay for it.'
  it: ''
- hash: 1b6f424d
  kind: cards
  en: 'The gas hub depends on the neighbour it is cooling toward: Egypt wants to be the Eastern Mediterranean''s liquefaction centre, but its own supply rests on Israeli pipeline gas that Jerusalem shut
    twice in nine months for security reasons, which forced Cairo into rationing and spot LNG at the worst moment of the Iran war.'
  it: ''
- hash: 0c677ae0
  kind: cards
  en: 'Egypt''s creditor is its rival in Sudan: the UAE rescued the balance of payments with the Ras El Hekma deal (USD 35bn) and is Egypt''s largest foreign investor, yet Egypt backs the army that accuses
    Abu Dhabi of arming the RSF, and has pressed Haftar to cut Emirati ties. Winning in Sudan risks the Gulf money that keeps the regime solvent.'
  it: ''
- hash: 1253eb55
  kind: cards
  en: Containing Ethiopia hands Addis Ababa a case. The ring of Eritrea, Somalia and Sudan (the 2024 Somalia pact, AUSSOM troops, the 4 Oct 2026 Alamein quadrilateral) lets Ethiopia call Egypt a sponsor
    of the TPLF and an obstacle to its sea access; the escalation pushes Ethiopia to finish more dams, not fewer.
  it: ''
