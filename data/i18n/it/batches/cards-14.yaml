    2026 EU-Armenia summit, and the US Strategic Partnership Charter (14 Jan 2025, followed by the Rubio visit of 26 May 2026).'
  it: ''
- hash: 651e0841
  kind: cards
  en: 'Make geography an asset instead of a blockade: the ''Crossroads of Peace'' idea, the Trump Route (TRIPP, 43 km through Syunik, 74/26 US-Armenian joint venture under negotiation), the rail route to
    Turkey via Georgia (Akhalkalaki-Kars, open 24 May 2026), normalisation with Turkey and the North-South road and energy link with Iran.'
  it: ''
- hash: 5564cf3f
  kind: cards
  en: 'Keep the government and the state in one piece at home: win the 7 June 2026 election (Civil Contract 49.8%, 64 of 105 seats, short of the 70 for a constitutional majority), and neutralise the two
    networks that can mobilise against the peace line - the Armenian Apostolic Church and the Russian-Armenian tycoon Samvel Karapetyan (Strong Armenia, 23.3%).'
  it: ''
- hash: 74e32820
  kind: cards
  en: 'Rebuild an army that could not stop the 2023 loss and pay for it without wrecking the budget: defence spending rose from AMD 306bn (2021) to AMD 661bn (2025), 6.1% of GDP by SIPRI, then was cut about
    15% for 2026 as the peace track advanced; growth (7.1% in 2025, 5.3% forecast by the World Bank for 2026) is what funds it.'
  it: ''
- hash: 4d38212e
  kind: cards
  en: 'Treaty-first diplomacy with Baku under American sponsorship: the 8 Aug 2025 Washington summit (declaration plus initialled treaty, joint appeal to dissolve the OSCE Minsk Group, which the OSCE did
    on 1 Sep 2025), direct channels with Hikmet Hajiyev (Dilijan, 14 Jun 2026) and an informal Pashinyan-Aliyev meeting at the CIS summit (9 Oct 2026).'
  it: ''
- hash: 4c38c827
  kind: cards
  en: 'Multi-vector hedging by upgraded partnerships: a charter with the US (Jan 2025, May 2026), a strategic partnership with China (Tianjin, 31 Aug 2025, with Beijing backing an SCO bid), France and India
    as arms partners, a first EU-Armenia summit in Yerevan (5 May 2026) and the European Political Community summit in Yerevan in May 2026 with Zelensky present.'
  it: ''
- hash: '91878844'
  kind: cards
  en: 'Diversified procurement and a non-Russian partner for training: India (Pinaka rockets, ATAGS and MArG howitzers, Akash air defence, USD 600m paid by FY2024-25, USD 1-2bn estimated) and France (36
    Caesar howitzers contracted June 2024, Bastion vehicles, GM200 radars, Mistral missiles); EUR 30m of European Peace Facility deliveries; the EU civilian mission (EUMA) on the border to 19 Feb 2027,
    to be succeeded by an EU Partnership Mission.'
  it: ''
- hash: 35ea926b
  kind: cards
  en: Growth built on services, construction and re-exports (exports to Russia up from USD 840m in 2021 to almost USD 3bn in 2025), now redirected toward EU access (EUR 270m Resilience and Growth Plan 2024-27;
    Armenian-origin exports to the EU up almost 70% in 2026 per the economy minister) and toward new transit revenues (TRIPP, the Turkish rail link).
  it: ''
- hash: 97fe8693
  kind: cards
  en: Pashinyan frames the peace as a sovereignty project (Armenia 'will become increasingly sovereign', October 2026) against a 'three-headed war party' of Kocharyan, Karapetyan and the Church; the government
    pushes a draft constitution with the preamble change and a state commission on the Church crisis (National Assembly, October 2026).
  it: ''
- hash: 20e2b9db
  kind: cards
  en: 'Russian leverage that is still intact: Gazprom Armenia is a 100% Russian-owned monopoly selling about 2.3 bcm a year at USD 177.5 per 1,000 m3 (April 2026); Moscow notified on 27 May 2026 that it
    could denounce the intergovernmental gas agreement if Armenia joins the EU; Russia takes 35.5% of foreign trade, most remittances and, via Rosatom, the fuel cycle of Metsamor (30-40% of electricity);
    it banned Armenian flowers, fruit, vegetables, alcohol and dairy in spring 2026.'
  it: ''
- hash: d071d2dc
  kind: cards
  en: 'Geography: two of four borders are closed (Turkey since 1993; Azerbaijan, with transit reopened only for cargo since Oct 2025), so trade runs through Georgia and the single Iranian crossing; rail
    and road links are Soviet-era, and the South Caucasus Railway is under a Russian concession to 2038.'
  it: ''
- hash: b4045f5c
  kind: cards
  en: 'Domestic arithmetic for the constitution: Civil Contract has 64 of 105 seats, short of the 70 needed to start amendments, so the preamble change must go to a standalone referendum (at least 25% of
    registered voters in favour is the threshold cited), against a united opposition (Strong Armenia, Armenia Alliance) and diaspora groups campaigning no.'
  it: ''
- hash: '29991661'
  kind: cards
  en: 'A military gap against Azerbaijan and no security guarantor: Russian peacekeepers did not stop the September 2023 offensive, the CSTO did not act in 2021-23, Washington gave no defence commitment
    in the charter, and Armenia''s 6.1%-of-GDP defence burden ranks seventh in the world (SIPRI, 2025); Baku keeps 19 Armenians in prison (Vardanyan 20 years, Feb 2026) and its leverage over the treaty.'
  it: ''
- hash: 629c5b42
  kind: cards
  en: 'Refugee and social strain from 2023: more than 100,000 people (about 80% of the enclave''s Armenians) arrived from Nagorno-Karabakh in ten days in September 2023; the refugees, a polarised electorate
    and unresolved memory of the loss feed the ''betrayal'' narrative of the opposition and the Church.'
  it: ''
- hash: 3149d953
  kind: cards
  en: 'Dependence on American attention: TRIPP, the critical-minerals memorandum and the charter are all being run by a Trump administration that has shown it can switch priorities; the TRIPP framework
    was initialled, not signed, in May 2026 and no construction contract or groundbreaking was reported by June.'
  it: ''
- hash: 4915861b
  kind: cards
  en: The peace Armenia wants needs a constitution it cannot yet pass. Winning the June 2026 election with 49.8% gave Pashinyan a majority but not the two-thirds that would let parliament start the amendment,
    so the preamble can change only through a referendum that the opposition (Strong Armenia, 23.3%, and Kocharyan's bloc) and the diaspora have vowed to block; every month of delay lets Baku keep its precondition
    while the treaty stays unsigned.
  it: ''
- hash: ac0e9455
  kind: cards
  en: Armenia gets a corridor to escape the blockade by conceding the same thing it refused for decades. TRIPP crosses Syunik, links mainland Azerbaijan to Nakhchivan and Turkey, and is run by a 74/26 US-Armenian
    company; it ends Armenia's isolation and sidelines Russia, but it hands Azerbaijan the connectivity it wanted before the treaty is signed, and puts Iran - Armenia's only open, friendly border - on the
    other side of an American-managed route.
  it: ''
- hash: 0af39055
  kind: cards
  en: Leaving Russia politically while trading with it more than ever. Re-exports of Western goods took Armenian exports to Russia from USD 840m (2021) to almost USD 3bn (2025) and bilateral trade to a
    record USD 12bn in 2024; that wealth is what pays for the pivot, yet it makes Russia (35.5% of trade) the one actor whose import bans hurt, and invites Western secondary-sanctions pressure on the very
    trade.
  it: ''
- hash: 510c67b3
  kind: cards
  en: The EU law is a security risk before it is a path. The March 2025 law starting the accession process, and the EAEU states' call (May 2026) for a referendum on EU membership, hand Moscow the pretext
    to threaten the gas agreement; Armenia cannot be in the EAEU customs union and the EU at once, yet its own diplomats say the law is not an application, and 75% public support comes with a majority who
    do not want Brussels to cost them Russia.
  it: ''
- hash: 2e069f6f
  kind: cards
  en: Prosecuting rivals to protect the peace weakens the Western legitimacy the peace relies on. The 2025 arrests of archbishops and of Samvel Karapetyan, the nationalisation bill for Electric Networks
    and the 2026 indictment of the Catholicos remove Moscow-friendly and nationalist power centres, but they also feed the opposition's 'persecution' case, give Moscow (Kirill's delegation to Etchmiadzin,
    4 Sep 2026) a moral cause, and complicate Armenia's standing as the democratic partner Brussels and Washington are paying for.
  it: ''
- hash: 4481f118
  kind: cards
  en: 'Armenia is a state that lost its war in 2020, its enclave in 2023 and its

    patron''s guarantee in between, and is now trying to buy a settlement and a new

    set of protectors with the only coin it has left: the use of its territory. The

    strategy is unusually coherent for a small state - peace with Azerbaijan first,

    then a transport role (TRIPP, the Turkish rail link, Iran), then the EU and the US

    as insurance, with Russia kept in the tent by gas, the base and the EAEU until the

    other pieces hold. That is Luttwak''s logic of the weaker party, which survives by

    making itself useful to several stronger ones at once.


    The paradoxes all sit at the joints. The treaty needs a constitution the June 2026

    majority could not deliver; the corridor that ends the blockade is an American-run

    concession through its own south; the pivot from Russia is financed by trade with

    Russia; the EU law raises the cost of the gas that keeps the lights on. The

    domestic fight with the Church and Karapetyan is not a side show: it is the same

    contest, because the people who would vote ''no'' to the preamble are also the ones

    Moscow courts. Pashinyan''s election win shows the public chose the pivot over the

    nostalgia, but not with the margin the strategy needs, which is why the next real

    test is not Moscow or Baku but a referendum with no date.'
  it: ''
