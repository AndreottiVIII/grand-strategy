  it: ''
- hash: 4716c53c
  kind: cards
  en: 'Mediator and belligerent at once. Abu Dhabi hosts the Russia-Ukraine talks and the Armenia-Azerbaijan meetings as a neutral convener while the same state is accused of arming the RSF and Haftar;
    the credibility earned in one theatre is spent in the other (Burhan: the Quad is ''biased'' while the UAE is a member).'
  it: ''
- hash: ddbcddac
  kind: cards
  en: Sovereign AI on borrowed chips. The campus and G42 make the UAE an AI power only as long as Washington licenses the hardware, which turns autonomy into a deeper dependence and forces the hedge with
    China (Wang Yi, Khaled bin Mohamed in Beijing) to stay shallow.
  it: ''
- hash: 5373862a
  kind: cards
  en: 'Stability by authoritarian clients feeds the instability it fears. Support for militias and secessionists (Saudi critics: ''fragmenting'' the Arab world) is what turned the Saudi partner into a competitor,
    and what the Sudanese army cites to reject any Quad truce that includes Abu Dhabi.'
  it: ''
- hash: 24088f1a
  kind: cards
  en: 'The UAE under Mohamed bin Zayed runs the grand strategy of a small, rich state that has chosen to buy depth rather than inherit it: money turns into ports, ports into

    clients, clients into reach, and reach into a seat at every table. The ''little Sparta'' reading fits the 2015-2025 years, when Abu Dhabi built a ring of bases, terminals and proxies from

    Mukalla to Berbera to Benghazi and held down the Islamist wing of the Arab world. Luttwak''s reversal came in two beats. First, the December 2025 - January 2026 collapse of the Yemeni

    bridgehead under Saudi pressure and Somalia''s cancellation of every deal showed that a network of clients is strong against the weak and fragile against a neighbour that can fly its

    own aircraft. Second, the war that began on 28 February 2026 hit the other half of the model, the hub: the state that sold itself as the safest place in the Gulf took the largest share of Iranian fire,

    lost more than 90% of its Jebel Ali traffic and found that its only real shield was the United States, tied to it by a commitment and no treaty. The response is a double move - a harder

    line (secret strikes, Iron Dome from Israel, the OPEC exit, the Netanyahu visit of 27 September) and a wider hedge (China, India, France, a Syria in which Abu Dhabi now invests).

    The Saudi question is the pivot: the July-September 2026 thaw (the Mansour visit) looks like a truce in a rivalry that continues on the Horn, Sudan and Yemen, not a settlement; the Houthi

    attacks on Saudi airports in October 2026, which the UAE condemned in the strongest terms, give both a common enemy again. One signal that is not a row: the UAE did not sign the Arab-Islamic statement
    against Israel''s

    recognition of Somaliland (December 2025). The dataset still lists UAE membership of OPEC; it ended on 1 May 2026.'
  it: ''
- hash: bc677b80
  kind: cards
  en: 'Stabilise the peso and roll the debt over without default, with two large external lifelines: a USD 20bn IMF Extended Fund Facility approved in April 2025 (SDR 15.267bn) and a USD 20bn Treasury currency
    swap announced on 9 October 2025 and signed on 20 October 2025. The IMF second review of May 2026 reports about USD 15.8bn disbursed under the arrangement (USD 1bn at that review), although the end-December
    reserves target was missed. Milei said the swap could cover 2026 foreign-currency debt payments if markets did not refinance. Update of 2026-10-16: Treasury reported that Argentina drew USD 2.5bn of
    the swap in the fourth quarter of 2025 and had repaid it by 9 January 2026, so the swap is a backstop that was used once, not a standing loan.'
  it: ''
- hash: 9a0cbfcd
  kind: cards
  en: 'Open the economy to the outside and cut tariffs: the Agreement on Reciprocal Trade and Investment with the United States, signed in Washington on 5 February 2026, under which the US removes over
    1,600 reciprocal tariffs on Argentine goods and Argentina cuts duties on more than 200 items of US origin. Argentina''s Senate ratified the EU-Mercosur deal on 26 February 2026, which Milei called a
    starting point and used to ask Mercosur for more flexibility. Sharpened 2026-10-16: the interim trade part of the EU-Mercosur agreement has applied provisionally since 1 May 2026 with the members that
    ratified (Argentina and Uruguay), per the EU card''s source; the European Court of Justice referral is still open.'
  it: ''
- hash: 8bdc2591
  kind: cards
  en: 'Keep the Falklands/Malvinas claim alive as a constitutional matter while the relationship with London stays workable. Milei reaffirmed the claim in April 2026 and at the UN in September 2026, and
    said in December 2025 that arms-export talks had begun, which the Foreign Office denied; London says sovereignty is not up for negotiation. Sharpened 2026-10-16: the ''workable relationship'' half no
    longer holds. On 3 September 2026 Milei announced sanctions on the companies behind the Sea Lion oil project (Navitas, Rockhopper, Eco Atlantic), Argentina opened sanction proceedings against 60 people
    and companies by 8 September, and on 29 September Milei reportedly told the Foreign Ministry to start international arbitration against the UK.'
  it: ''
- hash: 1a10e95d
  kind: cards
  en: Turn energy and minerals into the export platform that pays the debt and buys political weight. Oil output hit a record 916,200 barrels a day in July 2026 (up 17.2% on July 2025, Vaca Muerta more
    than 70% of the total, under 84,000 b/d short of one million), and lithium carbonate output at the largest operation, Cauchari-Olaroz, was about 34,100 tonnes in 2025. The mining and energy investment
    regime (RIGI) is the instrument; India, France and the Andean neighbours are courted for it (critical-minerals agreement with India in July 2025, a four-country strategic-minerals declaration in Santiago
    on 28 August 2026).
  it: ''
- hash: 58ee48b3
  kind: cards
  en: 'Build a right-of-centre bloc in South America as a counterweight to Lula''s Brazil, and be seen to lead it. Milei backed Flavio Bolsonaro at a rally in Sao Paulo (July 2026), attended the inaugurations
    of Peru''s Keiko Fujimori (28 July 2026) and Colombia''s Abelardo De La Espriella (7 August 2026), hosted Chile''s Kast on his first trip abroad (6 April 2026) and wrote after the Colombian vote that
    ''freedom is advancing across Latin America''. Our reading (C): this is an influence goal, not a treaty system.'
  it: ''
- hash: b4108d2f
  kind: cards
  en: 'Join the rich-country clubs and hold a seat among Western trade blocs without Mercosur''s rules: Argentina formally requested accession to the CPTPP (announced by Foreign Minister Pablo Quirno around
    the Mercosur summit of 29-30 June 2026) and keeps asking Mercosur for the freedom to sign bilateral deals. Brazil answered with a Mercosur-Japan negotiation that trade specialists read as a way to blunt
    an individual Argentine or Uruguayan CPTPP entry.'
  it: ''
- hash: e57d75f4
  kind: cards
  en: 'Dollar and credit access as the currency of diplomacy: the US Treasury swap and the IMF programme are the two large lifelines, and the government offers policy in return (the 2025 trade deal, the
    IMF reform path). Trade is the second lever: soybeans, beef and wheat sold to China, which is a major buyer and a main source of imports, and the EU-Mercosur deal as an export route.'
  it: ''
- hash: cea51ce3
  kind: cards
  en: 'Alignment with the Trump administration and with Israel as the political currency: the Isaac Accords with Netanyahu (April 2026), three memoranda on military and scientific cooperation, and Milei''s
    public thanks to Bessent and Trump for the rescue. Diplomacy with the big blocs goes through the Mercosur summits, where Milei and Brazil contest the bloc''s direction.'
  it: ''
- hash: 0f2a9301
  kind: cards
  en: 'The United Nations as the stage of the Falklands case, used while the institution itself is attacked: in his third UN General Assembly speech (23 September 2026, 19 minutes) Milei called the Malvinas
    a ''national cause'', asked Britain to return to negotiations, faulted the UN for not enforcing its own resolutions against unilateral acts around the islands, and called the body ''useless''. Foreign
    Minister Quirno pressed the same case at the UN Decolonization Committee.'
  it: ''
- hash: 7eb03d22
  kind: cards
  en: 'Sanctions and market access as lawfare on the Falklands: Law 26,659 of 2011 bars, for 5 to 20 years, anyone taking part in unauthorised hydrocarbon activity on the claimed continental shelf and can
    reach shareholders, suppliers, financiers and advisers (Law 26,915 of 2013 adds directors). Rockhopper has been barred since 2013 and Navitas Petroleum LP since 2022; the 3 September 2026 decree names
    the Foreign Ministry as enforcer and requires compliance declarations from firms seeking incentives or permits, and Milei threatened to exclude oil companies from Vaca Muerta. Halliburton, SLB and Baker
    Hughes said they will not work on Sea Lion.'
  it: ''
- hash: fbd34b3e
  kind: cards
  en: 'Personal and ideological diplomacy by the president: rallies, social media and the circuit of the international right replace the foreign ministry''s usual channels (Atreju in Rome, the Madrid forums,
    Flavio Bolsonaro''s campaign launch, the Knesset speech of June 2025). The method wins friends (Kast, Fujimori, De La Espriella, Netanyahu) and costs relations with the left-governed neighbours: Brazil
    recalled its ambassador on 26 July 2026 and Mexico''s Sheinbaum answered on 27 July a claim that Mexico funded an ''anti-Argentina'' World Cup campaign. Our reading (C).'
  it: ''
- hash: c45d6922
  kind: cards
  en: 'Security alignment with Washington and Jerusalem against the Iranian network, rather than force: Argentina designated Hezbollah (18 July 2019) and the IRGC Quds Force (17 January 2026) as terrorist
    and expelled Iran''s chargé d''affaires in April 2026, the 1994 AMIA bombing (85 dead) being the standing grievance. Three memoranda on military and scientific cooperation were signed with Israel in
    April 2026. Argentina has not joined Western sanctions on Russia nor sent arms to Ukraine. The armed forces are no instrument against the Falklands: the lever is legal and commercial.'
  it: ''
- hash: 63b573b1
  kind: cards
  en: 'Debt and reserves: the IMF programme sets the conditions of the lifeline, and the China swap line, renewed in August 2026, had about USD 1bn drawn at end-2025. A default would cut the external lifelines
    the government now depends on. Sharpened 2026-10-16: the IMF second review (21 May 2026) says the end-December net-reserves accumulation target was missed, the programme remains ''subject to elevated
    risks'', and the primary surplus was 1.4% of GDP in 2025 against 1.8% in 2024.'
  it: ''
- hash: ffb9089e
  kind: cards
  en: 'The China trade and the American alliance pull in opposite directions: Beijing buys Argentine soybeans, beef and wheat and holds a swap line of more than USD 19bn, while the US rescue was announced
    with its own interest in the trade. The renewal of the China swap in August 2026 shows that the government needs both. Our reading (C), not a source''s word. Figures added 2026-10-16: in 2025 China
    took about 11% of Argentine exports (USD 9.8bn, up 61%) and supplied about 24% of imports (USD 18.0bn, up 54%), second only to Brazil on both sides.'
  it: ''
- hash: aeed66e0
  kind: cards
  en: 'The Mercosur bloc limits what Milei can do alone. Brazil''s Lula has clashed with Milei repeatedly and skipped the Asuncion ceremony for the EU deal; Brazil and Argentina contest the bloc''s direction
    at the June 2026 summit. Our reading: a bilateral US deal sits uneasily inside a bloc with a common external tariff (C). Sharpened 2026-10-16: Brazilian officials told Reuters in February 2026 that
    the US deal covers close to 200 items against the 150 national exceptions to the common external tariff Argentina says it uses, and Brazil raised the point formally at a March preparatory meeting. Brazil
    is also Argentina''s first export market (about 15% of exports) and first source of imports (about 24%), which is what a feud with Lula costs.'
  it: ''
- hash: ac01171b
  kind: cards
  en: 'Inflation and poverty are running against the promise of the stabilisation: monthly inflation was 1.9% in September 2026, the annual rate rose to 33.4% (31.5% at end-2025 per the IMF table) and 23.6%
    had accumulated in nine months against the IMF''s end-2026 projection of 25.0%; poverty rose to 32.3% in the first half of 2026 from 28.2% at end-2025 (indigence 7.5%); Al Jazeera puts Milei''s approval
    at 34% in September 2026. The government has little room to cut further or to tolerate a new run on the peso.'
  it: ''
- hash: '96544887'
  kind: cards
  en: 'The Falklands are British in fact and the lever against them is thin: the UK holds the islands, the fishing licences (ITQs issued in 2022 for 25 years from 2023, so to 2047) and the oil licences,
    and London says the activity is legitimate under the islands'' own law. A legal analysis reported by MercoPress argues that Argentina''s earlier sanctions target specific entities (Rockhopper plc, Navitas
    Petroleum LP), not corporate groups, so the subsidiary that operates Sea Lion is not automatically covered. The United States stays formally neutral on sovereignty; Trump has hinted at shifting that
    neutrality but has not done it.'
  it: ''
- hash: 8def7839
  kind: cards
  en: 'The Israeli partner is also the Falklands target: Navitas Petroleum, operator and 65% owner of Sea Lion, is an Israeli group, and the Jerusalem embassy move announced for 2026 was halted in January
    2026 over a Falklands drilling dispute involving an Israeli firm (per the Times of Israel). Washington''s neutrality, Jerusalem''s investor and London''s licences all sit on the same side of the case,
    so the claim costs Milei some of the goodwill he buys elsewhere.'
  it: ''
- hash: 8fd7d7ff
  kind: cards
  en: 'Argentina holds two large lifelines from two rival powers: the US swap of October 2025 and a China swap renewed to 2031 in August 2026. Our reading: the hedge that keeps the peso liquid is the one
    Washington would prefer to see closed, so the American rescue and the Chinese trade keep pulling against each other (C).'
  it: ''
- hash: 31fbeddf
  kind: cards
  en: Milei pushes Mercosur towards bilateral deals with the United States and others, which weakens the bloc that gives Argentina its weight in the EU negotiation. The EU-Mercosur deal was ratified because
    the bloc acted together; the flexibility he asks for is what would split it. Our reading (C).
  it: ''
- hash: 407738dd
  kind: cards
  en: 'The alignment with Washington was bought with a swap that Washington can call. The USD 20bn line was announced on 9 October 2025, seventeen days before the midterm vote, and the Treasury afterwards
    described the draw (USD 2.5bn) as repaid at a profit to the taxpayer; the trade deal followed in February 2026. The same lifeline that keeps the peso steady makes Buenos Aires answer to a counterparty
    whose political favour is the real collateral, and Argentina''s own critics read the profit as the central bank''s loss. Our reading (C): the closer the alignment, the more the lifeline can be used
    as leverage on the China swap, the Chinese space station and Argentine votes at the UN.'
  it: ''
- hash: 5a06e776
  kind: cards
  en: The Falklands claim is held while courting London's ally and the claim's own targets. Milei leans on Trump, whose government is formally neutral and whose country is the UK's closest ally, and bets
    that a leaked Pentagon email and Trump's hints will tilt Washington; but the Sea Lion project is run by an Israeli group (Navitas) that Milei names for sanctions while building the Isaac Accords with
    Israel, and London answers that his stance 'tells us more about domestic politics in Argentina' than about the islands. The harder he presses, the more he tests the two friendships he has paid for.
    Our reading (C).
  it: ''
- hash: 8973383c
  kind: cards
  en: The China swap is kept, and renewed, by the man who as a candidate asked 'would you trade with an assassin?'. China is now Argentina's second export market (USD 9.8bn in 2025, up 61.4% while sales
    to Brazil fell 6.3%) and nearly level with Brazil as a source of imports (USD 18.0bn against 18.4bn); the swap was renewed for five years on 5 August 2026 and Milei has said he would not touch it. The
    denunciation was the price of the American alignment, the swap and the grain are the price of the peso. Our reading (C).
  it: ''
- hash: 4381d926
  kind: cards
  en: 'Austerity and the midterms: the 26 October 2025 vote gave La Libertad Avanza about 41% and enough seats to block opposition bills and sustain vetoes, and the US rescue was timed ahead of it; since
    then the cost of the adjustment has returned (annual inflation 33.4% in September 2026, poverty 32.3% in the first half of the year, approval 34%). Having won a mandate for reform on the back of foreign
    money, Milei now reaches for the one cause that unites Argentines, the Malvinas, to rebuild support, which spends the goodwill of the very lenders and allies the mandate rested on. Our reading (C),
    shared by Al Jazeera''s correspondent on the timing.'
  it: ''
- hash: aa1fc89f
  kind: cards
  en: 'Milei''s Argentina trades strategic alignment for money: the USD 20bn US Treasury swap and the USD 20bn IMF programme keep the peso and the debt afloat, and the price is a trade deal with Washington,
    the Isaac Accords with Israel and loud alignment with Trump. The hedge is the China swap, renewed to 2031, and the grain trade Beijing buys, and the paradox is that the American rescue and the Chinese
    trade pull against each other. Within South America the Mercosur bloc and the friction with Lula limit how far Milei can go, while the Falklands claim stays alive in rhetoric without stopping the London
    relationship.


    Update of 2026-10-16. Two things changed the picture. First, the swap was used and repaid (USD 2.5bn, January 2026), so the American lifeline is now more a political tie than a debt, while the IMF programme
    missed its reserves target and inflation is back above 33% a year; the money that bought the alignment is not yet buying stability at home. Second, the Falklands stopped being rhetoric: the September
    2026 sanctions on Sea Lion, the 60 proceedings and the arbitration threat turn the claim into a live quarrel with London, with the Israeli investor and with the oil majors'' compliance departments,
    at the moment Milei''s approval fell to 34%. The neighbourhood has split: a right-of-centre arc (Chile, Peru, Colombia, Paraguay, Bolivia) is warm, Brazil and Mexico are not, and the Mercosur summit
    showed that Argentina wants a bloc it can leave in all but name. Where the card had Argentina as a client who pays in alignment, it is now a client who is spending the alignment on a cause of its own.'
  it: ''
- hash: 3e898df0
  kind: cards
  en: 'Turn the Azerbaijan war into a peace Armenia can survive: the 17-article treaty (text agreed 13 Mar 2025, initialled at the White House on 8 Aug 2025) fixes mutual recognition of borders and no territorial
    claims, but Baku will not sign until Armenia drops the preamble''s reference to the 1990 Declaration of Independence, which means a new constitution by referendum. Pashinyan says ''peace is established''
    and keeps the referendum for after the June 2026 election; no date is set.'
  it: ''
- hash: 77ead375
  kind: cards
  en: 'Escape single-patron dependence on Russia without a rupture: freeze the CSTO (not unfreezing; ''I would be very pleased if the organisation expelled Armenia''), remove Russian border guards from
    Zvartnots (31 Jul 2024), cut Russia''s share of arms procurement from over 96% to about 10%, and build the EU and US as alternative anchors, while staying in the EAEU, taking Russian gas and keeping
