# Translate every `en` into it. Write the translations to the file cards-14.out.yaml next to this one,
# as `items:` of `- hash: <same hash>` / `it: <translation>`, appending one item at a time (valid YAML at
# every step), never editing this file. Keep names, dates, numbers and quotes; register of a foreign-office
# brief: dry, precise, no flourish.
lang: it
items:
- hash: e22c4e36
  kind: cards
  en: 'Regime survival and the monopoly of power of the Emir''s circle in Kandahar: no inclusive government, no concession on the social order (women, education, courts), and the defeat of armed rivals
    (the Islamic State in Khorasan, the National Resistance Front, the Afghanistan Freedom Front).'
  it: ''
- hash: 02644be7
  kind: cards
  en: 'Recognition and the UN seat without paying for them: normal relations with as many capitals as possible (Russia has recognised; China, Gulf, Central Asia and now India and the EU deal with it) while
    refusing the benchmarks the West attaches, above all on women. The pattern Zelin names is ''recognition without concessions''.'
  it: ''
- hash: 5cbab95c
  kind: cards
  en: 'Make Pakistan stop coercing Kabul and stop being the only door: end the air and drone strikes (Kabul and Kandahar included), reopen the border and transit trade, while keeping the line that the Pakistani
    Taliban (TTP) are Pakistan''s internal problem and not Afghanistan''s to disarm.'
  it: ''
- hash: 811c43cf
  kind: cards
  en: 'Turn geography into income: be the transit and resource state everyone needs (Trans-Afghan railway, TAPI gas, Central Asian rail, Mes Aynak copper, Saudi-contracted gas exploration) and move trade
    away from Pakistan toward Iran, Central Asia, Turkey and India.'
  it: ''
- hash: 1341b2e4
  kind: cards
  en: 'Keep and sell the one service the Taliban offer against worse enemies: suppression of the Islamic State in Khorasan (and, for Beijing and Moscow, a promise that Afghan soil will not be used against
    neighbours), traded for money, recognition and arms maintenance.'
  it: ''
- hash: 91a5bb51
  kind: cards
  en: 'Reach a deal with Washington: reopen the US embassy, unfreeze the central-bank reserves, win investment from American companies, while refusing to return Bagram or the rest of Washington''s conditions.'
  it: ''
- hash: 9261c471
  kind: cards
  en: 'Multi-vector bilateralism run by Foreign Minister Muttaqi: every capital that will talk gets a visit or a diplomat (Moscow Format in October 2025 and again on 5 Oct 2026, New Delhi in October 2025,
    Brussels technical talks in June 2026), a chargé in New Delhi (January 2026), and acceptance of mediators in the Pakistan quarrel (Qatar, Turkey, Saudi Arabia, China). Consular access for deportation
    flights is itself a bargaining chip (Germany accepted more Taliban diplomats in June 2026).'
  it: ''
- hash: b6eacea0
  kind: cards
  en: 'A disciplined spokesman line (Mujahid, Fitrat, Balkhi): deny that any foreign militant group operates from Afghan soil (''Pakistan''s domestic problem''), cite the 2020 Doha Agreement against Washington,
    rename battles on its own terms (''Radd al-Zulm''), reject the ICC outright, and market the security and anti-drug record to Moscow and Beijing. The UN Monitoring Team has called the denial ''not credible''.'
  it: ''
- hash: 9cf5577e
  kind: cards
  en: A light, ideologically cohesive force with captured weapons and Soviet-era kit, now being sustained by Russia (military-technical agreement of 27 May 2026, mainly repair of Soviet and Russian equipment),
    drones and border artillery used against Pakistani posts, and a claim of missiles that could reach Pakistani cities. Crisis Group judges it badly outgunned by Pakistan.
  it: ''
- hash: c332c90f
  kind: cards
  en: 'Transit and resource concessions as foreign policy: the Delta International gas exploration contract (25 years, USD 200m first phase, Kushk-Tirpul blocks), Chinese copper at Mes Aynak, UAE airport
    management, the Trans-Afghan railway, Kazakh and Uzbek rail, the TAPI leg in Herat; plus a poppy ban (poppy area 10,200 ha in 2025 against 232,000 ha in 2022) that earns goodwill and costs rural income.'
  it: ''
- hash: 737c253a
  kind: cards
  en: 'The social order is the price of the exclusion: the girls'' and women''s bans earned arrest warrants for the Emir and the chief justice from the ICC (8 Jul 2025), block the UN seat and US engagement,
    and give every Western partner a reason to keep contact ''technical''. Kandahar will not trade them, so legitimacy stays capped.'
  it: ''
- hash: 05ff984d
  kind: cards
  en: 'A shrinking economy per head: real GDP up an estimated 4.8% in 2025 but per-capita output down 5.6% as about 3.7 million Afghans returned (from Iran and Pakistan); current account deficit 36.1% of
    GDP; inflation 7.6% by March 2026; the 2026 humanitarian appeal of USD 1.71bn only about a quarter funded; 21.9 million people in need. The United States ended its aid in 2025.'
  it: ''
- hash: 56dac75c
  kind: cards
  en: 'Pakistan has the stronger army, the air force and the keys to the sea: land crossings have been mostly shut since the October 2025 fighting, Pakistan struck Kabul and for the first time Kandahar
    in February 2026, and its position is that borders reopen only on ''decisive and verifiable action'' against the TTP.'
  it: ''
- hash: 75c0191e
  kind: cards
  en: 'Landlocked and import-dependent: every route (Pakistan, Iran, Central Asia) belongs to someone with leverage. Iran is now the largest trading partner on Taliban figures (USD 3.6bn a year) and expels
    hundreds of thousands a year while holding back Helmand water.'
  it: ''
- hash: b38f8f24
  kind: cards
  en: 'A growing armed opposition in the north-east: three anti-Taliban fronts (NRF, AFF, Sepahiyan-e Mihan) claimed at least 50 attacks in a month, a district centre (Yaftali Sufla) fell briefly in July
    2026, and some leadership sits across the Tajik border. The EUAA still finds that no group holds territory.'
  it: ''
- hash: 8069c229
  kind: cards
  en: 'Terrorist-group baggage: UN monitors report that al-Qaida keeps a sustained presence, that the Taliban continue to support the TTP, and that ETIM fighters (Beijing''s worry) are in the north; the
    harbouring is what every neighbour, patron and mediator asks Kabul to end.'
  it: ''
- hash: cd837da7
  kind: cards
  en: 'Shelter for the TTP is the cost of ideological loyalty and the source of the threat. Keeping the Pakistani Taliban as brothers-in-arms avoids a split among Taliban commanders, but it turned Pakistan
    from patron into the Emirate''s main military enemy: strikes on Kabul (Oct 2025), ''open war'' (26-27 Feb 2026, Kandahar hit for the first time), a month of fighting, then renewed strikes in September
    2026.'
  it: ''
- hash: bf2ee314
  kind: cards
  en: Winning the Islamist order wins no recognition. The ban on girls' secondary schooling and women's work holds the movement together around Kandahar, yet it is the single condition blocking the UN seat,
    American money and the full normalisation that India, China and the Gulf could otherwise give.
  it: ''
- hash: 28b592c1
  kind: cards
  en: Escaping Pakistan makes Kabul dependent on Iran and India, and India is the card that makes Pakistan hit harder. Iran is now the largest trade partner (USD 3.6bn) yet deported about 2 million Afghans
    in a year and withholds Helmand water; the embassy upgrade in Delhi and Pakistan's minister's line that Afghanistan is 'a colony of India' feed the Pakistani case for force.
  it: ''
- hash: 00e6a2a9
  kind: cards
  en: The Qosh Tepa canal feeds Afghan farms with the water of the Amu Darya and sours the one northern neighbour that offers rail, power and trade. Kabul's water minister says no agreement binds its withdrawals;
    Uzbekistan signed a river-management framework with Balkh in May 2025 and now presses for urgent negotiations because the river's flow is falling.
  it: ''
- hash: e1ac5752
  kind: cards
  en: Everyone is offered the one thing the others forbid. Russia gets 'no NATO infrastructure' and a military-technical agreement; Washington asks for Bagram and offers nothing; Riyadh signs gas while
    Saudi Arabia is bound to Pakistan by a defence pact; Beijing wants ETIM suppressed while Dushanbe alleges attacks from Afghan soil. Playing all sides keeps the Emirate alive but leaves it with no guarantor
    when Pakistan strikes.
  it: ''
- hash: 26b0cfb4
  kind: cards
  en: 'The exodus is both burden and bargaining chip. Iran, Pakistan and Germany push people back (about 3.7 million returns, per-capita GDP down 5.6%), yet the same deportation flights make Europe pay
    with consular legitimacy: Germany accepted more Taliban diplomats and the EU met a Taliban delegation in Brussels. The more the Emirate is hurt by returns, the more it can sell cooperation on them.'
  it: ''
- hash: 8c6bbcdf
  kind: cards
  en: 'Afghanistan under the Taliban is the pariah that outlasts its isolators.

    The Emirate has no allies, no UN seat and a ruling circle indicted by the

    ICC, and yet by October 2026 it is courted by Moscow (recognition, a

    military-technical agreement), Beijing, Delhi, Riyadh, Doha and even

    Brussels and Berlin. Luttwak''s lamp shows why: it is useful against worse

    enemies (the Islamic State in Khorasan) and it holds what everybody needs

    (transit, water, minerals, a land bridge between Central and South Asia),

    so each power that would isolate it has a competing reason to deal with it.

    The strategy is to sell access without surrendering the social order,

    which is why Zelin calls it recognition without concessions.

    The weakness is the relation that used to protect it. The Pakistani

    patron became the main military enemy over the TTP, and the paradox is

    Luttwakian in the pure sense: loyalty to the movement''s sister

    organisation costs the Emirate its border, its main port route and, in

    February 2026, air raids on Kandahar itself. Kabul now builds a ring of

    alternatives (Iran, Central Asia, India, the Gulf, Russia) but every

    ring has a price: Iranian dependence and expulsions, a water quarrel with

    Uzbekistan, a Tajik neighbour hosting the Panjshir resistance. Two signals

    that are not rows: Khalilzad''s presence at the Saudi gas signing on

    7 Sep 2026, which the State Department disowned, and the Moscow Format of

    5 Oct 2026, where Pakistani and Taliban envoys traded accusations in the

    same room. The open question for the next year is whether the Gulf and

    Chinese mediators can turn the strikes into a settlement on the TTP before

    the Emirate''s hold on the north-east frays.'
  it: ''
- hash: b7d29d22
  kind: cards
  en: Use the African Union chair and the Luanda process to make Angola the broker of Central Africa's wars. President Lourenco chaired the AU in 2025. Angola ran the DRC-Rwanda talks from the 2022 Luanda
    Roadmap and in March 2025 announced it was stepping back as mediator to focus on the AU presidency. It tried to return in February 2026 with a ceasefire proposal that the M23 rejected.
  it: ''
- hash: 9b7f388b
  kind: cards
  en: Turn the Lobito corridor into Western finance and an export route that does not run on Chinese loans. The US Development Finance Corporation signed a USD 553m loan for the Lobito Atlantic Railway
    consortium on 17 December 2025, and oil-backed debt to China fell from USD 10.1bn at end-2024 to about USD 7.7bn at end-2025 (finance ministry data, as reported).
  it: ''
- hash: 4f46ae44
  kind: cards
  en: The AU chair and the Luanda venue. Lourenco chaired the African Union in 2025, and Luanda hosted the 2022 DRC-Rwanda roadmap that de-escalated tensions. The mediator's chair was given up in March
    2025, so the means is now a title and a venue, not a standing negotiating role.
  it: ''
- hash: fe1d676b
  kind: cards
  en: 'Oil is the rent that pays for the state. Output fell from 1.42 to 1.1 million barrels a day between 2019 and 2023, and China takes nearly 72% of Angolan oil exports. Angola left OPEC on 1 January
    2024 after a quota dispute: OPEC+ set its 2024 target at 1.11m barrels a day, below the 1.18m Angola had asked for.'
  it: ''
- hash: 5e1bdd8d
  kind: cards
  en: Fuel subsidies meet the street. The fuel price rise of 1 July 2025 set off a minibus taxi stoppage that became looting and clashes in Luanda and other cities; the presidency reported 22 dead, 197
    injured and 1,214 arrests. Subsidy reform, begun in 2023, has a visible political price.
  it: ''
- hash: d87ade52
  kind: cards
  en: 'The oil-backed loans are still being paid and new ones are sought. Owed to China, the oil-backed debt falls as output does, and in February 2026 Sonangol was reported to be seeking a USD 4.8bn Chinese
    loan for a refinery at Lobito: the state still borrows against oil while it says it wants less of it.'
  it: ''
- hash: 25fd71e9
  kind: cards
  en: The corridor that is meant to bring Angola Western money and a regional role runs into the DRC mining belt, where the war is. Luanda gave up the DRC mediator's chair in March 2025, the same spring
    the Lobito financing was being settled, so the state that wants to pacify the mining region is also its railway partner.
  it: ''
- hash: e64aed46
  kind: cards
  en: 'Angola''s grand strategy is to turn oil money and a continental chair into a regional and Western role while the Chinese loans of the last two decades are paid down. Its tools are the AU presidency,
    the Luanda venue and the Lobito corridor, and its limits are the oil output that fell from 1.42 to 1.1 million barrels a day and the 2025 fuel riots, which show how little room subsidy reform has. Not
    verified in this pass: the Soviet-era legacy and the cooling with Moscow, the 2027 succession, the Trump-era posture beyond the Lobito funding, the Zambian trend (the ZMB card reads warming, not carried
    here), and diamonds as an export, all of which need their own sources.'
  it: ''
- hash: cbf96cff
  kind: cards
  en: 'Join the European Union at speed: all negotiating clusters opened by 2025, the first three chapters (25, 26, 30) provisionally closed on 14 Jul 2026, the government aiming to finish talks by end-2027
    and enter by 2030 (Commissioner Kos: ''realistic'' if rule-of-law standards hold). Membership is the regime''s central promise and the exit from a small, shrinking economy.'
  it: ''
- hash: '25545232'
  kind: cards
  en: 'Keep the Euro-Atlantic security anchor and the personal channel to Washington: NATO member since 2009, a NATO-funded air base at Kucova (reopened 4 Mar 2024), defence spending lifted to a promised
    2.6% of GDP in 2026, a founding seat on Trump''s Board of Peace (Jan 2026) and a hosted NATO summit planned for 2027 that is now in doubt.'
  it: ''
- hash: 3cd3a54c
  kind: cards
  en: 'Stay the kin-state and security patron of Kosovo without taking responsibility for it: the 18 Mar 2025 trilateral defence declaration with Croatia and Kosovo, the Rama visit to Pristina on 16 Feb
    2026, ''one nation'' language; but no unification policy and a joint-government format that Rama himself cancelled in 2023.'
  it: ''
- hash: c699d5f0
  kind: cards
  en: 'Consolidate the Socialist Party''s hold on power after the 11 May 2025 election (fourth consecutive term, 52.6% on partial results) and keep the government out of reach of the anti-corruption prosecutor
    SPAK: Rama called the Balluku case a ''witch hunt'', refused to lift her immunity and proposed stronger immunities for ministers.'
  it: ''
- hash: 61ba45d3
  kind: cards
  en: 'Run growth on tourism, construction and foreign real-estate capital in an emptying country: 12.4 million foreign visitors in 2025, FDI of EUR 1.64bn (37% in real estate), prestige projects with the
    UAE (Durres) and the Kushner family (Sazan and Zvernec), and migration deals (Italy, UK) that turn emigration pressure into diplomatic currency.'
  it: ''
- hash: 39e1a892
  kind: cards
  en: 'Keep the bilateral disputes with Greece (maritime delimitation, the Himara/Beleri file, minority property, the Greek ''law of war'') from becoming a veto on the EU path: Rama talks of a new strategic
    partnership with Athens in 2026 while Athens says delimitation is no longer a priority.'
  it: ''
- hash: 06739886
  kind: cards
  en: 'Personal leader diplomacy by Rama: Board of Peace founding member (Albania''s parliament voted 110 of 140 on 22 Jan 2026, no fee), the first Italy-Albania intergovernmental summit in Rome (13 Nov
    2025), and the joint Rama-Vucic op-ed in the FAZ asking for single-market and Schengen access without veto, Commissioner or MEPs (published around 28 Feb 2026) - which the Commission and member states
    rejected.'
  it: ''
- hash: 7eec75ee
  kind: cards
  en: 'Full alignment on paper with EU foreign policy: all CFSP decisions on Russia incorporated into law (government decision 597/2025 lists over 2,500 sanctioned persons and entities); severing relations
    with Iran (Sept 2022) after the cyberattacks. BIRN''s July 2026 audit finds almost no enforcement cases.'
  it: ''
- hash: 21818afa
  kind: cards
  en: 'NATO-centred defence: Kucova tactical air base (NATO paid about EUR 50m), Turkish drone and equipment support announced by Erdogan in Tirana on 10 Oct 2024, defence budget lifted from below 2% (2025)
    to 2.6% of GDP including 2.2% core defence (2026 commitment), and the trilateral declaration with Croatia and Kosovo on training, education and exercises.'
  it: ''
- hash: 2a008f31
  kind: cards
  en: 'Tourism and real-estate capital as state strategy: a record 12.4 million visitors (Italy 1.2 million, UK about 932,000), a EUR 2bn Eagle Hills (Abu Dhabi) marina and port scheme at Durres signed
    in Jan 2023 (the state takes 33%), and the Kushner-linked Sazan/Zvernec resort given preliminary approval in 2026. Bilateral migration deals with Italy (2023) and the UK (2022) are traded for political
    support.'
  it: ''
- hash: 4d55b1d3
  kind: cards
  en: 'State control of the information space by decree: a ban on TikTok from 13 Mar 2025 after a teenager''s killing, lifted in Feb 2026 amid a court challenge by journalists and an NGO; opposition parties
    called it politically motivated weeks before the 2025 election, which the government denied. A blocked-domain list of 13,440 addresses includes RT and Sputnik.'
  it: ''
- hash: 88350ad8
  kind: cards
  en: 'The rule-of-law test and the veto points inside the EU: nine member states blocked delivery of the Interim Benchmark Assessment Report on judicial-independence grounds; the Commission says corruption
    remains widespread and pressure on the judiciary ''a serious concern''; Albania fell 11 places to 91st of 182 in the Corruption Perceptions Index and only three chapters are provisionally closed.'
  it: ''
- hash: 80e2faa4
  kind: cards
  en: 'A shrinking, ageing country: the population fell 14.5% between the 2011 and 2023 censuses and by another 28,500 in 2025 to about 2.33 million, almost all through net emigration; median age 42.5.
    Remittances (about EUR 1.1bn, 4.2% of GDP) and tourism cover a goods deficit of EUR 5.96bn. Unemployment falls partly because the workforce leaves.'
  it: ''
- hash: 9890c197
  kind: cards
  en: 'Small armed forces and a doubtful American umbrella: Albania was below the 2% NATO target in 2025 (Rutte, 2026), Serbia spent about five times as much as Albania in 2024 (SIPRI, as cited), and the
    planned 2027 NATO summit in Albania was dropped from the draft Ankara declaration amid US reluctance.'
  it: ''
- hash: e59ac99a
  kind: cards
  en: 'A veto in Athens: Greece can tie Albania''s EU path to the Beleri case, minority property in Himara and the still-formal Greek law of war; Mitsotakis said in 2023 that Albania''s EU path ''passes
    through Greece'' (as reported). Maritime delimitation has been stuck since the Constitutional Court annulled the 2009 agreement and the 2020 pledge to go to the ICJ was never executed.'
  it: ''
- hash: a8756dcf
  kind: cards
  en: 'A concentrated trade pattern: Italy takes about 42% of exports and is the first trade partner; China supplied about 10% of trade in Jan-Jul 2025 and its imports grew 21.8%; exports to the EU are
    72.5%. US trade is thin: a 10% tariff hit exports to the US by about 30% in April 2025. Exports fell 6.1% in 2025.'
  it: ''
- hash: bb8292d0
  kind: cards
  en: 'Exposure to Iran through the MEK: Ashraf-3 near Tirana houses about 2,800-3,000 members of the Iranian opposition group; Iranian cyberattacks in 2022 broke relations, and in 2026 the US embassy warned
    of Iran-linked threats (1 Apr) and Iranian media reported IRGC talk of a strike on the camp; Tirana called the warning speculative.'
  it: ''
- hash: e0931d5f
  kind: cards
  en: The sprint to Brussels runs through the prosecutor the government is fighting. Albania needs SPAK's results to close chapters, yet Rama called the Balluku case a 'witch hunt', proposed stronger immunities
    and accused judges of opposition ties; nine member states then blocked the benchmark report. The faster Tirana moves on paper, the more the Council reads its rule-of-law record.
  it: ''
- hash: 65d73ac9
  kind: cards
  en: Kosovo's shield sharpens Serbia's sword. Signing the 18 Mar 2025 defence declaration made Albania a co-guarantor of Kosovo, and Vucic answered with an 'arms race' charge and, in April 2026, a rearmament
    programme aimed at the 'Tirana-Zagreb-Pristina alliance'. Rama's role as the only regional leader Vucic will write an op-ed with (Feb 2026) is weakened by the pact that Belgrade calls its 'greatest
    threat'; a state of 2.3 million is stepping into a race against one that outspends it fivefold.
  it: ''
- hash: 0c430879
  kind: cards
  en: The Trump channel pays in prestige and costs at home. Rama bought access with the Board of Peace seat and the Sazan/Zvernec concession to the Kushner family, but the resort produced the largest protests
    of his rule, a SPAK investigation, an EU warning and a reported suspension of works, while Washington's own signals (the 2027 NATO summit dropped from the draft text, 10% tariffs) show little return.
  it: ''
- hash: f9ae1cdd
  kind: cards
  en: 'Exporting people makes allies and weakens the state. The 2022 UK communique cut Albanian small-boat arrivals by over 90% and the Italian centres at Shengjin and Gjader bought Rome''s public backing
    for Albania''s EU entry (Italy''s foreign minister, Feb 2026: Albania and Montenegro before Ukraine and Moldova), but Albania now lends territory to a scheme that Italian courts, the CJEU and the European
    Parliament have contested, while the same emigration drains the labour force the growth model depends on.'
  it: ''
- hash: debd14e4
  kind: cards
  en: The tourism boom eats the coast that sells it. Record visitors and 37% of FDI in real estate sit beside a falling population and a concession on the protected Vjosa-Narta wetland; the backlash (the
    'Flamingo Revolution') turned a growth model into the main domestic threat to the ruling party, whose poll rating has dropped 6 points since the election.
  it: ''
- hash: '26486235'
  kind: cards
  en: Shelter for the MEK earned Washington's favour and Tehran's cyber-war. Hosting the camp at American request put Albania on Iran's target list (2022 attack, 2026 threats), while the pro-US alignment
    that Rama deepens raises the stakes for a country with no air defence of its own.
  it: ''
- hash: c87a697c
  kind: cards
  en: 'Albania runs the strategy of a small state that has bet everything on being

    the most useful and best-aligned partner of whoever matters, and on Edi Rama

    as the man who makes that bet personal. Every relation in the card follows

    from it: NATO and the American channel for security, the EU for the future,

    Italy and the UK for the migration currency, the Gulf and the Kushners for

    capital, Turkey for arms and religion, Kosovo for the nation. The Luttwak

    pattern is that each source of leverage creates a counter-pressure that

    lands on the same pillar. The EU path is only as fast as the rule of law

    allows, which is the front where Rama fights his own prosecutors; the

    Kosovo pact adds to Albania''s security and to Serbia''s rearmament; the

    Trump channel brings the Board of Peace and the Sazan protests together.

    In 2026 the EU front is moving (three chapters closed on 14 Jul, the

    Commission calling Albania and Montenegro the closest candidates) while the

    American front is cooling (the 2027 NATO summit dropped from the draft

    text, 10% tariffs). Two signals that are not rows: Albania''s own ministers

    played down the US embassy''s Iran warning of 1 Apr 2026, and Greek

    diplomatic sources publicly distanced Athens from Rama''s claim at Delphi

    that a Hague referral was agreed. The test is whether the EU path survives

    the collision between Rama''s immunities draft and the benchmarks, with

    Greece as a possible veto at the end.'
  it: ''
- hash: 9ac3ec51
  kind: cards
  en: Turn the Association Agreement with the EU into a single-market deal without full membership. The Council authorised its signing on 16 July 2026, signing is expected in late September 2026, the European
    Parliament must still consent, and the government has promised a referendum on a text that polls split almost evenly. The EU is the only route to market access beyond the two neighbours.
  it: ''
- hash: 5cc2fe92
  kind: cards
  en: 'Keep the co-principality and the two neighbours as the frame of the state. The French president and the Bishop of Urgell share the head of state under the constitution, and France and Spain are the
    only land routes in and out. Security, mobility and visas are run with them: the 2003 Franco-Spanish-Andorran convention coordinates visa and residence rules, and in June 2026 Andorra signed a 2026-2030
    work plan with Catalonia on airport hours and mobility.'
  it: ''
- hash: 6d8db885
  kind: cards
  en: 'Keep the tourism economy: duty-free shopping, low taxes and winter and summer resorts. UNWTO data put tourism at 71.8 percent of GDP, the highest share in its ranking, which makes the model a dependency
    as much as a means. Banking, the third pillar, is now under EU and US pressure and cannot be the only growth engine.'
  it: ''
- hash: 8d7c07e3
  kind: cards
  en: Customs union with the EU since 1 July 1991, which treats manufactured goods as inside the union, and the euro as currency under a monetary agreement signed in 2011 and in force since 2012, with Andorran
    euro coins issued from 2015. Both are the instruments that let a state without its own currency or tariffs trade and sell.
  it: ''
- hash: 79c0960d
  kind: cards
  en: 'Multilateral presence far above its size: a full UN member since 1993, with the Council of Europe and the OSCE as its European forums. It buys visibility with small voluntary contributions, such
    as EUR 10,000 to the Council of Europe Action Plan for Ukraine signed in June 2025, and with humanitarian grants routed through international agencies.'
  it: ''
- hash: ab65ee11
  kind: cards
  en: 'No armed forces, as Andorra''s own report to the UN records. Security is delegated in practice to the two neighbours that are its co-princes: France and Spain are the only land entry points, and
    Andorra has no military capacity of its own to defend its borders.'
  it: ''
- hash: bfb856c6
  kind: cards
  en: No armed forces, and no fixed-wing airport inside the territory. Access is by road or helicopter through France or Spain, and the nearest commercial airport is La Seu d'Urgell in Catalonia, owned
    by the Catalan government. A state that depends on its neighbours for air access and for security has little room to act without them.
  it: ''
- hash: cf1a1c5f
  kind: cards
  en: No route into the EEA. Membership is open only to EU and EFTA members, and the Commission's 2013 report judged small-state participation not viable at present. The single-market access that Liechtenstein
    has through the EEA must therefore come from a bilateral Association Agreement, which is slower and still unratified.
  it: ''
- hash: 9877a442
  kind: cards
  en: The banking sector depends on US acceptance. In March 2015 FinCEN named Banca Privada d'Andorra a money-laundering concern, Andorran authorities took the bank over, and its Spanish unit went bankrupt;
    S&P then downgraded Andorra. Andorra does not appear in the US Treasury's table of FATCA intergovernmental agreements in the page read, so US compliance runs bank by bank.
  it: ''
- hash: 97632eff
  kind: cards
  en: Low taxes and duty-free sales built the state, and the EU deal and US pressure ask it to shrink exactly those advantages. The BPA affair showed that one bank's tax-haven clients can cost the whole
    financial sector its correspondent access, which is why the Association Agreement, meant to secure market access, forces the sector to open its books.
  it: ''
- hash: 90e2e39f
  kind: cards
  en: Andorra borrows its security and its mobility from the two neighbours that are also its co-princes, and sells tourism and duty-free shopping inside a customs union with the EU. Its structural problem
    is that the banking side, which paid for much of the state, now has to meet EU and US standards to keep market access, and the Association Agreement is the price of that access. Monaco stalled in 2023
    while Andorra and San Marino went on, so the microstate track is not a fixed club; the 2026 signature and the referendum that follows are the test.
