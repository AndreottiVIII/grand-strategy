# Translate every `en` into it. Write the translations to the file cards-14.out.yaml next to this one,
# as `items:` of `- hash: <same hash>` / `it: <translation>`, appending one item at a time (valid YAML at
# every step), never editing this file. Keep names, dates, numbers and quotes; register of a foreign-office
# brief: dry, precise, no flourish.
lang: it
items:
- hash: 02059820
  kind: cards
  en: The broker's prize turned into the broker's problem. Anwar convened the Thai-Cambodian talks and the Kuala Lumpur Peace Accord with Trump present as the lever; about two weeks later Thailand suspended
    the accord (10-11 Nov 2025), fighting resumed on 7 Dec, and the ceasefire that held on 27 Dec was a bilateral one signed by the two defence ministers. A chair that borrows Washington's weight to convene
    ASEAN spends the neutrality it sells; a Malaysian critic wrote of an 'erosion of ASEAN neutrality'.
  it: ''
- hash: 869de9d0
  kind: cards
  en: The trade deal signed to avoid choosing had to be disowned in order not to choose, and the disowned deal still sets the tariff. The Agreement on Reciprocal Trade (26 Oct 2025) was never ratified and
    was declared void by trade minister Johari in March 2026 after the Supreme Court's IEEPA ruling of 20 Feb; yet in July 2026 Malaysia was put in the lowest Section 301 tier (10%, against 12.5% for the
    rest) in recognition of its commitment under the same agreement to ban forced-labour imports.
  it: ''
- hash: 830604c3
  kind: cards
  en: The chip hub that makes Malaysia indispensable makes it suspect. Packaging and data centres in Penang and Johor draw Chinese capital (MYR58.0bn of approved FDI in 2025) and the suspicion of Nvidia
    diversion that forced the permit rule on US chips (14 Jul 2025); the US excess-capacity probe now under way counts capacity from third countries that uses Malaysia as a route into the American market.
    Success as the 'China plus one' is what exposes it to American punishment.
  it: ''
- hash: 42e53750
  kind: cards
  en: Palestine buys the Malay vote and costs goodwill in Washington. Refusing two US requests to designate Hamas, meeting its leaders in Doha and banning Israel-linked shipping are cheap at home, but the
    Diplomat reported US pressure on Anwar to change the stance, and in 2025-26 Malaysia needed Washington's tariff relief and Trump's presence at the Thai-Cambodian accord.
  it: ''
- hash: d686103d
  kind: cards
  en: Quiet diplomacy on the South China Sea has not bought quiet seas. Kuala Lumpur keeps protests private and trade high, and the Xi-Anwar statement of April 2025 only looks forward to a Code of Conduct
    in 2026, yet Chinese coast guard vessels sit beside Kasawari, Jerun and Timi and Anwar has said Petronas will keep exploring regardless.
  it: ''
- hash: 138b53d9
  kind: cards
  en: A reformer's coalition rests on the party Najib built. The pardon of 18 Sep 2026 (house arrest until 23 Aug 2028) energised UMNO's grassroots, and in the same month UMNO's president dared Anwar to
    call an early election; the concession that holds the coalition also raises the price of staying in it.
  it: ''
- hash: 99f3f3c0
  kind: cards
  en: 'Malaysia is the middle power that chairs the room and sells neutrality in it. Its currency is access, not force: Xi in April 2025 and Trump in October, Hamas''s political wing and Washington''s trade
    negotiators, BRICS partner status and the Five Power Defence Arrangements, all at once. In Luttwak''s terms its strength is that the other powers cannot settle the room without it, and its weakness
    is that the neutrality has to be re-earned each time a power presses. The 2025 chair is the clearest case: the Putrajaya ceasefire and the Kuala Lumpur accord gave Kuala Lumpur a stage, then Thailand''s
    suspension and the December fighting showed that the stage rested on Trump''s attention; the reciprocal trade deal repeated the pattern in 2026, signed in October, voided in March, yet still setting
    the tariff. At home the logic runs the other way: the Malay vote that rewards Gaza and neutrality is the one UMNO, PAS and Najib''s pardon now contest, and the election is due within 16 months.

    Signals that are not rows: Anwar in Shanghai in September 2026 saying that Malaysia stays neutral and that Beijing understood; UMNO''s dare of the same month; the rail extension to the Thai border agreed
    in principle and not yet approved. Gaps in this pass (no source read, nothing written): Japan, Turkey (drones, the Islamic axis), Saudi Arabia and the Gulf (hajj, petrochemicals), Iran (ship-to-ship
    transfers), and the detail of Australia, the UK and New Zealand beyond the FPDA; Singapore''s water price and Pedra Branca rest on one tier-4 pointer.'
  it: ''
- hash: 3489d6e5
  kind: cards
  en: Close the genocide question with Germany on Namibian terms. The 2021 joint declaration (recognition of the 1904-1908 killings and about EUR 1.1bn over 30 years, framed as development aid) was rejected
    in Namibia and never signed. President Nandi-Ndaitwah says the revised text is nearly finished, will go to parliament, and should be concluded by the end of 2026.
  it: ''
- hash: 2e8d530a
  kind: cards
  en: Turn Orange Basin oil and green hydrogen into the new economy. TotalEnergies is operator of the Venus block (PEL 56); the company has said it is ready to take a final investment decision once talks
    with the government are finished, which is not confirmed in the sources found. The EU green partnership was renewed for 2026-2030 in May 2026.
  it: ''
- hash: 4e70d4dd
  kind: cards
  en: Mineral exports to the United States (N$5.52bn in 2024, up from N$1.09bn in 2023, mostly minerals) and Chinese equity in uranium, the largest being the Husab mine, which New Era reports as China's
    largest single investment in Africa. Ownership figures differ across sources, and the Walvis Bay port link is not verified in this pass.
  it: ''
- hash: 35a511eb
  kind: cards
  en: 'Multi-alignment on the energy file: a green hydrogen pipeline assembled for Team Europe financing (HyIron, Hyphen, Zhero, Cleanergy, Daures) and a 2026-2030 renewal with the EU, while Nandi-Ndaitwah
    met China''s foreign minister as president-elect (January 2025) and discussed nuclear cooperation with a Russian deputy prime minister (spring 2025).'
  it: ''
- hash: 72057a0e
  kind: cards
  en: The United States has tightened the door it used to keep open. A 21% reciprocal tariff on Namibian goods was announced in 2025 and the government warned it could override AGOA; AGOA lapsed on 30 September
    2025 and was reauthorised for one year, to 31 December 2026 (a later single report says 2028; not verified). A new bilateral trade pact is being sought.
  it: ''
- hash: 0f14aa0a
  kind: cards
  en: The German deal must pass a domestic test. The Landless People's Movement and eleven traditional authorities have asked the government attorney to set the joint declaration aside, and the Ovaherero
    Genocide Foundation opposes it; affected communities contest the government's monopoly on the negotiation. The National Assembly has been asked to be patient until the revised text is tabled.
  it: ''
- hash: 552c133a
  kind: cards
  en: The oil that pays for the state is also the fossil dependency that the EU green partnership is meant to replace. Namibia courts European green finance and Chinese and Western upstream capital at the
    same time, so the decarbonisation partner also profits from the new oil.
  it: ''
- hash: 6a02b3af
  kind: cards
  en: 'Namibia''s strategy under Nandi-Ndaitwah is to convert its minerals and its new offshore oil into a revenue base while keeping every large patron in play: China for uranium capital, the EU for green
    hydrogen finance, the United States for trade access, and Germany for the historical settlement it cannot close without its own communities. The constraint that binds most tightly is domestic, since
    the genocide settlement and the land question require consensus that the government does not yet have. The land question is not researched in this pass and stays open.'
  it: ''
- hash: b7355c18
  kind: cards
  en: Keep the officers in power after the July 2023 coup that ousted President Bazoum, with Russia's Africa Corps guarding the capital and its airport. Moscow confirmed its forces helped repel the ISIL
    attack on Niamey airport in February 2026 and helped put down an attempted coup in August 2026. Every other choice below serves the regime's survival.
  it: ''
- hash: bc996a0c
  kind: cards
  en: Take the state's mineral and oil revenue out of foreign hands. The junta approved the takeover of the Somair uranium mine on 19 June 2025, where Orano held 63.4 per cent, and the government says Orano
    took 86.3 per cent of output from 1971 to 2024 (Al Jazeera puts Orano's stake at 63 per cent). In March 2025 it gave three Chinese oil directors (CNPC, WAPCO, SORAZ) 48 hours to leave, citing a pay
    dispute over local staff.
  it: ''
- hash: b85a5440
  kind: cards
  en: Reopen the one trade route to the sea. The border with Benin has been shut since the 2023 coup and the crude pipeline to Benin's port is the state's only oil outlet; on 2 June 2026 Niamey and Cotonou
    agreed to reopen the border through an expert committee given 15 days. The committee's outcome is not verified in this card.
  it: ''
- hash: 28d34e82
  kind: cards
  en: Hold the Tillabéri border against the jihadists. JNIM and the Islamic State's Sahel province (ISSP) now fight each other and the state in the same western provinces. ISSP attacked the military bases
    at Inates (at least 51 soldiers killed) and Banibangou (34) on 15 June 2026, and JNIM hit the Niamey airport, which hosts Air Base 101 and the Africa Corps, three days later.
  it: ''
- hash: 55fea0ea
  kind: cards
  en: 'The Alliance of Sahel States. Niger, Mali and Burkina Faso left ECOWAS together, the exit taking effect on 29 January 2025, and launched a joint passport and a joint military arrangement, a bloc
    of juntas that sets the state''s foreign line. Outside the bloc, Niamey keeps a second door open: Tiani''s visit to Algiers on 15-16 February 2026 is read as a search for another outlet, given the Benin
    pipeline dispute.'
  it: ''
- hash: ac697345
  kind: cards
  en: 'The Africa Corps as the regime''s guard. Moscow confirmed its forces helped repel the ISIL attack on Niamey airport (3 February 2026) and helped put down an attempted coup (August 2026). Russia had
    also announced in April 2025 that it would reopen its embassy in Niamey. The guard protects the capital, not the whole territory: see the Tillabéri paradox below.'
  it: ''
- hash: e2448879
  kind: cards
  en: Uranium and crude oil. Somair, nationalised in June 2025, is the state's only active uranium mine after the 2024 removal of Orano's operational control of its other mines (Al Jazeera). Crude is exported
    through the Benin pipeline, whose loading Benin blocked in May 2024 until Niger reopened its side.
  it: ''
- hash: 5378be62
  kind: cards
  en: Landlocked, with one way to the sea. Every route to a port runs through Benin, whose border has been shut since July 2023, or through the Nigerian frontier, where relations are being negotiated case
    by case (a Nigerian foreign-minister visit was planned for April 2025 after Niamey accused Abuja of backing an armed group). The junta cannot choose its outlet; it can only choose which neighbour to
    fight.
  it: ''
- hash: 190359dd
  kind: cards
  en: Security on its own soil. JNIM and ISSP strike Tillabéri and the capital's airport, and the province accounted for more than 1,200 of the 1,939 deaths recorded in Niger in 2025 (ACLED data, cited
    by ADF Magazine).
  it: ''
- hash: e9676197
  kind: cards
  en: 'No regional or Western cover. The three juntas left ECOWAS, which asked that their passports stay recognised and their citizens keep visa-free rights only until further notice. The exit removes the
    bloc''s mediation, its financing and its legitimacy from the security problem. Our reading: what remains is bilateral money and the Russian guard, both of which are hard to sustain without a trade outlet.'
  it: ''
- hash: cbbcc8ce
  kind: cards
  en: Sealing the state off as a defence, then buying the way out. The Benin border closure, kept on the Nigerien side even after ECOWAS lifted its sanctions, was meant to punish a neighbour; it cut the
    state off from its only sea route and from its own pipeline revenue, and the reopening Niamey now negotiates is the price of that isolation.
  it: ''
- hash: f4d3a264
  kind: cards
  en: The guard that cannot hold the gate. The Africa Corps protects the capital and its airport, yet the ISSP attack on Niamey airport in January 2026 and JNIM's raid in June 2026 both reached the same
    airport, which hosts Air Base 101 and the Russian force, and ISSP killed dozens of soldiers in the bases of Inates and Banibangou. Russia's protection is for the capital; the war is in the provinces.
  it: ''
- hash: 9529f985
  kind: cards
  en: Taking the mine from Orano turns a French asset into a court case. The junta answers Orano's 86.3 per cent of output with a nationalisation and a sovereign win at home, but Orano replies with arbitration
    and lawsuits, so the state must now defend a mine it runs in courts abroad and at home.
  it: ''
- hash: 1a7fecd8
  kind: cards
  en: 'Niger''s junta has traded the old French security partnership for a Russian guard and a regional bloc of juntas, and it has tried to pay for its isolation by taking the uranium and the oil out of
    foreign hands. Its two real problems are geography and war: a landlocked state whose only outlets run through Benin and the Nigerian frontier, and a Tillabéri border where JNIM and the Islamic State''s
    Sahel province strike the bases and the capital''s airport. The paradox is that each act of sealing the state off, from the Benin border to the ECOWAS exit to the expulsions, shrinks the outlets the
    uranium and the oil need, while the Russian guard protects the capital and not the provinces where the state is losing. Luttwak''s reading is a regime that chose isolation as a defence and must now
    buy its way back out through partners it has already expelled.'
  it: ''
- hash: 0c2860e7
  kind: cards
  en: 'Win the presidential election of 2027 with the reform record as the campaign: Tinubu seeks re-election on the APC ticket, and the polling date is disputed (the electoral commission''s 20 February
    2027 against a report giving 16 January). Every choice below is priced against that vote.'
  it: ''
- hash: 5c1bea6f
  kind: cards
  en: 'Turn the oil into dollars and hold the naira: production at the OPEC quota (1.53 million bpd in September 2026 per OPEC''s report of October, against a quota of 1.5 million and a budget target of
    1.84 million including condensates), while the Dangote refinery takes domestic crude that would otherwise be exported. Sharpened on 2026-10-16: the first draft said ''above the quota, 1.573 million
    bpd in August''; the 13 October report, citing OPEC, gives 1.50 million for August and 1.53 million for September, so the earlier figure was a secondary-source estimate that OPEC''s later data contradicts.'
  it: ''
- hash: 308202bd
  kind: cards
  en: 'Keep ECOWAS as the regional instrument and win the Sahel back: the AES exit leaves the bloc without its Sahel flank, Abuja wants the AES back ''under a different status'' so that ECOWAS survives,
    and the Lake Chad task force (MNJTF) against Boko Haram and ISWAP has had no regional operation since July 2024.'
  it: ''
- hash: ab5e4c0f
  kind: cards
  en: 'Keep the claim to lead Africa against South Africa''s co-claim: Nigeria''s case rests on its population, its oil, its role in founding ECOWAS and its peacekeeping, and South Africa now competes for
    the same standing through its G20 seat and its ICJ case against Israel.'
  it: ''
- hash: af31a31c
  kind: cards
  en: 'Stay inside Washington''s security tent while Washington brands the state: keep the joint campaign against ISWAP and the health compact (nearly USD 2bn of US grants for 2026-2030, against 6% of budgets
    spent on health), and get the ''Country of Particular Concern'' designation lifted or left without sanctions. Tinubu: ''We will overcome the CPC designation''; the second Joint Working Group met in
    Washington on 12 August 2026 with no change to the listing.'
  it: ''
- hash: cdcc7568
  kind: cards
  en: 'Convert size into rank and spread the risk: a permanent seat on the UN Security Council (''Nigeria must have a permanent seat'', Tinubu''s address read by the vice president on 24 September 2025),
    BRICS partner status since January 2025, a continuous seat on the AU Peace and Security Council since 2004 (chair in May 2026), and new security and trade partners in Turkey, the Gulf and Brazil so
    that no single patron holds the key.'
  it: ''
- hash: 5a037b0a
  kind: cards
  en: 'ECOWAS and the Atlantic partnerships around it: Abuja, which helped found the bloc, sits in the ECOWAS that imposed sanctions on Niger after the 2023 coup; the bloc backed the Nigeria-Morocco pipeline
    agreement at its July 2026 summit; the UK strategic partnership (November 2024) is the most formal Western tie.'
  it: ''
- hash: fd544651
  kind: cards
  en: 'Counter-terrorism with foreign help: US strikes on ISIS sites in Sokoto (25-26 December 2025) with Abuja''s consent, a joint operation that killed the ISWAP leader al-Minuki (15 May 2026, per Trump),
    a UK security and defence dialogue in Abuja (June 2026); AFRICOM withdrew almost all personnel by 3 July 2026 and kept intelligence assets.'
  it: ''
- hash: 5efd6e2b
  kind: cards
  en: 'Oil, debt and the gas corridor: crude exports (OPEC quota compliance for five months to September 2026; the first draft said four months to August, updated by the 13 October report), the Dangote
    refinery meant to end fuel imports, and the Morocco pipeline (USD 25bn, first gas expected in 2031). External debt is about USD 54.5bn: the World Bank''s IDA is the largest single creditor and China
    Exim the largest bilateral one.'
  it: ''
- hash: c884472a
  kind: cards
  en: 'The counter-narrative and the lobby: Abuja rejects the ''genocide'' framing (Tinubu: ''The characterization of Nigeria as religiously intolerant does not reflect our national reality''; the information
    minister calls the US claims ''based on faulty data''), then engages the same Washington through two Joint Working Groups (Abuja, 22 January 2026; Washington, 12 August 2026, led by the National Security
    Adviser Nuhu Ribadu) and a UN-reform message carried at the General Assembly.'
  it: ''
- hash: 920779ad
  kind: cards
  en: 'Multi-alignment as insurance: Turkey (a military-cooperation protocol during Tinubu''s state visit to Ankara in January 2026, 200 special-forces personnel to be trained in Turkey from the Antalya
    agreement of April 2026), the Gulf (an economic partnership agreement with the UAE concluded in January 2026), BRICS partner status (January 2025), Brazil (an air-services agreement, August 2025) and
    a readmission agreement initialled with the EU in March 2026.'
  it: ''
- hash: 5b9dbb3b
  kind: cards
  en: 'Gas pipelines as regional leverage and as a partner network: the West African Gas Pipeline carried about 80 million MMBtu in 2025 (+22%), with Nigeria supplying more than 68% of the 613 million MMBtu
    moved since it began, to Benin, Togo and Ghana; the Trans-Saharan line to Algeria (4,128 km, 30 bcm a year; the Algerian section began in June 2026, Niger''s section is planned for early 2027) and the
    Morocco line (USD 25bn) bet on two more routes; a naira-yuan swap line of 15bn yuan sits behind the China trade.'
  it: ''
- hash: 4d1e53d7
  kind: cards
  en: Debt service on a dollar budget. External debt is about USD 54.5bn in mid-2026; the World Bank's IDA (35%) and Eurobond holders (34%) are the largest creditors and China Exim (about 9%) the largest
    bilateral one. The naira stood at about N1,322 to the dollar in early September 2026, so every dollar of crude that stays at home is a dollar the debt does not get.
  it: ''
- hash: c3d63319
  kind: cards
  en: A northern border it cannot police alone. The Nigeria-Niger border is 1,608 km long and, in the Chief of Defence Staff's words, cooperation on it is 'not as elaborate as we want'; Niger has left the
    MNJTF; Burkina Faso's leaders threatened in December 2025 to 'neutralize' Nigerian aircraft flying over their territory without permission; ISWAP has used drones for intelligence and attack since 2025.
  it: ''
- hash: 1b31dfe1
  kind: cards
  en: A 2027 vote with the date still contested. The electoral commission's 20 February 2027 date is challenged in a report giving 16 January, and every concession to a foreign partner becomes a domestic
    campaign issue before the vote.
  it: ''
- hash: 909ebde9
  kind: cards
  en: The partners' leverage is turning from carrot to stick. The US kept Nigeria on the CPC list after the 12 August 2026 working group, listed it under the Child Soldiers Prevention Act in the 2026 trafficking
    report (cuts to US military training, sales and financing possible unless the president waives them; the waiver status is not reported), suspended some visa categories from 1 January 2026, and the UK
    plans to halve its aid from GBP 136.62m (2025-26) to GBP 68m by 2028-29.
  it: ''
- hash: a4ac2888
  kind: cards
  en: A budget built on crude it does not pump. Crude was 62.89% of exports in the first quarter of 2025; the 2026 budget assumes 1.84 million bpd including condensates and Nigeria has stayed below it every
    month from May to August (Nairametrics); inflation was still 15.39% in August 2026 and debt service is 23.14% of the N68.32 trillion 2026 appropriation (Intelpoint). The state has little room to spend
    on the north, the army or the election at once.
  it: ''
- hash: aee35953
  kind: cards
  en: The regional instrument is unfunded and late. The ECOWAS Standby Force's counter-terrorism brigade (1,650 troops, endorsed again at the Freetown summit of July 2026) is due to be operational in July
    2027, the force's activation is estimated at EUR 2.26bn, three members have left, and the Lake Chad task force has not run a regional operation since July 2024. Abuja leads a bloc that cannot yet field
    what it promised.
  it: ''
- hash: 7f2d1f09
  kind: cards
  en: The sanctions aimed at reversing the 2023 coup in Niger pushed the Sahel states out of the bloc. The MNJTF lost Niger's troops and Nigeria lost the Sahel flank it needs against Boko Haram; ECOWAS
    now needs the AES back to survive.
  it: ''
- hash: 22ab9762
  kind: cards
  en: 'The refinery built to end fuel imports takes the crude that earns the dollars. Dangote bought at least 16 million barrels of Nigerian crude for October, about 520,000 b/d (Reuters-reported), so less
    crude is left for export; the mechanism from crude to naira and debt service is our reading, not a sourced motive. The oil state still imports its fuel: petrol imports were 14.6 million litres a day
    in August 2026 (down 26% from July) while domestic refineries took 0.683 million bpd of crude, about 45% of the 1.53 million bpd produced (our division), and the refinery ran at 105% of capacity.'
  it: ''
- hash: eda5bcca
  kind: cards
  en: Courting Paris to bring the French-speaking neighbours back into West African politics costs Nigeria its anti-French line. Tinubu's private dinner with Macron in Paris (17 September 2026) follows
    a 2024 state visit; Adebajo (Project Syndicate, June 2026, an opinion piece) reads it as a break with the policy aimed at reducing French influence in West Africa.
  it: ''
- hash: 9ad7408f
  kind: cards
  en: 'The giant that cannot project its weight. A state of Nigeria''s weight could not stop a Burkinabe junta from holding a Nigerian C-130 and 11 personnel after an emergency landing in Bobo-Dioulasso
    (8 December 2025): the AES statement called the landing an unfriendly act and authorised its members to ''neutralise'' aircraft violating their airspace, and Foreign Minister Tuggar flew to Ouagadougou
    to apologise for the irregular clearance. A state that sends jets to save Benin''s government in the same week cannot fly home through a neighbour''s sky, and it fights ISWAP with American and Turkish
    help.'
  it: ''
- hash: 59de95c5
  kind: cards
  en: The partner whose joint campaign proves the charge. Washington accuses Abuja of tolerating the killing of Christians (CPC designation, 31 October 2025), then strikes ISIS sites in Sokoto with Abuja's
    consent and kills al-Minuki with it; each joint success shows the state needs foreign force to protect its own people, which is the claim the designation makes, while Abuja's defence that Muslims die
    too (the information minister's line) is the one thing its partner will not grant. The cooperation Abuja needs to fix the problem is what keeps the label alive; the August 2026 working group left the
    listing unchanged and the October 2026 Child Soldiers Act listing adds a second.
  it: ''
- hash: 4d5985f9
  kind: cards
  en: A strong naira bought with tight money and reserves can weaken the budget it protects. The naira reached N1,331.77 to the dollar on 8 October 2026, a two-year high (from about N1,650 in December 2024),
    with reserves near USD 55bn after a CBN data revision; but a dollar of oil is now worth fewer naira to a budget written in naira, inflation is 15.39%, and Legit.ng reports concern over a recent interest-rate
    cut in an election run-up. The reading that a stronger naira lowers naira oil receipts is ours, not a sourced motive.
  it: ''
- hash: e62da653
  kind: cards
  en: 'Nigeria is the region''s indispensable state and a leader short of the means to lead: it holds the oil, the population and the ECOWAS flag, but its money goes to debt service, its north is pressed
    from the Sahel, and it relies on outside force and outside capital to fight insurgents it cannot beat alone. Its moves work against its aims in three places: the Sahel, where the ECOWAS sanctions on
    Niger drove the AES out and left the Lake Chad force without Niger; the oil, where the refinery built to end imports takes the crude that earns the dollars; and Paris and Washington, where the partners
    it courts bring frictions it must then manage at home. The 2027 election will decide whether the reform record survives its costs, which makes every concession to a partner a domestic question. Enriched
    on 2026-10-16: the patron it leans on is also the one that labels it (CPC, Child Soldiers Act listing), the giant could not fly a transport home through Burkina''s sky without an apology, and the strong
    naira is a reform success whose benefit to the budget is unproven; Abuja''s answer is to spread its bets (Ankara, the Gulf, Brasilia, Delhi, BRICS) rather than to pick a patron. This is a structural
    reading built on thin evidence (most rows are C, and the gaps are listed in the stance notes), not a verdict on Abuja''s intentions.'
  it: ''
- hash: ea74c477
  kind: cards
  en: 'Keep the Ortega-Murillo government''s hold on the state. The regime expelled the papal nuncio (March 2022) and the bishops'' conference president (November 2024); the US Section 301 proposal itself
    cites the regime''s ''laws, policies, and practices''. Confidence C: two tier-3 reports and one index, read as the structure of the regime''s choices.'
  it: ''
- hash: 9256e8b2
  kind: cards
  en: 'Find patrons outside the United States. The Wikipedia index describes Nicaragua''s foreign policy as subordinated to Russia and China. Confidence C: index only, the partnerships are not yet read
    in primary sources here.'
  it: ''
- hash: 1ad3e530
  kind: cards
  en: 'Diplomacy and litigation in Central America: Nicaragua sits on the Central American Security Commission, pushes regional demilitarisation, and has taken three territorial disputes (Honduras, Colombia,
    Costa Rica) to the International Court of Justice. Confidence C, from the index.'
  it: ''
- hash: f950a791
  kind: cards
  en: Partnership with Russia and China as a counterweight to US pressure. The index describes the subordination; the specific military, training and trade instruments are not sourced in this card.
  it: ''
- hash: b4c9cdac
  kind: cards
  en: 'The United States is the main trading partner. The US Section 301 proposal (October 2025) offered suspension from CAFTA-DR benefits or tariffs of up to 100% on Nicaraguan exports; economists warn
    of collapse if Nicaragua is excluded. Confidence C: tier-3 reporting; the final decision is not confirmed here.'
  it: ''
- hash: abd20915
  kind: cards
  en: China cannot replace the US market. An analyst quoted by Confidencial says China cannot match the trade volume the United States represents. Confidence C.
  it: ''
- hash: fa1b3e89
  kind: cards
  en: The repression that secures the regime (the expulsion of the nuncio and of the bishops' conference president) is part of the record the US trade measures cite. The means that keep the regime in place
    invite the measures that threaten the export income that funds it.
  it: ''
- hash: a959c58d
  kind: cards
  en: Nicaragua is a regime that has chosen control over the Church and the exiles, and pays for it in its one large market, the United States, which is now proposing to close or tax it. Its answer is the
    patronage of Russia and China, but neither can replace the US trade it needs, so the strategy is survival by protest and litigation rather than by growth. The CAFTA decision and the Church file are
    the two tests to watch; the co-presidency of Ortega and Murillo and the exiles' nationality are not sourced in this thin card (gaps in the journal).
  it: ''
- hash: 1502176b
  kind: cards
  en: 'Keep the United States inside European security while building a European pillar around it: the Jetten coalition agreement calls NATO the cornerstone, the US the power with which the Netherlands
    shares most interests, and a stronger European pillar within NATO its main security goal (including a European buying mechanism and an opening to French-led talks on nuclear deterrence).'
  it: ''
- hash: 5aa45585
  kind: cards
  en: 'Make Russia pay and keep Ukraine in the fight: about EUR 9.1bn spent on military aid and EUR 11.6bn earmarked (July 2026), F-16s delivered, a 2024 ten-year bilateral security agreement, a leading
    place in the Coalition of the Willing and in the ten-nation air-defence initiative; and justice for MH17 through the ICAO Council (12 May 2025) and the European Court of Human Rights (9 Jul 2025).'
  it: ''
- hash: 239c4595
  kind: cards
  en: Rearm from about 2.6% of GDP (NATO figure for 2025) to the 3.5% core-defence target of the Hague declaration by 2035, with a coalition plan to buy 40% of equipment jointly with European partners and
    50% from Dutch or European industry.
  it: ''
- hash: e519e23c
  kind: cards
  en: 'Protect the trade-and-technology economy: keep the single market open, defend ASML''s access to the Chinese market against American pressure, and manage economic security (Nexperia) without losing
    China as a trading partner - bilateral trade was worth about EUR 90bn in 2024.'
  it: ''
- hash: f68563e0
  kind: cards
  en: 'Stay a frugal, restrictive EU member: cuts of several hundred billion euros off the 2028-34 budget with Germany, Austria, Denmark, Finland and Sweden; no eurobonds but support for defence instruments
    (SAFE, a Defence Fund); a stricter asylum line (the September 2024 request for an opt-out from the migration acquis in case of treaty change).'
  it: ''
- hash: 1a4f4769
  kind: cards
  en: 'Keep the Kingdom whole and the gas on: defend Aruba, Curaçao, Sint Maarten and the three Caribbean municipalities (foreign policy and defence are Kingdom affairs), and replace Groningen and Russian
    gas with Norwegian pipeline gas and LNG through the Eemshaven and Rotterdam terminals.'
  it: ''
- hash: 30de21c2
  kind: cards
  en: 'Host and norm entrepreneur: the Hague summit of 24-25 June 2025 (Rutte''s first as NATO Secretary General), the seats of the ICJ, the ICC and the Specialist Chambers, MH17 litigation, and a record
    of using law as a weapon - ICAO and the ECtHR found Russia responsible, and the Israeli ministers Ben-Gvir and Smotrich were declared persona non grata on 28 Jul 2025.'
  it: ''
- hash: 91c14a82
  kind: cards
  en: 'A small but high-end force built into others: three brigades attached to German divisions (the last, 13 Light Brigade to the 10th Panzer Division, on 30 Mar 2023), the 1 German-Netherlands Corps
    in Münster, BeNeSam with Belgium, F-35s with nuclear sharing, and amphibious ships jointly with the UK (a GBP 2.4bn maritime partnership signed 7 Jul 2026).'
  it: ''
- hash: 535b29e8
  kind: cards
  en: 'Ukraine as a laboratory: F-16 donation, EUR 400m for joint drone development (Oct 2024), EUR 1bn into the PURL scheme to buy US weapons, EUR 500m more for drones and air defence announced in June
    2026, a shadow-fleet inspection law in preparation. The defence minister said on 7 Jul 2026 that for new Patriot missiles ''we are at our limit''.'
  it: ''
- hash: 03b66117
  kind: cards
  en: 'Chokepoints and the port: ASML''s lithography, the Goods Availability Act (used on Nexperia, 12 Oct 2025, suspended 19 Nov 2025), the Rotterdam harbour master''s sanctions screening of shadow-fleet
    ships, and goods exports of EUR 655bn in 2025 (22% to Germany).'
  it: ''
- hash: 2876be4d
  kind: cards
  en: 'Moral and legal framing rather than propaganda: the ''viable Palestinian state alongside a secure Israel'' line, the settlement-goods ban (in force 22 Sep 2026) presented as compliance with international
    law ''not directed at Israel'', and the MH17 narrative as the case that made Russian responsibility a matter of judgments, not opinion.'
  it: ''
- hash: 9d3cc8b5
  kind: cards
  en: A minority government. The Jetten cabinet (D66, CDA, VVD; sworn in 23 Feb 2026, 117 days after the election) holds 66 of 150 seats and 22 of 75 in the Senate, the first minority cabinet without a
    support agreement since 1918, and has to find votes issue by issue - including for the 3.5% defence law and its 'freedom tax'.
  it: ''
- hash: eb30ee46
  kind: cards
  en: A divided electorate on the old questions. The PVV left the Schoof coalition on 3 Jun 2025 over asylum, the election of 29 Oct 2025 ended in a tie of 26 seats between D66 and Wilders' PVV, and Wilders
    sits in opposition; the 2025 NSC exit (22 Aug) showed that Israel policy can break a cabinet.
  it: ''
- hash: aa6adb76
  kind: cards
  en: 'Capacity limits and a shallow stock: the defence minister says the country is ''at its limit'' on new Patriot missiles for Ukraine, the NATO estimate for 2025 is 2.6% of GDP against a 3.5% target,
    and Ukraine''s air defence still depends on American Patriot missiles that the US war on Iran has made scarce.'
  it: ''
- hash: '91179823'
  kind: cards
  en: Exposure to both great powers at once. The United States dictates the semiconductor-control line (ASML's China share was about 33% in 2025 and is guided to about 20% in 2026; the MATCH Act would extend
    controls to servicing), while China showed on Nexperia that it can halt European car lines within days.
  it: ''
- hash: 7ef9a639
  kind: cards
  en: 'Geography of the Kingdom: Aruba, Bonaire and Curaçao lie under 80 km from Venezuela, a Dutch general warned that the US build-up there far exceeds counter-narcotics needs, and the Kingdom can defend
    the islands only with the small units it keeps on them.'
  it: ''
- hash: de0a0a73
  kind: cards
  en: 'Legal reach: the Dutch government can act against shadow-fleet tankers in its ports but needs new laws for ships in the exclusive economic zone, and bills were only due before the summer of 2026;
    the rest of the EU budget, migration and energy files are decided by unanimity or qualified majority with partners who differ.'
  it: ''
- hash: f5f68b97
  kind: cards
  en: Seizing Nexperia to keep chip know-how in Europe produced a Chinese export ban that nearly stopped European carmakers, a retreat (the order was suspended on 19 Nov 2025), and a Chinese Nexperia that
    in August 2026 announced its own 12-inch wafer lines and said it no longer needs Europe - the intervention accelerated the leak it was meant to prevent.
  it: ''
- hash: 31c07416
  kind: cards
  en: 'Following Washington on ASML protects the American alliance and erodes the Dutch champion: licences for the advanced DUV machines (2023) and for servicing (2024) cut China''s share of ASML sales
    from about 33% in 2025 to a guided 20% in 2026, Beijing started domestic DUV output in July 2026, and the proposed MATCH Act would make The Hague extend the controls again - the more the Netherlands
    aligns, the less the policy is its own.'
  it: ''
- hash: 78b1147c
  kind: cards
  en: The Hague summit bought the Americans' commitment and a bill The Hague cannot yet pay. The Netherlands hosted the 5% pledge, but the 3.5% core target needs EUR 16-19bn a year more than the 2% baseline,
    a minority cabinet has to fund it through a 'freedom tax' that parties from left to right criticise, and in January 2026 Trump threatened tariffs on the Netherlands over its Greenland contingent.
  it: ''
- hash: 300632df
  kind: cards
  en: Integration with Germany multiplies a small army and subordinates it. The 11th, 43rd and 13th brigades fight inside German divisions, which gives three divisions' worth of capability, but Dutch land
    power now depends on German readiness, procurement and political will - while The Hague also tells itself that deployment decisions stay national.
  it: ''
- hash: a9dc185a
  kind: cards
  en: Staying out of the Venezuela operation protected the Kingdom's position and cost its cover. The Netherlands refused US use of Curaçao and halted joint counter-drug operations in January 2026, yet
    the Kingdom's islands sit under a US build-up with a carrier about 100 km away, and the Dutch Caribbean must now guard its own waters without the partner that had been doing most of the work.
  it: ''
- hash: 9b3c1c4e
  kind: cards
  en: Pressure on Israel closes the Dutch door to the Palestinians. The entry ban on Ben-Gvir and Smotrich (Jul 2025), the settlement-goods ban (in force 22 Sep 2026) and the EU sanctions push were meant
    to protect a two-state outcome, but on 27 Sep 2026 Israel stripped the status of the Dutch diplomats in Ramallah, the Kingdom's channel to the Palestinian Authority, and in August removed Dutch staff
    from the Gaza coordination centre.
  it: ''
- hash: 269adfbe
  kind: cards
  en: Replacing Russian gas with American gas swaps one dependence for another. The EU ban on Russian gas (from 18 Mar 2026 for new contracts, complete by end-2027) is in line with Dutch policy, but the
    US was the Netherlands' largest gas supplier in 2025 (about 13% of imports, against 7% for Norway) while Washington threatens the same country with tariffs.
  it: ''
- hash: bd51056c
  kind: cards
  en: 'The Netherlands runs the grand strategy of a trading state that has no army large

    enough to protect its trade and has therefore chosen to be useful to everyone who

    does: the United States as guarantor, Germany as the other half of its land

    forces, Belgium as the other half of its navy, Britain for amphibious power, and

    Ukraine as the place where its air force, drones and legal arguments are tested.

    The cabinet''s own formula - a European pillar inside NATO - is the Luttwakian

    answer of a small power: raise the cost of leaving it alone, never the cost of

    defending it. What changed in 2025-26 is that the guarantor itself became a source

    of friction (Greenland tariffs, the Venezuela operation, the Iran war, export

    controls on ASML) and a second, equally important customer - China - showed with

    Nexperia how much leverage it holds over Dutch and European industry. The new

    government answers with money (3.5%), a softer line toward Beijing and a harder

    one toward Israel, but it governs with 66 seats. Signals that are not rows: the

    October 2025 tie between D66 and the PVV (Wilders is in opposition, the second

    largest party), the Dutch foreign minister''s March 2026 phone call with Wang Yi, the first

    since the Nexperia row, and the defence minister''s admission that Dutch aid to

    Ukraine has reached a ceiling. Open question: whether a minority cabinet can fund

    the rearmament without losing the 2025 coalition''s consensus on Ukraine.'
  it: ''
- hash: 66227a34
  kind: cards
  en: 'Deter Russia and hold NATO''s northern flank: defence spending raised every year since 2021 (NOK 65bn then, about NOK 112bn national defence in 2026, NOK 180bn with Ukraine support, 3.4% of GDP),
    plus NOK 115bn more over ten years to reach NATO''s 3.5% of GDP in 2035, spent on frigates, submarines, electronic warfare, short-range air defence and drones. The Norwegian Intelligence Service names
    Russia the biggest threat to Norway.'
  it: ''
- hash: 4a8daed5
  kind: cards
  en: 'Keep the United States and NATO engaged in the High North while building a second pillar of European allies: SDCA access to 12 agreed facilities and areas, prepositioned US Marine equipment in Norwegian
    caves, Cold Response 26 (about 32,000 troops from 14 allies, 9-19 March 2026) inside NATO''s Arctic Sentry, and a bilateral Lunna House pact with the United Kingdom.'
  it: ''
- hash: c05408a1
  kind: cards
  en: 'Make Russia lose in Ukraine: the Nansen Support Programme (NOK 85bn in 2026, of which 70bn military and 15bn civilian; extended to 2030; 274.5bn in total per the Auditor General) and a strategic
    partnership declaration signed with Zelensky in Kyiv on 23 Aug 2026; 85bn proposed again for 2027.'
  it: ''
- hash: dd92dc73
  kind: cards
  en: 'Preserve Norwegian sovereignty and the legal order in the Arctic with Russia still in it: the 1920 Svalbard Treaty read as Norwegian jurisdiction, the Barents Sea fisheries regime (2026 quotas agreed
    with Moscow in December 2025), and a working Arctic Council after Norway''s 2023-25 chairship, without normalising Russia.'
  it: ''
- hash: a14f93e8
  kind: cards
  en: 'Run the energy-and-fund model that pays for the rest: Europe''s main gas supplier (about 122 bcm exported in 2025, 31% of EU gas imports) and a sovereign fund of NOK 22.7 trillion (30 Jun 2026) that
    finances about a quarter of the state budget, with a 2027 withdrawal of NOK 608bn (2.7% of the fund) proposed.'
  it: ''
- hash: c6f271c2
  kind: cards
  en: 'Defend a rules-based order from the middle: recognise Palestine (28 May 2024), sanction violent settlers (June 2026), keep chairing the donor group for the Palestinians, refuse to join Trump''s Board
    of Peace (Jan 2026), and bind itself to the EU through the EEA and a Security and Defence Partnership without membership.'
  it: ''
- hash: 8e5034d6
  kind: cards
  en: 'Strategic partnerships written into documents rather than treaties: the Norway-Ukraine strategic partnership (23 Aug 2026), the Lunna House agreement with the UK (4 Dec 2025), the EU-Norway Security
    and Defence Partnership (2024, fifth dialogue in Oslo on 21 Apr 2026) and NORDEFCO, which Norway chairs in 2026.'
  it: ''
- hash: e801f40e
  kind: cards
  en: 'A visible refusal where the interest is the rules: Norway declined a seat on Trump''s Board of Peace (Jan 2026) because it ''calls into question the role of the UN'', while sharing the goal of peace
    in Gaza and Ukraine; it uses the AHLC chair and a NOK 1bn a year aid line to stay central on Palestine.'
  it: ''
- hash: 31cf6b06
  kind: cards
  en: 'Naming Russian and Chinese activity in public, early and in English: the annual open assessments of the Intelligence Service (Focus), PST and NSM presented together on 6 Feb 2026, and ministerial
    condemnation of GPS jamming as ''a violation of international law''.'
  it: ''
- hash: 93a02ebb
  kind: cards
  en: 'A mostly NATO-standard military built around a few high-end platforms: F-35A fighters on 24/7 quick reaction alert, five P-8A Poseidon, six Type 212CD submarines with Germany (first boat 2029), at
    least five Type 26 frigates from the UK (first 2030) and a long-range air-defence programme that starts acquisition in 2029.'
  it: ''
- hash: 0fab6c80
  kind: cards
  en: 'Energy as leverage and shield: pipeline deliveries of 114.9 bcm in 2025 (58 to Germany, 27 to the UK, 16 each to France and Belgium) and Baltic Pipe to Poland make Norway indispensable to European
    governments that would otherwise press it on policy.'
  it: ''
- hash: f64f0578
  kind: cards
  en: 'Sanctions and legal pressure on Russia at the edge of Norwegian jurisdiction: alignment with the EU''s 20th package (May 2026), CLC-insurance checks on tankers in the EEZ since August 2025, ports
    closed to Russian vessels since May 2022 with limited exceptions for fishing, and a court seizure of a Russian state vessel in Svalbard (Sept 2026).'
  it: ''
- hash: 3606bac2
  kind: cards
  en: 'The sovereign fund''s ethics machinery as soft power: exclusion of Caterpillar and five Israeli banks (Aug 2025) and Bezeq (Dec 2024), until the Storting paused ethical exclusions on 4 Nov 2025.'
  it: ''
- hash: 0ed05e3f
  kind: cards
  en: 'Geography leaves no room: Finnmark borders Russia and the Kola bases, Kirkenes airport lies about 10 km from the border and GNSS jamming from the Kola peninsula is almost daily, with the strongest
    episode on record reported in April 2026; Russia violated Norwegian airspace three times in 2025.'
  it: ''
