items:
- hash: 'a44f3dc8'
  it: |
    Contingenti stranieri sostengono la missione haitiana. La polizia keniota sta ruotando fuori e le truppe ciadiane la stanno sostituendo gradualmente, una rotazione annunciata dal ministro degli Esteri dominicano.
- hash: '2c76972c'
  it: |
    Chiudere Haiti dietro un muro garantisce a Santo Domingo un legame di sicurezza più stretto con Washington, ma la stessa agenda che la porta da Rubio mette al centro dei colloqui anche la missione haitiana, che Santo Domingo non gestisce.
- hash: '12bb205b'
  it: |
    Santo Domingo tratta Haiti come un confine da recintare e presidiare, più che come un vicino da governare, e paga parte della propria sicurezza con Washington, che la ringrazia pubblicamente e fissa l'agenda. Il muro, le truppe e le pene più severe sono la risposta visibile alla crisi del vicino, mentre la missione che potrebbe porvi fine funziona con i contingenti di altri Paesi. Grado di confidenza C per tutta la scheda: le fonti lette coprono le misure del 2025, la visita del February 2025 e la rotazione della missione nel 2026, non ancora l'economia, la Spagna, l'UE, la Cina o il blocco caraibico.
- hash: '3e59fa91'
  it: |
    Tenere il regime unito: una presidenza civile con l'esercito alle spalle. Tebboune è stato rieletto il 7 Sep 2024 con l'84.3% su un'affluenza ufficiale del 46.1%, che tutte e tre le campagne, compresa quella di Tebboune, hanno definito irregolare; il parlamento eletto in July 2026 ha avuto un'affluenza di circa il 21% dopo che circa un terzo dei candidati potenziali era stato escluso. La legittimità è fragile, quindi l'ordine poggia sull'apparato di sicurezza (la difesa assorbe il 21% della spesa pubblica) e sulle rendite degli idrocarburi; è stata segnalata in preparazione una revisione costituzionale per allungare il mandato presidenziale oltre il 2029.
- hash: '416d34c7'
  it: |
    Respingere all'ONU la rivendicazione marocchina sul Sahara Occidentale e tenere in vita il referendum sahrawi. Algeri ospita il Polisario e sostiene che la S/RES/2797 (31 Oct 2025) non ha mai approvato l'attuazione del piano di autonomia e che la MINURSO resta incaricata di organizzare un referendum; Algeri non ha partecipato al voto, finito 11-0-3.
- hash: '504d0648'
  it: |
    Restare il perno militare del Maghreb e mantenere l'equilibrio con il Marocco: il bilancio militare più grande dell'Africa (USD 21.8bn nel 2024, +12%, contro USD 5.5bn del Marocco; circa USD 25bn stanziati per il 2026), in una rivalità che lo SIPRI indica come un forte fattore delle importazioni di armi di entrambi gli Stati.
- hash: '3875b2f5'
  it: |
    Usare il gas per far entrare i partner europei alle condizioni dell'Algeria: premiare l'Italia (Transmed), tenere la Spagna su Medgaz e resistere alla pressione giuridica dell'UE sull'Accordo di associazione. L'Algeria è il terzo fornitore di gas naturale dell'UE; l'UE pesa per il 49.6% del commercio algerino, e il 93.2% di ciò che importa dall'Algeria è costituito da prodotti minerari (petrolio e gas).
- hash: 'b10423d3'
  it: |
    Strappare alla Francia il riconoscimento dei crimini coloniali senza perdere i canali migratori, di sicurezza e consolari. Una legge del 24 Dec 2025 criminalizza la colonizzazione e chiede scuse e riparazioni; nel 2026 si stanno ripristinando i contatti tra ministri, un ambasciatore e il dialogo giudiziario, mentre il giornalista francese Christophe Gleizes resta detenuto.
- hash: 'c13b9918'
  it: |
    Tenere Sahel e Libia lontani dal suolo algerino senza farsi carico delle controversie delle giunte: il drone maliano abbattuto a Tin Zaouatine (31 Mar 2025), gli ambasciatori dell'Alleanza del Sahel ritirati in April 2025, i rapporti ripristinati l'11 Jul 2026; Attaf ha ribadito in April 2026 l'integrità territoriale del Mali e i funzionari citano l'insicurezza di frontiera per il bilancio della difesa.
- hash: '1047e74f'
  it: |
    La rottura come segnale: l'ambasciatore richiamato da Parigi (30 Jul 2024) quando Macron ha sostenuto il piano di autonomia, i rapporti interrotti con il Marocco (24 Aug 2021) e con gli Emirati (10 Sep 2026); l'astensione sulla S/RES/2797 invece di un voto che non avrebbe potuto vincere; il rifiuto della mediazione americana verso Rabat («il dialogo bilaterale con il Marocco non è all'ordine del giorno», Attaf, Nov 2025) pur chiedendo, secondo quanto riferito, tempo; il patrocinio del Polisario e della Tunisia (deposito di USD 150m nel 2020, prestito di USD 300m nel 2021).
- hash: '2ae36b1f'
  it: |
    Memoria e sovranità come argomento pubblico: la legge del 24 Dec 2025 che criminalizza la colonizzazione francese; l'etichetta di terrorismo al movimento kabilo MAK e l'attribuzione pubblica di «atti ostili» a Marocco, Israele ed Emirati; i processi a Boualem Sansal (5 anni, March 2025, graziato il 12 Nov 2025) e a Christophe Gleizes (7 anni per «apologia del terrorismo»), trattati come diritto interno.
- hash: 'f7c43097'
  it: |
    Il bilancio militare più grande dell'Africa, rifornito dalla Russia (39% delle importazioni 2021-25), dalla Cina (27%) e dalla Germania (18%), con una segretezza che, secondo lo SIPRI, può nascondere accordi; un memorandum di cooperazione militare con AFRICOM (22 Jan 2025); l'esercitazione a fuoco reale «Fakhr 2026» vicino alla frontiera marocchina; l'abbattimento di un drone maliano vicino a Tin Zaouatine.
- hash: '419c90cd'
  it: |
    Il gas come premio e come sanzione: il contratto del gasdotto Maghreb-Europa attraverso il Marocco lasciato scadere (31 Oct 2021); i flussi verso la Spagna ridotti di circa il 25% nel May 2022 ma mai interrotti su Medgaz; l'Italia premiata con il vertice di July 2025; misure commerciali e aeree come punizioni (fine dei locali concessi gratuitamente all'ambasciata francese e dell'esenzione dal visto per i passaporti diplomatici del 2013, Aug 2025; accordo sui servizi aerei con gli Emirati annullato, spazio aereo chiuso agli aerei emiratini in Sep 2026).
- hash: 'b11ecbf2'
  it: |
    Sostenitori e partner diversificati invece di un blocco: Cina (il partenariato strategico globale del 2014, un programma ferroviario di 6,000 km annunciato in Aug 2023, il 27% delle importazioni di armi), Turchia (oltre USD 6bn di investimenti turchi), Egitto (memorandum Sonatrach-EGPC su greggio e prodotti, 5 May 2026), OPEC+ con la Russia e i produttori del Golfo.
- hash: '8a41af34'
  it: |
    Un'economia esportatrice basata su un solo prodotto, venduta proprio al continente che talvolta cerca di costringere: l'UE assorbe il 49.6% del commercio algerino e il 93.2% delle importazioni UE dall'Algeria è petrolio e gas. Ogni taglio è stato limitato da questo: il gas verso la Spagna ha continuato a fluire attraverso Medgaz durante il congelamento del 2022.
- hash: '44af29fa'
  it: |
    Confini ostili o instabili su ogni lato: la frontiera marocchina è chiusa dal 1994, il Mali è stato in rottura per quindici mesi (April 2025-July 2026) e il Niger e il Burkina Faso hanno ritirato i loro ambasciatori in solidarietà, mentre la Libia è divisa tra governi rivali.
- hash: 'fb1ffb34'
  it: |
    Un canale di armamenti in contrazione: le importazioni di armi sono calate del 78% tra il 2016-20 e il 2021-25, e il primo fornitore, la Russia, pesa per il 39% (48% nel periodo precedente) mentre le sue esportazioni verso l'Algeria crollano; le importazioni del Marocco, da Stati Uniti (60%) e Israele (24%), superano ora quelle algerine secondo la stima dello SIPRI, sebbene Algeri sia molto riservata sui propri accordi.
- hash: '00274a0e'
  it: |
    Legittimità fragile alle urne: affluenza del 46.1% contestata nel 2024, dopo che il dato preliminare del 94.7% era stato rivisto al ribasso, circa il 21% a July 2026; l'Hirak del 2019 costrinse Bouteflika alle dimissioni entro due mesi, poi fu soffocato dalle restrizioni anti-Covid e dalla repressione, che secondo Amnesty continua.
- hash: '985f3070'
  it: |
    Isolamento sul dossier del Sahara: la S/RES/2797 è passata 11-0-3 con l'astensione di Russia, Cina e Pakistan, senza veto da parte dei due fornitori di armi dell'Algeria nel Consiglio; il penholder, Washington, è anche il mediatore e fa pressione su Algeri perché apra il mercato alle imprese statunitensi.
- hash: '0e9e032e'
  it: |
    Pressione giuridica e fiscale da Bruxelles e Washington: la richiesta di arbitrato dell'UE sulle restrizioni commerciali e agli investimenti dell'Algeria (annunciata il 16 Jul 2025), l'inserimento dell'Algeria tra le giurisdizioni ad alto rischio di riciclaggio (June 2025) e un dazio statunitense del 12.5% (24 Jul 2026).
- hash: '1c87c70f'
  it: |
    Tagliare il gasdotto per punire il Marocco ha ridotto il raggio d'azione dell'Algeria stessa. Lasciare scadere il contratto Maghreb-Europa (31 Oct 2021) ha spostato il gas spagnolo su Medgaz; quando Madrid si è avvicinata al piano di autonomia di Rabat nel 2022, Algeri ha potuto solo ridurre i flussi (circa il 25% nel May 2022), congelare il trattato del 2002 e guardare il rifornimento proseguire. Ha riattivato il trattato nel March 2026, con la posizione spagnola sul Sahara invariata.
- hash: '2a5ce62c'
  it: |
    Più Algeri combatte all'ONU sul dossier del Sahara, più viene lasciata sola lì. Il testo su cui ha rifiutato di votare è passato 11-0-3 e indica l'Algeria tra le parti invitate a negoziare; i suoi due fornitori di armi nel Consiglio si sono astenuti invece di mettere il veto, e il penholder è ora anche il mediatore che chiede ad Algeri l'accesso al mercato. Restare fuori dal voto ha mantenuto pulita la dottrina e ha rinunciato allo spazio in cui il testo è stato scritto.
- hash: '71841f65'
  it: |
    La rivalità con il Marocco procura all'Algeria il canale di armamenti più debole. Lo SIPRI definisce la tensione un forte fattore delle importazioni di entrambi gli Stati, eppure quelle algerine sono calate del 78% mentre quelle marocchine sono aumentate del 12%: il bilancio africano più grande compra meno da un primo fornitore le cui esportazioni verso l'Algeria sono crollate, mentre Rabat aggiunge materiale statunitense e israeliano; Algeri lega Israele alle proprie accuse contro Rabat dal 2021, e i legami militari del Marocco con Israele continuano a crescere.
- hash: '030fa9c8'
  it: |
    La rottura pensata per ottenere dignità dalla Francia ha fatto perdere i canali che la rendono concreta. Le espulsioni «dodici per dodici» (April 2025) e la legge sulla colonizzazione (December 2025) non hanno spostato Parigi sul Sahara; Sansal è stato liberato grazie al presidente tedesco e non alla Francia, e nel May 2026 Algeri ha riaccolto l'ambasciatore francese e una serie di ministri francesi, mentre l'allineamento di Parigi alla Risoluzione 2797 è rimasto invariato (secondo fonti marocchine) e Gleizes è rimasto in carcere.
- hash: 'c439f55f'
  it: |
    Difendere la sovranità di frontiera è costato ad Algeri il ruolo di mediatore nel Sahel. L'abbattimento del drone maliano (31 Mar 2025) ha unito Mali, Burkina Faso e Niger contro Algeri (ambasciatori ritirati il 6 Apr 2025; il primo ministro maliano ha detto che Algeri «sponsorizza il terrorismo internazionale»), ha portato Algeri a farsi da parte nella mediazione con i tuareg e ha lasciato il nord ai mercenari russi che la stessa Algeria critica; il ripristino di July 2026 è stato annunciato senza condizioni dichiarate né alcun cenno alla ripresa della mediazione.
- hash: '7874413f'
  it: |
    Rompere con gli Emirati per fermare le ingerenze straniere ha prodotto la seconda rottura araba in cinque anni, dopo che Tebboune ha detto in July 2026 che Algeri aveva rinviato per anni una rottura per evitare di approfondire le divisioni arabe. Abu Dhabi minaccia un arbitrato sulle sue società, spera che la rottura sia temporanea e mantiene il primo consolato arabo aperto nel Sahara Occidentale (2020) come sostegno al Marocco.
- hash: '538c736a'
  it: |
    L'Algeria conduce la grande strategia di uno Stato rentier il cui esercito coincide con il regime, e i cui due antagonisti permanenti, il Marocco e la Francia, sono i due vicini che non può scegliere: uno oltre una frontiera chiusa dal 1994, l'altra oltre un mare che trasporta il suo gas, la sua diaspora e la sua memoria. L'identità di sovranità anticoloniale del 1962, il referendum sahrawi e la legge sulla colonizzazione sostituiscono i voti che non ottiene (46.1% contestato nel 2024, circa il 21% nel 2026), per cui ogni rottura è moneta interna tanto quanto politica estera. La logica paradossale si vede a ogni passo: il rubinetto pensato per punire (il gasdotto del Maghreb, la Spagna nel 2022) era anche l'unica entrata, quindi è rimasto aperto; ogni porta chiusa (il Marocco, gli Emirati, i locali dell'ambasciata francese, lo spazio aereo del Mali) toglie un posto al tavolo dove Washington, Parigi e Rabat decidono senza Algeri. Due segnali che non sono righe della scheda: Algeri non ha votato sulla risoluzione 2797 e non ha risposto alla spinta americana per colloqui con Rabat; la presunta assenza del capo di stato maggiore dal consiglio del December 2025 su una revisione che prolungava i mandati (Yabiladi, fonte unica) è una possibile crepa interna al regime. I disgeli del 2026 (Spagna, Mali, Francia) non sono una riconciliazione: sono lo Stato rentier che scopre che la sua leva è limitata dai suoi clienti. Nota di giudizio: il Marocco resta un rivale, non un avversario, secondo il test della stessa ontologia: l'obiettivo dichiarato da Algeri è l'autodeterminazione e la sicurezza sahrawi, non la sconfitta del Marocco, e l'accusa sulla Cabilia è la cosa più vicina a un'accusa esistenziale.
- hash: '2b2eff3e'
  it: |
    Vincere la battaglia sulla sicurezza con l'aiuto americano: rimuovere il divieto costituzionale di basi militari straniere (in vigore dall'epoca di Correa). Noboa, rieletto nel ballottaggio di April 2025, ha sottoposto la questione agli elettori il 16 November 2025; l'hanno respinta con circa il 60%, e tutti e quattro i quesiti referendari sono stati bocciati.
- hash: 'fd1b3f46'
  it: |
    Spezzare le bande con la forza. Il 9 January 2024, dopo un assalto armato a un'emittente televisiva in diretta e la fuga del capo di Los Choneros, Fito, Noboa ha dichiarato un conflitto armato interno contro la criminalità organizzata.
- hash: '21dbaaa1'
  it: |
    Le forze armate, dispiegate in base al conflitto armato interno dichiarato nel January 2024. Il referendum sulle basi straniere del November 2025 segna il limite: Quito voleva basi statunitensi per questa battaglia e gli elettori le hanno respinte.
- hash: '5b2553d3'
  it: |
    Commercio e transito come leva sulla Colombia: un dazio di sicurezza del 30% sulle importazioni colombiane (January 2026), portato al 100% dal 1 May 2026 e abrogato il 31 May 2026, e una tariffa di transito più alta sul greggio colombiano attraverso l'oleodotto SOTE (riportata da USD 3 a USD 30 al barile; una sola fonte in lingua spagnola, non ancora verificata con il tariffario depositato di SOTE).
- hash: 'a167710c'
  it: |
    Il legame elettrico con la Colombia: l'energia colombiana, circa l'8% della domanda ecuadoriana, è stata sospesa per sei mesi dopo il 22 January 2026 e ripresa il 5 August 2026. L'Ecuador ha abrogato i dazi al 100% il 31 May 2026, prima del ritorno dell'energia; la sequenza è riportata, il nesso di causa non è dimostrato.
- hash: 'c4e10431'
  it: |
    Nessuna base straniera con l'attuale costituzione: il voto del 16 November 2025 ha mantenuto il divieto, quindi la via delle basi statunitensi voluta da Noboa è chiusa per ora.
- hash: '294e5dba'
  it: |
    Un atto di sicurezza è costato un canale diplomatico: l'ingresso nell'ambasciata messicana a Quito nell'April 2024 per arrestare l'ex vicepresidente Jorge Glas ha portato il Messico a rompere le relazioni il 5 April 2024. Uno Stato che combatte il traffico ha rinunciato a un canale diplomatico per un solo arresto.
- hash: '0013f4f9'
  it: |
    La grande strategia dell'Ecuador è tenere unito lo Stato contro bande che ormai lo combattono come un conflitto armato, e trovare per questa lotta un patrono più forte della propria polizia e del proprio esercito. La via voluta, le basi statunitensi, è stata respinta dagli elettori nel November 2025, e gli altri strumenti usati, il blitz nell'ambasciata messicana e la guerra commerciale con la Colombia, hanno prodotto una rottura e poi una tregua. Non verificati per questa scheda: il petrolio e le banane come economia, il debito, la crisi energetica 2025-26, l'accordo di libero scambio e i prestiti cinesi, l'UE, il Perù e il dazio statunitense.
- hash: '959d9699'
  it: |
    Mantenere lo Stato solvibile e il regime al suo posto: il programma del FMI (USD 8bn, prorogato fino al 15 Dec 2026; la settima revisione, completata in July 2026, sblocca circa USD 1.77bn), il denaro del Golfo (l'accordo da USD 35bn con gli Emirati per Ras El Hekma del 2024; Alam El Roum del Qatar, USD 29.7bn), il pacchetto UE da EUR 7.4bn, e un debito di USD 164.8bn (38.9% del PIL) a fronte di riserve record di USD 55bn.
- hash: '758c9cb1'
  it: |
    Fermare lo spostamento dei palestinesi nel Sinai (la linea rossa dichiarata) e restare il mediatore indispensabile per Gaza - piano di ricostruzione, valico di Rafah, addestramento della polizia, un seggio per il capo dei servizi di intelligence Hassan Rashad nel comitato esecutivo per Gaza - mantenendo intatto il trattato del 1979 con Israele.
- hash: '39ca4658'
  it: |
    Mettere in sicurezza il Nilo: costringere l'Etiopia a un quadro vincolante sul riempimento e sul funzionamento della Grande diga del Rinascimento etiope (inaugurata in Sept 2025) e contro le altre tre dighe sul Nilo Azzurro annunciate nel March 2026, prima con la diplomazia e, in mancanza, accerchiando l'Etiopia con Eritrea, Somalia e Sudan.
- hash: '931dd3b1'
  it: |
    Tenere tranquille le due lunghe frontiere: preservare un Sudan il cui esercito resti al potere e integro (contro le RSF e i suoi sostenitori emiratini) e una Libia la cui parte orientale, sotto Haftar, resti una zona cuscinetto e sia tenuta fuori dalle linee di rifornimento delle RSF.
- hash: '5a0fb666'
  it: |
    Ricostruire il Canale di Suez e i proventi del ruolo di hub del gas: i ricavi del canale sono risaliti a USD 4.67bn nell'esercizio FY2025/26 (da USD 10.2bn nel 2023), ma sono di nuovo esposti per la presa degli Houthi sulla costa yemenita del Mar Rosso e sull'isola di Mayyun (Sept 2026); l'Egitto cerca gas da Israele (il contratto da USD 35bn per Leviathan), da Cipro (Aphrodite, Cronos) ed Eni (Zohr).
- hash: 'd5f3a8f4'
  it: |
    Restare il perno regionale senza un patrono: mantenere USD 1.3bn l'anno di finanziamenti militari statunitensi acquistando da Francia, Germania, Russia, Cina e Turchia, mediare (Gaza, US-Iran) e ospitare la Lega araba, così che nessuna capitale possa permettersi di perdere il Cairo.
- hash: 'c548c011'
  it: |
    Capacità di convocazione: il vertice arabo del Cairo del 4 Mar 2025 che ha adottato il piano egiziano da USD 53bn per Gaza in alternativa al «Riviera» di Trump; il vertice di Sharm el-Sheikh del 13 Oct 2025 co-presieduto con Trump; un seggio nel Board of Peace (accettato a Jan 2026); un ruolo di mediazione secondario nella guerra USA-Iran; e il quadrilatero di El Alamein del 4 Oct 2026 con Eritrea, Somalia e Sudan.
- hash: 'cb11cf0a'
  it: |
    Segnalazione delle linee rosse e messaggi attraverso la presidenza e il Servizio informazioni di Stato: lo spostamento nel Sinai è «la fine della causa palestinese», i dispiegamenti nel Sinai sono antiterrorismo entro i limiti del trattato, il disordine etiope è «una crisi interna» con cui il Cairo non ha «nulla a che fare».
- hash: 'ec0561f8'
  it: |
    Forze schierate come segnali: i dispiegamenti nel Sinai (riportati fino a 40,000 uomini, contestati), un contingente di caccia Rafale F3R di stanza negli Emirati contro i droni iraniani (annunciato l'8 May 2026), un contributo di 1,091 militari assegnato all'AUSSOM in Somalia nell'ambito del patto di difesa del 2024, la prima esercitazione aerea Egitto-Cina (April 2025) e la prima esercitazione navale Egitto-Turchia in 13 anni (Sept 2025), e una flotta di Rafale che il Cairo vorrebbe portare, secondo quanto riportato, a 78.
- hash: 'f57a538c'
  it: |
    Vendere la costa e il gas: accordi di cessione di terreni in cambio di denaro con Emirati e Qatar, la Zona economica del Canale di Suez per l'industria cinese (circa 200 aziende, USD 4bn), il giacimento di Zohr e l'impianto di liquefazione di Damietta come hub per il gas cipriota e israeliano, e il pedaggio del Canale di Suez come unica entrata che l'Egitto può incassare quando tornerà la pace.
- hash: '0955ea38'
  it: |
    Un'economia di guerra senza guerra: il conflitto con l'Iran del 2026 ha raddoppiato la bolletta energetica (da USD 1.2bn a gennaio a USD 2.5bn a marzo), ha imposto aumenti dei prezzi dei carburanti del 14-30% e chiusure serali, mentre il servizio del debito estero di USD 28.3bn in nove mesi e un deficit di conto corrente in peggioramento mantengono l'Egitto dipendente dal programma del FMI, che termina a December 2026.
- hash: '1b50893e'
  it: |
    Israele controlla il rubinetto del gas e il confine: Leviathan è stato chiuso nel June 2025 e di nuovo dal 2 March 2026 (produzione ripresa il 2 aprile) (le forniture all'Egitto erano circa 830 mmcf/d nel January 2026); Netanyahu ha congelato il contratto da USD 35bn in Sept 2025 per il rafforzamento nel Sinai e in seguito lo ha approvato; e Israele controlla il funzionamento del valico di Rafah.
- hash: '5437e5bc'
  it: |
    Il Mar Rosso non è affare che l'Egitto possa difendere: gli Houthi hanno preso l'intera costa yemenita del Mar Rosso e Mayyun (Perim) in September 2026, a circa 20 km dalla costa africana, dopo due anni in cui i ricavi del canale sono calati bruscamente (il FMI ha stimato la perdita del 2024 in circa USD 6bn; Al Jazeera riporta circa USD 7bn, circa il 60%); il Cairo può solo chiedere a Riad e Washington di agire.
- hash: '15089a2d'
  it: |
    Sostenitori che tirano in direzioni diverse: Riad (posizioni identiche su Yemen e Sudan, MBS al Cairo il 15 Sep 2026) e Abu Dhabi (il primo investitore straniero dell'Egitto, il sostenitore delle RSF che l'Egitto combatte in Sudan, e che si aspetta un «backup» sull'Iran); Washington (USD 1.3bn di aiuti, nessun trattato) osserva con attenzione i jet cinesi; critiche del Golfo alla neutralità del Cairo nella guerra con l'Iran.
- hash: '9384c744'
  it: |
    Uno Stato a valle: la GERD è costruita e piena, altre dighe sono in programma, e la leva dell'Egitto non è l'acqua ma il Corno d'Africa - dove l'Etiopia ora risponde con accuse di sostegno egiziano al TPLF, con l'espulsione di un diplomatico egiziano (1 Oct 2026) e con una guerra sul proprio fronte settentrionale.
- hash: 'afe7ef55'
  it: |
    Rifugiati e frontiere che non può chiudere: l'UNHCR registra circa 852,000 sudanesi in Egitto (30 Jun 2026) e il governo conta 1.5 milioni di arrivi dal 2023, con l'UNHCR finanziato al 29% dei suoi fabbisogni; il confine di Gaza resta un rischio di sfollamento.
- hash: 'e632c196'
  it: |
    Il rafforzamento nel Sinai, pensato per scoraggiare lo spostamento dei palestinesi, dà a Israele il suo argomento contro l'Egitto: Gerusalemme lo definisce una violazione dell'allegato di Camp David, Netanyahu ha congelato il contratto del gas da USD 35bn in Sept 2025 e ha chiesto a Washington di spingere il Cairo a ridimensionarlo. Lo scudo alza il prezzo dell'unica entrata (il gas) che potrebbe finanziarlo.
- hash: '1b6f424d'
  it: |
    L'hub del gas dipende dal vicino verso cui si sta raffreddando: l'Egitto vuole essere il centro di liquefazione del Mediterraneo orientale, ma il proprio approvvigionamento dipende dal gas via gasdotto israeliano, che Gerusalemme ha chiuso due volte in nove mesi per ragioni di sicurezza, costringendo il Cairo al razionamento e al GNL spot nel momento peggiore della guerra con l'Iran.
- hash: '0c677ae0'
  it: |
    Il creditore dell'Egitto è il suo rivale in Sudan: gli Emirati hanno salvato la bilancia dei pagamenti con l'accordo di Ras El Hekma (USD 35bn) e sono il primo investitore straniero dell'Egitto, eppure l'Egitto sostiene l'esercito che accusa Abu Dhabi di armare le RSF, e ha fatto pressioni su Haftar perché tagli i legami con gli Emirati. Vincere in Sudan rischia di far perdere il denaro del Golfo che mantiene solvibile il regime.
- hash: '1253eb55'
  it: |
    Contenere l'Etiopia fornisce ad Addis Abeba un argomento. L'anello formato da Eritrea, Somalia e Sudan (il patto con la Somalia del 2024, le truppe dell'AUSSOM, il quadrilatero di Alamein del 4 Oct 2026) permette all'Etiopia di definire l'Egitto un sostenitore del TPLF e un ostacolo al suo accesso al mare; l'escalation spinge l'Etiopia a completare più dighe, non meno.
