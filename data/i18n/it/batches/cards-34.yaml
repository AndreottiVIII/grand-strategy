  en: 'Double-landlocked: every export crosses at least two borders, and its portfolio of corridors (Russia, China, Afghanistan-Pakistan, Iran, the Caucasus) exists because none of them is enough. Carnegie
    reads the partner list as the answer to geography.'
  it: ''
- hash: 4ecb99b6
  kind: cards
  en: 'Downstream on a river it does not control: the Qosh Tepa canal is expected to divert an estimated 20-30% of the Amu Darya once finished (2028), there is no water treaty, and with no Central Asian
    state recognising the Taliban a legal water-use agreement is not currently possible. Tashkent''s water minister has said it will not go to war over it.'
  it: ''
- hash: fcb21c6d
  kind: cards
  en: 'The labour-for-remittances bargain with Russia: USD 18.9bn of remittances in 2025 (about 78% from Russia; 72.4% in Q1 2026), 14.4% of GDP in 2024, 1.34 million Uzbeks working in Russia on patents
    in Q1 2026, and Russia''s 2025 registry of ''controlled persons'', deportations without court review and multi-year entry bans, plus recruitment of Uzbek citizens for the war.'
  it: ''
- hash: 7aaef99d
  kind: cards
  en: 'A shrinking energy base: domestic gas output fell 15% year on year in Jan-Mar 2026 (9.6 bcm against 11.3 bcm), the country has been a net importer since 2023, Gazprom''s route through Kazakhstan
    hit its maximum technical capacity in Q4 2025, and Russia supplies more than a quarter of its gasoline just as Russian refineries fail.'
  it: ''
- hash: 7f759784
  kind: cards
  en: 'China''s weight: it overtook Russia as first trading partner in 2023 and in Q1 2026 Uzbekistan imported about USD 4.0bn from China against USD 0.64bn of exports; the railway is built by China Railways,
    financing is shared with international lenders, and Beijing and Tashkent target USD 30bn of trade.'
  it: ''
- hash: 4a99620d
  kind: cards
  en: 'Political limits on Western embrace: a presidency reset by a plebiscite limits how far Western partners can embrace it, the Jackson-Vanik amendment still limits US trade (bills S.3103 and H.R.5917
    pending, administration supportive), and WTO accession slipped past the March 2026 target while a BRICS partner status adds friction with Washington.'
  it: ''
- hash: 18ef54d3
  kind: cards
  en: It diversifies power supply into the hands of its biggest supplier. To replace falling domestic gas it imports Russian gas (6.48 bcm in 2025, a route at its technical maximum) and it builds its first
    nuclear plant with Rosatom (two VVER-1000 and two RITM-200N units on the Jizzakh site, first concrete March 2026) - so the move that cures energy scarcity deepens the dependence on the one partner whose
    hold it has been loosening.
  it: ''
- hash: 23c0889e
  kind: cards
  en: The railway that frees it from Russia chains it to China. The China-Kyrgyzstan-Uzbekistan line cuts the route through Russian territory and makes Tashkent a hub, but it is built by a Chinese contractor,
    sits under a trade pattern in which Uzbekistan buys USD 4.0bn and sells USD 0.64bn in a quarter, and gives Beijing the corridor Moscow used to hold. Diversification from a patron is also dependence
    on the next.
  it: ''
- hash: 3c756f46
  kind: cards
  en: Engaging the Taliban to make Afghanistan a corridor strengthens the upstream neighbour that is draining its river. Termez and the Hairatan line carry USD 1.7bn of trade and the railway to Pakistan,
    yet the more Tashkent treats Kabul as a normal partner without recognition, the less a binding water treaty is legally possible and the more Kabul can finish Qosh Tepa on its own timetable.
  it: ''
- hash: edefd10e
  kind: cards
  en: Remittances finance the opening and hand Moscow the lever. Migrant transfers tripled to USD 18.9bn in five years and pay for the imports that make the Chinese trade deficit bearable, but 72-78% of
    them come from Russia, which since 2025 has made the status of Uzbek workers harder (registry, deportation without court review, entry bans). Tashkent can protest ('absolutely incompatible with friendly
    relations', June 2025) but cannot retaliate without hurting its own households.
  it: ''
- hash: 97ce267b
  kind: cards
  en: 'Gold makes it rich and short of dollars. The gold price lifted reserves to a record USD 77.1bn in March 2026, but the central bank kept the metal at home: no gold exports at all in August, gold only
    12.3% of exports in Jan-Aug 2026 (35.2% a year earlier), and total exports in Jan-May 2026 down 15.5% - the security of a reserve costs the hard-currency flow that paid for imports.'
  it: ''
- hash: 946ab4e1
  kind: cards
  en: Everyone's partner, everyone's claim. Each patron announces more than Tashkent confirms (Trump's USD 35bn in three years and USD 100bn in a decade after 6 Nov 2025, with no Uzbek confirmation of the
    totals), and the memberships that please one (BRICS partner, SCO, observer in the EAEU) are reported by analysts as slowing the ones that please another (WTO accession missed the March 2026 target,
    Jackson-Vanik unrepealed). Equidistance works only while no capital forces a ranking.
  it: ''
- hash: 13cc789d
  kind: cards
  en: 'Uzbekistan is the one state in the region whose strategy is a strategy of

    position: doubly landlocked, the most populous in Central Asia and the youngest

    of the big populations (a median age near 27), it has turned its geography

    from a prison into a toll. Luttwak''s logic runs the other way from the

    great powers'' - the weak do not win by force but by being the crossing that

    several strong actors each need and none can take. Since 2016 Mirziyoyev

    has traded the Karimov-era isolation for a portfolio of partners (Carnegie''s

    word for it): rail to China, rail to Pakistan through Afghanistan, Rosatom and

    Gazprom for power, Gulf money for solar, Washington and Brussels for minerals

    and legitimacy, Seoul and Tokyo for factories, Delhi for the Indian Ocean route

    and a Treaty on Allied Relations with each Turkic neighbour that is not an

    alliance in the military sense. The 2023 constitution is the domestic hinge:

    the opening abroad is the means by which a reset presidency keeps its

    stability. The paradoxes all take the same shape - each exit from one

    dependence is an entry into another: Russian power for Russian gas, Chinese rail

    for Chinese goods, the Taliban corridor for the Taliban''s canal, remittances for

    Russia''s lever. The gold reserve is the one buffer that belongs to Tashkent

    alone, and the central bank''s decision to keep it at home tells how it

    reads the risk. Watch two signals that are not rows: the 17% of the Chinese

    railway built by August 2026 (the first real test of whether the toll works) and

    the 29-30 Oct Ankara summit of the Turkic states after Mirziyoyev''s trip to

    Ashgabat for the CIS summit (7-9 Oct, outcomes unconfirmed).'
  it: ''
