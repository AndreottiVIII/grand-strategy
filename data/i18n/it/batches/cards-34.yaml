# Translate every `en` into it. Write the translations to the file cards-34.out.yaml next to this one,
# as `items:` of `- hash: <same hash>` / `it: <translation>`, appending one item at a time (valid YAML at
# every step), never editing this file. Keep names, dates, numbers and quotes; register of a foreign-office
# brief: dry, precise, no flourish.
lang: it
items:
- hash: c6206c4c
  kind: cards
  en: Keep the recognition of Taiwan and refuse Beijing's pull. Teo's government, in office since February 2024, kept the Taipei ties after the election, ruled out a move to the PRC and dismissed a 'two-China'
    option; the Taiwan tie is the line Beijing contests.
  it: ''
- hash: ba3e660e
  kind: cards
  en: Hold Australia's security and mobility guarantees in place. The Falepili Union (in force 28 August 2024) obliges Australia to respond when Tuvalu asks for help in a major disaster, a pandemic or military
    aggression, and opens a pathway for up to 280 Tuvaluans a year.
  it: ''
- hash: 93a3ff44
  kind: cards
  en: Keep statehood in perpetuity despite sea-level rise, and carry the climate case to the UN. Pre-visit reporting of November 2025 describes a treaty framework with Taiwan to secure recognition of Tuvalu's
    statehood as the sea rises; the UN has been its platform since the 2009 Copenhagen protocol.
  it: ''
- hash: cfbc5684
  kind: cards
  en: Recognition and treaty as the two external levers. Taiwan keeps a resident embassy and put US$7.06 million into the budget in 2019; the Falepili Union requires that any new defence or security engagement
    with third parties is agreed with Canberra, the clause that makes Australia's say decisive.
  it: ''
- hash: 73455e76
  kind: cards
  en: 'Resource rents as the budget. Tuna access is the largest earner: licence receipts reached US$43 million in 2023 and about three-fifths of locally generated government income comes from tuna licences.
    The .tv domain lease is the second pillar, at about A$11 million in the 2025-26 budget projections (a secondary reading, not yet checked against the budget papers).'
  it: ''
- hash: cff71593
  kind: cards
  en: 'Volatile income. Tuna licences shrink as stocks move into international waters: receipts fell about 40% over five years, so the largest source of income is also the least stable.'
  it: ''
- hash: be79b6de
  kind: cards
  en: Donor dependence for the budget. Taiwan put US$7.06 million into the budget in 2019 (Reuters) and Australia is a major donor of aid and technical assistance (DFAT, 2019); the state cannot replace
    these funders alone.
  it: ''
- hash: 251bc1a7
  kind: cards
  en: The Falepili Union protects the state but binds the choices it most wants. Tuvalu agrees with Australia any new defence or security engagement with third parties, so a stronger treaty with Taiwan,
    or any security step outside the Australian orbit, needs Canberra's assent.
  it: ''
- hash: 2dc2c1c3
  kind: cards
  en: 'Tuvalu''s strategy is survival through recognition and treaty, not power: it keeps Taipei against Beijing''s pull, binds itself to Canberra through the Falepili Union, and turns the climate case
    into a claim to statehood in perpetuity. Its budget rests on tuna access, which shrinks as the fish move, on a .tv lease, and on donors it cannot replace, so its freedom of action is largely borrowed.
    The paradox is that the treaty which keeps the state secure also needs Australia''s agreement for any new security step, so the stronger the Taiwan ties become, the more Canberra''s assent matters.'
  it: ''
- hash: 623825aa
  kind: cards
  en: 'Stay a self-governing democracy and make an attack or blockade too costly to try: hold the status quo (Lai: the Republic of China and the People''s Republic are not subordinate to each other), offer
    talks to Beijing only on ''an equal and dignified'' footing, and build the deterrent - a defence budget of 3.32% of GDP in 2026 and a pledge of 5% by 2030.'
  it: ''
- hash: 8ebe42e4
  kind: cards
  en: 'Keep the United States committed and make that commitment cost Washington more to drop than to keep: arms (a record USD 11.1bn package notified in December 2025, a further USD 14bn awaiting Trump''s
    signature), a USD 250bn investment pledge plus USD 250bn of credit guarantees in exchange for a 15% tariff, and the Taiwan Relations Act as the legal floor.'
  it: ''
- hash: 44902f93
  kind: cards
  en: 'Stay indispensable: keep the leading edge of semiconductors and AI servers on the island while exporting enough of it (TSMC''s USD 165bn plan for Arizona) to buy goodwill. Taipei calls Lutnick''s
    target of moving 40% of the chip supply chain to the United States ''impossible'' and insists capacity at home keeps growing.'
  it: ''
- hash: db598625
  kind: cards
  en: 'Widen the circle of states that treat Taiwan as a partner: hold the 12 diplomatic allies, win Honduras back (the Asfura government is reviewing the China deals of 2023), and push ''meaningful participation''
    in international bodies through the European, Japanese, German and Australian statements of 2026.'
  it: ''
- hash: 79796c6b
  kind: cards
  en: 'Reduce the economic hostage that China holds: the United States overtook China and Hong Kong as the first export market in 2025 (AI servers), the New Southbound and India channels widen, and LNG
    is being bought from the US and Australia to dilute Qatar - while the AI-export boom makes the economy narrower, not broader.'
  it: ''
- hash: e303ebf3
  kind: cards
  en: 'Hold the home front together: divided government (a KMT-TPP majority against a DPP president) has to be managed well enough to fund the defence, keep the grid up and drill the civilian population
    - the 2025 recall votes, the 2026 budget fight and the May 2026 impeachment attempt are the tests of that.'
  it: ''
- hash: 6806ddf4
  kind: cards
  en: 'Recognition and partnership diplomacy at small scale: state visits (President Peña in Taipei, 7-10 May 2026), a joint statement with Palau, the Marshall Islands and Tuvalu (2 Sep 2026), unofficial
    offices in the Baltics and Central Europe, and a harvest of like-minded statements from Berlin, Canberra and Strasbourg. Trips abroad are the weak point: Lai''s April 2026 flight to Eswatini was cancelled
    when Seychelles, Madagascar and Mauritius revoked overflight.'
  it: ''
- hash: 57777f05
  kind: cards
  en: 'Naming the threat in law and in speech: Lai''s 17 measures of 13 March 2025 declared China a ''foreign hostile force'' under the Anti-Infiltration Act and restored military courts for espionage;
    the New Year 2026 address answered the December drills with a call for talks on equal footing; the Mainland Affairs Council answers each Beijing list or rule. The aim is to keep the democratic story,
    not the sovereignty claim, in front of Western audiences.'
  it: ''
- hash: 0172994e
  kind: cards
  en: A defence budget of NT$949.5bn in 2026 (3.32% of GDP on the NATO-style count), a 2027 proposal of NT$1.1225tn (3.01% on the new GDP base) and a special budget passed on 8 May 2026 at NT$780bn instead
    of NT$1.25tn (T-Dome and drones left out). Hardware is American (a record USD 11.1bn notified in December 2025). Han Kuang 2026 began on 5 August and ran ten days, paired with civil air-raid and urban-resilience
    drills.
  it: ''
- hash: 7a88f47a
  kind: cards
  en: 'Chips as currency: Taiwanese firms pledged at least USD 250bn of direct US investment plus USD 250bn of credit guarantees for a cut in the US tariff from 20% to 15% (January 2026) and added USD 20bn
    in September; TSMC''s own plan for the US is USD 165bn.'
  it: ''
- hash: ec5a78b2
  kind: cards
  en: 'Divided government. The KMT and TPP hold the legislature (62 of 113 seats with two independents): they blocked the special defence budget at least eight times from 2 Dec 2025, cut it from NT$1.25tn
    to NT$780bn on 8 May 2026 without T-Dome and drones, tied the rest to US letters of offer, and tried the first impeachment of a president in Taiwan''s history (56-50 for, 76 needed, 19 May 2026).'
  it: ''
- hash: '41801444'
  kind: cards
  en: A guarantor that treats the guarantee as a bargaining chip. Trump put the USD 14bn package 'in abeyance' after the Beijing summit (14-16 May 2026), called it 'a very good negotiating chip', said he
    is 'not looking to have somebody go independent', and hosted Xi in Washington on 23-25 September, where Beijing said Xi asked the US to oppose independence and the White House fact sheet did not mention
    Taiwan.
  it: ''
- hash: 6cc5edb1
  kind: cards
  en: 'Energy that a blockade would cut first: about 97% of energy is imported, gas storage covers 10-11 days, Qatar supplies about a third of LNG, and the last nuclear reactor closed in May 2025. The 23
    Aug 2025 referendum to keep Maanshan running won 74% of ballots but failed the 25%-of-electorate threshold (turnout 29.53%).'
  it: ''
- hash: 75fce79c
  kind: cards
  en: 'Diplomatic isolation and reach: 12 allies, three of them Pacific islands; Honduras (2023) and Nauru (2024) lost; the Pacific Islands Forum in Honiara (2025) excluded all dialogue partners including
    Taiwan; allies can be flown to only if third countries allow overflight.'
  it: ''
- hash: 909f013e
  kind: cards
  en: 'The PLA rehearses the siege at the edge of Taiwan''s waters: Strait Thunder-2025A (1-2 Apr 2025) and Justice Mission-2025 (29-31 Dec 2025, the closest live fire so far, with blockade of ports and
    energy targets) after Joint Sword in May and October 2024. In 2026 air activity fell by about half (1,200 aircraft in the zone from 1 Jan to 9 Aug against 2,501) while naval and coast guard presence
    stayed constant.'
  it: ''
- hash: dbe83abf
  kind: cards
  en: 'Economic concentration: the AI-server boom that put the US ahead of China as export market makes growth a bet on one product cycle, while Washington asks for 40% of the chip chain and a 100% tariff
    threatens firms that do not build in the US.'
  it: ''
- hash: f776b64c
  kind: cards
  en: The silicon shield is spent in order to be kept. Taipei pays for American attention with chips and factories (TSMC's USD 165bn, USD 250bn of pledges), but each fab built in Arizona weakens the argument
    that Washington must protect the island because it cannot do without it; Lutnick's own line is that the shield works because 'we need their silicon so badly', and his goal is to need it less.
  it: ''
- hash: 180c7a52
  kind: cards
  en: 'The more Taiwan buys, the more the weapons are a chip for others to trade. The legislature has appropriated money for a USD 11bn and a USD 14bn US package, and Trump then calls the second ''a very
    good negotiating chip'' with Xi and holds it ''in abeyance'': the commitment Taipei funds becomes the item Washington can concede.'
  it: ''
- hash: b08f40ed
  kind: cards
  en: 'Deterrence invites the punishment it is meant to prevent. Each tightening of Taiwan''s line (the ''foreign hostile force'' measures, the record arms package, the 5% pledge) is cited by Beijing as
    proof of ''independence by military means'' and followed by exercises: Justice Mission-2025 came two weeks after the December arms notification.'
  it: ''
- hash: fc8df017
  kind: cards
  en: Winning the vote and losing the budget. The 2025 recalls (31 legislators, all survived) and the 2026 impeachment (failed 56-50) left the KMT-TPP majority stronger and the president weaker; the bloc
    then cut the defence budget while KMT chairwoman Cheng Li-wun visited Xi on 10 April 2026, which put a Beijing channel to the opposition ahead of a Taipei channel to the White House.
  it: ''
- hash: 0b08f949
  kind: cards
  en: Diversifying from China concentrates on America. The US passed China as the first export market in 2025 and Taiwan has signed a tariff deal, an investment pledge and a guarantee scheme with Washington;
    the dependency that Beijing could squeeze moves to the one that Washington can renegotiate every summit.
  it: ''
- hash: c8fec480
  kind: cards
  en: Clean power policy as a blockade target. Phasing out nuclear (the last reactor closed in May 2025) left an island that runs on imported LNG with about 11 days of gas; the referendum to restart Maanshan
    failed on the threshold, so the energy base is the softest point of a state whose strategy depends on lasting out a siege.
  it: ''
- hash: 159649f2
  kind: cards
  en: 'Taiwan is Luttwak''s textbook case of a state whose survival rests on two

    things it does not control: being indispensable and a guarantor''s ambiguity.

    The first is real (the leading edge of chips and AI servers) but is traded

    away piece by piece to secure the second, and the second is now openly priced:

    the Trump administration holds a USD 14bn arms package as a negotiating chip,

    says it does not want anyone to ''go independent'', and sat down with Xi twice

    in 2026 without a word on Taiwan in the White House fact sheet. Beijing, for

    its part, has moved from the exercise to the rehearsal of a blockade (Joint

    Sword 2024, Strait Thunder 2025A, Justice Mission 2025), and from the

    president to the institutions: legal punishment of ''diehards'', a channel to

    the KMT, and cable and coast-guard pressure in the grey zone. The grade toward

    China is therefore rival and not adversary only because Taipei''s declared aim

    is to be left as it is, not to end the Chinese state, while Beijing''s aim is

    the end of Taiwan''s separateness: the pair is asymmetric on purpose. The home

    front is the third hinge: a president whose party lost the legislature, saw

    the recalls fail and the budget cut, and whose own parliament now steers part

    of the defence plan. Signals that are not rows: no PLA mega-exercise has

    followed the Washington summit, air activity is half of 2025 while ships

    stay, and Honduras has not decided. The question for 2027 is whether chips

    remain a shield or become only a price.'
  it: ''
- hash: d9c8a97d
  kind: cards
  en: 'Hold power and close the 2025 protest wave. The electoral commission declared Samia Suluhu Hassan the winner with 97.66% on 1 November 2025, after the main opposition party Chadema was disqualified
    (12 April 2025) and its leader Tundu Lissu was charged with treason. Samia called the unrest an attempted coup and defended the security forces. Two claims on the dead, not one number: the opposition
    says about 2,000 (CNN, 5 Nov 2025), the UN and rights groups say hundreds (OPB, Dec 2025); the government has published no toll.'
  it: ''
- hash: 9bea9fc6
  kind: cards
  en: Make Dar es Salaam the transit port of the region and take Uganda and DRC cargo from Mombasa. Transit reached 14.61m tonnes in 2025/26 (up 17%), with DRC cargo at 7.77m tonnes, more than half; the
    port extended free storage for Uganda- and DRC-bound cargo from 15 to 30 days. Figures are Tanzanian government data as reported; the pages were not opened.
  it: ''
- hash: 90808eee
  kind: cards
  en: 'Turn foreign capital into rail and port infrastructure on concession terms: the TAZARA railway to China''s CCECC (about USD 1.4bn, 30-year concession, signed in Beijing on 29 September 2025), and
    the Dar es Salaam port to DP World (30-year concession signed 22 October 2023, more than USD 250m at first).'
  it: ''
- hash: d72e8978
  kind: cards
  en: 'Concessions as the currency of access: the DP World port concession (initial USD 250m, up to USD 1bn over the term per Lloyd''s List as republished by Kuehne+Nagel; DP World to run four of the port''s
    twelve berths per one report) and the CCECC rail concession, with the state keeping a stake through the Tanzania Ports Authority. Both are long contracts that bind the state for thirty years.'
  it: ''
- hash: 02f90a92
  kind: cards
  en: 'A party-to-party channel with Beijing: the Julius Nyerere Leadership School, funded with USD 40m from the Chinese Communist Party International Department and the Central Party School, opened in
    February 2022. Cited under Wikipedia to the South China Morning Post, which was not opened for this card.'
  it: ''
- hash: 488be2ac
  kind: cards
  en: Security forces as the main instrument at home, and a regional force pulled back abroad. Police fired shots and tear gas at protesters who defied the curfew in Dar es Salaam (30 Oct 2025) and the
    army was deployed. Tanzania's contingent in the SADC mission in the DRC went home in 2025 after the mandate ended.
  it: ''
- hash: 8c96dbbd
  kind: cards
  en: Western money is under pressure. The European Parliament pressed for a full EU aid cut over the crackdown; a EUR 156m package for 2025 was approved in October and was pending Council and Commission
    endorsement, while OPB reports the EU suspended tens of millions of dollars in November 2025 (the two reports disagree). The State Department said in December 2025 that it was 'comprehensively reviewing'
    ties; no aid cut by the US was found. The East African warns of a sharp fall in external support in 2026.
  it: ''
- hash: '65257721'
  kind: cards
  en: Domestic legitimacy limits the big concessions. Chadema denounced the TAZARA deal as corrupt in late December 2025, questions of transparency and sovereignty were raised by analysts, and the government
    defended it as the end of years of losses (about TZS 28bn a year to keep the line running, per the government spokesman).
  it: ''
- hash: ab2fc7e9
  kind: cards
  en: The regional military reach is short. SADC leaders ended the SAMIDRC mandate on 13 March 2025 and the phased withdrawal began on 29 April, with the Tanzanian contingent going home overland through
    Rwanda, which had to consent to the transit. Tanzania cannot keep a force in eastern DRC without a regional mandate and a neighbour's agreement.
  it: ''
- hash: bdcbd123
  kind: cards
  en: The crackdown that keeps the ruling party in power costs the Western aid and legitimacy that help finance its ports and railways, and the Chinese and Gulf concessions that replace them bring their
    own opposition, which the government answers as if it were a coup.
  it: ''
- hash: fc0d844b
  kind: cards
  en: Dar es Salaam wins transit traffic with free storage and concessions, yet the non-tariff barriers Tanzania keeps against Kenya (a matchbox levy reported in May 2026 despite an East African Court of
    Justice suspension) are what feed the complaints that threaten the same East African corridor.
  it: ''
- hash: 22b0aed0
  kind: cards
  en: 'Samia Suluhu Hassan''s government has answered the 2025 election protests with the security forces and a tighter grip on the opposition, and has paid for it with the Western money that its own ports
    and railways need. It is building a transit state: Dar es Salaam takes the Uganda and DRC cargo, and the concessions to DP World and CCECC tie the infrastructure to Gulf and Chinese capital, which it
    can take in place of the aid. The test is whether that capital can replace the Western aid lost since 2025 without the price in legitimacy and in the East African trade that the same policy strains,
    and whether a regional military role is possible again once the SADC mission has gone.'
  it: ''
- hash: 08acf101
  kind: cards
  en: Keep the Museveni system and hand it on inside the family. Museveni won a seventh term (71.65%, election of 15 Jan 2026, official count as reported) and was sworn in in May 2026. His son Gen. Muhoozi
    Kainerugaba has been Chief of Defence Forces since March 2024 and announced in August 2026 a bid for the presidency in 2031.
  it: ''
- hash: 0031f5b4
  kind: cards
  en: Hold the eastern DRC frontier and the ADF ground through Operation Shujaa, a joint UPDF-FARDC campaign against the ADF launched in November 2021. Congo-focused research reads it also as protection
    of the Lake Albert oil area and of roads for Ugandan goods.
  it: ''
- hash: 231e24b4
  kind: cards
  en: Turn Lake Albert crude into export revenue through the East African Crude Oil Pipeline (EACOP), 1,443 km from Hoima to Chongoleani near Tanga. The pipeline was 79% complete at end-2025; start-up was
    targeted for 31 July 2026 and first crude from Tanga for October 2026. Neither date is confirmed in sources found.
  it: ''
- hash: 1df0289d
  kind: cards
  en: 'The UPDF as the region''s expeditionary force: special forces in Juba since March 2025; a joint campaign in eastern DRC; about 4,500 troops on the AUSSOM list in Somalia, the largest contributor.
    The army is the regime''s core and Muhoozi commands it.'
  it: ''
- hash: 6e2ad3ee
  kind: cards
  en: 'Two export earners. Gold: declared 2025 gold exports of USD 5.8bn (central bank; USD 3.3bn in 2024), a figure the UN panel puts at USD 6.4bn and above Uganda''s own output; 31 t of gold went to the
    UAE in 2024 (SWISSAID, from UN Comtrade data), and the UN finding ties much of the surplus to gold smuggled from Ituri, DRC. Oil: the EACOP corridor through Tanzania, with the Kingfisher and Tilenga
    fields as first production, the largest prospective source of export income; 79% complete at end-2025, start-up targeted for 31 July 2026 and first crude from Tanga for October 2026, neither confirmed
    in sources found. Schedule slippage is the recurrent risk.'
  it: ''
- hash: 40db56b5
  kind: cards
  en: 'Control of the domestic space, and bilateral packages abroad. At home: an internet blackout on polling day (January 2026) and the UPDF (Amendment) Act 2025, which lets military courts try some civilians
    (court challenges pending in 2026). Abroad: a trade and cooperation package with Kenya (state visit to Nairobi, July 2025) and defence talks with Rwanda (Gen. Muhoozi and President Kagame in Kigali,
    July 2026).'
  it: ''
- hash: '73233614'
  kind: cards
  en: 'Donor leverage is shrinking. The US removed Uganda from AGOA over the Anti-Homosexuality Act of 2023 (Biden notice October 2023, effective 1 January 2024); the World Bank has suspended new loans;
    the UK said it was appalled in 2023 and sanctioned Speaker Anita Among in 2024 (stated grounds: corruption). No EU sanctions on Uganda were found in 2023-26 sources.'
  it: ''
- hash: 7fb4003c
  kind: cards
  en: 'Refugees: about 2.0 million refugees and asylum-seekers, the largest population in Africa (1,999,576 at 31 March 2026, UNHCR; 2,003,369 registered by 13 April 2026, EU and OCHA update), mostly South
    Sudanese and Congolese. The 2026 UNHCR appeal was about 14% funded by 31 March 2026; asylum policy changed in February 2026 (individual status determination for all nationalities).'
  it: ''
- hash: aac2807c
  kind: cards
  en: 'Debt and the budget: public debt about 52% of GDP and about 38% of the 2025/26 budget going to debt service; multilaterals hold about 65% of external debt, China Exim about USD 2.2bn (finance ministry
    data, end-September 2025).'
  it: ''
- hash: '23096889'
  kind: cards
  en: Operation Shujaa is meant to contain the ADF, yet the UN panel reports (leaked July 2025 report) that Ugandan units expanded their presence in eastern DRC on their own initiative, forming a buffer
    that shielded M23 from counter-attacks. The 2024 panel had reported active support from some officers; Uganda denies it. The campaign that secures the border feeds the war on the other side of it.
  it: ''
- hash: d6a372fd
  kind: cards
  en: 'Uganda''s grand strategy is the survival of the Museveni system, now being handed on to Muhoozi, and it pays for that by becoming a regional security power (Juba, Somalia, eastern DRC) and the corridor
    for Lake Albert oil and for gold. The 2026 election and the 2025 military courts law show a regime that wins at home by control of information and courts while its donors cool (AGOA lost, aid thin).
    The army is its strength and its trap: each deployment that secures the regime also ties Uganda to the wars on its borders and to the gold trade the UN now traces. Refugees (about two million, largest
    in Africa) are the regional weight it cannot shed, funded at a fraction of need. Not verified for this card: Israel and Russia (only a 2019 nuclear agreement and a 2025 letter found), the 2025 US aid
    freeze beyond news reports, Turkey, Saudi Arabia and the Gulf beyond gold, and the Ebola outbreak of 2025.'
  it: ''
- hash: 5a25ee46
  kind: cards
  en: 'Survive as a sovereign state inside its internationally recognised borders: end the war without ceding the Donbas it still holds, without accepting neutrality or a change of government, and without
    recognising the annexations. Moscow''s price for talks is the withdrawal of Ukrainian forces from the rest of Donetsk; Kyiv has refused every version of it, and the General Assembly (107-12-51, 24 Feb
    2026) again wrote territorial integrity into the text of a ceasefire call.'
  it: ''
- hash: f2f73da7
  kind: cards
  en: 'Obtain a security guarantee that outlasts any ceasefire: NATO membership as the long-term aim (the 2024 Washington text calls the path ''irreversible'' but offers no invitation), and in the meantime
    the Coalition of the Willing''s Paris Declaration of 6 Jan 2026 (a multinational force after the fighting, a US-led ceasefire monitoring mechanism), which enters into force only after a ceasefire that
    Russia has not accepted.'
  it: ''
- hash: f5f8eb8f
  kind: cards
  en: 'Join the European Union: candidate since 23 June 2022, negotiations formally opened in 2024; the fundamentals cluster (15 Jun 2026) and external relations (14 Jul 2026) are open, clusters 2 and 3
    were blocked by Hungary until early October 2026 and clusters 4 and 5 are still to come. Brussels says it wants all clusters open by year-end; Hungary and others reject a fast-track.'
  it: ''
- hash: '25559007'
  kind: cards
  en: 'Keep the weapons and the money coming through 2027, and replace dependence with its own production: the EUR 90bn EU loan (EUR 60bn defence, EUR 30bn budget), NATO''s pledge of EUR 70bn for 2026 and
    at least the same in 2027, US weapons bought by allies through PURL, the IMF''s USD 8.1bn programme, and the licence to build Patriot interceptors that Trump promised at Ankara on 8 July 2026.'
  it: ''
- hash: 1a94c290
  kind: cards
  en: 'Make Russia pay and bring people back: reparations and use of frozen Russian assets (the EU loan is repaid only if Russia pays reparations), return of deported children (UNGA, 3 Dec 2025, 91-12-57),
    prisoner exchanges, and accountability for the aggression.'
  it: ''
- hash: fda74c7e
  kind: cards
  en: 'Rebuild and re-populate: the World Bank''s fifth damage assessment puts recovery at about USD 588bn over 2026-2035 (nearly three times 2025 GDP), a third or more to come from private money; 5.3 million
    Ukrainian refugees are registered in Europe and their return, together with the demography, decides whether there is an economy to rebuild.'
  it: ''
- hash: 7b6fc5b1
  kind: cards
  en: 'A coalition built on Europe and the UK: the Coalition of the Willing (Paris Declaration, 6 Jan 2026, with the US backing guarantees for the first time), a General Assembly majority for territorial
    integrity (107 votes in Feb 2026, up from 93 a year earlier), and a negotiating team led by Kyrylo Budanov, now head of the Presidential Office, that works the Witkoff-Kushner channel (Miami, 9-10 Oct
    2026) while Europe is kept in the room.'
  it: ''
- hash: 502c0e30
  kind: cards
  en: 'A new story for Washington and NATO: Ukraine as a contributor to security, not only a recipient (the Ankara summit, 7-8 July 2026), with its drone and counter-drone expertise as the product; the
    White House that rebuffed a USD 50bn drones-for-weapons offer in 2025 now says it wants to buy Ukrainian drones.'
  it: ''
- hash: e2506524
  kind: cards
  en: 'Attrition defence plus long-range strikes: Russia took 4,336 sq km in 2025 (0.72% of Ukraine) and the front is slowing in 2026, while Ukraine hits Russian energy and the Druzhba oil pipeline to cut
    Moscow''s revenue and its leverage in Hungary and Slovakia. The UK alone allocated at least 120,000 drones in 2026.'
  it: ''
- hash: eeacd3bf
  kind: cards
  en: 'Turning the minerals into a bond with Washington: the US-Ukraine Reconstruction Investment Fund (USD 150m initial capital, USD 75m from each side) signed its first critical-minerals deal, about USD
    30m, in October 2026; sanctions pressure through the EU packages; ending Russian gas transit on 1 Jan 2025.'
  it: ''
- hash: 6ff98a7c
  kind: cards
  en: 'Territory and manpower: Russia holds about 19% of the country (DeepState: 116,165 sq km at the start of 2026; Crimea 100%, Luhansk 99.6%, Donetsk 78%, Zaporizhzhia 75%, Kherson 72%) and gained 4,336
    sq km in 2025, almost double 2023 and 2024 together. Ukraine cannot retake the occupied land by force and cannot give up the unoccupied Donbas without exposing Sloviansk and Kramatorsk.'
  it: ''
- hash: f8e378f8
  kind: cards
  en: 'The state is financed by others: the EUR 90bn loan covers only two-thirds of 2026-27 budget and defence needs, a third has to be found elsewhere, and disbursement is tied to reforms and minority
    rights; direct US funding stopped in early 2025, yet about 95% of Patriot interceptors still arrive through PURL and 30% of European arms spending goes to US firms.'
  it: ''
