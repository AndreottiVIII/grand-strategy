items:
- hash: 3f375440
  it: |
    Il disgelo con Washington si paga con ciò che lo rende privo di valore. Ogni concessione statunitense (Riad, Anchorage, la bozza in 28 punti) è stata ottenuta tenendo ferma la richiesta sul Donbas, e la stessa richiesta è il motivo per cui nessuna concessione si trasforma in un accordo; entro giugno 2026 Lavrov ha accusato Rubio di fare marcia indietro, e Rubio ha replicato che l'Alaska aveva prodotto 'a proposal, not an agreement'. La leva di Mosca su Trump è la guerra; porvi fine ne esaurirebbe la leva.
- hash: 370d9821
  it: |
    Il partner che Mosca non può difendere diventa il partner che Mosca deve ripagare. L'Iran ha armato la guerra dei droni e nel giugno 2025 non ha ottenuto nulla; nel marzo 2026 la Russia forniva a Teheran intelligence per l'individuazione di bersagli contro le forze statunitensi e offriva di fermarsi solo se Washington avesse tagliato fuori l'Ucraina, uno scambio che legava gli obiettivi russi in Ucraina a una guerra che la Russia non aveva scelto. Il trattato senza clausola di difesa ha prodotto proprio l'obbligo che era stato scritto per evitare.
- hash: d394926e
  it: |
    La Russia nel 2026 conduce una grand strategy con un obiettivo fisso - un'Ucraina che non sia uno
    Stato in senso occidentale - e un insieme sempre più ristretto di mezzi per raggiungerlo. Sul piano
    tecnico e tattico la guerra procede lentamente: Kursk riconquistata, lo 0,72% dell'Ucraina guadagnato
    nel 2025, Oreshnik su Kiev. Sul piano della strategia di teatro la guerra è in stallo: il fronte avanza
    di villaggio in villaggio, il prezzo è un bilancio militare al 40%, un tasso chiave del 21% e investimenti civili
    in crollo, e la manodopera arriva da Pyongyang. Sul piano della grand strategy il quadro si rovescia,
    come Luttwak afferma che debba accadere: la mossa pensata per spingere indietro la NATO ha portato Finlandia
    e Svezia dentro e la Germania a riarmarsi; la mossa pensata per liberare la Russia dall'Occidente ha ceduto
    alla Cina il suo commercio, la sua valuta e le sue macchine utensili; le leve che tengono la Bielorussia
    hanno allontanato Armenia e Azerbaigian. L'unico successo reale dal 2025 è diplomatico - il canale
    bilaterale con Washington, da Riad ad Anchorage al piano in 28 punti - e anch'esso poggia su un paradosso: la richiesta
    sul Donbas è ciò che tiene Trump a parlare e ciò che impedisce a ogni colloquio di concludersi. Tre segnali
    che non sono righe: Ushakov ha abbandonato in silenzio lo slogan 'spirit of Anchorage' a metà 2026; la dichiarazione
    dei BRICS di Nuova Delhi ha eliminato del tutto l'Ucraina; e Vucic è rimasto lontano dalla parata del 2026
    mentre Fico è intervenuto senza assistere alla sfilata. Il punto culminante di questa guerra di logoramento è visibile
    da Mosca come da Kiev; ciò che Mosca non ha ancora deciso è se il disgelo con Washington sia un modo
    per fermarsi prima di esso o un modo per superarlo.
- hash: d5ddd9b7
  it: |
    Mantenere al potere il sistema RPF e Paul Kagame. Kagame ha vinto un quarto mandato con il 99,18% il 15 luglio 2024, dopo che la commissione elettorale e i tribunali hanno tenuto i suoi principali critici fuori dalla scheda (Ingabire, Ntaganda); ha giurato nell'agosto 2024, e il referendum del 2015 gli consente di governare fino al 2034. Nessuna fonte trovata nomina o discute un successore: la successione è la pagina non scritta della scheda.
- hash: d25f1a47
  it: |
    Eliminare la FDLR come minaccia ai propri confini, e mantenere tale missione come motivazione dichiarata per operare nel Congo. Kigali definisce i propri dispiegamenti 'defensive measures' e afferma che restano finché Kinshasa non neutralizzerà la FDLR; Kagame ha detto a Jeune Afrique (aprile 2026) che essi comprendono 'troop deployments and operations beyond its territory'. Gli Accordi di Washington (4 dicembre 2025) legano il disimpegno ruandese alle operazioni congolesi contro la FDLR, e il 13 ottobre 2026 gli Stati Uniti hanno chiesto a Kinshasa di accelerarle (oltre 120 ex combattenti e familiari rimpatriati con l'aiuto dell'UN).
- hash: 724cb558
  it: |
    Mantenere una posizione decisiva nei Kivu attraverso la RDF e l'AFC/M23. Il gruppo di esperti UN ritiene che il Ruanda eserciti comando e controllo su M23 e giudica che il 'final objective' di Kigali riguardi il territorio e le risorse; AFC/M23 e la RDF hanno preso Goma (27 gennaio 2025), Bukavu (febbraio 2025) e Uvira (10 dicembre 2025, sei giorni dopo gli Accordi di Washington; evacuata entro febbraio 2026). Kigali nega di sostenere M23 e afferma che l'AFC 'is not a proxy'.
- hash: b30b3b76
  it: |
    Far pagare a Washington la pace in minerali e migranti invece di punire la guerra: l'accordo di pace di Washington (27 giugno 2025) e gli Accordi (4 dicembre 2025), con il loro quadro di integrazione economica regionale e un quadro sui minerali strategici con gli Stati Uniti, e l'accettazione di fino a 250 deportati statunitensi (agosto 2025). È la logica dei minerali in cambio di sicurezza. Kigali rifiuta il ritiro 'immediate and unconditional' che il rappresentante statunitense ha chiesto al Consiglio di sicurezza il 13 ottobre 2026.
- hash: f2216216
  it: |
    Vendere sicurezza all'estero per comprare immunità in patria. Circa 6.300 militari e poliziotti sono presenti a Cabo Delgado (Mozambico) dal 2021, l'area in cui il progetto LNG da 20 miliardi di USD di TotalEnergies è ripartito nel gennaio 2026; il sostegno EU da 20 milioni di EUR nel quadro dell'European Peace Facility è terminato nel maggio 2026, e Kigali afferma che ora è il Mozambico a pagare. Il Ruanda gestisce inoltre una forza bilaterale nella Repubblica Centrafricana ed è un grande contributore di peacekeeper UN e AU; un accordo del 2022 per inviare 350 militari in Benin è stato concordato, ma nessun dispiegamento è confermato.
- hash: 308bb02e
  it: |
    Vivere senza aiuti e con un portafoglio di coperture. Le sovvenzioni estere scendono a circa il 7% del bilancio 2026/27 (8,3% nel 2025/26, 12,7% l'anno precedente); l'IMF ha approvato un programma di 38 mesi per circa 250 milioni di USD l'8 giugno 2026; le esportazioni d'oro hanno raggiunto 1,5 miliardi di USD nel 2024 (88% dei proventi minerari); Qatar Airways ha rilevato il 60% dell'aeroporto di Bugesera (2019); la Cina (scambi per 849 milioni di USD nel 2025, cifra dei media ruandesi) e la Russia (cooperazione nucleare, incontri con Lavrov a dicembre 2025 e aprile 2026) sono i contrappesi alla condizionalità occidentale.
- hash: 34f481c8
  it: |
    Firmare tutto, concedere poco. Kigali ha apposto la propria firma sull'accordo di pace di Washington (27 giugno 2025) e sugli Accordi (4 dicembre 2025), accetta il percorso di Doha tra Kinshasa e AFC/M23 come semplice osservatore, ha ristabilito le relazioni con il Belgio il 22 settembre 2026 tramite un canale qatariota, e mantiene stretti i rapporti con la Francia (Macron-Kagame all'Eliseo l'11 settembre 2026, un memoriale del genocidio inaugurato in Francia a giugno). Respinge in blocco le conclusioni degli esperti UN (Kagame, 4 luglio 2025: i rapporti erano 'written long ago') e usa Qatar, Cina e Russia per mostrare di non essere isolato.
- hash: 39fc4085
  it: |
    La memoria del genocidio come dottrina. Kwibuka 32 (aprile 2026) è stato presentato come 'Rwanda will not die twice'; la stampa governativa sostiene che la memoria è uno strumento di sopravvivenza e di sicurezza che non può dipendere dalla clemenza altrui; in sede di Consiglio di sicurezza Kigali pone la FDLR, una forza fondata dai resti dei responsabili del 1994, al centro di ogni dibattito sul Congo. La stessa memoria copre la negazione che il Ruanda comandi M23 e la presentazione dell'AFC come movimento congolese legato a Kabila (Kagame, aprile 2026).
- hash: aab7d31b
  it: |
    La Rwanda Defence Force come strumento dell'intera strategia. Gli esperti UN hanno contato 3.000-4.000 militari della RDF nel Congo orientale (rapporto del 2024, nessuna cifra nuova nel 2025), che orientano le decisioni di M23 su quali territori occupare o abbandonare (il ritiro dell'aprile 2025 da Walikale) e che forniscono equipaggiamenti, inclusi sistemi di difesa aerea; un secondo fronte dello stesso esercito si trova a Cabo Delgado (circa 6.300 con la polizia) e un terzo nella Repubblica Centrafricana. Il 2 marzo 2026 gli Stati Uniti hanno sanzionato la RDF e quattro alti ufficiali.
- hash: 6a3a1aaf
  it: |
    Il canale minerario e lo snodo di esportazione. Oro (1,5 miliardi di USD nel 2024), stagno, tungsteno e tantalio (esportazioni in aumento del 46% nel 2025) transitano per il Ruanda; gli esperti UN affermano che il coltan saccheggiato nelle miniere controllate da M23 viene introdotto di contrabbando e presentato come produzione ruandese, e il Tesoro statunitense afferma che Kabarebe coordina le esportazioni. L'EU ha sanzionato il responsabile del Rwanda Mines, Petroleum and Gas Board e la raffineria d'oro Gasabo il 17 marzo 2025; imprese con sede negli Emirati continuano a importare oro ruandese. Un secondo braccio economico è la fornitura di sicurezza legata allo Stato (secondo quanto riportato: Isco Segurança sorveglia il sito Total).
- hash: cc240649
  it: |
    Sanzioni e condizionalità arrivano ora da tutti i partner occidentali insieme: gli Stati Uniti (Kabarebe, 20 febbraio 2025; la RDF e quattro ufficiali, 2 marzo 2026), l'EU (17 marzo 2025, consultazioni sulla sicurezza sospese, il MoU sulle materie prime 'under review', sostegno EPF terminato nel maggio 2026), il Regno Unito (aiuti bilaterali sospesi nel febbraio 2025, addestramento alla difesa sospeso). L'effetto è limitato perché le sovvenzioni valgono circa il 7% del bilancio; è acuto dove colpisce la RDF, la risorsa che Kigali cede a pagamento.
- hash: 74f475c8
  it: |
    Un'economia senza sbocco sul mare che ha bisogno dei porti e delle strade dei vicini. Circa il 70% del traffico merci ruandese è passato per Dar es Salaam nel 2018 (stime successive della stampa parlano dell'80% delle importazioni; il resto da Mombasa), eppure i rapporti tra Ruanda e Tanzania sono descritti come 'on the rocks'; il confine con il Burundi è chiuso dal gennaio 2024 e quello con l'Uganda è rimasto chiuso dal febbraio 2019 al 2022.
- hash: 914a6a11
  it: |
    Un arco ostile attorno alla zona cuscinetto. Il Burundi schiera circa 20.000 militari nel Kivu del Sud secondo il conteggio di Kigali e, insieme all'esercito congolese, combatte RED-Tabara e la coalizione AFC/M23-RDF; il presidente del Burundi ha detto alla BBC (marzo 2025) che il Ruanda pianificava un attacco. L'Uganda, l'altro patrono esterno nei Kivu e nell'Ituri, è un rivale più che un alleato: gli esperti UN affermano che la UPDF ha costruito nel Kivu del Nord e nell'Ituri una zona cuscinetto che ha protetto M23.
- hash: 6c10b0c1
  it: |
    L'esportazione di sicurezza vive con i soldi altrui. I 20 milioni di EUR dell'EU nel quadro dello European Peace Facility sono terminati nel maggio 2026 e la portavoce di Kigali afferma che il costo reale è molto più alto; il finanziamento sostitutivo del Mozambico è un'affermazione di Kigali, senza importo né condizioni dichiarati; il Ruanda stesso ha minacciato nel marzo 2026 di ritirarsi se il finanziamento non fosse stato sostenibile. La forza su cui si regge il sito di TotalEnergies è la forza che gli Stati Uniti hanno sanzionato.
- hash: e1516c58
  it: |
    Un unico mediatore tiene insieme premio e punizione. Washington ha mediato gli Accordi, riceve minerali e migranti, e insieme sanziona la RDF e dichiara al Consiglio di sicurezza (13 ottobre 2026) che il Ruanda 'must immediately and unconditionally withdraw'. Il percorso di Doha, presieduto dal Qatar, è l'altra metà dell'accordo, e Kigali non vi ha un seggio.
- hash: 687b5834
  it: |
    Un regime personalizzato in uno Stato piccolo: la legittimità poggia sulla memoria del 1994 e su un uomo solo, l'opposizione è stata esclusa dalla scheda del 2024, e nessuna fonte trovata riporta un successore o un meccanismo di successione. Ogni shock a Kagame è uno shock per l'intera strategia.
- hash: 92bc874d
  it: |
    L'esercito che si vende all'estero per comprare immunità è l'esercito che l'Occidente ora sanziona. Dopo che gli Stati Uniti hanno designato la RDF (2 marzo 2026), Nduhungirehe ha minacciato su X di ritirare la forza ruandese da Cabo Delgado, che protegge il progetto TotalEnergies: Kigali ha usato i propri clienti come ostaggi a difesa di sé, e l'EU, finanziatrice della missione in Mozambico, ha smesso di pagare a maggio. Le esportazioni di sicurezza dovevano comprare buona volontà a Parigi, Maputo e Washington; sono diventate la leva con cui Kigali viene sanzionata e, se mettesse in atto la minaccia, con cui perderebbe quella buona volontà.
- hash: 9e1b41b6
  it: |
    La memoria che protegge il Ruanda si consuma ogni volta che giustifica una guerra. 'Never again' e la FDLR danno a Kigali il credito morale presso l'Occidente e la motivazione dichiarata per tenere il terreno nei Kivu; gli esperti UN leggono le stesse operazioni come una spinta verso territorio e minerali, e gli Stati Uniti ora considerano le 'defensive measures' una violazione. Più il genocidio viene invocato per spiegare Goma e Bukavu, più l'invocazione diventa a buon mercato presso gli interlocutori la cui colpa avrebbe dovuto restare viva.
- hash: 62e5ec04
  it: |
    La zona cuscinetto allarga il fronte che doveva accorciare. L'avanzata nel Kivu del Sud ha portato M23 a Uvira, sul confine burundese, sei giorni dopo gli Accordi di Washington; il Burundi ha risposto con circa 20.000 militari (secondo il conteggio di Kigali), ha chiuso i valichi e ha irrigidito un confine già chiuso al Ruanda, mentre gli esperti UN registrano combattenti di RED-Tabara e FNL che si uniscono alla coalizione AFC/M23-RDF vicino a Sange. Una politica di sicurezza costruita sulla minaccia della FDLR ha prodotto un secondo Stato nemico.
- hash: b718a0a7
  it: |
    L'accordo che doveva comprare immunità è diventato il metro della punizione. Il Ruanda ha firmato gli Accordi di Washington il 4 dicembre 2025; le forze di M23 sono entrate a Uvira il 10 dicembre, e il 2 marzo 2026 gli Stati Uniti (misura annunciata dal Dipartimento di Stato e designata dall'OFAC) hanno sanzionato la RDF, affermando che M23 aveva preso Uvira 'in clear violation of the Washington Accords'. Firmando, Kigali ha consegnato a Washington un testo con cui misurare la propria condotta, e il quadro sui minerali che avrebbe dovuto ricompensarla è legato allo stesso testo.
- hash: 1a1fa934
  it: |
    La rendita mineraria che finanzia l'indipendenza attira le sanzioni che la minacciano. Le esportazioni minerarie (oro, 1,5 miliardi di USD nel 2024) sono la risposta al calo delle sovvenzioni, ma gli esperti UN rintracciano coltan e oro congolesi di contrabbando attraverso il Ruanda; l'EU ha sanzionato il responsabile del consiglio minerario e la raffineria d'oro Gasabo (17 marzo 2025) e ha messo in revisione il MoU sulle materie prime del 2024, e il Tesoro statunitense indica Kabarebe come gestore dei proventi. Lo stesso commercio che sostituisce gli aiuti richiama l'attenzione dei donatori e delle sanzioni, che Kigali può permettersi meno.
- hash: dbf596ea
  it: |
    La negazione protegge l'accordo e lo blocca. Kigali nega di comandare M23 (l'AFC 'is not a proxy', Kagame, aprile 2026), mentre il suo ministero degli Esteri presenta le controffensive di AFC/M23 come 'forced responses' e Kagame riconosce 'operations beyond its territory'. La negabilità tiene Washington al tavolo, ma la clausola di ritiro degli Accordi non può essere verificata, e dunque non può essere chiusa, nei confronti di una forza la cui esistenza è ufficialmente negata.
- hash: 6929b1cd
  it: |
    Il Ruanda è lo Stato piccolo di Luttwak che trasforma la propria vulnerabilità in un'offensiva regionale e poi vende sicurezza all'estero per comprare immunità in patria. La vulnerabilità è reale - uno Stato senza sbocco sul mare costituito dai sopravvissuti del 1994, con i successori dei responsabili (la FDLR) al confine e un esercito congolese che li ha utilizzati - e Kigali ne ha fatto il pretesto per una difesa avanzata nei Kivu, condotta attraverso la RDF e l'AFC/M23 (esperti UN: comando e controllo; Goma, Bukavu, Uvira). Il surplus creato dall'offensiva viene speso due volte: in patria come rendita (oro, stagno, tantalio, transito di minerali) che sostituisce gli aiuti in calo, e all'estero come servizio (Cabo Delgado, la Repubblica Centrafricana, le missioni UN) che fa sì che l'Occidente, Parigi, Maputo e ora Washington abbiano bisogno dell'esercito che sanziona. Gli Accordi di Washington del 4 dicembre 2025 sono stati l'espressione più compiuta di questa logica: pace in cambio di minerali, deportati e buona volontà. Ma l'accordo è diventato un metro di misura: gli Stati Uniti hanno sanzionato la RDF il 2 marzo 2026 e il 13 ottobre 2026 hanno chiesto il ritiro incondizionato, l'EU ha smesso di pagare per il Mozambico, e l'offensiva ha prodotto un secondo avversario in Burundi. Il paradosso di Luttwak morde più forte nella memoria: il genocidio è insieme il capitale morale che compra immunità e ciò che l'offensiva consuma. Il grado nei confronti della DRC è rivale, non avversario: l'obiettivo dichiarato di Kigali è la sicurezza e la leva, non la fine dello Stato congolese, e Kigali ha firmato un accordo con Tshisekedi; la FDLR è il vero avversario, e l'AFC/M23 lo strumento. Non verificati per questa scheda: il testo degli Accordi di Washington (letto attraverso la stampa), un rapporto 2026 degli esperti UN, il numero di militari della RDF nel 2026, il dispiegamento in Benin (l'accordo del 2022 è documentato, il dispiegamento no), la politica ruandese verso Kenya e Tanzania nel 2026, lo SOFA del Mozambico riportato per l'agosto 2025, e qualsiasi meccanismo di successione.
- hash: edaa9186
  it: |
    Tenere il regno, la sua capitale e il suo sistema petrolifero fuori dalla linea del fuoco. Dal 28 febbraio 2026 missili e droni iraniani, milizie irachene e ora gli Houthi hanno colpito Riad, Ras Tanura, Yanbu e gli aeroporti meridionali; Riad vuole che la guerra con l'Iran finisca a condizioni che riaprano Hormuz, un fronte Houthi che possa chiudere, e nessuna ripetizione degli attacchi agli aeroporti dell'8-10 ottobre 2026, che hanno ucciso almeno 13 persone e ferito circa 300 a Riad.
- hash: 1dc64ad0
  it: |
    Realizzare la trasformazione Vision 2030 mentre i fondi si restringono: un bilancio 2026 pianificato con un deficit di 165 miliardi di SAR (3,3% del PIL, in calo dal 5,3% del 2025), una strategia PIF 2026-2030 approvata il 15 aprile 2026 che taglia e riconfigura i megaprogetti (The Line congelata fino a dopo il 2030) e sposta il peso su industria, minerali, IA e turismo, con Expo 2030 e i Mondiali 2034 come date fisse.
- hash: cf108fe9
  it: |
    Tenere gli Stati Uniti come garanti costruendo una seconda linea di difesa che non dipenda da loro: uno Strategic Defense Agreement con gli Stati Uniti, lo status di major non-NATO ally, un impegno sugli F-35 e un accordo nucleare civile '123' in attesa al Congresso, accanto all'accordo di difesa reciproca con il Pakistan di settembre 2025 (circa 8.000 militari pakistani nel regno), al patto di La Mecca con Turchia e Pakistan dell'agosto 2026 e a un accordo anti-drone con l'Ucraina.
- hash: ac4d622f
  it: |
    Trasformare il petrolio in entrate e leva in condizioni di guerra: mantenere la disciplina dell'OPEC+ (i sette membri principali hanno congelato la produzione per novembre il 4 ottobre 2026), far passare il greggio intorno a Hormuz attraverso l'oleodotto Est-Ovest (5,8 mb/g riportati il 6 ottobre) e mantenere il dividendo Aramco (21,9 miliardi di USD dichiarati per il secondo trimestre 2026) a finanziare lo Stato.
- hash: 807544df
  it: |
    Definire l'ordine intorno al regno: un Mar Rosso e un Bab el-Mandeb a guida saudita (coalizione marittima di 14 Stati con sede nel regno, 30 luglio 2026), un governo yemenita amico nel sud e la parte degli eserciti in Sudan, Siria e Libano, sotto Stati e non milizie, e la Palestina alle condizioni di Riad: un percorso a due Stati copresieduto con la Francia, normalizzazione con Israele solo dopo la piena statualità.
- hash: d768a492
  it: |
    Impedire agli UAE di costruire un polo rivale nel Golfo a spese dell'Arabia Saudita in Yemen, Sudan e nel Corno d'Africa, senza rompere il GCC: Riad ha costretto lo STC, sostenuto dagli UAE, a ritirarsi e ha fatto uscire le forze emiratine dallo Yemen tra dicembre 2025 e gennaio 2026, poi è passata a una dimostrazione pubblica di unità tra luglio e ottobre 2026, mentre gli Emirati lasciavano l'OPEC (1° maggio 2026).
- hash: c6c5585e
  it: |
    Capacità di convocazione intorno al regno: la coalizione marittima del Mar Rosso a 14 Paesi (hanno partecipato 43 Stati e l'EU), la riunione d'emergenza dei leader del GCC a Gedda (aprile 2026), la copresidenza con la Francia della conferenza di New York sui due Stati (luglio 2025), l'ospitalità del secondo vertice EU-GCC (24 ottobre 2026) e un seggio nel Quad sul Sudan. Una rete di difesa con Pakistan e Turchia (Makkah Joint Defense Agreement, 7 agosto 2026).
- hash: 829b6f78
  it: |
    La linea ufficiale è la de-escalation con la promessa di una risposta: il ministero della Difesa ha dichiarato il 29 luglio 2026 che il regno 'does not seek escalation but will respond to any aggression', il ministero degli Esteri ha avvertito l'Iran che avrebbe 'bear the heaviest consequences', e i media di Stato hanno presentato gli attacchi in Iraq come una risposta coordinata con CENTCOM ai droni delle milizie. Riad smentisce le notizie secondo cui il principe ereditario avrebbe sollecitato l'attacco statunitense-israeliano contro l'Iran.
- hash: f9bf5318
  it: |
    Un regno che ora combatte: la campagna aerea della coalizione in Yemen (82 siti Houthi rivendicati a Saada, Hodeidah, Jawf e Marib), attacchi congiunti sauditi e statunitensi contro milizie irachene (29 luglio 2026) e i precedenti attacchi sauditi riportati contro obiettivi legati all'Iran, profondità strategica importata (Pakistan: circa 8.000 militari, uno squadrone di JF-17 e una batteria cinese HQ-9 alla King Abdulaziz Air Base, interamente pagati da Riad; supporto tecnico turco) e know-how ucraino nel contrasto ai droni.
- hash: c79acf08
  it: |
    Diplomazia dell'assegno e potere di mercato: 600 miliardi di USD di investimenti promessi a Trump nel maggio 2025 (portati verso 1.000 miliardi di USD nel novembre 2025), il più grande pacchetto di armi statunitensi mai registrato (circa 142 miliardi di USD annunciati), 1 miliardo di USD al Gaza Board of Peace, un pacchetto da 6,4 miliardi di USD per la Siria e altri nel febbraio 2026, aiuti a Eritrea e Gibuti, e l'arma petrolifera attraverso l'OPEC+ e le offerte di carico di Aramco al di fuori di Hormuz.
- hash: 18fa031c
  it: |
    Geografia: la costa del Golfo carica la maggior parte del greggio e l'Iran può chiudere Hormuz. La produzione è calata di circa un quarto nel secondo trimestre 2026 anche con il petrolio a 108 USD; l'oleodotto Est-Ovest (capacità nominale 7 mb/g, 5,8 mb/g riportati) e gli ormeggi di Yanbu sono l'unica uscita, e un attacco di droni all'oleodotto nel 2026 ha mostrato che la via di aggiramento è essa stessa un bersaglio.
- hash: d21a735d
  it: |
    Denaro: un deficit del primo semestre 2026 di 160 miliardi di SAR, pari al 97% del piano annuale (il solo secondo trimestre 34,3 miliardi di SAR, ridimensionato dal prezzo del petrolio in tempo di guerra), un indebitamento previsto a 217 miliardi di SAR e un'economia ridotta dalla guerra. Il regno non può finanziare insieme NEOM, l'impegno per Gaza, la Siria e una guerra.
- hash: 857c9609
  it: |
    Difesa aerea che non ha retto: l'aeroporto King Khalid di Riad è stato colpito l'8 e il 10 ottobre 2026 e vi è rimasto chiuso, e il regno acquista intercettori dall'Ucraina e ha fatto arrivare una batteria cinese HQ-9 insieme al contingente pakistano.
- hash: 55657dcc
  it: |
    Un garante che non è un alleato vincolato da trattato: gli Stati Uniti hanno concesso al regno uno Strategic Defense Agreement e lo status di non-NATO ally nel novembre 2025, ma nessun trattato di difesa reciproca; non lo hanno consultato sulla guerra del febbraio 2026, e l'accordo nucleare 123 attende un voto del Senato dopo le elezioni di metà mandato e prima del 13 dicembre 2026.
- hash: e7f8f155
  it: |
    Divisione nel Golfo: gli UAE hanno definito la risposta del GCC in tempo di guerra 'the weakest in history', hanno lasciato l'OPEC il 1° maggio 2026, sostengono la parte opposta in Sudan e non hanno firmato la dichiarazione della coalizione del Mar Rosso; neppure l'Oman. La sfera saudita è una coalizione dei volenterosi, non il GCC.
- hash: 920d69fe
  it: |
    Il vincolo palestinese: la linea pubblica saudita dal 2024 è nessuna relazione con Israele senza uno Stato palestinese entro i confini del 1967; i funzionari israeliani escludono uno Stato, e il CSIS constata che nessun incentivo statunitense ha spostato Riad. La guerra con l'Iran ha aumentato il costo di una vicinanza visibile a Israele.
- hash: 37174eac
  it: |
    La guerra che riempie il tesoro svuota i barili. L'utile di Aramco nel secondo trimestre è salito del 33% e il prezzo di guerra (circa 108 USD) ha ridotto il deficit del primo semestre, eppure la produzione è calata di circa un quarto e le spedizioni verso la Cina si sono attestate a un minimo storico di 333.000 b/g a giugno, contro 1,39 mb/g nel 2025. Riad ha bisogno che la crisi sia già scontata e conclusa.
- hash: 2f37d8c0
  it: |
    Spingere gli UAE fuori dallo Yemen ha lasciato Riad sola con gli Houthi. La campagna del dicembre 2025-gennaio 2026 contro lo STC sostenuto dagli UAE ha allontanato le forze emiratine e i separatisti del sud, ma gli Houthi hanno poi preso la costa occidentale fino a Bab el-Mandeb, hanno dichiarato un blocco navale (20 luglio 2026) e hanno colpito quattro aeroporti sauditi in ottobre; Riad ora chiede aiuto a Turchia, Pakistan e persino Damasco.
- hash: 3d2bac3a
  it: |
    Vision 2030 ha bisogno di una regione tranquilla, e il regno ora colpisce tre Paesi. La distensione con l'Iran del 2023, mediata a Pechino, ha assicurato la calma di cui hanno bisogno turismo, Expo 2030 e investimenti esteri; una volta che i droni iraniani hanno colpito Ras Tanura e Riad, l'Arabia Saudita ha espulso ufficiali iraniani (21 marzo), ha bombardato milizie in Iraq (29 luglio) e sostiene l'offensiva yemenita, e il suo aeroporto simbolo è chiuso.
