# Translate every `en` into it. Write the translations to the file cards-28.out.yaml next to this one,
# as `items:` of `- hash: <same hash>` / `it: <translation>`, appending one item at a time (valid YAML at
# every step), never editing this file. Keep names, dates, numbers and quotes; register of a foreign-office
# brief: dry, precise, no flourish.
lang: it
items:
- hash: f04bbb41
  kind: cards
  en: 'The switch bought a second patron, and the treaty capped it. The January 2024 move to Beijing was followed by a treaty that gives Australia an effective veto over any Chinese role in Nauru''s security,
    banking and telecoms: the price of the new tie was a ceiling set by the old patron.'
  it: ''
- hash: a7cc321b
  kind: cards
  en: Nauru has a small economy, and its budget and its migration business come from Canberra; its one lever outside Australia is the seabed sponsorship, which waits on rules the International Seabed Authority
    has not written. The January 2024 switch from Taipei to Beijing shows that recognition is sold to whoever pays, but the December 2024 treaty capped the new patron by giving Australia a veto over security,
    banking and telecoms. Nauru therefore sells to several buyers while Canberra keeps the veto, and the Regional Processing Centre is at once its economy and its lever.
  it: ''
- hash: ea4fcbec
  kind: cards
  en: 'Survive as an armed organisation with its weapons. Hamas accepted the Board of Peace roadmap on 30-31 Jul 2026 and says it will hand heavy weapons to a Palestinian authority, but it rejects the disarmament
    clause as written: the 3 Apr 2026 framework (a gradual handover over eight months tied to IDF withdrawal) was largely refused in May and countered with a handover that ends in a Palestinian state. Disarmament
    has not begun.'
  it: ''
- hash: b65a364b
  kind: cards
  en: 'Stay a political actor in Gaza after it stops being its administrator: hand civil government to a technocratic body (the National Committee for the Administration of Gaza, 15 members under Ali Shaath,
    still waiting in Cairo) and announce the dissolution of its own government (6 Jul 2026), while keeping its security apparatus, its police and its social networks. It accepted a technocratic body already
    on 3 Oct 2025.'
  it: ''
- hash: 29b240f9
  kind: cards
  en: 'End the war on its own terms: a permanent ceasefire, full Israeli withdrawal from the Yellow Line (Israel holds about 60% of the Strip in Oct 2026), the reopening of Rafah, 600 aid trucks a day and
    reconstruction - and the claim that Palestinians ''defeated'' Israel''s war aims.'
  it: ''
- hash: a00d2cdb
  kind: cards
  en: 'Replace the PLO and the Palestinian Authority as the representative of the Palestinians: the Beijing Declaration of 23 Jul 2024 (14 factions, a transitional unity government), a bid to join the PLO,
    a national bloc with Democratic Reform (Dahlan), Islamic Jihad and the PFLP for the legislative elections that Abbas postponed on 10 Oct 2026 to Sep 2027.'
  it: ''
- hash: 1b76de3a
  kind: cards
  en: 'Keep a safe leadership base abroad and a patron network that outlives the Gaza fighting force: the political bureau in Doha (since 2012), Istanbul, Cairo; Khalil al-Hayya, elected head of the bureau
    on 20 Jul 2026 against Khaled Meshaal, runs both the negotiation and the foreign relations.'
  it: ''
- hash: ebeaf52f
  kind: cards
  en: 'The standing aim: ending Israel and ''expelling the occupation'' from all of historic Palestine. Hayya hailed 7 Oct as a ''military accomplishment'' on 15 Jan 2025 and said in Apr 2024 that a state
    on the 1967 lines would only be a temporary stage, since Palestinians keep their ''historic right to all Palestinian lands''.'
  it: ''
- hash: 95ae3238
  kind: cards
  en: 'Mediated bargaining through Qatar, Egypt and Turkey (guarantors of the 9-10 Oct 2025 Sharm el-Sheikh deal) and direct channels to Cairo (Hayya-Rashad) and, once, to Washington (Adam Boehler in early
    2025). Its replies are always ''yes, but'': the 3 Oct 2025 answer accepted hostages and a technocratic body and left out disarmament; the 30-31 Jul 2026 answer accepted the roadmap and tied it to Israeli
    withdrawal.'
  it: ''
- hash: 90ce2ce5
  kind: cards
  en: 'Messaging through Al Jazeera and Hamas spokesmen (Hazem Qassem, Basem Naim, Abu Obeida): victory claims for each ceasefire, denunciation of the Board of Peace as ''alignment with the Zionist position''
    (UNRWA, Sep 2026), and the 7 Oct framing as ''Al-Aqsa Storm''.'
  it: ''
- hash: 14f119f2
  kind: cards
  en: 'A degraded but surviving Qassam force: it redeployed across the zones Israel left within hours of the 10 Oct 2025 ceasefire and moved against Israel-backed militias and clans; the tunnels remain
    ''the most important weapons'' (the Popular Forces militia started destroying them in Feb 2026) and Mladenov told the Security Council on 26 Aug 2026 that ''every tunnel still worked on'' sets the process
    back.'
  it: ''
- hash: b6f4244c
  kind: cards
  en: 'Internal coercion as a way to assert authority: public executions of alleged collaborators (19-22 Sep and 13 Oct 2025, about 33 killed by mid-October according to the index source), clashes with
    the Doghmush and Abu Werda clans and with the Popular Forces, then a pause in public executions on 21 Oct 2025 to deny Israel a pretext.'
  it: ''
- hash: 8f3e7f3b
  kind: cards
  en: Qatari money (Netanyahu says the funds he let in were about 2% of what entered Gaza; Qatar denies they fed the 7 Oct plot) plus the leverage of the hostages - all 20 living hostages were freed on
    13 Oct 2025 and the remains of the dead returned over the following weeks, the largest bargaining chip Hamas has now spent.
  it: ''
- hash: bcd38e0a
  kind: cards
  en: 'Israel''s military hold and its right to strike: the Yellow Line has been pushed from about 53% (Oct 2025) to about 60% of the Strip, the IDF killed 1,481 Palestinians in the ceasefire year by Gaza''s
    count, and since September 2026 it has stepped up the killing of commanders (al-Beik on 29 Sep, the strike on Gaza''s de facto chief Ali al-Amoudi on 2-3 Oct). Netanyahu says Israel will not withdraw
    until Hamas disarms.'
  it: ''
- hash: 64a22084
  kind: cards
  en: 'Decapitation and attrition: Haniyeh (Tehran, 31 Jul 2024), Mohammed Deif, Yahya Sinwar (16 Oct 2024), Mohammed Sinwar (2025), Abu Obeida (Aug 2025) and a stream of brigade commanders; the Doha strike
    of 9 Sep 2025 killed Hayya''s son and his office director and showed that no capital is safe. Leadership now rests on an elected head in Doha and a Gaza chief whose election was suspended in dispute.'
  it: ''
- hash: 9cfbc113
  kind: cards
  en: 'Dependence on mediators who are themselves squeezed: Qatar was bombed and apologised to by Netanyahu under Trump''s pressure, Turkey is barred by an Israeli veto from the stabilisation force, Egypt
    wants Hamas out of power in Gaza and holds the Rafah door. Each can sell the bargain Hamas wants only if it also delivers the disarmament.'
  it: ''
- hash: 0382f4bd
  kind: cards
  en: 'A patron in decline: the 2026 war on Iran, the death of Khamenei and the collapse of the Assad corridor leave Tehran short of money and weapons for allies; analysts speak of a decentralised axis
    relying on local constraints, and the Houthis and Hezbollah are consumed by their own wars.'
  it: ''
- hash: b9b3d20b
  kind: cards
  en: 'Eroding popular support and a ruined society: PCPSR''s Poll 97 (5-8 Aug 2026) reports that Hamas has lost substantial support although most Palestinians still reject disarming before Israeli withdrawal;
    the IPC projects 1.4 million people facing hunger and only about 227 aid trucks a day reach Gaza against a target of 600.'
  it: ''
- hash: 540f57f4
  kind: cards
  en: 'Internal division at the top: Hayya (close to Iran, ''armed conflict until withdrawal'') beat Meshal (closer to Qatar, compromise) in a run-off of the Shura Council, after the 2025 acting five-man
    council; the Gaza chief election (Amoudi against Awadallah) stalled with blank ballots and a challenge to the vote.'
  it: ''
- hash: fedeb7b6
  kind: cards
  en: 'The attack that destroyed the attacker''s base changed the strategic map. 7 Oct 2023 cost Hamas its government, most of its commanders and half of Gaza, yet it put the Palestinian question back at
    the centre: a wave of recognitions of Palestine in Sep 2025 (Portugal on 21 Sep, Belgium announced on 2 Sep, the UK upgrading its mission to an embassy on 5 Jan 2026) came with strings (Belgium made
    its royal decree conditional on the release of the last hostage and the exclusion of Hamas from government). The movement that brought the question back is the one the recognisers keep out of the settlement.'
  it: ''
- hash: ac854a6f
  kind: cards
  en: The weapons that keep Hamas alive keep Israel in. Refusing to disarm preserves its leverage and the loyalty of its fighters, but it gives Netanyahu the reason not to withdraw from the Yellow Line
    (60% of the Strip), keeps the stabilisation force from deploying (no troops by Oct 2026) and keeps the technocratic committee out of Gaza; the longer it holds the guns the less territory it has to rule.
  it: ''
- hash: e355183f
  kind: cards
  en: Reasserting order undermines the handover it signed. Executions, raids on clans and the redeployment of the police in Oct 2025 proved that Hamas is the only functioning authority, which is exactly
    the point the Trump plan and the Board of Peace treat as the problem; Trump first shrugged ('a couple of gangs') then threatened to 'go in and kill them'. The same force is its bargaining asset and
    the reason the Board of Peace will not work with it.
  it: ''
- hash: 525f9b25
  kind: cards
  en: Safe havens abroad make the leadership hittable and expose its hosts. Doha, Istanbul and Cairo give Hamas diplomats immunity from Gaza's fate, but the Israeli strike of 9 Sep 2025 in a Doha residential
    compound and Netanyahu's boast of 5 Sep 2026 ('I attacked Qatar') turn the hosts into targets and push Qatar toward pressing Hamas as guarantor of its own deals.
  it: ''
- hash: 6951ebdb
  kind: cards
  en: The route to legitimacy runs through the rival it deposed. Hamas needs the PLO umbrella (Beijing Declaration, national bloc, elections) to be a Palestinian actor again, but its coup of 2007 and its
    2025 executions are the reason Abbas treats it as a threat and the Palestinian Authority is a condition of every international plan; on 10 Oct 2026 Abbas postponed the vote to Sep 2027 and deprived
    Hamas of its best ballot.
  it: ''
- hash: 369d6f00
  kind: cards
  en: Claiming victory commits it to a settlement it cannot deliver. Hayya called the Jan 2025 ceasefire a defeat for Israel and 7 Oct a 'military accomplishment'; two years on, 74,000 dead, the Strip in
    tents and no reconstruction (pledges of 7bn dollars against an estimated 70bn need) leave the claim hard to sell and the PCPSR poll of Aug 2026 finds that Hamas has lost substantial support.
  it: ''
- hash: cfd28597
  kind: cards
  en: 'Hamas is a movement that lost the war it started and is trying to win the settlement. On the Luttwak reading, 7 Oct 2023 was an attack that destroyed its attacker''s base and still redrew the map:
    Gaza is ruins, the military command was decapitated repeatedly (Deif, Yahya Sinwar, then his brother), Hezbollah and Iran were crippled, yet the Palestinian question is back on the table, recognitions
    of Palestine multiplied in 2025 and a US president personally owns a plan for Gaza. The cost of that outcome falls on Hamas, because every route to the state it helped bring back runs through its exclusion
    and its disarmament. Its strategy in 2026 is therefore delay with concessions on form: it gives up the hostages (the last bargaining chip, spent between 13 Oct 2025 and early 2026), dissolves its administration,
    accepts a technocratic committee and says yes to the 15-point roadmap, but holds the weapons and the tunnels as insurance, and tests whether the Board of Peace can force Israel to leave the Yellow Line
    first. Israel reads the same facts the other way (no withdrawal until disarmament), so the ceasefire exists on paper and bleeds on the ground: Hamas has not disarmed, Israel holds about 60% of the Strip,
    no stabilisation force and no technocratic committee has entered, and Israeli strikes on commanders have escalated since Sep 2026 ahead of Israel''s 27 Oct election. Underneath sits a leadership choice
    made in July 2026: Hayya, the negotiator close to Iran, over Meshal, the Qatar-leaning pragmatist. The patrons are weaker or squeezed (Iran at war, Qatar bombed and pressed, Turkey vetoed from the force,
    Egypt hostile to Brotherhood rule), and the rival Palestinian Authority has just postponed the elections that might have given Hamas a legitimate way back. One signal that is not a row: Hamas announced
    a pause in public executions on 21 Oct 2025, days after Trump threatened to ''go in and kill them'', so the order it keeps is partly a function of Washington''s attention.'
  it: ''
- hash: df65d270
  kind: cards
  en: 'Keep its arsenal outside the state: no disarmament while Israel occupies Lebanese land and strikes. It treated the cabinet''s decision of 5-7 August 2025 ''as if it did not exist'', walked out of
    the cabinet on 5 September 2025, offered in April 2025 to discuss weapons only after Israeli withdrawal from the five hill positions, and in 2026 rejects the Washington framework (26 June), its pilot
    zones and its verification committee. Qassem on 29 August 2026: ''we will not surrender''.'
  it: ''
- hash: 1f6a7e46
  kind: cards
  en: 'Force Israel out and restore deterrence: Israeli withdrawal from the area it holds since March 2026 (about 608 sq km, 6% of Lebanon, per Carnegie) and from the five points held since February 2025,
    an end to the strikes that never stopped after the November 2024 truce, and new rules of engagement on the model of the 1996 April Understanding.'
  it: ''
- hash: a75ba626
  kind: cards
  en: 'Hold the Shia community and pay for it: keep the displaced (over 1.2 million in the 2026 war) and the Dahieh, south and Bekaa base loyal by rehousing and compensating them under its own banner (the
    ''Promise and Commitment'' housing project announced on 13 October 2026), and keep the Hezbollah-Amal duo as the Shia veto in the confessional system.'
  it: ''
- hash: 2239b5d4
  kind: cards
  en: 'Stay inside Iran''s axis and rebuild the supply and money lines the loss of Syria cut: Iranian cash (US Treasury: about USD 1bn in the first ten months of 2025; two Reuters sources: USD 200m in September
    2026), cash couriers through Turkey and the UAE, the Al-Qard al-Hassan network, and Iraq as the new land route.'
  it: ''
- hash: 15eb02ec
  kind: cards
  en: 'Keep political weight in Beirut to make the state its shield rather than its enemy: ministers in the Salam cabinet, a parliament whose mandate was extended to May 2028 on 9 March 2026, a veto through
    Speaker Berri''s Amal, and the line that disarmament must come through a ''national defence strategy'' and not through a Washington-brokered deal.'
  it: ''
- hash: 19a50e4a
  kind: cards
  en: 'The standing maximum, formally unrevoked: the destruction of Israel and the expulsion of American power from Lebanon and the region (1985 manifesto, reiterated in 2009). In practice it is subordinated
    to ranks 1-5: since September 2024 the movement fights to survive as an armed actor, not to win.'
  it: ''
- hash: c9761951
  kind: cards
  en: 'Obstruction from inside the system rather than outside it: cabinet walkouts (7 August and 5 September 2025), Berri as channel and brake, the proposal of parallel withdrawal south of the Litani (4-5
    June 2026), and the Iranian card - Tehran made a Lebanon ceasefire a condition of its own deal with Washington (the 15 June 2026 Islamabad memorandum), which Qassem uses to call the Israel-Lebanon framework
    ''null and void''.'
  it: ''
- hash: ebad333f
  kind: cards
  en: 'The ''resistance'' narrative against the state''s ''sovereignty'' narrative: the cabinet decision is ''US-Israeli orders'', the framework a ''surrender'', the army is ''humiliated'' by verification;
    Al-Manar and Qassem''s speeches keep the frame while Israeli demolitions of Shia villages and strikes under the truce supply the proof.'
  it: ''
- hash: 9f70d887
  kind: cards
  en: 'What is left after 2024-26: attrition inside the Israeli-held zone (ambushes, IEDs, drones), lighter arms and anti-tank missiles it signalled it would keep in July 2025, tunnel belts such as Ali
    al-Taher (Israel says it destroyed the complex on 10 September 2026 with 1,100 tons of explosives), and reported rearmament through Beirut''s port and Syrian smuggling routes (WSJ, October 2025). Independent
    estimates put its dead in the 2026 war above 1,000; the IDF claims it has lost a third of its forces since 2023.'
  it: ''
- hash: deff06df
  kind: cards
  en: 'A parallel welfare state: compensation (over USD 50m paid to war-affected families by December 2024), Al-Qard al-Hassan loans, pharmacies and housing, paid with Iranian cash moved by courier and
    hawala (Treasury, 20 August 2026: couriers on flights between Lebanon, Turkey, the UAE and Iran, ''hundreds of millions'' through one network). Its funds were strained by July 2025 (cheques bouncing
    at Al-Qard al-Hassan).'
  it: ''
- hash: aacfead7
  kind: cards
  en: 'Penetrated and hollowed out: the September 2024 pager and radio attacks, the killing of Nasrallah (27 September 2024) and of his designated successor within days, then a stream of commanders; the
    IDF says a third of its forces are gone since 2023, independent counts put 1,000+ dead in 2026 alone. Analysts say rebuilding requires answering the intelligence breach first, and it has not been shown
    to have done so.'
  it: ''
- hash: f5d5bbee
  kind: cards
  en: 'The land bridge is gone and the neighbour is hostile: Assad fell in December 2024 and Qassem said on 14 December that the Syrian supply route was lost; the new Syrian authorities fought Hezbollah-linked
    clans on the border (February 2025), seize Hezbollah-bound arms (16 July 2026), and refused, but also did not join, US and Israeli pressure to attack it. Lebanon barred Beirut-Tehran flights in February
    2025.'
  it: ''
- hash: e9545333
  kind: cards
  en: 'Money is short and conditioned: Iran, itself decapitated (Khamenei killed in the war that began on 28 February 2026), pays less reliably; the US Treasury re-designated Hezbollah as an IRGC-QF instrument
    on 20 August 2026; Lebanese reconstruction aid, Gulf money and US army aid are tied to a state monopoly on arms (Riyadh waits for disarmament; the State Department said reconstruction ''cannot happen''
    without it).'
  it: ''
- hash: 01e917f2
  kind: cards
  en: 'A state that has turned against its weapons and a public that follows it only in part: the cabinet banned its military activity on 2 March 2026, expelled the IRGC and the Iranian ambassador (24 March),
    and signed the framework; 58% of Lebanese back a state monopoly on arms in a May 2026 poll (most Shia and Sunni respondents opposed disarmament), and CFR notes that relatively few Lebanese support the
    group in Arab Barometer 2024 polling.'
  it: ''
- hash: 70a6cc0f
  kind: cards
  en: 'Its own base is displaced and its geography is occupied: over 1.2 million people displaced, Dahieh and the south emptied, Israel holding about 608 sq km and razing villages, evacuation orders north
    of the Litani and into the Bekaa; Carnegie notes the Shia identity has become ''securitised'' even among fellow Lebanese. The Shia veto that protects it also binds it to Amal and to Berri''s more cautious
    line.'
  it: ''
- hash: 50a26812
  kind: cards
  en: 'Designated and sanctioned beyond Lebanon: US (FTO since 1997, SDGT since 2001), EU military wing (2013), GCC (2016), United Kingdom and Germany in full (2019, 2020), Argentina (2019), Costa Rica
    (April 2026). The listings shut formal finance and travel and give every host government a reason to act against its networks.'
  it: ''
- hash: 055596ae
  kind: cards
  en: The deterrent that provoked the war it was meant to deter. A hidden arsenal of rockets and missiles, built after 2006 so that Israel would never again attack Lebanon at scale, was the thing Israel
    could not leave alone once the Gaza war had changed its threshold; the 'support front' opened on 8 October 2023 turned the arsenal into a target list. In November 2024 the deterrent was gone, in March
    2026 Hezbollah fired again to support Iran and brought the Israeli ground campaign to the Litani it had deterred for twenty years.
  it: ''
- hash: e237813b
  kind: cards
  en: Relational manoeuvre defeated by intelligence penetration. Hezbollah's whole method was to out-manoeuvre a stronger army by hiding in the network - in the community, in the Syria-Iran land bridge,
    in dispersed command. Nasrallah told members in February 2024 to drop smartphones because of Israeli infiltration; the replacement, thousands of pagers and radios bought in a supply chain Israel had
    built, was the weapon of 17-18 September 2024, and the killing of the leadership ten days later followed from the same penetration. The security measure became the vector.
  it: ''
- hash: 78442d30
  kind: cards
  en: Defending the Assad regime made the next Syria an enemy. The 2012 intervention secured the land bridge and cost Hezbollah its image as a purely Lebanese resistance; when Assad fell in December 2024
    the successors were Sunni forces who had fought Hezbollah, and they closed the route, seize its shipments and have Beirut's blessing.
  it: ''
- hash: 2b00361b
  kind: cards
  en: The shield of the state is cut by the sword it keeps. Hezbollah stays in the cabinet and parliament to be protected from the army and to claim state-funded reconstruction; its refusal to disarm makes
    that money conditional (Riyadh, Washington, the EU), so the community it feeds with Iranian cash has to wait for a state that Hezbollah's arms keep poor, while an Israeli buffer zone stays until it
    disarms.
  it: ''
- hash: 3ae04e7c
  kind: cards
  en: 'The more Israel punishes the community, the stronger the argument for weapons and the weaker the means to defend them. Carnegie''s reading: an open-ended Israeli occupation lets Hezbollah present
    itself as the only force that can end it; the same war has killed its commanders, emptied the Shia heartland and handed the army the zones where it deploys. Each Israeli strike under the truce confirms
    the case for the arsenal and removes some of the arsenal.'
  it: ''
- hash: '53917439'
  kind: cards
  en: Loyalty to the patron that is itself in extremis. By pledging allegiance to Mojtaba Khamenei on 11 March 2026 and entering the Iran war nine days earlier, Hezbollah tied its fate to a regime that
    lost its leader, its air defence and its Syrian corridor; the state's expulsion of the Iranian ambassador and IRGC officers followed from that choice, and in June Tehran bargained Lebanon into its own
    ceasefire instead of the reverse.
  it: ''
- hash: d6880064
  kind: cards
  en: 'Hezbollah in October 2026 is a movement that has lost the war it was built to deter and has not yet lost the argument that justifies its weapons. Luttwak''s logic shows twice. First, deterrence is
    a paradoxical good: an arsenal big enough to frighten Israel was also big enough to make destroying it Israel''s priority, and the ''support front'' of October 2023 handed Jerusalem the moment. Second,
    relational manoeuvre - the hidden, dispersed, community-embedded network, tied to Iran by a land bridge - beat Israeli firepower for eighteen years until Israeli intelligence penetrated the network
    itself: the pagers of 17 September 2024 and the decapitation that followed were less a military victory than the demonstration that the network had been read. Since then its position is that of a besieged
    political party with an army: the land route through Syria is shut by a hostile neighbour, Iranian cash comes by courier, the Lebanese state has banned its military activity and signed a framework that
    trades Israeli withdrawal for its disarmament, and its constituency is displaced and occupied. What keeps it from collapse is not strength but structure: a confessional system that cannot decide against
    the Shia community, an army that will not fight it, Amal as a brake on the state, and an Israeli occupation that supplies the justification. The open question for the next stage is whether the Lebanese
    state, with Gulf, US and European money behind its army, can turn the pilot zones into a precedent without provoking the clash both sides say they want to avoid, or whether Israel''s tunnels-and-demolition
    campaign forces Hezbollah to choose between its arms and its place in the state.'
  it: ''
- hash: e2bf649a
  kind: cards
  en: 'Keep and consolidate one-group rule over Sanaa and the populous north (the Houthis have held the capital since September 2014): no power-sharing that dilutes it, no return of the Presidential Leadership
    Council to Sanaa. The 2023 Saudi roadmap was acceptable only because, in the reading of Sana''a Center analysts, it would have left the Houthis in unilateral control of the north.'
  it: ''
- hash: 60c40400
  kind: cards
  en: 'Turn military leverage into a settlement with Riyadh on Houthi terms: an end to what Sanaa calls the Saudi ''blockade'' (airspace, ports, banks), payment of public salaries from a share of Yemen''s
    oil and gas revenue, the roadmap of 2023, and in effect tacit recognition as Yemen''s government in the north. The July 2026 escalation was read by Sana''a Center experts as a bid to close this deal
    before any US-Iran settlement.'
  it: ''
- hash: 36bfaa1b
  kind: cards
  en: 'Take the rest of Yemen that matters: the Red Sea coast (done, 3-11 September 2026: Mocha, Dhubab, Mayyun/Perim, the Hanish islands), then Taiz city and Marib with its oil and gas. Against it the
    government''s Operation Dawn (4 October 2026) and the Saudi air campaign are the first serious attempt since 2022 to push them back.'
  it: ''
- hash: f524ad27
  kind: cards
  en: 'Own the terms of passage through Bab al-Mandab. After the Gaza-justified campaign of November 2023 - 2025, the 2026 aim is a permanent chokepoint position: a Hudaydah coordination centre that claims
    exclusive authority over ship dealings (statement of 1 August 2026), a blockade declared on Saudi Arabia (20 July 2026), assurances to China and Russia that their ships are safe, and Mayyun island in
    the middle of the strait.'
  it: ''
- hash: 418d9e47
  kind: cards
  en: 'Be the Arab front of the ''axis of resistance'' and, with Hezbollah broken and Iran bruised, its centre of gravity: attacks on Israel ''in support of Gaza'' (2023 - October 2025, resumed on 28 March
    2026 in the Iran war), a growing presence in Iraq and Lebanon, training of allied militants from Sudan to Iraq, ties with al-Shabaab. The aim is status and leverage, not a mandate from Tehran: analysts
    stress the decision to act is the Houthis'' own.'
  it: ''
- hash: d996282d
  kind: cards
  en: 'Keep Iran as patron but not as master, and widen the circle of backers: China and Russia (contacts on ship passage, 2026), Oman as window and mediator, and the tribes at home. The group is ''fiercely
    nationalist and protective of its autonomy'', and Iran may trade it away in a deal with Washington, so the hedge is structural.'
  it: ''
- hash: c130a387
  kind: cards
  en: A channel through Oman that delivered the US-Houthi ceasefire of 6 May 2025 (it left attacks on Israel outside the deal), indirect talks with Riyadh since 2022 (the roadmap), a prisoner-exchange deal
    with the government (signed 14 May 2026, 1,680 detainees, postponed since 10 July), and, in 2026, direct approaches to China and Russia to keep their ships out of the target list.
  it: ''
- hash: a8e7449e
  kind: cards
  en: 'Total control of the message at home - propaganda in schools, funerals, weddings and public institutions (Sana''a Center) - and abroad the ''equation'' framing: attacks are ''in support of Gaza'',
    against a ''Saudi siege of nearly twelve years'', ''an eye for an eye''. Statements come from the military spokesman Yahya Saree and Abdelmalek al-Houthi''s televised speeches; Saba and al-Masirah are
    tier 1 for what the movement says, not for facts. Claims such as 5,400 square km taken on 3 September 2026 could not be verified.'
  it: ''
- hash: b9f3ba3a
  kind: cards
  en: 'Ballistic and cruise missiles, drones, explosive boats and, from 2025, sinking of merchant ships (Eternity C, July 2025); a ground arm that takes mountains over the coast, uses local fighters first
    and elite units after, and children in ''human waves''; amphibious drills on the Hudaydah coast in late 2025. In 2026 the targets moved from Israel to Saudi Arabia: Abha, Jazan, Yanbu, Najran, King
    Khalid airport in Riyadh (10 October 2026, 13 killed). Armed with Iranian supply and, by Yemeni government accounts, direct IRGC guidance.'
  it: ''
- hash: 626606c2
  kind: cards
  en: 'Recruitment by pressure on poverty and tribes: families are made to hand over sons, rural Sanaa, Amran and Dhamar are the pool, a recruiter offered a 16-year-old a rifle, a month of training and
    YER 50,000 (about USD 210); the government''s office documented 62 child recruitment cases in the second quarter of 2026. The elite is drawn from the families of the Sa''ada wars, trained in the Quranic
    Sciences Academy; five security services (Preventive Security, Security and Intelligence, Military Intelligence, Revolutionary Security, Police Intelligence) watch each other under Abdelmalek al-Houthi.'
  it: ''
- hash: c3fd2479
  kind: cards
  en: 'A centralised extraction system run since 2014: taxes, customs, zakat, endowment revenue, fuel sales, ''war effort'' levies. The Mokha Center put the parallel economy at about USD 2.5bn a year (USD
    800m taxes and customs, 600m fees and levies, 300m war contributions, 100m mobilisation events, 700m indirect costs to business); the Sana''a Center reports 4,225 trade agencies stripped of licences
    in 2026 in favour of affiliated firms. The US Treasury alleged in January 2026 that Iranian oil, partly free of charge and routed through Dubai companies, earns the group over USD 2bn a year; the Houthis
    deny it. Hudaydah and Al-Salif ports (hit by Israel in 2025) remain the gate, with clandestine landings along the coast.'
  it: ''
- hash: 0a478955
  kind: cards
  en: A starving, bankrupt hinterland. 22 million people need aid and 18.3 million face acute food insecurity (2026 UN plan); the 2025 aid plan got USD 687.9m of 2.48bn (28%), the 2026 plan under 20% by
    July; public salaries paid in part, irregularly, for years; the US Foreign Terrorist Organization designation (2025) made thousands of businesses close or move. Abdelmalek al-Houthi admitted people
    eat tree leaves and blames the Saudi 'blockade', not mismanagement.
  it: ''
- hash: 3fc9da9a
  kind: cards
  en: The patron's own weakness and its bargaining. Iranian oil exports fell to a six-year low in June 2026 (Reuters, cited by the Sana'a Center), Iran is under a US-Iran memorandum (June 2026) and may
    trade the Houthis away; Araghchi said in March that Iran did not want allies to help its self-defence, and Sana'a Center analysts argue Yemen is less critical to Tehran than Iraq or Lebanon.
  it: ''
- hash: 250a880c
  kind: cards
  en: Decapitation and penetration. Israel's strike on a Sanaa apartment on 28 August 2025 killed prime minister Ahmed al-Rahawi and, in the Sana'a Center count, about a dozen ministers and officials; chief
    of staff al-Ghamari's death was announced on 16 October 2025; US and Israeli strikes in 2025 showed deep intelligence penetration and destroyed Hudaydah and Al-Salif ports and fuel reserves. Abdelmalek
    al-Houthi's inner circle was spared and he has named no successor.
  it: ''
- hash: 92a44a99
  kind: cards
  en: An unwelcome occupier outside the northern heartland. The Houthis lack the social and security influence of their strongholds on the west coast, lost 332 confirmed dead by funeral notices by 13 September
    (the government-aligned NRF claims over 1,000), were forced to redeploy after heavy air strikes, and have 200,000-plus newly displaced behind them; tribes are 'troublesome' (the Al-Rayyan gathering
    of June 2026, an attempt on a sheikh on 14 July).
  it: ''
- hash: 64af5b99
  kind: cards
  en: 'A Saudi camp that has stopped containing and is organising: a 14-state naval defence coalition announced on 30 July 2026 and operating from Jeddah since 13 August, a defensive pact with Pakistan
    and Turkey not yet tested, roughly doubled arms and logistics for the government, US intelligence and targeting data (though Trump declined a Saudi request for air strikes on 10 September), and an end
    to the Saudi-Emirati rivalry that fragmented the anti-Houthi camp, by the Emirati exit of 30 December 2025.'
  it: ''
- hash: e65f9e00
  kind: cards
  en: 'Recognised pariah status: a UN Security Council sanctions regime with an arms embargo, asset freeze and travel ban (renewed 13 Nov 2025, 13 votes, Russia and China abstaining), the US FTO/SDGT designation,
    and the detention of at least 69 UN staff (4 Jan 2026), which led the UN to suspend operations in Saada and keeps aid money away.'
  it: ''
- hash: 710da5f3
  kind: cards
  en: The deal they wanted died of the pressure that was meant to win it. Sana'a Center experts read the July-October 2026 escalation as a bid to force Riyadh back to the 2023 roadmap before a US-Iran deal;
    the result was Riyadh's switch 'from containment and negotiated roadmaps to sustained pressure' (a Saudi-organised naval coalition, a doubled arms flow, air strikes on Sanaa airport, and on Mocha according
    to Houthi media), and the roadmap is, in the Sana'a Center's words of April, 'no longer viable'. The harder they hit the Kingdom, the less it can pay.
  it: ''
- hash: 0a1cac80
  kind: cards
  en: 'Leverage over shipping is a wasting asset: every closure teaches the world to bypass it. The Red Sea campaign (November 2023 - 2025) pushed carriers around the Cape and Egypt lost about USD 7bn of
    canal revenue, but the 2026 blockade doubled insurance rates, sent Aramco crude through Sidi Kerir, brought 14 states into a naval coalition and pushed Egypt and Saudi Arabia into closer alignment.
    The strait is worth most to the Houthis unclosed, with the threat in reserve - which is how they used it between October 2025 and July 2026.'
  it: ''
- hash: 89f4cb87
  kind: cards
  en: 'A war fought ''for Gaza'' that left them without a cause when Gaza went quiet. The Houthis halted attacks on Israel and shipping after the ceasefire of 10 October 2025 (a letter from chief of staff
    al-Madani promised to resume if Israel did), kept off the shipping lanes (firing on Israel again only on 28 March 2026, in the Iran war), and then needed a new casus belli: the Saudi ''siege'' of Yemen,
    from July 2026. The Palestinian justification was borrowed; the Saudi one is real and far more dangerous.'
  it: ''
- hash: 06a1346e
  kind: cards
  en: Dependence on Iran grows exactly when Iran may sell them. The Houthis moved on Riyadh and the coast while Iran held the Hormuz card, with IRGC advisers in Sanaa and a Mahan Air flight from Tehran;
    but a US-Iran settlement, which Sana'a Center experts expect to come at their expense, would strip the patron's cover. Escalation is a race to be paid for before the patron settles, and by staking everything
    on that race they lose the autonomy the Houthis most prize.
  it: ''
- hash: 801774d7
  kind: cards
  en: They answer a 'siege' by besieging themselves. The July 2026 trigger was an unauthorised Iranian Mahan Air flight to Sanaa airport, which the government and Saudi coalition struck on 13 July; the
    airport was already shut by Israeli strikes; the Houthis replied with missiles on Abha and a blockade of Saudi shipping, which shut Riyadh airport in October and invited the very air campaign they say
    is the siege. The detention of UN staff cut aid to Saada while the leader blames Riyadh for hunger.
  it: ''
- hash: 4bfa459c
  kind: cards
  en: A movement that rules by fear is spending its recruiting base. Child recruitment (62 documented cases in the second quarter of 2026), 'human waves' on the west coast, tribal gatherings against Houthi
    abuses and the Sana'a Center's own verdict that internal discontent is the group's 'most enduring threat' show the cost of a war machine that needs ever more sons from a population it cannot pay.
  it: ''
- hash: 192cb278
  kind: cards
  en: 'The Houthis are the clearest case in the atlas of a small actor that turned a

    distant war into leverage over world shipping, and 2026 is the year in which

    that leverage reached its culminating point. The Gaza war gave them a

    justification, an audience and a free hand against the one trade route that

    ties Asia to Europe; the 2025 US and Israeli campaigns cost them ports,

    ministers and a chief of staff but not the capacity to hurt; the Iran war and

    the closing of Hormuz then made Bab al-Mandab the only maritime outlet of the

    Gulf, and on 3-11 September 2026 they took the whole Yemeni coast and Mayyun

    to sit on it. In Luttwak''s terms the movement has gone past the point where

    each further success buys proportionally more: it has stretched its lines

    into districts it cannot hold with consent, turned the Saudi restraint of

    2022-25 into a Saudi-run coalition, and made the Kingdom an enemy it cannot

    pay off, while the patron whose war created the opening is negotiating with

    Washington. What it can still do is keep the threat of closure alive and

    sell its absence, which is precisely what it did between the Gaza ceasefire

    and July 2026 and what it needs to restore. Signals that are not rows: Iran''s

    foreign minister said in March that Tehran did not need its allies to join

    its self-defence, the Houthis stayed out of the June 2025 war and waited four

    weeks in 2026 before firing on Israel, and the Houthi leadership told China

    and Russia their ships were not targets. All of it shows an actor that

    chooses its wars; the open question for the autumn of 2026 is whether it

    still can.'
  it: ''
- hash: ad9e809f
  kind: cards
  en: 'Take the state in Khartoum by force and replace the army-led government with its own. The RSF built a parallel Government of Peace and Unity (charter signed in Nairobi in Feb 2025, announced by Hemedti
    on 15 Apr 2025, seat Nyala). On 22 Sep 2026 Reuters reported Hemedti telling his troops that the time for fighting had come. The aim is the state, not a truce: its humanitarian truce of 6 Nov 2025 was
    a tactical pause.'
  it: ''
- hash: a465817d
  kind: cards
  en: 'Win recognition for the parallel government. The African Union Peace and Security Council, the Arab League, Saudi Arabia, Qatar and Egypt rejected it in 2025, so the RSF has no state standing: its
    diplomacy runs through Nairobi, the Quad truce track and its allied groups (SPLM-N of al-Hilu) rather than through recognised embassies.'
  it: ''
- hash: f6d1e082
  kind: cards
  en: Hold Darfur and open the road to Kordofan and El Obeid. The RSF holds almost all of Darfur and parts of Kordofan; the army has been retaking Kordofan since January 2026 (Kadugli, Dilling, the Khartoum-El
    Obeid road in late July, al-Mazroub on 2 Oct 2026). Losing Kordofan would cut the RSF off from the centre, so the western and southern front is where the objective is decided.
  it: ''
- hash: 56db7573
  kind: cards
  en: Gold. The RSF seized key mines, the Sudan Gold Refinery and control of gold processing and exports through the RSF-linked Al Gunade company. Smuggled gold reaches the UAE, the main buyer, by routes
    through Libya, Chad, South Sudan and Egypt, with Dubai as the entry point. Gold revenue finances the war; the figures are reported, not audited.
  it: ''
- hash: 3663a072
  kind: cards
  en: The Darfur base and the supply lines that reach it. The base is Darfur and the Nyala seat; the reported arms and fighter routes run through Amdjarass in Chad and Kufra in eastern Libya (about 600
    flights to Kufra in 2025 by RFI count, UAE denied). The UN fact-finding mission of 3 Sep 2026 names Benghazi, Kufra and Jufra as hubs and says RSF fighters trained in Libya took part in the Zamzam attack
    (Apr 2025) and the El Fasher assault (Oct 2025).
  it: ''
- hash: c6e14d62
  kind: cards
  en: 'No recognised state and no sovereign routes. The parallel government is rejected by the African Union, the Arab League and most of the region, and the RSF has neither port nor airspace of its own:
    every reported supply line runs through a third state (Chad, eastern Libya, Ethiopia). Those doors can close: Chad shut its eastern border on 23 Feb 2026 and Kufra airport was shut for a month in Jan
    2026.'
  it: ''
- hash: 7ad7a614
  kind: cards
  en: Exposure to atrocity findings and sanctions. The US determined on 7 Jan 2025 that the RSF and allied militias committed genocide and sanctioned Hemedti; the El Fasher capture of Oct 2025 was followed
    by reports that more than 2,000 civilians were executed and by satellite images of burial and burning. Any patron that backs the RSF openly pays for it, and the record closes the Western door to any
    settlement that leaves the RSF with power.
  it: ''
- hash: 533ec2cb
  kind: cards
  en: The patron that arms the RSF is the reason it cannot be recognised. Abu Dhabi supplies the RSF, but the UAE is inside the Quad and Egypt, Saudi Arabia and the AU reject the parallel government as
    the UAE's creature. The more the UAE backs the RSF, the less the RSF can become a state, and the truce it accepts (6 Nov 2025) is one it negotiated through the same Quad.
  it: ''
- hash: 1c1848a4
  kind: cards
  en: Territory taken by massacre cannot be governed. El Fasher (Oct 2025) gave the RSF the army's last Darfur base and control of almost all of Darfur, but the atrocities made the genocide finding the
    frame of any settlement, and the army has since retaken Kordofan towns and claims momentum. A state needs the population it has terrorised; the means it used to take the territory are the ones that
    stop it from holding the state.
  it: ''
- hash: 9eedd676
  kind: cards
  en: 'The RSF is a militia that has tried to become a state: it took Darfur and the gold fields, and it declared its own government in 2025, but it has no recognition, its supply runs through the neighbours
    of Sudan, and the El Fasher record has made the genocide finding the frame of any settlement.

    On the Luttwak reading its central paradox is that the patron that makes it strong, the UAE, is also the reason it cannot be recognised, and the army''s retaking of Kordofan since January 2026 shows
    that a massacre can take territory without making a state.

    Its truces are tactical pauses, not a change of aim, so the state in Khartoum remains the objective and the war continues.'
  it: ''
- hash: a1d16736
  kind: cards
  en: 'Keep a Kurdish-run security and administrative core alive inside the Syrian state it has just joined: the January 2026 deal left Kurdish security forces in the cities of Hasakah and Qamishli, a Kobani
    brigade, a Hasakah governor chosen by the SDF (Noureddin Issa Ahmed, confirmed 13 Feb 2026) and a deputy defence minister (Sipan Hamo, 10 Mar 2026). Abdi announced the SDF''s dissolution as an independent
    force on 25 Aug 2026 and became an adviser to the presidency on 27-28 Aug; the aim is now to turn those posts into permanent guarantees.'
  it: ''
- hash: 9598688f
  kind: cards
  en: Write Kurdish language and political rights, and a decentralised state, into the constitution that Damascus is drafting. Abdi told Rudaw on 15 Aug 2026 that centralisation had failed and said after
    the dissolution that the struggle for the people's rights in the constitution 'will continue'; al-Sharaa's decree of 16 Jan 2026 (Kurdish a national language, Nowruz a holiday, citizenship for the stateless)
    is a decree, not a constitutional guarantee, and Kurdish-language education was still being negotiated in September 2026.
  it: ''
- hash: b2031c71
  kind: cards
  en: Stay indispensable to a patron. From 2015 the SDF's whole security rested on being the US ground force against ISIS (about 2,000 US troops in Dec 2024, under 1,000 after 2025, none after 16 Apr 2026).
    Washington's envoy said on 20 Jan 2026 that the SDF's 'original purpose' as the primary anti-ISIS force 'had largely expired'; the SDF now tries to convert the counter-ISIS record into standing with
    France, the Barzani family in Erbil and the US Congress.
  it: ''
- hash: b04baaae
  kind: cards
  en: 'Hold the Kurdish national camp together: reconcile the PYD and the KDP-backed Kurdish National Council (the 26 Apr 2025 Kurdish unity conference in Qamishli, 130 delegates each, with a KDP envoy
    present; Abdi-Barzani meeting in Erbil on 16 Jan 2025) and widen the front to other minorities (the Hasakah ''unity of components'' conference, 8-9 Aug 2025, with the Druze leader Hijri and the Alawite
    sheikh Ghazal by video).'
  it: ''
- hash: 7abbef2a
  kind: cards
  en: 'Protect the population of the Kurdish heartland (Kobani, Qamishli, Hasakah, Afrin returnees, Sheikh Maqsoud) from a second Afrin: the government assault on Sheikh Maqsoud (6-10 Jan 2026) displaced
    tens of thousands, Kobani was besieged in January, and the deal gives it a brigade of its own and a demilitarisation clause.'
  it: ''
- hash: 3819690a
  kind: cards
  en: Keep an economic base (oil and gas, border crossings, the Tishrin and Tabqa dams) - now largely lost. Damascus took the Omar and Conoco fields, Tabqa, Raqqa and eastern Deir ez-Zor between 17 and
    19 Jan 2026 and the 18 Jan agreement handed over every field, crossing and prison; what is left is the Hasakah heartland and a place on the state payroll.
  it: ''
- hash: cd7abc83
  kind: cards
  en: 'The YPG/YPJ core and an Arab-majority wider force built and trained under the US-led coalition since 2015: it took Raqqa (2017) and Baghuz (2019), held Tishrin Dam and Kobani against the SNA and
    Turkish drones in December 2024-April 2025, then chose not to fight the government in January 2026 - Abdi withdrew from Deir Hafer on 16-17 Jan ''on calls from friendly countries'' and from Raqqa and
    Deir ez-Zor on 18 Jan ''to prevent civil war''. About 6,000 members had entered the army by July 2026 (a government source) and four brigades by 3 Aug.'
  it: ''
- hash: 02e00dbb
  kind: cards
  en: 'Patron-hopping through three channels: Washington (CENTCOM, Barrack, Rubio at Munich on 13 Feb 2026, Senators Graham and others), Erbil (Masoud and Nechirvan Barzani as hosts of the 17 and 22 Jan
    2026 meetings and offered guarantors) and Paris (Macron, 13 Feb 2026), with the Autonomous Administration''s foreign-relations head Ilham Ehmed writing to the Security Council on 21 Jan 2026. It never
    won recognition: only Russia occasionally backed federalisation.'
  it: ''
- hash: 3d5a3572
  kind: cards
  en: Own media (SDF Press Center, Hawar News, North Press) and the Rojava Information Center - all partisan, tier 3 or statements only - carried the case that Damascus broke the 18 Jan withdrawal agreement
    and that Turkey flew drones over Hasakah; Western press picked up the 'abandoned ally' frame (The National, 6 Feb 2026).
  it: ''
- hash: 7a235b5d
  kind: cards
  en: 'Until January 2026 the oil and gas fields of Deir ez-Zor and Raqqa, the border crossings (including Semalka to the Kurdistan Region) and the Tabqa and Tishrin dams paid the administration''s bills;
    the 18 and 30 Jan agreements moved all of it to Damascus, and civil servants went onto the state payroll (3 Aug 2026: integration 70% complete). The ISIS detention system was a liability and a bargaining
    chip that the SDF gave up in the same weeks.'
  it: ''
- hash: 91e077c9
  kind: cards
  en: 'Geography and demography: an enclave without a port or a friendly border (Turkey to the north, Damascus to the south and west), whose Arab-majority provinces were held by consent that evaporated.
    Arab tribal leaders in Deir ez-Zor told Reuters on 17 Jan 2026 they were ready to take up arms against the SDF; Arab units in Raqqa defected; tribal forces took Raqqa, Shaddadi and the southern villages
    of Hasakah while the army advanced.'
  it: ''
- hash: ea0bdc46
  kind: cards
  en: 'The patron has left: the US completed its withdrawal on 16 Apr 2026 (Trump ordered it in February), Syria joined the Global Coalition against ISIS on 10 Nov 2025, and Washington now treats al-Sharaa
    as its primary partner in Syria; its remaining instruments are a $130m request for local counter-ISIS forces and mediation.'
  it: ''
- hash: bc71625f
  kind: cards
  en: 'Turkey''s veto over the Syrian settlement: Ankara called the SDF a PKK branch and a ''terrorist organisation'', backed the Dawn of Freedom offensive (30 Nov 2024) and Syria''s January 2026 attack
    (''one state, one army''), and Erdogan said on 21 Jan 2026 that the Kurdish forces ''must lay down arms and disband now''. Damascus''s own conduct (the YPJ refused entry to the army, Arab units left
    out) tracks Turkish preferences.'
  it: ''
- hash: 27346dbd
  kind: cards
  en: 'The ISIS detainee burden: up to 7,000 detainees and a camp (al-Hol, over 23,000 people at end-2025) could not be guarded once the front collapsed. Shaddadi prison fell on 19-20 Jan 2026 (about 120
    escapees by the interior ministry''s count, 1,500 by the SDF''s), the SDF left al-Hol on 20 Jan citing ''international indifference'', and the US moved 5,700+ detainees to Iraq by 12 Feb.'
  it: ''
- hash: f94bbefd
  kind: cards
  en: 'The PKK shadow and the Kurdish split: the YPG''s cadre came from the PKK, which Turkey, the US and the EU list as terrorist; the 18 Jan deal obliged the SDF to expel non-Syrian PKK-affiliated members,
    and the PKK''s own dissolution (12 May 2025) both removed Ankara''s pretext and left the SDF without a movement behind it. The PYD, the KDP-backed ENKS and the PUK still compete.'
  it: ''
- hash: 8aa6d6ce
  kind: cards
  en: 'Usefulness was the security. The SDF lived on being the ground force of a coalition fighting ISIS; the better it did that job (Raqqa, Baghuz), the less the coalition needed it, and the moment the
    host state itself joined the coalition (10 Nov 2025) its protection was void. Barrack''s ''original purpose had largely expired'' (20 Jan 2026) is Luttwak''s patron logic in one sentence: a client that
    cannot survive its patron''s exit was never an ally, only an instrument.'
  it: ''
- hash: c20f8625
  kind: cards
  en: The prisoners were the chip and the pretext. Guarding thousands of ISIS fighters and al-Hol made the SDF indispensable to Washington, Baghdad and Europe; but a prison break threatens everyone, so
    the government's advance on Shaddadi and al-Hol could be presented as protecting the prisons, and the SDF ended by handing the detainees to Damascus and the US in the same fortnight.
  it: ''
- hash: 692a9136
  kind: cards
  en: The territory won from ISIS decided its fate. East of the Euphrates the SDF governed Arab provinces that gave it oil and a claim to speak for 'North and East Syria'; in January 2026 the same Arab
    tribes and defecting Arab units took Raqqa, Deir ez-Zor and the fields with little SDF defence, and the Kurdish core was left with Hasakah.
  it: ''
- hash: 62804d99
  kind: cards
  en: Delay to win decentralisation bought a worse settlement. The 10 Mar 2025 deal had an end-2025 deadline; the SDF used the year to push a decentralised line (the Hasakah components conference, 8-9 Aug
    2025, which Damascus said 'dealt a blow' to the talks and answered by skipping the Paris round) while clashes in Aleppo in October and December 2025 hardened the opposite line. The January 2026 terms
    (individual absorption, no autonomy, all fields and prisons) were harsher than those of March 2025.
  it: ''
- hash: 32754ad6
  kind: cards
  en: The PKK link was both cohesion and casus belli. The YPG's PKK-trained cadre gave the SDF its discipline, and the same lineage justified Turkey's war on it; when the PKK dissolved (12 May 2025) and
    Turkey's peace process advanced, the demand shifted to 'disband the SDF too', and the last PKK-lineage commanders ended as officials in Damascus (Sipan Hamo, deputy defence minister; Abdi, adviser)
    while the KCK's Bayik criticised the choice.
  it: ''
- hash: da6ab789
  kind: cards
  en: Joining the state to escape Turkey put Turkey's partner in charge. Integration was the way to stop Ankara's drones and the SNA at Kobani, but it makes Ankara's 'one state, one army' ally, Damascus,
    the arbiter of Kurdish rights; the cost was visible within weeks (the YPJ refused entry to the army, pro-SDF Arab units left out) while Turkey took Abdi off its wanted list only after he had become
    a Syrian official.
  it: ''
- hash: 08f24eb5
  kind: cards
  en: 'The SDF is a case study of a client whose usefulness to a patron was its entire

    security. Built by the United States in 2015 as the ground force against ISIS, it

    held a quarter of Syria and an oil-and-prison economy without the attributes of a

    state: no recognition, no port, no friendly border, an Arab-majority hinterland held

    by consent. Luttwak''s rule - a patron''s help lasts as long as the client serves the

    patron''s strategy, not its own - played out in three steps: Turkey and the SNA tested

    it in December 2024 (Manbij lost, Tishrin and Kobani held with US mediation); the new

    Damascus offered integration in March 2025 and the SDF stalled for decentralisation;

    and when Syria joined the anti-ISIS coalition in November 2025 the counter-ISIS role

    that justified the SDF was duplicated and then disowned. The January 2026 offensive

    met no external opposition: the US called for a halt, brokered the terms and, within

    three months, left. What remains is a negotiated afterlife: the force dissolved on

    25 Aug 2026, its commander is a presidential adviser, Kurdish units survive as

    brigades and local security, and the contest has moved from the battlefield to the

    constitution. Signals that are not rows: the YPJ is still outside the army, and the

    Kobani prison riot of 12 Sep 2026 shows the security vacuum in the Kurdish towns. The

    grades in this card are those of an actor that no longer controls territory; read

    them as a legacy card with live consequences.'
  it: ''
- hash: f3aa1483
  kind: cards
  en: Keep the Cook Islands, its realm partner, inside New Zealand's security orbit after the February 2025 Cook Islands-China partnership, which excluded security and defence
  it: ''
- hash: 8101b137
  kind: cards
  en: Keep the defence link with Australia close (closer defence relations, Anzac integration) while staying nuclear-free
  it: ''
- hash: 8cd3b9c3
  kind: cards
  en: Diversify export markets through the India free trade agreement, signed in April 2026
  it: ''
- hash: cfaf8921
  kind: cards
  en: 'Defence Capability Plan 2025: NZ$12 billion over four years (NZ$9 billion new), taking defence spending from just over 1% of GDP toward 2% (2032 in press reporting, 2032/33 in Budget terms); Budget
    2025 set aside NZ$2.7 billion capital and NZ$563 million operating for priority projects'
  it: ''
- hash: f5fa7425
  kind: cards
  en: 'Development funding as leverage over the Cook Islands: NZ$18.2 million for 2025/26 held back in June 2025 and about NZ$30 million restored in April 2026'
  it: ''
- hash: bb4a6fff
  kind: cards
  en: Russia sanctions under the Russia Sanctions Act 2022 (latest amendments 7 August 2026), and an NZDF training contribution to Ukraine (Operation Tīeke, extended to 30 June 2028)
  it: ''
- hash: 1b180673
  kind: cards
  en: The nuclear-free law of 1987 bars nuclear-armed and nuclear-powered ships; the United States suspended its ANZUS security obligations to New Zealand in 1986 over the ban
  it: ''
- hash: 93061e11
  kind: cards
  en: 'A small defence base: spending just over 1% of GDP before the 2025 plan, and the plan is a floor rather than a ceiling, with commitments still subject to future budgets and business cases'
  it: ''
- hash: 730f4c8c
  kind: cards
  en: 'Exposure to US tariffs: 15% from August 2025 (10% in April), against 10% for Australia and the UK; the government expected no quick cut'
  it: ''
- hash: c6456635
  kind: cards
  en: 'Holding aid back to make the Cook Islands answer for its China deal gave Wellington leverage but not the outcome it wanted: the China partnership stayed in place, and the money came back in April
    2026'
  it: ''
- hash: e98ebcc6
  kind: cards
  en: 'New Zealand is a small, trade-dependent state whose security has rested on Australia and, at arm''s length since the 1986 rift, on the United States, the nuclear-free law being the price it chose
    to pay. Its real frontier is the Pacific: the Cook Islands'' partnership with China and the Chinese naval live-fire drill in the Tasman Sea in February 2025 show where its strategy is tested, and it
    answers with money, a defence build-up toward 2% of GDP and a closer defence relationship with Australia. Its commitments further afield (Ukraine training, Russia sanctions, the Philippines visiting-forces
    pact, the India trade deal) are real but modest, and on Palestine it held back recognition in September 2025.'
  it: ''
- hash: c7e94995
  kind: cards
  en: 'Stay out of other people''s wars and keep the sultanate intact under Sultan Haitham: neutrality is not a posture but the survival strategy of a small Gulf state with Iran across the Strait of Hormuz,
    Saudi Arabia on its land border and the United States on its ports. The test of the doctrine is the 2026 Iran war, in which Oman condemned the US-Israeli strikes of 28 Feb (''undermining active and
    serious negotiations''), was itself hit by Iranian drones at Duqm, Salalah and Sohar, and still refused to join either camp.'
  it: ''
- hash: 367993fb
  kind: cards
  en: 'Remain the Gulf''s indispensable go-between, above all between Washington and Tehran and between the Houthis and Riyadh: host the talks (Muscat 12 Apr 2025 to 6 Feb 2026, Rome, Geneva), broker the
    Houthi-US ceasefire of May 2025, the Yemeni prisoner exchange (Jan 2026) and detainee releases. Mediation is both Oman''s security insurance (everyone needs it unharmed) and its diplomatic capital.'
  it: ''
- hash: b7179744
  kind: cards
  en: 'Share the management of the Strait of Hormuz with Iran rather than leave it to Iran alone or to a US-led coalition: keep the southern shipping lane through Omani waters, accept an Iranian approval
    only for ships entering Iranian waters, charge no transit fees. The 17 Jun 2026 US-Iran memorandum endorsed a 60-day Iranian-Omani mechanism; Muscat and Tehran announced an ''understanding'' on a transit
    route map on 17 Aug.'
  it: ''
- hash: d4092c82
  kind: cards
  en: 'Keep the US and UK security cover without becoming a platform for it: formal access for the US Navy and Air Force (1980 facilities agreement; 2019 Strategic Framework Agreement for Duqm and Salalah),
    a UK Joint Defence Agreement (21 Feb 2019) and a British naval base at Duqm, an Indian naval zone at Duqm (Jan 2024). Each patron is given a berth, none a base for offensive use against a neighbour.'
  it: ''
- hash: 7d3a3c5a
  kind: cards
  en: 'Turn geography into rent and diversify from oil under Vision 2040 (launched Dec 2020): the Duqm special economic zone, Sohar and Salalah as ports outside the Strait of Hormuz, rail to the UAE (Hafeet
    Rail), the India CEPA (18 Dec 2025), LNG to Turkey, and a fiscal repair of which the personal income tax from 2028 is the symbol. Oil is still about half of GDP and 45% of government revenue.'
  it: ''
- hash: b220fdfd
  kind: cards
  en: 'Guard its autonomy against its larger Gulf neighbours: keep the borderlands of Musandam and Mahra out of Emirati hands (royal decree of Nov 2018 barring foreigners from land in strategic border areas),
    refuse Saudi-led groupings (no troops in the Yemen coalition, no part in the 2017 Qatar blockade, absent from the GCC leaders'' meeting in Jeddah on 28 Apr 2026) and keep the Gulf union an idea, not
    a structure.'
  it: ''
- hash: faf3a269
  kind: cards
  en: 'The sultanate as venue and channel: Foreign Minister Badr Albusaidi relays messages between Araghchi and Witkoff (Muscat 12 Apr 2025, Rome 19 Apr, Muscat 6 Feb 2026, Geneva 26 Feb 2026 at Oman''s
    UN residence), the Houthi negotiator lives in Muscat, US officials met Houthis at the US embassy in Muscat in September 2026 with Omani help. UN Secretary-General Guterres calls Oman an ''honest broker''.'
  it: ''
- hash: 17e6f4f8
  kind: cards
  en: 'Quiet statements through the foreign ministry and the Omani press, and rare public speech when the stakes are existential: Albusaidi''s Economist article of 18 Mar 2026 (the US ''lost control of
    its own foreign policy''), the call to ''reject escalation'' of 20 Aug 2026 after Trump''s second threat. The government did not answer Trump publicly; Omani commentators did.'
  it: ''
- hash: e0ef8615
  kind: cards
  en: 'A small professional force (Sultan''s Armed Forces) whose real weight is basing and training rights granted to others: US access to Duqm, Salalah and Masirah, the UK Joint Training Area and Duqm
    naval base, India''s naval zone at Duqm, joint Saif Sareea exercises with Britain. Oman does not fight in coalitions; it hosts and escorts. Defence rests on friends, not on force.'
  it: ''
- hash: 89b0615e
  kind: cards
  en: 'Ports and corridors as instruments: Sohar, Salalah and Duqm lie on or beyond the Gulf of Oman, so they became the bypass when Hormuz traffic collapsed (Omani ports handled 117% more exports from
    other GCC states after 28 Feb 2026). China takes about 90% of Oman''s oil exports and invests in Duqm; the UAE, India and Turkey are tied in by rail, CEPA and LNG.'
  it: ''
- hash: 697ad128
  kind: cards
  en: 'Exposed ports and no air defence worth the name against Iran: drones hit Duqm (1 and 3 Mar 2026), Salalah (3 and 11 Mar), a tanker off Muscat (2 Mar) and Sohar (13 Mar, two migrant workers killed);
    the IRGC claimed a ''heavy and surprise attack'' on Duqm logistics on 12 Jul 2026. The sultanate cannot retaliate and cannot leave the war.'
  it: ''
- hash: 96c2765c
  kind: cards
  en: 'US power: Trump threatened on 27 May 2026 that Oman would ''behave'' or be blown up, and again in the week of 17 Aug if it ''gets in the way''; former ambassador Sievers says Oman ''has not behaved
    as a neutral mediator''. The ports and arms depend on Washington; the US even moved its main channel to Pakistan.'
  it: ''
- hash: f148b928
  kind: cards
  en: 'A narrow fiscal base: oil is about 50% of GDP and 45% of government income; the income tax from 2028 and Omanisation of the workforce (in place since 1999) are slow fixes in a country with 5.3 million
    people, many of them expatriates.'
  it: ''
- hash: eea6d48f
  kind: cards
  en: 'Geography: Musandam, an Omani exclave, sits on the Strait of Hormuz, so any Iranian-US escalation lands on Omani soil and shipping; the Strait is, by Araghchi''s words of 15 May 2026, in the ''territorial
    waters of Iran and Oman''.'
  it: ''
- hash: 48e9919f
  kind: cards
  en: 'Isolation within the Gulf: the UAE-Oman rivalry in Musandam and Mahra (a 2019 spy trial of five Emiratis), Oman not present at the GCC meeting in Jeddah, and a Saudi Red Sea coalition (30 Jul 2026)
    in which Oman is not named among those who joined. Saudi Arabia and the UAE can squeeze it but cannot afford to push it into Tehran''s arms.'
  it: ''
- hash: '36423054'
  kind: cards
  en: The access that makes Oman safe makes it a target. The 2019 agreement that opened Duqm and Salalah to the US Navy is the reason Iran struck Duqm on 12 Jul 2026 (logistics and carrier-refuelling facilities)
    and warned that logistical support for US forces 'would be treated as war'; neutrality that is armed with a foreign base is neutral only so long as the other side believes it.
  it: ''
- hash: 643add6d
  kind: cards
  en: The more Oman delivers for Iran, the less Washington can use it. The Hormuz mechanism that Muscat accepted in the 17 Jun memorandum is read by Tehran as a recognition of its right to manage the whole
    strait and by Washington as a guarantee of free navigation; by August Trump threatened to bomb the mediator, and Pakistan, not Oman, had become the main channel.
  it: ''
- hash: f8a1da9b
  kind: cards
  en: Sharing the Strait legitimises the lever Oman fears most. A joint Iranian-Omani mechanism gives a veneer of sovereignty to the 'Persian Gulf Strait Authority' (5 May 2026) and to Iranian fees; Iranian
    lawmakers then say Iran would act 'with or without Oman'. Muscat wanted a condominium and got a precedent.
  it: ''
- hash: 756971c7
  kind: cards
  en: Standing apart from the Gulf bloc bought Oman its freedom and left it alone under fire. Refusing the 2017 Qatar boycott and the Yemen coalition made Oman the Gulf's bypass and broker; in March 2026
    it took drones at Salalah and Sohar with no GCC shield, and the Saudi-UAE-Qatar response was discussed in Jeddah without a clear Omani presence.
  it: ''
- hash: 6d44d8de
  kind: cards
  en: Every patron's berth raises the others' suspicion. China buys about 90% of Oman's oil and sits in Duqm's SEZ (reports of a Chinese base plan in 2023); the US holds access in the same port; India has
    its own zone; Britain its naval base. Oman sells all of them what they most want, which is why each suspects it of selling the others more.
  it: ''
- hash: b4c96d75
  kind: cards
  en: Keeping the Houthi door open protects the Yemeni border and Oman's reputation, but it cushions a group that on 22 Jul 2026 hit a Saudi ship (Oman answered the next day that it was working to resume
    the talks) and that took a stretch of Red Sea coast from Saudi-backed forces in September. Riyadh needs the channel and resents what it carries.
  it: ''
- hash: ec071b22
  kind: cards
  en: 'Oman in October 2026 is a neutral whose neutrality has been put under live fire.

    Its whole strategy since Qaboos is to be useful to every side and enemy to none:

    a venue for the Americans and the Iranians, a door to the Houthis, a berth for

    the US, British and Indian navies, an oil seller to China, a land bridge for

    the Gulf. The Iran war of 28 February 2026 tested each of those at once. Iranian

    drones hit three Omani ports while Muscat was still hosting the talks, Trump

    threatened twice to bomb the mediator, and the Hormuz deal Oman helped write

    on 17 June was read by Tehran and Washington as two opposite things. Luttwak''s

    logic shows in that gap: the instruments of a small state''s security (access,

    mediation, a share of the Strait) are the same instruments that make it a

    target and a suspect. What holds is that all sides still need Oman more than

    they distrust it: the US needs a channel on Hormuz and the Houthis, Iran needs

    the one Arab neighbour that answers its calls, the Saudis and Emiratis need a

    southern flank that does not break. Signals that are not rows: the government

    never answered Trump in public; Sultan Haitham flew to Abu Dhabi on 17 Aug,

    the day of Trump''s second threat, and to London on 2 July; the fiscal tax

    reform of 2028 shows the leadership expects the oil rent to shrink. Open gaps in

    this pass: Egypt, Jordan, Iraq, Pakistan, France and Russia (no sourced

    reading yet), the exact terms of the Saudi road link, and a primary text for

    the 2023 anti-normalisation measure.'
  it: ''
