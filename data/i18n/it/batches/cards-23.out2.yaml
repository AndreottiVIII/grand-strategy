items:
- hash: 0c943ff6
  it: |
    La corte che ha rimosso uno Shinawatra ha reso gli Shinawatra indispensabili. Dopo la rimozione di Paetongtarn (Aug 2025), i conservatori hanno conquistato 192 seggi in February 2026 ma, senza la maggioranza, hanno formato il governo con Pheu Thai, il partito di Thaksin, che ha portato la coalizione a circa 292 seggi su 499; Anutin è stato rieletto primo ministro il 19 Mar 2026 con 293 voti.
- hash: 21b841b5
  it: |
    Il dialogo con la giunta in nome dell'ordine potrebbe turbare l'ordine alla frontiera. Bangkok ha ospitato Min Aung Hlaing e poi il nuovo capo dell'esercito Ye Win Oo in August 2026, per assicurarsi la cooperazione su droga e truffe, diciotto mesi dopo aver tagliato l'energia alle sue città di confine; Burma News International ritiene che il dialogo possa aumentare la pressione sulla frontiera, e il Special Advisory Council for Myanmar afferma che la Thailandia « ha bruciato la propria credibilità ».
- hash: a3a57dfa
  it: |
    La Thailandia è il manuale di uno Stato che sopravvive piegandosi: alleato per trattato degli
    Stati Uniti, partner economico e ora fornitore di armi della Cina, partner nei vertici di Putin
    e Modi, partner strategico globale del Vietnam, e non ha pagato il prezzo di entrare in nessun campo.
    Il 2025 ha aggiunto il resto della lezione di Luttwak: lo stesso Stato che cede a ogni grande potenza
    ha combattuto il suo piccolo vicino, e in quella guerra il piegarsi è tornato. Bangkok ha tenuto il terreno
    (Crisis Group: controlla le alture e ha truppe su entrambi i lati della linea)
    ma la fine della guerra è stata decisa a Washington e a Putrajaya, con una minaccia tariffaria
    contro entrambi i belligeranti, e l'accordo che Trump ha indicato per Kuala Lumpur è stato sospeso dalla
    Thailandia entro due settimane dalla firma. La dinamica interna segue la stessa logica. Le corti che
    hanno rimosso Paetongtarn per una telefonata con Hun Sen hanno fatto della frontiera una prova di
    lealtà; Anutin ha assunto la carica su questo terreno, ha indetto le sue elezioni nel mezzo dei combattimenti
    e ha ottenuto 192 seggi, e deve governare con il partito di Thaksin; la monarchia e l'articolo 112 restano
    fuori da ogni compromesso, compresa l'amnistia del 2026. Avversario o rivale: il grado attribuito dalla
    Thailandia alla Cambogia è rivale, perché nessuno dei due governi cerca la fine dell'altro (la dichiarazione
    del 27 Dec 2025 impegna entrambi alla demarcazione attraverso la Joint Boundary Commission e le raccomandazioni
    dell'ICG riguardano un disgelo), anche se i combattimenti sono stati i più letali tra i due Paesi da decenni.
    Tre segnali non sono righe: Anutin è stato il primo leader dell'ASEAN a congratularsi con Min Aung Hlaing
    come presidente (April 2026) e lo ha ospitato in August, un disgelo che inverte il taglio di energia del 2025;
    gli Stati Uniti hanno applicato un dazio del 12.5% sui beni thailandesi in July 2026, mentre l'accordo
    reciproco è descritto come « all'ultimo paragrafo »; e la frontiera cambogiana resta chiusa agli scambi
    mentre entrambe le parti sostengono che il cessate il fuoco tiene. La manovra relazionale nei confronti della
    Thailandia non passa quindi per le sue alleanze, ma per le sue giunture: un alleato per trattato che acquista
    sottomarini cinesi e jet svedesi, un vicino della Cambogia che ha bisogno di un mediatore malese e di un patrono
    americano per porre fine alla propria guerra, e una giunta di cui ha più bisogno di quanto la rispetti.
- hash: e9068862
  it: |
    Mantenere la linea Rahmon e affidarla alla famiglia. Rustam Emomali, sindaco di Dušanbe dal 2017 e presidente del Senate da April 2020, è il successore costituzionale se il padre non può governare; un rimpasto del personale del 2025 è letto come una via di transizione graduale verso di lui. Rahmon, 73 anni, non ha successori al di fuori della famiglia.
- hash: c5e0776d
  it: |
    Impedire che il suolo afghano serva all'opposizione armata. Il NRF (in gran parte di etnia tagika, con una leadership che, secondo quanto riferito, si trova in Tagikistan) e Jamaat Ansarullah combattono nel nord-est dell'Afghanistan, e Dušanbe chiede che Kabul smetta di dare rifugio e di compiere incursioni oltre confine che raggiungono la propria frontiera.
- hash: 8aaedded
  it: |
    Fare di acqua ed energia un progetto nazionale e una leva sugli Stati a valle. Rogun, che con 335 m sarà la diga più alta del mondo, è la punta di diamante; l'Uzbekistan ha firmato per essa un quadro di acquisto di energia della durata di 20 anni.
- hash: e453096f
  it: |
    La 201ª base russa, circa 7,000 militari russi a Dušanbe, Qurghonteppa e Kulob in base a un contratto di locazione fino almeno al 2042, più una presunta installazione di sicurezza cinese a Shaimak, nel Gorno-Badakhshan, che entrambi i governi negano. La base è l'unica grande guarnigione straniera nel Paese; la postazione cinese è riportata, non confermata.
- hash: 24882d11
  it: |
    Esportazione di manodopera e idroelettrico. Le rimesse, circa il 48% del GDP nel 2024 e guadagnate in gran parte in Russia, tengono a galla il bilancio e le famiglie; Rogun è il tentativo dello Stato di vendere energia a valle, con l'Uzbekistan che ha firmato un contratto di 20 anni a USD 0.034/kWh (prezzo riportato da Fergana ed Eurasianet, non verificato sul contratto).
- hash: 62121cd3
  it: |
    La definizione dei confini come strumento: un Trattato sulle relazioni di alleanza con l'Uzbekistan (18 Apr 2024) e il trattato di confine con il Kirghizistan del 13 Mar 2025, che chiude la frontiera più pericolosa della regione dopo gli scontri del 2021-22.
- hash: 526c240f
  it: |
    Un mercato del lavoro che non controlla. Le rimesse sono circa il 48% del GDP, soprattutto dalla Russia; dopo l'attacco di Crocus in March 2024, la polizia russa ha effettuato retate tra i lavoratori dell'Asia centrale ed espulso cittadini tagiki, colpendo il denaro che tiene solvente lo Stato.
- hash: 2a65f3fd
  it: |
    Una frontiera che non può tenere da sola. Il confine afghano ha visto il primo scontro armato diretto con i talebani dal 2021 (24 Aug 2025, fiume Panj), ulteriori scontri in October e in December 2025, e un attacco che ha ucciso lavoratori cinesi il 26 Nov 2025. Dušanbe dipende dall'aiuto russo e cinese per sorvegliarla.
- hash: f9052e7e
  it: |
    Debito verso il suo primo creditore. La Cina detiene la quota maggiore del debito estero, oltre USD 700m su circa USD 3.04bn al 1 Oct 2026 (Times of Central Asia; nel 2016 la quota era circa la metà). I prestiti cinesi sono il motivo per cui Pechino ha leva su Dušanbe.
- hash: 9f7787ce
  it: |
    La Russia protegge il regime e il confine e si prende anche i salari che lo alimentano. La sua 201ª base e l'appartenenza al CSTO tengono Rahmon al potere, mentre la stretta russa sui migranti dopo Crocus (retate, espulsioni) riduce le rimesse che sostengono il bilancio: il protettore è anche chi stringe la morsa.
- hash: 4991b22d
  it: |
    Il Tagikistan è un piccolo Stato povero senza sbocco sul mare, gestito come un'impresa di famiglia e tenuto in vita dal lavoro dei suoi uomini in Russia. La sua sopravvivenza poggia su tre pilastri esterni: la guarnigione russa e il CSTO, un creditore e una presenza di sicurezza cinesi nel Pamir, e l'acqua e l'energia che spera di vendere a valle. I talebani sono il suo unico nemico dichiarato nella regione, e la minaccia che Dušanbe teme di più (ISIS-K e i jihadisti tagiki) è anche quella che la stretta russa sui migranti ha aggravato.
- hash: ea20178a
  it: |
    Mantenere la neutralità permanente riconosciuta dalle United Nations nel 1995 come l'intera strategia: nessun blocco, nessuna truppa, nessuna base sul proprio territorio, così che ogni grande potenza possa trattare con Ashgabat e nessuna possa costringerla a schierarsi.
- hash: a006c874
  it: |
    Vendere gas attraverso più gasdotti contemporaneamente, così che nessun singolo acquirente possa interrompere il flusso: la Cina ne assorbe la maggior parte, l'Iran e la Turchia sono coinvolti in uno swap, l'Afghanistan dovrebbe ricevere il TAPI e l'EU è lo sbocco sperato del gasdotto Trans-Caspian.
- hash: 7e728aab
  it: |
    Trasmettere il potere da padre a figlio senza rotture visibili: Serdar Berdimuhamedov è presidente dal 19 March 2022, mentre Gurbanguly Berdimuhamedov detiene il titolo di Leader nazionale e presiede il People's Council.
- hash: 02c65f77
  it: |
    Diplomazia multivettoriale come neutralità in pratica: il vertice US-Central Asia (C5+1) a Washington in November 2025, lo status di osservatore nell'Organization of Turkic States dal 2021, un membro effettivo di UN, IMF, World Bank, ECO e OSCE, e un partenariato INOGATE con l'EU.
- hash: 5cddb0cb
  it: |
    Il gas come unico strumento di politica estera: le esportazioni verso la Cina attraverso il gasdotto Central Asia-China sono la principale fonte di valuta estera, e ogni altra rotta (lo scambio con l'Iran verso la Turchia, la linea TAPI verso l'Afghanistan, il gasdotto Trans-Caspian) è un tentativo di trovare un secondo acquirente.
- hash: 5a9c80a1
  it: |
    Senza sbocco sul mare e accerchiato: lo status giuridico del Caspio non è stabilito, e Russia e Iran si oppongono alla linea Trans-Caspian per ragioni ambientali e giuridiche, così l'unica via verso l'Europa è bloccata da due dei suoi vicini.
- hash: e51b0c25
  it: |
    Un solo acquirente dominante: la Cina assorbe più di tre quarti delle esportazioni di gas turkmeno, quindi il gasdotto verso la Cina porta quasi tutti i ricavi; lo scambio con l'Iran verso la Turchia avrebbe dovuto raggiungere solo 1.3 bcm nel 2025.
- hash: e717b94a
  it: |
    Dipendenza dal transito: una rotta su due passa per uno Stato che Ashgabat non può controllare (l'Iran per lo scambio con la Turchia, l'Afghanistan per il TAPI, il cui tratto di Herat risultava di 101 km posati entro July 2026, dato auto-dichiarato).
- hash: a08c8b27
  it: |
    La neutralità che tiene Ashgabat fuori dai blocchi la lascia anche senza garante. La rotta Trans-Caspian verso l'Europa richiede il consenso caspico che Russia e Iran negano, e lo scambio con l'Iran richiede la buona volontà iraniana; così la politica che protegge il regime rende le sue rotte di esportazione ostaggio proprio dei vicini a cui rifiuta di unirsi.
- hash: 5f751e11
  it: |
    Il Turkmenistan conduce la strategia di uno Stato che ha comprato la propria sicurezza con una sola regola, la neutralità, e la spende in gas: ogni grande potenza ottiene una quota nel gasdotto, nessuna ottiene una base. Due decenni di questo hanno fatto della Cina il partner decisivo e hanno lasciato le altre rotte come opzioni anziché come entrate. Il passaggio dinastico del 2022 non ha cambiato la regola, quindi la scheda legge la leadership come continuità della stessa strategia.
- hash: 68d7daad
  it: |
    Far sopravvivere il bilancio dello Stato al petrolio e al gas. Il Petroleum Fund ammontava a US$18.43bn a end-June 2026, ma i prelievi cumulati (US$19.66bn) superano ciò che ha guadagnato (US$12.65bn), e l'IMF indica come priorità urgente un consolidamento fiscale graduale per evitarne l'esaurimento.
- hash: 076bbc06
  it: |
    Portare Greater Sunrise sul suolo di Timor-Leste: un gasdotto verso un nuovo impianto sulla costa meridionale anziché la rotta verso Darwin preferita da Woodside, un unico contratto di condivisione della produzione, una decisione finale di investimento mirata al 2029 e il primo gas nel 2034-35.
- hash: 96678b38
  it: |
    Ancorare lo Stato nel Sud-est asiatico e nel mondo di lingua portoghese: piena adesione all'ASEAN dal 26 Oct 2025 come cornice regionale, e la CPLP come cornice lusofona che non è un'alleanza di sicurezza.
- hash: 856c9d0d
  it: |
    Una linea coordinata tra il primo ministro Xanana Gusmao (in carica nel 2026) e il presidente Jose Ramos-Horta (in carica dal 2022), che tengono riunioni di coordinamento periodiche. La linea gestisce le agende di ASEAN e CPLP, e il presidente ha guidato la missione CPLP a Bissau dopo il colpo di Stato di Nov 2025.
- hash: ac993975
  it: |
    Il Petroleum Fund come strumento principale: US$600m sono stati trasferiti al bilancio nel solo Q2 2026. Timor Gap ha concordato di acquistare il 10% di Osaka Gas Australia in Greater Sunrise, che porterebbe la sua quota al 66.56%, subordinatamente all'unico contratto di condivisione della produzione.
- hash: 8d08c100
  it: |
    Sovvenzioni e pacchetti anziché prestiti: sovvenzioni giapponesi (440m yen di macchinari stradali, Dec 2025; 3,093m yen per l'ospedale Guido Valadares, 2024) e un pacchetto australiano di US$220m per lo sviluppo umano e US$80m per lo sviluppo del settore privato (Jan 2026). Le promesse della Chinese Eximbank per l'autostrada di Suai e l'aeroporto di Dili non si sono mai tradotte in accordi di prestito firmati.
- hash: 20a2fbff
  it: |
    Conti del fondo: l'IMF prevede che il Petroleum Fund scenda a US$12.8bn nel 2030 rispetto a US$18.3bn nel 2024, e la produzione di petrolio è cessata nel 2025, quindi nulla sostituisce i prelievi prima che arrivi il gas.
- hash: 8de29eac
  it: |
    Nessun ricavo dal giacimento principale prima del 2034: il primo gas di Greater Sunrise è slittato al 2034-35, e il regime fiscale e il contratto di condivisione della produzione erano ancora aperti nel 2026.
- hash: 514369fa
  it: |
    Mercato piccolo, fornitore esterno: circa il 70% dei beni sul mercato è di origine indonesiana, e USAID, un importante finanziatore, è stata smantellata nel 2025, quindi i pacchetti bilaterali di Canberra e Tokyo pesano di più.
- hash: aa0d4f43
  it: |
    La domanda di gasdotto è ciò che può far crescere di più il valore, ed è anche ciò che ritarda il primo gas: ogni round della disputa tra Darwin e la costa meridionale sposta la produzione più in là, mentre il fondo che deve colmare il divario continua a ridursi.
- hash: 603848a3
  it: |
    Timor-Leste è un piccolo Stato giovane il cui denaro è un fondo petrolifero speso più in fretta di quanto cresca, e il cui unico grande asset è un giacimento di gas oltre un confine marittimo stabilito nel 2018 che non riesce ancora a trasformare in entrate. La sua politica estera è il bilanciamento tipico di un piccolo Stato: l'Indonesia è il mercato e l'ex potenza occupante, l'Australia è il finanziatore principale con una ferita aperta per il caso di spionaggio del 2004, la Cina è la fonte di finanziamenti per cui in gran parte non ha firmato accordi, e il Portogallo è la lingua e l'identità condivise con la CPLP. L'adesione all'ASEAN (October 2025) è la cornice che ne fa uno Stato regionale anziché uno Stato dipendente, e la scommessa è Greater Sunrise: se Canberra paga un gasdotto verso la costa meridionale, il gas diventa un ponte per uscire dal fondo; se aspetta oltre il fondo, Dili non ha una seconda risorsa su cui contare.
- hash: b3f287b1
  it: |
    Mantenere la mano della monarchia sullo Stato mentre cambiano i governi eletti. Il primo ministro Sovaleni si è dimesso nel December 2024 poche ore prima di una mozione di sfiducia, dopo uno scontro con il re Tupou VI; Eke è rimasto in carica ad interim fino al voto di December 2025, quando il parlamento ha scelto Lord Fakafanua, nobile ed ex Speaker, con 16 voti contro 10.
- hash: 53c07054
  it: |
    Ridurre il debito verso la Cina e guadagnare margine di bilancio. Oltre US$120 million sono dovuti a Pechino (2024), circa un quarto del GDP; circa l'80% dei pagamenti dovuti va alla Cina, e la maggior parte del capitale scade entro il 2028.
- hash: '68974770'
  it: |
    Guidare l'agenda del Pacifico attraverso il Forum. Tonga ha ospitato il 53º Pacific Islands Forum Leaders Meeting a Nuku'alofa, 26-30 August 2024, con il suo primo ministro come presidente.
- hash: 0360a3b0
  it: |
    La mobilità della manodopera come leva. I tongani lavorano stagionalmente nel programma PALM australiano (2,680 in December 2025, in calo rispetto a circa 6,035 in April 2022) e nel programma RSE neozelandese (circa 1,676 nel 2025/26 secondo 1News; circa 1,000 secondo il vicepremier in July 2025: le due cifre sono in contrasto).
- hash: 343ed849
  it: |
    Bilanciare i donatori. Australia e Nuova Zelanda forniscono aiuti e sostegno al bilancio (l'Australia ha aggiunto A$30 million di sostegno al bilancio, secondo Lowy); la Cina presta denaro e offre aiuto di polizia; gli Stati Uniti hanno aperto un'ambasciata in May 2023 e hanno firmato un accordo di sicurezza marittima in February 2026. Tonga attinge a tutti e non si allinea con nessuno.
- hash: e90a2b81
  it: |
    Seggi nel Forum e nelle sedi multilaterali: membro a pieno titolo del Pacific Islands Forum e sua sede nel 2024, accanto alle adesioni al Commonwealth, all'UN e al WTO già presenti nei dataset.
- hash: c23977a4
  it: |
    Servizio del debito. Lowy riferisce che nel 2024 Tonga spende più per il servizio del debito che per la sanità, e che al picco i rimborsi assorbono più di un quinto delle entrate non da aiuti.
- hash: 33044ec2
  it: |
    Economia piccola, esposta ai disastri. L'eruzione e lo tsunami del 15 January 2022 hanno causato circa US$90 million di danni, circa il 18.5% del GDP (stima rapida della World Bank), e hanno interrotto per cinque settimane il cavo internazionale.
- hash: c6d84aa9
  it: |
    Dipendenza dalle rimesse. Le rimesse erano circa il 44% del GDP nel 2021 (circa US$220 million), soprattutto da tongani che lavorano stagionalmente all'estero, quindi un programma di lavoro in calo è uno shock macroeconomico, non una questione secondaria.
- hash: e45e8ca0
  it: |
    Per assicurare il suo Forum del 2024, Tonga ha accolto un ruolo di polizia cinese, mentre l'Australia, principale patrono, ha affermato che la Cina non ha alcun ruolo nella polizia del Pacifico. L'aiuto in materia di sicurezza che sembrava utile per il vertice è costato buona volontà al patrono dai cui programmi di lavoro e sostegno al bilancio Tonga dipende di più.
- hash: 366fb5df
  it: |
    La strategia di Tonga è sopravvivere bilanciando, non allineandosi: nessun trattato la lega a un patrono, ed è per questo che ogni suo posizionamento è di partner. Il suo denaro viene da prestiti cinesi che vorrebbe ridurre, da programmi di lavoro australiani e neozelandesi e da sostegno al bilancio senza i quali non può fare, e dalle rimesse che rendono la sua economia una funzione delle buste paga altrui. Il re è il punto fermo della politica tongana; i governi cambiano per voto parlamentare entro lo spazio lasciato dalla monarchia, e la ripresa dall'eruzione e il debito con la Cina sono le due prove dei prossimi anni.
- hash: 3a158f69
  it: |
    Mantenere in funzione Atlantic LNG con gas venezuelano. Il giacimento Dragon è la via: Atlantic LNG produce sotto la capacità nominale per mancanza di gas, e il ministro dell'Energia colloca le prime consegne dal Dragon al Q3 2027. Caracas ha congelato gli accordi sul gas in October 2025, quindi l'obiettivo dipende dal consenso del Venezuela.
- hash: b2e8c17a
  it: |
    Tenere Washington vicina mentre Caracas è ostile. Persad-Bissessar ha sostenuto gli attacchi statunitensi contro le imbarcazioni del 2025, e una nave da guerra statunitense ha attraccato a Trinidad in October 2025 nonostante le proteste di Caracas. Il legame di sicurezza con gli Stati Uniti è ciò che Port of Spain offre in cambio del gas di cui ha bisogno dal Venezuela.
- hash: 45335c20
  it: |
    Accesso a Washington. La licenza del Tesoro statunitense (OFAC) per il progetto Dragon, annunciata dal procuratore generale in October 2025, e la visita della nave da guerra statunitense dello stesso mese sono le due leve. Nation News riferisce in seguito che la licenza è stata revocata in April 2026, mentre il Trinidad Express la descrive come ancora in vigore: le fonti sono in contrasto e si conservano entrambe.
- hash: b00e60d1
  it: |
    Carenza di gas e un solo vicino. Il gas più vicino è il giacimento Dragon, condiviso con il Venezuela, e Caracas ha congelato l'accordo del 2025 e ha dichiarato il primo ministro persona non grata. Il vicepresidente venezuelano aveva già dichiarato che ogni gas esportato va pagato.
- hash: f40a0a40
  it: |
    Una piccola economia energetica con un solo mercato per il suo gas. L'economia di Trinidad è prevalentemente industriale e basata su riserve di petrolio e gas (Wikipedia, livello 4: un rinvio, non una fonte di riferimento). Il vincolo della carenza di gas è lo stesso fatto visto dall'impianto: il treno di liquefazione LNG funziona sotto capacità.
- hash: 9afc8cfa
  it: |
    Le mosse che hanno ottenuto il sostegno statunitense per la licenza Dragon, il sostegno agli attacchi contro le imbarcazioni e la visita della nave da guerra sono le stesse mosse che Caracas ha usato per congelare l'accordo sul gas. L'allineamento che sblocca il permesso di Washington è quello che chiude le molecole venezuelane di cui Trinidad ha bisogno.
- hash: 2ba80f85
  it: |
    Trinidad e Tobago gioca la carta del gas. Il suo impianto LNG funziona sotto capacità, e il giacimento di cui ha bisogno, Dragon, è condiviso con il Venezuela, quindi la strategia è acquistare molecole venezuelane mostrando una lealtà visibile verso Washington. Quella lealtà ha portato una licenza statunitense e una visita di una nave da guerra, e Caracas ha risposto nello stesso mese congelando l'accordo; le prime consegne, previste nel 2027, dipendono da un vicino che Port of Spain ha irritato e da un patrono che ha corteggiato.
- hash: 8781de9f
  it: |
    Mantenere la presidenza sotto controllo dopo la presa di potere del 2021: Saied ha ottenuto il 90.69% dei voti in October 2024 con un'affluenza del 28.8%, e il processo per cospirazione di April 2025 ha incarcerato decine di esponenti dell'opposizione e avvocati, con 34 condanne da 5 a 45 anni confermate in appello in November 2025.
- hash: baa46509
  it: |
    Finanziare lo Stato senza l'IMF: l'accordo del 2022 è crollato per i tagli ai sussidi cui Saied si è opposto, così Tunisi onora il proprio debito (una tranche di EUR 740m rimborsata in mid-July 2026) con denaro bilaterale e di Afreximbank, e mantiene in funzione il flusso di importazioni di carburante e farmaci.
- hash: 5fd5e51e
  it: |
    Trasformare il controllo delle migrazioni in denaro europeo e mobilità legale: il memorandum con l'EU di July 2023 (EUR 150m versati nel 2024 una volta che la Commissione ha ritenuto soddisfatte le sue condizioni), il memorandum italiano di January 2026 (4,000 ingressi di lavoro legali all'anno) e i visti di cui i tunisini hanno ancora bisogno (i rifiuti Schengen sono stati il 19.6% nel 2025).
- hash: d306b165
  it: |
    La migrazione come moneta di scambio: i memorandum con l'EU e l'Italia scambiano partenze con canali legali e denaro; il formato Algeria-Egitto-Tunisia sulla Libia (Il Cairo, May 2025) assegna a Tunisi un posto nel dossier del vicino.
