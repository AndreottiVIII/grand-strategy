items:
- hash: 281c0fc3
  it: |
    Diversificare i patroni mette sotto pressione quello che paga per l'esercito. La visita di Xi del settembre 2026 (una terza fase della zona TEDA, aerei cinesi in volo nel 2025 e il J-35 di cui si è parlato) invita il Congresso degli Stati Uniti a mettere in discussione i 1,3 miliardi di USD di aiuti che nessun altro sostituisce; la neutralità nella guerra in Iran tiene Washington e Teheran in dialogo con Il Cairo, ma irrita i Paesi del Golfo che finanziano l'Egitto.
- hash: 496ec053
  it: |
    La pace ha riaperto il canale e la guerra lo chiude di nuovo. Il vertice egiziano di Sharm el-Sheikh (ottobre 2025) ha posto fine agli attacchi degli Houthi e ha riportato Maersk nel canale; a settembre 2026 gli Houthi controllano la costa di Bab al-Mandab, quindi le entrate che il Cairo prevedeva (circa 8 miliardi di USD nel 2026/27) dipendono dalle guerre che media senza però controllarle.
- hash: e4f25957
  it: |
    L'Egitto è uno Stato che vende la propria posizione. Non è in grado di sfamarsi, di approvvigionarsi di energia o di finanziarsi da solo, quindi la strategia del regime di Sisi consiste nell'essere troppo centrale perché gli si consenta di fallire: il Canale di Suez e il valico di Rafah, il tavolo su Gaza, il seggio nella Lega Araba, un polo di liquefazione nel Mediterraneo, un esercito che può essere prestato al Golfo. Ciascuno dei finanziatori è un patrono diverso (l'IMF e la EU per il bilancio, il Golfo per la liquidità, Washington per l'esercito, Parigi e Berlino per gli armamenti, Mosca per la centrale nucleare, Pechino per l'industria) e il costo è che nessuno di loro è allineato agli altri su Sudan, Israele o Iran. Il 2026 ha allargato tutte le divergenze in una volta sola: la guerra USA-Iran ha raddoppiato la bolletta energetica e ha schierato caccia egiziani sul suolo emiratino mentre il Cairo si dichiarava neutrale; il gas israeliano, che doveva fare da ponte, è la leva che Gerusalemme usa contro l'accumulo militare nel Sinai; sono gli Houthi, non l'Egitto, a decidere se il canale porta entrate; e il Nilo è passato da disputa sull'acqua a competizione per le alleanze su tutto il Corno d'Africa, con l'Etiopia in guerra civile. La lettura di Luttwak è che le mosse dell'Egitto sono razionali a ogni livello e controproducenti tra i livelli: i guadagni tattici (un vertice, un deposito, un contratto) sono pagati con una dipendenza strategica che verrà richiesta indietro quando il programma dell'IMF terminerà nel dicembre 2026. Lacune di questa scheda: Giordania, Iraq, India, Regno Unito, Gibuti e lo status di Tiran e Sanafir non sono stati approfonditi (nessuna fonte reperita).
- hash: f1b76887
  it: |
    Impedire che la spinta etiope all'accesso al Mar Rosso si trasformi in un attacco al territorio eritreo: la rivendicazione di Abiy sull'accesso al mare viene letta ad Asmara come una pretesa su Assab, quindi l'obiettivo è tenere chiusi a essa il porto e il confine.
- hash: 9f622fac
  it: |
    Impedire che una forza armata tigrina si riformi accanto al confine: Asmara è stata esclusa dall'accordo di Pretoria del 2022, che ha disarmato il TPLF, e considera qualsiasi esercito tigrino rinnovato una minaccia sulla propria frontiera.
- hash: 1b357ace
  it: |
    Porre fine all'isolamento e trasformare il Mar Rosso in partner e risorse: la rete di Asmara con Egitto, Somalia e Sudan, i partner cinesi nelle miniere di Bisha e Colluli e il sostegno russo in sede UN.
- hash: 5447c1ba
  it: |
    La rete di Asmara: il trilaterale con Egitto e Somalia (Asmara, ottobre 2024), il vertice a quattro di El Alamein con il Sudan (4 ottobre 2026) e l'adesione al Red Sea Council guidato dall'Arabia Saudita, la cui carta del 2020 riguarda pirateria e contrabbando, non la difesa.
- hash: 166b3ea7
  it: |
    Un esercito di leva (vedi vincoli) che, secondo notizie non verificate del 7 ottobre 2026, sarebbe entrato nel Tigray attorno ad Adigrat e Idaga Hamus; il ministro dell'Informazione non ha smentito l'attraversamento e ha definito la cornice etiope di autodifesa una «fallacious narrative».
- hash: f06a37f0
  it: |
    Capitale dello Stato proveniente da miniere e diaspora: Zijin Mining (Cina) detiene il 55% della miniera di rame, zinco e oro di Bisha e l'impresa statale ENAMCO il 45%; il progetto di potassio di Colluli è passato nel 2023 da Danakali al gruppo cinese Sichuan Road and Bridge (si presume che l'altra metà appartenga a ENAMCO); la tassa del 2% sugli eritrei all'estero, che il governo chiama tassa di riabilitazione, è stata un bersaglio delle sanzioni UN dal 2011 fino a quando l'UN ha revocato le proprie misure nel 2018.
- hash: 94efb675
  it: |
    Servizio nazionale a tempo indeterminato: la proclamazione del 1995 fissa 18 mesi per i cittadini oltre i 18 anni, ma non si applica alcun termine fisso; Human Rights Watch sostiene che il servizio senza scadenza intrappola generazioni successive nel lavoro forzato, e il Relatore speciale UN (giugno 2026) segnala gravi abusi e motivi per ritenere che i crimini contro l'umanità proseguano.
- hash: 6505be13
  it: |
    Nessuna costituzione in vigore: la costituzione del 1997, approvata con referendum, non è mai stata applicata; il People's Front for Democracy and Justice è l'unico partito tollerato; Isaias Afwerki governa dall'indipendenza, nel 1993, senza una successione scritta, e Human Rights Watch fa risalire l'ultima sessione legislativa al 2010.
- hash: 81b53389
  it: |
    Un isolamento che ha lasciato traccia: le misure UN dal dicembre 2009 (risoluzione 1907, per la frontiera con Gibuti e il sostegno a gruppi armati somali) sono durate fino al 2018; la EU ha inserito l'Ufficio per la sicurezza nazionale nella propria lista il 22 marzo 2021; il divieto d'ingresso totale statunitense per i cittadini eritrei è in vigore dal giugno 2025 e ha superato l'ampliamento del dicembre 2025.
- hash: b1e536f2
  it: |
    La rete che tiene l'Etiopia lontana dal Mar Rosso è la prova che Addis Abeba usa contro l'Eritrea: il 1° ottobre 2026 l'Etiopia ha accusato Egitto, Eritrea e Sudan di sostenere il TPLF, e la rottura che ne è seguita, con truppe segnalate al confine, è l'escalation che la rete avrebbe dovuto scoraggiare.
- hash: ac63f1aa
  it: |
    L'Eritrea applica la strategia di uno Stato-guarnigione che ha trasformato l'isolamento in metodo: un esercito senza data di fine, una costituzione mai applicata e una rete di partner (Egitto, Somalia, Sudan, con la Russia in sede UN) costruita per tenere l'Etiopia lontana dal Mar Rosso. Il problema strutturale è che l'Eritrea controlla la costa e il porto che l'Etiopia vuole, quindi ogni mossa etiope su Assab viene letta ad Asmara come un attacco, e ogni mossa eritrea nel Tigray viene letta ad Addis Abeba come un'invasione. La rottura dell'1-2 ottobre 2026 mostra il paradosso in tutta la sua portata: la rete è per Addis Abeba la prova dell'accerchiamento, e il «no war, no peace» che Asmara ha mantenuto dal 2000 al 2018 si sta chiudendo lungo il confine.
- hash: f24c82ef
  it: |
    Presidiare il fianco meridionale: mantenere il Marocco collaborativo sulla migrazione e silenzioso su Ceuta e Melilla (che Madrid dichiara non negoziabili), e mantenere il flusso di gas algerino, corteggiando contemporaneamente le due capitali del Maghreb. Madrid sostiene il piano di autonomia del Marocco per il Sahara Occidentale (dichiarazione congiunta del 2022; ha accolto con favore la UNSCR 2797 nel dicembre 2025) e nel luglio 2026 ha riaperto i rapporti con Algeri.
- hash: e1b9e4e2
  it: |
    Restare al centro dell'EU e ridurre la condizione di isola energetica della penisola iberica: l'interconnessione nel golfo di Biscaglia con la Francia (prevista per il 2028), l'accordo EU-Mercosur che Madrid vuole applicato subito, la copertura dell'EU sugli scambi (a rispondere ai dazi statunitensi è Bruxelles, non Madrid) e sulla migrazione.
- hash: b248c3d5
  it: |
    Mantenere a basso costo la garanzia atlantica: restare nella NATO e nell'intesa sulle basi statunitensi, mantenendo la spesa per la difesa vicino al 2,1% del PIL invece dell'obiettivo del 3,5% + 1,5% concordato all'Aia nel giugno 2025, per tutelare lo Stato sociale e le finanze pubbliche.
- hash: 911ee086
  it: |
    Essere una potenza media fondata sullo Stato di diritto e contraria alla guerra su Gaza e Iran: riconoscere la Palestina (maggio 2024), embargo sulle armi a Israele per legge (ottobre 2025), rifiutare l'uso statunitense di Rota e Moron per la guerra in Iran (marzo 2026), declinare il Board of Peace di Trump. La linea tiene inoltre unita la sinistra della coalizione di governo.
- hash: 8fd919f6
  it: |
    Restare in carica e tenere insieme l'assetto territoriale: una coalizione di minoranza (PSOE e Sumar) che dipende dai voti catalani, baschi e di altre regioni, con elezioni politiche anticipate fissate per il 29 novembre 2026 dopo la decadenza dei decreti sulla casa, e con il rientro di Puigdemont ora sbloccato dal Tribunale costituzionale.
- hash: d9a7d528
  it: |
    Ricostruire una voce ibero-americana e mediterranea: il vertice ibero-americano di Madrid (4-5 novembre 2026) con Delcy Rodriguez invitata, il disgelo con il Messico dopo il riconoscimento degli abusi da parte del Re nel marzo 2026, i patti sulla migrazione con la Mauritania e la riapertura di Gibilterra nel quadro del trattato EU-Regno Unito del luglio 2026, mentre la rivendicazione di sovranità resta.
- hash: c8ba716f
  it: |
    Riconoscimento e diplomazia giuridica anziché forza: Palestina riconosciuta il 28 maggio 2024, un embargo totale sulle armi a Israele approvato dal Congresso dei deputati con 178 voti a favore e 169 contrari l'8 ottobre 2025, l'ambasciatore in Israele richiamato nel marzo 2026, una linea «No to the war» in sede UN (23 settembre 2026) e dichiarazioni congiunte con Rabat (2022) e Algeri (trattato di amicizia riattivato nel marzo 2026).
- hash: 40e0f28c
  it: |
    Inquadramento morale rivolto tanto al pubblico interno quanto a quello estero: il linguaggio di Sanchez sul «genocidio» a Gaza, la lettera di Rutte resa pubblica e usata per sostenere che la Spagna gode di un'esenzione dall'obiettivo del 5%, e il messaggio «You cannot play Russian roulette with the destiny of millions» rivolto a Trump (4 marzo 2026). Reuters ha rilevato che la posizione contraria alla guerra ha fatto guadagnare terreno al PSOE nei sondaggi di aprile 2026.
- hash: d0341622
  it: |
    Una forza modesta usata come veto e come copertura: il governo afferma che la spesa per la difesa ha raggiunto 35,4 miliardi di EUR nel 2026 (circa il 2% del PIL, triplicata dal 2018), truppe in Lettonia, Slovacchia, Romania, Bulgaria e Turchia invece di una percentuale più alta, e il controllo sovrano sulle basi a uso congiunto di Rota e Moron, che Madrid ha rifiutato per la guerra in Iran e da cui gli Stati Uniti hanno spostato 15 velivoli.
- hash: 63f6ec7b
  it: |
    Negoziati su energia e migrazione: il gas Medgaz dall'Algeria (34,5% delle importazioni nel 2025), un flusso inverso di GNL rigassificato verso il Marocco, patti sulla migrazione circolare (Mauritania, agosto 2024), una straordinaria regolarizzazione dei migranti senza documenti (circa 900.000 domande entro metà giugno 2026), acquisti che fanno anche da diplomazia (30 addestratori Hurjet turchi, dicembre 2025) e un'apertura pragmatica alla Cina (19 accordi nell'aprile 2026).
- hash: b7f22717
  it: |
    Una base parlamentare fragile: nessuna maggioranza propria, Junts (la destra nazionalista catalana) ha rotto con il governo nell'ottobre 2025, nessun nuovo bilancio viene approvato, e le elezioni anticipate del 29 novembre 2026 indicano, nei sondaggi attuali, una coalizione guidata dal PP con Vox, che porterebbe l'estrema destra al governo centrale per la prima volta dai tempi di Franco. Ogni linea di politica estera viene letta come una mossa elettorale.
- hash: 187008bc
  it: |
    Casi di corruzione nel partito e in famiglia: il caso delle mascherine Koldo/Abalos/Cerdan e le opere pubbliche (Abalos ha lasciato il seggio nel gennaio 2026 ed è processato al Tribunale Supremo da aprile), Begona Gomez rinviata a giudizio davanti a una giuria il 21 settembre 2026 per appropriazione indebita e traffico di influenze. Offrono all'opposizione, e ai ministri israeliani, un argomento contro le pretese morali del governo.
- hash: 19d814f1
  it: |
    Dipendenza energetica e «energy island»: l'Algeria ha fornito il 34,5% delle importazioni di gas nel 2025 e il 29,2% all'inizio del 2026; Medgaz è il gasdotto che l'Algeria ha ridotto del 25% nel maggio 2022, dopo la svolta sul Sahara; la penisola ha collegato ai Paesi vicini solo circa il 3% della propria elettricità, contro un obiettivo EU del 15% entro il 2030, e il blackout del 28 aprile 2025 (ENTSO-E: una catena di sovratensioni, «perfect storm») ne ha mostrato l'esposizione.
- hash: ccc3ce8d
  it: |
    Dipendenza dagli Stati Uniti per la sicurezza militare e dall'EU per il commercio: Washington può minacciare (Trump, il 3-4 marzo 2026: interrompere tutti gli scambi; l'8 luglio 2026: la Spagna «came back all the way»), ma solo Bruxelles può agire, quindi Madrid si nasconde dietro la competenza della Commissione, come ha detto Merz («no way to treat Spain particularly badly»). La base industriale della difesa è debole: il FCAS è collassato nel giugno 2026 e i nuovi acquisti di caccia e addestratori arrivano da partner.
- hash: 34568c8b
  it: |
    Politica migratoria all'interno dell'EU: dopo l'attraversamento di Ceuta del luglio 2026, l'Italia ha sospeso per agosto le intese di Schengen con la Spagna, e 22 Stati membri hanno scritto alla Commissione definendo la regolarizzazione un fattore di attrazione. La Spagna non può essere allo stesso tempo l'eccezione umanitaria e chi presidia la frontiera meridionale senza la sorveglianza della polizia marocchina.
- hash: bc1f9a47
  it: |
    Scarsa leva sul Marocco sull'unico tema che non può scambiare: Rabat ha riaperto, ad agosto 2026 e attraverso alcuni ministri, la rivendicazione su Ceuta e Melilla; la Spagna ha convocato l'ambasciatore e Madrid dichiara che «will never speak» sulla propria integrità territoriale, ma dipende dalla polizia marocchina per presidiare la frontiera e dalla benevolenza di Rabat per la rotta delle Canarie.
- hash: 027d2341
  it: |
    La svolta sul Sahara ha garantito calma a Rabat e ha avuto un costo per l'Algeria. Nel marzo 2022 Sanchez ha sostenuto il piano di autonomia del Marocco; Algeri ha richiamato il proprio ambasciatore, ha sospeso il trattato di amicizia e ha ridotto il Medgaz, e la Spagna ha compensato il gas da altre fonti. Nel luglio 2026, dopo il disgelo con Algeri, un attraversamento di Ceuta da parte di decine di migliaia di persone si è verificato con pattuglie marocchine segnalate come assenti; alcuni analisti lo leggono come irritazione di Rabat per il riavvicinamento algerino. Non si possono corteggiare entrambe le capitali del Maghreb senza che una delle due se ne accorga.
- hash: '70897355'
  it: |
    Risparmiare sulla difesa per tutelare lo Stato sociale fa della Spagna l'unico alleato che Trump nomina. La linea del 2,1% consente a Madrid di spendere per le pensioni, ma ha trasformato una disputa sulla spesa in una disputa su commercio e basi (minaccia di dazi dell'ottobre 2025, «cut off all trade» del marzo 2026) e nell'argomento di chi sostiene che la Spagna si avvale a costo zero della frontiera europea e dell'ombrello NATO. Madrid ha poi aumentato il bilancio di miliardi nelle settimane precedenti Ankara, concedendo nei fatti ciò che aveva rifiutato in linea di principio.
- hash: 9aaff03d
  it: |
    Rifiutare le basi ha procurato voti e ha avuto un costo in termini di protezione. Il rifiuto della guerra in Iran e l'embargo legato a Gaza hanno fatto guadagnare terreno al PSOE in patria (sondaggio Reuters, aprile 2026), ma hanno spinto gli Stati Uniti a spostare gli aerei cisterna da Rota e Moron, hanno messo Madrid contro Parigi, Berlino e Londra sull'Iran e l'hanno lasciata senza un canale con la Casa Bianca proprio mentre Washington riesamina la propria postura europea. La base che rende la Spagna utile agli Stati Uniti è quella che la Spagna ha ora dimostrato di poter chiudere.
- hash: 11d167d5
  it: |
    L'amnistia che ha comprato il governo ora contribuisce a farlo cadere. La legge di amnistia del 2023 ha ottenuto i voti catalani per l'investitura di Sanchez; Junts ha lasciato nell'ottobre 2025 per la sua mancata applicazione, e il 6 ottobre 2026 il Tribunale costituzionale ha ordinato al Tribunale Supremo di applicarla «preferentially and urgently», revocando il mandato d'arresto di Puigdemont tre settimane prima del voto del 29 novembre. La stessa logica impedisce alla Spagna di riconoscere il Kosovo, che Madrid legge attraverso la Catalogna, mentre il suo governo dipende dai voti catalani.
- hash: e219075b
  it: |
    La regolarizzazione rafforza il mercato del lavoro e indebolisce il peso della Spagna in Schengen. Circa 900.000 domande entro metà giugno 2026 hanno dato alla Spagna lavoratori e base imponibile, ma il 1° agosto 2026 22 Stati hanno definito la misura un fattore di attrazione, Italia e Francia hanno reintrodotto i controlli dopo Ceuta, e la Commissione non ha riscontrato alcun collegamento diretto. La Spagna guadagna lavoratori e perde credibilità presso i governi con cui deve collaborare nell'EU.
- hash: 073a4a0c
  it: |
    La copertura cinese alimenta la ferita aperta con gli Stati Uniti che avrebbe dovuto compensare. Sanchez è stato a Pechino quattro volte in quattro anni (aprile 2026: 19 accordi, un dialogo strategico) e presenta la Spagna come la voce pragmatica dell'EU, mentre il contratto da 12,3 milioni di EUR del ministero dell'Interno con Huawei per la conservazione delle intercettazioni disposte dai tribunali ha suscitato una lettera dei presidenti delle commissioni intelligence del Congresso statunitense, che chiedono se la condivisione di informazioni con la Spagna debba proseguire.
- hash: 06654aa0
  it: |
    La grand strategy della Spagna è la strategia di una potenza media che ha scelto di essere governata dal proprio diritto e dalla propria coalizione interna anziché dalla propria geografia, e la geografia ora presenta il conto. Il sud della Spagna è una frontiera con una monarchia con cui non si può permettere di litigare e un gasdotto da una repubblica che non può essere ignorato; a est è un'isola energetica; a ovest un alleato; a nord un partner riluttante (la Francia) e un rifiuto netto del conto atlantico (2,1% contro il 5%). Il governo Sanchez ha risposto a ogni pressione con un gesto giuridico (la lettera sul Sahara del 2022, la Palestina nel 2024, l'embargo sulle armi del 2025, il rifiuto delle basi nel 2026, la regolarizzazione), che ha procurato voti e prestigio morale ma ha accumulato debiti: Trump ora indica la Spagna come l'elemento anomalo, Israele e Spagna hanno declassato le rispettive ambasciate, il Marocco ha riaperto la questione di Ceuta e Melilla ad agosto 2026 dopo un attraversamento di massa, e l'Italia ha sospeso per un mese le intese di Schengen. La lettura di Luttwak è che i gesti sono stati poco costosi finché il sistema era amichevole, e sono diventati cari quando gli attriti sono arrivati tutti insieme: guerra in Iran, Ceuta, vertice NATO, Trump, un'elezione. Due segnali che non sono righe della scheda: il governo stesso giustifica la linea del 2,1% con lo Stato sociale e le finanze pubbliche, quindi è un compromesso interno tanto quanto una strategia, e le elezioni anticipate del 29 novembre 2026 rendono provvisoria ogni posizione qui descritta: i sondaggi indicano un governo guidato dal PP con Vox, la cui linea di politica estera su Gaza, Iran e America Latina probabilmente sarebbe diversa.
- hash: 50587bb3
  it: |
    Rendere impensabile un attacco contro l'Estonia e, se dovesse avvenire, sopravvivibile: spesa per la difesa al 5,43% del PIL nel 2026, una difesa avanzata sul confine russo (Baltic Defence Line, quartier generale della 1ª Brigata trasferito a Johvi, a 50 km dal confine, una base da 1.000 militari prevista a Narva) e un arsenale per attacchi in profondità (lanciatori HIMARS e Chunmoo).
- hash: 8ecfa419
  it: |
    Mantenere fisicamente in Estonia le forze alleate e la garanzia statunitense: il gruppo tattico NATO a guida britannica a Tapa (brigata britannica di rinforzo promessa per il 2027), la presenza statunitense a rotazione e una copertura europea (fornitori nordico-baltici, polacchi, tedeschi e coreani) contro una riduzione americana.
- hash: 3ff92aff
  it: |
    Fare in modo che la Russia perda in Ucraina e ne paghi il prezzo: aiuti fissati allo 0,25% del PIL annuo nell'accordo bilaterale di sicurezza del 2024 (0,28% previsto per il 2026, 0,35% nel 2025), confisca dei beni russi congelati, produzione congiunta per la difesa con Kiev e nessun accordo raggiunto sopra la testa dell'Ucraina.
- hash: 3d646c08
  it: |
    Recidere ogni dipendenza strategica dalla Russia e rafforzare l'infrastruttura che la sostituisce: uscita baltica dalla rete russa (febbraio 2025), divieto del gas russo dal 2026, protezione di Estlink e dei cavi del golfo di Finlandia, Rail Baltica in vista del 2030.
- hash: 89950bf3
  it: |
    Tenere sotto controllo il fronte interno contro la leva russa sulla minoranza russofona: abolizione costituzionale del diritto di voto locale per i cittadini russi e bielorussi (marzo 2025), una legge sulla Chiesa che obbliga la Chiesa ortodossa a recidere il legame amministrativo con il Patriarcato di Mosca (confermata dalla Corte suprema nel giugno 2026), valichi di frontiera chiusi o limitati.
- hash: 2b6f5198
  it: |
    Trasformare un piccolo Stato in un promotore dell'agenda: porre il fianco orientale in cima alle priorità di EU e NATO (Kaja Kallas come Alto rappresentante dell'EU; la linea di Michal secondo cui la difesa europea comincia ora dal confine orientale dell'EU), esportare un'industria della difesa (1,4 miliardi di EUR l'anno entro il 2030) e il marchio di Stato digitale e cyber (Locked Shields, CCDCOE).
- hash: eb5c9af1
  it: |
    Forum NATO e EU usati come moltiplicatori: la richiesta ai sensi dell'articolo 4 dopo lo sconfinamento di un MiG-31 del 19 settembre 2025, la posizione di Kallas a Bruxelles, la spinta alla confisca dei beni russi (l'EU ha mantenuto congelati circa 210 miliardi di EUR nel dicembre 2025, ma ha scelto un prestito finanziato con debito da 90 miliardi di EUR invece del prestito basato sulle riparazioni che Tallinn voleva), l'accordo bilaterale di sicurezza con l'Ucraina.
- hash: 7745a1fa
  it: |
    Attribuzione pubblica e ciclo di intelligence pubblico: i rapporti annuali del Servizio di intelligence esterna, l'incendio alla Milrem attribuito ai servizi speciali russi (29 settembre 2026) con convocazione dell'ambasciatore, l'espulsione da parte del Kapo di una recluta russa (febbraio 2026); gli stessi rapporti calibrano il messaggio secondo cui la Russia «has no intention» di attaccare nel corso dell'anno successivo, pur trattandola come la principale minaccia.
- hash: 6c8eb67a
  it: |
    Difesa avanzata e lungo raggio: Baltic Defence Line (600 bunker e circa 40 km di ostacoli previsti entro la fine del 2027, acquisti congiunti con la Lettonia), nove lanciatori HIMARS e nove Chunmoo ordinati (gittata di circa 300 km), la 1ª Brigata trasferita a Johvi, un gruppo tattico a guida britannica integrato nella brigata estone, un acquisto di difesa aerea dalla Germania (IRIS-T, circa 400 milioni di EUR) e un centro di eccellenza per la ciberdifesa a Tallinn.
- hash: 080c2ec2
  it: |
    Bilancio della difesa e industria come politica: 2,4 miliardi di EUR nel 2026, con un deficit pari al 4,5% del PIL accettato per finanziarlo; il 90% degli aiuti all'Ucraina (110,7 milioni di EUR nel 2026) speso in ordini presso aziende estoni della difesa; obiettivo di esportazione di 1,4 miliardi di EUR entro il 2030; sanzioni energetiche alla Russia (divieto del gas dal 2026) e integrazione della rete con la Finlandia e l'Europa continentale.
- hash: 90203ce5
  it: |
    Dimensione e distanza: la forza principale è stanziata a Tapa e Jõhvi, alla portata dell'artiglieria e dei droni russi, e gli stessi funzionari escludono la presa di Narva ma non le provocazioni destinate a mettere alla prova l'articolo 5 della NATO; il rinforzo dipende dal tempo di arrivo degli alleati.
- hash: 292c6b86
  it: |
    La variabile americana: il Pentagono ha cancellato una rotazione di brigata verso la Polonia, da cui avrebbero dovuto arrivare alcuni militari statunitensi per l'Estonia (parte della riduzione di 5.000 militari di maggio 2026); l'opinione pubblica estone dubita che Trump si affretti a difendere i Baltici, mentre Pevkur dice di fidarsi di Washington. La deterrenza poggia su un garante il cui impegno è la questione aperta.
- hash: bdb9161c
  it: |
    Gli attacchi ibridi restano al di sotto della soglia dell'articolo 5 e il diritto del mare limita la risposta: disturbi GPS, violazioni dello spazio aereo, tagli di cavi e sabotaggi attirano consultazioni ai sensi dell'articolo 4 ed espulsioni, ma non una risposta militare; il tribunale di Helsinki ha respinto il caso Eagle S per difetto di giurisdizione nella EEZ (3 ottobre 2025).
