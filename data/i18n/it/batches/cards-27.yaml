lang: it
items:
- hash: 8affd945
  kind: cards
  en: 'The 2025 G20 presidency put South Africa at the centre of the Global South and cost it the US trade bridge: Washington boycotted the Johannesburg summit, struck South Africa from the 2026 G20 in
    Miami, and let AGOA lapse.'
  it: ''
- hash: 1048f5ef
  kind: cards
  en: 'The ICJ case that earns standing in the Global South is the same case Washington cites when it cuts aid: Executive Order 14204 names the ICJ case among the ''egregious actions'' of the Republic.'
  it: ''
- hash: a27f576f
  kind: cards
  en: 'The more China buys, the more the economy locks into raw exports: South Africa sells minerals and farm goods to China and buys manufactures back, so the trade that grows is the one Pretoria itself
    says must be rebalanced.'
  it: ''
- hash: 36de3204
  kind: cards
  en: 'Non-alignment that reads as alignment: Pretoria calls itself neutral on Ukraine (Ramaphosa hosted Zelensky, praised his acceptance of an unconditional ceasefire and spoke to both Putin and Trump)
    and ''not anti-American'', yet each incident adds to the other column: the Lady R affair of 2022-23 (the independent panel found no weapons, but the accusation stuck), the China-led naval exercise with
    Russia and Iran in South African waters in January 2026, the Iranian corvette that took part despite the President''s order. The more even-handed the gestures, the more the US counts the incidents.'
  it: ''
- hash: 41f42aa0
  kind: cards
  en: 'BRICS and the rand: the bloc in which Pretoria claims a Global South voice (it sent Ramaphosa to the 18th summit in New Delhi, 12-13 September 2026, to push intra-BRICS trade and African infrastructure)
    is the bloc Trump threatened in July 2025 with an extra 10% tariff on countries aligned with its ''anti-American policies'', after which the rand slipped (about 1% in one report); the de-dollarisation
    talk that gives BRICS its meaning is what raises the cost of a dollar-priced rand and of the US market that South Africa is trying to win back.'
  it: ''
- hash: 81eba337
  kind: cards
  en: 'The unity government: the coalition formed after the ANC lost its majority in 2024 is what lets Pretoria speak to investors and to the West as a single stable voice, and it is now coming apart in
    public before the local elections: the DA says it will stop keeping disagreements private and its leader is ''not satisfied being a junior partner''. The most visible foreign-policy acts (the ICJ case,
    BRICS, the G20 stand) are ANC lines, so the more the ANC campaigns on them the more the unity that reassures investors looks like two parties. Our reading: no source in hand shows the DA opposing the
    ICJ case; the documented friction is over process and over Ramaphosa''s emergency private visit to Zimbabwe in early 2026.'
  it: ''
- hash: 9c69a795
  kind: cards
  en: 'South Africa under Ramaphosa''s government of national unity has moved from a balance between the West and the Global South to a deliberate Global South stance, with the ICJ case, BRICS and the 2025
    G20 presidency as its instruments of standing. The United States is its main rival in 2025-26, but the rivalry runs on tariffs, aid and the Afrikaner refugee question rather than on existence, and the
    AGOA lapse shows how cheaply Washington can apply pressure. China is the commercial anchor, and the trade deal in preparation is the test of whether Pretoria can turn minerals into value. The constraints
    are at home (the grid, the rand, a stalled economy) and in the neighbourhood (Nigeria''s leadership claim, a withdrawn DRC force), so the stance is louder than the capacity behind it.


    Added in the protagonist pass (16 October 2026). The 2025-26 pattern is a state that hosts the superpower''s rivals and still wants the superpower''s market: the G20 gavel was used against Washington,
    a China-led naval exercise with Russia and Iran was held in South African waters, and the answer to each accusation is a process (an inquiry, a board, a declaration) rather than a change of line. Europe,
    the UK and Germany took a different view from the US over the same record, so the break is bilateral, not Western. The clock is AGOA on 31 December 2026 and the local elections of the coming weeks,
    which test whether the unity government can still carry one voice. In the neighbourhood the state is stronger than its economy suggests: it chairs SADC, supplies the market and the currency, and has
    the bi-national commissions to prove it.'
  it: ''
- hash: d3bf220a
  kind: cards
  en: 'Turn copper into revenue without depending on one rail line or one buyer. Zambia is Africa''s second-largest copper producer (Al Jazeera). Lusaka keeps two export routes open at once: the US-backed
    Lobito corridor to the Atlantic and the China-backed TAZARA revival to Dar es Salaam. The 2026 election was fought on the cost of living, which only copper output and reliable power can pay for.'
  it: ''
- hash: 247a4582
  kind: cards
  en: Exit the IMF programme cycle on Lusaka's own reform terms. Zambia dropped its request to extend the IMF programme that expired in January 2026, without explanation, and talks on a new programme may
    run past the August election. The finance minister has named tax reform as the next administration's priority after the vote.
  it: ''
- hash: 94fa091d
  kind: cards
  en: 'Copper and the mines. Copper is the economy and the export earner; Lusaka''s lever is the mines'' output and the price, and the state utility ZESCO decides how much of it runs. Power is the bottleneck:
    the state utility rationed electricity to mining firms as Lake Kariba fell, and the Chambishi smelter (CNMC) cut a fifth of its output in March 2024 for lack of power. The reported 2025 power deficit
    was about 707 MW (a press figure, not checked against the utility).'
  it: ''
- hash: 7b6cd9c8
  kind: cards
  en: 'Corridor diplomacy: let two powers bid for the same rail routes. The US-backed Lobito corridor has a USD 553m DFC loan to the LAR consortium; the China-backed TAZARA concession of about USD 1.4bn
    (30 years) was signed in Beijing on 29 September 2025. Lusaka sits at the centre of both and keeps its seats in the African Union, SADC and the Commonwealth, the forums where it is a frontline-state
    voice rather than a client.'
  it: ''
- hash: bd5e4406
  kind: cards
  en: The IMF and the creditors set the budget. The programme cycle ended without an extension in January 2026, and the IMF has twice trimmed its 2026 growth outlook, to 4.3%, citing weaker mining output
    and energy constraints. Reports conflict on whether the programme is complete; the IMF's own page was not checked.
  it: ''
- hash: 0b3a325a
  kind: cards
  en: The drought is a physical limit. Lake Kariba's fall cuts hydro output, the state utility has rationed power to the mines, and the mines are first in line when the grid is short. Growth and copper
    output are capped by megawatts, not by the state's diplomacy.
  it: ''
- hash: 3e03e096
  kind: cards
  en: 'The copper plan needs power, yet both corridors Lusaka courts depend on the same grid that the drought has cut: the Chambishi smelter lost a fifth of its output to power shortages in 2024 while Zambia
    bid for a US line and a Chinese line at once. The more rails Lusaka secures, the more it needs megawatts to fill them.'
  it: ''
- hash: 8c79da4b
  kind: cards
  en: 'Zambia''s grand strategy is to turn world demand for copper into revenue and room to manoeuvre: keep the American Atlantic route and the Chinese route to Dar es Salaam open at once, so that no single
    rail line, lender or buyer holds the mines. The binding limits are physical and financial rather than diplomatic, since the drought-hit hydro grid and the IMF cycle decide how much copper moves and
    how much reform Hichilema, re-elected on 18 August 2026 with about 61% in a contested count, can afford. The paradox is that the two corridors depend on the same power the drought has cut, so the strategy
    is only as strong as the next dry season.'
  it: ''
- hash: d073a4d3
  kind: cards
  en: Keep Emmerson Mnangagwa in office to 2030. The Senate passed a constitutional amendment on 24 June 2026 by 75 votes to 4, lengthening presidential terms from five to seven years, ending direct election
    of the president (parliament elects him) and keeping him in office until 2030. The bill still needed his signature in the source read; the signature date is not verified.
  it: ''
- hash: 5d8a76ae
  kind: cards
  en: Turn lithium and other raw minerals into processing income at home. Harare suspended exports of raw minerals and lithium concentrate in February 2026 to push local processing, and officials say the
    policy drew more than USD 1bn into the lithium value chain. The ban is reported from search results; the article itself was not opened in this pass.
  it: ''
- hash: aa87fb53
  kind: cards
  en: Lithium and gold. Zimbabwe exported 1.128 million tonnes of lithium-bearing spodumene concentrate in the year to December 2025, up 11% on the year before, most of it to China for processing into battery
    materials. The raw-material export ban (February 2026) is the state's lever over that flow.
  it: ''
- hash: c9549abb
  kind: cards
  en: Control of the legal rules. The term extension moves the choice of president from the electorate to parliament. Critics call it a constitutional coup; search results (articles not opened in this pass)
    also report arrests of activists who opposed it and a court challenge dismissed on procedural grounds.
  it: ''
- hash: 8de2dd59
  kind: cards
  en: US sanctions and ZIDERA. In March 2024 the US designated eight individuals, Mnangagwa among them, and three businesses under the Global Magnitsky Act. Washington said it would sanction fewer people
    from then on, but the Zimbabwe Democracy and Economic Recovery Act (ZIDERA) still restricts access to international financial institution loans and investment.
  it: ''
- hash: 8a2426cf
  kind: cards
  en: A single buyer for the mineral chain. Most of Zimbabwe's lithium output goes to China and Chinese firms own the largest mines, so Beijing's processors set the terms of the value chain the export ban
    is meant to build. The 2022 USD 180m purchase of Bikita Minerals by Sinomine is the best-known case.
  it: ''
- hash: feb8e19d
  kind: cards
  en: The export ban meant to keep value at home favours the Chinese-financed plants that can afford processing. A Bikita community leader sees no tangible jobs from value addition, and smaller miners warn
    that processing plants, unreliable power and scarce finance keep them out, so the policy meant to widen the base may concentrate it.
  it: ''
- hash: 29cee669
  kind: cards
  en: 'Zimbabwe''s grand strategy is the survival of the ZANU-PF system under Mnangagwa: the 2026 amendment extends his rule to 2030 by moving the choice of president from voters to parliament. Its money
    comes from minerals, above all lithium, that flow mostly to China, which funds and buys the extraction, while the Western sanctions that remain (the 2024 Global Magnitsky listings and ZIDERA) keep the
    other door narrow. The export ban is the state''s attempt to turn that dependence into domestic value, and the paradox is that the Chinese-financed plants are the ones best placed to benefit from it.'
  it: ''
