# Translate every `en` into it. Write the translations to the file cards-27.out.yaml next to this one,
# as `items:` of `- hash: <same hash>` / `it: <translation>`, appending one item at a time (valid YAML at
# every step), never editing this file. Keep names, dates, numbers and quotes; register of a foreign-office
# brief: dry, precise, no flourish.
lang: it
items:
- hash: 453252fe
  kind: cards
  en: Citizens' mobility to the United States is restricted. Malawian business and tourist visa applicants face refundable deposits of up to US$15,000 (from August 2025), partial US entry limits apply from
    1 January 2026 (overstay rates cited by the US), and routine non-immigrant visa applications moved to Nairobi from 1 August 2026.
  it: ''
- hash: 8b613836
  kind: cards
  en: The programme that would unlock donor money requires the reforms the government avoids. The IMF says success 'will depend on the country's willingness to implement the economic reforms', while the
    government seeks a deal without the measures that would hit ordinary citizens hardest. The donors that cut in 2026 are the ones whose money a deal would have to bring back.
  it: ''
- hash: 5c1f6529
  kind: cards
  en: 'Malawi''s grand strategy in 2026 is to keep the currency and the budget alive while its donors leave: the IMF programme lapsed in May 2025 and no successor was agreed by August 2026, and the UK and
    the US have cut or withdrawn money. Its external ties are transactional (the US through a visa channel that is narrowing, Tanzania over the lake, where the prize is oil and gas) and the lake dispute
    is the one territorial stake the card can read. Not verified in this pass: the Nacala and Beira corridors and the Mozambique and Zambia relations, the Israel farm-worker scheme of 2023, tobacco as the
    export base, the cyclones and the famine, the EU and China money, and the deportation-flight talk, for which no source was found.'
  it: ''
- hash: ed9b7152
  kind: cards
  en: 'Keep Malaysia unaligned and make that the product. Stay open to Washington and Beijing at once (Anwar in Shanghai, September 2026: Malaysia stays neutral under US tariff pressure and keeps talking
    to Washington directly) and use the 2025 ASEAN chair to show that Kuala Lumpur can convene the room: the Putrajaya ceasefire between Thailand and Cambodia (28 Jul 2025), the Kuala Lumpur Peace Accord
    signed with Trump present (26 Oct 2025), Timor-Leste admitted as the eleventh member.'
  it: ''
- hash: 827db6fb
  kind: cards
  en: 'Hold the unity government together until the general election due by February 2028. The coalition has about 150 MPs (112 needed); UMNO''s president dared Anwar in mid-September 2026 to call an early
    election or expel UMNO, then backtracked; Barisan Nasional won Johor (48 of 56 seats, July 2026) and Negeri Sembilan (August 2026) through a pact with the opposition Perikatan. The Borneo states are
    kept in by concessions (MA63 council, 11 Sep 2026: more parliamentary seats, an interim MYR1.5bn each).'
  it: ''
- hash: f5a6816a
  kind: cards
  en: 'Climb the value chain and spread the markets: chip packaging, semiconductors and data centres (Penang, Johor) behind a record MYR426.7bn of approved investment in 2025, of which China MYR58.0bn,
    level with Singapore as the largest source. The trade web is widened rather than narrowed - EU talks resumed 20 Jan 2025, BRICS partner status from 1 Jan 2025, the Johor-Singapore Special Economic Zone
    - with a stated aim of less reliance on any single partner (Economy Minister Akmal Nasrullah, 2026).'
  it: ''
- hash: bd11b178
  kind: cards
  en: 'Defend maritime and territorial rights without a quarrel: Petronas keeps exploring in Sarawak''s exclusive economic zone (Luconia Shoals, Kasawari) despite Chinese objections; disputes with neighbours
    are parked in joint development (Ambalat, 27 Jun 2025); the dormant Philippine claim to Sabah and the USD 14.9bn award won by Sulu heirs are rejected without escalation. A China-ASEAN Code of Conduct
    is sought for 2026.'
  it: ''
- hash: b3d51363
  kind: cards
  en: 'Be the loudest Muslim-majority voice on Palestine without breaking with Washington: no relations with Israel before a peace agreement with Palestine, a ban on ZIM and Israeli-flagged ships and on
    Israel-bound cargo since December 2023, a channel to Hamas''s political wing, a formal protest over the interception of the Global Sumud Flotilla (2 Oct 2025).'
  it: ''
- hash: 62b1e4a5
  kind: cards
  en: 'Keep the neighbourhood''s fault lines from breaking while Malaysia holds the pen: Thailand-Cambodia (ASEAN observers, the bilateral ceasefire of 27 Dec 2025), the southern Thai insurgency (talks
    with the BRN facilitated from Malaysia, a high-level round planned there in September 2026), Myanmar and the Rohingya (Anwar says he will invite Min Aung Hlaing; Myanmar reportedly agreed to receive
    5,000 returnees in stages).'
  it: ''
- hash: 3decf578
  kind: cards
  en: 'Convening, as chair of ASEAN in 2025: Anwar hosted Hun Manet and Thailand''s acting prime minister at Seri Perdana for the ceasefire of 28 Jul 2025, then the Kuala Lumpur Peace Accord of 26 Oct 2025
    with Trump and Anwar as witnesses, and Timor-Leste''s admission on the same day (the first enlargement in over 25 years); Malaysian officers joined the ASEAN Observer Team on the border in March 2026.'
  it: ''
- hash: 3c5f8b93
  kind: cards
  en: 'Hedged invitations and memberships: Xi on a state visit (15-17 Apr 2025, 45 cooperation documents), Trump at the ASEAN-US summit (26 Oct 2025, the third US president to visit Malaysia), BRICS partner
    country from 1 Jan 2025 with India''s backing, comprehensive strategic partnerships with India (Aug 2024) and Vietnam (Nov 2024).'
  it: ''
- hash: bf223ac7
  kind: cards
  en: 'Moral framing and the Gaza line: ''the height of barbarism'' (Oct 2023), refusal of two US requests to designate Hamas (Nov 2023), dealing only with Hamas''s political wing (Mar 2024), a meeting
    with Hamas leaders in Doha (May 2024), mourning for Sinwar (Oct 2024). The same register is turned on Washington when it suits: on 4 Jan 2026 Anwar called the US operation in Venezuela a clear violation
    of international law.'
  it: ''
- hash: c2ba46d4
  kind: cards
  en: 'A small force with a convening role: the Five Power Defence Arrangements (1971) with Singapore, the UK, Australia and New Zealand, reaffirmed by defence ministers on 31 May 2025, and the Australian
    presence at Butterworth; the Chief of Defence Forces was tasked with restarting the Thai-Cambodian talks after the November 2025 landmine blast. At sea the answer to the Chinese coast guard is presence
    and private protest, not force.'
  it: ''
- hash: 626e49e7
  kind: cards
  en: 'Chips and data centres as leverage and as exposure: a strategic-trade permit for US-origin AI chips (from 14 Jul 2025, 30 days'' notice) answered US diversion concerns; the Agreement on Reciprocal
    Trade (26 Oct 2025: 19% rate, 1,711 zero-tariff lines, economic-security clauses on export controls, investment screening and critical minerals) was declared void by Malaysia in March 2026, yet the
    forced-labour import ban it required earned the lowest Section 301 rate (10%, from 24 Jul 2026).'
  it: ''
- hash: 97530c67
  kind: cards
  en: 'Chinese capital and rail: record approved Chinese FDI (MYR58.0bn in 2025), MYR28.6bn of potential investment from Anwar''s September 2026 visit and an in-principle extension of the East Coast Rail
    Link from Kota Bharu to Rantau Panjang on the Thai border, not yet approved by cabinet.'
  it: ''
- hash: '30887883'
  kind: cards
  en: 'Palm oil as a bargaining chip: a joint front with Indonesia against the EU deforestation regulation (Nov 2023, seeking allies and a low-risk classification), then EU free trade talks resumed on 20
    Jan 2025 (first round late June 2025; EU goods trade with Malaysia EUR 48.9bn in 2025).'
  it: ''
- hash: abad3075
  kind: cards
  en: 'Dependence on both sides of the quarrel. China has been the largest trading partner for 17 consecutive years (US$132.5bn in 2025, 17.7% of trade) and, level with Singapore, the largest source of
    approved FDI; the US market sets the tariff: 10% under Section 301 since 24 Jul 2026, with an excess-capacity finding pending that also counts third-country capacity routed through Malaysia.'
  it: ''
- hash: fb94e34d
  kind: cards
  en: Coalition arithmetic and the Malay vote. UMNO sits in the government and is rising on the back of the Johor and Negeri Sembilan wins and Najib's pardon; one scenario in the Fulcrum analysis is a PAS-led
    Perikatan sweeping the Malay belt; parliament expires in December 2027 and a general election must be held by February 2028, so Gaza, the US deal and China are all priced in Malay votes.
  it: ''
- hash: b03d2df6
  kind: cards
  en: The 1MDB legacy and the pardon. Najib was convicted again on 26 Dec 2025 in the 1MDB-Tanore case (25 charges, 15 years, to start after the SRC term, under appeal); on 18 Sep 2026 the Pardons Board
    let him serve the remainder of his sentence at home until 23 Aug 2028 against a MYR50m fine. The reform brand of the prime minister is tied to the party of the man it was built against.
  it: ''
- hash: 7850f3f3
  kind: cards
  en: A thin hand at sea. Chinese coast guard vessels keep a continuous presence at Luconia Shoals and have been reported within about 1,000 metres of platforms such as Kasawari, Jerun and Timi; Malaysia
    answers with private protest while Petronas keeps drilling, because China is the first trading partner.
  it: ''
- hash: 3adc0921
  kind: cards
  en: Singapore interdependence with open wounds. Johor's growth rides on Singapore capital (S$5.5bn of commitments since January 2024; Singapore level with China as top FDI source in 2025) while water
    (the 1962 agreement runs to 2061), airspace and the maritime boundary in the Johor Strait were still 'unresolved' at the 12th leaders' retreat on 4 Dec 2025.
  it: ''
- hash: ad836ae4
  kind: cards
  en: ASEAN's consensus rule and fragile settlements. Thailand suspended the Kuala Lumpur accord about two weeks after it was signed (10-11 Nov 2025), fighting resumed on 7 Dec and the ceasefire that held
    (27 Dec) was bilateral; Myanmar's government, now presented as civilian, still does not apply the Five-Point Consensus that ASEAN reaffirmed in May 2026.
  it: ''
- hash: 02059820
  kind: cards
  en: The broker's prize turned into the broker's problem. Anwar convened the Thai-Cambodian talks and the Kuala Lumpur Peace Accord with Trump present as the lever; about two weeks later Thailand suspended
    the accord (10-11 Nov 2025), fighting resumed on 7 Dec, and the ceasefire that held on 27 Dec was a bilateral one signed by the two defence ministers. A chair that borrows Washington's weight to convene
    ASEAN spends the neutrality it sells; a Malaysian critic wrote of an 'erosion of ASEAN neutrality'.
  it: ''
- hash: 869de9d0
  kind: cards
  en: The trade deal signed to avoid choosing had to be disowned in order not to choose, and the disowned deal still sets the tariff. The Agreement on Reciprocal Trade (26 Oct 2025) was never ratified and
    was declared void by trade minister Johari in March 2026 after the Supreme Court's IEEPA ruling of 20 Feb; yet in July 2026 Malaysia was put in the lowest Section 301 tier (10%, against 12.5% for the
    rest) in recognition of its commitment under the same agreement to ban forced-labour imports.
  it: ''
- hash: 830604c3
  kind: cards
  en: The chip hub that makes Malaysia indispensable makes it suspect. Packaging and data centres in Penang and Johor draw Chinese capital (MYR58.0bn of approved FDI in 2025) and the suspicion of Nvidia
    diversion that forced the permit rule on US chips (14 Jul 2025); the US excess-capacity probe now under way counts capacity from third countries that uses Malaysia as a route into the American market.
    Success as the 'China plus one' is what exposes it to American punishment.
  it: ''
- hash: 42e53750
  kind: cards
  en: Palestine buys the Malay vote and costs goodwill in Washington. Refusing two US requests to designate Hamas, meeting its leaders in Doha and banning Israel-linked shipping are cheap at home, but the
    Diplomat reported US pressure on Anwar to change the stance, and in 2025-26 Malaysia needed Washington's tariff relief and Trump's presence at the Thai-Cambodian accord.
  it: ''
- hash: d686103d
  kind: cards
  en: Quiet diplomacy on the South China Sea has not bought quiet seas. Kuala Lumpur keeps protests private and trade high, and the Xi-Anwar statement of April 2025 only looks forward to a Code of Conduct
    in 2026, yet Chinese coast guard vessels sit beside Kasawari, Jerun and Timi and Anwar has said Petronas will keep exploring regardless.
  it: ''
- hash: 138b53d9
  kind: cards
  en: A reformer's coalition rests on the party Najib built. The pardon of 18 Sep 2026 (house arrest until 23 Aug 2028) energised UMNO's grassroots, and in the same month UMNO's president dared Anwar to
    call an early election; the concession that holds the coalition also raises the price of staying in it.
  it: ''
- hash: 99f3f3c0
  kind: cards
  en: 'Malaysia is the middle power that chairs the room and sells neutrality in it. Its currency is access, not force: Xi in April 2025 and Trump in October, Hamas''s political wing and Washington''s trade
    negotiators, BRICS partner status and the Five Power Defence Arrangements, all at once. In Luttwak''s terms its strength is that the other powers cannot settle the room without it, and its weakness
    is that the neutrality has to be re-earned each time a power presses. The 2025 chair is the clearest case: the Putrajaya ceasefire and the Kuala Lumpur accord gave Kuala Lumpur a stage, then Thailand''s
    suspension and the December fighting showed that the stage rested on Trump''s attention; the reciprocal trade deal repeated the pattern in 2026, signed in October, voided in March, yet still setting
    the tariff. At home the logic runs the other way: the Malay vote that rewards Gaza and neutrality is the one UMNO, PAS and Najib''s pardon now contest, and the election is due within 16 months.

    Signals that are not rows: Anwar in Shanghai in September 2026 saying that Malaysia stays neutral and that Beijing understood; UMNO''s dare of the same month; the rail extension to the Thai border agreed
    in principle and not yet approved. Gaps in this pass (no source read, nothing written): Japan, Turkey (drones, the Islamic axis), Saudi Arabia and the Gulf (hajj, petrochemicals), Iran (ship-to-ship
    transfers), and the detail of Australia, the UK and New Zealand beyond the FPDA; Singapore''s water price and Pedra Branca rest on one tier-4 pointer.'
  it: ''
- hash: 3489d6e5
  kind: cards
  en: Close the genocide question with Germany on Namibian terms. The 2021 joint declaration (recognition of the 1904-1908 killings and about EUR 1.1bn over 30 years, framed as development aid) was rejected
    in Namibia and never signed. President Nandi-Ndaitwah says the revised text is nearly finished, will go to parliament, and should be concluded by the end of 2026.
  it: ''
- hash: 2e8d530a
  kind: cards
  en: Turn Orange Basin oil and green hydrogen into the new economy. TotalEnergies is operator of the Venus block (PEL 56); the company has said it is ready to take a final investment decision once talks
    with the government are finished, which is not confirmed in the sources found. The EU green partnership was renewed for 2026-2030 in May 2026.
  it: ''
- hash: 4e70d4dd
  kind: cards
  en: Mineral exports to the United States (N$5.52bn in 2024, up from N$1.09bn in 2023, mostly minerals) and Chinese equity in uranium, the largest being the Husab mine, which New Era reports as China's
    largest single investment in Africa. Ownership figures differ across sources, and the Walvis Bay port link is not verified in this pass.
  it: ''
- hash: 35a511eb
  kind: cards
  en: 'Multi-alignment on the energy file: a green hydrogen pipeline assembled for Team Europe financing (HyIron, Hyphen, Zhero, Cleanergy, Daures) and a 2026-2030 renewal with the EU, while Nandi-Ndaitwah
    met China''s foreign minister as president-elect (January 2025) and discussed nuclear cooperation with a Russian deputy prime minister (spring 2025).'
  it: ''
- hash: 72057a0e
  kind: cards
  en: The United States has tightened the door it used to keep open. A 21% reciprocal tariff on Namibian goods was announced in 2025 and the government warned it could override AGOA; AGOA lapsed on 30 September
    2025 and was reauthorised for one year, to 31 December 2026 (a later single report says 2028; not verified). A new bilateral trade pact is being sought.
  it: ''
- hash: 0f14aa0a
  kind: cards
  en: The German deal must pass a domestic test. The Landless People's Movement and eleven traditional authorities have asked the government attorney to set the joint declaration aside, and the Ovaherero
    Genocide Foundation opposes it; affected communities contest the government's monopoly on the negotiation. The National Assembly has been asked to be patient until the revised text is tabled.
  it: ''
- hash: 552c133a
  kind: cards
  en: The oil that pays for the state is also the fossil dependency that the EU green partnership is meant to replace. Namibia courts European green finance and Chinese and Western upstream capital at the
    same time, so the decarbonisation partner also profits from the new oil.
  it: ''
- hash: 6a02b3af
  kind: cards
  en: 'Namibia''s strategy under Nandi-Ndaitwah is to convert its minerals and its new offshore oil into a revenue base while keeping every large patron in play: China for uranium capital, the EU for green
    hydrogen finance, the United States for trade access, and Germany for the historical settlement it cannot close without its own communities. The constraint that binds most tightly is domestic, since
    the genocide settlement and the land question require consensus that the government does not yet have. The land question is not researched in this pass and stays open.'
  it: ''
- hash: b7355c18
  kind: cards
  en: Keep the officers in power after the July 2023 coup that ousted President Bazoum, with Russia's Africa Corps guarding the capital and its airport. Moscow confirmed its forces helped repel the ISIL
    attack on Niamey airport in February 2026 and helped put down an attempted coup in August 2026. Every other choice below serves the regime's survival.
  it: ''
- hash: bc996a0c
  kind: cards
  en: Take the state's mineral and oil revenue out of foreign hands. The junta approved the takeover of the Somair uranium mine on 19 June 2025, where Orano held 63.4 per cent, and the government says Orano
    took 86.3 per cent of output from 1971 to 2024 (Al Jazeera puts Orano's stake at 63 per cent). In March 2025 it gave three Chinese oil directors (CNPC, WAPCO, SORAZ) 48 hours to leave, citing a pay
    dispute over local staff.
  it: ''
- hash: b85a5440
  kind: cards
  en: Reopen the one trade route to the sea. The border with Benin has been shut since the 2023 coup and the crude pipeline to Benin's port is the state's only oil outlet; on 2 June 2026 Niamey and Cotonou
    agreed to reopen the border through an expert committee given 15 days. The committee's outcome is not verified in this card.
  it: ''
- hash: 28d34e82
  kind: cards
  en: Hold the Tillabéri border against the jihadists. JNIM and the Islamic State's Sahel province (ISSP) now fight each other and the state in the same western provinces. ISSP attacked the military bases
    at Inates (at least 51 soldiers killed) and Banibangou (34) on 15 June 2026, and JNIM hit the Niamey airport, which hosts Air Base 101 and the Africa Corps, three days later.
  it: ''
- hash: 55fea0ea
  kind: cards
  en: 'The Alliance of Sahel States. Niger, Mali and Burkina Faso left ECOWAS together, the exit taking effect on 29 January 2025, and launched a joint passport and a joint military arrangement, a bloc
    of juntas that sets the state''s foreign line. Outside the bloc, Niamey keeps a second door open: Tiani''s visit to Algiers on 15-16 February 2026 is read as a search for another outlet, given the Benin
    pipeline dispute.'
  it: ''
- hash: ac697345
  kind: cards
  en: 'The Africa Corps as the regime''s guard. Moscow confirmed its forces helped repel the ISIL attack on Niamey airport (3 February 2026) and helped put down an attempted coup (August 2026). Russia had
    also announced in April 2025 that it would reopen its embassy in Niamey. The guard protects the capital, not the whole territory: see the Tillabéri paradox below.'
  it: ''
- hash: e2448879
  kind: cards
  en: Uranium and crude oil. Somair, nationalised in June 2025, is the state's only active uranium mine after the 2024 removal of Orano's operational control of its other mines (Al Jazeera). Crude is exported
    through the Benin pipeline, whose loading Benin blocked in May 2024 until Niger reopened its side.
  it: ''
- hash: 5378be62
  kind: cards
  en: Landlocked, with one way to the sea. Every route to a port runs through Benin, whose border has been shut since July 2023, or through the Nigerian frontier, where relations are being negotiated case
    by case (a Nigerian foreign-minister visit was planned for April 2025 after Niamey accused Abuja of backing an armed group). The junta cannot choose its outlet; it can only choose which neighbour to
    fight.
  it: ''
- hash: 190359dd
  kind: cards
  en: Security on its own soil. JNIM and ISSP strike Tillabéri and the capital's airport, and the province accounted for more than 1,200 of the 1,939 deaths recorded in Niger in 2025 (ACLED data, cited
    by ADF Magazine).
  it: ''
- hash: e9676197
  kind: cards
  en: 'No regional or Western cover. The three juntas left ECOWAS, which asked that their passports stay recognised and their citizens keep visa-free rights only until further notice. The exit removes the
    bloc''s mediation, its financing and its legitimacy from the security problem. Our reading: what remains is bilateral money and the Russian guard, both of which are hard to sustain without a trade outlet.'
  it: ''
- hash: cbbcc8ce
  kind: cards
  en: Sealing the state off as a defence, then buying the way out. The Benin border closure, kept on the Nigerien side even after ECOWAS lifted its sanctions, was meant to punish a neighbour; it cut the
    state off from its only sea route and from its own pipeline revenue, and the reopening Niamey now negotiates is the price of that isolation.
  it: ''
- hash: f4d3a264
  kind: cards
  en: The guard that cannot hold the gate. The Africa Corps protects the capital and its airport, yet the ISSP attack on Niamey airport in January 2026 and JNIM's raid in June 2026 both reached the same
    airport, which hosts Air Base 101 and the Russian force, and ISSP killed dozens of soldiers in the bases of Inates and Banibangou. Russia's protection is for the capital; the war is in the provinces.
  it: ''
- hash: 9529f985
  kind: cards
  en: Taking the mine from Orano turns a French asset into a court case. The junta answers Orano's 86.3 per cent of output with a nationalisation and a sovereign win at home, but Orano replies with arbitration
    and lawsuits, so the state must now defend a mine it runs in courts abroad and at home.
  it: ''
- hash: 1a7fecd8
  kind: cards
  en: 'Niger''s junta has traded the old French security partnership for a Russian guard and a regional bloc of juntas, and it has tried to pay for its isolation by taking the uranium and the oil out of
    foreign hands. Its two real problems are geography and war: a landlocked state whose only outlets run through Benin and the Nigerian frontier, and a Tillabéri border where JNIM and the Islamic State''s
    Sahel province strike the bases and the capital''s airport. The paradox is that each act of sealing the state off, from the Benin border to the ECOWAS exit to the expulsions, shrinks the outlets the
    uranium and the oil need, while the Russian guard protects the capital and not the provinces where the state is losing. Luttwak''s reading is a regime that chose isolation as a defence and must now
    buy its way back out through partners it has already expelled.'
  it: ''
- hash: 0c2860e7
  kind: cards
  en: 'Win the presidential election of 2027 with the reform record as the campaign: Tinubu seeks re-election on the APC ticket, and the polling date is disputed (the electoral commission''s 20 February
    2027 against a report giving 16 January). Every choice below is priced against that vote.'
  it: ''
- hash: 5c1bea6f
  kind: cards
  en: 'Turn the oil into dollars and hold the naira: production at the OPEC quota (1.53 million bpd in September 2026 per OPEC''s report of October, against a quota of 1.5 million and a budget target of
    1.84 million including condensates), while the Dangote refinery takes domestic crude that would otherwise be exported. Sharpened on 2026-10-16: the first draft said ''above the quota, 1.573 million
    bpd in August''; the 13 October report, citing OPEC, gives 1.50 million for August and 1.53 million for September, so the earlier figure was a secondary-source estimate that OPEC''s later data contradicts.'
  it: ''
- hash: 308202bd
  kind: cards
  en: 'Keep ECOWAS as the regional instrument and win the Sahel back: the AES exit leaves the bloc without its Sahel flank, Abuja wants the AES back ''under a different status'' so that ECOWAS survives,
    and the Lake Chad task force (MNJTF) against Boko Haram and ISWAP has had no regional operation since July 2024.'
  it: ''
- hash: ab5e4c0f
  kind: cards
  en: 'Keep the claim to lead Africa against South Africa''s co-claim: Nigeria''s case rests on its population, its oil, its role in founding ECOWAS and its peacekeeping, and South Africa now competes for
    the same standing through its G20 seat and its ICJ case against Israel.'
  it: ''
- hash: af31a31c
  kind: cards
  en: 'Stay inside Washington''s security tent while Washington brands the state: keep the joint campaign against ISWAP and the health compact (nearly USD 2bn of US grants for 2026-2030, against 6% of budgets
    spent on health), and get the ''Country of Particular Concern'' designation lifted or left without sanctions. Tinubu: ''We will overcome the CPC designation''; the second Joint Working Group met in
    Washington on 12 August 2026 with no change to the listing.'
  it: ''
- hash: cdcc7568
  kind: cards
  en: 'Convert size into rank and spread the risk: a permanent seat on the UN Security Council (''Nigeria must have a permanent seat'', Tinubu''s address read by the vice president on 24 September 2025),
    BRICS partner status since January 2025, a continuous seat on the AU Peace and Security Council since 2004 (chair in May 2026), and new security and trade partners in Turkey, the Gulf and Brazil so
    that no single patron holds the key.'
  it: ''
- hash: 5a037b0a
  kind: cards
  en: 'ECOWAS and the Atlantic partnerships around it: Abuja, which helped found the bloc, sits in the ECOWAS that imposed sanctions on Niger after the 2023 coup; the bloc backed the Nigeria-Morocco pipeline
    agreement at its July 2026 summit; the UK strategic partnership (November 2024) is the most formal Western tie.'
  it: ''
- hash: fd544651
  kind: cards
  en: 'Counter-terrorism with foreign help: US strikes on ISIS sites in Sokoto (25-26 December 2025) with Abuja''s consent, a joint operation that killed the ISWAP leader al-Minuki (15 May 2026, per Trump),
    a UK security and defence dialogue in Abuja (June 2026); AFRICOM withdrew almost all personnel by 3 July 2026 and kept intelligence assets.'
  it: ''
- hash: 5efd6e2b
  kind: cards
  en: 'Oil, debt and the gas corridor: crude exports (OPEC quota compliance for five months to September 2026; the first draft said four months to August, updated by the 13 October report), the Dangote
    refinery meant to end fuel imports, and the Morocco pipeline (USD 25bn, first gas expected in 2031). External debt is about USD 54.5bn: the World Bank''s IDA is the largest single creditor and China
    Exim the largest bilateral one.'
  it: ''
- hash: c884472a
  kind: cards
  en: 'The counter-narrative and the lobby: Abuja rejects the ''genocide'' framing (Tinubu: ''The characterization of Nigeria as religiously intolerant does not reflect our national reality''; the information
    minister calls the US claims ''based on faulty data''), then engages the same Washington through two Joint Working Groups (Abuja, 22 January 2026; Washington, 12 August 2026, led by the National Security
    Adviser Nuhu Ribadu) and a UN-reform message carried at the General Assembly.'
  it: ''
- hash: 920779ad
  kind: cards
  en: 'Multi-alignment as insurance: Turkey (a military-cooperation protocol during Tinubu''s state visit to Ankara in January 2026, 200 special-forces personnel to be trained in Turkey from the Antalya
    agreement of April 2026), the Gulf (an economic partnership agreement with the UAE concluded in January 2026), BRICS partner status (January 2025), Brazil (an air-services agreement, August 2025) and
    a readmission agreement initialled with the EU in March 2026.'
  it: ''
- hash: 5b9dbb3b
  kind: cards
  en: 'Gas pipelines as regional leverage and as a partner network: the West African Gas Pipeline carried about 80 million MMBtu in 2025 (+22%), with Nigeria supplying more than 68% of the 613 million MMBtu
