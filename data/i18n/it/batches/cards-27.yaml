- hash: e62da653
  kind: cards
  en: 'Nigeria is the region''s indispensable state and a leader short of the means to lead: it holds the oil, the population and the ECOWAS flag, but its money goes to debt service, its north is pressed
    from the Sahel, and it relies on outside force and outside capital to fight insurgents it cannot beat alone. Its moves work against its aims in three places: the Sahel, where the ECOWAS sanctions on
    Niger drove the AES out and left the Lake Chad force without Niger; the oil, where the refinery built to end imports takes the crude that earns the dollars; and Paris and Washington, where the partners
    it courts bring frictions it must then manage at home. The 2027 election will decide whether the reform record survives its costs, which makes every concession to a partner a domestic question. Enriched
    on 2026-10-16: the patron it leans on is also the one that labels it (CPC, Child Soldiers Act listing), the giant could not fly a transport home through Burkina''s sky without an apology, and the strong
    naira is a reform success whose benefit to the budget is unproven; Abuja''s answer is to spread its bets (Ankara, the Gulf, Brasilia, Delhi, BRICS) rather than to pick a patron. This is a structural
