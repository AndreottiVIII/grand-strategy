  it: ''
- hash: fcf2a4dc
  kind: cards
  en: 'Recover the Chagos Archipelago, Diego Garcia included, through the treaty signed with the UK on 22 May 2025: sovereignty to Mauritius, with a 99-year lease of the base back to London. Ratification
    has stalled: the Bill ran out of time in the Lords, London has accepted that US consent cannot be secured for now, and the handover was shelved in April 2026.'
  it: ''
- hash: 5996f577
  kind: cards
  en: 'Sell its Indian Ocean position to both Asian powers: India''s ''enhanced strategic partnership'' (state visit of 11-12 March 2025, eight agreements, maritime security and trade in local currencies)
    and China''s free trade agreement, in force since 1 January 2021 with duty-free access to 7,504 tariff lines at entry into force.'
  it: ''
- hash: b3c5d270
  kind: cards
  en: India's money and presence. India funded the Agalega airstrip and jetty, opened by video link in February 2024; Mauritius says Agalega is no military base, while local protests read the project as
