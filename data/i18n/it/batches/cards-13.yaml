# Translate every `en` into it. Write the translations to the file cards-13.out.yaml next to this one,
# as `items:` of `- hash: <same hash>` / `it: <translation>`, appending one item at a time (valid YAML at
# every step), never editing this file. Keep names, dates, numbers and quotes; register of a foreign-office
# brief: dry, precise, no flourish.
lang: it
items:
- hash: c4cf1a2a
  kind: cards
  en: 'Concessions to whoever can protect the regime: the Kyaukphyu port and the Muse-Mandalay railway to China, direct yuan-kyat and rupee-kyat settlement, a nuclear plant and refinery talks with Russia,
    and heavy rare earths offered in turn to China, India and the United States.'
  it: ''
- hash: 7378ade1
  kind: cards
  en: 'It cannot win the war on the ground: the army''s stable control is estimated at 72-220 of 330 townships and resistance forces took 96 towns by Dec 2025; DW reads 2026 as a stalemate in which the
    army is regaining ground, not recovering the country. Manpower comes from conscription.'
  it: ''
- hash: 701cde0c
  kind: cards
  en: Beijing holds the dials on the northern front. The handback of Lashio on 22 Apr 2025 followed a Chinese commodities blockade and the reported detention of MNDAA leaders; the TNLA's position then worsened
    with the closure of the Namkham gate. The army moves where China lets the ceasefires hold.
  it: ''
- hash: 1ac9a99c
  kind: cards
  en: 'Legal exposure that a presidency does not cure: the ICC prosecutor asked for a warrant for Min Aung Hlaing on 27 Nov 2024 and the court has said his new title changes nothing; the ICJ merits judgment
    in The Gambia v. Myanmar is pending after the January 2026 hearings; the EU renewed its sanctions (105 individuals, 22 entities) until May 2027.'
  it: ''
- hash: bd3dba4e
  kind: cards
  en: ASEAN will not seat the president. No head of state of Myanmar went to the Cebu summit in May 2026, the chair's statement kept the Five-Point Consensus as the main reference, and the Philippine chair
    defended ASEAN's engagement in July only by reaffirming it.
  it: ''
- hash: c6b5c9e9
  kind: cards
  en: 'The scam economy is run by allied militias. The Karen Border Guard Force that hosts the compounds at Myawaddy is the regime''s partner, so the crackdown that China and Thailand demanded has been
    partial: 10,119 detained by 27 Oct 2025, but an AP-cited analysis found 14 of 21 known Myawaddy compounds building or expanding in 2025 and reporting shows operations moving to other sites rather than
    stopping.'
  it: ''
- hash: 09fa9e99
  kind: cards
  en: The minerals it offers are not in its hands. Myanmar supplies more than 60% of China's heavy rare-earth imports by value, but the Pangwa-Chipwi belt has been under the Kachin Independence Army since
    Oct 2024; Washington's courtship via private intermediaries yielded no sanctions relief in 2026.
  it: ''
- hash: 5d668ae5
  kind: cards
  en: The regime survives by being useful to its patron against its own people, and each service hands the patron a veto. China brokered the return of Lashio (22 Apr 2025) and pressed the TNLA, so the army
    regained a town; but China now decides how far it may advance in northern Shan, who trades through which border gate, and whether the KIA keeps selling rare earths. Winning ground through a patron converts
    the war into a Chinese bargaining instrument.
  it: ''
- hash: 0a1db4bc
  kind: cards
  en: The election bought legitimacy only where it was already given. China, Russia, India and Thailand deal with President Min Aung Hlaing; ASEAN as a body, the EU (sanctions renewed 27 Apr 2026) and the
    UK (no sign it was free or fair) did not move, and the ICC says the new title brings no immunity. The vote set the regime's isolation in a constitutional frame, and made the Five-Point Consensus its
    permanent counterpart.
  it: ''
- hash: 4d41d10a
  kind: cards
  en: Cracking down on the scam centres for Beijing and Bangkok weakens the allies who guard the Thai border. Demolishing compounds and arresting foreigners (10,119 by 27 Oct 2025) pleases China and Thailand,
    but the Karen BGF behind Myawaddy is the army's militia and the operations have moved to other sites; the regime pays in ally goodwill for a reduction that the reporting does not confirm.
  it: ''
- hash: b1372dd2
  kind: cards
  en: Kyaukphyu is the asset that buys a patron's protection and the asset the army is least able to protect. The 17 Jun 2026 joint statement promises to speed up the port; the Arakan Army is fighting around
    the naval station at Kyaukphyu township, and a local observer says nothing can be built without the AA, which gives the AA a card to play with China directly.
  it: ''
- hash: 3906298a
  kind: cards
  en: The same minerals are offered to three buyers who cannot collect them. Heavy rare earths (60% of China's imports by value) are sold to China, discussed with India (rupee-kyat settlement, critical
    minerals) and dangled to Washington; the supply sits with the KIA, so each offer is a promise the army cannot keep and reminds each buyer of the other two.
  it: ''
- hash: 23e63fc8
  kind: cards
  en: Tying Rohingya return to security in Rakhine and to the rollback of international cases presumes a control over Rakhine the army no longer has. The Arakan Army holds the entire 271 km border with
    Bangladesh since Dec 2024, so the 308,797 names Naypyidaw verified in Aug 2026 would land in AA-held territory, and the ICJ and ICC clocks run whatever the junta says.
  it: ''
- hash: 584110b4
  kind: cards
  en: 'Myanmar''s strategy is that of a client whose army lives on its usefulness to others. After 2021 the Tatmadaw lost the periphery but kept the centre, the air force and what its patrons want: a government
    in Naypyidaw that signs the Kyaukphyu port and the pipelines for Beijing, the Kaladan corridor for Delhi, the nuclear and refinery contracts for Moscow, and a border that stays quiet for Bangkok. Luttwak''s
    logic runs through the patron''s calculus: China does not need the junta to win, it needs the border calm, the pipelines open, the scam business under control and no Western-aligned government in Naypyidaw,
    so it brokers just enough ceasefires (Lashio, pressure on the TNLA) to keep the army alive and no more, while the KIA, the UWSA and others keep the leverage that lets Beijing bargain with both sides.
    The 2025-26 election and the presidency convert that client status into an appearance of normality: the four governments that already dealt with the regime (China, Russia, India, Thailand) now deal
    with a president, while ASEAN as a body and the West have only renewed their pressure. Each concession that buys survival, from Lashio to Kyaukphyu to the rare-earth promises, gives some other power
    a veto over the army''s next move. Rakhine is the test: the Arakan Army, not Naypyidaw, now decides whether Kyaukphyu, Sittwe and the Bangladesh border, which are three patrons'' interests at once,
    are safe.'
  it: ''
- hash: bfa3610b
  kind: cards
  en: 'Join the European Union by 2028. Close all 33 negotiating chapters by the end of 2026 and complete ratification in 2027-28; Foreign Minister Ibrahimovic calls EU membership by 2028 ''the key foreign
    policy priority''. As of mid-July 2026, 18 of 33 chapters were provisionally closed and the European Parliament (17 Jun 2026) calls Montenegro the most advanced candidate. Commissioner Kos is more cautious:
    2028 or 2029, with ratification speed decisive.'
  it: ''
- hash: ab63e861
  kind: cards
  en: Keep the NATO anchor and be seen as a net contributor to it. Montenegro has been a member since 5 June 2017, spends above the 2% benchmark (2.05% of GDP in 2025, projected 2.2-2.3% in 2026, a stated
    target of 5% by 2035), has troops in the NATO battlegroups in Latvia and Bulgaria and still sends troops to Kosovo and Iraq.
  it: ''
- hash: 5d5bbb16
  kind: cards
  en: 'Defend the civic, independent state against a Serbian-identity pull: Podgorica insists it ''neither seceded from Serbia nor was ever part of it'', while Belgrade''s commentators describe Montenegro
    as an ''alienated part of Serbian space'' and Serbia presses for dual citizenship and the Serbian language''s official status. The 2023 census (41.12% Montenegrins, 32.93% Serbs) turned the identity
    split into a political resource for the pro-Serbian parties in the governing majority.'
  it: ''
- hash: c53c6962
  kind: cards
  en: 'Grow the tourism-and-real-estate economy and fund it from outside: tourism is about a quarter of GDP (the minister says 25-30% with indirect effects), gross FDI was EUR 867m in January-November 2025
    of which about EUR 406m went to real estate, and the EU Growth Plan envelope is EUR 383.5m for 2024-27 (EUR 89.3m released by May 2026).'
  it: ''
- hash: 6a911aef
  kind: cards
  en: 'Show a rule-of-law track record the Commission will accept: the 2025 report asks for continuity of investigations and more final convictions in high-level corruption and organised-crime cases. The
    clan war between Kavac and Skaljari is the test: in July 2026 a court sentenced fugitive Kavac boss Radoje Zvicer to 40 years in absentia.'
  it: ''
- hash: 4131c4d2
  kind: cards
  en: Keep a fragile majority in office until the parliamentary elections due in June 2027. Prime Minister Spajic (Europe Now) governs with 47 of 81 seats after the pro-Serbian DNP withdrew in January 2026,
    with Mandic's NSD bloc and its Speaker's chair inside the majority and the opposition DPS refusing cooperation until a vote on dismissing Mandic.
  it: ''
- hash: f32cdddb
  kind: cards
  en: 'Alignment as currency: full and resolute alignment with the EU''s CFSP including restrictive measures on Russia (praised by the European Parliament in June 2026), a pledge in November 2025 to tighten
    visa rules for Russians to the EU standard, the Berlin Process chairmanship in 2026 and the hosting of the EU-Western Balkans summit in Tivat on 5 June 2026.'
  it: ''
- hash: 73d95575
  kind: cards
  en: 'Patrons courted in parallel: Washington (Ibrahimovic, 5 Feb 2026: the US is ''a strategic partner, friend and ally''; Speaker Mandic asks for a strategic partnership, July 2026), Ankara (Erdogan
    received Spajic on 9 Jul 2026; a High-Level Cooperation Council is planned) and Berlin (Merz: ''full support'', London, 23 Oct 2025).'
  it: ''
- hash: bfcec533
  kind: cards
  en: 'Sovereignty narrative: the 20th anniversary of the 21 May 2006 referendum (55.5% for independence) was staged as a national celebration, and the Foreign Ministry answered Vucic''s ''secession'' remarks
    point by point; police and prosecutors name ''hybrid activity'' when foreign operatives are stopped (87 men turned back at Tivat; Rybar''s founder expelled on 9 Oct 2026).'
  it: ''
- hash: 2cc6c5f8
  kind: cards
  en: 'A small but rising NATO-standard defence effort: 2.05% of GDP in 2025, battlegroup contributions in Latvia and Bulgaria, troops in KFOR and Iraq; the armed forces are a token of membership more than
    a deterrent.'
  it: ''
- hash: 90a10afd
  kind: cards
  en: 'Security-service tools against foreign influence: six Russian diplomats expelled on 29 Sep 2022, then the Russian consular section suspended; entry bans under the Law on Foreigners (87 men, June
    2026) and the expulsion of the Rybar network''s founder and four associates in October 2026.'
  it: ''
- hash: 176b370f
  kind: cards
  en: 'Euro without membership and EU money as anchor: Montenegro has used the euro since 2002 without any agreement with the ECB, and the Growth Plan (EUR 383.5m, 2024-27) and WBIF projects are tied to
    reform milestones; gross FDI of EUR 867m in January-November 2025 is mostly property investment.'
  it: ''
- hash: c6e2fa1c
  kind: cards
  en: 'Gulf and Turkish capital as a second source: the 2025 UAE agreements (economic cooperation; tourism and real estate, including the Velika Plaza lease), Turkey as the second-largest source of FDI
    in January-October 2025 (EUR 110.9m against Serbia''s EUR 112.1m) and the planned Turkey-Montenegro High-Level Cooperation Council.'
  it: ''
- hash: 271fe685
  kind: cards
  en: 'Croatia holds a veto on the last mile. Zagreb has blocked Chapter 31 (foreign, security and defence policy) since December 2024 and, in September 2026, still held Chapter 14 (transport) and others,
    so the planned 22 Sep intergovernmental conference was called off. Its list (22 Jul 2026): compensation for camp survivors (Morinj), 14 missing persons, war-crimes prosecutions, Croatian property claims,
    the return of the training ship Jadran, a maritime-border deal, and renaming a swimming pool after Zoran Gopcevic. A Croatian MP has warned that parliament will not ratify a treaty if Chapter 31 is
    closed without consent.'
  it: ''
- hash: b56c26a3
  kind: cards
  en: The governing majority includes the voices Brussels distrusts. The Speaker, Andrija Mandic, sent condolences on Ratko Mladic's death (27 Aug 2026), which Croatia called 'unacceptable', and five MEPs,
    including the rapporteur, wrote that his words weigh on the country's case; an opposition motion to dismiss him (35 signatures) failed to open for lack of a quorum on 24 Sep 2026. Press reports say
    the Netherlands, the Baltic states and Croatia sought a pause over the condolences.
  it: ''
- hash: eeb3321e
  kind: cards
  en: 'A society divided on identity: 2023 census 41.12% Montenegrins and 32.93% Serbs, 43.18% listing Serbian as their language; pro-Serbian parties push for Serbian as an official language (Article 13
    of the Constitution) and the Serbian Orthodox Church has a fundamental agreement with the state (3 Aug 2022). Dual-citizenship talks with Belgrade are an unresolved lever (Serbian voters).'
  it: ''
- hash: d8ed6941
  kind: cards
  en: 'Narrow, import-dependent economy: goods exports of EUR 572m cover 13% of imports of EUR 4.46bn (2025, preliminary), Serbia is both the largest export market (EUR 153m) and import source (EUR 778m),
    tourism is roughly a quarter of GDP, and gross public debt was 58.6% of GDP at end-September 2025 (up on 2024, mostly Eurobonds).'
  it: ''
- hash: e9d08f40
  kind: cards
  en: 'Euroisation without a lender of last resort: Montenegro adopted the euro unilaterally before the ECOFIN position that prohibits it, has no agreement with the ECB and no seat in the Eurosystem, so
    shocks cannot be met by a central bank. The Chinese motorway loan, in dollars, shows the cost of that exposure.'
  it: ''
- hash: d7d870ba
  kind: cards
  en: 'Organised crime and the state''s weak spots: the Kavac-Skaljari war has killed dozens, key people in police and government are reported to be protected, and the Commission now judges progress only
    on ''concrete and measurable results'' - final convictions in high-level corruption and organised crime.'
  it: ''
- hash: dd00c81b
  kind: cards
  en: The EU path needs a coalition that the EU's gatekeepers read as the obstacle. Spajic secured his majority in 2023 by giving the Speaker's chair to Mandic's pro-Serbian bloc (whose leaders were the
    main defendants in the 2016 coup case), and in 2024 that bloc's Jasenovac resolution (41 votes) brought persona-non-grata status from Croatia for Mandic, Knezevic and Becic. Two years later Mandic's
    Mladic condolences reopened the same quarrel just as chapters were due to close.
  it: ''
- hash: 3e872b4a
  kind: cards
  en: Being the frontrunner makes the bilateral grievances decisive. Montenegro has provisionally closed 18 of 33 chapters (20 by the Wikipedia index after 12 Oct 2026, unconfirmed), but each remaining
    closure depends on a Croatian consent that no EU benchmark can supply; the faster it runs, the more the final stretch is decided by a neighbour's Morinj camp, the ship Jadran and a swimming pool's name.
  it: ''
- hash: 427cedd5
  kind: cards
  en: The Gulf deal that finances growth threatens the accession that underwrites it. The 2025 UAE tourism and real-estate agreement exempts UAE investors' contracts from procurement and competition rules,
    which the Commission flagged in May 2025 and a watchdog said put accession at risk; Parliament re-adopted it after President Milatovic's veto; in March 2026 Constitutional Court judges were reported
    to have voted largely along the president's objections.
  it: ''
- hash: 162294ba
  kind: cards
  en: 'The customers are the rivals. Serbia (23.4% of foreign overnights in 2025), Russia (16.4%) and Bosnia (8.1%) supply almost half of tourist nights, and Serbia is the largest trade partner on both
    sides, while foreign policy moves in the opposite direction: the 2026 public clash with Vucic, expulsions of Russians, tighter visas for Russian travellers.'
  it: ''
- hash: 8c9dd6c9
  kind: cards
  en: The security services expel Russian operatives while the politician at the centre of the 2016 coup case sits as Speaker. The High Court convicted 13 in May 2019, the Appeals Court annulled that verdict
    in February 2021, and in July 2024 the retrial acquitted all, including Mandic and the two Russians; Podgorica can therefore act against Rybar in October 2026 but cannot show a court-proven line from
    Moscow to its own parliament.
  it: ''
- hash: 35dc8a1a
  kind: cards
  en: A road to Serbia built with Chinese money and a dollar debt in a euro economy. The Bar-Boljare Exim Bank loan (USD 944m, 2014) funded 41 km that opened in 2022, far short of the Serbian border; Montenegro
    asked the EU for help in 2021 and was refused, then hedged the loan in 2023 (2% cut to 0.98%) and later exited a hedge when the dollar strengthened.
  it: ''
- hash: 2798195a
  kind: cards
  en: 'Montenegro runs the grand strategy of a twenty-year-old micro-state that has bet its survival on being absorbed into the institutions that guarantee small states: NATO (done in 2017) and the EU (the
    2028 target). The method is alignment as proof - full CFSP alignment, expulsions of Russian operatives, a defence budget above 2% - and the resource is speed: it is the only candidate with 18 chapters
    closed. The Luttwakian trap is that the last chapters are not technical. Croatia''s veto turns on wartime grievances from the 1990s, and the Spajic majority rests on parties that treat the 2006 independence
    as a wound, so every step that pleases Belgrade''s friends at home (the Jasenovac resolution, the Mladic condolences) costs a vote in Zagreb or The Hague, while every step toward Brussels costs the
    coalition''s Serbian flank. The same logic runs through the economy: the Gulf and Turkish capital that replaces Chinese debt arrives with procedure-bypassing laws that the Commission itself flags. Two
    signals that are not rows: the cadence of closures (December 2025, January, March, June and July 2026) and President Milatovic''s repeated returns of laws to Parliament, a veto that keeps the Constitutional
    Court and Brussels in the loop. With the Serbian election on 25 Oct 2026 and Montenegro''s own on June 2027, the question is whether the accession treaty can be finished before the identity politics
    of one of the two neighbours changes the arithmetic.'
  it: ''
- hash: a1b2904a
  kind: cards
  en: 'Stay sovereign between two giants by spreading ties to third neighbours. The phrase is current: in Washington on 2 Aug 2023 PM Oyun-Erdene called the United States an ''important strategic third
    neighbor'' and said that a landlocked Mongolia would suffer if great-power rivalry turned into a new Cold War. The same logic brings Japan, South Korea, the EU, India and Turkey into the picture, none
    of which can replace the two neighbours for trade or fuel.'
  it: ''
- hash: 2cefb83e
  kind: cards
  en: 'Turn the mining boom into state revenue without letting one buyer take it all: coal and copper go to China, the Ganqimaodu-Gashuunsukhait rail link (agreed 14 Feb 2025, track-laying from 1 Sep 2025,
    target 2027) is meant to lift coal exports from about 83 to 165 Mt a year, and the state holds 34% of Oyu Tolgoi while pressing Rio Tinto for more revenue and earlier dividends.'
  it: ''
- hash: c0f8604c
  kind: cards
  en: 'Secure the fuel and power supply from Russia and turn the Power of Siberia 2 route into a transit asset: the Sept 2025 memorandum envisages a 30-year supply of 50 bcm a year through Mongolia, but
    price is not agreed, so the transit income is still a promise.'
  it: ''
- hash: 20da7bc1
  kind: cards
  en: 'Mining as the state''s lever: 34% of Oyu Tolgoi through Erdenes Oyu Tolgoi, the 2025 coal exports at a record 90 Mt (customs data), and copper and coal the two largest export lines, about 5.8 and
    5.6 billion USD in 2025 (provisional).'
  it: ''
- hash: e0181dec
  kind: cards
  en: The 'third neighbour' vocabulary and a cooperative posture in the UN and in the regional organisations (a UN member since 1961 and in the OSCE and the WTO, per the datasets). The 2023 Harris meeting
    and the Open Skies deal are the US instances; Japan and South Korea deliver aid and labour ties.
  it: ''
- hash: 2643017b
  kind: cards
  en: 'Outside security help is small and symbolic: Japan''s first ''official security assistance'' to the Mongolian army was an air traffic control radar worth 1.3 billion yen (March 2025).'
  it: ''
- hash: cea537f8
  kind: cards
  en: 'Landlocked between two giants: almost all trade and fuel crosses the Russian or Chinese border. Russia supplies about 95% of petroleum products (end of 2025, ministry figure), and China takes about
    91-92% of exports (2025, secondary summaries). Fuel shortages in 2026 followed Ukrainian strikes on Russian refineries, and Russia''s export curbs did not apply to Mongolia under the intergovernmental
    supply deals.'
  it: ''
- hash: 61e8bed5
  kind: cards
  en: 'The ICC is a legal constraint that has not bound: Mongolia is a State Party to the Rome Statute. Putin came to Ulaanbaatar on 3 Sept 2024 on the ICC warrant of March 2023 and was not arrested; the
    EU said Mongolia did not comply with its statute duty. The cost was a reputational one and the dependence on Russian fuel explains the choice (a Politico-quoted legal expert expected no sanction beyond
    a possible non-compliance finding; the ICC outcome was not found).'
  it: ''
- hash: c67f5f3f
  kind: cards
  en: 'Dzud and warming make the herding economy the weak point: the 2023-24 dzud killed about 8.1 million livestock by July 2024 (12.5% of the herd per the government figure, 8.1% per a UN response plan),
    with about 220,000 herding households affected. Warming in Mongolia is among the fastest in the world (World Bank Climate Risk Profile).'
  it: ''
- hash: ad76895e
  kind: cards
  en: 'The third-neighbour policy is meant to escape single dependence, but the mining plan deepens it: the rail link to China is sold as the way to lift coal exports from 83 to 165 Mt a year, so the more
    Mongolia monetises its minerals the more its exports go to one buyer (about 91% already). The rail that answers the ''landlocked'' problem also ties the export income to Beijing.'
  it: ''
- hash: bc103efb
  kind: cards
  en: 'Mongolia runs a strategy of buffering: a landlocked state between Russia and China

    that sells its ground (coal, copper, gold) to one neighbour, buys its fuel from the other,

    and calls the spread of other partners a third neighbour policy. The posture is neutral

    in words and dependent in structure. The 2024 election gave the Mongolian People''s Party

    68 of 126 seats, a narrow majority after a supermajority, and the 2025 shift at the top

    came from the street and from the house: Prime Minister Oyun-Erdene lost a confidence vote

    on 3 June 2025 with 44 votes against the 64 needed, and parliament confirmed Zandanshatar

    on 13 June. Later accounts disagree: Al Jazeera reports Zandanshatar losing a confidence

    vote and resigning in October 2025, while Wikipedia''s crisis summary says a presidential veto

    and a court ruling kept him in office; a 2026 cabinet infobox records a dissolution in April

    2026 with a successor. Current leadership is not confirmed here. The two dated acts that show

    the strategy at work are the Putin visit of September 2024 (the ICC warrant unenforced

    under fuel dependence) and the September 2025 PoS-2 memorandum (the transit fee as a bet, the

    price still open). A non-event is a signal: Mongolia is not an observer of the Organization of

    Turkic States (OTS observers page), although the OTS secretary-general visited Ulaanbaatar in

    March 2025 at the Mongolian foreign minister''s invitation. Gaps not closed here: the Mongolian

    script question in detail, the Turkish and Kazakh bilateral figures, the India refinery (1.5 Mt,

    Indian investment, construction pushed to 2028 per one commentary, tier 4), the EU beyond the

    2017 agreement, and any US contact after 2023.'
  it: ''
- hash: a9aa5001
  kind: cards
  en: Keep the Cabo Delgado gas perimeter secure enough for the TotalEnergies-led LNG project to run. The full restart was announced on 29 January 2026, with first LNG expected in 2029, and the force that
    guards the site is Rwandan and, from 2026, paid for by Maputo (Kigali's claim).
  it: ''
- hash: 2d92f6d3
  kind: cards
  en: 'Refinance the state: a new IMF programme by the end of 2026, and only then an external debt restructuring, which Chapo has sequenced after the Fund deal. The Finance Ministry aims for board approval
    by year end; no programme is signed.'
  it: ''
- hash: 2b604cd2
  kind: cards
  en: Paid security. A Rwandan force of about 6,300 soldiers and police (Kigali's figure, April 2026) guards the LNG area, and EU-trained units under EUMAM-MOZ, led by Portugal, number about 2,000 Mozambican
    personnel in programmes. The EU's EUR 20m for the Rwandans lapsed in May 2026; Maputo now says it has secured the funding, a claim so far made by Kigali.
  it: ''
- hash: cd77c92a
  kind: cards
  en: Gas as the bankable asset. The US Export-Import Bank board voted on 13 March 2025 to proceed with a loan of up to USD 4.7bn for the LNG project, after a four-year delay. The loan is what Maputo can
    show creditors as foreign money already committed, though no source ties it to the IMF talks.
  it: ''
- hash: 48a0341a
  kind: cards
  en: Debt and no programme. Maputo paid its IMF arrears in full in March 2026 (about USD 630m, state agency report), but no new programme is signed. Chapo has said debt talks with creditors come only after
    a Fund programme, so the state cannot restructure its external debt on its own terms yet.
  it: ''
- hash: 6a951ced
  kind: cards
  en: Legitimacy and aid. The October 2024 result is contested; the inauguration in January 2025 drew protests and clashes after Mondlane's return from exile, and Mondlane is largely outside the national
    dialogue that is to report in November 2026. The regional force left in 2024 and US aid was cut sharply in 2025, so the gap is filled by paid partners.
  it: ''
- hash: a2a5d8d6
  kind: cards
  en: Maputo buys its gas security from a force Washington has sanctioned. The US designated the Rwandan defence force on 2 March 2026, and Rwanda has threatened to stop protecting the US-financed gas project
    if its paid mission is not sustained. The security the state buys protects the export-credit project, and the same force is the one that puts that project at risk.
  it: ''
- hash: ee253e0b
  kind: cards
  en: Mozambique is a state that sells its gas perimeter and rents its army. The LNG project, relaunched in 2026 with US export credit behind it, is the reason foreign forces stand in Cabo Delgado, and
    the Rwandan force is now paid for with money Maputo does not yet have, while it answers to Kigali. The IMF deal and the debt restructuring that follows will show whether the state can keep the gas and
    the paying partners after the EU money and the SADC force have left.
  it: ''
- hash: ac5e027c
  kind: cards
  en: 'Turn its place on the Atlantic migration route into EU and Spanish money: a EUR 210m EU package (2024) and a one-year Spanish circular-migration pilot signed in Nouakchott in August 2024.'
  it: ''
- hash: 95f7541b
  kind: cards
  en: Contain the spillover of the Malian crisis at its eastern border; about 150,000 people from Mali have fled into Mauritania in the 2024 surge. The containment aim is our reading, no source states it.
  it: ''
- hash: 5448d72d
  kind: cards
  en: Keep iron ore, almost half of all exports, as its main earner. The share is a 2015 IMF figure and was not updated in this pass.
  it: ''
- hash: d05f75f8
  kind: cards
  en: 'UN votes on the Russia-Ukraine war and Gaza: yes on the 2022 resolution on the aggression against Ukraine (A/RES/ES-11/1), abstention on the 2025 resolution on a just peace in Ukraine (A/RES/ES-11/7),
    yes on the 2024 demand for a Gaza ceasefire (A/RES/ES-10/26). A seat on the UN Human Rights Council from 2020.'
  it: ''
- hash: 8b24a6ad
  kind: cards
  en: Iron ore exports (almost half of all exports, IMF 2015) and the EU money for migration control (EUR 210m, 2024) are the two levers of its external income.
  it: ''
- hash: cfe9abb1
