  it: ''
- hash: '58677042'
  kind: cards
  en: Mauritius wants the Chagos back and has the 2025 treaty as its best instrument, but ratification now waits on a US consent that Washington withholds and that London has accepted it cannot secure for
    now. Meanwhile Port Louis plays the two Asian powers against each other for money and security, India through funding and an enhanced partnership, China through a loan and a free trade agreement, without
    an alliance with either. The test is whether London and Washington rework the deal in a form Port Louis can sign, and whether the Safe City questions at home cost the government room to negotiate.
  it: ''
- hash: 1d87f02d
  kind: cards
  en: Win back an IMF programme and restore forex, the precondition for everything else. The four-year US$175m Extended Credit Facility (approved November 2023) lapsed in May 2025 by mutual decision of
    government and IMF. An IMF staff visit ended on 18 June 2026 without a new deal, and talks were set to continue; the Mutharika government says it wants a new programme but without reforms that would
    hit ordinary citizens hardest.
  it: ''
- hash: fe7c8502
  kind: cards
  en: 'Hold the claim to all of Lake Malawi (Lake Nyasa) under the 1890 Anglo-German treaty, against Tanzania''s median-line position under UNCLOS. Oil and gas is the stake: Lilongwe licensed the British
    firm Surestream to explore the lake, and Tanzania objected to exploration in waters it considers disputed.'
  it: ''
- hash: ab94918b
  kind: cards
  en: Forex and austerity, not a programme. The Reserve Bank devalued the kwacha by 44% on 9 November 2023. The government is reviewing forex rules and buying gold to raise forex, cutting fuel entitlements
    for senior officials and restricting travel, and targets inflation below 21% in 2026 (from 28.7% in September 2025) with 3.8% growth. Forex reserves remain below the three-month import-cover target.
  it: ''
- hash: 4e31f377
  kind: cards
  en: Protest and mediation on the lake. Malawi sends formal protest notes to Dodoma (a February 2024 note on the Mbamba Bay port, and a comprehensive note in December 2024, which Tanzania had not answered
    in the reporting found). Former president Bakili Muluzi offered to convene national and regional mediation in December 2024, with SADC and the AU named as possible fora.
  it: ''
- hash: 308b661e
  kind: cards
  en: Forex and donors are shrinking together. The kwacha was devalued 44% in November 2023; fuel shortages and forex scarcity continue; rising oil prices linked to Middle East tensions have raised transport,
    food and fertiliser costs. The UK has announced a 60% aid cut for 2026/27 (90% in total by 2029) and the US has terminated contracts worth US$230.4m. Experts warn the cuts could worsen forex shortages
    and strain health and education.
  it: ''
- hash: 453252fe
  kind: cards
  en: Citizens' mobility to the United States is restricted. Malawian business and tourist visa applicants face refundable deposits of up to US$15,000 (from August 2025), partial US entry limits apply from
