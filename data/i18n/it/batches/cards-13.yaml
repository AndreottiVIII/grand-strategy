  it: ''
- hash: 2d6ad969
  kind: cards
  en: China's credit and trade access. A China Eximbank preferential buyer's credit of US$73.7m (April 2018, through Mauritius Telecom, with a sovereign guarantee) finances the Safe City surveillance system;
