  it: ''
- hash: e63cf37a
  kind: cards
  en: 'Money and industry as strategy: aid framework of SEK 40 billion a year to Ukraine, defence financed partly through loans, Saab exports (Colombia EUR 3.1 billion, Poland SEK 47 billion for A26 submarines),
