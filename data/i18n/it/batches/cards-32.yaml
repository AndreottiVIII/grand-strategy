- hash: 3ad09300
  kind: cards
  en: Joining NATO to end exposure made Sweden a front-line host. The 17 US-accessible facilities, the Lapland battlegroup, Gripens in Poland and Finland and the Baltic headquarters all raise Sweden's weight
    in the alliance and, in the military intelligence service's reading, make it a place where Russia is ready to take more risk (sabotage, arson, drones over Malmo).
