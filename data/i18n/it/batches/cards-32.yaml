- hash: 13b0c00d
  kind: cards
  en: The price of the NATO ticket is a precedent. Stockholm toughened its terror law and committed in June 2022 to deal with Turkish extradition requests; Hungary was paid in Gripens for its yes in February
    2024. Both bargains cost the 'principled' foreign policy Sweden sold at home and show that a hold-out can set a price.
  it: ''
- hash: 8023f4d8
  kind: cards
  en: A frugal budget line sits badly with a collective-defence agenda. Sweden asks the EU to cut its next budget by 'several hundred billion euros' and refuses joint borrowing while it asks partners for
