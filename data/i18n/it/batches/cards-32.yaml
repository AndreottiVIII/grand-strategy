  it: ''
- hash: 1263c9a3
  kind: cards
  en: 'Defend the economic base from the EU table and the export market: a much smaller EU budget with no new common borrowing (''Sweden is no cash machine''), open trade under the 15% US tariff, and Saab
    export wins (Colombia, Poland, Ukraine) that pay for the national defence industry.'
  it: ''
- hash: bb2e1737
  kind: cards
  en: 'Contain the hybrid threat from Russia, China and Iran at home: sabotage, drones, shadow-fleet tankers, cyber and espionage, and Iranian use of Swedish criminal networks, which the security service
    now ranks beside the conventional threat.'
  it: ''
- hash: 2cae80bd
  kind: cards
  en: 'Settle the domestic question that decides all of the above: form a government after the 13 September 2026 election (the opposition bloc has 176 seats to the Tidö bloc''s 173, Kristersson has resigned
