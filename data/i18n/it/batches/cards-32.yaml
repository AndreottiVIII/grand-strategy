  it: ''
- hash: '54831004'
  kind: cards
  en: Build a Nordic-Baltic-Polish defence and defence-industrial block around the Baltic Sea (NORDEFCO, the Sweden-Finland planning link, the Baltic Sea Pact with Poland and its three A26 submarines, joint
