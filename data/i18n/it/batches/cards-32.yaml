# Translate every `en` into it. Write the translations to the file cards-32.out.yaml next to this one,
# as `items:` of `- hash: <same hash>` / `it: <translation>`, appending one item at a time (valid YAML at
# every step), never editing this file. Keep names, dates, numbers and quotes; register of a foreign-office
# brief: dry, precise, no flourish.
lang: it
items:
- hash: 08052b63
  kind: cards
  en: Keep formal independence inside Italy's embrace. The 1939 Convention of Friendship and Good Neighbourhood, the EEC customs union of 1991 and the euro monetary agreement tie the state to Italy and
    the EU; survival as a sovereign micro-state depends on that framework holding.
  it: ''
- hash: 25f359ad
  kind: cards
  en: Secure access to the EU single market and its financial sector through the Association Agreement, without full EU membership. Negotiations concluded December 2023; the Council authorised signature
    on 16 July 2026; signing is scheduled for 19 October 2026 in Brussels and the Council conclusion still needs European Parliament consent.
  it: ''
- hash: 3e9d2cc5
  kind: cards
  en: 'Keep the financial centre viable under EU and Italian pressure: finish the banking reform the IMF has recognised as under way, win the dialogue with the ECB and Bank of Italy the Association Agreement
    requires, and attract qualified investors to a sector still short of capital and efficiency.'
  it: ''
- hash: 64ef6174
  kind: cards
  en: Diplomacy through the Captains Regent, two joint heads of state with a reciprocal veto and no executive power, who represent the country and guarantee the constitutional order (Wikipedia Captains
    Regent, tier 4 pointer).
  it: ''
- hash: bb95228e
  kind: cards
  en: 'Economic instruments that are not sovereign tools: the 1991 customs union with the EEC and the euro arrangement with Italian and EU monetary rules. They give access to the single market and cost
    the state its own currency and trade policy.'
  it: ''
- hash: bec35da8
  kind: cards
  en: A banking and financial sector that is the main source of revenue and the main point of pressure. The IMF finds the reforms of recent years have cut legacy vulnerabilities but profitability remains
    below regional peers.
  it: ''
- hash: 630389f8
  kind: cards
  en: 'Geography: San Marino is entirely surrounded by Italy and has no coastline, so Italy is the route for trade, transport and people (Wikipedia Italy-San Marino relations, tier 4).'
  it: ''
- hash: 646dd53c
  kind: cards
  en: 'Scale and capacity: the Commission already judged in 2013 that EU membership was not adapted to states this small, and Norway questioned their administrative capacity for EEA membership (Wikipedia
    EU relations, tier 4 pointer).'
  it: ''
- hash: 95bbb530
  kind: cards
  en: 'Ratification: the Association Agreement has mixed competences, so it needs the European Parliament and the national parliaments as well as the Grand and General Council, and the timetable depends
    on them.'
  it: ''
- hash: fff144d9
  kind: cards
  en: The financial centre that earned the state its revenue is also what Italy and the EU target. The Association Agreement opens the financial sector only in phases and only after an assessment of the
    regulatory and supervisory framework, so the reforms needed to keep the sector are the ones that limit the secrecy it has traded on.
  it: ''
- hash: a857ebd3
  kind: cards
  en: San Marino has no currency of its own and no independent trade policy, since the euro and the customs union bind it to Italian and EU rules. Its grand strategy is to keep the Italian and EU frameworks
    that guarantee its existence while turning its financial sector from a source of distinction into a regulated market. The Captains Regent speak for the state and the Secretariat carries the work. Its
    most important move, the Association Agreement, has been concluded but is not yet signed or ratified, so the reading of the 2026 steps stays provisional.
  it: ''
- hash: 7d489edc
  kind: cards
  en: Stay the government of record. President Hassan Sheikh Mohamud's four-year term ran out on 15 May 2026 by the opposition's count; parliament's amendments of March 2026 turn it into a five-year term,
    so he says he serves to 15 May 2027, and the plan is a one-person-one-vote election in place of the clan-based indirect vote. The opposition (Puntland's Deni, former president Sharif Sheikh Ahmed, the
    Somali Future Council) calls the amendments unilateral and no longer recognises him; US- and UK-mediated talks at Halane collapsed on 15 May.
  it: ''
- hash: e775cbab
  kind: cards
  en: 'Hold the south-centre against al-Shabaab and ISIS-Somalia with other people''s forces: AUSSOM troops, Turkish drones and trainers, Egyptian troops (delayed), US air strikes (at least 124 in 2025,
    63 by 29 May 2026). The 2025 al-Shabaab offensive from Hiran and Middle Shabelle reversed most of the 2022-23 gains; on 9 Oct 2026 al-Shabaab took Hees in Hiran and cut an army supply road.'
  it: ''
- hash: dd4a36eb
  kind: cards
  en: 'Undo Somaliland''s separation and stop its recognition. Mogadishu treats Somaliland as an integral part of Somalia; Israel''s recognition of 26 Dec 2025 (the first by a UN member), the Taiwan-Somaliland
    offices (a new one opened in June 2026) and talk of a US naval base at Berbera in exchange for recognition are the threats. The counter-coalition is wide but mostly rhetorical: China, Turkey, Saudi
    Arabia, Egypt, Djibouti, the OIC and the AU all back Somali unity.'
  it: ''
- hash: d00950fd
  kind: cards
  en: Bring the federal member states under the new constitutional order. Puntland withdrew its recognition of the federal government in March-April 2024; Jubaland rejected the March 2026 amendments and
    has retaken Balad Hawo and holds the Gedo towns of Dolow, Luuq and El Wak; in Southwest State the federal government disbanded the assembly after a disputed March vote and the forces of ousted leader
    Laftagareen have since taken Qansax Dheere and Burhakabo. Mogadishu's tools are a parallel administration in Gedo (a 45-day plan of October 2025), interim appointments and the electoral law.
  it: ''
- hash: 24433dbc
  kind: cards
  en: 'Keep the security transition financed: AUSSOM (mandate to 31 Dec 2026), the UN logistics office UNSOS that feeds it, and the IMF programme that replaced lost aid. The EU restarted European Peace
    Facility money in April 2026 (EUR 75m, a bridge of months) while Washington said on 1 July it would stop paying UNSOS at the end of 2026 and oppose its renewal.'
  it: ''
- hash: 3963acfc
  kind: cards
  en: Keep Ethiopia from using Somali fault lines against Mogadishu, without a war. Mogadishu traded the rupture of January 2024 over Ethiopia's MoU with Somaliland for the Ankara Declaration of December
    2024 (Ethiopian sea access only under Somali sovereign authority), keeps Ethiopian troops in AUSSOM, and balances Addis Ababa with the Egypt-Eritrea axis, Turkey and the Gulf. On 4 Oct 2026 Hassan Sheikh
    sat at El Alamein with Sisi, Burhan and Isaias, then congratulated Abiy on his re-election.
  it: ''
- hash: f0a03f46
  kind: cards
  en: Patron-hopping as a method. Turkey (the Ankara Declaration, the 2024 defence and economic cooperation agreement, mediator of the July 2026 government-opposition talks), Egypt and Eritrea (the Oct
    2024 Asmara trilateral, the 4 Oct 2026 Alamein quadrilateral), Qatar and Saudi Arabia (Riyadh talks of 11 Jan 2026, membership of the Saudi-led Red Sea coalition announced 30 Jul 2026), China (Wang
    Yi's call of 12 Jan 2026). Each is bought with a piece of Somali sovereignty or a vote against Somaliland.
  it: ''
- hash: 4073028a
  kind: cards
  en: 'Collective legal and religious cover against Somaliland''s recognition: the joint statement of 21 states rejecting Israel''s step, endorsed by the OIC, Djibouti''s protest at the UN Security Council
    and closure of Somaliland''s liaison office, and the One-China card (Beijing''s readout of 12 Jan 2026 and its embassy''s warnings to Hargeisa over the Taiwan office).'
  it: ''
- hash: 4a0eac91
  kind: cards
  en: 'Delegitimising the periphery and the opposition by security framing: the president''s claim, citing intelligence, that Somaliland agreed to resettle Palestinians and host an Israeli base in exchange
    for recognition (Dec 2025, unverified), and the defence minister''s claim of 13 Oct 2026 that 260 armed men were removed from opposition leaders'' homes in Mogadishu.'
  it: ''
- hash: 6e2c2051
  kind: cards
  en: 'Foreign force as the army: Turkey (TURKSOM training base in Mogadishu, Bayraktar TB2 and Akinci drones, T129 helicopters, troop mandate renewed to 27 Jul 2028), the US (63 AFRICOM strikes by 29 May
    2026 against al-Shabaab and, in Puntland, ISIS-Somalia), AUSSOM (mandate to 31 Dec 2026) and an Egyptian contingent delayed for lack of funds.'
  it: ''
- hash: 180399d5
  kind: cards
  en: Federal troop moves into contested peripheries (Gedo towns in 2025; Bardere and Garbaharey are still held by federal-aligned forces) and the show of force around opposition leaders' homes in Mogadishu
    on 11 Oct 2026.
  it: ''
- hash: 24b02344
  kind: cards
  en: 'Resources and concessions as patronage: the TPAO exploration agreements (three offshore blocks and an onshore area of about 16,000 sq km; the drillship Cagri Bey began the Curad-1 well in April 2026),
    the Warsheikh spaceport, a standing offer to Washington of Berbera, Balidogle and Bosaso, and the cancellation of every UAE deal on 12 Jan 2026.'
  it: ''
- hash: cb2be1df
  kind: cards
  en: 'Balance-sheet repair as a source of leverage: the December 2023 HIPC completion point (USD 4.5bn of relief; external debt from 64% of GDP in 2018 to under 6% at end 2023), an IMF ECF arrangement
    raised to about USD 140m in December 2025, and a diaspora that sent USD 3.13bn in 2025 by the central bank''s count.'
  it: ''
- hash: f8d67c79
  kind: cards
  en: The state does not hold its territory. The US entry ban of June 2025 itself says Somalia lacks a competent central authority and control over its territory; al-Shabaab holds or taxes large parts of
    the south and centre, Puntland has run its own affairs since 2024, Jubaland holds Dolow, Luuq, El Wak and Balad Hawo, Somaliland is outside federal control, and Southwest is in revolt.
  it: ''
- hash: 2e873375
  kind: cards
  en: The security transition has no funding. AUSSOM's mandate ends on 31 Dec 2026; troop contributors are owed arrears (about USD 94m for 2022-24 by an ISS count) and the EU's EUR 75m covers 2025 and Q1
    2026 costs only; the US, which blocked UN assessed funding for AUSSOM in 2025 (Resolution 2719), said on 1 Jul 2026 it will stop paying UNSOS and oppose any extension of UN logistics support.
  it: ''
- hash: 060aae1a
  kind: cards
  en: Legitimacy is contested at home. The opposition (Somali Future Council, former president Sharif Sheikh Ahmed, Puntland's Deni) does not recognise the extension; US, UK, UN, AU and IGAD voices called
    for consensus after Halane; and the Turkish-brokered talks of 7-8 July 2026 had no Puntland or Jubaland delegates, who questioned Ankara's neutrality.
  it: ''
- hash: b183b2a0
  kind: cards
  en: An aid shock on a thin budget. Washington halted all assistance to the federal government on 7-8 Jan 2026 (over an allegation of diverted food aid that the UN and Mogadishu call unsubstantiated),
    and the IMF cites 'persistent and sharp declines in foreign aid'. Remittances (USD 3.13bn in 2025, 24% of GDP by the central bank; 17.7% of GDP in 2024 in the World Bank series) cushion households,
    not the budget.
  it: ''
- hash: 7d860cad
  kind: cards
  en: The patrons collide on Somali soil. The UAE (Berbera, Bosaso) backs the peripheries Mogadishu is trying to bring in; Ethiopia protects Jubaland's Gedo and holds a standing MoU with Somaliland; Kenya
    backs Madobe and rejected the ICJ maritime ruling of 2021; Turkey, Qatar and Egypt back the centre. No patron buys the whole state.
  it: ''
- hash: a5381d9f
  kind: cards
  en: A colder Washington. Beyond the aid halt and the UNSOS decision, the US put Somalia on the full entry-ban list (signed 4 Jun 2025), and President Trump answered a question on recognising Somaliland
    with 'Does anyone know what Somaliland is, really?' while saying he would study a recognition-for-naval-port swap.
  it: ''
- hash: 868c13b2
  kind: cards
  en: 'Survival contracted out to a dozen patrons buys time and sells pieces. Turkey gets a base, the oil blocks, a spaceport and missile range and a mandate to 2028; Egypt a pact aimed past Mogadishu at
    Ethiopia; Qatar and Saudi Arabia a stake against the UAE; China a vote against Taiwan; Washington strikes but not aid. Each is paid in sovereignty, and the patrons'' quarrels (Turkey and the UAE, Egypt
    and Ethiopia, Israel and Turkey) are then fought on Somali ground. Luttwak''s client system with no hegemon: the clients are many, the patron is none.'
  it: ''
- hash: a0d36f85
  kind: cards
  en: Centralising to hold the state splits it. The constitutional amendments, the one-person-one-vote plan, the parallel Gedo administration and the disbanding of the Southwest assembly were meant to bind
    the federal member states; they put Puntland and Jubaland in open opposition, gave Ethiopia and Kenya a reason to shield Madobe, and raised armed rivals (Jubaland in Gedo, Laftagareen in Bay) in the
    same days al-Shabaab took Hees.
  it: ''
- hash: be37a0b7
  kind: cards
  en: The troops for the front are used in the capital. While the army lost Hees and its offensive against al-Shabaab in Hiran and Middle Shabelle stalled, government forces massed near the homes of former
    president Sharif and former prime minister Khaire in Mogadishu; opposition figures blame a government that put the 2026 election ahead of security, and Crisis Group warned in 2025 that elite squabbling
    pulls attention from the fight against al-Shabaab.
  it: ''
- hash: 369f1f9d
  kind: cards
  en: Cancelling the UAE defended sovereignty and fed the peripheries. Abu Dhabi had already bet on Berbera and Bosaso; Mogadishu's annulment of 12 Jan 2026 was rejected by Puntland, which kept DP World's
    30-year Bosaso concession and its UAE-friendly security cooperation, and by Somaliland; the result is a federal government dependent on Turkey and Qatar, and a Puntland and a Somaliland with a patron
    of their own.
  it: ''
- hash: 459c9c72
  kind: cards
  en: Joining Cairo's ring depends on the state the ring encircles. Ethiopia contributes the troops that hold the Hiran and Gedo border (2,500 allocated against Egypt's 1,091, which are delayed for lack
    of money), yet Mogadishu sat at the Egypt-Eritrea-Sudan summit of 4 Oct 2026 as Ethiopia accused the same three of backing the Tigray rebels and Egypt and Ethiopia expelled diplomats; Ethiopia can answer
    by sheltering Jubaland or reviving the Berbera MoU.
  it: ''
- hash: 95cb4faf
  kind: cards
  en: The Turkish forward base that protects Mogadishu draws the rivals it is meant to deter. The Warsheikh spaceport doubles, in the reading of regional press, as a missile test range 'threatening Israel';
    Israel recognised Somaliland within the same twelve months. The more Somalia is Turkey's outpost, the more attractive Somaliland becomes as the counter-outpost.
  it: ''
- hash: dd27a891
  kind: cards
  en: 'Somalia is a state whose survival is contracted out. The federal government in Mogadishu

    holds a capital, and little else it can call its own; its army is trained and its air power

    flown by foreigners, its soldiers'' allowances are paid by Brussels and the AU when they are

    paid at all, and its budget rests on an IMF programme and a diaspora. A dozen patrons each

    buy a piece - Ankara the base, the oil and the space range, Cairo and Asmara a pact aimed at

    Addis Ababa, Doha and Riyadh a bet against Abu Dhabi, Beijing a vote against Taipei and

    Hargeisa, Washington an air campaign it will not fully fund - and none of them buys the state,

    so the patrons'' quarrels become Somali politics. Luttwak''s logic bites twice. Abroad, the

    manoeuvre is relational: Mogadishu has learnt to sit at the seams of its patrons (at El Alamein

    on 4 October, then on the telephone to Abiy on the 5th), but the seams run through its own

    territory. At home the logic is paradoxical: every step to centralise (the March 2026

    amendments, one person one vote, the parallel Gedo administration) makes the federation

    weaker, because Puntland, Jubaland and Southwest answer by leaving, and the second week of

    October 2026 shows the bill - Hees to al-Shabaab, Balad Hawo to Jubaland, Qansax Dheere to

    Laftagareen, troops massed against opposition leaders at home. Three signals that are not rows:

    a report, not confirmed by either government, that Somalia will buy Pakistani JF-17 fighters

    (14 Oct); a former US ambassador calling the government ''illegitimate'' (13 Oct), which is not

    Washington''s position; and the gap between 1,091 Egyptian AUSSOM troops and the ''about 15,000''

    that The National attributes to Egypt in Somalia, which would mean a bilateral deployment outside

    AUSSOM that no one has yet documented. The decisive date is 31 December 2026: if UNSOS lapses,

    AUSSOM''s contributors go home and the patrons'' bets are exposed; if the US relents or the Gulf

    pays, the same patrons will have bought the next piece.'
  it: ''
- hash: d150646d
  kind: cards
  en: Prevent Kosovo's consolidation as a state - no recognition, no membership of the UN or the Council of Europe.
  it: ''
- hash: b28b018b
  kind: cards
  en: Continuity of the Vučić/SNS regime. Vučić resigned the presidency on 27 Sep 2026 to head the list at the 25 Oct 2026 snap election as prime-minister candidate.
  it: ''
- hash: 026c903a
  kind: cards
  en: 'Military neutrality: declared by parliament in 2007 and formalised in the 2019 Defence Strategy, with NATO Partnership for Peace as the ''optimum level'' of cooperation.'
  it: ''
- hash: ae4cc192
  kind: cards
  en: EU accession on its own terms. Membership is called a 'strategic choice', while alignment with EU foreign-policy declarations was 60% in the first half of 2026 against 100% for the other Western Balkan
    candidates.
  it: ''
- hash: f4dae681
  kind: cards
  en: Patronage of Serbs beyond the border - Republika Srpska, northern Kosovo, Montenegro.
  it: ''
- hash: 1813168d
  kind: cards
  en: Growth through foreign investment from every side, with EXPO 2027 in Belgrade as the showcase ('Leap into the Future - Serbia 2027', EUR 17.8bn).
  it: ''
- hash: 317ac8b9
  kind: cards
  en: Derecognition campaign against Kosovo (stated goal - push recognitions below 97 of 193 UN members) and lobbying against Kosovo's membership of international organisations, which the Commission reads
    as contrary to the Ohrid Agreement.
  it: ''
- hash: 9c049cc5
  kind: cards
  en: Russian and Chinese cover at the UN on Kosovo, obtained by withholding alignment with EU declarations critical of Moscow and Beijing.
  it: ''
- hash: bb86ff2a
  kind: cards
  en: 'Multi-vector balancing: Moscow Victory Day parade (9 May 2025), Beijing parade (3 Sep 2025), ''community with a shared future'' with China, China FTA in force since July 2024, EU critical raw materials
    MoU (July 2024), US strategic dialogue launched 17 July 2026.'
  it: ''
- hash: 0a745411
  kind: cards
  en: 'Rearmament from every supplier: 12 Rafale F4 for EUR 2.7bn (Aug 2024), Chinese FK-3 and HQ-17A air defence, defence budget +64.8% in 2025, 75-day conscription from March 2027.'
  it: ''
- hash: 175bd932
  kind: cards
  en: Ammunition exports as a hedge - roughly EUR 800m reached Ukraine through third countries since 2022 (FT), a figure Vučić called 'in the right ballpark'; all exports halted on 23 June 2025 after Russian
    accusations.
  it: ''
- hash: 968d818a
  kind: cards
  en: '''Serbian world'' narrative (Vulin) that Vučić disowns as doctrine; protests framed as a Western ''colour revolution'', with public thanks to Russia''s SVR for backing that claim; RT Balkan launched
    with official support.'
  it: ''
- hash: 720b2560
  kind: cards
  en: 'Energy: Russian gas covers about 75% of consumption (over 90% a year earlier) at EUR 318 per 1,000 m3 against roughly EUR 868 on the market, but with no multi-year contract since May 2025 - only
    quarterly extensions, the latest to 31 Dec 2026.'
  it: ''
- hash: 8943794f
  kind: cards
  en: 'Oil: NIS is 56.15% Russian-owned; US sanctions took effect on 9 Oct 2025, Croatia''s JANAF pipeline (sole crude route) stopped deliveries and the Pančevo refinery (about 80% of fuel) shut on 2 Dec
    2025, restarting on 16 Jan 2026 under a temporary licence. The sale of the Russian stake to Hungary''s MOL is not closed; OFAC licences run to 30 Oct 2026.'
  it: ''
- hash: 333b1c64
  kind: cards
  en: 'The EU is the dominant economic partner: 58.2% of total trade in 2025 and 67.6% of FDI inflows in Jan-Nov 2025. In May 2026 the EU withheld EUR 428m of Growth Plan funds; in July 2026 eight member
    states blocked the opening of negotiating Cluster 3.'
  it: ''
- hash: bfeaf9d5
  kind: cards
  en: 'NATO presence in Kosovo: KFOR 4,739 troops from 31 nations (June 2026), with a gradual reduction toward 3,000-3,500 announced on 12 June 2026.'
  it: ''
- hash: 03319ae2
  kind: cards
  en: 'Domestic legitimacy: the Novi Sad canopy collapse (1 Nov 2024, 16 dead) set off the largest protests in Serbian history; PM Vučević resigned on 28 Jan 2025; BiEPAG calls the protests ''the most serious
    challenge thus far to Vučić''s government''.'
  it: ''
- hash: 1384f5aa
  kind: cards
  en: 'Demography: population down more than 660,000 between 2011 and 2025, with a net 11,000 emigrants a year.'
  it: ''
- hash: dc884832
  kind: cards
  en: The veto on Kosovo requires Moscow and Beijing, and Moscow and Beijing close the road to Brussels. Belgrade withholds alignment to keep UN cover on Kosovo, while the Commission ties the pace of negotiations
    to normalisation with Kosovo.
  it: ''
- hash: 3e08c467
  kind: cards
  en: Neutrality paid for and armed by the West. The flagship purchase is French, growth rests on 58% EU trade, and 'neutral' ammunition supplied Ukraine.
  it: ''
- hash: ed97861c
  kind: cards
  en: Hedging buys leverage but not trust. By December 2025 relations had cooled with nearly every key partner at once - the US (tariffs, NIS), Russia (gas, ammunition), the EU (protests, later Mladić's
    funeral); only China had not worsened. The Belgrade IIPE itself calls the 'four pillars' policy 'ad hoc, reactive alignment management' that is 'increasingly unsustainable'.
  it: ''
- hash: b950cf1e
  kind: cards
  en: The Russian energy bargain became a liability. Cheap oil-indexed gas and Russian ownership of NIS gave the 2022-23 price advantage, then shut the country's only refinery and forced Belgrade to push
    Russia out of NIS through Hungary's MOL.
  it: ''
- hash: 732e4832
  kind: cards
  en: Lithium cuts both ways. EU interest in Jadar 'weakens its ability to insist on reforms' (SWP), yet domestic protest forced Rio Tinto to put the project into care and maintenance in November 2025.
  it: ''
- hash: 761801ca
  kind: cards
  en: The 'colour revolution' narrative, a tool of domestic survival, is cited by the Commission as evidence against Serbia's 'strategic direction'.
  it: ''
- hash: 26509f30
  kind: cards
  en: Mladić buried with military honours (7 Sep 2026) for domestic consensus - the EU cancelled Commissioner Kos's visit, von der Leyen and Costa called it 'shocking', and the accession push went 'on hold'.
  it: ''
- hash: be84b5e9
  kind: cards
  en: 'Serbia runs a hedging strategy with one fixed point - Kosovo - and everything else

    negotiable. In Luttwak''s terms the paradox is structural: the instrument that

    protects the fixed point (Russian and Chinese cover at the UN) is the one that

    blocks the declared strategic goal (EU membership), and the "neutrality" that

    justifies the hedge is financed by the side the hedge is meant to keep at a

    distance. Through 2025-26 the hedge stopped paying: the US sanctioned NIS, Russia

    refused a long-term gas contract and accused Belgrade over ammunition, the EU

    froze funds and talks after the Mladić funeral. Two signals worth watching that

    are not rows: Vučić did not attend the 2026 Moscow parade, and in May 2026 Serbia

    held its first-ever exercise with NATO on its own soil. The 25 Oct 2026 election

    decides whether the strategy has an author at all.'
  it: ''
- hash: 89dda7bc
  kind: cards
  en: 'Hold the regime through the national elections set for 22 December 2026. The first vice president, Riek Machar, has been on trial for treason in Juba since 22 September 2025, and the vote has been
    put off before: the last move (September 2024) pushed it from December 2024 to December 2026.'
  it: ''
- hash: 3e9b0488
  kind: cards
  en: Keep the oil flowing, and the revenue with it. Crude reaches the sea only through Sudan's pipeline to Port Sudan, so exports stop whenever the Sudanese war cuts the line (Heglig in November and December
    2025), and the state borrows against future oil (the UAE loan).
  it: ''
- hash: 8c3f60d9
  kind: cards
  en: Bring the armed opposition into a Kenyan-mediated process on Juba's terms. The Tumaini track (Kenya, with Ruto and Sumbeiywo as lead mediators) aims to pull in the holdouts outside the 2018 agreement;
    Juba insists any deal be an annex to that agreement, not a stand-alone one.
  it: ''
- hash: a939ac63
  kind: cards
  en: Ugandan special forces in Juba since March 2025, beside the national army (SSPDF), which the Security Council Report describes in sustained hostilities with the SPLA-IO.
  it: ''
- hash: '94646565'
  kind: cards
  en: Crude sold through Sudan, with CNPC as the lead Chinese operator, which explored a second export line via Djibouti and Ethiopia in 2024; and an oil-backed loan of about USD 12.9bn over 20 years from
    a UAE-linked company, whose status is unclear.
  it: ''
- hash: aec83dfc
  kind: cards
  en: Kenya mediates the holdouts' track; China and Russia abstain on the UN measures against Juba. The arms embargo was renewed on 29 May 2026 by nine votes, with six abstentions.
  it: ''
- hash: a67e190a
  kind: cards
  en: The oil route runs through a war it does not control. Sources disagree on how far the RSF holds Heglig, but the group reportedly takes about USD 4 a barrel for transit (September 2026 report), so
    the state's main revenue passes through a rival's checkpoint.
  it: ''
- hash: 477ce790
  kind: cards
  en: Sanctions and the blue helmets. The UN arms embargo runs to 31 May 2027 and UNMISS (ceiling 12,500 troops and 2,101 police) to 30 April 2027. The US cancelled visas for all South Sudanese passport
    holders on 5 April 2025.
  it: ''
- hash: f003b2c5
  kind: cards
  en: Famine and flood. About 7.8 million people (56% of the population) were in IPC phase 3 or worse in spring 2026, with a credible risk of famine in parts of Upper Nile and Jonglei. Floods in 2025 affected
    about 1.02 million people in 29 counties (OCHA, 31 October 2025).
  it: ''
- hash: 0ca62088
  kind: cards
  en: Removing the rival removes the peace the regime needs. The treason trial takes out the one figure who could contest the 2026 vote, but UN experts said in December 2025 that it is further eroding the
    2018 agreement, the frame under which the UN mission and donors deal with Juba.
  it: ''
- hash: c4d70cc6
  kind: cards
  en: 'Juba''s survival strategy is to keep the army and the oil revenue under one roof, remove the one rival able to contest the December 2026 vote, and buy protection with Ugandan troops and Emirati credit
    rather than with a settlement. Its weak point is the single pipe: every barrel crosses a Sudanese war in which South Sudan has no say, so the oil that keeps the state alive is also the lever Khartoum
    and the RSF hold. The 2018 agreement survives only as the diplomatic frame donors still use, and each move against Machar wears it down further.'
  it: ''
- hash: 351d4305
  kind: cards
  en: Keep Lisbon as the first partner, now that Carlos Vila Nova has a second term. He won in the first round (19 July 2026) with about 55.9% of the vote on preliminary counts, and Portugal's prime minister
