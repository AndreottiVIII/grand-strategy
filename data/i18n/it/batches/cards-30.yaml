- hash: 8f63f340
  kind: cards
  en: 'Romania is a frontline state with a rear-area politics. Its grand strategy is borrowed security: bind the United States, NATO and the EU to the Black Sea by hosting their bases, buying their arms
    with their loans and keeping Ukraine and Moldova alive as buffers. The method has worked in hardware (Kogalniceanu, Deveselu, F-35s, SAFE) and fails at the margin Washington controls: the brigade left
    in October 2025 while Bucharest was offering a base for the Iran operation five months later. What is new in 2026 is that the weak point is internal. The annulled election of 2024 did not remove the
    sovereigntist vote, a third of Parliament, and the fiscal repair that the EU and the rating agencies demanded took the coalition apart; the country has had a caretaker cabinet since 5 May and a fourth
    nominee since 5 October, with every agency one step above junk. Neighbours show the same split between kinship and interest: Moldova is kin and a partner, Ukraine is a partner and a dispute over Romanian
    schools, Hungary is a co-member whose new government (Magyar, April 2026) has restarted the conversation, Serbia is a partner it presses on the Vlachs, Turkey the one NATO ally in the Black Sea with
    ships and a strategic partnership. China is held at arm''s length by law (the 5G rules that exclude Huawei) and, since Dan''s remarks on the 2025 strategy, with open caution; Israel is a partner whose
    war Romania abstained on in 2023 and 2024 and voted for the Palestinian seat in 2026. Read through Luttwak, the danger is that Romania''s policy of making itself useful rests on stable government in
    Bucharest, which is the thing it lacks.'
  it: ''
