lang: it
items:
- hash: 133bd84d
  kind: cards
  en: 'Barbados under Mottley plays a small state''s game: its weight comes from a climate and debt agenda carried through UN and multilateral stages, and from a regional line against militarisation that
    puts it at odds with the US deployment and with Trinidad and Tobago. Its tie to London is the Commonwealth and history rather than a treaty, and the reparations claim, the China loans, the CARICOM files
    on Haiti and Venezuela and the weight of tourism are not sourced in this pass. Hurricanes and the debt level, the two constraints a Caribbean card would normally lead with, are also unverified here
    and stay open until a source is read.'
  it: ''
- hash: b52f7671
  kind: cards
  en: 'Keep the Islamic monarchy intact and the succession in the Bolkiah line: the Sultan is head of government as well as head of state, Crown Prince Al-Muhtadee Billah is first in line, and the 2014
    sharia penal code, with stoning in force from April 2019, is the public statement of that identity.'
  it: ''
- hash: 4278321c
  kind: cards
  en: 'Diversify an economy built on oil and gas under Wawasan Brunei 2035, by attracting Chinese refining and petrochemical capital: the Hengyi complex at Pulau Muara Besar, with Phase 2 launched in January
    2026 to lift capacity to about 400,000 barrels a day by late 2028.'
  it: ''
- hash: f26511eb
  kind: cards
  en: 'Keep British and Singaporean troops and training on its soil as the security floor: the UK garrison, whose Royal Gurkha Rifles train in its jungle, renewed on 19 December 2024, and the Singapore
    Armed Forces'' jungle camp at Lakiun in Temburong.'
  it: ''
- hash: dc27bb50
  kind: cards
  en: 'Multilateral seats as its shield: a member of ASEAN since 1984 and of the Commonwealth and the OIC, and ASEAN chair in 2013, when it sought Philippine support for the chairmanship.'
  it: ''
- hash: 94b9fa24
  kind: cards
  en: 'Oil and gas as the export base: Brunei LNG at Lumut, a joint venture of the government, Shell and Mitsubishi, has supplied Japan since 1972; Hengyi''s refinery, financed from China, has covered domestic
    fuel demand since 2019.'
  it: ''
- hash: d35a0bb0
  kind: cards
  en: 'Defence bought in and trained: a UK garrison of British Army and RAF personnel, Singapore''s jungle camp, and Exercise Airguard with the Republic of Singapore Air Force since 1994.'
  it: ''
- hash: 36f58646
  kind: cards
  en: 'Oil and gas are the economy: Brunei LNG, the country''s largest oil and gas producer, sits at Lumut in Belait, the district where the industry is centred, so the state''s wealth still comes from
    hydrocarbons.'
  it: ''
- hash: cae64df7
  kind: cards
  en: 'Its defence is borrowed: a British garrison and a Singaporean jungle camp cover it, so it cannot press the Limbang question with Malaysia and leaves that claim dormant.'
  it: ''
- hash: 060b7b81
  kind: cards
  en: 'Its legitimacy at home rests on Islam, which limits it abroad: the 2019 stoning provisions of the sharia penal code drew boycott calls against royal-owned hotels, and its OIC membership (1984) binds
    it to Islamic solidarity while its defence and investment partners are not Muslim-majority states.'
  it: ''
- hash: 4aaa6422
  kind: cards
  en: The sharia penal code was meant to anchor the sultanate in Islam and in its own rule, but the 2019 stoning provisions made royal-owned hotels and investors the target of boycotts, the very outside
    capital that the Wawasan 2035 diversification depends on.
  it: ''
- hash: 8d7ca00e
  kind: cards
  en: 'Brunei is a small, rich sultanate whose economy rests on one resource, oil and gas, with LNG sold to Japan since 1972. Its strategy is defensive and borrowed: it keeps its Islamic-monarchic identity
    at home (the 2014 sharia penal code, stoning in force since 2019), buys its security abroad (a British garrison and Singapore''s jungle camp), and buys diversification from outside (Hengyi, Chinese
    capital at Pulau Muara Besar). The sharia code is the price it has chosen to pay for legitimacy, and the boycott it drew is the cost. The Limbang claim against Malaysia stays dormant rather than pressed.'
  it: ''
- hash: f4c41e70
  kind: cards
  en: Keep the sovereignty India's 2007 treaty guarantees while letting India carry security and the large infrastructure. The revised treaty dropped the 1949 clause that made Bhutan follow India's advice
    on external relations, but Thimphu still builds its foreign policy around Delhi, and India intervened in Doklam in 2017 at Bhutan's request.
  it: ''
- hash: 3a4f28ef
  kind: cards
  en: 'Settle the undelineated northern boundary with China on the three-step roadmap without giving ground: MoU of 14 Oct 2021, 24 rounds of talks since 1984, and the joint demarcation team set up at the
    13th Expert Group Meeting in Beijing (Aug 2023). China meanwhile built villages in the disputed north and west.'
  it: ''
- hash: e8a7175a
  kind: cards
  en: 'Turn hydropower and the Gelephu project into the economic base: Punatsangchhu-II (1,020 MW) completed in 2025, Punatsangchhu-I restarted in April 2026 after a seven-year halt, and the Gelephu Mindfulness
    City with a rail link to Assam''s Kokrajhar approved in September 2025 and under construction from 2026.'
  it: ''
- hash: f02d1047
  kind: cards
  en: 'Hydropower sold mainly to India is the export base: by the IDSA count, hydropower is about 63% of Bhutan''s export revenue (the Embassy in New Delhi says nearly two-thirds), making the grid the one
    large lever Thimphu controls.'
  it: ''
- hash: 0976228c
  kind: cards
  en: 'Gross National Happiness and carbon negativity as the external brand: the constitution (Article 5) requires at least 60% forest cover, and Bhutan presents itself as carbon negative and GNH as a development
    model. The carbon accounts conflict (Daily Bhutan: about 2.2 Mt CO2 emitted a year against trees absorbing more than three times that; Carbon Credits: about 9 Mt sequestered against 2 Mt generated in
    2020), so this is a government claim, not a measured balance.'
  it: ''
- hash: d5652994
  kind: cards
  en: 'A deliberately thin diplomatic network: relations with 62 of the 192 other UN members and with none of the five permanent Security Council members; Bhutan has embassies in only six countries, and
    only Bangladesh, India and Kuwait have embassies in Thimphu.'
  it: ''
- hash: 25f525b2
  kind: cards
  en: 'The currency and the market are Indian: the ngultrum is fixed at par with the Indian rupee, and the Royal Monetary Authority warns of external imbalances with India that press on the peg.'
  it: ''
- hash: b96602f8
  kind: cards
  en: 'Aid is large and tied to Delhi: India committed INR 10,000 crore for the 13th Five Year Plan (2024-29), of which INR 7,000 crore is project-tied; Indian grants fund over 30% of the 2026-27 capital
    budget. Japan adds scholarship and equipment grants and the EU smaller grants and loans.'
  it: ''
- hash: 31d29e79
  kind: cards
  en: 'Its own people are leaving: monthly departures from Paro airport rose from under 500 before COVID to over 5,000 in early 2023; Bhutanese migrants in Australia doubled from 12,424 (2020) to 25,363
    (2024). The World Bank (2024 household survey) finds migrants educated, aspiring migrants younger, and unemployment at 6% in 2022.'
  it: ''
- hash: 182ac35f
  kind: cards
  en: 'Boundary and security are settled elsewhere: no diplomatic relations with China, an undelineated border, and the 2017 Doklam standoff settled by a troop disengagement (28 Aug 2017) that left the
    road question unresolved in the official statements; Thimphu keeps a disciplined silence on the Chinese villages.'
  it: ''
- hash: 2e6c73bf
  kind: cards
  en: 'The state trains the people it then loses: scholarships (Japan''s JDS and others) and the civil service produce graduates, and education is the main reason aspiring migrants give (64%). The human
    capital Bhutan spends on becomes its export.'
  it: ''
- hash: 126e8ff3
  kind: cards
  en: Hydropower gives Bhutan its export revenue and its carbon-negative brand, but the revenue runs through one grid. The more power the Punatsangchhu projects send to India, the more the state's solvency
    depends on a neighbour, while the Bangladesh power deal (via India) waits for Delhi's consent.
  it: ''
- hash: '76627422'
  kind: cards
  en: 'Bhutan runs the strategy of a small state that has bought its security by

    tying it to one neighbour and then spent the proceeds on its own autonomy:

    the 2007 treaty removed the clause that made Thimphu take India''s advice, but

    the hydropower grid, the rupee peg and the Indian grants keep the arrangement

    close to the old one. Its three open fronts are China (no relations, an

    undelineated border, Doklam in 2017, villages since 2016 that Thimphu does not

    contest in public), the outside world (a deliberately thin network, a

    carbon-negative and GNH brand used as the voice in the UN and elsewhere) and its

    own population, which is leaving for Australia and beyond. The 2024 election

    returned Tshering Tobgay (PDP, 30 of 47 seats according to one report) as prime

    minister from late January 2024. The Gelephu Mindfulness City, with its

    Indian-funded rail link, is the bet: if it works, Bhutan gets a second economic

    base besides hydropower and a new reason for young people to stay. If it does

    not, it is one more Indian-built asset. Gaps not covered in this card: Ukraine and

    Gaza positions, Thailand and Singapore, the Gulf, and the US 2025 contacts beyond

    the 10% tariff.'
  it: ''
- hash: 5e050304
  kind: cards
  en: Lift the state's share of De Beers. Gaborone is reported close to a deal that would take its stake from 15% to about 25%; not final as of 14 October 2026. That is a retreat from the majority Boko
    sought in late 2025.
  it: ''
- hash: 6e68c4da
  kind: cards
  en: Keep the state budget and the diamond price afloat while 12 million carats sit in stock at end-December 2025, nearly double the government's 6.5 million carat ceiling. The finance ministry keeps production
    broadly flat for now.
  it: ''
- hash: df354b82
  kind: cards
  en: Debswana, the joint venture with De Beers, makes about 90% of national diamond sales. The state's levers are its stake and the sales arrangement; older reporting says it has threatened not to renew
    the sales deal, a point not re-checked for this card.
  it: ''
- hash: 23dc71e8
  kind: cards
  en: 'South Africa as partner and customs union partner: President Ramaphosa''s state visit to Gaborone on 20-21 May 2026, which co-chaired the sixth Bi-National Commission (the last was in 2022). Overseas
    trade runs through South African and Namibian ports, an undated US trade guide says.'
  it: ''
- hash: 30aa338b
  kind: cards
  en: 'Diamonds are the state: about one-third of government revenue and three-quarters of foreign exchange earnings (finance ministry figures). The ''about 80% of exports'' figure is historical and could
    not be checked against trade data, so this card does not use it.'
  it: ''
- hash: 47c54eac
  kind: cards
  en: Lab-grown stones and the US tariff. Industry estimates put lab-grown at about a quarter of the US diamond jewellery market; Botswana's finance ministry warned that 15% US tariffs, with possible Indian
    duties, could prolong the slump. The 37% rate of an earlier proposal is not the final one.
  it: ''
- hash: 7841ec96
  kind: cards
  en: 'Gaborone presses De Beers to sell more and to hand over a larger stake, yet it holds 12 million carats, nearly double its own ceiling. The market, not the stake, is the binding limit: a bigger stake
    makes the state co-owner of stones it cannot sell.'
  it: ''
- hash: 27a7e163
  kind: cards
  en: 'Botswana''s grand strategy is to turn diamond dependence into state control: a bigger stake in De Beers, a say over sales, and a budget that survives the slump, with Debswana carrying about 90% of
    national diamond sales. The lab-grown glut and the US tariff erode the value of that stake faster than negotiation can raise it, so Gaborone is reported to be settling for about 25% rather than the
    majority it wanted. South Africa is the partner it leans on (SACU, the rand, the ports); Namibia, Zimbabwe, the EU and the UK are not yet read from sources, and the card is thinner than its tier because
    the call budget ran out.'
  it: ''
- hash: 2d9c184d
  kind: cards
  en: Keep Faustin-Archange Touadera in power. He was expected to win a third term at the December 2025 election after a 2023 referendum removed the term limits (AP, pre-vote explainer, Dec 2025). The result
    is not verified in this pass.
  it: ''
- hash: e605bbcc
  kind: cards
  en: Hold the state against the armed groups with a foreign guard, paid for in minerals rather than cash. The government preferred to pay for security services with minerals (AP reporting, read through
    search summaries; the page could not be opened); the UPC and 3R signed a disarmament deal in April 2025 (see the Chad row), but the rest of the armed field is not settled.
  it: ''
- hash: '97187227'
  kind: cards
  en: Foreign forces as the regime's guard. Russian advisers have operated since March 2018 (free military aid, widely believed to be Wagner); Africa Corps was to replace Wagner in 2026 (Touadera in Moscow
    in March 2026 to finalise it; the USD 15m a month figure has one source only and is not used). A bilateral Rwandan force has operated since 2020 outside MINUSCA; the government said both countries sent
    hundreds of troops after an alleged coup bid. Rwanda is also among the largest MINUSCA contributors.
  it: ''
- hash: eec6726c
  kind: cards
  en: 'Minerals. Diamonds and gold are the payment for protection: the government said it would rather pay for services with minerals than cash. The value of the concessions is not verified in this pass;
    gold and timber concessions for Russian firms are our reading and not yet sourced here.'
  it: ''
- hash: 2e18cc54
  kind: cards
  en: The UN scaffolding is shrinking. MINUSCA was extended for a year, but the Security Council said its presence would scale down because of budget constraints (AP, as summarised in search results). Its
    own troop mix is led by Rwanda and Bangladesh, so the UN is not an independent guard.
  it: ''
- hash: 42281f4e
  kind: cards
  en: 'France has left. The last French troops went in 2022 after relations cooled over Bangui''s ties to Russia under Touadera (Wikipedia, index only). The aid resumption of 2024-25 is not verified here,
    so the security market is one-sided: Russia or Rwanda.'
  it: ''
- hash: 29c34668
  kind: cards
  en: The guard that keeps Touadera in power makes him dependent on the patrons who take the minerals. The government's own account of the foreign deployment is an alleged coup bid that it blamed on former
    president Bozize's backing of militias (Naharnet); the threat it names is what keeps the guards in place.
  it: ''
- hash: 2ede4400
  kind: cards
  en: 'Bangui''s strategy is regime survival through foreign guards: Russian advisers since 2018 and a Rwandan force since 2020 hold the capital and the state, while Touadera seeks a third term under a
    constitution changed in 2023. The price is minerals, and the mission that is meant to hold the peace, MINUSCA, is itself led by Rwanda and shrinking for budget reasons. France has left, so the choice
    is Moscow or Kigali, and both of those patrons are paid in the same ground that the armed groups fight over.

    Not verified for this card: the armed-group field (the CPC coalition has no source here, so no stance or actor file was written for it), the Chad and Sudan border and RSF spillover, diamond and gold
    export volumes, and the French aid resumption of 2024-25.'
  it: ''
- hash: 10c0de9e
  kind: cards
  en: 'Keep the North American frame intact (CUSMA, NORAD, NATO) while Washington coerces it: on 1 July 2026 the United States declined to renew CUSMA ''in its current form'', which triggers annual joint
    reviews while the pact runs to 2036, and a Section 338 duty of 50% on about USD 20bn of Canadian goods applies from 22 August 2026. Carney''s line is that the pact survives without any new deal, so
    the frame is the first objective and the most exposed one.'
  it: ''
- hash: 13bf58ad
  kind: cards
  en: 'Break the dependence on one market: over 70% of Canadian exports go to the United States (Carney, New York Times, 23 September 2026), so Ottawa sells elsewhere: the EU Security and Defence Partnership
    and SAFE access (Canada the first non-European country in SAFE, Council approval 15 June 2026), a bid to join the UK-led Joint Expeditionary Force and merger talks on defence financing with London (September
    2026), a 10-year Cameco uranium deal with India (March 2026) and the January 2026 reopening with China on EVs and canola.'
  it: ''
- hash: 2309cd66
  kind: cards
  en: 'Meet NATO''s spending and the Arctic: Canada reached 2% of GDP on defence in 2025 (NATO''s annual report, March 2026), Carney has committed to 5% by 2035, about USD 150bn a year, and raised the Arctic
    presence to 365 days a year with over-the-horizon radar against Russia, which he called ''without question'' a threat in the Arctic (January 2026).'
  it: ''
- hash: 148223b4
  kind: cards
  en: 'Get the oil to a second coast: an Indigenous co-owned bitumen pipeline from Alberta to the British Columbia coast, declared a project of national interest in the November 2025 memorandum with Alberta,
    then an implementation agreement of 15 May 2026 that set an Alberta application for 1 July 2026 and a federal national-interest designation by 1 October 2026.'
  it: ''
- hash: f2e2942e
  kind: cards
  en: 'Rebuild the fleet and the industrial base with partners other than Washington: Budget 2025 puts CAD 81.8bn over five years into the armed forces, with CAD 6.6bn for a Defence Industrial Strategy
    and CAD 1bn for an Arctic Infrastructure Fund of dual-use airports, ports and roads. On 6 July 2026 Carney named Germany''s TKMS preferred supplier for up to 12 submarines (a German-Norwegian design,
    Hanwha of Korea kept as the fallback; contract talks run through 2027 and first boats are reported for 2034), after the March 2025 decision to buy Australian over-the-horizon radar technology for more
    than CAD 6bn. The aim is sovereign capacity inside NATO interoperability, and the contracts go to Europe, Australia and Canadian industry.'
  it: ''
- hash: ac3731a2
  kind: cards
  en: 'Hold the federation together while the pressure from the south lasts: the Parti Quebecois won the Quebec election of 5 October 2026 with 59 of 127 seats and 28% of the vote, a minority government
    that promises a sovereignty referendum but not before 20 January 2029, and Alberta votes on 19 October 2026 on whether its government should begin the legal process towards a binding independence referendum
    (Leger, 2-4 October 2026: 70% remain, 22% separation referendum). Carney answered the Quebec result by offering to work with the premier-designate for workers hit by tariffs. National unity is in no
    treaty and the first three objectives depend on it.'
  it: ''
- hash: d1f8994b
  kind: cards
  en: 'Market access as currency: a quota for 49,000 Chinese EVs at the 6.1% most-favoured-nation rate, rising toward about 70,000 over five years, traded against Chinese duties on canola seed cut from
    84% to 15% (asked by 1 March 2026); CUSMA access, the EU''s SAFE contracts (up to 80% Canadian content) and the uranium contract with India as the other chips.'
  it: ''
- hash: c94699f0
  kind: cards
  en: 'Forces on NATO''s eastern and northern flanks: the framework nation of the NATO Multinational Brigade in Latvia, with more than 2,000 troops to 2031 (see the LVA card), a 365-day Arctic posture,
    and military aid to Ukraine of CAD 2.8bn in 2026 with the July 2026 package of ammunition and armoured vehicles (Prime Minister''s readout).'
  it: ''
- hash: b03f1240
  kind: cards
  en: 'Coalitions around Washington: the EU Security and Defence Partnership (June 2025), the membership bid in the UK-led Joint Expeditionary Force and talks on merging the Canadian and British defence-finance
    initiatives (September 2026), the Visiting Forces Agreement with the Philippines (ratified by the Senate on 11 August 2026), and the Beijing visit of January 2026 to rebuild ties while the Chinese side
    is pressed on interference.'
  it: ''
- hash: 803e4939
  kind: cards
  en: 'Retaliation and supply as leverage: dollar-for-dollar counter-tariffs on CAD 27.6bn of US goods at 50%, 25% or 15% from 8 September 2026 (steel and aluminium up from 25% to 50%), against the Section
    338 duties that from 22 August reached CUSMA-compliant goods for the first time; and the offer of supply, with LNG that Carney says Canada could double by the end of the decade (Japan, March 2026),
    the 2025 critical-minerals work with Germany, a Saudi investment-protection agreement aimed for early 2027 and a UAE investment pledge reported at 70bn (currency not specified, November 2025).'
  it: ''
- hash: ed86ff08
  kind: cards
  en: 'Procurement as alliance-making: the submarine contract with TKMS (Germany, with a Norwegian partner) and Hanwha held in reserve, the Australian over-the-horizon radar, access to the EU''s SAFE loans,
    joint procurement and a lead-nation slot at the 2026 Kielce defence show with Poland, and CAD 20m for the Leopard 2A4 repair facility at Gliwice that serves Ukraine. Each contract ties a partner''s
    industry to Canada''s defence plan without passing through the United States.'
  it: ''
- hash: dbd34c5a
  kind: cards
  en: 'A ladder of strategic partnerships to replace the one-patron habit: Poland (25 August 2025), Japan (6 March 2026), an updated partnership with China (foreign minister Wang Yi in Ottawa, 28-30 May
    2026), Germany (negotiations opened on 7 July 2026 for conclusion before the end of 2026), Saudi Arabia (a Coordination Council led by foreign ministers, 8-10 July 2026) and the UAE (trade-agreement
    talks). At the Arctic edge the same method gives a consulate in Nuuk (opened in early February 2026, the same day as France''s) and the 2022 settlement of the Hans Island dispute with Denmark.'
  it: ''
- hash: c942dbf9
  kind: cards
  en: Trade dependence. Canada's two-way goods trade with the United States was USD 712.8bn in 2025, and over 70% of Canadian exports go to one buyer that now uses tariffs as coercion (the USA card's sources).
    The diversification into Europe, Britain, India and Asia is a multi-year project, not a substitute that can be switched on in 2026.
  it: ''
- hash: e0a602c6
  kind: cards
  en: A divided domestic consensus. The Alberta pipeline needs British Columbia, where Premier David Eby calls the project 'fictional' and says it threatens the social licence of other coastal projects,
    and Quebec's Bloc Quebecois opposes it, while a national poll of October 2025 found a majority favourable to a pipeline to the B.C. coast. Ontario's Premier Doug Ford fights the China EV quota as a
    threat to the car industry.
  it: ''
- hash: 6498228a
  kind: cards
  en: Defence capacity. Canada reached 2% of GDP only in 2025, after 1.47% in 2024, when it was one of 11 NATO members that missed the target; the 5% pledge means roughly 2.5 times the current share of
    GDP, and the Defence Investment Agency that should speed procurement is new.
  it: ''
- hash: 50ab1fc2
  kind: cards
  en: 'A federation that holds the levers Washington aims at. The Section 338 order of 20 July 2026 is framed as an answer to Canadian discrimination against US alcoholic beverages, a provincial matter,
    and the later exclusions concern dairy and alcohol, so Ottawa cannot concede on the targets without the provinces. The union is itself in play: a Parti Quebecois minority (59 of 127 seats, 28% of the
    vote) governs Quebec from October 2026 and Albertans vote on 19 October on starting the route to a binding independence referendum. Ottawa can promise a partner only what the provinces will let it deliver.'
  it: ''
- hash: '93191341'
  kind: cards
  en: 'Time. The threat arrives before the hulls: the submarine contract is not expected before the end of 2027, the first boats are reported for 2034 and the 5% pledge runs to 2035, while Canada reached
    2% of GDP only in 2025. The 1.5% part of the NATO target (resilience, infrastructure) is said by Budget 2025 to be met by federal, provincial and municipal spending already planned, without a published
    calculation, so the visible effort is the 3.5% core. The Arctic and Baltic deployments have to be held with the force that exists.'
  it: ''
- hash: f4ffb88b
  kind: cards
  en: Beijing sets a price for the reset. Chinese ambassador Wang Di told the Globe and Mail that the new partnership would suffer if Canada sent more warships through the Taiwan Strait or parliamentarians
    kept travelling to Taiwan, and Canada's frigate HMCS Charlottetown went through on 22-23 May 2026, days before Wang Yi's visit to Ottawa. Canada wants the canola and EV trade without paying in Taiwan
    policy, while its own inquiry names China the most active foreign interferer.
  it: ''
- hash: 08178587
  kind: cards
  en: The EU track answers Washington's coercion and hands Washington a new target. Trump called Canada's association with the EU a possible 'hostile act' (CNN, 15 September 2026), so the partnership that
    diversifies Canada's trade is also the one the tariffs are now aimed at.
  it: ''
- hash: bb964684
  kind: cards
  en: The China reset buys canola access with car-market access. The EV quota that lets Chinese vehicles in at 6.1% is the concession that Ontario and the auto industry fear will close the door on Canadian
    carmakers in the US market, which is the very market the reset was meant to hedge.
  it: ''
- hash: 54014d9f
  kind: cards
  en: Much alignment with Beijing on the Arctic. After meeting Xi, Carney said he found 'much alignment' with China on the sovereignty of Greenland and its people, while Canada's 2024 defence policy names
    Chinese and Russian ambitions in the Arctic as the threat that justifies the new spending.
  it: ''
- hash: 3e326866
  kind: cards
  en: 'Diversification runs through the one market. The turn away from the United States is real in the policy (partnerships with Poland, Japan, Germany, Saudi Arabia, the UAE, China) but the monthly data
    of 2026 point south: in May 2026 exports to the United States rose for the fourth month running while exports to other countries fell, and Canada''s goods surplus with the US was CAD 11.6bn, the largest
    since January 2025, against a CAD 7.4bn deficit with everyone else. The tariffs forced the search for other buyers; when they bite less the old buyer takes the goods, and when they bite more (Section
    338 on CUSMA-compliant goods) the cost falls on the exporters whose customers were never replaced.'
  it: ''
- hash: c1761865
  kind: cards
  en: The 5% pledge buys an alliance whose guarantor treats Canada as a target. Canada commits 3.5% of GDP to core defence and 1.5% to resilience by 2035 for NATO and NORAD, whose strongest member imposes
    a duty of 50% on Canadian goods, leaves the trade pact unrenewed, calls Canada's EU association a possible hostile act and, by Carney's own account to the New York Times, has been planned against as
    a possible invader. The rearmament strengthens the shield Washington relies on while its contracts go to Europe, Australia and Canadian firms rather than to US ones, which Washington reads as exit;
    our reading, not a source's.
  it: ''
- hash: 90377ff0
  kind: cards
  en: The pressure that unites Canada also feeds its secessionists, and the pipeline meant to bind Alberta needs the provinces that resist it. Tariffs and the 51st-state line rally Canadians round Carney,
    yet Quebec voted on 5 October 2026 for a party that promises a referendum timed for after Trump's term (not before 20 January 2029), Alberta votes on 19 October on the legal route out, and the Alberta-to-coast
    oil pipeline that is the national-interest answer to Alberta's grievance is called fictional by British Columbia's premier and opposed by the Bloc Quebecois. Each tool that works against Washington
    (national projects, tariffs, the Arctic and defence build-up) needs a consensus that the same pressure is wearing thin.
  it: ''
- hash: '56405122'
  kind: cards
  en: 'Canada is a middle power whose security and market both point south, and whose largest partner is now its coercer. Ottawa answers with a deliberate turn to Europe, Britain, Asia and the Arctic while
    keeping NORAD, CUSMA and NATO, the frame it cannot afford to lose. The turn is transactional by design, from the China EV quota to the India uranium deal, and the grades say so: partner with most of
    them, reluctant only where the alignment is new. Every hedge that answers Washington also gives it a target, so the test is whether the annual CUSMA reviews stay talk or become the exit.


    The enrichment of 16 October 2026 adds the second front. Canada builds a ladder of partnerships (Poland, Japan, Germany, Saudi Arabia, the UAE, China) and an industrial defence plan (the TKMS submarines,
    the Australian radar), yet the monthly trade data still point south, and the federation that has to deliver all this has just elected a sovereigntist government in Quebec and will vote in Alberta on
