# Translate every `en` into it. Write the translations to the file cards-17.out.yaml next to this one,
# as `items:` of `- hash: <same hash>` / `it: <translation>`, appending one item at a time (valid YAML at
# every step), never editing this file. Keep names, dates, numbers and quotes; register of a foreign-office
# brief: dry, precise, no flourish.
lang: it
items:
- hash: 364ad683
  kind: cards
  en: 'Regulation as foreign policy provokes the guarantor: the DSA fine on X (EUR 120m) was met by Rubio and Vance as censorship, by the US Justice Department joining X''s court challenge and by Lutnick
    tying steel tariffs to digital rules. The Union''s strongest autonomous instrument is the one on which the US is least willing to bargain, and it can least afford a fight with the country it depends
    on for defence.'
  it: ''
- hash: e25879b8
  kind: cards
  en: 'De-risking China requires China: the 2040 target (-90%) and the EV transition depend on Chinese batteries and magnets, so the Union that fines Chinese EV makers (7.8-35.3% duties) now accepts minimum-price
    undertakings that, Bruegel warns, raise European prices and margins, and negotiates rare-earth fast channels in return for trade concessions (8-9 Oct 2026). Protection of the green industry and the
    green target pull in opposite directions.'
  it: ''
- hash: 47b02bbe
  kind: cards
  en: 'The Union acts as a grand strategist only by accident. It has no army, no single voice and no budget that anyone loves; what it has is a market, a rulebook, a currency and the right to say yes or
    no to its neighbours. Read through Luttwak, that is a strategy of the second level: it exports order by attraction (enlargement, association, Growth Plan money, visa-free travel) and by exclusion (sanctions,
    frozen assets, trade defence), and it moves only when 27 governments consent. In 2026 the logic of consent has hardened into a posture: Russia is the declared threat, the United States has become a
    ''necessary partner'' that cannot be left and cannot be trusted, China is a rival managed through quotas and licences, and the neighbourhood is a queue. The paradoxes all come from the same root - the
    Union is strongest where its rules are least contested and most exposed where it needs speed. It has just shown it can finance a war (EUR 90bn), outlast a spoiler (Orban''s defeat on 12 Apr 2026) and
    ban a fuel (Russian gas), and it still cannot appoint an envoy, use the assets it froze or guarantee its own borders without Washington. The reading for the next year is whether the Ankara-era bargain
    - a more European NATO, a Union that pays - turns into capacity, or whether the 2028-34 budget, the Turnberry steel clause and the Hungarian reversal are only a pause.'
  it: ''
- hash: '51943568'
  kind: cards
  en: Deter Russia and, if deterrence fails, defend every inch of Allied territory (Article 5, 'ironclad' at The Hague 2025 and again at Ankara, 7-8 Jul 2026). The instruments are the regional defence plans,
    the NATO Force Model of high-readiness forces, forward land forces in eight countries and the three 'Sentry' operations (Baltic Sentry, Jan 2025; Eastern Sentry, Sep 2025; Arctic Sentry, Feb 2026).
    The 2022 Strategic Concept names Russia 'the most significant and direct threat'; the Ankara declaration calls it 'the long-term threat'. The aim is deterrence, not Russia's defeat.
  it: ''
- hash: 9602f49e
  kind: cards
  en: 'Rearm Europe: 5% of GDP by 2035, of which 3.5% on core defence and up to 1.5% on defence-related spending (resilience, infrastructure, industry), with annual national plans and a review in 2029.
    NATO estimates for 2026 show only five allies above 3.5% on core defence (Lithuania, Estonia, Latvia, Poland, Greece), an alliance average of 2.86%, and Spain, Slovakia and Czechia as open reluctants;
    Ankara asked every ally for ''credible plans''.'
  it: ''
- hash: dbe255bd
  kind: cards
  en: 'Keep the United States in, above all its nuclear umbrella and the enablers Europe cannot yet replace, while the Pentagon moves to ''NATO 3.0'' (Europeans take primary responsibility for conventional
    defence). The price Rutte pays is visible: the 5% pledge in 2025, a ''more European NATO'' in 2026, and the acceptance of US cuts to the Force Model and of a six-month posture review that weighs withdrawing
    25,000-40,000 of the roughly 80,000 US troops in Europe.'
  it: ''
- hash: ba50fcff
  kind: cards
  en: 'Support Ukraine without admitting it: EUR 70bn of aid pledged at Ankara for 2026 and at least as much for 2027, the NSATU command in Wiesbaden that took over coordination of aid from the US-led Ramstein
    format, and PURL, the scheme by which allies pay for American weapons. Membership stays ''irreversible'' in the 2024 Washington text, absent from The Hague text and from the six paragraphs of Ankara.'
  it: ''
- hash: 771c35d5
  kind: cards
  en: 'Resilience against hybrid war: protect undersea cables, airspace and critical infrastructure from sabotage, drones and balloons below the Article 5 threshold. The Hague pledge reserves up to 1.5%
    of GDP for it, and Article 4 consultations were held twice in September 2025 (Poland, 10 Sep; Estonia, 23 Sep).'
  it: ''
- hash: 866752b1
  kind: cards
  en: 'Stabilise the edges without opening new fronts: the Southern Neighbourhood Action Plan (Washington 2024; a Special Representative who visited Rabat for the third time on 6-7 Oct 2026), the Western
    Balkans (KFOR being cut from 4,739 toward 3,000-3,500, Bosnia kept in a stalled membership track), the Black Sea, and the Indo-Pacific partners (IP4) kept close while the 2022 ''systemic challenge''
    language on China is left unrepeated in the 2025 and 2026 declarations.'
  it: ''
- hash: 5b58f819
  kind: cards
  en: 'The consensus machine: the North Atlantic Council decides unanimously, the Secretary General (Mark Rutte, since 2024) brokers between Washington and the rest - the Davos ''framework'' with Trump
    on 21 Jan 2026 that ended the Greenland tariff threat and produced Arctic Sentry is the model - and Article 4 consultations signal collective concern without committing force.'
  it: ''
- hash: 505e7ff0
  kind: cards
  en: 'Partnerships as an outer ring: Partnership for Peace (Serbia, Moldova), aspirant partners (Georgia, Bosnia, Ukraine), the four Indo-Pacific partners (Japan, South Korea, Australia, New Zealand, met
    by Rutte at Ankara on 7 Jul 2026) and a division of labour with the EU (NATO for command, capabilities and standards; the EU for industry and investment), 23 of whose 27 members are allies.'
  it: ''
- hash: a3128a25
  kind: cards
  en: 'Short, signable texts: The Hague declaration (June 2025) ran to five paragraphs and the Ankara declaration to six, written to be accepted by a US president who had threatened to skip Article 5. Ukraine''s
    membership, China and the Indo-Pacific were left out so that the unity of the sentence survives; the 2022 Strategic Concept stays the only agreed text on them. Words are graded: Russia is ''the long-term
    threat'', not an adversary.'
  it: ''
- hash: 7c7bbed0
  kind: cards
  en: 'Command and force structure: SACEUR Gen. Alexus Grynkewich (also head of US European Command) runs the Sentry operations, the regional plans and the Force Model, forward land forces in eight countries
    (Forward Land Forces Finland stood up on 6 Jun 2026), NSATU in Wiesbaden and KFOR; nuclear deterrence rests on ''an appropriate mix of nuclear, conventional, and missile defence capabilities''.'
  it: ''
- hash: 9db567d2
  kind: cards
  en: 'Burden-shifting inside the structure: Grynkewich told allies in June 2026 that the Force Model had an ''unhealthy co-dependence'' on US forces that ''will change'', and in July said Europe had backfilled
    most of the gaps left by American cuts (a third fewer US fighter jets, fewer destroyers, no submarines in the crisis pool, fewer drones).'
  it: ''
- hash: 1726a1b6
  kind: cards
  en: 'Money as the lever: the 5% target and annual plans, the PURL channel through which European allies and Canada buy US weapons for Ukraine (about USD 6.7bn in the first year), over USD 50bn of new
    joint procurements announced at Ankara (A400M and MRTT fleets, MQ-4C Triton, an AWACS successor) and a defence-industrial push (more than USD 139bn added to core defence by European allies and Canada
    in 2025).'
  it: ''
- hash: b29850c0
  kind: cards
  en: Unanimity makes every member a veto and every grievance a toll. Hungary and Turkey held up Finland's and Sweden's accession until January-March 2024; Slovakia's Fico opposes the 5% target and said
    on 18 Sep 2026 he does not want Slovakia in a conflict 'because of some Article 5'; Spain refuses the target and denied the US its bases for the Iran war.
  it: ''
- hash: b1c14f39
  kind: cards
  en: 'NATO has no army or budget of its own: every brigade, jet and euro is a member''s, and the critical enablers - intelligence, air defence, long-range fires, strategic lift, nuclear forces - are disproportionately
    American. The US is about 57% of alliance spending (USD 1.03tn of USD 1.8tn estimated for 2026).'
  it: ''
- hash: 10e71160
  kind: cards
  en: The reliability of the guarantor. President Trump's comments before Ankara appeared to question Article 5, he said 'NATO WASN'T THERE WHEN WE NEEDED THEM' after allies would not join the Iran war,
    the Pentagon announced on 1 May 2026 that 5,000 troops would leave Germany, and Washington's Greenland claim set a treaty ally against the leader of the alliance until the Davos 'framework' of 21 Jan
    2026 and the trilateral agreement of 22 Sep 2026.
  it: ''
- hash: b797033c
  kind: cards
  en: 'The arithmetic of 5%: only five allies are above 3.5% on core defence in 2026, ten sit slightly above 2%, Slovenia is the only ally still below the 2014 target (1.61%), and the 1.5% ''related'' category
    invites relabelling (Italy tried to count the EUR 13.5bn Messina bridge before the US ambassador objected).'
  it: ''
- hash: 5bfcad6e
  kind: cards
  en: 'The open door is jammed from both sides: Ukraine and Georgia cannot be invited while the war lasts and while Washington and several allies refuse, yet the formula of Bucharest 2008 and ''irreversible''
    of Washington 2024 cannot be withdrawn without conceding Moscow''s point; Georgia''s package was reviewed after the 2024 election.'
  it: ''
- hash: d831003b
  kind: cards
  en: 'Out of area it is not a party: in the US-Israeli war on Iran the Secretary General said NATO would not join, yet allies'' bases in Romania, Italy, Germany and Britain were used and Iran accused the
    alliance of complicity; the Ankara text only says Iran ''must never have a nuclear weapon'' and urges freedom of navigation in the Strait of Hormuz.'
  it: ''
- hash: 691f7f87
  kind: cards
  en: The more Europe rearms to keep America in, the more it enables America to leave. Every dollar of the Hague 5% was bought to hold Trump; the Pentagon answered with 'NATO 3.0' (Europe takes primary
    responsibility for conventional defence), cut its Force Model contribution in May 2026, and in September weighed withdrawing 25,000-40,000 troops. Grynkewich's July report that Europe had 'backfilled
    most gaps' is the proof of success that justifies the next cut.
  it: ''
- hash: 848bf117
  kind: cards
  en: 'Deterrence is credible only with the ally who doubts it. Nuclear deterrence is American (''the ultimate guarantor of our security'', Rutte) and only Washington can make Article 5 believable to Moscow,
    yet it is the US president who hints at conditions, ties US contributions to allies'' performance (Hegseth, June 2026) and pressed a treaty ally over Greenland. A deterrent that depends on the doubts
    of its own guarantor invites the tests it is meant to prevent: drones over Poland, MiG-31s over Estonia.'
  it: ''
- hash: 6deaf218
  kind: cards
  en: Enlargement stretched the front it was meant to shorten. Finland (2023) and Sweden (2024) closed the Baltic and added a land border with Russia; the price is a longer perimeter to garrison - a land
    command at Mikkeli, Forward Land Forces Finland, three Sentry operations, battlegroups in eight countries - at the moment the US withdraws brigades and the Force Model shrinks. The northern flank is
    stronger and thinner at once.
  it: ''
- hash: 1104177a
  kind: cards
  en: Arming Ukraine while refusing it a seat. NSATU and PURL make NATO the logistics backbone of Ukraine's defence, yet the Hague text dropped the 'irreversible path' and Ankara did not restore it; Moscow
    reads the suspended door as a Western choice of attrition over settlement, and because PURL buys American stocks, the member most reluctant to support Ukraine holds the tap (about 95% of Ukraine's Patriot
    interceptors arrive this way).
  it: ''
- hash: 168744d6
  kind: cards
  en: A target meant to bind the members becomes the line that divides them. The 5% figure was set at The Hague to give Trump a number; it has since produced a public holdout (Spain, with US tariff threats),
    a reluctant bloc (Slovakia, Czechia), a relabelling contest over the 1.5% category (Italy's bridge, Lithuania's opposition on loose definitions) and a summit that spent its energy on 'credible plans'.
    The metric measures effort, not capability, and invites the arguments about accounting that the Alliance cannot afford.
  it: ''
- hash: 24f67c8c
  kind: cards
  en: Unity bought by silence. The 2025 and 2026 declarations omit China and the Indo-Pacific and give Ukraine's membership no paragraph, which keeps the sentence unanimous and Trump in the room; but the
    only text that commits allies on China remains the 2022 Strategic Concept, so the power that most wants NATO to face China cannot point to anything newer, and Beijing replies to Rutte's 'cannot be naive
    about China' with 'Cold War mentality' anyway.
  it: ''
- hash: 0c91b44e
  kind: cards
  en: 'NATO is a strategy only in the sense that a coalition can have one: it does what

    thirty-two governments can sign, and the signature is the product. Since 2022 its

    Luttwakian logic has been straightforward at the top level (deter Russia, with

    Article 5 as the whole point) and perverse in the levels that carry it. To keep the

    one member that matters it has to make that member''s complaint its own agenda -

    more European money, more European forces, ''NATO 3.0'' - and each concession

    advertises how much of the deterrent was always American. The Ankara summit of

    7-8 July 2026 settled the immediate question (Article 5 ''ironclad'', Russia the

    long-term threat, EUR 70bn for Ukraine, over USD 50bn of procurements) in six

    paragraphs, and left the structural ones open: Washington''s posture review is due

    to reach Hegseth on 6 November, Ukraine''s door is neither shut nor opened, Spain

    and Slovakia are outside the 5% logic, and the next summit, promised for Albania

    by Rutte, has no date. Two signals that are not rows: the omission of China and of

    any Ukraine-membership language from both declarations, and Rutte''s repeated use of

    the ''division of labour'' with the EU as the way to make Europeans pay without calling

    it a retreat. Read through Luttwak, the alliance''s strength (the Article 5 promise

    that everyone believes in enough to pay for) is also its weakness: the promise is

    only as strong as the doubts of the one guarantor, so the alliance spends its

    political capital managing the guarantor rather than the adversary.'
  it: ''
- hash: bf24c1b8
  kind: cards
  en: 'Deter India and keep Kashmir and the Indus waters alive as live claims: preserve a credible nuclear and conventional balance against a much larger neighbour, hold the line that any diversion of the
    Indus system is ''an act of war'' (Sharif at the UN, September 2026) and restore the Indus Waters Treaty India put ''in abeyance'' on 23 Apr 2025.'
  it: ''
- hash: d9b6adb1
  kind: cards
  en: 'Crush the internal insurgencies and force the Afghan Taliban to stop sheltering them: the TTP in Khyber Pakhtunkhwa and the Baloch separatists (BLA and others) killed more than 600 soldiers and police
    in 2025, and Islamabad''s line is ''visible and verifiable action'' by Kabul, enforced by air strikes.'
  it: ''
- hash: 5b695e7d
  kind: cards
  en: 'Keep the state financed: an IMF programme (staff-level agreement on the fourth review of the EFF on 7 Oct 2026), rolled-over Chinese, Saudi and Emirati deposits, record remittances (USD 41.6bn in
    FY2025-26) and EU GSP+ access, after the near-default of 2022-23 and the 2025 floods.'
  it: ''
- hash: fdab5f54
  kind: cards
  en: 'Hedge by stacking patrons instead of choosing one: China (arms, CPEC 2.0, diplomatic cover), Saudi Arabia and Turkey (the Strategic Mutual Defence Agreement of 17 Sep 2025 and the Makkah pact of
    7 Aug 2026), and a warming United States (Munir-Trump lunch of June 2025, minerals and crypto offers, the Board of Peace seat, the US-Iran mediation), so that no single patron can dictate terms.'
  it: ''
- hash: ed470946
  kind: cards
  en: 'Entrench the army''s guardianship of the state inside the constitution: the 26th and 27th amendments (Nov 2025) created a Chief of Defence Forces post held by the army chief, gave Field Marshal Asim
    Munir a five-year term, command of the nuclear Strategic Plans Division and lifelong immunity, while Imran Khan stays in prison.'
  it: ''
- hash: f5adab5c
  kind: cards
  en: 'Convert geography into connectivity and rent: Gwadar and CPEC 2.0, the Uzbekistan-Afghanistan-Pakistan railway, Gulf and Central Asian trade routes, and a reset with Dhaka after Hasina, to break
    the encirclement of an India-friendly Kabul and a hostile Delhi.'
  it: ''
- hash: 07cd1e6e
  kind: cards
  en: 'Mediation as currency: Munir, Sharif and Dar brokered the April 2026 US-Iran ceasefire, hosted the Islamabad Talks (11-12 April, Vice President Vance) and the Islamabad Memorandum of 17 June 2026,
    and Pakistan joined Trump''s Board of Peace in January 2026. A UN Security Council seat (2025-26) and the defence pacts with Riyadh and Ankara widen the audience.'
  it: ''
- hash: 9f933600
  kind: cards
  en: 'A victory narrative for the May 2025 war (''Marka-i-Haq''): the claim, never independently confirmed, that J-10C fighters shot down five to seven Indian aircraft including Rafales, repeated by the
    defence minister and ISPR, and a standing frame of India as the sponsor of the TTP and the BLA (''Indian proxies'').'
  it: ''
- hash: e99d6615
  kind: cards
  en: 'Nuclear deterrent under the new Chief of Defence Forces (who commands the Strategic Plans Division), a conventional rocket arm (Army Rocket Force Command announced 13 Aug 2025; Fatah-IV 750 km tests
    on 30 Sep 2025 and 14 May 2026), Chinese platforms (J-10C with PL-15) and troops lent to partners: about 8,000 troops, a JF-17 squadron and an HQ-9 battery in Saudi Arabia.'
  it: ''
- hash: 526a215c
  kind: cards
  en: 'Coercive force against Afghanistan: air strikes in Nangarhar, Paktika and Khost (21 Feb 2026), then strikes on Kabul and Kandahar and the declaration of ''open war'' on 27 Feb 2026 (Operation Ghazab
    lil-Haq), repeated after the Kohat attack of 18 Sep 2026; accompanied by a deportation drive that sent back over 2.4 million Afghans by June 2026.'
  it: ''
- hash: e2d3a88c
  kind: cards
  en: 'Offering resources and routes in exchange for protection: critical minerals and crypto joint ventures pitched to Washington (copper, gold, lithium, antimony), the CPEC 2.0 agreement of May 2026 with
    Beijing, Russian Pakistan Steel Mills protocols, JF-17 exports (Azerbaijan, up to USD 4.6bn announced) and a diaspora whose remittances (USD 41.6bn in FY26) cover the trade gap.'
  it: ''
- hash: 8ca9d995
  kind: cards
  en: 'A fragile balance sheet: external debt near USD 130bn, with debt service absorbing about 40% of exports (World Bank), gross reserves of about USD 21.5bn, inflation of 10.3% in September 2026, and
    the 2025 floods (1,037 dead; Rs822bn of losses) on top. Every foreign policy choice is made under an IMF programme and with deposit rollovers that can lapse (the Saudi USD 3bn rollover was unconfirmed
    in July 2026).'
  it: ''
- hash: d9cb7336
  kind: cards
  en: 'A two-front security problem it cannot close: a larger, nuclear-armed India to the east that holds the Indus headworks (upstream of Punjab and Sindh), and a Taliban-ruled Afghanistan plus the TTP
    to the west, with Balochistan inside. Crisis Group warns another major attack could undermine the calm with both Kabul and Delhi.'
  it: ''
- hash: 994522f6
  kind: cards
  en: 'Dependence on China for hardware and money: about 80% of arms imports in 2021-25 (SIPRI), the largest bilateral creditor (23% of public external debt), and Rs560bn (about USD 2bn) owed to Chinese
    power producers. Beijing''s price is the safety of its nationals, whose repeated killing (about 20 dead since 2021) strains the relationship.'
  it: ''
- hash: 81177a92
  kind: cards
  en: 'Energy and shipping exposed to the Gulf: more than 22% of imports are energy and nearly 20% of imports pass through the Strait of Hormuz, so the US-Iran war it mediates raises its own fuel bill (fuel
    prices +20% on 6 March 2026) and threatens the Gulf remittances (Saudi Arabia USD 9.78bn, the UAE USD 8.81bn in FY26) that sustain it.'
  it: ''
- hash: 5b8dc46f
  kind: cards
  en: 'A narrow domestic base for the hybrid order: Imran Khan and PTI are excluded but not defeated (Khan jailed since August 2023, sentenced again in December 2025, Supreme Court ordering hospital treatment
    in August 2026), and Chatham House reads the 27th amendment as formalising army rule. Legitimacy rests on external recognition, not on a settled civil-military bargain.'
  it: ''
- hash: eafb3eda
  kind: cards
  en: 'Patron obligations that cut across each other: the Saudi-Turkish pact obliges troops while Pakistan is also the US-Iran go-between and shares a long border with Iran; the Board of Peace seat and
    Trump''s call to join the Abraham Accords (May 2026) collide with a public that rejects recognising Israel.'
  it: ''
- hash: bd83ed24
  kind: cards
  en: The army that guarantees the state hollows out the civilian state it needs. The 27th amendment secures Munir as Chief of Defence Forces (five years, command of the nuclear arm, lifelong immunity,
    removable only by a two-thirds vote) just when the IMF, the EU's GSP+ review (the EU takes about 28% of exports; the Commission's assessment of 16 Jul 2026 and the EU ambassador's September warning
    say access is not assured) and Western partners judge Pakistan on institutions and rule of law. The more power is concentrated in one man, the more the foreign money that pays for the army depends on
    his personal standing.
  it: ''
- hash: 97e20417
  kind: cards
  en: 'A won air battle that lost the water. The May 2025 clash showcased Chinese fighters and gave Pakistan a victory narrative and a seat at Trump''s table, but the Indian answer to Pahalgam that outlasted
    the ceasefire was not military: the Indus Waters Treaty has stayed in abeyance for 17 months, Delhi says it stays so until Pakistan ''credibly and irrevocably'' abjures terrorism, and Pakistan has only
    threats (''act of war'') to answer a lever it cannot match. Tactical success moved the dispute onto the terrain where India is stronger.'
  it: ''
- hash: 0cb8bdee
  kind: cards
  en: Strategic depth turned into strategic exposure. Pakistan backed the Taliban to gain depth against India; the Taliban now shelter the TTP, deal with Delhi and face Pakistani bombers. Islamabad's answer
    (air strikes on Kabul, 'open war', the expulsion of 2.4 million Afghans) deepens the hostility of the government it needs to deny the TTP a base, and pushes Kabul toward India.
  it: ''
- hash: 7a370104
  kind: cards
  en: 'Four patrons, four prices. Each patron buys a different Pakistan: Beijing wants its workers protected and its debts honoured, Riyadh and Ankara want troops and a nuclear shadow, Washington wants
    minerals, Gaza and an Iran deal, and the Gulf wants labour. The mediator''s neutrality that Washington and Tehran prize is compromised by the defence pact with Riyadh (Al Jazeera lists balancing mediation
    with the Saudi commitment as a difficulty), and the pact in turn is a bet on a US that may disengage. Every patron strengthened is a margin of freedom spent with another.'
  it: ''
- hash: 968a8746
  kind: cards
  en: CPEC creates the enemy it must defend against. Gwadar and the Chinese projects in Balochistan are the BLA's best argument, so the more China invests the more Chinese nationals are targeted (about
    20 dead in 14 attacks since 2021), the more the army diverts to securing them, and the more Beijing's patience becomes the main risk to the 'iron brother'; at the same time Chinese power producers'
    unpaid dues (Rs560bn) feed the power-sector circular debt that the IMF programme is trying to cap.
  it: ''
- hash: 7a839bef
  kind: cards
  en: Mediation earns favour but the war it mediates costs Pakistan more than almost anyone. Munir's shuttle between Washington and Tehran won the Trump warmth that cut the tariff to 19% and a place at
    the Board of Peace, yet the Hormuz closure hits an economy that imports energy through the strait and lives on Gulf remittances, and the talks stalled after the 60-day Islamabad Memorandum lapsed in
    mid-August 2026.
  it: ''
- hash: 5e565007
  kind: cards
  en: 'Pakistan plays the oldest game of the weaker state beside a stronger neighbour

    and plays it harder than anyone: it does not try to match India, it tries to

    make India''s every move expensive by multiplying the relationships that stand

    behind it. In Luttwak''s terms this is relational manoeuvre, not attrition. China

    supplies the hardware, Saudi Arabia and Turkey the pacts and the money, the

    United States the late-arriving cover, and the nuclear deterrent the floor under

    all of it. Since May 2025 the manoeuvre has paid unusually well: a field marshal

    sits at the head of the armed forces, Washington and Tehran both use his

    channel, and a treaty with Riyadh turned a decades-old Saudi-Pakistani tie of manpower

    for money into a defence guarantee. The paradoxes come from the same source. The army''s

    political control is its own great strategic liability: it gives the state one

    decisive voice for a crisis, but it ties the access to Western money, the EU

    market and the IMF to the standing of one man and one institution, and it keeps

    the civilian economy it must lean on in permanent emergency. The second

    paradox is geographic: the victory of May 2025 was real in the air, but India

    answered with the river, and a weaker state has no good reply to a lever it

    cannot touch. Third, the western front turned the old strategy upside down: the

    Taliban it once nursed as depth are now its most dangerous neighbour, and each

    blow it lands in Kabul makes the TTP''s sanctuary safer. Pakistan''s four patrons

    are also four creditors of influence, and the Saudi-Turkish pact, signed while

    it brokers peace for Iran, is the first sign that they can be played against

    each other as easily as it plays them. The thing to watch is not the next

    crisis with India but whether the three constraints (the budget, the

    Afghan border, the water) tighten at the same time while one man holds every

    lever.'
  it: ''
- hash: a985b148
  kind: cards
  en: Keep the canal Panamanian, neutral and open to all flags. The 1977 Torrijos-Carter treaties handed the waterway to Panama; in 2025 Trump spoke of 'taking back' the canal, and President Mulino answered
    that Panama would keep ownership. The objective is to hold that line without a fight, which is why the concession went to security rather than to sovereignty.
  it: ''
- hash: acbd6434
  kind: cards
  en: Keep the port concessions under Panamanian law and the revenue at home. A Panamanian lawsuit sought to annul the 25-year CK Hutchison contract for the ports at both canal entrances as unconstitutional,
    while the BlackRock purchase was pushed through as the solution Washington praised.
  it: ''
- hash: d7175c79
  kind: cards
  en: Security for sovereignty, traded. The April 2025 memorandum with the US Defence Department reopens a rotational US presence at three former bases along the canal and records a declaration on first
    and free transit for US warships. The price was a US military presence that Panama's own treaty history had ended.
  it: ''
- hash: ac85c8a7
  kind: cards
  en: Port review as leverage. Mulino agreed to review Chinese-linked businesses in Panama, including the CK Hutchison ports, after Rubio's February 2025 ultimatum; the review is a regulatory lever that
    Panama can turn on and off.
  it: ''
- hash: 8ddaced6
  kind: cards
  en: Street and social cost. An indefinite strike from 28 April 2025 against pension reform and US interference paralysed Bocas del Toro; Chiquita lost more than US$75 million and fired thousands of its
    roughly 6,500 Panamanian workers; Panama declared a state of emergency in June 2025 after deadly clashes. The government cannot make a US-facing move without a domestic price.
  it: ''
- hash: 9808d7d4
  kind: cards
  en: Opposition to the US pact. The opposition calls the security memorandum a 'camouflaged invasion', and the protests named the deal among their grievances. The alignment Mulino needs for the canal is
    the one his own politics resist.
  it: ''
- hash: 53fe117d
  kind: cards
  en: The treaties that gave the canal back in 1977 barred the foreign bases that the 2025 memorandum brings back along the waterway. Panama defends its sovereignty over the canal with the presence that
    sovereignty was meant to end, and the protests show the cost is paid at home.
  it: ''
- hash: 49d8a8ec
  kind: cards
  en: Panama's strategy is to keep the canal Panamanian and its revenue flowing, and in 2025 the only protector of both was the power that had threatened to take the canal back. Mulino paid for US cover
    with a military presence and a rupture with Beijing's Belt and Road, and kept the Chinese-linked ports under review rather than seized. The cost shows at home in the strike, the emergency and the word
    'invasion', so the next test is whether neutrality of the canal survives a patron that is also its loudest claimant.
  it: ''
- hash: ec24323b
  kind: cards
  en: 'Sell the minerals on two markets at once: Chinese trade through the Chancay port, and copper into the United States under the tariff threat. Minerals are the economy; the rest follows from them.
    China took 36.2% of 2025 exports (Mincetur, as reported; an earlier snippet gave 32%, see the relations note); mining was US$61.8bn of the record US$90.1bn exported, copper 45% and gold 38% of it (SNMPE);
    copper to the US is under 5% of copper exports, but the US sets the tariff and bought US$10.15bn of all goods in 2025.'
  it: ''
- hash: 6171d87f
  kind: cards
  en: A stable executive after a run of removals. Congress removed Boluarte in October 2025 and José Jerí in February 2026; José María Balcázar succeeded Jerí as interim president; Keiko Fujimori (Fuerza
    Popular) won the 7 June 2026 runoff with 50.14% against 49.87% for Roberto Sánchez, a margin of 49,641 votes; the electoral jury (JNE) proclaimed her on 3 July and she was sworn in on 28 July 2026 for
    2026-2031, 'the ninth president in a decade' in AP's count. Luis Galarreta, her first vice president, is prime minister; Elmer Cuba (a former central bank head) is at Economy and Carlos Espá at Foreign
    Affairs. Stability is the aim as we read the sequence.
  it: ''
- hash: fda4d75c
  kind: cards
  en: Rebuild the ring of regional relations that the last governments broke. Relations with Mexico were cut after Mexico sheltered ex-prime minister Betssy Chávez in its embassy (November 2025) and restored
    on 7 August 2026, when Lima gave her safe-conduct as a gesture; consular relations with Venezuela, cut by Caracas in July 2024, were announced as resumed on 24 July and the consulate in Caracas was
    due to reopen on 1 September. Espá named Mexico and Venezuela among his first tasks.
  it: ''
- hash: a0bb0e42
  kind: cards
  en: Put security first and hold the border. Fujimori's inaugural programme is a crackdown on crime with more military involvement and prison reform; her interior minister is a retired general who also
    won a Senate seat; with Ecuador she agreed on 28 July to work on sensors and drones for the southern border and on prison management. Security is the platform on which she means to attract investment.
  it: ''
- hash: '55352368'
  kind: cards
  en: Win a review of the United States tariff and keep Washington as a strategic partner. The US put an additional 12.5% tariff on Peru on 24 July 2026 (Section 301, on forced-labour import bans); Peru
    sent Congress a forced-labour bill and Espá said that once it passes Lima is better placed to ask for a review. The US is the second market (US$10.15bn of exports in 2025), and Lima is moving to join
    the US-backed Shield of the Americas against transnational crime.
  it: ''
- hash: 950c61e1
  kind: cards
  en: Chancay, the COSCO Shipping Ports terminal (60% owned, a 30-year concession, 1 million TEU a year), the first COSCO terminal in South America, inaugurated by video link by Xi and Boluarte on 14 Nov
    2024. Copper and gold are the export base.
  it: ''
- hash: 8c606553
  kind: cards
  en: 'Security cooperation with the United States: counter-narcotics programmes, the Rio Pact, and RIMPAC participation (US-Peru relations article on Wikipedia, tier 4 pointer, not verified against the
    primary US or Peruvian texts).'
  it: ''
- hash: bd7382e8
  kind: cards
  en: A trade-treaty network and a record export base. Goods exports were US$90.08bn in 2025 (up 21%, 27.3% of GDP), with China, the EU and the US the three destinations (over 60% together); free-trade
    deals with Japan (in force 2012; Japan took 4.5% of exports in 2024) and South Korea (signed 2010, in force 2011) sit beside the Chinese and US ones. In January-May 2026 mineral exports rose 53.1% to
    US$33.4bn, so the means is the export bill itself.
  it: ''
- hash: 566ee22a
  kind: cards
  en: Regional diplomacy as repair and as a bloc. The Binational Cabinet with Ecuador under the 1998 Brasilia accords (the next one due in Lima late in 2026), the Mexico reset of 7 August 2026, the consular
    reopening in Caracas, and the Santiago declaration of 28 August 2026 on strategic minerals (copper and lithium) signed with Chile, Argentina and Bolivia.
  it: ''
- hash: a9b7d0fc
  kind: cards
  en: The armed forces turned inward. The inaugural programme gives the military a larger part in the fight against organised crime; the defence minister (Rafael Belaúnde Llosa, with no military background)
    oversees patrols of streets and transport hubs, and the interior minister is a retired general who led the Joint Command in 2018-2021. Fujimori also means to ask Congress for legislative powers on crime
    and El Niño.
  it: ''
- hash: 33eef333
  kind: cards
  en: 'Congress is the constraint. The 1993 constitution''s vague ''moral incapacity'' ground lets Congress remove the president, and it has done so: Castillo in December 2022, Boluarte in October 2025
    and Jerí in February 2026. Each removal resets the executive''s agenda, and the 2026 transition came under Balcázar, an interim president chosen by Congress.'
  it: ''
- hash: 071d2bf1
  kind: cards
  en: 'Export exposure. Copper and gold are the economy, and the US copper tariff is set in Washington: Andina reported a 50% copper tariff in July 2025, and the 2026 rates in the sources found conflict
    (a 50% and a 53% figure on commercial tariff sites, a proposed phased universal tariff in a CFR brief). Rates not verified; the constraint is the dependence, not the figure.'
  it: ''
- hash: a8ca9ee1
  kind: cards
  en: Chancay is a Chinese-controlled asset that Peru cannot easily police or revisit. COSCO holds 60% under a 30-year concession; in early 2026 a Peruvian judge ruled that the regulator Ositrán cannot
    supervise the port beyond its service tariffs, and the US State Department said it was concerned Peru could lose oversight of critical infrastructure. Lima's reply is that the port must obey Peruvian
    rules; China answered with 'strong dissatisfaction'. The port also lost US$10.8m in 2025 on US$57.1m of revenue.
  it: ''
- hash: 9ffe0aed
  kind: cards
  en: A narrow mandate and a divided Congress. Fujimori won by 49,641 votes; her rival Roberto Sánchez won inside Peru by about 32,000 votes and she won on the overseas vote (about 81,000), and he alleges
    fraud without presenting evidence (MercoPress) and has spoken of going to the inter-American human rights system. Her party holds 22 of the 60 seats in the restored Senate, short of the 31 for a majority,
    so every reform and every request for legislative powers needs partners in the chamber that removed three presidents.
  it: ''
- hash: 7ead4429
  kind: cards
  en: 'Borders and migration it cannot close. Peru hosts about 1.54 million Venezuelans (UNHCR, end of 2023; R4V''s August 2026 regional update puts Peru at 1.63 million, another report at 1.22 million),
    32% of them in monetary poverty, and and the Chilean border is a second front: in November 2025 Peru declared a state of emergency to block the Chilean border crossings, as migrant flows built up toward
    Chile. The load is on Lima, the decisions are in Santiago and Caracas.'
  it: ''
- hash: 1272d012
  kind: cards
  en: Chancay brings the Chinese money and the Chinese trade, and the Chinese link became a political liability. President Jerí was removed by Congress in February 2026 for undisclosed meetings with Zhihua
    Yang, a Chinese businessman under government scrutiny. The investment the state needs is also what brings its leaders down.
  it: ''
- hash: 1a650d5e
  kind: cards
  en: 'Chancay is the gift that draws Washington''s suspicion. The port was built to put Peruvian minerals on a 23-day route to Shanghai and it handled 336,200 TEU in 2025 (target: over 350,000), but the
    same terminal has become the object of US warnings: Southern Command''s 2024 testimony on possible military use, the State Department''s February 2026 statement that Chinese ''cheap money'' costs sovereignty,
    and a US congressional call in April 2026 for Peru''s next government to reclaim it (the last from a secondary report). The US is the market for Peru''s fruit and gold (US$10.15bn in 2025) and the one
    that put a 12.5% tariff on Peru on 24 July 2026; its stated ground is forced-labour enforcement, not Chancay, and the link between the two is our reading.'
  it: ''
- hash: c8b06884
  kind: cards
  en: The copper state with no stable government. Peru's exports have set a record five years running (US$90.08bn in 2025, up 21%; mining 66% of the total; copper alone US$28.1bn) and rose again in January-May
    2026 (minerals up 53.1%), while Peru went through nine presidents in a decade. The wealth arrives whoever governs, so no one in Lima is forced to build the state that would hold it, and the Congress
    that removes presidents is paid by the same boom.
  it: ''
- hash: 336a7531
  kind: cards
  en: The Venezuelan migration pulls Lima toward the government its migrants fled. Peru took in about 1.5 million Venezuelans and UNHCR praised its temporary stay permit in August 2026; Caracas cut relations
    in July 2024 after Lima recognised the opposition's Edmundo González, and Peru now reopens a consulate in Caracas because the migrants need papers and an eventual voluntary return needs the Venezuelan
    state (Plasencia, 14 August 2026). Looking after the migrants means dealing with the regime that Peru's earlier line condemned.
  it: ''
- hash: ee2c6758
  kind: cards
  en: The Bolivian sea question puts Peru on both sides. Under the 1929 Treaty of Lima Bolivia's access to the Pacific is blocked by Chile and by Peru (background in the sources read, the treaty text not
    read); in 2010 Peru and Bolivia signed the Ilo protocol, a 99-year duty-free maritime zone for Bolivia at Peru's own port (its Peruvian ratification is unverified). In January 2026 President Paz said
    the Pacific, 'through Chile or Peru', has to be Bolivia's gateway, and on 28 August 2026 Peru signed the minerals declaration with Chile and Bolivia. Peru offers Bolivia the sea it can give from its
    own coast while a Bolivian claim on the Chilean coast would reopen the settlement of 1929 that Lima also signed.
  it: ''
- hash: fd6ce216
  kind: cards
  en: 'Peru is governed since 28 July 2026 by Keiko Fujimori, who won the runoff by 49,641 votes after Congress removed Boluarte (October 2025) and Jerí (February 2026): a right-wing president with the
    largest bloc in a new Senate but not a majority, a prime minister who is her vice president, and a cabinet built on investment and security. Peru is a minerals economy with two markets: China took 36.2%
    of 2025 exports, much of it through COSCO''s Chancay, and the United States, the second market, now puts a 12.5% tariff on Peru, so Lima has to keep both open at once; its answer so far is to call the
    US a strategic partner, repair Mexico and Venezuela, and say nothing public on China. The strategy is held back less by enemies than by its own Congress and by borders it cannot close (Chile, Venezuelan
    migration), and the Chinese port is a political risk as well as a trade gain. Not verified for this card: Boluarte''s and Jerí''s removals and the Zhihua Yang meetings beyond the Wikipedia index, the
    Iran trade figures, the Section 232 copper tariff in force today, the Brazil, Spain, UK and APEC legs, illegal mining and the Shining Path remnants (no source read), and whether Peru''s Congress ratified
    the Ilo protocol.'
  it: ''
- hash: e205aa35
  kind: cards
  en: 'Hold what it has in the West Philippine Sea without a war: the BRP Sierra Madre at Second Thomas Shoal (Ayungin), access to Scarborough (Bajo de Masinloc) and Sabina, and the exclusive economic zone
    that the 2016 arbitral award confirmed. The aim is to make every Chinese move a visible violation of law, so that a fait accompli (the September 2025 ''nature reserve'' at Scarborough, the May-June
    2026 floating platform) costs Beijing more than it gains.'
  it: ''
- hash: 413c9d1a
  kind: cards
  en: 'Keep the American shield credible, explicit and physically present: the 1951 Mutual Defense Treaty read as covering Philippine coast-guard vessels anywhere in the South China Sea, nine EDCA sites,
