  en: 'Luttwak''s thesis in the data: the rise summons the coalition. A state that grows economically, militarily and politically at once provokes the reaction that the logic of strategy predicts, and ''great-state
    autism'' keeps it from seeing the reaction as its own work. Japan''s ''greatest strategic challenge'' (Aug 2026), fourteen states on the 2016 award (Jul 2026), AUKUS, the Quad, ''systemic rival'', the
    security services of Tallinn, Riga, Oslo and Stockholm, a Philippine president who invites the US back: each is a weight added to the other scale by Beijing''s own hand.'
