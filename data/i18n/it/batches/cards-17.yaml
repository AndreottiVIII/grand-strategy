  en: Beijing has learned the lesson where it costs least and unlearned it where it costs most. The thaws of 2025-26 - India at Tianjin and Delhi, Australia's A$20bn of restrictions lifted, Lee in Beijing,
    Starmer in Beijing, To Lam's visit, the EU's ten-point list, three truces with Trump - are a state deliberately lowering its weight on the scale. But the Takaichi sentence of 7 Nov 2025 brought back
    the reflex in full (advisory, seafood, dual-use ban, a joint statement with Moscow on 'militarism'), and the Philippine shoals got batons and water cannon in July 2026. The reflex is what the thaws
    were meant to prevent, and it is applied to the two neighbours whose rearmament matters most.
