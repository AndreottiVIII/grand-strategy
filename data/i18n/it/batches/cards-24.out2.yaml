items:
- hash: 75fce79c
  it: |
    Isolamento diplomatico e raggio d'azione: 12 alleati, tre dei quali isole del Pacifico; perduti l'Honduras (2023) e Nauru (2024); il Pacific Islands Forum di Honiara (2025) ha escluso tutti i partner di dialogo, compresa Taiwan; verso gli alleati si può volare solo se i paesi terzi concedono il sorvolo.
- hash: 909f013e
  it: |
    Il PLA prova l'assedio ai margini delle acque di Taiwan: Strait Thunder-2025A (1-2 aprile 2025) e Justice Mission-2025 (29-31 dicembre 2025, il tiro reale più vicino finora, con blocco dei porti e obiettivi energetici), dopo Joint Sword di maggio e ottobre 2024. Nel 2026 l'attività aerea è scesa di circa la metà (1,200 aerei nella zona dal 1° gennaio al 9 agosto contro 2,501), mentre la presenza navale e della guardia costiera è rimasta costante.
- hash: dbe83abf
  it: |
    Concentrazione economica: il boom dei server per l'IA, che ha portato gli Stati Uniti davanti alla Cina come mercato di esportazione, rende la crescita una scommessa su un solo ciclo di prodotto, mentre Washington chiede il 40% della catena dei chip e un dazio del 100% minaccia le imprese che non producono negli Stati Uniti.
- hash: f776b64c
  it: |
    Lo scudo di silicio viene consumato per poter essere mantenuto. Taipei paga l'attenzione americana con chip e fabbriche (USD 165bn di TSMC, USD 250bn di impegni), ma ogni fabbrica costruita in Arizona indebolisce l'argomento secondo cui Washington deve proteggere l'isola perché non può farne a meno; la linea dello stesso Lutnick è che lo scudo funziona perché 'we need their silicon so badly', e il suo obiettivo è averne bisogno di meno.
- hash: 180c7a52
  it: |
    Più Taiwan compra, più le armi diventano una pedina che altri possono scambiare. Il parlamento ha stanziato fondi per un pacchetto statunitense da USD 11bn e uno da USD 14bn, e Trump poi definisce il secondo 'a very good negotiating chip' con Xi e lo tiene 'in abeyance': l'impegno che Taipei finanzia diventa la voce che Washington può concedere.
- hash: b08f40ed
  it: |
    La deterrenza invita la punizione che dovrebbe prevenire. Ogni inasprimento della linea di Taiwan (le misure 'foreign hostile force', il record di armamenti, l'impegno al 5%) è citato da Pechino come prova di 'independence by military means' e seguito da esercitazioni: Justice Mission-2025 è arrivata due settimane dopo la notifica degli armamenti di dicembre.
- hash: fc8df017
  it: |
    Vincere il voto e perdere il bilancio. Le revoche del 2025 (31 legislatori, tutti riconfermati) e la messa in stato d'accusa del 2026 (respinta 56-50) hanno rafforzato la maggioranza KMT-TPP e indebolito il presidente; il blocco ha poi tagliato il bilancio della difesa mentre la presidente del KMT Cheng Li-wun incontrava Xi il 10 aprile 2026, mettendo un canale con Pechino per l'opposizione davanti a un canale con Taipei verso la Casa Bianca.
- hash: 0b08f949
  it: |
    Diversificare dalla Cina concentra il rischio sull'America. Gli Stati Uniti hanno superato la Cina come primo mercato di esportazione nel 2025 e Taiwan ha firmato con Washington un accordo sui dazi, un impegno di investimento e uno schema di garanzie; la dipendenza che Pechino potrebbe stringere si sposta su quella che Washington può rinegoziare a ogni vertice.
- hash: c8fec480
  it: |
    La politica dell'energia pulita come bersaglio di un blocco. L'uscita dal nucleare (l'ultimo reattore ha chiuso nel maggio 2025) ha lasciato un'isola che funziona con GNL importato e circa 11 giorni di gas; il referendum per riavviare Maanshan non ha superato la soglia, quindi la base energetica è il punto più vulnerabile di uno Stato la cui strategia dipende dal reggere un assedio.
- hash: 159649f2
  it: |
    Taiwan è, nella lettura di Luttwak, il caso da manuale di uno Stato la cui sopravvivenza poggia su due cose che non controlla: essere indispensabile e l'ambiguità di un garante. La prima è reale (la punta avanzata di chip e server per l'IA), ma viene ceduta pezzo per pezzo per assicurarsi la seconda, e la seconda ormai ha un prezzo esplicito: l'amministrazione Trump tiene un pacchetto di armamenti da USD 14bn come pedina negoziale, dice di non volere che nessuno 'go independent' e si è seduta con Xi due volte nel 2026 senza una parola su Taiwan nella scheda informativa della Casa Bianca. Pechino, dal canto suo, è passata dall'esercitazione alle prove di blocco (Joint Sword 2024, Strait Thunder 2025A, Justice Mission 2025), e dal presidente alle istituzioni: punizioni legali per i 'diehards', un canale con il KMT, e pressione sui cavi sottomarini e della guardia costiera nella zona grigia. Il grado del rapporto con la Cina è quindi quello di rivale e non di avversario solo perché l'obiettivo dichiarato di Taipei è restare com'è, non porre fine allo Stato cinese, mentre l'obiettivo di Pechino è la fine della separatezza di Taiwan: la coppia è asimmetrica di proposito. Il fronte interno è la terza cerniera: un presidente il cui partito ha perso il parlamento, ha visto fallire le revoche e tagliare il bilancio, e il cui stesso parlamento ora guida una parte del piano di difesa. Segnali che non sono righe: dopo il vertice di Washington non c'è stata alcuna mega-esercitazione del PLA, l'attività aerea è la metà del 2025 mentre le navi restano, e l'Honduras non ha ancora deciso. La domanda per il 2027 è se i chip restino uno scudo o diventino soltanto un prezzo.
- hash: d9c8a97d
  it: |
    Mantenere il potere e chiudere l'ondata di proteste del 2025. La commissione elettorale ha proclamato vincitrice Samia Suluhu Hassan con il 97.66% il 1° novembre 2025, dopo che il principale partito di opposizione, Chadema, era stato escluso (12 aprile 2025) e il suo leader Tundu Lissu era stato incriminato per tradimento. Samia ha definito i disordini un tentativo di colpo di Stato e ha difeso le forze di sicurezza. Due stime sui morti, non un solo numero: l'opposizione parla di circa 2,000 (CNN, 5 novembre 2025), l'UN e le organizzazioni per i diritti parlano di centinaia (OPB, dicembre 2025); il governo non ha pubblicato alcun bilancio.
- hash: 9bea9fc6
  it: |
    Fare di Dar es Salaam il porto di transito della regione e sottrarre a Mombasa il traffico di Uganda e DRC. Il transito ha raggiunto 14.61m tonnellate nel 2025/26 (+17%), con il traffico della DRC a 7.77m tonnellate, più della metà; il porto ha esteso lo stoccaggio gratuito per il carico diretto in Uganda e DRC da 15 a 30 giorni. I dati sono quelli riportati del governo tanzaniano; le pagine non sono state aperte.
- hash: 90808eee
  it: |
    Trasformare il capitale estero in infrastrutture ferroviarie e portuali a condizioni di concessione: la ferrovia TAZARA alla CCECC cinese (circa USD 1.4bn, concessione di 30 anni, firmata a Pechino il 29 settembre 2025) e il porto di Dar es Salaam a DP World (concessione di 30 anni firmata il 22 ottobre 2023, oltre USD 250m inizialmente).
- hash: d72e8978
  it: |
    Le concessioni come valuta dell'accesso: la concessione del porto a DP World (USD 250m iniziali, fino a USD 1bn sull'intera durata secondo Lloyd's List, come ripubblicato da Kuehne+Nagel; secondo un rapporto DP World gestirebbe quattro dei dodici ormeggi del porto) e la concessione ferroviaria alla CCECC, con lo Stato che mantiene una quota tramite la Tanzania Ports Authority. Entrambe sono contratti lunghi che vincolano lo Stato per trent'anni.
- hash: 02f90a92
  it: |
    Un canale da partito a partito con Pechino: la Julius Nyerere Leadership School, finanziata con USD 40m dal Chinese Communist Party International Department e dalla Central Party School, ha aperto nel febbraio 2022. Citata da Wikipedia tramite il South China Morning Post, che non è stato aperto per questa scheda.
- hash: 488be2ac
  it: |
    Le forze di sicurezza come strumento principale in patria, e una forza regionale ritirata all'estero. La polizia ha sparato colpi e lanciato gas lacrimogeni contro i manifestanti che avevano violato il coprifuoco a Dar es Salaam (30 ottobre 2025) e l'esercito è stato schierato. Il contingente tanzaniano nella missione SADC nella DRC è tornato a casa nel 2025, dopo la fine del mandato.
- hash: 8c96dbbd
  it: |
    I fondi occidentali sono sotto pressione. Il Parlamento europeo ha chiesto un taglio totale degli aiuti EU a causa della repressione; un pacchetto da EUR 156m per il 2025 è stato approvato in ottobre e attendeva l'approvazione di Consiglio e Commissione, mentre OPB riferisce che l'EU ha sospeso decine di milioni di dollari nel novembre 2025 (le due fonti non concordano). Il State Department ha dichiarato nel dicembre 2025 di stare 'comprehensively reviewing' i rapporti; non è stato trovato alcun taglio di aiuti da parte degli Stati Uniti. The East African avverte di un forte calo del sostegno esterno nel 2026.
- hash: '65257721'
  it: |
    La legittimità interna limita le grandi concessioni. Chadema ha denunciato l'accordo TAZARA come corrotto alla fine di dicembre 2025, gli analisti hanno sollevato questioni di trasparenza e sovranità, e il governo lo ha difeso come la fine di anni di perdite (circa TZS 28bn l'anno per tenere in esercizio la linea, secondo il portavoce del governo).
- hash: ab2fc7e9
  it: |
    La portata militare regionale è limitata. I leader SADC hanno concluso il mandato SAMIDRC il 13 marzo 2025 e il ritiro graduale è iniziato il 29 aprile, con il contingente tanzaniano rientrato via terra attraverso il Ruanda, che ha dovuto acconsentire al transito. La Tanzania non può mantenere una forza nella parte orientale della DRC senza un mandato regionale e il consenso di un vicino.
- hash: bdcbd123
  it: |
    La stretta che tiene al potere il partito di governo costa gli aiuti occidentali e la legittimità che contribuiscono a finanziare i suoi porti e le sue ferrovie, e le concessioni cinesi e del Golfo che li sostituiscono portano con sé una propria opposizione, a cui il governo risponde come se fosse un colpo di Stato.
- hash: fc0d844b
  it: |
    Dar es Salaam conquista il traffico di transito con lo stoccaggio gratuito e le concessioni, ma le barriere non tariffarie che la Tanzania mantiene contro il Kenya (una tassa sulle scatole di fiammiferi segnalata nel maggio 2026 nonostante la sospensione da parte della East African Court of Justice) alimentano le lamentele che minacciano lo stesso corridoio dell'Africa orientale.
- hash: 22b0aed0
  it: |
    Il governo di Samia Suluhu Hassan ha risposto alle proteste elettorali del 2025 con le forze di sicurezza e con una morsa più stretta sull'opposizione, e ne ha pagato il prezzo con i fondi occidentali di cui hanno bisogno i suoi porti e le sue ferrovie. Sta costruendo uno Stato di transito: Dar es Salaam accoglie il traffico di Uganda e DRC, e le concessioni a DP World e CCECC legano le infrastrutture ai capitali del Golfo e cinesi, che può accettare al posto degli aiuti. La prova sarà se quei capitali possano sostituire gli aiuti occidentali persi dal 2025 senza il prezzo in legittimità e nel commercio dell'Africa orientale che la stessa politica mette sotto pressione, e se un ruolo militare regionale sia di nuovo possibile dopo la fine della missione SADC.
- hash: 08acf101
  it: |
    Mantenere il sistema Museveni e trasmetterlo in famiglia. Museveni ha vinto un settimo mandato (71.65%, elezione del 15 gennaio 2026, conteggio ufficiale come riportato) ed è stato investito nel maggio 2026. Il figlio, gen. Muhoozi Kainerugaba, è Chief of Defence Forces dal marzo 2024 e ha annunciato nell'agosto 2026 la candidatura alla presidenza nel 2031.
- hash: 0031f5b4
  it: |
    Presidiare la frontiera orientale della DRC e il terreno contro le ADF attraverso l'Operation Shujaa, una campagna congiunta UPDF-FARDC contro le ADF avviata nel novembre 2021. Ricerche incentrate sul Congo la leggono anche come protezione dell'area petrolifera del lago Alberto e delle strade per le merci ugandesi.
- hash: 231e24b4
  it: |
    Trasformare il greggio del lago Alberto in entrate da esportazione attraverso l'East African Crude Oil Pipeline (EACOP), lungo 1,443 km da Hoima a Chongoleani vicino a Tanga. L'oleodotto era completato al 79% a fine 2025; l'avvio era previsto per il 31 luglio 2026 e il primo greggio da Tanga per l'ottobre 2026. Nessuna delle due date è confermata nelle fonti reperite.
- hash: 1df0289d
  it: |
    L'UPDF come forza di spedizione regionale: forze speciali a Giuba dal marzo 2025; una campagna congiunta nella parte orientale della DRC; circa 4,500 soldati nell'elenco AUSSOM in Somalia, il contributore più numeroso. L'esercito è il nucleo del regime e Muhoozi lo comanda.
- hash: 6e2ad3ee
  it: |
    Due fonti di esportazione. Oro: esportazioni d'oro dichiarate per il 2025 pari a USD 5.8bn (banca centrale; USD 3.3bn nel 2024), cifra che il panel UN stima in USD 6.4bn e superiore alla produzione stessa dell'Uganda; 31 t di oro sono andate negli UAE nel 2024 (SWISSAID, da dati UN Comtrade), e il rilievo dell'UN collega gran parte del surplus all'oro di contrabbando proveniente dall'Ituri, nella DRC. Petrolio: il corridoio EACOP attraverso la Tanzania, con i campi di Kingfisher e Tilenga come prima produzione, la più grande fonte potenziale di entrate da esportazione; completato al 79% a fine 2025, avvio previsto per il 31 luglio 2026 e primo greggio da Tanga per l'ottobre 2026, date non confermate nelle fonti reperite. Lo slittamento dei tempi è il rischio ricorrente.
- hash: 40db56b5
  it: |
    Controllo dello spazio interno e pacchetti bilaterali all'estero. In patria: un blackout di internet il giorno del voto (gennaio 2026) e l'UPDF (Amendment) Act 2025, che consente ai tribunali militari di giudicare alcuni civili (ricorsi pendenti nel 2026). All'estero: un pacchetto di commercio e cooperazione con il Kenya (visita di Stato a Nairobi, luglio 2025) e colloqui sulla difesa con il Ruanda (gen. Muhoozi e il presidente Kagame a Kigali, luglio 2026).
- hash: '73233614'
  it: |
    La leva dei donatori si riduce. Gli Stati Uniti hanno escluso l'Uganda dall'AGOA a causa dell'Anti-Homosexuality Act del 2023 (avviso di Biden nell'ottobre 2023, efficace dal 1° gennaio 2024); la World Bank ha sospeso i nuovi prestiti; il Regno Unito ha detto di essere inorridito nel 2023 e nel 2024 ha sanzionato la Speaker Anita Among (motivazione dichiarata: corruzione). Nelle fonti del 2023-26 non sono state trovate sanzioni EU nei confronti dell'Uganda.
- hash: 7fb4003c
  it: |
    Rifugiati: circa 2.0 milioni tra rifugiati e richiedenti asilo, la popolazione più numerosa d'Africa (1,999,576 al 31 marzo 2026, UNHCR; 2,003,369 registrati entro il 13 aprile 2026, aggiornamento EU e OCHA), per lo più sud-sudanesi e congolesi. L'appello UNHCR 2026 era finanziato per circa il 14% al 31 marzo 2026; la politica sull'asilo è cambiata nel febbraio 2026 (determinazione individuale dello status per tutte le nazionalità).
- hash: aac2807c
  it: |
    Debito e bilancio: debito pubblico di circa il 52% del PIL e circa il 38% del bilancio 2025/26 destinato al servizio del debito; le istituzioni multilaterali detengono circa il 65% del debito estero, China Exim circa USD 2.2bn (dati del ministero delle Finanze, fine settembre 2025).
- hash: '23096889'
  it: |
    L'Operation Shujaa dovrebbe contenere le ADF, eppure il panel UN riferisce (rapporto trapelato nel luglio 2025) che le unità ugandesi hanno ampliato la loro presenza nella parte orientale della DRC di propria iniziativa, formando una zona cuscinetto che ha protetto l'M23 dai contrattacchi. Il panel del 2024 aveva segnalato un sostegno attivo da parte di alcuni ufficiali; l'Uganda lo nega. La campagna che mette in sicurezza il confine alimenta la guerra sull'altro lato.
- hash: d6a372fd
  it: |
    La grand strategy dell'Uganda è la sopravvivenza del sistema Museveni, ora in consegna a Muhoozi, e la paga diventando una potenza regionale di sicurezza (Giuba, Somalia, DRC orientale) e il corridoio per il petrolio del lago Alberto e per l'oro. Le elezioni del 2026 e la legge sui tribunali militari del 2025 mostrano un regime che vince in patria con il controllo dell'informazione e dei tribunali mentre i suoi donatori si raffreddano (AGOA perso, aiuti scarsi). L'esercito è la sua forza e la sua trappola: ogni dispiegamento che garantisce il regime lega anche l'Uganda alle guerre ai suoi confini e al commercio dell'oro che l'UN ora traccia. I rifugiati (circa due milioni, la popolazione più numerosa d'Africa) sono il peso regionale che non può scrollarsi di dosso, finanziati in misura minima rispetto al fabbisogno. Non verificato per questa scheda: Israele e Russia (trovati solo un accordo nucleare del 2019 e una lettera del 2025), il congelamento degli aiuti statunitensi del 2025 oltre le notizie di stampa, la Turchia, l'Arabia Saudita e il Golfo oltre l'oro, e l'epidemia di Ebola del 2025.
- hash: 5a25ee46
  it: |
    Sopravvivere come Stato sovrano entro i confini internazionalmente riconosciuti: porre fine alla guerra senza cedere il Donbas che ancora controlla, senza accettare la neutralità né un cambio di governo, e senza riconoscere le annessioni. Il prezzo di Mosca per i colloqui è il ritiro delle forze ucraine dal resto del Donetsk; Kiev ha rifiutato ogni versione di questa richiesta, e l'Assemblea generale (107-12-51, 24 febbraio 2026) ha di nuovo inserito l'integrità territoriale nel testo di un appello al cessate il fuoco.
- hash: f2f73da7
  it: |
    Ottenere una garanzia di sicurezza che sopravviva a qualsiasi cessate il fuoco: l'adesione alla NATO come obiettivo di lungo periodo (il testo di Washington del 2024 definisce il percorso 'irreversible' ma non offre alcun invito), e nel frattempo la Paris Declaration della Coalition of the Willing del 6 gennaio 2026 (una forza multinazionale dopo i combattimenti, un meccanismo di monitoraggio del cessate il fuoco guidato dagli Stati Uniti), che entra in vigore solo dopo un cessate il fuoco che la Russia non ha accettato.
- hash: f5f8eb8f
  it: |
    Entrare nell'Unione europea: candidata dal 23 giugno 2022, negoziati formalmente aperti nel 2024; il cluster dei fondamentali (15 giugno 2026) e le relazioni esterne (14 luglio 2026) sono aperti, mentre i cluster 2 e 3 sono stati bloccati dall'Ungheria fino all'inizio di ottobre 2026 e i cluster 4 e 5 devono ancora arrivare. Bruxelles dice di voler aprire tutti i cluster entro fine anno; l'Ungheria e altri respingono una procedura accelerata.
- hash: '25559007'
  it: |
    Far continuare ad arrivare armi e denaro fino al 2027, e sostituire la dipendenza con una produzione propria: il prestito EU da EUR 90bn (EUR 60bn per la difesa, EUR 30bn per il bilancio), l'impegno NATO da EUR 70bn per il 2026 e almeno altrettanto nel 2027, le armi statunitensi acquistate dagli alleati tramite PURL, il programma IMF da USD 8.1bn e la licenza per produrre gli intercettori Patriot che Trump ha promesso ad Ankara l'8 luglio 2026.
- hash: 1a94c290
  it: |
    Far pagare la Russia e riportare a casa le persone: riparazioni e uso dei beni russi congelati (il prestito EU viene rimborsato solo se la Russia paga le riparazioni), restituzione dei bambini deportati (UNGA, 3 dicembre 2025, 91-12-57), scambi di prigionieri e responsabilità per l'aggressione.
- hash: fda74c7e
  it: |
    Ricostruire e ripopolare: la quinta valutazione dei danni della World Bank stima il recupero in circa USD 588bn nel 2026-2035 (quasi tre volte il PIL del 2025), di cui un terzo o più da fondi privati; 5.3 milioni di rifugiati ucraini sono registrati in Europa, e il loro ritorno, insieme alla demografia, deciderà se esiste un'economia da ricostruire.
- hash: 7b6fc5b1
  it: |
    Una coalizione costruita su Europa e Regno Unito: la Coalition of the Willing (Paris Declaration, 6 gennaio 2026, con gli Stati Uniti che per la prima volta sostengono le garanzie), una maggioranza dell'Assemblea generale per l'integrità territoriale (107 voti nel febbraio 2026, contro 93 un anno prima) e una squadra negoziale guidata da Kyrylo Budanov, ora capo del Presidential Office, che lavora sul canale Witkoff-Kushner (Miami, 9-10 ottobre 2026) mentre l'Europa resta al tavolo.
- hash: 502c0e30
  it: |
    Una nuova narrazione per Washington e la NATO: l'Ucraina come contributore alla sicurezza, non solo come destinatario (il vertice di Ankara, 7-8 luglio 2026), con la sua competenza in droni e contro-droni come prodotto da offrire; la Casa Bianca, che nel 2025 aveva respinto un'offerta da USD 50bn di droni in cambio di armi, ora dichiara di voler acquistare droni ucraini.
- hash: e2506524
  it: |
    Difesa di logoramento più attacchi a lungo raggio: la Russia ha conquistato 4,336 km² nel 2025 (0.72% dell'Ucraina) e il fronte rallenta nel 2026, mentre l'Ucraina colpisce l'energia russa e l'oleodotto Druzhba per ridurre le entrate di Mosca e la sua leva in Ungheria e Slovacchia. Il solo Regno Unito ha assegnato almeno 120,000 droni nel 2026.
- hash: eeacd3bf
  it: |
    Trasformare i minerali in un legame con Washington: lo US-Ukraine Reconstruction Investment Fund (capitale iniziale di USD 150m, USD 75m per parte) ha firmato il primo accordo sui minerali critici, per circa USD 30m, nell'ottobre 2026; pressione sanzionatoria attraverso i pacchetti EU; fine del transito del gas russo il 1° gennaio 2025.
- hash: 6ff98a7c
  it: |
    Territorio e manodopera: la Russia controlla circa il 19% del paese (DeepState: 116,165 km² all'inizio del 2026; Crimea 100%, Luhansk 99.6%, Donetsk 78%, Zaporizhzhia 75%, Kherson 72%) e ha guadagnato 4,336 km² nel 2025, quasi il doppio del 2023 e del 2024 insieme. L'Ucraina non può riconquistare con la forza il territorio occupato e non può rinunciare al Donbas non occupato senza esporre Sloviansk e Kramatorsk.
- hash: f8e378f8
  it: |
    Lo Stato è finanziato da altri: il prestito EU da EUR 90bn copre solo due terzi delle esigenze di bilancio e di difesa per il 2026-27, un terzo va trovato altrove, e l'erogazione è legata a riforme e ai diritti delle minoranze; i finanziamenti diretti statunitensi si sono fermati all'inizio del 2025, ma circa il 95% degli intercettori Patriot continua ad arrivare tramite PURL e il 30% della spesa europea per armamenti va a imprese statunitensi.
- hash: 8fb2c98d
  it: |
    Un mediatore che è anche fornitore: l'attenzione di Washington è elastica (la guerra in Iran ha congelato i colloqui da marzo 2026 e ha svuotato le scorte di Patriot), ha chiesto all'Assemblea generale il 24 febbraio 2026 di eliminare i paragrafi sull'integrità territoriale e poi ha scelto l'astensione, e, secondo lo stesso Budanov, non ha fissato alcuna scadenza per la pace.
- hash: 46b2070b
  it: |
    Giocatori con potere di veto sulla strada per Bruxelles: l'Ungheria ha bloccato i cluster 2 e 3 da luglio all'inizio di ottobre 2026 e ne ha subordinato l'apertura a una legge sull'istruzione delle minoranze; Fico, della Slovacchia, ha tagliato l'elettricità d'emergenza e ha minacciato il ventesimo pacchetto di sanzioni a causa dell'interruzione del petrolio Druzhba; il presidente polacco ha revocato a Zelensky l'Order of the White Eagle per la disputa sulla denominazione UPA.
- hash: 7abec993
  it: |
    Energia sotto attacco: gli impianti di Naftogaz sono stati colpiti 293 volte nel 2026 entro agosto, contro 229 in tutto il 2025; l'Ucraina acquista gas all'estero per riempire gli stoccaggi, e ogni inverno dal 2022 ha comportato blackout a rotazione; i proventi del transito e la leva sul gas russo sono scomparsi dal 1° gennaio 2025.
- hash: 49064ec2
  it: |
    Popolazione: 5.3 milioni di ucraini sono rifugiati registrati in Europa (UNHCR, fine 2025; la protezione temporanea EU scade nel marzo 2027), e gli scenari dello stesso UNHCR prevedono da 2.9 a 5.2 milioni all'estero nel 2029; l'UN stima circa 300,000 persone in meno ogni anno, con un tasso di fecondità vicino a 1.3. Non ci sono abbastanza persone per combattere, ricostruire e rimpinguare il bilancio nello stesso tempo.
- hash: f710fd10
  it: |
    Gli attacchi che riducono la leva petrolifera russa in Europa alimentano i veti che bloccano la strada dell'Ucraina verso l'Europa. Colpire l'oleodotto Druzhba per porre fine al petrolio russo in Ungheria e Slovacchia doveva liberare l'EU dall'influenza di Mosca; Fico ha risposto sospendendo l'elettricità d'emergenza all'Ucraina e minacciando il pacchetto di sanzioni, il prestito da EUR 90bn e l'adesione. L'arma puntata contro la presa russa ricade sulle due capitali il cui consenso Kiev ha bisogno.
- hash: 16db68e6
  it: |
    Intitolare un reparto all'UPA conquista il fronte interno e perde il vicino che sostiene la guerra. La Polonia è il polo logistico e l'amica più rumorosa in Europa; i massacri della Volinia del 1943-45 sono la sua ferita aperta. La disputa sulla denominazione del maggio 2026 è costata a Zelensky la più alta onorificenza polacca, lo ha tenuto lontano dalla conferenza sulla ricostruzione di Danzica e ha lasciato Varsavia fuori da alcuni formati E3, mentre il 51.9% dei polacchi ha dichiarato che ciò ha peggiorato la propria opinione sull'Ucraina.
- hash: a61dfafc
  it: |
    Rifiutare di cedere il Donbas protegge il principio e prolunga ciò che erode lo Stato. Ogni anno di guerra costa circa 4,000 km², altri rifugiati all'estero e la pazienza di un mediatore il cui stesso testo, come mostra il voto dell'Assemblea generale, gli Stati Uniti preferirebbero non legare all'integrità territoriale. Il Cremlino ha sospeso i colloqui trilaterali finché il ritiro non sarà concordato, quindi la linea rossa più importante di Kiev è anche il veto sull'unico negoziato esistente.
