# Translate every `en` into it. Write the translations to the file cards-19.out.yaml next to this one,
# as `items:` of `- hash: <same hash>` / `it: <translation>`, appending one item at a time (valid YAML at
# every step), never editing this file. Keep names, dates, numbers and quotes; register of a foreign-office
# brief: dry, precise, no flourish.
lang: it
items:
- hash: ff5bd1f6
  kind: cards
  en: 'The money outruns the men. The 2027 budget lifts the regular defence budget by a third to EUR 109.7bn, but the Lithuania brigade, the proof of commitment to the eastern flank, is short of about 2,000
    posts and the Bundeswehr resorts to compelling soldiers: the more Berlin spends, the more visible the gap between declared and usable strength, and the harder the conscription question gets.'
  it: ''
- hash: fe65159d
  kind: cards
  en: 'Making NATO ''more European'' while buying American. Berlin''s autonomy moves (French nuclear steering group, E5, a European pillar) are what Washington can cite to justify leaving, and Germany answers
    the withdrawal and the cancelled US long-range fires deployment by asking to buy Typhon and Tomahawk and by adding F-35s: more dependence on the same supplier.'
  it: ''
- hash: d9a53483
  kind: cards
  en: Quitting Russian gas bound Germany to other hostages. The exit left the economy exposed to a Hormuz shock and to American LNG at the moment Washington imposes 15% tariffs on German cars and threatens
    more; the leverage Berlin lost in Moscow it has not recovered in Washington.
  it: ''
- hash: 8bda99ec
  kind: cards
  en: 'Tough on migration, stronger AfD. Border controls and turn-backs coincided with halved asylum applications, but courts have begun striking the controls down, Poland answered with its own checks,
    and the AfD still won 43.8% in an eastern state: conceding the opponent''s agenda did not take away his vote.'
  it: ''
- hash: bc16835a
  kind: cards
  en: Unconditional on Israel, conditional in practice. Staatsraeson was supposed to be the fixed point of German foreign policy, yet Merz suspended arms exports in August 2025, reversed in November, and
    in 2026 treats annexation steps as 'a big mistake'; and the ICC warrant makes the promise of a state visit for Netanyahu a legal liability for the government that most insists on the rules-based order.
  it: ''
- hash: 1933bdd3
  kind: cards
  en: Leading Europe's defence requires France, and the flagship project with France failed. FCAS, the EUR 100bn fighter, collapsed in 2026 over work share and export freedom, so Germany turns to national
    and US solutions at the moment it asks its partners for a common European pillar.
  it: ''
- hash: d8e5d096
  kind: cards
  en: 'Germany is a trading state that has to become a military power without having the people, the habits or the political consensus for it. Its grand strategy since 2022 is to buy security from three
    directions at once: from itself (the debt-brake carve-out and a Bundeswehr meant to be the strongest conventional force in Europe), from Washington (nuclear sharing, Patriot, F-35, and the hope that
    the troop drawdown stops at 5,000) and from a Europe it tries to organise around Paris and Warsaw. Each channel undermines another: autonomy hastens American retreat, American purchases weaken the Franco-German
    industrial project, spending outruns recruitment, and the domestic price, an AfD that wins eastern states while the centre governs with a thin majority, limits how much of this the electorate will fund.
    Its handling of Russia is the clearest part: Moscow is the declared ''greatest threat'', hybrid attacks are treated as such, aid to Ukraine is the largest in Europe but stops short of Taurus and of
    troops. Toward China, Israel and Turkey the same Germany behaves less like a leader than like an exporter with a guilty conscience: de-risking is proclaimed and the trade deficit grows, Staatsraeson
    is proclaimed and then conditioned, a difficult NATO partner becomes the bet in the eastern Mediterranean. The pattern a Luttwak reader would flag is that Berlin''s choices are rational one by one and
    self-defeating together; the test of 2027 is whether the Lithuania brigade, the F-35s and the budget become forces in being before the American drawdown and the AfD set the terms.'
  it: ''
- hash: 4b136c90
  kind: cards
  en: 'Keep the Horn''s trade on one corridor: Djibouti''s port carries most of Ethiopia''s foreign trade (estimates of 90-95%), and Djibouti wants that monopoly kept against Ethiopia''s Assab push and
    against the Berbera port. In 2026 it offered Ethiopia a 60% stake in the Tadjoura port; Addis wants a corridor on top of any equity.'
  it: ''
- hash: a136dbbf
  kind: cards
  en: Deny Somaliland's recognition and keep Berbera from displacing Djibouti as the incumbent port. Djibouti condemned Israel's recognition of Somaliland, closed Somaliland's liaison office, backs Somalia's
    territorial integrity, and warns that an Israeli base at Berbera would threaten the region.
  it: ''
- hash: c01d7b5a
  kind: cards
  en: Keep the regime in place. The presidential age cap was removed in October 2025, and Ismail Omar Guelleh, in power since 1999, won a sixth term in April 2026 against one challenger, most of the opposition
    having boycotted or backed him.
  it: ''
- hash: 444adb07
  kind: cards
  en: 'Diplomatic: the IGAD seat and chair in Djibouti City, used as the room for Horn mediation (Guelleh chairs the heads-of-state meetings); the tripartite with the presidents of Ethiopia and Somalia
    in March 2026 shows the forum at work.'
  it: ''
- hash: b2f9f100
  kind: cards
  en: 'Port and corridor: Ethiopia''s trade is the revenue base of Doraleh and Tadjoura; the February 2026 accord with Ethiopia to deepen cooperation at Doraleh ties that dependence closer, while the 2018
    seizure of DP World''s terminal kept the terminal in state hands (the awards against the government are unpaid).'
  it: ''
- hash: d03e8f89
  kind: cards
  en: 'Bases as the economy: rent from foreign forces. US Camp Lemonnier (about USD 63m a year at the 2014 renewal), France (fixed payment rising from EUR 30m to EUR 85m a year under the 2024 treaty), Spain''s
    ORION detachment at the French base and Italy''s Guillet base (about 100 personnel, Italian Foreign Ministry, Dec 2025), Japan''s SDF base since 2011, the EU''s Atalanta logistics base, and Saudi base
    talks reported in 2016 and not confirmed since. Turkey and India have lesser military ties (training accords, naval visits, no base found).'
  it: ''
- hash: 122fcc83
  kind: cards
  en: 'Water: about 150 mm of rain a year and no permanent rivers; under 5% of the rainfall reaches the water table. Supply depends on desalination and the Ethiopian pipeline, and a World Bank grant of
    USD 35m (March 2026) targets rural access only.'
  it: ''
- hash: 176c903e
  kind: cards
  en: 'Debt: external debt was 68.1% of GDP in 2022 against 33.9% in 2013, judged unsustainable in 2021 and in distress in 2022; China holds the largest share of external arrears (78% in the joint analysis).
    Figures read from search summaries of the 2024 joint debt analysis, not from the full text.'
  it: ''
- hash: 7afeed05
  kind: cards
  en: 'Drought: ten major droughts between 1980 and 2019 by World Bank count, the 2008-2011 drought alone cutting GDP by about 4%; rural residents are far less likely than city dwellers to have basic drinking
    water.'
  it: ''
- hash: 6f474bd7
  kind: cards
  en: 'The bases are the economy and also the target: the Houthi advance towards the Bab al-Mandab brings Camp Lemonnier within reach (Stars and Stripes, September 2026), and the Yemen war has pushed refugees
    into Obock. Renting the coast to every power makes Djibouti a stake in every war around it.'
  it: ''
- hash: 67885eb3
  kind: cards
  en: 'The 2018 seizure of Doraleh kept the terminal in state hands, but the awards of about USD 685m against the government remain unpaid and DP World''s 50-year concession is still binding: Djibouti holds
    the terminal while owing the claim.'
  it: ''
- hash: 01c46f03
  kind: cards
  en: 'Djibouti sells position. Its state is one port, one railway and a set of rented bases, and its strategy is to be the place every outside power and every landlocked neighbour must pass through, so
    that no single patron gets it. The threats are the ones that would shrink that position: Ethiopia''s search for a sea outlet at Assab, the Berbera project backed by the UAE and Israel, and the Houthi
    war at the Bab al-Mandab. Water and heat limit any growth beyond rent, and the IGAD seat it hosts is the forum in which it keeps its weight.'
  it: ''
- hash: 154f6d27
  kind: cards
  en: 'Keep the Beijing tie that replaced Taipei in 2004 and the aid that came with it. A joint communique was signed in Beijing on 23 March 2004; China then offered US$12 million: US$6 million of budget
    support for 2004 and US$1 million a year for six years. Reading from the Wikipedia index only: the aid terms are not checked against a Chinese or Dominican primary text.'
  it: ''
- hash: a5536103
  kind: cards
  en: Keep the United Kingdom and the Commonwealth as the legal and trade anchor. Diplomatic relations date from 3 November 1978, and the agreements in force include the CARIFORUM-UK Economic Partnership
    Agreement, a Tax Information Exchange Agreement and an Investment Agreement; the UK high commission in Bridgetown covers Dominica.
  it: ''
- hash: 1b4b14f8
  kind: cards
  en: Diplomatic recognition traded for development money. Dominica's ties with Beijing (2004) and Washington (diplomatic relations from 18 July 1979) are the channels through which aid and assistance arrive;
    the Wikipedia index gives no figure for the 2025-26 flows, so the economic side of the means (citizenship by investment, the geothermal project) has no source yet.
  it: ''
- hash: fad9aa6c
  kind: cards
  en: US assistance runs through other channels. Washington's aid to Dominica is mainly routed through the World Bank, the Caribbean Development Bank and the USAID office in Bridgetown, Barbados, so Dominica
    has no bilateral US aid line of its own to bargain with.
  it: ''
- hash: 218aa4a4
  kind: cards
  en: Dominica signed a Bilateral Immunity Agreement with the United States (Article 98 of the Rome Statute), shielding US personnel from the International Criminal Court, while its China tie was built
    on the 2004 switch. Each patron's terms pull against the other's, and the state carries both.
  it: ''
- hash: '66400070'
  kind: cards
  en: 'Dominica is a small state whose foreign policy is a set of separate deals rather than an alignment: Beijing bought recognition in 2004 with aid, Washington and London hold the older ties through
    assistance channels and treaties, and the Caribbean bodies (CARICOM and the OECS) are where it speaks as one of many. Its strategic weight is low, so its moves are chosen for what they bring in, and
    the card can say little about the economy (citizenship by investment, the geothermal project) or the hurricane constraint until those are sourced. The gaps are the point of this first pass: the 2025
    US posture and the China debt are not yet read in a source that could support them.'
  it: ''
- hash: 2615c5f7
  kind: cards
  en: 'Keep the Realm whole: sovereignty and territorial integrity over Greenland and the Faroe Islands, conceding American basing and security rights but not title. Copenhagen''s line since January 2025
    is that the island''s future is decided only by Greenlanders and Danes; the 22 September 2026 trilateral defence agreement (updating the 1951 pact, with two more US Defence Areas) is presented in Copenhagen
    as recognising sovereignty and territorial integrity, while Trump calls it ''permanent control''.'
  it: ''
- hash: 3d11f362
  kind: cards
  en: 'Keep the United States inside NATO and engaged in Europe''s defence while building a European floor under it: Denmark gives Washington what it can (Pituffik, the 2023 Defence Cooperation Agreement
    approved 94-11 in June 2025, 43 F-35s) and hedges (French-Italian SAMP/T instead of Patriot, nuclear-deterrence cooperation with France on 2 March 2026, no nuclear weapons on Danish soil).'
  it: ''
- hash: f6a965b3
  kind: cards
  en: 'Deter and contain Russia, which Danish intelligence now names the main threat: rearm fast (about 3% of GDP in 2025-26 under the Acceleration Fund), police the straits and the seabed (Baltic Sentry,
    inspections of shadow-fleet tankers) and harden against hybrid attack. In September 2026 the intelligence service judged a limited Russian attack on a NATO neighbour ''low but rising'' and hybrid operations
    set to increase.'
  it: ''
- hash: b730ea8a
  kind: cards
  en: 'Help Ukraine win by funding its own industry (the ''Danish model'', 2024) rather than only shipping Danish stock: more than DKK 70bn committed to 2028, about DKK 14bn in 2026, and a ten-year security
    agreement signed on 22 February 2024.'
  it: ''
- hash: 434ec7b2
  kind: cards
  en: 'Reshape the EU in Denmark''s image on two files, defence and migration: the 2022 referendum scrapped the defence opt-out (66.9% yes), the 2025 presidency (July-December) brought a ''safe third country''
    deal and return hubs, and Frederiksen co-led the May 2025 letter of nine governments asking the Council of Europe to rethink the European Convention on Human Rights on expulsions.'
  it: ''
- hash: 7a4fdf3e
  kind: cards
  en: 'Protect the export economy and keep rivals out of the Arctic''s resources: an open trading position (the USA took about 17% of Danish exports of goods and services in 2024, Germany about 12%), a
    restart of offshore wind after the failed 2024 tender, and quiet pressure on Greenland rare-earth developers not to sell to Chinese buyers.'
  it: ''
- hash: af217e0e
  kind: cards
  en: 'The Rasmussen channel and the Kingdom format: Foreign Minister Lars Lokke Rasmussen (kept on in the third Frederiksen government, June 2026) negotiates with Greenland''s foreign minister at the table,
    in the working group agreed with Vance and Rubio in January 2026, and sells the result as respect for ''the red lines of the Kingdom''. Europe is the shield: the 6 January 2026 joint statement of seven
    leaders and the NATO route through Rutte (the 21 January ''framework'').'
  it: ''
- hash: b7ff7e1a
  kind: cards
  en: 'Public naming and summoning: the Prime Minister called the September 2025 drone sightings ''hybrid attacks''; Copenhagen summoned the Russian ambassador after the 14 September 2026 flares incident
    and the US ambassador twice (August 2025 over covert influence operations in Greenland, December 2025 over envoy Jeff Landry). The intelligence services publish open threat assessments (Russia, China).'
  it: ''
- hash: 87f25e1e
  kind: cards
  en: 'Arctic and Baltic build-up: DKK 14.6bn (January 2025) and DKK 27.4bn (October 2025) Arctic packages, 16 more F-35s (43 in all), eight SAMP/T-class air-defence systems (about DKK 58bn), troops and
    ships sent to Greenland in January 2026 with allies, and the Baltic Sentry patrols from the Karup operations centre.'
  it: ''
- hash: d53682a9
  kind: cards
  en: 'Money as a lever: the Ukraine Fund and the Danish model (buying from Ukrainian factories), the annual block grant that carries Greenland''s budget (about USD 623m a year by one estimate), contracts-for-difference
    to restart offshore wind (DKK 55.2bn cap, first awards to Vattenfall in August 2026), and a port-state inspection regime aimed at old shadow-fleet tankers anchoring off Skagen.'
  it: ''
- hash: 4f638262
  kind: cards
  en: The protector is the threat. Denmark's security rests on NATO's Article 5 and on American F-35s, intelligence and the Pituffik base; the same US president demanded the island, threatened a 10% tariff
    (rising to 25%) on Denmark and seven other allies on 17 January 2026 and restated at the July 2026 Ankara summit that the US should control Greenland. Copenhagen can resist but not break with Washington.
  it: ''
- hash: 1fc00e7d
  kind: cards
  en: Greenland is not Denmark's to trade. Under the 2009 Self-Government Act (section 21) the decision on independence belongs to the people of Greenland, with a referendum and the Folketing's consent;
    Prime Minister Nielsen says Greenland does not want to be owned or governed by the US; polls found 85% of Greenlanders against joining the US (January 2025). The main opposition party, Naleraq (24.5%
    in March 2025), wants a faster independence and closer US ties.
  it: ''
- hash: 938019aa
  kind: cards
  en: 'Geography the law will not let it close: about a third of Russia''s seaborne oil sails through the Danish straits, the straits are the only sea gate of the Baltic, and the inspection tools used in
    the Mediterranean cannot simply be copied there; in 2025 alone Denmark logged 292 transits of sanctioned tankers.'
  it: ''
- hash: fc16ccd0
  kind: cards
  en: 'Minority government: the four-party ''four-leaf clover'' coalition (Social Democrats, Green Left, Social Liberals, Moderates) holds 82 of 179 seats after a record 69 days of talks and relies on the
    Red-Green Alliance; the Social Democrats had their weakest result since 1903 (21.9% on 24 March 2026) and the Danish People''s Party tripled to 9%. Defence consensus is wide; the left-leaning programme
    and the strict migration line pull in different directions.'
  it: ''
- hash: 508f16a8
  kind: cards
  en: 'Capacity: the central bank warns that the defence build-up (about 3% of GDP in 2025-26) strains a tight labour market and a small defence industry; ships, air defence and F-35 deliveries take years,
    and Denmark has already given Ukraine its F-16s and artillery.'
  it: ''
- hash: 9e8b0085
  kind: cards
  en: 'The green export model is slipping: the 2024 offshore-wind tender (at least 6 GW) drew no bids, the government cancelled the remaining rounds in early 2025 and cut the 2030 offshore goal from 9 GW
    to 2-3 GW, and the Bornholm energy island is delayed; the Fehmarn Belt link to Germany now opens no earlier than 2031.'
  it: ''
- hash: 7540de78
  kind: cards
  en: The concessions that end the crisis are the ones that feed it. Every proof of loyalty (the 2023 basing agreement, the F-35s, two more US Defence Areas at Narsarsuaq and Mestersvig in the 2026 deal)
    widens the American footprint that Trump then describes as 'permanent control'; Denmark trades military access for sovereignty on paper and may end with sovereignty that is a title without the keys.
  it: ''
- hash: fed9407c
  kind: cards
  en: Hedging against America is what Washington reads as disloyalty. Buying SAMP/T instead of Patriot and pooling nuclear deterrence with France make Denmark less dependent on the US, but they come while
    Denmark still buys 16 more American F-35s and needs the US for the Arctic; Danish media argued the Patriot decision was about price and delivery time, Politico framed it as a reply to Greenland.
  it: ''
- hash: 229c56e1
  kind: cards
  en: Greenland's voice, which Denmark insists on, is also Greenland's exit. Copenhagen's strongest card against Washington is that 'only Greenlanders and Danes decide'; but the more it puts Nuuk at the
    negotiating table (the working group of January 2026, a Greenlander-led Arctic Council chairship for the Kingdom, Nielsen calling the 2026 deal a 'win-win-win'), the more Greenland acts as a state,
    and Naleraq already asks for a dialogue with Washington without Denmark.
  it: ''
- hash: 0b7c933c
  kind: cards
  en: Denmark invokes international law against Trump while pressing to loosen it at home. The government programme promises to 'firmly uphold' sovereignty, territorial integrity and international conventions,
    yet Frederiksen co-led the May 2025 letter asking the Council of Europe to revisit how the European Convention on Human Rights is read on expulsions; the rules-based order is the shield on Greenland
    and the obstacle on migration.
  it: ''
- hash: '45477374'
  kind: cards
  en: Giving everything to Ukraine thins the Arctic and the Baltic. Denmark donated its whole F-16 fleet and its artillery and funds Ukrainian factories, just as its own intelligence says Russia may test
    NATO's neighbours and Greenland needs ships, radars and aircraft; the Danish model is the answer (the money buys output in Ukraine, not Danish stocks), but the budget is one budget.
  it: ''
- hash: f7e7b26c
  kind: cards
  en: 'Denmark is a small state whose grand strategy has been reduced, since January 2025, to one question: how to stay in the American security system while an American president claims part of its territory.
    The Danish answer has three layers. Keep the formal position unmovable (sovereignty over Greenland and the Faroes, self-determination for Greenlanders), pay the price in usable goods (bases, F-35s,
    an Arctic build-up of tens of billions of kroner), and move the quarrel into NATO and Europe, where Rutte and the European leaders can absorb it. The 22 September 2026 trilateral agreement shows the
    method working and its cost: the crisis is calmer, the Kingdom''s flag still flies, and both sides publish opposite readings of the same text. Behind the Greenland file stands the second pillar, which
    is Russia: a country that sits on the Baltic''s only exit, takes the hybrid blows (drones over airports, flares at a helicopter, cables) and is both one of Ukraine''s leading European donors (the Kiel
    tracker names it, with the Netherlands, right behind Germany for May-June 2026) and a builder of a European floor under NATO. The weakness is domestic and structural: a minority coalition, a Greenland
    that is no longer a colony to be spoken for, and an export economy that lives on American and German markets. The grades on this card follow the structure: the United States is a reluctant ally (a treaty
    ally with an open grievance, not a rival), Russia a rival (not an adversary, because Denmark seeks Moscow''s restraint rather than its fall), China a reluctant partner.'
  it: ''
- hash: 8b60d342
  kind: cards
  en: 'Hold the Haitian border with walls, troops and tougher rules. In April 2025 Abinader announced fifteen measures: accelerating the border wall, 1,500 soldiers for border surveillance, and tougher
    penalties for people who help migrants enter or stay.'
  it: ''
- hash: e6f5e884
  kind: cards
  en: Keep Washington engaged on security, migration and trade. Abinader thanked the United States for help against drug smuggling, organised crime and irregular migration; the 6 February 2025 Rubio visit
    covered those, trade, and economic opportunities in rare earths and semiconductors.
  it: ''
- hash: 39fd2a04
  kind: cards
  en: Keep the multinational mission in Haiti running with others. The Dominican foreign minister said Chadian troops would gradually replace the Kenyan force through October; the Rubio talks put the mission's
    continuation on the agenda.
  it: ''
- hash: ea4c89e7
  kind: cards
  en: 'Border force and wall: a 1,500-soldier surveillance reinforcement and a wall under construction, announced in April 2025.'
  it: ''
- hash: '47788951'
  kind: cards
  en: 'Washington''s security channel: the February 2025 Rubio visit made drug, crime and migration cooperation the working agenda.'
  it: ''
- hash: 618c757b
  kind: cards
  en: The crisis next door sets the agenda. At the February 2025 meeting the foreign minister briefed Rubio on Haiti's crisis and its impact on the Dominican Republic before the presidential talks.
  it: ''
- hash: a44f3dc8
  kind: cards
  en: Foreign contingents carry the Haitian mission. Kenyan police are rotating out and Chadian troops are replacing them gradually, a rotation announced by the Dominican foreign minister.
  it: ''
- hash: 2c76972c
  kind: cards
  en: Walling Haiti off buys Santo Domingo a closer security tie to Washington, but the same agenda that brings it to Rubio also puts the Haitian mission, which it does not run, at the centre of the talks.
  it: ''
- hash: 12bb205b
  kind: cards
  en: 'Santo Domingo treats Haiti as a border to be fenced and policed rather than a neighbour to be governed, and it pays part of its security bill with Washington, which thanks it publicly and sets the
    agenda. The wall, the troops and the tougher penalties are the visible answer to the crisis next door, while the mission that might end that crisis runs on other countries'' contingents. Confidence
    C throughout: the sources read cover the 2025 measures, the February 2025 visit and the 2026 mission rotation, not yet the economy, Spain, the EU, China or the Caribbean bloc.'
  it: ''
- hash: 3e59fa91
  kind: cards
  en: 'Keep the regime whole: a civilian presidency with the army behind it. Tebboune was re-elected on 7 Sep 2024 with 84.3% on an official 46.1% turnout that all three campaigns, his own included, called
    irregular; the July 2026 parliament was elected on about 21% turnout after roughly a third of prospective candidates were barred. Legitimacy is thin, so the order rests on the security apparatus (defence
    takes 21% of public spending) and on hydrocarbon rents; a constitutional revision to lengthen the presidential term beyond 2029 was reported in preparation.'
  it: ''
- hash: 416d34c7
  kind: cards
  en: Defeat Morocco's claim to Western Sahara at the UN and keep the Sahrawi referendum alive. Algiers hosts the Polisario and argues that S/RES/2797 (31 Oct 2025) never endorsed implementing the autonomy
    plan and that MINURSO remains mandated to organise a referendum; it did not take part in the 11-0-3 vote.
  it: ''
- hash: 504d0648
  kind: cards
  en: 'Stay the Maghreb''s military pivot and keep the balance with Morocco: Africa''s largest military budget (USD 21.8bn in 2024, +12%, against Morocco''s USD 5.5bn; about USD 25bn budgeted for 2026),
    in a rivalry that SIPRI calls a major driver of both states'' arms imports.'
  it: ''
- hash: 3875b2f5
  kind: cards
  en: 'Use gas to buy European partners on Algeria''s terms: reward Italy (Transmed), keep Spain on Medgaz, and resist the EU''s legal pressure over the Association Agreement. Algeria is the EU''s third-largest
    natural gas supplier; the EU is 49.6% of Algeria''s trade, and 93.2% of what it imports from Algeria is mineral products (oil and gas).'
  it: ''
- hash: b10423d3
  kind: cards
  en: Extract recognition of colonial crimes from France without losing the migration, security and consular channels. A law of 24 Dec 2025 criminalises colonisation and demands apology and reparations;
    in 2026 ministers, an ambassador and judicial dialogue are being restored while the jailed French journalist Christophe Gleizes is still held.
  it: ''
- hash: c13b9918
  kind: cards
  en: 'Keep the Sahel and Libya from reaching Algerian soil without owning the juntas'' quarrels: the Malian drone shot down at Tin Zaouatine (31 Mar 2025), the Sahel alliance''s ambassadors withdrawn in
    April 2025, ties restored on 11 Jul 2026; Attaf reaffirmed Mali''s territorial integrity in April 2026 and officials cite border insecurity for the defence budget.'
  it: ''
- hash: 1047e74f
  kind: cards
  en: 'Rupture as signal: the ambassador recalled from Paris (30 Jul 2024) when Macron endorsed the autonomy plan, relations cut with Morocco (24 Aug 2021) and with the UAE (10 Sep 2026); abstention from
    the vote on S/RES/2797 rather than a vote it could not win; refusal of US mediation toward Rabat (''bilateral dialogue with Morocco is not on the agenda'', Attaf, Nov 2025) while reportedly asking for
    time; patronage of the Polisario and of Tunisia (USD 150m deposit 2020, USD 300m loan 2021).'
  it: ''
- hash: 2ae36b1f
  kind: cards
  en: 'Memory and sovereignty as public argument: the 24 Dec 2025 law criminalising French colonisation; the terrorist label on the Kabylie movement MAK and the public attribution of ''hostile acts'' to
    Morocco, Israel and the UAE; the prosecutions of Boualem Sansal (5 years, March 2025, pardoned 12 Nov 2025) and of Christophe Gleizes (7 years for ''glorifying terrorism'') treated as domestic law.'
  it: ''
- hash: f7c43097
  kind: cards
  en: The largest military budget in Africa, supplied by Russia (39% of 2021-25 imports), China (27%) and Germany (18%) with a secrecy SIPRI says may hide deals; a military cooperation memorandum with AFRICOM
    (22 Jan 2025); the 'Fakhr 2026' live-fire drill near the Moroccan border; the shoot-down of a Malian drone near Tin Zaouatine.
  it: ''
- hash: 419c90cd
  kind: cards
  en: 'Gas as reward and sanction: the Maghreb-Europe pipeline contract through Morocco left to lapse (31 Oct 2021); flows to Spain trimmed by about 25% in May 2022 but never stopped on Medgaz; Italy rewarded
    with the July 2025 summit; trade and air measures as penalties (end of free premises for the French embassy and of the 2013 diplomatic-passport visa waiver, Aug 2025; air-services deal with the UAE
    terminated, airspace closed to Emirati aircraft in Sep 2026).'
  it: ''
- hash: b11ecbf2
  kind: cards
  en: 'Diversified patrons and partners instead of a bloc: China (the 2014 comprehensive strategic partnership, a 6,000 km rail programme announced in Aug 2023, 27% of arms imports), Turkey (more than USD
    6bn of Turkish investment), Egypt (Sonatrach-EGPC crude and products memorandum, 5 May 2026), OPEC+ with Russia and the Gulf producers.'
  it: ''
- hash: 8a41af34
  kind: cards
  en: 'A one-product export economy sold to the very continent it sometimes tries to coerce: the EU takes 49.6% of Algeria''s trade and 93.2% of EU imports from Algeria are oil and gas. Every cut has been
    bounded by it: gas to Spain kept flowing through Medgaz during the 2022 freeze.'
  it: ''
- hash: 44af29fa
  kind: cards
  en: 'Hostile or unstable borders on every side: the Moroccan frontier has been closed since 1994, Mali was in rupture for fifteen months (April 2025 to July 2026) and Niger and Burkina Faso withdrew their
    ambassadors in solidarity, while Libya is split between rival governments.'
  it: ''
- hash: fb1ffb34
  kind: cards
  en: 'A shrinking arms pipeline: arms imports fell 78% between 2016-20 and 2021-25 and the first supplier, Russia, accounts for 39% (48% in the previous period) as Russian exports to Algeria fall sharply;
    Morocco''s imports, from the USA (60%) and Israel (24%), now exceed Algeria''s by SIPRI''s estimate, though Algiers is secretive about its deals.'
  it: ''
- hash: 00274a0e
  kind: cards
  en: 'Thin legitimacy at the ballot box: 46.1% disputed turnout in 2024 after the preliminary 94.7% was revised down, about 21% in July 2026; the Hirak of 2019 forced Bouteflika out within two months and
    was then stifled by Covid restrictions and a crackdown, which Amnesty says continues.'
  it: ''
- hash: 985f3070
  kind: cards
  en: 'Isolation on the Sahara file: S/RES/2797 passed 11-0-3 with Russia, China and Pakistan abstaining and no veto from Algeria''s two arms suppliers on the Council; the penholder, Washington, is also
    the mediator and presses Algiers to open its market to US firms.'
  it: ''
- hash: 0e9e032e
  kind: cards
  en: 'Legal and fiscal pressure from Brussels and Washington: the EU''s arbitration request over Algeria''s trade and investment restrictions (announced 16 Jul 2025), Algeria''s listing as a high-risk
    money-laundering jurisdiction (June 2025) and a 12.5% US tariff (24 Jul 2026).'
  it: ''
- hash: 1c87c70f
  kind: cards
  en: Cutting the pipeline to punish Morocco cut Algeria's own reach. Letting the Maghreb-Europe contract lapse (31 Oct 2021) moved Spain's gas onto Medgaz; when Madrid turned toward Rabat's autonomy plan
    in 2022, Algiers could only trim flows (about 25% in May 2022), freeze the 2002 treaty and watch the supply continue. It reactivated the treaty in March 2026 with Spain's Sahara position unchanged.
  it: ''
- hash: 2a5ce62c
  kind: cards
  en: The harder Algiers fights the Sahara file at the UN, the more it is left alone there. The text it refused to vote on passed 11-0-3 and names Algeria among the parties asked to negotiate, its two arms
    suppliers on the Council abstained instead of vetoing, and the penholder is now also the mediator asking Algiers for market access. Staying outside the vote kept the doctrine clean and gave up the room
    where the text was written.
  it: ''
- hash: 71841f65
  kind: cards
  en: The Morocco rivalry buys Algeria the weakest arms pipeline. SIPRI calls the tension a major driver of both states' imports, yet Algeria's fell 78% while Morocco's rose 12%, the biggest African budget
    buying less from a first supplier whose exports to Algeria collapsed, as Rabat adds US and Israeli kit; Algiers has tied Israel to its charges against Rabat since 2021, and Morocco's military links
    with Israel keep growing.
  it: ''
- hash: 030fa9c8
  kind: cards
  en: The rupture meant to win dignity from France has cost the channels that deliver it. Twelve-for-twelve expulsions (April 2025) and the colonisation law (December 2025) did not move Paris on the Sahara,
    Sansal was freed through Germany's president and not France, and in May 2026 Algiers welcomed back France's ambassador and a stream of French ministers while Paris's alignment with Resolution 2797 stood
    (as Moroccan sources report) and Gleizes remained in prison.
  it: ''
- hash: c439f55f
  kind: cards
  en: Defending its border sovereignty cost Algiers the role of Sahel mediator. Shooting down the Malian drone (31 Mar 2025) united Mali, Burkina Faso and Niger against it (ambassadors out on 6 Apr 2025;
    Mali's prime minister said Algiers 'sponsors international terrorism'), led Algiers to step back from the Tuareg mediation and left the north to Russian mercenaries Algiers itself criticises; the July
    2026 restoration was announced without stated conditions or any word on resuming mediation.
  it: ''
- hash: 7874413f
  kind: cards
  en: Breaking with the UAE to stop foreign meddling produced the second Arab rupture in five years, after Tebboune said in July 2026 that Algiers had put off a break for years to avoid deepening Arab divisions.
    Abu Dhabi threatens arbitration over its companies, hopes the break is temporary, and keeps the first Arab consulate opened in Western Sahara (2020) as a Moroccan asset.
  it: ''
- hash: 538c736a
  kind: cards
  en: 'Algeria runs the grand strategy of a rentier state whose army is the regime and whose two standing antagonists, Morocco and France, are the two neighbours it cannot choose: one across a border closed
    since 1994, the other across a sea that carries its gas, its diaspora and its memory. The 1962 identity of anti-colonial sovereignty, the Sahrawi referendum and the colonisation law substitute for the
    votes it does not get (46.1% disputed in 2024, about 21% in 2026), so every rupture is domestic currency as much as foreign policy. The paradoxical logic shows at each step: the tap that was meant to
    punish (the Maghreb pipeline, Spain in 2022) was also the only income, so it ran on; each door shut (Morocco, the UAE, France''s embassy premises, Mali''s airspace) removes a seat at the table where
    Washington, Paris and Rabat then decide without Algiers. Two signals that are not rows: Algiers did not vote on Resolution 2797 and has not answered the US push for talks with Rabat, and the chief of
    staff''s reported absence from the December 2025 council on a term-extending revision (Yabiladi, single source) is a possible seam inside the regime. The thaws of 2026 (Spain, Mali, France) are not
    reconciliation; they are the rentier state discovering that its leverage is bounded by its customers. Grading note: Morocco stays a rival, not an adversary, by the ontology''s own test: the aim Algiers
    declares is Sahrawi self-determination and security, not Moroccan defeat, and the Kabylie charge is the nearest it comes to an existential accusation.'
  it: ''
- hash: 2b2eff3e
  kind: cards
  en: 'Win the security fight with US help: lift the constitutional ban on foreign military bases (in force since the Correa era). Noboa, re-elected in the April 2025 run-off, put the question to voters
    on 16 November 2025; they rejected it by about 60%, and all four referendum questions failed.'
  it: ''
- hash: fd1b3f46
  kind: cards
  en: Break the gangs by force. On 9 January 2024, after an armed attack on a live TV station and the escape of Los Choneros leader Fito, Noboa declared an internal armed conflict against organised crime.
  it: ''
- hash: 21dbaaa1
  kind: cards
  en: 'The armed forces, deployed under the internal armed conflict declared in January 2024. The foreign-base referendum of November 2025 marks the limit: Quito wanted US bases for this fight and voters
    refused them.'
  it: ''
- hash: 5b2553d3
  kind: cards
  en: 'Trade and transit as leverage over Colombia: a 30% security tariff on Colombian imports (January 2026), raised to 100% from 1 May 2026 and repealed on 31 May 2026, and a higher transit fee on Colombian
    crude through the SOTE pipeline (reported as from USD 3 to USD 30 a barrel; one Spanish-language report, not yet corroboated against the SOTE tariff filing).'
  it: ''
- hash: a167710c
  kind: cards
  en: 'The electricity link to Colombia: Colombian power, about 8% of Ecuador''s demand, was suspended for six months after 22 January 2026 and resumed on 5 August 2026. Ecuador repealed its 100% tariffs
    on 31 May 2026, before the power came back; the sequence is reported, the causation is not proven.'
  it: ''
- hash: c4e10431
  kind: cards
  en: 'No foreign bases under the present constitution: the 16 November 2025 vote kept the ban, so the US basing route Noboa wanted is closed for now.'
  it: ''
- hash: 294e5dba
  kind: cards
  en: 'A security act cost a diplomatic channel: the entry into the Mexican embassy in Quito in April 2024 to arrest former vice-president Jorge Glas led Mexico to sever relations on 5 April 2024. A state
    fighting trafficking gave up an embassy channel for one arrest.'
  it: ''
- hash: 0013f4f9
  kind: cards
  en: 'Ecuador''s grand strategy is to hold the state together against gangs that now fight it as an armed conflict, and to find a stronger patron for that fight than its own police and army. The route
    it wanted, US bases, was refused by voters in November 2025, and the other tools it used, the raid on the Mexican embassy and the tariff war with Colombia, produced a rupture and then a truce. Not verified
    for this card: oil and bananas as the economy, the debt, the 2025-26 energy crisis, the Chinese FTA and loans, the EU, Peru, and the US tariff.'
  it: ''
- hash: 959d9699
  kind: cards
  en: 'Keep the state solvent and the regime in place: the IMF programme (USD 8bn, extended to 15 Dec 2026; the seventh review completed in July 2026 releasing about USD 1.77bn), Gulf money (the USD 35bn
    UAE Ras El Hekma deal of 2024, Qatar''s USD 29.7bn Alam El Roum), the EU''s EUR 7.4bn package, and a debt of USD 164.8bn (38.9% of GDP) against record reserves of USD 55bn.'
  it: ''
- hash: 758c9cb1
  kind: cards
  en: Stop the displacement of Palestinians into Sinai (the declared red line) and remain the indispensable broker of Gaza - reconstruction plan, Rafah crossing, police training, a seat for intelligence
    chief Hassan Rashad on the Gaza executive board - while keeping the 1979 treaty with Israel intact.
  it: ''
- hash: 39ca4658
  kind: cards
  en: 'Secure the Nile: force Ethiopia into a binding framework on the filling and operation of the Grand Ethiopian Renaissance Dam (inaugurated Sept 2025) and against the three further Blue Nile dams announced
    in March 2026, by diplomacy first and, failing that, by encircling Ethiopia with Eritrea, Somalia and Sudan.'
  it: ''
- hash: 931dd3b1
  kind: cards
  en: 'Keep the two long borders quiet: preserve a Sudan whose army stays in power and whole (against the RSF and its Emirati backers) and a Libya whose east, under Haftar, stays a buffer and is kept out
    of the RSF''s supply lines.'
  it: ''
- hash: 5a0fb666
  kind: cards
  en: 'Rebuild the Suez Canal and the gas-hub income: canal revenue recovered to USD 4.67bn in FY2025/26 (from USD 10.2bn in 2023) and is exposed again by the Houthi capture of the Yemeni Red Sea coast
    and the island of Mayyun (Sept 2026); gas is sought from Israel (the USD 35bn Leviathan contract), Cyprus (Aphrodite, Cronos) and Eni (Zohr).'
  it: ''
- hash: d5f3a8f4
  kind: cards
  en: 'Stay the regional pivot without a patron: keep USD 1.3bn a year of US military financing while buying from France, Germany, Russia, China and Turkey, mediate (Gaza, US-Iran) and host the Arab League,
    so that no capital can afford to lose Cairo.'
  it: ''
- hash: c548c011
  kind: cards
  en: 'Convening power: the Cairo Arab summit of 4 Mar 2025 that adopted Egypt''s USD 53bn Gaza plan against Trump''s ''Riviera'', the Sharm el-Sheikh summit of 13 Oct 2025 co-chaired with Trump, a seat
    on the Board of Peace (accepted Jan 2026), a secondary mediation role in the US-Iran war, and the El Alamein quadrilateral of 4 Oct 2026 with Eritrea, Somalia and Sudan.'
  it: ''
- hash: cb11cf0a
  kind: cards
  en: 'Red-line signalling and framing through the presidency and the State Information Service: displacement into Sinai is ''the end of the Palestinian cause'', Sinai deployments are counter-terrorism
    within treaty limits, Ethiopian unrest is ''a domestic crisis'' with which Cairo has ''nothing to do''.'
  it: ''
- hash: ec0561f8
  kind: cards
  en: 'Forces placed as signals: the Sinai deployments (reported at up to 40,000 troops, contested), a contingent of Rafale F3R fighters stationed in the UAE against Iranian drones (announced 8 May 2026),
    a contribution of 1,091 troops allocated to AUSSOM in Somalia under the 2024 defence pact, the first Egypt-China air drill (April 2025) and the first Egypt-Turkey naval drill in 13 years (Sept 2025),
    and a Rafale fleet that Cairo reportedly wants to raise to 78.'
  it: ''
- hash: f57a538c
  kind: cards
  en: 'Selling the coast and the gas: land-for-cash deals with the UAE and Qatar, the Suez Canal Economic Zone for Chinese industry (about 200 companies, USD 4bn), the Zohr field and the Damietta liquefaction
    plant as a hub for Cypriot and Israeli gas, and the Suez Canal toll as the one revenue Egypt can raise when peace returns.'
  it: ''
- hash: 0955ea38
  kind: cards
  en: 'A war economy without a war: the Iran conflict of 2026 doubled the energy import bill (USD 1.2bn in January to USD 2.5bn in March), forced fuel price rises of 14-30% and evening shutdowns, while
    the external debt service of USD 28.3bn in nine months and a current-account deficit that widened keep Egypt dependent on the IMF programme that ends in December 2026.'
  it: ''
- hash: 1b50893e
  kind: cards
  en: 'Israel holds the gas tap and the border: Leviathan was shut in June 2025 and again from 2 March 2026 (production resumed 2 April) (supplies to Egypt were about 830 mmcf/d in January 2026), Netanyahu
    froze the USD 35bn contract in Sept 2025 over the Sinai buildup and later approved it, and Israel controls the Rafah crossing''s operation.'
  it: ''
- hash: 5437e5bc
  kind: cards
  en: 'The Red Sea is not Egypt''s to guard: the Houthis took the whole Yemeni Red Sea coast and Mayyun (Perim) in September 2026, about 20 km from the African shore, after two years in which canal revenue
    fell sharply (the IMF put the 2024 loss at about USD 6bn; Al Jazeera reports about USD 7bn, about 60%); Cairo can only ask Riyadh and Washington to act.'
  it: ''
- hash: 15089a2d
  kind: cards
  en: 'Patrons that pull in different directions: Riyadh (identical views on Yemen and Sudan, MBS in Cairo on 15 Sep 2026) and Abu Dhabi (Egypt''s largest foreign investor, the backer of the RSF Egypt fights
    in Sudan, which expects ''backup'' on Iran); Washington (USD 1.3bn aid, no treaty) watching Chinese jets; Gulf criticism of Cairo''s neutrality in the Iran war.'
  it: ''
- hash: 9384c744
  kind: cards
  en: 'A downstream state: GERD is built and full, further dams are planned, and Egypt''s lever is not water but the Horn - where Ethiopia now answers with accusations of Egyptian backing for the TPLF,
    the expulsion of an Egyptian diplomat (1 Oct 2026) and a war on its own northern front.'
  it: ''
- hash: afe7ef55
  kind: cards
  en: 'Refugees and borders it cannot close: UNHCR registers about 852,000 Sudanese in Egypt (30 Jun 2026) and the government counts 1.5 million arrivals since 2023, with UNHCR funded at 29% of its needs;
    Gaza''s border remains a displacement risk.'
  it: ''
- hash: e632c196
  kind: cards
  en: 'The Sinai buildup meant to deter a displacement of Palestinians gives Israel its argument against Egypt: Jerusalem calls it a breach of the Camp David annex, Netanyahu froze the USD 35bn gas contract
    in Sept 2025 and asked Washington to press Cairo to scale back. The shield raises the price of the one revenue (gas) that would pay for it.'
  it: ''
- hash: 1b6f424d
  kind: cards
  en: 'The gas hub depends on the neighbour it is cooling toward: Egypt wants to be the Eastern Mediterranean''s liquefaction centre, but its own supply rests on Israeli pipeline gas that Jerusalem shut
    twice in nine months for security reasons, which forced Cairo into rationing and spot LNG at the worst moment of the Iran war.'
  it: ''
- hash: 0c677ae0
  kind: cards
  en: 'Egypt''s creditor is its rival in Sudan: the UAE rescued the balance of payments with the Ras El Hekma deal (USD 35bn) and is Egypt''s largest foreign investor, yet Egypt backs the army that accuses
    Abu Dhabi of arming the RSF, and has pressed Haftar to cut Emirati ties. Winning in Sudan risks the Gulf money that keeps the regime solvent.'
  it: ''
- hash: 1253eb55
  kind: cards
  en: Containing Ethiopia hands Addis Ababa a case. The ring of Eritrea, Somalia and Sudan (the 2024 Somalia pact, AUSSOM troops, the 4 Oct 2026 Alamein quadrilateral) lets Ethiopia call Egypt a sponsor
    of the TPLF and an obstacle to its sea access; the escalation pushes Ethiopia to finish more dams, not fewer.
  it: ''
- hash: 281c0fc3
  kind: cards
  en: Diversifying patrons strains the one that pays for the army. The Xi visit of Sept 2026 (a third phase of the TEDA zone, Chinese jets in the air in 2025 and the J-35 talked about) invites the US Congress
    to question the USD 1.3bn aid that nothing else replaces; neutrality in the Iran war keeps Washington and Tehran talking to Cairo but irritates the Gulf that funds it.
  it: ''
- hash: 496ec053
  kind: cards
  en: Peace made the canal reopen and war closes it again. Egypt's Sharm el-Sheikh summit (Oct 2025) ended the Houthi attacks and brought Maersk back; by Sept 2026 the Houthis hold the Bab al-Mandab shore,
    so the revenue Cairo was forecasting (about USD 8bn in 2026/27) depends on the wars it mediates but does not control.
  it: ''
- hash: e4f25957
  kind: cards
  en: 'Egypt is a state that sells its position. It cannot feed, fuel or finance itself,

    so the strategy of the Sisi regime is to be too central to be allowed to fail:

    the Suez Canal and the Rafah crossing, the Gaza table, the Arab League seat,

    a Mediterranean liquefaction hub, an army that can be lent to the Gulf. Each

    of the payers is a different patron (the IMF and the EU for the

    balance sheet, the Gulf for cash, Washington for the army, Paris and Berlin for

    the equipment, Moscow for the nuclear plant, Beijing for industry) and the cost

    is that none of them is aligned with the others on Sudan, Israel or Iran. The year

    2026 widened every gap at once: the US-Iran war doubled the energy bill and put

    Egyptian jets on Emirati soil while Cairo called itself neutral; the Israeli gas

    that was meant to be the bridge is the lever Jerusalem uses against the Sinai

    buildup; the Houthis, not Egypt, decide whether the canal pays; and the Nile has

    turned from a water dispute into a Horn-wide alliance contest with Ethiopia in civil

    war. The Luttwak reading is that Egypt''s moves are rational at each level and

    self-defeating across levels: tactical gains (a summit, a deposit, a contract) are

    paid for by a strategic dependency that will be called in when the IMF programme

    ends in December 2026. Gaps in this card: Jordan, Iraq, India, the UK, Djibouti, and

    the status of Tiran and Sanafir were not researched (no source retrieved).'
  it: ''
- hash: f1b76887
  kind: cards
  en: 'Stop Ethiopia''s Red Sea access drive from becoming an attack on Eritrean territory: Abiy''s sea-access claim is read in Asmara as a claim on Assab, so the aim is to keep the port and the border
    closed to it.'
  it: ''
- hash: 9f622fac
  kind: cards
  en: 'Keep an armed Tigrayan force from reforming next to the border: Asmara was left out of the 2022 Pretoria settlement that disarmed the TPLF, and it treats any renewed Tigrayan army as a threat on
    its border.'
  it: ''
- hash: 1b357ace
  kind: cards
  en: 'End the isolation and turn the Red Sea into partners and money: the Asmara ring with Egypt, Somalia and Sudan, the Chinese partners in the Bisha and Colluli mines, and Russia''s support at the UN.'
  it: ''
- hash: 5447c1ba
  kind: cards
  en: 'The Asmara ring: the trilateral with Egypt and Somalia (Asmara, October 2024), the four-way El Alamein summit with Sudan (4 October 2026), and membership of the Saudi-led Red Sea Council, whose 2020
    charter covers piracy and smuggling, not defence.'
  it: ''
- hash: 166b3ea7
  kind: cards
  en: A conscript army (see constraints) that, on unverified reports of 7 October 2026, moved into Tigray around Adigrat and Idaga Hamus; the information minister did not deny the crossing and called Ethiopia's
    self-defence framing a 'fallacious narrative'.
  it: ''
- hash: f06a37f0
  kind: cards
  en: 'State capital from mines and the diaspora: Zijin Mining (China) holds 55% of the Bisha copper-zinc-gold mine and the state miner ENAMCO 45%; the Colluli potash project passed in 2023 from Danakali
    to China''s Sichuan Road and Bridge Group (the other half presumed ENAMCO''s); the 2% tax on Eritreans abroad, which the government calls a rehabilitation levy, was a UN sanctions target from 2011 until
    the UN lifted its measures in 2018.'
  it: ''
- hash: 94efb675
  kind: cards
  en: 'Indefinite national service: the 1995 proclamation sets 18 months for citizens over 18, but no fixed end is applied; Human Rights Watch says the open-ended service traps successive generations in
    forced labour, and the UN Special Rapporteur (June 2026) reports grave abuses and grounds to believe crimes against humanity continue.'
  it: ''
- hash: 6505be13
  kind: cards
  en: 'No constitution in force: the 1997 constitution, approved by referendum, was never implemented; the People''s Front for Democracy and Justice is the only party tolerated; Isaias Afwerki has ruled
    since independence in 1993 with no written succession, and Human Rights Watch dates the last legislative sitting to 2010.'
  it: ''
- hash: 81b53389
  kind: cards
  en: 'Isolation with a memory: UN measures from December 2009 (resolution 1907, over the Djibouti border and support to Somali armed groups) ran until 2018; the EU listed the National Security Office on
    22 March 2021; the US full entry ban on Eritrean nationals has applied since June 2025 and survived the December 2025 expansion.'
  it: ''
- hash: b1e536f2
  kind: cards
  en: 'The ring that keeps Ethiopia off the Red Sea is the evidence Addis Ababa uses against Eritrea: on 1 October 2026 Ethiopia accused Egypt, Eritrea and Sudan of backing the TPLF, and the rupture that
    followed, with troops reported at the border, is the escalation the ring was meant to deter.'
  it: ''
- hash: ac63f1aa
  kind: cards
  en: 'Eritrea runs the strategy of a garrison state that has turned isolation into method: an army with no end date, a constitution never applied, and a ring of partners (Egypt, Somalia, Sudan, with Russia
    at the UN) built to keep Ethiopia off the Red Sea. The structural problem is that it holds the coast and the port that Ethiopia wants, so each Ethiopian move on Assab reads in Asmara as an attack, and
    each Eritrean move in Tigray reads in Addis as an invasion. The 1-2 October 2026 rupture shows the paradox at full size: the ring is Addis Ababa''s proof of encirclement, and the ''no war, no peace''
    that Asmara kept from 2000 to 2018 is ending on the border.'
  it: ''
- hash: f24c82ef
  kind: cards
  en: 'Hold the southern flank: keep Morocco cooperative on migration and quiet on Ceuta and Melilla (which Madrid says are not negotiable), and keep Algerian gas flowing, by courting both Maghreb capitals
    at once. Madrid backs Morocco''s autonomy plan for Western Sahara (2022 joint declaration, welcomed UNSCR 2797 in Dec 2025) and in July 2026 reopened the relationship with Algiers.'
  it: ''
- hash: e1b9e4e2
  kind: cards
  en: 'Stay at the centre of the EU and make the Iberian peninsula less of an energy island: Bay of Biscay interconnector with France (due 2028), the EU-Mercosur deal Madrid wants applied at once, EU cover
    on trade (Brussels, not Madrid, answers US tariffs) and on migration.'
  it: ''
- hash: b248c3d5
  kind: cards
  en: 'Keep the Atlantic guarantee cheap: stay in NATO and in the US base arrangement while holding defence spending near 2.1% of GDP instead of the 3.5%+1.5% target agreed at The Hague in June 2025, to
    protect the welfare state and public finances.'
  it: ''
- hash: 911ee086
  kind: cards
  en: 'Be a rule-of-law, anti-war middle power on Gaza and Iran: recognise Palestine (May 2024), embargo arms to Israel by law (Oct 2025), refuse the US use of Rota and Moron for the Iran war (Mar 2026),
    decline Trump''s Board of Peace. The line also holds the left of the governing coalition together.'
  it: ''
- hash: 8fd919f6
  kind: cards
  en: 'Stay in office and keep the territorial settlement together: a minority coalition (PSOE and Sumar) that needs Catalan, Basque and other regional votes, with a snap general election called for 29
    November 2026 after the housing decrees fell, and Puigdemont''s return now cleared by the Constitutional Court.'
  it: ''
- hash: d9a7d528
  kind: cards
  en: 'Rebuild an Ibero-American and Mediterranean voice: the Ibero-American summit in Madrid (4-5 Nov 2026) with Delcy Rodriguez invited, the thaw with Mexico after the King''s March 2026 acknowledgement
    of abuses, migration pacts with Mauritania, and Gibraltar reopened under the July 2026 EU-UK treaty while the sovereignty claim stays.'
  it: ''
- hash: c8ba716f
  kind: cards
  en: 'Recognition and legal diplomacy rather than force: Palestine recognised on 28 May 2024, a total arms embargo on Israel passed by Congress 178-169 on 8 Oct 2025, the ambassador to Israel removed in
    March 2026, a ''No to the war'' line at the UN (23 Sep 2026), and joint declarations with Rabat (2022) and Algiers (treaty of friendship reactivated March 2026).'
  it: ''
- hash: 40e0f28c
  kind: cards
  en: 'Moral framing aimed at a domestic audience as much as a foreign one: Sanchez''s ''genocide'' language on Gaza, the published Rutte letter used to argue that Spain has an exemption from the 5% goal,
    and ''You cannot play Russian roulette with the destiny of millions'' to Trump (4 Mar 2026). Reuters found the anti-war stance gained the PSOE ground in April 2026 polls.'
  it: ''
- hash: d0341622
  kind: cards
  en: 'A modest force used as a veto and a hedge: the government says defence spending reached EUR 35.4bn in 2026 (about 2% of GDP, tripled since 2018), troops in Latvia, Slovakia, Romania, Bulgaria and
    Turkey instead of a higher percentage, and sovereign control over the joint-use bases at Rota and Moron, which Madrid refused for the Iran war and from which the US moved 15 aircraft.'
  it: ''
- hash: 63f6ec7b
  kind: cards
  en: 'Energy and migration bargaining: Medgaz gas from Algeria (34.5% of imports in 2025), a regasified-LNG reverse flow to Morocco, circular-migration pacts (Mauritania, Aug 2024), an extraordinary regularisation
    of undocumented migrants (about 900,000 applications by mid-June 2026), purchases that double as diplomacy (30 Turkish Hurjet trainers, Dec 2025) and a pragmatic opening to China (19 agreements in April
    2026).'
  it: ''
- hash: b7f22717
  kind: cards
  en: 'A fragile parliamentary base: no majority of its own, Junts (the Catalan right-nationalists) broke with the government in October 2025, no new budget is passing, and the snap election of 29 November
    2026 points, in current polls, to a PP-led coalition with Vox that would put the far right in central government for the first time since Franco. Every foreign-policy line is read as an election move.'
  it: ''
- hash: 187008bc
  kind: cards
  en: 'Corruption cases in the party and the family: the Koldo/Abalos/Cerdan mask and public-works cases (Abalos resigned his seat in January 2026 and was tried at the Supreme Court from April), Begona
    Gomez sent to a jury trial on 21 Sep 2026 for embezzlement and influence peddling. They hand the opposition, and Israeli ministers, a line against the government''s moral claims.'
  it: ''
- hash: 19d814f1
  kind: cards
  en: 'Energy dependence and the ''energy island'': Algeria supplied 34.5% of gas imports in 2025 and 29.2% in early 2026, and Medgaz is the line that Algeria reduced by 25% in May 2022 after the Sahara
    turn; the peninsula has only about 3% of its electricity connected to neighbours against an EU target of 15% by 2030, and the 28 Apr 2025 blackout (ENTSO-E: a voltage surge chain, ''perfect storm'')
    showed the exposure.'
  it: ''
- hash: ccc3ce8d
  kind: cards
  en: 'Dependence on the United States for hard security and on the EU for trade: Washington can threaten (Trump on 3-4 Mar 2026: cut off all trade; 8 Jul 2026: Spain ''came back all the way''), but only
    Brussels can act, so Madrid hides behind Commission competence, as Merz said (''no way to treat Spain particularly badly''). The defence industrial base is thin: FCAS collapsed in June 2026 and the
    new fighter and trainer buys come from partners.'
  it: ''
- hash: 34568c8b
  kind: cards
  en: 'Migration politics inside the EU: after the July 2026 Ceuta crossing Italy suspended Schengen arrangements with Spain for August and 22 member states wrote to the Commission calling the regularisation
    a pull factor. Spain cannot be both the humanitarian outlier and the hand that holds the southern border without Morocco''s policing.'
  it: ''
- hash: bc1f9a47
  kind: cards
  en: 'Weak leverage over Morocco on the one issue it cannot trade: Rabat reopened the Ceuta and Melilla claim in August 2026 through ministers, Spain summoned the ambassador, and Madrid says it ''will
    never speak'' about its territorial integrity, but it relies on Moroccan police to hold the border and on Moroccan goodwill for the Canary route.'
  it: ''
- hash: 027d2341
  kind: cards
  en: The Sahara turn bought quiet in Rabat and cost Algeria. In March 2022 Sanchez backed Morocco's autonomy plan; Algiers recalled its ambassador, suspended the friendship treaty and trimmed Medgaz, and
    Spain made up the gas elsewhere. In July 2026, after the thaw with Algiers, a Ceuta crossing of tens of thousands followed with Moroccan patrols reported absent, some analysts reading it as Rabat's
    irritation at the Algerian rapprochement. The two Maghreb capitals cannot both be courted without the one noticing.
  it: ''
- hash: '70897355'
  kind: cards
  en: Saving on defence to protect the welfare state makes Spain the one ally Trump names. The 2.1% line lets Madrid spend on pensions, but it turned a spending dispute into a trade and bases dispute (Oct
    2025 tariff threat, Mar 2026 'cut off all trade') and into the argument of those who say Spain free-rides on Europe's border and on NATO's umbrella. Madrid then raised the budget by billions in the
    weeks before Ankara, conceding in practice what it refused in principle.
  it: ''
- hash: 9aaff03d
  kind: cards
  en: Refusing the bases earned votes and cost cover. The Iran-war refusal and the Gaza embargo gained the PSOE ground at home (Reuters poll, April 2026), yet they pushed the US to move tankers out of Rota
    and Moron, put Madrid against Paris, Berlin and London on Iran, and left it with no channel to the White House just as Washington reviews its European posture. The base that makes Spain useful to the
    US is the one Spain has now shown it can close.
  it: ''
- hash: 11d167d5
  kind: cards
  en: The amnesty that bought the government now helps end it. The 2023 amnesty law won Catalan votes for Sanchez's investiture; Junts left in October 2025 over its non-application, and on 6 Oct 2026 the
    Constitutional Court ordered the Supreme Court to apply it 'preferentially and urgently', lifting Puigdemont's warrant three weeks before the 29 November vote. The same logic keeps Spain from recognising
    Kosovo, which Madrid reads through Catalonia, while its government depends on Catalan votes.
  it: ''
- hash: e219075b
  kind: cards
  en: Regularisation strengthens the labour market and weakens the Schengen standing. About 900,000 applications by mid-June 2026 gave Spain workers and tax base, but on 1 Aug 2026 22 states called it a
    pull factor, Italy and France reimposed checks after Ceuta, and the Commission found no direct link. Spain gains workers and loses standing with the governments it must work with inside the EU.
  it: ''
- hash: 073a4a0c
  kind: cards
  en: 'The China hedge feeds the American grievance it was meant to offset. Sanchez went to Beijing four times in four years (April 2026: 19 agreements, a strategic dialogue) and sells Spain as the pragmatic
    EU voice, while the Interior Ministry''s EUR 12.3m Huawei contract for storing court-ordered wiretaps drew a letter from the US intelligence committee chairs asking whether intelligence sharing with
    Spain should continue.'
  it: ''
- hash: 06654aa0
  kind: cards
  en: 'Spain''s grand strategy is the strategy of a middle power that has chosen to be

    ruled by its law and its domestic coalition rather than by its geography, and

    geography is now collecting. Madrid''s south is a border with a monarchy it

    cannot afford to quarrel with and a gas pipeline from a republic that cannot

    be ignored; its east is an energy island; its west an ally; its north a

    grudging partner (France) and a flat refusal of the Atlantic bill (2.1%

    against 5%). The Sanchez government answered each pressure with a legal

    gesture (the Sahara letter of 2022, Palestine in 2024, the arms embargo of

    2025, the bases refusal of 2026, regularisation), which won votes and

    moral standing but accumulated debts: Trump now names Spain as the outlier,

    Israel and Spain have downgraded embassies, Morocco reopened Ceuta and

    Melilla in August 2026 after a mass crossing, Italy suspended Schengen

    arrangements for a month. The Luttwak reading is that the gestures were

    cheap while the system was friendly, and became expensive when friction

    arrived in a pile - Iran war, Ceuta, NATO summit, Trump, an election. Two

    signals that are not rows: the government itself justifies the 2.1% line by the welfare

    state and public finances, so it is a domestic bargain as much as a

    strategy, and the snap election of 29 Nov 2026 makes every position here

    provisional: polls point to a PP-led government with Vox, whose foreign

    line on Gaza, Iran and Latin America would likely differ.'
  it: ''
