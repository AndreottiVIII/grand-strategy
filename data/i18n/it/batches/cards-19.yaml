# Translate every `en` into it. Write the translations to the file cards-19.out.yaml next to this one,
# as `items:` of `- hash: <same hash>` / `it: <translation>`, appending one item at a time (valid YAML at
# every step), never editing this file. Keep names, dates, numbers and quotes; register of a foreign-office
# brief: dry, precise, no flourish.
lang: it
items:
- hash: 14c3f8da
  kind: cards
  en: 'Keep the tie with the Republic of China (Taiwan), the only South American state on Taipei''s side, and show it to Taipei: President Santiago Peña made a state visit from 7 May 2026, received with
    a military welcome and a sit-down with President Lai, and called Taiwan a ''fundamental partner''.'
  it: ''
- hash: ebfd639b
  kind: cards
  en: Resist Beijing's pull to switch recognition. Beijing has been poaching Taiwan's diplomatic allies, leaving Taipei with 12, and the May 2026 visit came as China sought to lure Asunción away.
  it: ''
- hash: 3c602fc8
  kind: cards
  en: 'Recognition as a bargaining chip with Taipei: a military welcome, a meeting with President Lai and an honorary doctorate from National Taiwan University of Science and Technology in May 2026.'
  it: ''
- hash: 42a0a407
  kind: cards
  en: 'Security cooperation on the Triple Frontier: Paraguay and the United States have alleged Hezbollah fundraising in Ciudad del Este since 2002, the security file the two states share.'
  it: ''
- hash: afeae56d
  kind: cards
  en: 'Regional isolation: with Taiwan''s ties, Paraguay is the only South American state on Taipei''s side, and it has no regional partner to share the cost of that position (our reading, C; the ''only
    South American ally'' fact is AP''s).'
  it: ''
- hash: ffe5b606
  kind: cards
  en: 'Evidence limit on the security line: the Triple Frontier claims have run since 2002 and the BBC notes no terrorism conviction, so Asunción''s security case rests on allegations, not judgements.'
  it: ''
- hash: 77bd3760
  kind: cards
  en: 'The tie that earns Paraguay Taipei''s visits and its place in Taiwan''s diplomacy is also what isolates it in the region: its main diplomatic currency is its main regional cost. Our reading (C);
    the sources read give the recognition and the pressure, not the Mercosur or trade figures.'
  it: ''
- hash: 4f99a2d9
  kind: cards
  en: 'Paraguay plays one card: recognition of Taipei, the only South American state that still holds it, which buys a state visit with military honours and a place in Taiwan''s diplomacy. Beijing''s pressure
    to switch is the constant test of that card, and the Triple Frontier allegations, which Paraguay shares with Washington, are its second security file. The card is thin: the sources read cover the Taiwan
    tie and the security allegations, not Brazil, Argentina, the United States, Israel, the EU, soy, beef or hydropower, which stay open until read.'
  it: ''
- hash: ff3e7790
  kind: cards
  en: 'Survive as the PLO/Palestinian Authority in the West Bank: keep salaries paid, the security forces and ministries standing and the claim to be the sole legitimate representative alive while Israel
    withholds the money, builds settlements and, on the reading of UN and Polish analysts, works to dismantle the PA.'
  it: ''
- hash: 177cd19b
  kind: cards
  en: 'Return to Gaza on the PA''s terms: be the authority to which Hamas hands over (one law, one legitimate armed force, ''Gaza is an integral part of our state'') and a seat in the Trump-plan machinery
    (Board of Peace, technocratic committee, stabilisation force) that so far leaves Palestinians without representation.'
  it: ''
- hash: d5c154a1
  kind: cards
  en: 'Turn recognition into statehood: the two-state track on the 1967 lines with East Jerusalem as capital, banked in the New York Declaration (142-10-12, 12 Sep 2025), the September 2025 recognition
    wave and the ''pathway to statehood'' language of Resolution 2803, and full UN membership as the horizon.'
  it: ''
- hash: e20f16d8
  kind: cards
  en: 'Keep the money flowing: unblock the clearance revenues (about two-thirds of PA revenue, some USD 6bn withheld by the PA''s count), keep the correspondent-bank waiver, and mobilise donors - the EU''s
    EUR 1.6bn 2025-27 programme, the Emergency Coalition of September 2025, Norwegian and Saudi money.'
  it: ''
- hash: 5ab02d13
  kind: cards
  en: 'Manage legitimacy and succession: reform enough to satisfy donors (technocratic cabinet, judicial independence, elections), keep Fatah together under Vice-President Hussein al-Sheikh and keep Hamas
    and the Dahlan camp from forming an opposition bloc - while postponing the vote (legislative elections moved on 10 Oct 2026 from 28 Nov 2026 to 11 Sep 2027).'
  it: ''
- hash: 578fd598
  kind: cards
  en: 'Use law as the weapon of the weak: the ICJ advisory opinion of 19 July 2024 (occupation unlawful), Palestine''s intervention in South Africa v. Israel, the ICC (Palestine a state party since 1 April
    2015) and the defence of UNRWA and the refugee file.'
  it: ''
- hash: 14483b98
  kind: cards
  en: 'Recognition and UN diplomacy: the France-Saudi New York conference and Declaration, the September 2025 wave (157 recognitions), A/RES/81/1 (17 Sep 2026, 152-3-4) letting Abbas speak by video after
    a second US visa ban, and a standing Arab-Muslim front (Egypt, Jordan, Saudi Arabia, Qatar, Turkey, the UAE) that signed the 14 Nov 2025 statement which the PA welcomed as a pathway to statehood.'
  it: ''
- hash: 9af85c5e
  kind: cards
  en: 'Lawfare: ICJ advisory opinion (19 Jul 2024), declaration of intervention in South Africa v. Israel (3 Jun 2024), accession to the Rome Statute - the very steps the US State Department cites for its
    visa bans and Israel for its financial deductions.'
  it: ''
- hash: 6daa0cd9
  kind: cards
  en: 'The victim-of-occupation narrative at the UN and in Western capitals (Abbas to the General Assembly on 24 Sep 2026: Israeli policies threaten Palestinians'' ''very existence''), fed by UN data on
    settler violence and displacement, which Ramallah quotes more than it produces.'
  it: ''
- hash: '49361391'
  kind: cards
  en: 'No military instrument in the strategic sense: the PA''s security forces exist inside the Oslo framework, rely on coordination with Israel and on training from the UK (a British support team in Ramallah
    until Israel ordered it closed in September 2026), the US and Egypt, and cannot intervene against Israeli citizens in Areas A and B; Fatah has also handed over camp weapons to the Lebanese state (2025).'
  it: ''
- hash: 59efbad7
  kind: cards
  en: 'Donor mobilisation: the EU''s PEGASE channel (EUR 3.7bn since 2008, more than EUR 88m pledged in 2025), the EUR 1.6bn 2025-27 programme, the Emergency Coalition of 12 donors (26 Sep 2025), the Norway-chaired
    donor group (NOK 100m in April 2026), Saudi Arabia''s USD 1bn pledge at the Board of Peace (19 Feb 2026); in return it offers a reform calendar.'
  it: ''
- hash: ba63a89c
  kind: cards
  en: 'Israel holds the money, the borders and the banks: clearance revenues are about two-thirds of PA revenue, transfers have been fully suspended since May 2025 (USD 6bn withheld by the PA''s count,
    USD 4.5bn by an independent estimate for end-2025), April 2026 saw ILS 590m of ILS 740m deducted for utility debts, Smotrich controls the indemnity waiver for Israeli-Palestinian banking (Israeli correspondent
    banks planned to stop shekel processing on 1 Sep 2026; the waiver was extended to year-end) and 200,000 work permits were cancelled (about USD 4bn a year, a quarter of GDP). Public debt reached USD
    14.6bn (106% of 2024 GDP).'
  it: ''
- hash: 42d91b6c
  kind: cards
  en: 'A fragmented territory it cannot defend: in 2026 to 10 August the UN counts 76 Palestinians killed in the West Bank and about 1,430 settler incidents; 12,360 settlement units advanced, USD 431m for
    34 new settlements, the first seizure of Area A land for settlement infrastructure; Gaza is outside its control and about 60-70% of the Strip is held by Israel behind the ''Yellow Line''.'
  it: ''
- hash: 1b155a1f
  kind: cards
  en: 'Washington is hostile and holds the pen: the US denied Abbas and about 80 officials visas in August 2025 and again in September 2026 (citing the failure to reform, unilateral recognition, recourse
    to international courts and payments to prisoners'' families), the Board of Peace has no Palestinian member, and Resolution 2803 ties the PA''s role to completing reform.'
  it: ''
- hash: 6af19e4e
  kind: cards
  en: 'A legitimacy deficit at home: Abbas, 90, rules by decree since 2009; in the PSR poll of 5-8 Aug 2026, 79% want him to resign, 83% see corruption in PA institutions and 65% call the PA a burden; Marwan
    Barghouti would beat him 54% to 14%; the vice-president is seen as unpopular and close to Israel.'
  it: ''
- hash: 2fa16a26
  kind: cards
  en: 'Rivals who can organise against it: Hamas (24% support, still holding the guns in Gaza and refusing disarmament before Israeli withdrawal, as 72% of the public also do) and Mohammed Dahlan''s Democratic
    Reform bloc (based in the UAE), which the PA fears may join a joint list for the legislative elections.'
  it: ''
- hash: 522bcd19
  kind: cards
  en: 'Donor fatigue and conditionality: Arab League pledges (USD 100m a month) have not fully materialised, the EU ties EUR 400m of urgent support to reform, and the postponement of the elections threatens
    the PA''s credibility with the donors that finance it.'
  it: ''
- hash: fa46c39e
  kind: cards
  en: Security coordination buys the PA its survival and spends its legitimacy. Coordination with Israel has continued through earlier announced suspensions and is part of what keeps the PA useful to Israel
    - and it is the charge Hamas uses to call PA forces a 'farce' working for the occupier, while 65% of Palestinians already call the PA a burden. The more it protects the institution, the less the institution
    is worth to those it governs; and it does not stop Israel's finance minister from strangling it.
  it: ''
- hash: 0c3f6478
  kind: cards
  en: 'Every diplomatic win is paid for in cash. Recognition by 157 states, the ICJ opinion and the ICC route are met by US visa bans and by Smotrich''s deductions, which his office describes as a protest
    against the PA''s steps in international institutions: the PA gains standing abroad in exact proportion to the revenue and access it loses at home.'
  it: ''
- hash: 115c4469
  kind: cards
  en: Postponing the vote protects Fatah and weakens the reform case. Abbas told the UN on 24 Sep that legislative elections on 28 Nov were on; on 10 Oct the PLO executive moved them to 11 Sep 2027, citing
    Israeli restrictions. The reform programme (elections within a year of the war, technocratic cabinet) is the condition on which the EU's EUR 400m and the PA's place in Gaza depend, so the move that
    shields the leadership from an opposition bloc undermines the only argument the donors accept for keeping it.
  it: ''
- hash: b6420eb6
  kind: cards
  en: Endorsing the Trump plan sidelines the endorser. The PA welcomed Resolution 2803 and the US-led statement of 14 Nov 2025 and said it was ready to take 'full responsibilities' in Gaza, yet the Board
    of Peace and the technocratic committee (15 unelected members, chaired by Ali Shaath, sitting in Cairo) have no PA seat, Israel blocks the committee's entry, and UNRWA, which the PA defends, is told
    its 'days are over'. Legitimising the structure that replaces it is the price of staying in the picture.
  it: ''
- hash: 36f6812a
  kind: cards
  en: The succession designed for continuity is the one that costs most legitimacy. Naming Hussein al-Sheikh vice-president (26 Apr 2025), a man the street sees as unpopular and close to Israel, and talks
    with Dahlan to head off an opposition bloc, secure the Fatah machine; they also confirm for the public (Barghouti preferred as successor by 39%, al-Sheikh not among the four names the poll reports)
    that the PA is a closed circle.
  it: ''
- hash: 30dc8115
  kind: cards
  en: Fighting Hamas and needing it. The PA wants Hamas out of governance and disarmed (the condition in the New York Declaration and the Trump plan), but its own return to Gaza runs through Hamas's consent
    (the November 2025 deal on a committee headed by a PA nominee, the July 2026 dissolution of Hamas's Gaza government, the 30 Jul acceptance of the Mladenov roadmap), a process in which the PA is a spectator.
    The 2024 Beijing Declaration, which promised a unity government, produced nothing.
  it: ''
- hash: 3a37baa4
  kind: cards
  en: 'The State of Palestine is a state whose government cannot protect its people, finance itself or even hold an election, and it knows it: its grand strategy is the strategy of staying in

    the picture. Everything Ramallah does is a bet that the Palestinian question will be settled by others and that whoever is still standing, with a flag, a seat at the UN and a legal

    personality, will be handed what is left. That produces the Luttwak pattern in its sharpest form: the means that keep the Authority alive (coordination with Israel, endorsement of the

    Trump plan, reform pledges to donors, a managed succession) are the same that drain its credibility with Palestinians, while the means that raise its standing abroad (157 recognitions, the

    ICJ opinion, the ICC) are punished with the loss of money and travel. In 2025-26 the pressure came from three sides at once: Israel''s fiscal strangulation and settlement drive (UN: ''the PA

    is at the brink of collapse''), a US-designed Gaza order that includes technocrats but not the Authority, and Hamas, which is losing public support (24%) but not its arms. The Western wave of

    recognition in September 2025 and the settlement-goods bans of 2026 are real, but they give the Authority diplomatic oxygen, not territory or revenue. Two signals that are not rows: Abbas telling

    the UN on 24 Sep 2026 that elections were on and postponing them sixteen days later, and the US ban that again kept him out of New York. With Israeli elections on 27 Oct 2026, the PA''s real

    question is whether a new government in Jerusalem would unfreeze the clearance revenues or whether the money, not the flag, decides its survival.'
  it: ''
- hash: 0a6b1b10
  kind: cards
  en: 'Make an attack on Qatar too costly to repeat: a US guarantee in writing (Executive Order 14353 of 29 Sep 2025 treats any armed attack on Qatar''s territory, sovereignty or critical infrastructure
    as a threat to US peace and security), the major non-NATO ally status of 2022, Al Udeid, Turkish troops at Tariq bin Ziyad, Patriot and counter-drone purchases and, since the Iran war, a declared aim
    of Gulf ''self-sufficiency in security''. Regime survival and sovereignty come before every other aim after the Israeli strike on Doha (9 Sep 2025) and Iran''s attacks (June 2025, 28 Feb 2026 onwards).'
  it: ''
- hash: 26d8c801
  kind: cards
  en: 'Keep the gas franchise intact and growing: the North Field is the state''s only large revenue source and the basis of its rent-for-influence model. Ras Laffan lost about 17% of LNG export capacity
    for 3-5 years (Iranian strike, March 2026), force majeure has been extended to October, and the 27-year Sinopec contract, the German and Italian contracts and the North Field East expansion are the
    commitments Doha must still honour. It negotiates regulation too: the CSDDD climate-transition-plan duty was dropped after Doha''s threat to divert LNG.'
  it: ''
- hash: bde7992c
  kind: cards
  en: 'Be the indispensable mediator: the foreign ministry spokesman calls mediation ''an identity issue for us, a national pride''; the portfolio runs from Gaza (Oct 2025 ceasefire, 31 Jul 2026 disarmament
    deal) and Afghanistan (US-Taliban, Pakistan-Taliban Oct 2025) to Iran-US (backing Pakistan''s lead after refusing to lead in March 2026), Rwanda-DRC (Doha Framework, 15 Nov 2025) and Ukrainian children.
    The prime minister said on 30 Sep 2026 that mediation is embedded in state institutions and Doha will stay active.'
  it: ''
- hash: 9f3ff85b
  kind: cards
  en: 'Autonomy within the Gulf: never again be subordinated to Riyadh or Abu Dhabi, as in the 2017-21 blockade (13 demands, including the closure of Al Jazeera and curbs on ties with Iran). Al-Ula (5 Jan
    2021) ended it; Qatar keeps its own channels to Hamas, Iran and Turkey, its own US guarantee, its OPEC exit (Jan 2019) and a Turkish base.'
  it: ''
- hash: 169d789a
  kind: cards
  en: 'Use the gas surplus to buy a stake in other states'' stability: Qatari Diar''s USD 29.7bn Alam El Roum project in Egypt, the UK pledge of GBP 10bn, funding for Syria''s gas and salaries, aid to Sudan
    and Ukraine; and use soft power (Al Jazeera, the 2022 World Cup) to give a small state a voice louder than its army.'
  it: ''
- hash: d40819c0
  kind: cards
  en: 'Keep markets and the customer base: Europe (12-14% of LNG), Asia (about 80% of Qatari LNG goes there; China, South Korea, India, Pakistan), against the US push of its own LNG and the buyers'' hedging
    after the Hormuz closure. US LNG was about 62% of Italy''s LNG mix in H1 2026.'
  it: ''
- hash: 1819bf51
  kind: cards
  en: 'Mediation as statecraft: the hosting of Hamas''s political office, the Taliban''s office, the Doha process for DRC-M23, the Moscow-embassy channel for Ukrainian children, the Doha venue for Pakistan-Taliban
    and Iran-US contacts; quick convening of Arab and Islamic summits after attacks (15 Sep 2025). The mediation produces a seat at every table but also exposure.'
  it: ''
- hash: 92a6c152
  kind: cards
  en: 'A security tie portfolio rather than a single alliance: the US (EO 14353, MNNA, Al Udeid), Turkey (2014 agreement, base, annual Supreme Strategic Committee), Pakistan and Ukraine (defence cooperation
    signed March 2026), and a push for a stronger GCC.'
  it: ''
- hash: 36e77728
  kind: cards
  en: Al Jazeera, headquartered in Doha, has been an issue in every Gulf quarrel (the 2017 ultimatum demanded its closure), and the foreign ministry's weekly briefings and Qatar News Agency carry the official
    line on mediation and on the attacks.
  it: ''
- hash: 6d9e43e1
  kind: cards
  en: 'Narrative of the aggrieved sovereign: after the Israeli strike the prime minister called Netanyahu ''a narcissist'' and said he must be brought to justice, and Doha pressed the Arab-Islamic summit
    to urge a review of Israel''s UN membership; a year on it blames Israel for delays in the Gaza plan.'
  it: ''
- hash: 8afeacee
  kind: cards
  en: 'Air defence that works: Qatar''s armed forces intercepted the missiles of 23 Jun 2025 and the second wave of 28 Feb 2026, and shot down two Iranian Su-24 sorties on 2 Mar 2026 (the first Qatari aerial
    combat kill); it has bought Patriots, APKWS, the Raytheon FS-LIDS counter-drone system and F-15s, and trains pilots at Mountain Home AFB.'
  it: ''
- hash: d09411fa
  kind: cards
  en: 'Hosting forces it does not command: Al Udeid with about 10,000 US personnel, and a Turkish force at Tariq bin Ziyad.'
  it: ''
- hash: 64bf00ed
  kind: cards
  en: 'LNG contracts as diplomacy: a 27-year, 4 mtpa Sinopec deal (Nov 2022), German and Italian supply, and the threat to divert volumes from the EU over the CSDDD, which worked (the climate-transition-plan
    duty was dropped in Dec 2025-Feb 2026).'
  it: ''
- hash: bb3c2ff7
  kind: cards
  en: 'The sovereign wealth fund and Qatari Diar as strategic investors: Alam El Roum in Egypt (USD 29.7bn), the GBP 10bn UK pledge, USD 38bn of intended burden-sharing at Al Udeid, and the 747 gifted to
    the US President (first flown as Air Force One in July 2026).'
  it: ''
- hash: 4b1a9b23
  kind: cards
  en: 'Humanitarian and reconstruction money as an entry ticket: gas to Syria through Jordan (2 million m3/day, March 2025), salary financing, USD 100m to Ukraine, USD 50m to Sudan, and the Qatar Fund for
    Development in the Doha-run processes.'
  it: ''
- hash: 7d9277df
  kind: cards
  en: 'Geography: about 93% of Qatari LNG exits through the Strait of Hormuz, controlled in practice by Iran since the war began on 28 Feb 2026; Qatari tankers cross only with Iranian clearance (two aborted
    a crossing on 8 Apr for lack of it), force majeure has been extended into October, and an Iranian missile hit a Qatari LNG tanker on 7-8 Jul.'
  it: ''
- hash: aff55ec3
  kind: cards
  en: 'Scale and a single export: the state''s wealth is gas, and the Iran war cut it: the World Bank projects GDP to contract 5.7% in 2026 (CSM, May), with ammonia, helium and urea output also damaged,
    while 66 missiles on 28 Feb alone showed how quickly the defence budget is tested.'
  it: ''
- hash: b07373a6
  kind: cards
  en: 'The shield is not a treaty: EO 14353 is an executive order with no enforceable rights, subject to appropriations and to the President''s discretion, issued after the US failed to stop the strike
    of 9 Sep 2025; Doha itself says the alliance is ''important but insufficient''.'
  it: ''
- hash: 2def78e6
  kind: cards
  en: 'Iran is next door and shares the North Field: the war made it a target and a necessary interlocutor at once; Hormuz access and the field mean Doha cannot sever the tie, which limits how hard it can
    respond (attaches expelled, no break of relations).'
  it: ''
- hash: 5c6a0dda
  kind: cards
  en: 'Reputation: the mediator-bias charge (Hamas, the Taliban) and Qatargate keep Washington, Brussels and Tel Aviv suspicious; a September 2026 FDD report argues that the costs of Qatari mediation can
    exceed the gains, and Israelis distrust Qatari and Turkish involvement in Gaza.'
  it: ''
- hash: 620e4a01
  kind: cards
  en: 'A divided GCC: Saudi Arabia and the UAE are rival poles, the UAE is aligned with Israel in a way Qatar is not, and the council''s wartime response differed by state (CRS); Qatar cannot count on a
    collective Gulf response.'
  it: ''
- hash: 7ce248da
  kind: cards
  en: 'The mediation that was meant to protect the state exposed it: hosting Hamas and negotiating hostages for Washington''s sake made Doha a place where Hamas leaders could be struck, and the 9 Sep 2025
    strike came while the Hamas delegation was discussing a US proposal in Doha. The price of neutrality was a bombing by a US ally.'
  it: ''
- hash: 09c4984e
  kind: cards
  en: 'Buying American protection made Qatar a target of America''s enemies: Al Udeid is why Iran fired at Qatar in June 2025 (and Iran says its attacks from 28 Feb 2026 target US interests, which Doha
    denies), while the same base did not stop an Israeli attack, so the shield attracted fire without preventing it.'
  it: ''
- hash: 58c5ae8e
  kind: cards
  en: 'The insurance with Iran turned into the injury: Qatar cultivated Tehran for decades and shares the world''s largest gas field with it, yet Iran struck Ras Laffan and a Qatari tanker, so the neighbour
    Doha courted took out 17% of its LNG capacity for years.'
  it: ''
- hash: 91aec110
  kind: cards
  en: 'Using the supply threat worked and hurt: the CSDDD threat (May and Oct 2025) won the removal of the climate-transition-plan duty, but the Hormuz closure then did what no regulation could, forcing
    European and Asian buyers toward US LNG (US LNG reached about 62% of Italy''s LNG mix in H1 2026) and exposing the single-exit weakness the threat had hidden.'
  it: ''
- hash: 2b8347cd
  kind: cards
  en: 'Influence bought with money produced a scandal: the lobbying and investment that gave Qatar standing in Brussels (Qatargate, Dec 2022) became an investigation that is still active in 2026 and weakens
    its case in the EU even as the EU opens partnership talks.'
  it: ''
- hash: bf5ae70a
  kind: cards
  en: 'Ties with everyone mean allies of no one: because Doha talks to Hamas, the Taliban, Iran, Russia and Israel, it is trusted by each as a channel and by none as an ally, so when attacked it got an
    Arab-Islamic summit that urged a ''review'' of Israel''s UN membership but, per the AP, agreed to little action.'
  it: ''
- hash: 1d1a0c36
  kind: cards
  en: 'Qatar runs the strategy of a rich micro-state that has no army to match its

    neighbours and therefore sells services in exchange for protection: gas to the

    world, mediation to the great powers, money to the weak, and a base to

    Washington. The strategy worked for thirty years because the bill was paid in

    influence rather than force; since June 2025 the bill has come due. Israel

    struck its capital with the United States on notice, Iran fired at it three

    times and took out a sixth of its LNG capacity, and Hormuz showed that the whole

    franchise exits through a single strait that the aggressor controls. The reply

    is a reconstruction of deterrence: a written US guarantee (EO 14353, a

    presidential order rather than a treaty), a Turkish tie, air defence that has

    now shot down aircraft, and a vocabulary of Gulf self-sufficiency that Doha

    shares with Abu Dhabi. Luttwak''s pattern is the paradoxical one: each asset that

    buys security (Al Udeid, Hamas as interlocutor, Iran as neighbour, LNG as

    leverage) is the one that draws the fire. Two signals that are not rows: Qatar

    refused in March 2026 to lead US-Iran mediation so that attacking it would not

    earn Tehran better terms, and returned to the table by August; and Doha is

    spending its mediation capital on the places where it still has leverage

    (Gaza, DRC, Ukraine''s children, Afghanistan) while the Iranian file belongs to

    Pakistan. The next test is whether the written guarantee holds and whether

    Hormuz reopens before buyers decide that Qatar is a risk to be hedged.'
  it: ''
- hash: 8594daf2
  kind: cards
  en: 'Keep the United States and NATO anchored on the Black Sea flank: US troops and bases (Mihail Kogalniceanu, Deveselu), US arms (F-35, Patriot, HIMARS) and a NATO command role in the Black Sea. Bucharest
    says it sees ''no risk'' of a US pullback from the eastern flank while the Pentagon has already ended the rotational brigade.'
  it: ''
- hash: 48d413cf
  kind: cards
  en: 'Keep Ukraine standing and the Black Sea open: Danube and Constanta as Ukraine''s export outlet, the Romania-Bulgaria-Turkiye mine-countermeasures group, joint drone production with Kyiv (declaration
    of 12 Mar 2026) and the National Defence Strategy 2025-2030 that names Russia''s hybrid war as the main threat.'
  it: ''
- hash: 7da7ad27
  kind: cards
  en: 'Stop the fiscal slide and stay inside the EU core: the deficit was 7.9% of GDP in 2025 (the EU''s highest) and every agency rates Romania one notch above junk with a negative outlook. EU money (recovery
    plan, SAFE loans of EUR 16.68bn) and the euro path depend on consolidation.'
  it: ''
- hash: ad19c2b2
  kind: cards
  en: 'Close the political door that foreign-boosted populism opened: the annulled 2024 election, the prosecution of Calin Georgescu, a governing majority that excludes the AUR party, and a new government
    after the May 2026 collapse (President Dan has nominated four prime ministers in five months).'
  it: ''
- hash: 835b54b1
  kind: cards
  en: 'Anchor Moldova in the West short of unification: the EU path, electricity and gas links, the trilateral with Chisinau and Kyiv (27 Aug 2026), a price cap on Romanian power sold to Moldova. Sandu
    says she would vote for unification but the polls do not give a majority and Bucharest does not pursue it.'
  it: ''
- hash: 11b97b06
  kind: cards
  en: 'Become a Black Sea energy hub rather than a transit corridor for Russian molecules: Neptun Deep (about 8 bcm a year, first gas planned for the first half of 2027), the Vertical Gas Corridor from
    Greece through Bulgaria, and the nuclear units at Cernavoda.'
  it: ''
- hash: e80ef7e2
  kind: cards
  en: 'Triangular diplomacy with Chisinau and Kyiv (the ''Odesa Triangle''), a strategic partnership with Turkiye (Dan, June 2026: extend it to undersea infrastructure and move the NATO Black Sea centre
    to Constanta), and NATO asks at the Ankara summit of 7-8 July 2026: rotating command of the Combined Task Force Black Sea from 2028, a NATO defence-bank office and a fuel pipeline into Romania.'
  it: ''
- hash: 52857f5c
  kind: cards
  en: 'Expulsions as signalling against Russia: the Russian consul in Constanta declared persona non grata and the consulate closed after a Russian drone hit a block in Galati on 29 May 2026; a Russian
    embassy official expelled and the ambassador in Moscow recalled on 27 Jul 2026 after three drones were shot down. Moscow answered each time in kind.'
  it: ''
- hash: b67b72f3
  kind: cards
  en: 'Hosting and buying: Mihail Kogalniceanu approved for US use in the Iran operation (11 Mar 2026), expansion of the base planned at about EUR 2.5bn, Deveselu Aegis Ashore, 32 F-35A ordered, F-16s that
