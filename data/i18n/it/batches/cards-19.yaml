  it: ''
- hash: c488e53e
  kind: cards
  en: Making itself indispensable to Washington has not bought a fixed garrison. Romania lent Kogalniceanu to the Iran operation within 24 hours (11 Mar 2026) and Rutte praised it on Fox News, Iran accused
    NATO of complicity (June 2026), yet the US had already pulled the rotational brigade (Oct 2025). The more Bucharest hosts, the more it exposes itself to Tehran without a guarantee of more US troops.
  it: ''
- hash: ab9ba353
  kind: cards
  en: Backing Ukraine pulls the war onto Romanian soil and the minority quarrel weakens the partner it needs. The Patriot donation, Danube transit and drone co-production make Romania a target (Galati,
