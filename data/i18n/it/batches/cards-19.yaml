    in Ukraine, a capped army, official status for Russian and the Moscow Patriarchate, sanctions lifted. The terms were set by Putin on 14 Jun 2024, repeated in Istanbul (May 2025), at Anchorage (Aug 2025),
    in Abu Dhabi and Geneva (Jan-Feb 2026), and have not moved.'
  it: ''
