  it: ''
- hash: 698cc936
  kind: cards
  en: 'Turn offshore gas into a place at Europe''s energy table: Aphrodite (Chevron, NewMed, Shell) and Cronos (Eni, TotalEnergies) through Egyptian pipelines and liquefaction, a final investment decision
