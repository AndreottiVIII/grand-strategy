# Translate every `en` into it. Write the translations to the file cards-18.out.yaml next to this one,
# as `items:` of `- hash: <same hash>` / `it: <translation>`, appending one item at a time (valid YAML at
# every step), never editing this file. Keep names, dates, numbers and quotes; register of a foreign-office
# brief: dry, precise, no flourish.
lang: it
items:
- hash: 9abe75a9
  kind: cards
  en: 'The Comprehensive Archipelagic Defense Concept and the Re-Horizon 3 modernisation (about PHP 2 trillion over ten years): coastal anti-ship missiles (three BrahMos batteries from India, USD 375m),
    FA-50 fighters (12 more ordered in June 2025), HD Hyundai frigates and offshore patrol vessels, Japanese radars and boats, and exercises that rise in scale (Balikatan 2026: 20 Apr-8 May, a Tomahawk
    fired from a Typhon at Tacloban; Alon 2025 with Australia: 3,600 personnel; Multilateral Maritime Cooperative Activities with Japan, the US and Australia).'
  it: ''
- hash: 9c84be41
  kind: cards
  en: 'Market opening as insurance: the July 2025 trade deal with Washington (19% tariff, zero tariff on US goods), the EU free-trade negotiation, a Vietnam partnership upgraded to ''enhanced strategic''
    in June 2026 (trade above USD 7bn), and the remittance river itself, which makes Manila a creditor of every labour market that employs Filipinos.'
  it: ''
- hash: 8bee234c
  kind: cards
  en: A capability gap that money has not closed. The Coast Guard and Navy face a Chinese coast guard of many times their number (12 Chinese coast-guard and three militia vessels at Scarborough on 24 Jul
    2026), and a large share of the armed forces' modernisation budget has sat in 'unprogrammed appropriations' that depend on surplus revenue.
  it: ''
- hash: d5a6b97f
  kind: cards
  en: The shield belongs to someone else. Washington's 2025 National Security Strategy omitted the Philippines and Trump seeks stable ties with Beijing, which Foreign Policy reads as a risk of emboldening
    China in the Philippine zone; at the same time the US took the 19% tariff of 2025 to 12.5% under Section 301 on 24 Jul 2026 (about 34% of Philippine exports to the US covered) over forced-labour import
    rules.
  it: ''
- hash: 633f9ef5
  kind: cards
  en: 'China is the first source of imports: 28.6% of Philippine imports in 2025 (USD 38.4bn, a bilateral deficit of USD 29bn) and 11% of exports. An economic counter-strike by Beijing would cost more than
    the Philippines could replace quickly.'
  it: ''
- hash: 6aa495ae
  kind: cards
  en: A weak president with a stronger rival. Marcos's trust fell to 28% (Pulse Asia, June 2026) or 34% (SWS, Q2 2026) while Sara Duterte holds 57-58%; the flood-control scandal reached his cousin and former
    House Speaker; Duterte-aligned candidates did well in the May 2025 Senate race. The vice president's father favoured accommodation with Beijing.
  it: ''
- hash: 817682b8
  kind: cards
  en: ASEAN consensus is thin. China has not agreed to join monthly Code of Conduct meetings, the draft lacks enforcement, and the July 2026 statement on the arbitral award was signed by 14 countries, none
    of them (on the report we read) another ASEAN member. Manila chairs a body that will not follow it all the way.
  it: ''
- hash: 83b1b25c
  kind: cards
  en: Workers abroad are both income and hostage. 2.19 million overseas workers (PSA, 2024) sent a record USD 35.6bn in 2025, 39.7% of it from the United States and 6.6% from Saudi Arabia; a US remittance
    tax, a Gulf crisis or a war over Taiwan, where many Filipinos work, would hit the budget of households and the room for manoeuvre of the state.
  it: ''
- hash: a18d50a2
  kind: cards
  en: The weapon of publicity undoes the secrecy a compromise needs. Manila announced a 'provisional arrangement' for Second Thomas Shoal in July 2024, Beijing described its terms in public (advance notice,
    inspection, no building materials), and in August 2026 the defence secretary said there was 'neither an agreement nor an understanding'. The arrangement has held for 13 resupply missions to March 2026,
    yet each side's account makes the other's version unacceptable at home.
  it: ''
- hash: 1d42b88c
  kind: cards
  en: The shield draws the thunderbolt. Typhon and NMESIS launchers on Luzon and in the Batanes, a Tomahawk fired from Tacloban in May 2026 and Marcos's own remark in August 2025 that the Philippines would
    be 'pulled into' any war over Taiwan make the islands a target and a theatre, exactly what the alliance is meant to avoid; the same Marcos still reaffirms the One China policy (Lazaro, 22 Jul 2026).
  it: ''
- hash: c354cfde
  kind: cards
  en: Chairing ASEAN to write a code with China while building coalitions against it. A Code of Conduct needs Beijing's signature, and Beijing is unlikely to give the chair a political victory; meanwhile
    Manila's bilateral pacts and its 14-country statement bypass the consensus on which ASEAN lives. The two shields, regional law and allied force, pull in opposite directions, and CSIS expects the allied
    one to carry the weight.
  it: ''
- hash: aa53e41a
  kind: cards
  en: Prosecuting the past strengthens the camp that would reverse the present. The arrest of Rodrigo Duterte for the ICC (March 2025) and the confirmation of charges (23 Apr 2026) delivered justice, but
    Duterte-aligned candidates did well in May 2025, his daughter leads the trust ratings at 57-58%, and the Senate verdict decides whether she can run in 2028. A foreign policy built on the 2016 award
    depends on a result in 2028 that the policy's own domestic costs make less likely.
  it: ''
- hash: e35b6f0b
  kind: cards
  en: A country that exports its people has hostages in every theatre. Marcos gave 'the large number of Filipinos in Taiwan' as a reason the Philippines could not stay out of a Taiwan war, and in 2018 and
    2023 the Kuwait labour disputes showed that diplomacy toward a host state is bargaining over workers' lives. The remittance base that stabilises the economy is also the lever any adversary or host state
    can pull.
  it: ''
- hash: 06b7b427
  kind: cards
  en: 'The Philippines is a small naval power in a contest it cannot win by force and has

    chosen not to fight by force. Its answer is two instruments of the weak: exposure

    as the weapon (every Chinese act is filmed, dated and protested, so the grey zone

    that Beijing chose in order to stay below the level of war becomes a legal and

    reputational ledger) and alliance as the shield (a treaty of 1951 read to cover

    coast-guard ships, nine sites, missile batteries, and since 2025 a ring of

    visiting-forces agreements that makes the shield plural). Luttwak''s logic shows

    in the price of each. Transparency cannot be switched off for a compromise, so the

    2024 understanding at Second Thomas Shoal is disowned at home even as it holds;

    and the shield turns the archipelago into a forward base whose missiles, Marcos

    admits, would pull the country into a Taiwan war. The alliance is also a bet on

    two presidents: Washington''s (a 2025 strategy that forgot Manila, a tariff moved

    to 12.5% over forced labour) and Manila''s own, because the foreign policy

    depends on a government whose trust rating is 28-34% against a vice president

    at 57-58% whose family prefers accommodation with Beijing. Hence China is graded

    rival, not adversary: no side seeks the other''s end, Lazaro protests and talks in

    the same week, and 28.6% of imports still come from China. Signals that are not

    rows: the Philippines'' own defence secretary denying an understanding the foreign

    ministry announced; and a Code of Conduct that Manila chairs toward and doubts.'
  it: ''
- hash: 92e83eed
  kind: cards
  en: Keep the Taipei tie and refuse Beijing's price for switching. Palau is one of three Pacific states that still recognise Taiwan; President Whipps has said officials promised large gains if Palau dropped
    Taipei, and Beijing offered a million visitors in 2020.
  it: ''
- hash: 66e3719f
  kind: cards
  en: 'Keep the US tie that pays and protects: the Compact of Free Association, renewed by 2023 agreements that Congress enacted in March 2024 with US$889 million for Palau over 20 years through 2043, and
    the US military access Palau hosts, including the radar agreed in 2022.'
  it: ''
- hash: 9f3c2353
  kind: cards
  en: 'Lead the Pacific agenda from its own Forum meeting: Palau hosted the 55th Pacific Islands Forum Leaders'' Meeting, 31 August to 3 September 2026, and Australia''s prime minister came with a support
    package for the host.'
  it: ''
- hash: 95884c2c
  kind: cards
  en: 'Recognition as a card. Taipei''s ties give Palau standing with Taiwan and a bargaining chip with Beijing: on 2 September 2026 Taiwan''s foreign minister signed a joint statement in Palau with the
    leaders of Palau, the Marshall Islands and Tuvalu, pledging closer cooperation.'
  it: ''
- hash: dbd8b825
  kind: cards
  en: 'US military access. An Air Force over-the-horizon (TACMOR) radar that Palau agreed to host in 2022, expected to be operational in 2026, and US exercises from Palau: Valiant Shield in 2022 brought
    the first US Patriot launch on Palau and an experimental A-10 deployment at Roman Tmetuchl airport.'
  it: ''
- hash: 0897e62e
  kind: cards
  en: 'Tourism and China. Tourism is about 40% of GDP (AP, 2024; an RNZ report of the same year says more than half: the conflict is kept, the AP figure is used). Chinese visitors halved in 2024 and were
    back as the top market in 2025 (19,060 of 57,370 arrivals, January to October), so a market Beijing can switch on and off is also the one the economy needs.'
  it: ''
- hash: 7d0d6aad
  kind: cards
  en: Money from Washington is a budget decision, not a fixed right. The 2023 review agreements give US$889 million over 20 years through 2043, and the Interior release itself says both 'would provide'
    and 'will provide'.
  it: ''
- hash: 514b4b18
  kind: cards
  en: Refusing to trade Taipei for tourism leaves the economy exposed to the market Beijing switches off. The 2024 pressure halved the Chinese visitors that tourism needs, and the same market was back as
    the top source in 2025, so the lever is one Beijing can pull again.
  it: ''
- hash: c34bcf4f
  kind: cards
  en: 'Palau holds three cards out of proportion to its size: a Taipei recognition that Beijing wants, a US Compact and military access that Washington needs in the western Pacific, and the Forum meeting
    it hosted in 2026. Its money comes from Washington under the Compact and from tourists, a large share of them Chinese, so the government that refuses Beijing''s price depends on Beijing''s visitors.
    The paradox sits at the centre of the card: the cards that keep Palau''s standing with Washington and Taipei are the ones that expose its economy to Beijing''s pressure.'
  it: ''
- hash: 3120c9be
  kind: cards
  en: Turn LNG and minerals into state revenue. Papua LNG (capital cost about US$14 billion, final investment decision targeted for Q4 2026 after slipping in 2020, 2024 and 2025) and the Ramu nickel mine
    are both run by foreign operators; the state holds its equity through Kumul Petroleum Holdings and MRDC.
  it: ''
- hash: d6169127
  kind: cards
  en: Keep Bougainville inside the state while managing a peaceful transition. The 2019 referendum gave independence about 98 per cent of the votes; in August 2026 parliament postponed its vote on the result,
    and the Bougainville government plans a transition from 1 September 2027 with full independence in 2030.
  it: ''
- hash: a38a044c
  kind: cards
  en: 'Buy security from partners who take a limited share of control: the Pukpuk mutual defence treaty with Australia (6 Oct 2025), US access to six defence facilities under the 2023 agreement, and no
    Chinese security pact (ruled out in 2024).'
  it: ''
- hash: f5e5998f
  kind: cards
  en: 'Resource rents and state equity: state companies hold stakes in the LNG venture alongside ExxonMobil as operator; Chinese capital owns and runs the Ramu nickel and cobalt mine, China''s largest ongoing
    project in the country.'
  it: ''
- hash: ca61d307
  kind: cards
  en: 'Balancing by sector: traditional partners for security, China for the economy. As the CRS report records it, PNG works with its traditional security partners for security and with China for the economy.'
  it: ''
- hash: b766d080
  kind: cards
  en: 'Alliance access: the Pukpuk treaty gives mutual defence with Australia; the 2023 Defence Cooperation Agreement gives US forces unimpeded access to six PNG facilities, including the Lombrum naval
    base on Manus.'
  it: ''
- hash: ad10c46e
  kind: cards
  en: 'Dependence on the partners it is balancing: the 2025 US aid cuts hit health and climate projects, and Australia has had to fill gaps. The NRL franchise (about A$600 million over ten years) is reported
    as contingent on Australia staying PNG''s first security partner over China.'
  it: ''
- hash: 20aaccb5
  kind: cards
  en: 'Bougainville cannot be settled by the executive alone: parliament must vote on the 2019 result, the threshold is contested (the government argues for two-thirds or three-quarters of MPs, the Bougainville
    government for a simple majority), and the governing coalition''s count of 89 MPs has not been reached. The vote was postponed in August 2026.'
  it: ''
- hash: ec2a9d29
  kind: cards
  en: 'Project risk on the main asset: Papua LNG has no final investment decision yet, its financing depends on more than 60 per cent project debt (Santos''s target), and operatorship moves from TotalEnergies
    to ExxonMobil.'
  it: ''
- hash: fe5d5502
  kind: cards
  en: The Pukpuk treaty bars arrangements with third parties that would undermine it, yet the Ramu nickel mine, China's largest ongoing project in the country, is the foreign money the state can least easily
    refuse, because the economy depends on it.
  it: ''
- hash: 84469c03
  kind: cards
  en: 'Papua New Guinea buys security from its partners (a mutual defence treaty with Australia in 2025, access for US forces since 2023) while its economy stays in foreign hands: LNG and nickel are run
    by foreign operators, and Chinese money finances the mines. The central constraint is Bougainville, whose independence can only be decided by a national parliament that has not yet voted. Not yet sourced
    in this first pass: tribal violence, state capacity, the Solomon Islands, Fiji, the Philippines, New Zealand, and the Ukraine and Gaza positions.'
  it: ''
- hash: 6592c1fb
  kind: cards
  en: 'Deter Russia and, if deterrence fails, hold the line: the highest defence effort in NATO (4.3% of GDP in 2025, a 2026 budget planned at 4.8%), the East Shield fortification of about 700 km of the
    Belarus and Kaliningrad borders by 2028, and the kit to fight (Abrams, K2, HIMARS, F-35, Patriot). The president calls Russia the main threat to Poland and to Central Europe, also after the war in Ukraine.'
  it: ''
- hash: 66ed7750
  kind: cards
  en: 'Keep the United States in Poland, in larger and more permanent form: about 10,000 US troops on rotation, a Trump promise (21 May 2026) of 5,000 more after a rotation was cancelled, talk of a permanent
    US Army base (the old ''Fort Trump'' idea), and, for the presidency, entry into NATO nuclear sharing.'
  it: ''
- hash: 8de7df4e
  kind: cards
  en: 'Keep Ukraine standing as the buffer without paying for it in Polish domestic politics: the Rzeszow hub, about EUR 5.9bn of aid (Kiel, April 2026), the Ukraine Recovery Conference in Gdansk (25-26
    June 2026) - but no Polish troops in Ukraine, an indefinite ban on Ukrainian grain and a hard line on Volhynia.'
  it: ''
- hash: d1895f64
  kind: cards
  en: 'Be a core player in the EU, not its rule-of-law problem, and turn EU money into defence capacity: up to EUR 137bn of frozen funds released after the Article 7 case was closed (May 2024), the 2025
    Council presidency under the slogan ''Security, Europe!'', the largest SAFE allocation (EUR 43.7bn) and the largest share (over EUR 123bn) of the Commission''s 2028-34 budget proposal.'
  it: ''
- hash: aa183567
  kind: cards
  en: 'Re-insure inside Europe while the American guarantee looks personal: a bilateral defence agreement with Germany (17 Jun 2026, joint Baltic command), a French-Polish treaty and talks on French nuclear
    deterrence, the revived Visegrad format - while keeping the German war-compensation claim alive.'
  it: ''
- hash: 35bf9ada
  kind: cards
  en: 'Rebuild the energy base without Russia and without a dependency on one supplier: Baltic Pipe and LNG for gas, a first nuclear plant (Westinghouse AP1000, about 3.75 GW, state aid cleared by the Commission
    in December 2025) and a coal share in power that fell to about 52% in 2025 with no phase-out date.'
  it: ''
- hash: 3fc63e00
  kind: cards
  en: 'Two diplomatic channels run in parallel and sometimes against each other: the Tusk-Sikorski government works Brussels, Berlin, Paris and the revived V4, while President Nawrocki and his adviser Przydacz
    work Washington (White House 3 Sep 2025, Trump''s UFC dinner 14 Jun 2026). The government also signs smaller texts it expects the president to accept (the German defence agreement was scaled down for
    that reason).'
  it: ''
- hash: cc920863
  kind: cards
  en: 'Public attribution as a weapon: after the Warsaw-Lublin railway blast (Nov 2025) Warsaw named Russian intelligence and called it ''state terrorism'', closed the last Russian consulate (Gdansk), and
    in September 2026 Tusk disclosed, citing NATO, Ukrainian and US intelligence, that Russia plans hybrid drone and missile strikes on Ukraine''s allies.'
  it: ''
- hash: 647c8f2a
  kind: cards
  en: 'The largest military build-up in NATO in relative terms: record budget, East Shield engineering (60 km secured in 2025, 100 km by mid-2026, nearly 300,000 concrete ''hedgehogs'' due in the north
    and east by mid-October 2026), German engineers on the line since 22 Jun 2026, Eastern Sentry air policing after the 9-10 Sep 2025 drone incursion, and a border with Belarus closed or limited at will.'
  it: ''
- hash: 2a6161eb
  kind: cards
  en: 'Defence purchasing as industrial and alliance policy: US kit (Abrams, F-35, Patriot, HIMARS) to bind Washington, South Korean K2 tanks with local production (second contract USD 6.5bn, 1 Aug 2025)
    to buy speed, and EU SAFE loans (EUR 43.7bn, about 3% over 45 years) of which most is meant to stay with Polish firms.'
  it: ''
- hash: d3bf766f
  kind: cards
  en: 'Trade and border measures as leverage: the unilateral ban on Ukrainian grain (kept after the updated EU-Ukraine trade deal took effect), the 12-25 Sep 2025 closure of every Belarus crossing (which
    also stopped China-Europe rail at Malaszewicze), and the suspension of the right to asylum at the Belarus border since 27 Mar 2025.'
  it: ''
- hash: efec9bfd
  kind: cards
  en: 'Cohabitation. The president holds the veto and a rival foreign policy: he blocked the SAFE implementing bill (12 Mar 2026), vetoed the first law on aid to Ukrainians (Aug 2025), and the government
    now drafts texts it expects him to reject. The next parliamentary election is due in 2027 and every Ukraine, Germany or EU measure is priced against it.'
  it: ''
- hash: c04dc5f1
  kind: cards
  en: Money. A 2026 defence budget of about PLN 200bn (4.8% of GDP) comes with a deficit forecast near 7% of GDP and a Moody's downgrade cited by the press; the cash comes from EU debt (SAFE) that part
    of the political class rejects.
  it: ''
- hash: 6af283e9
  kind: cards
  en: 'Dependence on the United States for what Poland cannot yet make: the nuclear umbrella, Patriot batteries, F-35s, and about 10,000 troops whose rotation was cancelled and then restored in May 2026
    by presidential post, with the Pentagon reportedly learning of it from the post.'
  it: ''
- hash: f70d3d21
  kind: cards
  en: Geography. The Suwalki gap (about 65 km between Kaliningrad and Belarus) is the only land link to the Baltic states; Poland borders both Kaliningrad and Belarus, and the alliance's reinforcement route
    runs through its territory.
  it: ''
- hash: 48dd11b7
  kind: cards
  en: 'Memory politics. Volhynia (1943-45) and the Second World War limit what any government can give Kyiv or Berlin: 51.9% of Poles say the UPA naming row hurt their view of Ukraine, the grain ban is
    tied to the 2027 election, and the German compensation claim cannot be dropped without a visible German gesture.'
  it: ''
- hash: 2f775834
  kind: cards
  en: Energy structure. Poland is the EU's most coal-dependent member state and has no phase-out date; hard coal still supplied about a third of power in 2025 and the first nuclear unit is not due before
    the mid-2030s, so carbon pricing (ETS2) is a standing quarrel with Brussels.
  it: ''
- hash: 5e60edac
  kind: cards
  en: Spending to be safe makes Poland financially exposed. A defence budget of 4.8% of GDP on top of a deficit near 7% is paid for by the EU's SAFE loans - the very mechanism the president, who wants American
    weapons, vetoed in March 2026. The money that makes the army credible depends on an institution half of the state distrusts.
  it: ''
- hash: d5bf63ca
  kind: cards
  en: 'Sealing the Belarus border protects against Zapad-2025 and hybrid migration but hurts friends and feeds the adversary''s narrative: the September 2025 closure stopped the China-Europe rail trade
    that runs through Malaszewicze (Beijing complained to Nawrocki in person) and the asylum suspension, in force since March 2025, is criticised by UNHCR and Poland''s own human-rights commissioner - while
    Warsaw asks the EU for solidarity and money for the same border.'
  it: ''
- hash: ad43bbf9
  kind: cards
  en: The loudest friend of Ukraine weakens the coalition it needs. Poland is the hub of the war and gives about 1% of GDP, yet the grain ban, the cut in child benefits for non-working Ukrainians and the
    Volhynia quarrel (the Order of the White Eagle stripped from Zelensky, May 2026) cost it goodwill in Kyiv and handed Moscow a talking point that Tusk himself called 'a gift to Putin'.
  it: ''
- hash: 9722e2c6
  kind: cards
  en: Betting on Trump personally and on Europe at once. The presidency's strategy (Washington first, US nuclear sharing, scepticism of SAFE's 'buy European' rule) and the government's (Europeanised defence,
    French deterrence, the German pact) pull in opposite directions, so Poland cannot speak with one voice to either guarantor, and the American rotation was cancelled and then restored by a presidential
    post that credited Nawrocki's friendship.
  it: ''
- hash: d2dcd442
  kind: cards
  en: Keeping the German reparations claim alive while needing Germany as the only partner that can supply engineers, a Baltic command and money at scale. Berlin calls the matter closed; Tusk presses for
    compensation of living victims; the defence agreement of 17 June 2026 contains no mutual-defence guarantee and was scaled back in anticipation of presidential opposition.
  it: ''
- hash: 135252dd
  kind: cards
  en: 'Putting war politics above judicial cooperation undercuts the rule-of-law credit Poland has just rebuilt: a Warsaw court refused (Oct 2025) to extradite the Nord Stream suspect, calling the attack
    a military action in a ''just war'', and Tusk welcomed it, about a year after rule-of-law conditionality unlocked EUR 137bn for Poland. Berlin chose not to challenge the ruling, but the pattern (the
    asylum suspension is another) makes it harder to ask the EU to treat Poland''s eastern border as Europe''s.'
  it: ''
- hash: 89c20938
  kind: cards
  en: 'Poland is a frontline state that has turned geography into rank: it spends the most in NATO, hosts about 10,000 US troops and the logistics hub of the Ukraine war, and treats Russia not as a rival
    but as the standing threat. Its grand strategy is a double reinsurance. The Atlantic leg (American troops, F-35s, Patriot, hopes of a permanent base and of nuclear sharing) is run mostly by President
    Nawrocki; the European leg (SAFE money, the German pact, French deterrence talks, a revived Visegrad) is run by Tusk''s government. They are complementary on paper and rivalrous in practice, and the
    Luttwak logic bites exactly there: the more Warsaw tries to be everyone''s indispensable ally, the more each guarantor discounts a promise that two offices make differently. The same logic runs through
    its neighbours. Poland needs Ukraine standing but taxes it with grain bans and Volhynia; it needs Germany but keeps a reparations claim; it seals the Belarus border and in doing so cuts the Chinese
    rail traffic that crosses it. The grade of Russia is ''adversary'' rather than ''rival'' because Warsaw''s own officials call Russian sabotage state terrorism and Russia the main threat to Poland and
    Central Europe, and because the Kremlin itself says relations have ''deteriorated completely''; against that, Poland has no aim of regime change in Russia, which is why the grade carries confidence
    B and not A. Ukraine is a ''reluctant ally'' - indispensable, aligned by necessity, with an open historical wound - and Belarus a ''rival'' that is warming only because Washington brokered a prisoner
    swap. The central uncertainty is what Poland is in 2027: a country whose security depends on a US president''s mood, or one that has bought, built and borrowed enough to depend on itself.'
  it: ''
- hash: 72637e08
  kind: cards
  en: Regime survival under a nuclear deterrent that is declared irreversible, and recognition of the country as a nuclear-weapon state. Kim told the Supreme People's Assembly on 21 Sep 2025 that there
    can 'never, under any circumstances' be denuclearisation; the Ninth Party Congress (February 2026) wrote the status into party policy and the nuclear command into the 2026 constitution; on 13 Jun 2026
    Pyongyang called the arsenal 'irreversibly finalized'.
  it: ''
- hash: e6033efd
  kind: cards
  en: 'Turn military usefulness into money, food, fuel and technology: troops, shells and missiles for Russia''s war, and keep China''s trade lifeline open at the same time. Russia is now the second patron,
    the one that pays; China remains the one that feeds the economy (98% of official trade in 2024).'
  it: ''
- hash: 6edebe9e
  kind: cards
  en: 'Close the Korean question on Pyongyang''s terms: no reunification, no dialogue, South Korea a separate ''most hostile'' state. The doctrine announced in December 2023 and January 2024 is now in the
    constitution (March 2026, territory defined as bordering South Korea, all unification wording removed) and on the ground (roads and rails cut, fences, mines and a cleared strip along the line).'
  it: ''
- hash: 61c7abd9
  kind: cards
  en: 'Rebuild the civilian economy outside Pyongyang while keeping the party''s control: the 2026-2030 five-year plan (manufacturing, power, the ''20x10'' regional factories and hospitals). The Bank of
    Korea counts 3.5% growth in 2025, the third year above 3%, with output above its 2017 (pre-sanctions) level.'
  it: ''
- hash: e26cefd3
  kind: cards
  en: 'Hand the dynasty on: South Korea''s intelligence service said on 12 Feb 2026 that Kim Ju Ae had entered a ''successor-designation stage'' (a year earlier: ''successor training''); she was at his
    side in Beijing in September 2025. No formal title has been reported.'
  it: ''
- hash: '97627404'
  kind: cards
  en: 'Keep both patrons competing for it and avoid the single-patron trap: stage the September 2025 Beijing parade with Xi and Putin, receive Vietnam''s and Laos''s leaders in October 2025, and receive
    Xi in Pyongyang (8-9 Jun 2026) after Beijing had cooled in 2024.'
  it: ''
- hash: 9db46e5e
  kind: cards
  en: 'A mutual-assistance treaty with Russia (19 Jun 2024, ratified 6 Nov 2024) used in earnest, a summit with Putin and one with Xi in Beijing on 3-4 Sep 2025, Xi''s state visit in June 2026, and a wide
    guest list for the party''s 80th anniversary (Vietnam''s To Lam, Laos''s Thongloun, Chinese and Russian envoys). Toward Washington: conditional openness (Kim ''still has a good memory'' of Trump, talks
    if denuclearisation is dropped); toward Seoul: refusal of all contact.'
  it: ''
- hash: ff1f51b8
  kind: cards
  en: 'State media as the instrument of doctrine: the SPA speech of September 2025, the Party Congress report, the constitutional text; and staging, such as the confirmation of the Kursk deployment on 28
    Apr 2025 with the soldiers called ''heroes'', and a unit carrying North Korean and Russian flags at the February 2026 parade. KCNA is cited here only for what Pyongyang says.'
  it: ''
- hash: a65c0ef3
  kind: cards
  en: 'The arsenal as the product and the shield: about 60 warheads on a March 2026 estimate (Trump says 57), a new enrichment plant shown to the world on 3 Jun 2026 (third disclosed site), the solid-fuel
    Hwasong-20 ICBM shown at the 10 Oct 2025 parade after a last engine test on 8 Sep 2025 (no flight test reported), ''nuclear trigger'' command structure, and a steady 2026 tempo of short-range tests
    (11 suspected ballistic launches by August). In Russia: the Kursk expeditionary force (about 11,000 at the start of 2026) and a missile unit in Voronezh.'
  it: ''
- hash: 0c26acbf
  kind: cards
  en: 'Four earners outside normal trade: arms and troops for Russia (USD 10-14bn in cash, oil, food and technology on Bloomberg''s count), cryptocurrency theft (at least USD 2.02bn in 2025, of which the
    Bybit heist of 21 Feb 2025, about USD 1.5bn, attributed by the FBI to the Lazarus/TraderTraitor cluster), workers abroad (MSMT: up to USD 800m a year; up to 25,000 in Russia''s drone industry) and IT
    workers posing as freelancers (about USD 800m in 2024 on Treasury''s count). Plus the legal base: China, USD 2.7bn of two-way trade in 2025.'
  it: ''
- hash: ae47ed4c
  kind: cards
  en: One trading partner. China accounted for 98% of official trade in 2024 and USD 2.7bn in 2025 (up 25%), and no other partner can replace it. Beijing used the dependence in 2024 (trade fell 5%, high-level
    contact thinned while Pyongyang turned to Moscow) and reasserted itself with the June 2026 state visit.
  it: ''
- hash: cf057aa7
  kind: cards
  en: The Russian windfall is tied to the war. The payments, the oil above the UN cap, the technology and the market for shells all depend on Russia still needing them; the troops pay in blood (Seoul counted
    about 4,700 casualties by April 2025, Kyiv more than 7,000 in 2024-25), and the deployment is Moscow's to extend or stop.
  it: ''
- hash: 9f55f824
  kind: cards
  en: A weak domestic base behind the headline growth. The won has lost about three-quarters of its value against the dollar since May 2024 and rice prices rose 5.2 times between May 2024 and May 2026;
    exports of USD 4.7bn in 2025 are under 0.1% of South Korea's, and the country's income is under 2% of the South's.
  it: ''
- hash: de427f66
  kind: cards
  en: The sanctions regime is weakened but not gone. The Security Council resolutions stay in force; Russia's veto of 28 Mar 2024 (China abstaining) ended the UN Panel of Experts, but eleven states set
    up the Multilateral Sanctions Monitoring Team in October 2024, which has reported on Russia-DPRK arms transfers (May 2025) and cyber links (October 2025), and the US keeps designating IT-worker and
    laundering networks (12 Mar 2026).
  it: ''
- hash: 781889c1
  kind: cards
  en: Nobody recognises the nuclear status. Washington's reply to the June 2026 enrichment plant was 'deeply troubling' and a restatement of 'complete denuclearization'; the US-South Korea Nuclear Consultative
    Group met for the sixth time on 11 Jun 2026; Seoul and Tokyo have built deterrence around the arsenal (Freedom Edge, Japan's lead in the sanctions monitoring team).
  it: ''
- hash: dcdf5682
  kind: cards
  en: 'A succession with no adult heir: the designated successor is about 13 and has no reported title, so the system depends on Kim''s own health and on a Party Congress that replaced more than 40% of
    senior officials and promoted his sister Kim Yo Jong to head the Central Committee''s general affairs.'
  it: ''
- hash: afa94547
  kind: cards
  en: Selling usefulness to Russia raises North Korea's price and ties its fortune to a war it does not control. The treaty, the troops and the shell trade bought food, oil, cash and technology and ended
    the diplomatic quarantine, but every item on the receipt falls due only while Moscow needs them; a ceasefire in Ukraine ends the windfall while leaving the troops' losses, the sanctions and the dependence
    on China intact.
  it: ''
- hash: d5812e0d
  kind: cards
  en: 'Leaning on Russia to dilute China''s weight made China court it back. The 2024 distance from Beijing (trade down 5%) ended in the September 2025 parade, a record 2025 trade year and Xi''s visit in
    June 2026, whose stated aim, per analysts, is to keep Pyongyang from drifting toward Moscow: the Russian card bought Kim a competition between patrons, but also a Chinese attempt to re-establish itself
    as ''the principal actor'' in the North.'
  it: ''
- hash: 7b2f2e41
  kind: cards
  en: A deterrent declared irreversible leaves nothing to trade. Washington is told that talks are possible only if it accepts the arsenal, so the sole thing sanctions relief could buy, the arsenal's reduction,
    is withdrawn from the table; meanwhile each new disclosure (Hwasong-20, the June 2026 enrichment plant) strengthens the Seoul-Washington-Tokyo deterrence that the weapon was supposed to make unnecessary.
  it: ''
- hash: 5a29b312
  kind: cards
  en: Cutting Korea in two removes the argument that justified the northern state. A regime founded on the claim to be the true Korea now writes 'South Korea' into its constitution as a neighbouring state,
    and Seoul's unification ministry has answered with a 'peaceful two-state' policy (white paper of May 2026) that accepts the division without paying for it; the fortified line itself produces incidents
    (mines on 21 Sep 2026, some 30 line crossings in September on Seoul's count).
  it: ''
- hash: 754922b7
  kind: cards
  en: Killing the UN panel created a stronger monitor. Russia's veto of March 2024 freed Pyongyang from a body that needed Chinese and Russian consent, but the eleven states that built the Multilateral
    Sanctions Monitoring Team in response answer to no veto, name the Russia-DPRK arms trade and the cyber networks, and feed Treasury's designations.
  it: ''
- hash: aef46413
  kind: cards
  en: The money that keeps the state alive is the money that most exposes it. Crypto theft (USD 2.02bn in 2025), workers on student visas and IT freelancers are sanctions-evasion by design, so the more
    they yield, the more the US, Japan, South Korea and the monitoring team concentrate on them; Treasury's 12 Mar 2026 designations reached facilitators in Vietnam, Laos and Spain, countries Pyongyang
    courts.
  it: ''
- hash: d70d38cf
  kind: cards
  en: 'North Korea is Luttwak''s small adversary that became useful to a great power and

    sold its usefulness dear. For thirty years its strategy was survival by

    nuisance: weapons as the one asset a poor, sanctioned state could produce. The

    war in Ukraine gave that asset a buyer. Since the treaty of June 2024 Kim has

    turned shells, missiles, labour and an expeditionary force into cash, fuel,

    food and technology, escaped the diplomatic quarantine, and made both Moscow

    and Beijing court him. He has also removed the questions that used to bind

    him: the UN panel is gone, denuclearisation is struck from every agenda,

    reunification is struck from the constitution, and the Party Congress of

    February 2026 wrote the status into policy. Pyongyang no longer asks to be

    admitted to the order; it asks that the arsenal be accepted as a fact. The

    paradoxes are all of one kind. Each success rests on a patron''s need, not on

    a strength of Pyongyang''s own: the Russian income ends with the war, the

    Chinese trade ends when Beijing chooses, the nuclear status leaves nothing to

    bargain with, and the sanctions workaround turns the cyber and labour

    earners into the targets of a coalition that no veto can dissolve. Two

    signals that are not rows: the Ninth Congress''s work report did not mention

    Russia or China, and Kim has not met a US president since 2019 while Trump

    keeps saying he will. The open question for 2027 is whether the same hand can

    manage the end of the Russian war, a Trump offer that asks for the arsenal,

    and a thirteen-year-old heir.'
  it: ''
- hash: 92b1c615
  kind: cards
  en: 'Stay inside the two Western anchors at once - the EU (money, market, voice) and NATO with the United States (hard security) - and avoid being forced to pick: Lisbon authorised US use of Lajes for
    the 2026 Iran war on conditions, said it ''did not take part'', and told Washington that ''unconditional'' support is a misplaced word.'
  it: ''
- hash: 808ce174
  kind: cards
  en: 'Keep EU money and the single market flowing: finish the Recovery plan (PRR) by its 31 Aug 2026 deadline, protect cohesion funds in the 2028-34 budget (Montenegro has threatened to oppose a budget
