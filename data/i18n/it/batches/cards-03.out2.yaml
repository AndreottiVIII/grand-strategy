items:
- hash: fc689da4
  it: |
    Denaro e politica: un bilancio della difesa pari al 5,43% del PIL con un deficit del 4,5%, mentre la coalizione Reform-Eesti 200 è accreditata del 12% (minimo storico, maggio 2026) in vista delle elezioni parlamentari del 2027; i partiti di opposizione (Isamaa, Centre, SDE, EKRE) sono tutti sopra Reform nei sondaggi.
- hash: 0f1a6e18
  it: |
    Guerra su ogni fronte contemporaneamente: il TPLF nel Tigray e nell'Afar, Fano nell'Amhara, l'OLA nell'Oromia, l'ONLF, i movimenti Afar, Benishangul e Gumuz, tutti riuniti in un'unica alleanza il 20 settembre 2026; i droni dell'alleanza avrebbero colpito siti militari ad Addis Abeba il 1° ottobre (non confermato da Reuters). Un mandato ottenuto a giugno con 438 dei 486 seggi in palio (547 in totale), senza voto nel Tigray (Al Jazeera).
- hash: '33964692'
  it: |
    Senza sbocco al mare: Gibuti ha gestito il 96,7% del traffico merci esterno dell'Etiopia nell'esercizio 2025/26 (17,57 milioni di tonnellate), e la strada e la ferrovia Addis Abeba-Gibuti lo trasportano; ogni alternativa (Berbera, Tadjoura, Lamu) è marginale. Lo Stato che vuole porre fine alla dipendenza non può permettersi di offendere Gibuti.
- hash: 8655a05d
  it: |
    Il debito è ristrutturato, non estinto: il default del 2023, l'accordo da 8,4 miliardi di USD con i creditori ufficiali nel 2025, uno scambio di Eurobond ancora preliminare e le condizioni dell'IMF (eliminazione graduale dei sussidi al carburante, nessun prestito non agevolato eccetto Koysha, ristrutturazione del debito da completare in buona fede con i creditori), che non lasciano spazio a un'economia di guerra.
- hash: c2470101
  it: |
    Il Corno d'Africa si sta organizzando contro questa pretesa: Egitto, Eritrea, Sudan e Somalia hanno dichiarato il 4-5 ottobre 2026 che il Mar Rosso è «the exclusive responsibility of its coastal states», hanno respinto ogni sostegno al Somaliland e le misure unilaterali che danneggiano gli usi del Nilo di Egitto e Sudan; il contingente egiziano nella AUSSOM (1.091 militari) e i siti segnalati in Eritrea raggiungono i fianchi dell'Etiopia.
- hash: b8e3b5e2
  it: |
    I patroni sono divisi o distratti: Riad e Abu Dhabi sono rivali e Riad ha indicato l'Etiopia tra i luoghi in cui operano aerei emiratini; l'Egitto è il principale creditore dell'UAE; Washington ha tagliato gli aiuti (l'Etiopia era il primo beneficiario USAID nell'Africa subsahariana), ha visitato Il Cairo, Mogadiscio e Asmara nel luglio 2026 senza Addis Abeba e secondo quanto riferito starebbe valutando un allentamento delle sanzioni all'Eritrea.
- hash: 5dedbfe2
  it: |
    Carico umanitario e aiuti deboli: fino all'80% della popolazione del Tigray ha bisogno di sostegno d'emergenza dopo i tagli agli aiuti (WFP), più di 100.000 sud-sudanesi sono fuggiti a Gambella nel 2026 (UNHCR), e la nuova guerra ha sfollato decine di migliaia di persone nell'Afar.
- hash: d012ea7c
  it: |
    Definire l'accesso al mare come diritto esistenziale ha richiamato la stessa coalizione che lo chiude. La richiesta di Abiy ha trasformato l'Eritrea in un nemico dichiarato (Asmara ha definito la lettera dell'Etiopia all'UN una «declaration of war» e teme per Assab) e ha unito la ferita aperta dell'Egitto sul Nilo alla paura dell'Eritrea e della Somalia per le proprie coste: il vertice di El Alamein del 4 ottobre 2026, il giorno prima che Abiy ripetesse la richiesta in parlamento, inserisce il principio «coastal states only» in un testo a quattro. Una potenza senza sbocco al mare non può ottenere un porto trasformando ogni Stato costiero in un vicino armato.
- hash: 2c37e335
  it: |
    La pace separata che ha chiuso una guerra ha creato la coalizione per la successiva. Pretoria (2 novembre 2022) ha sostituito l'alleato eritreo del 2020-22 con il TPLF; Asmara, esclusa dall'accordo e a lungo ostile al TPLF, è ora accusata da Addis Abeba di finanziare, armare e dirigere i gruppi armati – il TPLF che Pretoria doveva pacificare, ora alleato di Fano e dell'OLA – che combattono il governo (l'Eritrea smentisce; l'accusa non è verificata). Fare la pace con un nemico ha trasformato l'antico alleato in un sospettato e ha lasciato una coalizione degli esclusi.
- hash: 52754d6e
  it: |
    Il completamento della GERD ha spostato la pressione dell'Egitto dal Nilo al Corno d'Africa. L'acqua non è più una leva una volta che la diga è piena; la leva sono diventati i fianchi dell'Etiopia: il patto con la Somalia, le truppe AUSSOM, l'Eritrea, il Sudan. L'annuncio, nel marzo 2026, di altre tre dighe sul Nilo Azzurro ha fatto capire al Cairo che la cascata di dighe sarebbe proseguita, ed è proprio contro questo che era stata promessa la «firm and decisive response» (Sisi, dicembre 2025).
- hash: 359f2131
  it: |
    La vittoria schiacciante non ha risolto la questione che doveva risolvere. Il Prosperity Party ha ottenuto 438 dei 486 seggi in palio (547 in totale) nel giugno 2026, senza voto nel Tigray e con conflitti in altre regioni; tre mesi dopo, gli esclusi dal conteggio erano un'alleanza armata di sette gruppi, presieduta da un comandante di Fano, e il mandato con cui Abiy ha giurato il 5 ottobre era un mandato su un Paese in guerra con una parte di se stesso.
- hash: 89f7c06c
  it: |
    Il denaro del Golfo compra droni e inimicizie nella stessa transazione. Il sostegno emiratino (finanza, infrastrutture e, secondo le accuse, aerei a Bahir Dar) ha procurato all'Etiopia il richiamo di un ambasciatore sudanese e la minaccia di «open confrontation» (maggio 2026), un'accusa pubblica saudita (gennaio 2026) e la posizione di cliente emiratino contro l'Egitto, il principale creditore dell'UAE. Il patrono che arma la campagna federale è anche quello che costruisce l'accerchiamento contro di essa.
- hash: 2b464e8c
  it: |
    Giocare Mogadiscio e Hargeisa l'una contro l'altra lascia l'Etiopia senza nessuna delle due. Il memorandum d'intesa con il Somaliland (1° gennaio 2024) le ha dato un'opzione portuale e un nemico in Somalia; Ankara (dicembre 2024) ha riparato i rapporti con la Somalia e non ha seppellito il memorandum; dopo che Israele ha riconosciuto il Somaliland (26 dicembre 2025), Addis Abeba ha mantenuto quello che una testata vicina al Somaliland definisce «studied silence». Nel giro di una settimana Hassan Sheikh Mohamud ha incontrato Abiy ad Addis Abeba (circa il 29 settembre) e ha firmato a El Alamein (4 ottobre) un testo che respinge ogni sostegno al Somaliland; poi si è congratulato con Abiy per il giuramento (5 ottobre) e ha detto che la Somalia non si oppone all'accesso etiope attraverso il territorio somalo, se negoziato formalmente.
- hash: 7037f8d7
  it: |
    L'Etiopia è, nella lettura di Luttwak, la potenza senza sbocco al mare che ha definito il proprio accesso al mare un diritto e, nel farlo, ha richiamato contro di sé la coalizione del Mar Rosso. La strategia di Abiy poggia su un progetto nazionale, la GERD, e su una rivendicazione nazionale, uno sbocco sul mare; entrambi sono legittimi per Addis Abeba e all'estero entrambi sono letti come una minaccia. Il Nilo ha dato all'Egitto un movente; la rivendicazione sul mare ha dato a Eritrea, Somalia e Sudan un testo comune (El Alamein, 4 ottobre 2026); e la sola guerra che Abiy non può permettersi, quella interna, ha offerto a Eritrea ed Egitto un modo per colpirlo che nessun trattato vieta. Lo schema è il paradosso del successo nella strategia: ogni vittoria (la diga costruita, le elezioni vinte, Macallè ripresa dopo il ritiro del TPLF) ha alzato il prezzo che i vicini avrebbero pagato per fermare la successiva.

    Segnali che non sono righe della scheda. Abiy ha giurato il 5 ottobre 2026 e ha ripetuto la rivendicazione sul mare il giorno dopo il vertice di Alamein, quindi il discorso era una risposta, non un piano; lo ha ammorbidito con «give and take» e con l'impegno, preso a marzo 2026, di non sparare un colpo contro Eritrea, Somalia, Gibuti o Kenya, ma la lettera UN dell'8-9 ottobre invoca l'articolo 51 contro l'Eritrea e il canale diplomatico è chiuso dal 1° ottobre. La Somalia ha partecipato a entrambi i tavoli nel giro di una settimana. Il tour dell'inviato statunitense di luglio ha toccato Il Cairo, Mogadiscio e Asmara, non Addis Abeba. Se l'Eritrea stia davvero dietro l'alleanza è un'accusa di Addis Abeba, non verificata nelle fonti, e il Cairo dice che si tratta di «a domestic crisis». L'accordo di Pretoria, firmato da Addis Abeba e dal TPLF ma non dall'Eritrea, è ora il documento che tutti citano e nessuno rispetta. Domanda aperta: la diga, le elezioni e la guerra su quattro fronti lasciano all'esercito forza sufficiente per conquistare un porto, o soltanto per minacciarne uno – e sarà la minaccia stessa a tenere chiuso l'anello?
- hash: 9096fa42
  it: |
    Scoraggiare un attacco russo ed essere in grado di respingerlo: il Rapporto governativo sulla difesa (19 dicembre 2024) considera la Russia una minaccia di lungo periodo per l'Europa e per la Finlandia, destinata a sopravvivere alla guerra in Ucraina, e un gruppo di lavoro parlamentare di giugno 2026 lo ha ribadito. Seguono i fondi: spesa per la difesa al 2,5% del PIL nel 2025, 3,2% previsto entro il 2030 (il 3% entro il 2029 era l'impegno dell'aprile 2025), e una spesa stimata al 2,4% del PIL nel 2026 per la difesa e la sicurezza, contro l'obiettivo NATO dell'1,5%.
- hash: '22758292'
  it: |
    Rendere concreta la garanzia atlantica sul fianco settentrionale: l'adesione alla NATO dal 4 aprile 2023 (il confine terrestre più lungo che la Russia condivida con uno Stato UE o NATO, circa 1.340 km), il Defence Cooperation Agreement con gli Stati Uniti su 15 siti (in vigore dal 1° settembre 2024), il comando terrestre NATO a Mikkeli (operativo dal 1° settembre 2025), le Forward Land Forces Finland (costituite il 6 giugno 2026) e 64 F-35A (i primi due sono atterrati a Rovaniemi il 18 settembre 2026).
- hash: 7421e780
  it: |
    Mantenere in piedi l'Ucraina e far fallire la Russia: materiale per la difesa del valore di circa 3,6 miliardi di EUR in 34 pacchetti (il 34°, da 290 milioni di EUR, il 15 settembre 2026), l'accordo decennale di cooperazione in materia di sicurezza del 3 aprile 2024, l'uso dei beni russi immobilizzati per un prestito a Kiev (lettera Orpo-Kristersson) e la disponibilità a partecipare, in una forma o nell'altra, a una forza multinazionale dopo il cessate il fuoco (non in combattimento).
- hash: 787b21ab
  it: |
    Proteggere il golfo di Finlandia e il fondale baltico: cavi e gasdotti verso Estonia e Svezia sono stati tagliati o danneggiati nell'ottobre 2023 (Balticconnector), nel dicembre 2024 (Estlink 2, il caso Eagle S) e il 31 dicembre 2025 (il Fitburg). La Finlandia sequestra navi, avvia azioni penali e chiede alla NATO una presenza, ma non ha ancora ottenuto una condanna.
- hash: 1d16d682
  it: |
    Mantenere l'EU forte sulla sicurezza ma a basso costo e senza debito comune: la Finlandia è contributore netto dal 2001, respinge un bilancio 2028-34 vicino ai 2.000 miliardi di EUR e ogni strumento di debito comune, chiede una condizionalità rigorosa e siede nel blocco dei contributori netti (con Germania, Danimarca, Paesi Bassi, Austria, Svezia) che nell'agosto 2026 ha chiesto di tagliare alla proposta diverse centinaia di miliardi di euro.
- hash: 4faaf7a3
  it: |
    Trasformare le nicchie di un'economia piccola in accesso a Washington e Berlino: know-how nei rompighiaccio artici (il memorandum Stubb-Trump del 9 ottobre 2025 per fino a 11 Arctic Security Cutters, per circa 6,1 miliardi di USD; contratto con Rauma Marine Constructions per due navi del 30 dicembre 2025), oltre a Patria, Nokia e ICEYE come fornitori della difesa tedesca.
- hash: 57826e32
  it: |
    Il canale presidenziale verso Trump: la diplomazia del golf e di Mar-a-Lago di Stubb, l'incontro alla Casa Bianca del 9 ottobre 2025 con la presenza di Orpo, e l'obiettivo dichiarato di far arrivare a Washington i messaggi europei. Ha procurato alla Finlandia il contratto per i rompighiaccio e un'audizione su Ucraina e Artico, ed è lo strumento principale per tenere gli Stati Uniti impegnati in Europa.
- hash: c4c19fdb
  it: |
    Aggregazioni nordico-baltiche e del fianco settentrionale: il memorandum NORDEFCO riveduto del 6 maggio 2025, un concetto nordico di operazioni aeree combinate (circa 250 velivoli da combattimento, un centro combinato di operazioni aeree a Bodo), la Svezia come nazione quadro per le Forward Land Forces Finland, la Joint Expeditionary Force a guida britannica, la leadership finlandese del dominio terrestre dell'iniziativa Eastern Flank Watch.
- hash: e4fd5072
  it: |
    Materiali e basi: 64 F-35A Block 4 (contratto da circa 8,3 miliardi di EUR, dicembre 2021, capacità operativa iniziale prevista all'inizio del 2028), difesa aerea David's Sling (circa 316 milioni di EUR), accesso statunitense a 15 siti in base al DCA, e recesso dalla Convenzione di Ottawa con effetto dal 10 gennaio 2026, per consentire il ritorno delle mine antiuomo nell'arsenale.
- hash: 33228d67
  it: |
    Il confine orientale chiuso: tutti i valichi terrestri sono chiusi dal dicembre 2023 (il governo il 4 giugno 2026 li ha mantenuti chiusi «until further notice», con le domande d'asilo accentrate), più una recinzione di confine di circa 200 km su tratti selezionati dei 1.340 km di frontiera. La migrazione strumentalizzata si è fermata, per ora.
- hash: 044557bc
  it: |
    Sanzioni e disaccoppiamento dalla Russia: le importazioni di elettricità sono cessate nel maggio 2022 e quelle di gas il 21 maggio 2022 (terminale GNL galleggiante a Inkoo dal 2023), mentre il commercio ferroviario è stato frenato dopo la chiusura del confine e i rincari tariffari russi del luglio 2026. La Finlandia usa inoltre il suo seggio nell'EU per spingere all'uso dei beni russi immobilizzati.
- hash: 851c78d1
  it: |
    Valutazione aperta della minaccia e resilienza pubblica: la panoramica annuale di Supo indica la Russia come principale minaccia e avverte che le influenze russe cresceranno dopo la guerra; la linea pubblica finlandese è calibrata (Valtonen, aprile 2025: la Russia non è considerata un nemico, ma le sue azioni e le violazioni del diritto internazionale sono contrastate), mentre Stubb invita i finlandesi a «mentally prepare» per un eventuale disgelo.
- hash: c534e95c
  it: |
    Geografia: il confine terrestre EU/NATO più lungo con la Russia e una costa meridionale su un golfo dove il traffico legato alla Russia transita liberamente. Il rinforzo si trova in parte fuori dal territorio: il gruppo tattico Forward Land Forces (circa 600 militari svedesi, espandibile a 1.200) ha base a Boden, in Svezia, e ruota in Finlandia senza esservi stanziato.
- hash: 77e9f7fe
  it: |
    Finanze pubbliche: il disavanzo delle amministrazioni pubbliche è stato il 4,4% del PIL nel 2024 e il 4,3% nel 2025; la coalizione di Orpo (Coalizione nazionale, Partito dei finlandesi, Cristiano-democratici, Partito popolare svedese; 108 seggi su 200) taglia 6 miliardi di EUR nel corso della legislatura mentre aumenta la spesa per la difesa, ed è per questo che l'obiettivo del 2030 è il 3,2% e non di più.
- hash: 3bbf65d8
  it: |
    Dipendenza da un patrono che non può disciplinare: l'F-35, il DCA, il contratto per i rompighiaccio artici e la garanzia atlantica passano tutti per Washington, che nel gennaio 2026 ha minacciato un dazio supplementare del 10% su Finlandia e altri sette Paesi per la Groenlandia e già applica il 15% sulle merci UE. Stubb ha definito la crisi della Groenlandia la più difficile per la Finlandia, perché si oppone a un alleato stretto su sovranità e integrità territoriale.
- hash: 70ac19e3
  it: |
    Diritto del mare: la UNCLOS limita ciò che uno Stato costiero può fare nella propria zona economica esclusiva. Il tribunale distrettuale di Helsinki ha respinto il caso Eagle S il 3 ottobre 2025 per difetto di giurisdizione (EEZ, non acque territoriali); la Corte d'appello lo ha riaperto nel 2026, ma l'equipaggio ha lasciato la Finlandia e la Corte suprema potrebbe ancora intervenire. Scoraggiare il sabotaggio dei cavi con azioni penali è lento e incerto.
- hash: 82b7c035
  it: |
    Politica di coalizione: il Partito dei finlandesi e i Cristiano-democratici bloccano il riconoscimento della Palestina che il presidente Stubb dice di voler firmare, e hanno criticato il voto del 2025 che dichiarava illegali gli insediamenti; le elezioni del 2027 sono il prossimo banco di prova. La politica estera è divisa tra un presidente che parla e un governo che paga.
- hash: f5ebb3dc
  it: |
    Il nord è anche una frontiera interna: cinque dei 15 siti del DCA si trovano in Lapponia e i primi F-35 sono di base alla Lapland Air Wing di Rovaniemi, mentre la Commissione sami per la verità e la riconciliazione ha consegnato il suo rapporto di 700 pagine con 68 proposte il 4 dicembre 2025, e Orpo ha dichiarato che dovrebbero seguire le scuse dello Stato. Difendere l'Artico non può avvenire contro il territorio sami (nostra inferenza dai due fatti).
- hash: 80276b22
  it: |
    Il confine chiuso protegge e isola allo stesso tempo. Chiudere ogni valico ha messo fine alla migrazione strumentalizzata che Helsinki definisce un attacco ibrido russo, ma ha anche interrotto i contatti: il 1° luglio 2026 la Russia ha chiuso cinque dei suoi valichi ferroviari con la Finlandia (lasciando aperto solo Vainikkala) e ha inviato la notifica formale il 9 luglio, mentre Stubb afferma che i finlandesi devono prepararsi mentalmente a un eventuale disgelo. La carta migliore della Finlandia per un futuro negoziato, il confine, è quella che ha chiuso.
- hash: 1409d847
  it: |
    L'adesione alla NATO ha posto fine alla sua esposizione e ne ha creato un fronte. Peskov dice che Finlandia e Svezia hanno «ridotto le relazioni a zero» portando infrastrutture NATO sul proprio territorio, e droni ucraini, deviati dal disturbo GNSS russo nel golfo orientale di Finlandia, sono entrati nello spazio aereo finlandese nella primavera 2026, costringendo l'esercito a chiudere lo spazio aereo e le rotte marittime tre volte in un mese. L'alleanza che garantisce la Finlandia la lega anche alle ricadute della guerra di qualcun altro.
- hash: 8106d870
  it: |
    Il canale Trump compra accesso ed espone la Finlandia all'uomo che corteggia. Il rapporto personale di Stubb ha prodotto il memorandum sui rompighiaccio e l'audizione a Washington, ma nel gennaio 2026 Trump ha inserito la Finlandia nell'elenco degli otto Paesi soggetti a un dazio supplementare per la Groenlandia, e Stubb ha definito quella crisi la più difficile per la Finlandia. Più la Finlandia scommette su un solo presidente americano, più deve difendere la Danimarca da lui.
- hash: 5cbb2217
  it: |
    Un ordine fondato sulle regole difeso con strumenti che le regole non concedono. La Finlandia ha sequestrato la nave Eagle S (dicembre 2024) e la nave Fitburg (31 dicembre 2025) per scoraggiare il sabotaggio dei cavi, ma il tribunale distrettuale ha stabilito che non aveva giurisdizione nella EEZ e ha ordinato allo Stato di pagare le spese dell'equipaggio; il Fitburg è stato rilasciato al termine delle indagini. Ogni sequestro mette alla prova il diritto del mare che la Finlandia ha bisogno di mantenere intatto.
- hash: eb82f1f2
  it: |
    Armarsi contro la Russia con armi israeliane votando contro la politica israeliana. Più del 40% degli acquisti aggiuntivi della difesa finlandese dopo il 2022 è venuto da Israele (David's Sling, Gabriel 5, Spike), il memorandum di difesa con Israele è stato prorogato per dieci anni, e il ministro della Difesa Hakkanen ha dichiarato nel settembre 2026 che la cooperazione di lungo periodo deve proseguire; eppure la Finlandia ha votato nel 2025 che gli insediamenti sono illegali, Stubb ha definito l'occupazione illegale all'UN, e il ministro degli Esteri ha aperto alla sospensione della parte commerciale dell'accordo EU-Israele.
- hash: 733df1b1
  it: |
    Un falco sull'Ucraina che rifiuta gli strumenti che la finanziano. La Finlandia sollecita Bruxelles a usare i beni russi immobilizzati e a finanziare subito Kiev, ma in quanto contributore netto respinge qualsiasi bilancio 2028-34 con debito comune e vuole che la cifra complessiva sia ridotta di centinaia di miliardi; l'onere che chiede all'Europa di sostenere deve venire da una tasca diversa da quella che essa stessa difende.
- hash: b866e437
  it: |
    La Finlandia applica la strategia di uno Stato in prima linea cui è stata finalmente concessa l'alleanza che aveva evitato per settant'anni, e ora deve renderla effettiva prima che l'attenzione del patrono si distolga. L'obiettivo non è sconfiggere la Russia, ma essere un bersaglio poco redditizio: un grande esercito di riserva, aerei e basi americani, la profondità svedese e nordica, un confine sigillato e un'insistenza netta sul fatto che l'Ucraina non deve perdere. Il grado attribuito alla Russia è quindi rivale, non avversario: il governo dice che non è un nemico, mira a indebolire le capacità russe con sanzioni e deterrenza e mantiene aperta la porta al dialogo dopo un cessate il fuoco; ma la struttura sottostante (la memoria della Guerra d'inverno, la pressione ibrida, il confine più lungo) è ostile. Lo schema di Luttwak è che ogni livello di sicurezza aggiunge una nuova esposizione: l'adesione alla NATO ha portato migrazione strumentalizzata, droni e disturbi GNSS; il canale con Trump ha portato la minaccia di dazi per la Groenlandia; la chiusura del confine ha provocato una risposta russa e la fine dei contatti; i sequestri delle navi della flotta ombra si sono scontrati con il diritto del mare. Due segnali che non sono righe della scheda: l'abitudine di Stubb di parlare sia con Trump (golf, rompighiaccio) sia di preparare i finlandesi a un disgelo postbellico con la Russia, e la discreta proroga del memorandum di difesa con Israele negli stessi anni in cui il presidente condannava pubblicamente l'occupazione. Le questioni aperte per il 2027 sono le elezioni, se il percorso verso il 3,2% reggerà al deficit, e se il caso Eagle S finirà con una condanna o davanti alla Corte suprema.
- hash: 20246f3f
  it: |
    Fare del Pacifico una zona di pace e tenere la rivalità tra grandi potenze fuori dal Blue Pacific: la dichiarazione Ocean of Peace, presentata da Rabuka nell'agosto 2023 e sostenuta dai leader del Pacific Islands Forum a Honiara nel settembre 2025.
- hash: 023b15ac
  it: |
    Ricostruire un'economia fondata su turismo e zucchero sotto un dazio statunitense ridotto dal 32% al 15% nel 2025: il turismo si sta riprendendo (823.409 arrivi di visitatori nel 2025 fino a ottobre), mentre la produzione di zucchero continua a calare.
- hash: e2d9ff19
  it: |
    Mettere in sicurezza la propria zona marittima e le proprie frontiere attraverso partner a pagamento – prima l'Australia (la Vuvale Partnership, la Australian Federal Police integrata nella polizia figiana, le motovedette di classe Guardian), poi Nuova Zelanda, Giappone e India – senza un trattato di alleanza con nessuno di loro.
- hash: bc584a4f
  it: |
    Leadership nel Pacifico per ruolo istituzionale: le Figi hanno assunto la presidenza a rotazione del Melanesian Spearhead Group nel giugno 2025 per un mandato di due anni e hanno ospitato il 23° vertice dei leader MSG; hanno portato avanti la Ocean of Peace attraverso il Forum; la loro ambasciata a Gerusalemme è stata aperta il 17 settembre 2025, la prima di uno Stato insulare del Pacifico.
- hash: 590935f9
  it: |
    Un piccolo esercito professionale venduto all'estero come servizio: le Republic of Fiji Military Forces ruotano nella UN Disengagement Observer Force (113 militari trasportati dalla RAAF a Darwin nel luglio 2025), una compagnia ha trascorso cinque mesi in Australia per Talisman Sabre 2025 e sarà assegnata alla 7ª Brigata dell'esercito australiano nel 2026, e cadetti figiani frequentano la National Defense Academy giapponese.
- hash: 6c05fd04
  it: |
    Esportazione di manodopera verso l'esercito britannico: i figiani si arruolano dalla campagna di reclutamento del novembre 1961 (200 uomini e 12 donne in quel mese). I conteggi successivi, da circa 1.350 a oltre 3.400 in servizio, sono contestati e privi di data, per cui nessuno è usato qui.
- hash: 022ec2bb
  it: |
    Il livello del mare e i cicloni vincolano ogni piano, e i fondi per il clima che dovrebbero finanziare l'adattamento si stanno riducendo: nel febbraio 2025 Rabuka ha chiesto a Washington di rientrare nell'Accordo di Parigi e di riconsiderare un congelamento che ha colpito un programma per l'energia pulita da 1,5 milioni di USD destinato alle donne, gestito dall'ufficio figiano della Pacific Community.
- hash: e1916668
  it: |
    L'economia è ristretta: lo zucchero ha contribuito a circa l'1% del PIL nel 2022 (circa il 4% prima del calo), la produzione di canna è scesa del 18% nella stagione di macinazione 2025, e il turismo dipende dagli arrivi da Stati Uniti e Regno Unito (in aumento dell'11,3% e del 10,6%), mentre gli arrivi da Australia e Nuova Zelanda sono calati.
- hash: dad0bd2f
  it: |
    Una coalizione a tre (SODELPA, People's Alliance, NFP) affronta le elezioni generali previste tra il 24 dicembre 2026 e l'inizio di febbraio 2027, secondo il calendario scelto dal primo ministro; non è stato trovato alcun sondaggio del 2026, e gli ultimi sondaggi citati risalgono al 2018 e al 2021.
- hash: ad11336e
  it: |
    La Ocean of Peace respinge la militarizzazione e la rivalità tra grandi potenze, ma la profondità della sicurezza figiana sta diventando australiana (negoziati per il trattato Vuvale, polizia integrata con la AFP, una compagnia RFMF inserita in una brigata dell'esercito australiano): più Canberra si avvicina, meno il messaggio «no great power» appare neutrale agli occhi di Pechino e degli Stati del Pacifico che resistono alla supremazia australiana, e la dichiarazione è stata criticata per aver aggirato le questioni regionali.
