items:
- hash: de3479af
  it: |
    Mantenere la famiglia al potere, con una successione ordinata, governando senza la National Assembly: l'Emiro ha sciolto il parlamento il 15 feb 2024, lo ha sospeso insieme a sette articoli della costituzione del 1962 il 10 mag 2024 per un massimo di quattro anni (una finestra di ripristino fino a mag 2028), e l'Emiro e il governo ora esercitano il potere legislativo per decreto. La campagna sulla cittadinanza (una legge del dicembre 2024 che consente la revoca per 'moral turpitude' o per atti che minacciano la sicurezza dello Stato; circa 42,000 revoche in sei mesi fino a marzo 2025, almeno 50,000 entro dicembre 2025 secondo il conteggio di Middle East Eye, mentre gli attivisti parlano di fino a 200,000) fa parte dello stesso progetto: restringere la cerchia dei cittadini che condividono lo stato sociale.
- hash: 5414fcef
  it: |
    Difendere il territorio e le infrastrutture da Iran e Iraq. Dal 28 feb 2026 il Kuwait è stato colpito da centinaia di missili e droni iraniani (aeroporto, raffineria di Mina al-Ahmadi, centrali elettriche e impianti di desalinizzazione, porti, basi statunitensi); il 9 mar 2026 l'Emiro l'ha definito un attacco non provocato di uno Stato musulmano vicino, ha dichiarato che il Kuwait non aveva consentito l'uso del proprio territorio, dello spazio aereo o delle proprie acque contro di esso, e ha rivendicato il diritto a una legittima difesa proporzionata. Sull'altro fianco l'Iraq ha depositato all'UN, nel gennaio-febbraio 2026, nuove coordinate marittime che il Kuwait e gli Stati del Golfo respingono.
- hash: 43caa930
  it: |
    Mantenere gli Stati Uniti come garante di ultima istanza costruendo al tempo stesso un secondo livello di partner per la sicurezza: l'accordo di cooperazione difensiva con il Pakistan (firmato l'11 giu 2023, ratificato alla fine di luglio 2026) è esplicitamente una cornice senza alcun obbligo di difendere il Kuwait, un Joint Defence Committee con l'India ha tenuto la riunione inaugurale nell'agosto 2026, e il Regno Unito ha inviato una batteria di difesa aerea Rapid Sentry nella guerra del 2026. AGSI: i funzionari sanno che nessun'altra potenza può sostituire Washington.
- hash: 5813e951
  it: |
    Mantenere solvibile lo Stato petrolifero e diversificarlo: il petrolio vale circa il 90% delle entrate governative e quasi tutto il greggio, i prodotti e il condensato escono attraverso lo Stretto di Hormuz; la produzione è scesa a 580,000 b/d nel maggio 2026 e si è ripresa a circa 1.97 mb/d a luglio. Gli strumenti sono la legge sul debito di marzo 2025 (KD30bn, circa USD 97bn, obbligazioni fino a cinquant'anni), la Vision 2035 riveduta (un varco nel Golfo settentrionale attorno al porto di Mubarak Al-Kabeer e alla Silk City), capitali esteri (un accordo da USD 16bn con KKR-Kuwait Oil Company nel luglio 2026) e la Kuwait Investment Authority (attivi stimati in USD 1 trillion). L'IMF prevede una contrazione dello 0.6% nel 2026.
- hash: 7cd93d35
  it: |
    Mantenere il fronte marittimo a nord e la zona di risorse condivisa: la linea mediana di Khor Abdullah ai sensi della Risoluzione 833 del UNSC, le secche di Fasht al-Qaid e Fasht al-Aij, l'isola di Bubiyan e il porto di Mubarak Al-Kabeer costruito dalla Cina contro l'Iraq, e, insieme all'Arabia Saudita, i diritti esclusivi sul giacimento di gas di Durra nella Zona Neutrale divisa contro la rivendicazione iraniana di Arash (il ministro del Petrolio kuwaitiano ha detto nel luglio 2023 che le trivellazioni sarebbero procedute senza attendere un accordo con l'Iran).
- hash: 9419b542
  it: |
    Mantenere le credenziali sulla causa araba, che legittimano la dinastia e sono la fonte più economica di soft power: nessuna normalizzazione con Israele finché non esista uno Stato palestinese (il ministro degli Esteri, 29-30 ott 2023), finanziamento allo sviluppo attraverso il Kuwait Fund (fondato nel 1961, la prima agenzia di aiuti creata da un paese in via di sviluppo) e l'abitudine a mediare all'interno del GCC (mediatore capo della crisi del Qatar del 2017).
- hash: 06af002e
  it: |
    La solidarietà del Golfo come primo riflesso: convocazione dell'incaricato d'affari iracheno per la notifica marittima (21 feb 2026) e raccolta di dichiarazioni da Riad, Doha, Abu Dhabi, Manama, Muscat, Amman e dal segretario generale del GCC; il 12 ott 2026 il ministero degli Esteri ha dichiarato che la sicurezza saudita fa parte di quella del Kuwait e del GCC, dopo gli attacchi degli Houthi agli aeroporti di Riad e Dammam. La formula dell'Emiro, 'GCC security is indivisible', serve a trasformare una ferita aperta nazionale in una collettiva.
- hash: 00e04523
  it: |
    Difesa aerea e antimissile sul proprio territorio (28 droni neutralizzati solo l'8 apr 2026, 26 minacce aeree intercettate il 29 mar), la Guardia nazionale e un ruolo di paese ospitante per circa la più grande presenza di terra statunitense nella regione (Camp Arifjan, Camp Buehring, Ali Al Salem, Port Shuaiba; l'indice di Wikipedia parla di oltre 14,000 unità, cifra che segniamo come non confermata). Il Kuwait avrebbe anche colpito dal proprio territorio milizie irachene sostenute dall'Iran nell'aprile 2026 e catturato quattro uomini dell'IRGC a Bubiyan il 1 mag 2026.
- hash: dc7a2585
  it: |
    Denaro sovrano e indebitamento: la Kuwait Investment Authority (un prestito sindacato da USD 4.5bn nell'agosto 2026), un'obbligazione da USD 6bn nel luglio 2026 con forte domanda, il tetto di indebitamento da KD30bn fissato per decreto nel marzo 2025, e il Kuwait Fund (sovvenzioni e prestiti, per esempio USD 89m alla Giordania nel 2020). Lo stoccaggio in Asia è una forma di hedging contro Hormuz: la Kuwait Petroleum Corporation detiene fino a 3.1m barili a Kiire (Giappone) e 4m a Ulsan (Corea del Sud), a fronte di esportazioni di circa 1.4 mb/d verso l'Asia nel 2025.
- hash: 2e1b5e59
  it: |
    Lo Stato definisce la narrazione in patria: il ministro dell'Interno, che presiede il comitato che esamina i casi di cittadinanza, ha detto ad Alrai TV nel marzo 2025 che il Kuwait era stato 'hijacked' da altre nazionalità; i nomi dei privati della cittadinanza sono pubblicati ogni settimana (il governo ha smesso di annunciare regolarmente i totali nel settembre 2025), e la guerra è raccontata attraverso i comunicati della KUNA e dei ministeri della Difesa e dell'Interno su intercettazioni e danni.
- hash: 18c51baf
  it: |
    Geografia: Hormuz è l'unico sbocco per quasi tutto il petrolio del Kuwait, lo stoccaggio è limitato, l'estremità settentrionale del Golfo è condivisa con l'Iraq e l'Iran, e le vie alternative (un oleodotto saudita ampliato, percorsi attraverso Siria e Libano) sono costose, lente o politicamente irrealistiche (cooperazione energetica con l'Iraq).
- hash: 8d167893
  it: |
    Demografia: i kuwaitiani sono il 31.7% di circa 4.82 milioni di residenti (fine 2023); l'India fornisce il 21% dei residenti, l'Egitto il 13%, il Bangladesh il 6%, le Filippine il 5%. Lo Stato dipende da una manodopera straniera che non può sostituire e da governi (Manila, Nuova Delhi, Il Cairo) che protestano quando questa viene maltrattata.
- hash: 10ffeaf1
  it: |
    Entrate: il petrolio vale circa il 90% delle entrate governative prima dei redditi da investimento; l'IMF prevede che l'economia si contragga dello 0.6% nel 2026, e il governo ha aumentato l'indebitamento e chiesto ai ministeri di tagliare la spesa.
- hash: 35b1414c
  it: |
    La sicurezza è in prestito: il Kuwait non ha il peso per dissuadere l'Iran né la profondità per difendere le proprie infrastrutture (l'attacco del 1 mar 2026 a Port Shuaiba ha ucciso sei soldati statunitensi; il fuoco amico ha abbattuto tre F-15E statunitensi il 2 mar), e gli accordi con il Pakistan e l'India non aggiungono alcuna garanzia.
- hash: d83302ba
  it: |
    Un'assemblea sospesa comporta uno sconto per il rischio politico: l'Emiro ha aggirato un parlamento che aveva bloccato la legge sul debito, ma l'AGSI prevede che l'Assemblea torni a essere un fattore della politica economica, e la commissione di revisione costituzionale promessa per il novembre 2024 non era ancora stata formata un anno dopo.
- hash: e5295f16
  it: |
    Il Golfo è diviso e il Kuwait non può scegliere da che parte stare: il Makkah Joint Defense Agreement (Arabia Saudita, Pakistan, Turchia, 7 ago 2026) non include il Kuwait, la frattura tra Arabia Saudita e UAE divide il GCC, e i vicini del Kuwait non concordano sull'Iran, sicché la sua unica costante sono le dichiarazioni collettive.
- hash: 561d2d7c
  it: |
    Ospitare la più grande forza statunitense della regione compra l'unica garanzia credibile e rende il Kuwait un bersaglio. L'Emiro dice che il Kuwait non ha consentito a nessuno di usare il proprio territorio, lo spazio aereo o le acque contro l'Iran, eppure sono le basi statunitensi a essere colpite per prime dall'Iran (Camp Buehring l'1 mar, Port Shuaiba, Ali Al Salem), e il garante non ha potuto fermare gli attacchi: l'AGSI inquadra la questione come quella di un'America che ha liberato il Kuwait e ora fatica a proteggerlo.
- hash: 4b26854c
  it: |
    Sospendere il parlamento ha aperto la strada al denaro e rimosso il cuscinetto che rendeva sicure le politiche. La legge sul debito del 2025 (KD30bn, obbligazioni a cinquant'anni) e l'accordo KKR di luglio 2026 sono arrivati solo dopo che l'Assemblea non poteva più bloccarli, ma un regime che governa per decreto non ha un'istituzione che assorba una cattiva guerra o una cattiva successione, e gli investitori che finanziano il piano prezzano questo rischio.
- hash: 787c9a16
  it: |
    Tagliare le liste dei cittadini per proteggere il bilancio del welfare crea una classe di apolidi all'estero e un costo diplomatico in patria. Si dice che circa due terzi dei colpiti siano donne naturalizzate divorziate o vedove (l'articolo 9 della costituzione, che le proteggeva, è tra gli articoli sospesi); l'Arabia Saudita ha rifiutato di occuparsi di un singolo caso, e il Foreign Office britannico raccoglie informazioni sui kuwaitiani di origine britannica, mentre una politica venduta come risparmio trasforma uno Stato importatore di manodopera in uno che produce residenti apolidi.
- hash: 1f428c5b
  it: |
    La strategia del varco settentrionale è ostaggio dei vicini che dovrebbe servire. Il porto di Mubarak Al-Kabeer a Bubiyan e la Silk City erano stati concepiti per fare del Kuwait un hub logistico per l'Iraq e il Golfo, ma l'Iraq protesta contro il porto e la sua nuova mappa marittima, l'IRGC ha fatto un'incursione a Bubiyan il 1 mag 2026, dove la Cina sta costruendo il porto, e il porto stesso era tra gli obiettivi degli attacchi iraniani; l'AGSI nota che l'obiettivo del varco è difficile finché l'Iran è visto come una minaccia per la sicurezza.
- hash: c42bd048
  it: |
    Diversificare i partner per la sicurezza non riduce di nulla la dipendenza da Washington e aggiunge partner che non combatteranno. Il patto del Pakistan non lo obbliga a nulla in caso di attacco, e il Pakistan media con Teheran; il comitato con l'India è una cornice, e la batteria britannica è un prestito; il Kuwait ottiene copertura politica e legami di intelligence, ma la sua esposizione reale a Hormuz e ai droni iraniani resta invariata.
- hash: c6322cee
  it: |
    Restare fermi su un principio di non normalizzazione, il più economico da sostenere nel Golfo, lascia il Kuwait senza i canali che potrebbe offrire la cooperazione in difesa aerea dei vicini allineati con Israele, mentre la guerra contro l'Iran è combattuta in parte da Israele. La linea del Kuwait è che la normalizzazione attende uno Stato palestinese; il costo si paga nell'unico ambito in cui è più debole, la difesa aerea. (Nostra lettura: nessuna fonte stabilisce questo collegamento.)
- hash: '777818b4'
  it: |
    Il Kuwait è un piccolo Stato ricco la cui strategia, dal 1961, è stata comprare protezione con denaro e mediazione, e tenere ogni vicino un po' indebitato con sé. Il 2024-2026 ha rotto il modello su due fronti insieme. In patria l'Emiro ha posto fine all'unica cosa che distingueva il Kuwait nel Golfo, un'assemblea eletta con veri poteri di veto: governa per decreto, ha fatto approvare la legge sul debito che l'Assemblea aveva bloccato e ha usato la legge sulla cittadinanza come strumento di welfare e di politica. All'estero la guerra del 2026 con l'Iran ha trasformato il paese che ospita la più grande presenza terrestre statunitense della regione nello Stato del Golfo colpito più spesso: il garante dal 1991 non è riuscito a fermare i droni iraniani, e la linea 'we allowed no use of our land' è tanto un appello a Teheran quanto una dichiarazione di fatto. Il paradosso che attraversa la scheda è che ogni protezione che il Kuwait compra ha un prezzo in esposizione: le basi statunitensi attirano attacchi, il porto costruito dalla Cina a Bubiyan attira pressioni irachene e iraniane, la regola del decreto che ha sbloccato il denaro gli costa le istituzioni che assorbono gli shock, e i partner aggiuntivi (Pakistan, India, Regno Unito) aggiungono copertura, non garanzie. Due segnali che non sono righe: la descrizione dell'Iran come 'friend' da parte dell'Emiro anche mentre attacca, che tiene aperta una via di ritorno, e l'assenza di qualsiasi passo kuwaitiano verso Israele mentre i vicini ne discutono. Domande per il prossimo passaggio: l'esito del ricorso presso la Corte federale suprema irachena su Khor Abdullah (le udienze sono state rinviate a metà giugno 2025), la reazione del Kuwait alla guerra Israele-Iran del giugno 2025, lo stato attuale dei negoziati su Durra e il commercio petrolifero Kuwait-Cina, che questo passaggio non è riuscito a documentare.
- hash: dbe137c1
  it: |
    Stabilizzare l'economia e ridurre il peso del debito. Il kip e le riserve si sono ripresi (un record di USD 4.2bn nel marzo 2026), ma il servizio del debito assorbe circa il 13% del GDP nel 2026, e l'IMF stima il debito pubblico all'80.6% del GDP nel 2025, con un percorso verso circa il 57% nel 2030 se le riforme terranno.
- hash: 2437dbfc
  it: |
    Trasformare l'energia idroelettrica in entrate da esportazione, soprattutto verso il Vietnam, il cui piano energetico riveduto indica almeno 8 GW di importazioni dal Laos entro il 2030 (un obiettivo di pianificazione, non un contratto).
- hash: fb783ed7
  it: |
    Mantenere il rapporto speciale con il Vietnam come ancora politica: piani di cooperazione tra partiti per il 2026-2030, concordati durante la visita del presidente Thongloun ad Hanoi del 26-27 gen 2026, e il porto marittimo di Vung Ang e una ferrovia Vientiane-Thakhaek-Vung Ang indicati come priorità durante la visita di To Lam a Vientiane del 5 feb 2026.
- hash: 9343c982
  it: |
    La rete come asset venduto: il 90% di EDL-T, la società di trasmissione ad alta tensione (linee oltre 230 kV), è stato ceduto a China Southern Power Grid nel 2020 per USD 600m, con un mandato di gestione di 25 anni dal 2021; secondo le notizie, l'acquirente ne detiene il controllo di maggioranza.
- hash: d9793c2b
  it: |
    Diplomazia oltre il Vietnam: il presidente Thongloun a Pyongyang il 7-8 ott 2025 per 'strengthen bilateral ties', e il primo ministro Sonexay Siphandone a Washington alla fine di settembre 2025 per cercare concessioni tariffarie nei colloqui con l'USTR Jamieson Greer.
- hash: fa727de5
  it: |
    Il servizio del debito assorbe il bilancio: la valutazione dell'IMF di febbraio 2026 mantiene il Laos in condizione di debt distress, e la World Bank calcola i pagamenti del debito a circa il 13% del GDP nel 2026, il che limita la spesa per sanità, istruzione e protezione sociale.
- hash: 21e2eb25
  it: |
    Scarsità di dollari: il kip ha perso circa il 35% sul dollaro tra gennaio e ottobre 2023, con un'inflazione vicina al 26%, e ha continuato a scendere nel 2024 (19% al tasso ufficiale fino a settembre); la World Bank collega il crollo ai dollari necessari per rimborsare il debito estero, e lo shock petrolifero del 2026 ha riacceso l'inflazione.
- hash: 84afaecf
  it: |
    Denaro dei donatori per le bombe della guerra: gli Stati Uniti hanno coperto il 73% dei fondi internazionali per la bonifica nel 2024 (USD 23.6m), e lo stop agli aiuti del gennaio 2025 ha interrotto lo sminamento finanziato dagli Stati Uniti; la sua ripresa non è chiara.
- hash: 56d48a1f
  it: |
    La rete venduta per alleggerire il debito lega il debito alla Cina: i critici leggono il trasferimento del 2020 del 90% di EDL-T per USD 600m come un debito convertito in capitale, e si prevedeva che il pagamento andasse ai debiti verso creditori cinesi (non confermato), mentre il partner cinese partecipa ormai ai ricavi di trasmissione da cui dipendono le finanze di EDL.
- hash: 8f5f7f11
  it: |
    Il Laos è uno Stato senza sbocco sul mare a partito unico il cui bene principale è l'acqua: le sue dighe vendono energia al Vietnam, e la rete ad alta tensione che la trasporta è ora controllata a maggioranza da una società cinese, il prezzo di un debito che l'IMF continua a considerare in debt distress. La sua politica è tenere il rapporto speciale con il Vietnam come ancora politica e diversificare i partner, perché nessuno di essi determini le sue scelte. Le riserve record del 2026 comprano tempo; non risolvono il debito.
- hash: 436961cc
  it: |
    Ripristinare il monopolio statale sulle armi senza una guerra civile: la decisione del governo del 5-7 ago 2025 di disarmare Hezbollah e ogni altro gruppo armato (entro la fine del 2025, in prima battuta), la 'phase one' dell'esercito a sud del Litani dichiarata completata l'8 gen 2026, il divieto dell'attività militare di Hezbollah del 2 mar 2026 e il disarmo dei campi palestinesi concordato con Abbas. Il presidente Aoun definisce il disarmo non negoziabile, ma vuole che avvenga per dialogo e in sequenza con il ritiro israeliano.
- hash: 5cad0bbd
  it: |
    Porre fine all'occupazione israeliana e alla guerra con il negoziato, senza arrivare alla normalizzazione: ritiro dalle circa 65 città e villaggi che le forze israeliane tengono dalla campagna di terra del marzo 2026, e dalle cinque alture di confine occupate dal 2024, attraverso i colloqui mediati dagli Stati Uniti che hanno prodotto la cornice del 26 giu 2026. Aoun e Salam parlano di 'peace' come di un accordo di sicurezza o di non aggressione; la normalizzazione, dicono, arriva solo dopo che la questione israelo-palestinese è stata risolta (Arab Peace Initiative).
- hash: 1ea8a69d
  it: |
    Ricostruire uno Stato in bancarotta: un nuovo programma con l'IMF (legge di risoluzione bancaria approvata nell'agosto 2026, mancano ancora la legge sul 'financial gap' e il bilancio 2027), fondi di ricostruzione per due guerre (World Bank: USD 11bn di fabbisogni dopo il 2024; il ministro delle Finanze Jaber: danni fino a USD 20bn dalla guerra del 2026) e un ritorno alla crescita dopo la previsione della World Bank di una contrazione del 6.4% nel 2026.
- hash: 2028d9eb
  it: |
    Mantenere il sostegno arabo, occidentale e UN dopo l'UNIFIL: il mandato della forza scade il 31 dicembre 2026 (risoluzione 2790 del Consiglio di sicurezza, adottata all'unanimità il 28 ago 2025), con ritiro nel corso del 2027, perciò Beirut vuole una missione di addestramento dell'EU, una coalizione franco-italiana post-UNIFIL e una base di donatori (Stati Uniti, Arabia Saudita, Qatar, EU) per un esercito che altrimenti non potrebbe tenere il sud.
- hash: 1d12372e
  it: |
    Allontanare il Libano dall'orbita dell'Iran e normalizzare il confine siriano: il divieto di attività dell'IRGC del 5 mar 2026, l'espulsione dell'ambasciatore iraniano (24 mar), il divieto di volo precedente (feb 2025); con Damasco, i comitati di demarcazione, il rientro dei rifugiati e il trasferimento dei detenuti siriani. Il ministro degli Esteri Raggi: il governo lavora per 'free Lebanon from Iranian influence'.
- hash: '64014320'
  it: |
    Trasformare il mare in fonte di reddito e di confini: l'accordo sui confini marittimi del 26 nov 2025 con Cipro (firmato, non ratificato), un'indagine sismica nel Blocco 8 con TotalEnergies, Eni e QatarEnergy (contratto di tre anni, decisione sulle trivellazioni successiva) e gas egiziano per l'elettricità. Gli idrocarburi sono una scommessa lunga; nulla di tutto ciò paga prima che l'esercito e l'IMF siano sistemati.
- hash: f403279c
  it: |
    Colloqui diretti, ospitati dagli Stati Uniti, con Israele (i primi da decenni: gli ambasciatori Moawad e Leiter a Washington il 14 apr 2026, round a maggio e giugno, a Roma a luglio e agosto; il prossimo è previsto per ottobre), condotti dal presidente Aoun e da funzionari a livello di ambasciatore mentre Aoun rifiuta di parlare con Netanyahu; la cornice del 26 giu conferisce a Beirut un Military Coordination Group facilitato dagli Stati Uniti e una sequenza scritta per il ritiro israeliano. Accanto a questo, il gruppo di sostegno arabo e occidentale (Stati Uniti, Arabia Saudita, Francia, Egitto, Qatar) e la riunione di Parigi del settembre 2026 sul sostegno all'esercito (Macron, Aoun e re Abdullah II).
- hash: 29ddeb6a
  it: |
    Una narrazione di sovranità: il monopolio statale sulle armi, 'peace' ma non 'normalisation', le armi di Hezbollah come causa della guerra e non come sua risposta (il divieto del governo di marzo 2026, la dichiarazione di Salam). Compete con la contro-narrazione di Hezbollah, secondo cui i colloqui 'achieved nothing' e hanno permesso il proseguire degli attacchi israeliani, e con l'Amal di Berri, che intende bloccare le misure di sicurezza della cornice.
- hash: 98aa5d88
  it: |
    L'esercito libanese come unico strumento: la 'phase one' a sud del Litani (dichiarata completata l'8 gen 2026, esclusi i cinque punti tenuti da Israele), dispiegamenti in zone pilota nell'ambito della cornice (la prima zona annunciata il 20 lug 2026, tre città che Israele non aveva occupato) e la consegna dei campi palestinesi (Fatah, da agosto 2025). L'esercito è sottofinanziato e non può essere usato con la forza contro Hezbollah.
- hash: 84e62aca
  it: |
    Il denaro dei donatori come leva: EUR 100m dallo European Peace Facility dell'EU per l'esercito (4 giu 2026, EUR 182m in totale), oltre a un pacchetto dell'EU da EUR 1bn per il 2024-27, la sovvenzione del Qatar di USD 60m per gli stipendi dell'esercito e USD 434m per l'energia, l'assistenza alla sicurezza statunitense (USD 117m annunciati nel gennaio 2025; USD 100m umanitari con la cornice) e il progetto d'emergenza della World Bank. Ciascuno è, di fatto, condizionato alla questione delle armi.
- hash: 3214fd8b
  it: |
    Un esercito che non può disarmare Hezbollah con la forza: sottofinanziato, dipendente dai donatori e alle prese con l'avvertimento di un deputato di Hezbollah secondo cui l'applicazione significherebbe 'civil war'. La fase uno ha mancato la scadenza di fine 2025; la fase due a nord del Litani dipende da un partito che dice che non si disarmerà finché Israele resterà.
- hash: cdb5fac8
  it: |
    La sequenza di Israele e i suoi fini: il ritiro è condizionato a un disarmo verificato; Netanyahu dice che le forze israeliane resteranno finché Hezbollah sarà armato, Smotrich 'possibly beyond', Katz che i villaggi sciiti sulla linea di contatto 'had to disappear'. Israele occupa un'area stimata di 570-600 km², gli ordini di evacuazione coprono circa 2,000 km², e oltre 1.2 milioni di persone sono sfollate.
- hash: bcab4259
  it: |
    Un sistema confessionale che dà al duopolio sciita un diritto di veto: Hezbollah e Amal esprimono ministri (sono usciti dal governo nell'agosto 2025, e un ministro di Hezbollah ha approvato il divieto di marzo 2026), lo Speaker Berri guida il parlamento, che ha prolungato il proprio mandato fino a maggio 2028 con 76 voti contro 41 il 9 mar 2026 (il Consiglio costituzionale lo ha confermato il 7 apr). Lo Stato non può decidere contro la comunità sciita e conservare il sistema.
- hash: bec6faaf
  it: |
    Un'economia in bancarotta e a corto di dollari: perdite del settore finanziario stimate in circa USD 70bn (stima del 2022, probabilmente più alta), l'accordo a livello di staff con l'IMF ancora bloccato dalla legge sul 'financial gap', dal bilancio 2027 e da un aumento dell'IVA, la lira libanese che ha perso il 98% del suo valore, e la World Bank che prevede una contrazione del 6.4% nel 2026 dopo una crescita del 4.2% nel 2025; la World Bank stima il costo economico del conflitto in USD 14bn e i fabbisogni di ricostruzione in USD 11bn.
- hash: ef714200
  it: |
    Patroni condizionati: Riad attende 'actions' sul disarmo prima di tornare a impegnarsi con denaro, gli Stati Uniti legano i propri aiuti all'esercito alle prestazioni (la cornice dice 'performance-based'), e l'EU inquadra i propri aiuti come un modo per indebolire Hezbollah. Il sostegno è reale ma può essere ritirato, e la forza UN che stava nel sud se ne va alla fine del 2026.
- hash: 78b23cf1
  it: |
    Un'opinione pubblica che non segue i propri negoziatori: i sondaggi citati dal Long War Journal collocano il sostegno alla normalizzazione con Israele intorno al 30%, Hezbollah e Amal respingono la cornice, e la popolazione sciita (la maggior parte dei 1.2 milioni di sfollati) è chiamata ad accettare il disarmo mentre le forze israeliane restano e i fondi per la ricostruzione sono condizionati.
- hash: 13a8e147
  it: |
    Vietare l'attività armata di Hezbollah il giorno in cui Hezbollah ha aperto il fuoco non ha fermato la guerra che doveva tenere fuori. Il governo ha messo fuori legge l'azione militare del gruppo il 2 mar 2026, poche ore dopo che Hezbollah aveva sparato per conto dell'Iran; Israele ha risposto con la campagna di terra sul Litani, con oltre 4,300 morti e più di un milione di sfollati. Una decisione che lo Stato non poteva far rispettare ha insegnato a Israele che lo Stato non è padrone del fronte, e ha offerto ai ministri israeliani un argomento per restare finché Hezbollah non sarà disarmato: il disarmo che l'occupazione rende più difficile.
- hash: fd2529ca
  it: |
    La sequenza è circolare. La cornice subordina il ritiro israeliano al disarmo verificato; Hezbollah dice di mantenere le proprie armi finché le truppe israeliane occupano terra libanese; ogni attacco israeliano sotto la tregua rafforza questo argomento all'interno della comunità sciita e indebolisce lo Stato che chiede pazienza. La prima zona pilota copre tre città che Israele non ha mai occupato, quindi l'unico successo visibile non sposta nemmeno un soldato israeliano.
- hash: f077f500
  it: |
    L'esercito ha bisogno del denaro dei donatori per disarmare, e i donatori lo sbloccano solo a fronte del disarmo. Arabia Saudita, Stati Uniti e EU descrivono tutti i propri aiuti come legati ai progressi, eppure un esercito sottofinanziato e a corto di unità non può mostrare progressi senza gli aiuti. Lo Stato è chiamato a dimostrare la capacità prima, e a riceverla dopo.
