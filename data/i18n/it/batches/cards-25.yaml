# every step), never editing this file. Keep names, dates, numbers and quotes; register of a foreign-office
# brief: dry, precise, no flourish.
lang: it
items:
- hash: c4392da1
  kind: cards
  en: Courting the patron who brokers with the enemy. Kyiv's best cards with Washington (minerals, drones, a Patriot production line) are given to a White House that abstained on territorial integrity in
    February 2026 and let the Iran war freeze the talks; the more Ukraine becomes useful to the US, the more the US can propose a deal that suits its own interests. The same Patriot licence that frees Kyiv
    from PURL also ties it more closely to US technology.
  it: ''
- hash: ea6a3e24
  kind: cards
  en: A loan repaid only if Russia pays turns the creditors into stakeholders in the peace terms. Ukraine begins to repay the EUR 90bn only after Russia pays reparations, and Russian state assets stay frozen
    meanwhile; the guarantee that makes the loan possible also makes any deal that skips reparations a problem for Brussels, not only for Kyiv.
  it: ''
- hash: 4efe0259
  kind: cards
  en: 'Ukraine runs a grand strategy of the weaker party that must make itself

    indispensable to stronger ones: it cannot win the war outright, cannot

    afford to lose it, and has to keep three patrons (the EU, the UK-led

    coalition, the United States) paying while it negotiates with an adversary

    whose price is its statehood. At the tactical level it is holding (the

    front is slow in 2026, drones and strikes compensate for men), at the

    theatre level it is trading minerals, drones and the promise of a rebuilt

    country for money and guarantees, and at the grand-strategic level it is

    betting that the road to the EU gives it an anchor that no ceasefire can

    cancel. Luttwak''s reversal is everywhere: the same logic that keeps the

    patrons engaged (usefulness, visible strength, deep strikes, a national

    story told in battle) irritates the neighbours whose vetoes decide the

    anchor, from Fico''s pipeline to Warsaw''s history. 2026 is also the year the

    centre of the question moved from the front to the table: talks opened

    in Abu Dhabi in January, were frozen by the Iran war in March, and resumed

    with the Miami round of 9-10 October, while the Kremlin still demands the

    Donbas. Two signals that are not rows: the new Hungarian government''s

    shift from veto to conditions (Magyar, since May) and the Ankara

    summit''s quiet re-labelling of Ukraine as a contributor to Euro-Atlantic

    security. Open question for the next review: whether the 15 Oct European

    Council and the Miami outcome change the guarantee from a text to a force.'
  it: ''
- hash: 5dfacae9
  kind: cards
  en: 'Hold the EU-Mercosur partnership on course: Uruguay ratified it on 26 February 2026, and the interim trade part has applied provisionally since 1 May 2026 with Argentina and Uruguay as the ratifying
    members. The deal is the market Montevideo needs beyond China and the one Brazil and Argentina share with it.'
  it: ''
- hash: c1d16a92
  kind: cards
  en: 'Sell beef and other goods to China on better terms: the government in 2023 sought a bilateral free trade agreement with Beijing, because Uruguayan beef faced a 12% tariff there against 0% for New
    Zealand. Orsi''s own line on China was not read in this card; the sourced push is from the Lacalle Pou government, and its continuation under Orsi is our reading (C).'
  it: ''
- hash: a924ef95
  kind: cards
  en: Beef, soy and pulp as the export base. In 2021 Uruguay exported a record US$9.8 billion; beef was 45% of that, cellulose and timber 13%, soybeans 12%, and China took US$2.7 billion (28%). In 2022
    China took 27% of Uruguay's exports, two-thirds of it beef (UN Comtrade, as reported by The Cattle Site).
  it: ''
- hash: 5f5bac8c
  kind: cards
  en: 'Mercosur membership as the frame for every trade move: Uruguay is a full member and pushes the bloc to let members negotiate bilateral deals, while the EU agreement is the bloc''s shared gain. Membership
    is recorded from the Mercosur member list (dataset row, tier 1).'
  it: ''
- hash: 946c5e8a
  kind: cards
  en: 'Mercosur rules: members may not negotiate separate trade deals without the bloc''s endorsement, so the China FTA waits on the bloc. Argentina, Brazil and Paraguay opposed a Uruguay-China deal (2022
    summit with no joint declaration; in November 2023 they warned of measures against Uruguay).'
  it: ''
- hash: 1402eb4c
  kind: cards
  en: 'Export concentration: three primary products (beef, cellulose, soy) carry most of the export income, and the largest single buyer, China, applies a 12% beef tariff that Australia and New Zealand,
    with their free trade agreements, do not pay in full (3.3% and 0%).'
  it: ''
- hash: 4d197e89
  kind: cards
  en: The China market is what pushes Montevideo against the bloc, and the bloc's larger members answer by opposing the China deal, which puts at risk the EU agreement the bloc gained together and which
    Uruguay needs as its second market.
  it: ''
- hash: 2d7411ed
  kind: cards
  en: Uruguay is a small, open economy that sells beef, cellulose and soy mostly to China and depends on Mercosur for its legal frame and for the EU deal that the bloc signed together. Its strategy since
    2022 has been to push the bloc towards flexibility so that it can sign its own China deal, and Argentina, Brazil and Paraguay have answered by opposing it. This card rests on tier 3 and 4 sources; the
    Orsi government's own line on China and on the United States was not read, and the US partner row is a gap logged in the JOURNAL.
  it: ''
- hash: 09f8e62b
  kind: cards
  en: 'Primacy in the Western Hemisphere - the ''Trump Corollary'' to the Monroe Doctrine: deny non-hemispheric competitors forces, ports and ''strategically vital assets'', control migration and the cartels
    with lethal force, hold the Panama Canal, Greenland and the ''Gulf of America'' as key terrain, and ''enlist'' aligned governments (the Shield of the Americas, Doral, 7 Mar 2026). The 2026 National
    Defense Strategy ranks the homeland and the hemisphere above the Indo-Pacific; the seizure of Maduro on 3 Jan 2026 is read by Carnegie and CFR as the doctrine''s first implementation.'
  it: ''
- hash: 5d1be6d6
  kind: cards
  en: 'Rebalance trade and reindustrialise by tariff: ''Liberation Day'' reciprocal tariffs (2 Apr 2025), a 15% ceiling bought from the EU, Japan, Korea and Taiwan with investment pledges (USD 550bn, 350bn,
    250bn), and after the Supreme Court struck down the IEEPA tariffs on 20 Feb 2026 a rebuilt regime of Section 122, 232, 301 and 338 duties (the 24 Jul 2026 wave on dozens of countries; 50% on Canadian
    goods from 22 Aug 2026), with the USMCA left unrenewed on 1 Jul 2026. The NSS names ''balanced trade'', ''reindustrialization'' and ''energy dominance'' as economic security.'
  it: ''
- hash: 8d4f16f8
  kind: cards
  en: 'Keep China a rival ''within bounds'': deter a Taiwan conflict by denial along the First Island Chain while ''the goal is not to dominate China'' (NDS), hold the chip embargo and the critical-minerals
    supply chains, and buy a managed truce - Busan (30 Oct 2025), Beijing (14-16 May 2026), Xi in Washington (23-25 Sep 2026) - with tariff cuts, soybean purchases and the Taiwan arms package held ''in
    abeyance'' as a chip.'
  it: ''
- hash: 79913d59
  kind: cards
  en: 'Prevent an adversarial power dominating the Middle East and its chokepoints ''without forever wars'': Iran''s programme degraded (Midnight Hammer, 22 Jun 2025) and then its regime attacked (Epic
    Fury, 28 Feb 2026, Khamenei killed, a naval blockade from 13 Apr, the memorandum of 17 Jun, strikes resumed 8 Jul), Hormuz and the Red Sea kept open, Israel secure, the Abraham Accords expanded (Kazakhstan,
    Nov 2025), the Gaza ceasefire of 9 Oct 2025 run through a Board of Peace chaired by the President.'
  it: ''
- hash: 3e20b498
  kind: cards
  en: 'End the Ukraine war fast and re-establish ''strategic stability'' with Russia over Europe''s head (Riyadh 18 Feb 2025, Anchorage 15 Aug 2025, the 28-point plan, trilateral rounds in Abu Dhabi and
    Geneva, Miami 9-10 Oct 2026), while shifting Europe''s conventional defence to Europeans: the Hague 5% (25 Jun 2025), ''NATO 3.0'', 5,000 troops out of Germany and a posture review of 25,000-40,000
    more, no further NATO enlargement.'
  it: ''
- hash: c1b74c3f
  kind: cards
  en: '''The era of mass migration is over'': border security as ''the primary element of national security'', the travel ban of 4 Jun 2025 on 12 countries (7 more partially), a refugee ceiling of 7,500
    for 2026 reserved mostly for white South Africans, deportation deals with El Salvador, Uganda, Eswatini, Ghana, Burundi and the DRC, and net migration negative in 2025 for the first time in fifty years.'
  it: ''
- hash: 5b831d03
  kind: cards
  en: 'Presidential deal-making as the instrument of ''realignment through peace'': the NSS claims eight peace deals in eight months (Cambodia-Thailand, DRC-Rwanda, Armenia-Azerbaijan, Gaza among them);
    the Board of Peace chartered at Davos on 22 Jan 2026 with 19 founding states; the Gulf tour of May 2025; the C5+1 at the White House (6 Nov 2025); envoys (Witkoff, Kushner, Boulos, Barrack) rather than
    the career service.'
  it: ''
- hash: 2803edbc
  kind: cards
  en: 'Burden-shifting onto allies, ''with our government as convener'': the Hague pledge of 5% of GDP, Japan''s USD 550bn and Korea''s USD 350bn investment funds and USD 33bn for US forces, Saudi and Emirati
    pledges of USD 600bn and 1.4tn, Europe paying for US arms to Ukraine through PURL (USD 6.7bn in a year), a NATO Force Model with a third fewer US jets, and the Pentagon''s demand of 3.5% from Australia
    and Korea.'
  it: ''
- hash: fa15e034
  kind: cards
  en: 'The tariff as universal lever, for trade and for everything else: 145% on China (Apr 2025), 50% on Brazil over a court case, 25% extra on India for Russian oil, 10% on eight allies over Greenland,
    35% then 50% on Canada; the average effective rate 12.1% (Jul 2026) after the Supreme Court''s ruling, USD 166bn of IEEPA duties to be refunded, and ''reciprocal trade agreements'' (Japan, Korea, EU,
    Indonesia, Taiwan, Thailand) as the deliverable.'
  it: ''
- hash: 1afecf03
  kind: cards
  en: 'Sanctions and their lifting as currency, and export controls as a bargaining chip: Rosneft and Lukoil listed (22 Oct 2025), Petro and the Rwandan army designated, Syria''s programme ended (30 Jun
    2025), Dodik, Belarusian potash and Justice de Moraes delisted; Nvidia H200 sales to China allowed for a cut (8 Dec 2025) and AI chips to the UAE eased after the Iran war; a Russian-diesel deal in Oct
    2026 that the Senate calls illegal.'
  it: ''
- hash: 1b99d9ad
  kind: cards
  en: 'Lethal force below the threshold of war, and one war: 234 killed in boat strikes in the Caribbean and the Pacific by Sep 2026 (68 strikes; a UN rapporteur calls them possible crimes against humanity),
    the Caracas raid of 3 Jan 2026 with about 150 aircraft, strikes in Nigeria (25 Dec 2025), Somalia, Ecuador and Yemen, and Operation Epic Fury against Iran (USD 43.6bn by Sep 2026); Joint Task Force
    Western Hemisphere (6 Aug 2026) makes the hemisphere a standing theatre.'
  it: ''
- hash: 7b161821
  kind: cards
  en: 'The posture trade: out of Iraq (30 Sep 2026), Syria''s bases (Apr 2026), Nigeria (Jul 2026) and 5,000 from Germany, with the Force Model cut; in to Greenland (two new Defence Areas, 22 Sep 2026),
    Panama''s former bases (rotational presence, MOU of 9 Apr 2025), Poland (5,000 more promised), the Luzon Strait and the Philippines (Typhon, NMESIS), and a Golden Dome for the homeland.'
  it: ''
- hash: 4798d9b6
  kind: cards
  en: 'A ''civilisational'' line for Europe and a free-speech quarrel with Brussels: the NSS asks Europe to ''regain its civilizational self-confidence'', salutes ''patriotic European parties'' and vows
    to oppose ''elite-driven'' restrictions on speech; Vance campaigned for Orban days before the April 2026 vote; the Justice Department backed X against the EU''s EUR 120m DSA fine and Lutnick tied steel
    tariffs to digital rules.'
  it: ''
- hash: 2728b59e
  kind: cards
  en: 'Courts and Congress narrow the levers: the Supreme Court struck down the IEEPA tariffs 6-3 on 20 Feb 2026 (USD 166bn to refund, a 10% Section 122 stopgap that expired on 24 Jul), upheld birthright
    citizenship 5-4 (30 Jun 2026) and left more than 10,000 lower-court rulings against ICE detention; the Senate voted 52-48 against the Brazil tariffs, Congress passed a Russia sanctions act 86-11 in
    the Senate, wrote a 28,500 floor for US Forces Korea into the NDAA, and was not notified before the Caracas raid.'
  it: ''
- hash: d0f420b8
  kind: cards
  en: 'Allies that hedge: half of Europeans call the US a ''necessary partner'' and 11% an ally (ECFR, May 2026); Spain and Britain refused bases for the first Iran strikes and Saudi Arabia denied overflight
    in May 2026; Qatar and the UAE say the Gulf ''cannot rely on the US alone''; Thailand bought Gripen over F-16s; Canada is to become the EU''s first ''associate member'' and Carney has planned for a
    US invasion; Kuwait buys from Pakistan.'
  it: ''
- hash: eca0497e
  kind: cards
  en: 'Overstretch and empty magazines: the Iran war cost USD 43.6bn by September 2026, interceptor stocks ran down to the point of a USD 25.8bn emergency sale, Patriot batteries were moved from Korea to
    the Gulf, Virginia-class boats are two years late for AUKUS, the 80,000 troops in Europe are under a six-month review, and the NSS itself concedes the ''huge gap'' between cheap drones and the expensive
    systems needed to stop them.'
  it: ''
- hash: 8ea61556
  kind: cards
  en: 'Hormuz and the Gulf hosts: the war closed the strait (about 150 ships stalled on 1 Mar 2026; shipping ''stalled as Tehran dictates terms'' after the April ceasefire), Rubio calls Iran''s grip an
    ''economic nuclear weapon'', Qatar''s LNG plants were hit, and the campaign depends on hosts who were struck more than 6,700 times and who set conditions - Kuwait says it allowed no use of its territory,
    Oman''s minister says Washington ''lost control of its own foreign policy''.'
  it: ''
- hash: 2174a559
  kind: cards
  en: 'The dollar and the debt: the dollar fell about 10% trade-weighted after January 2025 in two bursts (the April tariffs, the January 2026 Greenland threats), long yields jumped when the Fed''s independence
    was questioned, foreigners hold just over 30% of Treasuries and reserve managers say they will cut, while the NSS lists ''the dollar''s global reserve currency status'' among the means it relies on;
    the reserve share held at 57% in early 2026 and Brookings reads the fall as benign so far.'
  it: ''
- hash: ddf4ad0c
  kind: cards
  en: 'China''s counter-leverage: the rare-earth and magnet licences of April and October 2025 (magnets to the US still 20% below trend in July 2026), soybean purchases cut to zero in September 2025, the
    Nvidia antitrust finding, a 125% counter-tariff, and a truce that Beijing extends two months at a time - so that the chip embargo, the one US weapon China cannot answer in kind, is traded for pauses
    rather than used.'
  it: ''
- hash: 36518da8
  kind: cards
  en: 'The culminating point of coercion. Each maximal threat produced its own retreat: ''Liberation Day'' became a 90-day pause in a week; the Greenland tariffs of 17 Jan 2026 were dropped at Davos on
    21 Jan for a ''framework''; ''cut all trade with Spain'' (3 Mar 2026) became ''Spain agreed to pay more'', which Madrid denies; India''s 50% became 18%; Malaysia declared its agreement void. A threat
    used on everyone stops being believed by anyone, and the court that struck the IEEPA tariffs removed the weapon the threats rested on. Luttwak''s rule: the method that succeeds is the method the other
    side learns to wait out.'
  it: ''
- hash: bf9ca71a
  kind: cards
  en: 'Primacy that empties the alliances it bills. Burden-shifting worked - 5% at The Hague, USD 550bn from Tokyo, 350bn from Seoul, Europeans paying for American Patriots - and the same pressure turned
    the payers into hedgers: 11% of Europeans still call the US an ally, Qatar and the UAE say the shield is ''insufficient'', Riyadh denied overflight, Canada seeks EU association, Bangkok bought Swedish
    jets. The ''burden-sharing network with our government as convener'' is a network whose members are buying insurance elsewhere.'
  it: ''
- hash: 68bbda12
  kind: cards
  en: The hemisphere turn that hands Beijing the argument. Moving the fleet to the Caribbean and the strategy's first priority to the homeland was meant to free resources for China; the NDS that does it
    never names Taiwan, says the goal is 'not to dominate China', and the arms package sits 'in abeyance' as a bargaining chip. Carnegie's Tong Zhao reads the Trump Corollary as an invitation for rival
    powers to claim their own regions; Manila found itself omitted from the NSS; Brookings notes the pivot 'sits uneasily' with deterrence in the Indo-Pacific. Spheres of influence, once asserted at home,
    are hard to deny abroad.
  it: ''
- hash: 140f5146
  kind: cards
  en: The war fought to be done with wars. The NSS of December 2025 promised no 'forever wars' and a Middle East that would 'no longer dominate' American policy; twelve weeks later Epic Fury began, and
    by October the ledger read USD 43.6bn, a blockade twice imposed, strikes resumed after a signed memorandum, Hormuz shut, and a Supreme Leader's son promising vengeance. The war meant to clear the decks
    for the hemisphere and China froze the Ukraine talks from March, postponed the Beijing summit by a month and emptied the interceptor stocks the First Island Chain was to rely on.
  it: ''
- hash: 2b2ba709
  kind: cards
  en: The nation-building of a government that swore it off. 'We are no longer pursuing nation-building', the US told the Security Council on Bosnia; in Venezuela, after a raid justified as law enforcement,
    the Secretary of State 'effectively controls Venezuela's finances, the distribution of its natural resources and its government', Washington holds about USD 13bn of its oil money, and Trump said the
    US would 'run' the country. The Trump Corollary that was to keep outsiders out has made Washington the administrator of Caracas - the forever commitment in the one region the strategy calls its own.
  it: ''
- hash: c7d8ef88
  kind: cards
  en: Primacy priced in the currency it spends. Tariffs, the pressure on the Fed and the public questioning of the Treasury's safety are the instruments of economic primacy; the dollar they are meant to
    serve fell 10% in two bursts that coincide exactly with the tariff rollout and the Greenland threats, yields rose when Fed independence was challenged, and the NSS's own list of means begins with the
    reserve status. Brookings finds the fall benign so far and a tariff 'tipping point' not yet reached - the paradox is latent, not consummated.
  it: ''
- hash: ed599bab
  kind: cards
  en: A settlement channel that supplies the war. The bilateral line to Moscow (Riyadh, Anchorage, the 28-point draft taken from a Russian paper) was bought with pressure on Kyiv and produced no ceasefire;
    Europe answered by building its own guarantee (the Paris Declaration) and by paying for American weapons through PURL, so that by July 2026 Washington was licensing Patriot production to Ukraine and
    buying Russian diesel in the same quarter. The mediator ends up the arsenal of one side and the customer of the other, and Rubio and Lavrov accuse each other of stepping back from 'a proposal, not an
    agreement'.
  it: ''
- hash: 5ea2b6f4
  kind: cards
  en: 'The United States in October 2026 runs the most explicit grand strategy it has published since the Cold War, and the one most at odds with its own means. The ends are written down: a hemisphere held
    under a Trump Corollary, trade rebalanced by tariff, China kept a rival ''within bounds'', Europe''s defence handed to Europeans, the Middle East managed without forever wars, migration ended. At the
    technical level the instruments work - the border is quieter than in fifty years, allies have pledged trillions and 5% of GDP, Maduro sits in a Brooklyn cell, Khamenei is dead. At the level of grand
    strategy the picture inverts, as Luttwak says it must when a strategy succeeds: coercion used on everyone reached its culminating point in a year (Davos, Spain, the Supreme Court), the allies who paid
    became hedgers, the war of choice against Iran consumed the year that was reserved for the hemisphere and China, and the hemisphere itself produced a Venezuela that Washington now administers. Three
    signals that are not rows: the NDS never names Taiwan; the USMCA was left unrenewed on 1 July without any plan for what follows; and the same government that sanctioned Rosneft is buying Russian diesel.
    Washington''s stances read accordingly: one adversary (Iran), two rivals it talks to more than to its allies (China, Russia), and a ring of treaty allies graded reluctant not because they resist the
    alliance but because Washington does - the first great power in the atlas whose friction with its allies is mostly its own.'
  it: ''
- hash: 7cd8a95d
  kind: cards
  en: 'Keep the regime and the succession safe: President Mirziyoyev''s 2023 constitution reset his term count and lengthened the presidency to seven years (90.2% ''yes'' on 84.5% turnout on 30 Apr 2023),
    so he can rule through the 2030s, perhaps to 2040. Opening to the world since 2016 is the means; political control is the end.'
  it: ''
- hash: 244ab70b
  kind: cards
  en: 'Turn a double-landlocked position into transit value: be the crossing point of the China-Kyrgyzstan-Uzbekistan railway (construction started end-2024, 17% done in August 2026), the Trans-Afghan railway
    to Pakistan (framework agreement 17 Jul 2025), the Middle Corridor and the Iran-India route via Chabahar. A state that cannot reach the sea makes itself the thing others must cross.'
  it: ''
- hash: 77ce7032
  kind: cards
  en: 'Keep every great power a partner and none a master (multi-vector policy inherited from Karimov): observer, not member, of the Eurasian Economic Union (December 2020); no CSTO; a BRICS partner from
    2025 and an SCO member while courting Washington (C5+1, 6 Nov 2025) and Brussels (EPCA, October 2025); neutrality on Ukraine.'
  it: ''
- hash: 36dc8b0f
  kind: cards
  en: 'Secure water and power: downstream on the Amu Darya (Afghanistan''s Qosh Tepa canal, 285 km, completion foreseen for 2028), net gas importer since 2023 after output fell from 61.6 bcm (2018) to 44.6
    bcm (2024), so Tashkent buys Russian and Turkmen gas, Tajik hydropower (Rogun, 20-year contract), Russian nuclear (first concrete 24 Mar 2026) and builds Gulf-financed solar and wind.'
  it: ''
- hash: db48fcaf
  kind: cards
  en: 'Make Tashkent the organiser of a self-managed Central Asia: end the quarrels with neighbours, settle borders (Kyrgyz-Tajik treaty 13 Mar 2025 after Uzbek mediation, tripoint treaty at Khujand 31
    Mar 2025), sign Treaties on Allied Relations with Kazakhstan (2022), Tajikistan (2024) and Kyrgyzstan (2026), and host the leaders'' format that now includes Azerbaijan.'
  it: ''
- hash: a924faa2
  kind: cards
  en: 'Convert the demographic weight into growth and jobs: 38.2 million people on 1 Jan 2026 (census of Jan-Feb 2026 counted 39.0 million), a median age near 27 and about 1.34 million workers on Russian
    patents; WTO accession targeted for 2026, Gulf, Korean and Japanese capital, and a reserve pile of USD 70-77bn in 2026 (mostly gold) to cushion the shift away from remittances (USD 18.9bn in 2025, about
    14% of GDP in 2024).'
  it: ''
- hash: b98e2dd5
  kind: cards
  en: 'Treaties on Allied Relations (not defence pacts) with the three Turkic and Tajik neighbours - Kazakhstan (signed 22 Dec 2022), Tajikistan (18 Apr 2024), Kyrgyzstan (state visit 30 Jul - 1 Aug 2026)
    - plus a share of mediation: the Kyrgyz-Tajik border settlement of 2025 is credited to Tashkent''s mediation.'
  it: ''
- hash: 05fa11b1
  kind: cards
  en: 'Neutrality as currency: Tashkent recognises Ukraine''s territorial integrity and not the Donetsk and Luhansk ''republics'', abstained on the March 2022 General Assembly resolution, and is thanked
    by Putin for a ''clearly neutral'' line (June 2024) while it signs deals with Moscow, Brussels and Washington. The state-media line is a policy of ''near and distant countries, the East and the West''.'
  it: ''
- hash: dd6da10d
  kind: cards
  en: 'No CSTO membership and no foreign base reported: Russian equipment and drills (resumed after a twelve-year break in 2016-21), a defence co-production track with India agreed in August 2026, Hard
    power is small by design; the leverage is transit and a 38-million market.'
  it: ''
- hash: 49a91c1c
  kind: cards
  en: 'Gold, gas and rail as instruments: gold holdings valued at USD 67.7bn pushed reserves to USD 77.1bn on 1 Mar 2026 (reserves up USD 25.1bn in 2025), and the central bank has been withholding gold
    from export (gold share of exports 12.3% in Jan-Aug 2026 against 35.2% a year earlier); gas is imported from Russia (6.48 bcm in 2025) and Turkmenistan; the rail corridors are sold to China, Pakistan
    and Afghanistan alike.'
  it: ''
- hash: bbb30c1d
  kind: cards
  en: 'Courting capital from every direction: the Gulf (Saudi-linked projects with 56 joint projects worth USD 27.2bn per Tashkent; a UAE portfolio of about 100 projects above USD 20bn), Korea (more than
    700 firms, USD 8bn+ cumulative), Japan (ODA and loans above USD 3.7bn), the US (Boeing, a critical-minerals Joint Investment Framework of February 2026) and the EU (Global Gateway).'
  it: ''
- hash: 165f0e4c
  kind: cards
  en: A branded 'New Uzbekistan' reform story delivered through the presidency's press service and the state information agencies, aimed at investors and at Western audiences; the 2023 constitution presents
    itself as a 'social state' with habeas corpus and a constitutional ban on capital punishment, while the political system stays presidential.
  it: ''
- hash: c054e004
  kind: cards
  en: 'Double-landlocked: every export crosses at least two borders, and its portfolio of corridors (Russia, China, Afghanistan-Pakistan, Iran, the Caucasus) exists because none of them is enough. Carnegie
    reads the partner list as the answer to geography.'
  it: ''
- hash: 4ecb99b6
  kind: cards
  en: 'Downstream on a river it does not control: the Qosh Tepa canal is expected to divert an estimated 20-30% of the Amu Darya once finished (2028), there is no water treaty, and with no Central Asian
    state recognising the Taliban a legal water-use agreement is not currently possible. Tashkent''s water minister has said it will not go to war over it.'
  it: ''
- hash: fcb21c6d
  kind: cards
  en: 'The labour-for-remittances bargain with Russia: USD 18.9bn of remittances in 2025 (about 78% from Russia; 72.4% in Q1 2026), 14.4% of GDP in 2024, 1.34 million Uzbeks working in Russia on patents
    in Q1 2026, and Russia''s 2025 registry of ''controlled persons'', deportations without court review and multi-year entry bans, plus recruitment of Uzbek citizens for the war.'
  it: ''
- hash: 7aaef99d
  kind: cards
  en: 'A shrinking energy base: domestic gas output fell 15% year on year in Jan-Mar 2026 (9.6 bcm against 11.3 bcm), the country has been a net importer since 2023, Gazprom''s route through Kazakhstan
    hit its maximum technical capacity in Q4 2025, and Russia supplies more than a quarter of its gasoline just as Russian refineries fail.'
  it: ''
- hash: 7f759784
  kind: cards
  en: 'China''s weight: it overtook Russia as first trading partner in 2023 and in Q1 2026 Uzbekistan imported about USD 4.0bn from China against USD 0.64bn of exports; the railway is built by China Railways,
    financing is shared with international lenders, and Beijing and Tashkent target USD 30bn of trade.'
  it: ''
- hash: 4a99620d
  kind: cards
  en: 'Political limits on Western embrace: a presidency reset by a plebiscite limits how far Western partners can embrace it, the Jackson-Vanik amendment still limits US trade (bills S.3103 and H.R.5917
    pending, administration supportive), and WTO accession slipped past the March 2026 target while a BRICS partner status adds friction with Washington.'
  it: ''
- hash: 18ef54d3
  kind: cards
  en: It diversifies power supply into the hands of its biggest supplier. To replace falling domestic gas it imports Russian gas (6.48 bcm in 2025, a route at its technical maximum) and it builds its first
