  it: ''
- hash: 08a1303c
  kind: cards
  en: 'China: a free trade agreement in force from 1 January 2025 (trade remains lopsided, Maldivian exports negligible), debt relief agreed in January 2024 and a bilateral arrangement finalised in October
    2025 whose terms are not public.'
  it: ''
- hash: 1269da22
  kind: cards
  en: 'Military: Turkish Bayraktar TB2 drones for maritime surveillance (three presented March 2024, the number disputed), and Indian defence platforms that replaced the Indian military personnel the government
    had asked to leave in 2024.'
  it: ''
- hash: 8bf11d55
  kind: cards
  en: 'Domestic power for the foreign line: the PNC alliance won a supermajority (70-71 of 93 seats, provisional counts) in the April 2024 parliamentary election, enough to amend the constitution without
    the opposition.'
  it: ''
- hash: 29ee5449
  kind: cards
  en: 'Solidarity with Palestine as a political instrument: entry ban on Israeli passport holders, announced June 2024 and enacted in 2025 in conditional form (dual nationals may enter on non-Israeli documents),
