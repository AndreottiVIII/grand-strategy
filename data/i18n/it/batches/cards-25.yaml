# Translate every `en` into it. Write the translations to the file cards-25.out.yaml next to this one,
# as `items:` of `- hash: <same hash>` / `it: <translation>`, appending one item at a time (valid YAML at
# every step), never editing this file. Keep names, dates, numbers and quotes; register of a foreign-office
# brief: dry, precise, no flourish.
lang: it
items:
- hash: b83d096b
  kind: cards
  en: 'Size: an army that needs a national division it does not yet have, and equipment on a 2030 delivery clock - until then Lithuania''s deterrent is other people''s soldiers, and their presence is not
    in Vilnius''s gift (the US armoured battalion left in June 2026 with no replacement until a rotation due in late October).'
  it: ''
- hash: 032b31a4
  kind: cards
  en: 'Public finances: spending above 5% of GDP on defence with a planned deficit near 3.8% in 2027, and an opposition that distrusts the loose NATO definition of defence spending (road building counted).
    A dispute over whether the 5% pledge was safe cost the defence minister (Sakaliene) her post in October 2025.'
  it: ''
- hash: d01d7e76
  kind: cards
  en: 'Unstable government: Paluckas resigned on 31 Jul-4 Aug 2025 under a loan-fraud investigation (the shortest-serving premier since 1991), Ruginiene''s cabinet fell when the Dawn of Nemunas party was
    expelled, and Sinkevicius took office on 14 Jul 2026 with a 75-of-141 seat coalition whose programme the opposition calls unconstitutional. Foreign policy is held steady by the president and the foreign
    minister, not by the cabinet.'
  it: ''
- hash: 59f35ea2
  kind: cards
  en: 'The patron is transactional: the US reversed pressure on Minsk (potash sanctions lifted in March 2026 after a prisoner release), eased sanctions to let Russian diesel into the US (9 Oct 2026), and
    reviewed its European posture, while Lithuania has nowhere else to go for hard power.'
  it: ''
- hash: 19545ab1
  kind: cards
  en: 'Trade with China is small and Beijing has shown it can hurt a EU member that crosses it: exports to China fell from about EUR 300m (2020) to EUR 208m (2024) and the food industry never regained access,
    which is why a normalisation camp exists at all.'
  it: ''
- hash: ba40c199
  kind: cards
  en: The more Lithuania secures itself by treaty exit and fortification, the more it gives Moscow and Minsk to point at. Leaving the cluster-munitions and Ottawa conventions and moving to lift the constitutional
    ban on nuclear weapons buy capability and a seat in NATO's deterrent, but each step is cited in Moscow as proof of aggression (Russia criticised the nuclear amendment and the proposed US base in the
    same week) and costs the moral standing Lithuania uses to lead on Ukraine and sanctions.
  it: ''
- hash: c0e553a2
  kind: cards
  en: Closing the Belarus border protects Lithuania and hurts Lithuanians. Shutting the last two crossings (27 Oct-20 Nov 2025) answered the balloons, but Minsk answered by detaining Lithuanian trucks (about
    280 to over 1,000, up to 200 still held in May 2026) and a decree banning Lithuanian-plated trucks to the end of 2027; the same sanctions policy has cost Klaipeda a third of its peak turnover and drawn
    a EUR 12bn arbitration claim, while Washington presses Vilnius to reopen the potash route.
  it: ''
- hash: '72406231'
  kind: cards
  en: 'Lithuania keeps Russian gas flowing to Kaliningrad so as not to hand Moscow a pretext on the corridor it fears most. It renewed the Amber Grid-Gazprom transit to 2030 (about EUR 30m of allowed revenue
    in 2026) while calling Russia the main threat: the border it must defend is also a commercial artery it must keep open, and closing it was floated and withdrawn in the Oct 2025 balloon crisis.'
  it: ''
- hash: be5a7475
  kind: cards
  en: Courting Washington by offering to pay for a base ties Lithuania's security to a patron whose own moves work against Lithuania's aims. Vilnius volunteered the money on 29 Sep-6 Oct 2026, three days
    before Trump's diesel deal weakened the sanctions front Lithuania leads and months after the US pressed for the Belarus potash route; the more Lithuania pays for US attention, the more it needs the
    policy that attention is supposed to protect.
  it: ''
- hash: fddcefa5
  kind: cards
  en: Two foreign policies in one state. The president and foreign minister hold a hard line on China and Taiwan (only Taipei may rename its office), while the government programme seeks normalisation and
    a coalition partner wants the office renamed within two months; every signal to Beijing is read in Washington, where the former defence minister warned it could look like a move against US interests.
    A normalisation that fails would leave Lithuania with neither China's market nor a clear position with Taiwan.
  it: ''
- hash: 5e51f6ec
  kind: cards
  en: 'Lithuania is a small state that has chosen to be a front-line state on purpose:

    it argues for the threat louder than anyone and buys the insurance before the

    allies are asked to. The ranked objectives are a ladder from Russia, to the

    allies'' soldiers, to Ukraine, and the means mirror them - the most defence

    spending in NATO relative to GDP, borrowed money from the EU to turn a brigade

    into a division, and treaty exits that trade moral position for capability.

    The Luttwakian friction appears wherever one rung undermines another. Border

    closure and sanctions on Belarus defend the frontier but hand Minsk hostages;

    leaving the mine and cluster conventions and lifting the nuclear ban deter

    Moscow but enlarge Moscow''s narrative; and the offer to pay for a permanent

    US base binds the security of the state to a patron that is simultaneously

    easing sanctions on Russian diesel and Belarusian potash. Domestic politics

    adds noise, not direction: three Social Democratic cabinets in two years, a

    president and a foreign minister who anchor the line on Russia, Ukraine and

    Poland, and an open split on China. The Russia grade is adversary because the

    Seimas calls its regime terrorist and the national assessments treat it as the

    only state that can attack Lithuania; Belarus is a rival because Vilnius

    aims at pressure and isolation, not at the end of the regime, and the line

    softens when Washington pushes. The year to watch is 2027: the German brigade

    complete, the nuclear amendment''s final vote (planned 12 Jan 2027), the EU

    sanctions renewal on potash, and a US rotation that may or may not become a base.'
  it: ''
- hash: 227daccd
  kind: cards
  en: 'Keep the financial centre and the EU seats in Luxembourg: the Court of Justice and the European Investment Bank are seated there, Eurostat has a directorate in the city, and foreign banks (Chinese
    ones among them) use the Grand Duchy as their European hub. Every security choice is measured against what it does to that base.'
  it: ''
- hash: 3902c896
  kind: cards
  en: 'Keep the cross-border labour market open: almost half of salaried jobs are held by people who live in France, Belgium or Germany, so the Greater Region''s commuting flow is a precondition of the
    economy and of the state''s budget.'
  it: ''
- hash: 0911f533
  kind: cards
  en: 'Meet the NATO spending benchmark cheaply and with an economic return: 2% of GNI was claimed for 2025 (brought forward from 2030 by the State of the Nation of May 2025), and the government now plans
    2.3% of GNI by 2029, with the satellite capacity bought from a joint venture with SES rather than foreign hardware.'
  it: ''
- hash: f6d4be35
  kind: cards
  en: 'Benelux as the core of its diplomacy (joint declaration with Belgium and the Netherlands at Bourglinster, 10 Sep 2025), recognition of Palestine on 22 Sep 2025 (dataset row, government communiqué),
    and the EU as the multiplier: Luxembourg uses the seats and the Council votes to shape EU positions on Ukraine and on Russian assets; towards Washington the Prime Minister has spoken of a ''rupture''
    and of diversifying partners (Feb 2026).'
  it: ''
- hash: cd13c193
  kind: cards
  en: 'Financial services as an instrument of statecraft: an EU passport for foreign banks (Bank of China and ICBC branches; ICBC designated renminbi clearing bank for Luxembourg), the SES satellite operator
    and the custody of securities (Clearstream), which gives the state a lever on capital flows and on the Russian assets held in the country.'
  it: ''
- hash: 048b27f3
  kind: cards
  en: 'Satellite capacity as the defence contribution: LuxGovSat (government and SES, 50% each) sells military capacity, a block is pre-committed to NATO, and a 2016 contract ties the joint venture to NATO''s
    ground surveillance system, so the 2% money buys access to allied systems rather than tanks.'
  it: ''
- hash: e8126799
  kind: cards
  en: 'Size and a single airport: Luxembourg has one international airport, and on 18 Sep 2026 unidentified drones halted it for hours (19 flights diverted). The government said the origin could not be
    established and that it was working with NATO allies and foreign partners on detection. Nothing in the sources ties the incident to Russia.'
  it: ''
- hash: 41d7468e
  kind: cards
  en: 'The defence bill grows faster than the budget can carry: the Conseil national des finances publiques estimated the extra cost of the path to 5% by 2035 at EUR 13.4bn, with spending rising from EUR
    1.18bn in 2025 to EUR 4.63bn in 2035. The 2% benchmark is measured on GNI, which is smaller than GDP and so lowers the bill.'
  it: ''
- hash: 550414ce
  kind: cards
  en: 'Dependence on commuters and on neighbours'' nuclear policy: about 47% of salaried workers are cross-border (129,000 from France, 52,000 from Belgium, 51,000 from Germany), and the government''s push
    to close the Cattenom plant in France and the Tihange and Doel plants in Belgium is pursued against the states whose workers it needs.'
  it: ''
- hash: 697aa4fd
  kind: cards
  en: The commuters are the economy, and the nuclear campaign is aimed at the country that sends the most of them. Pushing for the closure of Cattenom to protect its population from a French plant puts
    pressure on the neighbour whose 129,000 workers keep the financial centre running.
  it: ''
- hash: f1696dd2
  kind: cards
  en: 'Luxembourg runs the strategy of a rich small state that buys security with money and

    with the right to host other people''s institutions: the EU courts, the bank hubs, the

    satellite company. Its 2% benchmark, its Ukraine pact and its EU votes are paid for by

    a financial centre that depends on the Greater Region''s commuters, and that centre is

    also where the Russian assets are custodied. The drone closure of its single airport in

    September 2026 is the first sign that a state so reliant on one hub and one airport has

    no margin if it is attacked; the origin is unknown and the reading must stay open.'
  it: ''
- hash: 4f676c1b
  kind: cards
  en: 'Make an attack on Latvia unthinkable by keeping allied troops on its soil and the US-led Article 5 guarantee credible: the Canadian-led NATO Multinational Brigade at Adazi (about 3,000 soldiers,
    3,500 for exercises, Canadian presence confirmed until 2031) is the tripwire that Latvia''s own army cannot replace.'
  it: ''
- hash: c0bb28da
  kind: cards
  en: 'Build a national defence that raises the price of aggression: a 2026 defence budget of EUR 2.16bn (4.91% of GDP, target 5%), conscription restored in 2023, six HIMARS and IRIS-T air defence ordered,
    and the Baltic Defence Line on the eastern border (EUR 303m over five years).'
  it: ''
- hash: b6c8c789
  kind: cards
  en: 'Russia must not win in Ukraine, and the Russian threat must be contained for a generation: military aid of 0.25% of GDP a year (almost EUR 1bn since 2022), co-leadership with the UK of the Drone
    Capability Coalition, and the use of frozen Russian assets for Ukraine.'
  it: ''
- hash: a77cb1ed
  kind: cards
  en: 'Cut the physical and economic ties to Russia and Belarus: no Russian gas since 2023, desynchronisation from the Russian grid in February 2025, imports from Russia down 68% in 2025 (EUR 125.6m), a
    ban on a widening list of Russian and Belarusian goods from 1 September 2026, and a shut Silene crossing with Belarus.'
  it: ''
- hash: 9e1a499a
  kind: cards
  en: 'Close the gap between a state of 1.9 million people and the cost of its security by using the EU and the Nordic-Baltic neighbours as force multipliers: SAFE defence loans (EUR 3.49bn requested and
    approved), Rail Baltica as a military-mobility corridor, joint procurement and a Baltic Regional Military Mobility Area.'
  it: ''
- hash: efacec84
  kind: cards
  en: 'Keep the state cohesive and governable under pressure: integrate (or filter) the Russian-speaking minority through state-language exams, finish the Belarus border barrier, and hold a government together
    after the May 2026 collapse; the 3 October 2026 election returned Prime Minister Kulbergs'' United List first with about 35% and 41-42 of 100 seats.'
  it: ''
- hash: 851e55a8
  kind: cards
  en: 'Maximum alignment with the Western institutions that guarantee it: NATO (member since 2004), the EU and the euro, plus the Baltic trio (Baltic defence ministerial committee, chaired by Latvia in
    2026), the Nordic-Baltic Eight and the UK-led Joint Expeditionary Force. Against Russia, it downgraded relations to charge d''affaires level in February 2023, expelled diplomats in 2024 and had the
    Saeima declare Russia a state sponsor of terrorism on 11 August 2022.'
  it: ''
- hash: 8a74ee73
  kind: cards
  en: 'Niche leadership on Ukraine that makes a small state visible in Washington, London and Brussels: the Drone Capability Coalition (with the UK, set up 14 Feb 2024; 12,000 Latvian-made drones to Ukraine
    under it in 2025), the push to use the immobilised Russian central bank assets, and the Drone Summit in Riga on 27 May 2026.'
  it: ''
- hash: 7bbf7bd1
  kind: cards
  en: 'Counter-intelligence and public exposure: the State Security Service (VDD) publishes the Russian and Belarusian threat in detail (annual report of February 2026 names Russian services the main threat,
    with Belarusian and Chinese services also flagged), prosecutes sabotage cells recruited from ex-convicts and the drug-dependent, and screens Russian citizens'' residence through the language exam.'
  it: ''
- hash: 5fadce59
  kind: cards
  en: 'A conscript army plus a NATO brigade: 11-month national defence service for men aged 18-27 (women volunteer; 1,076 conscripts started by mid-2025), the Canadian-led brigade at Adazi with Danish,
    Swedish and other contingents, 173 km of fenced Belarus border (barrier finished 2024, sensors due end-2026), a Baltic Defence Line with EUR 303m over five years, HIMARS (from 2027), IRIS-T (from 2026)
    and EUR 50m for drones in 2026.'
  it: ''
- hash: 1674fb77
  kind: cards
  en: 'Economic decoupling as security policy: Russian gas banned since 2023; imports from Russia down 68.2% in 2025 to EUR 125.6m (0.5% of imports) and from Russia and Belarus combined from EUR 2.13bn
    in 2022 to EUR 193m in 2025; import bans on agricultural goods (2024) and industrial goods (1 Sep 2026); desynchronisation from BRELL on 8-9 Feb 2025 (EUR 1.6bn, 75% EU-funded); the 2018 shell-company
    ban that ended the non-resident banking model.'
  it: ''
- hash: 1a4d651e
  kind: cards
  en: 'Size: 1.9 million people, about 200 border-guard posts unfilled on a 173 km Belarus border and a Russian border besides, and an army that depends on allied battalions for a first defence; the Canadian-led
    brigade is the only large permanent allied unit and the US rotational presence is in review.'
  it: ''
- hash: 97ff6700
  kind: cards
  en: 'Dependence on a United States whose commitment is now a matter of debate: Washington warned Nordic and Baltic states of delays to approved weapons orders, Trump has threatened to leave NATO, and
    the Pentagon''s 2026 posture review left Lithuania and Estonia with rotation gaps (Latvia''s HIMARS arrive from 2027 and depend on US delivery).'
  it: ''
- hash: 288f4c5e
  kind: cards
  en: 'Fiscal room: defence at 4.91% of GDP is financed under the EU''s national escape clause, with the Commission projecting a deficit of 3.3% of GDP in 2026 and 4.3% in 2027, while the Defence Ministry
    says it needs a further EUR 92m next year and Rail Baltica carries a Latvian funding gap of about EUR 4.4bn.'
  it: ''
- hash: 6d76c8d3
  kind: cards
  en: 'A fragile and fragmented politics: governments rarely last a term (the Silina coalition collapsed on 14 May 2026 after the Rezekne drone incident, a caretaker cabinet under Kulbergs served until
    the election), turnout was 51.8% on 3 October 2026, and the second and third parties are Latvia First (13.1%) and the pro-Russian Sovereign Power (11.7%).'
  it: ''
- hash: 83e4978a
  kind: cards
  en: 'Demography and geography: about 37% of residents are not ethnic Latvians and are mostly Russian-speaking (census 2021), 9% of residents were non-citizens in 2024, and Russian and Belarusian territory
    lies on the east and south; Russia can reach Latvia with jamming, drones and sabotage without crossing a border.'
  it: ''
- hash: 025111d5
  kind: cards
  en: 'Energy exposure after the break with Russia: no LNG terminal of its own (gas comes through Lithuania''s Klaipeda), the Incukalns store was at 10.5 TWh on 12 January 2026, 4.7 TWh below the year before,
    and the Baltic grid is now a European island link exposed to subsea cable attacks.'
  it: ''
- hash: 6b49a202
  kind: cards
  en: 'The border that was sealed became a transit lane under siege. The Belarus barrier was finished in 2024 and Silene is closed, yet attempts rose to about 10,000 in the first eight months of 2026 (12,046
    in all of 2025) and moved underground: two tunnels in August 2026. Latvia is not a destination, so it spends its scarce guards stopping people bound for Lithuania and Germany, and Minsk, which gains
    from the pressure, loses nothing by it.'
  it: ''
- hash: 35e7649f
  kind: cards
  en: Backing Ukraine brought the war's debris to Latvian soil. On 7 May 2026 Ukrainian drones, diverted by Russian electronic warfare, hit an oil depot at Rezekne; the Defence Minister who had delivered
    the 4.9%-of-GDP budget was forced to resign on 10 May by the Prime Minister herself, and the government fell on 14 May. The support that makes Latvia safe by making Russia lose created the political
    exposure of the air-defence gap.
  it: ''
- hash: 0dd1c4eb
  kind: cards
  en: Screening Russian citizens by language protects the state and feeds the grievance it is meant to starve. The exam rule (extended on 20 June 2024 to about 5,000 permanent residents under 75) removes
    people Moscow could instrumentalise, but 61% failed the first sitting in 2023, the measure confirms Russian state narratives of discrimination, and a campaign courting the Russian-speaking minority
    took 13.1% (Latvia First) and 11.7% (Sovereign Power) in October 2026. The link between the rule and the vote is our inference.
  it: ''
- hash: 0cd074f2
  kind: cards
  en: Buying self-reliance abroad. The defence build-up is financed by an EU escape clause that pushes the deficit to 4.3% of GDP in 2027 and spent on systems made in Germany (IRIS-T, EUR 600m with Estonia)
    and the United States (six HIMARS, from 2027) whose delivery slots depend on those suppliers' own rearmament; Washington has already warned Nordic and Baltic buyers of delays.
  it: ''
- hash: 75de3d44
  kind: cards
  en: Demanding a ban on maritime services for the shadow fleet while its ships are refuelled from Latvian bunkering. Riga asked the EU in February 2026 to ban maritime services for Russian vessels and
    joined a 14-nation statement treating false-flag tankers as stateless, yet customs officials say Latvian-linked bunkering at sea is not prohibited; our reading is that the 2018 clean-up of banks ended
    the non-resident money business but left a maritime service niche that Russia's sanctions-evading trade still uses.
  it: ''
- hash: e058edf3
  kind: cards
  en: Cutting the cable to Russia exposed the cable to the sea. Leaving BRELL (8-9 February 2025, EUR 1.6bn) removed Russian leverage over the Baltic grid, but the new links run under a Baltic Sea where
    the Vezhen (January 2025, Sweden-Latvia cable) and the Eagle S (December 2024, Estlink 2) were seized over damaged cables, and the same desynchronisation limited short-term electricity trade.
  it: ''
- hash: 90d0dacd
  kind: cards
  en: 'Latvia is the textbook case of Luttwak''s weak-state strategy: a country of 1.9

    million with a long border and a large Russian-speaking population cannot win

    an attritional contest with Russia, so it plays the paradoxical game of making

    itself too costly to attack and too connected to be left alone. Every pillar

    borrows weight from outside: the Canadian-led brigade and Article 5 for

    deterrence, EU money and the escape clause for the budget, German and American

    factories for the kit, Lithuania''s terminal for the gas. The strategy is

    consistent but its cost is dependence on partners whose own commitment is

    wavering (US rotation gaps, weapons delays, the Pentagon posture review) and on

    an internal politics that has shown it can fall to a single drone: the May 2026

    crisis, the 52% turnout and 25% of the vote for two populist parties, one

    openly pro-Russian, are the soft flank. Russia is graded adversary because the

    Latvian state itself names it the existential threat and a sponsor of terrorism,

    not because Riga seeks its regime''s end; Belarus is a rival whose pressure is

    cheap to apply and costly to stop. Two signals that are not rows: the

    Silina government fell over an air-defence failure, not over foreign policy

    (Kulbergs, who took over, promised to hold defence at 5% of GDP and keep a hard

    line on Moscow), and part of the Russian-speaking population is still outside

    the citizenry (non-citizens were 9% of residents in 2024), so the election

    measures only part of the minority''s weight.'
  it: ''
- hash: b466cfa7
  kind: cards
  en: 'Win the Sahara as a settled fact: make Morocco''s 2007 autonomy plan the agreed basis of a settlement under Moroccan sovereignty. Security Council Resolution 2797 (31 Oct 2025; 11 in favour, none
    against, China, Russia and Pakistan abstaining, Algeria not taking part) made ''the autonomy plan proposed by Morocco'' the basis of negotiations; US-convened talks with Algeria, Mauritania and the
    Polisario followed in Madrid (early Feb 2026) and Washington (23-24 Feb 2026), and the Council meets again before MINURSO''s mandate expires on 31 Oct 2026.'
  it: ''
- hash: 96edeb74
  kind: cards
  en: 'Collect recognition as a currency: make a sentence on the autonomy plan the price of friendship with every partner, and lengthen the list - the US (Dec 2020), Spain (Mar 2022), the Netherlands (May
    2022), France (Jul 2024), Ghana and the UK (Jun 2025), Belgium (Oct 2025), Finland (Mar 2026), Kenya (Apr 2026), Mali, which withdrew its recognition of the Sahrawi Republic on 10 Apr 2026, and in Aug-Sep
    2026 Colombia (relations with the Sahrawi Republic frozen), Chile (joint communique) and Peru (a consulate in Dakhla).'
  it: ''
- hash: 8186cd2e
  kind: cards
  en: 'Make the territory irreversible by integrating it: a 1,055 km Tiznit-Dakhla highway (to be named after Trump), a planned deep-water Atlantic port at Dakhla, the Nigeria-Morocco gas pipeline that
    ends there, consulates in Laayoune and Dakhla, and EU trade preferences that cover Saharan goods (the 2019 amendment extended them; a new amendment replacing it has been provisionally applied since
    3 Oct 2025).'
  it: ''
- hash: 08dab015
  kind: cards
  en: 'Contain Algeria and deny it a veto over the file. Algiers cut relations in Aug 2021, closed its airspace and let the Maghreb-Europe gas contract lapse, and it spends four times as much on arms (USD
    21.8bn against Morocco''s 5.5bn in 2024). Rabat does not try to match the budget: it widens the circle around the dispute - outside patrons (US, France, Israel), the Atlantic and Sahel states - until
    Algeria''s position becomes the minority one.'
  it: ''
- hash: caa2a861
  kind: cards
  en: 'Extend Morocco''s reach along the Atlantic and into the Sahel: offer the landlocked Sahel states access to the ocean through Moroccan ports (the Royal Atlantic Initiative of 2023, ending at the planned
    Dakhla port) and tie the West African coast to the Nigeria-Morocco pipeline (USD 25bn, first gas expected 2031; an intergovernmental agreement backing it was signed at the ECOWAS summit in Freetown
    in July 2026).'
  it: ''
- hash: ca3d2ca1
  kind: cards
  en: 'Keep the monarchy''s grip while staging the national showcase: the 2030 World Cup with Spain and Portugal, the Africa Cup of Nations hosted in Dec 2025 - Jan 2026, and a place in Gaza''s stabilisation
    force. At home it faces the Gen Z protests of Sept-Oct 2025 (three killed on 1 Oct), youth unemployment of 27.2% (Q2 2026) and a Sept 2026 election that gave the Authenticity and Modernity Party (PAM)
    95 of 395 seats and made Fatima Ezzahra El Mansouri prime minister.'
  it: ''
- hash: 31c29074
  kind: cards
  en: 'Sahara-first bilateralism: every visit, communique and agreement is read for its language on the autonomy plan, and the foreign minister Bourita runs the file; Rabat has committed to table a detailed
    dossier on the plan, and migration cooperation is part of the bargain (Belgium, Oct 2025: migrant returns in exchange for support on Western Sahara; Spain''s 2022 declaration also tied the two).'
  it: ''
- hash: 969caaae
  kind: cards
  en: 'Normalisation with Israel as the price of US recognition: the Abraham Accords of 22 Dec 2020 bought Washington''s proclamation of 10 Dec 2020, and Israel itself recognised Moroccan sovereignty over
    the Sahara on 17 Jul 2023.'
  it: ''
- hash: 426fc820
  kind: cards
  en: 'A national narrative of victory: 31 October, the date of Resolution 2797, was declared a national holiday from 2026, and Moroccan press framed even China''s abstention as a diplomatic win - the audience
    is partly domestic, a public asked to see the Sahara as settled.'
  it: ''
- hash: b1933200
  kind: cards
  en: 'A modest budget (USD 5.5bn in 2024, up 2.6%) spent on imported capability: a USD 1bn US package of drones and precision-guided weapons advanced in Dec 2020, Israeli systems (Barak MX air defence
    reported operational in Jan 2026, a joint military work plan for 2026), and a place among the troop contributors to the Gaza stabilisation force (agreement signed 15 Jul 2026).'
  it: ''
- hash: ceb5e3ef
  kind: cards
  en: 'Infrastructure and market access as diplomacy: EU preferences extended to goods from the Sahara, the Dakhla port, the highway, the Atlantic pipeline, and the EU as the main market (EUR 62.2bn of
    goods trade in 2025). Money is the argument made to Sahel and West African states, to the Gulf (the UAE has shown interest in funding the pipeline) and to the US (Nigeria and Morocco sought US funding
    in May 2026).'
  it: ''
- hash: d762565f
  kind: cards
  en: The text that endorses autonomy also calls for a solution that 'provides for the self-determination of the people of Western Sahara'. Algeria did not take part in the vote and rejects the resolution,
    Russia echoed its objections, and the Polisario insists that any process include independence; the US special envoy Boulos said after three rounds that no solution was imminent. A Council text is not
    a settlement.
  it: ''
- hash: 9ec4d484
  kind: cards
  en: 'The arms gap: Algeria''s military spending rose 12% to USD 21.8bn in 2024 (8.0% of GDP, 21% of government expenditure) against Morocco''s USD 5.5bn. Rabat cannot win an arms race and depends on suppliers
    - the US, which on 24 Jul 2026 imposed a 12.5% tariff on Morocco in a wave on dozens of countries, and Israel - who can change policy.'
  it: ''
- hash: 277e7608
  kind: cards
  en: 'The European courts: on 4 Oct 2024 the Court of Justice annulled the EU-Morocco trade and fisheries agreements as applied to the Sahara, holding that the consent of the people of the territory is
    required. Rabat said the ruling did not concern it, and a new amendment replacing the 2019 one has been provisionally applied since 3 Oct 2025, but the legal front stays open.'
  it: ''
- hash: ca8cb149
  kind: cards
  en: 'Spain holds the other territorial lever and the migration valve: Madrid refuses to discuss sovereignty over Ceuta and Melilla (defence minister, 12 Aug 2026), and the crossing of 29-31 Jul 2026 (about
    49,000 entries by the Spanish count; 72 deaths reported by 2 Aug) shows the valve can run out of control.'
  it: ''
- hash: aa3a446a
  kind: cards
  en: 'Social strain: unemployment 9.5% overall and 27.2% among 15-24s (Q2 2026), external debt up from 42.6% to 45.1% of GDP between 2024 and 2025 (IMF, Mar 2026), and a Gen Z movement that took to the
    streets in Sept 2025 over health and education (at least 70 arrested on 28 Sept, three killed on 1 Oct). The Sept 2026 election left the largest party with 95 of 395 seats.'
  it: ''
- hash: b1138856
  kind: cards
  en: 'The king and the succession: Mohammed VI used a cane during Macron''s visit in Oct 2024 and had surgery for a fractured shoulder in Dec 2024; the heir, Crown Prince Moulay Hassan, was born in 2003.
    A strategy built on the king''s personal channels (Trump''s Throne Day letter, the highway) is only as durable as his reign.'
  it: ''
- hash: 02aca7ef
  kind: cards
  en: 'Winning the Sahara through Washington, Tel Aviv and Paris feeds the encirclement Rabat must contain. Each patron lets Algiers present Morocco as the bridgehead of hostile powers (visas imposed on
    Moroccans on 26 Sep 2024 for ''Zionist espionage''), Algeria''s budget rose 12% in 2024, and CFR expects it to keep backing the Polisario ''possibly militarily'': the more the file is won abroad, the
    less Algiers has to lose by refusing to sit.'
  it: ''
- hash: 2075b2e0
  kind: cards
  en: The migration valve that buys European votes also hardens the buyer. Belgium paid in Oct 2025 with a Sahara declaration in exchange for returns of migrants, Spain in 2022; but the Ceuta crossing of
    29-31 Jul 2026 and the Moroccan ministers' restatement of rights over Ceuta and Melilla in August made Madrid summon the Moroccan ambassador and rule out any dialogue on sovereignty. The lever works
    only while it is not seen to be pulled.
  it: ''
- hash: 000578b4
  kind: cards
  en: Integrating the territory exposes the partners who help. The Court of Justice ruled on 4 Oct 2024 that agreements covering the Sahara need the consent of its people, so each Dakhla project that a
    partner endorses (the EU amendment applied provisionally since 3 Oct 2025; Belgian trade missions to the southern provinces; the highway) widens the legal surface on which a court can later strike.
  it: ''
- hash: cc2f1f64
  kind: cards
  en: The showcase is also the grievance. Morocco won the U-20 World Cup (Oct 2025), hosted AFCON (Dec 2025 - Jan 2026) and prepares the 2030 World Cup, in the same months as protesters asked for hospitals
    and schools; and the AFCON final turned soft power into a quarrel with Senegal (19 fans jailed, CAF reversing the result in Morocco's favour on 17 Mar 2026, a royal pardon on 23 May). The link between
    stadium spending and the protests is our reading, not the sources'.
  it: ''
- hash: 7afa5877
  kind: cards
  en: Courting both halves of a split Sahel. The Atlantic Initiative offers the Alliance of Sahel States (which left ECOWAS) a route to the sea, while the Nigeria-Morocco pipeline depends on ECOWAS coastal
    states and an intergovernmental agreement signed at an ECOWAS summit; the first gas is expected in 2031 and the instability the pipeline must cross is the investor risk Carnegie names, with Algeria's
    Trans-Saharan pipeline competing for the same map.
  it: ''
- hash: 1755b734
  kind: cards
  en: The hedge buys abstentions, not votes. Morocco stayed out of the General Assembly vote condemning Russia in 2022 and signed a four-year fisheries deal with Moscow in 2020; it signed a Belt and Road
    implementation plan with Beijing in Jan 2022 and sent Bourita to Beijing in Dec 2025. On 31 Oct 2025 Russia and China still abstained on Resolution 2797, Russia echoing Algeria's objections.
  it: ''
- hash: c5528529
  kind: cards
  en: 'Morocco runs the strategy of a state that has turned a territorial claim into a currency and gets its partners to pay in it: the price of a warm relationship with Rabat

    is a sentence on the autonomy plan, and between 2020 and 2026 Washington, Madrid, Paris, London, Brussels and Bamako paid it, with the Security Council text of 31 October 2025 as

    the receipt. That is Luttwak''s relational manoeuvre in its cleanest form. The side that is weaker in arms (USD 5.5bn against Algeria''s 21.8bn) did not match the budget; it widened the circle

    around the dispute until the rival''s position became the minority one, and it spends on infrastructure that serves the claim (Dakhla, the highway, the pipeline) rather than on tanks.

    The paradoxes show where the currency inflates. The migration valve that buys European votes set off the Ceuta crossing of July 2026 and a Spanish refusal to discuss sovereignty;

    the Israeli bargain gave Algiers its encirclement story; integrating the territory widens every partner''s legal exposure after the Court of Justice rulings of October 2024; and the showcase

    politics of AFCON and 2030 sit beside a youth that took to the streets over hospitals and schools. Signals that are not rows: the US imposed a 12.5% tariff on Morocco on 24 July 2026,

    three weeks after the king announced a highway to be named for Trump, so a patron''s goodwill on the Sahara does not buy tariff relief; Algeria''s absence from the Council vote is a refusal

    to be bound, not a concession; and the next test is the MINURSO renewal due before 31 October 2026 and whether the framework agreement the US wanted before the summer ever takes shape.'
  it: ''
- hash: a5b078db
  kind: cards
  en: 'Keep French protection of its independence and defence: the 2002 treaty (in force 1 Dec 2005) makes France responsible for Monaco''s independence, sovereignty and territorial integrity, and Monaco''s
    sovereign action must accord with French fundamental interests.'
  it: ''
- hash: cbdfe330
  kind: cards
  en: Exit the FATF grey list and protect the banking and wealth-management franchise that depends on it. Monaco was added on 28 Jun 2024 over laundering of proceeds of overseas fraud and too few asset
    seizures; the June 2026 removal target was missed and the October 2026 plenary (26-30 Oct) is the next decision point.
  it: ''
- hash: b6c3cf7d
  kind: cards
  en: 'Keep the EU at the distance its residence rules require: the Principality will not accept the free-movement terms of an Association Agreement that would change the living, working and housing conditions
    of its nationals and residents. Talks begun in 2015 were suspended in September 2023 and have not resumed.'
  it: ''
- hash: e3ec7454
  kind: cards
  en: 'Ocean diplomacy as the soft instrument: the first French state visit to Monaco since 1984 (7-8 June 2025) produced a joint ocean declaration, days before the UN Ocean Conference in Nice that France
    and Costa Rica co-hosted. Monaco''s own role at Nice is not confirmed by the sources read.'
  it: ''
- hash: 2a0f956f
  kind: cards
  en: 'Anti-money-laundering reform under FATF and MONEYVAL monitoring as the price of the banking franchise. A joint FATF-MONEYVAL review of June 2025 found the Principality had largely addressed its action-plan
    items within the set timelines: a positive step, short of clearance.'
  it: ''
- hash: acff36f7
  kind: cards
  en: 'Humanitarian and cultural gestures toward Ukraine in 2022: the Prince''s offer to welcome refugees, a government coordination unit for their intake, and the cancelled 2022 Monte-Carlo Gala. No Ukraine-specific
    measure surfaced for 2025-26.'
  it: ''
- hash: bc5e5f2c
  kind: cards
  en: 'Defence is French by treaty: France can station forces on Monegasque territory at the Prince''s request or with his agreement (Article 4), and the Principality cannot defend itself. The treaty ties
    its external acts to French interests in politics, economy, security and defence.'
  it: ''
- hash: bb4bf7be
  kind: cards
  en: 'The EU route costs legal sovereignty: the legal study commissioned by the government (Cabinet Gide) warned that an Association Agreement would bring at least a partial loss of legal sovereignty,
    and the EU mandate could not meet the residents'' conditions.'
  it: ''
- hash: 68fa3ba3
  kind: cards
  en: Grey listing keeps the financial centre under supervision until the action plan is accepted. It does not by itself require enhanced due diligence or the rejection of customers, but it makes every
    banking relationship a risk-based review until the exit.
  it: ''
- hash: 525e8793
  kind: cards
  en: Protecting residents from EU free-movement terms keeps the residence and banking model that the EU and FATF want to supervise. The sovereignty Monaco wins in Brussels is the same one that its anti-money-laundering
    file must show it has used responsibly.
  it: ''
- hash: 735d6e47
  kind: cards
  en: 'Monaco is a sovereign city-state whose security is French by treaty and whose wealth rests on a banking and residence model that both the EU and the FATF want to supervise more closely. Its strategy
    is defensive and rule-bound: keep the French guarantee, refuse the EU terms that would open its residence rules, and pay the reputational cost of the grey list with reforms and checkpoints. Ocean diplomacy
    and the Prince''s humanitarian gestures are the soft instruments it can afford, not substitutes for protection.'
  it: ''
- hash: bdf29bb3
  kind: cards
  en: 'Join the European Union: candidate since 23 Jun 2022, accession negotiations opened 25 Jun 2024, first cluster (Fundamentals) opened on 15 Jun 2026 and cluster six agreed on 10 Jul 2026. The governing
    PAS aims to close negotiations by 2028 and join by 2030, and wrote the goal into the constitution through the Oct 2024 referendum (50.3% yes).'
  it: ''
- hash: 17a4556a
  kind: cards
  en: 'Protect the state and its elections from Russian subversion: dismantle the Shor network (party banned, Shor sentenced in absentia to 15 years, the Gagauz governor jailed for seven), pre-empt unrest
    plots and vote buying, and keep a pro-EU majority in parliament (PAS 55 of 101 seats on 28 Sep 2025).'
  it: ''
- hash: 9b905778
  kind: cards
  en: 'Remove the roughly 1,500 Russian troops from Transnistria and reintegrate the region peacefully: a 14-page non-paper of March 2026 sets demilitarisation, an internationalised civilian mission, a
    1+1 negotiating format and gradual extension of Moldovan fiscal, customs and trade law, but has no mechanism to make Russia leave.'
  it: ''
- hash: 7d9013e3
  kind: cards
  en: 'Break energy dependence on Russia and on the Transnistrian grid: no Gazprom gas bought since 2023, electricity re-sourced from Romania, and the Vulcănești-Chișinău 400 kV line (the first high-voltage
    link that avoids the Cuciurgan plant) built, though it has slipped past its end-2025 target.'
  it: ''
- hash: 594991d8
  kind: cards
  en: 'Buy hard security without leaving neutrality: EU Security and Defence Partnership (first ever, 21 May 2024), EUR 317m of European Peace Facility money including a EUR 120m mid-range air-defence package
    (13 Jul 2026), US security funding, and a 10-year defence strategy, while NATO membership stays off the table because the constitution says neutral and only a minority wants NATO.'
  it: ''
- hash: e78e2829
  kind: cards
  en: 'Rebuild an economy that lives on imports and remittances: Growth Plan money (up to EUR 1.9bn for 2025-27, paid against reforms), export reorientation to the EU (64.2% of goods exports in H1 2026),
    and growth after a near-stall in 2024 (0.3%) and a 2.4% recovery in 2025.'
  it: ''
- hash: b77a4d55
  kind: cards
  en: 'EU accession as the organising frame, tied to Ukraine''s: first cluster opened on the same day, the same dossier for the Hungarian veto. Romania is the sponsor inside the Union and the Chișinău trilateral
    of 27 Aug 2026 (Sandu, Dan, Zelensky) was billed as the first at presidential level. Exit from the Russia-led CIS: law promulgated 6 Apr 2026, effective 8 Apr 2027.'
  it: ''
- hash: e32628ef
  kind: cards
  en: 'Calibrated rupture with Moscow rather than a break: 45 Russian diplomatic staff expelled in July 2023, the ambassador in Moscow recalled for consultations on 11 Aug 2026 after a drone exploded at
    Crocmaz, but the embassy stays open and Russia''s own embassy says it is open to dialogue.'
  it: ''
- hash: 18ac8fa7
  kind: cards
  en: 'Lawfare and public attribution against the Russian-funded network: Shor''s party banned (2023) and Shor convicted in absentia; Gagauzia''s Evghenia Gutsul sentenced to seven years (5 Aug 2025) for
    passing Russian money to it; 74 detained on 22 Sep 2025 for alleged training abroad to stage unrest; Sandu''s public warning that the Kremlin spent hundreds of millions of euros on votes; two opposition
    parties disqualified two days before the poll.'
  it: ''
- hash: ba0d5c2e
  kind: cards
  en: 'A small army with borrowed shields: EU air-defence financing (EUR 120m, July 2026; EUR 317m in all under the Peace Facility), US security aid approved by Congress in the 2026 budget (USD 36.5m, as
    reported), training from NATO members that the 2023 strategy names as ''security and defense partners''. Moldova fields no combat aircraft; drones from the Odesa front crossed its airspace repeatedly
    in 2026.'
  it: ''
- hash: 1054a6c8
  kind: cards
  en: 'Conditional EU money and market access as the substitute for Russian rents: Growth Plan tranches (EUR 189m in March 2026, EUR 157m in October 2026; about EUR 661m cumulative performance-based financing),
    EU 64.2% of exports and over 72% of foreign investment, and Moldovagaz as the legal channel that keeps gas flowing to Tiraspol (mandate to 31 Dec 2026) and with it a lever over the left bank.'
  it: ''
- hash: d77cced9
  kind: cards
  en: 'Russian troops sit on Moldovan soil and nobody has a means to remove them: about 1,500 soldiers of the Operational Group of Russian Forces in Transnistria (up to 11% of Moldovan territory outside
    Chișinău''s control), a promised 1999 withdrawal never carried out, FSB officers commanding the local security services, and no diplomatic path the Carnegie analysts can name. The OSW notes that unanimous
    EU consent for a country that does not control its own territory is ''highly unlikely''.'
  it: ''
- hash: e19dfe33
  kind: cards
  en: Neutrality is in the constitution and public opinion defends it. PAS has no two-thirds majority to change it, and polls put NATO support at about 20-30%; Sandu has said any change must come through
    a democratic process. The result is a state with no collective-defence guarantee, no combat aircraft, and air-defence capacity 'limited to protecting individual critical infrastructure sites' by Sandu's
    own account.
  it: ''
- hash: b840298f
  kind: cards
  en: The EU runs on unanimity and Moldova rides in Ukraine's slipstream. Hungary held the first cluster for almost two years; Budapest's new government lifted the veto in June 2026 but is still dosing
    the pace, so four clusters (internal market, competitiveness, green agenda, resources and cohesion) were not yet open in July 2026 and cluster three was released only through a letter on 17 Jul.
  it: ''
- hash: 43b78c58
  kind: cards
  en: An energy architecture that still passes through the breakaway region. Until 2024, Cuciurgan (Inter RAO-owned, in Transnistria) produced 60-80% of Moldova's electricity; even after Moldova stopped
    buying from it in January 2025 the Romanian power it imports travels over Transnistrian lines until the Vulcănești-Chișinău line is finished (still unfinished in June 2026). Replacement power costs
    more, and the Ministry of Economic Development now sees 2026 average inflation at 7.3%.
  it: ''
- hash: 21647eb2
  kind: cards
  en: 'A small, import-heavy economy with a thin cushion: IMF 2026 growth 2.3% in April and about 1.5% by August, a current-account deficit near 20% of GDP, a goods trade deficit of about EUR 1.6bn in Q1
    2026 alone, and remittances equal to 10.5% of GDP in 2024 (down from 14% in 2022), falling mainly from Russia while EU-origin flows grow.'
  it: ''
- hash: 35f68a78
  kind: cards
  en: 'A divided electorate and a rebellious autonomy: the pro-Russian Patriotic Bloc took 24.2% in September 2025, authorities say EUR 15m reached 130,000 people in the 2024 vote-buying scheme, and Gagauzia
    is in open conflict with Chișinău (Constitutional Court ruling of 9 Jul 2026 curtailing its powers, Bashkan post declared vacant on 17 Aug, election set for 15 Nov 2026 with a Romanian-language test
    for candidates).'
  it: ''
- hash: 8725a534
  kind: cards
  en: Waiting for Tiraspol to become unsustainable destroys the thing worth reintegrating. Gas stopped on 1 Jan 2025 and Transnistria's GDP fell 23% in H1, industrial output 33%, exports 42% in ten months;
    the Sheriff-linked business elite that sends about 80% of the region's exports to the EU is ruined first, and Carnegie warns the region may end as 'a deserted subsidized Russian military base' that
    Moldova will have to rebuild with a budget that 'cannot handle these expenses alone'. Success in squeezing the left bank raises the cost of winning it.
  it: ''
- hash: 766f1107
  kind: cards
  en: Neutrality, meant to keep war away, is the reason the army cannot get a shield and the Russian garrison cannot be challenged. The 2023 strategy ignores neutrality and cites Finland and Sweden; Russia
    reads every EU air-defence euro and training programme as NATO alignment; and the only rival garrison on the territory is the Russian one that neutrality is supposed to exclude.
  it: ''
- hash: 5ba4cdf1
  kind: cards
  en: Hitching the EU path to Ukraine's gives momentum and hostages. Both cleared the first cluster on the same day, but Moldova lost two years to a veto aimed at Kyiv, and the Foreign Minister (Popsoi)
    warns that putting Transnistria into a Ukraine-Russia settlement, as Sandu proposed in June 2026, would 'give the Kremlin a tool of influence and effectively a veto' over EU accession.
  it: ''
- hash: 5ff247c5
  kind: cards
  en: Protecting the vote with hard tools feeds the narrative of the people it protects against. Banning the Shor party, disqualifying two parties two days before the 2025 vote, jailing the Gagauz governor
    and curtailing Gagauz powers by court order are defensible against a funded network, but they hand the Patriotic Bloc, Comrat and Moscow the line of 'political persecution', in the autonomy where the
    Kremlin has long had its most reliable audience.
  it: ''
- hash: 43a3630f
  kind: cards
  en: The Romania card helps and harms. Sandu says she would vote for unification and Bucharest is Moldova's patron in the EU and on energy (Odesa Triangle, price caps on Romanian power), yet only 33-44%
    of Moldovans back union in the polls (IMAS July 2026; ATES March 2026) and Gagauzia's leader has threatened secession if Moldova joins Romania. Every Romanian gesture strengthens the case of those who
    call the EU path a 'Romanianisation'.
  it: ''
- hash: b064d9eb
  kind: cards
  en: The emigrants keep the state afloat and also decide its fate. Remittances equal 10.5% of GDP and the diaspora vote tipped the 2024 referendum to a 50.3% yes, so the pro-EU majority depends on citizens
    living abroad, while the departure of working-age Moldovans, the very thing that sends the money, shrinks the base that the 2028-30 EU timetable needs to reform.
  it: ''
- hash: 7f8af0d4
  kind: cards
  en: 'Moldova is a state whose strategy is to turn its geography into a European fact before Russia turns it into a Russian one. PAS and Sandu hold three keys at once: a parliamentary majority renewed
    on 28 September 2025 despite a funded opposition, a candidate status that became real negotiations in June 2026, and a security web (EU, Romania, Ukraine, the US in Congress) that substitutes for the
    alliance that neutrality forbids. The central Luttwakian pattern is that every victory in the East is paid for on the Transnistrian and Gagauz flanks: cutting Gazprom and Cuciurgan freed the right bank
    from blackmail but ruined the left bank it hopes to reintegrate; defending elections with courts and bans hardens the audience Moscow has always had in Comrat; and tying accession to Ukraine''s carries
    both momentum and the Hungarian veto. Two signals that are not rows: the decision to recall the ambassador from Moscow rather than expel the Russian embassy, which keeps the channel that Russia''s own
    embassy says it wants; and Sandu''s June 2026 call to put the Russian withdrawal into any Ukraine settlement, which her own foreign minister resists. Whether Moscow is an adversary is a question the
    ontology answers by structure: Russia''s declared aim in Chișinău is a compliant government, not the end of Moldova, and Moldova''s aim is a Russian departure, not Russian defeat, so the grade is rival,
    the hardest rival on the map.'
  it: ''
- hash: 1f9b408a
  kind: cards
  en: 'Carry the military takeover of October 2025 to a civilian-branded exit. Col. Michael Randrianirina, a military leader, took over after the Gen Z protests (the Guardian headline of 15 October 2025:
    ''military leader set to be sworn in as president''). His two-year roadmap, released at the end of February 2026, sets consultations to the end of 2026, a new constitution, and presidential elections
    due in late 2027. In March 2026 he dismissed the prime minister and the cabinet without giving a reason, and the Gen Z movement voiced concern about the ''militarisation'' of the regime.'
  it: ''
- hash: 4573d423
  kind: cards
  en: Win back African Union membership. The AU Peace and Security Council suspended Madagascar from all AU activities and organs on 15 October 2025. In February 2026 Malagasy press still reported the country
    pleading its case at the AU, so the suspension was in force then.
  it: ''
- hash: 4dee6f4c
  kind: cards
  en: Recover the Scattered Islands (Îles Éparses) from French administration. Madagascar disputes French sovereignty over the islands. Macron refused restitution during his April 2025 visit; the Franco-Malagasy
    joint commission's second meeting in Paris (30 June 2025) made no progress; and in September 2026 the file stayed on the UN General Assembly agenda (date from a news summary, page not opened).
  it: ''
- hash: 78965d21
  kind: cards
  en: Paris and Washington as channels. Randrianirina went to Moscow and then Paris in February 2026, where Macron received him at the Élysée on a trip Malagasy coverage framed as economic. In September
    2025 the trade minister went to Washington to plead for AGOA renewal.
  it: ''
- hash: 3301cfd3
  kind: cards
  en: The trade base. China has been Madagascar's largest trading partner for nine consecutive years, by China's own statement to the WTO. US market access under AGOA was due to lapse at the end of September
    2025, and its renewal was still before the US House in February 2026.
  it: ''
- hash: 3d13139f
  kind: cards
  en: Donor money has been frozen for years. The EU cut off aid to Madagascar in June 2010 and began releasing suspended funding only in November 2025. AGOA, the US trade preference, was still pending before
    the House in February 2026. No source found quantifies either loss.
  it: ''
- hash: e5dbc91e
  kind: cards
  en: Legitimacy at home and abroad. The AU suspension of 15 October 2025 is the formal constraint. The military leader denies that the takeover was a coup and says the Constitutional Court 'transferred
    power' to him. The Gen Z movement says it is not reassured by the regime's militarisation.
  it: ''
- hash: 5ecd8551
  kind: cards
  en: The officers who took power as the answer to the protests are why the protesters and the donors are not persuaded. The March 2026 sacking of the prime minister and the cabinet, with no reason given,
    weakened the civilian face of the transition just when the regime needs the AU back and aid restored.
  it: ''
- hash: 6bf2d116
  kind: cards
  en: 'Madagascar''s grand strategy in 2026 is to turn a military takeover into a managed transition: an elected successor by late 2027, the African Union back in the room, and the Scattered Islands kept
    on the agenda against Paris. Its levers are the powers already present on the island: France, with the islands and an Élysée channel used in February 2026; China, its largest trading partner; the United
    States, whose AGOA preference is still in renewal; and the EU, whose budget aid, frozen since 2010, only began to thaw in November 2025. The paradox is that the officers who give the regime its strength
    are also why the AU, the donors and the protesters are not yet persuaded.'
  it: ''
- hash: 1a1a2b96
  kind: cards
  en: Keep external debt serviced and refinanced without default. The USD 500m sukuk matured in April 2026 and was settled (about USD 525m with coupons, per one research brief), but the state still owes
    China and India and has little fiscal room.
  it: ''
- hash: 58c6786f
  kind: cards
  en: 'Keep tourism growing, the engine that pays the state: the ADB puts tourism at over 95% of services exports and close to 45% of government tax receipts (2024).'
  it: ''
- hash: 80c2871b
  kind: cards
  en: 'Win adaptation finance for a low-lying state: easier climate money for small islands, a multi-dimensional vulnerability index, and the Loss and Damage Fund made operational, as Muizzu argued at the
    UN in September 2024.'
  it: ''
- hash: 5d7b424a
  kind: cards
  en: 'India: a USD 400m and INR 30bn currency swap (October 2024), a INR 4,850 crore credit line (about USD 565m) announced in Malé in July 2025, and swap drawdowns renewed in April 2026. India is the
