  it: ''
- hash: 911f657a
  kind: cards
  en: 'Keep the security cooperation with Washington under Mexican control: cartel figures handed over, CIA flights and National Guard at the border accepted, but no US troops and no unilateral strikes
    on Mexican soil (''we operate in Mexico, no one else'', Sheinbaum, 2025-2026). Every other choice below is priced against the risk that Washington turns cooperation into intervention.'
  it: ''
- hash: 675a3758
  kind: cards
  en: 'Keep the USMCA and the tariff exemption alive through the 2026 review: Washington did not agree to extend the agreement at the joint review (USTR, 1 July 2026), so it now runs on annual reviews while
    bilateral rounds continue, and USMCA-compliant goods stay outside the general US tariffs. Sharpened 2026-10-16: the 25% fentanyl tariff this objective was first written against no longer exists. The
    US Supreme Court struck down the IEEPA tariffs on 20 Feb 2026 (6-3, Learning Resources v. Trump); a 10% Section 122 surcharge ran from 24 Feb; a 10% Section 301 tariff replaced it on 24 Jul 2026 for
    non-USMCA goods (Mexican government: it replaces, not adds to, the Section 122 duty). What Mexico now bargains for is relief from the sectoral Section 232 duties (steel and aluminium up to 50%, autos
    25%) and the rules of origin: it asks for zero tariffs on vehicles or quotas no tighter than the EU''s and South Korea''s (Mexico Business News, Sep 2026). As of 12 Oct 2026 the talks are reported stalled,
    with Trump pressing for energy deals with US companies (FT, via Mexico News Daily headline).'
  it: ''
- hash: 30f921a8
  kind: cards
  en: 'Keep the remittance flow and the migrant corridor intact: remittances received in Mexico fell to USD 61.8bn in 2025 (Banxico), the first annual fall in eleven years, under deportations and the 1%
    US remittance tax, and Mexico cannot afford a rupture that would cut it further.'
  it: ''
- hash: 1b299bc5
  kind: cards
  en: 'Diversify the trade base away from the United States without alignment with anyone: the modernised EU agreement signed on 22 May 2026, and, on the Asian side, tariffs on cars and other imports from
    countries without a free-trade agreement, aimed first at China and in force from 1 January 2026. Sharpened 2026-10-16: the 50% figure was the September 2025 proposal; the Senate passed the enacted text
    76-5 on 10 Dec 2025 with most lines capped at 35% (passenger cars 20% to 35%, steel articles 15% to 35%), 50% remaining on some auto, textile, plastic and steel lines (Thomson Reuters). Diversification
    is pursued by treaty with Brussels and by duties on Beijing, not by a bloc.'
  it: ''
- hash: d652801d
  kind: cards
  en: 'Hold the nearshoring investment that carries the economy through the tariff years: foreign direct investment reached a record USD 40.871bn in 2025 (Secretaria de Economia; +10.8%, fifth annual rise),
    38.8% of it from the United States and 10.8% from Spain, but 67.7% was reinvested profits and only 18% new money, and the last quarter of 2025 was a net outflow of USD 5.0bn. Plan Mexico is the instrument;
    the objective is to keep investors inside the USMCA perimeter while Washington decides its terms.'
  it: ''
- hash: 098c98e1
  kind: cards
  en: 'Keep a principled, non-interventionist voice in Latin America at no cost to the US track: condemn the US operation in Venezuela (3 Jan 2026) as a violation of the UN Charter, grant diplomatic asylum
    (Betssy Chavez, Lima, 2025), and back Michelle Bachelet for UN Secretary-General when Chile withdrew its own support (Mar 2026). The voice is loud on Venezuela and asylum and quiet where Washington''s
    interests bite (the Cuban oil pause, the cartel designations).'
  it: ''
- hash: 5c12646f
  kind: cards
  en: 'Tariff wall on non-FTA imports: duties from 5% up to 50% on automobiles, auto parts, textiles, plastics and steel from China, South Korea, India, Vietnam, Thailand, Indonesia and others, over 1,400
    product lines, passed by Congress in late 2025 (Senate 76-5, 10 Dec) and in force from 1 Jan 2026; most lines are capped at 35% and passenger cars sit at 20% to 35% (sharpened 2026-10-16, Thomson Reuters).
    The US, Canada, Japan and the EU are exempt through existing agreements, which is the point: the tariffs are a price for Washington''s review.'
  it: ''
- hash: 99350c64
  kind: cards
  en: 'Cooperation as the currency of sovereignty: cartel figures transferred to US custody in three batches, 29 on 27 February 2025, 26 in August 2025 and 37 on 20 January 2026 (92 in all; sharpened 2026-10-16
    from the earlier wording ''dozens more'', NBC News), 10,000 National Guard at the border, and intelligence sharing that Mexico calls collaboration. Each transfer is presented as sovereign and autonomous,
    which is how Mexico keeps troops out while giving Washington what it asks.'
  it: ''
- hash: e3feb6fd
  kind: cards
  en: 'State oil as foreign policy: Pemex shipped nearly 20,000 barrels a day to Cuba from January to September 2025, the lifeline Havana depends on, and Mexico paused the shipments in January 2026, calling
    it a ''sovereign decision'' while refusing to link it to US pressure. The lever is real and Mexico uses it quietly. Sharpened 2026-10-16 from the CUB card: no fuel has gone since the US executive order
    of January 2026 (Reuters, 13 May 2026), and in June Sheinbaum said Mexico wanted to restart shipments through commercial and private firms, with no timeline.'
  it: ''
- hash: bc69073b
  kind: cards
  en: 'The National Guard and the army as the price of the tariff pause: 10,000 Guard troops sent to the northern border after the call of 3 Feb 2025 that paused the first 25% tariffs (about 1,650 to Ciudad
    Juarez and 1,949 to Tijuana at the start), and Mexican special forces, with US intelligence support, killed CJNG leader Nemesio ''El Mencho'' Oseguera on 22 Feb 2026 in Tapalpa, Jalisco. Sheinbaum says
    no US troops took part. The force is real and aimed where Washington points; the retaliation, vehicles burned and roads blocked in several states, is paid at home.'
  it: ''
- hash: '67506487'
  kind: cards
  en: 'Asylum, non-intervention and the UN as a sovereignty shield: the Estrada-era tradition of non-intervention is applied selectively but visibly. Mexico granted asylum to former Peruvian prime minister
    Betssy Chavez (Peru broke relations on 3 Nov 2025, restored 7 Aug 2026 under Keiko Fujimori, with safe conduct for Chavez under the 1954 Caracas Convention), condemned the US operation in Venezuela
    on 3 Jan 2026 and the Cuba embargo at the UN (voted for the General Assembly resolution ending it, Oct 2025, 165 to 7), and keeps backing Michelle Bachelet for Secretary-General. It costs little with
    Washington and builds the regional credit Mexico has no army to buy.'
  it: ''
- hash: e122b00e
  kind: cards
  en: 'The morning press conference as the sovereignty channel: Sheinbaum answers every US claim at the daily mananera, on the record and the same day. Examples: the rejection of US troops (May 2025), of
    a US invasion (Aug 2025), of the US claim that the Mexican government is linked to cartels (Jul 2026), and of Milei''s claim that Mexico funded an ''anti-Argentina campaign'' during the World Cup (27
    Jul 2026: ''it is false''). Denial is the narrative cover under which the cooperation of the other means goes on.'
  it: ''
- hash: e3ac8d34
  kind: cards
  en: 'Judicial reform and investor doubt: the 2024 reform elects Supreme Court justices from candidates nominated by the president, Congress and sitting justices, and foreign companies have reportedly
    held back about USD 35bn of investment over the uncertainty (WSJ, as cited by Aberdeen); nearshoring, which the economy needs, depends on the legal certainty and arbitration the reform puts in doubt.
    Date of the Aberdeen piece not confirmed. Added 2026-10-16: the first judicial elections were held on 1 June 2025 with about 13% turnout, reducing the Supreme Court from eleven to nine justices with
    twelve-year terms (AP and Guardian, as cited by Wikipedia; the Wikipedia page is the pointer, the two press reports the basis); a bipartisan US congressional concern (four senators'' letter of 27 Aug
    2024, House resolution H.Res. 454 of May 2025) ties the reform to the USMCA review, and the Wilson Center argues it raises the stakes of the review.'
  it: ''
- hash: e5521ec9
  kind: cards
  en: 'Pemex is a debt carrier: financial debt of about USD 79-80bn at the end of Q1 2026, the lowest since 2014 but still large, three consecutive quarterly losses, and a Moody''s B1 rating held at stable
    only because the state is expected to support it; Mexico''s own sovereign was cut to Baa3 by Moody''s. The state cannot spend its way out and cannot let Pemex fail.'
  it: ''
- hash: 7c6df236
  kind: cards
  en: 'Dependence on the northern market: the United States is Mexico''s largest trading partner and the first export market, and the USD 61.8bn of remittances come almost entirely from there. Every choice
    toward Washington is made with the USMCA unrenewed and the remittance tax in force; the room to refuse is small. Sharpened 2026-10-16 with the figure: exports were a record USD 664.84bn in 2025 and
    more than 80% went to the US market (INEGI, via Mexico Business News); the US takes 84.03% of non-oil exports (July 2025 data).'
  it: ''
- hash: c6d5cda0
  kind: cards
  en: 'The sectoral US tariffs stay while the general ones fall: Section 232 duties of 25% to 50% on steel, aluminium, vehicles and parts were carved out of the July 2026 Section 301 action and remain,
    and USTR Greer said in April 2026 that Mexico''s auto and steel sectors would probably not see their tariffs removed. Mexico can win the exemption for compliant goods but not the sectors that carry
    its industrial base; its retaliation option, a 25% tariff on US steel and aluminium, Sheinbaum says she would rather not use because it would raise prices at home.'
  it: ''
- hash: bbac473f
  kind: cards
  en: 'The cartels hold ground the army cannot take without paying for it: the killing of CJNG''s El Mencho on 22 Feb 2026 set off burnings and road blocks in Jalisco and other states, and US and Canadian
    embassies issued shelter-in-place warnings. A government that is judged by Washington on the cartel file has to keep delivering blows whose price is violence in its own cities, and a successor structure
    (the OSAC assessment of 9 Oct 2026 asks whether the cartel changed at all) may be as bad.'
  it: ''
- hash: d57d17c1
  kind: cards
  en: 'The input chain runs through China: Mexico''s trade deficit with China reached a record USD 119.86bn in 2024 (imports USD 129.8bn, exports USD 9.9bn, INEGI) and 76.8% of Mexican imports in Jan-Jul
    2025 were intermediate goods. The tariff wall on Asia and the rules-of-origin demand in the review both hit the inputs that Mexican exporters to the US need; Beijing opened a trade-barrier investigation
    in September 2025 and called the measure ''coercion''. Mexico cannot cut China out without cutting its own export base.'
  it: ''
