  it: ''
- hash: b807f042
  kind: cards
  en: Debt is the binding constraint. The sukuk was settled in April 2026 but the government has no fiscal room for a new shock and depends on Indian and Chinese lines to refinance.
  it: ''
- hash: 2a70933d
  kind: cards
  en: 'Tourism monoculture: tourism is over 95% of services exports and close to 45% of tax receipts, so closing the tourism door (for any reason) costs the state directly.'
  it: ''
- hash: 69953f02
  kind: cards
  en: 'Physical exposure: islands about one metre above sea level. The President calls sea-level rise an existential threat and cannot adapt without outside finance.'
  it: ''
- hash: 4a82cf67
  kind: cards
  en: The India Out campaign of 2023-24 brought the Indian troops home, and within months India accepted civilian replacements and a currency swap. The campaign brought India back as lender of last resort,
    the very dependence it was meant to end.
  it: ''
- hash: f627a435
  kind: cards
  en: Male buys time with money, not force. The India Out campaign of 2023-24 ended in a debt-driven repair with New Delhi, which now lends the currency reserves and the credit lines, while China stays
    the largest bilateral creditor and the source of defence assistance and a trade deal in force since 2025. Tourism is the economy that pays for both, which makes the state hostage to the arrivals it
    must keep open, and the sea that threatens it is the argument for every climate loan it asks for. Its line is to be useful to every big lender at once; its paradox is that the campaign against Indian
