  en: 'Venezuela after 3 January 2026 is a state governed from outside on its purse: the United States took the president and let his successor govern under licences Treasury can revoke and oil money Washington
    holds. Its objectives are the survival of that government, the revenue of its oil, and a restructuring of debt that may run to USD 240bn, while the Essequibo claim is the one cause that holds the chavista
    base together. The old external network has been cut rather than replaced: Cuba lost its oil, Iran was summoned for a remark, Russia and China are creditors with little to offer, and Brazil and Colombia
    give recognition and talks. The open questions are the elections promised without a date and the ICJ judgment expected by early 2027.'
