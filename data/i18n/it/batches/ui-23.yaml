- hash: 189b4925
  kind: ui
  en: 'Every relation row of the dependency layer that carries a value, written from either card, between two actors of which at least one grades the other rival or adversary in a hand-written stance of
    confidence A or B. The row is written from the card''s side and describes the link, so it does not by itself say which side depends: the line says. A lever written from both cards with the same measure
    shows once. Organisations count here, since the dependency is material (the Union buys gas) and not a vote. ⟨n⟩ pairs, ⟨n⟩ rows, out of ⟨n⟩ dependency rows with a number. Next cuts, if this one holds:
    who holds the handle as a field of its own, and the levers between partners that could turn.'
  it: ''
- hash: ec266ec8
  kind: ui
  en: Watch
  it: ''
- hash: 00f792e0
  kind: ui
  en: 'Luttwak''s second rule for Byzantium, in <i>The Grand Strategy of the Byzantine Empire</i>: gather intelligence on the other and his mentality, and monitor his movements continuously. Constantinople
    kept an office for it, the Bureau of Barbarians, which read every envoy and every rumour from beyond the border. This page is the atlas''s monitor: every week, the events that GDELT codes from the world''s
    news are counted per country and set against the country''s own four-week average. A country is <b>surging</b> when it makes a multiple of its normal, whatever its size; it is <b>burning</b> when the
    conflict in its news runs above its normal. The loud, who make the most news every week, are listed apart so they do not hide the rest.'
  it: ''
