  en: How the watch works
  it: ''
- hash: c6ad5d19
  kind: ui
  en: 'The source is the <b>GDELT Project</b>, which has coded the world''s news into events since ⟨n⟩: for every event the two actors with their country codes, the kind of act on a scale from cooperation
    to conflict, and the number of articles that carried it. The atlas downloads one file a day, the last seven days plus four weeks before them, and counts for every country the events it was party to.'
  it: ''
- hash: cc7baeb0
  kind: ui
  en: 'What it is not: it measures the attention of English-language and major-language media, not what happened. A hurricane and a coup read alike until the conflict share tells them apart; the francophone
    Sahel and the Pacific read quiet for lack of coverage; a surge may be a summit or a scandal. It is a pointer, kept apart from the cards: the weekly update starts its searches from the surging and the
    burning, and nothing enters a card from here without a source read by a person. Nothing on this page is a reading of the atlas.'
  it: ''
- hash: 58e096de
  kind: ui
  en: About
  it: ''
- hash: 3ec243a1
  kind: ui
  en: 'Grand Strategy is a situation map of the world: for every state and state-like actor, what it wants, with what means, against which constraints, and how it sees everyone else. The reading grid is
    Edward N. Luttwak''s idea of grand strategy, and the site is built in his honour.'
  it: ''
- hash: 7e708f3c
  kind: ui
  en: What a card holds
  it: ''
- hash: 9da62453
  kind: ui
  en: 'Each actor with a full card carries its <b>objectives</b> ranked, its <b>means</b> by domain (diplomatic, informational, military, economic), its <b>constraints</b>, its <b>paradoxes</b> (the places
    where its own moves turn against it) and a short <b>reading</b>. Every claim has a source with a tier (official document, research, quality press, other) and a confidence grade: <b>A</b> an official
    document or two independent sources, <b>B</b> one good source, <b>C</b> press or our own inference, always shown.'
  it: ''
- hash: 111e5ab0
  kind: ui
  en: 'How one actor sees another is recorded on two axes. The <b>posture</b> is the relationship today, on a closed scale: own territory, claimed but not controlled, ally, reluctant ally, partner, reluctant
    partner, neutral, rival, adversary. "Adversary" is kept for mortal enemies, where the other''s existence or regime is the problem; nearly all bad relationships are rivalries. The grade follows the structural
    position, never the rhetoric of a communiqué: two members of the same alliance with open friction are reluctant allies, not rivals. The <b>bond</b> is what lies under the posture and would survive a
    change of government: kin, affinity, none, or grievance. On the map the posture is the colour of the outline and of the light inside a country; the bond is a band inside the border; a dashed band marks
    a partner aligned with the actor as a bloc, without a treaty.'
  it: ''
- hash: 280aa336
  kind: ui
  en: Relations
  it: ''
- hash: f89ef639
  kind: ui
  en: 'Under the postures sit the relation rows, in four layers: <b>objectives</b> (what an actor wants from another), <b>alignments</b> (treaties, memberships, recognitions), <b>dependencies</b> (energy,
    trade, debt, arms, remittances, with numbers) and <b>actions</b> (dated events: votes, sanctions, visits, exercises). The datasets are the floor: memberships from Wikidata and official lists, recognition
    tables from Wikipedia with their citations, every recorded vote of the UN General Assembly since ⟨n⟩ from the UN Digital Library. The cards are the reading on top of that floor. A lighter floor still
    is the <b>Watch</b>: every week the events GDELT codes from the world''s news are counted per country and set against the country''s own four-week average, Luttwak''s Byzantine rule of monitoring the
    other continuously; attention, not truth, kept apart from the cards, and a pointer for where the next update should look.'
  it: ''
- hash: bf125944
  kind: ui
  en: Strategy
  it: ''
- hash: d97aecc0
  kind: ui
  en: seams
  it: ''
- hash: 22988b31
  kind: ui
  en: 'A <b>client</b> is an actor that leans on another more than it is leaned on: it grades the other higher than the other grades it. Luttwak''s name for the arrangement is the <b>client system</b> of
    the early Roman empire, described in <i>The Grand Strategy of the Roman Empire</i>: the hegemonic empire of the Julio-Claudians ruled through client kings whose loyalty exceeded Rome''s commitment to
    them, which is why it was cheap. The Clients page measures the <b>lean</b> of every pair the atlas has read from both sides, in steps on the posture scale; the higher-grading side is the client, the
    other the patron. A client bound by kin or affinity is loyal; one bound by nothing, or by a grievance, is bought, and holds as long as the patron pays. The tepid ally, graded "ally" by its patron and
    answering "partner", is the costly kind, the one Rome subsidised. In the ledger under the map the lean column shows, for each counterpart, who leans on whom.'
  it: ''
- hash: f8bf2713
  kind: ui
  en: 'A <b>fault</b> is a relationship whose deep level contradicts its surface. The frame is Luttwak''s structure of <b>levels</b>: in <i>Strategy</i> success at one level can be undone at a higher one,
    and a strategy works only when its levels are in harmony. Here the levels are two: the bond, which would survive a change of government, and the posture of today. Two contradictions matter. The <b>feud</b>
    is kin graded rival or adversary, the quarrel inside the family, which Luttwak counts as the most intense of rivalries because closeness multiplies the points of contact. The <b>Byzantine alliance</b>
    is a grievance graded ally: the maxim from <i>The Grand Strategy of the Byzantine Empire</i> that every enemy is a possible ally, and the alliance that holds over an open wound because it must. The
    Faults page lists both, says whether each is felt by one side or both, and reads its trend as healing or tearing; on the map a fault shows as a bond band that contradicts the colour of its outline.'
  it: ''
- hash: a18e28fb
  kind: ui
  en: 'Every posture carries a <b>trend</b>, warming, stable or cooling, and the trends are the first derivative of the map: not where the relationships stand but where they are going. The frame is Luttwak''s
    <b>culminating point</b>, the moment at which a success begins to produce its own reversal. The Currents page reads the trends two ways. The alarms: allies that are cooling, which is the culminating
    point of an alliance, the protection that has begun to cost, and rivals that are warming, the rivalry past its useful peak. And two measures per actor: <b>drift</b>, which way its world is going, and
    <b>turbulence</b>, how much of it is moving. Each build keeps a snapshot of every grade, so the page can also say what changed since the last one. On the map, in the posture lens, a warming relationship
    pulses and a cooling one flickers, like phosphor brightening or dying.'
  it: ''
- hash: 1809e622
  kind: ui
  en: 'Below grand strategy in Luttwak''s ladder of levels sits the <b>theatre</b>, where geography and several actors'' forces add up and where strategy is actually conducted. The atlas keeps a hand list
    of seventeen theatres, from the Western Balkans to the Southern Cone, and computes for each a <b>heat</b> from what it has read between the members: declared hostility, seams, feuds, claimed territory
    and movements with stakes, divided by the number of possible pairs so that a small dense theatre is not outweighed by a large one. The Theatres page has its own map, lit by heat, and the list of what
    makes each theatre hot. A theatre whose members have few cards reads cold for lack of data, not for peace.'
  it: ''
- hash: fa275dc0
  kind: ui
  en: 'The <b>enemies of my enemies</b>. Luttwak reads Byzantium''s survival as the refusal to fight the enemy in front when the enemy behind him could be found and paid: the Khazars against the Avars,
    the Pechenegs against the Rus. The Flanks page runs that search for every actor: for each enemy it reads, who else reads that enemy as hostile, and whether that flank is already <b>recruited</b> (a
    written friendship, a treaty or a de facto alignment), <b>false</b> (the enemy of my enemy is my enemy too) or still <b>open</b>, the move nobody has made. The page shows the heaviest open flanks, where
    both the actor and the flank carry weight; an actor whose enemies have no enemies stands alone.'
  it: ''
- hash: b2ed426c
  kind: ui
  en: 'In ⟨n⟩ Luttwak gave a name to the form rivalry would take once the great wars were over: <b>geo-economics</b>, the logic of conflict in the grammar of commerce, capital in place of firepower, market
    penetration in place of garrisons. The atlas keeps the material dependencies between actors with their numbers: energy, trade, debt, investment, arms, troops. The Levers page lists every such dependency
    between two actors of which one reads the other as rival or adversary, the handle one side holds over the other, or that both hold. It is a first cut; the direction of each lever is in the row''s summary,
    not yet in a field of its own.'
  it: ''
- hash: 05d07b0b
  kind: ui
  en: How it is made
  it: ''
- hash: 8fd4cec6
  kind: ui
  en: 'The data lives in plain files, one per actor, separate from the site, and is versioned in the open: the whole history of every grade is in the repository. Cards are researched and drafted by language-model
    agents working from a shared brief and the atlas''s own rules, then reread by a stronger model that checks objectives, paradoxes and every posture grade against the sources and against the neighbouring
    cards; the owner samples the result. A new card''s grades retroact on the cards already written as provisional reciprocals, flagged as such until written from the other side. Nothing is embedded in
    the site: it renders the data as it stands on the day of the last build, and the stamp in the top bar says which day that was. The <a href="#/data">Data</a> page counts all of it: actors, readings,
    rows, sources by tier, the datasets and when they were taken, what the build derives, and what it has cost.'
  it: ''
- hash: f3c97271
  kind: ui
  en: What it is not
  it: ''
- hash: 44abebb4
  kind: ui
  en: 'It is not a forecast and not a verdict. Where a card says less than you expected, it is because the sources did not hold. Where a posture surprises you, open the dossier: the note under each grade
    says why it was read that way, and the footnote says who said so.'
  it: ''
