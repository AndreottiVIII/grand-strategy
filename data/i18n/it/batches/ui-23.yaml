- hash: 0b8b4498
  kind: ui
  en: 'Only hand-written stances of confidence A or B count. Each stance is weighted by its grade on a doubling scale: ally and adversary ⟨n⟩ reluctant ally and rival ⟨n⟩ partner ⟨n⟩ reluctant partner and
    neutral ⟨n⟩ <b>Drift</b> = (weight of warming stances − weight of cooling stances) / weight of all stances; <b>turbulence</b> = (weight of warming + weight of cooling) / weight of all. The bars show
    the two weighted shares, cooling to the left, warming to the right; the small figures give the raw counts and the weights. Actors with fewer than six written stances are left out of the rankings. The
    two lists at the bottom are read straight from the stances: allies and reluctant allies with a cooling trend, rivals and adversaries with a warming trend. Each build keeps a snapshot of every grade
    and trend in data/snapshots; the "since" section compares today''s build with the previous one. On the map, in the posture lens, a warming relationship pulses and a cooling one flickers.'
