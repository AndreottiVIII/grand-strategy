- hash: 20ce1974
  kind: ui
  en: 'A client is an actor that leans on another more than it is leaned on: it grades the other higher than the other grades it. Luttwak''s name for the arrangement is the client system of the early Roman
    empire, where the patron buys security cheaply because the client''s loyalty exceeds the patron''s commitment.'
  it: ''
