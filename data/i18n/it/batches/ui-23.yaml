- hash: 908a32be
  kind: ui
  en: How it is built
  it: ''
- hash: b9317313
  kind: ui
  en: 'One file per actor in three folders, the card, its postures, its relations, all in plain YAML, plus the datasets. The build (<code>tools/build.py</code>) validates every file, ids against the actor
    list, grades and types against closed vocabularies, dates, a source with a tier on every claim, and refuses to write on any error. It then derives the treaty allies from the memberships, mirrors every
    unanswered reading as a provisional one at confidence C, computes the pages (seams, buffers, clients, faults, gatherings, encirclement, flanks, levers, currents, theatres), keeps a snapshot of every
    grade so the next build can say what moved, and writes one JSON that the site renders. No fact lives in the site code. Data, method, decision log and code are public: <a href="https://github.com/AndreottiVIII/grand-strategy"
    target="_blank" rel="noopener">AndreottiVIII/grand-strategy</a>.'
  it: ''
