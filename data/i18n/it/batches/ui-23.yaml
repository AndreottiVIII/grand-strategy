- hash: db493def
  kind: ui
  en: 'The enemies of my enemies. Luttwak''s reading of Byzantium, in <i>The Grand Strategy of the Byzantine Empire</i>, is that the empire outlived Rome by a thousand years because it rarely fought the
    enemy in front of it: it found the enemy behind him, the Khazars behind the Avars, the Pechenegs behind the Rus, and paid him. For every actor and every enemy it reads, the build finds who else reads
    that enemy as hostile and whether the flank is already recruited, still open, or false, the enemy of my enemy being my enemy too. This page shows the heaviest open ones: the Byzantine move not yet made,
    where both the actor and the flank carry weight.'
