- hash: '66676024'
  kind: ui
  en: 'Where the world is moving. Every posture carries a trend, warming, stable or cooling, and the trends are the first derivative of the map: not where the relationships stand but where they are going.
    Luttwak''s frame is the <b>culminating point</b>: every success carries the seed of its own reversal, and the moment a relationship turns is the moment that matters. An ally that cools is the culminating
    point of an alliance, the protection that has begun to cost; a rival that warms is a rivalry past its useful peak, turning into détente.'
  it: ''
- hash: b2467f62
  kind: ui
  en: Drift · where each actor is going
  it: ''
- hash: eb0f1325
  kind: ui
  en: 'Each movement is weighted by what it moves with: an ally or an adversary counts ⟨n⟩ a reluctant ally or a rival ⟨n⟩ a partner ⟨n⟩ a reluctant partner or a neutral ⟨n⟩: each step doubles, so a movement
    with an ally weighs eight times one with a neutral. Drift is the weighted warming minus the weighted cooling, divided by the weight of everything the actor has read: +⟨n⟩ would be an actor whose every
    relationship warms, −⟨n⟩ one whose every relationship cools. A state that warms with three partners moves less than one that cools with a single ally.'
  it: ''
