  en: How flanks are found
  it: ''
- hash: 16434e38
  kind: ui
  en: 'For every actor A and every X that A grades rival or adversary, the build takes every Z that also grades X rival or adversary (hand-written stances of confidence A or B; organisations never count,
    only those who move). Z is <b>recruited</b> if A or Z already reads the other as ally, reluctant ally or partner, or if a treaty or a de facto alignment binds them; <b>false</b> if either reads the
    other as rival or adversary; <b>open</b> otherwise, which is the flank nobody has worked. An enemy with no enemies at all leaves A alone in front of it. The index counts open flanks: many open flanks
    are cheap options, none means the move is spent or the actor is alone.'
  it: ''
- hash: cf611b70
  kind: ui
  en: Levers
