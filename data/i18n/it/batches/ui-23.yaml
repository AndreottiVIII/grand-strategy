- hash: 14770c2a
  kind: ui
  en: 'A seam is an actor pulled two ways: it is an ally of two actors that are rivals or adversaries of each other. In Luttwak''s grammar the seam between an opponent and its allies is where relational
    manoeuvre aims, and where an alliance is tested first.'
