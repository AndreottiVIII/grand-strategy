- hash: 4714fae5
  kind: ui
  en: 'Heat is the sum of the weights between the members of a theatre, divided by the number of possible pairs, so a small dense theatre is not outweighed by a large one; ⟨n⟩ is the hottest theatre today,
    the others are scaled to it. Theatres whose members have few cards yet read cold for lack of data, not for peace: the card count says how far each one is written.'
