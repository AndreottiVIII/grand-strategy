  en: Who
  it: ''
- hash: 0d8a9a88
  kind: ui
  en: 'The truth is a folder of plain text. Every actor has three YAML files: the <b>card</b> (objectives, means, constraints, paradoxes, reading, each with sources and a confidence grade), its <b>stances</b>
    (how it reads every other actor: grade, trend, bond, since, last verified, note, sources) and its <b>relations</b> (rows in four layers: objectives, alignments, dependencies, actions). Vocabularies
    are closed: nine grades, four bonds, three trends, a fixed list of relation types. A stub is an actor with the first file only, a node without a card. Beside the cards sit the <b>datasets</b>, taken
    by small scripts from one source each and never edited by hand: states and memberships from Wikidata and the organisations'' lists, recognition tables from Wikipedia, every recorded vote of the UN General
    Assembly from the UN Digital Library, GDP, military spending and population from the World Bank, borders from Wikidata.'
  it: ''
- hash: be02dfdb
  kind: ui
  en: 'One Python script, the <b>build</b>, turns that folder into the site. It validates every file and refuses to write on any error: an unknown id, a grade outside the vocabulary, a date that does not
    parse, a claim without a source. It then derives what no card states: treaty allies from the memberships, a provisional mirror for every reading not yet answered from the other side, and the computed
    pages, seams, buffers, clients, faults, gatherings, encirclement, flanks, levers, currents, theatres, each by a rule written in the ontology. It keeps a snapshot of every grade, so the next build can
    say what moved. It writes one JSON for the site and one bundle per actor, so any other front end could read a state on its own.'
  it: ''
- hash: cadc270c
  kind: ui
  en: How it runs
  it: ''
- hash: 9c3e2b9b
  kind: ui
  en: How it changes
  it: ''
- hash: 6134851a
  kind: ui
  en: 'Everything is versioned in git, in the open: the whole history of every grade is in the repository, and a change to the ontology is made only with a journal entry. The atlas is updated on the editor''s
    call, never on a calendar. When he calls, the datasets are refreshed first (they cost nothing), then the dates the cards said to watch, then a short regional scan that lists the cards an event touched,
    then those cards only: a dated row added, a trend or a grade moved when a source says so, never a rewrite. Between calls, single news items go in as one dated row each.'
  it: ''
