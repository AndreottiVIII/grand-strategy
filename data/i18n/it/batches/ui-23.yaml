- hash: '21887389'
  kind: ui
  en: '<b>Strategy: The Logic of War and Peace</b> (⟨n⟩ revised ⟨n⟩) is the centre. In ordinary life linear logic rules: the shorter road is better, the stronger tool works best, more of a good thing is
    better. In any contest between conscious adversaries that logic fails, because the other side thinks and reacts. The bad road may be the good road because it is unguarded; the weapon that works invites
    the countermeasure that makes it useless; surprise is bought only with costs that would be absurd against an inert obstacle. The same logic has a temporal form, the <b>culminating point</b>: every success
    contains the seed of its reversal, the advancing army lengthens its own supply lines, the victorious power frightens the neutrals into a coalition, the sanction that bites teaches the target to do without.
    Pushed past that point, victory turns into defeat without any mistake having been made.'
  it: ''
- hash: 197bf8e8
  kind: ui
  en: 'The book''s second structure is vertical. Conflict runs on <b>levels</b> that interact but do not add up: technical, tactical, operational, theatre, and above them all grand strategy, where force
    meets diplomacy, economics, alliances, intelligence and persuasion. Success at one level can be undone at a higher one; strategy works when the levels are in harmony. Across all of them Luttwak distinguishes
    two styles: <b>attrition</b>, which wears the adversary down by superior resources and needs no understanding of him, and <b>relational manoeuvre</b>, which aims at his specific weaknesses and can win
    cheaply but fails badly when the reading is wrong. Great powers drift toward attrition; small states must manoeuvre. That is why, in this atlas, the cards of small states read as bets on usefulness
    and alignment, and the paradoxes of the great powers are about the coalitions their weight provokes.'
  it: ''
- hash: b08d86f1
  kind: ui
  en: '<b>The Grand Strategy of the Roman Empire</b> (⟨n⟩) reads four centuries of frontier policy as three successive systems: the hegemonic empire of the Julio-Claudians, ruling through client kings and
    a mobile army that rarely needed to fight; the preclusive frontier of the Antonines, with its fortified lines and legions spread along them; and the defence in depth of the late empire, which conceded
    ground and held strongpoints behind it. The same empire, with roughly the same forces, chose different ways of converting force into security as its enemies changed. <b>The Grand Strategy of the Byzantine
    Empire</b> (⟨n⟩) describes how the eastern half survived a further thousand years with far less: by avoiding decisive battle, buying and dividing enemies, using intelligence, religion and ceremony as
    instruments, fighting to exhaust rather than annihilate, and treating every enemy as a possible future ally. <b>The Grand Strategy of the Soviet Union</b> (⟨n⟩) applied the same reading to a living
    adversary.'
  it: ''
- hash: 4fdd376e
  kind: ui
  en: 'Two essays carried the logic beyond war. <b>"From Geopolitics to Geo-Economics"</b> (⟨n⟩) argued that with the superpower rivalry fading, states would pursue adversarial aims through economic means,
    subsidies, trade rules, control of technology, with the grammar of commerce but the logic of conflict: that is the logic of the dependency layer in this atlas, where gas contracts, pipelines, loans,
    arms and remittances are read as instruments rather than markets. <b>"Toward Post-Heroic Warfare"</b> (⟨n⟩) observed that advanced societies with small families will not accept casualties, so their
    wars become distant, aerial, delegated. <b>"Give War a Chance"</b> (⟨n⟩) drew the harder conclusion that an outside intervention which freezes a war before either side is exhausted often prolongs the
    conflict it means to stop, which is why "frozen" disputes are so prominent on these maps.'
  it: ''
