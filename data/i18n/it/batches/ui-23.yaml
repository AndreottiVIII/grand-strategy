- hash: b1c76653
  kind: ui
  en: 'The level below grand strategy in Luttwak''s ladder: the theatre, where geography and several actors'' forces add up, and where the readings on these pages become acute. Seventeen theatres, kept
    by hand; an actor may sit in more than one. The heat of a theatre is computed from what the atlas has read between its members: declared hostility, seams, feuds, claimed territory and movements with
    stakes.'
