  en: This site is built in honour of Edward N. Luttwak. It is not his work and he has not seen it; it is an attempt to look at the whole world, every state at once, with the lamp he built.
  it: ''
- hash: b2472473
  kind: ui
  en: 'This atlas reads the world through Edward N. Luttwak''s idea of grand strategy. Not because he is always right, but because his grid forces the questions that a map of flags leaves out: what does
    each actor want, with what, against what, and where do its own moves turn against it.'
  it: ''
- hash: 609ff766
  kind: ui
  en: The paradoxical logic
  it: ''
- hash: ff53aab1
  kind: ui
  en: 'Strategy: The Logic of War and Peace'
  it: ''
- hash: e949cb5b
  kind: ui
  en: The levels
  it: ''
- hash: 2b68afc8
  kind: ui
  en: 'Luttwak stacks conflict in levels that interact but do not sum: the technical, the tactical, the operational, the theatre strategy, and above them all <b>grand strategy</b>, where military force
    meets diplomacy, economics, alliances and persuasion, and where a state''s whole external conduct can be read as one design. This atlas lives on the top level only. It does not model battles or armies;
    it models what states and state-like actors want, the means they use across the four domains (diplomatic, informational, military, economic), what constrains them, and how they see each other.'
  it: ''
- hash: 9d3645e2
  kind: ui
  en: From the lamp to the data
  it: ''
- hash: 8244be36
  kind: ui
  en: 'Each actor with a full card carries: <b>objectives</b>, ranked; <b>means</b> by domain; <b>constraints</b>; <b>paradoxes</b>; and a short <b>reading</b>, the only free prose. Every claim has a source
    with its tier (official document, research, quality press, other) and a confidence grade: <b>A</b> an official document or two independent sources, <b>B</b> one good source, <b>C</b> press or our own
    inference, always shown.'
  it: ''
- hash: 2f215e8b
  kind: ui
  en: Posture and bond
  it: ''
- hash: '58122184'
  kind: ui
  en: What the atlas is not
  it: ''
- hash: 42ad8c60
  kind: ui
  en: 'It is not a forecast and not a verdict. It is a situation map: a dated, sourced, revisable statement of where everyone stands, built region by region, with the datasets (UN votes, memberships, recognitions)
    as the floor and researched cards as the reading. Where a card says less than you expected, it is because the sources did not hold.'
  it: ''
