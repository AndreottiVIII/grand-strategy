- hash: b0fa73c8
  kind: ui
  en: 'The lightest tier. A buffer is a partner of both of two actors that are rivals of each other, allied with neither: it belongs to neither and deals with both. Luttwak''s Roman grand strategy kept
    such states between the empire and its enemies on purpose, cheap to hold and useful to both sides as long as they stayed between. The seam is the ally torn; the buffer is the partner that profits from
    the quarrel until it is forced to choose.'
  it: ''
