# Translate every `en` into it. Write the translations to the file cards-26.out.yaml next to this one,
# as `items:` of `- hash: <same hash>` / `it: <translation>`, appending one item at a time (valid YAML at
# every step), never editing this file. Keep names, dates, numbers and quotes; register of a foreign-office
# brief: dry, precise, no flourish.
lang: it
items:
- hash: 53b4b764
  kind: cards
  en: 'Keep the one-party state in power and make it more efficient: To Lam, a career security officer, is both General Secretary (re-elected 23 Jan 2026 at the first plenum of the 14th Central Committee)
    and State President (elected 495/495 on 7 Apr 2026), after a restructuring that cut provinces from 63 to 34 and abolished the district tier on 1 Jul 2025. Regime security comes before every external
    aim.'
  it: ''
- hash: f144015f
  kind: cards
  en: 'Deliver growth that legitimises the Party: a target of at least 10% a year for 2026-2030 and high-income status by 2045, from an export base that depends on foreign-invested firms and on the US and
    Chinese markets at the same time.'
  it: ''
- hash: c9ca95cc
  kind: cards
  en: 'Hold the maritime claims in the Paracels (Hoang Sa) and Spratlys (Truong Sa) without a rupture with China: reclaim land at all 21 occupied Spratly features (about 2,771 acres by AMTI''s May 2026
    count, against China''s 5,460), protest in measured language, and keep party channels open.'
  it: ''
- hash: 185a3f87
  kind: cards
  en: 'Strategic autonomy by partnership web: comprehensive strategic partnerships with China, Russia, South Korea, India, the US, Japan and Australia, then Indonesia, Malaysia, Singapore and Thailand,
    and no alliance with any of them. ''Bamboo diplomacy'' in the foreign ministry''s own account is balance with every capital; Marston (Lowy): ''Strategic autonomy is the goal'', Hanoi ''averse to alliances''.'
  it: ''
- hash: 3554a02a
  kind: cards
  en: 'Secure energy for a 10% growth path: Rosatom''s two VVER-1200 units at Ninh Thuan 1 (2,400 MW, intergovernmental agreement of 23 Mar 2026, target before end-2031), Lao hydropower and wind (imports
    planned at 8 GW by 2030), and the JETP''s USD 15.5bn framework (coal capped at 30.2 GW, 47% renewables by 2030).'
  it: ''
- hash: 03b4925f
  kind: cards
  en: 'Raise Vietnam''s standing as a middle power that every great power wants to court: the first Vietnamese leader at the Shangri-La Dialogue keynote (29 May 2026), a founding seat on Trump''s Board
    of Peace (Jan-Feb 2026), state visits to Beijing (April), Manila, Bangkok, Singapore (May-June), Moscow and Paris (September).'
  it: ''
- hash: fb5367ad
  kind: cards
  en: 'Visits and partnership upgrades as the main instrument: To Lam went to Washington (20 Feb 2026), Beijing (14-17 Apr), Manila, Bangkok and Singapore (late May-June, 71 agreements), Moscow and Paris
    (7-12 Sep), with Canberra and Wellington next. Each capital gets a document, none gets a guarantee.'
  it: ''
- hash: b8ac5d7c
  kind: cards
  en: 'ASEAN as multiplier: Vietnam builds claimant-to-claimant ties (EEZ delimitation with Indonesia, December 2022; coast-guard memoranda with the Philippines, January 2024; renewed defence agreement,
    1 Jun 2026) .'
  it: ''
- hash: a181d16f
  kind: cards
  en: 'Measured public language: foreign ministry protests that call Chinese works ''illegal, null and void'' and demand they stop (March and 28 Aug 2026 on Antelope Reef and Yagong Island), while Party
    channels stay warm; the same Politburo that protests signs the rail agreements and a Global Security Initiative memorandum.'
  it: ''
- hash: 6e16f589
  kind: cards
  en: 'Quiet buildup rather than alliance: island reclamation at every Spratly feature, a DVOR navigation beacon at Barque Canada Reef (August 2025 to April 2026), 15 harbours, and a BrahMos anti-ship missile
    contract with India (disclosed 30 May 2026). Arms imports collapsed in 2023 and Russia''s share fell from about 90% (1995-2014) to under 70% (2015-2021).'
  it: ''
- hash: 419c55e6
  kind: cards
  en: 'The export platform: foreign-invested firms account for 76.2% of exports (USD 327.7bn in Jan-Nov 2025); the US took USD 153.1bn in 2025, electronics and computers about 27% of it. Market access is
    traded for tariff relief: the 20% / 40% deal of July 2025 and the October 2025 framework, with 50 Boeing aircraft for Vietnam Airlines.'
  it: ''
- hash: b6d4a7bb
  kind: cards
  en: 'Infrastructure and energy ties with neighbours: standard-gauge railways agreed with China (three lines, planning agreement of 25 Mar 2026), Lao power imports, EVFTA with the EU, investment and ODA
    from Japan and Korea (USD 5bn a year promised by Tokyo in May 2026; trade with Korea USD 94.6bn in 2024).'
  it: ''
- hash: 2d8b948a
  kind: cards
  en: 'China is the first trading partner and the largest supplier: 40.2% of imports in January-July 2025, and a trade deficit with China of USD 104.3bn in January-November 2025 (+38.1%). The supply chain
    that feeds the US-bound export machine runs through Chinese inputs.'
  it: ''
- hash: 1b8de76b
  kind: cards
  en: 'The US market and US tariff law: USD 153.1bn of exports in 2025 (about 30% of all exports), a 20% rate with a 40% transshipment clause from July 2025 that the Supreme Court''s February 2026 IEEPA
    ruling put in doubt, replaced by temporary and new Section 301 measures (10% and 12.5% bands reported, Vietnam possibly in the higher one; unconfirmed); the surplus with the US (USD 114bn in H1 2026,
    per one outlet) is the target of Washington''s pressure.'
  it: ''
- hash: 5b4e8215
  kind: cards
  en: 'Gray-zone inferiority in the Paracels: China has held them since 1974 and completed reclamation at Antelope Reef (AMTI, 14 Aug 2026) with a probable airstrip, plus new installations on Yagong Island
    that analysts read as an early-warning radar; Vietnam''s fishermen are the exposed party (Sept 2024 beating off the Paracels).'
  it: ''
- hash: 814cf8a3
  kind: cards
  en: 'A thin guarantor bench: no ally, no treaty obligation owed to it by any partner. In late May 2026 the US, India, Japan and Australia criticised ''ramming and blocking'' in the South China Sea without
    naming China, and China''s military drove a Dutch frigate away from the Paracels days before 1 June; partnership documents are not defence commitments.'
  it: ''
- hash: ddf1d013
  kind: cards
  en: 'Demography and the middle-income trap: fertility fell from 2.11 (2021) to 1.91 (2024) and the two-child limit was scrapped in June 2025; the working-age population peaks around 2040-42. The 10% growth
    target compares with World Bank 6.3%, IMF 5.6% and ADB 6% forecasts for 2026.'
  it: ''
- hash: e1a1e3ca
  kind: cards
  en: 'Power shortfalls and the coal-nuclear-import mix: demand growth forces imports from Laos and China, while the JETP caps coal at 30.2 GW; the Russian nuclear project returns the energy plan to Rosatom,
    a sanctioned supplier, just as Hanoi asks Washington for advanced technology (the February 2026 agenda included Washington''s planned removal of Vietnam from the strategic export-control list).'
  it: ''
- hash: 1a2a5a51
  kind: cards
  en: Building to deter China invites China to build more. Vietnam has reclaimed land at all 21 Spratly features it holds (AMTI, May 2026) and Chatham House asks whether this opens a 'Pandora's box'; four
    months later Beijing finished Antelope Reef, the likely largest feature in the sea, and put new works on Yagong. Hanoi's deterrent move supplied the rationale for the very hardening it fears.
  it: ''
- hash: 1d640d10
  kind: cards
  en: 'The better the export machine runs, the louder the tariff threat. Exports to the US rose 28.1% in 2025 to USD 153.1bn and the surplus reached USD 114bn in H1 2026, while China supplies 40% of its
    imports: Washington''s transshipment clause and the Section 301 investigations (capacity, IP) are aimed at exactly the success that finances the 10% growth plan, and the inputs Vietnam needs most come
    from the country Washington would like it to distance itself from.'
  it: ''
- hash: fb22e876
  kind: cards
  en: Selling neutrality to everyone leaves no one obliged to defend it. Eleven partners hold comprehensive strategic partnerships with Hanoi, and none owes it protection; each upgrade is a courtesy to
    the host and a bet by the guest, so the more partnerships Vietnam collects, the more it depends on the one neighbour (China) that is not bound by any of them.
  it: ''
- hash: 6b80efd3
  kind: cards
  en: Consolidation speeds decisions and removes the check that made balancing credible. Fusing Party and State in one man copies the Chinese and Lao model (AP) just as Hanoi insists on autonomy from Beijing;
    Giang (ISEAS) warns that concentrated power can move faster than institutional reform, and the collective leadership that used to veto lurches toward either capital is gone.
  it: ''
- hash: 820dcdf9
  kind: cards
  en: 'Hedging on arms: moving away from Russian weapons while moving toward Russian reactors. SIPRI-based reporting shows Russian weapons fell to USD 72m and payments were blocked by US sanctions; Hanoi
    turned to India (BrahMos, 2026) and Western vendors but signed the Ninh Thuan intergovernmental agreement with Rosatom (23 Mar 2026), extended Vietsovpetro to 2050 and hosted Putin''s welcome on 9 Sep
    2026 - the same weeks it asked Washington for advanced technology.'
  it: ''
- hash: 6f0c85a4
  kind: cards
  en: The buffer turned flank. Vietnam installed and sustained the Cambodian government after 1979, yet Phnom Penh now takes Chinese money for the Funan Techo canal (USD 1.15bn PPP, second phase launched
    April 2026) and a Chinese-rebuilt Ream naval base; Hanoi, which asks for 'comprehensive impact assessment', has no lever left except the Mekong water it shares.
  it: ''
- hash: a7d79f0a
  kind: cards
  en: 'Vietnam is the state that fought the two great powers of the twentieth century and now sells its neutrality to both of them, plus everyone in between. Luttwak''s logic of strategy predicts a small
    state next to a giant to either bandwagon or build a coalition; Hanoi does something third: it builds a web of eleven comprehensive strategic partnerships, refuses every alliance, and spends its leverage
    on becoming indispensable rather than protected. Indispensability is real - it is the electronics platform of Samsung and other foreign groups, the Spratly claimant with the most reclaimed land after
    China, the rice and seafood exporter, the 100-million-strong market - but it is paid for in dependence on both markets: China supplies 40% of its imports, the US takes the largest share of its exports.
    The 2026 novelty is domestic. To Lam''s double crown (Party chief since August 2024 and State President since 7 April 2026, the 14th Congress behind him, the districts abolished) lets Hanoi decide faster
    and hedge more loudly - Washington in February, Beijing in April, ASEAN capitals in May and June, Moscow and Paris in September - and with the same speed it removes the collective brake that made the
    balance credible. Two signals are not rows: the Supreme Court''s February 2026 ruling that cancelled the legal basis of the 20% tariff left Vietnam holding a deal whose price Washington can rebuild
    by other means, and the August 2026 Chinese completion of Antelope Reef shows that Hanoi''s own island-building did not deter Beijing. Hanoi''s bet is that Beijing will keep tolerating a smaller neighbour
    that is good for Chinese manufacturing; its fear is that the Americans will treat it as a transshipment point and the Russians as a customer. Open question for 2027: whether the partners other than
    China will stay content with signed documents, or start to demand that Vietnam choose a side.'
  it: ''
- hash: 1149a361
  kind: cards
  en: 'Make the climate obligations of the big emitters binding in practice: the ICJ advisory opinion of 23 July 2025, requested by the General Assembly on Vanuatu''s campaign, and the General Assembly
    resolution of May 2026 that endorses it and calls for reparation.'
  it: ''
- hash: 31e8aa30
  kind: cards
  en: 'Finance infrastructure from Australia and China without giving either a veto over its territory: the Nakamal Agreement with Australia, signed on 29 June 2026 after a 2025 deferral, and the Namele
    development agreement with China, still unsigned.'
  it: ''
- hash: 82ed5184
  kind: cards
  en: 'Melanesian self-determination inside the Melanesian Spearhead Group: the Kanak cause in New Caledonia and UN access for West Papua, with Melanesian countries looking to ban Indonesia''s associate
    status over the delayed UN visit (NIT headline, 14 September 2026; summit timing not verified).'
  it: ''
- hash: c0f7c3da
  kind: cards
  en: 'Multilateral diplomacy: the climate campaign that brought the ICJ request (General Assembly resolution 77/276, March 2023), and the Melanesian Spearhead Group, founded in 1986 and given its treaty
    basis in Port Vila in 1988. These are the levers that let a small state act at the UN.'
  it: ''
- hash: b8534279
  kind: cards
  en: 'Concessional and project finance: a China Eximbank loan of RMB 541.9 million for the Luganville wharf, and a US$50 million Asian Development Bank loan sought for the Simonsen wharf in Luganville.'
  it: ''
- hash: 5d00d514
  kind: cards
  en: 'Policing and security partnerships: Australia becomes the primary policing partner under the Nakamal Agreement; Vanuatu already has policing arrangements with New Zealand, France and the United Kingdom;
    and China announced police equipment worth over US$400,000 (motorbikes, drones).'
  it: ''
- hash: 7d1127b4
  kind: cards
  en: 'A short-lived coalition: Jotham Napat, elected prime minister on 11 February 2025, is the fifth prime minister in four years, and members of his coalition withdrew backing for the September 2025
    Nakamal signing over sovereignty and limits on infrastructure investment.'
  it: ''
- hash: 9477eed4
  kind: cards
  en: 'Debt to China and exposure to hazards: press estimates of Vanuatu''s debt to China run from US$100 million to US$130 million, figures not reconciled; the magnitude 7.3 earthquake of 17 December 2024
    killed 14 people, affected about 80,000 and displaced more than 2,400.'
  it: ''
- hash: 876b700f
  kind: cards
  en: 'Visa-free access to the EU is gone: the Council ended the visa exemption for Vanuatu citizens on 12 December 2024 over the investor-citizenship scheme, after a partial suspension from 3 March 2022;
    passport holders now need Schengen visas.'
  it: ''
- hash: 90ca3f72
  kind: cards
  en: 'Vanuatu''s climate standing rests on being the small state that did least to cause the problem, yet its own citizenship-for-investment scheme is what the EU cited as a security and migration risk
    when it ended visa-free travel in December 2024: the passports it sold weaken the case it makes at the UN.'
  it: ''
- hash: 900d5695
  kind: cards
  en: 'Vanuatu is a small Pacific state that wins where size counts least: at the UN and the ICJ, where its campaign produced the July 2025 advisory opinion and the May 2026 resolution. Its binding limits
    are money and sovereignty: it needs Chinese and Australian finance, so it bargains over clauses (no foreign base, consultation rather than a veto) instead of aligning, and its coalitions change often
    enough to stall treaties. Open items: whether the Luganville wharf loan carries a debt-for-equity clause (the sources conflict), the text of the Namele agreement, the status of the Peace Corps programme,
    and the earthquake recovery after late 2025.'
  it: ''
- hash: edf30242
  kind: cards
  en: 'Keep the 1962 Treaty of Friendship with New Zealand as its security floor: Samoa has no formal military, and the treaty makes New Zealand its channel for defence help.'
  it: ''
- hash: 360b6cbb
  kind: cards
  en: 'Turn money from abroad into the budget: personal remittances were 22.4% of GDP in 2025 (24.0% in 2024), Australian budget support and flagship aid, and Chinese lending that was about 37% of external
    debt at end-2023 (our calculation from the Samoa Observer figures).'
  it: ''
- hash: e54f3335
  kind: cards
  en: 'Keep the labour schemes in New Zealand and Australia open while taxing their use: 3,798 Samoans recruited under New Zealand''s RSE scheme in 2024-25, a NZ$50 fee per worker from June 2025, and Australian
    PALM contracts capped at three years.'
  it: ''
- hash: '26072857'
  kind: cards
  en: Host of the 27th Commonwealth Heads of Government Meeting in Apia, 25-26 October 2024; Australia's Pacific Policing Initiative made its first deployment there, with more than 40 police from 11 Pacific
    countries on security.
  it: ''
- hash: 8d6b02ad
  kind: cards
  en: Official development finance from Australia (direct budget support A$105.5m; Tautai A$45m on governance and Tautua A$40m on human development) alongside Chinese loans, which are the main bilateral
    debt.
  it: ''
- hash: 0b7a0cab
  kind: cards
  en: 'Ocean as a legal instrument: the Samoa Marine Spatial Plan, legally adopted in June 2025, zones the whole exclusive economic zone and adds nine fully protected marine protected areas.'
  it: ''
- hash: 355a9cdb
  kind: cards
  en: 'No armed forces: defence rests on New Zealand and the 1962 treaty, so any military lever Samoa has is borrowed.'
  it: ''
- hash: 461712b2
  kind: cards
  en: 'Debt exposure: external debt was $810.4 million at end-2023, of which $299.8 million owed to China and $56.9 million to Japan; the 2023 IMF-World Bank analysis kept Samoa at high risk of debt distress.'
  it: ''
- hash: 126b70a2
  kind: cards
  en: 'Political churn: the budget was rejected on 27 May 2025, a snap election followed on 29 August, and the government sworn in on 16 September 2025 (FAST, 31 of 51 seats) has no sourced foreign-policy
    line beyond its March 2026 dispute with New Zealand over a matai title.'
  it: ''
- hash: ac78901f
  kind: cards
  en: New Zealand gives Samoa its security, but its navy ship Manawanui sank off Siumu in October 2024 and cut off Safata villages from fishing; within months the Chinese embassy gave WST$50,000 (NZ$30,000)
    to those villages, so the treaty partner's failure became China's showcase.
  it: ''
- hash: 19ebe44e
  kind: cards
  en: 'Samoa is a small state whose security sits in a 1962 treaty with New Zealand, whose money comes from remittances and from Australian and Chinese lending, and whose labour schemes send thousands of
    its people to work in New Zealand and Australia. The 2025 crisis changed who governs without changing that frame: Fiame Naomi Mataafa''s government lost its budget vote on 27 May 2025, a snap election
    on 29 August gave FAST 30 seats (31 with a later defector) out of 51, and the FAST faction led by Laauli Leuatea Schmidt, which had split from Mataafa earlier in 2025, became the government on 16 September.
    At the UN the atlas records yes votes on all six Ukraine landmark resolutions from 2022 to 2026 and an abstention on the September 2024 resolution ending Israel''s presence in the occupied Palestinian
    territory. The stage is the Commonwealth summit that Samoa hosted in Apia in October 2024, and no sourced foreign-policy line from the Schmidt government has been found beyond its March 2026 dispute
    with New Zealand over a matai title.'
  it: ''
- hash: a054ce28
  kind: cards
  en: Consolidate statehood - more recognitions, membership of the UN and of the organisations that confer it (Council of Europe, EU, NATO). The UN seat is blocked by the Russian and Chinese veto, so every
    other membership is the substitute.
  it: ''
- hash: 629c7a79
  kind: cards
  en: 'Anchor Kosovo in the Euro-Atlantic order: EU candidate status (membership application filed 15 Dec 2022), NATO membership (parliamentary resolution of March 2022) and the Council of Europe (application
    of 12 May 2022; PACE gave a positive opinion in April 2024).'
  it: ''
- hash: 6ae288f7
  kind: cards
  en: Hard security by transforming the Kosovo Security Force into armed forces (Javelins, Bayraktar drones, a state ammunition factory, a promised EUR 1bn for defence in the mandate) while keeping KFOR
    and the US as the guarantor.
  it: ''
- hash: 021c261d
  kind: cards
  en: 'Full sovereign control of the territory, above all the Serb-majority north: no Serbia-run institutions, judicial and police integration on Pristina''s terms, and a Community of Serb-majority Municipalities
    that does not become an executive entity.'
  it: ''
- hash: 7dabbcfe
  kind: cards
  en: 'Complete and stabilise its own institutions after 19 months of deadlock: a government (Kurti''s fourth cabinet, 13 Sep 2026) and a president (Justina Shiroka Pula, 6 Oct 2026) after three elections
    in under 18 months.'
  it: ''
- hash: 7329b03d
  kind: cards
  en: 'Economic convergence and less dependence on the diaspora: EU Growth Plan money (conditional on reforms), investment, and a trade balance that is not EUR 4.4bn in deficit in nine months.'
  it: ''
- hash: 702d90ca
  kind: cards
  en: Recognition diplomacy led by the presidency (Osmani's 'reconfirmed' and new recognitions in 2025-26, Saudi mediation for Syria), a founding seat on Trump's Board of Peace (22 Jan 2026) and a pledge
    of troops to the Gaza stabilisation force - visible loyalty to Washington as currency.
  it: ''
- hash: 98d3109c
  kind: cards
  en: Voluntary full alignment with EU foreign policy, including all restrictive measures on Russia and Belarus - praised by the European Parliament as 'a reliable partner' - and military aid to Ukraine
    (armoured vehicles, mortar rounds, March 2024) even though Kyiv does not recognise it.
  it: ''
- hash: 0aec0795
  kind: cards
  en: 'Defence alignment with Albania and Croatia: trilateral declaration on military cooperation signed in Tirana on 18 Mar 2025, which Belgrade called the start of an arms race.'
  it: ''
- hash: ef0ef53c
  kind: cards
  en: 'Kosovo Security Force in its final transformation phase: 246 Javelin missiles from the US (about USD 75m, approved January 2024), Bayraktar TB2 drones bought in 2023, a Turkish-supplied ammunition
    line, defence budget up from EUR 153m (2024) to EUR 207.8m (2025). NATO''s KFOR remains the actual shield.'
  it: ''
- hash: 0c1f5995
  kind: cards
  en: 'Trade coercion against Serbia: a ban on Serbian goods since June 2023 (Serbian exports to Kosovo fell from about EUR 240m to EUR 75m in June-December, year on year), eased at Merdare in October 2024;
    visa-free travel to the Schengen area since 1 Jan 2024 and a diaspora that sends about 13% of GDP.'
  it: ''
- hash: 50fd7b9f
  kind: cards
  en: 'Framing of Serbia as the aggressor through Banjska: the April 2026 life sentences, the unresolved case of Milan Radoicic (not extradited) and the Serb List as Belgrade''s instrument in the north;
    the 2022 line that ''Belgrade and the Kremlin should think twice'' ties Serbia to Russia.'
  it: ''
- hash: f26b9466
  kind: cards
  en: 'The veto wall: Russia and China block a UN seat; five EU members (Spain, Greece, Cyprus, Romania, Slovakia) and four NATO members do not recognise Kosovo, which keeps it from candidate status and
    from NATO. The European Parliament in June 2026 asked the Council only to grant candidate status ''once the criteria are met''.'
  it: ''
- hash: a8fe968d
  kind: cards
  en: 'Security is borrowed: KFOR had 4,739 troops from 31 nations in June 2026 and NATO announced on 12 June a reduction toward 3,000-3,500 over the next year (''could be reversed''); the US contingent,
    just under 600, is under review.'
  it: ''
- hash: f6394416
  kind: cards
  en: 'Domestic arithmetic: a two-thirds majority (80 of 120) is needed to elect a president, which Vetevendosje (53 seats in June 2026, 47.1%) cannot reach alone; the result was the March 2026 dissolution
    decree, a Constitutional Court ruling, a failed vote on 27-28 April and a snap election on 7 June, with a president only on 6 October.'
  it: ''
- hash: 633dbb37
  kind: cards
  en: 'A north Belgrade can still reach: the Serb List swept all four northern municipalities in the 12 Oct 2025 local elections (59.8% turnout in Serb-majority municipalities) and returned to the institutions
    after a 928-day boycott; Serbia has not extradited the Banjska suspects (dozens at large).'
  it: ''
- hash: 243e0201
  kind: cards
  en: 'A narrow economy on remittances: about EUR 1.35bn in 2024 (13% of GDP by OECD, 17.3% by the World Bank series) and EUR 1.4bn in 2025, with a goods trade deficit above EUR 4.4bn in January-September
    2025 that remittances finance.'
  it: ''
- hash: d5565c36
  kind: cards
  en: 'Western patience on the north and on the dialogue: the EU froze funds and meetings for almost three years (June 2023 - March 2026) over the northern municipalities, and the UK ambassador called 2025
    a ''wasted year'' that left the Association of Serb Municipalities unformed.'
  it: ''
- hash: 81171cd1
  kind: cards
  en: Asserting sovereignty in the north costs the support that underwrites sovereignty. The 2023 installation of Albanian mayors in four Serb-majority municipalities brought EU measures (funds and high-level
    contacts suspended) that lasted until March 2026; Pristina won the facts on the ground and lost three years of Brussels.
  it: ''
- hash: be036d3f
  kind: cards
  en: The road to recognition runs through the agreement it will not finish. Ohrid (March 2023) obliges Serbia not to object to Kosovo's memberships and Kosovo to form the Community of Serb-majority Municipalities;
    Pristina refuses to send the EU-drafted statute to the Constitutional Court, which gives Belgrade its best argument and keeps the Council of Europe door shut.
  it: ''
- hash: fd7d37dd
  kind: cards
  en: The army it builds to deter Serbia is the argument Serbia uses to call it an aggressor, and it grows while the only real shield is being cut. Vucic read the Albania-Croatia-Kosovo declaration as an
    'arms race'; NATO announced a KFOR reduction and Washington is reviewing its contingent in the same year Pristina promises EUR 1bn for defence.
  it: ''
- hash: 2fa95423
  kind: cards
  en: 'Electoral dominance without institutional capacity. Vetevendosje won a record share in December 2025 and a second plurality in June 2026, yet could not elect a president for six months: the more
    it wins alone, the less the opposition cooperates on the two-thirds votes that complete the state.'
  it: ''
- hash: 60b62fe8
  kind: cards
  en: The war-memory law against the court that vouches for its Western backers. On 6 Oct 2026 parliament passed a law curbing the Specialist Chambers - three weeks after the court sentenced Thaci to 25
    years - under street pressure, just before it elected a president. The court sits in The Hague under EU-backed law, and a statute curbing it puts Pristina at odds with the partners whose support it
    needs.
  it: ''
- hash: b9e9481e
  kind: cards
  en: Alignment as a substitute for recognition. Kosovo applies every EU sanction on Russia and sends arms to Ukraine, and is praised by the European Parliament for it - but Ukraine does not recognise Kosovo,
    nor do five EU members, so the loyalty buys goodwill without moving the veto.
  it: ''
- hash: 25dec4fb
  kind: cards
  en: Betting on Trump's personal channel while Washington is cooling. Osmani signed the Board of Peace charter as a founding member and Kosovo pledged troops for Gaza, yet Vucic told N1 in March 2026 that
    he had expected a harder US response to Kurti's government, Washington launched a strategic dialogue with Belgrade on 17 Jul 2026, and the US wants UNMIK closed and is reviewing its KFOR contingent.
  it: ''
- hash: 58d3ebb5
  kind: cards
  en: 'Kosovo runs the strategy of a state that exists on the ground and not yet in

    law: every move is a bid to turn effective control into recognised status, and

    the only currencies it has are loyalty and usefulness to the West. That

    produces the central Luttwakian pattern: the actions that prove statehood

    (mayors in the north, the army, rail stations, the war-memory law) are the

    ones that cost it the patrons who could confer it, while the actions that would

    please the patrons (the Community of Serb-majority Municipalities, Serbian

    return to the judiciary) are those it fears would hollow out statehood from

    within. Since 2025 the pressure has eased on one flank (EU measures lifted in

    March 2026, institutions completed in September-October) and tightened on

    another (KFOR shrinking, a cooler Washington, the Specialist Chambers

    verdicts). Two signals that are not rows: the US launched a strategic dialogue with

    Belgrade on 17 July 2026 although Kosovo had joined the Board of Peace and

    pledged troops to Gaza, and the 6 Oct law on the Hague court was passed under

    street pressure, not diplomatic calculation. With

    the 25 Oct Serbian election ahead, Pristina''s real question is whether the

    stalled Ohrid road can be re-opened by a new government in Belgrade.'
  it: ''
- hash: df5aa2ba
  kind: cards
  en: Defeat or dismantle the Houthi authority and restore the state over all of Yemen, Sanaa included. On 4 Oct 2026 Rashad al-Alimi announced operations to retake the remaining Houthi-held areas ('a decisive
    phase'), after a general mobilisation call and an amnesty offer to Houthi defectors in late September.
  it: ''
- hash: b6a21a7d
  kind: cards
  en: Keep Saudi Arabia as paymaster, air force and political shield. Riyadh pays delayed salaries and grants, since January 2026 sponsors the forces Abu Dhabi used to fund, and made a state budget (the
    first since 2019, enacted March 2026) a condition of continued aid; al-Alimi calls it 'a true partner'.
  it: ''
- hash: afb7f213
  kind: cards
  en: 'Close the southern question inside the anti-Houthi camp without losing the south: Hadramawt, al-Mahra and Aden retaken in January 2026, the STC declared dissolved on 9 Jan (its UAE-based spokesman
    denied it), al-Zubaidi expelled from the PLC on 7 Jan and charged with treason, STC funds frozen on 17 Jun; the promised Saudi-hosted Southern Dialogue is postponed indefinitely and STC loyalists keep
    demonstrating against Saudi ''guardianship''.'
  it: ''
- hash: fe7b9c28
  kind: cards
  en: Retake the Red Sea coast and the Bab al-Mandab lost in September 2026 - Mokha (10 Sep), Mayyun/Perim and the Hanish islands (11 Sep). From 5 Oct government units claim to have reached Mokha and the
    Dhubab airfield with Saudi air cover; the Houthis and some wire sources dispute the extent.
  it: ''
- hash: 47904e6e
  kind: cards
  en: 'Rebuild a state economy: crude exports have been blocked since the Houthi drone strikes on the Nushayma and Dabba oil terminals in October 2022, government revenue fell to 5.6% of GDP, real GDP per
    capita is down 58% since 2015 and about three quarters of the population is below the poverty line. The rial in Aden appreciated sharply in August 2025 and then stabilised, helped by external inflows
    including Saudi support.'
  it: ''
- hash: c2c900d4
  kind: cards
  en: 'Keep international legitimacy and pressure on the Houthis and Iran: the UN sanctions regime renewed on 13 Nov 2025, the request of 13 Jul 2026 that the Panel of Experts investigate Iranian Mahan
    Air flights to Sanaa, and the Council press statement of 18 Sep 2026 condemning Houthi attacks and backing the government.'
  it: ''
- hash: c23f32ed
  kind: cards
  en: 'The PLC is the legal government: formed on 7 Apr 2022 when Hadi transferred his powers to an eight-member council under al-Alimi, seated in Aden; its standing at the UN lets it ask the Security Council
    to act (Mahan flight, 13 Jul 2026), and the Council held emergency meetings on Houthi attacks on 10 and 15 Sep 2026.'
  it: ''
- hash: ca86b6e2
  kind: cards
  en: 'Prisoner diplomacy under the UN envoy: the 14 May 2026 agreement signed in Amman to exchange 1,680 detainees (the Houthis release 580, the government 1,100; implementation due 10 July, postponed
    indefinitely) is the one surviving channel with Sanaa.'
  it: ''
- hash: 645b5b1b
  kind: cards
  en: 'Messaging of restoration and amnesty: al-Alimi''s mobilisation speech (25 Sep) and the 4 Oct announcement stress that Houthi-held cities and their people are not targets and offer an amnesty to defectors;
    the Houthis dispute the government''s battlefield claims.'
  it: ''
- hash: 759c357c
  kind: cards
  en: 'A Saudi-led military command and Yemeni units: National Shield, Giants Brigades and Tihama Resistance with coalition air strikes (82 Houthi sites claimed by the coalition by 8 Oct); a Supreme Military
    Committee under coalition leadership set up on 10 Jan 2026; a government strike on the Sanaa airport runway on 13 Jul 2026 to stop an Iranian aircraft.'
  it: ''
- hash: 652aa24f
  kind: cards
  en: 'Saudi money in place of Emirati money: a USD 90m package for delayed salaries, SAR 1.9bn (USD 507m) for development projects and a later SAR 1.3bn (USD 347m) grant for the deficit and wage bill,
    plus direct Saudi sponsorship of security forces; the 2026 budget enacted under Saudi condition.'
  it: ''
- hash: ec19fd19
  kind: cards
  en: 'Dependence on Riyadh, whose stamina is not guaranteed: the government cannot fund, arm or air-cover its own offensive. A Sana''a Center analysis says Riyadh has moved from containment to imposing
    costs, but may seek an exit if costs mount; since 8-10 Oct Houthi missiles have closed Riyadh''s airport and killed at least 13 people there.'
  it: ''
- hash: 95cee8a0
  kind: cards
  en: 'An anti-Houthi camp of commanders, not an army: the Sana''a Center calls a 32-minister cabinet ''untenable'' for this war and says local fighters are ''sacrificed'' in rivalries among pro-government
    commanders; the coast was given up in September, with units reported to withdraw from Mokha and Mayyun without a fight; in the south STC loyalists disrupted a pro-Saudi rally in Mukalla (1 Apr), stormed
    the Dhalea authority (19 Apr) and marched in Aden and Hadramawt against Saudi ''guardianship'' (20 Jun).'
  it: ''
- hash: c05fb035
  kind: cards
  en: 'The population is mostly on the other side: Houthi-held areas hold most of Yemen''s people, 23.1 million Yemenis are projected to need aid in 2026 (19.5 million in 2025), the 2025 response plan was
    28% funded, and more than 200,000 people have been displaced since fighting resumed - every offensive adds to the burden the government is supposed to carry.'
  it: ''
- hash: 69d20e49
  kind: cards
  en: 'No oil revenue and a split economy: crude exports remain blocked, grants fell, remittances are weak, the Spring 2026 World Bank monitor expects GDP to shrink again in 2026 (-0.5% after -1.5% in 2025),
    and the first budget since 2019 was built on the 2014 budget.'
  it: ''
- hash: 1246e8ca
  kind: cards
  en: 'Patrons with other priorities: Washington declined to strike the Houthis (Trump reportedly cancelled planned strikes on 20 Sep 2026), keeps a channel to them through Oman and gives Riyadh intelligence
    support; the Iran war pulls US attention and the Houthis'' Bab al-Mandab leverage is part of Iran''s bargaining with the US.'
  it: ''
- hash: 7dfbaf2b
  kind: cards
  en: 'A capable Iranian-backed enemy: the Houthis took the whole Yemeni Red Sea coast between 3 and 11 September, fire missiles and drones at four Saudi airports, and are reported to have IRGC advisers
    (Reuters: the Revolutionary Guards directed the Mokha operation).'
  it: ''
- hash: 1003e157
  kind: cards
  en: Beating the STC with Saudi force cost the anti-Houthi camp its best-funded units and its second patron. Between December 2025 and January 2026 the PLC cancelled the defence agreement with the UAE,
    expelled Emirati forces within 24 hours and broke the STC; eight months later the Red Sea coast fell to the Houthis within a week of their offensive (3-11 Sep). The link is our inference (the Sana'a
    Center says the Saudi-Emirati rivalry fragmented the camp until the UAE left), not a source finding.
  it: ''
- hash: b9143248
  kind: cards
  en: The legitimacy that comes from Riyadh is what gives Riyadh the final word. The government exists because Saudi Arabia built the PLC and pays its bills, yet the UN roadmap of 2023 came out of direct
    Saudi-Houthi talks and the US-Houthi ceasefire of May 2025 was brokered by Oman with the government no party to it; now the war is run by Riyadh's coalition, and the Sana'a Center editorial asks that
    'regional and international allies act as partners rather than patrons'.
  it: ''
- hash: a0c5a842
  kind: cards
  en: Marching on Sanaa makes the Saudi patron pay in Riyadh. The offensive announced on 4 Oct was answered between 5 and 10 Oct by missile and drone strikes on Jazan, Najran, Abha and Riyadh airports (at
    least 13 dead at Riyadh); every Houthi blow on the kingdom raises the price of the war for the only actor that can pay for it.
  it: ''
- hash: 9f44bb7d
  kind: cards
  en: The government's territory has become a bargaining chip in somebody else's war. The Houthi coastal offensive coincided with the US-Iran war and Hormuz closure and, in analysts' reading, gave Tehran
    leverage over a second chokepoint; the government that asked the Council to stop Iranian flights is not at the table where the Bab al-Mandab is traded (the US met the Houthis in Muscat on 16 Sep).
  it: ''
- hash: 64fe659d
  kind: cards
  en: Fiscal conditionality builds a state on paper. Riyadh made a 2026 budget the price of aid and the cabinet enacted one; the budget was built on the 2014 budget, the oil that paid for 2014 cannot be
    exported, and nearly all Yemen's oil reserves lie in Hadramawt and al-Mahra, the provinces the STC and Hadrami tribes fought over in November-December 2025.
  it: ''
- hash: 2d5dd829
  kind: cards
  en: 'The internationally recognised government of Yemen is a state held up from outside: legal

    seat at the UN, salaries and grants from Riyadh, air power largely Saudi, and most of its people

    beyond its writ. Its grand strategy is therefore less a plan than a position in a Saudi

    plan, and Luttwak''s levels diverge sharply. At the theatre level the goal is the

    Houthis'' defeat (the PLC''s own word is the ''decisive phase'', 4 Oct 2026); at the

    grand-strategic level the goal is to remain the party Riyadh must keep, against a

    Houthi movement that Riyadh has negotiated with since 2022 and against an Emirati

    network it destroyed in January 2026. The 2026 sequence is the paradox of the card:

    the elimination of the STC bought Saudi control of the south and left the camp

    without its best money and units, then the coast fell within a week; the Iran war

    turned the Bab al-Mandab into a bargaining chip, so that the contest over Yemen''s

    coast is settled in Tehran, Riyadh, Washington and Muscat as much as in Taiz and

    Mokha. What decides the next year is Saudi stamina and Saudi pain: the government

    needs the offensive to continue and cannot control the price Riyadh pays. Signals

    that are not rows: the Houthis'' own account of their aims (Sanaa-based media only,

    not researched); the Southern movement after the STC''s formal dissolution, which

    appears in the sources only as protest and bombings; the UAE''s silence on Yemen

    since January except for condemning the strikes on Saudi airports.'
  it: ''
- hash: 06e98151
  kind: cards
  en: 'Win back US market access after the 2025 break: AGOA lapsed on 30 September 2025, was renewed only to the end of 2026 (signed 3 February 2026, applied back to the lapse), and the 30% US tariff of
    7 August 2025 still applies. Pretoria negotiates for relief and does not retaliate.'
  it: ''
- hash: 99691c29
  kind: cards
  en: 'Win the genocide case against Israel at the ICJ and keep Gaza on the Global South''s agenda: the application of 29 December 2023 is in the written phase, Palestine intervened on 3 June 2024, and
    Colombia withdrew its declaration on 22 September 2026.'
  it: ''
- hash: 3afb3515
  kind: cards
  en: 'Keep the continental and Global South standing that the 2025 G20 presidency gave it: Nigeria contests the lead on the continent, and BRICS and the G20 are the stages where Pretoria claims a voice
    for Africa.'
  it: ''
- hash: e09e6b52
  kind: cards
  en: 'Restore growth and the rand: economists polled by Reuters expected Q2 2026 GDP to contract 0.1% quarter on quarter after 0.5% growth in Q1, so the priority is to keep the grid and the mines running
    and to make the China trade grow.'
  it: ''
- hash: 022a001c
  kind: cards
  en: 'Spread the market beyond Washington: the EU (a Clean Trade and Investment Partnership signed on 20 November 2025, and a Team Europe Global Gateway package of nearly EUR 12bn announced for South Africa),
    the UK (goods and services trade of GBP 12.1bn in the four quarters to Q3 2025, a growth partnership), Germany (8.0% of exports in 2025, ahead of the US at 7.1%), and the Gulf and India. Our reading:
    Europe did not follow Washington over the ICJ case, which is the evidence Pretoria can cite that the Western door is still open.'
  it: ''
- hash: 5f03e8ff
  kind: cards
  en: 'Lead the region it anchors: South Africa has chaired SADC since the extraordinary summit of 7 November 2025 (interim chair after Madagascar gave up the chair) and formally since the Durban summit
    of 17 August 2026, and it runs Bi-National Commissions with Botswana (May 2026), Namibia (17 July 2026), Kenya (state visit of 3-5 June 2026, upgraded to a strategic partnership) and Zimbabwe (21 August
    2026). The neighbourhood is the stage where standing is cheapest to hold.'
  it: ''
- hash: 904d6760
  kind: cards
  en: 'Economic: China is the largest trading partner, at about USD 36.4bn in 2025, with platinum, gold and ores among the main exports and a duty-free deal for some goods still being finalised. The mineral
    base is the lever; the trade balance is the weakness.'
  it: ''
- hash: d907d0e1
  kind: cards
  en: 'Diplomatic: the G20 seat and presidency of 2025, the BRICS membership, and the ICJ case as a tool of norm-setting that costs little and is aimed at Washington and Tel Aviv alike.'
  it: ''
- hash: f8ac8e09
  kind: cards
  en: 'Military: the largest contributor to the SADC mission in Mozambique (about 1,500 troops in Cabo Delgado from 2021 until the authorisation lapsed in April 2024), and a force in eastern DRC under SAMIDRC
    that was withdrawn in 2025.'
  it: ''
- hash: 174b3ce3
  kind: cards
  en: 'Diplomatic, convening: the Johannesburg G20 summit of 22-23 November 2025 ended with a leaders'' declaration on climate, debt and solidarity adopted without the United States, which boycotted, and
    after Argentina left the talks; Pretoria''s spokesman called the consensus ''sufficient'', and Foreign Minister Lamola said ''This G20 does not revolve around the United States''. Ramaphosa also chaired
    the IBSA leaders'' meeting with Modi and Lula on 23 November 2025 and chairs SADC. The instrument is the host''s gavel, used against the superpower.'
  it: ''
- hash: 2a5c5932
  kind: cards
  en: 'Economic, regional: the six nearest neighbours (Mozambique USD 5.58bn, Namibia 4.40bn, Botswana 4.38bn, Zimbabwe 4.3bn, Eswatini 1.93bn, Lesotho 1.62bn) took about USD 22bn of exports in 2025, roughly
    18% of the total (our sum of UN Comtrade figures as shown by Trading Economics, tier 4, to be checked against SARS); the rand circulates across the Common Monetary Area; Africa took 42% of agricultural
    exports in 2025. The region is a captive market and a currency zone, and the lever the neighbours resent.'
  it: ''
- hash: 2d7aac74
  kind: cards
  en: 'Informational and legal: the answer to an accusation is a process and a formula. The independent Mojapelo panel on the Lady R found ''no evidence'' that weapons were loaded for export and reported
    an offloading of a 2018 Armscor order (summary of 3 September 2023, full report classified); the line ''South Africa is not anti-American'' was used by the trade ministry in July 2025; the ICJ pleadings
    do the same job abroad.'
  it: ''
- hash: 3e206e90
  kind: cards
  en: 'The grid: Reserve Bank estimated in 2023 that rolling blackouts cost between R204m and R899m a day. Eskom''s own winter 2026 outlook promises no load-shedding, but the grid still caps growth.'
  it: ''
- hash: 8f2403b9
  kind: cards
  en: 'The rand and the fiscal room: the rand traded near 16.04 to the dollar on 8 September 2026, and the economy was expected to contract in Q2, so the state has little money for distant missions or for
    buying influence.'
  it: ''
- hash: 87621def
  kind: cards
  en: 'Military overstretch: 14 South African soldiers were killed in clashes with M23 in eastern DRC in January 2025, the SADC mandate was ended in March 2025, and the Mozambique force was financed mostly
    by Pretoria through the SADC Peace Fund.'
  it: ''
- hash: eb2afdb4
  kind: cards
  en: 'The US clock: AGOA, renewed on 3 February 2026, runs only to 31 December 2026, so duty-free access ends in eleven weeks unless Congress acts; the 30% tariff stays and a bilateral Agreement on Reciprocal
    Tariffs is still being negotiated. The US took 7.1% of exports in 2025 (7.7% in 2024) and fell to third place as a destination, with vehicles hit hardest by the 25% tariff of April 2025. Washington''s
    share is small and its leverage is not.'
  it: ''
- hash: c119b8b0
  kind: cards
  en: 'The armed forces are not fully on the leash: Ramaphosa told the defence minister to make sure Iran left the China-led ''Will for Peace 2026'' exercise in False Bay (January 2026), yet an SANDF post,
    since deleted, said the Iranian corvette Naghdi took part in the sea phase; the minister opened a board of inquiry, and the US embassy called the welcome of Iranian forces ''unconscionable''. A non-alignment
    that its own navy can undercut is not credible in Washington.'
  it: ''
- hash: d5471cfd
  kind: cards
  en: 'The coalition clock: the Government of National Unity was formed after the ANC lost its majority in 2024; the DA has been led since April 2026 by Geordin Hill-Lewis, who said he is ''not satisfied
    being a junior partner'' and in July 2026 that the DA would stop keeping GNU disagreements quiet; local elections are due on 4 November 2026 (one report; AFP says between November and January) with
    the ANC at 38% in an Ipsos poll. Every foreign-policy move has to survive an electoral season; the pages were read only as search summaries, and the Engineering News piece itself returned HTTP 403.'
  it: ''
