# Translate every `en` into it. Write the translations to the file cards-26.out.yaml next to this one,
# as `items:` of `- hash: <same hash>` / `it: <translation>`, appending one item at a time (valid YAML at
# every step), never editing this file. Keep names, dates, numbers and quotes; register of a foreign-office
# brief: dry, precise, no flourish.
lang: it
items:
- hash: 9ed9890a
  kind: cards
  en: 'The cooperation that keeps US troops out is the reason US intelligence operates inside Mexico: each cartel transfer and drone flight Sheinbaum calls collaboration is the file Washington cites when
    CIA ''deadly operations'' inside Mexico are reported (May 2026).'
  it: ''
- hash: 1aaef698
  kind: cards
  en: The remittance tax and the deportations that cut the USD 61.8bn flow (down 4.6% in 2025) shrink the dollar cushion that would let Mexico say no to Washington, so the defence of sovereignty is paid
    for in the remittances of the migrants who would be its first casualties.
  it: ''
- hash: 8878352b
  kind: cards
  en: 'The tariffs on China are timed to the US review: Mexico diversifies toward the EU and Asia to lower its exposure to Washington, but the tariff wall it builds to do so is the price of the USMCA review,
    so the diversification is shaped by the partner it is diversifying from.'
  it: ''
- hash: ec6b6440
  kind: cards
  en: 'The cartels are the pretext as much as the problem: the Feb 2025 terrorist designation of six Mexican groups (Sinaloa, CJNG, Noreste, Gulf, Familia Michoacana, Carteles Unidos), two more in July
    2026, and Trump''s ''something''s going to have to be done'' (3 Jan 2026) turn a criminal question into a legal basis for force, while Sheinbaum''s refusal to call the cartels political is what keeps
    the state out of the terrorism frame. Every blow Mexico lands (92 transfers, El Mencho) shows Washington that the groups are strategic-scale and strengthens the case for acting itself; and in July 2026
    the US went further and claimed the Mexican government itself is linked to cartels, which turns the cooperation partner into a suspect.'
  it: ''
- hash: e6d60e6e
  kind: cards
  en: 'The judicial reform meant to make the state accountable to the people is, to US legislators and investors, the proof that the state is not accountable to law: the elected Court (13% turnout) is the
    item Congress and the Wilson Center tie to the USMCA review, so the political project that Sheinbaum defends as sovereign democratic choice is read in Washington as a reason to keep the agreement on
    annual reviews, and in Mexican boardrooms as a reason to hold back the nearshoring capital the economy depends on (about USD 35bn reportedly held back, WSJ via Aberdeen).'
  it: ''
- hash: 7c7dab3b
  kind: cards
  en: 'Nearshoring under tariffs: capital came to Mexico for tariff-free access to the US, and 2025 set a record (USD 40.871bn), but two thirds was reinvested profit, new investment was 18%, the fourth
    quarter was a USD 5.0bn outflow, and Toyota is moving Tacoma production from Baja California to Texas. The access that justifies the investment is the thing Washington holds on annual review, and Mexico''s
    own tariff wall on Asian inputs (see China paradox) raises the cost of the plants the investment builds. The more Mexico trades in the USMCA (over 80% of exports to the US), the larger Washington''s
    lever.'
  it: ''
- hash: e9f91935
  kind: cards
  en: 'Mexico is a state that cooperates with its strongest neighbour in order to keep that neighbour out of its territory, and Sheinbaum, in office since October 2024, has held that line with a steady
    sovereignty language. Its posture toward the United States is reluctant partnership: it hands over cartel figures, accepts CIA flights and the National Guard at the border, and refuses troops and unilateral
    strikes, while the USMCA stays unrenewed and the tariff exemption is the lever of the 2026 review. Mexico hedges through the EU agreement and tariffs on Chinese goods rather than through alignment with
    anyone, so its foreign policy is measured less by the partners it picks than by how far Washington lets it pick. Its weakest flanks are at home: a judicial reform that frightens investors, a Pemex still
    losing money on about USD 80bn of debt, and a remittance flow that deportations and the 1% tax are already shrinking.


    Added 2026-10-16 (protagonist pass). The tariff picture has changed since the first draft: the Supreme Court ended the fentanyl tariffs on 20 February 2026 and what Washington now holds is the Section
    301 duty on non-USMCA goods, the Section 232 sectoral duties and, above all, the annual review of the agreement, which is the real lever; the talks were reported stalled on 12 October with Trump asking
    for energy deals. The cartels work for Washington as a pretext (terrorist designations, the claim of links to the government) and for Mexico as a bargaining chip (92 transferred, El Mencho killed) at
    once, and the same ambivalence marks the region: Mexico shouts non-intervention over Venezuela and Peru and says little where Washington''s interests bite. Its second ring is thin but real: the EU agreement,
    a trade deficit with China it cannot cut without hurting its own exporters, and a Latin America in which Argentina is hostile, Colombia turns cooler after the change of government in Bogota, Chile is
    divided from Mexico over Bachelet, and only Brazil and, since August, Peru are back in regular contact.'
  it: ''
- hash: 3b215fe6
  kind: cards
  en: Keep the Compact's money flowing past 2023. Its financial assistance was set to expire in 2023 and was extended for another 20 years that year.
  it: ''
- hash: 01e94a28
  kind: cards
  en: Keep the recognition of Taipei and the trade tie with Taiwan. The Marshall Islands is one of three Pacific states that still recognise Taipei, and a 2019 trade agreement with Taiwan, approved in 2023,
    is still to take effect.
  it: ''
- hash: 1af1be45
  kind: cards
  en: Hold its claim to Wake Island, which the embassy calls a disputed United States territory that the Marshall Islands also claims.
  it: ''
- hash: 8142f6cb
  kind: cards
  en: 'The flag registry, the second largest in the world as of 2017 after Panama, and a legal instrument as well: in 2025 the Marshall Islands took Equatorial Guinea to the International Tribunal for the
    Law of the Sea over a Marshallese-flagged ship that Equatoguinean forces had detained from August 2022 for over nine months.'
  it: ''
- hash: 527b25b0
  kind: cards
  en: Visa-free residence in the United States. Under the Compact, Marshallese citizens may live, work and study there without a visa, an emigration route the treaty guarantees and Majuro does not control.
  it: ''
- hash: 5299abe3
  kind: cards
  en: Money and defence come from one treaty. Compact assistance was due to expire in 2023, and the United States holds sole responsibility for the islands' international defence, so leaving the Compact
    would cost both.
  it: ''
- hash: e74ae016
  kind: cards
  en: A country seven feet above the sea. The embassy gives an average altitude of seven feet, and a US$1 billion Air Force radar site on Kwajalein is among the assets rising seas could threaten.
  it: ''
- hash: 55e7226a
  kind: cards
  en: The registry flies the flag of ships that need not be Marshallese-owned, and after the 2015 Maersk Tigris seizure the United States said its treaty duty to defend the islands did not extend to foreign-owned
    Marshallese-flagged ships at sea. The flag that gives the state its place in world shipping is the one the protector said it would not cover.
  it: ''
- hash: 1e6e3986
  kind: cards
  en: 'Under President Hilda Heine, the Marshall Islands runs its foreign policy inside a treaty it cannot leave cheaply: the Compact pays for the state and carries its defence, and the 2023 extension bought
    twenty years, not a settlement of the nuclear grievance. Inside that frame it has three instruments it actually uses: the Taipei tie, one of three Pacific recognitions left; a flag registry, second
    largest in the world as of 2017, whose foreign-owned ships the United States said it would not defend at sea; and the visa-free right to live and work in America, which makes emigration a lever. The
    sea is the one constraint no treaty can renegotiate: the country averages seven feet above sea level, and a US$1 billion radar site at Kwajalein is on the list of what rising seas could threaten.'
  it: ''
- hash: 26eebdbe
  kind: cards
  en: EU membership, but on terms that no longer reopen identity, language or history. The government wants the negotiating clusters opened without first writing Bulgarians into the constitution; Mickoski
    says no amendment is possible while he is prime minister unless (1) the Macedonian community in Bulgaria gets its rights under international law and (2) there are guarantees on identity and language
    and no further bilateral vetoes. On 2 Oct 2026 he and von der Leyen agreed 'a first step' to break the deadlock, with the foreign minister going to Sofia.
  it: ''
- hash: 7cdc7c9b
  kind: cards
  en: 'Protect the Macedonian national identity as the government defines it: the language, the use of ''Macedonia'' in domestic speech (Mickoski and President Siljanovska-Davkova do not use the Prespa
    name at home), and a history that is not reviewed by Sofia. Mickoski explicitly frames this as the lesson of Prespa: a concession made to unblock the EU path that produced new demands instead.'
  it: ''
- hash: 3aa3ae96
  kind: cards
  en: 'Security anchored in NATO and, above all, in Washington: membership since 27 Mar 2020 is the only hard guarantee the country has, and the Mickoski government has added a personal channel to the Trump
    administration (two Washington visits in less than a month, the ''new normal'' language, an abstention in February 2025 on the EU-backed UNGA resolution on Ukraine while backing the US text, an Atlantic
    Council event listed for 17 Sep 2026).'
  it: ''
- hash: 886347ce
  kind: cards
  en: 'Keep the Macedonian-Albanian arithmetic of the state working: VMRO-DPMNE governs with the Albanian bloc VLEN and the small ZNAM, needs ethnic Albanian votes for two-thirds majorities, and is competing
    with DUI for the Albanian vote, which is why language (road signs, the Albanian-language bar exam) is a live political risk and not a side issue.'
  it: ''
- hash: d3b81e73
  kind: cards
  en: 'Economic modernisation through connectivity and borrowed money: Corridor 8 and 10d motorways built by the Bechtel-Enka joint venture, the gas interconnector with Greece (agreement signed) and a second
    one with Serbia (memorandum), a EUR 1bn pair of loans from Hungary (half refinancing the January 2025 Eurobond), and the EU Reform and Growth Facility. GDP per capita is still 42% of the EU average.'
  it: ''
- hash: '99948835'
  kind: cards
  en: 'Restore the legitimacy of the state after Kocani and slow the population''s exit: the March 2025 nightclub fire (62 dead, over 190 injured) exposed licence-for-bribe corruption and prompted mass
    protest; the prosecution indicted 34 people and three companies on 13 June 2025; the country lost more than 200,000 people between the censuses of 2002 and 2021 and some 600,000 citizens live abroad.'
  it: ''
- hash: fbaa3887
  kind: cards
  en: 'Hedging between channels: a refusal of the Bulgarian conditions held up by a demand for ''guarantees'' and an EU representative at the table, combined with an enlarged circle of patrons outside the
    EU core (Washington, Ankara, Budapest until April 2026, Belgrade). Foreign minister Mucunski is the lead voice in Sofia; Mickoski has said stronger actors will have to apply pressure, citing Corridor
    8.'
  it: ''
- hash: 6e111245
  kind: cards
  en: 'Full alignment with the EU''s foreign policy as a credential: all restrictive measures on Russia and Belarus and every High Representative statement (the Commission: ''full alignment''), military
    and humanitarian aid to Ukraine, and a seat on the UN Human Rights Council for 2025-27. Loyalty is the currency Skopje can spend while refusing the one thing Sofia asks.'
  it: ''
- hash: d8b89860
  kind: cards
  en: 'Identity politics as policy and as signal: the domestic use of ''Macedonia'', the 2023 law banning organisations named after figures the state calls controversial (applied to the Ivan Mihailov clubs),
    and the June 2025 suspended sentence of the Bitola club''s chair for quoting Mihailov online - each read in Sofia as persecution of Bulgarians and in Skopje as defence of the nation.'
  it: ''
- hash: 726a6421
  kind: cards
  en: 'NATO membership and active service to the Alliance and Kyiv: humanitarian and military aid to Ukraine (tanks, helicopters, attack aircraft and ammunition, making it a top-four NATO contributor over
    three years by one count), and the ''Immediate Response 25'' drills hosted in May 2025 with six other allies; a framework agreement on military cooperation with Turkey (October 2024), and Turkish donations
    of equipment to the army, add a bilateral layer.'
  it: ''
- hash: 816d440d
  kind: cards
  en: 'State borrowing and contracting from non-EU sources: two government loans from Hungary totalling EUR 1bn (3.25% fixed, signed October and December 2024) lifted reserves to 4.8 months of imports;
    Turkish companies'' investment approaches USD 2bn (Erdogan, Feb 2025); a US-Turkish joint venture builds the 111 km of Corridors 8 and 10d. The EU Growth Plan and Reform Agenda run alongside.'
  it: ''
- hash: f8e0c088
  kind: cards
  en: Two vetoes, not one. Bulgaria can block the first negotiating cluster until the constitution names Bulgarians; Greece holds the veto over every step later and has said it will not ratify three cooperation
    memoranda while Skopje breaches Prespa. Sofia says it adds no new condition to the 2022 French proposal; Athens says the road to Europe 'runs through Greece'.
  it: ''
- hash: 240b458f
  kind: cards
  en: The constitution needs 80 of 120 votes, which the governing bloc does not hold alone. Mickoski has told MPs not to vote for amendments without his two conditions; the SDSM opposition has called a
    referendum on continuing the EU path and an independent bill by former diplomat Viktor Gaber proposes one on the amendments. Any concession needs the Albanian parties and part of the opposition, and
    any refusal is borne by the government.
  it: ''
- hash: 01ee77b0
  kind: cards
  en: 'A small, open and EU-dependent economy: the EU takes 76.9% of goods exports and supplies 50.5% of imports (61.4% of total goods trade, 2024), GDP per capita is 42% of the EU-27 level in PPS, public
    debt rose to 62.4% of GDP and gross external debt to 79.8%. Turning away from Brussels is therefore much more expensive than turning away from Sofia.'
  it: ''
- hash: 0ca6ea84
  kind: cards
  en: 'Security is a borrowed good: the country''s only hard guarantee is NATO membership, the army relies on donated Turkish equipment and US partnership, and the security risk the Commission names is
    internal: inter-ethnic relations ''remained stable'' under the Ohrid Framework Agreement, while language policy keeps testing it.'
  it: ''
- hash: 54b626f4
  kind: cards
  en: A shrinking, ageing and leaving population. The 2021 census counted over 200,000 fewer people than 2002 (about 10%), roughly 600,000 citizens live abroad, and youth surveys cited by the press show
    most young people want to leave. The labour force that every investment plan counts on is the one the economy cannot keep.
  it: ''
- hash: 4bcbdb22
  kind: cards
  en: 'Energy and infrastructure fragility: the country still relies heavily on coal (Bitola and Oslomej) and on imported energy; renewables reached 55.7% of installed capacity and 41% of production in
    2024; the gas link with Greece is only at agreement stage and the Corridor 8 tunnel with Bulgaria was due to be agreed in November 2025.'
  it: ''
- hash: 1b681043
  kind: cards
  en: The Prespa lesson that prevents the prize Prespa was meant to buy. Mickoski refuses a second concession because the first (the name, 2018) bought a NATO seat but not an EU date; by refusing the Bulgarian
    amendment he keeps the country out of the EU, which is the thing the 2018 and 2022 compromises were meant to deliver, and says he is ready to 'pay the price'.
  it: ''
- hash: f3762669
  kind: cards
  en: Using 'Macedonia' at home to defend identity opens a second front. Bulgaria alone was enough to freeze the process; by flouting the Prespa name, Skopje gave Athens a veto-backed grievance (memoranda
    unratified, 'the path will remain closed') and turned a NATO ally and the neighbour with the largest investment stake into a second source of pressure.
  it: ''
- hash: fa438a57
  kind: cards
  en: Washington cannot unlock a Council decision. The US channel, 'new normal' rhetoric and a UNGA abstention on the EU's Ukraine text buy visibility and security comfort, but the key to the first negotiating
    cluster is held by Bulgaria and the member states; the closer Skopje draws to Trump, the more the EU reads its alignment as conditional. Mickoski himself was asked in Feb 2025 whether the Trump administration
    could help with Bulgaria.
  it: ''
- hash: 63e4f9bc
  kind: cards
  en: Borrowing autonomy from a patron who fell. The EUR 1bn from Hungary refinanced the Eurobond at 3.25% and made the budget less dependent on Western markets; the patron was Orban, who lost power in
    April 2026, and on 1 Sep 2026 Hungarian police opened a criminal probe into the Eximbank deals including this loan, with opposition and press alleging Chinese money behind it. The ally who sheltered
    Gruevski is now the government that calls him a criminal.
  it: ''
- hash: 55b4401f
  kind: cards
  en: A coalition built on the Albanian vote that its language policy irritates. The Albanian parties are the most pro-EU and pro-NATO constituency; VLEN's presence makes the government possible, yet removing
    Albanian from new road signs and refusing the Albanian-language bar exam gave DUI an issue, brought students and politicians from Albania and Kosovo into the street in April-May 2026, and led Mickoski
    to say the protest was an attempt to destabilise the state and that he had told NATO and the EU.
  it: ''
- hash: 71c55872
  kind: cards
  en: A mandate against corruption tested by the corruption it promised to end. VMRO-DPMNE won on that platform and swept the 2025 local elections (about 55 of 81 mayors, with the lowest turnout since independence),
    but the Kocani fire killed 62 people in March 2025, a year into its term; the indicted include former ministers and officials of earlier governments, which helps politically, while the lack of oversight
    that the Commission describes is now the government's own to fix.
  it: ''
- hash: 1b24753d
  kind: cards
  en: 'North Macedonia runs the strategy of a state that has already paid for entry

    twice and now treats a third payment as a trap. It changed its name for NATO

    (2018-20), accepted the French proposal for the EU (2022), and still has no date;

    the Mickoski government, in office since June 2024 after winning 58 of 120 seats, draws the

    conclusion that every concession reopens the account, and trades speed for

    guarantees. The result is the Luttwakian pattern of a weak actor playing a long

    game against two veto-holders: it keeps the one thing it has already won (NATO,

    near-total alignment with Brussels on Russia and Ukraine) and widens its list of

    patrons, with Washington, Ankara and, until Orban''s fall, Budapest and Belgrade

    behind it. The price is a country neither inside nor outside the EU, and a

    population that votes with its feet. Two signals that are not rows: the

    Commission''s report of November 2025 states flatly that ''no attempts were made'' to

    adopt the amendments, while von der Leyen''s visit of 2 October 2026 produced the

    first agreed step in years, so the next weeks (the foreign minister''s trip to Sofia

    during a Corridor 8 event) are the test of whether the ''stronger pressure'' Mickoski

    awaits has arrived. Open gaps: no source was found on Russian influence on the

    2024 vote, on Chinese projects under this government, or on any Greek retaliation

    after 2024.'
  it: ''
- hash: 5c6e1f8a
  kind: cards
  en: Keep the junta in power. The National Transitional Council let Assimi Goita stay in office for a five-year term renewable without limit (3 July 2025, no election), after the junta dissolved all political
    parties in May 2025. The JNIM fuel blockade and the Azawad offensive are the tests of that hold on Bamako.
  it: ''
- hash: a5f7e68a
  kind: cards
  en: Retake the north. The Azawad Liberation Front (FLA, founded 30 November 2024 by the merger of the MNLA, the HCUA and armed fringes of two Tuareg and Arab groups) claimed Kidal in its offensive from
    25 April 2026. Bamako answers with drone strikes (the Tinzaouaten strike of December 2024 reportedly killed several FLA leaders, per RFI) and with a foreign army it cannot fully control.
  it: ''
- hash: 6c8be861
  kind: cards
  en: Sovereignty from the old order. The Alliance of Sahel States (confederation treaty, July 2024) with Burkina Faso and Niger replaces the regional bloc; the ECOWAS exit, announced on 28 January 2024,
    took effect on 29 January 2025. France's troops were expelled in 2022.
  it: ''
- hash: ec1995b5
  kind: cards
  en: Monetise the subsoil. Gold is the state's revenue and the lever of its patrons; the 2025 seizure of Barrick's Loulo-Gounkoto mines and the November 2025 settlement show that the junta wants the mines
    on its own terms.
  it: ''
- hash: 51b9aaab
  kind: cards
  en: 'Bloc diplomacy inside the Alliance of Sahel States, and a new patron in Rabat. On 10 April 2026 Mali backed Morocco''s autonomy plan for Western Sahara and withdrew its recognition of the Sahrawi
    Republic, a move that also opens the Atlantic access the AES wants. Bond with Morocco is none: the trade is the whole relation.'
  it: ''
- hash: 2805b7c8
  kind: cards
  en: A foreign army and foreign drones. Russia's Africa Corps, the Defence Ministry's successor to Wagner, has kept about 2,000 men in Mali since June 2025 and no treaty binds the two beyond the deployment.
    Turkish-made Bayraktar TB2 drones struck the Tinzaouaten area in December 2024. Mali's drone was shot down over the Algerian border on 31 March 2025, and the case went to the ICJ.
  it: ''
- hash: d0402c83
  kind: cards
  en: Gold and a China trade treaty. The state takes the mines when the company will not comply (Loulo-Gounkoto, 2025), and it trades with China under a free-trade agreement that entered into force in 2024
    (state-agency report, used for the fact only). The sources read do not give the gold buyers or the trade volumes; the economic weight of China is not yet carded.
  it: ''
- hash: 484000f9
  kind: cards
  en: The port belongs to someone else. Mali is landlocked, so its fuel and trade run through Dakar and Abidjan. The JNIM blockade from September 2025 hit fuel tankers from Senegal and Cote d'Ivoire on
    the Senegal-Mali route, and by October 2025 fuel was scarce in Bamako.
  it: ''
- hash: dd5d239c
  kind: cards
  en: Gold cannot be run alone. The Barrick dispute (seizure in 2025, reopening under a tax settlement in November 2025) shows that the state still needs the company's capital and operating skills.
  it: ''
- hash: d5c95783
  kind: cards
  en: The foreign army is thin and unpopular. The Africa Corps abandoned Kidal under attack in April 2026, lost a helicopter to Tuareg fire in July 2026 (reported), and HRW accuses it of killing nine villagers
    in August 2026.
  it: ''
- hash: ecd08049
  kind: cards
  en: Leaving ECOWAS to be sovereign made the corridors the target. The exit removed the regional framework that kept the coastal routes open, and the blockade now hits the same Dakar and Abidjan fuel lines
    Bamako depends on.
  it: ''
- hash: '37983668'
  kind: cards
  en: The patron protects the junta from the north and makes it hostage. Each Africa Corps loss (Kidal, the helicopter) and each abuse report (HRW) is read at home as the regime's failure, and the regime
    cannot leave the patron without losing the north.
  it: ''
- hash: 4e2f06fd
  kind: cards
  en: The rupture with the northern neighbour closed the path the north needs. Ambassadors were recalled in December 2023, flights were suspended in April 2025, and Mali took Algeria to the ICJ in September
    2025; the envoys returned only in July 2026, after a year in which Bamako had no working channel to its largest northern neighbour.
  it: ''
- hash: 36d66539
  kind: cards
  en: 'Mali plays the strategy of a junta that has swapped its old friends for new patrons: it expelled France and left ECOWAS, took Russian soldiers and drones, and bet its revenue on gold that the state
    now runs itself. The bet holds at the centre and fails at the edges, where the Africa Corps has left Kidal, the JNIM blockade chokes the Dakar and Abidjan corridors, and the Azawad front takes the north.
    Sovereignty is the regime''s only proof of legitimacy, so every concession to a neighbour or to Algeria reads at home as a loss, and that is why the rift with Algiers lasted a year. Watch whether Moscow
    and Ankara keep paying for the north when the gold and the corridor no longer cover the cost.'
  it: ''
- hash: 990005b8
  kind: cards
  en: Keep the maritime economy running - the ship register (the largest register in the EU, about sixth worldwide by its own count) and the gaming sector (EUR 1.42bn of gross value added in 2025, 6.3%
    of the economy) - while EU sanctions and citizenship rules tighten around both.
  it: ''
- hash: 622108d4
  kind: cards
  en: 'Keep constitutional neutrality while taking EU money: no foreign military bases, non-lethal contributions only to the European Peace Facility, and no borrowing to buy weapons of war, even inside
    the EU defence package.'
  it: ''
- hash: 4e96e60a
  kind: cards
  en: 'Manage the Libyan file by negotiation: the maritime border (talks agreed in Valletta in September 2025) and irregular migration (the 2020 coordination memorandum), without conceding Tripoli''s unilateral
    claim to its outer limits.'
  it: ''
- hash: a0bdb916
  kind: cards
  en: Chaired the OSCE in 2024 as a late compromise candidate, after Estonia's accession was vetoed by Russia and Belarus; offers to host warring parties (Abela at the UN General Assembly, 2025). The office
    gives Malta a seat at tables where its size would otherwise exclude it.
  it: ''
- hash: 107441a0
  kind: cards
  en: 'The ship register and the gaming licences are exported services, not production: Malta sells a flag and a licence. Chinese capital holds a stake in Malta Freeport, the transhipment port, held by
    China Merchants Port Holdings.'
  it: ''
- hash: d9d0ac43
  kind: cards
  en: No armed forces of consequence. Malta's security rests on neutrality, on EU and Commonwealth partnerships (UK bilateral framework on defence and migration, 2023), and on non-lethal support to Ukraine
    through the European Peace Facility.
  it: ''
- hash: 6bfbf8a6
  kind: cards
  en: The Constitution forbids foreign military bases on Maltese territory and makes neutrality a condition of any defence cooperation; a SOFA with the United States would need a two-thirds parliamentary
    majority.
  it: ''
- hash: 780f05cf
  kind: cards
  en: 'Energy: no gas pipeline yet. LNG via a floating unit at Delimara under a contract that ran to 2026, and partial reliance on electricity from Italy; the pipeline to Gela and a second cable were still
    planned.'
  it: ''
- hash: dbc9e8e6
  kind: cards
  en: EU law now binds citizenship and sanctions. The CJEU ruled on 29 April 2025 (Commission v Malta, C-181/23) that the investor citizenship scheme commercialises Union citizenship and breaches EU law;
    the Commission can seek fines if it is not brought into line.
  it: ''
- hash: 70342fb7
  kind: cards
  en: 'The register and the gaming licences that make Malta rich also carry the risks the EU now forces it to police: Malta-flagged tankers sold to a buyer in Hanoi and moved to the Panama register to carry
    sanctioned Russian crude, which damages Malta''s reputation as a flag state.'
  it: ''
- hash: d68f2380
  kind: cards
  en: Malta sells a flag, a licence and a harbour, and its grand strategy is to keep the EU's structure around those sales while refusing to be a military ally. Neutrality makes it useful as a host of talks
    and a Chair of the OSCE, and gives it a reason to stay out of the EU defence money; the Libyan maritime file and the Italian energy link matter more to it than any great power. The 2025 CJEU ruling
    on citizenship and the shadow-fleet reputation problem show the price of selling instruments of the state. Malta recognised Palestine on 22 September 2025 (recorded in the recognition dataset, not repeated
    here), a stance that sits with the EU line rather than against it.
  it: ''
- hash: 6e4ee78e
  kind: cards
  en: Keep the army in power under a constitutional, civilian-looking cover. The three-phase election (28 Dec 2025, 11 Jan and 25 Jan 2026; no vote in 67 townships) gave the military's USDP 231 seats in
    the lower house, parliament voted Min Aung Hlaing president and he was sworn in on 10 Apr 2026, having handed the army to a protege, Gen. Ye Win Oo.
  it: ''
- hash: 7aaa3ac9
  kind: cards
  en: 'Stop the loss of territory and regain the towns, bases and border trade posts that matter: the army has retaken ground around Bhamo, Lashio came back through a Chinese-brokered deal in April 2025
    and the northern alliance has split, but the Arakan Army holds 14 Rakhine townships and Paletwa, and the army''s stable control is put at between 72 and 220 of 330 townships.'
  it: ''
- hash: 1a12b29b
  kind: cards
  en: 'Turn the election into legitimacy abroad: a seat again at ASEAN summits (Min Aung Hlaing''s stated priority is ''normal relations'' with ASEAN), acceptance by India, Thailand, China and Russia (already
