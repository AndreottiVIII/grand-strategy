  en: 'Montenegro runs the grand strategy of a twenty-year-old micro-state that has bet its survival on being absorbed into the institutions that guarantee small states: NATO (done in 2017) and the EU (the
    2028 target). The method is alignment as proof - full CFSP alignment, expulsions of Russian operatives, a defence budget above 2% - and the resource is speed: it is the only candidate with 18 chapters
    closed. The Luttwakian trap is that the last chapters are not technical. Croatia''s veto turns on wartime grievances from the 1990s, and the Spajic majority rests on parties that treat the 2006 independence
    as a wound, so every step that pleases Belgrade''s friends at home (the Jasenovac resolution, the Mladic condolences) costs a vote in Zagreb or The Hague, while every step toward Brussels costs the
    coalition''s Serbian flank. The same logic runs through the economy: the Gulf and Turkish capital that replaces Chinese debt arrives with procedure-bypassing laws that the Commission itself flags. Two
    signals that are not rows: the cadence of closures (December 2025, January, March, June and July 2026) and President Milatovic''s repeated returns of laws to Parliament, a veto that keeps the Constitutional
    Court and Brussels in the loop. With the Serbian election on 25 Oct 2026 and Montenegro''s own on June 2027, the question is whether the accession treaty can be finished before the identity politics
    of one of the two neighbours changes the arithmetic.'
