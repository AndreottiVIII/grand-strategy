  en: 'Myanmar''s strategy is that of a client whose army lives on its usefulness to others. After 2021 the Tatmadaw lost the periphery but kept the centre, the air force and what its patrons want: a government
    in Naypyidaw that signs the Kyaukphyu port and the pipelines for Beijing, the Kaladan corridor for Delhi, the nuclear and refinery contracts for Moscow, and a border that stays quiet for Bangkok. Luttwak''s
    logic runs through the patron''s calculus: China does not need the junta to win, it needs the border calm, the pipelines open, the scam business under control and no Western-aligned government in Naypyidaw,
    so it brokers just enough ceasefires (Lashio, pressure on the TNLA) to keep the army alive and no more, while the KIA, the UWSA and others keep the leverage that lets Beijing bargain with both sides.
    The 2025-26 election and the presidency convert that client status into an appearance of normality: the four governments that already dealt with the regime (China, Russia, India, Thailand) now deal
    with a president, while ASEAN as a body and the West have only renewed their pressure. Each concession that buys survival, from Lashio to Kyaukphyu to the rare-earth promises, gives some other power
    a veto over the army''s next move. Rakhine is the test: the Arakan Army, not Naypyidaw, now decides whether Kyaukphyu, Sittwe and the Bangladesh border, which are three patrons'' interests at once,
    are safe.'
