lang: it
items:
- hash: ab0fdda2
  kind: cards
  en: 'ASEAN as the instrument of regional order: Prabowo signed Timor-Leste''s admission declaration (26 Oct 2025, the first enlargement in 25 years) and Jakarta uses the association to frame every bilateral
    deal as regional, while the Philippines holds the 2026 chair and pushes a South China Sea code.'
  it: ''
- hash: cbaff258
  kind: cards
  en: 'A narrative of ''a friend to all'' and of principled Palestine advocacy: the 23 Sep 2025 UN speech (offering recognition of Israel only after Palestinian statehood, peacekeepers under a UN mandate),
    the foreign ministry''s repeated line that ''free and active'' policy is intact after each Western or Russian deal (for example after the US defence partnership), and the denial of a Russian base in
    Papua.'
  it: ''
- hash: b8c8c464
  kind: cards
  en: 'Exercises with all sides and a wider role for the armed forces: Super Garuda Shield 2026 (31 Aug - 11 Sep, 4,743 personnel from 21 countries per Jakarta), the 2024 defence agreement and 2026 treaty
    with Australia, the 2024-ratified defence agreement with Papua New Guinea; at home the March 2025 TNI law lets active officers hold posts in more civilian bodies and soldiers work on the free-meals
    programme.'
  it: ''
- hash: 05e5a3a2
  kind: cards
  en: 'Market access traded for purchase pledges (US: 19% tariff, zero tariffs on 99% of US goods, 11 company deals worth USD 38.4bn; EU CEPA concluded with a palm-oil protocol), plus resource nationalism:
    the nickel ore export ban and 2026 quota cut to 260-270 million wet tonnes, Danantara as the state investment vehicle (MoU with China Investment Corporation, May 2025).'
  it: ''
- hash: cb827d5e
  kind: cards
  en: 'Fiscal ceiling: the legal 3% deficit cap is under pressure from oil prices while the free-meals programme (IDR 268 trillion core plus IDR 67 trillion add-on in 2026, only 22% spent by end-April)
    is cut and re-cut; there is no money left for all the arms ordered or for the capital city.'
  it: ''
- hash: 1947462a
  kind: cards
  en: 'Energy: Indonesia is a net energy importer; 20-25% of crude imports come from the Middle East via Hormuz, which the Iran war closed in effect - the reason for the Moscow trip. The Lowy analysis calls
    the autonomy ''thinner than it looks''.'
  it: ''
- hash: 93d4fc72
  kind: cards
  en: 'China is too big to refuse: bilateral trade USD 167.4bn in 2025 (Chinese customs), China the first export destination (23.8% of exports, Jan-Nov 2025), the builder of the nickel smelters and of the
    Jakarta-Bandung high-speed rail whose debt was restructured over 80 years in August 2026.'
  it: ''
- hash: e97e4f91
  kind: cards
  en: 'Domestic legitimacy: the August 2025 riots (lawmakers'' housing allowance, a motorcyclist killed by a police vehicle on 28 Aug, regional parliament burned in Makassar) were fed by the military''s
    widening civilian role, and the Indonesian Ulema Council demanded exit from the Board of Peace (1 Mar 2026) - the street limits how far Prabowo can lean toward Washington or Israel.'
  it: ''
- hash: ecbdb626
  kind: cards
  en: 'Nusantara, the capital, as an unfinished constraint: the authority''s budget fell from IDR 43.4 trillion (2024) to 6.3 trillion (2026), only 800 of 6,600 hectares of the core area were developed,
    and the move date is slipping to 2028 - Jakarta stays the seat of every decision.'
  it: ''
- hash: af122e36
  kind: cards
  en: 'The archipelago itself: thousands of islands and the straits of Malacca, Sunda and Lombok make it everyone''s sea lane and give the navy and coast guard too much water to police; the Chinese coast
    guard enters the North Natuna EEZ and Jakarta answers with patrols and statements, not force.'
  it: ''
- hash: cee3e438
  kind: cards
  en: Joining BRICS to gain room against Washington cost room in Washington. Admission on 6 Jan 2025 brought Trump's threat of an extra BRICS tariff (the Jakarta Post counted a possible 52% total), after
    which Jakarta paid for its way back with a tariff-free market for 99% of US goods, a transshipment penalty aimed at Chinese goods, acceptance of US vehicle and drug standards and purchase pledges (USD
    15bn of energy, 50 Boeing jets, in July 2025).
  it: ''
- hash: e892e45d
  kind: cards
  en: Offering China 'joint development' to avoid a Natuna clash legitimised the claim it was meant to blunt. The 9 Nov 2024 joint statement spoke of 'overlapping claims', a phrase Jakarta has never accepted;
    parliament forced the foreign minister to deny recognition of the nine-dash line on 3 Dec 2024, and the formula weakens the UNCLOS argument that is Indonesia's only legal shield.
  it: ''
- hash: 5fb3c606
  kind: cards
  en: The nickel ban built a Chinese-owned industry, not an Indonesian one. Forcing processing onshore drew Chinese capital into Morowali; when Jakarta then cut ore quotas (Weda Bay reportedly from 42 to
    12 million tonnes) the Chinese chamber of commerce wrote an open letter to Prabowo (May 2026) - the leverage over the miners is real, but so is the dependence on the smelters' owners, and a glut of
    semi-processed product.
  it: ''
- hash: 6290879b
  kind: cards
  en: Arming from everyone buys no deterrent. Rafale, KAAN, J-10, KF-21, BrahMos and Japanese hulls cannot all be paid for under a 3% deficit cap (Jakarta cut its KF-21 share from KRW 1.7 trillion to 600
    billion), cannot be made to work together, and each supplier becomes a lever; meanwhile each Western purchase is paired with a Chinese or Russian counterweight, which is the hedge turning into incoherence
    in the eyes of the suppliers.
  it: ''
- hash: 5ec283fb
  kind: cards
  en: A peacekeeping offer to buy standing in Washington and the Muslim world ended by satisfying neither. Prabowo went from 20,000 troops (UN, Sept 2025) to up to 8,000 (Board of Peace, 19 Feb 2026) with
    a deputy-commander post, then froze the deployment on 17 Mar 2026 after the US-Israeli war on Iran, under pressure from the Ulema Council; Jakarta stays on a board whose conditions (Hamas not disarmed,
    consent of Palestinians and Muslim states) make deployment impossible.
  it: ''
- hash: b80761fc
  kind: cards
  en: The soldier in the ministry weakens the democracy that is Indonesia's passport. The March 2025 TNI law and the police law let officers hold civilian posts, soldiers run kitchens for the free-meals
    programme, and the August 2025 protests named this 'dwifungsi' creep among their causes - the instability and the New-Order memory the investors and the Western partners read when they price the country.
  it: ''
- hash: 008ce68d
  kind: cards
  en: 'Indonesia under Prabowo is the textbook hedger that has chosen to hedge at scale: it has not left the free-and-active line, it has made the line wide enough to hold a BRICS seat, a US defence partnership,
    a Russian oil contract, an Australian security treaty and Chinese jets at the same time. In Luttwak''s terms this is relational manoeuvre rather than alliance: no seam is exploited, because Jakarta
    sits on all of them, and the point is to make itself too useful to be pushed to either side. The method works while the great powers are in low-grade competition and the bills fall due in different
    currencies; the Lowy analysis dates its limit to April 2026, when the Iran war closed Hormuz and made energy, not doctrine, decide the week.

    The paradoxes are the price of belonging everywhere. Each club costs standing in another: BRICS cost a tariff threat in Washington, the Natuna formula cost the legal case against Beijing, the Board
    of Peace cost the street at home, the nickel ban cost leverage over its own smelters. The material limits are older than Prabowo: a 3% deficit cap that cannot carry free meals, a capital city and an
    arsenal at once; a net energy importer; a navy for an archipelago of thousands of islands. The archipelago is Indonesia''s strength (everyone needs its straits) and its weakness (no one can be kept
    out of them).

    The grades here follow structure, not courtesy. Almost every great-power relation is partner, because Indonesia treats all of them as purchasable, and the bonds say what the partnerships are worth:
    Saudi Arabia, Palestine and Malaysia are kin, Turkey and Papua New Guinea affinity, the others bought. Whether this is strategy or drift is the open question in the literature; this card records the
    structure (low confidence on trend after April 2026, since the Gaza deployment, the overflight request and the J-10 contract are all unresolved as of 12 Oct 2026).'
  it: ''
- hash: dac6a9e7
  kind: cards
  en: 'Strategic autonomy as the master objective: keep every great power needing India and none owning it (''multi-alignment''), so that India can grow into a leading power by 2047 without joining a bloc.
    The 2024-26 record is the test: the US, Russia, China, the EU and the Gulf are all courted at once.'
  it: ''
- hash: 72968bc6
  kind: cards
  en: Deter and coerce Pakistan out of sponsoring terrorism through a declared new normal - a major attack is an act of war, no distinction between terrorists and sponsors, no mediation, the Indus treaty
    in abeyance - while keeping the ceasefire and the DGMO channel.
  it: ''
- hash: 7d312082
  kind: cards
  en: 'Manage China without a second war: hold the Line of Actual Control, normalise trade and flights after the Oct 2024 patrolling deal and Xi''s Sept 2026 visit, and cut the structural deficit (USD 112bn)
    and the China-Pakistan military nexus that makes the border a two-front problem.'
  it: ''
- hash: e65a93de
  kind: cards
  en: 'Energy and economic security for 6-7% growth: imported crude (about 80-88%) from the cheapest source (Russian oil at record volumes in July 2026), plus trade deals with the UK (in force Jul 2026),
    EU (concluded Jan 2026), the US (framework Feb 2026, unsigned), Australia and Canada, so that no single market can tariff India into compliance.'
  it: ''
- hash: c6034d8e
  kind: cards
  en: 'Primacy in South Asia and the Indian Ocean: keep Bhutan, the Maldives and Sri Lanka inside India''s credit and security orbit, contain Chinese inroads and manage Bangladesh, Nepal and Myanmar through
    a Navy that now escorts tankers through Hormuz (Operation Urja Suraksha) and arms exports such as BrahMos to Southeast Asia.'
  it: ''
- hash: 67caffb0
  kind: cards
  en: 'Status: a permanent Security Council seat (and the 2028-29 non-permanent campaign ''SHANTI''), the chair of BRICS in 2026, and a claim to speak for the Global South.'
  it: ''
- hash: 98a2589c
  kind: cards
  en: 'Multi-alignment diplomacy: summits with all the great powers in a single fortnight (Modi-Putin 11 Sep 2026, Modi-Xi 12 Sep, the Quad foreign ministers in May 2026), a BRICS chair and a bid for the
    UN seat, refusal of Pakistan mediation and of any alliance.'
  it: ''
- hash: 1056ea2d
  kind: cards
  en: Narrative of Operation Sindoor as a successful deterrence doctrine, carried by briefings of the Foreign Secretary with military officers, and of China and Turkey as co-adversaries of Pakistan's side
    (Lt Gen Singh); 'Global South' framing at the UN and in BRICS.
  it: ''
- hash: 9f483a96
  kind: cards
  en: 'Calibrated force: Operation Sindoor (7-10 May 2025), coercive stand-off strikes rather than ground war; a Navy that escorts Indian tankers through Hormuz; imports of Rafale (114 in the pipeline),
    S-400, German submarines; exports of BrahMos to the Philippines, Vietnam and Indonesia.'
  it: ''
- hash: 8871ae79
  kind: cards
  en: 'Economic statecraft: trade agreements as hedges (UK, EU, Australia, US), currency swaps and lines of credit to neighbours (Maldives, Bhutan, Sri Lanka), the Indus water treaty suspension as leverage
    on Pakistan, and the market access India offers or withholds.'
  it: ''
- hash: 3c6023f9
  kind: cards
  en: 'Imported energy and the Strait of Hormuz: India imports about 80% of its oil, the 2026 Iran war pushed oil above USD 100 and cut growth forecasts (IMF 6.4% for FY2026-27), so cheap Russian crude
    is a necessity even as Washington threatens tariffs on its buyers.'
  it: ''
- hash: 8ce13c95
  kind: cards
  en: 'China is both the rival and the supplier: a USD 112bn goods deficit, rare-earth magnets and specialty fertilisers that Beijing has curbed, an upstream dam on the Brahmaputra (Medog), and the Pakistan
    army''s arms supplier.'
  it: ''
- hash: ee7d2e77
  kind: cards
  en: 'The US can hurt India on trade and on people: 50% tariffs in Aug 2025, an act authorising up to 100% on buyers of Russian energy (17 Sep 2026), a USD 100,000 H-1B fee; India cannot match this and
    cannot condition its own defence partnership.'
  it: ''
- hash: edf4c99a
  kind: cards
  en: 'Gulf exposure: about 9 million Indian workers, GCC states 38% of remittances, a Gulf war that may cost up to USD 10bn in remittances, and a partnership with Israel, Iran and Saudi Arabia that cannot
    be held with all three at once.'
  it: ''
- hash: b33bfb3a
  kind: cards
  en: 'A hostile neighbourhood reacts: Dhaka demands Hasina''s extradition and turns to China and Pakistan, Kathmandu reasserts its map, the Arakan Army controls the Kaladan route, and Pakistan is armed
    by China and (since Sept 2025) tied to Saudi Arabia by a defence pact.'
  it: ''
- hash: 81db89b8
  kind: cards
  en: 'Capacity limits: gaps in air defence and delivery delays (Lt Gen Singh, July 2025), record foreign-investor outflows in 2025 and a weak monsoon in 2026.'
  it: ''
- hash: ad2e9b24
  kind: cards
  en: 'The more India hedges, the less any partner trusts it: the 50% US tariffs (Aug 2025) and the Tianjin thaw with Xi (31 Aug 2025) followed each other within weeks, and in the week of 11-17 Sep 2026
    India received Putin, Xi and a US act aimed at its Russian oil. Multi-alignment buys leverage by being wanted by all, and loses it when each suspects the others are being served.'
  it: ''
- hash: c4f85a68
  kind: cards
  en: 'Operation Sindoor won the exchange and enlarged Pakistan''s coalition: the strikes of May 2025 were followed by the Saudi-Pakistan defence pact (17 Sep 2025), Chinese confirmation of on-site support
    and the ''one border, three adversaries'' reading. A deterrence that humiliates the weaker side makes its patrons close ranks.'
  it: ''
- hash: fe25f2bb
  kind: cards
  en: 'Suspending the Indus Waters Treaty is a lever on Pakistan that China can copy against India: Beijing is upstream on the Brahmaputra and has started the 60 GW Medog project, and India''s own argument
    for treaty-bound sharing has been weakened by its refusal to follow a treaty.'
  it: ''
- hash: 67a37f5c
  kind: cards
  en: The Russian oil that finances growth and anchors the Russian relationship is also what triggered the 25% penalty tariff, the Feb 2026 pledge to restrict it and the Sept 2026 act - while the Hormuz
    war pushed imports to a record 2.8 million b/d in July. The pledge to Washington and the fact on the water point in opposite directions.
  it: ''
- hash: 64e577cc
  kind: cards
  en: 'Neighbourhood-first policy turns into neighbour backlash: giving Sheikh Hasina refuge secured a friend and lost Bangladesh''s government; India''s presence at Lipulekh brought Nepal''s new government
    to restate its map; credit lines to the Maldives came after Malé made India withdraw its 78 soldiers. Each act of assertiveness adds to the Chinese alternative it aims to deny.'
  it: ''
- hash: 2a3dde5b
  kind: cards
  en: 'Partnering with all sides in the Gulf exposes India to all of them: Modi was in Israel two days before the US-Israeli strikes on Iran, Chabahar''s US waiver lapsed in April 2026, and the 9 million
    workers whose remittances are the hostage sit in states under Iranian missile fire.'
  it: ''
- hash: b9f499c8
  kind: cards
  en: 'India''s grand strategy is relational manoeuvre among the great powers. In Luttwak''s terms it is the strategy of a state strong enough to refuse a patron and not strong enough to ignore any of them:
    it extracts from each - US technology and defence frameworks, Russian oil and arms, Chinese inputs and a quiet border, European markets, Gulf energy and money, Japanese capital - by being too large
    to coerce and too useful to lose. The paradoxical logic is that each of these relations is also a pressure point, and the pressures are not independent. The week of 11-17 September 2026 shows the shape:
    Putin in Delhi on the 11th, Xi on the 12th, the US Congress passing a tariff authority on Russian oil buyers on the 17th. The culminating point of manoeuvre is reached when all three pull at once and
    the price of waiting - a tariff, a border incident, a sanction - overtakes the benefit of keeping options open; in July, with the Hormuz war on, Russian imports hit 2.8 million barrels a day just when
    Washington sought less of them, and the US-India trade agreement that would reward a shift remains unsigned. The Pakistan file is read here as rivalry, not mortal enmity: New Delhi''s declared aim is
    deterrence of terrorism, with a reversible lever (the Indus treaty) and an accepted ceasefire, and it does not seek the end of the Pakistani state - which is what separates it from Israel and Iran.
    The neighbourhood is where the strategy is least comfortable: the instruments of primacy (credit lines, hydropower, refuge for Hasina) generate reactions that open space for China. Confidence in this
    reading is moderate: it rests on tier-3 press for most 2026 events, and several figures (Indonesian and Vietnamese BrahMos values, the Rafale and submarine contracts, the status of the US sanctions
    act) are unconfirmed.'
  it: ''
- hash: 31d64050
  kind: cards
  en: Use the EU Council presidency of July-December 2026 to set the Union's agenda on competitiveness, values and security, and to broker EU decisions on Russia (Irish officials brokered the compromise
    that opened the 21st sanctions package on 23 July 2026).
  it: ''
- hash: 5b7532a8
  kind: cards
  en: 'Keep the Northern Ireland settlement stable with London: the Good Friday Agreement, the Windsor Framework, the UK-EU SPS reset that would remove routine agri-food checks on the Irish Sea, and the
    September 2025 legacy framework that replaces the 2023 Legacy Act.'
  it: ''
- hash: 70d2dbb1
  kind: cards
  en: Keep the US investment base and the low-tax model that depends on it (pharma and tech multinationals) while refusing alignment with Washington on Gaza and on the use of Shannon Airport.
  it: ''
- hash: 1868bc6d
  kind: cards
  en: The Israeli Settlements (Prohibition of Importation of Goods) Act 2026 bans imports of goods from Israeli settlements. The President signed it on 23 July 2026; services were left out because the government
    said a services ban had to be legally watertight.
  it: ''
- hash: f98b4767
  kind: cards
  en: 'Ukraine support: a EUR 125m bilateral package for 2026 (EUR 100m for non-lethal military equipment, EUR 25m for energy and critical infrastructure), announced on 23 July 2026. Non-lethal military
    aid is the line that keeps the neutrality position intact.'
  it: ''
- hash: 24a2abc3
  kind: cards
  en: 'Partnership for Peace with NATO rather than membership: joint training and peacekeeping with the alliance without a defence commitment. The Defence Forces budget is set to rise from EUR 1.1bn to
    EUR 1.5bn by 2028.'
  it: ''
- hash: ca92c21c
  kind: cards
  en: 'Neutrality and the triple lock: sending more than 12 Defence Forces personnel abroad needs a Cabinet decision, a Dail vote and a UN mandate. The Defence (Amendment) Bill 2026 would drop the UN mandate
    and raise the no-vote limit from 12 to 50, but it was deferred until after the summer recess.'
  it: ''
- hash: 793313dd
  kind: cards
  en: 'Defence capacity is thin: about 75% of international data cables pass through or near Irish waters, yet Dublin has only eight patrol ships to guard them, so monitoring depends partly on partner navies
    and air patrols.'
  it: ''
- hash: 626092e0
  kind: cards
  en: 'The US tariff threat hits the export base: pharmaceuticals were EUR 58bn of EUR 73bn of Irish goods exports to the United States in 2024, and the 2025 tariff threat put about 75,000 pharma jobs at
    risk.'
  it: ''
- hash: 3b42ff2a
  kind: cards
  en: Neutrality is meant to keep Ireland out of other states' wars, yet its cable monitoring rests partly on foreign navies and air forces, and its Israel policy (settlement goods ban, ICJ intervention)
    cost it Israel's embassy in Dublin. The more it asserts independence, the more it depends on partners it criticises.
  it: ''
- hash: d88dd6c7
  kind: cards
  en: Ireland is a small EU member outside NATO, with a neutral military tradition, a Partnership for Peace relationship, and an economy built on US multinationals. Its strategy uses the EU as its anchor
    and the 2026 Council presidency as its lever, keeps the UK relationship stable through the Northern Ireland framework, and takes a visible line on Gaza that has cost it an embassy relationship with
    Israel. Its thin defence means the Russia question is handled mainly through EU sanctions and partner monitoring of undersea cables.
  it: ''
- hash: ec0e7833
  kind: cards
  en: 'Survive as the Islamic Republic after decapitation: keep the system standing after the killing of Ali Khamenei on 28 Feb 2026, install a successor (Mojtaba Khamenei, named by the Assembly of Experts
    on 8 Mar, never seen in public since) and hold the street after the January 2026 massacre. In practice power sits with an informal committee of IRGC commanders and a few politicians, with parliament
    speaker Ghalibaf as the public face.'
  it: ''
- hash: 209489f4
  kind: cards
  en: End the US-Israeli war on terms that lift the American naval blockade (in force since 13 Apr, reinstated in July), the oil sanctions and the freeze on Iranian assets, while keeping the Strait of Hormuz
    as its only lever. Tehran's proposal at the UN General Assembly in late September (Hormuz reopens seven days after a general ceasefire, nuclear talks follow) builds on the Islamabad Memorandum of 17
    June; Trump rejected it and Pezeshkian calls negotiations with Washington 'futile'.
  it: ''
- hash: 345f5116
  kind: cards
  en: 'Keep the nuclear option as a hedge: preserve the right to enrich and the roughly 440.9 kg of 60% uranium (most of it believed buried at Isfahan, unverified since June 2025) and refuse the verification
    that would turn it into a bargaining chip, while a bill in the Majlis (introduced 28 Mar 2026, still pending in late September) would take Iran out of the NPT. Pezeshkian''s government resists the exit.'
  it: ''
- hash: 8eadb21e
  kind: cards
  en: 'Drive the American military out of the Gulf and make its hosts pay: ''all US bases in the region must close'', the new leader said on 12 Mar, and Iran fired more than 6,700 missiles and drones at
    the six GCC states between 28 Feb and 17 May. The aim is to turn the Gulf monarchies from basing hosts into lobbyists for a ceasefire.'
  it: ''
- hash: afcf9318
  kind: cards
  en: 'Keep what is left of the ''axis of resistance'' alive as forward defence: Hezbollah (fighting Israel again since 2 Mar), Iraq''s Tehran-aligned militias, and above all the Houthis, who in 3-11 September
    took the Red Sea coast up to the Bab al-Mandab with Iranian arms and advice (per Reuters). Hamas is a weaker, separate file.'
  it: ''
- hash: 2c03afdf
  kind: cards
  en: 'Stay inside the Russian-Chinese camp as an economic and diplomatic lifeline: China takes more than 80% of the crude Iran can still ship, the 25-year cooperation agreement (2021) and the Russian strategic
    partnership treaty (17 Jan 2025) are the legal frame, and SCO (2023) and BRICS (2024) membership the club. The partners supply oil money, intelligence and UN cover, not troops.'
  it: ''
- hash: 619cb65c
  kind: cards
  en: 'A mediator ring Tehran chooses itself: Oman (hosted the indirect talks in Muscat on 6 Feb 2026), Pakistan (brokered the 8 Apr ceasefire, hosted the Islamabad talks led by Ghalibaf and Araghchi on
    11-12 Apr, and the 17 Jun memorandum) and Qatar (co-mediator since August), plus Swiss good offices; at the UN it relies on Russian and Chinese cover and argues the snapback is void.'
  it: ''
- hash: 24665b2c
  kind: cards
  en: 'Statements of defiance read on state television in the name of an unseen leader (the 12 Mar message: vengeance ''until fully achieved'', compensation or seizure of enemy property), denial of attributed
    attacks (Nakhchivan, Turkey) and a blackout on the home front: the internet was cut from 8 Jan to 26 May according to the protest record.'
  it: ''
- hash: 041b89a5
  kind: cards
  en: 'Missile and drone saturation of Israel, US bases and Gulf infrastructure (Ras Laffan, Habshan, Sitra, desalination plants, the US embassy in Riyadh), closure and ''sovereignty'' claims over Hormuz,
    mine-laying and attacks on shipping, and delegated pressure through Iraqi militias, Hezbollah (Iranian personnel reportedly on the Ali Taher ridge) and the Houthis. Air defence and the air force are
    largely gone: two Su-24 sorties toward Qatar were shot down on 2 Mar.'
  it: ''
- hash: ec9f15d4
  kind: cards
  en: Selective passage through Hormuz as a currency (Indian LPG tankers on 12 Mar, Chinese-linked tankers under special arrangements), crude sold to Chinese teapot refiners at a discount, gas and electricity
    to Iraq and Armenia, and a cash lifeline from Dubai's re-export trade until the UAE suspended all dealings on 18-19 Aug.
  it: ''
- hash: 0e8e65c6
  kind: cards
  en: 'The blockade has cut the state''s hard-currency income to near zero: the US naval blockade (13 Apr, reinstated in July) took Iranian crude shipments to near-zero, GDP fell 10.1% year on year in the
    first Persian quarter (late March to late June), and the informal rial reached about 2.25 million per dollar in early September against 1.5 million in January. Inflation estimates run from 40% to 70%.'
  it: ''
- hash: fe46a91d
  kind: cards
  en: 'A broken legitimacy: the protests that began on 28 Dec 2025 over the collapsing rial ended in a crackdown that HRANA counts at more than 6,000 dead and 40,000-50,000 arrested (the government admits
    3,117 dead), and since March executions have climbed (532 verified by 31 Aug, 31 of them protesters; 854 by HRANA''s count to July). The regime asks for national unity in wartime from a population it
    shot at in January.'
  it: ''
- hash: '90826415'
  kind: cards
  en: 'No allies who will fight: the Russian treaty contains no mutual-defence clause (only a pledge not to help an aggressor), Moscow offers mediation and intelligence, and Beijing asks Iran to reopen
    Hormuz and criticises its strikes on Gulf states. Iran fights alone in the air.'
  it: ''
- hash: 2ab0d83f
  kind: cards
  en: 'Blindness and legal exposure on the nuclear file: the IAEA has had no access to the bombed sites since June 2025 and says it can neither confirm nor rule out that the 440.9 kg of 60% uranium are
    where its seals were left; UN sanctions were reimposed by the E3 snapback on 27-28 Sep 2025 (Russia, China and Iran call it null and void).'
  it: ''
- hash: 898a44b0
  kind: cards
  en: 'A decapitated and invisible command: Khamenei and Larijani (17 Mar) are dead, the successor has not appeared in public and is reported injured, decisions pass through an informal IRGC-led committee,
    and Washington says it is ''not totally clear how their country makes decisions''. This slows concessions and makes any promise hard to verify.'
  it: ''
- hash: e857691f
  kind: cards
  en: 'A hostile neighbourhood: the Gulf monarchies (the UAE above all) were struck for months and now cut trade or shoot back; Syria''s new government expelled Iran''s militias and keeps the embassy shut;
    Azerbaijan pulled diplomats after the Nakhchivan drones; even Turkey had missiles intercepted over its soil.'
  it: ''
- hash: 2c902830
  kind: cards
  en: Hormuz and the Gulf strikes were meant to raise the price of the war for Washington; they turned Riyadh, Abu Dhabi and Doha, the neighbours Tehran had courted since the 2023 Beijing deal, into victims
    who shoot down its aircraft (Qatar), expel its attachés, cut every commercial link (UAE, 18-19 Aug) and lobby Washington. The lever that works against the US works against Iran's own economic hinterland.
  it: ''
- hash: af8fa4d3
  kind: cards
  en: Nuclear ambiguity as insurance produced the very attack it was meant to prevent. Stockpiling 440.9 kg of 60% uranium and ending IAEA monitoring gave the E3 their snapback case (28 Aug 2025) and Israel
    and the US their case for striking in June 2025 and again in February 2026; and the NPT-exit bill, sold as deterrence, would remove the last legal ground on which Russia and China defend Iran at the
    UN.
  it: ''
- hash: baec4ea2
  kind: cards
