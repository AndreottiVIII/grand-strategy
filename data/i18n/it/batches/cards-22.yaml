lang: it
items:
- hash: 19336a67
  kind: cards
  en: 'Paid lobbying in Washington: the entity''s government has paid more than USD 4m since the start of 2025 to firms and operatives linked to Trump (James Blair and Chris LaCivita are named by the New
    York Times as advisers), the instrument behind the sanctions relief; the Bosnian Constitutional Court ruled on 25 Sep 2026 that this public spending was not in line with the constitution.'
  it: ''
- hash: a03daf0b
  kind: cards
  en: 'Legislative theatre and plebiscitary politics: laws banning the state judiciary and police (27 Feb 2025), the foreign-agents law, declarations (July 2024 on the Serbian nation, July 2026 on ''vital
    national interest'') and talk of referendums, each framed as defence of Dayton; plus the memory politics that rejected the Srebrenica resolution of 23 May 2024 (84-19-68) in a joint Vucic-Dodik campaign.'
  it: ''
- hash: c1ed3fb4
  kind: cards
  en: 'No army of its own (defence is a state competence, which is why the entity demands it back) but entity police with special units, and a police-security channel to Budapest: some 300 Hungarian special
    police were reported in Banja Luka in February-March 2025 (Dodik: training; VSquare: cover for an extraction plan for Dodik) and a memorandum between the RS interior ministry and Hungary''s counter-terrorism
    centre; in April 2025 Dodik asked for RS to join the Serbia-Hungary security cooperation.'
  it: ''
- hash: 23bb4726
  kind: cards
  en: 'Patrons'' money and the entity''s own purse: the Hungarian Eximbank loan (HUF 45bn, 2022), Russian-owned refineries and gas plans (Zarubezhneft''s Optima group, a Gazprom-linked pipeline from Serbia),
    Chinese contractors, and the entity budget, police and public companies as bargaining chips against the state; the State-level budget and EU Growth Plan money (EUR 373.9m at risk by 31 Dec 2026) are
    what the state''s blockages cost the whole country.'
  it: ''
- hash: 9e657500
  kind: cards
  en: 'The legal cage: the entity''s powers come from the Dayton constitution, and each attempt to exceed them has been undone - the Constitutional Court suspended the laws of 27 Feb 2025 on 7 March and
    annulled them on 29 May; the State Court verdict was upheld on 1 Aug 2025; the CEC removed the president; the Assembly repealed the laws on 18 Oct 2025. The Security Council reaffirmed Bosnia''s territorial
    integrity on 29 Dec 2025.'
  it: ''
- hash: bd72b61c
  kind: cards
  en: 'Belgrade''s support is real but bounded: Vucic called the verdict ''a destabilising factor'' and said Serbia ''stands by Republika Srpska'', but Serbia''s formal line is respect for Dayton, it has
    not backed secession, and Serbia''s own EU path and its Washington channel both depend on not owning a Bosnian secession.'
  it: ''
- hash: 1fd793bd
  kind: cards
  en: 'The foreign garrison is not Banja Luka''s to dismiss: EUFOR Althea (Chapter VII mandate, renewed unanimously on 31 Oct 2025, due again by 31 Oct 2026) received about 300 reserve troops in March 2025
    when the Dodik crisis worsened, and Germany''s Bundestag approved its participation again on 11 Jun 2026.'
  it: ''
- hash: b6cf2a9a
  kind: cards
  en: 'Patrons that can change: Orban, the entity''s best EU door, lost the 12 April 2026 election; Washington lifted sanctions but a bipartisan group in Congress asked on 27 Mar 2026 for them to be reimposed
    and the State Department warned Sarajevo in June 2026 about Russian gas ties; Germany and Austria keep entry bans on Dodik and two aides (May 2025).'
  it: ''
- hash: 58102f35
  kind: cards
  en: 'A shrinking, divided electorate: Karan won the November 2025 vote by about 50.3% to 48.4% on a turnout of about 35% (OSW), the 8 Feb 2026 rerun was needed after the CEC annulled 136 polling stations,
    and general-election turnout on 4 Oct 2026 was about 42%, a record low.'
  it: ''
- hash: fe7a27b6
  kind: cards
  en: 'A narrow, indebted base: the Russian-owned Brod refinery has not processed oil since 2019 and carries accumulated losses above KM 914m (about EUR 467m) with auditors doubting its continuity; all
    of Bosnia''s gas arrives from Russia through Serbia over a single pipeline (one press source for the 100%), and the entity has no sea access.'
  it: ''
- hash: 5ef37d52
  kind: cards
  en: Every secession threat strengthens the state institutions that react to it. The laws of 27 Feb 2025 that banned the State Court, prosecutors and police from the entity drew the Constitutional Court's
    suspension and annulment, a reinforcement of EUFOR by about 300 troops, German and Austrian entry bans, a funding cut to SNSD by the High Representative, and a Security Council statement on territorial
    integrity - and in the end the Assembly repealed the laws itself on 18 Oct 2025. The entity left the exchange with a precedent that the state can execute a verdict against its president.
  it: ''
- hash: daa2ca9b
  kind: cards
  en: The patron needs the entity loud but not detached, and the entity needs the patron to say yes without owning the consequences. Belgrade shelters Dodik, signs declarations of national unity and refuses
    to accept the verdict, yet it also denies backing secession and will not make the entity's status a Serbian cause; the louder Banja Luka gets, the more it burdens Belgrade's EU track (the Commission
    put Serbia's push 'on hold' after the Mladic funeral), and the more Belgrade has to restrain it.
  it: ''
- hash: '79799452'
  kind: cards
  en: 'Retreat paid and defiance did not: Washington lifted sanctions on 29 Oct 2025 as a ''responsive measure'' to the repeal of the laws, a reward that teaches the entity that escalation followed by a
    calculated retreat sells at a premium. But the premium was bought with public money - more than USD 4m in lobbying that the Constitutional Court declared unconstitutional on 25 Sep 2026 - and it depends
    on a transactional White House, not on a settlement.'
  it: ''
- hash: 9012cdde
  kind: cards
  en: Courting every patron makes the patrons collide. Banja Luka hosts Russian ownership of its oil sector and refuses sanctions on Moscow while paying Trump's circle to win Washington; the State Department
    warned Sarajevo in June 2026 against dependence on Russian gas after RS officials met Gazprom, and the US-backed Southern Interconnection from Croatia (the alternative to the Serbian route) is the project
    the entity's Russian ties work against.
  it: ''
- hash: ac39de80
  kind: cards
  en: The Russian patron brings prestige and losses, not growth. The Brod refinery bought by Zarubezhneft's subsidiary in 2007 for KM 236m has produced nothing since a 2018 fire, EUR 900m of Russian capital
    went in between 2018 and 2021, and the owner has only pledged to keep the company alive for another year; Moscow's value to the entity is the veto and the photograph, not the economy.
  it: ''
- hash: 4abf0476
  kind: cards
  en: 'Winning elections while the electorate leaves. SNSD held the entity three times in twelve months (Nov 2025, Feb 2026, Oct 2026), yet by a razor-thin margin in the presidential race, with turnout
    of about 35% in the first round and about 42% in the general election: the nationalist mobilisation that keeps the party in power sits on a population that is draining away.'
  it: ''
- hash: bb74d514
  kind: cards
  en: 'Republika Srpska is an entity of a state that it works to hollow out, run by a

    party that kept the entity three times in a year in which its leader lost his

    office. Its grand strategy is the strategy of a sub-state actor whose

    patron needs it loud but not detached: Belgrade wants a Republika Srpska strong

    enough to hold Bosnia hostage to the Serbian cause and keep the Sarajevo

    state weak, but not so detached that Serbia must either own a secession or

    disown a kin. That makes the entity''s best move the threat, not the act - and

    here Luttwak''s paradoxical logic bites hardest. Each time Banja Luka has

    crossed the line (the laws of 27 Feb 2025) the state''s institutions have

    reacted (court annulment, EUFOR reserve troops, entry bans, the High

    Representative''s funding cut), and those institutions came out stronger and

    better tested than before; the repeal of 18 Oct 2025 was a retreat that

    Washington rewarded within eleven days. The lesson Banja Luka drew is not

    restraint but timing: escalate, absorb, retreat for a price, and let paid

    lobbyists and a weaker OHR (Schmidt out in May 2026, an acting High

    Representative from 1 July) do the rest.


    Signals that are not rows. The plea agreement and the pardon: no source reached

    shows a plea agreement between Dodik and the State Prosecutor''s Office, and

    the prison term was converted into a fine of about EUR 18,660 on 12 Aug 2025

    at the defence''s request, the six-year ban untouched; in October 2026

    Bosnian media discuss whether the state Presidency could pardon him, which

    would need all three members and the prior opinion of the State Court - a

    debate, not an act. Orban''s defeat in April 2026 removes the entity''s best

    door in the EU, and no source on the new Hungarian government''s line toward

    Banja Luka was found. The entity''s two stable patrons are therefore

    Belgrade (kin, bounded) and Moscow (kin, expensive); its transactional ones

    are Washington, Budapest, Jerusalem, Ankara and Beijing, none of which has a

    treaty with it.'
  it: ''
- hash: e745f7b9
  kind: cards
  en: 'Turn the Block 58 offshore oil (GranMorgu) into state revenue once it starts, now expected by mid-2028. The investors are TotalEnergies and APA Corp, with Staatsolie, the state company, entitled
    to 20% under the production sharing contract. Our reading: the source gives the project and its timing, not a government statement of purpose, so the objective is inferred.'
  it: ''
- hash: c46a9658
  kind: cards
  en: Keep the Netherlands close, the one partner read so far with kinship under it. King Willem-Alexander and Queen Maxima made a state visit to Suriname on 1-3 December 2025, at President Geerlings-Simons'
    invitation.
  it: ''
- hash: dd344da3
  kind: cards
  en: Oil as a lever. Staatsolie's 20% entitlement under the production sharing contract, in a project run by TotalEnergies and APA Corp with first oil expected by mid-2028 at about 220,000 barrels a day.
    One tier-3 wire report, so confidence C.
  it: ''
- hash: 549a53db
  kind: cards
  en: A diplomatic channel to The Hague. The December 2025 state visit is the most visible tool, with the Royal House's own announcement as the source.
  it: ''
- hash: 4bd6e2c2
  kind: cards
  en: Debt and the IMF. Suriname held about US$3.5 billion of debt and was in a three-year IMF restructuring programme when AP reported in October 2024. The oil money that would ease that load is not expected
    before mid-2028. The programme's status in 2026 was not read.
  it: ''
- hash: 04520b34
  kind: cards
  en: The oil that is meant to close the debt gap is run by foreign operators, with Staatsolie entitled to only 20%. The state's share of the early income therefore depends on contract terms the AP report
    does not give. Our reading, confidence C.
  it: ''
- hash: be75b36f
  kind: cards
  en: 'Suriname''s strategy in 2026 is to bridge from a debt-and-IMF present to the 2028 oil start, with the Netherlands kept close as the partner that has kinship under it. The sources here are thin: one
    tier-3 wire report covers the oil, debt and IMF, and the Dutch card''s tier-1 Royal House page covers the visit. China, Guyana, France, India and the United States have not been read from Paramaribo''s
    side, so their postures are not yet written.'
  it: ''
- hash: 9cf98314
  kind: cards
  en: 'Keep Fico''s Smer-led coalition in power through the 2027 election: the junior partners (Hlas, the Slovak National Party) are quarrelling, the Slovak National Party voted with the opposition on 29
    Sep 2026 to dismiss the environment minister, and Fico has said an early election could come as soon as January. Every foreign-policy move (Moscow, Beijing, the Ukraine veto) is read first as domestic
    politics.'
  it: ''
- hash: a25ab7d3
  kind: cards
  en: 'Keep Russian energy flowing at a price Slovakia calls bearable and slow or reverse the EU phase-out: the SPP-Gazprom contract to 2034, Druzhba crude for the Slovnaft refinery, and the January 2026
    regulation (LNG banned by end-2026, pipeline gas by 30 Sep 2027), which Bratislava challenged at the EU Court of Justice on 24 Apr 2026.'
  it: ''
- hash: 80537f40
  kind: cards
  en: 'A ''sovereign foreign policy'' that keeps Slovakia out of the Ukraine war and its financing while remaining in the EU and NATO: no state military aid, no troops and no share of EU loan guarantees
    (Bratislava Castle meeting of 10 Jan 2026), opposition to Ukraine''s fast-tracked accession (''Ukraine cannot overtake Montenegro''), and on 18 Sep 2026 a refusal to be ''part of any military conflict
    because of some Article 5''.'
  it: ''
- hash: 392acf54
  kind: cards
  en: 'Protect EU money and euro-area standing while resisting EU conditionality: the Commission has weighed freezing part of EUR 12.8bn of cohesion funds, the Parliament asked it on 29 Apr 2026 (418 votes)
    to use the conditionality mechanism for the first time, and the country has been in an excessive-deficit procedure since 26 Jul 2024; a EUR 2.7bn consolidation package passed in September 2025.'
  it: ''
- hash: 5ebcbccf
  kind: cards
  en: 'Defend the export model and diversify its patrons: Germany-linked car plants, a EUR 2.4-2.5bn arms-export industry (2025), Chinese capital (Gotion battery plant, a strategic partnership signed 1
    Nov 2024) and American technology (a 1,200 MW Westinghouse unit at Bohunice, intergovernmental agreement of 16 Jan 2026).'
  it: ''
- hash: 3f0519cc
  kind: cards
  en: 'Look after the minimum security of a landlocked state at the lowest price: about 2% of GDP for defence in 2026 (EUR 2.88bn) rather than NATO''s 5% by 2035, bought mostly as American and Israeli hardware
    (14 F-16 Block 70, Barak MX air defence, used Black Hawks).'
  it: ''
- hash: 3ad3f182
  kind: cards
  en: The veto turned into a bargaining chip. In July 2025 Slovakia blocked the EU's 18th sanctions package six times until the Commission gave written assurances on gas prices and supply after 2027; in
    Feb-Apr 2026 it tied the 20th package, Ukraine's loan and accession talks to the restart of Druzhba oil. Unanimity gives a state of 5.4 million this leverage, and Fico said openly he links 'the two
    issues'.
  it: ''
- hash: eead736f
  kind: cards
  en: 'Leader-level tours that no other EU government makes: Moscow on 22 Dec 2024 (gas), Moscow on 9 May 2025 (Victory Day parade), Beijing on 2-4 Sep 2025 (Putin, then Xi, the only EU leader at the parade)
    and Moscow again on 9 May 2026 (a short meeting with Putin, carrying a message from Zelensky). Plus convening roles: chair of the Slavkov format with Austria and Czechia, and the Visegrad presidency
    from 1 Jul 2026.'
  it: ''
- hash: 1568bad6
  kind: cards
  en: 'Courts and constitution as shields: the September 2025 amendment (90 of 150 votes) puts ''national identity'' and ''cultural and ethical questions'' above EU law, a lawsuit at the CJEU against the
    gas phase-out, an opt-out from the EU''s EUR 90bn Ukraine loan under Article 20 TEU (December 2025), and a president (Pellegrini, elected April 2024) whom OSW expected to be no institutional counterweight
    to the cabinet.'
  it: ''
- hash: 8f28eeeb
  kind: cards
  en: 'Domestic narrative control: Fico''s own video posts on Facebook as the first account of every summit and Moscow trip (the Druzhba line that ''the pipeline was never damaged''), the ''NGOs ruling
    this country'' frame behind the April 2025 law that labels donor-funded NGOs, and the claim that opposition rallies are a coup plot.'
  it: ''
- hash: 9f52336c
  kind: cards
  en: 'Small forces, American and Israeli kit, a loud arms industry: 14 F-16 Block 70 (USD 1.6bn contract of 2018; ten delivered by December 2025), EUR 560m Barak MX air defence (December 2024), Black Hawks,
    a 2026 defence budget of 2.02% of GDP. The industry (ZVS/MSM, Konstrukta, CSG-linked firms) exported EUR 2.4-2.5bn of arms in 2025, mostly artillery ammunition for the Ukrainian market via third countries,
    with the state as half-owner of ZVS.'
  it: ''
- hash: 3a74bd10
  kind: cards
  en: 'Energy as lever and as hostage: a long-term SPP-Gazprom contract to 2034, TurkStream gas via Hungary since 1 Feb 2025 (about 1.7 bcm in January-August 2025), the Druzhba line for Slovnaft, and the
    use of emergency electricity exports to Ukraine as a counter-pressure (halted in February 2026, Fico said until oil resumed, which it did on 23 Apr). Beyond Russia: Gotion (about EUR 1.2-1.4bn, Surany)
    and the Westinghouse reactor plan.'
  it: ''
- hash: 7c189af7
  kind: cards
  en: 'The EU''s purse and rulebook: cohesion funds (EUR 12.8bn weighed for freezing in 2024), recovery grants (EUR 2.7bn at risk), the excessive-deficit procedure (4.9% deficit in 2023, still about 5%
    of GDP in 2025), and a Parliament that has twice asked the Commission to apply conditionality. A budget under consolidation leaves no room for a fight with Brussels that it can lose.'
  it: ''
- hash: c8968f14
  kind: cards
  en: 'An economy that is a German supply chain: exports of EUR 110.9bn in 2025, a car industry (Volkswagen, Kia, Stellantis, Jaguar Land Rover) at the centre of exports, 62% of electricity from nuclear
    plants run with Russian-designed reactors. A break with Berlin or with the single market is not an option, and Merz''s public rebuke of the May 2026 Moscow trip shows the price of tone.'
  it: ''
- hash: 29bc3620
  kind: cards
  en: 'Geography: a landlocked state with one oil artery (Druzhba, through Ukraine), one gas route (TurkStream via Hungary, too small to carry full demand) and one non-Russian alternative (the Adria pipeline
    through Croatia, which refused in February 2026 to carry Russian crude and became a rival of MOL and Slovnaft). The Ukrainian transit of Russian gas ended on 1 Jan 2025 and costs the state up to EUR
    500m a year.'
  it: ''
- hash: 458438fd
  kind: cards
  en: 'A divided society and a narrow majority: protests with tens of thousands (organisers claimed 60,000 in Bratislava in early 2025) since the December 2024 Moscow trip and the April 2025 NGO law, an
    opposition (Progressive Slovakia) that led polls in 2025, a coalition of 78 deputies that needed 12 opposition votes to pass the 2025 amendment, and the memory of the 15 May 2024 shooting of Fico (Juraj
    Cintula, 21 years, final on 29 Apr 2026) that hardens the government''s reading of its critics.'
  it: ''
- hash: f3f664df
  kind: cards
  en: 'NATO and EU membership as a cage it chose: the defence budget, air defence and F-16s are inside the alliance''s system, the cabinet cannot leave the sanctions consensus (it can only delay it), and
    the neighbours it would need as partners (Poland, Czechia, Hungary under Magyar) now pull toward Ukraine or toward Brussels rather than toward Bratislava.'
  it: ''
- hash: 50c0cd7c
  kind: cards
  en: The veto buys concessions and spends the goodwill that would pay for them. The July 2025 gas guarantees and the April 2026 release of the 20th package prove the lever works, yet each use hardens the
    Parliament (418 votes for conditionality) and the neighbours, and after Orban's defeat in April 2026 Bratislava has lost the Hungarian half of the axis that made a veto plausible.
  it: ''
- hash: 5ace09ee
  kind: cards
  en: Fighting for Russian energy while the route to it runs through the country it antagonises. Druzhba and the old gas contract both depended on Ukrainian territory; by threatening Kyiv's accession and
    cutting its emergency electricity in February 2026, Fico used his goods against the state whose goodwill he needs to recover the oil, and Slovnaft had in any case moved almost entirely to non-Russian
    crude through Adria.
  it: ''
- hash: b78f1cfd
  kind: cards
  en: Anti-Western rhetoric, American integration. Fico's party attacked the US and NATO in opposition, yet the same government buys 14 F-16s, signed a Westinghouse nuclear framework on 16 Jan 2026 and
    met Trump at Mar-a-Lago two days later; OSW's reading is that these concrete steps tie Slovakia ever closer to Washington while the Moscow visits serve the domestic audience.
  it: ''
- hash: ba505de6
  kind: cards
  en: Sovereignty over EU law, paid in EU law. The September 2025 amendment declares national identity and cultural-ethical matters beyond the reach of EU courts; the Commission opened infringement proceedings
    on 21 Nov 2025 for breaching the primacy of EU law, and Fico said there would be 'no change' - while the same state needs the single market and cohesion money that the primacy principle underwrites.
  it: ''
- hash: 32c58185
  kind: cards
  en: Against the war, and profiting from it. The government refuses state weapons, loan guarantees and troops for Ukraine, yet the arms industry in which the Defence Ministry is a half-owner of ZVS exported
    EUR 2.4-2.5bn in 2025, with heavy artillery ammunition intended for Ukraine at 83% of the 2024 total, and the state decides the export permits; a ceasefire would be the end of a boom.
  it: ''
- hash: def81499
  kind: cards
  en: The self-appointed bridge that nobody crosses. Fico carried Zelensky's offer to meet Putin 'in any format' to Moscow on 9 May 2026 and was told to phone; Merz said he regretted the trip and Berlin
    then said no official visit to Bratislava was planned, contradicting Fico's 29 May date; Poland's Sejm speaker visited Bratislava and refused to meet him. Standing between Moscow and Brussels has cost
    him the access that would let him mediate.
  it: ''
- hash: d7cfe7fb
  kind: cards
  en: 'Slovakia is the case of a small, trade-dependent member state that uses

    the rules of the club it belongs to as its main instrument against the

    club. Fico has no army to speak of, no oil, and an export economy

    wired into German supply chains; what he has is unanimity. The 2023-26

    pattern is therefore linkage: a veto (the 18th and 20th sanctions

    packages, Ukraine''s loan, the accession clusters) is held until a

    concrete good is released - gas guarantees, Druzhba oil, a hearing. That

    is Luttwak''s paradoxical logic in a small space: the weaker the state,

    the more it relies on the one resource, procedure, that its partners

    cannot take away without breaking their own rules. But the lever

    consumes itself. Hungary under Orban was the other half of the veto

    axis; after Magyar''s win in April 2026 Bratislava is alone, the

    Parliament has asked for conditionality, and the Visegrad revival is

    being run by Tusk, Babis and Magyar, not by Fico. Two signals that are

    not rows: Fico took the Moscow trip again in May 2026 after having

    been shot in 2024 and after a year of mass protest, which shows that

    the trips are a message to a domestic electorate and not a

    diplomatic programme (OSW and others make this reading of the

    American hardware too); and on 18 Sep 2026 he said he would not

    be ''part of any military conflict because of Article 5'' - a statement

    that, if believed, hollows out the alliance whose F-16s he is flying.

    The coalition crisis of September 2026 may end the story before the

    2027 election: the structural question is whether his successor,

    whoever it is, will inherit a state that has learned to veto or one

    that has learned to be vetoed.'
  it: ''
- hash: 663c9c68
  kind: cards
  en: 'Buy security at the lowest domestic price inside NATO and the EU: after being the alliance''s laggard (a 2025 parliamentary vote on spending, then Golob''s threat of a NATO-membership referendum),
    Janša''s government has committed to reach 2% of GDP in 2026 and the NATO path of 3.5% core defence by 2035.'
  it: ''
- hash: 08d83b2d
  kind: cards
  en: 'Keep the Croatian frontier quiet while keeping the legal win: Slovenia treats the 2017 Piran Bay arbitration award as binding, Croatia calls the process null; the two governments park the issue and
    cooperate on practical matters (border bridges agreement, 23 Jun 2025) because Zagreb is a co-member of the EU, the euro area, Schengen and NATO and the co-owner of Krško.'
  it: ''
- hash: 194bf77d
  kind: cards
  en: 'Secure low-carbon baseload from the one nuclear plant it has, shared with Croatia: a second unit (JEK2, estimated EUR 9.3-15.4bn) was to go to a consultative referendum on 24 Nov 2024, which parliament
    cancelled on 24 Oct 2024 (60-1-1); the project is alive but without a public mandate.'
  it: ''
- hash: 6012fcea
  kind: cards
  en: 'A small state''s voice at the United Nations: the 2024-25 Security Council seat (two presidencies, September 2024 and December 2025), five draft resolutions of which four on Gaza and one adopted
    (2728, March 2024), a vote for Palestine''s UN membership and co-sponsorship of the General Assembly resolution (143-9-25), after recognising Palestine on 4 Jun 2024.'
  it: ''
- hash: a73ef17d
  kind: cards
  en: 'Since June 2026 a personal channel to Washington and Jerusalem: Prime Minister Janša, an admirer of Trump, lifted the Israel measures on 11 Jun 2026 (Israel then announced an embassy in Ljubljana),
    met Melania Trump''s father at the US 250th-anniversary event in Ljubljana and attended the Trumps'' UNGA reception in September, inviting Trump to Slovenia.'
  it: ''
- hash: af57b4bc
  kind: cards
  en: 'Open-economy integration with its neighbours rather than leverage over them: Germany (13.5% of goods exports in 2023), Italy (8.6%), Croatia (7.8%) and Austria (5.7%), plus a very large and unusual
    flow to Switzerland (27.3%); EU members take 55.5% of exports.'
  it: ''
- hash: cdcbe51b
  kind: cards
  en: Parliamentary arithmetic. The 22 Mar 2026 election was inconclusive (Svoboda 29 seats, SDS 28 of 90, no bloc at 46); Janša was elected on 22 May 2026 by 51-36 with a 43-seat coalition (SDS, NSi, Democrats,
    SLS, Focus) plus the support of Resni.ca, so every foreign-policy reversal rests on a thin and untested majority.
  it: ''
- hash: 0de7e225
  kind: cards
  en: 'A weak military and a divided public on NATO: the last ally to reach 2% (not before 2026), a junior-coalition party (Levica) that wants out of NATO and a poll cited at about 52% support for membership
    in 2025, down from 66% in 2003.'
  it: ''
- hash: 6bd603a5
  kind: cards
  en: 'Croatia holds the other half of its infrastructure and its only sea access: Krško is owned jointly with Croatia''s HEP, the Piran Bay award is unimplemented and the Slovenian government cannot enforce
    it without costing goodwill it needs on Schengen, the euro and the plant.'
  it: ''
- hash: c4864c5e
  kind: cards
  en: A foreign-policy identity that does not outlast the election. Golob's government spent the UN seat, the 2024 recognition of Palestine and the 2025 entry bans and arms embargo on Israel to make Slovenia
    a principled voice; within six months of the seat's end Janša's government let the embargo lapse, lifted the bans and took the Palestinian flag off the government building, so the capital built on the
    seat is partly spent and Slovenian policy reads as a pendulum rather than a line.
  it: ''
- hash: 4de4af5b
  kind: cards
  en: Betting on a patron who fell. Janša, a close ally of Viktor Orbán (whose circle financed Slovenian right-wing media, per RSF), returned to office a month after Orbán lost the April 2026 Hungarian
    election to Péter Magyar; the Hungarian axis that was to shield Ljubljana in the EPP and the Council is gone, and the Israel line now costs him a hearing in Berlin.
  it: ''
- hash: fb52b863
  kind: cards
  en: A legal victory that cannot be cashed. The 2017 arbitration gave Slovenia most of Piran Bay and a junction to the high seas; because Croatia walked out of the process in 2015 and refuses the award,
    pressing the claim would cost the Croatian cooperation on which Krško, the border bridges and Schengen depend, so the award is kept as a moral asset and parked.
  it: ''
- hash: 6910ee08
  kind: cards
  en: 'Slovenia is a small, rich, open economy whose strategy is to stay inside every

    club (EU, euro, Schengen, NATO) and to spend as little as possible on anything

    that is not membership. Its distinctive feature in 2022-26 is that the content

    of foreign policy swings with the government while the anchors do not move:

