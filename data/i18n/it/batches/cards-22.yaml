- hash: f4b85265
  kind: cards
  en: Repression is the regime's insurance and its erosion. The January 2026 killing of thousands and the wartime executions keep the street quiet, but they hand the IRGC the state and leave Mojtaba Khamenei
    with no clerical authority of his own; every security gain moves power from the Islamic Republic's institutions to the Guards, the one actor Washington and Israel are targeting.
  it: ''
- hash: 73b624da
  kind: cards
  en: Talks buy time for the enemy; refusing them leaves the blockade. Pezeshkian says the US attacked Iran three times after talks (the atlas reads them as June 2025, February 2026 and July 2026, after
    the memorandum), so Tehran bargains in public while distrusting every sequence; Washington, for its part, doubts that anyone in Tehran can bind the state. The mutual mistrust is what keeps the Hormuz
    and blockade stalemate alive.
  it: ''
- hash: 794f938d
  kind: cards
  en: 'Iran in October 2026 runs the strategy of a regime that has lost the war it

    prepared for and cannot afford to concede it. Between June 2025 and February

    2026 its three layers of security collapsed one after another: the nuclear

    sites, the proxy belt (Assad gone in December 2024, Hezbollah gutted) and

    finally the leadership itself, when the US-Israeli campaign killed Ali Khamenei

    and then Larijani. What is left is a system run by the Revolutionary Guards

    behind an unseen successor, with the economy at near-zero oil income, a

    population it shot at in January, and one lever: the Strait of Hormuz and the

    ability to hit Gulf infrastructure. Luttwak''s logic shows in how that lever

    works against its owner: each use of it hardens an adversary (the UAE,

    Qatar, Saudi Arabia) that Tehran needs as a neighbour, and each hedge it

    builds (enriched uranium, the NPT-exit bill) justifies the next strike. The

    great powers it counted on (Russia, China) offer words, oil purchases and

    mediation, not defence, and both want Hormuz open more than they want Iran

    to win. Two signals that are not rows: Mojtaba Khamenei has not been seen in

    public since his appointment, and the Majlis has not yet voted on leaving the

    NPT: the one move Tehran has not made is the one that would end the ambiguity.

    The cards that matter are Washington''s (whether it still wants regime change,

    as Netanyahu does, or a deal on enrichment, as Vance''s 7 October language on a

    ''meaningful reduction'' suggests) and Beijing''s (whether it will trade its

    oil dependence for pressure on Tehran).'
  it: ''
- hash: 6a4030d4
  kind: cards
  en: 'Make the state the only armed actor: bring the Popular Mobilization Forces and the Iran-aligned factions under the Commander-in-Chief by 30 June 2027 (individual fighters join the PMF, groups that
    keep their names after the deadline are ''outlaws''), complete the end of foreign troops, and hold ''exclusive authority over decisions of war and peace''. Prime Minister Ali al-Zaidi, 40, was chosen
    by the Coordination Framework after Washington vetoed Nouri al-Maliki, and won a vote of confidence on 14 May 2026 for 14 of 23 ministers.'
  it: ''
- hash: b2dc8d51
  kind: cards
  en: 'Stay out of the US-Israeli war on Iran and keep both patrons: Baghdad said on 11 March that it would not let any party use its territory as a base against Iran, and al-Zaidi''s line is ''balanced
    foreign relations''. The aim is that neither Washington nor Tehran treats Iraq as the other''s platform, because Iraq has no air defence of its own and has been hit by all sides.'
  it: ''
- hash: c6c092a7
  kind: cards
  en: 'Restore oil income, about 90% of budget revenue, by getting crude out without the Strait of Hormuz: the Kirkuk-Ceyhan pipeline to Turkey (the one route that kept flowing), the Basra-Haditha pipeline
    to be built by Chinese firms and extended toward Turkey, Syria and Jordan, and gasoline imports through the Syrian port of Baniyas. Exports fell from about 3.47 million b/d in January 2026 to about
    530,000 b/d in May-June; al-Zaidi puts the losses at about USD 60bn.'
  it: ''
- hash: 3c423880
  kind: cards
  en: 'Keep the lights on and cut the dependence on Iranian gas: imported gas carried up to 40% of generating capacity at peak, Iran stopped the flow on 18 March 2026 after the strikes on South Pars, and
    supply (about 29 GW against a normal demand near 40 GW and a summer peak of 55 GW) is the main trigger of street protest. The remedies are electricity bought from Turkey and the Kurdistan Region since
    late May, the TotalEnergies gas, solar and water project (GGIP) and domestic gas.'
  it: ''
- hash: 72fce5fa
  kind: cards
  en: 'Settle what neighbours hold of Iraq''s sovereignty: foreign bases (Turkey agreed on 24 September 2026 to hand over Bashiqa gradually), the Khor Abdullah waterway and the maritime line beyond marker
    162 with Kuwait (new coordinates filed with the UN on 19 January and 9 February 2026; a joint working group agreed on 25 September), and water with Turkey through the mechanism that pays Turkish firms
