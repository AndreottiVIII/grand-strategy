  it: ''
- hash: 345b93d1
  kind: cards
  en: Every route round Hormuz runs through a neighbour Iraq has not fully settled with. Ceyhan depends on Ankara and a 1973 agreement renewed a year at a time, and on Erbil; the Baniyas imports and the
