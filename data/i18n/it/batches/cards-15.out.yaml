items:
- hash: 759a2e59
  it: |
    La riforma va dimostrata a Washington, non solo annunciata: il proclama indica il programma stesso e con esso nomina Dominica, mentre St Kitts e Nevis, Grenada e Saint Lucia gestiscono programmi analoghi e non sono nominate.
- hash: 1362ddba
  it: |
    Nessuna copertura collettiva sulle questioni difficili: la dichiarazione della CARICOM dell'ottobre 2025 sul rafforzamento militare degli Stati Uniti è arrivata dopo settimane di silenzio, Trinidad e Tobago ha rifiutato di sostenerla, e Browne è pubblicamente chiamato a rispondere sul punto se la CARICOM, Antigua compresa, si sia allineata al governo Maduro.
- hash: a72000d4
  it: |
    Il programma che porta le entrate è anche il motivo per cui Washington pone restrizioni ai suoi cittadini, e l'hedging verso la Cina è credibile solo finché Washington accetta la riforma. Ogni passo verso Pechino mette alla prova il legame con gli Stati Uniti di cui l'isola ha più bisogno.
- hash: 806f02ad
  it: |
    Antigua e Barbuda fa hedging con pochi strumenti: un voto nella CARICOM, un'ambasciata a Pechino e un programma di passaporti che mantiene un posto al tavolo di Washington solo finché è riformato. Nel 2026 gli Stati Uniti hanno risposto a questo hedging con restrizioni sui visti legate al programma; la risposta del governo è stata chiedere una revisione e promettere regole di residenza più severe, non cambiare linea. La scheda è scarna sul Regno Unito, sull'Ucraina e su Gaza, e sulle quote attuali di commercio e turismo, perché queste fonti non erano disponibili entro il budget flash.
- hash: 653ce550
  it: |
    Mantenere gli Stati Uniti impegnati nella difesa dell'Australia e presenti nella regione, e vincolarli con elementi che non possono ritirare con facilità: l'AUKUS Pillar 1 (la revisione del Pentagono del dicembre 2025 ha avallato la vendita di almeno tre sottomarini classe Virginia dal 2032), il quadro sui minerali critici firmato con Trump il 20 ott 2025 e il processo AUSMIN (Washington, 8 dic 2025).
- hash: 34719a52
  it: |
    Costruire in parallelo una cerchia di partner vincolati da trattati che non dipenda da Washington: Papua Nuova Guinea (Pukpuk, firmato il 6 ott 2025, in vigore da luglio 2026), Fiji (Ocean of Peace Alliance, 6 lug 2026), Tuvalu (Falepili Union), Nauru, Vanuatu (Nakamal, 29 giu 2026), Indonesia (Treaty on Common Security, 6 feb 2026) e Regno Unito (Geelong Treaty, 26 lug 2025), con Giappone, Filippine, Singapore e India come partner per l'accesso e per l'industria.
- hash: 22a2e308
  it: |
    Negare alla Cina un punto d'appoggio militare o di polizia nel Pacifico sud-occidentale e sugli accessi settentrionali: veti sugli accordi di sicurezza con terzi nei trattati con Nauru e Tuvalu, il divieto di basi straniere nell'accordo con Vanuatu, un'offerta di trattato alle Isole Salomone in contrapposizione al patto di polizia con la Cina del 2022, e l'impegno a riportare Port Darwin sotto controllo australiano.
- hash: 7f68c2e5
  it: |
    Mantenere nel frattempo i flussi commerciali con la Cina. Albanese è stato a Pechino il 12-18 lug 2025 per l'Annual Leaders' Meeting, dopo che Pechino aveva rimosso le barriere che costavano agli esportatori più di A$20bn l'anno; la Cina rappresenta quasi un terzo del commercio totale dell'Australia.
- hash: bdcee14a
  it: |
    Ricostruire l'Australian Defence Force abbastanza in fretta da contare prima dell'arrivo dei sottomarini: la National Defence Strategy 2026 (16 apr 2026) porta la spesa per la difesa al 3% del PIL entro il 2033 secondo il metodo contabile della NATO (A$14bn in più in quattro anni, A$53bn nel decennio), con undici fregate classe Mogami (circa A$10bn), 129 veicoli Redback, capacità di attacco a lungo raggio e difesa aerea e missilistica.
- hash: f24600a5
  it: |
    Diversificare un'economia legata a un solo cliente e a una sola catena di approvvigionamento: l'accordo di libero scambio con l'UE (concluso il 24 mar 2026; il 98% delle esportazioni esente da dazi dopo la ratifica), l'India (ECTA e l'agenda di cooperazione economica, minerali e uranio del vertice di luglio 2026) e il Quad Critical Minerals Framework (26 mag 2026).
- hash: e3ebecc4
  it: |
    I trattati come strumento principale. Dal 2023 Canberra ha trasformato i partenariati in testi - Falepili (Tuvalu), Nauru, Pukpuk (PNG), Nakamal (Vanuatu), Ocean of Peace Alliance (Fiji), Indonesia, Geelong (Regno Unito) - ciascuno con una clausola che consente all'Australia di vagliare i legami di sicurezza con terzi, e un'offerta di trattato complessivo alle Isole Salomone.
- hash: b7c691fd
  it: |
    Una cornice 'Pacific-led' per il potere australiano: la Pacific Policing Initiative (approvata ad agosto 2024; centro a Brisbane, centri di eccellenza di polizia, una forza regionale schierabile) e il sostegno pubblico al Pacific Islands Forum, con Albanese alla riunione dei leader di Palau (31 ago-3 set 2026). Distanza visibile da Washington e Gerusalemme dove l'opinione pubblica interna la richiede: il riconoscimento della Palestina (21 set 2025).
- hash: 866c9ed4
  it: |
    L'intelligence resa pubblica come politica: l'attribuzione pubblica da parte dell'ASIO (26 ago 2025) di due attacchi antisemiti all'Iran ha preceduto l'espulsione dell'ambasciatore e una nuova legge per inserire l'IRGC in elenco; la stessa abitudine alla divulgazione ha caratterizzato la risposta al rapporto su Biak (Marles che cita pubblicamente la smentita del suo omologo indonesiano) e l'esercitazione a fuoco vivo nel Tasman (una protesta formale dopo un iniziale 'complied with international law').
- hash: 4dd32faa
  it: |
    Il sottomarino come scommessa strategica: SSN-AUKUS con il Regno Unito (Geelong Treaty, 50 anni, Submarine Rotational Force-West dal 2027) e almeno tre sottomarini classe Virginia dal 2032; gli equipaggi dell'ADF si addestrano già a bordo di battelli statunitensi (tre membri del personale erano a bordo del sottomarino che ha affondato la fregata iraniana Dena, marzo 2026). Flotta di superficie e terrestre acquistata dagli alleati: fregate Mogami (Giappone), veicoli Redback (Corea), oltre ai carri armati Abrams donati all'Ucraina.
- hash: 1d9f0016
  it: |
    Presenza ed esercitazioni nell'estero vicino: Exercise Alon con le Filippine (circa 3,600 militari, agosto 2025), i campi di addestramento di Singapore nel Queensland, pattugliatori classe Guardian e agenti dell'Australian Federal Police all'interno della polizia di Fiji, consiglieri di polizia e difesa in tutte le isole.
- hash: '86121975'
  it: |
    La finanza come arte di governo: il quadro sui minerali critici (almeno US$1bn di cofinanziamento da EXIM, DFC ed Export Finance Australia in sei mesi verso un portafoglio di progetti da US$8.5bn), fondi di bilancio e di polizia nei trattati con le isole (Nauru A$100m + A$40m; Vanuatu circa A$500m in dieci anni; un pacchetto di polizia da A$190m per le Salomone; circa A$500m per Fiji per il 2025-29) e una quota del 10% delle entrate di Greater Sunrise offerta a Timor-Leste.
- hash: f732cb69
  it: |
    Accesso al mercato e mobilità della manodopera come metà morbida dei trattati con le isole e della cerchia regionale: un percorso per un massimo di 280 tuvaluani l'anno, 10,000 lavoratori timoresi entro il 2027-28, un accordo con l'UE (24 mar 2026), un'agenda con l'India per il 2026 e le esportazioni di risorse (carbone verso il Vietnam: 44% delle sue importazioni nel 2024).
- hash: 2240256b
  it: |
    Tempo e numeri: i sottomarini classe Virginia arrivano dal 2032 e la flotta SSN-AUKUS negli anni Quaranta, quindi l'Australia è esposta negli anni Trenta a un vuoto che solo una forza rotazionale alleata può colmare; il programma Virginia è in ritardo e fuori budget (una stima del Congresso del 2024: due anni di ritardo e US$17bn in più fino al 2030), e un fellow dell'ASPI ha detto che Canberra potrebbe non ricevere i sottomarini. La spesa per la difesa raggiunge il 3% del PIL solo nel 2033, e allora con il metodo contabile della NATO.
- hash: 593f5df6
  it: |
    Dipendenza commerciale: la Cina vale quasi un terzo del commercio totale, ed è per questo che l'esercitazione a fuoco vivo nel Tasman (49 voli deviati) ha provocato una protesta ma non una rottura, e perché l'avvertimento di Pechino sul porto di Darwin (gen 2026) è un costo reale. Le quote di minerale di ferro e di GNL indicate nel brief non sono state documentate con fonti in questo passaggio.
- hash: 4b62f551
  it: |
    Un garante imprevedibile: il dazio del 10% di aprile 2025, una revisione di cinque mesi del Pentagono sul programma di punta, la richiesta del 3.5% del PIL, una richiesta, secondo quanto riferito, di un impegno preventivo su Taiwan e un presidente che ha rimproverato l'ambasciatore stesso dell'Australia davanti alla stampa - a ciascuno è stata data risposta, nessuno è stato risolto.
- hash: 420a7143
  it: |
    Sovranità delle isole: Vanuatu ha respinto la prima bozza del suo accordo (nove mesi prima della firma del 29 giu 2026) e il testo finale sarebbe stato edulcorato; le Isole Salomone tengono il patto con la Cina del 2022 in revisione, non annullato; Pechino è il maggiore creditore esterno di Vanuatu; e il testo di Fiji, finalizzato a maggio 2026, ha lasciato aperta la questione se limiti il coinvolgimento cinese.
- hash: d73f5930
  it: |
    Un vicino prossimo che fa hedging: l'Indonesia ha firmato un trattato modesto, privo di clausola di pericolo comune, e ha respinto una richiesta russa di basi a Biak solo dopo che la notizia era uscita; la questione di Papua sta sotto la relazione. Gli accessi settentrionali dipendono da un partner che Canberra non controlla.
- hash: e6373872
  it: |
    Il fronte interno: una maggioranza laburista record (94 seggi su 150, maggio 2025) lascia margine d'azione, ma la risposta alle esercitazioni nel Tasman è stata attaccata come 'weak', l'attacco a Bondi Beach del 14 dic 2025 (15 morti) ha portato a una commissione reale sull'antisemitismo (prima udienza 24 feb 2026), e le linee su Israele e Iran sono oggetto di scontro nella stessa arena pubblica.
- hash: 5d2fb9de
  it: |
    Pagare la garanzia rende più difficile rifiutare il garante. Più l'Australia costruisce la propria difesa attorno a sottomarini di progettazione statunitense, all'addestramento statunitense e a un consenso detenuto dagli Stati Uniti (gli Abrams per l'Ucraina hanno atteso Washington), più viene trascinata nelle guerre del garante senza che il garante sia a sua volta vincolato: personale dell'ADF era a bordo del sottomarino statunitense che ha affondato la fregata iraniana Dena a marzo 2026, mentre Colby avrebbe chiesto a Canberra un impegno preventivo su Taiwan.
- hash: 2161c4df
  it: |
    La strada verso sottomarini sovrani passa per una sovranità prestata. SSN-AUKUS è la garanzia di indipendenza, ma finché non esiste l'Australia si affida alla Submarine Rotational Force-West (dal 2027) e a sottomarini acquistati da una marina statunitense il cui stesso programma Virginia è in ritardo e fuori budget; più si avvicina la scadenza, più Canberra dipende da quello stesso capitale la cui affidabilità è in questione.
- hash: 9e455423
  it: |
    I veti generano hedging. Ogni trattato con le isole assicura all'Australia voce in capitolo sugli accordi di sicurezza con terzi (Nauru, Tuvalu, Vanuatu, forse Fiji e le Salomone), ma il prezzo in sovranità spinge le isole a trattare: Vanuatu ha detto no prima e ha firmato un testo più morbido nove mesi dopo mentre trattava con la Cina un separato accordo economico; le Isole Salomone riesaminano il patto con la Cina invece di annullarlo. Più la rete è stretta, più c'è ragione di tenere una seconda porta.
- hash: 7f9cc58e
  it: |
    Il cliente finanzia la deterrenza rivolta contro di lui. Il commercio con la Cina, quasi un terzo di quello australiano, paga il potenziamento fino al 3% del PIL diretto contro la Cina, e l'impegno a riprendere Port Darwin (l'ambasciatore di Pechino ha avvertito a gennaio 2026 di misure a tutela del proprietario) mette a rischio il commercio ripristinato in cambio di una negazione simbolica di un punto d'appoggio.
- hash: cea4f32e
  it: |
    Una cifra sovrana modellata su quella americana. Canberra ha risposto al 3.5% di Hegseth dicendo che avrebbe deciso prima le capacità, e poi ha adottato il 3% entro il 2033 con il metodo NATO, che conta la spesa affine alla difesa: la forma della richiesta statunitense è soddisfatta, il contenuto no, e nessuno sa dire quale dei due Washington leggerà.
- hash: 6a7e4280
  it: |
    Corteggiare Giacarta rafforza il vicino che corteggia anche Mosca. Il Treaty on Common Security (febbraio 2026) è l'assicurazione per gli accessi settentrionali, eppure non ha una clausola di pericolo comune e una richiesta russa di basi a Biak ha suscitato allarme sufficiente ad aprile 2025 da entrare nella campagna elettorale; un'Indonesia più vicina non è un'Indonesia più prevedibile.
- hash: cbee9bd6
  it: |
    L'Australia è l'alleato che paga per un garante che potrebbe non venire, e l'ordine regionale che sta costruendo è l'assicurazione su quel premio. Tutto ciò che è accaduto dal 2023 si legge come un'unica mossa: vincolare gli Stati Uniti con sottomarini, minerali e uno statuto sopravvissuto a una revisione del Pentagono (AUKUS, approvato a dicembre 2025; il quadro firmato il 20 ott 2025), trasformando al contempo ogni vicino in un partner vincolato da trattato che esclude la Cina - Papua Nuova Guinea come alleato di difesa reciproca (2025), Fiji come quarto alleato (6 lug 2026), veti a Nauru e Tuvalu, nessuna base straniera a Vanuatu, un'offerta di trattato alle Isole Salomone, un trattato di sicurezza con l'Indonesia. Il governo Albanese ha mano libera per farlo: rieletto a maggio 2025 con 94 seggi su 150, ha di fronte un'opposizione che lo attacca per debolezza verso la Cina e non per la direzione. Lo schema luttwakiano sta nello scarto tra le due metà. La garanzia è comprata al prezzo del coinvolgimento (un equipaggio australiano a bordo del sottomarino che ha affondato la Dena) ed è ancora condizionata (chiesto il 3.5%, secondo quanto riferito richiesto un impegno preventivo su Taiwan, un dazio del 10% ad aprile 2025, una revisione di cinque mesi del programma di punta), mentre l'assicurazione è costruita comprando sovranità dalle stesse isole che dovrebbe proteggere, le quali rispondono trattando. Due segnali che non sono righe: la prima risposta di Albanese alle esercitazioni nel Tasman è stata sottolineare che la Cina aveva rispettato il diritto internazionale, e la riunione del Quad a Nuova Delhi del maggio 2026 ha parlato di pedaggi nello Stretto di Hormuz e nel Mar Rosso, il che rimanda alla guerra con l'Iran più che allo Stretto di Taiwan. La domanda per il 2027 è se la cerchia di trattati e il calendario dei sottomarini reggano abbastanza a lungo da sopravvivere agli umori del garante; la prima prova di stress è il trattato con le Isole Salomone, che un ministro delle Isole Salomone ha prospettato per fine 2026.
- hash: d5ed9ea8
  it: |
    Mantenere la neutralità permanente come definizione operativa di sicurezza nazionale comprando protezione all'interno dell'UE: niente NATO, nessun trattato di mutua assistenza, nessuna base straniera, ma difesa aerea acquistata congiuntamente con la Germania (European Sky Shield Initiative, un memorandum non vincolante), un bilancio della difesa in crescita verso il 2% del PIL entro il 2032 e un Bundesheer ricostruito con il piano 'Aufbauplan 2032+'. La coalizione Stocker (ÖVP, SPÖ, NEOS, insediata a marzo 2025) ha mantenuto l'Austria nello Sky Shield dopo che il primo posto dell'FPÖ nel 2024 l'aveva messo in dubbio.
- hash: 58b8e4ae
  it: |
    Ridurre la dipendenza dall'energia russa e tenere i soldi in banca: il gas via gasdotto dalla Russia si è fermato a gennaio 2025 dopo che OMV ha chiuso il suo contratto con Gazprom (interruzione il 16 nov 2024, risoluzione l'11 dic 2024), le forniture sono state reindirizzate attraverso Germania e Italia e gli stoccaggi sono pieni; il dossier aperto è Raiffeisen Bank International, che gestisce ancora una banca russa sotto una richiesta di chiusura graduale da parte della BCE e ha subito una condanna russa da EUR 2bn, e che il 23 lug 2026 ha annunciato in Austria una pretesa di EUR 3.15bn contro Rasperia (la società di Deripaska che detiene una quota congelata di Strabag).
- hash: 820fcfa7
  it: |
    Guidare l'allargamento dell'UE ai Balcani occidentali, pilastro dichiarato della politica estera austriaca, nella forma della 'gradual integration' (accesso al mercato unico settore per settore, condizioni uguali per tutti) con Montenegro e Albania come capofila; Stocker ha partecipato al vertice UE-Balcani occidentali di Tivat a giugno 2026, dopo visite di Stato a Podgorica e Belgrado ad agosto 2025. L'Austria è il terzo investitore in Serbia e contribuisce ancora a EUFOR Althea.
- hash: 27e8264e
  it: |
    Ridurre l'afflusso migratorio e il suo costo: controlli alle frontiere mantenuti dal 2015 (Stocker a Merz: Schengen non offre ancora 'robust external border protection'), ricongiungimenti familiari sospesi da marzo 2025 in base alla clausola di emergenza dell'UE, espulsioni di siriani e un accordo su Schengen in cui l'Austria ha tolto il veto a Romania e Bulgaria (12 dic 2024) dopo il calo delle intercettazioni.
- hash: d43b6e8b
  it: |
    Tenere la linea sul bilancio: come contribuente netto l'Austria chiede un bilancio UE 2028-2034 di circa l'1% del reddito nazionale lordo, nessun aumento del personale della Commissione e uno sconto esteso, insieme a Germania, Paesi Bassi, Danimarca, Finlandia e Svezia, mentre il governo perde nei sondaggi contro l'FPÖ (34-36% negli ultimi rilevamenti contro 21-23% dell'ÖVP).
- hash: 20bcab4e
  it: |
    Mantenere in marcia la macchina commerciale nella tempesta dei dazi: la Germania assorbe circa il 30% delle esportazioni e gli Stati Uniti sono il secondo mercato (EUR 12.9bn); il ministro dell'Economia chiede all'UE di revocare i dazi statunitensi sull'acciaio, di mantenere i diritti di sospensione sul quadro di Turnberry del 2025 e di non subire 'blackmail' sull'aumento minacciato dei dazi USA sulle auto dal 15% al 25% (maggio 2026), cercando al contempo condizioni eque per 650 imprese austriache in Cina.
- hash: c2300bfb
  it: |
    Diplomazia della sede: Vienna ospita l'OSCE, l'AIEA, l'OPEC e una sede dell'ONU (UNOV), quasi 50 organizzazioni internazionali in tutto; la Svizzera presiede l'OSCE nel 2026 ma il segretariato si trova su suolo austriaco. La neutralità è venduta come licenza di ospitare e mediare, e il dossier dei Balcani occidentali dà al ministero degli Esteri un'agenda regionale all'interno dell'UE.
- hash: b2cff073
  it: |
    Formati di vicinato che danno a un piccolo Stato una voce più grande: il formato Slavkov/Austerlitz con Cechia e Slovacchia (il primo vertice di Stocker in questo formato è stato a Bratislava, il 10 feb 2026, su prezzi dell'energia e competitività), il trilaterale con l'Ungheria sulla migrazione, le riunioni di governo congiunte (una sessione di governo con l'Ungheria a Gödöllő prevista per settembre 2026) e la lettera 'frugal' sul bilancio UE.
- hash: 344c27cd
  it: |
    L'Austria risponde alle operazioni di influenza della Russia con tribunali ed espulsioni più che con la retorica: l'ex funzionario del BVT Egisto Ott è stato condannato a Vienna a maggio 2026 per spionaggio e abuso d'ufficio (quattro anni e un mese) per aver passato dati alla rete russa di Jan Marsalek, e il 4 mag 2026 tre diplomatici russi sono stati espulsi per una 'antenna forest' sui tetti dell'ambasciata, 14 dal 2020.
- hash: 2df9e366
  it: |
    Un Bundesheer costruito per la difesa territoriale e il sostegno alla pace, non per la guerra all'estero: circa 290 soldati in EUFOR Althea in Bosnia (generali austriaci hanno comandato la missione da dicembre 2009 a gennaio 2024), un bilancio della difesa di circa EUR 5.2-5.3bn nel 2027 (Tanner: il più grande di sempre; il ministro delle Finanze Marterbauer: circa l'1.2% del PIL, non il 2% entro il 2032), difesa aerea acquistata congiuntamente con la Germania.
- hash: e6979a04
  it: |
    Il denaro come soft power: EUR 3bn conteggiati come sostegno all'Ucraina dal 2022 (EUR 294m bilaterali, umanitari e per la ricostruzione, nessuna arma), investimenti diretti nei Balcani occidentali (terzo investitore in Serbia), bilanci bancari in Europa centrale e orientale (Raiffeisen soprattutto) e capacità di stoccaggio del gas al servizio dell'Europa centrale (82.8 TWh iniettati all'8 set 2025).
- hash: 230bbc5e
  it: |
    La neutralità è costituzionale e popolare: la legge del 1955 vieta l'adesione a un'alleanza militare, la partecipazione a guerre e le basi straniere; il 74-75% degli austriaci preferisce la neutralità alla NATO (Gallup marzo 2024, sondaggio del ministero della Difesa 2025) e solo il 14% vuole la NATO, per cui nessun governo può toccarla, anche se tre quarti ritengono il Paese mal preparato a difendersi.
- hash: 5f10151f
  it: |
    Una coalizione a tre partiti stretta dall'FPÖ: ÖVP, SPÖ e NEOS governano dopo che il partito di Kickl ha vinto nel 2024 e i negoziati con esso sono falliti; l'FPÖ è ora al 34-36% nei sondaggi contro il 21-23% dell'ÖVP, si oppone alle sanzioni alla Russia e agli aiuti all'Ucraina in nome della neutralità (Kickl ha definito la visita di Zelensky a Vienna del giugno 2025 'neutrality-eroding'), e i tre partner non concordano sul denaro per la difesa.
- hash: 95fc2c1b
  it: |
    La Germania è il mercato e la catena di fornitura: circa il 30% delle esportazioni di beni (EUR 56.2bn nel 2025) va in Germania, che assorbe anche gran parte della produzione di componenti auto che lì viene rifinita e riesportata negli Stati Uniti, per cui un rallentamento tedesco o un dazio statunitense sulle auto colpisce l'Austria due volte. La bilancia commerciale con la Cina è il deficit più ampio (EUR 12.6bn nel 2025).
- hash: 88491c5a
  it: |
    Finanze pubbliche: Agenda Austria prevede un fabbisogno di finanziamento in crescita dal 15.3% del PIL nel 2026 a circa il 21.3% nel 2036; il bilancio lascia poco all'esercito, al conto UE o all'Ucraina ed è il motivo della linea dura di Vienna sul bilancio UE.
- hash: b98a1e6a
  it: |
    Geografia alpina e un problema del Brennero: le autostrade dell'Inntal e del Brennero portano il commercio dell'Italia con l'Europa settentrionale e i divieti per i camion del Tirolo sono sotto attacco alla Corte di giustizia dell'UE (Italy v Austria, C-524/24; le conclusioni dell'Avvocato generale del 16 lug 2026 giudicano tre misure su quattro contrarie alla libera circolazione delle merci). Roma rifiuta il sistema di slot transfrontaliero che Vienna vuole.
- hash: 1d168522
  it: |
    Esposizione bancaria che non può sciogliere: Raiffeisen Bank Russia ha ridotto i prestiti da EUR 13.7bn a EUR 4.5bn, ma la sua vendita richiede l'approvazione dello Stato russo, un tribunale russo ha congelato il 100% delle sue azioni a gennaio 2025 e la BCE ha chiesto un taglio del 65% del suo portafoglio prestiti; Vienna ha fallito due volte nei negoziati sulle sanzioni UE nel tentativo di sbloccare, come compensazione, la quota Strabag congelata di Rasperia, così lo Stato non può scegliere tra la pressione su Mosca e gli interessi delle sue maggiori banche.
- hash: baf2543a
  it: |
    La neutralità non compra sicurezza e costa un seggio. L'Austria non può aderire alla NATO né ad alcun patto di difesa reciproca, ma rientra nella clausola dell'articolo 42(7) dell'UE e acquista il suo scudo aereo da un club a guida tedesca; dipende quindi dall'alleanza a cui non aderirà per la protezione di cui ha bisogno, mentre il partito che promette di proteggere la neutralità (FPÖ) la toglierebbe dallo Sky Shield e renderebbe così il Bundesheer sia più debole sia più costoso (stimati EUR 100m in più per l'uscita).
- hash: 54081eb1
  it: |
    La rottura sul gas è stata vinta con la causa della stessa OMV, e ha funzionato perché la vecchia dipendenza era già stata sostituita. OMV ha compensato il suo lodo ICC da EUR 230m con le fatture di Gazprom, aspettandosi l'interruzione, e Gazprom ha fermato le consegne il 16 nov 2024; ma lo Stato che per decenni si è affidato al contratto Gazprom ha dovuto ricostruire un sistema del gas attraverso Germania e Italia, e le sue banche guadagnano ancora in Russia, per cui la rottura energetica con Mosca è completa mentre quella finanziaria no.
- hash: 4810422e
  it: |
    Il veto su Schengen che Vienna usava come leva ha finito per sbloccare i Paesi che voleva disciplinare. L'Austria ha tenuto Romania e Bulgaria fuori da Schengen per due anni in nome del controllo migratorio, ha lasciato cadere il veto il 12 dic 2024 dopo che Karner ha mostrato intercettazioni in calo da 70,000 a 4,000, e mantiene ancora i propri controlli alle frontiere interne, in vigore dal 2015, sostenendo che Schengen non protegge ancora la frontiera esterna; la leva ha funzionato, ma ora Vienna mantiene i controlli che aveva detto che il veto avrebbe reso superflui.
- hash: 539966f4
  it: |
    Spingere i Balcani verso l'UE insistendo sulle condizioni più severe dell'UE. L'Austria patrocina Montenegro, Albania e Serbia e vuole una 'gradual integration', ma chiede gli stessi criteri per tutti, limita a circa l'1% del RNL il bilancio UE necessario a pagare l'allargamento e, bloccando Schengen per due anni, ha mostrato ai candidati che l'adesione può essere tenuta in ostaggio dalla migrazione; l'irritazione di Belgrado per le domande alla stampa di Stocker ad agosto 2025 mostra i limiti della leva.
- hash: 765ca708
  it: |
    Combattere i camion del Brennero a Lussemburgo significa combattere i propri guadagni del mercato unico. I divieti ai camion del Tirolo tutelano la salute e la qualità dell'aria, ma l'Italia ha fatto causa nel 2024 e la Commissione ha preso le parti di Roma; le conclusioni dell'Avvocato generale di luglio 2026 suggeriscono che la maggior parte dei divieti cada, per cui lo Stato membro che guida la spinta 'frugal' per un'UE più rigorosa deve difendere la propria politica di transito contro la Corte dell'UE stessa e contro il vicino di cui ha bisogno per il Brenner Base Tunnel e per il sistema di slot.
- hash: eb46f7de
  it: |
    La presenza bancaria dell'Austria in Russia le ha impedito di usare le sanzioni contro la Russia come strumento: lo Stato sostiene ogni pacchetto UE, ma la sua maggiore banca con esposizione estera sta facendo causa presso i tribunali austriaci per ottenere un risarcimento da una società russa sotto sanzioni.
- hash: '49903031'
  it: |
    L'Austria è uno Stato commerciale di medie dimensioni che ha fatto una politica di sicurezza del non averne una, e le due cose che reggevano quel patto - il gas russo a basso costo e un cuscinetto post-1989 di vicini amici - non ci sono più. Il gas è sparito per scelta della stessa azienda e con l'aiuto del mercato (dicembre 2024); il cuscinetto si sta ricostruendo attraverso il formato Slavkov, il reset Magyar in Ungheria, il dossier dell'allargamento ai Balcani e una Germania che ora concorda con Vienna sui confini. La neutralità resta intoccabile con il 75% di sostegno pubblico, per cui il governo Stocker, stretto da un FPÖ al 34-36%, fa ciò che faceva l'Austria della Guerra fredda: si muove con l'Occidente in tutto tranne che nel vocabolario (sanzioni UE sì, armi no; Sky Shield sì, NATO no; un obiettivo di difesa al 2% sulla carta e circa l'1.2% in bilancio). La vera esposizione strategica è economica, non militare: la Germania per il mercato, gli Stati Uniti per il secondo sbocco, la Cina per il deficit e il Brennero per i camion. Il dossier sulla Russia mostra meglio il paradosso: i casi di spionaggio (Ott, le antenne sulle ambasciate) vanno in tribunale e i diplomatici vengono espulsi, ma la banca russa di Raiffeisen e la sua pretesa da EUR 3.15bn tengono un piede austriaco a Mosca. Per l'atlante, l'Austria è un partner di quasi tutti e un alleato di pochi per trattato, e il suo grado verso ciascuno segue la struttura (appartenenza all'UE, commercio, geografia), non la dichiarazione di neutralità.
- hash: fedd23c0
  it: |
    Trasformare la vittoria militare del 2023 in Karabakh in un assetto alle condizioni di Baku: un trattato di pace che l'Armenia può firmare solo dopo aver riscritto il preambolo costituzionale che rimanda all'atto di unificazione del 1989, ritiro reciproco delle azioni legali internazionali, nessun osservatore di terzi sul confine e un collegamento terrestre con il Nakhchivan (la Trump Route, TRIPP). Aliyev dice che firmerebbe 'the very next day' una volta emendata la costituzione.
- hash: 5148cc9b
  it: |
    Mantenere incontestato il potere della famiglia Aliyev: un'elezione di inizio 2024 vinta con circa il 92% in quello che l'ODIHR ha definito un ambiente restrittivo e non competitivo, e un vasto procedimento giudiziario contro i media indipendenti (più di due dozzine di giornalisti incarcerati nel 2026, condanne fino a 15 anni). Il controllo interno viene prima di ogni scelta di politica estera.
- hash: 5cae547d
  it: |
    Mantenere il flusso delle rendite da idrocarburi mentre la produzione cala: gas verso l'Europa attraverso il Southern Gas Corridor (25.2 bcm esportati nel 2025, più della metà verso l'UE), un fondo sovrano di circa USD 73bn e un graduale spostamento verso il transito, le rinnovabili e l'economia 'non-oil'. La produzione di petrolio è calata del 4.8% nel 2025 e la crescita è dell'1.2-2.2% nel 2026.
- hash: 9f81a4fe
  it: |
    Autonomia strategica senza patrono: la Turchia come alleato di trattato, Israele e Pakistan come partner per armi e petrolio, gli Stati Uniti come nuovo partner della charter, l'UE come cliente, Cina e Asia centrale come mercati, la Russia come vicino da gestire. Dopo il 2023 l'obiettivo è che nessuna capitale possa dettare le scelte di Baku.
- hash: c083bd49
  it: |
    Diventare l'hub del transito est-ovest eurasiatico: il Middle Corridor (3 milioni di tonnellate in gennaio-agosto 2026, +22%), il collegamento TRIPP attraverso il Syunik fino al Nakhchivan e alla Turchia, un ruolo tra Caspio e Mar Nero con la Georgia e un seggio pieno nel formato dei leader dell'Asia centrale ('Central Asia and Azerbaijan') dal novembre 2025.
- hash: 727c2b98
  it: |
    Mantenere un netto vantaggio militare sull'Armenia e la capacità di dissuadere Iran e Russia: un bilancio per difesa e sicurezza di circa AZN 8.7bn nel 2026 (circa il 21% del bilancio statale), sistemi turchi e israeliani e un grosso ordine di JF-17 dal Pakistan.
- hash: c9e49c40
  it: |
    Diplomazia da hub con ogni campo contemporaneamente: seggio fondatore nel Board of Peace di Trump (22 gen 2026), la Charter on Strategic Partnership con Washington (10 feb 2026), l'alleanza di Shusha con Ankara, un seggio pieno nel formato dell'Asia centrale, sede della COP29 (2024) e la Baku Energy Week come vetrina. Contropressione contro i critici occidentali: il Milli Majlis ha sospeso ogni cooperazione con il Parlamento europeo a maggio 2026 dopo la sua risoluzione sull'Armenia.
- hash: 63eff065
  it: |
    Narrazione controllata dallo Stato: il termine 'Western Azerbaijan' per la repubblica armena (un dipartimento universitario sul suo 'economic potential'), il Baku Initiative Group contro il 'French colonialism' (fondato a luglio 2023), la smentita che il territorio azero sia usato contro l'Iran e la chiusura o il perseguimento di media indipendenti o legati all'estero (Abzas, Meydan TV, Toplum TV; Sputnik Azerbaijan perquisita a giugno 2025).
- hash: a1bf1b87
  it: |
    Coercizione dimostrata e arsenale in crescita: l'offensiva di 24 ore del 19-20 set 2023 ha posto fine allo Stato de facto del Karabakh, le forze di pace russe se ne sono andate il 12 giu 2024, esercitazioni congiunte con la Turchia (Unwavering Brotherhood, marzo-aprile 2026), droni israeliani e munizioni circuitanti (Israele ha fornito circa il 69% delle importazioni di armi nel 2016-2021), sistemi turchi e jet JF-17 (fino a 40 ordinati, consegne iniziate nel 2024).
- hash: ff7e143c
  it: |
    Energia e transito come leva: gas del Southern Gas Corridor verso 14 Paesi (l'Italia in testa; Bulgaria, Grecia, Serbia, Germania da gennaio 2026), principale fornitore di greggio di Israele attraverso l'oleodotto BTC, un fondo sovrano che ha finanziato 6.4bn di manat del bilancio nel primo semestre 2026 e il potere di aprire o chiudere il transito verso l'Armenia (tutte le restrizioni revocate il 21 ott 2025; esportazioni di carburante verso l'Armenia dal 2025).
- hash: f38868fa
  it: |
    La curva delle risorse: la produzione di petrolio è in declino strutturale (-4.8% nel 2025), il Southern Gas Corridor ha consegnato circa 12.8 bcm all'UE nel 2025 contro i 20 bcm che il memorandum del 2022 'aspired' a raggiungere entro il 2027, non esiste una decisione finale di investimento su un ampliamento e la capacità TAP aggiuntiva di gennaio 2026 è già assegnata ad acquirenti italiani. La Banca mondiale (ottobre 2026) stima la crescita 2026 all'1.2%.
- hash: 1087ddbd
  it: |
    Geografia tra due giganti: l'Iran a sud (gli azeri sono la maggiore minoranza dell'Iran, Tabriz è stata colpita da attacchi israeliani, droni hanno colpito il Nakhchivan il 5 mar 2026 e i media dell'IRGC hanno definito l'oleodotto BTC un obiettivo) e la Russia a nord. Baku non ha un confine terrestre amico a sud e deve tenere il proprio territorio fuori da qualsiasi operazione israelo-iraniana per mettere al sicuro l'oleodotto e il Nakhchivan.
- hash: 6ee89ac9
  it: |
    La pace non è nelle mani di Baku: la precondizione costituzionale deve passare un referendum armeno, e Civil Contract ha vinto 64 seggi su 105 il 7 giu 2026, meno dei 70 che voleva per una maggioranza costituzionale; il referendum è atteso nel 2027 al più presto. Baku può fissare il ritmo del transito e della pressione ma non può votare in Armenia.
- hash: 6694dba2
  it: |
    Dipendenza da partner che sono anche rivali tra loro: l'alleanza con la Turchia e il commercio di armi e petrolio con Israele tirano in direzioni diverse mentre Ankara e Tel Aviv si allontanano, e la charter statunitense convive con una restrizione della Section 907 che viene derogata anziché abrogata (deroga rinnovata nel 2025, abrogazione ancora nell'agenda di Baku a luglio 2026).
- hash: 8a70351f
  it: |
    Reputazione presso i clienti paganti: il Parlamento europeo ha approvato la sua quattordicesima risoluzione critica dal 2021, la PACE rifiuta dal 2024 le credenziali della delegazione, e una concessione del Consiglio d'Europa o dell'UE sui diritti umani costerebbe al regime in patria, per cui Baku tiene aperto il canale esecutivo (gas, Partnership Priorities 2026-2030) e chiuso quello parlamentare.
- hash: 95cfa20b
  it: |
    La Russia non ha più basi in Azerbaigian (il radar di Gabala, poi le forze di pace del Karabakh, partite il 12 giu 2024), ma mantiene leva attraverso commercio, manodopera, corridoi di transito, una diaspora azera e la rotta Nord-Sud; Baku ha chiuso il caso AZAL ad aprile 2026 senza la punizione dei responsabili.
- hash: 41b934eb
  it: |
    Una vittoria che non si può incassare. Vincere il Karabakh con la forza nel 2023 ha dato a Baku tutto ciò per cui aveva combattuto tranne ciò di cui ora ha bisogno, il cambiamento costituzionale armeno. Continuare a usare 'Western Azerbaijan', demolire chiese armene in Karabakh e condannare gli ex leader del Karabakh (Vardanyan 20 anni, febbraio 2026) consegna agli oppositori di Pashinyan gli argomenti contro un referendum, e il mancato raggiungimento da parte di Pashinyan di una maggioranza di 70 seggi il 7 giu 2026 lascia la firma nelle mani degli elettori armeni.
- hash: ff22584c
  it: |
    Il corridoio che Baku ha chiesto per trent'anni passa ora sotto il controllo di una società americana. TRIPP dà all'Azerbaigian il collegamento con il Nakhchivan attraverso il Syunik, ma con diritti di sviluppo esclusivi di lungo periodo in territorio armeno detenuti da una società controllata dagli Stati Uniti, per cui il passaggio è aperto perché Washington lo sostiene, non perché Baku lo controlla, e l'Iran lo legge come un punto d'appoggio americano sul suo confine settentrionale.
- hash: 6c91eccb
  it: |
    La partnership con Israele che ha potenziato l'esercito ha messo in pericolo anche l'oleodotto. I droni israeliani e le vendite di petrolio (l'Azerbaigian fornisce più della metà del greggio di Israele) sono la base della relazione, ma hanno reso Baku oggetto del sospetto di Teheran: l'attacco con droni al Nakhchivan del 5 mar 2026, i complotti sventati legati all'IRGC contro l'oleodotto BTC e l'ambasciata israeliana, e il ritiro dei diplomatici azeri da Teheran e Tabriz. Baku ha poi riparato le relazioni con l'Iran (incontro di Bishkek il 31 ago 2026) e nega di ospitare forze israeliane.
- hash: 22fcfdb8
  it: |
    La diplomazia del gas supera il gas. L'Azerbaigian si presenta come la risposta all'uscita dell'Europa dal gas russo, con Serbia, Bulgaria, Italia e ora Germania come clienti e la COP29 come palcoscenico, mentre la sua produzione ristagna; ogni nuovo acquirente (la Serbia ha chiesto fino a 0.9-1.4 bcm l'anno) compete per volumi già contrattualizzati, e l'obiettivo di 20 bcm del 2022 è diventato una promessa politica anziché una capacità.
- hash: 10b73e75
  it: |
    La repressione finanzia la stabilità che l'Europa paga. L'incarcerazione dei giornalisti protegge il regime e la narrazione sul Karabakh, ma è il motivo per cui il Parlamento europeo e la PACE sono chiusi a Baku, così l'Azerbaigian deve comprare la propria posizione europea solo attraverso il canale esecutivo (Kallas a maggio, von der Leyen il 1 lug 2026) e accettare un dossier sui diritti umani che Bruxelles scambia con il gas.
- hash: 8cc1ef98
  it: |
    Umiliare Mosca per poi accordarsi con essa. Baku ha trasformato l'abbattimento dell'AZAL (25 dic 2024), i morti di Ekaterinburg (27 giu 2025) e le perquisizioni a Sputnik in una campagna per responsabilità e punizione, ha ottenuto un riconoscimento a Dušanbe (9 ott 2025) e un risarcimento ad aprile 2026, ma ha lasciato cadere la richiesta di punire i responsabili e ha ripristinato rapporti di lavoro, perché una Russia senza basi in Azerbaigian controlla comunque il confine settentrionale, la rotta del grano dell'Armenia e la diaspora.
- hash: 73c6daf1
  it: |
    Una lite con la Francia che ha contribuito a costruire il campo che combatteva. Il Baku Initiative Group e la presunta campagna in Nuova Caledonia (2023-24) hanno punito Parigi per aver armato l'Armenia, ma la Francia è rimasta il principale fornitore occidentale di armi dell'Armenia e la disputa ha suggellato la posizione critica dell'UE fino a un disgelo iniziato nel 2026 (telefonata Aliyev-Macron a maggio, Bayramov-Barrot a settembre).
- hash: 7cdd0e38
  it: |
    La strategia dell'Azerbaigian è quella di uno Stato che ha vinto la propria guerra centrale e ora sta convertendo una posizione di forza in un ordine durevole senza un patrono. La riconquista del Karabakh nel 2023 e l'esodo di circa 100,000 armeni hanno chiuso la questione territoriale sul terreno; resta da rendere legale l'assetto (la costituzione armena, il trattato, TRIPP) e da mantenere le rendite che lo pagano mentre il petrolio declina. Il metodo è il bilanciamento multivettoriale: un'alleanza di trattato con la Turchia, armi e petrolio con Israele, jet dal Pakistan, una charter con Washington, gas all'Europa, transito con Cina e Asia centrale e una tregua gestita con la Russia dopo la crisi AZAL. Lo schema di Luttwak si vede in ciascuno: ogni successo attira la contropressione che lo limita. Il legame con Israele ha portato i droni iraniani, il corridoio americano mette Washington sul confine dell'Azerbaigian con l'Armenia, l'argomento vinto contro Mosca è finito in un accordo senza punizione e un regime che incarcera giornalisti sta scambiando il Parlamento europeo con la Commissione europea. Due segnali che non sono righe: Aliyev ha saltato la parata del Giorno della Vittoria a Mosca nel maggio 2025, e nel 2026 i contatti con la Russia a noi riferiti passano per un vice primo ministro e per ministri degli Esteri, senza che sia stato trovato alcun incontro tra capi di Stato; e la pace è ancora un testo siglato ma non firmato mentre carburante azero e grano russo attraversano già la vecchia linea del fronte. La prova del prossimo anno è se Baku lascia che l'Armenia arrivi al referendum alle proprie condizioni o continua ad alzare il prezzo della firma.
- hash: 1dc57f3c
  it: |
    Mantenere il CNDD-FDD al potere sotto il presidente Ndayishimiye. Un referendum costituzionale del 2018 ha consentito a Nkurunziza di restare in carica fino al 2034 (New York Times, 2018), e il partito di governo ha vinto le elezioni presidenziali del 2020 (Reuters, 2020). L'obiettivo è la nostra lettura di quei fatti (C); il voto legislativo del 2025 non è ancora supportato da fonti in questa scheda.
- hash: 91e467b1
  it: |
    Tenere la linea dell'esercito congolese nel Sud Kivu contro l'M23. Il Burundi ha schierato migliaia di soldati a sostegno dell'esercito congolese (Reuters, gennaio 2025), e quando l'M23 ha conquistato Uvira il 10 dicembre 2025 decine di migliaia di congolesi hanno attraversato il confine verso il Burundi (Al Jazeera, dicembre 2025). L'obiettivo è una nostra inferenza dallo schieramento.
- hash: 2d8de518
  it: |
    Impedire al Ruanda di sostenere un'opposizione armata contro Bujumbura. Il Burundi ha accusato il Ruanda di aver sostenuto il tentativo di colpo di Stato del 2015 (Reuters, gennaio 2025), e Al Jazeera riferisce che il Ruanda è descritto come sostenitore dell'offensiva dell'M23, cosa che il Ruanda nega (dicembre 2025). L'obiettivo è inferito (C).
- hash: 5b58facd
  it: |
    Migliaia di soldati nel Sud Kivu accanto all'esercito congolese (Reuters, gennaio 2025), e contributi di truppe alla missione dell'Unione africana in Somalia, che il presidente somalo ha riconosciuto a febbraio 2019 (presidenza del Burundi, una dichiarazione tier-1). Il valore in termini di entrate del contributo somalo non è documentato qui.
- hash: bed7c8db
  it: |
    Poca leva economica. Il PIL era di circa USD 6.75bn nel 2025, circa USD 489 pro capite (FMI, aprile 2025). Il sostegno esterno è esile: la cooperazione belga documentata da fonti è di EUR 75m per il 2024-28 (Belga, 2023; North Africa Post, 2023).
- hash: 446b636e
  it: |
    Un'economia piccola e agricola: circa USD 6.75bn di PIL e circa USD 489 pro capite (FMI, aprile 2025), con l'agricoltura a circa metà del PIL (EEAS, dato 2017; la pagina non è datata).
- hash: 7690b8ee
  it: |
    La guerra del Congo arriva al confine: decine di migliaia di congolesi hanno attraversato il confine verso il Burundi dopo che l'M23 ha conquistato Uvira il 10 dicembre 2025, e l'UNHCR ha dichiarato il 19 dicembre che il Burundi aveva raggiunto un 'critical point' (Al Jazeera, dicembre 2025).
- hash: e54580d0
  it: |
    Combattere l'M23 mette il Burundi dal lato opposto ai ribelli sostenuti dal Ruanda, per cui la guerra del Congo diventa la rivalità con il Ruanda; e gli stessi combattimenti mandano rifugiati oltre il confine burundese (Al Jazeera, dicembre 2025).
- hash: 9d9dceb7
  it: |
    La grand strategy del Burundi è mantenere il CNDD-FDD al potere, cosa che il referendum del 2018 e le elezioni del 2020 hanno assicurato nel lungo periodo, e tenere la guerra del Congo fuori dal proprio suolo combattendo accanto a Kinshasa. Questo allineamento mette Bujumbura contro la parte che, secondo le descrizioni, è sostenuta da Kigali, per cui la rivalità con il Ruanda passa ora anche attraverso la guerra dell'M23, oltre che attraverso l'accusa sul colpo di Stato del 2015. Il punto debole è l'economia, uno Stato agricolo da circa USD 6.75bn che ospita i rifugiati che la guerra spinge oltre il confine; le elezioni legislative del 2025, la chiusura della frontiera con il Ruanda e il quadro delle sanzioni non sono ancora verificati qui.
- hash: 7803add2
  it: |
    Restare dentro l'ordine di sicurezza occidentale riarmandosi dal fondo della classifica NATO: la Strategic Vision 2025 (approvata il 18 lug 2025) fissa il bilancio al 2% del PIL nel 2025 (EUR 12.8bn, dall'1.29% del 2024), in crescita a EUR 21.3bn nel 2034, 11 F-35 in più (45 in tutto), la difesa aerea NASAMS e una terza fregata. A luglio 2026 Francken si è impegnato a mantenere il 2% fino al 2029 e a tracciare una tabella di marcia verso l'obiettivo NATO del 3.5% per le capacità di base, che definisce 'particularly difficult' nell'attuale clima di bilancio; il governo conta anche la spesa per la 'resilience' (ferrovie, cyber) per rivendicare un totale di circa il 3.4%.
- hash: 1c68679a
  it: |
    Non restare mai da solo a sostenere il rischio legale e finanziario degli attivi della banca centrale russa: circa EUR 185bn degli EUR 210bn immobilizzati nell'UE si trovano presso Euroclear a Bruxelles. De Wever ha bloccato il 'reparations loan' da EUR 140-210bn della Commissione in ott-dic 2025 finché il rischio non fosse condiviso da tutti gli Stati membri ed Euroclear non fosse protetto dall'obbligo di rimborsare Mosca. Il vertice del 18-19 dic 2025 ha scelto invece un prestito da EUR 90bn raccolto con indebitamento UE, e la questione degli attivi è rimasta aperta.
- hash: 572a9bd4
  it: |
    Mantenere l'Ucraina in combattimento e la Russia dissuasa a un prezzo che il Belgio può sostenere: un accordo bilaterale di sicurezza decennale (28 mag 2024), aiuti militari di almeno circa EUR 1bn l'anno annunciati da De Wever per la legislatura, F-16 (sette promessi per il 2026, tre dei quali destinati a volare), contributi PURL, EUR 6.6bn di contributi dai proventi straordinari di Euroclear trasferiti dal feb 2024, e un'offerta post-cessate il fuoco di capacità aeree, marittime e di addestramento alla Coalizione dei volenterosi (6 gen 2026) a condizione che la leadership statunitense la sostenga.
- hash: 8558777f
  it: |
    Difendere un'economia commerciale che vive di porti aperti e del mercato unico: Anversa-Bruges, Zeebrugge, l'hub aereo di Liegi, i prodotti farmaceutici (più della metà degli EUR 27bn di merci vendute agli Stati Uniti nel 2024). Il dazio statunitense del 15% ha già ridotto le esportazioni verso gli Stati Uniti del 12% in maggio-luglio 2025; De Wever chiede a Bruxelles una linea più ferma sulle pratiche commerciali cinesi mentre il Belgio mantiene i flussi logistici cinesi che transitano per i suoi porti.
- hash: 170ca6bd
  it: |
    Restare ascoltato nei Grandi Laghi, dove il Belgio è l'ex potenza coloniale e, tramite Bruxelles, la porta diplomatica verso l'Europa: difendere l'integrità territoriale della RDC, guidare la spinta dell'UE a sanzionare il Ruanda per l'M23 (azione che al Belgio è costata i rapporti con Kigali da marzo 2025 a settembre 2026) e rinnovare la cooperazione allo sviluppo con il Congo (circa EUR 50m l'anno, 2023-27) e il Burundi (EUR 75m, 2024-28).
