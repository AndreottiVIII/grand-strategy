items:
- hash: '50814464'
  it: |
    Fare in modo che Myanmar risponda in tribunale delle uccisioni dei Rohingya. Il caso The Gambia v. Myanmar, promosso in base alla Genocide Convention, è stato depositato nel novembre 2019; le udienze di merito si sono concluse nel gennaio 2026 e la sentenza è in attesa. È lo strumento che dà a uno Stato piccolo una voce all'estero.
- hash: d875f059
  it: |
    Mantenere la transizione sostenuta da Senegal nel gennaio 2017, quando truppe senegalesi sono entrate per sostenere il leader eletto Adama Barrow. L'obiettivo è uno Stato che non ricada nel periodo di Jammeh.
- hash: 8e2c8182
  it: |
    Diplomazia giuridica: il caso davanti alla ICJ contro Myanmar, portato avanti a The Hague in base alla Genocide Convention, come lo strumento più visibile di Gambia all'estero.
- hash: 35b485ce
  it: |
    Il riconoscimento come moneta di scambio: il passaggio da Taipei a Beijing il 17 marzo 2016, che ha inserito Gambia nel canale cinese.
- hash: 9e1931b0
  it: |
    Dipendenza da Senegal per la sicurezza: la transizione del 2017 si è basata sulle truppe senegalesi inviate a sostegno di Barrow. Gambia è circondata dal suo vicino più grande, e in questo passaggio non risulta documentato alcun garante alternativo per la sicurezza.
- hash: ac1a8ecf
  it: |
    L'ICJ può giudicare ma non può far eseguire le proprie decisioni. Il rappresentante di Myanmar ha definito le accuse prive di fondamento nelle udienze del gennaio 2026, quindi una sentenza contro Myanmar dipenderebbe da un'osservanza che Gambia non può imporre.
- hash: 8d3cab58
  it: |
    Chiede a Myanmar di rispondere delle uccisioni di massa davanti alla ICJ, mentre la sua sicurezza dal 2017 si fonda su truppe di uno Stato vicino. La sua voce più forte all'estero è una causa contro uno Stato, mentre le truppe che la garantiscono in patria provengono da un altro Stato.
- hash: 9fb1a96a
  it: |
    Gambia è piccola e dipendente: il suo assetto successivo al 2017 si regge su Senegal, e il suo strumento estero più noto è il caso ICJ contro Myanmar, che dà a uno Stato piccolo una voce a The Hague. La diplomazia precedente (il passaggio del 2016 da Taipei a Beijing e il ritorno nel Commonwealth nel 2017-2018) è documentata qui solo a livello dell'evento, non dei legami duraturi. Non verificati in questo passaggio e quindi non inclusi nella scheda: le elezioni presidenziali del 2026 e la questione del terzo mandato, la TRRC e l'eredità di Jammeh, gli accordi con l'EU e in materia di migrazione, Turkey e il Golfo, ECOWAS e la forza ECOMIG, e il traghetto e il ponte con Senegal.
- hash: 8cfdf467
  it: |
    Condurre una transizione guidata dai militari secondo una propria tempistica: un referendum il 30 agosto 2026 su una nuova costituzione che rafforza la presidenza (il parlamento passa da 102 a 65 seggi), poi elezioni presidenziali e legislative il 6 dicembre 2026. La carta della transizione esclude che il presidente e il primo ministro di transizione si candidino.
- hash: 8a3bcfd5
  it: |
    Respingere la definizione di norme dall'esterno mantenendo aperto il canale di mediazione: nel marzo 2026 il National Transition Council, guidato dai militari, ha affermato che Portugal non aveva legittimità per fissare norme, e nel dicembre 2025 ha ricevuto i mediatori dell'ECOWAS, Julius Maada Bio di Sierra Leone e Bassirou Diomaye Faye di Senegal.
- hash: 4d6d1cc8
  it: |
    L'esercito è il regime. Il generale Horta Inta-A Na Man, ex capo di stato maggiore dell'esercito, è stato insediato come presidente di transizione dopo il colpo di Stato del 26 novembre 2025, tre giorni dopo le elezioni. Secondo quanto riferito, l'ex presidente Embalo avrebbe lasciato il Paese per Brazzaville; le notizie non sono confermate da una fonte consultata.
- hash: 569a24f6
  it: |
    Un'economia povera, con l'anacardio come principale esportazione legale e l'agricoltura oltre il 35% del GNP (dato del 2010). In questo passaggio non è stato trovato alcun dato su esportazioni o bilancio per il 2025-26; la fonte è un articolo accademico e serve solo come indicazione.
- hash: 82480c1e
  it: |
    ECOWAS ha sospeso Guinea-Bissau da tutti i suoi organi decisionali fino al ripristino dell'ordine costituzionale. Il blocco regionale che potrebbe condividere il costo della transizione è chiuso alla giunta, mentre i suoi mediatori fissano le condizioni (una transizione breve, strutturata e trasparente). Il ritiro della forza di stabilizzazione nel 2025 non è verificato in questo passaggio.
- hash: 80af0249
  it: |
    Il transito di cocaina è la base strutturale della debolezza dello Stato. I trafficanti usano le isole disabitate e hanno comprato funzionari e militari, il che ha fatto guadagnare al Paese l'etichetta di 'narco-state'. Nel 2019 il presidente Vaz ha dichiarato che lo Stato non disponeva di aerei, barche né radar per la propria zona marittima. Non è stata trovata alcuna fonte del 2025-26 sul traffico; il rapporto del 2019 è il più recente utilizzato qui.
- hash: d3a3df44
  it: |
    Definire illegittima la 'corridor diplomacy' di Lisbon restringe il canale portoghese che mantiene attive la cooperazione sanitaria e quella educativa, e il canale attraverso cui Portugal chiede il rilascio dei detenuti.
- hash: 93f0ac0c
  it: |
    La strategia di Guinea-Bissau è condurre una transizione guidata dai militari secondo una propria tempistica, con una presidenza rafforzata per chiunque vinca il voto di dicembre, in uno Stato troppo debole per sorvegliare le proprie coste. I suoi legami esterni sono limitati: un seggio sospeso nella ECOWAS, un canale portoghese che la giunta ha appena respinto e un vicino senegalese che co-guida la mediazione. Lacune: i contatti con Russia nel 2025, il ritiro di ECOMIB, il retroterra della Casamance (inferenza nostra, non documentata qui) e qualsiasi dato attuale su anacardi o cocaina non sono verificati in questo passaggio.
- hash: ce35edd8
  it: |
    Vincere sul piano giuridico la controversia di confine con Gabon sulle isole Mbanié, Cocotiers e Conga. Il caso è stato sottoposto alla ICJ in base a uno Special Agreement del 2016, dopo la mediazione UN (procedimento avviato il 5 marzo 2021). La sentenza di merito del 19 maggio 2025 è stata in gran parte favorevole a Equatorial Guinea: ha stabilito che la Convenzione di Bata del 1974 non era un trattato dotato di forza di legge tra le parti e che il titolo rilevante è quello che Spain deteneva il 12 ottobre 1968, a cui Equatorial Guinea è succeduta. Voto riportato 13-2 (sintesi di ricerca, non verificata).
- hash: 6a77ddb9
  it: |
    Far valere il proprio controllo sul mare davanti alla propria costa. Lettura nostra, a partire da un solo episodio: nell'agosto 2022 forze hanno abbordato una nave battente bandiera Marshall Islands e ne hanno trattenuto l'equipaggio per oltre nove mesi. Nessuna fonte consultata presenta questo come obiettivo politico.
- hash: 30243a44
  it: |
    Diritto e UN. Lo Special Agreement del 2016 e la mediazione UN hanno trasformato una disputa di confine con Gabon in un caso che Equatorial Guinea poteva vincere a The Hague, e la sentenza del 2025 le attribuisce un titolo giuridico sulle isole.
- hash: 683ec10b
  it: |
    Applicazione costiera. L'abbordaggio e il fermo di una nave battente bandiera straniera davanti alla propria costa è l'unico strumento coercitivo che le fonti registrano per lo Stato nel 2022-2025.
- hash: 8aa810e1
  it: |
    Esposizione giuridica in mare. Marshall Islands ha citato in giudizio Equatorial Guinea davanti all'International Tribunal for the Law of the Sea per quasi US$60 milioni; il caso è stato aperto all'inizio di ottobre 2025.
- hash: 7e25e217
  it: |
    Forza in mare, diritto sulla terraferma. L'abbordaggio con cui ha affermato il controllo sul mare le ha attirato una causa davanti al tribunale, mentre lo stesso Stato ha ottenuto il titolo sulle isole rivolgendosi alla ICJ invece di tenerle con la forza.
- hash: 00ceeb28
  it: |
    Sulla base delle fonti qui consultate, Equatorial Guinea segue due binari: porta la disputa di confine con Gabon davanti a un tribunale quando il diritto può essere fatto giocare a suo favore, e fa rispettare il controllo sul mare con i mezzi di cui dispone, il che si è poi tradotto in una causa davanti a un tribunale. La scheda è scarna perché le fonti qui consultate non coprono la successione di Obiang, il porto e il debito di China, United States, France, Spain, Cameroon, CEMAC o il declino di petrolio e gas; queste lacune sono registrate nel JOURNAL e non colmate dalla memoria. Finché non saranno documentate, questa scheda va letta solo come fascicolo su isole e mare.
- hash: 5cf6cfbf
  it: |
    Mantenere l'Aegean e il Mediterraneo orientale come li definisce Greece, contro Turkey: sovranità sulle isole, la piattaforma continentale e la EEZ tracciate a partire dalle isole secondo il diritto del mare, e il ritiro del casus belli del 1995. Athens sostiene che l'unica controversia è la delimitazione della piattaforma continentale e della EEZ, 'to be discussed in the proper framework when conditions allow'; respinge la lettura della Blue Homeland.
- hash: 5c895908
  it: |
    Dissuadere con le capacità, non con le parole: il programma di armamenti 2025-2036 (EUR 25 miliardi, 'Achilles Shield'), 20 F-35 (opzione per altri 20, consegne dalla fine del 2028), una difesa aerea israeliana a più strati da EUR 3 miliardi (firmata il 31 ago 2026) e una spesa per la difesa vicina al 3,5% del GDP, superiore a quella di molti alleati NATO.
- hash: 678076f8
  it: |
    Costruire un anello di patroni e partner attorno a Turkey, perché Athens non resti mai sola con essa: France (accordo di difesa rinnovato con clausola di assistenza reciproca, 25 apr 2026), United States (basi MDCA a Souda Bay e Alexandroupolis, F-35), Israel e Cyprus (piano di lavoro militare trilaterale, dic 2025; il formato energetico 3+1), Egypt (accordo parziale sulla EEZ del 2020) e la Libya orientale.
- hash: e1ce2fef
  it: |
    Fare di Greece la porta dell'Europa sud-orientale per gas ed elettricità, e collegare Cyprus e Israel alla rete europea: GNL ad Alexandroupolis e Revithoussa, il collegamento IGB e il Vertical Corridor verso nord, fino a Bulgaria, Romania, North Macedonia e Serbia, e il Great Sea Interconnector verso Cyprus (EUR 1,9 miliardi; Meridiam ha acquisito il 66% il 5 ago 2026), congelato dallo stallo navale del luglio 2024 al largo di Kasos.
- hash: 472c6f8b
  it: |
    Chiudere la rotta meridionale: contenere gli arrivi irregolari dalla Libya orientale verso Crete, impedire che il memorandum marittimo Turkey-Libya del 2019 venga ratificato e aprire un percorso di delimitazione con Libya (Gerapetritis a Benghazi, marzo 2026; Saddam Haftar ad Athens, 15 giu 2026), mentre il blocco delle domande d'asilo resta in riserva.
- hash: eb7d6500
  it: |
    Mantenere il vicinato balcanico alle condizioni greche: il Prespa Agreement applicato alla lettera (Athens lega il percorso di North Macedonia verso la EU al rispetto dell'accordo), la minoranza greca in Albania e il caso Beleri, il sostegno al percorso di Serbia verso la EU e il mancato riconoscimento del Kosovo, e il corridoio del gas come carota.
- hash: 3e23235e
  it: |
    Calma e legalismo allo stesso tempo: la Athens Declaration del 7 dic 2023 e il sesto High-Level Cooperation Council ad Ankara (11 feb 2026, sette accordi), canali tra ministri degli Esteri mantenuti aperti (Sofia, 10 giu 2026) e una linea costante secondo cui 'unilateral activity is doomed to fail'; dietro di essa, trilaterali con Egypt-Cyprus e Israel-Cyprus, un 3+1 con United States, e lettere all'UN e alla EU contro il memorandum Turkey-Libya.
- hash: 448d3a4f
  it: |
    Usare la EU come moltiplicatore di sicurezza: una presidenza cipriota dell'EU nel primo semestre 2026, l'opposizione (insieme a Cyprus) alla partecipazione turca al programma di difesa EU SAFE, e la richiesta che la spesa per la difesa sia esclusa dalle regole di bilancio (clausola di salvaguardia); Mitsotakis ha accolto la proposta della Commission e Athens ha chiesto che EUR 500 milioni di spesa per la difesa del 2026 siano esclusi.
- hash: '84067643'
  it: |
    Pubblicare la geografia giuridica: il piano di pianificazione dello spazio marittimo dell'apr 2025 e la mappa integrativa del nov 2025 sulla piattaforma EU, e i parchi marini nel South Aegean e nello Ionian dichiarati il 21 lug 2025. Athens presenta la pianificazione spaziale come distinta dalla delimitazione; Ankara risponde con una propria mappa e propri parchi.
- hash: 7ba60e17
  it: |
    Mezzi e presenza: F-35 dalla fine del 2028, con infrastrutture in corso ad Andravida sotto la supervisione USAF; SPYDER, Barak MX e David's Sling israeliani (prima rete integrata entro il 2029); forze US a Souda e Alexandroupolis nel quadro del MDCA; proseguono le intercettazioni di aerei e droni turchi (225 violazioni turche dello spazio aereo nel 2025, 433 entro l'inizio di agosto 2026, secondo i dati greci).
- hash: 06387e4f
  it: |
    Energia e trasporto marittimo come leva: i terminali GNL greci e l'IGB alimentano il Vertical Corridor, il Great Sea Interconnector è finanziato con fondi Connecting Europe della EU (EUR 657 milioni per Crete-Cyprus), e la flotta di proprietà greca dà ad Athens peso a Brussels e Washington; anche il Piraeus (COSCO, 67%) è una carta che Washington vuole giocare.
- hash: c7122e88
  it: |
    Turkey può far salire il prezzo delle mosse greche in mare, e la posizione di United States potrebbe ammorbidirsi verso Turkey: la marina turca ha bloccato il rilievo Crete-Cyprus nel luglio 2024 e il cavo resta fermo; al vertice NATO di Ankara (luglio 2026) Trump ha detto che avrebbe revocato le sanzioni CAATSA e deciso sulle vendite di F-35 a Turkey, Erdogan ha respinto le obiezioni greche e israeliane, e Mitsotakis ha potuto solo chiedere che il casus belli venga ritirato.
- hash: 1dc0e843
  it: |
    Lo spazio di bilancio è esiguo: il piano per la difesa (EUR 25 miliardi, 3,5% del GDP) deve essere finanziato entro le regole EU; la clausola di salvaguardia chiesta da Athens copre solo circa EUR 500 milioni di spesa nel 2026, meno dello 0,3% del GDP.
- hash: ffbda28a
  it: |
    Un governo intorno al 30% nei sondaggi, con elezioni nella primavera 2027: New Democracy si attesta intorno al 30%, il nuovo partito di Tsipras intorno al 14-17%, il costo della vita è la preoccupazione principale, i fascicoli sui sussidi agricoli OPEKEPE sono arrivati in Parlamento nell'aprile 2026 (ne è seguito un rimpasto) e il processo per il disastro ferroviario di Tempi doveva aprirsi il 23 mar 2026; Mitsotakis esclude elezioni anticipate e una coalizione.
- hash: eafb20a7
  it: |
    Il problema del partner di scelta: Cyprus ha chiesto nuovi studi di fattibilità prima di pagare di più per il cavo, France è coinvolta per farlo ripartire, e il progetto sorge in acque che sia Greece sia Turkey rivendicano; resta da completare circa il 40% dei rilievi sul fondale.
- hash: d27cdf10
  it: |
    Gli interessi dell'armamento greco vanno contro la linea EU sulla Russia e quella US sulla Cina: 36 eurodeputati hanno chiesto a Mitsotakis nell'apr 2025 di fermare le vendite di petroliere di proprietà greca alla flotta ombra russa, e Washington nel 2025 ha fatto pressione perché il Piraeus uscisse dalle mani cinesi.
- hash: a57fc236
  it: |
    Nessuna leva su Tripoli e una rotta migratoria che Athens non può chiudere da sola: Libya invia circa la metà degli arrivi a Crete (quasi 6.000 finora nel 2026 secondo un conteggio), il governo occidentale detiene il memorandum Turkey-Libya, e anche la Libya orientale è corteggiata da Turkey (Kalin ha incontrato Saddam Haftar a Benghazi il 23 giu 2026).
- hash: 251e17c4
  it: |
    Pubblicare la mappa marittima irrigidisce la controparte. Il piano spaziale greco dell'apr 2025 e i parchi marini del lug 2025 hanno avuto risposta con la nota verbale dell'Egypt (8 lug 2025), una contromappa turca e, il 15 ago 2026, con parchi marini turchi attorno a Kastellorizo e tra Lemnos e Samothrace, che Ankara ha esplicitamente presentato come una replica; l'ordine giuridico che Athens intende difendere è ora contestato da due atti unilaterali invece che da uno.
- hash: bfd28552
  it: |
    La distensione con Ankara compra calma ma non il casus belli. Mitsotakis è andato ad Ankara nel febbraio 2026 e ha chiesto che fosse rimossa 'every threat, formal and informal'; sei mesi dopo Turkey ha fatto sorvolare un drone vicino all'aeroporto di Alexandroupolis, ha decretato i parchi e ha redatto il disegno di legge sulla Blue Homeland. Secondo i dati del ministero della Difesa greco, le violazioni turche dello spazio aereo sono state zero nel 2024, 225 nel 2025 e 433 da gennaio all'inizio di agosto 2026.
- hash: d9b07538
  it: |
    Il miglior patrono di Greece è quello che corteggia il suo rivale. United States è l'ancora della deterrenza greca (basi MDCA, F-35), ma è anche Washington a poter reintegrare Turkey nel programma F-35; più Athens spende in sistemi americani e israeliani, più dipende da una Washington che decide su Turkey per ragioni proprie.
- hash: 9e916509
  it: |
    Lo scudo israeliano approfondisce l'esposizione che dovrebbe eliminare. L'accordo Achilles Shield da EUR 3 miliardi dà a Greece la sua prima difesa aerea a più strati, ma lega Athens a Israel nel momento in cui Mitsotakis rimprovera Israel per Gaza e Lebanon ('friends should be honest', 9 apr 2026) ed Erdogan attacca insieme le obiezioni greche e israeliane all'F-35; aggiunge inoltre un argomento turco secondo cui Greece è nel campo di Israel.
- hash: b0d014d8
  it: |
    Un cavo pensato per legare Cyprus e Israel all'Europa ha legato la credibilità energetica di Greece alle navi da guerra turche. Il Great Sea Interconnector nasceva per internazionalizzare il collegamento Aegean-Cyprus; la marina turca lo ha fermato, gli analisti greci leggono i parchi marini del 2026 come una risposta a ciò, e Athens ha ora bisogno di France (Meridiam, Nexans) per far ripartire il progetto che l'EU finanzia.
- hash: 586f07bc
  it: |
    Il paladino dell'Ukraine e delle sanzioni è anche la patria delle navi della flotta ombra. Greece sostiene Ukraine (Mitsotakis-Zelensky, Brussels, 18 giu 2026) e nel 2022 ha espulso diplomatici russi, mentre armatori greci hanno venduto navi al commercio russo (il 37% delle 75 petroliere sanzionate da US nel gennaio 2025 era in precedenza di proprietà greca, secondo un'analisi) e Athens è segnalata mentre fa pressioni su Brussels per ammorbidire il regime, un costo in termini di credibilità proprio mentre chiede alla EU flessibilità in materia di difesa.
- hash: f57404da
  it: |
    Greece conduce la strategia di una potenza dello status quo con una costa più lunga dell'attenzione dei suoi alleati. La sua intera grand strategy è la deterrenza attraverso le alleanze: l'unica minaccia è Turkey, l'unico caso giuridico è il diritto del mare, e gli strumenti sono presi in prestito: testo di trattato francese, basi e aerei americani, difesa aerea israeliana, fondi EU, firme egiziane e cipriote. Mitsotakis ha scelto di condurla su due binari insieme, una calma gestita con Erdogan (Athens Declaration, vertice di Ankara, canale dei ministri degli Esteri) e una silenziosa costruzione dell'anello attorno a lui; lo schema che Luttwak riconoscerebbe è che ciascun binario alimenta l'altro: la calma dà ad Athens spazio per armarsi e pianificare i propri mari, la pianificazione e gli armamenti danno ad Ankara ragioni per legiferare la Blue Homeland e decretare parchi. Il 2026 è l'anno in cui i due binari si sono scontrati: i segnali su F-35 e CAATSA di Trump ad Ankara, i parchi marini del 15 agosto, il drone al largo di Alexandroupolis, il contratto israeliano del 31 agosto e il rinnovato accordo di difesa franco-greco del 25 aprile, tutti entro otto mesi dal vertice di Ankara. Segnali che non sono righe: Athens non ha riconosciuto Palestine ('at the right time'), la linea del ministero degli Esteri greco su Piraeus è 'aligned with the US but will respect past agreements', e il disegno di legge sulla Blue Homeland è riportato dalla primavera ma non confermato come depositato. L'orizzonte interno è un'elezione nella primavera 2027 con il partito di governo intorno al 30%, che spinge Mitsotakis verso una fermezza visibile in mare e verso la promessa di calma a terra.
- hash: b1649953
  it: |
    Rimettere in piedi Carriacou e Petite Martinique dopo l'uragano Beryl (approdo il 1° luglio 2024). Il primo ministro Dickon Mitchell aveva avvertito prima dell'approdo che Carriacou avrebbe subito danni estremi e, in seguito, ha definito gravi le distruzioni lì, con il novanta per cento degli edifici segnalati come distrutti (cifra attribuita nei resoconti di stampa a un rapporto di un vertice CARICOM, non ancora verificata con quel rapporto).
- hash: a2356397
  it: |
    Tenere i partner CARICOM come primo riferimento per il soccorso e il sostegno alla sicurezza. Prima dell'approdo Mitchell ha dichiarato di essere in contatto costante con i colleghi CARICOM, pronti a offrire soccorso e sostegno alla sicurezza; in seguito ha chiesto agli Stati vicini un elicottero.
- hash: 0d133d60
  it: |
    Diplomazia e sovranità contro la forza in Venezuela. Dopo l'operazione US del 3 gennaio 2026 che ha catturato il presidente Maduro, Mitchell ha dichiarato che l'azione non aveva ridotto le divergenze e stava spingendo la regione verso una maggiore instabilità, che dialogo e compromesso sono l'unica via duratura, e che uno Stato che governa un altro non ha spazio fuori dai rapporti coloniali.
- hash: b3b4e8ca
  it: |
    Mutuo soccorso regionale in natura: il soccorso e il sostegno alla sicurezza promessi dai colleghi CARICOM e un elicottero richiesto ai vicini dopo l'approdo. Le fonti consultate non dicono quali Stati abbiano inviato cosa, quindi si tratta di una richiesta e di una promessa, non di una capacità effettivamente fornita.
- hash: 8ab7d98f
  it: |
    Cittadinanza per investimento: un passaporto venduto a investitori, con 22.784 cittadini registrati tra gennaio 2015 e marzo 2025 (il titolo di un rapporto di NowGrenada, pagina non aperta). È un bene di entrate e di politica estera che dipende dalla buona volontà degli Stati che rilasciano i visti.
- hash: 6872d497
  it: |
    Isole periferiche esposte. Beryl ha ucciso tre persone tra Grenada e Carriacou e ha lasciato Carriacou con la maggior parte degli edifici distrutti, quindi una sola tempesta può cancellare in una stagione la portata dell'economia di uno Stato piccolo.
- hash: 52c646ec
  it: |
    Nessuna linea comune CARICOM sull'operazione US in Venezuela. Un editoriale del Gleaner del 16 ottobre 2025 afferma che i leader CARICOM non avevano tenuto colloqui formali sul rafforzamento militare US e chiede al presidente di turno di convocarne uno, quindi la posizione di Grenada su Venezuela non ha alle spalle una posizione di blocco.
- hash: 4c991df9
  it: |
    Mitchell definisce l'operazione US in Venezuela una spinta verso l'instabilità e chiede il dialogo, eppure United States ha chiesto a Grenada una postazione radar di ascolto sull'isola (come riferisce l'editoriale del Gleaner): un favore in materia di sicurezza che legherebbe Grenada più strettamente alle operazioni che critica. Le fonti consultate non dicono se Grenada abbia acconsentito.
- hash: c34fb08d
  it: |
    La strategia di Grenada, per quanto le fonti consultate la mostrino, è la sopravvivenza di uno Stato piccolo attraverso il blocco regionale: i partner CARICOM sono il suo primo riferimento per il soccorso e la sicurezza, mentre i suoi mezzi propri sono una richiesta di elicottero, un'isola periferica devastata dalla tempesta e un passaporto venduto agli investitori. La sua unica linea esterna chiara nel 2026 è far valere diplomazia e sovranità contro l'operazione US in Venezuela, mentre Washington le chiede un favore in materia di sicurezza. La ripresa dopo Beryl, non la politica estera, resta il vincolo decisivo del 2024-26. Confidenza C in tutto: è stato consultato l'indice di Wikipedia, ma le sole fonti aperte sono sintesi di stampa di luglio 2024 e gennaio 2026, e restano aperti e non scritti il Regno Unito, il passaggio a Taiwan, la CARICOM come blocco, l'economia della noce moscata e del turismo e le posizioni su Ucraina e Gaza.
