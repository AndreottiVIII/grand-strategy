# Translate every `en` into it. Write the translations to the file cards-05.out.yaml next to this one,
# as `items:` of `- hash: <same hash>` / `it: <translation>`, appending one item at a time (valid YAML at
# every step), never editing this file. Keep names, dates, numbers and quotes; register of a foreign-office
# brief: dry, precise, no flourish.
lang: it
items:
- hash: '50814464'
  kind: cards
  en: Make Myanmar answer for the Rohingya killings in court. The Gambia v. Myanmar, under the Genocide Convention, was filed in November 2019; merits hearings ended in January 2026 and the judgment is
    pending. It is the instrument that gives a small state a voice abroad.
  it: ''
- hash: d875f059
  kind: cards
  en: Keep the transition that Senegal backed in January 2017, when Senegalese troops entered to back the elected leader Adama Barrow. The aim is a state that does not fall back into the Jammeh period.
  it: ''
- hash: 8e2c8182
  kind: cards
  en: 'Legal diplomacy: the ICJ case against Myanmar, pursued at The Hague under the Genocide Convention, as the Gambia''s most visible instrument abroad.'
  it: ''
- hash: 35b485ce
  kind: cards
  en: 'Recognition as a currency: the switch from Taipei to Beijing on 17 March 2016, which moved the Gambia into the Chinese channel.'
  it: ''
- hash: 9e1931b0
  kind: cards
  en: 'Dependence on Senegal for security: the 2017 transition rested on Senegalese troops sent to back Barrow. The Gambia is surrounded by its larger neighbour, and no alternative security guarantor is
    sourced in this pass.'
  it: ''
- hash: ac1a8ecf
  kind: cards
  en: The ICJ can judge but cannot enforce. Myanmar's agent called the allegations unsubstantiated at the January 2026 hearings, so a ruling against Myanmar would depend on compliance the Gambia cannot
    compel.
  it: ''
- hash: 8d3cab58
  kind: cards
  en: It presses Myanmar for accountability for mass killing at the ICJ, while its own security since 2017 has rested on troops from a neighbour's state. Its strongest voice abroad is a case against a state,
    while the troops that secure it at home come from another state.
  it: ''
- hash: 9fb1a96a
  kind: cards
  en: 'The Gambia is small and dependent: its post-2017 order rests on Senegal, and its best-known foreign instrument is the ICJ case against Myanmar, which gives a small state a voice in The Hague. The
    older diplomacy (the 2016 switch from Taipei to Beijing, and the 2017-2018 Commonwealth return) is sourced here only at the level of the event, not of the lasting ties. Not verified in this pass, and
    therefore not in the card: the 2026 presidential election and the third-term question, the TRRC and Jammeh''s legacy, the EU and migration deals, Turkey and the Gulf, ECOWAS and the ECOMIG force, and
    the Senegal ferry and bridge.'
  it: ''
- hash: 8cfdf467
  kind: cards
  en: 'Run a military-led transition on its own timetable: a referendum on 30 August 2026 on a new constitution that strengthens the presidency (parliament cut from 102 to 65 seats), then presidential and
    legislative elections on 6 December 2026. The transition charter bars the transitional president and prime minister from standing.'
  it: ''
- hash: 8a3bcfd5
  kind: cards
  en: 'Refuse outside norm-setting while keeping the mediation channel open: in March 2026 the military National Transition Council said Portugal had no legitimacy to set norms, and in December 2025 it
    received the ECOWAS mediators, Sierra Leone''s Julius Maada Bio and Senegal''s Bassirou Diomaye Faye.'
  it: ''
- hash: 4d6d1cc8
  kind: cards
  en: The army is the regime. General Horta Inta-A Na Man, the former army chief of staff, was installed as transitional president after the coup of 26 November 2025, three days after the elections. Former
    president Embalo has reportedly left for Brazzaville; the reports are not confirmed in a fetched source.
  it: ''
- hash: 569a24f6
  kind: cards
  en: A poor economy with cashew as its largest legitimate export and agriculture above 35% of GNP (figure for 2010). No export or budget figure for 2025-26 was found in this pass; the source is an academic
    paper and is a pointer only.
  it: ''
- hash: 82480c1e
  kind: cards
  en: ECOWAS has suspended Guinea-Bissau from all its decision-making bodies until constitutional order is restored. The regional bloc that could share the cost of the transition is closed to the junta
    while its mediators set the terms (a short, structured and transparent transition). The stabilisation force's withdrawal in 2025 is not verified in this pass.
  it: ''
- hash: 80af0249
  kind: cards
  en: Cocaine transit is the structural base of the state's weakness. Traffickers use the uninhabited islands and have bought officials and the military, which gave the country the 'narco-state' label.
    In 2019 President Vaz said the state had no aircraft, no boats and no radars for its maritime zone. No 2025-26 source on the trade was found; the 2019 report is the latest used here.
  it: ''
- hash: d3a3df44
  kind: cards
  en: Calling Lisbon's 'corridor diplomacy' illegitimate narrows the Portuguese channel that keeps health and education cooperation running, and the one through which Portugal presses for the release of
    detainees.
  it: ''
- hash: 93f0ac0c
  kind: cards
  en: 'Guinea-Bissau''s strategy is to run a military-led transition on its own timetable, with a presidency strengthened for whoever wins the December vote, in a state too weak to police its own coast.
    Its outside links are narrow: a suspended ECOWAS seat, a Portuguese channel the junta has just rejected, and a Senegalese neighbour that co-leads the mediation. Gaps: Russia''s 2025 contacts, the ECOMIB
    withdrawal, the Casamance rear (our inference, not sourced here) and any current cashew or cocaine figure are not verified in this pass.'
  it: ''
- hash: ce35edd8
  kind: cards
  en: Win the Mbanié, Cocotiers and Conga islands dispute with Gabon in law. The case went to the ICJ under a 2016 Special Agreement after UN mediation (proceedings instituted 5 March 2021); the merits
    judgment of 19 May 2025 went largely in Equatorial Guinea's favour, holding that the 1974 Bata Convention was not a treaty with the force of law between the parties and that the title which counts is
    the one Spain held on 12 October 1968, which Equatorial Guinea succeeded to. Reported vote 13-2 (search summary, not verified).
  it: ''
- hash: 6a77ddb9
  kind: cards
  en: 'Enforce its own control of the sea off its coast. Our reading, from one incident: forces boarded a Marshallese-flagged ship in August 2022 and held its crew for over nine months. No source read states
    this as a policy aim.'
  it: ''
- hash: 30243a44
  kind: cards
  en: Law and the UN. The 2016 Special Agreement and UN mediation turned a border quarrel with Gabon into a case Equatorial Guinea could win in The Hague, and the 2025 judgment gives it a legal title over
    the islands.
  it: ''
- hash: 683ec10b
  kind: cards
  en: Coastal enforcement. Boarding and detaining a foreign-flagged ship off its coast is the one coercive instrument the sources record for the state in 2022-2025.
  it: ''
- hash: 8aa810e1
  kind: cards
  en: Legal exposure at sea. The Marshall Islands sued Equatorial Guinea at the International Tribunal for the Law of the Sea for nearly US$60 million; the case opened in early October 2025.
  it: ''
- hash: 7e25e217
  kind: cards
  en: Force at sea, law on land. The boarding that asserted its control of the sea brought a tribunal suit against it, while the same state won its island title by going to the ICJ rather than holding the
    islands by force.
  it: ''
- hash: 00ceeb28
  kind: cards
  en: 'On the sources read here, Equatorial Guinea runs two tracks: it takes its border dispute with Gabon to court when the law can be made to favour it, and it enforces control at sea with the means it
    has, which has since become a tribunal suit. The card is thin because the sources read here do not cover the Obiang succession, China''s port and debt, the United States, France, Spain, Cameroon, CEMAC
    or the decline of oil and gas; those gaps are logged in JOURNAL, not filled from memory. Until they are sourced, read this card as the island and sea file only.'
  it: ''
- hash: 5cf6cfbf
  kind: cards
  en: 'Keep the Aegean and the Eastern Mediterranean as Greece defines them, against Turkey: island sovereignty, a continental shelf and EEZ drawn from the islands under the law of the sea, and the withdrawal
    of the 1995 casus belli. Athens says the only dispute is the delimitation of the continental shelf and EEZ, ''to be discussed in the proper framework when conditions allow''; it refuses the Blue Homeland
    reading.'
  it: ''
- hash: 5c895908
  kind: cards
  en: 'Deter by capability, not by talk: the 2025-2036 armaments programme (EUR 25bn, ''Achilles Shield''), 20 F-35s (option for 20 more, deliveries from late 2028), a EUR 3bn Israeli layered air defence
    (signed 31 Aug 2026), and defence spending near 3.5% of GDP, higher than many NATO allies.'
  it: ''
- hash: 678076f8
  kind: cards
  en: 'Build a ring of patrons and partners around Turkey so that Athens is never alone with it: France (renewed defence agreement with a mutual-assistance clause, 25 Apr 2026), the United States (MDCA
    bases at Souda Bay and Alexandroupolis, F-35), Israel and Cyprus (trilateral military work plan, Dec 2025; the 3+1 energy format), Egypt (2020 partial EEZ deal) and eastern Libya.'
  it: ''
- hash: e1ce2fef
  kind: cards
  en: 'Make Greece the south-east European gateway for gas and electricity, and tie Cyprus and Israel to the European grid: LNG at Alexandroupolis and Revithoussa, the IGB link and the Vertical Corridor
    north to Bulgaria, Romania, North Macedonia and Serbia, and the Great Sea Interconnector to Cyprus (EUR 1.9bn; Meridiam took 66% on 5 Aug 2026), frozen since the July 2024 naval standoff off Kasos.'
  it: ''
- hash: 472c6f8b
  kind: cards
  en: 'Close the southern route: contain irregular arrivals from eastern Libya to Crete, stop the 2019 Turkey-Libya maritime memorandum from being ratified, and open a delimitation track with Libya (Gerapetritis
    in Benghazi, March 2026; Saddam Haftar in Athens, 15 June 2026) while the asylum freeze stays in reserve.'
  it: ''
- hash: eb7d6500
  kind: cards
  en: 'Keep the Balkan neighbourhood on Greek terms: the Prespa Agreement applied to the letter (Athens ties North Macedonia''s EU path to compliance), the Greek minority in Albania and the Beleri case,
    support for Serbia''s EU course and non-recognition of Kosovo, and the gas corridor as the carrot.'
  it: ''
- hash: 3e23235e
  kind: cards
  en: 'Calm and legalism at the same time: the Athens Declaration of 7 Dec 2023 and the 6th High-Level Cooperation Council in Ankara (11 Feb 2026, seven agreements), foreign-minister channels kept open
    (Sofia, 10 Jun 2026), and a standing line that ''unilateral activity is doomed to fail''; behind it, trilaterals with Egypt-Cyprus and Israel-Cyprus, a 3+1 with the US, and letters to the UN and the
    EU against the Turkey-Libya memorandum.'
  it: ''
- hash: 448d3a4f
  kind: cards
  en: 'Use the EU as a security multiplier: a Cyprus EU presidency in the first half of 2026, objection (with Cyprus) to Turkish participation in the EU defence programme SAFE, and a request that defence
    spending be exempt from the fiscal rules (escape clause); Mitsotakis welcomed the Commission proposal and Athens asked for EUR 500m of 2026 defence spending to be exempted.'
  it: ''
- hash: '84067643'
  kind: cards
  en: 'Publish the legal geography: the April 2025 maritime spatial plan and the November 2025 supplementary map on the EU platform, and marine parks in the South Aegean and Ionian declared on 21 Jul 2025.
    Athens presents spatial planning as separate from delimitation; Ankara answers with its own map and parks.'
  it: ''
- hash: 7ba60e17
  kind: cards
  en: 'Hardware and presence: F-35s from late 2028 with infrastructure under way at Andravida under USAF supervision, Israeli SPYDER, Barak MX and David''s Sling (first integrated network by 2029), US forces
    at Souda and Alexandroupolis under the MDCA; interceptions of Turkish aircraft and drones continue (225 Turkish airspace violations in 2025, 433 by early August 2026, by Greek figures).'
  it: ''
- hash: 06387e4f
  kind: cards
  en: 'Energy and shipping as leverage: Greek LNG terminals and the IGB feed the Vertical Corridor, the Great Sea Interconnector is paid for with EU Connecting Europe money (EUR 657m for Crete-Cyprus),
    and Greek-owned shipping gives Athens weight in Brussels and Washington; Piraeus (COSCO, 67%) is also a card Washington wants played.'
  it: ''
- hash: c7122e88
  kind: cards
  en: 'Turkey can raise the price of Greek moves at sea and the US may soften toward it: the Turkish navy halted the Crete-Cyprus survey in July 2024 and the cable is still stalled; at the NATO summit in
    Ankara (July 2026) Trump said he would lift CAATSA sanctions and decide on F-35 sales to Turkey, Erdogan dismissed Greek and Israeli objections, and Mitsotakis could only call for the casus belli to
    be withdrawn.'
  it: ''
- hash: 1dc0e843
  kind: cards
  en: 'Fiscal room is thin: the defence plan (EUR 25bn, 3.5% of GDP) must be funded inside EU rules; the escape clause Athens asked for covers only about EUR 500m of 2026 spending, less than 0.3% of GDP.'
  it: ''
- hash: ffbda28a
  kind: cards
  en: 'A government near 30% in the polls with a spring 2027 election: New Democracy polls about 30%, Tsipras''s new party about 14-17%, cost of living is the first concern, the OPEKEPE farm-subsidy files
    reached Parliament in April 2026 (a reshuffle followed) and the Tempi rail-disaster trial was scheduled to open on 23 Mar 2026; Mitsotakis rules out snap elections and a coalition.'
  it: ''
- hash: eafb20a7
  kind: cards
  en: 'The partner-of-choice problem: Cyprus has asked for fresh viability studies before it pays more for the cable, France is brought in to restart it, and the project sits in waters both Greece and Turkey
    claim; about 40% of the seabed surveys remain.'
  it: ''
- hash: d27cdf10
  kind: cards
  en: 'Greek shipping interests cut against the EU line on Russia and the US line on China: 36 MEPs asked Mitsotakis in April 2025 to stop sales of Greek-owned tankers into the Russian shadow fleet, and
    Washington pressed in 2025 for Piraeus to leave Chinese hands.'
  it: ''
- hash: a57fc236
  kind: cards
  en: 'No leverage over Tripoli and a migration route Athens cannot close alone: Libya sends about half of arrivals to Crete (nearly 6,000 so far in 2026 by one count), the western government holds the
    Turkey-Libya memorandum, and eastern Libya is courted by Turkey as well (Kalin met Saddam Haftar in Benghazi on 23 Jun 2026).'
  it: ''
- hash: 251e17c4
  kind: cards
  en: Publishing the maritime map hardens the other side's. Greece's April 2025 spatial plan and July 2025 marine parks were answered by Egypt's note verbale (8 Jul 2025), a Turkish counter-map and, on
    15 Aug 2026, Turkish marine parks around Kastellorizo and between Lemnos and Samothrace, which Ankara explicitly framed as a reply; the legal order Athens wants to defend is now contested by two unilateral
    acts instead of one.
  it: ''
- hash: bfd28552
  kind: cards
  en: Détente with Ankara buys calm but not the casus belli. Mitsotakis went to Ankara in February 2026 and asked for 'every threat, formal and informal' to be removed; six months later Turkey flew a drone
    near Alexandroupolis airport, decreed the parks and drafted the Blue Homeland bill. Greek defence ministry figures count zero Turkish airspace violations in 2024, 225 in 2025 and 433 from January to
    early August 2026.
  it: ''
- hash: d9b07538
  kind: cards
  en: Greece's best patron is the one that courts its rival. The US is the anchor of Greek deterrence (MDCA bases, F-35s) and also the capital that may restore Turkey to the F-35 programme; the more Athens
    spends on American and Israeli systems, the more it depends on a Washington that decides on Turkey for its own reasons.
  it: ''
- hash: 9e916509
  kind: cards
  en: The Israeli shield deepens the exposure it is meant to remove. The EUR 3bn Achilles Shield deal gives Greece its first layered air defence, but ties Athens to Israel at the moment Mitsotakis rebukes
    Israel over Gaza and Lebanon ('friends should be honest', 9 Apr 2026) and Erdogan attacks Greek and Israeli objections to the F-35 together; it also adds a Turkish argument that Greece is in Israel's
    camp.
  it: ''
- hash: b0d014d8
  kind: cards
  en: A cable meant to bind Cyprus and Israel to Europe has tied Greece's energy credibility to Turkish warships. The Great Sea Interconnector was built to internationalise the Aegean-Cyprus link; the Turkish
    navy stopped it, Greek analysts read the 2026 marine parks as a reply to it, and Athens now needs France (Meridiam, Nexans) to restart what the EU funds.
  it: ''
- hash: 586f07bc
  kind: cards
  en: The champion of Ukraine and sanctions is also the home of the shadow fleet's ships. Greece backs Ukraine (Mitsotakis-Zelensky, Brussels, 18 Jun 2026) and expelled Russian diplomats in 2022, while
    Greek owners sold ships to the Russian trade (37% of the 75 tankers the US sanctioned in January 2025 were previously Greek-owned, by one analysis) and Athens is reported to lobby Brussels to soften
    the regime, a credibility cost just as it asks the EU for defence flexibility.
  it: ''
- hash: f57404da
  kind: cards
  en: 'Greece runs the strategy of a status-quo power with a longer coast than its allies'' attention. Its whole grand strategy is deterrence by alliance: the single threat is Turkey, the single legal case
    is the law of the sea, and the instruments are borrowed - French treaty text, American bases and aircraft, Israeli air defence, EU money, Egyptian and Cypriot signatures. Mitsotakis has chosen to run
    it on two tracks at once, a managed calm with Erdogan (Athens Declaration, Ankara summit, foreign-minister channel) and a quiet build-up of the ring around him, and the pattern Luttwak would recognise
    is that each track feeds the other: the calm gives Athens room to arm and plan its seas, the planning and the arms give Ankara reasons to legislate the Blue Homeland and decree parks. 2026 is the year
    in which the two tracks collided: the F-35 and CAATSA signals from Trump in Ankara, the marine parks of 15 August, the drone off Alexandroupolis, the Israeli contract of 31 August, and the renewed Franco-Greek
    defence agreement of 25 April, all within eight months of the Ankara summit. Signals that are not rows: Athens has not recognised Palestine (''at the right time''), the Greek foreign ministry''s line
    on Piraeus is ''aligned with the US but will respect past agreements'', and the Blue Homeland bill has been reported since spring but not confirmed as tabled. The domestic horizon is a spring 2027 election
    with the governing party near 30%, which pushes Mitsotakis toward visible firmness on the sea and toward the promise of calm on the ground.'
  it: ''
- hash: b1649953
  kind: cards
  en: Get Carriacou and Petite Martinique back on their feet after Hurricane Beryl (landfall 1 July 2024). Prime Minister Dickon Mitchell warned before landfall that Carriacou would take extreme damage
    and afterwards called the destruction there severe, with ninety percent of buildings reported destroyed (the figure as attributed in press reports to a CARICOM summit report, not yet checked against
    that report).
  it: ''
- hash: a2356397
  kind: cards
  en: Keep the CARICOM partners as the first call for relief and security support. Before landfall Mitchell said he was in constant contact with his CARICOM colleagues, who were ready to offer relief and
    security support; afterwards he asked neighbouring states for a helicopter.
  it: ''
- hash: 0d133d60
  kind: cards
  en: Diplomacy and sovereignty over force in Venezuela. After the US operation of 3 January 2026 that seized President Maduro, Mitchell said the action had not narrowed differences and was pushing the
    region into more instability, that talks and compromise are the only lasting route, and that one state governing another has no place outside colonial relationships.
  it: ''
- hash: b3b4e8ca
  kind: cards
  en: 'Regional mutual aid, in kind: the relief and security support promised by CARICOM colleagues and a helicopter requested from neighbours after landfall. The sources read do not say which states sent
    what, so this is a request and a promise, not a delivered capacity.'
  it: ''
- hash: 8ab7d98f
  kind: cards
  en: 'Citizenship by investment: a passport sold to investors, with 22,784 citizens recorded between January 2015 and March 2025 (the headline of a NowGrenada report, page not opened). It is a revenue
    and foreign-policy asset that depends on the goodwill of the visa-issuing states.'
  it: ''
- hash: 6872d497
  kind: cards
  en: Exposed outer islands. Beryl killed three people across Grenada and Carriacou and left Carriacou with most of its buildings destroyed, so one storm can take away the reach of a small state's economy
    in a single season.
  it: ''
- hash: 52c646ec
  kind: cards
  en: No common CARICOM line on the US operation in Venezuela. A Gleaner editorial of 16 October 2025 says CARICOM leaders had held no formal talks on the US military build-up and urges the chair to convene
    one, so Grenada's view on Venezuela stands without a bloc position behind it.
  it: ''
- hash: 4c991df9
  kind: cards
  en: 'Mitchell calls the US operation in Venezuela a push toward instability and asks for talks, yet the United States has asked Grenada for a radar listening post on the island (as the Gleaner editorial
    reports): a security favour that would tie Grenada closer to the operations it criticises. The sources read do not say whether Grenada agreed.'
  it: ''
- hash: c34fb08d
  kind: cards
  en: 'Grenada''s strategy, as far as the sources read show it, is small-state survival through the regional bloc: CARICOM partners are its first call for relief and security, and its own means are a request
    for a helicopter, a storm-battered outer island and a passport it sells to investors. Its one clear external line in 2026 is to press diplomacy and sovereignty against the US operation in Venezuela,
    while Washington asks it for a security favour. Recovery from Beryl, not foreign policy, remains the binding constraint of 2024-26. Confidence C throughout: the Wikipedia index was read, but press summaries
    of July 2024 and January 2026 are the only sources opened, and the UK, the Taiwan switch, CARICOM as a bloc, the nutmeg and tourism economy and the Ukraine and Gaza positions are still open and unwritten.'
  it: ''
- hash: e1daa86c
  kind: cards
  en: Keep the Taipei relation, in place since 1933, as a diplomatic asset that brings investment and supply-chain money. President Arevalo's first state visit to Taipei in June 2025 ended with documents
    on investment, supply chains, semiconductors and political consultation.
  it: ''
- hash: 1bce624f
  kind: cards
  en: 'Keep Washington as the partner that pays for migration control: take non-Guatemalan deportees and expand deportation flights by 40% in exchange for money and security cooperation, as agreed with
    Secretary of State Rubio in February 2025.'
  it: ''
- hash: b4c02ab7
  kind: cards
  en: Migration as a bargaining chip. Guatemala agreed in February 2025 to take non-Guatemalan deportees from the US. Guatemala and Honduras publicly deny signing the version of the deal described by DHS
    Secretary Noem, so the written terms are disputed.
  it: ''
- hash: c6107007
  kind: cards
  en: 'Taiwan as a diplomatic card: the ties date from 1933 and Guatemala is, in its own framing, the oldest continuing state recognising the Republic of China. The June 2025 visit was received with full
    military honours in the year of 90 years of ties.'
  it: ''
- hash: 3ce16f83
  kind: cards
  en: Remittance dependence. Guatemala took in US$8.431 billion in remittances between January and April 2026, 53.2% of the three Northern Triangle countries' total. From January 2026 a 1% US tax applies
    to transfers made in cash, money orders or cashier's cheques, so the economy rests on a corridor Washington can tax.
  it: ''
- hash: b8e51201
  kind: cards
  en: Congress, the judiciary and the attorney general. Wikipedia records strong opposition to the Arevalo government from the judiciary, Congress and the establishment. The attorney general serves a four-year
    term and can be removed only for a conviction for an offence committed in office, so the chief prosecutor is not the president's to dismiss.
  it: ''
- hash: b15b8567
  kind: cards
  en: The deal that buys US goodwill makes Mexico the aggrieved neighbour. Guatemala received about 2,300 Mexicans deported from the US in 2026 and kept them for less than 24 hours; Mexico's foreign ministry
    opposed the practice, so the border partner now protests the transit country.
  it: ''
- hash: 698a4e2a
  kind: cards
  en: Guatemala under Arevalo trades migration services for US money and security, and keeps Taiwan as a diplomatic card it has not spent on Beijing. Its economy is remittances, a corridor Washington taxes
    and can tighten, so the deportation deal is a lever it cannot easily refuse. The attorney general and the courts, shielded from quick removal, are the constraint that decides how far the president can
    move.
  it: ''
- hash: 8e10cfbf
  kind: cards
  en: Keep the 1899 arbitral line and have the ICJ confirm it. Venezuela claims the Essequibo and rejects the 1899 award. Guyana filed at the ICJ on 29 March 2018, and the merits hearings were held 4-11
    May 2026; the ICJ page shows no judgment date yet, and Guyana's government expects a ruling as early as November 2026.
  it: ''
- hash: 3a371cdb
  kind: cards
  en: Turn the oil windfall into a fund that pays for development at a steady pace. The sovereign wealth fund was set up in 2019 and holds all oil revenue; it lets the government draw money at a steady
    rate. Reuters calculates Guyana's 2026 oil revenue at about USD 4.3bn at USD 100 a barrel, 67% above last year.
  it: ''
- hash: cf16c4a8
  kind: cards
  en: The ICJ as the legal lever. Guyana takes the border to the court rather than to force. The court indicated provisional measures on 1 December 2023 against changes on the ground and modified its order
    on 1 May 2025, after Guyana's second request of 6 March 2025.
  it: ''
- hash: d3a11715
  kind: cards
  en: Oil money held in a fund. Output is over 900,000 barrels a day after seven years; the fund holds all oil revenue, and Guyana's GDP more than quadrupled to USD 27.5bn between 2019 and 2024 (World Bank
    figure, as cited by Reuters).
  it: ''
- hash: '41897940'
  kind: cards
  en: The operator takes the first oil. An ExxonMobil-led consortium controls all of Guyana's oil production and takes 75% of it to recover costs; profit oil to the state is 12.5% now and is expected to
    rise to 50% once cost recovery is complete (Exxon has said this could happen in 2026).
  it: ''
- hash: d0bf9c57
  kind: cards
  en: The claim is a state policy in Caracas. Venezuela's 2023 referendum (3 December 2023) asked about a Guayana Esequiba state, and a March 2024 law designated the Essequibo as a new Venezuelan state.
    In May 2026 Venezuela's leader, Delcy Rodriguez, was to defend the claim in person before the court.
  it: ''
- hash: 5b9eacbb
  kind: cards
  en: The oil that pays for the defence of the border is what makes the border worth contesting. Drilling licences granted in September 2023 after the offshore finds triggered the 2023 escalation; the windfall
    now rising 67% gives Guyana the means to fight the case and gives Venezuela the reason to press it.
  it: ''
- hash: 527eaca7
  kind: cards
  en: 'Guyana runs its strategy on three levers: the 1899 line argued at The Hague, oil revenue held in a fund, and an Exxon-led operator that carries the output. Its weakness is that the same oil makes
    the disputed territory worth claiming, so each step of its growth is also a step in the Venezuelan dispute. Its strength is that a legal case backed by a fund is slow but durable, and the outside partners
    (Brazil, the United States, the UK, CARICOM, China) are not yet graded because their cards and sources are not written.'
  it: ''
- hash: b4dc2edf
  kind: cards
  en: 'Decide the Taiwan question: review the Castro-era agreements with China, including Huawei telecom infrastructure, and choose between keeping Beijing and restoring Taipei. President Asfura, in office
    since 27 January 2026, ordered the review; no decision was found by October 2026.'
  it: ''
- hash: 8624d2c2
  kind: cards
  en: Protect the United States relationship, on which remittances, TPS and maquila jobs depend. Asfura says he must protect it, and that a return to Taiwan is 'not as simple as flipping a switch'.
  it: ''
- hash: 9c73a112
  kind: cards
  en: A review of the Castro-era agreements with China, including Huawei telecom infrastructure, which the government has ordered. Its outcome was not found by October 2026.
  it: ''
- hash: c9c04483
  kind: cards
  en: 'US economic ties: remittances, TPS and maquila jobs. Asfura names them as the reason a Taiwan switch cannot be made quickly.'
  it: ''
- hash: d255d306
  kind: cards
  en: The review that courts US investment examines Chinese deals that are still running, so the move meant to tie Honduras closer to Washington can cost the Chinese-funded projects the country still depends
    on. Our reading of the Bloomberg framing, confidence C.
  it: ''
- hash: 2483fc97
  kind: cards
  en: 'Honduras is a partner of both Washington and Beijing with no alignment to either, and since January 2026 its new president has reviewed the March 2023 switch to China rather than reversed it. The
    Taiwan question is open: a return to Taipei would undo that switch, and Asfura says the US tie, with its remittances, TPS and maquila jobs, comes first. The paradox sits in the review itself, which
    courts US investment by examining the Chinese deals the country still runs, so the check on Beijing may cost the projects that make Honduras worth courting.'
  it: ''
- hash: c829ae9f
  kind: cards
  en: 'Deter Serbia from inside NATO and the EU, and build the national hardware to do it: the 2.08% of GDP spent on defence in 2025 is to pass 2.5% in 2027, with 12 used Rafale F3-R already delivered,
    44 Leopard 2A8 tanks ordered in December 2025 (deliveries 2028-30) and about EUR 700m of new purchases announced on 4 September 2026 (18 South Korean Chunmoo launchers). Zagreb denies an arms race but
    reads Serbian rearmament (Chinese CM-400AKG missiles confirmed in March 2026) as a risk to report to the Alliance.'
  it: ''
- hash: 5a4dcef4
  kind: cards
  en: 'Sit in the core of the EU and sell it as the national project: the euro and Schengen on 1 January 2023 (internal land-border checks ended), a EUR 1.7bn allocation under the EU''s SAFE defence loans,
    66% of goods exports and 77% of goods imports with EU partners; Plenkovic also asks Washington for support for OECD accession.'
  it: ''
- hash: 50622d15
  kind: cards
  en: 'Become the energy hub of south-eastern and central Europe, with Washington''s backing: the Krk LNG terminal (booked in full to 2036; physical regasification maximum raised from 3.9 to 6.1 bcm a year
    in 2026), the JANAF oil pipeline (non-Russian crude for MOL and, under US licence, for Serbia''s NIS) and the Southern Interconnection into Bosnia. The US deal signed at Dubrovnik on 29 April 2026 puts
    the hub into the American gas-supply chain.'
  it: ''
- hash: a1a0c3b6
  kind: cards
  en: 'Keep the Croats of Bosnia and Herzegovina politically whole inside a state that survives: equal standing for the Croat constituent people (the 2022 election-law changes imposed by the High Representative,
    lobbied by Zagreb; the HDZ BiH''s Darijana Filipovic winning the Croat presidency seat in the 4 October 2026 election on preliminary results), BiH on the EU and NATO path, and the gas pipeline into
    Herzegovina. Zagreb backs Bosnia''s territorial integrity.'
  it: ''
- hash: 99fc744f
  kind: cards
  en: 'Make Serbia''s road to the EU conditional on the war legacy and contest Belgrade''s memory politics: 1,725 people still missing from the 1991-95 war, no cooperation on Serbian archives, Jasenovac
    and Vukovar as moral ground, and no stage in Croatia for Aleksandar Vucic. Plenkovic''s government keeps the tone cold but denies any military alliance against Serbia; President Milanovic cancelled
    the Brdo-Brijuni summit rather than receive Vucic.'
  it: ''
- hash: 32b95d4c
  kind: cards
  en: 'Protect an economy that lives on one season and on imported labour: 21.8m tourist arrivals and a record 110.1m overnight stays in 2025, a population of about 3.88m held up only by foreign workers
    (56,665 arrivals against 37,485 departures in 2025, of whom 70.3% of immigrants were foreign nationals), and a goods trade that covers only 56% of imports.'
  it: ''
- hash: 5c34994a
  kind: cards
  en: 'EU and NATO seats used as leverage over neighbours: the line that Serbia cannot close its accession without resolving missing persons (Veterans'' Minister Medved), the July 2024 declaration of three
    Montenegrin officials as persona non grata over the Jasenovac resolution, Council of Ministers lobbying for the Bosnian election law, and the March 2025 defence declaration with Albania and Kosovo that
    tells Belgrade ''the time of asking permission is over''.'
  it: ''
- hash: 2c5629cb
  kind: cards
  en: 'A rapid, Western-sourced rearmament funded in part by the EU: 12 used Rafale F3-R (about EUR 1.14bn, last delivered in 2025), 44 Leopard 2A8 for EUR 1.48bn (EUR 1.14bn of it from SAFE loans, EUR
    144.8m credited by Berlin for tanks and fighting vehicles Croatia handed over for Ukraine), and from September 2026 18 Chunmoo launchers with a range above 300 km.'
  it: ''
- hash: 021ca962
  kind: cards
  en: 'Control of the Adriatic gateway: Krk LNG (booked in full to 2036, with Hungarian companies among its customers), the Adria pipeline run by JANAF (sole crude route of Serbia''s refinery, and non-Russian
    supply for MOL in Hungary and Slovakia), and a US-built Southern Interconnection into Bosnia (about EUR 1.5bn, signed at Dubrovnik in April 2026).'
  it: ''
- hash: a62c41c8
  kind: cards
  en: 'The memory register: Vukovar, the missing, Jasenovac as a contested site (Croatia insists any Serbian visit be official and reciprocal) and the rebuttal of Belgrade''s ''greatest threat'' framing
    - Plenkovic''s line is that Croatia ''does not interfere in Serbia''s internal affairs and does not form a military alliance against it''.'
  it: ''
- hash: 0791ca65
  kind: cards
  en: 'EU money and the euro as shock absorbers: Schengen/euro membership since 2023, SAFE loans (EUR 1.7bn), EU-promoted infrastructure such as the Pelješac bridge (built by the Chinese state firm CRBC,
    tendered in 2018), and an open tourism economy (21.8m arrivals in 2025).'
  it: ''
- hash: ae336523
  kind: cards
  en: 'A small, ageing population that cannot staff its own economy: about 3.88m people at end-2025, net migration of +19,180 only because 70.3% of arrivals were foreigners (17.0% of arrivals came from
    Germany, 11.1% each from Bosnia and Nepal), while 54.2% of emigrants were aged 20-39. A national-conservative coalition partner holds the Ministry of Demography and Emigration.'
  it: ''
- hash: b9057efb
  kind: cards
  en: 'Two voices in foreign policy. Milanovic was re-elected on 12 January 2025 with 74.9% over the HDZ''s Dragan Primorac and holds the constitutional say over deployments abroad: in 2024 he refused to
    authorise participation in NATO''s NSATU mission for Ukraine and the government''s bid to join the EU training mission fell four votes short of two-thirds; in 2026 he cancelled the Brdo-Brijuni summit
    against the government''s lower profile.'
  it: ''
- hash: 3c783246
  kind: cards
  en: 'Security is collective and financed by others: the Leopard order leans on EU SAFE loans (EUR 1.14bn of EUR 1.48bn), the JANAF lever over Serbia works only with US OFAC licences (the latest extended
    to 30 October 2026), and the US also supplies 67% of Croatia''s LNG imports. Zagreb''s best cards are held in Washington and Brussels.'
  it: ''
- hash: cf09f525
  kind: cards
  en: 'EU law and climate rules bind the energy-hub strategy: Brussels examined whether Croatia could lawfully take Russian crude at its port (February 2026) and critics, including EU officials, say the
    US-backed gas deal could clash with market rules and complicate Bosnia''s accession; MOL has reported JANAF to the Commission''s competition authority for abuse of dominance (4 March 2026).'
  it: ''
- hash: 3077701c
  kind: cards
  en: 'Border and sea questions parked, not solved: the 2017 Piran Bay arbitration award gave Slovenia most of the bay and a junction to the high seas, Croatia calls the process contaminated and the Sabor
    rejected it, and the two governments agreed in 2023 to keep the dispute out of daily politics; the Adriatic exclusive economic zones with Italy were completed only on 3 January 2026.'
  it: ''
- hash: 7ad9925e
  kind: cards
  en: 'A trade structure that leaves Croatia exposed: goods exports cover only about 56% of imports (deficit about EUR 20bn in 2025), Germany, Italy and Slovenia each supply 12-15% of imports, Hungary supplies
    7.1% (EUR 3.2bn), and Bosnia is the largest non-EU market at 10.8% of exports.'
  it: ''
- hash: f09c7b40
  kind: cards
  en: The deterrence it builds is the arms race it denies. Rafale, Leopard, Chunmoo and the Tirana declaration are meant to make Serbia think twice, and Belgrade answers by displaying Chinese CM-400AKG
    missiles and calling the declaration 'the greatest threat to Serbia'; Zagreb then writes to NATO about Serbia's new weapons while Plenkovic says Serbia could not use them against its neighbours and
    Milanovic says Croatia must buy what its neighbours already have. Analysts (Human Security Centre) judge the war risk 'very low' but the tension real - each side's purchase confirms the other's story.
  it: ''
- hash: 052a4041
  kind: cards
  en: The pipeline is a lever that Croatia does not hold. JANAF is the only crude route into Serbia and NIS is about 30% of its revenue, so closing it would hurt Serbia but also JANAF; when US sanctions
    on NIS took effect in October 2025 the flow stopped by American decision, and every restart since (January 2026 to 30 October 2026) rests on an OFAC licence. Croatia's leverage over Belgrade is borrowed
    from Washington and expires with the licence.
  it: ''
- hash: 1bfe1a9e
  kind: cards
  en: Blocking Belgrade's visit gives Belgrade the pulpit. Milanovic cancelled the Brdo-Brijuni summit - the regional forum Croatia co-chaired - because Vucic could not be received, and Vucic answered that
    laying flowers at Jasenovac mattered more to him than the summit; Croatia lost its own platform and Belgrade kept the memorial narrative, while Podgorica's Jasenovac resolution (2024) cost three Montenegrin
    officials their entry and Milanovic was in Cetinje by July 2026 seeking 'normal interlocutors'.
  it: ''
- hash: '87287808'
  kind: cards
  en: Protecting Croats in Bosnia depends on the principle that props up Dodik. Zagreb argues for equality of three constituent peoples and lobbied for the 2022 imposed election-law changes, but a settlement
    built on ethnic parity is also what lets Republika Srpska veto the state; Plenkovic waves off Dodik's secession threats as 'nothing new' and the HDZ BiH's win of the Croat seat in October 2026 on a
    record-low turnout shows how thin the consent is.
  it: ''
- hash: 3df1b374
  kind: cards
  en: Sanctions discipline costs it its closest oil partner. Zagreb refused in February 2026 to pass Russian Druzhba crude through JANAF to Hungary and Slovakia, with EU backing; MOL, co-owner of INA and
    JANAF's customer, answered by reporting JANAF to the Commission, and the INA-MOL stake dispute that 'constrains relations' is now being reopened only because Orban lost the April 2026 election and Magyar
    offered a 'new chapter' on 31 August.
  it: ''
- hash: d8914ab4
  kind: cards
  en: Whole-hearted on Ukraine in government, blocked in the presidency. The government has sent over EUR 300m of military aid since 2022 (Rutte, January 2026), swapped M-84 tanks for a German-funded Leopard
    order; Milanovic, who wants humanitarian aid only, vetoed Croatian officers for NATO's NSATU in 2024 and the government's EU training mission lost its two-thirds vote. Croatia buys the Western alignment
    abroad and cannot deploy it at home.
  it: ''
- hash: 197e93dd
  kind: cards
  en: 'Croatia plays the strategy of a small state that has solved its existential

    question - NATO and the EU - and is now spending the dividend. Its first

    objective is no longer to be admitted but to make Serbia''s rearmament and

    its own memory politics the neighbour''s problem: it deters from inside the

    Alliance, speaks to Belgrade in the voice of a member state (conditionality

    on the missing, a reported weapons purchase, a defence declaration with

    Tirana and Pristina) and keeps the instruments that are not its own - the

    US licence on JANAF, EU loans for tanks, the High Representative in

    Sarajevo - within reach. The Luttwakian pattern is that every lever is

    borrowed and every success invites the response it was meant to prevent:

    deterrence feeds Serbian rearmament, a refusal to receive Vucic hands him

    the memorial stage, discipline on Russian oil prices out a Hungarian

    partner it needs for INA. Domestically the strategy has two authors:

    Plenkovic, EU-centred, tied to a Homeland Movement coalition, and

    Milanovic, re-elected with 74.9%, who vetoes deployments and cancels

    summits; Belgrade reads the harder voice. Two signals that are not

    rows: Orban''s fall in April 2026 has changed the weather with Hungary

    overnight, and Serbia''s snap election of 25 October 2026 may reset a tone

    that Zagreb has so far refused to reset. Bosnia, where Zagreb''s kin are

    a constituent people dependent on imposed rules, is the arena in which

    its soft power is thinnest.'
  it: ''
- hash: e595699f
  kind: cards
  en: Get back an elected government. The Transitional Presidential Council, formed in April 2024 to hold power until an election or 7 February 2026, dissolved on that date with no presidential election
    held and no successor structure agreed. The prime minister, Alix Didier Fils-Aime, governs with the backing of Washington, which threatened 'serious consequences' against any move to oust him. No election
    date was found in sources.
  it: ''
- hash: 044359d2
  kind: cards
  en: Retake Port-au-Prince from the gang coalition Viv Ansanm with a foreign force, the Gang Suppression Force (GSF), authorised by the Security Council at up to 5,550 personnel. About 1,500 troops were
    in place when the mandate was renewed on 29 September 2026, and the Kenyan contingent is being replaced by Chadian troops.
  it: ''
- hash: f9985c9b
  kind: cards
  en: 'A foreign-manned force, not a Haitian one: the GSF works with the Haitian National Police and the Armed Forces of Haiti. Personnel were pledged by Kenya (until its exit), Chad, Jamaica, the Bahamas,
    Guyana, Barbados, Antigua and Barbuda, Bangladesh and Benin. Pledges are not deployments; the troops in place are about 1,500.'
  it: ''
- hash: 87af044d
  kind: cards
  en: Remittances. They are the primary source of foreign exchange, nearly 20% of GDP. Exports are agricultural (vetiver oil, bananas, cocoa, mangoes) with some light manufacturing, and the United States
    is the major trading partner, through the HOPE and HELP preference acts.
  it: ''
- hash: 53eacca9
  kind: cards
  en: No elected authority and no agreed successor since 7 February 2026. The Security Council's force depends on the Haitian state having a counterpart, and the US sanctions on five council members show
    how far Washington will go to keep the interim it chose.
  it: ''
- hash: 8c7c3d9b
  kind: cards
  en: 'The force is funded and staffed below plan and its contributors are leaving: Kenya brought its second contingent home in March 2026 and Chad is replacing it. Haiti''s own police cannot yet hold the
    ground the force takes.'
  it: ''
- hash: 788bb1f0
  kind: cards
  en: The foreign force that keeps the capital from falling to the gangs also keeps the Haitian police and army from being rebuilt, since the GSF is the security. When the contributors leave, the gap returns
    to the streets; the security bought from outside is what makes the interim survivable, and the interim is what should have built Haitian security.
  it: ''
- hash: a6773402
  kind: cards
  en: 'Haiti''s grand strategy is to get back an elected government and to retake Port-au-Prince, and it pays for both by renting its security from a UN-authorised foreign force (Kenya first, now Chad and
    others) and by living on remittances that tie it to its diaspora and to the United States. The transition ended on 7 February 2026 without an election or a successor, and the prime minister now governs
    on Washington''s backing, while the force holds about a quarter of its authorised strength and its own police are not yet rebuilt. Not verified for this card: cholera and famine, which were asked for
    as constraints but for which no source was reached within the budget, the CARICOM mediation, the OAS and UN positions beyond the mission, and the Dominican wall.'
  it: ''
- hash: f6584c5f
  kind: cards
  en: 'Turn the April 2026 mandate into money and a voice inside the EU: unlock the frozen EU funds (the Commission proposed on 23 Sep 2026 to release EUR 4.2bn of cohesion money and reopen Erasmus+ and
    Horizon Europe, Council vote due 13 Oct; about EUR 3.5bn in cohesion money still blocked over academic freedom, the child-protection law, asylum and social inclusion, and a EUR 10bn recovery-fund application
    under assessment) and close the Article 7 file that has run since 2018.'
  it: ''
