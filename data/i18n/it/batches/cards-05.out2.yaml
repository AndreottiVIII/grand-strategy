items:
- hash: e1daa86c
  it: |
    Mantenere il rapporto con Taipei, in essere dal 1933, come bene diplomatico che porta investimenti e denaro per le catene di fornitura. La prima visita di Stato del presidente Arevalo a Taipei nel giugno 2025 si è conclusa con documenti su investimenti, catene di fornitura, semiconduttori e consultazione politica.
- hash: 1bce624f
  it: |
    Mantenere Washington come partner che finanzia il controllo migratorio: accogliere deportati non guatemaltechi e aumentare i voli di rimpatrio del 40% in cambio di denaro e cooperazione in materia di sicurezza, come concordato con il Segretario di Stato Rubio nel febbraio 2025.
- hash: b4c02ab7
  it: |
    La migrazione come merce di scambio. Il Guatemala ha accettato nel febbraio 2025 di accogliere deportati non guatemaltechi dagli US. Guatemala e Honduras negano pubblicamente di aver firmato la versione dell'accordo descritta dal segretario del DHS Noem, quindi i termini scritti sono contestati.
- hash: c6107007
  it: |
    Taiwan come carta diplomatica: i rapporti risalgono al 1933 e Guatemala è, secondo la propria presentazione, lo Stato più antico a riconoscere ininterrottamente la Repubblica di Cina. La visita del giugno 2025 è stata accolta con gli onori militari completi, nell'anno dei 90 anni di rapporti.
- hash: 3ce16f83
  it: |
    Dipendenza dalle rimesse. Il Guatemala ha incassato rimesse per US$8,431 miliardi tra gennaio e aprile 2026, il 53,2% del totale dei tre Paesi del Northern Triangle. Da gennaio 2026 si applica una tassa US dell'1% sui trasferimenti effettuati in contanti, con vaglia postali o assegni circolari, quindi l'economia si regge su un corridoio che Washington può tassare.
- hash: b8e51201
  it: |
    Congresso, magistratura e procuratore generale. Wikipedia registra una forte opposizione al governo Arevalo da parte della magistratura, del Congresso e dell'establishment. Il procuratore generale resta in carica quattro anni e può essere rimosso solo in caso di condanna per un reato commesso durante l'incarico, quindi il procuratore capo non può essere destituito dal presidente.
- hash: b15b8567
  it: |
    L'accordo che compra la buona volontà di US fa di Mexico il vicino risentito. Il Guatemala ha ricevuto circa 2.300 messicani deportati da US nel 2026 e li ha trattenuti per meno di 24 ore; il ministero degli Esteri messicano si è opposto alla pratica, quindi il partner di confine ora protesta contro il Paese di transito.
- hash: 698a4e2a
  it: |
    Il Guatemala di Arevalo scambia servizi in materia migratoria con denaro e sicurezza da US, e tiene Taiwan come carta diplomatica che non ha ancora giocato con Beijing. La sua economia è fatta di rimesse, su un corridoio che Washington tassa e può irrigidire, quindi l'accordo sulle deportazioni è una leva che non può facilmente rifiutare. Il procuratore generale e i tribunali, protetti da rimozioni rapide, sono il vincolo che decide fin dove il presidente possa spingersi.
- hash: 8e10cfbf
  it: |
    Mantenere la linea arbitrale del 1899 e far confermare dalla ICJ. Venezuela rivendica l'Essequibo e respinge il lodo del 1899. Guyana ha presentato ricorso alla ICJ il 29 marzo 2018, e le udienze di merito si sono svolte dal 4 all'11 maggio 2026; la pagina della ICJ non indica ancora una data per la sentenza, e il governo di Guyana prevede una decisione già nel novembre 2026.
- hash: 3a371cdb
  it: |
    Trasformare il guadagno petrolifero inatteso in un fondo che finanzia lo sviluppo a ritmo costante. Il fondo sovrano è stato istituito nel 2019 e detiene tutte le entrate petrolifere; permette al governo di attingere denaro a un ritmo costante. Reuters calcola le entrate petrolifere della Guyana nel 2026 in circa USD 4,3 miliardi a USD 100 al barile, il 67% in più rispetto all'anno precedente.
- hash: cf16c4a8
  it: |
    La ICJ come leva giuridica. Guyana porta il confine davanti alla corte anziché alla forza. La corte ha indicato misure provvisorie il 1° dicembre 2023 contro i cambiamenti sul terreno e ha modificato il proprio ordine il 1° maggio 2025, dopo la seconda richiesta di Guyana del 6 marzo 2025.
- hash: d3a11715
  it: |
    Denaro petrolifero custodito in un fondo. La produzione supera i 900.000 barili al giorno dopo sette anni; il fondo detiene tutte le entrate petrolifere, e il GDP di Guyana è più che quadruplicato, fino a USD 27,5 miliardi tra il 2019 e il 2024 (dato della World Bank, come citato da Reuters).
- hash: '41897940'
  it: |
    L'operatore prende il primo petrolio. Un consorzio guidato da ExxonMobil controlla tutta la produzione petrolifera di Guyana e ne trattiene il 75% per recuperare i costi; la quota di profitto petrolifero spettante allo Stato è oggi il 12,5% e dovrebbe salire al 50% a recupero dei costi completato (Exxon ha dichiarato che potrebbe accadere nel 2026).
- hash: d0bf9c57
  it: |
    La rivendicazione è una politica di Stato a Caracas. Il referendum venezuelano del 2023 (3 dicembre 2023) chiedeva se creare uno Stato della Guayana Esequiba, e una legge del marzo 2024 ha designato l'Essequibo come nuovo Stato venezuelano. Nel maggio 2026 la leader venezuelana Delcy Rodriguez doveva difendere di persona la rivendicazione davanti alla corte.
- hash: 5b9eacbb
  it: |
    Il petrolio che finanzia la difesa del confine è ciò che rende il confine degno di essere contestato. Le licenze di perforazione concesse nel settembre 2023 dopo le scoperte offshore hanno innescato l'escalation del 2023; il guadagno, ora in crescita del 67%, dà a Guyana i mezzi per sostenere la causa e dà a Venezuela la ragione per premere.
- hash: 527eaca7
  it: |
    Guyana conduce la sua strategia su tre leve: la linea del 1899 sostenuta a The Hague, le entrate petrolifere custodite in un fondo e un operatore guidato da Exxon che porta la produzione. La sua debolezza è che lo stesso petrolio rende il territorio conteso degno di essere rivendicato, quindi ogni passo della sua crescita è anche un passo nella controversia con Venezuela. La sua forza è che una causa legale sostenuta da un fondo è lenta ma duratura, e i partner esterni (Brazil, United States, UK, CARICOM, China) non sono ancora valutati, perché le loro schede e fonti non sono state scritte.
- hash: b4dc2edf
  it: |
    Decidere la questione Taiwan: riesaminare gli accordi dell'era Castro con China, incluse le infrastrutture di telecomunicazioni di Huawei, e scegliere tra mantenere Beijing e ripristinare Taipei. Il presidente Asfura, in carica dal 27 gennaio 2026, ha ordinato il riesame; entro ottobre 2026 non è stata trovata alcuna decisione.
- hash: 8624d2c2
  it: |
    Proteggere il rapporto con United States, da cui dipendono rimesse, TPS e posti di lavoro nelle maquila. Asfura dice di doverlo proteggere e che un ritorno a Taiwan è 'not as simple as flipping a switch'.
- hash: 9c73a112
  it: |
    Un riesame degli accordi dell'era Castro con China, incluse le infrastrutture di telecomunicazioni di Huawei, ordinato dal governo. Il suo esito non è stato trovato entro ottobre 2026.
- hash: c9c04483
  it: |
    Legami economici con United States: rimesse, TPS e posti di lavoro nelle maquila. Asfura li indica come la ragione per cui un passaggio a Taiwan non può avvenire rapidamente.
- hash: d255d306
  it: |
    Il riesame che corteggia gli investimenti US esamina accordi cinesi ancora in corso, quindi la mossa pensata per legare più strettamente Honduras a Washington può costare i progetti finanziati da China da cui il Paese dipende ancora. Lettura nostra della presentazione di Bloomberg, confidenza C.
- hash: 2483fc97
  it: |
    Honduras è partner sia di Washington sia di Beijing senza allinearsi con nessuna delle due, e da gennaio 2026 il nuovo presidente ha riesaminato il passaggio alla China del marzo 2023 senza invertirlo. La questione Taiwan è aperta: un ritorno a Taipei annullerebbe quel passaggio, e Asfura dice che il legame con US, con le sue rimesse, TPS e posti di lavoro nelle maquila, viene prima. Il paradosso sta nel riesame stesso, che corteggia gli investimenti US esaminando gli accordi cinesi ancora in vigore, quindi il controllo su Beijing può costare i progetti che rendono Honduras degna di essere corteggiata.
- hash: c829ae9f
  it: |
    Dissuadere Serbia dall'interno della NATO e della EU, e costruire i mezzi nazionali per farlo: la spesa per la difesa, pari al 2,08% del GDP nel 2025, dovrà salire al 2,5% nel 2027, con 12 Rafale F3-R usati già consegnati, 44 carri Leopard 2A8 ordinati nel dicembre 2025 (consegne 2028-30) e circa EUR 700 milioni di nuovi acquisti annunciati il 4 settembre 2026 (18 lanciatori Chunmoo sudcoreani). Zagreb nega una corsa agli armamenti, ma considera il riarmo serbo (missili cinesi CM-400AKG confermati nel marzo 2026) un rischio da segnalare all'Alleanza.
- hash: 5a4dcef4
  it: |
    Stare nel cuore della EU e presentarla come progetto nazionale: l'euro e Schengen dal 1° gennaio 2023 (sono cessati i controlli interni alle frontiere terrestri), un'assegnazione di EUR 1,7 miliardi nell'ambito dei prestiti per la difesa SAFE della EU, il 66% delle esportazioni di merci e il 77% delle importazioni di merci con partner EU; Plenkovic chiede inoltre a Washington sostegno all'adesione all'OECD.
- hash: 50622d15
  it: |
    Diventare l'hub energetico dell'Europa sud-orientale e centrale, con il sostegno di Washington: il terminale GNL di Krk (prenotato interamente fino al 2036; capacità massima di rigassificazione fisica aumentata da 3,9 a 6,1 miliardi di metri cubi l'anno nel 2026), l'oleodotto JANAF (greggio non russo per MOL e, con licenza US, per NIS della Serbia) e la Southern Interconnection verso la Bosnia. L'accordo US firmato a Dubrovnik il 29 aprile 2026 inserisce l'hub nella catena di approvvigionamento del gas americano.
- hash: a1a0c3b6
  it: |
    Mantenere politicamente uniti i croati di Bosnia and Herzegovina all'interno di uno Stato che sopravviva: parità di status per il popolo costitutivo croato (le modifiche della legge elettorale del 2022 imposte dall'High Representative, sostenute da Zagreb; la vittoria di Darijana Filipovic dell'HDZ BiH per il seggio croato alla presidenza nelle elezioni del 4 ottobre 2026, sulla base dei risultati preliminari), BiH sulla via della EU e della NATO, e il gasdotto verso Herzegovina. Zagreb sostiene l'integrità territoriale della Bosnia.
- hash: 99fc744f
  it: |
    Subordinare la strada della Serbia verso la EU all'eredità della guerra e contestare la politica della memoria di Belgrade: 1.725 persone ancora scomparse dalla guerra del 1991-95, nessuna cooperazione sugli archivi serbi, Jasenovac e Vukovar come terreno morale, e nessun palcoscenico in Croatia per Aleksandar Vucic. Il governo Plenkovic mantiene un tono freddo ma nega qualsiasi alleanza militare contro la Serbia; il presidente Milanovic ha annullato il vertice Brdo-Brijuni piuttosto che ricevere Vucic.
- hash: 32b95d4c
  it: |
    Proteggere un'economia che vive di una sola stagione e di manodopera importata: 21,8 milioni di arrivi turistici e un record di 110,1 milioni di pernottamenti nel 2025, una popolazione di circa 3,88 milioni sostenuta solo dai lavoratori stranieri (56.665 arrivi contro 37.485 partenze nel 2025, di cui il 70,3% degli immigrati erano cittadini stranieri), e un commercio di merci che copre solo il 56% delle importazioni.
- hash: 5c34994a
  it: |
    Seggi nella EU e nella NATO usati come leva sui vicini: la linea secondo cui Serbia non può chiudere l'adesione senza risolvere la questione delle persone scomparse (ministro dei Veterani Medved), la dichiarazione di persona non grata del luglio 2024 nei confronti di tre funzionari montenegrini per la risoluzione su Jasenovac, le pressioni del Consiglio dei ministri per la legge elettorale bosniaca e la dichiarazione di difesa del marzo 2025 con Albania e Kosovo, che dice a Belgrade 'the time of asking permission is over'.
- hash: 2c5629cb
  it: |
    Un riarmo rapido, di fornitura occidentale e in parte finanziato dalla EU: 12 Rafale F3-R usati (circa EUR 1,14 miliardi, ultimi consegnati nel 2025), 44 Leopard 2A8 per EUR 1,48 miliardi (di cui EUR 1,14 miliardi dai prestiti SAFE e EUR 144,8 milioni accreditati da Berlin per carri armati e veicoli da combattimento che Croatia ha ceduto a Ukraine), e da settembre 2026 18 lanciatori Chunmoo con gittata superiore a 300 km.
- hash: 021ca962
  it: |
    Controllo della porta adriatica: GNL di Krk (prenotato interamente fino al 2036, con società ungheresi tra i clienti), l'oleodotto Adria gestito da JANAF (unica rotta di greggio della raffineria serba e fornitura non russa per MOL in Hungary e Slovakia), e la Southern Interconnection verso la Bosnia, realizzata con il sostegno US (circa EUR 1,5 miliardi, firmata a Dubrovnik nell'aprile 2026).
- hash: a62c41c8
  it: |
    Il registro della memoria: Vukovar, gli scomparsi, Jasenovac come luogo conteso (Croatia insiste che ogni visita serba sia ufficiale e reciproca) e la replica alla formula di Belgrade 'greatest threat' - la linea di Plenkovic è che Croatia 'does not interfere in Serbia's internal affairs and does not form a military alliance against it'.
- hash: 0791ca65
  it: |
    I fondi EU e l'euro come ammortizzatori: appartenenza a Schengen e all'euro dal 2023, prestiti SAFE (EUR 1,7 miliardi), infrastrutture promosse dalla EU come il ponte di Pelješac (realizzato dalla società statale cinese CRBC, appaltato nel 2018) e un'economia turistica aperta (21,8 milioni di arrivi nel 2025).
- hash: ae336523
  it: |
    Una popolazione piccola e invecchiata che non riesce a fornire personale alla propria economia: circa 3,88 milioni di persone a fine 2025, con un saldo migratorio netto di +19.180 solo perché il 70,3% degli arrivi erano stranieri (il 17,0% degli arrivi proveniva da Germany, l'11,1% ciascuno da Bosnia e Nepal), mentre il 54,2% degli emigrati aveva tra i 20 e i 39 anni. Un partner della coalizione nazional-conservatrice detiene il ministero della Demografia e dell'Emigrazione.
- hash: b9057efb
  it: |
    Due voci in politica estera. Milanovic è stato rieletto il 12 gennaio 2025 con il 74,9% contro Dragan Primorac dell'HDZ e ha la parola costituzionale sulle missioni all'estero: nel 2024 ha rifiutato di autorizzare la partecipazione alla missione NSATU della NATO per Ukraine, e la richiesta del governo di partecipare alla missione di addestramento della EU è mancata di quattro voti la soglia dei due terzi; nel 2026 ha annullato il vertice Brdo-Brijuni, in contrasto con la linea più bassa del governo.
- hash: 3c783246
  it: |
    La sicurezza è collettiva e finanziata da altri: l'ordine di Leopard si appoggia ai prestiti SAFE della EU (EUR 1,14 miliardi su EUR 1,48 miliardi), la leva JANAF su Serbia funziona solo con le licenze OFAC US (l'ultima prorogata al 30 ottobre 2026), e US fornisce anche il 67% delle importazioni di GNL di Croatia. Le carte migliori di Zagreb sono in mano a Washington e Brussels.
- hash: cf09f525
  it: |
    Il diritto della EU e le regole climatiche vincolano la strategia di hub energetico: Brussels ha esaminato se Croatia potesse legalmente accogliere greggio russo nel proprio porto (febbraio 2026), e i critici, compresi funzionari della EU, sostengono che l'accordo sul gas sostenuto da US potrebbe scontrarsi con le regole di mercato e complicare l'adesione della Bosnia; MOL ha segnalato JANAF all'autorità antitrust della Commission per abuso di posizione dominante (4 marzo 2026).
- hash: 3077701c
  it: |
    Questioni di confine e di mare accantonate, non risolte: il lodo arbitrale del 2017 sulla Piran Bay ha assegnato alla Slovenia gran parte della baia e un accesso all'alto mare, la Croatia lo definisce un processo contaminato e il Sabor lo ha respinto, e i due governi hanno concordato nel 2023 di tenere la disputa fuori dalla politica quotidiana; le EEZ adriatiche con Italy sono state completate solo il 3 gennaio 2026.
- hash: 7ad9925e
  it: |
    Una struttura commerciale che lascia Croatia esposta: le esportazioni di merci coprono solo circa il 56% delle importazioni (disavanzo di circa EUR 20 miliardi nel 2025), Germany, Italy e Slovenia forniscono ciascuna il 12-15% delle importazioni, Hungary fornisce il 7,1% (EUR 3,2 miliardi), e Bosnia è il più grande mercato extra-EU con il 10,8% delle esportazioni.
- hash: f09c7b40
  it: |
    La deterrenza che costruisce è la corsa agli armamenti che nega. Rafale, Leopard, Chunmoo e la dichiarazione di Tirana dovrebbero far riflettere la Serbia, e Belgrade risponde mostrando i missili cinesi CM-400AKG e definendo la dichiarazione 'the greatest threat to Serbia'; Zagreb scrive poi alla NATO sulle nuove armi serbe, mentre Plenkovic dice che la Serbia non potrebbe usarle contro i vicini e Milanovic dice che la Croatia deve acquistare ciò che i vicini già possiedono. Gli analisti (Human Security Centre) giudicano il rischio di guerra 'very low' ma la tensione reale: l'acquisto di ciascuna parte conferma la storia dell'altra.
- hash: 052a4041
  it: |
    L'oleodotto è una leva che Croatia non detiene. JANAF è l'unica rotta del greggio verso la Serbia e NIS rappresenta circa il 30% dei suoi ricavi, quindi chiuderlo danneggerebbe la Serbia ma anche JANAF; quando le sanzioni US su NIS sono entrate in vigore nell'ottobre 2025, il flusso si è fermato per decisione americana, e ogni ripartenza da allora (da gennaio 2026 al 30 ottobre 2026) si basa su una licenza OFAC. La leva della Croatia su Belgrade è presa in prestito da Washington e scade con la licenza.
- hash: 1bfe1a9e
  it: |
    Bloccare la visita di Belgrade regala a Belgrade il palcoscenico. Milanovic ha annullato il vertice Brdo-Brijuni, il forum regionale co-presieduto da Croatia, perché Vucic non poteva essere ricevuto, e Vucic ha risposto che deporre fiori a Jasenovac gli importava più del vertice; Croatia ha perso la propria piattaforma e Belgrade ha conservato la narrazione della memoria, mentre la risoluzione di Podgorica su Jasenovac (2024) ha loro precluso l'ingresso per tre funzionari montenegrini, e Milanovic era a Cetinje entro luglio 2026 alla ricerca di 'normal interlocutors'.
- hash: '87287808'
  it: |
    Proteggere i croati in Bosnia dipende dal principio che sostiene Dodik. Zagreb sostiene la parità dei tre popoli costitutivi e ha fatto pressione per le modifiche della legge elettorale del 2022 imposte, ma un assetto fondato sulla parità etnica è anche ciò che permette alla Republika Srpska di porre il veto sullo Stato; Plenkovic liquida le minacce di secessione di Dodik come 'nothing new', e la vittoria dell'HDZ BiH nel seggio croato dell'ottobre 2026, con un'affluenza minima storica, mostra quanto sia fragile il consenso.
- hash: 3df1b374
  it: |
    La disciplina sulle sanzioni le costa il suo partner petrolifero più stretto. Zagreb ha rifiutato nel febbraio 2026 di far passare il greggio russo Druzhba attraverso JANAF verso Hungary e Slovakia, con il sostegno della EU; MOL, comproprietaria di INA e cliente di JANAF, ha risposto segnalando JANAF alla Commission, e la controversia sulla partecipazione INA-MOL che 'constrains relations' viene riaperta ora solo perché Orban ha perso le elezioni dell'aprile 2026 e Magyar ha offerto un 'new chapter' il 31 agosto.
- hash: d8914ab4
  it: |
    Piena adesione all'Ukraine nel governo, bloccata alla presidenza. Il governo ha inviato più di EUR 300 milioni di aiuti militari dal 2022 (Rutte, gennaio 2026), e ha scambiato carri M-84 con un ordine di Leopard finanziato dalla Germania; Milanovic, che vuole solo aiuti umanitari, ha posto il veto a ufficiali croati per la NSATU della NATO nel 2024, e la missione di addestramento della EU del governo ha perso il voto dei due terzi. Croatia acquista all'estero l'allineamento occidentale e non riesce a schierarlo in patria.
- hash: 197e93dd
  it: |
    Croatia adotta la strategia di uno Stato piccolo che ha risolto la sua questione esistenziale - NATO e EU - e ora spende il dividendo. Il suo primo obiettivo non è più essere ammessa, ma fare in modo che il riarmo della Serbia e la sua stessa politica della memoria diventino un problema per il vicino: dissuade dall'interno dell'Alleanza, parla a Belgrade con la voce di uno Stato membro (condizionalità sulle persone scomparse, un acquisto di armi annunciato, una dichiarazione di difesa con Tirana e Pristina) e tiene a portata di mano gli strumenti che non sono suoi - la licenza US su JANAF, i prestiti EU per i carri armati, l'High Representative a Sarajevo. Lo schema luttwakiano è che ogni leva è presa in prestito e ogni successo invita la risposta che avrebbe dovuto prevenire: la deterrenza alimenta il riarmo serbo, il rifiuto di ricevere Vucic gli consegna il palcoscenico della memoria, la disciplina sul petrolio russo allontana un partner ungherese di cui ha bisogno per INA. Sul piano interno la strategia ha due autori: Plenkovic, orientato alla EU, legato a una coalizione con il Homeland Movement, e Milanovic, rieletto con il 74,9%, che pone il veto sulle missioni e annulla i vertici; Belgrade legge la voce più dura. Due segnali che non sono righe: la caduta di Orban nell'aprile 2026 ha cambiato il clima con Hungary in una notte, e le elezioni anticipate serbe del 25 ottobre 2026 possono ripristinare un tono che Zagreb finora ha rifiutato di ripristinare. Bosnia, dove la parentela di Zagreb è un popolo costitutivo che dipende da regole imposte, è l'arena in cui il suo soft power è più debole.
- hash: e595699f
  it: |
    Ripristinare un governo eletto. Il Transitional Presidential Council, costituito nell'aprile 2024 per detenere il potere fino a un'elezione o al 7 febbraio 2026, si è sciolto in quella data senza che si tenesse alcuna elezione presidenziale e senza che si concordasse una struttura successiva. Il primo ministro, Alix Didier Fils-Aime, governa con il sostegno di Washington, che ha minacciato 'serious consequences' contro qualsiasi tentativo di rimuoverlo. Nelle fonti non è stata trovata alcuna data per le elezioni.
- hash: 044359d2
  it: |
    Riprendere Port-au-Prince dalla coalizione di bande Viv Ansanm con una forza straniera, la Gang Suppression Force (GSF), autorizzata dal Consiglio di sicurezza fino a 5.550 effettivi. Circa 1.500 militari erano in posizione quando il mandato è stato rinnovato il 29 settembre 2026, e il contingente keniota viene sostituito da truppe ciadiane.
- hash: f9985c9b
  it: |
    Una forza con personale straniero, non haitiano: la GSF lavora con la Haitian National Police e le Armed Forces of Haiti. Il personale è stato promesso da Kenya (fino al suo ritiro), Chad, Jamaica, Bahamas, Guyana, Barbados, Antigua and Barbuda, Bangladesh e Benin. Le promesse non sono schieramenti: le truppe presenti sono circa 1.500.
- hash: 87af044d
  it: |
    Rimesse. Sono la principale fonte di valuta estera, quasi il 20% del GDP. Le esportazioni sono agricole (olio di vetiver, banane, cacao, mango) con una certa manifattura leggera, e United States è il principale partner commerciale, attraverso gli atti preferenziali HOPE e HELP.
- hash: 53eacca9
  it: |
    Nessuna autorità eletta e nessun successore concordato dal 7 febbraio 2026. La forza del Consiglio di sicurezza dipende dal fatto che lo Stato haitiano abbia un interlocutore, e le sanzioni US contro cinque membri del Consiglio mostrano fino a dove Washington è disposta ad andare per mantenere l'interim che ha scelto.
- hash: 8c7c3d9b
  it: |
    La forza è finanziata e dotata di personale al di sotto dei piani, e i suoi contributori stanno uscendo: Kenya ha riportato a casa il suo secondo contingente nel marzo 2026 e Chad lo sta sostituendo. La polizia haitiana non è ancora in grado di tenere il terreno che la forza conquista.
- hash: 788bb1f0
  it: |
    La forza straniera che impedisce alla capitale di cadere nelle mani delle bande impedisce anche di ricostruire la polizia e l'esercito haitiani, dato che la GSF di fatto è la sicurezza. Quando i contributori se ne andranno, il vuoto torna nelle strade; la sicurezza acquistata dall'esterno è ciò che rende sostenibile l'interim, e l'interim è ciò che avrebbe dovuto costruire la sicurezza haitiana.
- hash: a6773402
  it: |
    La grand strategy di Haiti è riottenere un governo eletto e riprendere Port-au-Prince, e finanzia entrambi affittando la propria sicurezza a una forza straniera autorizzata dalle UN (prima Kenya, ora Chad e altri) e vivendo di rimesse che la legano alla sua diaspora e a United States. La transizione si è conclusa il 7 febbraio 2026 senza elezioni né successore, e il primo ministro ora governa con il sostegno di Washington, mentre la forza ha circa un quarto del proprio organico autorizzato e la polizia non è ancora ricostruita. Non verificati per questa scheda: colera e carestia, richiesti come vincoli ma per i quali non è stata raggiunta alcuna fonte entro il budget, la mediazione CARICOM, le posizioni dell'OAS e delle UN oltre la missione, e il muro dominicano.
- hash: f6584c5f
  it: |
    Trasformare il mandato dell'aprile 2026 in denaro e in una voce all'interno della EU: sbloccare i fondi EU congelati (la Commission ha proposto il 23 set 2026 di sbloccare EUR 4,2 miliardi di fondi di coesione e di riaprire Erasmus+ e Horizon Europe, con voto del Consiglio previsto per il 13 ott; circa EUR 3,5 miliardi di fondi di coesione restano bloccati per libertà accademica, legge sulla tutela dell'infanzia, asilo e inclusione sociale, e una domanda da EUR 10 miliardi per il fondo per la ripresa è in fase di valutazione) e chiudere la procedura ex articolo 7 aperta dal 2018.
