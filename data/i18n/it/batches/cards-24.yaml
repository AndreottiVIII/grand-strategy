# Translate every `en` into it. Write the translations to the file cards-24.out.yaml next to this one,
# as `items:` of `- hash: <same hash>` / `it: <translation>`, appending one item at a time (valid YAML at
# every step), never editing this file. Keep names, dates, numbers and quotes; register of a foreign-office
# brief: dry, precise, no flourish.
lang: it
items:
- hash: 2caae303
  kind: cards
  en: 'Self-restraint as signal: the border loudspeakers silenced on 11 Jun 2025 and dismantled in August, a ban on leaflets and balloons, official regret to Pyongyang for civilian drone flights (Feb 2026),
    the ''respect the North''s system, no absorption'' formula of the Unification Ministry, and a Freedom Shield 2026 with less than half the field exercises of 2025.'
  it: ''
- hash: 581ecc71
  kind: cards
  en: 'A conventional deterrent bought at home and a nuclear one rented from Washington: 28,500 US troops (a statutory floor in the FY2026 NDAA), combined command with US wartime control, a defence minister''s
    roadmap (26 May 2026) for a domestically built nuclear-powered submarine in the mid-2030s, rules of engagement of warning shots for each MDL crossing, and a pledge to buy USD 25bn of US weapons.'
  it: ''
- hash: 63ea2829
  kind: cards
  en: 'Capital and industry as currency: the USD 350bn Korea-US Strategic Investment Corp (launched June 2026; first projects announced 30 Sep: a Texas gas plant of USD 22.3bn, a nuclear framework of up
    to USD 120bn, Alaska LNG pending), the semiconductor boom (USD 173.4bn of chips in 2025, 41% of exports in January-August 2026), arms and reactor exports, and energy diversification away from the Gulf
    after the Hormuz disruption.'
  it: ''
- hash: 506d7562
  kind: cards
  en: The guarantor sets the terms. Wartime operational control is still American, the troop floor holds only by an NDAA clause that the Pentagon can lift after 60 days with a report, and the US pushes
    'strategic flexibility' (forces able to act against China) as part of 'alliance modernisation'. USFK Patriot assets were moved to the Middle East in early 2026 over Seoul's objections.
  it: ''
- hash: 0c0f4205
  kind: cards
  en: 'Tariff leverage that does not expire: a 15% ceiling in exchange for USD 350bn, with Trump threatening 25% again in January 2026 and before the first investment projects in September, and Washington
    asking for projects above the agreed total.'
  it: ''
- hash: f53d45ec
  kind: cards
  en: 'China can hurt in return, and has shown how: the post-THAAD hallyu restrictions still stand unofficially (concerts barred), Beijing sanctioned five US units of Hanwha Ocean on 14 Oct 2025 for helping
    US shipbuilding, and China remains the largest single export market (USD 130.8bn in 2025).'
  it: ''
- hash: caf53ca5
  kind: cards
  en: 'An adversary that has stopped talking: Pyongyang rejects every offer, wrote ''hostile states'' into its practice (Ninth Party Congress, February 2026; revised constitution, March 2026), and is fortifying
    the line itself - mines laid south of the border a year ago, about 20 MDL crossings in August and 30 in September 2026, a mine blast on 21 Sep that hurt three South Korean soldiers.'
  it: ''
- hash: af8872a0
  kind: cards
  en: Energy and a shrinking base. About 61% of crude imports depended on the Strait of Hormuz when the Iran war closed it in spring 2026 (110 million barrels bought elsewhere for April-May); and a fertility
    rate of 0.80 in 2025 (births 254,300, deaths 363,400, natural decline 108,900) will shrink the conscript pool and the tax base for the very defence bill Washington wants raised.
  it: ''
- hash: 42691ffb
  kind: cards
  en: 'A divided home front and legal brakes: approval 35-37% in October 2026 with the Democratic Party at its lowest since taking office, the opposition holding Seoul after the June local elections, a
    statutory ban on lethal aid to countries at war, and a 123 Agreement that bars Washington-origin material from military use.'
  it: ''
- hash: cdbf2215
  kind: cards
  en: The ally that pays for its own guarantor weakens what it buys. Seoul pledged USD 350bn of investment, USD 25bn of US arms and USD 33bn of support for US forces to keep tariffs at 15% and the troops
    in place; each payment turns the guarantee into a priced service, and the nuclear-submarine and enrichment quest is a hedge that tells Washington (and Pyongyang) that Seoul does not fully trust the
    product.
  it: ''
- hash: 2b9f113f
  kind: cards
  en: 'Reassuring the North loosens the deterrent that restrains it. Seoul cut its own 2026 field exercises to 22 from 51, Trump then ordered Ulchi Freedom Shield ended a week early to court Kim - and Pyongyang
    answered by fortifying the line and crossing it. The more Seoul disarms the rhetoric, the more Washington can bargain over its head: columnists expect Kim to prefer talks with the US to talks with the
    South.'
  it: ''
- hash: f51e1000
  kind: cards
  en: The best arms market is made by the war that arms the enemy. Poland, Romania and the Baltic buyers are rearming because of Russia's war on Ukraine (Poland took 47% of its imports from Korea in 2021-25),
    while that same war produced the Russia-North Korea alliance, 11,000-14,000 North Korean troops in Russia and the technology payments that threaten Seoul. Meanwhile Seoul's ban on lethal aid keeps it
    out of the war that feeds its order books, and its dispute with Kyiv over the North Korean prisoners (Oct 2026) has now cost goodwill on both sides.
  it: ''
- hash: 29e7d47e
  kind: cards
  en: 'Indispensability invites coercion. Chips rose from 21% of exports (2024) to about 41% (January-August 2026), which gives Seoul leverage over Washington and Beijing and also concentrates the risk:
    the more memory chips the world needs from Korea, the more Washington asks for onshoring and tariff-for-investment swaps, and the more Beijing punishes the shipyards that serve American strategy.'
  it: ''
- hash: dcb7d1ec
  kind: cards
  en: Balancing needs an equidistance the alliance does not allow. Lee says he will not take sides in the China-Japan quarrel over Taiwan and Wang Yi told Seoul on 19-20 Aug 2026 to show 'genuine strategic
    autonomy'; but Washington's 'strategic flexibility' for USFK and the shipbuilding partnership (MASGA) tie Korean industry to the very rivalry Seoul wants to stay out of, and Beijing has already priced
    that choice.
  it: ''
- hash: e352a3d0
  kind: cards
  en: 'South Korea is a middle power that has turned itself into something every

    great power needs - memory chips, shipyards, reactors, howitzers - and has

    then discovered that being needed is not the same as being secure. Luttwak''s

    reading is of an alliance that pays for its own guarantor: the 1953 treaty

    and 28,500 soldiers remain the fact on which everything rests, but since

    2025 the guarantor sets a price in tariffs, investment pledges, weapons

    purchases and support payments, cuts the allied exercises on its own

    initiative to court the adversary, and moves air-defence batteries to another

    theatre. Seoul answers with the only strategic move open to a rich dependent:

    make itself more useful (MASGA, the USD 350bn fund) and more autonomous

    (nuclear submarines, enrichment, wartime control) at once, which are

    contradictory signals to a guarantor. On the other front stands a deterrence

    facing an adversary that has stopped talking: Pyongyang has replaced hostility

    to be negotiated with a border to be built, with Russian money and combat

    experience behind it, and Lee''s outreach - loudspeakers off, regret for drones,

    a proposal to end the war - meets a wall of mines and silence. The restoration

    of ties with China and Japan in 2026 is the third leg: a hedge, not an

    alignment, and the one that Beijing''s own Wang Yi describes as ''strategic

    autonomy''. Signals that do not fit a row: Putin''s January 2026 wish to

    ''restore ties'' and Seoul''s ambassador at Vladivostok, while the Hyundai

    option on its St Petersburg plant lapsed; and the disclosure of two North

    Korean prisoners transferred from Ukraine, which turned Kyiv from a cause into

    a quarrel in September-October 2026.'
  it: ''
- hash: de3479af
  kind: cards
  en: 'Keep the ruling family in control and the succession orderly by governing without the National Assembly: the Emir dissolved parliament on 15 Feb 2024, suspended it and seven articles of the 1962
    constitution on 10 May 2024 for up to four years (a restoration window to May 2028), and the Emir and the government now exercise legislative power by decree. The citizenship campaign (a December 2024
    law allowing revocation for ''moral turpitude'' or acts threatening state security; about 42,000 revoked in six months by March 2025, at least 50,000 by December 2025 on Middle East Eye''s count, campaigners
    say up to 200,000) is part of the same project: narrowing the body of citizens who share the welfare state.'
  it: ''
- hash: 5414fcef
  kind: cards
  en: Defend the territory and the infrastructure against Iran and Iraq. Since 28 Feb 2026 Kuwait has been struck by hundreds of Iranian missiles and drones (airport, Mina al-Ahmadi refinery, power and
    desalination plants, ports, US bases); on 9 Mar 2026 the Emir called it an unprovoked attack by a neighbouring Muslim state, said Kuwait had allowed no use of its land, airspace or waters against it
    and asserted the right of proportionate self-defence. On the other flank Iraq filed new maritime coordinates at the UN in January-February 2026 that Kuwait and the Gulf states reject.
  it: ''
- hash: 43caa930
  kind: cards
  en: 'Keep the United States as the guarantor of last resort while building a second layer of security partners: the Pakistan defence cooperation agreement (signed 11 Jun 2023, ratified late July 2026)
    is explicitly a framework with no obligation to defend Kuwait, a Joint Defence Committee with India held its inaugural meeting in August 2026, and the UK sent a Rapid Sentry air-defence battery in the
    2026 war. AGSI: officials know no other power can replace Washington.'
  it: ''
- hash: 5813e951
  kind: cards
  en: 'Keep the oil state solvent and diversify it: oil is about 90% of government revenue and nearly all crude, products and condensate leave through Hormuz; output fell to 580,000 b/d in May 2026 and
    recovered to about 1.97 mb/d in July. The tools are the March 2025 debt law (KD30bn, about USD 97bn, bonds up to fifty years), the revised Vision 2035 (a northern Gulf gateway around Mubarak Al-Kabeer
    port and Silk City), foreign capital (a USD 16bn KKR-Kuwait Oil Company deal in July 2026) and the Kuwait Investment Authority (assets estimated at USD 1 trillion). The IMF expects a 0.6% contraction
    in 2026.'
  it: ''
- hash: 7cd93d35
  kind: cards
  en: 'Hold the maritime north and the shared resource zone: the Khor Abdullah median line under UNSC Resolution 833, the Fasht al-Qaid and Fasht al-Aij shoals, Bubiyan Island and the Chinese-built Mubarak
    Al-Kabeer port against Iraq, and, with Saudi Arabia, exclusive rights to the Durra gas field in the divided Neutral Zone against Iran''s Arash claim (Kuwait''s oil minister said in July 2023 that drilling
    would proceed without waiting for an Iranian agreement).'
  it: ''
- hash: 9419b542
  kind: cards
  en: 'Keep the Arab-cause credentials that legitimise the dynasty and are the cheapest source of soft power: no normalisation with Israel until a Palestinian state exists (the foreign minister, 29-30 Oct
    2023), development finance through the Kuwait Fund (founded 1961, the first aid agency created by a developing country), and the habit of mediating inside the GCC (chief mediator of the 2017 Qatar crisis).'
  it: ''
- hash: 06af002e
  kind: cards
  en: 'Gulf solidarity as the first reflex: summoning Iraq''s chargé over the maritime submission (21 Feb 2026) and collecting statements from Riyadh, Doha, Abu Dhabi, Manama, Muscat, Amman and the GCC
    Secretary-General; on 12 Oct 2026 the Foreign Ministry declared Saudi security part of Kuwait''s own and the GCC''s after Houthi strikes on Riyadh and Dammam airports. The Emir''s formula, ''GCC security
    is indivisible'', is used to turn a national grievance into a collective one.'
  it: ''
- hash: 00e04523
  kind: cards
  en: Air and missile defence on its own soil (28 drones dealt with on 8 Apr 2026 alone; 26 aerial threats intercepted on 29 Mar), the National Guard, and a host-nation role for roughly the largest US ground
    presence in the region (Camp Arifjan, Camp Buehring, Ali Al Salem, Port Shuaiba; the Wikipedia index says over 14,000 personnel, which we mark as unconfirmed). Kuwait also reportedly struck Iran-backed
    Iraqi militias from its territory in April 2026 and captured four IRGC men on Bubiyan on 1 May 2026.
  it: ''
- hash: dc7a2585
  kind: cards
  en: 'Sovereign money and borrowing: the Kuwait Investment Authority (a USD 4.5bn syndicated loan in August 2026), a USD 6bn bond in July 2026 with strong demand, the KD30bn borrowing ceiling set by decree
    in March 2025, and the Kuwait Fund (grants and loans, for example USD 89m to Jordan in 2020). Storage in Asia is the hedge against Hormuz: Kuwait Petroleum Corporation holds up to 3.1m barrels at Kiire
    (Japan) and 4m at Ulsan (South Korea) against exports of about 1.4 mb/d to Asia in 2025.'
  it: ''
- hash: 2e1b5e59
  kind: cards
  en: 'The state defines the story at home: the interior minister, who chairs the committee that reviews nationality cases, told Alrai TV in March 2025 that Kuwait had been ''hijacked'' by other nationalities,
    names of the stripped are published weekly (the government stopped regular announcements of totals in September 2025), and the war is told through KUNA and the defence and interior ministries'' communiques
    on interceptions and damage.'
  it: ''
- hash: 18c51baf
  kind: cards
  en: 'Geography: Hormuz is the only outlet for nearly all of Kuwait''s oil, storage is limited, the northern end of the Gulf is shared with Iraq and Iran, and the bypass options (an expanded Saudi pipeline,
    routes through Syria and Lebanon) are costly, slow or politically unrealistic (energy cooperation with Iraq).'
  it: ''
- hash: 8d167893
  kind: cards
  en: 'Demography: Kuwaitis are 31.7% of about 4.82 million residents (end of 2023); India supplies 21% of residents, Egypt 13%, Bangladesh 6%, the Philippines 5%. The state depends on foreign labour it
    cannot replace and on governments (Manila, Delhi, Cairo) that protest when it is mistreated.'
  it: ''
- hash: 10ffeaf1
  kind: cards
  en: 'Revenue: oil is about 90% of government revenue before investment income; the IMF expects the economy to contract 0.6% in 2026 and the government has increased borrowing and told ministries to cut
    spending.'
  it: ''
- hash: 35b1414c
  kind: cards
  en: 'Security is borrowed: Kuwait has neither the weight to deter Iran nor the depth to defend its infrastructure (the 1 Mar 2026 strike at Port Shuaiba killed six US soldiers; friendly fire downed three
    US F-15Es on 2 Mar), and the Pakistani and Indian arrangements add no guarantee.'
  it: ''
- hash: d83302ba
  kind: cards
  en: 'A suspended assembly is a political-risk discount: the Emir bypassed a parliament that had blocked the debt law, but AGSI expects the assembly to return as a factor in economic policy, and the constitutional
    review committee promised for November 2024 had not been formed a year later.'
  it: ''
- hash: e5295f16
  kind: cards
  en: 'The Gulf is split and Kuwait cannot pick a side: the Makkah Joint Defense Agreement (Saudi Arabia, Pakistan, Turkey, 7 Aug 2026) does not include Kuwait, the Saudi-UAE rift divides the GCC, and Kuwait''s
    neighbours disagree on Iran, so its only constant is collective statements.'
  it: ''
- hash: 561d2d7c
  kind: cards
  en: 'Hosting the largest US force in the region buys the only credible guarantee and makes Kuwait the target. The Emir says Kuwait allowed no one to use its land, airspace or waters against Iran, yet
    US bases are what Iran hit first (Camp Buehring on 1 Mar, Port Shuaiba, Ali Al Salem), and the guarantor could not stop the strikes: AGSI frames the question as a US that liberated Kuwait and now struggles
    to protect it.'
  it: ''
- hash: 4b26854c
  kind: cards
  en: Suspending parliament cleared the road to the money and removed the buffer that made policy safe. The 2025 debt law (KD30bn, fifty-year bonds) and the July 2026 KKR deal came only after the Assembly
    could no longer block them, but a regime that governs by decree has no institution to absorb a bad war or a bad succession, and the investors who fund the plan price that risk.
  it: ''
- hash: 787c9a16
  kind: cards
  en: Cutting the citizen rolls to protect the welfare budget creates a stateless class abroad and a diplomatic cost at home. About two-thirds of those affected are said to be divorced and widowed naturalised
    women (Article 9 of the constitution, which protected them, is among the suspended articles); Saudi Arabia refused to take up an individual case and the UK Foreign Office is collecting information on
    British-origin Kuwaitis, while a policy sold as savings turns a labour-importing state into one that manufactures stateless residents.
  it: ''
- hash: 1f428c5b
  kind: cards
  en: The northern gateway strategy is hostage to the neighbours it is meant to serve. Mubarak Al-Kabeer port on Bubiyan and Silk City were designed to make Kuwait a logistics hub for Iraq and the Gulf,
    but Iraq protests the port and its new maritime map, Iran's IRGC raided Bubiyan on 1 May 2026 where China is building the port, and the port itself was among the targets of Iranian strikes; AGSI notes
    the gateway goal is hard while Iran is seen as a security threat.
  it: ''
- hash: c42bd048
  kind: cards
  en: Diversifying security partners dilutes none of the dependence on Washington and adds partners who will not fight. Pakistan's pact obliges it to nothing in an attack and Pakistan mediates with Tehran,
    India's committee is a framework, and the UK battery is a loan; Kuwait gains political cover and intelligence ties but its real exposure to Hormuz and Iranian drones is unchanged.
  it: ''
- hash: c6322cee
  kind: cards
  en: 'Standing on a non-normalisation principle that is the cheapest to hold in the Gulf leaves Kuwait without the channels that the Israeli-aligned air-defence cooperation of its neighbours may provide,
    while the war against Iran is fought partly by Israel. Kuwait''s line is that normalisation waits for a Palestinian state; the cost is paid in the one domain, air defence, where it is weakest. (Our
    reading: no source makes this link.)'
  it: ''
- hash: 777818b4
  kind: cards
  en: 'Kuwait is a small rich state whose strategy has been, since 1961, to buy

    protection with money and mediation and to keep every neighbour a little in debt

    to it. 2024-2026 broke the model on two fronts at once. At home the Emir ended

    the one thing that distinguished Kuwait in the Gulf, an elected assembly with

    real vetoes: he governs by decree, passed the debt law that the Assembly had

    blocked, and used the nationality law as a welfare and political instrument. Abroad

    the 2026 war with Iran turned the host of the largest US ground presence in the

    region into the Gulf state that is struck most often: the guarantor from 1991

    could not stop Iranian drones, and the ''we allowed no use of our land'' line is

    as much a plea to Tehran as a statement of fact. The paradox that runs

    through the card is that every protection Kuwait buys has a price in exposure:

    the US bases invite attack, the Chinese-built port on Bubiyan invites Iraqi and

    Iranian pressure, the decree rule that unlocked the money costs it the

    institutions that absorb shocks, and the extra partners (Pakistan, India, the UK)

    add cover, not guarantees. Two signals that are not rows: the Emir''s description

    of Iran as a ''friend'' even while it attacks, which keeps a way back open, and the

    absence of any Kuwaiti step toward Israel when its neighbours debate it.

    Questions for the next pass: the outcome of Iraq''s Federal Supreme Court on the

    Khor Abdullah appeal (hearings were postponed to mid-June 2025), Kuwait''s own

    reaction to the June 2025 Israel-Iran war, the current status of the Durra

    negotiations, and the Kuwait-China oil trade, which this pass could not source.'
  it: ''
- hash: dbe137c1
  kind: cards
  en: Stabilise the economy and cut the debt burden. The kip and the reserves have recovered (a record USD 4.2bn in March 2026), but debt service takes about 13% of GDP in 2026, and the IMF puts public
    debt at 80.6% of GDP in 2025 against a path to about 57% by 2030 if reforms hold.
  it: ''
- hash: 2437dbfc
  kind: cards
  en: Turn hydropower into export revenue, above all to Vietnam, whose revised power plan targets at least 8 GW of imports from Laos by 2030 (a planning target, not a contract).
  it: ''
- hash: fb783ed7
  kind: cards
  en: 'Keep the special relationship with Vietnam as the political anchor: party cooperation plans for 2026-2030, agreed when President Thongloun was in Hanoi on 26-27 Jan 2026, and the Vung Ang sea port
    and a Vientiane-Thakhaek-Vung Ang railway named as priorities when To Lam visited Vientiane on 5 Feb 2026.'
  it: ''
- hash: 9343c982
  kind: cards
  en: 'The grid as a sold asset: 90% of EDL-T, the high-voltage transmission company (lines above 230 kV), went to China Southern Power Grid in 2020 for USD 600m, with a 25-year management mandate from
    2021; the buyer is reported to hold majority control.'
  it: ''
- hash: d9793c2b
  kind: cards
  en: 'Diplomacy beyond Vietnam: President Thongloun to Pyongyang on 7-8 Oct 2025 to ''strengthen bilateral ties'', and Prime Minister Sonexay Siphandone to Washington in late September 2025 to seek tariff
    concessions in talks with USTR Jamieson Greer.'
  it: ''
- hash: fa727de5
  kind: cards
  en: 'Debt service absorbs the budget: the IMF''s February 2026 assessment keeps Laos in debt distress, and the World Bank counts debt payments at about 13% of GDP in 2026, which limits spending on health,
    education and social protection.'
  it: ''
- hash: 21e2eb25
  kind: cards
  en: 'Dollar scarcity: the kip lost about 35% against the dollar in January-October 2023, with inflation near 26%, and kept falling in 2024 (19% at the official rate to September); the World Bank ties
    the slide to the dollars needed for external debt repayments, and the 2026 oil shock has reignited inflation.'
  it: ''
- hash: 84afaecf
  kind: cards
  en: 'Donor money for the war''s bombs: the US paid 73% of international clearance funding in 2024 (USD 23.6m), and the January 2025 aid stop halted US-funded demining; its restart is unclear.'
  it: ''
- hash: 56d48a1f
  kind: cards
  en: 'The grid sold to ease the debt ties the debt to China: critics read the 2020 transfer of 90% of EDL-T for USD 600m as debt-for-equity, and the payment was expected to go to debts owed to Chinese
    creditors (not confirmed), while the Chinese partner now shares in the transmission revenue that EDL''s finances depend on.'
  it: ''
- hash: 8f5f7f11
  kind: cards
  en: 'Laos is a landlocked one-party state whose main asset is water: its dams sell power to Vietnam, and the high-voltage grid that carries it is now majority-controlled through a Chinese company, the
    price of a debt that the IMF still treats as distressed. Its policy is to hold the Vietnamese special relationship as the political anchor and to spread its partners so that none of them sets its choices.
    The record reserves of 2026 buy time; they do not solve the debt.'
  it: ''
- hash: 436961cc
  kind: cards
  en: 'Restore the state''s monopoly on arms without a civil war: the cabinet''s decision of 5-7 August 2025 to disarm Hezbollah and every other armed group (first by end-2025), the army''s ''phase one''
    south of the Litani declared complete on 8 January 2026, the ban on Hezbollah''s military activity of 2 March 2026, and the disarmament of the Palestinian camps agreed with Abbas. President Aoun calls
    disarmament non-negotiable but wants it done by dialogue and in sequence with Israel''s withdrawal.'
  it: ''
- hash: 5cad0bbd
  kind: cards
  en: 'End the Israeli occupation and the war by negotiation, short of normalisation: withdrawal from the roughly 65 towns and villages Israeli forces hold since the March 2026 ground campaign and from
    the five border hills held since 2024, through the US-brokered talks that produced the 26 June 2026 framework. Aoun and Salam speak of ''peace'' as a security or non-aggression arrangement; normalisation,
    they say, comes only after the Israeli-Palestinian question is settled (Arab Peace Initiative).'
  it: ''
- hash: 1ea8a69d
  kind: cards
  en: 'Rebuild a bankrupt state: a new IMF programme (bank resolution law passed in August 2026, the ''financial gap'' law and a 2027 budget still missing), recovery money for two wars (World Bank: USD
    11bn of needs after 2024; Finance Minister Jaber: damage of up to USD 20bn from the 2026 war) and a return to growth after the World Bank''s forecast contraction of 6.4% in 2026.'
  it: ''
- hash: 2028d9eb
  kind: cards
  en: 'Keep Arab, Western and UN backing flowing after UNIFIL: the force''s mandate ends on 31 December 2026 (Security Council resolution 2790, adopted unanimously on 28 August 2025) with withdrawal during
    2027, so Beirut wants an EU training mission, a French-Italian post-UNIFIL coalition and a donor base (US, Saudi Arabia, Qatar, EU) for an army that cannot otherwise hold the south.'
  it: ''
- hash: 1d12372e
  kind: cards
  en: 'Take Lebanon out of Iran''s orbit and normalise the Syrian border: the ban on IRGC activity (5 March 2026), the expulsion of the Iranian ambassador (24 March), the earlier flight ban (February 2025);
    with Damascus, the demarcation committees, refugee returns and the transfer of Syrian detainees. Foreign Minister Raggi: the government is working to ''free Lebanon from Iranian influence''.'
  it: ''
- hash: '64014320'
  kind: cards
  en: 'Turn the sea into a source of income and borders: the 26 November 2025 maritime boundary agreement with Cyprus (signed, not ratified), a Block 8 seismic survey with TotalEnergies, Eni and QatarEnergy
    (contract for three years, drilling decision afterwards), and Egyptian gas for electricity. Hydrocarbons are a long bet; none of it pays before the army and the IMF are sorted.'
  it: ''
- hash: f403279c
  kind: cards
  en: 'Direct, US-hosted talks with Israel (a first since decades: ambassadors Moawad and Leiter in Washington on 14 April 2026, rounds in May, June and Rome in July and August, next round planned for October),
    carried by President Aoun and ambassador-level officials while Aoun declines to speak with Netanyahu; the 26 June framework gives Beirut a US-facilitated Military Coordination Group and a written sequence
    for Israeli withdrawal. Alongside, the Arab and Western support group (US, Saudi Arabia, France, Egypt, Qatar) and the September 2026 Paris meeting on support for the army (Macron, Aoun and King Abdullah
    II).'
  it: ''
- hash: 29ddeb6a
  kind: cards
  en: 'A sovereignty narrative: the state''s monopoly on arms, ''peace'' but not ''normalisation'', Hezbollah''s weapons as the cause of the war and not its answer (the cabinet''s March 2026 ban, Salam''s
    statement). It competes with Hezbollah''s counter-narrative that the talks ''achieved nothing'' and allowed Israeli attacks to continue, and with Berri''s Amal, which intends to block the framework''s
    security measures.'
  it: ''
- hash: 98aa5d88
  kind: cards
  en: 'The Lebanese Armed Forces as the only instrument: phase one south of the Litani (declared done 8 January 2026, excluding the five points Israel holds), pilot-zone deployments under the framework
    (the first zone announced on 20 July 2026, three towns Israel had not occupied), and the Palestinian camp handovers (Fatah, from August 2025). The army is underfunded and cannot be used against Hezbollah
    by force.'
  it: ''
- hash: 84e62aca
  kind: cards
  en: 'Donor money as leverage: EU Peace Facility EUR 100m for the army (4 June 2026, EUR 182m in total) on top of a EUR 1bn EU package for 2024-27, Qatar''s USD 60m army salary grant and USD 434m for energy,
    US security assistance (USD 117m announced in January 2025; USD 100m humanitarian with the framework), and the World Bank''s emergency project. Each is conditioned in practice on the arms file.'
  it: ''
- hash: 3214fd8b
  kind: cards
  en: 'An army that cannot disarm Hezbollah by force: underfunded, dependent on donors, and facing a Hezbollah MP''s warning that enforcement would mean ''civil war''. Phase one missed its end-2025 deadline;
    phase two north of the Litani depends on a party that says it will not disarm while Israel stays.'
  it: ''
- hash: cdb5fac8
  kind: cards
  en: 'Israel''s sequencing and its own aims: withdrawal is conditioned on verified disarmament; Netanyahu says Israeli forces stay while Hezbollah is armed, Smotrich ''possibly beyond'', Katz that the
    Shia villages on the contact line ''had to disappear''. Israel holds an estimated 570-600 sq km, evacuation orders cover about 2,000 sq km, and over 1.2 million people are displaced.'
  it: ''
- hash: bcab4259
  kind: cards
  en: 'A confessional system that gives the Shia duopoly a veto: Hezbollah and Amal hold ministers (they walked out in August 2025 and one Hezbollah minister approved the March 2026 ban), Speaker Berri
    runs parliament, which extended its own term to May 2028 by 76 votes to 41 on 9 March 2026 (the Constitutional Council upheld it on 7 April). The state cannot decide against the Shia community and keep
    the system.'
  it: ''
- hash: bec6faaf
  kind: cards
  en: 'A bankrupt, dollar-starved economy: financial-sector losses put at about USD 70bn (2022 estimate, likely higher), the IMF''s staff-level agreement still blocked on the gap law, the 2027 budget and
    a VAT rise, the pound having lost 98% of its value, and the World Bank forecasting a 6.4% contraction in 2026 after 4.2% growth in 2025; the World Bank puts the economic cost of the conflict at USD
    14bn and reconstruction needs at USD 11bn.'
  it: ''
- hash: ef714200
  kind: cards
  en: 'Conditional patrons: Riyadh waits for ''actions'' on disarmament before re-engaging with money, the US ties its army aid to performance (the framework says ''performance-based''), and the EU frames
    its aid as a way to weaken Hezbollah. Support is real but it can be withdrawn, and the UN force that stood in the south goes at the end of 2026.'
  it: ''
- hash: 78b23cf1
  kind: cards
  en: 'A public that does not follow its negotiators: polling cited by Long War Journal puts support for normalisation with Israel at roughly 30%, Hezbollah and Amal reject the framework, and the Shia population
    (the bulk of the 1.2 million displaced) is asked to accept disarmament while Israeli forces remain and reconstruction money is conditional.'
  it: ''
- hash: 13a8e147
  kind: cards
  en: Banning Hezbollah's armed activity on the day Hezbollah opened fire did not stop the war it was meant to keep out. The cabinet outlawed the group's military action on 2 March 2026, hours after Hezbollah
    fired for Iran; Israel answered with the Litani ground campaign, more than 4,300 dead and over a million displaced. A decision the state could not enforce taught Israel that the state is not the owner
    of the front, and it handed Israeli ministers an argument to stay until Hezbollah is disarmed - the disarmament that the occupation makes harder.
  it: ''
- hash: fd2529ca
  kind: cards
  en: The sequence is circular. The framework makes Israeli withdrawal depend on verified disarmament; Hezbollah says it keeps its arms while Israeli troops hold Lebanese land; every Israeli strike under
    the truce strengthens that argument inside the Shia community and weakens the state that is asking for patience. The first pilot zone covers three towns Israel never occupied, so the one visible success
    moves no Israeli soldier.
  it: ''
- hash: f077f500
  kind: cards
  en: The army needs the donors' money to disarm, and the donors release it only against disarmament. Saudi Arabia, the United States and the EU all describe their aid as tied to progress, yet an army that
    is underfunded and short of units cannot show progress without the aid. The state is asked to prove capacity first and is given capacity second.
  it: ''
- hash: 234eaca7
  kind: cards
  en: UNIFIL leaves because Washington and Israel wanted it gone, but Lebanon needs somebody in the south once it leaves. The UN force was ended at the American-Israeli insistence in August 2025 and the
    Europeans now scramble for a replacement that is 'not a UNIFIL replacement' (Kallas); the more Lebanon relies on a US-run Military Coordination Group instead of a UN mandate, the more its southern border
    becomes an American-Israeli arrangement.
  it: ''
- hash: 39bac8f5
  kind: cards
  en: Cutting Iran off removes Hezbollah's patron and also its paymaster for the community the state needs to win. The IRGC ban and the expulsion of the ambassador were meant to remove the outside hand;
    but Hezbollah's reconstruction and displacement money has come from Tehran (reported USD 200m, disputed by Washington), while the Gulf and Western money is conditioned on the very disarmament. The Shia
    displaced look to Hezbollah for payment and to the state for an invoice.
  it: ''
- hash: db347939
  kind: cards
  en: Postponing the elections to hold the cabinet together spends the legitimacy the cabinet needs for its hardest decisions. Parliament gave itself two more years (to May 2028) on 9 March 2026 so that
    a government at war would not face voters; the Lebanese Forces, Kataeb and the Free Patriotic Movement called it illegal, and the assembly that must back the monopoly on arms is one that no voter has
    chosen since 2022.
  it: ''
- hash: ea25634c
  kind: cards
  en: 'Lebanon''s grand strategy since Aoun''s election (9 January 2025) and Salam''s government (February 2025) is the strategy of a state trying to become the owner of its own war and peace. The aim is
    simple to state: one army, one decision on war, Israel out, money in. The means are borrowed: American brokerage, Saudi and Qatari money, European training, Egyptian ideas, a UN mandate that is ending.
    The 2026 war showed the gap between the declared monopoly and the actual one: Hezbollah fired on 2 March in spite of the cabinet''s own ban, and the state paid in dead, displaced and territory. Beirut''s
    answer is not to fight Hezbollah (the army will not, and the state would not survive it) but to move the country''s major patrons into a sequence in which Israeli withdrawal, army deployment and donor
    money arrive together. That is why it signed a framework with a state it does not recognise and why it avoids the word normalisation. It is a strategy of patience and bargaining from weakness, and its
    test is the pilot zones: if Israel does not withdraw from a place the army has actually cleared, the Shia community will keep its arms for good and the state''s whole case will fall. Syria and the Gulf
    matter because they take the land and sea borders and the money out of Iran''s hands; Russia, China and Turkey are marginal. This card is dated 12 October 2026, before the next round of Israel-Lebanon
    military talks planned for 20-21 October and the EU''s formal decision on the army mission.'
  it: ''
- hash: a5a40384
  kind: cards
  en: 'Prove the Boakai government''s reform course by building the war and economic crimes court. Boakai signed the decree creating the Office of the War and Economic Crimes Court in May 2024. Funding
    has lagged the pledge: about USD 800,000 was disbursed in the fiscal year to December 2025, against USD 2m promised a year; in May 2026 the government announced a USD 2m annual appropriation, paid in
    quarterly instalments of USD 500,000.'
  it: ''
- hash: 740f1d0f
  kind: cards
  en: Use the UN Security Council seat for 2026-27 to act beyond its size. Liberia won the seat on 3 June 2025 with 181 of 187 votes, unopposed for the African Group seat; the term starts on 1 January 2026,
    and Liberia presides over the Council in December 2026.
  it: ''
- hash: 0d95efd9
  kind: cards
  en: 'The UN Security Council seat for 2026-27 and the presidency of the Council in December 2026: the one instrument on the diplomatic side that a state of its size does not usually hold. Memberships
    in the African Union and ECOWAS sit in the datasets and are not repeated here.'
  it: ''
- hash: 64828c81
  kind: cards
  en: 'The ship registry: the Liberian flag, managed by the Liberian International Ship & Corporate Registry (LISCR), a US-based company, passed 300 million gross tons in June 2026 and is now the world''s
    largest. The state keeps little of it: maritime revenue is put at about USD 30m in 2026, a small share of the national budget.'
  it: ''
- hash: 57b6370f
  kind: cards
  en: Donor leverage is thin and the main outside donor has cooled. A July 2025 allAfrica report says the United States appears less enthusiastic about the war court, particularly under Trump, and the court's
    budget sits below its pledge (see objective 1).
  it: ''
- hash: 68bc7388
  kind: cards
  en: The flag brings the state little cash. Maritime revenue of about USD 30m in 2026 is a small share of the budget, so the reform agenda (the court, the Council seat) runs on a thin budget and on donors.
  it: ''
- hash: 3e6164a6
  kind: cards
  en: The founding tie with the United States gives Liberia its profile, a flag run from American soil, and the hope of US money for the war court. The same tie was tested in July 2025, when Trump's remarks
    to Boakai at the White House summit, and the cooling US line on the court, showed how little the tie guarantees.
  it: ''
- hash: 6c83175d
  kind: cards
  en: 'Liberia''s grand strategy is to turn the reputation of an old, American-founded state into standing: a Security Council seat for 2026-27, a war-crimes court to prove that its civil wars are being
    answered, and a flag registry that is now the world''s largest but earns the state little. The American tie is both its profile and its constraint: the registry is managed from the United States, the
    court needs outside money, and the July 2025 episode and the cooling donor line show how little that tie guarantees. Not verified for this card: iron ore and rubber, the neighbours (Sierra Leone, Guinea,
    Cote d''Ivoire, the Mano River Union), China''s present role, ECOWAS, and the court''s 2026 funding after the May appropriation.'
  it: ''
- hash: 40b0151d
  kind: cards
  en: Remain the sole UN-recognised government, and in office, until an election on terms Dbeibah can survive. The GNU was installed through a UN process in 2021 for elections that were set for December
    2021 and never held; the House of Representatives voted on 13 Aug 2024 to end its term and appointed a rival government in Benghazi, yet the UN protocol list still names Dbeibah as prime minister, and
    he stayed in office after thousands demanded his resignation on 16 May 2025.
  it: ''
- hash: 9837f45f
  kind: cards
  en: 'Break the armed groups that rival the government in Tripoli without becoming hostage to any one of them: the killing of Abdel Ghani al-Kikli of the Stability Support Apparatus on 12 May 2025 opened
    a week of fighting in which the 444th Brigade (nominally the Defence Ministry''s) and allied units seized SSA positions and turned on the Special Deterrence Force (Rada); the next round, with drones
    bought by commanders Mahmoud Hamza and Abdulsalam Zubi against Mitiga-based and other units, is being prepared.'
  it: ''
- hash: 0ca58f0e
  kind: cards
  en: Keep the oil and the money flowing through Tripoli's institutions. Eastern authorities showed in Aug-Sep 2024 that they can shut the whole oil sector over control of the Central Bank (output fell
    from about 1.28m bpd on 20 July to about 591,000 bpd on 28 August); Tripoli wants output at 1.6m bpd by end-2026 (it was 1.4m, a ten-year high, in spring 2026), a unified budget it can steer (first
    in 13 years, 11 April 2026) and a dinar that has lost two large devaluations (13.3% in April 2025, 14.7% in January 2026).
  it: ''
- hash: 6068cc07
  kind: cards
  en: Keep Turkey as its shield and the November 2019 maritime memorandum as its legal title to the sea. Turkish forces have been in Tripoli, including at Mitiga airport, since 2019, Ankara trains Tripoli's
    soldiers, and the memorandum, which Greece calls illegal and which Egypt asked Washington to press Haftar not to endorse, is the legal title on which Tripoli's claim to its maritime zone rests; whether
    the eastern House ratifies it is the open question.
  it: ''
- hash: 375bd2c4
  kind: cards
  en: Deal with the Haftars without handing them the state. Dbeibah's nephew Ibrahim and Saddam Haftar are the intermediaries of the unified budget and of the US scheme that would make Saddam president
    and keep Dbeibah prime minister; the Presidential Council and the High Council of State rejected it, Misrata (Dbeibah's home city) has signalled it would mobilise against it, and Dbeibah has not refused
    it outright.
  it: ''
- hash: c96db354
  kind: cards
  en: 'Stay indispensable to Europe and the United States, so that Western tolerance outlasts the mandate: Eni''s USD 8bn, 25-year gas deal with the NOC (28 Jan 2023), the 2017 migration memorandum with
    Italy, the fact that Libya was 88% of Italy''s sea arrivals in January-April 2026, and the release of the ICC suspect Almasri to Tripoli on an Italian state aircraft (Jan 2025) are the currency; the
    2025-26 US channel (Boulos, AFRICOM, the unified budget) is the new one.'
  it: ''
- hash: 920af7d9
  kind: cards
  en: 'Legitimacy as currency: the UN list, the UNSMIL roadmap (21 Aug 2025) and its tracks - the Structured Dialogue (concluded 7 Jun 2026), the ''Smaller Convening'' of GNU, High Council of State, House
    and LNA (first met in Rome on 29 Apr 2026) and the Tripoli agreement of 30 Aug 2026 on the elections commission and a single executive within 24 months - plus a door open to every patron: Erdogan and
    Dbeibah talked (7 Nov 2025), the Egyptian intelligence chief came to Tripoli (June 2026; 21 Jun per Libya Security Monitor), Turkey''s Kalin saw Dbeibah and Saddam Haftar on the same trip (23 Jun 2026).'
  it: ''
- hash: b38dd4db
  kind: cards
  en: 'Claims at sea as diplomacy: the 2019 memorandum with Turkey and Tripoli''s plan to lodge the outer limits of its maritime zones with the UN, which Malta protested and agreed to negotiate (Sept 2025);
    the same instruments make Greece, Egypt, Malta and Cyprus negotiate with whichever half of Libya they decide to recognise.'
  it: ''
- hash: c92d4eb8
  kind: cards
  en: 'An anti-militia, anti-corruption frame for the use of force (''a Libya free of militias and corruption'', 17 May 2025) and sovereignty claimed through the courts: the Tripoli court that sentenced
    Almasri to 7 years 4 months on 21 Jun 2026 answers the ICC and Rome with a Libyan judgment.'
  it: ''
- hash: 981b1dd3
  kind: cards
  en: A brigade-based force answering to the Defence Ministry (444th and 111th Brigades), Turkish training (Efes-2026 trained 362 soldiers from East and West, per Agenzia Nova), Turkish forces in Tripoli
    and drones bought by commanders Hamza and Zubi; the force is big enough to purge a rival in a week, not to cross the frontier of the east.
  it: ''
- hash: 0f8c2ed6
  kind: cards
  en: 'The purse: oil revenue reaches households through public salaries, and the recognised government sits at the Central Bank and the NOC end of that channel; it has devalued the dinar twice (13.3% in
    April 2025, 14.7% in January 2026, to 6.37 per dollar) while the parallel rate reached about 10 in February 2026, and it uses the Eni-NOC gas deal and the April 2026 unified budget to bind outsiders
    to its channel.'
  it: ''
- hash: ec7a2e87
  kind: cards
  en: Half a country. The east holds most of the oilfields, the Libyan National Army and the loyalty of the House of Representatives, which treats the GNU as illegitimate; there is no single executive,
    army or central-bank board, so every fight over the budget is a fight over the one bank (August 2024).
  it: ''
- hash: 0a6b1804
  kind: cards
  en: The street and the brigades. The May 2025 fighting produced large protests against Dbeibah (thousands on 16 May, three ministers resigned) while his security rests on brigades he cannot disband; new
    fighting broke out in Zawiya and Sorman on 3 Aug 2026 and an armed group shut the Sharara-Zawiya pipeline valve on 21 Sep 2026.
  it: ''
- hash: 5e86e880
  kind: cards
  en: One commodity. Hydrocarbons were 65% of GDP, 93% of exports and 72% of government revenue in 2024; the IMF said in April 2026 that the fiscal path is 'unsustainable', the official dinar is 6.37 per
    dollar against about 10 on the parallel market (Feb 2026), and the food basket cost rose 27.7% in a year.
  it: ''
- hash: 4de24501
  kind: cards
  en: A protector with its own game. Turkey blocked Tripoli from using Turkish drones in the May 2025 clashes, hosted Saddam Haftar (April 2025 and again July 2026), trains both halves, and received the
    eastern speaker Aguila Saleh and the High Council of State's Mohamed Takala in Ankara on 10 Sep 2026; Tripoli cannot threaten to leave a patron that already has two counterparts.
  it: ''
- hash: 1534eaca
  kind: cards
  en: 'An expired mandate. The UN process that made the GNU now plans its succession: the roadmap of 21 Aug 2025 sets an 18-month path to a unified government and elections, the three councils agreed in
    June 2026 on elections by 17 Feb 2027, and the 30 Aug 2026 agreement says a single executive and elections within 24 months - which the House endorsed on 14 Sep 2026 and the High Council of State reportedly
    rejected.'
  it: ''
- hash: 7c479a38
  kind: cards
  en: Exposure to the Court and to Europe's priorities. The ICC pursues officials of the Mitiga detention complex run by the Rada force that shares Tripoli with the GNU (Khaled El Hishri, arrested in Germany
    in July 2025 and in ICC custody since 1 Dec 2025; the Almasri warrant, which Italy did not execute) and Europe asks Tripoli for fewer departures rather than for governance, so its backing is cheap and
    revocable - the EU delegation saw Dbeibah first in July 2025 and was then expelled from Benghazi.
  it: ''
- hash: 5ee257ce
  kind: cards
  en: Fighting the armed groups that guard it. The May 2025 purge of the SSA and Rada left the Defence Ministry's 444th Brigade holding the SSA's former positions, put thousands in the street against Dbeibah
    and cost him three ministers; rival units (Kara's Mitiga-based force, al-Tajuri's) are now arming for a second round, so the victory raised the price of the next defeat.
  it: ''
- hash: db26d37b
  kind: cards
  en: Dbeibah's legitimacy is the UN process whose roadmap ends it. The UN list and UNSMIL keep him recognised; the UNSMIL roadmap and the 30 Aug 2026 agreement call for a single executive and elections
    within 24 months. Backing the process keeps him in office and finishing it removes him, which is why each step stalls between the two councils (the High Council of State reportedly rejected the 30 Aug
    2026 text for bypassing the 6+6 Committee).
  it: ''
- hash: 0a863aea
  kind: cards
  en: 'The patron that made Tripoli safe also makes it replaceable. Turkey''s 2019 military and maritime memoranda saved the Tripoli government, but Ankara now meets Haftar''s son in Benghazi and in Ankara,
    trains soldiers from both halves and would gain a second signatory if the eastern House ratifies the 2019 memorandum: the more Tripoli depends on Turkey, the less Turkey needs Tripoli alone.'
  it: ''
- hash: 1e9c49b9
  kind: cards
  en: Record oil feeds the division. Output at 1.4m bpd on Brent near USD 100 should strengthen the recognised government, but it enlarges what the Haftars (who hold most of the fields) and the Zawiya armed
    groups can hold hostage - the Sharara-Zawiya valve closed on 21 Sep 2026 and UNSMIL warned on 26 Sep of sanctions for attacks on oil facilities - while the windfall, a falling dinar and the unified
    budget, which would move billions of dinars to the Haftars' construction funds, make the split a revenue-sharing arrangement.
  it: ''
- hash: 49c126b2
  kind: cards
  en: Unification by deal makes the rival head of state. The US plan would keep Dbeibah as prime minister and put Saddam Haftar at the head of a presidential administration, with no election; the Presidential
    Council and the High Council of State rejected it, Misrata signalled it would mobilise, and a Dbeibah adviser told Lacher that if the Boulos initiative fails the alternative is probably war. The compromise
    that would end the split is the one most likely to start a war inside the west.
  it: ''
- hash: b7984719
  kind: cards
  en: 'Europe''s dependence on departures is Tripoli''s best card, and the east plays it as well. Libya was the point of departure for 88% of Italy''s sea arrivals (January-April 2026) and about half of
    all arrivals in Greece, but Benghazi expelled the EU migration commissioner and the interior ministers of Greece, Italy and Malta on 8 Jul 2025, received the Greek foreign minister (March 2026) and
    the head of Italian intelligence (7 Jul 2026) and is to get refurbished Greek patrol boats: the more Europe pays for control of the coast, the more it pays both halves, and the cheaper division becomes.'
  it: ''
- hash: 29cee7f6
  kind: cards
  en: 'Libya is a state whose two halves are each a client, and the card of the recognised half has to be read as the card of a client that holds the title deeds. Tripoli has the United Nations list, a
    Turkish shield, the Central Bank and the Italian gas contract; Benghazi has the oilfields, the army, Russian air bases at six sites, the Emirati air bridge to Kufra and the Egyptian border. Luttwak''s
    relational manoeuvre turns on seams between an opponent and its allies, and here the seams are in the patrons themselves: Turkey backs Tripoli and courts Haftar''s son, Egypt trains the east''s officers
    and sends its intelligence chief to Dbeibah, Italy and Greece pay both coasts, and Washington brokers a unified budget and a power-sharing scheme that would make Saddam Haftar president. Every patron
    has a reason to keep the division manageable and none to end it: a united Libya would answer to one capital, and each of them has a deal with a different one. The 2026 state is a stalemate that is eroding
    - a unified budget (11 Apr), a Tripoli agreement on an elections commission and a single executive (30 Aug), a House that endorsed it and a High Council that did not, UNSMIL''s mandate up for renewal
    on 31 Oct, new fighting in Zawiya - and the paradox of the card is that Dbeibah''s best moves (purging the militias, courting Washington, selling Europe departures) each work for the east as well or
    better, so Tripoli''s strength is its recognition, which is the one asset the UN process is designed to retire.'
  it: ''
- hash: ed51326c
  kind: cards
  en: 'Hold the Taiwan tie restored in 2007. Our reading, not a stated aim: the embassy in Taipei opened on 4 June 2015, described as its first in Asia, which is the one visible investment in the tie.'
  it: ''
- hash: cae76223
  kind: cards
  en: 'Keep the British and Commonwealth link as the older anchor of its foreign ties. Our reading: diplomatic relations with the United Kingdom since 22 February 1979, high commissions in London and Castries,
    the CARIFORUM-UK Economic Partnership Agreement, and Commonwealth membership.'
  it: ''
- hash: bb76c47b
  kind: cards
  en: 'A small but wide diplomatic network: embassies in Washington and Taipei (opened 2015), a high commission in London, and seats in the Commonwealth, the OAS and the UN. As a CARICOM member it backed
    US efforts on UN Security Council Resolution 940 regarding Haiti.'
  it: ''
- hash: bf301716
  kind: cards
  en: Drug transit. Its use as a transit point for South American drugs bound for the United States and Europe is the source of the tension in its US relation, per the Wikipedia lead.
  it: ''
- hash: a8e70f71
  kind: cards
  en: The Taiwan recognition has changed hands twice since 1984 (Taipei to Beijing in 1997, back to Taipei in 2007), and the 2015 embassy in Taipei binds it to a recognition that its own history shows can
    be reversed. Our reading.
  it: ''
- hash: 080d1c95
  kind: cards
  en: 'Saint Lucia runs a small but wide diplomacy: embassies in Washington and Taipei, a high commission in London, and seats in the Commonwealth, the OAS and the UN.

    Its Taiwan tie is the choice that matters most (restored in 2007, the Taipei embassy in 2015), and its British and Commonwealth link is the older anchor.

    Every row here is C because the only source read was Wikipedia (tier 4); the posture grades, the 2025 election, the US citizenship-by-investment pressure and the economy are left open until a sourced
    pass.'
  it: ''
- hash: 7b9f9958
  kind: cards
  en: 'Keep the customs union and the monetary and diplomatic arrangements with Switzerland: the customs union has run since 1924, the franc has been the currency since 1920, and Switzerland represents
    Liechtenstein abroad unless it chooses otherwise. Without the Swiss tie the state has no army, no foreign service of its own and no market of its own.'
  it: ''
- hash: 4f17409f
  kind: cards
  en: Keep full access to the EU single market and to the Schengen area without being an EU member. The EEA has applied since 1 May 1995 and Schengen since December 2011 as an associate member. The EU is
    not a partner of choice here but the source of most of the rules the state must adopt.
  it: ''
- hash: 9d303c90
  kind: cards
  en: Keep the financial centre''s access to US capital markets while meeting US tax-information and sanctions demands. The 2014 FATCA agreement was signed in Vaduz to protect that access, and in 2025 US
    pressure pushed fiduciaries to drop Russian-linked trusts.
  it: ''
- hash: 18d8a41f
  kind: cards
  en: 'The financial centre: a fiduciary and trust sector that manages wealth across borders. In 2025 the sector shrank under US secondary-sanctions pressure, and the state now looks to centralise supervision
    of trusts it cannot close.'
  it: ''
- hash: 68290ed1
  kind: cards
  en: 'Multilateral presence far above its size: UN, Council of Europe, OSCE, WTO and ICC membership, plus voluntary contributions to Council of Europe action plans, including CHF 115,000 for Ukraine''''s
    recovery plan (signed 13 Nov 2025).'
  it: ''
- hash: 11866b6d
  kind: cards
  en: No army. Policing is done by the national Security Corps, which trains mostly in Switzerland and Austria. Security is delegated in practice to its neighbours, with no air-policing agreement of its
    own.
  it: ''
- hash: 5145eaae
  kind: cards
  en: No army, and Switzerland says it would not defend Liechtenstein directly because that would break Swiss neutrality (Federal Council, reaffirmed February 2025). The state cannot back its foreign policy
    with force.
  it: ''
- hash: 190791df
  kind: cards
  en: 'Monetary and customs dependence on Switzerland: the Swiss franc is the currency and Swiss customs law applies at the border. Liechtenstein cannot set its own tariffs or monetary policy, and its trade
    statistics leave Switzerland out.'
  it: ''
- hash: 4d1e599d
  kind: cards
  en: Small size and exposure to US secondary sanctions. The trust sector depends on being acceptable to US banks and regulators, so US pressure on Russian clients translates directly into a fiduciary shutdown
    inside the country.
  it: ''
- hash: 8bc13083
  kind: cards
  en: The clean-up that keeps the state in US good standing leaves Russian-linked trusts without managers, so the assets sit frozen instead of being administered. The financial centre earns from the same
    assets it is now forced to isolate.
  it: ''
- hash: e70e26dd
  kind: cards
  en: 'Liechtenstein has no army and no market of its own, so its strategy is to rent out

    its legal and financial order and to borrow its security and currency from Switzerland

    and its market access from the EU through the EEA. The vulnerable point is the financial

    centre, which must stay acceptable to Washington at the price of shrinking itself: in 2025

    US pressure pushed fiduciaries out of Russian-linked trusts. Ukraine support, in money and in

    Council of Europe programmes, is how it shows a Western profile without military weight.'
  it: ''
- hash: ad821002
  kind: cards
  en: Keep the IMF Extended Fund Facility on track, because it is the anchor that keeps other lenders lending. The Executive Board completed the combined 5th and 6th reviews in late May 2026, releasing
    about US$695m and lifting total disbursements to about US$2.4bn. The IMF noted two continuous criteria were not observed (no new external payment arrears, no new or tighter import restrictions).
  it: ''
- hash: 8890d086
  kind: cards
  en: 'Balance India and China without choosing between them: draw Indian energy, defence and grid investment into the north and east, while keeping the Chinese port, refinery and loan commitments already
    signed. The government calls the line neutral. Its 2024 manifesto pledged not to take the side of either.'
  it: ''
- hash: af65d294
  kind: cards
  en: Keep EU trade preferences (GSP+) and limit the cost of UN Human Rights Council accountability, which Colombo rejects as an unprecedented expansion of the Council's mandate. Preferences matter to exporters,
    and the EU link is conditional on human rights and on replacing the Prevention of Terrorism Act.
  it: ''
- hash: 3555865a
  kind: cards
  en: 'Worker remittances: a record US$8.08bn in 2025, up from about US$6.6bn in 2024. The Gulf states supply most of it, though the share is disputed (about 40% for four Gulf states in one estimate, about
    80% for the whole region in another). The total is a Central Bank figure as reported by the press.'
  it: ''
- hash: 583b2dd2
  kind: cards
  en: 'Ports and energy as bargaining chips: a Colombo West container terminal for Adani (after it withdrew a US DFC loan request), the Hambantota port under a 99-year lease to a Chinese state firm (2017),
    a US$3.7bn Sinopec refinery approved for Hambantota, and the trilateral Trincomalee energy hub with the UAE and India.'
  it: ''
- hash: 6846878d
  kind: cards
  en: 'Neutrality as a diplomatic instrument: Colombo says Sri Lankan territory will not be used in ways detrimental to India, and says it will not take sides between India and China. That keeps both capitals
    engaged and both lenders open, but it is a pledge that other actors test rather than a treaty.'
  it: ''
- hash: 2c18783c
  kind: cards
  en: 'Debt and IMF conditions: fuel and electricity must be priced at cost recovery, and the programme bars new external payment arrears and new or tighter import restrictions. The IMF records both continuous
    criteria as not observed in the latest review, and lists the Middle East war and Cyclone Ditwah as downside risks.'
  it: ''
- hash: bbbbf869
  kind: cards
  en: 'India''s leverage over security and the Tamil question: Indian fishermen arrested in the Palk Strait (the navy counted 515 arrests and 66 trawlers seized in 2024 by early December) keep Tamil Nadu
    pressing Delhi, and Tamil groups call the 2025 HRC text too soft. Colombo cannot move far toward China without a cost in New Delhi.'
  it: ''
- hash: 6268c0ff
  kind: cards
  en: 'EU market access is conditional: GSP+ depends on the 27 conventions and on the PTA replacement, and the EU reviews Sri Lanka for the period after 2027 under new criteria. EU imports from Sri Lanka
    fell from EUR 3.2bn in 2022 to EUR 2.6bn in 2024.'
  it: ''
- hash: 954fc029
  kind: cards
  en: 'Balancing makes each giant a fear of the other: the Trincomalee energy hub and the India defence umbrella were read by analysts as a counter to China''s Hambantota refinery deal, which pulls Colombo
    closer into the rivalry its neutral line is meant to avoid.'
  it: ''
- hash: d2cc53b8
  kind: cards
  en: 'Sri Lanka is a small island on the Indian Ocean sea lanes, and its foreign policy is driven first by money: the IMF programme, creditors, Gulf remittances and fuel imports. The Dissanayake government
    (NPP, in office since September 2024) tries to turn that position into several deals at once. India gets energy, defence and the grid; China keeps Hambantota and the refinery it has already signed for;
    the EU and the US keep trade preference and tariff relief in play.

    The line it calls neutral is a constraint as much as an instrument. It keeps every lender open, and it is what a debt setback, a fishermen''s dispute, a Tamil vote in Geneva or a Gulf oil shock would
    test first.'
  it: ''
- hash: edbb65a3
  kind: cards
  en: Win back tariff relief and AGOA access for the textile sector. The US announced a 50% rate on Lesotho in April 2025, the highest of any country; press reports it paused, with a 10% baseline since.
  it: ''
- hash: 800b568e
  kind: cards
  en: 'Keep the economy from collapsing while jobs go: a state of disaster declared in July 2025, reported to run until 30 June 2027, with overall unemployment near 30% and youth unemployment near 50%.'
  it: ''
- hash: f8137f33
  kind: cards
  en: Textile exports as the lever. Textiles are the largest private employer (about 40,000 jobs) and about 90% of manufacturing exports; US exports under AGOA are about a tenth of GDP. That value to Washington
    is the only card the country holds, and the 2025 tariff was aimed at it.
  it: ''
- hash: 731b992c
  kind: cards
  en: Emergency powers. The state of disaster lets the government redirect funds to recovery programmes and take all necessary measures to reduce the effect of the disaster, without waiting for ordinary
    budget procedure.
  it: ''
- hash: 7fc356f5
  kind: cards
  en: Concentration. Textiles dominate private employment and manufacturing exports, so one order decision can cost thousands of jobs; the 2025 cancellations and the closure of a 1,300-worker factory showed
    it.
  it: ''
- hash: 05d92934
  kind: cards
  en: Thin room in the budget. Unemployment near 30% overall leaves little margin for an emergency that is financed by moving existing funds rather than by new revenue.
  it: ''
- hash: 6ff53d3d
  kind: cards
  en: 'The economy''s strongest export is also its weakest point: the textile sector built on US access is the largest private employer, so a tariff on that sector becomes a threat to the state itself,
    which is why Maseru answered with an emergency rather than a trade dispute.'
  it: ''
- hash: a936cba5
  kind: cards
  en: Lesotho has no treaty with any great power and no military ambition; its strategy is to keep the US, China and the UK willing to buy its textiles and to keep the wider South African neighbourhood
    quiet. The 2025 tariff showed that one sector carrying most of the export economy can be cut by a decision in Washington, and the reply was an emergency rather than a new strategy. The test for 2026-2027
    is whether AGOA access or a replacement market can come back fast enough to stop the state of disaster becoming a permanent dependence.
  it: ''
- hash: 4944320a
  kind: cards
  en: 'Deter and, if deterrence fails, hold the line against Russia on a frontier that is only a few hundred kilometres wide: the Suwalki corridor between Kaliningrad and Belarus. The state''s own intelligence
    says Russia could be ready for a limited conflict in the Baltic region within 3-5 years of a ceasefire in Ukraine (1-2 years if sanctions are lifted), so the aim is to be a costlier target than the
    neighbours.'
  it: ''
- hash: 28298e02
  kind: cards
  en: 'Keep the allies physically on the ground and bind them with money: a permanent German brigade (full by 2027), a rotational US presence that Vilnius now offers to pay for as a permanent base, NATO''s
    forward land forces, and a national division by 2030 financed by EU loans. Defence spending is the currency - 5.38% of GDP in 2026 and at least about 5% planned for 2027.'
  it: ''
- hash: 3842733b
  kind: cards
  en: 'Make Ukraine''s survival and Euro-Atlantic anchoring part of Lithuania''s own security: military aid fixed by law at 0.25% of GDP a year (EUR 223m earmarked for 2026), non-recognition of any Russian
    annexation, and backing for Ukrainian EU and NATO membership - the Lublin Triangle with Poland is the political frame.'
  it: ''
- hash: 06f07c30
  kind: cards
  en: Isolate Belarus while it backs Russia's war and runs Astravets below nuclear-safety standards, and shut hybrid pressure (smuggling balloons, migrants) at the border - without letting Washington's
    transactional line on Minsk (potash sanctions lifted in March 2026) undo the EU sanctions wall that Vilnius guards.
  it: ''
- hash: 5ccbc6d2
  kind: cards
  en: 'Complete the break with the Russian and Belarusian energy systems and become a hub rather than a periphery: Baltic grid synchronised with continental Europe (9 Feb 2025), Klaipeda LNG terminal, Via
    Baltica and Rail Baltica, the Polish-owned Mazeikiai refinery kept running. Dependence now runs west and north, to Poland, Germany, the Nordics and the EU budget.'
  it: ''
- hash: 893dd0d2
  kind: cards
  en: 'Repair relations with China without giving up the Taiwan link that provoked the 2021 coercion: the Sinkevicius programme (July 2026) seeks to normalise ties and restore representation to the level
    of other EU states, while President Nauseda insists that only Taipei can rename its representative office and warns that reopening the question could cost the office altogether.'
  it: ''
- hash: 80b43805
  kind: cards
  en: 'Agenda-setting inside NATO and the EU out of proportion to size: a Lithuanian is the EU''s defence commissioner (Kubilius), Vilnius pushes sanctions on Belarus and on Russian grain transit (proposal
    of 8 Oct 2026), holds the veto on EU potash sanctions, and the Seimas has called for Russia to be recognised internationally as a terrorist state.'
  it: ''
- hash: 61b55d24
  kind: cards
  en: 'Treaty exits as signalling and capability: the Convention on Cluster Munitions (effective 6 Mar 2025) and the Ottawa mine-ban convention (effective 27 Dec 2025), the latter jointly urged by the defence
    ministers of Lithuania, Latvia, Estonia and Poland with Finland following; and a first Seimas vote (106-18, Oct 2026) to strike Article 137 from the constitution so that allied nuclear-armed aircraft
    and ships can enter.'
  it: ''
- hash: e09c5a7d
  kind: cards
  en: 'A land-power build-up: 44 Leopard 2A8 tanks (EUR 950m, delivery by 2030, the first armoured unit Lithuania has had), 8 HIMARS launchers (USD 495m, with ATACMS), NASAMS deliveries from 2026, a national
    division headquarters by 2030, Baltic Defence Line fortifications, and a German brigade of about 5,000 at Rukla and Rudninkai under which NATO''s multinational battlegroup was placed on 4 Feb 2026.'
  it: ''
- hash: abc1125f
  kind: cards
  en: 'EU money and a deficit it is willing to run: a EUR 6.375bn SAFE defence loan (45 years, 10-year deferral; first EUR 956m paid in June 2026), most of it earmarked for the national division, and a
    2027 general-government deficit planned at about 3.8% of GDP, above the EU limit. Sanctions as economic policy: the 2022 ban on Belarusian potash transit through Klaipeda, held against US pressure.'
  it: ''
- hash: f766db06
  kind: cards
  en: 'A public line that names Russia as the threat and the war as Europe''s: annual national threat assessments with dated scenarios, a unanimous Seimas resolution calling Russia a state that supports
    and perpetrates terrorism (May 2022), and prosecutions that publicise Russian sabotage (the IKEA arson verdict of Nov 2025).'
  it: ''
- hash: 45ae8a5d
  kind: cards
  en: 'Geography: the Suwalki corridor between Kaliningrad and Belarus carries the only land link to the rest of NATO, and Russia''s GPS spoofing from Kaliningrad has grown from 3 to 36 antennas in a year.
