items:
- hash: 758bf87d
  it: |
    Spingere Israele indietro fino alle linee del 1974 e firmare un accordo di sicurezza che mantenga viva la rivendicazione sul Golan e non limiti il diritto della Siria a ricostruire il proprio esercito o a scegliere le proprie alleanze; nel frattempo evitare una guerra con un vicino più forte.
- hash: 6c9dc058
  it: |
    Mantenere un equilibrio fra più patroni: la Turchia per l'esercito e il nord, il Golfo per il denaro, Washington per la legittimità e il sollievo dalle sanzioni, Mosca tenuta a distanza (Hmeimim e l'ormeggio di Tartus convertiti in centri di addestramento congiunti, memorandum del 9 Aug 2026), l'Europa per i mercati e un accordo di partenariato.
- hash: 1fa83c11
  it: |
    Rendere la Siria utile anziché una minaccia: ha aderito alla coalizione anti-ISIS (10 Nov 2025), ha preso il controllo delle prigioni dell'ISIS, sequestra armi destinate a Hezbollah ai confini libanese e iracheno, e si propone come corridoio di transito (gas del Golfo via Giordania, gas azero via Turchia, petrolio iracheno via Baniyas).
- hash: 4b73c050
  it: |
    Multiallineamento a livello di leader: Trump a Riad (May 2025) e alla Casa Bianca (10 Nov 2025), Macron a Parigi (7 May 2025), Putin a Mosca due volte (Oct 2025, 28 Jan 2026), Merz a Berlino e Starmer a Londra (March 2026), le capitali del Golfo, e una visita di Kallas a Damasco (29 Sep 2026). Il ministro degli Esteri Shaibani si occupa dei dossier israeliano, europeo e cinese.
- hash: c22d8940
  it: |
    Autopresentazione come partner nella lotta al terrorismo e come stabilizzatore, anziché come minaccia per la sicurezza (al-Sharaa a Fox News: la Siria dovrebbe essere considerata un alleato geopolitico); commissione nazionale d'inchiesta e processi pubblici (dal 17 Nov 2025) per rispondere alle accuse sulle uccisioni lungo la costa avvenute in March 2025; SANA come canale per tutte le posizioni.
- hash: '56889875'
  it: |
    Un nuovo esercito costruito per assorbimento, non per conquista: fazioni ex ribelli, seimila combattenti delle SDF registrati entro July 2026 (fonte governativa, non confermata ufficialmente), addestramento turco secondo l'accordo del 13 Aug 2025, consegna della base di Tanf (Feb 2026) e del campo di al-Hol, e migliaia di soldati trasferiti al confine libanese in March 2026.
- hash: 3130b3e7
  it: |
    Concessioni e corridoi pagati da altri: la concessione trentennale di DP World su Tartus (USD 800m promessi), il 20% di AD Ports nel terminal container di Latakia, i piani immobiliari di Eagle Hills per USD 20bn, il gas finanziato dal Qatar via Giordania e via Turchia, accordi sauditi nelle telecomunicazioni e nell'aviazione, e il pagamento da parte di Arabia Saudita e Qatar degli arretrati della Siria con la World Bank (USD 15.5m, 2025), che ha riaperto il credito multilaterale.
- hash: 59c51c31
  it: |
    Un'economia in rovina: la World Bank quantifica in USD 108bn i danni fisici diretti e in USD 216bn (intervallo 140-345bn) il costo della ricostruzione, circa dieci volte l'economia del 2024; i tagli agli aiuti e una scarsa fornitura di energia elettrica (le consegne di gas aggiungono solo poche ore al giorno) lasciano lo Stato dipendente da promesse, molte delle quali sono memorandum d'intesa (MoU) non confermati.
- hash: 6e32f6ad
  it: |
    Israele mantiene una zona di sicurezza nel sud (nove basi e avamposti dal monte Hermon a Daraa e Quneitra secondo ACLED, June 2026; 84 incursioni di terra in May 2026 soltanto) e il suo ministro della Difesa afferma che le truppe resteranno « per un periodo illimitato »; la Siria non dispone di difesa aerea per contrastarlo e la linea del 1974 non è applicata.
- hash: 692e369c
  it: |
    Dossier delle minoranze ancora aperti: le uccisioni lungo la costa in March 2025 (circa 1,400 morti secondo la UN Commission of Inquiry, che ha riscontrato probabili crimini di guerra da parte di forze legate al governo e di lealisti di Assad), Suwayda fuori dal controllo dello Stato dopo gli scontri di July 2025 tra drusi, beduini e governo (una National Guard guidata dallo sceicco Hijri, di nuovo in combattimento il 31 Aug 2026), e un'integrazione curda più dichiarata che messa alla prova.
- hash: a14eedab
  it: |
    Una capacità antiterrorismo esigua e un'uscita degli Stati Uniti: le forze statunitensi hanno lasciato Tanf (11 Feb 2026) e, secondo quanto riferito, Shaddadi; ne restano circa 1,000 e più di 5,700 detenuti dell'ISIS sono stati trasferiti in Iraq (21 Jan - 12 Feb 2026) perché i campi non potevano essere presidiati; gli analisti dubitano che Damasco possa colmare il vuoto. L'uccisione di un soldato e di un interprete statunitensi a Palmira (13 Dec 2025) mostra l'esposizione.
- hash: 7dffd7bd
  it: |
    Il sollievo dalle sanzioni è condizionato al comportamento: l'abrogazione della legge Caesar prevede una revisione ogni 180 giorni per quattro anni (lotta all'ISIS, diritti delle minoranze) e consente sanzioni mirate se Damasco è « fuori rotta »; la EU mantiene le inclusioni in lista legate ad Assad e quelle per motivi di sicurezza; l'Egitto ha respinto un ambasciatore siriano in June 2026 e le fazioni sciite irachene hanno impedito ad al-Sharaa di partecipare al vertice della Arab League a Baghdad nel 2025.
- hash: 27f76190
  it: |
    Pressioni esterne su rifugiati e combattenti stranieri: il cancelliere tedesco ha dichiarato che l'80% dei 900,000 siriani in Germania dovrebbe rientrare entro tre anni (March 2026), cosa che Damasco dice di non poter assorbire, e la Cina preme per allontanare circa 20,000 uiguri che teme (e Damasco si è impegnata a che nessun gruppo minacci gli interessi cinesi).
- hash: d9a88c49
  it: |
    La protezione turca contro Israele attira il fuoco israeliano che dovrebbe scoraggiare. I piani di addestramento, difesa aerea e basi di Ankara sono il motivo per cui Damasco si sente in grado di resistere alle richieste israeliane, eppure Israele ha colpito otto volte la pista di Abu al-Duhur il 18 Aug 2026 proprio perché la Siria stava per ospitare truppe turche (« non tollereremo un insediamento militare turco che si sposti verso sud »); Damasco ha poi interrotto i contatti con Israele prima di tornare ai colloqui il 23 Aug.
- hash: f1525f1f
  it: |
    La vittoria nell'est ha rimosso il cuscinetto che conteneva lo Islamic State. La presa del territorio, dei campi e delle prigioni delle SDF in January 2026 ha dato a Damasco l'unità sulla carta, ma gli Stati Uniti hanno poi lasciato Tanf e Shaddadi e trasferito i detenuti in Iraq; così lo Stato che voleva presentarsi come partner indispensabile nella lotta all'ISIS porta ora il peso della battaglia con un esercito giovane e con meno controllo americano.
- hash: 5a543852
  it: |
    Usare la forza per unificare lo Stato produce la violenza da cui dipendono il denaro occidentale e il pretesto israeliano. Le uccisioni lungo la costa in March 2025 e gli scontri di Suwayda di July 2025 sono nati ciascuno da un tentativo di estendere il controllo, e ciascuno ha offerto ai critici una condizione (la revisione Caesar di 180 giorni, l'inchiesta UN) e ha offerto a Israele il ruolo di protettore dei drusi; Hijri a Sweida ora si schiera con Israele.
- hash: 3adf8f5d
  it: |
    Chiudere la porta a Mosca indebolisce l'unica grande potenza che potrebbe presidiare il sud. Il memorandum del 9 Aug 2026 trasforma Hmeimim e l'ormeggio di Tartus in centri di addestramento congiunti e conquista il favore occidentale, ma una fonte siriana ha detto, prima dei colloqui di Mosca in January 2026, che al-Sharaa potrebbe chiedere una polizia militare russa come garante contro le incursioni israeliane (riferito, non confermato), e Assad, in esilio, si trova ancora in Russia. Allontanare la Russia aumenta l'esposizione della Siria alla coppia Israele-Turchia che deve bilanciare.
- hash: dc1ebdad
  it: |
    Lo stesso esercito non può affrontare ogni fronte. Le brigate inviate contro le milizie curde in January 2026 sono state trasferite al confine libanese in March, quando è iniziata la guerra con l'Iran; l'idea di Trump che la Siria « finisse il lavoro » contro Hezbollah è stata sconfessata da al-Sharaa, che ha bisogno che il confine resti tranquillo per vendere la Siria come corridoio, ma perderebbe il credito occidentale se la linea di rifornimento di Hezbollah si riaprisse.
- hash: ebc9f7ac
  it: |
    La dipendenza è il prezzo dell'indipendenza offerta: ogni patrono finanzia una Siria diversa. Il Qatar paga il gas che fa funzionare la rete elettrica, l'Arabia Saudita e gli Emirati Arabi Uniti pagano porti e telecomunicazioni, la Turchia l'esercito, Washington la deroga alle sanzioni, Bruxelles e Berlino chiedono il rientro dei rifugiati in cambio dell'accordo di partenariato. Diversificare i patroni protegge al-Sharaa da ciascuno di essi e lo rende responsabile nei confronti di tutti insieme (Damasco ha detto a Israele che non accetterà limiti alle sue alleanze; gli impegni già assunti sono i limiti).
- hash: 4c45ed3a
  it: |
    La Siria di Ahmed al-Sharaa conduce la grand strategy di un'insurrezione vittoriosa
    che deve diventare uno Stato prima che i suoi patroni perdano la pazienza. L'ordine di priorità
    degli obiettivi è l'ordine dei pericoli: prima il monopolio della forza (l'accordo con le SDF,
    Suwayda, la costa), poi la legittimità (cancellazione dalle liste, sollievo dalle sanzioni, abrogazione
    della legge Caesar), poi il denaro. Il metodo è il multiallineamento a livello di leader, senza che nessun
    patrono possa possedere lo Stato: la Turchia per l'esercito, il Golfo per il denaro,
    Washington per il permesso di commerciare, la Russia mantenuta solo come partner di addestramento,
    l'Iran espulso. Lo schema di Luttwak è che ogni mossa che costruisce lo Stato invita anche un estraneo
    al suo interno: l'ombrello turco attira il colpo israeliano, la conquista dell'est toglie la copertura
    americana, la pressione sulle minoranze fornisce le condizioni che il denaro occidentale porta con sé. Segnali che non
    sono righe: il dispiegamento dell'esercito siriano al confine libanese in March 2026,
    il rifiuto di al-Sharaa di partecipare al vertice di Baghdad del 2025, e il rifiuto dell'Egitto
    di accettare un ambasciatore siriano. Questione aperta per la prossima revisione: se lo scioglimento
    delle SDF del 25 Aug supererà il primo test a Hasakah e Kobani, e se un accordo di sicurezza con Israele
    verrà firmato o il sud si assesterà in un'occupazione congelata. Non letti in questo passaggio: le analisi
    di Crisis Group e Carnegie sul 2026 (il budget di ricerca si è esaurito), quindi le valutazioni su Israele, Russia e Cina
    si basano su stampa e dichiarazioni ufficiali.
- hash: c7ab9234
  it: |
    Mantenere al potere il regime di Mahamat Idriss Déby. Putin lo ha lodato in January 2024 per aver stabilizzato il Paese e ha offerto aiuto; i resoconti del 2025 su attacchi vicino al palazzo presidenziale non sono qui documentati.
- hash: fccf6e6b
  it: |
    Tenere la guerra in Sudan lontana dal territorio ciadiano. Il confine orientale è stato chiuso a tempo indeterminato il 23 Feb 2026, adducendo la presenza di gruppi armati sudanesi dopo i combattimenti ad al-Tina; il Ciad aveva espulso quattro diplomatici sudanesi in December 2023, e Khartum accusa N'Djamena di aiutare le RSF.
- hash: 9c725e3d
  it: |
    Presidiare i confini del lago Ciad e della Libia con i partner: la MNJTF con Camerun e Nigeria, con mandato contro Boko Haram e ISWAP, e una forza di frontiera congiunta con l'LNA di Haftar nell'est (14 Nov 2025). L'anteprima di June 2026 indica che il Ciad ha minacciato di ridurre o abbandonare la MNJTF.
- hash: 16b5480e
  it: |
    L'esercito ciadiano come forza regionale: una colonna sul confine tra Niger e Libia (imboscata riferita dalla stampa, 27 Feb 2026), la forza di frontiera congiunta con l'LNA e il contingente della MNJTF. La forza del lago Ciad presenta lacune di capacità, quindi l'esercito porta il peso maggiore.
- hash: bc9897ff
  it: |
    Patronato multivettoriale dall'uscita della Francia: l'ospedale da campo di Abu Dhabi ad Amdjarass e l'aumento degli aiuti militari (2023-24), l'accoglienza riservata da Putin in January 2024, una missione di addestramento ungherese prevista per circa 200 soldati, e un'ambasciata a Tripoli. Ogni patrono compra accesso; non è stato dimostrato che qualcuno compri una garanzia.
- hash: a1b826dd
  it: |
    Il garante francese non c'è più. Il Ciad ha posto fine all'accordo di difesa in November 2024 (Le Monde, 29 Nov 2024), la Francia ha consegnato la sua base di Faya il 26 Dec 2024 e ha completato il ritiro in January 2025 (Stratfor). L'esercito ha ora bisogno di altri patroni per la propria difesa.
- hash: '65539510'
  it: |
    Il quadro di sicurezza condiviso è fragile. La MNJTF presenta lacune di capacità persistenti (mezzi aerei, sistemi antidrone, bonifica di ordigni esplosivi improvvisati) e la sua composizione è contestata nelle fonti; la minaccia del Ciad di ritirarsi è il segnale più netto. Il Ciad non può contare sulla forza come scudo.
- hash: d5597a9b
  it: |
    Il Ciad chiude il confine con il lato sudanese dei rifornimenti delle RSF, mentre accetta l'ospedale, gli aiuti e i voli cargo di Abu Dhabi, che Khartum e le cronache chiamano la porta occidentale delle RSF. La chiusura risponde a una minaccia che la relazione con il patrono contribuisce a sostenere.
- hash: 5b078045
  it: |
    Lasciare la Francia per guadagnare margine di manovra ha portato promesse anziché truppe. Mosca e Budapest hanno offerto cooperazione, ma nelle fonti reperite non risulta confermata alcuna presenza dell'Africa Corps in Ciad, e la missione ungherese non ha avuto un avvio confermato; l'uscita da un garante lascia l'esercito con patroni che non può vedere sul terreno.
- hash: 2faedc96
  it: |
    La grand strategy del Ciad è la sopravvivenza del regime di Déby su confini che non può sigillare: la guerra in Sudan, la Libia orientale e i jihadisti del lago Ciad gravano tutti su un unico esercito. Avendo perso la Francia come garante, N'Djamena distribuisce il proprio patronato tra Abu Dhabi, Mosca, Budapest e Haftar, e compra più accesso che protezione. Le lacune riguardano la questione zaghawa (la parentela del clan in Darfur tra le vittime delle RSF, una lettura tratta dalla scheda SDN e non documentata qui), il corridoio petrolifero, la Repubblica Centrafricana, il Camerun e gli Stati Uniti, nessuno dei quali è ancora documentato per questa scheda.
- hash: 2bf31d41
  it: |
    Essere il ponte tra il Sahel e il Golfo di Guinea: la strategia Togo-Sahel per il 2026-2028, presentata a Lomé il 18 April 2026 sotto il patronato del presidente del Consiglio Faure Gnassingbé, sostituisce il piano del 2021, mira a rafforzare il dialogo politico con gli Stati del Sahel e presenta il Togo come mediatore credibile.
- hash: 23ddb505
  it: |
    Impedire che la violenza jihadista al confine settentrionale si estenda a sud: la strategia indica la persistente minaccia terroristica e la sua diffusione verso gli Stati costieri del Golfo di Guinea come motivo per aggiornare la propria politica sul Sahel.
- hash: cb355834
  it: |
    Mediazione e dialogo: un incontro in sei sessioni a Lomé in April 2026 con governi, organizzazioni regionali e internazionali, inviati speciali e società civile, pensato per presentare la strategia e costruire il dialogo politico con gli Stati del Sahel.
- hash: 429261cb
  it: |
    La minaccia terroristica è ai suoi stessi confini: la stessa strategia afferma che l'insicurezza si sta diffondendo verso gli Stati costieri, quindi la diplomazia del Togo nel Sahel è anche un problema di sicurezza che deve gestire insieme agli Stati con cui dialoga.
- hash: 3f0aab87
  it: |
    Il ponte porta verso gli Stati la cui uscita dall'ECOWAS e la cui insicurezza la strategia indica come problema: le ragioni della strategia stessa sono la persistente minaccia terroristica, la sua diffusione verso la costa e la partenza degli Stati del Sahel dall'ECOWAS. Più Lomé si avvicina all'AES, più si assume l'esposizione che vorrebbe gestire dall'esterno.
- hash: ad874f08
  it: |
    La strategia del Togo, per quanto emerge dalle fonti aperte per questa scheda, è trasformare un piccolo Stato del Golfo di Guinea nel mediatore tra le giunte militari del Sahel e gli Stati costieri, così che la guerra jihadista al confine settentrionale venga affrontata con i negoziati piuttosto che solo con le truppe. La scheda è scarna: l'unica fonte aperta è una strategia annunciata dal governo (April 2026), e la costituzione e le proteste del 2025, la questione dell'adesione all'Alliance of Sahel States, il ruolo del Port of Lomé per gli Stati del Sahel senza sbocco sul mare, e i rapporti con Nigeria, ECOWAS, Ghana, Benin, Francia e Cina non sono ancora documentati al livello richiesto dalla scheda. Sono queste le lacune per il prossimo passaggio.
- hash: 86f56c43
  it: |
    Mantenere intatto l'ordine costituito in patria: una monarchia protetta dalla legge sulla lesa maestà, e un esercito, tribunali e il Senate in grado di rimuovere o sciogliere ciò che eleggono gli elettori, con una coalizione conservatrice e legata al mondo degli affari al governo. Il ciclo 2025-26 ne è la prova: Paetongtarn Shinawatra è stata rimossa dalla Constitutional Court (6-3, 29 Aug 2025), Anutin Charnvirakul ha assunto l'incarico (5 Sep 2025), ha indetto elezioni anticipate e le ha vinte (Bhumjaithai con 192 seggi su 499 l'8 Feb 2026), e una legge di amnistia in vigore dal 24 Aug 2026 copre i reati politici dal 2005 al July 2025 ma esclude l'articolo 112.
- hash: b80c5593
  it: |
    Risolvere la questione della frontiera con la Cambogia alle condizioni thailandesi e mantenerla bilaterale: confermare le posizioni assunte nel 2025, inviare le questioni di confine solo alla Joint Boundary Commission, e fare dello sminamento, dell'assenza di nuove violazioni e dell'azione contro i complessi delle truffe il prezzo di relazioni normali. Bangkok non può apparire disposta a cedere: la telefonata trapelata con Hun Sen è costata a Paetongtarn la carica, e i combattimenti con la Cambogia sono stati il contesto in cui Anutin ha indetto le sue elezioni.
- hash: 905bf354
  it: |
    Mantenere buoni rapporti con ogni grande potenza senza aderire a nessuno dei loro blocchi: alleato per trattato e Major Non-NATO Ally degli Stati Uniti (Cobra Gold, un quadro tariffario), partner economico e ora anche per la difesa della Cina (ferrovia ad alta velocità, un meccanismo 2+2, un sottomarino cinese), un vertice con Putin a Kazan, un accordo di libero scambio con l'EU in preparazione, e jet svedesi al posto di quelli americani.
- hash: d2959978
  it: |
    Proteggere un'economia orientata all'export e al turismo che vende all'estero l'equivalente del 71% del GDP: assicurare l'accesso ai mercati (un quadro con gli Stati Uniti con un'aliquota reciproca del 19%, un accordo con l'EU con 15 capitoli su 24 chiusi entro June 2026, un accordo con la Eurasian Economic Union ipotizzato) e gestire il passaggio della sua industria più grande, quella automobilistica, dai marchi giapponesi a quelli cinesi.
- hash: 3e6317af
  it: |
    Contenere il collasso del Myanmar e l'economia criminale cresciuta lungo la frontiera di 2,400 km (complessi per le truffe, droga, rifugiati) lavorando con chiunque controlli il territorio: prima con la giunta (« non si tratta di legittimità, si tratta di realtà »), mantenendo però un doppio binario con l'altra parte del confine.
- hash: '4e707049'
  it: |
    Porre fine all'insurrezione nel sud senza internazionalizzarla: un dialogo facilitato dalla Malaysia con il BRN, un nuovo capo negoziatore (il capo dell'intelligence, nominato in May 2026) e un round di alto livello previsto in Malaysia a September, con decentramento e amnistie che, secondo quanto riferito, sarebbero sul tavolo.
- hash: 9bf460bc
  it: |
    Bilanciamento omnidirezionale a livello di leader: Xi Jinping ha ricevuto Anutin a Shanghai il 17 Jul 2026 (dichiarazione congiunta, un nuovo meccanismo 2+2 per gli affari esteri e la difesa); Putin lo ha incontrato a Kazan il 18 Jun 2026; Trump e lui si sono scambiati lettere e hanno concordato un quadro commerciale il 26 Oct 2025; il partenariato strategico con Modi (Apr 2025) e il partenariato strategico globale del Vietnam (May 2025) completano il quadro. Non si aggiunge nulla al trattato con gli Stati Uniti e non si aderisce ad alcun blocco.
- hash: 6f8fe325
  it: |
    ASEAN come cornice, non come arbitro: Bangkok ha accettato la mediazione della presidenza malese (colloqui di Putrajaya e cessate il fuoco dal 28 Jul 2025; dichiarazione di Kuala Lumpur del 26 Oct 2025) quando la minaccia tariffaria di Washington ha reso costoso il rifiuto, poi ha mantenuto bilaterale la questione di confine attraverso la Joint Boundary Commission; entrambe le parti usano gli ASEAN Observer Teams per sostenere versioni contrapposte (Crisis Group).
- hash: a86cbf8e
  it: |
    Forza sulla frontiera e armamenti diversificati. Le forze thailandesi occupano gran parte delle alture e si trovano su entrambi i lati della linea contesa (Crisis Group), dopo i raid aerei dei combattimenti del 2025; l'aeronautica ha scelto i Gripen E/F svedesi anziché gli F-16 americani nonostante le pressioni di Washington (quattro velivoli, circa SEK 5.3bn, firmati il 25 Aug 2025, nell'ambito di un piano da 12 velivoli); la marina acquista un sottomarino cinese S26T. Cobra Gold 2026 (24 Feb-6 Mar, circa 8,000 militari di 30 Paesi) mantiene aperto il canale americano.
- hash: 96bcc466
  it: |
    Il commercio di frontiera come leva e l'accesso ai mercati come scudo. Il commercio bilaterale con la Cambogia è calato del 40% a USD 1.3bn nella prima metà del 2026, mentre le relazioni si congelavano; l'energia elettrica, internet e il carburante verso cinque aree di frontiera del Myanmar sono stati interrotti il 5 Feb 2025 per esercitare pressione sui complessi delle truffe; e il quadro tariffario con Washington (barriere tariffarie eliminate su circa il 99% dei beni statunitensi, USD 5.4bn annui di energia, 80 aerei Boeing) è il prezzo dell'aliquota del 19%.
- hash: 2e6f63be
  it: |
    Una cornice nazionalista per la guerra con la Cambogia, una cornice realista per il Myanmar. Il briefing settimanale del ministero degli Esteri pubblica la versione thailandese di ogni episodio (sparatoria di Chong Bok del 6 Jan 2026: nessuna ritorsione, una protesta formale); le elezioni anticipate di Anutin sono state indette durante i combattimenti, e gli analisti le leggono come un tentativo di capitalizzare sul nazionalismo; sul Myanmar la linea è « non si tratta di legittimità, si tratta di realtà ».
- hash: 9f539159
  it: |
    Il veto dell'establishment su ogni primo ministro. La Constitutional Court ha rimosso Paetongtarn per una telefonata trapelata con Hun Sen (June 2025), su una petizione arrivata alla Corte attraverso il presidente del Senate; nessun governo può apparire disposto a cedere sulla Cambogia. Il People's Party (120 seggi, la più grande opposizione) è all'esterno, e Anutin governa con il partito degli Shinawatra che la Corte ha rimosso.
- hash: 44a67e7f
  it: |
    La monarchia e la legge sulla lesa maestà sono fuori discussione. L'amnistia in vigore dal 24 Aug 2026 (circa 6,000 persone) esclude l'articolo 112: delle circa 290 persone imputate dal 2020, si prevedeva che ne avrebbero beneficiato solo circa 10, e il 16 Jul 2026 la corte d'appello di Chiang Mai ha confermato la condanna di Arnon Nampa. Lo stesso tabù limita ciò che qualsiasi governo può dire sulle riforme in patria e ciò che i partner possono chiedere.
- hash: 9d6c10e6
  it: |
    Una guerra che non può essere vinta né conclusa da soli. La frontiera è tranquilla dal cessate il fuoco del 27 Dec 2025, ma resta instabile: Crisis Group valuta scarse le prospettive immediate di un accordo, il commercio bilaterale è crollato, la Joint Boundary Commission è in stallo, e la Cambogia continua a protestare per le trincee thailandesi e per un'estensione della rete elettrica (10 Aug 2026). La prima tregua è arrivata solo dopo che Washington ha detto a entrambe le parti che non ci sarebbe stato alcun accordo commerciale finché fossero proseguiti i combattimenti.
- hash: 132dae31
  it: |
    Dipendenza dalla domanda estera: le esportazioni di beni e servizi erano il 71.1% del GDP nel 2025, e le entrate turistiche erano il 19.9% delle esportazioni nel 2019, ultimo anno con un valore nella serie della World Bank. Gli Stati Uniti hanno imposto un dazio del 12.5% sulle importazioni thailandesi in July 2026 e l'accordo reciproco non è ancora firmato; i costruttori giapponesi di automobili, il nucleo del settore, perdono quote a favore dei marchi cinesi.
- hash: 411dcda7
  it: |
    Una frontiera che non può chiudere, accanto a un vicino che non può governare. I complessi delle truffe di Myawaddy e Shwe Kokko sono stati il bersaglio del taglio di energia di Feb 2025, che secondo gli analisti avrebbe solo spinto questi complessi a spostarsi o a trovare altra energia e altra connessione internet; la guerra in Myanmar ha ucciso più di 100,000 persone (ACLED, citato da Al Jazeera); e il dialogo di Bangkok con Naypyidaw attira le critiche del Special Advisory Council for Myanmar.
- hash: aaf3f7bc
  it: |
    Un'insurrezione nel sud malay-musulmano che è sopravvissuta a ogni governo: la violenza è proseguita fino a June 2026 (un ordigno sul ciglio della strada a Tak Bai il 29 June ha ferito due cittadini malesi) mentre il BRN sostiene che i colloqui restano la via da seguire; il facilitatore è la Malaysia, che è stata anche mediatrice dell'ASEAN sulla Cambogia, così un solo vicino tiene in mano due dei problemi di Bangkok.
- hash: 9d1302fc
  it: |
    Il patrono ha trattato l'alleato come il nemico. La Thailandia è legata dal trattato del 1954 e ha lo status di Major Non-NATO Ally, eppure in July 2025 Trump ha detto sia a Bangkok sia a Phnom Penh che non ci sarebbe stato alcun accordo commerciale finché i combattimenti fossero proseguiti; il cessate il fuoco del 28 Jul è seguito alle sue telefonate, e Washington ha poi rivendicato come proprio l'accordo di October. Bangkok ha mantenuto il controllo del terreno ma non le condizioni della fine del conflitto.
- hash: f98e5883
  it: |
    Diversificare allontanandosi dagli armamenti americani ha creato una dipendenza dalla Cina. L'ordine dei Gripen (Aug 2025) ha sostituito l'F-16, ma il sottomarino S26T ordinato in Cina era stato specificato con un motore tedesco MTU che la Germania non avrebbe concesso per quel modello; un contratto rivisto (September 2025) sostituisce il motore con il cinese CHD620 e la consegna è prevista entro la fine del 2028, mentre le ulteriori imbarcazioni saranno decise dopo la prima. La diversificazione pensata per ridurre la dipendenza da un solo fornitore affida il primo sottomarino della marina al motore di un altro fornitore.
- hash: 60d470bd
  it: |
    L'espulsione che è piaciuta a Pechino è costata buona volontà a Washington. Il 27 Feb 2025 la Thailandia ha rimandato in Cina 40 uomini uiguri, nonostante avesse dato assicurazioni in senso contrario; il 14 Mar 2025 Rubio ha annunciato restrizioni sui visti per i funzionari thailandesi attuali ed ex responsabili, e Bangkok ha potuto solo dire di aver « ricevuto assicurazioni » dalla Cina sulla loro sicurezza.
- hash: 9a8c751d
  it: |
    La chiusura della frontiera colpisce l'economia che dovrebbe proteggere. Il commercio bilaterale con la Cambogia è calato del 40% a USD 1.3bn nella prima metà del 2026, eppure Crisis Group rileva che la Thailandia ha scarso interesse a modificare lo status quo perché controlla le alture; il costo ricade sulle province di confine mentre la controversia resta aperta.
