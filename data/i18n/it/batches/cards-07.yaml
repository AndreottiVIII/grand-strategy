# Translate every `en` into it. Write the translations to the file cards-07.out.yaml next to this one,
# as `items:` of `- hash: <same hash>` / `it: <translation>`, appending one item at a time (valid YAML at
# every step), never editing this file. Keep names, dates, numbers and quotes; register of a foreign-office
# brief: dry, precise, no flourish.
lang: it
items:
- hash: 6a4030d4
  kind: cards
  en: 'Make the state the only armed actor: bring the Popular Mobilization Forces and the Iran-aligned factions under the Commander-in-Chief by 30 June 2027 (individual fighters join the PMF, groups that
    keep their names after the deadline are ''outlaws''), complete the end of foreign troops, and hold ''exclusive authority over decisions of war and peace''. Prime Minister Ali al-Zaidi, 40, was chosen
    by the Coordination Framework after Washington vetoed Nouri al-Maliki, and won a vote of confidence on 14 May 2026 for 14 of 23 ministers.'
  it: ''
- hash: b2dc8d51
  kind: cards
  en: 'Stay out of the US-Israeli war on Iran and keep both patrons: Baghdad said on 11 March that it would not let any party use its territory as a base against Iran, and al-Zaidi''s line is ''balanced
    foreign relations''. The aim is that neither Washington nor Tehran treats Iraq as the other''s platform, because Iraq has no air defence of its own and has been hit by all sides.'
  it: ''
- hash: c6c092a7
  kind: cards
  en: 'Restore oil income, about 90% of budget revenue, by getting crude out without the Strait of Hormuz: the Kirkuk-Ceyhan pipeline to Turkey (the one route that kept flowing), the Basra-Haditha pipeline
    to be built by Chinese firms and extended toward Turkey, Syria and Jordan, and gasoline imports through the Syrian port of Baniyas. Exports fell from about 3.47 million b/d in January 2026 to about
    530,000 b/d in May-June; al-Zaidi puts the losses at about USD 60bn.'
  it: ''
- hash: 3c423880
  kind: cards
  en: 'Keep the lights on and cut the dependence on Iranian gas: imported gas carried up to 40% of generating capacity at peak, Iran stopped the flow on 18 March 2026 after the strikes on South Pars, and
    supply (about 29 GW against a normal demand near 40 GW and a summer peak of 55 GW) is the main trigger of street protest. The remedies are electricity bought from Turkey and the Kurdistan Region since
    late May, the TotalEnergies gas, solar and water project (GGIP) and domestic gas.'
  it: ''
- hash: 72fce5fa
  kind: cards
  en: 'Settle what neighbours hold of Iraq''s sovereignty: foreign bases (Turkey agreed on 24 September 2026 to hand over Bashiqa gradually), the Khor Abdullah waterway and the maritime line beyond marker
    162 with Kuwait (new coordinates filed with the UN on 19 January and 9 February 2026; a joint working group agreed on 25 September), and water with Turkey through the mechanism that pays Turkish firms
    from oil sales.'
  it: ''
- hash: 71b61939
  kind: cards
  en: 'Fold the Kurdistan Region back under federal terms while keeping its oil flowing: exports resumed on 27 September 2025 after two and a half years, but now all sales go through the federal marketing
    company SOMO; a Baghdad-Erbil deal of 17 March 2026 aimed at up to 450,000 b/d including 250,000 b/d from Kirkuk. The Peshmerga redeployment in the disputed territories and the budget transfers remain
    the levers.'
  it: ''
- hash: b263acdd
  kind: cards
  en: 'Venue and go-between without a bloc: the Arab League summit hosted in Baghdad on 17 May 2025 (Syria''s al-Sharaa withdrew after the invitation split Iraqi opinion), al-Zaidi''s first foreign trip
    to the White House on 13-14 July 2026, a meeting with Kuwait''s crown prince at the UN on 25 September 2026, and attendance at the Sharm el-Sheikh Gaza summit in October 2025.'
  it: ''
- hash: 0501ae6c
  kind: cards
  en: 'Sovereignty as the story: a four-day ''Sovereignty Day'' holiday from 30 September 2026 with parades in Baghdad and Najaf, and the line that the end of the coalition ''does not mean the end of the
    partnership''. It lets the government claim the withdrawal as its own achievement while the militias claim it as theirs.'
  it: ''
- hash: e5a890e0
  kind: cards
  en: 'Absorb rather than fight the factions: Saraya al-Salam dissolved on 27 May 2026, Asaib Ahl al-Haq and Kataib Imam Ali announced a handover of heavy weapons on 2 June, five factions accept state control
    by early October; a national air-defence procurement programme; checkpoints around Baghdad against drone launches. The PMF stays a statutory state force; the law to settle its place is still to be passed.'
  it: ''
- hash: 8f76f12e
  kind: cards
  en: 'Oil as the contract currency: oil-for-projects with China (a USD 4.56bn Basra-Haditha pipeline approved in January 2025), a USD 27bn headline package with TotalEnergies, Chevron in exclusive talks
    for the 460,000 b/d West Qurna-2 field taken over from Lukoil, and water projects built by Turkish firms and paid from oil sales. Each partner is paid in access to the same barrels.'
  it: ''
- hash: 326d2985
  kind: cards
  en: 'One product, one chokepoint: crude is about 90% of budget revenue and its southern export (about 3.47 million b/d in January 2026) ran through Hormuz, closed since the war began on 28 February. Export
    revenue in May-June was about USD 2.33bn against about USD 6.5bn in January alone; the oil ministry declared force majeure on foreign-operated fields in March; al-Zaidi says Iran refuses to let Iraqi
    tankers through.'
  it: ''
- hash: b98fccc8
  kind: cards
  en: 'Armed factions that are also parties: the Coordination Framework that chose the prime minister includes the political arms of the factions he must disarm. Kataib Hezbollah and Harakat Hezbollah al-Nujaba
    say they will not disarm until foreign troops leave and the umbrella Islamic Resistance in Iraq rejects any timeline; a senior Iraqi security official told the NYT the plan is unlikely to work without
    a US-Iran peace agreement. Parties linked to Iran-backed groups won more than 50 of 329 seats in November 2025.'
  it: ''
- hash: 1289380f
  kind: cards
  en: 'A grid that cannot carry the summer: the Iranian gas supply stopped on 18 March (about 3.1 GW lost), the US ended in 2025 the waiver that let Iraq pay for Iranian electricity, and protests over blackouts
    have spread through the central and southern provinces. The government''s legitimacy depends on power supplied by the country it is asked to restrain.'
  it: ''
- hash: 4c477409
  kind: cards
  en: 'No shield of its own and no shield left: after the last coalition troops left on 30 September 2026 the US reportedly removed its Patriot and C-RAM systems from Erbil, Iraq has no substantial air
    defence, and Iran, the US, Israel and Saudi Arabia have all struck targets on Iraqi soil in 2026. Crisis Group''s Lahib Higel urges Washington not to push al-Zaidi into a confrontation with pro-Iran
    groups that he is unlikely to win.'
  it: ''
- hash: 83818ae4
  kind: cards
  en: 'American financial and political leverage: Treasury designated seven Iran-backed militia commanders on 20 April 2026, Washington vetoed Maliki as prime minister in January, imposed a 12.5% tariff
    on 24 July and controls the dollar shipments and sanctions exemptions (such as the exemption for Iranian flights to Najaf) on which the state''s payments depend.'
  it: ''
- hash: 8fb757e5
  kind: cards
  en: 'A divided and partial state: the November 2025 election gave Sudani''s list a plurality of 46 of 329 seats, but government formation took until 14 May 2026 and produced a cabinet with 14 of 23 ministers
    confirmed; the Sadrists boycotted the vote, and the Kurdistan Region keeps its own armed forces, oil contracts and foreign contacts.'
  it: ''
- hash: b676066c
  kind: cards
  en: The withdrawal Baghdad negotiated gave the militias their argument and removed the pressure on them. Kataib Hezbollah and Nujaba said they would not disarm until foreign troops left; they claimed
    victory on 30 September, Ashab al-Kahf threatened 'a military response' to any foreign presence, and the disarmament date slid from 30 September 2026 to 30 June 2027. At the same moment the US reportedly
    took Patriot and C-RAM batteries out of Erbil.
  it: ''
- hash: b5a277f3
  kind: cards
  en: A state that pays the PMF is bombed for what the PMF does. The PMF is a legal part of the armed forces and receives state funds, so the US-Saudi strikes of 29 July 2026 (at least 20 killed), answering
    more than 30 drone attacks on Saudi oil sites in 72 hours, fell on state units; Baghdad protested the strikes while the Gulf demanded it stop the launches, and on 10-11 September a drone attack from
    Maysan shut the Saudi East-West pipeline, after which Iraq dismissed the local military commander.
  it: ''
- hash: 23a5ef2c
  kind: cards
  en: Neutrality did not keep the war out. Baghdad and Erbil declared neutrality and refused their soil as a base against Iran, yet Iran-aligned groups fired more than 600 times at US sites, the US struck
    the PMF, Israel reportedly kept covert outposts in the western desert, and Iran and its affiliates hit the Kurdistan Region with nearly 1,000 missiles and drones.
  it: ''
- hash: 345b93d1
  kind: cards
  en: Every route round Hormuz runs through a neighbour Iraq has not fully settled with. Ceyhan depends on Ankara and a 1973 agreement renewed a year at a time, and on Erbil; the Baniyas imports and the
    planned pipeline extension depend on Damascus, a government many Iraqi Shia leaders refuse to normalise with; the water mechanism ties Turkish projects to Iraqi oil revenue. Each new transit state gains
    leverage over Baghdad.
  it: ''
- hash: b91ad53f
  kind: cards
  en: Asserting the Khor Abdullah claim cost the Gulf goodwill that Iraq needed in the same year. Baghdad filed new maritime coordinates at the UN in January and February 2026, the GCC and Saudi Arabia
    backed Kuwait, and within weeks the war made Gulf tolerance of militia launches from Iraqi soil the issue Baghdad could least afford to lose; rockets and a stormed Kuwaiti consulate in Basra followed
    in April.
  it: ''
- hash: 5ac30c59
  kind: cards
  en: The prime minister must disarm the people who made him. Al-Zaidi is a political newcomer picked by the Coordination Framework after Trump vetoed Maliki, so his authority comes from the Shia parties
    whose fighters are the target and from Washington's tolerance; each concession to one side (the dollar and sanctions exemptions from the US, the 2027 timetable for the factions) weakens his standing
    with the other.
  it: ''
- hash: a37d9e61
  kind: cards
  en: 'Iraq in October 2026 is a state whose grand strategy is to be nobody''s

    battlefield and nobody''s client while owning too little force and selling

    one product through one closed strait. Its means are access and contracts

    (oil for Chinese pipelines, French gas, American majors, Turkish water

    works) and its currency is the promise that every patron will be paid

    from the same barrels. The Luttwakian pattern is that each safeguard

    creates the next exposure: ending the coalition earns sovereignty and

    removes the pressure that held the factions; the PMF is state-funded and

    so brings foreign strikes on the state; the escape from Hormuz runs

    through Turkey, Syria and Kurdistan; the Khor Abdullah claim spent Gulf

    goodwill just before the Gulf was needed. The balance with Iran is

    structural, not chosen: Iranian gas and the Shia parties tie Baghdad to

    Tehran even as the war cut the gas and Iranian drones hit Erbil. Signals

    that are not rows: the militias'' ''victory'' on 30 September is a

    statement, not yet an attack; Maliki was stopped by a public American

    warning, not by a parliamentary vote; and the date that matters, 30 June

    2027, belongs to a government that has filled only part of its cabinet.

    Open gaps in this pass: Jordan and Egypt (the triangle), the Gulf grid,

    Saudi Arar and the electricity link, Russian arms, the EU, Germany,

    water with Iran and the Shatt al-Arab.'
  it: ''
- hash: 68ce83f0
  kind: cards
  en: Keep the US security guarantee and allied air and surveillance presence at Keflavík while Washington's Greenland talk and map posts raise pressure. Iceland has no army, so its air policing and North
    Atlantic surveillance depend on NATO and US assets.
  it: ''
- hash: c67a77bc
  kind: cards
  en: 'Keep EEA and Schengen access without EU membership. Accession talks were not restarted: the ''no'' camp won 52.8% on 29 August 2026, and the Frostadóttir government set membership aside until 2028,
    because fisheries remain the sticking point.'
  it: ''
- hash: f69dc9d3
  kind: cards
  en: 'Hold the fisheries and the North Atlantic: keep a share of the mackerel stock in the four-party deal with Norway, the UK and the Faroe Islands, and watch the subsea cables and suspected shadow-fleet
    vessels around its exclusive economic zone.'
  it: ''
- hash: 1daeefc8
  kind: cards
  en: 'Diplomatic voice in Nordic and Atlantic frameworks: a NORDEFCO partner (ministerial in Trondheim, 6 May 2026), a Joint Expeditionary Force participant with the UK, and host of the Keflavík Control
    and Reporting Centre that manages Iceland''s airspace.'
  it: ''
- hash: 04c26c55
  kind: cards
  en: 'Host-nation support and fishing: facilities for allied rotations at Keflavík, and a 2026 mackerel share of 10.5% net after bilateral transfers, down from the 16.5% it set unilaterally for 2025.'
  it: ''
- hash: '92571249'
  kind: cards
  en: 'Money for Ukraine and sanctions alignment: ISK 1 billion to NATO''s PURL initiative and ISK 300 million to NSATU (February 2026), and full alignment with EU sanctions on Russia.'
  it: ''
- hash: 63daf41b
  kind: cards
  en: 'No army since independence in 1944: defence and air policing are provided by the United States and NATO partners, so Iceland cannot refuse the rotations it hosts.'
  it: ''
- hash: 311a422d
  kind: cards
  en: 'Fisheries cap any EU route: the Commission''s enlargement commissioner says Iceland''s fisheries and agriculture specificities need careful consideration, and voters rejected restarting talks by
    a narrow margin.'
  it: ''
- hash: 75c89dc7
  kind: cards
  en: 'Narrow export base: exports to the United States were 85.5 billion ISK (FOB) in 2025, down about 10% on lower marine-product and manufacturing exports, so a rupture with Washington would hit trade
    quickly.'
  it: ''
- hash: 3fcda9f2
  kind: cards
  en: Pressure from Washington pushes Reykjavík toward Europe (47.2% voted to restart EU talks), yet the EU route needs the fisheries concession that a majority of voters refused, so the security guarantee
    has no European replacement.
  it: ''
- hash: d5faab99
  kind: cards
  en: 'Iceland is a NATO state with no army whose security rests on Washington, and in 2026 that dependence became a source of friction: after Trump''s Davos gaffe and the September map post, Reykjavík
    summoned the US ambassador but did not change course. Its answer to the EU question is the same caution: Icelanders voted on 29 August 2026 not to restart accession talks, and the government set membership
    aside until 2028 while keeping the EEA. The Arctic role grows through NATO and the UK-led Joint Expeditionary Force rather than through forces of its own. Open gaps: the outcome of the US force-posture
    review and the size of the US presence at Keflavík were not found.'
  it: ''
- hash: 7009efea
  kind: cards
  en: 'Remove the Iranian regime''s nuclear, missile and proxy threat for good: finish the war begun on 28 Feb 2026 with Iran unable to rebuild, and keep Israel free to act whatever Washington signs. Netanyahu''s
    declared aim is to create the conditions for Iranians to topple the regime; Washington''s own demands are narrower (Vance asks for a ''meaningful'' cut in 60% enrichment).'
  it: ''
- hash: aba754d4
  kind: cards
  en: 'Destroy Hamas and Hezbollah as armed forces and hold security belts until they are disarmed: about 60% of the Gaza Strip behind the Yellow Line (the plan allowed 50%), about 65 villages in south
    Lebanon, nine posts in southern Syria. No Hamas or Palestinian Authority role in Gaza, and disarmament ''from heavy weapons down to the rifles'' before phase two.'
  it: ''
- hash: b2dccbd4
  kind: cards
  en: 'Keep the United States as patron while changing the terms: the 2016 MOU ends in 2028 and formal talks on its successor opened on 5 Jun 2026, with Israel asking for a ''transition from aid to a completely
    reciprocal partnership'' (joint R&D, co-production) and Netanyahu himself backing a phase-out of direct aid. Washington is the supplier of interceptors and the party that decides the Iran deal.'
  it: ''
- hash: 3fd72eaa
  kind: cards
  en: Prevent a Palestinian state and entrench control of the West Bank by steps (E1 tenders, USD 431m for 34 settlements, the first Area A land seizure) while avoiding formal annexation, which Washington
    and the Gulf oppose. Most contenders in the 27 Oct 2026 election reject a Palestinian state; only the Democrats back a form of two states.
  it: ''
- hash: 3fb621e7
  kind: cards
  en: 'Widen normalisation to turn military superiority into a regional order: the Abraham Accords (a first meeting since 7 Oct 2023 was held in New York in September 2026, with Kazakhstan attending), recognition
    of Somaliland (26 Dec 2025), a security deal with Syria, a peace framework with Lebanon (26 Jun 2026) and, above all, Saudi Arabia, which CSIS finds ''off the table'' for now.'
  it: ''
- hash: aece5f0b
  kind: cards
  en: 'Build strategic depth beyond Washington through the arms industry and a chain of interest-based partners: record defence exports of USD 19.2bn in 2025 (Europe 36%), Greece''s EUR 3bn air-defence
    deal, the Greece-Cyprus 3+1, Azerbaijan''s crude, India''s fast-track FTA, Morocco''s military work plan.'
  it: ''
- hash: dd04df52
  kind: cards
  en: 'A personal channel to Trump and a joint war: the strikes of 28 Feb 2026 were fought together with the United States, and Israel keeps Washington as the mediator in every track (Lebanon framework
    of 26 Jun 2026 signed at the State Department, US-mediated Syria talks, Board of Peace for Gaza). Alongside it, a coalition of friendly governments in Europe that shield Israel in Brussels (Czechia,
    Slovakia, Austria, Slovenia since June 2026).'
  it: ''
- hash: 6a42601c
  kind: cards
  en: 'Regional blocs built against Iran and Turkey: the Abraham Accords states (UAE, Bahrain, Morocco), the Greece-Cyprus-Israel 3+1 with a trilateral military work plan (22 Dec 2025), the Isaac Accords
    with Argentina (19 Apr 2026), and ties with Azerbaijan and India.'
  it: ''
- hash: ffd6661e
  kind: cards
  en: 'Contest the legitimacy of the bodies that judge Israel and the governments that act on them: it challenges the ICC''s jurisdiction (the warrants for Netanyahu and Gallant stand), objects to the ICJ''s
    jurisdiction in South Africa''s genocide case (counter-memorial of March 2026; reply due Nov 2027, rejoinder May 2029), and answers European measures with counter-sanctions and charges of antisemitism
    (Spanish ministers barred, Dutch diplomats in Ramallah stripped of status).'
  it: ''
- hash: 45ee09f0
  kind: cards
  en: 'Preventive and decapitating force across five fronts: the Twelve-Day War (13-24 Jun 2025), the war on Iran from 28 Feb 2026 (Khamenei killed), the killing of Nasrallah (27 Sep 2024) and of the Houthi
    prime minister (28 Aug 2025), the Doha strike (9 Sep 2025), the ground campaign to the Litani (from 16 Mar 2026) and the buffer zones in Gaza, Lebanon and Syria. Interceptor stocks are the limit and
    the United States refills them.'
  it: ''
- hash: ecea12b4
  kind: cards
  en: 'Gas, defence exports and the tax register as levers: Leviathan gas to Egypt (a USD 35bn contract frozen in Sept 2025 and later approved) and Jordan (45 bcm over 15 years), record arms sales (USD
    19.2bn in 2025, more than half government to government), and Israel''s collection of the Palestinian Authority''s customs and VAT revenue, withheld in full since May 2025.'
  it: ''
- hash: adc15d1e
  kind: cards
  en: 'Dependence on the United States for the means of war: the US supplied 68% of Israel''s arms imports in 2021-25 (Germany 31%), the MOU worth USD 38bn expires in 2028, reports of low interceptor stocks
    in the Iran war (the IDF denies a shortage) and Rubio''s emergency declaration for a USD 25.8bn interceptor and arms package for Israel and Gulf states in May 2026. Israel cannot finish a war that Washington
    wants to end.'
  it: ''
- hash: 8106e8f5
  kind: cards
  en: 'A war economy with a fiscal bill: debt-to-GDP 68.6% at end-2025 (about 60% before the war), a deficit near 5% of GDP, the Bank of Israel counting the cost of the regional wars at NIS 405bn (over
    17% of GDP) by April 2026, a 2026 defence budget topped up by about NIS 15bn.'
  it: ''
- hash: 2bd90208
  kind: cards
  en: 'Politics without a stable majority: the coalition fell apart over the Haredi draft exemption and the Knesset dissolved itself for an election on 27 Oct 2026; polls show neither bloc near 61 (Channel
    12: the opposition bloc 54, Netanyahu''s bloc 49 and 13 Arab-party seats), Netanyahu is on trial and has asked President Herzog for a pardon, and the army chief called the draft bill ''inconceivable''.'
  it: ''
- hash: c1cc0704
  kind: cards
  en: 'Red lines of the partners it needs: the UAE says West Bank annexation would end regional integration, Jordan''s king calls it a red line (and planners reportedly weigh nullifying the 1994 treaty),
    Egypt treats displacement into Sinai as a red line and Saudi Arabia ties any normalisation to a Palestinian state. Each constrains the West Bank policy.'
  it: ''
- hash: 8ac0b7b5
  kind: cards
  en: 'Erosion in Europe and in law: no majority in the EU to suspend the Association Agreement, but the settlement-goods ban is law in Ireland and the Netherlands and in train in Belgium, Spain has an
    arms embargo, high-level EU contact has stopped, the ICC warrant for Netanyahu stands and the ICJ case runs to 2029. Europe is 36% of defence exports and 32% of goods trade.'
  it: ''
- hash: b75bd090
  kind: cards
  en: 'American public opinion has turned: Gallup (Feb 2026) found for the first time more Americans sympathising with Palestinians (41%) than with Israelis (36%), with Republicans still 70% pro-Israel;
    the patron''s bipartisan consensus is the long-term asset on which the aid framework rests.'
  it: ''
- hash: 31e060de
  kind: cards
  en: 'Decapitation wins the battle and not the war. Killing Khamenei, Nasrallah, the Houthi prime minister and Hamas commanders removed the men and left the movements: Iran''s new leader promised vengeance
    ''until fully achieved'', the war is in its eighth month, Hezbollah joined within days, and Tehran now makes an end to Israel''s Lebanon offensive a condition of any deal with Washington. The tactical
    record is the reason there is no exit.'
  it: ''
- hash: 0c93c9cf
  kind: cards
  en: Holding the ground blocks the diplomacy that would make the ground unnecessary. Israel holds about 60% of Gaza, 65 Lebanese villages and nine Syrian posts as security belts; but the Gaza stabilisation
    force that should replace it cannot deploy (Indonesia put 8,000 troops on hold after 28 Feb), Hamas refuses to disarm while the occupation continues, Hezbollah calls the Lebanon framework null and void,
    and the Egyptian and Jordanian treaty partners who would train the Gaza police are cooling.
  it: ''
- hash: e60da405
  kind: cards
  en: De facto annexation costs the normalisation it is meant to crown. Each West Bank step (E1 tenders, Area A seizure) moves toward the red lines of Abu Dhabi and Amman and keeps Saudi Arabia 'off the
    table', so the settlement drive that the right calls strategic depth removes the one prize (Riyadh) that would end Israel's regional isolation.
  it: ''
- hash: feb83919
  kind: cards
  en: The ally that fights beside Israel is also the one that can end its war. Joint action against Iran deepened Israel's dependence (interceptors, USD 25.8bn emergency sale) and gave Trump the leverage
    to sign a memorandum with Tehran in June 2026 that Israeli ministers say does not bind Israel, to rebuke the Lebanon campaign publicly and to dictate Gaza's phase two. Netanyahu's own proposal to phase
    out US aid frees Israel from the patron while narrowing the lever it has over Congress.
  it: ''
- hash: 5c8c5db8
  kind: cards
  en: 'Arms exports win clients and lose publics. Israeli weapons sell as never before (USD 19.2bn, Greece''s EUR 3bn) to governments whose electorates and parties are turning, so the buyers are also the
    sanctioners: Europe is the largest market (36%) while high-level EU contact has stopped, Spain has an arms embargo and the Netherlands and Ireland ban settlement goods; the relationship swings with
    each election (Slovenia lifted its embargo and entry bans in June 2026 under Janša).'
  it: ''
- hash: 878c41e6
  kind: cards
  en: Striking the mediator it needs. The Doha strike of 9 Sep 2025 killed five Hamas members and a Qatari officer while the delegation weighed a US proposal; it ended with Netanyahu's apology on 29 Sep,
    an executive order from Trump guaranteeing Qatar's security, an Arab-Islamic summit calling for review of Israel's ties, and a Qatar that kept mediating and in August 2026 blamed Israel for obstructing
    the Gaza plan.
  it: ''
- hash: 39778bcd
  kind: cards
  en: Blocking Turkey from the south strengthens the Turkish case against Israel. The strike on Abu al-Duhur (18 Aug 2026), justified by a feared Turkish deployment, drew Washington's word 'unnecessary',
    pushed Damascus to cut contact for five days and made a Turkey-Syria-Israel deconfliction mechanism, run by the US, the price of the Syria track.
  it: ''
- hash: 4c6f1a28
  kind: cards
  en: 'Israel in October 2026 runs the strategy of a state that has won every

    battle it chose since 7 October 2023 and cannot convert any of them into an end

    state. Its method is preventive, decapitating force within a patron''s shadow:

    the Twelve-Day War, the killing of Nasrallah, the Doha strike and the war on

    Iran from 28 February 2026 weakened Iran and its allies as an organised threat, and the

    buffer zones in Gaza (about 60%), Lebanon (about 65 villages) and Syria (nine

    posts) are meant to make that victory permanent. Luttwak''s paradox is that each

    instrument of success spoils its sequel: the decapitations leave movements with a

    motive and no ceiling, the buffer zones prevent the stabilisation force, the

    Lebanon-for-disarmament framework and the Syria talks that would let the army

    leave, and the settlement drive moves toward the annexation red lines of the

    Emirates, Jordan and Egypt and so away from the Saudi normalisation that would

    end the isolation. The relation that governs all the others is the American one:

    Israel needs Washington for interceptors and for the deal with

    Iran, which Washington signed in June without Israel''s consent, and it is

    therefore trying to move from aid to ''reciprocal partnership'' before the MOU

    expires in 2028 while the American public drifts away. In Europe the two logics

    meet: Israel sells the continent weapons at record levels (EUR 3bn from Greece

    alone) while governments sanction the settlements, and the friendly bloc (Czechia,

    Slovakia, Slovenia, Austria) shields it only as long as it keeps winning

    elections. Two signals that are not rows: the election of 27 October, in which

    the main contenders for prime minister reject a Palestinian state, so that the policy survives a

    change of prime minister, and the Lebanon talks, in which the state of Lebanon

    signed a document that Hezbollah, the party that actually holds the weapons,

    rejects. Israel''s real question for 2027 is whether any of its partners will

    carry the burden of the ''day after'' that it declines to carry itself.'
  it: ''
- hash: 21d141db
  kind: cards
  en: 'Keep a privileged seat at both tables: be Washington''s most trusted interlocutor in Europe (the ''bridge'' between Trump and Brussels on tariffs, NATO spending and Ukraine) without leaving the EU
    core. Meloni was the first European leader received by Trump after the April 2025 tariff shock and helped shape the December 2025 European Council outcome (one-month Mercosur delay, EUR 90bn EU-guaranteed
    loan instead of the Russian-assets scheme).'
  it: ''
- hash: f9c5b77b
  kind: cards
  en: 'Contain irregular arrivals on the Central Mediterranean route by outsourcing control to the departure states: a new three-year Tunisia memorandum in force from January 2026 (4,000 legal work entries
    a year), working channels to both Libyan camps, and the Albania centres (turned into repatriation hubs in 2025). Sea arrivals were down about half year-on-year by early June 2026.'
  it: ''
- hash: 499b4b89
  kind: cards
  en: 'Energy security after Russian gas and a Mediterranean ''energy hub'' role: Algeria as first supplier (over 20 bcm by pipeline in 2025), Azerbaijan through TAP (about 9.5-10 bcm), Qatari and US LNG,
    Eni''s upstream in Libya and Egypt (USD 8bn pledge, Zohr).'
  it: ''
- hash: 3560a285
  kind: cards
  en: Influence in Africa and the southern shore through the Mattei Plan (partners grown from 9 to 18; 76 projects counted in the third annual report, July 2026; second Italy-Africa summit, Addis Ababa,
    13 February 2026) and a unified, Italy-friendly Libya, while keeping channels to Tripoli and to the Haftars.
  it: ''
- hash: 7cae7cc5
  kind: cards
  en: 'Defence-industrial weight and a visible but low-risk role in European security: GCAP with the UK and Japan (Edgewing, GBP 4.6bn development contract of July 2026), SAMP/T with France, the Leonardo-Baykar
    drone joint venture, the 5% NATO pledge (3.5% core + 1.5% related by 2035) accepted but not funded, and troops abroad only in peacekeeping and deterrence (KFOR, UNIFIL, Bulgaria battlegroup), not in
    Ukraine.'
  it: ''
- hash: f4bd14c9
  kind: cards
  en: 'A stable Balkan and Adriatic neighbourhood inside the EU orbit: backing for early accession of Albania and Montenegro (ahead of Ukraine and Moldova) and for Serbia''s path, strategic partnerships
    with Albania (Nov 2025) and Slovenia (2026), the closed Adriatic EEZ question with Croatia.'
  it: ''
- hash: d5b8d1a5
  kind: cards
  en: 'Personal leader diplomacy as the main instrument: a direct line to Trump (Palazzo Chigi to the White House, April 2025), and a calendar of intergovernmental summits that Rome hosts or co-chairs -
    Ukraine Recovery Conference (Rome, 10-11 July 2025, over EUR 10bn in pledges), Italy-Algeria (July 2025), Italy-Albania (November 2025), Italy-Germany (23 January 2026), Italy-France (Antibes, 25 June
    2026).'
  it: ''
- hash: 42eb3fd8
  kind: cards
  en: 'Calibrated abstention as policy: no troops for Ukraine (''no Italian soldiers on the ground'', only monitoring and training outside Ukraine after a ceasefire), recognition of Palestine only on conditions
    (hostages freed, Hamas disarmed and excluded, a state that exists), non-renewal of the defence agreement with Israel (April 2026) after Israeli warning shots at an Italian UNIFIL convoy, and a flat
    refusal to call US overflights ''participation'' in the Iran war.'
  it: ''
- hash: 6ef3966a
  kind: cards
  en: Narrative of the 'bridge' and of the Mattei model (energy for development, a partnership of equals rather than aid), plus quick public rebuttal when Washington or NATO's secretary general contradicts
    the government line (Crosetto and Tajani on Rutte, June 2026; Meloni's reply to Trump, June 2026).
  it: ''
- hash: 0ccac29b
  kind: cards
  en: 'Expeditionary presence at moderate risk: KFOR (984 troops, the largest contingent), UNIFIL (1,099 troops in Dec 2025, with a plan to stay in south Lebanon after the UN force leaves at end-2027),
    framework nation of the NATO battlegroup in Bulgaria (up to about 800), Baltic Air Policing F-35s, helicopters for EUFOR Althea, minesweepers held at readiness for Hormuz after a ceasefire; US bases
    (about 120 facilities, Sigonella and Aviano) offered for ''technical, logistical, non-kinetic'' use only.'
  it: ''
- hash: 05d333e7
  kind: cards
  en: 'State-steered capital: Eni (Libya USD 8bn gas deal of 2023, Egypt USD 8bn pledge), SACE guarantees (about EUR 4bn tied to the Mattei Plan), the Italian Climate Fund and CDP, Leonardo as defence champion,
    and the golden-power law used against Chinese control of Pirelli (Sinochem board seats cut to three, April 2026).'
  it: ''
- hash: f1ead0df
  kind: cards
  en: 'Debt and deficit: public debt 137.1% of GDP and a 2025 deficit of 3.1% keep Italy in the excessive-deficit procedure until 2027 at best; defence reached about 2% of GDP in 2025 largely through reclassification,
    against a pledge of 3.5% + 1.5% by 2035. Crosetto called the 5% path ''not possible''.'
  it: ''
- hash: 38ffb568
  kind: cards
  en: 'Energy exposure to wars it does not fight: with Russian gas gone, a third of consumption is LNG; the Hormuz closure (from March 2026) cancelled Qatari cargoes (16 reached Italy in H1 2026 against
    23) and left US LNG at about 62% of the LNG mix, while Algeria (about a third of demand) and Azerbaijan (about 15%) together cover nearly half.'
  it: ''
- hash: 6b03cad0
  kind: cards
  en: 'Migration depends on partners with leverage: Libya accounted for 88% of sea arrivals in January-April 2026, a case on Tunisia''s returns is pending before the African Court, and the Albania model
    is held by the EU courts (Advocates General of April and June 2026) and by MEPs'' complaints about access to Gjader.'
  it: ''
- hash: 6f1c2c53
  kind: cards
  en: 'Dependence on the United States for security and for a large export market: about 120 US facilities on Italian soil, a goods surplus with the US of EUR 34.19bn in 2025 under a 15% tariff regime,
    pharmaceuticals 22.7% of exports to the US; no European security order without Washington is credible in Rome.'
  it: ''
- hash: 5e666621
  kind: cards
  en: 'A coalition and a public that pull in different directions: Salvini''s Lega is a partner whose line on Brussels and Russia diverges from the premier''s (she keeps him on side at each European Council),
    while opinion and unions rose against the government''s Gaza line (general strike and mass protests, October 2025), the pressure behind the move from silence to conditional recognition of Palestine.'
  it: ''
- hash: 0490941e
  kind: cards
  en: 'Legal and institutional exposure: the ICC Prosecution accuses Italy of non-compliance over the release of Almasri (January 2025), and Meloni, Piantedosi, Nordio and Mantovano received notice of investigation;
    EU courts set limits on the Albania centres and on Brenner transit disputes with Austria.'
  it: ''
- hash: 5218b7e9
  kind: cards
  en: The bridge works only while the two banks stay in contact. Meloni's value to Trump was that she talks to Brussels, and to Brussels that she talks to Trump; Greenland tariff threats (January 2026),
    the Iran war and Trump's April 2026 interview ('I thought she had courage, but I was wrong') left her pressed from both sides. The harder she presses her national interest, the less credible the bridge.
  it: ''
- hash: c31d6c86
  kind: cards
  en: 'Outsourcing migration control buys lower arrivals and costs control over the partner. The Almasri release (January 2025: arrested in Turin on an ICC warrant, flown home on a state aircraft) protected
    the Libyan channel and exposed Rome to an ICC non-compliance complaint and a ministerial investigation; the man was later tried and sentenced in Tripoli (7 years 4 months, 21 June 2026), which does
    not close the ICC case.'
  it: ''
- hash: e54a52f4
  kind: cards
  en: 'Diversifying away from Russian gas replaced one concentration with several: Algeria for about a third of supply, Azerbaijan, whose parliament suspended cooperation with the European Parliament in
    May 2026, Qatar through Hormuz, and increasingly the United States (62% of LNG in H1 2026) - the country whose president is now attacking Meloni. Energy security and political autonomy moved in opposite
    directions.'
  it: ''
- hash: 8d0d7ee0
  kind: cards
  en: 'Accepting the 5% NATO pledge to please Washington while keeping the books that cannot pay for it: the government floated counting the EUR 13.5bn Messina bridge as defence, drew a public rebuke from
    the US ambassador to NATO, disavowed the plan, and reached the 2% line only by reclassification. The gesture meant to show loyalty fed Trump''s charge that Italy ''doesn''t want to help us with NATO''.'
  it: ''
- hash: e96ed453
  kind: cards
  en: Hosting the American security umbrella drags Italy into wars it says it avoids. Rome authorised only 'technical and logistical, non-kinetic' flights from Sigonella and Aviano for the US operation
    against Iran, yet Rutte named Italy as a participant (June 2026), Iran accused NATO of complicity, the Italian embassy in Tehran moved to Baku, and Trump still said she refuses to engage. Neither the
    benefit of participation nor the benefit of abstention was collected.
  it: ''
- hash: 685f55f4
  kind: cards
  en: Leaving the Belt and Road (December 2023) to reassure the United States and then having to repair relations with Beijing (Meloni's July 2024 visit, six agreements) while Washington's tariffs hit the
    same exporters; Pirelli shows the knot - Sinochem is the largest shareholder, Rome uses golden power to cap it, and Pirelli says US restrictions on Chinese automotive technology constrain its American
    expansion.
  it: ''
- hash: a9040184
  kind: cards
  en: 'Italy is a middle power that lives by position rather than mass: a G7 and euro-area economy with a 137% debt, a security guarantee it does not pay for, and a coastline that makes Libya, Tunisia and
    the Hormuz strait domestic questions. Meloni''s strategy, in Luttwak''s terms, is to convert geography and access into rank - first on Trump, then on Brussels, then on Africa - while spending little
    force. It worked in 2025 (the first European at the White House, Mercosur and the Russian assets shaped in Rome, a thaw with Berlin and Paris) and strains in 2026, when Washington turned from courting
    her to attacking her and the Iran war made basing, energy and migration one problem. The structure beneath is stable: NATO and the EU are not negotiable, so rhetoric moves around them (the refusal of
    troops for Ukraine, conditional recognition of Palestine, the Israel freeze) but never out. The real test is financial: the 5% pledge, the deficit procedure and an energy bill set by third parties leave
    little room for the posture of ''bridge''.'
  it: ''
- hash: bc2db6b6
  kind: cards
  en: Rebuild after Hurricane Melissa on borrowed money. Five international lenders, the IMF, World Bank and Inter-American Development Bank among them, put together up to US$6.7 billion over three years
    at Prime Minister Holness's request; the World Bank and IDB put the physical damage at US$8.8 billion, and US$662 million arrived at once. The figures are from the search summary of the Gleaner article,
    not from a full read.
  it: ''
- hash: 51a08196
  kind: cards
  en: Keep Washington's goodwill while ending the Cuban medical programme. Jamaica ended its roughly 50-year medical cooperation with Cuba in March 2026, after the two governments could not agree new terms.
    Holness defended the decision; Havana said Kingston bowed to US pressure; the foreign minister denied any US pressure. The objective is our reading of the act, not a stated aim.
  it: ''
- hash: '26055149'
  kind: cards
  en: 'Multilateral credit: the five-lender package above, which is the main channel for the rebuild. The Cuban programme''s end also freed the Ministry of Health to engage the Cuban workers individually
    to finish their contracts (Gleaner, March 2026).'
  it: ''
- hash: c3cac668
  kind: cards
  en: 'CARICOM solidarity: Guyana sent defence engineers to repair roofs in hard-hit Westmoreland and Barbados pledged money and soldiers, as reported by the Gleaner; the CARICOM leaders'' rally after the
    storm is the frame. Help in kind, not money, is the regional share of the means.'
  it: ''
- hash: 3e8ecb6c
  kind: cards
  en: Cannot fund the rebuild alone. Physical damage of US$8.8 billion against an immediate inflow of US$662 million leaves the rest to lenders and to the pace of disbursement.
  it: ''
- hash: d20ffc99
  kind: cards
  en: Cannot renew the Cuban doctors' terms on the old footing. The previous agreement expired in February 2023; both governments said they could not agree new terms, and the programme ended in March 2026.
  it: ''
- hash: 984b9dfc
  kind: cards
  en: Dropping the Cuban programme to stay in Washington's good books lands in the rebuild. Havana says its brigade stayed at its posts for more than 72 consecutive hours after the storm, and the US congressman
    who welcomed the cut had earlier criticised Holness.
  it: ''
- hash: 287c441c
  kind: cards
  en: 'Jamaica is a small, indebted state whose rebuild after Hurricane Melissa now runs through lenders and CARICOM rather than its own means. Its clearest foreign-policy act, ending the Cuban medical
    programme, is read in Havana as Washington''s price, and Kingston denies it, which is the ambiguity a small state buys with. This card is thin on purpose: the United States, United Kingdom, China and
    CARICOM postures, and the economy and gangs, wait for sources the card has not yet read.'
  it: ''
- hash: 8a5d8ea9
  kind: cards
  en: 'Keep the Hashemite monarchy and its security state intact in a country where Jordanians of Palestinian origin are an estimated 55-70% of the population and Transjordanian tribes staff the army and
    the state. Every other goal is subordinate: no ''alternative homeland'' (al-watan al-badil), no unrest that the tribal base or the army cannot contain.'
  it: ''
- hash: 18655da4
  kind: cards
  en: Stop Israeli annexation of the West Bank and any displacement of Palestinians into Jordan (the King's 'red line'), keep the two-state solution alive with East Jerusalem as the Palestinian capital,
    and defend the Hashemite custodianship of the Muslim and Christian holy sites in Jerusalem, which is a source of the monarchy's legitimacy.
  it: ''
- hash: c0dde4e5
  kind: cards
  en: 'Stay indispensable to Washington and the Gulf, which pay the bills and underwrite the kingdom''s security: the USD 1.45bn a year US memorandum (FY2023-2029), the 2021 Defense Cooperation Agreement,
    about 4,000 US troops, Gulf grants, soft loans and work permits - while insisting that the US presence is defensive and that Jordan is not a launch pad against Iran.'
  it: ''
- hash: a3495dad
  kind: cards
  en: 'Seal the borders and the airspace: shoot down what crosses (Iranian missiles and drones in April 2024, June 2025 and again in 2026), contain Iran-backed militias on the Iraqi side, and turn the Syrian
    border from a smuggling front into a managed frontier with the post-Assad government.'
  it: ''
- hash: 0ca625d1
  kind: cards
  en: 'Pay for survival without a crisis: complete the IMF programmes (EFF approved 10 Jan 2024, RSF 25 Jun 2025; fifth review passed 17 Jun 2026), draw the EU''s EUR 3bn 2025-27 package, and bring public
    debt toward 80% of GDP by 2028 while unemployment (16.1% in Q1 2026, much higher among the young) stays a political risk.'
  it: ''
- hash: 6f5fc046
  kind: cards
  en: 'Turn geography into rent: Aqaba as the port for Iraq and the Gulf, electricity links with Egypt, Saudi Arabia, Iraq and Syria, the Aqaba-Amman water carrier (USD 1bn US DFC financing) and a reopened
    Syrian corridor to the Mediterranean, so that Jordan depends less on Israeli gas and water and more on being a hub that others need.'
  it: ''
- hash: 6bd531d3
  kind: cards
  en: 'Royal personal diplomacy and a policy of saying no politely: the King went to the White House on 11 Feb 2025 and publicly reaffirmed opposition to displacement while offering to take 2,000 sick Gaza
    children; he addressed the UN General Assembly in September 2026, was hosted by Macron in Paris in September and met the Malaysian king in Kuala Lumpur on 12 October 2026. Jordan also keeps no ambassador
    in Tel Aviv and refuses the return of Israel''s.'
  it: ''
- hash: 53dfea44
  kind: cards
  en: 'Mediation from Amman: the trilateral Jordan-Syria-US track on Suwayda (19 Jul and 12 Aug 2025, roadmap of 16 Sep 2025) turned the kingdom into the venue for stabilising southern Syria on Damascus''s
    terms, with a joint working group on the ceasefire.'
  it: ''
- hash: c9563d76
  kind: cards
  en: 'A two-register message: sharp public language against ''the current Israeli government'' and the ''Greater Israel'' vision, while security channels with Israel keep working; and a domestic narrative
    of the Brotherhood as a security threat (ban of 23 Apr 2025, assets seized, a ''dissolution committee'').'
  it: ''
- hash: b9ff3ac8
  kind: cards
  en: 'The army as the regime''s instrument and its shield: air defence and the Royal Jordanian Air Force intercept Iranian projectiles (7 missiles and 6 drones announced on 24 Jul 2026), drones and air
    strikes against smuggling networks inside Syria (December 2025), 12 F-16 Block 70 on order, about 4,000 US troops hosted and a training centre (JIPTC) for Iraqi and Palestinian security forces.'
  it: ''
- hash: 92a17171
  kind: cards
  en: 'Rent and borrowing: the US memorandum (USD 1.45bn a year, of which about USD 610m is direct Treasury support), the EU package (EUR 3bn for 2025-27, EUR 1bn of it macro-financial assistance), IMF
    programmes (EFF USD 1.2bn, RSF USD 744m), Gulf grants, and the humanitarian corridor into Gaza as a source of Western goodwill.'
  it: ''
