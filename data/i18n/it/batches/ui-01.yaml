- hash: 23cc7abe
  kind: ui
  en: 'A gathering is the coalition that an actor''s weight summons. Luttwak''s argument in <i>The Rise of ⟨a⟩ vs. the Logic of Strategy</i> is that a power which grows or presses provokes, by the logic
    of strategy alone, the convergence of everyone it threatens, whether or not they speak to each other, and that the great state is the last to see it. The page asks, for every state with at least five
    declared rivals, who has gathered against it, how much of the world that is, and how far the gathering has become a coalition. <b>Formed</b> measures that: take every pair of actors inside the gathering
    and count how many are already allies of each other; ⟨n⟩ is a coalition in being, ⟨n⟩ a crowd of actors that share an enemy and nothing else. <b>Unseen</b> are the members the target itself does not
    read as hostile: the part of the gathering it has not noticed.'
  it: ''
