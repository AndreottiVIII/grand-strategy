- hash: 6e647ec3
  kind: ui
  en: 'The source is the <b>GDELT Project</b>, which has coded the world''s news into events since ⟨n⟩: for every event the two actors with their country codes, the kind of act on a scale from cooperation
    to conflict, and the number of articles that carried it. The atlas downloads one file a day, the last seven days plus four weeks before them, and counts for every country the events it was party to.
    Each week''s result is kept (⟨n⟩ so far, since ⟨n⟩ Oct), so the curve of every country and theatre grows by itself.'
  it: ''
