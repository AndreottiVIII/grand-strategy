- hash: 1867bf0c
  kind: ui
  en: 'The middle tier. A hedger is allied with one of two rivals and a partner of the other: it has chosen a side and keeps the door to the other open, insurance against both outcomes. ⟨a⟩ allied with
    the ⟨a⟩ and partnered with ⟨a⟩; a state bound to Washington by treaty that still buys Russian oil. Graver than a buffer, because the alliance can call; lighter than a seam, because only one side can.
    The word is the one foreign-policy readers use for ⟨a⟩''s position, and Luttwak describes that case in <i>The Rise of ⟨a⟩ vs. the Logic of Strategy</i> without naming it. Two cautions: the atlas sees
    the position, not the intention behind it; and in the literature hedging often means no full alignment at all, while here one side has been chosen.'
  it: ''
