  en: 'Every posture is a step on one scale: <b>ally ⟨n⟩</b> · <b>reluctant ally ⟨n⟩</b> · <b>partner ⟨n⟩</b> · <b>reluctant partner ⟨n⟩</b> · <b>neutral ⟨n⟩</b> · <b>rival −⟨n⟩</b> · <b>adversary −⟨n⟩</b>.
    For a pair A and X the lean of A on X is <b>step(A''s grade of X) − step(X''s grade of A)</b>. If ⟨a⟩ grades ⟨a⟩ "ally" (⟨n⟩) and ⟨a⟩ grades ⟨a⟩ "partner" (⟨n⟩), ⟨a⟩ leans on ⟨a⟩ by ⟨n⟩: ⟨a⟩ is the
    client, ⟨a⟩ the patron. A lean of ⟨n⟩ is a tilt; ⟨n⟩ or more is a client in the full sense.'
  it: ''
