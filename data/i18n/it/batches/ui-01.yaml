- hash: 6f5ebf36
  kind: ui
  en: 'There is no server. The site is static files on GitHub Pages: one HTML page, one stylesheet, one script, the compiled JSON, one small bundle per actor, the world outline (Natural Earth ⟨n⟩m, with
    ⟨a⟩ added) and a map from country ids to flag codes. The browser loads the main JSON once and computes the map and the intelligence pages from it; an actor''s bundle, with its card texts, notes and
    sources, is fetched only when you open its dossier or its point of view. Routing is in the URL hash, so every view has an address and the back button works. The outside dependencies are D⟨n⟩ for the
    maps (from cdnjs), three typefaces from Google Fonts, the flag images from flagcdn, the portrait of Luttwak from Wikimedia Commons, and, on the Data page, one request to the GitHub API for the date
    of the last commit; each of those hosts sees the visitor''s address, as any host does. No analytics, no cookies, no account. The only thing kept in the browser is the language you choose, and nothing
    you do on the site is sent to anyone.'
  it: ''
- hash: ef75dd9d
  kind: ui
  en: 'Everything is versioned in git, in the open: the whole history of every grade is in the repository, and a change to the ontology is made only with a journal entry. The atlas is updated on the editor''s
    call, never on a calendar; so far he has called it once a week. When he calls, the datasets are refreshed first (they cost nothing), then the news heat from GDELT and the dates the cards said to watch,
    then a pass over Wikipedia''s daily current-events pages, each event with its news citation, that proposes candidate rows, which he sorts by hand. A card that a major event touches, an election, a change
    of government, a war, a treaty, is then reread against the outcome: a dated row added, a trend or a grade moved when a source says so, never a rewrite. Between calls, single news items go in as one
    dated row each.'
  it: ''
