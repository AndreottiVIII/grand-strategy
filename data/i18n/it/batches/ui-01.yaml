- hash: f04d009a
  kind: ui
  en: 'Below grand strategy in Luttwak''s ladder of levels sits the <b>theatre</b>, where geography and several actors'' forces add up and where strategy is actually conducted. The atlas keeps a hand list
    of ⟨n⟩ theatres, from the Western Balkans to the Southern Cone, and computes for each a <b>heat</b> from what it has read between the members: declared hostility, seams, feuds, claimed territory and
    movements with stakes, divided by the number of possible pairs so that a small dense theatre is not outweighed by a large one. The Theatres page has its own map, lit by heat, and the list of what makes
    each theatre hot. A theatre whose members have few cards reads cold for lack of data, not for peace.'
  it: ''
