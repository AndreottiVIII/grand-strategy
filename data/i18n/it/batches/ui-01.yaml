- hash: 11364ebf
  kind: ui
  en: 'The gathering against X is every state or armed actor that grades X rival or adversary in a hand-written stance of confidence A or B; X must be a state (a gathering is summoned by weight; the crowd
    around an armed group is a hunt, not a counter-coalition) and the crowd at least five. Organisations are left out, since they would double their members. Maturity is the share of pairs within the gathering
    that are already allied, by a written reading on either side, a de facto alignment, or a defence treaty in the datasets (⟨a⟩, CSTO): unlike seams, the question here is whether the coalition exists,
    not who feels it. A member is <b>enlisted</b> if it is allied with at least half of the others, <b>waiting</b> otherwise. Formed is ⟨n⟩ or more, forming ⟨n⟩ or more, waiting below. <b>Weight</b> is
    an actor''s share of the world, half GDP and half military spending (World Bank, latest year); the gathering''s weight is the sum of its members''. "adv" marks a member that grades X adversary rather
    than rival; "neighbour" one that shares a border with X. In view: the formed and forming gatherings and any crowd of eight or more; the smaller crowds are folded. ⟨n⟩ gatherings so far, from ⟨n⟩ cards;
    ⟨n⟩ actors with borders read.'
  it: ''
