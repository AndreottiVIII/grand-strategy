- hash: 48c6351c
  kind: ui
  en: '<b>The Rise of ⟨a⟩ vs. the Logic of Strategy</b> (⟨n⟩) applies the paradoxical logic to the present. A power that grows in economic and military strength at once triggers the reactions of everyone
    around it; its rise is self-limiting unless it deliberately slows one of the two. Luttwak coins <b>great-state autism</b> for the inward-looking condition of very large states, ⟨a⟩ and the ⟨a⟩ alike,
    so absorbed by their own scale and domestic noise that they cannot perceive how their actions look to others, and are then surprised by the coalitions they produce. On the posture maps that is the pattern
    to look for: the actor whose "partners" are quietly hedging.'
  it: ''
- hash: 18b9eaf3
  kind: ui
  en: great-state autism
  it: ''
- hash: f81a1537
  kind: ui
  en: 'Edward N. Luttwak: <i>Coup d''État: A Practical Handbook</i> (⟨n⟩); <i>The Grand Strategy of the Roman Empire</i> (⟨n⟩); <i>The Grand Strategy of the Soviet Union</i> (⟨n⟩); <i>Strategy: The Logic
    of War and Peace</i> (⟨n⟩ rev. ⟨n⟩); "From Geopolitics to Geo-Economics", <i>The National Interest</i> (⟨n⟩); "Toward Post-Heroic Warfare", <i>Foreign Affairs</i> (⟨n⟩); "Give War a Chance", <i>Foreign
    Affairs</i> (⟨n⟩); <i>The Grand Strategy of the Byzantine Empire</i> (⟨n⟩); <i>The Rise of ⟨a⟩ vs. the Logic of Strategy</i> (⟨n⟩).'
  it: ''
- hash: 5c95d112
  kind: ui
  en: 'Under the postures sit the relation rows, in four layers: <b>objectives</b> (what an actor wants from another), <b>alignments</b> (treaties, memberships, recognitions), <b>dependencies</b> (energy,
    trade, debt, arms, remittances, with numbers) and <b>actions</b> (dated events: votes, sanctions, visits, exercises). The datasets are the floor: memberships from Wikidata and official lists, recognition
    tables from Wikipedia with their citations, every recorded vote of the UN General Assembly since ⟨n⟩ from the UN Digital Library. The cards are the reading on top of that floor. A lighter floor still
    is the <b>Watch</b>: the events GDELT codes from the world''s news in the last seven days are counted per country and set against the country''s own four-week average, Luttwak''s Byzantine rule of monitoring
    the other continuously; attention, not truth, kept apart from the cards, and a pointer for where the next update should look.'
  it: ''
