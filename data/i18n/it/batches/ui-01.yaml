- hash: 82842c13
  kind: ui
  en: 'Three conditions, all of them in the build: both readings must be hand-written at confidence A or B (provisional reciprocals and treaty-floor stances never count, so a pair appears only when both
    cards exist); at least one side must be an alliance (ally or reluctant ally), because a lean between two partners is a mood, not a client system; and the lean must be positive, so each pair appears
    once, from the client''s side. Two further guards: two allies who differ only in warmth, one reading ally and the other reluctant ally, are not a client system but a <b>tepid alliance</b>, listed apart
    below; and a patron must carry at least half the weight of its client, weight being measured for now by how many cards read each actor, so that a great power never appears as the client of a small one.
    The last column reads the client''s bond: <b>loyal</b> if kin or affinity, <b>bought</b> if none or grievance, since a bought client holds only while the patron pays.'
  it: ''
