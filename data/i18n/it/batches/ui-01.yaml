- hash: 271a715e
  kind: ui
  en: 'Edward Nicolae Luttwak was born on ⟨n⟩ November ⟨n⟩ in Arad, in Romanian Transylvania, into a Jewish family that left for ⟨a⟩ after the war. He grew up in Palermo and Milan, was schooled in England,
    and took his first degree in economics at the London School of Economics in ⟨n⟩; his doctorate came from Johns Hopkins in ⟨n⟩ with the thesis that became <i>The Grand Strategy of the Roman Empire</i>.
    By then he had already written, at twenty-six, the book that made his name: <i>Coup d''État: A Practical Handbook</i> (⟨n⟩), a cool manual of how governments are seized, followed by the <i>Dictionary
    of Modern War</i> (⟨n⟩).'
  it: ''
- hash: d90693b4
  kind: ui
  en: 'From the ⟨n⟩s he worked in Washington as a consultant to the Office of the Secretary of Defense, the National Security Council and the State Department, and for the armed forces of several allied
    countries, while holding the chair of strategy at the Center for Strategic and International Studies. He has never been a professor by trade: he is a practitioner who writes, with a taste for the unexpected
    argument and for the primary source in its own language. He reads several, including the Latin and Greek of his two imperial histories. He has also run a cattle ranch in ⟨a⟩ and written on economics
    (<i>The Endangered American Dream</i>, ⟨n⟩; <i>Turbo-Capitalism</i>, ⟨n⟩). He lives in Chevy Chase, Maryland, and still writes and advises, in English and Italian, on the wars of the day.'
  it: ''
