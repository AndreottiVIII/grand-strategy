- hash: 6fac1474
  kind: ui
  en: 'A <b>fault</b> is a relationship whose deep level contradicts its surface. The frame is Luttwak''s structure of <b>levels</b>: in <i>Strategy</i> success at one level can be undone at a higher one,
    and a strategy works only when its levels are in harmony. Here the levels are two: the bond, which would survive a change of government, and the posture of today. Two contradictions matter. The <b>feud</b>
    is kin graded rival, adversary or claimed territory, the quarrel inside the family, which Luttwak counts as the most intense of rivalries because closeness multiplies the points of contact. The <b>Byzantine
    alliance</b> is a grievance graded ally: the maxim from <i>The Grand Strategy of the Byzantine Empire</i> that every enemy is a possible ally, and the alliance that holds over an open wound because
    it must. The Faults page lists both, says whether each is felt by one side or both, and reads its trend as healing or tearing; on the map a fault shows as a bond band that contradicts the colour of
    its outline.'
  it: ''
- hash: af07e37f
  kind: ui
  en: fault
  it: ''
- hash: 3291f4d3
  kind: ui
  en: 'A <b>gathering</b> is the coalition that an actor''s weight summons. The frame is <i>The Rise of ⟨a⟩ vs. the Logic of Strategy</i>: a power that grows or presses provokes, by the logic of strategy
    alone, the convergence of everyone it threatens, whether or not they speak to each other, and the great state, absorbed in its own scale, is the last to see it. Byzantium made a method of the same law
    from the other side, recruiting the enemies of its enemies. The Gatherings page lists, for every actor with at least five declared rivals, who has gathered against it, and measures how far the gathering
    has become a coalition: formed when most of its members are already allied with each other, waiting when they are not, which is the coalition the logic is still summoning. Each gathering is weighed,
    as a share of the world''s economy and armed spending, against the weight of its target; and for each the page says which members the target itself does not read as hostile, the part of the gathering
    it has not seen. Under the gatherings sits the <b>encirclement</b>: for every actor, the share of its neighbours that stand against it, since the neighbours are the first the logic summons. In each
    actor''s dossier the <b>convergences</b> are the other side of the same reading: the actors that share one of its rivals and are not yet its allies, the tables it has not sat at.'
  it: ''
