  en: 'The logic of conflict in the grammar of commerce. In ⟨n⟩ Luttwak wrote that with the great wars over, states would carry their rivalries into the economy, with capital for firepower, market penetration
    for garrisons and research for armament: <i>geo-economics</i>. The atlas keeps ⟨n⟩ dependency rows with a number in them: energy, trade, debt, investment, bases, arms and remittances. This page is the
    first cut of the lever: for every pair of actors of which at least one reads the other as rival or adversary, what still binds them materially. The gas a bloc buys from the power it sanctions, the market
    a rival cannot do without, the ground an enemy holds. Heaviest pairs first (the two weights multiplied, so a pair counts when both sides matter); one line per lever, from the card that wrote it, cut
    to its first sentence: the full row is in the dossier.'
  it: ''
