- hash: 5aacae2d
  kind: ui
  en: 'What it is not: it measures the attention of the media GDELT reads, mostly in English and other major languages, not what happened. A hurricane and a coup read alike until the conflict share tells
    them apart; the francophone Sahel and the Pacific read quiet for lack of coverage; a surge may be a summit or a scandal. It is a pointer, kept apart from the cards: each update starts its searches from
    the surging and the burning, and nothing enters a card from here without a source read by a person. Nothing on this page is a reading of the atlas.'
  it: ''
- hash: 5e623821
  kind: ui
  en: This site is built in honour of Edward N. Luttwak. It is not his work and was built without his involvement; it is an attempt to look at the whole world, every state at once, with the lamp he built.
  it: ''
- hash: 9679855a
  kind: ui
  en: 'Luttwak''s central claim (<i>Strategy: The Logic of War and Peace</i>, ⟨n⟩) is that strategy is paradoxical, because the other side reacts; the argument is set out under The work, below. Every card
    in this atlas therefore ends with <b>paradoxes</b>: the places where an actor''s own instruments undermine its own goals. ⟨a⟩ withholds its alignment with Brussels to keep UN cover on ⟨a⟩, which rests
    on the Russian and Chinese veto, and the Commission ties the pace of its negotiations to normalisation with ⟨a⟩. ⟨a⟩''s assertion of sovereignty in the north cost it three years of Brussels.'
  it: ''
- hash: 17b00c8a
  kind: ui
  en: paradoxes
  it: ''
- hash: d7650d90
  kind: ui
  en: Luttwak stacks conflict in levels (set out under The work, below), and above them all sits <b>grand strategy</b>, where military force meets diplomacy, economics, alliances and persuasion, and where
    a state's whole external conduct can be read as one design. This atlas lives on the top level only. It does not model battles or armies; it models what states and state-like actors want, the means they
    use across the four domains (diplomatic, informational, military, economic), what constrains them, and how they see each other.
  it: ''
