- hash: 9708c7f5
  kind: ui
  en: 'A seam needs three legs: A hostile to X (rival or adversary), A allied to Y, X allied to Y (ally or reluctant ally). Every leg must be a written reading of confidence A or B, from either side of
    the leg. A treaty membership alone never counts, or every state in both ⟨a⟩ and the ⟨a⟩ would be pulled between ⟨a⟩ and Turkey; provisional reciprocals never count; a de facto alignment counts as an
    allied leg. A <b>hedger</b> needs the same hostile leg, one allied leg (ally, reluctant ally or de facto) and one partner leg (partner or reluctant partner, written A or B from either side); a <b>buffer</b>
    needs two partner legs and no allied one. A triple already counted as a seam is neither; organisations never hedge or buffer. ⟨n⟩ seams, ⟨n⟩ hedgers and ⟨n⟩ buffers so far, from ⟨n⟩ cards; the lists
    grow by themselves as cards are written on both sides of a rivalry.'
  it: ''
