- hash: 3d0992f1
  kind: ui
  en: 'Each stance carries a posture (today) and a bond (what would survive a change of government). A <b>feud</b> is bond kin with posture rival, adversary or claimed territory; a <b>Byzantine alliance</b>
    is bond grievance with posture ally or reluctant ally. A fault written by both sides of a pair is <b>mutual</b>; written by one side only, it says who feels it. The tendency reads the trend against
    the kind: a warming feud is <b>healing</b>, a cooling one <b>deepening</b>; a cooling Byzantine alliance is <b>tearing</b>. Only hand-written stances of confidence A or B count. Kin graded reluctant
    ally or reluctant partner is not a fault but a warning, <b>strained</b>, shown only in the ledger under the map. ⟨n⟩ faults so far, from ⟨n⟩ cards.'
  it: ''
