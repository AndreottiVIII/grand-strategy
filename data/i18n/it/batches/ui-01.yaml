- hash: 4cf9806d
  kind: ui
  en: 'How one actor sees another is recorded on two axes. The <b>posture</b> is what the relationship is today, on a closed scale: own territory, claimed but not controlled, ally, reluctant ally, partner,
    reluctant partner, neutral, rival, adversary. "Adversary" is reserved for mortal enemies, where the other''s existence or regime is the problem (⟨a⟩ and ⟨a⟩); nearly all bad relationships are rivalries.
    A posture is never our opinion: it needs a source that uses that reading, and it follows the structural position, not the rhetoric of a joint communiqué. The <b>bond</b> is the structure under the posture,
    what would survive a change of government: kin (shared identity), affinity, none, or grievance (an open historical wound). Two actors can both be "partner" and mean opposite things: for ⟨a⟩ is a partner
    of kin growing colder; the ⟨a⟩ a partner with a grievance growing warmer. On the map the posture is the colour and the bond a band inside the border. A partner that moves with the actor as a bloc without
    any defence clause (⟨a⟩ and ⟨a⟩ and ⟨a⟩ and ⟨a⟩) carries a third mark, <b>aligned without a treaty</b>: a dashed band inside the border, written only with a source naming the alignment, and counted
    as an allied leg in Seams, Clients and Gatherings.'
  it: ''
