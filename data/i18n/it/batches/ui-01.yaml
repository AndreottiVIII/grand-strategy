- hash: 7adaae6f
  kind: ui
  en: 'A fault is a relationship whose deep level contradicts its surface: the bond says one thing, the posture another. Luttwak''s rule is that strategy works only when its levels are in harmony; a relationship
    resting on a fault is the one that breaks first. Two kinds matter. A <b>feud</b> is kin graded rival, adversary or claimed territory, the quarrel inside the family, the most intense because closeness
    multiplies the points of contact. A <b>Byzantine alliance</b> is an open wound graded ally: the Byzantine maxim that every enemy is a possible ally, and the alliance that holds over the wound because
    it must.'
  it: ''
