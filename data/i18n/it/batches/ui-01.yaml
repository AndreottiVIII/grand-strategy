- hash: 66cd635f
  kind: ui
  en: 'On the map each theatre is a zone, a circle of hand-set radius around the theatre''s centre, lit in proportion to its heat; the countries inside are not coloured, because the heat belongs to the
    ground where the forces meet, not to the actors who send them. Click a zone to outline its members; click it again to return to the world. For every pair of members of a theatre the build adds: adversary
    ⟨n⟩ rival ⟨n⟩ claimed territory ⟨n⟩ a reluctant ally or reluctant partner ⟨n⟩ an ally cooling or a rival warming ⟨n⟩; for every feud inside the theatre ⟨n⟩; for every seam whose three actors are inside
    it ⟨n⟩ Adversaries weigh very high, rivals high, reluctant postures low. Only hand-written stances of confidence A or B count. The sum is divided by the number of possible pairs among the members, and
    the result is scaled so that the hottest theatre reads ⟨n⟩ The list of theatres and their members is kept by hand in data/theatres.yaml; organisations are never members. The line "this week in the news"
    is the Watch page''s heat summed over the members: their events of the last seven days against their own four-week normal, and the share of them that is conflict; attention, not a reading.'
  it: ''
