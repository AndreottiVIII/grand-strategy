- hash: 1fc85514
  kind: ui
  en: 'A <b>seam</b> is an actor pulled two ways: an ally of two actors that are rivals or adversaries of each other. ⟨a⟩ between ⟨a⟩ and Turkey, the ⟨a⟩ between ⟨a⟩ and the Emirates, ⟨a⟩ between ⟨a⟩ and
    ⟨a⟩. The word is Luttwak''s. In <i>Strategy</i> he describes <b>relational manoeuvre</b> as the style that aims not at the enemy''s strength but at his specific weaknesses, his doctrine, his habits
    and the <i>seams</i> between him and his allies, where a small force can obtain a large effect. The Byzantine book shows the same idea at the scale of an empire that survived a thousand years by dividing
    its enemies rather than destroying them. The Seams page lists every such triangle the atlas can see. They are computed from hand-written postures of confidence A or B only. Under the seams sit two lighter
    tiers. The <b>hedger</b> is allied with one of two rivals and a partner of the other: it has chosen a side and keeps the door open, insurance against both outcomes. The <b>buffer</b> is the partner
    of both and the ally of neither, the state that belongs to neither and deals with both, which Rome kept on purpose between itself and its enemies; the buffer profits from the quarrel until it is forced
    to choose.'
  it: ''
- hash: '59505833'
  kind: ui
  en: seam
  it: ''
- hash: bc1f1c63
  kind: ui
  en: 'A <b>client</b> is an actor that leans on another more than it is leaned on: it grades the other higher than the other grades it. Luttwak''s name for the arrangement is the <b>client system</b> of
    the early Roman empire, described in <i>The Grand Strategy of the Roman Empire</i>: the hegemonic empire of the Julio-Claudians ruled through client kings whose loyalty exceeded Rome''s commitment to
    them, which is why it was cheap. The Clients page measures the <b>lean</b> of every pair the atlas has read from both sides, in steps on the posture scale; the higher-grading side is the client, the
    other the patron. A client bound by kin or affinity is loyal; one bound by nothing, or by a grievance, is bought, and holds as long as the patron pays. The tepid ally, graded "ally" by its patron and
    answering "reluctant ally", is the costly kind, the one Rome subsidised. In the ledger under the map the lean column shows, for each counterpart, who leans on whom.'
  it: ''
