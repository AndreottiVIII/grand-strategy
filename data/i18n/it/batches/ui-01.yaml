  en: 'What the atlas is, counted. Compiled ⟨n⟩-⟨n⟩-⟨n⟩ from ⟨n⟩ cards and ⟨n⟩ distinct sources, with about <b>⟨n⟩ million tokens</b> of model work since ⟨n⟩ October ⟨n⟩ Last change to the repository: <span
