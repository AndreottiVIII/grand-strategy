- hash: c1c3f02b
  kind: ui
  en: 'Luttwak''s second rule for Byzantium, in <i>The Grand Strategy of the Byzantine Empire</i>: gather intelligence on the other and his mentality, and monitor his movements continuously. Constantinople
    kept an office for it, the Bureau of Barbarians, which read every envoy and every rumour from beyond the border. This page is the atlas''s monitor: the events that GDELT codes from the world''s news
    in the last seven days are counted per country and set against the country''s own four-week average. A country is <b>surging</b> when it makes a multiple of its normal, whatever its size; it is <b>burning</b>
    when the conflict in its news runs above its normal. The loud, who make the most news every week, are listed apart so they do not hide the rest.'
  it: ''
