items:
- hash: '364ad683'
  it: |
    La regolamentazione usata come politica estera provoca il garante: la multa DSA a X (EUR 120m) è stata definita censura da Rubio e Vance, l'US Justice Department si è unito al ricorso di X in tribunale e Lutnick ha legato i dazi sull'acciaio alle regole digitali. Lo strumento autonomo più forte dell'Unione è proprio quello su cui gli Stati Uniti sono meno disposti a trattare, e l'Unione è la meno in grado di permettersi uno scontro con il Paese da cui dipende per la difesa.
- hash: 'e25879b8'
  it: |
    Ridurre i rischi dalla Cina richiede la Cina: l'obiettivo per il 2040 (-90%) e la transizione dei veicoli elettrici dipendono da batterie e magneti cinesi, perciò l'Unione che impone dazi del 7.8-35.3% ai produttori cinesi di veicoli elettrici accetta ora impegni sui prezzi minimi che, avverte Bruegel, fanno salire prezzi e margini europei, e negozia canali rapidi per le terre rare in cambio di concessioni commerciali (8-9 Oct 2026). La tutela dell'industria verde e l'obiettivo climatico tirano in direzioni opposte.
- hash: '47b02bbe'
  it: |
    L'Unione agisce da stratega di grande respiro solo per caso. Non ha un esercito, una voce unica né un bilancio che qualcuno ami; ha un mercato, un corpus di regole, una moneta e il diritto di dire sì o no ai suoi vicini. Letta attraverso Luttwak, è una strategia di secondo livello: esporta ordine per attrazione (allargamento, associazione, fondi del Growth Plan, viaggi senza visto) e per esclusione (sanzioni, beni congelati, difesa commerciale), e si muove solo quando ventisette governi acconsentono. Nel 2026 la logica del consenso si è irrigidita in una postura: la Russia è la minaccia dichiarata, gli Stati Uniti sono diventati un 'necessary partner' che non si può abbandonare e di cui non ci si può fidare, la Cina è un rivale gestito attraverso quote e licenze, e il vicinato è una fila d'attesa. I paradossi hanno tutti la stessa radice: l'Unione è più forte dove le sue regole sono meno contestate e più esposta dove deve agire in fretta. Ha appena dimostrato di poter finanziare una guerra (EUR 90bn), resistere a uno spoiler (la sconfitta di Orban il 12 Apr 2026) e vietare un combustibile (il gas russo), eppure non riesce a nominare un inviato, a usare gli asset che ha congelato o a garantire i propri confini senza Washington. La lettura per il prossimo anno è se il compromesso dell'era di Ankara - una NATO più europea, un'Unione che paga - si trasformi in capacità, oppure se il bilancio 2028-34, la clausola sull'acciaio di Turnberry e l'inversione di rotta ungherese siano soltanto una pausa.
- hash: '51943568'
  it: |
    Scoraggiare la Russia e, se la deterrenza fallisce, difendere ogni centimetro del territorio alleato (articolo 5, 'ironclad' all'Aia nel 2025 e di nuovo ad Ankara, 7-8 Jul 2026). Gli strumenti sono i piani di difesa regionali, il Force Model della NATO delle forze ad alta prontezza, le forze terrestri avanzate in otto paesi e le tre operazioni 'Sentry' (Baltic Sentry, Jan 2025; Eastern Sentry, Sep 2025; Arctic Sentry, Feb 2026). Lo Strategic Concept del 2022 definisce la Russia 'the most significant and direct threat'; la dichiarazione di Ankara la chiama 'the long-term threat'. L'obiettivo è la deterrenza, non la sconfitta della Russia.
- hash: '9602f49e'
  it: |
    Rearm Europe: il 5% del PIL entro il 2035, di cui il 3.5% per la spesa per la difesa in senso stretto e fino all'1.5% per spese connesse alla difesa (resilienza, infrastrutture, industria), con piani nazionali annuali e una revisione nel 2029. Le stime NATO per il 2026 mostrano solo cinque alleati sopra il 3.5% per la difesa in senso stretto (Lituania, Estonia, Lettonia, Polonia, Grecia), una media dell'Alleanza del 2.86%, e Spagna, Slovacchia e Cechia come riluttanti dichiarati; Ankara ha chiesto a ogni alleato 'credible plans'.
- hash: 'dbe255bd'
  it: |
    Tenere dentro gli Stati Uniti, soprattutto il loro ombrello nucleare e le capacità abilitanti che l'Europa non può ancora sostituire, mentre il Pentagon si muove verso 'NATO 3.0' (gli europei si assumono la responsabilità principale della difesa convenzionale). Il prezzo che Rutte paga è visibile: l'impegno al 5% nel 2025, una 'more European NATO' nel 2026, e l'accettazione dei tagli statunitensi al Force Model e di una revisione della postura di sei mesi che valuta il ritiro di 25,000-40,000 dei circa 80,000 militari statunitensi in Europa.
- hash: 'ba50fcff'
  it: |
    Sostenere l'Ucraina senza ammetterlo: EUR 70bn di aiuti promessi ad Ankara per il 2026 e almeno altrettanti per il 2027, il comando NSATU a Wiesbaden che ha preso in carico il coordinamento degli aiuti dal formato Ramstein guidato dagli Stati Uniti, e PURL, il meccanismo con cui gli alleati pagano le armi americane. L'adesione resta 'irreversible' nel testo di Washington del 2024, assente nel testo dell'Aia e nei sei paragrafi di Ankara.
- hash: '771c35d5'
  it: |
    Resilienza contro la guerra ibrida: proteggere i cavi sottomarini, lo spazio aereo e le infrastrutture critiche da sabotaggi, droni e palloni al di sotto della soglia dell'articolo 5. L'impegno dell'Aia riserva a questo fine fino all'1.5% del PIL, e le consultazioni ai sensi dell'articolo 4 si sono tenute due volte nel September 2025 (Polonia, 10 Sep; Estonia, 23 Sep).
- hash: '866752b1'
  it: |
    Stabilizzare i margini senza aprire nuovi fronti: il Southern Neighbourhood Action Plan (Washington 2024; un Rappresentante speciale che ha visitato Rabat per la terza volta il 6-7 Oct 2026), i Balcani occidentali (KFOR in riduzione da 4,739 verso 3,000-3,500, con la Bosnia mantenuta su un percorso di adesione bloccato), il Mar Nero e i partner dell'Indo-Pacifico (IP4) tenuti vicini, mentre il linguaggio del 2022 sulla 'systemic challenge' rappresentata dalla Cina non viene ripetuto nelle dichiarazioni del 2025 e del 2026.
- hash: '5b58f819'
  it: |
    La macchina del consenso: il North Atlantic Council decide all'unanimità, il Segretario generale (Mark Rutte, dal 2024) media tra Washington e gli altri - il 'framework' di Davos con Trump del 21 Jan 2026, che ha posto fine alla minaccia di dazi sulla Groenlandia e ha prodotto Arctic Sentry, è il modello - e le consultazioni ai sensi dell'articolo 4 segnalano preoccupazione collettiva senza impegnare la forza.
- hash: '505e7ff0'
  it: |
    I partenariati come anello esterno: Partnership for Peace (Serbia, Moldova), partner aspiranti (Georgia, Bosnia, Ucraina), i quattro partner dell'Indo-Pacifico (Giappone, Corea del Sud, Australia, Nuova Zelanda, incontrati da Rutte ad Ankara il 7 Jul 2026) e una divisione del lavoro con l'EU (la NATO per comando, capacità e standard; l'EU per industria e investimenti), dei cui 27 membri 23 sono alleati.
- hash: 'a3128a25'
  it: |
    Testi brevi e firmabili: la dichiarazione dell'Aia (June 2025) si estendeva su cinque paragrafi e quella di Ankara su sei, scritte per essere accettate da un presidente statunitense che aveva minacciato di saltare l'articolo 5. Sono stati esclusi l'adesione dell'Ucraina, la Cina e l'Indo-Pacifico, perché l'unità della frase reggesse; lo Strategic Concept del 2022 resta l'unico testo concordato su di loro. Le parole sono calibrate: la Russia è 'the long-term threat', non un avversario.
- hash: '7c7bbed0'
  it: |
    Struttura di comando e di forze: il SACEUR gen. Alexus Grynkewich (anche capo dello US European Command) guida le operazioni Sentry, i piani regionali e il Force Model, le forze terrestri avanzate in otto paesi (Forward Land Forces Finland è stata costituita il 6 Jun 2026), NSATU a Wiesbaden e KFOR; la deterrenza nucleare poggia su 'an appropriate mix of nuclear, conventional, and missile defence capabilities'.
- hash: '9db567d2'
  it: |
    Scaricare l'onere all'interno della struttura: Grynkewich ha detto agli alleati in June 2026 che il Force Model aveva una 'unhealthy co-dependence' sulle forze statunitensi che 'will change', e in July ha dichiarato che l'Europa aveva colmato la maggior parte dei vuoti lasciati dai tagli americani (un terzo di caccia a reazione statunitensi in meno, meno cacciatorpediniere, nessun sottomarino nella riserva per le crisi, meno droni).
- hash: '1726a1b6'
  it: |
    Il denaro come leva: l'obiettivo del 5% e i piani annuali, il canale PURL attraverso cui gli alleati europei e il Canada acquistano armi statunitensi per l'Ucraina (circa USD 6.7bn nel primo anno), oltre USD 50bn di nuovi acquisti congiunti annunciati ad Ankara (flotte di A400M e MRTT, MQ-4C Triton, un successore dell'AWACS) e una spinta all'industria della difesa (più di USD 139bn aggiunti alla spesa per la difesa in senso stretto da alleati europei e Canada nel 2025).
- hash: 'b29850c0'
  it: |
    L'unanimità fa di ogni membro un veto e di ogni ferita aperta un pedaggio. Ungheria e Turchia hanno ritardato l'adesione di Finlandia e Svezia fino a January-March 2024; Fico, della Slovacchia, si oppone all'obiettivo del 5% e il 18 Sep 2026 ha detto di non voler coinvolgere la Slovacchia in un conflitto 'because of some Article 5'; la Spagna rifiuta l'obiettivo e ha negato agli Stati Uniti l'uso delle sue basi per la guerra contro l'Iran.
- hash: 'b1c14f39'
  it: |
    La NATO non ha un esercito né un bilancio propri: ogni brigata, aereo ed euro appartiene a un membro, e le capacità abilitanti critiche - intelligence, difesa aerea, fuoco a lunga gittata, trasporto strategico, forze nucleari - sono, in misura sproporzionata, americane. Gli Stati Uniti rappresentano circa il 57% della spesa dell'Alleanza (USD 1.03tn su USD 1.8tn stimati per il 2026).
- hash: '10e71160'
  it: |
    L'affidabilità del garante. Le dichiarazioni del presidente Trump prima di Ankara sembravano mettere in dubbio l'articolo 5; ha detto 'NATO WASN'T THERE WHEN WE NEEDED THEM' dopo che gli alleati non si erano uniti alla guerra in Iran; il Pentagon ha annunciato il 1 May 2026 che 5,000 militari avrebbero lasciato la Germania; e la pretesa di Washington sulla Groenlandia ha messo un alleato del trattato contro il leader dell'Alleanza, fino al 'framework' di Davos del 21 Jan 2026 e all'accordo trilaterale del 22 Sep 2026.
- hash: 'b797033c'
  it: |
    L'aritmetica del 5%: nel 2026 solo cinque alleati superano il 3.5% per la difesa in senso stretto, dieci si collocano poco sopra il 2%, la Slovenia è l'unico alleato ancora sotto l'obiettivo del 2014 (1.61%), e la categoria 'related' all'1.5% favorisce la riclassificazione delle spese (l'Italia ha tentato di conteggiare il ponte sullo Stretto di Messina da EUR 13.5bn prima che l'ambasciatore statunitense si opponesse).
- hash: '5bfcad6e'
  it: |
    La porta aperta è bloccata da entrambi i lati: Ucraina e Georgia non possono essere invitate finché dura la guerra e finché Washington e diversi alleati si oppongono, eppure la formula di Bucarest 2008 e il termine 'irreversible' di Washington 2024 non possono essere ritirati senza concedere a Mosca il suo punto; il pacchetto per la Georgia è stato riesaminato dopo le elezioni del 2024.
- hash: 'd831003b'
  it: |
    Fuori area non è parte in causa: nella guerra israelo-statunitense contro l'Iran il Segretario generale ha detto che la NATO non sarebbe intervenuta, eppure le basi degli alleati in Romania, Italia, Germania e Gran Bretagna sono state utilizzate e l'Iran ha accusato l'Alleanza di complicità; il testo di Ankara dice soltanto che l'Iran 'must never have a nuclear weapon' e chiede la libertà di navigazione nello Stretto di Hormuz.
- hash: '691f7f87'
  it: |
    Più l'Europa si riarma per tenere dentro l'America, più permette all'America di andarsene. Ogni dollaro del 5% dell'Aia è stato pagato per trattenere Trump; il Pentagon ha risposto con 'NATO 3.0' (l'Europa si assume la responsabilità principale della difesa convenzionale), ha ridotto il proprio contributo al Force Model nel May 2026 e a September ha valutato il ritiro di 25,000-40,000 militari. Il rapporto di Grynkewich di July, secondo cui l'Europa aveva 'backfilled most gaps', è la prova del successo che giustifica il taglio successivo.
- hash: '848bf117'
  it: |
    La deterrenza è credibile solo con l'alleato che ne dubita. La deterrenza nucleare è americana ('the ultimate guarantor of our security', Rutte), e solo Washington può rendere l'articolo 5 credibile per Mosca, eppure è il presidente statunitense a lasciar intendere condizioni, a subordinare i contributi statunitensi alla performance degli alleati (Hegseth, June 2026) e a fare pressioni su un alleato del trattato sulla Groenlandia. Una deterrenza che dipende dai dubbi del proprio garante invita i test che dovrebbe prevenire: droni sopra la Polonia, MiG-31 sopra l'Estonia.
- hash: '6deaf218'
  it: |
    L'allargamento ha esteso il fronte che avrebbe dovuto accorciare. Finlandia (2023) e Svezia (2024) hanno chiuso il Baltico e aggiunto un confine terrestre con la Russia; il prezzo è un perimetro più lungo da presidiare - un comando terrestre a Mikkeli, le Forward Land Forces Finland, tre operazioni Sentry, gruppi tattici in otto paesi - nel momento in cui gli Stati Uniti ritirano brigate e il Force Model si riduce. Il fianco settentrionale è al tempo stesso più forte e più sottile.
- hash: '1104177a'
  it: |
    Armare l'Ucraina rifiutandole un posto al tavolo. NSATU e PURL fanno della NATO la struttura portante della logistica della difesa ucraina, eppure il testo dell'Aia ha eliminato il riferimento al 'irreversible path' e Ankara non lo ha ripristinato; Mosca legge la porta sospesa come una scelta occidentale di logoramento anziché di accordo, e poiché PURL acquista scorte americane, il membro più riluttante a sostenere l'Ucraina tiene in mano il rubinetto (circa il 95% degli intercettori Patriot dell'Ucraina arriva in questo modo).
- hash: '168744d6'
  it: |
    Un obiettivo pensato per vincolare i membri diventa la linea che li divide. La cifra del 5% è stata fissata all'Aia per dare a Trump un numero; da allora ha prodotto un rifiuto pubblico (la Spagna, con le minacce di dazi statunitensi), un blocco riluttante (Slovacchia, Cechia), una contesa sulla riclassificazione della categoria 1.5% (il ponte italiano, l'opposizione della Lituania a definizioni troppo larghe) e un vertice che ha consumato le sue energie sui 'credible plans'. Il parametro misura lo sforzo, non la capacità, e alimenta le discussioni contabili che l'Alleanza non può permettersi.
- hash: '24f67c8c'
  it: |
    Unità comprata con il silenzio. Le dichiarazioni del 2025 e del 2026 omettono la Cina e l'Indo-Pacifico e non dedicano alcun paragrafo all'adesione dell'Ucraina, il che mantiene il testo unanime e Trump al tavolo; ma l'unico testo che impegna gli alleati sulla Cina resta lo Strategic Concept del 2022, così la potenza che più vorrebbe una NATO di fronte alla Cina non può indicare nulla di più recente, e Pechino risponde comunque alla frase di Rutte 'cannot be naive about China' con 'Cold War mentality'.
- hash: '0c91b44e'
  it: |
    La NATO è una strategia solo nel senso in cui una coalizione può averne una: fa ciò che trentadue governi possono firmare, e la firma è il prodotto. Dal 2022 la sua logica luttwakiana è lineare al livello più alto (scoraggiare la Russia, con l'articolo 5 come scopo di fondo) e perversa nei livelli che la portano avanti. Per tenere il solo membro che conta, deve fare dell'agenda di quel membro la propria - più denaro europeo, più forze europee, 'NATO 3.0' - e ogni concessione mette in mostra quanto della deterrenza sia sempre stato americano. Il vertice di Ankara del 7-8 July 2026 ha risolto la questione immediata (articolo 5 'ironclad', la Russia minaccia di lungo periodo, EUR 70bn per l'Ucraina, oltre USD 50bn di acquisti) in sei paragrafi, e ha lasciato aperte quelle strutturali: la revisione della postura di Washington deve arrivare a Hegseth il 6 November, la porta dell'Ucraina non è né chiusa né aperta, la Spagna e la Slovacchia sono fuori dalla logica del 5%, e il prossimo vertice, promesso in Albania da Rutte, non ha ancora una data. Due segnali che non compaiono come righe: l'omissione della Cina e di ogni riferimento all'adesione dell'Ucraina in entrambe le dichiarazioni, e il ripetuto ricorso di Rutte alla 'division of labour' con l'EU come modo per far pagare gli europei senza chiamarlo una ritirata. Letta attraverso Luttwak, la forza dell'Alleanza (la promessa dell'articolo 5 in cui tutti credono abbastanza da pagarla) è anche la sua debolezza: la promessa vale quanto i dubbi del solo garante, quindi l'Alleanza spende il proprio capitale politico nel gestire il garante anziché l'avversario.
- hash: 'bf24c1b8'
  it: |
    Scoraggiare l'India e mantenere il Kashmir e le acque dell'Indo come rivendicazioni attive: preservare un equilibrio nucleare e convenzionale credibile nei confronti di un vicino molto più grande, mantenere la linea secondo cui qualsiasi deviazione del sistema dell'Indo è 'an act of war' (Sharif all'UN, September 2026) e ripristinare l'Indus Waters Treaty che l'India ha messo 'in abeyance' il 23 Apr 2025.
- hash: 'd9b6adb1'
  it: |
    Stroncare le insurrezioni interne e costringere i talebani afghani a smettere di dare loro rifugio: il TTP nel Khyber Pakhtunkhwa e i separatisti baluci (BLA e altri) hanno ucciso più di 600 militari e poliziotti nel 2025, e la linea di Islamabad pretende una 'visible and verifiable action' da Kabul, imposta con attacchi aerei.
- hash: '5b695e7d'
  it: |
    Mantenere finanziato lo Stato: un programma IMF (accordo a livello di staff sulla quarta revisione dell'EFF il 7 Oct 2026), depositi cinesi, sauditi ed emiratini rinnovati, rimesse record (USD 41.6bn nell'esercizio FY2025-26) e accesso al GSP+ dell'EU, dopo il quasi default del 2022-23 e le alluvioni del 2025.
- hash: 'fdab5f54'
  it: |
    Coprirsi moltiplicando i patroni invece di sceglierne uno: la Cina (armi, CPEC 2.0, copertura diplomatica), l'Arabia Saudita e la Turchia (lo Strategic Mutual Defence Agreement del 17 Sep 2025 e il patto della Mecca del 7 Aug 2026) e gli Stati Uniti, con cui i rapporti si stanno riscaldando (il pranzo Munir-Trump di June 2025, le offerte di minerali e cripto, il seggio nel Board of Peace, la mediazione USA-Iran), in modo che nessun patrono possa dettare le condizioni.
- hash: 'ed470946'
  it: |
    Consolidare dentro la costituzione la tutela dello Stato da parte dell'esercito: il 26° e il 27° emendamento (Nov 2025) hanno creato la carica di Chief of Defence Forces, affidata al capo dell'esercito, hanno assegnato al feldmaresciallo Asim Munir un mandato di cinque anni, il comando della Strategic Plans Division nucleare e l'immunità a vita, mentre Imran Khan resta in prigione.
- hash: 'f5adab5c'
  it: |
    Trasformare la geografia in connettività e rendita: Gwadar e CPEC 2.0, la ferrovia Uzbekistan-Afghanistan-Pakistan, le rotte commerciali del Golfo e dell'Asia centrale, e un riavvicinamento con Dacca dopo Hasina, per rompere l'accerchiamento da parte di una Kabul amica dell'India e di una Delhi ostile.
- hash: '07cd1e6e'
  it: |
    La mediazione come moneta: Munir, Sharif e Dar hanno mediato il cessate il fuoco USA-Iran dell'April 2026, hanno ospitato gli Islamabad Talks (11-12 April, con il vicepresidente Vance) e l'Islamabad Memorandum del 17 June 2026, e il Pakistan è entrato nel Board of Peace di Trump nel January 2026. Un seggio nell'UN Security Council (2025-26) e i patti di difesa con Riad e Ankara ampliano il pubblico.
- hash: '9f933600'
  it: |
    Una narrazione di vittoria per la guerra di May 2025 ('Marka-i-Haq'): l'affermazione, mai confermata in modo indipendente, secondo cui i caccia J-10C avrebbero abbattuto da cinque a sette aerei indiani, tra cui dei Rafale, ripetuta dal ministro della Difesa e dall'ISPR, e una cornice costante che dipinge l'India come sponsor del TTP e del BLA ('Indian proxies').
- hash: 'e99d6615'
  it: |
    Deterrente nucleare sotto il nuovo Chief of Defence Forces (che comanda la Strategic Plans Division), un braccio missilistico convenzionale (Army Rocket Force Command annunciato il 13 Aug 2025; test del Fatah-IV da 750 km il 30 Sep 2025 e il 14 May 2026), piattaforme cinesi (J-10C con PL-15) e truppe prestate ai partner: circa 8,000 militari, uno squadrone JF-17 e una batteria HQ-9 in Arabia Saudita.
- hash: '526a215c'
  it: |
    Forza coercitiva contro l'Afghanistan: attacchi aerei a Nangarhar, Paktika e Khost (21 Feb 2026), poi attacchi su Kabul e Kandahar e la dichiarazione di 'open war' del 27 Feb 2026 (Operation Ghazab lil-Haq), ripetuti dopo l'attacco di Kohat del 18 Sep 2026; accompagnati da una campagna di deportazioni che ha rimandato indietro più di 2.4 milioni di afghani entro June 2026.
- hash: 'e2d3a88c'
  it: |
    Offrire risorse e rotte in cambio di protezione: joint venture su minerali critici e cripto proposte a Washington (rame, oro, litio, antimonio), l'accordo CPEC 2.0 del May 2026 con Pechino, i protocolli con Russian Pakistan Steel Mills, le esportazioni di JF-17 (Azerbaigian, fino a USD 4.6bn annunciati) e una diaspora le cui rimesse (USD 41.6bn nell'FY26) coprono il disavanzo commerciale.
- hash: '8ca9d995'
  it: |
    Un bilancio fragile: debito estero vicino a USD 130bn, con il servizio del debito che assorbe circa il 40% delle esportazioni (World Bank), riserve lorde di circa USD 21.5bn, inflazione del 10.3% a September 2026, e in aggiunta le alluvioni del 2025 (1,037 morti; perdite per Rs822bn). Ogni scelta di politica estera viene fatta sotto un programma IMF e con rinnovi di depositi che possono scadere (il rinnovo saudita da USD 3bn non era confermato a July 2026).
- hash: 'd9cb7336'
  it: |
    Un problema di sicurezza su due fronti che non riesce a chiudere: un'India più grande e dotata di armi nucleari a est, che controlla le opere di presa dell'Indo (a monte del Punjab e del Sindh), e un Afghanistan governato dai talebani più il TTP a ovest, con il Belucistan all'interno. Crisis Group avverte che un altro grave attacco potrebbe compromettere la calma sia con Kabul sia con Delhi.
- hash: '994522f6'
  it: |
    Dipendenza dalla Cina per sistemi d'arma e denaro: circa l'80% delle importazioni di armi nel 2021-25 (SIPRI), il maggior creditore bilaterale (23% del debito estero pubblico), e Rs560bn (circa USD 2bn) dovuti a produttori cinesi di energia elettrica. Il prezzo chiesto da Pechino è la sicurezza dei propri cittadini, la cui ripetuta uccisione (circa 20 morti dal 2021) mette a dura prova il rapporto.
- hash: '81177a92'
  it: |
    Energia e trasporti marittimi esposti al Golfo: più del 22% delle importazioni è energia e quasi il 20% delle importazioni transita per lo Stretto di Hormuz, quindi la guerra USA-Iran che il Pakistan media fa crescere la sua stessa spesa per i carburanti (prezzi dei carburanti +20% il 6 March 2026) e minaccia le rimesse dal Golfo (Arabia Saudita USD 9.78bn, Emirati Arabi Uniti USD 8.81bn nell'FY26) che lo sostengono.
- hash: '5b8dc46f'
  it: |
    Una base interna ristretta per l'ordine ibrido: Imran Khan e il PTI sono esclusi ma non sconfitti (Khan in carcere dall'August 2023, condannato di nuovo nel December 2025, con la Supreme Court che ha ordinato cure ospedaliere nell'August 2026), e Chatham House legge il 27° emendamento come una formalizzazione del dominio dell'esercito. La legittimità poggia sul riconoscimento esterno, non su un patto civile-militare consolidato.
- hash: 'eafb3eda'
  it: |
    Obblighi verso i patroni che si intersecano: il patto saudo-turco obbliga all'invio di truppe mentre il Pakistan è anche intermediario tra Stati Uniti e Iran e condivide un lungo confine con l'Iran; il seggio nel Board of Peace e l'invito di Trump a entrare negli Abraham Accords (May 2026) entrano in collisione con un'opinione pubblica che rifiuta di riconoscere Israele.
