items:
- hash: 133bd84d
  it: |
    Barbados sotto Mottley gioca il gioco di uno stato piccolo: il suo peso deriva da un'agenda su clima e debito portata avanti nelle sedi UN e multilaterali, e da una linea regionale contro la militarizzazione che la mette in contrasto con il dispiegamento statunitense e con Trinidad e Tobago. Il suo legame con Londra è il Commonwealth e la storia, più che un trattato; la richiesta di riparazioni, i prestiti cinesi, i fascicoli CARICOM su Haiti e Venezuela e il peso del turismo non sono documentati in questa fase. Uragani e livello del debito, i due vincoli con cui una scheda sui Caraibi di norma si apre, sono anch'essi non verificati qui e restano aperti finché non sarà letta una fonte.
- hash: b52f7671
  it: |
    Mantenere intatta la monarchia islamica e la successione nella linea Bolkiah: il Sultano è capo del governo oltre che capo dello Stato, il Principe ereditario Al-Muhtadee Billah è il primo in linea, e il codice penale della sharia del 2014, con la lapidazione in vigore dall'aprile 2019, è la dichiarazione pubblica di quella identità.
- hash: 4278321c
  it: |
    Diversificare un'economia fondata su petrolio e gas nel quadro di Wawasan Brunei 2035, attirando capitali cinesi nella raffinazione e nella petrolchimica: il complesso Hengyi a Pulau Muara Besar, con la Fase 2 avviata nel gennaio 2026 per portare la capacità a circa 400,000 barili al giorno entro la fine del 2028.
- hash: f26511eb
  it: |
    Mantenere sul proprio territorio truppe e addestramento britannici e singaporiani come base della sicurezza: il presidio britannico, i cui Royal Gurkha Rifles si addestrano nella sua giungla, rinnovato il 19 dicembre 2024, e il campo nella giungla delle Singapore Armed Forces a Lakiun, nel Temburong.
- hash: dc27bb50
  it: |
    Seggi multilaterali come scudo: membro dell'ASEAN dal 1984, del Commonwealth e dell'OIC, e presidente dell'ASEAN nel 2013, quando cercò il sostegno delle Filippine per la presidenza.
- hash: 94b9fa24
  it: |
    Petrolio e gas come base dell'export: Brunei LNG a Lumut, joint venture del governo, di Shell e di Mitsubishi, rifornisce il Giappone dal 1972; la raffineria Hengyi, finanziata dalla Cina, copre la domanda interna di carburanti dal 2019.
- hash: d35a0bb0
  it: |
    Difesa importata e addestrata: un presidio britannico con personale della British Army e della RAF, il campo nella giungla di Singapore ed Exercise Airguard con la Republic of Singapore Air Force dal 1994.
- hash: 36f58646
  it: |
    Petrolio e gas sono l'economia: Brunei LNG, il maggiore produttore di petrolio e gas del paese, ha sede a Lumut nel Belait, il distretto dove è concentrata l'industria, per cui la ricchezza dello Stato deriva ancora dagli idrocarburi.
- hash: cae64df7
  it: |
    La sua difesa è in prestito: un presidio britannico e un campo nella giungla singaporiano la coprono, quindi non può spingere la questione di Limbang con la Malaysia e lascia quella rivendicazione latente.
- hash: 060b7b81
  it: |
    La sua legittimità interna poggia sull'islam, che la limita all'estero: le norme sulla lapidazione del 2019 nel codice penale della sharia hanno provocato appelli al boicottaggio degli hotel di proprietà reale, e l'appartenenza all'OIC (1984) la vincola alla solidarietà islamica, mentre i suoi partner nella difesa e negli investimenti non sono Stati a maggioranza musulmana.
- hash: 4aaa6422
  it: |
    Il codice penale della sharia doveva ancorare il sultanato all'islam e al proprio potere, ma le norme sulla lapidazione del 2019 hanno reso gli hotel di proprietà reale e gli investitori bersaglio di boicottaggi: proprio il capitale estero da cui dipende la diversificazione di Wawasan 2035.
- hash: 8d7ca00e
  it: |
    Il Brunei è un piccolo e ricco sultanato la cui economia poggia su una sola risorsa, petrolio e gas, con il GNL venduto al Giappone dal 1972. La sua strategia è difensiva e in prestito: mantiene in patria la propria identità islamico-monarchica (il codice penale della sharia del 2014, con la lapidazione in vigore dal 2019), acquista la sicurezza all'estero (un presidio britannico e il campo nella giungla singaporiano) e acquista la diversificazione dall'esterno (Hengyi, capitale cinese a Pulau Muara Besar). Il codice della sharia è il prezzo che ha scelto di pagare per la propria legittimità, e il boicottaggio che ha suscitato ne è il costo. La rivendicazione su Limbang contro la Malaysia resta latente anziché essere portata avanti.
- hash: f4c41e70
  it: |
    Mantenere la sovranità che il trattato indiano del 2007 garantisce, lasciando all'India la sicurezza e le grandi infrastrutture. Il trattato rivisto ha soppresso la clausola del 1949 che obbligava il Bhutan a seguire il parere dell'India sulle relazioni esterne, ma Thimphu continua a costruire la propria politica estera intorno a Delhi, e l'India è intervenuta a Doklam nel 2017 su richiesta del Bhutan.
- hash: 3a4f28ef
  it: |
    Chiudere il confine settentrionale con la Cina, ancora non delimitato, seguendo la tabella di marcia in tre fasi senza cedere terreno: memorandum d'intesa del 14 ott 2021, 24 cicli di colloqui dal 1984 e il gruppo congiunto di demarcazione istituito alla 13a riunione del Gruppo di esperti a Pechino (ago 2023). Nel frattempo la Cina ha costruito villaggi nelle zone settentrionali e occidentali contese.
- hash: e8a7175a
  it: |
    Fare dell'idroelettrico e del progetto di Gelephu la base economica: Punatsangchhu-II (1,020 MW) completata nel 2025, Punatsangchhu-I riavviata nell'aprile 2026 dopo un'interruzione di sette anni, e la Gelephu Mindfulness City, con un collegamento ferroviario verso il Kokrajhar dell'Assam, approvata nel settembre 2025 e in costruzione dal 2026.
- hash: f02d1047
  it: |
    L'idroelettrico venduto soprattutto all'India è la base dell'export: secondo il conteggio dell'IDSA, l'idroelettrico vale circa il 63% delle entrate da export del Bhutan (l'Ambasciata a New Delhi parla di quasi due terzi), e fa della rete elettrica l'unica grande leva che Thimphu controlla.
- hash: 0976228c
  it: |
    La Felicità Nazionale Lorda (GNH) e la carbon negativity come marchio esterno: la Costituzione (articolo 5) impone una copertura forestale di almeno il 60%, e il Bhutan si presenta come carbon negative e la GNH come modello di sviluppo. I conti del carbonio non coincidono (Daily Bhutan: circa 2.2 Mt di CO2 emesse all'anno contro alberi che ne assorbono più di tre volte tanto; Carbon Credits: circa 9 Mt sequestrate contro 2 Mt generate nel 2020), quindi si tratta di un'affermazione del governo, non di un bilancio misurato.
- hash: d5652994
  it: |
    Una rete diplomatica volutamente sottile: rapporti con 62 dei 192 altri membri UN e con nessuno dei cinque membri permanenti del Security Council; il Bhutan ha ambasciate in soli sei paesi, e solo Bangladesh, India e Kuwait hanno ambasciate a Thimphu.
- hash: 25f525b2
  it: |
    La valuta e il mercato sono indiani: il ngultrum è fissato alla pari con la rupia indiana, e la Royal Monetary Authority avverte che gli squilibri esterni con l'India gravano sull'ancoraggio valutario.
- hash: b96602f8
  it: |
    Gli aiuti sono consistenti e legati a Delhi: l'India ha stanziato INR 10,000 crore per il 13th Five Year Plan (2024-29), di cui INR 7,000 crore vincolati a progetti; i contributi indiani finanziano oltre il 30% del bilancio in conto capitale 2026-27. Il Giappone aggiunge borse di studio e contributi per attrezzature, e l'EU con contributi e prestiti più modesti.
- hash: 31d29e79
  it: |
    I propri cittadini se ne vanno: le partenze mensili dall'aeroporto di Paro sono salite da meno di 500 prima del COVID a oltre 5,000 all'inizio del 2023; i migranti bhutanesi in Australia sono raddoppiati, da 12,424 (2020) a 25,363 (2024). La World Bank (indagine sulle famiglie del 2024) rileva migranti istruiti, aspiranti migranti più giovani e una disoccupazione del 6% nel 2022.
- hash: 182ac35f
  it: |
    Confine e sicurezza sono regolati altrove: nessuna relazione diplomatica con la Cina, un confine non delimitato, e lo stallo di Doklam del 2017, chiuso con il ritiro delle truppe (28 ago 2017) che ha lasciato irrisolta nelle dichiarazioni ufficiali la questione della strada; Thimphu mantiene un silenzio disciplinato sui villaggi cinesi.
- hash: 2e6c73bf
  it: |
    Lo Stato forma le persone che poi perde: borse di studio (il JDS giapponese e altre) e la pubblica amministrazione producono laureati, e l'istruzione è il motivo principale indicato dagli aspiranti migranti (64%). Il capitale umano in cui il Bhutan investe diventa il suo export.
- hash: 126e8ff3
  it: |
    L'idroelettrico dà al Bhutan le entrate da export e il marchio carbon-negative, ma le entrate passano da un'unica rete. Quanta più energia i progetti Punatsangchhu inviano all'India, tanto più la solvibilità dello Stato dipende da un vicino, mentre l'accordo sull'energia con il Bangladesh (tramite l'India) attende il consenso di Delhi.
- hash: '76627422'
  it: |
    Il Bhutan porta avanti la strategia di uno stato piccolo che ha comprato la propria sicurezza legandola a un solo vicino e poi ha speso il ricavato per la propria autonomia: il trattato del 2007 ha eliminato la clausola che obbligava Thimphu a seguire il parere dell'India, ma la rete idroelettrica, l'ancoraggio della rupia e i contributi indiani mantengono l'assetto vicino a quello di prima. I suoi tre fronti aperti sono la Cina (nessuna relazione, un confine non delimitato, Doklam nel 2017, villaggi dal 2016 che Thimphu non contesta in pubblico), il mondo esterno (una rete volutamente sottile e un marchio carbon-negative e GNH usato come voce all'UN e altrove) e la propria popolazione, che se ne va verso l'Australia e oltre. Le elezioni del 2024 hanno riportato alla guida del governo, da fine gennaio 2024, Tshering Tobgay (PDP, 30 seggi su 47 secondo un resoconto) come primo ministro. La Gelephu Mindfulness City, con il collegamento ferroviario finanziato dall'India, è la scommessa: se funziona, il Bhutan ottiene una seconda base economica accanto all'idroelettrico e un nuovo motivo perché i giovani restino; se non funziona, sarà un'opera in più costruita dall'India. Lacune non coperte da questa scheda: le posizioni su Ucraina e Gaza, Thailandia e Singapore, il Golfo e i contatti con gli Stati Uniti nel 2025 oltre il dazio del 10%.
- hash: 5e050304
  it: |
    Aumentare la quota dello Stato in De Beers. Secondo le notizie Gaborone è vicina a un accordo che porterebbe la sua partecipazione dal 15% a circa il 25%; non ancora definitivo al 14 ottobre 2026. È un arretramento rispetto alla maggioranza che Boko cercava alla fine del 2025.
- hash: 6e68c4da
  it: |
    Tenere a galla il bilancio dello Stato e il prezzo dei diamanti, mentre a fine dicembre 2025 12 milioni di carati restano in magazzino, quasi il doppio del tetto governativo di 6.5 milioni di carati. Per ora il ministero delle Finanze mantiene la produzione sostanzialmente stabile.
- hash: df354b82
  it: |
    Debswana, la joint venture con De Beers, realizza circa il 90% delle vendite nazionali di diamanti. Le leve dello Stato sono la sua quota e l'accordo di vendita; notizie più datate riferiscono che avrebbe minacciato di non rinnovare l'accordo di vendita, un punto non riverificato per questa scheda.
- hash: 23dc71e8
  it: |
    Il Sudafrica come partner e come partner nell'unione doganale: la visita di Stato del presidente Ramaphosa a Gaborone il 20-21 maggio 2026, durante la quale ha co-presieduto la sesta Bi-National Commission (la precedente risale al 2022). Il commercio d'oltremare passa per i porti sudafricani e namibiani, secondo una guida commerciale statunitense non datata.
- hash: 30aa338b
  it: |
    I diamanti sono lo Stato: circa un terzo delle entrate pubbliche e tre quarti dei proventi in valuta estera (dati del ministero delle Finanze). La cifra 'about 80% of exports' è storica e non è stato possibile verificarla con i dati commerciali, quindi questa scheda non la usa.
- hash: 47c54eac
  it: |
    Pietre coltivate in laboratorio e dazio statunitense. Le stime del settore attribuiscono alle pietre di laboratorio circa un quarto del mercato statunitense dei gioielli di diamanti; il ministero delle Finanze del Botswana ha avvertito che dazi statunitensi del 15%, con eventuali dazi indiani, potrebbero prolungare la crisi. L'aliquota del 37% di una proposta precedente non è quella definitiva.
- hash: 7841ec96
  it: |
    Gaborone preme su De Beers perché venda di più e ceda una quota maggiore, eppure detiene 12 milioni di carati, quasi il doppio del proprio tetto. Il limite vincolante è il mercato, non la quota: una partecipazione più grande renderebbe lo Stato comproprietario di pietre che non può vendere.
- hash: 27a7e163
  it: |
    La grand strategy del Botswana consiste nel trasformare la dipendenza dai diamanti in controllo statale: una quota più grande in De Beers, voce in capitolo sulle vendite e un bilancio che regga alla crisi, con Debswana che realizza circa il 90% delle vendite nazionali di diamanti. L'eccesso di pietre di laboratorio e il dazio statunitense erodono il valore di quella quota più in fretta di quanto la negoziazione possa farla crescere, per cui Gaborone, secondo quanto riportato, si orienta ad accontentarsi di circa il 25% anziché della maggioranza che voleva. Il Sudafrica è il partner su cui fa leva (SACU, il rand, i porti); Namibia, Zimbabwe, EU e Regno Unito non sono ancora stati letti dalle fonti, e la scheda è più sottile del suo livello perché il budget di ricerca si è esaurito.
- hash: 2d9c184d
  it: |
    Mantenere al potere Faustin-Archange Touadera. Era atteso alla vittoria di un terzo mandato nelle elezioni di dicembre 2025, dopo che un referendum del 2023 ha eliminato i limiti di mandato (AP, approfondimento pre-voto, dic 2025). Il risultato non è verificato in questa fase.
- hash: e605bbcc
  it: |
    Tenere lo Stato contro i gruppi armati con una guardia straniera, pagata in minerali anziché in contanti. Il governo ha preferito pagare i servizi di sicurezza in minerali (cronaca AP, letta tramite i riepiloghi di ricerca; la pagina non è stata aperta); UPC e 3R hanno firmato un accordo di disarmo nell'aprile 2025 (si veda la riga sul Ciad), ma il resto del campo armato non è ancora risolto.
- hash: '97187227'
  it: |
    Forze straniere come guardia del regime. Consiglieri russi operano dal marzo 2018 (aiuti militari gratuiti, largamente ritenuti riconducibili alla Wagner); l'Africa Corps doveva sostituire la Wagner nel 2026 (Touadera a Mosca nel marzo 2026 per finalizzarlo; la cifra di USD 15m al mese ha una sola fonte e non è usata). Una forza rwandese bilaterale opera dal 2020 al di fuori della MINUSCA; il governo ha dichiarato che entrambi i paesi hanno inviato centinaia di soldati dopo un presunto tentativo di colpo di Stato. Il Rwanda è anche tra i maggiori contributori della MINUSCA.
- hash: eec6726c
  it: |
    Minerali. Diamanti e oro sono il pagamento per la protezione: il governo ha dichiarato di preferire il pagamento dei servizi in minerali anziché in denaro. Il valore delle concessioni non è verificato in questa fase; le concessioni di oro e legname a favore di imprese russe sono una nostra lettura e non sono ancora documentate qui.
- hash: 2e18cc54
  it: |
    L'impalcatura UN si sta restringendo. La MINUSCA è stata prorogata di un anno, ma il Security Council ha detto che la sua presenza si ridurrà per vincoli di bilancio (AP, come riassunto nei risultati di ricerca). La composizione dei suoi contingenti è guidata da Rwanda e Bangladesh, quindi l'UN non è una guardia indipendente.
- hash: 42281f4e
  it: |
    La Francia se n'è andata. Le ultime truppe francesi sono partite nel 2022, dopo che i rapporti si erano raffreddati per i legami di Bangui con la Russia sotto Touadera (Wikipedia, solo indice). La ripresa degli aiuti del 2024-25 non è verificata qui, quindi il mercato della sicurezza è a senso unico: Russia o Rwanda.
- hash: 29c34668
  it: |
    La guardia che tiene Touadera al potere lo rende dipendente dai patroni che incassano i minerali. La versione del governo sul dispiegamento straniero è un presunto tentativo di colpo di Stato, che ha attribuito al sostegno dell'ex presidente Bozize alle milizie (Naharnet); la minaccia che indica è ciò che mantiene in essere le guardie.
- hash: 2ede4400
  it: |
    La strategia di Bangui è la sopravvivenza del regime attraverso guardie straniere: consiglieri russi dal 2018 e una forza rwandese dal 2020 tengono la capitale e lo Stato, mentre Touadera cerca un terzo mandato sotto una costituzione modificata nel 2023. Il prezzo sono i minerali, e la missione che dovrebbe garantire la pace, la MINUSCA, è essa stessa guidata dal Rwanda e in riduzione per ragioni di bilancio. La Francia se n'è andata, quindi la scelta è tra Mosca e Kigali, e i due patroni vengono pagati con lo stesso terreno per cui si combattono i gruppi armati.

    Non verificato per questa scheda: il campo dei gruppi armati (per la coalizione CPC non ci sono fonti qui, quindi non è stato redatto alcun file di posizione o di attore), il confine con il Ciad e il Sudan e le ricadute dell'RSF, i volumi di export di diamanti e oro, e la ripresa degli aiuti francesi del 2024-25.
- hash: 10c0de9e
  it: |
    Mantenere intatta la cornice nordamericana (CUSMA, NORAD, NATO) mentre Washington la costringe: il 1° luglio 2026 gli Stati Uniti hanno rifiutato di rinnovare il CUSMA 'in its current form', il che fa scattare revisioni congiunte annuali mentre il patto resta in vigore fino al 2036, e dal 22 agosto 2026 si applica un dazio del 50% ai sensi della Section 338 su circa USD 20bn di merci canadesi. La linea di Carney è che il patto sopravvive senza alcuna nuova intesa, quindi la cornice è il primo obiettivo e quello più esposto.
- hash: 13bf58ad
  it: |
    Rompere la dipendenza da un solo mercato: oltre il 70% delle esportazioni canadesi va verso gli Stati Uniti (Carney, New York Times, 23 settembre 2026), perciò Ottawa vende altrove: il Security and Defence Partnership con l'EU e l'accesso a SAFE (il Canada primo paese non europeo in SAFE, approvazione del Consiglio del 15 giugno 2026), la candidatura a entrare nella Joint Expeditionary Force guidata dal Regno Unito e i colloqui per unire i finanziamenti della difesa con Londra (settembre 2026), un accordo decennale con Cameco per l'uranio con l'India (marzo 2026) e la riapertura di gennaio 2026 con la Cina su veicoli elettrici (EV) e canola.
- hash: 2309cd66
  it: |
    Rispettare l'impegno di spesa NATO e l'Artico: il Canada ha raggiunto il 2% del PIL in difesa nel 2025 (rapporto annuale NATO, marzo 2026), Carney si è impegnato al 5% entro il 2035, circa USD 150bn l'anno, e ha portato la presenza nell'Artico a 365 giorni l'anno con radar over-the-horizon contro la Russia, che ha definito 'without question' una minaccia nell'Artico (gennaio 2026).
- hash: 148223b4
  it: |
    Portare il petrolio su una seconda costa: un oleodotto di bitume in co-proprietà indigena dall'Alberta alla costa della Columbia Britannica, dichiarato progetto di interesse nazionale nel memorandum di novembre 2025 con l'Alberta, poi un accordo di attuazione del 15 maggio 2026 che fissava una domanda dell'Alberta per il 1° luglio 2026 e una designazione federale di interesse nazionale entro il 1° ottobre 2026.
- hash: f2e2942e
  it: |
    Ricostruire la flotta e la base industriale con partner diversi da Washington: il Budget 2025 destina CAD 81.8bn in cinque anni alle forze armate, con CAD 6.6bn per una Defence Industrial Strategy e CAD 1bn per un Arctic Infrastructure Fund di aeroporti, porti e strade a duplice uso. Il 6 luglio 2026 Carney ha indicato la TKMS tedesca come fornitore preferito per fino a 12 sottomarini (un progetto tedesco-norvegese, con la coreana Hanwha come alternativa di riserva; i negoziati contrattuali proseguono fino al 2027 e i primi battelli sono previsti per il 2034), dopo la decisione del marzo 2025 di acquistare una tecnologia radar australiana over-the-horizon per oltre CAD 6bn. L'obiettivo è una capacità sovrana all'interno dell'interoperabilità NATO, e i contratti vanno a Europa, Australia e industria canadese.
- hash: ac3731a2
  it: |
    Tenere unita la federazione finché dura la pressione dal sud: il Parti Quebecois ha vinto le elezioni del Quebec del 5 ottobre 2026 con 59 seggi su 127 e il 28% dei voti, a capo di un governo di minoranza che promette un referendum sulla sovranità ma non prima del 20 gennaio 2029, e l'Alberta vota il 19 ottobre 2026 sull'eventualità che il governo avvii l'iter legale verso un referendum vincolante sull'indipendenza (Leger, 2-4 ottobre 2026: 70% per restare, 22% per un referendum sulla secessione). Carney ha risposto all'esito del voto in Quebec offrendo di lavorare con il premier designato per i lavoratori colpiti dai dazi. L'unità nazionale non è in nessun trattato, e i primi tre obiettivi dipendono da essa.
- hash: d1f8994b
  it: |
    L'accesso al mercato come moneta di scambio: una quota per 49,000 veicoli elettrici (EV) cinesi all'aliquota della nazione più favorita del 6.1%, che salirebbe verso circa 70,000 in cinque anni, scambiata con i dazi cinesi sul seme di canola ridotti dall'84% al 15% (richiesto entro il 1° marzo 2026); accesso al CUSMA, i contratti SAFE dell'EU (fino all'80% di contenuto canadese) e il contratto per l'uranio con l'India come altre carte da giocare.
- hash: c94699f0
  it: |
    Forze sui fianchi orientale e settentrionale della NATO: la nazione quadro della NATO Multinational Brigade in Lettonia, con oltre 2,000 militari fino al 2031 (si veda la scheda LVA), una postura artica di 365 giorni, e aiuti militari all'Ucraina per CAD 2.8bn nel 2026, con il pacchetto di munizioni e veicoli blindati di luglio 2026 (resoconto del Primo ministro).
- hash: b03f1240
  it: |
    Coalizioni attorno a Washington: il Security and Defence Partnership con l'EU (giugno 2025), la candidatura a entrare nella Joint Expeditionary Force guidata dal Regno Unito e i colloqui per unire le iniziative canadesi e britanniche di finanziamento della difesa (settembre 2026), il Visiting Forces Agreement con le Filippine (ratificato dal Senato l'11 agosto 2026) e la visita a Pechino del gennaio 2026 per ricostruire i rapporti mentre la parte cinese è incalzata sulle interferenze.
- hash: 803e4939
  it: |
    Ritorsione e forniture come leva: contro-dazi dollaro per dollaro su CAD 27.6bn di beni statunitensi, al 50%, 25% o 15% dall'8 settembre 2026 (acciaio e alluminio da 25% a 50%), in risposta ai dazi ai sensi della Section 338 che dal 22 agosto hanno colpito per la prima volta anche le merci conformi al CUSMA; e l'offerta di forniture, con l'LNG che Carney dice il Canada potrebbe raddoppiare entro la fine del decennio (Giappone, marzo 2026), il lavoro del 2025 sui minerali critici con la Germania, un accordo saudita di protezione degli investimenti previsto per l'inizio del 2027 e un impegno di investimento degli UAE riportato a 70bn (valuta non specificata, novembre 2025).
- hash: ed86ff08
  it: |
    Gli appalti come costruzione di alleanze: il contratto per i sottomarini con la TKMS (Germania, con un partner norvegese) e la Hanwha tenuta in riserva, il radar australiano over-the-horizon, l'accesso ai prestiti SAFE dell'EU, gli acquisti congiunti e un ruolo di nazione guida alla fiera della difesa di Kielce 2026 con la Polonia, e CAD 20m per la struttura di riparazione dei Leopard 2A4 a Gliwice che serve l'Ucraina. Ogni contratto lega l'industria di un partner al piano di difesa canadese senza passare per gli Stati Uniti.
- hash: dbd34c5a
  it: |
    Una scala di partenariati strategici per sostituire l'abitudine a un solo patrono: Polonia (25 agosto 2025), Giappone (6 marzo 2026), un partenariato aggiornato con la Cina (il ministro degli Esteri Wang Yi a Ottawa, 28-30 maggio 2026), Germania (negoziati avviati il 7 luglio 2026 per la conclusione entro la fine del 2026), Arabia Saudita (un Consiglio di coordinamento guidato dai ministri degli Esteri, 8-10 luglio 2026) e UAE (negoziati su un accordo commerciale). Sul fronte artico lo stesso metodo porta a un consolato a Nuuk (aperto all'inizio di febbraio 2026, lo stesso giorno di quello francese) e alla soluzione del 2022 della controversia sull'isola di Hans con la Danimarca.
- hash: c942dbf9
  it: |
    Dipendenza commerciale. L'interscambio di merci del Canada con gli Stati Uniti è stato di USD 712.8bn nel 2025, e oltre il 70% delle esportazioni canadesi va a un unico acquirente che ora usa i dazi come coercizione (fonti della scheda USA). La diversificazione verso Europa, Regno Unito, India e Asia è un progetto pluriennale, non un sostituto che si possa attivare nel 2026.
- hash: e0a602c6
  it: |
    Un consenso interno diviso. L'oleodotto dell'Alberta ha bisogno della Columbia Britannica, dove il premier David Eby definisce il progetto 'fictional' e sostiene che minaccia la licenza sociale di altri progetti costieri, e il Bloc Quebecois vi si oppone; mentre un sondaggio nazionale dell'ottobre 2025 ha rilevato una maggioranza favorevole a un oleodotto verso la costa della B.C. Il premier dell'Ontario Doug Ford si oppone alla quota EV cinese come minaccia per l'industria automobilistica.
- hash: 6498228a
  it: |
    Capacità di difesa. Il Canada ha raggiunto il 2% del PIL solo nel 2025, dopo l'1.47% del 2024, quando era uno degli 11 membri NATO che avevano mancato l'obiettivo; l'impegno del 5% significa circa 2.5 volte l'attuale quota del PIL, e la Defence Investment Agency, che dovrebbe accelerare gli appalti, è nuova.
- hash: 50ab1fc2
  it: |
    Una federazione che detiene le leve a cui mira Washington. L'ordine ai sensi della Section 338 del 20 luglio 2026 è presentato come risposta alla discriminazione canadese contro le bevande alcoliche statunitensi, materia provinciale, e le esclusioni successive riguardano latticini e alcolici, quindi Ottawa non può concedere sugli obiettivi senza le province. L'unione stessa è in gioco: una minoranza del Parti Quebecois (59 seggi su 127, 28% dei voti) governa il Quebec da ottobre 2026, e gli albertani votano il 19 ottobre sull'avvio del percorso verso un referendum vincolante sull'indipendenza. Ottawa può promettere a un partner solo ciò che le province lasceranno che realizzi.
- hash: '93191341'
  it: |
    Il tempo. La minaccia arriva prima degli scafi: il contratto per i sottomarini non è atteso prima della fine del 2027, i primi battelli sono previsti per il 2034 e l'impegno del 5% arriva al 2035, mentre il Canada ha raggiunto il 2% del PIL solo nel 2025. Secondo il Budget 2025, la parte dell'1.5% dell'obiettivo NATO (resilienza, infrastrutture) sarebbe coperta dalla spesa federale, provinciale e comunale già pianificata, senza un calcolo pubblicato; lo sforzo visibile è quindi il nucleo del 3.5%. I dispiegamenti nell'Artico e nel Baltico devono essere mantenuti con la forza esistente.
- hash: f4ffb88b
  it: |
    Pechino fissa un prezzo per la svolta. L'ambasciatore cinese Wang Di ha detto al Globe and Mail che il nuovo partenariato ne soffrirebbe se il Canada inviasse altre navi da guerra nello stretto di Taiwan o se i parlamentari continuassero a recarsi a Taiwan, e la fregata canadese HMCS Charlottetown è transitata il 22-23 maggio 2026, pochi giorni prima della visita di Wang Yi a Ottawa. Il Canada vuole gli scambi di canola e veicoli elettrici senza pagare in termini di politica su Taiwan, mentre la sua stessa inchiesta indica la Cina come l'interferenza straniera più attiva.
- hash: 08178587
  it: |
    La linea verso l'EU risponde alla coercizione di Washington e consegna a Washington un nuovo bersaglio. Trump ha definito l'associazione del Canada con l'EU un possibile 'hostile act' (CNN, 15 settembre 2026), quindi il partenariato che diversifica il commercio canadese è anche quello verso cui ora sono puntati i dazi.
- hash: bb964684
  it: |
    La svolta con la Cina compra l'accesso alla canola con l'accesso al mercato automobilistico. La quota EV che fa entrare i veicoli cinesi al 6.1% è la concessione che l'Ontario e l'industria automobilistica temono chiuda la porta ai costruttori canadesi nel mercato statunitense, cioè proprio il mercato su cui la svolta doveva fare hedging.
- hash: 54014d9f
  it: |
    Molta convergenza con Pechino sull'Artico. Dopo l'incontro con Xi, Carney ha detto di aver riscontrato 'much alignment' con la Cina sulla sovranità della Groenlandia e del suo popolo, mentre la politica di difesa canadese del 2024 indica le ambizioni cinesi e russe nell'Artico come la minaccia che giustifica la nuova spesa.
- hash: 3e326866
  it: |
    La diversificazione passa per l'unico mercato. La svolta lontano dagli Stati Uniti è reale nella politica (partenariati con Polonia, Giappone, Germania, Arabia Saudita, UAE, Cina), ma i dati mensili del 2026 puntano a sud: a maggio 2026 le esportazioni verso gli Stati Uniti sono aumentate per il quarto mese consecutivo mentre quelle verso gli altri paesi sono calate, e il surplus di merci del Canada con gli Stati Uniti è stato di CAD 11.6bn, il più alto dal gennaio 2025, contro un deficit di CAD 7.4bn con tutti gli altri. I dazi hanno imposto la ricerca di altri acquirenti; quando mordono meno il vecchio acquirente riprende le merci, e quando mordono di più (Section 338 sulle merci conformi al CUSMA) il costo ricade sugli esportatori i cui clienti non sono mai stati sostituiti.
- hash: c1761865
  it: |
    L'impegno del 5% compra un'alleanza il cui garante tratta il Canada come un bersaglio. Il Canada si impegna al 3.5% del PIL per la difesa di base e all'1.5% per la resilienza entro il 2035, per la NATO e il NORAD, il cui membro più forte impone un dazio del 50% sulle merci canadesi, lascia il patto commerciale non rinnovato, definisce l'associazione del Canada con l'EU un possibile 'hostile act' e, secondo il racconto di Carney al New York Times, è stato oggetto di piani come possibile invasore. Il riarmo rafforza lo scudo su cui Washington conta, mentre i contratti vanno a Europa, Australia e aziende canadesi anziché a quelle statunitensi, cosa che Washington legge come un'uscita; è la nostra lettura, non quella di una fonte.
- hash: 90377ff0
  it: |
    La pressione che unisce il Canada alimenta anche i suoi secessionisti, e l'oleodotto destinato a legare l'Alberta ha bisogno delle province che lo respingono. Dazi e la linea del '51st-state' compattano i canadesi attorno a Carney, eppure il Quebec ha votato il 5 ottobre 2026 per un partito che promette un referendum fissato dopo il mandato di Trump (non prima del 20 gennaio 2029), l'Alberta vota il 19 ottobre sulla via legale per uscire, e l'oleodotto dall'Alberta alla costa, che è la risposta di interesse nazionale al malcontento albertano, è definito 'fictional' dal premier della Columbia Britannica e osteggiato dal Bloc Quebecois. Ogni strumento che lavora contro Washington (progetti nazionali, dazi, rafforzamento artico e della difesa) richiede un consenso che la stessa pressione sta logorando.
- hash: '56405122'
  it: |
    Il Canada è una potenza media la cui sicurezza e il cui mercato guardano entrambi a sud, e il cui partner più grande è ora il suo coercitore. Ottawa risponde con una svolta deliberata verso Europa, Regno Unito, Asia e Artico, mantenendo NORAD, CUSMA e NATO, la cornice che non può permettersi di perdere. La svolta è transazionale per scelta, dal contingente di EV cinesi all'accordo sull'uranio con l'India, e i gradi lo dicono: partner nella maggior parte dei casi, partner riluttante solo dove l'allineamento è nuovo. Ogni mossa di hedging che risponde a Washington offre anche a Washington un bersaglio, quindi la prova è se le revisioni annuali del CUSMA restino parole o diventino l'uscita.

    L'aggiornamento del 16 ottobre 2026 aggiunge il secondo fronte. Il Canada costruisce una scala di partenariati (Polonia, Giappone, Germania, Arabia Saudita, UAE, Cina) e un piano industriale per la difesa (i sottomarini TKMS, il radar australiano), eppure i dati commerciali mensili continuano a puntare a sud, e la federazione che deve realizzare tutto questo ha appena eletto in Quebec un governo sovranista e voterà in Alberta il 19 ottobre. Un paradosso non scritto come riga, perché nessuna fonte lo afferma: l'Artico che il Canada si arma per difendere è aperto dal riscaldamento che l'oleodotto Alberta-costa di rank 4 alimenterebbe.

    Segnali che non sono righe: la Corte Suprema degli Stati Uniti ha annullato i dazi IEEPA a febbraio 2026, eliminando il dazio del 35% ma non quelli settoriali, e Washington ha risposto con la Section 232, la Section 122 e poi la Section 338, quindi il terreno giuridico della coercizione continua a muoversi mentre il suo bersaglio resta lo stesso.
- hash: f1a403b9
  it: |
    Mantenere l'accesso al mercato unico dell'EU (circa il 60% del commercio svizzero) senza aderire all'EU: lo strumento è il pacchetto Bilaterali III (18 accordi, 94 atti giuridici dell'EU, firmato il 2 mar 2026), che deve ancora passare in Parlamento e poi a un referendum contro il quale l'SVP sta organizzando la campagna.
- hash: 231e23f6
  it: |
    Restare un intermediario neutrale e paese ospitante (Ginevra, mandati di potenza protettrice, buoni uffici su Ucraina e Iran) allineandosi alle sanzioni dell'EU contro la Russia. Gli elettori hanno confermato questa linea il 27 set 2026, respingendo l'iniziativa sulla neutralità con circa il 70%.
- hash: f362fcf1
  it: |
    Ricostruire una difesa credibile senza un'alleanza: più fondi per l'esercito (il ministro della Difesa Martin Pfister sostiene un fabbisogno aggiuntivo di circa CHF 31bn dal 2028), e materiali occidentali (F-35, Patriot) acquistati senza alcuna garanzia da trattato.
- hash: f2b3bcec
  it: |
    Buoni uffici e ospitalità: Ginevra come sede dei contatti Stati Uniti-Iran e Stati Uniti-Ucraina-Russia nel 2026, mandati di potenza protettrice, il vertice di Bürgenstock del giugno 2024 e la presidenza OSCE nel 2026.
- hash: 5b5325ff
  it: |
    Diplomazia dell'accesso al mercato per via di trattati: Bilaterali III con l'EU, un quadro tariffario del 15% con gli Stati Uniti sostenuto da un impegno di investimento di USD 200bn fino al 2028, e un accordo di libero scambio aggiornato con la Cina (concluso il 20 ago 2026, 99.8% delle esportazioni svizzere esenti da dazi).
- hash: 8bd0b1c9
  it: |
    Servizio militare obbligatorio per gli uomini, un esercito di milizia da circa CHF 7.5bn (circa l'1.0% del PIL nel 2025) e un acquisto previsto di circa 30 F-35A; la cooperazione con la NATO in tempo di pace resta legale dopo il voto sulla neutralità.
- hash: c0e593ac
  it: |
    Democrazia diretta: ogni svolta importante (pacchetto con l'EU, neutralità, finanziamento dell'esercito tramite IVA) può essere fermata alle urne. L'iniziativa dell'SVP sul tetto alla popolazione è stata bocciata a giugno 2026 e quella sulla neutralità il 27 set 2026, ma l'SVP ora si rivolge al pacchetto con l'EU, con una decisione parlamentare finale non prima del 2027.
- hash: 8d7a2d32
  it: |
    Dipendenza dagli Stati Uniti e dall'EU per mercati ed equipaggiamenti: i dazi statunitensi si sono abbattuti sulla Svizzera nel suo complesso (39% dal 1° ago 2025, ridotto a un quadro del 15% nel nov 2025, poi sconvolto dalla sentenza IEEPA della Corte Suprema del 20 feb 2026), la consegna dei Patriot è ritardata di quattro-cinque anni e l'ordine di F-35 si sta riducendo.
- hash: dc71184a
  it: |
    Dopo Credit Suisse, la piazza finanziaria è un'esposizione di sicurezza nazionale: la Camera alta il 23 set 2026 ha approvato una norma che obbliga UBS a sostenere le proprie filiali estere con capitale CET1 nazionale al 90% (circa USD 16bn in più, secondo la banca centrale), contro le pressioni di UBS per un importo minore; una decisione definitiva non è attesa prima della fine del 2026.
- hash: 2edb2926
  it: |
    La neutralità dovrebbe proteggere l'autonomia svizzera, ma un esercito neutrale armato con sistemi americani rende Berna ostaggio della produzione e della politica di Washington: il congelamento dei pagamenti per i Patriot e il taglio degli F-35 ne sono il prezzo, e nel marzo 2026 il Consiglio federale ha dovuto invocare la neutralità per bloccare le licenze di esportazione di armi proprio verso il fornitore da cui dipende.
- hash: 766ec5ff
  it: |
    La via bilaterale esiste per evitare l'adesione all'EU, eppure i Bilaterali III trascinano la Svizzera nell'adozione dinamica del diritto dell'EU, cioè proprio la perdita di sovranità contro cui fa campagna l'SVP: uno strumento che salva la sovranità e fornisce all'opposizione il suo argomento migliore.
- hash: d568ff24
  it: |
    La Svizzera tiene la propria posizione rendendosi utile a tutti: sede, potenza protettrice e centro finanziario per l'Occidente, partner dell'intesa tariffaria per Washington, partner di libero scambio per Pechino. I voti del 2026 (tetto alla popolazione e neutralità entrambi respinti, pacchetto con l'EU in avanzamento) mostrano un'opinione pubblica che vuole conservare sia l'accesso al mercato sia l'etichetta di paese neutrale, ed è per questo che Berna si allinea alle sanzioni dell'EU insistendo di non essere allineata. Le prove non ancora risolte sono il referendum sul pacchetto con l'EU, il regime dei dazi statunitensi e la dipendenza da Patriot e F-35.
- hash: 270bde92
  it: |
    Fare di rame e litio la base dell'economia e una leva con Washington e con Pechino. Kast sostiene che il Cile deve offrire certezza giuridica e garanzie ai grandi investitori esteri, e che il rischio maggiore è il basso livello di investimenti; rifiuta di scegliere tra Stati Uniti e Cina, definendo molto importante il commercio con la Cina e storico e strategico il rapporto con gli Stati Uniti. Una dichiarazione regionale sui minerali con Argentina, Bolivia e Perù (Santiago, 28 agosto 2026) mira a rame e litio insieme.
- hash: 39cb3570
  it: |
    Chiudere il confine settentrionale alla migrazione irregolare ed effettuare espulsioni, prima agenda di governo di Kast. Gli ingressi alla frontiera sono calati del 93.5% tra gennaio e agosto 2026 rispetto agli stessi mesi del 2025 (286 contro 4,393, dati del governo riportati), e i voli di espulsione sono iniziati nell'aprile 2026. Il piano Border Shield promette una forza da 3,000 uomini, muri, torri, droni e trincee.
- hash: cf969913
  it: |
    Mantenere il litio dell'Atacama dentro una partnership guidata dallo Stato, aprendolo però al capitale privato. La joint venture Codelco-SQM NovaAndino Litio, chiusa il 27 dicembre 2025, dà a Codelco il 50% più una quota, lascia a SQM la gestione fino al 2031 e assicura la produzione nel salar fino al 2060; Kast, da presidente eletto, aveva contestato l'assenza di una nuova gara, e il governo entrante ha visto nel nuovo quadro un modo per attrarre investimenti privati e accelerare le autorizzazioni. La partnership ha trasferito allo Stato più di USD 530m nel primo trimestre del 2026. Il progetto successivo, Salar Futuro, è valutato dalla stampa tra USD 2-3.5bn e 280,000-300,000 t di litio equivalente in carbonato all'anno prima del 2030 (stime).
- hash: e9788e86
  it: |
    Ottenere esenzioni dalla sovrattassa statunitense del 12.5% senza modificare l'accordo di libero scambio del 2004. Nel luglio 2026 gli Stati Uniti hanno confermato, a seguito di un'indagine ai sensi della Section 301 sul lavoro forzato, una sovrattassa del 12.5% per il Cile e per altre circa 59 economie (Argentina ed El Salvador hanno ottenuto il 10%); rame e litio ne sono rimasti fuori, e il ministero degli Esteri stima la quota esposta delle esportazioni cilene verso gli Stati Uniti in circa il 40% (salmone, uva, vino, legname, pollame). Le due condizioni di Washington per revocarla sono norme sulle importazioni da paesi terzi privi di controlli sul lavoro forzato, lette come rivolte alla Cina, e un accordo scritto che fissi il 10% su alcuni prodotti, il che modificherebbe l'accordo di libero scambio; Santiago ha definito la seconda inaccettabile. Il primo round negoziale con il vice rappresentante commerciale Jeffrey Goettman si è tenuto il 24-25 agosto 2026; non è stato trovato alcun round successivo.
