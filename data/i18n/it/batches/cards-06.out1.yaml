  it: |
    Dissuadere e costringere il Pakistan a smettere di sostenere il terrorismo attraverso una «nuova normalità» dichiarata: un attacco grave è un atto di guerra, nessuna distinzione tra terroristi e sostenitori, nessuna mediazione, il trattato sulle acque dell'Indo sospeso, il tutto mantenendo il cessate il fuoco e il canale DGMO.
- hash: 7d312082
  it: |
    Gestire la Cina senza una seconda guerra: mantenere la Linea di controllo effettivo (LAC), normalizzare commercio e voli dopo l'accordo sui pattugliamenti dell'ottobre 2024 e la visita di Xi del settembre 2026, e ridurre il deficit strutturale (112 miliardi di dollari) e il nesso militare Cina-Pakistan che rende il confine un problema su due fronti.
- hash: e65a93de
  it: |
    Sicurezza energetica ed economica per una crescita del 6-7%: greggio importato (circa 80-88%) dalla fonte più economica (petrolio russo ai volumi record del luglio 2026), più accordi commerciali con il Regno Unito (in vigore da luglio 2026), l'UE (conclusi nel gennaio 2026), gli USA (quadro di febbraio 2026, non firmato), Australia e Canada, così che nessun mercato singolo possa imporre all'India di conformarsi con i dazi.
