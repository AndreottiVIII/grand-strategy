    Primato nell'Asia meridionale e nell'Oceano Indiano: mantenere Bhutan, Maldive e Sri Lanka nell'orbita di credito e sicurezza dell'India, contenere le penetrazioni cinesi e gestire Bangladesh, Nepal e Myanmar attraverso una marina che ora scorta le petroliere a Hormuz (Operazione Urja Suraksha) ed esportazioni di armi come il BrahMos verso il Sud-est asiatico.
