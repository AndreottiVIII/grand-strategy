  it: |
    Autonomia strategica come obiettivo principale: tenere ogni grande potenza bisognosa dell'India e nessuna in grado di possederla («multi-allineamento»), così che l'India possa diventare una potenza di primo piano entro il 2047 senza entrare in un blocco. Il bilancio 2024-26 è la prova: USA, Russia, Cina, UE e Golfo sono corteggiati tutti insieme.
