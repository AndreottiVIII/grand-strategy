items:
- hash: edde69a7
  it: |
    Ridurre la dipendenza dall'energia russa entro il 2035 senza interrompere le forniture: nessuno stacco brusco né sul greggio della Druzhba (93% delle importazioni di greggio nel 2025) né sul contratto gas con Gazprom (circa tre quarti delle importazioni di gas), ma una revisione di Paks II (Rosatom, prestito statale russo da 10 miliardi di euro, costo che si dice sia raddoppiato da 12 a 24 miliardi di euro) e la diversificazione attraverso Adria/JANAF, Azerbaigian e GNL statunitense.
- hash: 25a8c718
  it: |
    Ricollocare l'Ungheria nella NATO e nell'Europa centrale dopo gli anni di Orban: spesa per la difesa al 5% del PIL entro il 2035 (l'Ungheria è stata l'unico membro della NATO a ridurre la spesa reale per la difesa nel 2024-25), il gruppo di Visegrad rilanciato a Godollo il 23 giugno 2026, Varsavia come prima tappa all'estero, la Russia indicata come sfida alla sicurezza, dieci diplomatici russi espulsi l'8 settembre 2026.
- hash: 089c338c
  it: |
    Usare le minoranze ungheresi all'estero (circa 100.000 in Transcarpazia, oltre a Slovacchia, Romania e Vojvodina) come leva permanente della politica estera ungherese, ora entro le regole dell'UE anziché contro di esse: l'accordo sulle minoranze del giugno 2026 con Kiev ha ottenuto la revoca del veto sui cluster 2 e 3 dell'Ucraina (7 ottobre) in cambio di una legge sull'istruzione delle minoranze; i decreti Beneš sono il prezzo che Magyar ha posto per i colloqui con Fico.
- hash: d9a1aa0a
  it: |
    Mantenere in vita il modello delle esportazioni: la Germania assorbe circa un quarto dell'export, gli stabilimenti di auto e batterie funzionano con capitali cinesi (CATL Debrecen, 7,34 miliardi di euro; BYD Szeged) – ma sottoponendo quel capitale a regole ambientali, del lavoro e di trasparenza di standard UE, anziché espellendolo.
- hash: a2cd0f1a
  it: |
    Fare di MOL e MVM gli strumenti di una politica energetica regionale e balcanica: l'acquisto da Gazprom Neft del 56,15% di NIS in Serbia, il 49% di INA in Croazia, il greggio JANAF, il gas azero e una linea favorevole all'allargamento per i Balcani occidentali (Montenegro nell'UE entro il 2028).
- hash: 22b20415
  it: |
    Ripartire la diplomazia all'interno dell'UE: prima Varsavia (19-20 maggio 2026), il vertice V4 a Godollo, l'obiettivo dichiarato di comporre le controversie con i partner difendendo gli interessi ungheresi (ministra degli Esteri Anita Orban, nominata il 12 maggio), l'annullamento da parte del parlamento, il 27 maggio (133-37), del ritiro dalla CPI deciso all'epoca di Orban, e veti condizionati anziché generalizzati: i cluster ucraini sono stati aperti in cambio di una legge sulle minoranze, non bloccati in modo assoluto.
- hash: 368c8205
  it: |
    Nominare ed esporre: la Russia definita sfida alla sicurezza e aggressore (vertice NATO, Ankara, luglio 2026), la pubblicazione di una revisione dei contratti dell'era Orban (Paks II, gli accordi con BYD e CATL), l'espulsione di dieci diplomatici russi annunciata l'8 settembre 2026; sul fronte liberale l'eredità dell'era Soros viene regolata con discrezione: la CEU resta a Vienna e Budapest ottiene un'unità di ricerca approvata il 28 aprile 2026.
- hash: e2306fab
  it: |
    Un bilancio della difesa avviato verso il 5% del PIL entro il 2035; nessuna arma né aiuto militare all'Ucraina (solo aiuti umanitari); 410 militari in KFOR; un ministro della Difesa che ricuce i rapporti con la Finlandia e pone fine alla cooperazione con i servizi segreti russi.
- hash: 8520b14d
  it: |
    Società e crediti legati allo Stato: MOL (NIS, INA, contratto JANAF), MVM (quote in Shah Deniz e South Caucasus Pipeline, contratto di fornitura con SOCAR), prestiti di Eximbank (1 miliardo di euro alla Macedonia del Nord, 45 miliardi di fiorini (HUF) alla Repubblica Srpska), con il prestito alla Macedonia del Nord ora oggetto di un'indagine penale aperta il 1° settembre 2026 mentre la rete di Orban viene smantellata; traguardi dello Stato di diritto dell'UE scambiati con fondi di coesione; GNL statunitense e combustibile Westinghouse come prezzo della deroga del 2025.
- hash: b6e51187
  it: |
    Il vincolo energetico: il 93% del greggio dalla Russia nel 2025 (61% nel 2021), circa tre quarti del gas, un contratto quindicennale con Gazprom per fino a 4,5 miliardi di metri cubi (bcm) all'anno (2021), e Paks II costruita da Rosatom con un prestito russo. I flussi della Druzhba sono ripartiti il 23 aprile 2026 dopo tre mesi, ancora sotto i 200.000-235.000 barili al giorno di prima; Magyar afferma che l'esposizione «resterà ancora per un po'». La deroga statunitense su petrolio e gas russi scade il 21 novembre 2026 e Budapest chiede una proroga.
- hash: 202d7908
  it: |
    La condizionalità UE è il vero vincolo di bilancio: 6,3 miliardi di euro di fondi di coesione sospesi dal 2022, l'annullamento da parte della CGUE dell'approvazione da parte della Commissione degli aiuti di Stato a Paks II (11 settembre 2025), l'articolo 7 ancora sul tavolo del Consiglio, e 3,5 miliardi di euro più i fondi per la ripresa che dipendono ancora dai dossier su tutela dei minori, libertà accademica e asilo, in contrasto con la legislazione dell'era Fidesz e, sulla migrazione, con le promesse dello stesso Tisza.
- hash: 7b4f0361
  it: |
    Il deficit di fiducia: sedici anni di veti (adesione dell'Ucraina, il ventesimo pacchetto di sanzioni, Georgia, dichiarazioni sulla Bielorussia, la ratifica finlandese dell'adesione alla NATO) fanno sì che i partner scontino le promesse; il taglio reale alla difesa del 2024-25 e un bilancio favorevole a Mosca fanno di Budapest un postulante della buona volontà di NATO e UE.
- hash: 3578c6d8
  it: |
    Obblighi ereditati dagli anni di Orban che non possono essere stracciati a basso costo: il contratto Paks II con Rosatom (secondo quanto riferito, la risoluzione costerebbe a Rosatom circa 15 miliardi di dollari, da cui la leva da entrambe le parti), lo stabilimento di celle di CATL da 7,34 miliardi di euro e lo stabilimento BYD con il sostegno pubblico promesso e fino a 10.000 lavoratori cinesi, e una deroga statunitense legata a 600 milioni di dollari di GNL americano.
- hash: e2616a87
  it: |
    Washington non è più un patrono: Trump ha lodato Magyar come «un brav'uomo», ma Vance ha fatto campagna per Orban fino alla fine; non è stato segnalato alcun invito alla Casa Bianca; un giornale vicino a Fidesz riferisce di una stretta di mano mancata al vertice NATO di Ankara (luglio 2026); la deroga sulle sanzioni è l'unica leva che gli Stati Uniti hanno su Budapest.
- hash: 14ebf5da
  it: |
    Politica interna: una maggioranza dei due terzi (138 seggi su 199, 53%) dà a Magyar la libertà di cambiare le leggi, ma la sua promessa di un Paese «senza immigrazione», la recinzione di confine e una moratoria sui lavoratori ospiti si scontra con il patto UE sulla migrazione, che dovrebbe entrare in vigore il 12 giugno 2026; e Fidesz ora fa campagna contro Tisza dall'opposizione proprio su questo terreno.
- hash: c8523bd7
  it: |
    Rompere con i veti di Orban ripristina il peso internazionale dell'Ungheria e sblocca 17 miliardi di euro, ma consuma anche la leva che quei veti offrivano: una volta aperti i cluster ucraini, la leva sui diritti delle minoranze (l'unica cosa che Budapest avrebbe potuto scambiare) scompare, e i ripetuti blocchi dei cluster 2 e 3 da parte dello stesso Magyar tra luglio e settembre mostrano la tentazione di comportarsi come il suo predecessore, in forma ridotta.
- hash: d1f0cde9
  it: |
    Il piano per svincolare l'Ungheria dall'energia russa passa attraverso le società e i contratti che la rendono dipendente: rivedere Paks II attira la controspinta legale e politica di Rosatom e una decisione sugli aiuti di Stato annullati dalla Corte dell'UE; cancellarla lascerebbe al Paese un sito per un reattore senza costruttore; e la causa dell'Ungheria contro il divieto UE sul gas russo (presentata il 2 febbraio 2026) non risulta ritirata da nessuna delle fonti consultate.
- hash: e5d64fc7
  it: |
    L'Apertura a Oriente è ora sottoposta a verifica proprio dall'Occidente, contro il quale doveva fare da copertura: Orban ha fatto dell'Ungheria la principale destinazione europea dei capitali cinesi per veicoli elettrici e batterie (partenariato «per ogni stagione», maggio 2024), e la pressione del governo Magyar su CATL e BYD per motivi ambientali e di lavoro tutela il rapporto con l'UE a rischio di investimenti, posti di lavoro e della buona disposizione cinese su cui oggi poggiano le cifre dell'export.
- hash: 1f3a5155
  it: |
    Una politica estera dei «diritti ungheresi» all'estero ha ora bisogno dei vicini che ha inimicato: chiedere alla Slovacchia di abrogare la clausola penale dei decreti Beneš mentre si ha bisogno di Fico nel V4 e per la Druzhba, e chiedere a Kiev garanzie sull'istruzione delle minoranze pur promettendo nessuna arma, pone Budapest nella posizione di chiedere ai partner ciò che non può scambiare.
- hash: 0cdb4845
  it: |
    Ripristinare la CPI invitando Netanyahu: Magyar ha annullato il ritiro avviato da Orban dopo la visita di Netanyahu dell'aprile 2025, ha invitato lo stesso Netanyahu per l'anniversario del 1956 del 23 ottobre 2026 e ha dichiarato che, se fosse venuto, sarebbe stato arrestato. L'invito preserva il rapporto con Israele e l'impegno all'arresto preserva la CPI, ma le due cose non possono reggere insieme allo stesso confine.
- hash: ea8de19e
  it: |
    MOL, campione dei Balcani, è ostaggio degli asset russi che acquista: l'accordo NIS dipende dalle licenze OFAC (fino al 30 ottobre 2026) e da Belgrado, la quota in INA è un nervo politico scoperto con la Croazia, e la controversia JANAF mostra MOL che chiede a uno Stato membro dell'UE di trasportare greggio russo che Bruxelles vuole eliminare; più l'Ungheria investe nella mappa energetica balcanica, più la sua posizione dipende dal regime di sanzioni di Washington.
- hash: '94043750'
  it: |
    L'Ungheria è uno Stato di medie dimensioni la cui grand strategy, per sedici anni, è stata estrarre rendite da ogni patrono contemporaneamente (gas russo e un reattore Rosatom, fabbriche cinesi, accordi con i Paesi del Golfo e con l'Azerbaigian, la benevolenza di un presidente americano), usando il veto UE come moneta di scambio di quella trattativa. Le elezioni dell'aprile 2026 hanno sostituito quel modello con il suo opposto, e la transizione è la vera storia di questa scheda: l'Ungheria di Magyar vuole essere un membro normale della NATO e dell'UE (denaro, fiducia, un V4 che torni a parlare con la Polonia), ma eredita ogni dipendenza costruita dal vecchio modello. Ciò che è cambiato sono il tono, le persone e una dozzina di decisioni già prese: il ritiro dalla CPI annullato, diplomatici russi espulsi, il veto sui cluster ucraini revocato, fondi sbloccati, impianti cinesi ispezionati. Ciò che non è cambiato è la struttura sottostante: il greggio e il gas russi continuano ad arrivare, Paks II è sotto revisione ma non cancellata, il partenariato con la Serbia e l'accordo NIS di MOL sopravvivono al cambio di governo, Fico resta il principale alleato dell'Ungheria nella regione, la recinzione di confine rimane, e le vecchie ferite aperte delle minoranze vengono gestite solo in modo diverso. La logica di Luttwak colpisce con più forza il nuovo governo: ogni concessione a Bruxelles consuma una leva, ogni verifica di un accordo dell'era Orban rischia il partner che tiene accese le luci. I prossimi banchi di prova hanno date precise: il voto del Consiglio sui fondi (13 ottobre), la deroga statunitense (21 novembre), OFAC e NIS (30 ottobre), e se Netanyahu atterrerà a Budapest il 23 ottobre.
- hash: 8ad6d5bd
  it: |
    Autonomia strategica attraverso l'appartenenza a tutto: mantenere la dottrina «libera e attiva» (bebas-aktif) ma esercitarla come impegno simultaneo con potenze rivali. Membro effettivo dei BRICS dal 6 gennaio 2025, accordo commerciale con gli Stati Uniti (19 febbraio 2026) e Major Defense Cooperation Partnership con gli USA (13 aprile 2026), accordo petrolifero russo (13 aprile 2026), trattato di sicurezza con l'Australia (6 febbraio 2026): senza alcun blocco militare.
- hash: '03101075'
  it: |
    Finanziare un programma interno con capitali esteri e accesso ai mercati: il programma di pasti gratuiti (circa 62 milioni di beneficiari entro aprile 2026), la lavorazione a valle (downstreaming) e il fondo sovrano Danantara hanno bisogno di mercati di esportazione e investitori, da cui gli accordi commerciali con Stati Uniti e UE, i patti di investimento cinesi e le domande di adesione all'OCSE (tabella di marcia per l'adesione dal 2024) e al CPTPP (colloqui preparatori dal 26 giugno 2026, obiettivo 2027).
- hash: ce5ca425
  it: |
    Difendere le acque dell'arcipelago e il margine orientale: respingere la linea a nove tratti evitando una rottura con Pechino (Natuna), definire i confini con i vicini (trattato sulla ZEE con il Vietnam, sviluppo congiunto del blocco di Ambalat con la Malaysia) e tenere la Papua fuori da qualsiasi agenda esterna.
- hash: 1df3de7b
  it: |
    Ricostruire le forze armate acquistando da tutti i fornitori insieme: 42 Rafale (2022), 48 KAAN concordati con la Turchia (luglio 2025), 42 J-10 cinesi annunciati (ottobre 2025, non confermati), BrahMos dall'India, KF-21 dalla Corea del Sud, fregate giapponesi in discussione: la diversità degli armamenti come forma materiale della copertura.
- hash: 24c97fb6
  it: |
    Peso morale nel mondo musulmano e nel Sud globale: una soluzione a due Stati alle Nazioni Unite (23 settembre 2025), una disponibilità condizionata a riconoscere Israele una volta che Israele riconosca la Palestina, un'offerta di truppe per una forza di stabilizzazione a Gaza (fino a 8.000 promessi il 19 febbraio 2026, poi sospesi) e un'offerta di mediazione nella guerra con l'Iran.
- hash: 6aa0bdd2
  it: |
    Trasformare la base di risorse in leva e sicurezza energetica: il divieto di esportazione del minerale di nichel (2020) e le quote sul minerale per imporre la lavorazione in patria; petrolio e GPL da chiunque venda (Russia: 150 milioni di barili concordati in linea di principio nell'aprile 2026), perché da un quinto a un quarto delle importazioni di greggio transita per Hormuz.
- hash: a1c2e9a7
  it: |
    Diplomazia personale e presidenziale: Prabowo ha incontrato Putin (Mosca, 13 aprile 2026), ha firmato a Washington l'accordo commerciale con Trump (19 febbraio 2026), ha firmato a Giacarta il trattato con l'Australia (6 febbraio 2026) e riceve a turno gli inviati di Xi, Modi e Macron; gli analisti lo confrontano con il ricorso di Jokowi al proprio ministro degli Esteri. Le appartenenze si sommano: ASEAN, G20, OIC, BRICS (6 gennaio 2025), il Board of Peace (febbraio 2026), e le domande di adesione all'OCSE e al CPTPP.
- hash: ab0fdda2
  it: |
    L'ASEAN come strumento dell'ordine regionale: Prabowo ha firmato la dichiarazione di adesione di Timor-Leste (26 ottobre 2025, il primo allargamento in 25 anni) e Giacarta usa l'associazione per inquadrare ogni accordo bilaterale come regionale, mentre le Filippine detengono la presidenza 2026 e spingono per un codice sul Mar Cinese Meridionale.
- hash: cbaff258
  it: |
    Una narrativa di «amico di tutti» e di sostegno di principio alla causa palestinese: il discorso alle Nazioni Unite del 23 settembre 2025 (offerta di riconoscere Israele solo dopo la statualità palestinese, forze di pace sotto mandato ONU), la linea ricorrente del ministero degli Esteri secondo cui la politica «libera e attiva» resta intatta dopo ogni accordo occidentale o russo (per esempio dopo il partenariato per la difesa con gli USA), e la smentita di una base russa in Papua.
- hash: b8c8c464
  it: |
    Esercitazioni con tutte le parti e un ruolo più ampio per le forze armate: Super Garuda Shield 2026 (31 agosto - 11 settembre, 4.743 effettivi di 21 Paesi secondo Giacarta), l'accordo di difesa del 2024 e il trattato del 2026 con l'Australia, l'accordo di difesa con la Papua Nuova Guinea ratificato nel 2024; in patria la legge TNI del marzo 2025 consente a ufficiali in servizio di ricoprire incarichi in più organismi civili, e i soldati lavorano al programma di pasti gratuiti.
- hash: 05e5a3a2
  it: |
    Accesso ai mercati scambiato con impegni di acquisto (USA: dazio del 19%, dazi zero sul 99% dei beni statunitensi, 11 accordi con aziende per 38,4 miliardi di dollari; CEPA con l'UE conclusa con un protocollo sull'olio di palma), più nazionalismo delle risorse: il divieto di esportazione del minerale di nichel e il taglio delle quote 2026 a 260-270 milioni di tonnellate umide, Danantara come veicolo statale di investimento (memorandum d'intesa con China Investment Corporation, maggio 2025).
- hash: cb827d5e
  it: |
    Limite di bilancio: il tetto legale del 3% sul deficit è sotto pressione per i prezzi del petrolio, mentre il programma di pasti gratuiti (268 trilioni di rupie di base più 67 trilioni di rupie aggiuntivi nel 2026, speso solo il 22% a fine aprile) viene tagliato e ritagliato; non restano fondi per tutti gli armamenti ordinati né per la capitale.
- hash: 1947462a
  it: |
    Energia: l'Indonesia è importatrice netta di energia; il 20-25% delle importazioni di greggio proviene dal Medio Oriente attraverso Hormuz, che la guerra con l'Iran ha di fatto chiuso: la ragione del viaggio a Mosca. L'analisi del Lowy definisce l'autonomia «più sottile di quanto appaia».
- hash: 93d4fc72
  it: |
    La Cina è troppo grande per essere rifiutata: interscambio bilaterale di 167,4 miliardi di dollari nel 2025 (dogane cinesi), la Cina prima destinazione dell'export (23,8% delle esportazioni, gennaio-novembre 2025), costruttrice delle fonderie di nichel e della linea ad alta velocità Giacarta-Bandung, il cui debito è stato ristrutturato su 80 anni nell'agosto 2026.
- hash: e97e4f91
  it: |
    Legittimità interna: le rivolte dell'agosto 2025 (l'indennità abitativa dei parlamentari, un motociclista ucciso da un mezzo della polizia il 28 agosto, il parlamento regionale incendiato a Makassar) sono state alimentate dal ruolo civile sempre più ampio dei militari, e il Consiglio degli ulema indonesiani ha chiesto l'uscita dal Board of Peace (1° marzo 2026): la piazza limita quanto Prabowo può pendere verso Washington o verso Israele.
- hash: ecbdb626
  it: |
    Nusantara, la capitale, come vincolo incompiuto: il bilancio dell'autorità è sceso da 43,4 trilioni di rupie (2024) a 6,3 trilioni (2026), solo 800 dei 6.600 ettari dell'area centrale sono stati sviluppati, e la data del trasferimento slitta al 2028. Giacarta resta la sede di ogni decisione.
- hash: af122e36
  it: |
    L'arcipelago in sé: migliaia di isole e gli stretti di Malacca, Sunda e Lombok ne fanno la rotta marittima di tutti e danno alla marina e alla guardia costiera troppe acque da sorvegliare; la guardia costiera cinese entra nella ZEE delle Natuna settentrionali e Giacarta risponde con pattugliamenti e dichiarazioni, non con la forza.
- hash: cee3e438
  it: |
    Entrare nei BRICS per guadagnare margine di manovra contro Washington è costato margine di manovra presso Washington. L'ammissione del 6 gennaio 2025 ha portato la minaccia di Trump di un dazio aggiuntivo per i BRICS (il Jakarta Post ha conteggiato un possibile totale del 52%); dopo di che Giacarta ha pagato il ritorno con un mercato esente da dazi per il 99% dei beni statunitensi, una penalità sul transito di merci cinesi, l'accettazione degli standard statunitensi per veicoli e farmaci e impegni d'acquisto (15 miliardi di dollari di energia, 50 Boeing, nel luglio 2025).
- hash: e892e45d
  it: |
    Offrire alla Cina uno «sviluppo congiunto» per evitare uno scontro nelle Natuna ha legittimato la pretesa che avrebbe dovuto attenuare. La dichiarazione congiunta del 9 novembre 2024 parlava di «rivendicazioni sovrapposte», un'espressione che Giacarta non ha mai accettato; il parlamento ha costretto il ministro degli Esteri a smentire il riconoscimento della linea a nove tratti il 3 dicembre 2024, e la formula indebolisce l'argomento UNCLOS che è l'unico scudo giuridico dell'Indonesia.
- hash: 5fb3c606
  it: |
    Il divieto sul nichel ha costruito un'industria di proprietà cinese, non indonesiana. Imporre la lavorazione in patria ha attirato capitali cinesi a Morowali; quando Giacarta ha poi ridotto le quote di minerale (Weda Bay, secondo quanto riferito, da 42 a 12 milioni di tonnellate), la camera di commercio cinese ha scritto una lettera aperta a Prabowo (maggio 2026). La leva sui minatori è reale, ma lo è anche la dipendenza dai proprietari delle fonderie, e un eccesso di prodotto semilavorato.
- hash: 6290879b
  it: |
    Armarsi presso tutti non compra alcun deterrente. Rafale, KAAN, J-10, KF-21, BrahMos e scafi giapponesi non possono essere pagati tutti con un tetto del deficit al 3% (Giacarta ha ridotto la sua quota del KF-21 da 1,7 trilioni di won a 600 miliardi di won), non possono essere fatti funzionare insieme, e ogni fornitore diventa una leva; intanto ogni acquisto occidentale è accompagnato da un contrappeso cinese o russo, e la copertura si trasforma in incoerenza agli occhi dei fornitori.
- hash: 5ec283fb
  it: |
    Un'offerta di forze di pace per guadagnarsi credito a Washington e nel mondo musulmano è finita senza soddisfare nessuno dei due. Prabowo è passato da 20.000 soldati (ONU, settembre 2025) a fino a 8.000 (Board of Peace, 19 febbraio 2026) con un posto da vice comandante, poi ha congelato lo schieramento il 17 marzo 2026, dopo la guerra USA-Israele contro l'Iran, sotto la pressione del Consiglio degli ulema; Giacarta resta in un board le cui condizioni (Hamas non disarmato, consenso dei palestinesi e degli Stati musulmani) rendono impossibile lo schieramento.
- hash: b80761fc
  it: |
    Il militare nel ministero indebolisce la democrazia che è il passaporto dell'Indonesia. La legge TNI del marzo 2025 e la legge sulla polizia consentono a ufficiali di ricoprire incarichi civili, i soldati gestiscono le cucine del programma di pasti gratuiti, e le proteste dell'agosto 2025 hanno indicato tra le cause questa espansione del «dwifungsi»: l'instabilità e la memoria del Nuovo Ordine sono ciò che investitori e partner occidentali leggono quando valutano il Paese.
- hash: 008ce68d
  it: |
    L'Indonesia di Prabowo è il caso da manuale di chi sceglie di coprirsi su vasta scala: non ha lasciato la linea «libera e attiva», l'ha resa abbastanza ampia da contenere allo stesso tempo un seggio nei BRICS, un partenariato per la difesa con gli USA, un contratto petrolifero russo, un trattato di sicurezza con l'Australia e aerei cinesi. Nei termini di Luttwak è manovra relazionale anziché alleanza: nessuna frattura viene sfruttata, perché Giacarta siede su tutte, e lo scopo è rendersi troppo utile per essere spinta da una parte o dall'altra. Il metodo funziona finché le grandi potenze sono in una competizione di bassa intensità e i conti scadono in valute diverse; l'analisi del Lowy ne data il limite all'aprile 2026, quando la guerra con l'Iran ha chiuso Hormuz e ha fatto decidere la settimana all'energia, non alla dottrina.

    I paradossi sono il prezzo dell'appartenenza ovunque. Ogni club costa credito in un altro: i BRICS hanno comportato una minaccia di dazi a Washington, la formula delle Natuna è costata il caso giuridico contro Pechino, il Board of Peace è costato la piazza in patria, il divieto sul nichel è costato leva sulle proprie fonderie. I limiti materiali sono più antichi di Prabowo: un tetto del deficit al 3% che non regge i pasti gratuiti, una capitale e un arsenale insieme; un importatore netto di energia; una marina per un arcipelago di migliaia di isole. L'arcipelago è la forza dell'Indonesia (tutti hanno bisogno dei suoi stretti) e la sua debolezza (nessuno può essere tenuto fuori da essi).

    Le graduatorie qui seguono la struttura, non la cortesia. Quasi ogni relazione con una grande potenza è di partner, perché l'Indonesia tratta tutte come acquistabili, e i legami dicono quanto valgono i partenariati: Arabia Saudita, Palestina e Malaysia sono di parentela, Turchia e Papua Nuova Guinea di affinità, gli altri comprati. Se questa sia strategia o deriva è la questione aperta nella letteratura; questa scheda registra la struttura (bassa fiducia sull'andamento dopo l'aprile 2026, poiché lo schieramento a Gaza, la richiesta di sorvolo e il contratto dei J-10 restano irrisolti al 12 ottobre 2026).
