items:
- hash: c4392da1
  it: |
    Corteggiare il patrono che fa da mediatore con il nemico. Le carte migliori di Kiev con Washington (minerali, droni, una linea di produzione Patriot) vanno a una Casa Bianca che nel febbraio 2026 si è astenuta sull'integrità territoriale e ha lasciato che la guerra con l'Iran congelasse i colloqui; più l'Ucraina diventa utile agli Stati Uniti, più Washington può proporre un accordo che soddisfi i propri interessi. La stessa licenza Patriot che libera Kiev da PURL la lega anche più strettamente alla tecnologia statunitense.
- hash: ea6a3e24
  it: |
    Un prestito rimborsato solo se la Russia paga trasforma i creditori in parti interessate nei termini di pace. L'Ucraina inizia a rimborsare EUR 90bn solo dopo che la Russia avrà pagato le riparazioni, mentre nel frattempo gli attivi statali russi restano congelati; la garanzia che rende possibile il prestito fa anche sì che qualsiasi accordo che salti le riparazioni sia un problema per Bruxelles, non solo per Kiev.
- hash: 4efe0259
  it: |
    L'Ucraina conduce una grand strategy della parte più debole, che deve rendersi indispensabile a quelle più forti: non può vincere la guerra in modo netto, non può permettersi di perderla, e deve tenere a bada tre patroni (l'EU, la coalizione guidata dal Regno Unito, gli Stati Uniti) mentre negozia con un avversario il cui prezzo è la sua statualità. A livello tattico tiene (il fronte procede lentamente nel 2026, droni e attacchi in profondità compensano la mancanza di uomini); a livello di teatro scambia minerali, droni e la promessa di un Paese ricostruito con denaro e garanzie; a livello di grand strategy scommette che la strada verso l'EU le offra un'ancora che nessun cessate il fuoco potrà cancellare. L'inversione di Luttwak è ovunque: la stessa logica che tiene impegnati i patroni (utilità, forza visibile, attacchi in profondità, una storia nazionale raccontata in battaglia) irrita i vicini, i cui veti decidono l'ancora, dalla pipeline di Fico alla storia di Varsavia. Il 2026 è anche l'anno in cui il centro della questione si è spostato dal fronte al tavolo: i colloqui si sono aperti ad Abu Dhabi a gennaio, sono stati congelati dalla guerra con l'Iran a marzo e sono ripresi con il round di Miami del 9-10 ottobre, mentre il Cremlino continua a chiedere il Donbas. Due segnali che non sono righe: il passaggio del nuovo governo ungherese dal veto alle condizioni (Magyar, da maggio) e la discreta ridefinizione dell'Ucraina, nel vertice di Ankara, come contributore alla sicurezza euro-atlantica. Domanda aperta per la prossima revisione: se il European Council del 15 ottobre e l'esito di Miami trasformeranno la garanzia da un testo in una forza.
- hash: 5dfacae9
  it: |
    Tenere sulla rotta il partenariato EU-Mercosur: l'Uruguay lo ha ratificato il 26 febbraio 2026, e la parte commerciale provvisoria si applica in via provvisoria dal 1 maggio 2026, con Argentina e Uruguay come membri che hanno ratificato. L'accordo è il mercato di cui Montevideo ha bisogno oltre la Cina, e quello che Brasile e Argentina condividono con l'Uruguay.
- hash: c1d16a92
  it: |
    Vendere carne bovina e altri beni alla Cina a condizioni migliori: nel 2023 il governo ha cercato un accordo bilaterale di libero scambio con Pechino, perché la carne bovina uruguaiana vi era soggetta a un dazio del 12% contro lo 0% per la Nuova Zelanda. La linea di Orsi sulla Cina non è stata letta in questa scheda; la spinta documentata viene dal governo Lacalle Pou, e la sua prosecuzione sotto Orsi è la nostra lettura (C).
- hash: a924ef95
  it: |
    Carne bovina, soia e cellulosa come base delle esportazioni. Nel 2021 l'Uruguay ha esportato un record di US$9.8 billion; la carne bovina ne era il 45%, cellulosa e legno il 13%, la soia il 12%, e la Cina ha assorbito US$2.7 billion (28%). Nel 2022 la Cina ha assorbito il 27% delle esportazioni uruguaiane, di cui due terzi carne bovina (UN Comtrade, come riportato da The Cattle Site).
- hash: 5f5bac8c
  it: |
    L'appartenenza al Mercosur come cornice di ogni mossa commerciale: l'Uruguay è membro a pieno titolo e spinge il blocco a consentire ai membri di negoziare accordi bilaterali, mentre l'accordo con l'EU è un guadagno comune del blocco. L'appartenenza è registrata dall'elenco dei membri del Mercosur (riga del dataset, livello 1).
- hash: 946c5e8a
  it: |
    Regole del Mercosur: i membri non possono negoziare accordi commerciali separati senza l'approvazione del blocco, quindi l'accordo di libero scambio con la Cina attende il blocco. Argentina, Brasile e Paraguay si sono opposti a un accordo Uruguay-Cina (vertice del 2022 senza dichiarazione congiunta; nel novembre 2023 hanno avvertito di misure contro l'Uruguay).
- hash: 1402eb4c
  it: |
    Concentrazione delle esportazioni: tre prodotti primari (carne bovina, cellulosa, soia) producono la maggior parte del reddito da esportazione, e il principale acquirente singolo, la Cina, applica alla carne bovina un dazio del 12% che Australia e Nuova Zelanda, grazie ai rispettivi accordi di libero scambio, non pagano per intero (3.3% e 0%).
- hash: 4d197e89
  it: |
    È il mercato cinese a spingere Montevideo contro il blocco, e i membri più grandi del blocco rispondono opponendosi all'accordo con la Cina, il che mette a rischio l'accordo con l'EU che il blocco ha ottenuto insieme e di cui l'Uruguay ha bisogno come secondo mercato.
- hash: 2d7411ed
  it: |
    L'Uruguay è un'economia piccola e aperta che vende carne bovina, cellulosa e soia soprattutto alla Cina, e dipende dal Mercosur per il quadro giuridico e per l'accordo con l'EU che il blocco ha firmato insieme. La sua strategia dal 2022 è stata spingere il blocco verso una maggiore flessibilità, così da poter firmare un proprio accordo con la Cina; Argentina, Brasile e Paraguay hanno risposto opponendosi. Questa scheda si basa su fonti di livello 3 e 4; la linea del governo Orsi su Cina e Stati Uniti non è stata letta, e la riga sul partner statunitense è una lacuna annotata nel JOURNAL.
- hash: 09f8e62b
  it: |
    Primato nell'emisfero occidentale: il «Trump Corollary» alla dottrina Monroe: negare a concorrenti extra-emisferici forze, porti e «strategically vital assets», controllare migrazione e cartelli con la forza letale, tenere il canale di Panama, la Groenlandia e il «Gulf of America» come terreno chiave, e «enlist» i governi allineati (lo Shield of the Americas, Doral, 7 mar 2026). La National Defense Strategy 2026 colloca la patria e l'emisfero sopra l'Indo-Pacifico; la cattura di Maduro del 3 gen 2026 è letta da Carnegie e CFR come la prima attuazione della dottrina.
- hash: 5d1be6d6
  it: |
    Riequilibrare il commercio e reindustrializzare a colpi di dazi: i dazi reciproci del «Liberation Day» (2 apr 2025), un tetto del 15% ottenuto dall'EU, dal Giappone, dalla Corea e da Taiwan con impegni di investimento (USD 550bn, 350bn, 250bn), e, dopo che la Supreme Court ha annullato i dazi IEEPA il 20 feb 2026, un regime ricostruito di dazi ai sensi delle Section 122, 232, 301 e 338 (l'ondata del 24 lug 2026 su decine di paesi; il 50% sui beni canadesi dal 22 ago 2026), con l'USMCA lasciato senza rinnovo il 1 lug 2026. La NSS indica come sicurezza economica «balanced trade», «reindustrialization» ed «energy dominance».
- hash: 8d4f16f8
  it: |
    Tenere la Cina come rivale «within bounds»: scoraggiare un conflitto su Taiwan con la negazione lungo la First Island Chain, mentre «the goal is not to dominate China» (NDS), mantenere l'embargo sui chip e le catene di approvvigionamento dei minerali critici, e acquistare una tregua gestita - Busan (30 ott 2025), Pechino (14-16 mag 2026), Xi a Washington (23-25 set 2026) - con tagli tariffari, acquisti di soia e il pacchetto di armi per Taiwan tenuto «in abeyance» come pedina di scambio.
- hash: 79913d59
  it: |
    Impedire che una potenza avversaria domini il Medio Oriente e i suoi punti di strozzatura «without forever wars»: il programma iraniano è stato degradato (Midnight Hammer, 22 giu 2025) e poi il regime è stato attaccato (Epic Fury, 28 feb 2026, Khamenei ucciso, un blocco navale dal 13 apr, il memorandum del 17 giu, attacchi ripresi l'8 lug), Hormuz e il Mar Rosso tenuti aperti, Israele al sicuro, gli Abraham Accords allargati (Kazakistan, nov 2025), il cessate il fuoco a Gaza del 9 ott 2025 gestito tramite un Board of Peace presieduto dal presidente.
- hash: 3e20b498
  it: |
    Porre fine rapidamente alla guerra in Ucraina e ristabilire la «strategic stability» con la Russia al di sopra della testa dell'Europa (Riad 18 feb 2025, Anchorage 15 ago 2025, il piano in 28 punti, i round trilaterali ad Abu Dhabi e a Ginevra, Miami 9-10 ott 2026), spostando la difesa convenzionale europea sugli europei: il 5% dell'Aia (25 giu 2025), «NATO 3.0», 5,000 soldati fuori dalla Germania e una revisione della postura per altri 25,000-40,000, nessun ulteriore allargamento della NATO.
- hash: c1b74c3f
  it: |
    «The era of mass migration is over»: sicurezza delle frontiere come «the primary element of national security», il divieto di ingresso del 4 giu 2025 per 12 paesi (altri 7 parzialmente), un tetto di 7,500 rifugiati per il 2026 riservato in prevalenza ai sudafricani bianchi, accordi di rimpatrio con El Salvador, Uganda, Eswatini, Ghana, Burundi e DRC, e migrazione netta negativa nel 2025 per la prima volta in cinquant'anni.
- hash: 5b831d03
  it: |
    La conclusione di accordi a livello presidenziale come strumento di «realignment through peace»: la NSS rivendica otto accordi di pace in otto mesi (tra cui Cambogia-Thailandia, DRC-Ruanda, Armenia-Azerbaigian, Gaza); il Board of Peace costituito a Davos il 22 gen 2026 con 19 stati fondatori; il tour nel Golfo di maggio 2025; il C5+1 alla Casa Bianca (6 nov 2025); inviati (Witkoff, Kushner, Boulos, Barrack) anziché il corpo diplomatico di carriera.
- hash: 2803edbc
  it: |
    Scaricare gli oneri sugli alleati, «with our government as convener»: l'impegno dell'Aia del 5% del GDP, i fondi di investimento di USD 550bn del Giappone e USD 350bn della Corea e USD 33bn per le forze statunitensi, gli impegni di USD 600bn e 1.4tn di Arabia Saudita ed Emirati, l'Europa che paga le armi statunitensi per l'Ucraina tramite PURL (USD 6.7bn in un anno), un NATO Force Model con un terzo di aerei statunitensi in meno, e la richiesta del Pentagono del 3.5% a Australia e Corea.
- hash: fa15e034
  it: |
    Il dazio come leva universale, per il commercio e per tutto il resto: 145% sulla Cina (apr 2025), 50% sul Brasile per una causa giudiziaria, 25% aggiuntivo sull'India per il petrolio russo, 10% su otto alleati per la Groenlandia, 35% poi 50% sul Canada; l'aliquota media effettiva del 12.1% (lug 2026) dopo la sentenza della Supreme Court, USD 166bn di dazi IEEPA da rimborsare, e «reciprocal trade agreements» (Giappone, Corea, EU, Indonesia, Taiwan, Thailandia) come risultato concreto.
- hash: 1afecf03
  it: |
    Sanzioni e loro revoca come moneta di scambio, e controlli sulle esportazioni come pedina negoziale: Rosneft e Lukoil inseriti nella lista (22 ott 2025), Petro e l'esercito ruandese designati, programma siriano concluso (30 giu 2025), Dodik, il potassio bielorusso e Justice de Moraes cancellati dalla lista; vendite di Nvidia H200 alla Cina consentite in cambio di una quota (8 dic 2025) e chip per l'IA verso gli UAE alleggeriti dopo la guerra con l'Iran; un accordo sul diesel russo dell'ott 2026 che il Senato definisce illegale.
- hash: 1b99d9ad
  it: |
    Forza letale sotto la soglia della guerra, e una sola guerra: 234 morti negli attacchi contro imbarcazioni nei Caraibi e nel Pacifico entro set 2026 (68 attacchi; un relatore UN li definisce possibili crimini contro l'umanità), il raid di Caracas del 3 gen 2026 con circa 150 velivoli, attacchi in Nigeria (25 dic 2025), Somalia, Ecuador e Yemen, e l'Operation Epic Fury contro l'Iran (USD 43.6bn entro set 2026); la Joint Task Force Western Hemisphere (6 ago 2026) fa dell'emisfero un teatro permanente.
- hash: 7b161821
  it: |
    Lo scambio di postura. Uscite: dall'Iraq (30 set 2026), dalle basi in Siria (apr 2026), dalla Nigeria (lug 2026) e 5,000 uomini dalla Germania, con il Force Model ridotto. Ingressi: in Groenlandia (due nuove Defence Areas, 22 set 2026), nelle ex basi di Panama (presenza a rotazione, MOU del 9 apr 2025), in Polonia (altri 5,000 promessi), nello stretto di Luzon e nelle Filippine (Typhon, NMESIS), e un Golden Dome per il territorio nazionale.
- hash: 4798d9b6
  it: |
    Una linea «civilisational» per l'Europa e un contenzioso sulla libertà di parola con Bruxelles: la NSS chiede all'Europa di «regain its civilizational self-confidence», saluta «patriotic European parties» e promette di opporsi alle restrizioni sul discorso pubblico «elite-driven»; Vance ha fatto campagna per Orban pochi giorni prima del voto di aprile 2026; il Justice Department ha sostenuto X contro la multa DSA dell'EU da EUR 120m, e Lutnick ha legato i dazi sull'acciaio alle regole digitali.
- hash: 2728b59e
  it: |
    Tribunali e Congress riducono le leve: la Supreme Court ha annullato i dazi IEEPA per 6-3 il 20 feb 2026 (USD 166bn da rimborsare, una misura provvisoria del 10% ai sensi della Section 122 scaduta il 24 lug), ha confermato la cittadinanza per nascita per 5-4 (30 giu 2026) e ha lasciato in piedi oltre 10,000 sentenze di tribunali di grado inferiore contro la detenzione da parte dell'ICE; il Senate ha votato 52-48 contro i dazi sul Brasile, il Congress ha approvato al Senate una legge sulle sanzioni alla Russia con 86-11, ha inserito nel NDAA un minimo di 28,500 per le US Forces Korea, e non è stato informato prima del raid di Caracas.
- hash: d0f420b8
  it: |
    Alleati che si cautelano: la metà degli europei definisce gli US un «necessary partner» e l'11% un alleato (ECFR, mag 2026); Spagna e Gran Bretagna hanno rifiutato l'uso di basi per i primi attacchi contro l'Iran e l'Arabia Saudita ha negato il sorvolo a maggio 2026; Qatar e UAE dicono che il Golfo «cannot rely on the US alone»; la Thailandia ha comprato il Gripen invece degli F-16; il Canada dovrebbe diventare il primo «associate member» dell'EU e Carney ha predisposto piani per un'invasione statunitense; il Kuwait acquista dal Pakistan.
- hash: eca0497e
  it: |
    Sovraesposizione e magazzini vuoti: la guerra con l'Iran è costata USD 43.6bn entro set 2026, le scorte di intercettori si sono ridotte al punto da richiedere una vendita di emergenza da USD 25.8bn, le batterie Patriot sono state spostate dalla Corea al Golfo, i sottomarini di classe Virginia accusano due anni di ritardo per AUKUS, gli 80,000 soldati in Europa sono sotto una revisione di sei mesi, e la NSS stessa ammette il «huge gap» tra droni economici e i costosi sistemi necessari per fermarli.
- hash: 8ea61556
  it: |
    Hormuz e i paesi ospitanti del Golfo: la guerra ha chiuso lo stretto (circa 150 navi bloccate il 1 mar 2026; il traffico «stalled as Tehran dictates terms» dopo il cessate il fuoco di aprile), Rubio definisce la presa iraniana un'«economic nuclear weapon», gli impianti LNG del Qatar sono stati colpiti, e la campagna dipende da paesi ospitanti che sono stati colpiti più di 6,700 volte e che pongono condizioni: il Kuwait afferma di non aver consentito l'uso del proprio territorio, il ministro omanita dice che Washington ha «lost control of its own foreign policy».
- hash: 2174a559
  it: |
    Il dollaro e il debito: il dollaro ha perso circa il 10% ponderato per il commercio dopo gennaio 2025 in due ondate (i dazi di aprile, le minacce sulla Groenlandia di gennaio 2026), i rendimenti a lungo termine sono saliti quando è stata messa in dubbio l'indipendenza della Fed, gli stranieri detengono poco più del 30% dei Treasuries e i gestori delle riserve dicono che li ridurranno, mentre la NSS elenca tra i mezzi su cui fa affidamento «the dollar's global reserve currency status»; la quota delle riserve ha tenuto al 57% all'inizio del 2026 e Brookings legge il calo come finora benigno.
- hash: ddf4ad0c
  it: |
    La contro-leva cinese: le licenze su terre rare e magneti di aprile e ottobre 2025 (i magneti destinati agli US ancora al 20% sotto il trend nel luglio 2026), gli acquisti di soia azzerati nel settembre 2025, la constatazione antitrust su Nvidia, un contro-dazio del 125%, e una tregua che Pechino proroga due mesi alla volta; così l'embargo sui chip, l'unica arma statunitense a cui la Cina non può rispondere allo stesso modo, viene scambiato con pause anziché usato.
- hash: 36518da8
  it: |
    Il punto culminante della coercizione. Ogni minaccia massima ha prodotto una propria ritirata: «Liberation Day» è diventato una pausa di 90 giorni in una settimana; i dazi sulla Groenlandia del 17 gen 2026 sono stati abbandonati a Davos il 21 gen in cambio di un «framework»; «cut all trade with Spain» (3 mar 2026) è diventato «Spain agreed to pay more», che Madrid smentisce; il 50% per l'India è diventato 18%; la Malaysia ha dichiarato nullo il proprio accordo. Una minaccia usata con tutti non viene più creduta da nessuno, e la Supreme Court che ha annullato i dazi IEEPA ha tolto l'arma su cui poggiavano le minacce. Regola di Luttwak: il metodo che riesce è quello che l'altra parte impara ad aspettare che passi.
- hash: bf9ca71a
  it: |
    Un primato che svuota le alleanze per cui presenta il conto. Lo scarico degli oneri ha funzionato (5% all'Aia, USD 550bn da Tokyo, 350bn da Seoul, gli europei che pagano i Patriot americani), e la stessa pressione ha trasformato i paganti in soggetti che si cautelano: l'11% degli europei continua a definire gli US un alleato, Qatar e UAE dicono che lo scudo è «insufficient», Riad ha negato il sorvolo, il Canada cerca un'associazione con l'EU, Bangkok ha comprato jet svedesi. La «burden-sharing network with our government as convener» è una rete i cui membri si stanno assicurando altrove.
- hash: 68bbda12
  it: |
    La svolta sull'emisfero che consegna a Pechino l'argomento. Spostare la flotta nei Caraibi e la priorità della strategia sul territorio nazionale doveva liberare risorse per la Cina; la NDS che lo fa non nomina mai Taiwan, dice che l'obiettivo è «not to dominate China», e il pacchetto di armi resta «in abeyance» come pedina di scambio. Tong Zhao, di Carnegie, legge il Trump Corollary come un invito alle potenze rivali a rivendicare le proprie regioni; Manila si è trovata esclusa dalla NSS; Brookings osserva che la svolta «sits uneasily» con la deterrenza nell'Indo-Pacifico. Le sfere d'influenza, una volta affermate in casa, sono difficili da negare all'estero.
- hash: 140f5146
  it: |
    La guerra combattuta per farla finita con le guerre. La NSS di dicembre 2025 prometteva nessuna «forever wars» e un Medio Oriente che avrebbe «no longer dominate» la politica statunitense; dodici settimane dopo è iniziata Epic Fury, e a ottobre il bilancio segnava USD 43.6bn, un blocco imposto due volte, attacchi ripresi dopo un memorandum firmato, Hormuz chiuso e il figlio della Guida Suprema che promette vendetta. La guerra che doveva liberare il campo per l'emisfero e la Cina ha congelato i colloqui sull'Ucraina da marzo, ha rinviato di un mese il vertice di Pechino e ha svuotato le scorte di intercettori su cui la First Island Chain doveva contare.
- hash: 2b2ba709
  it: |
    Il nation-building di un governo che lo aveva ripudiato. «We are no longer pursuing nation-building», gli US hanno detto al Security Council a proposito della Bosnia; in Venezuela, dopo un raid giustificato come azione di polizia, il Segretario di Stato «effectively controls Venezuela's finances, the distribution of its natural resources and its government», Washington detiene circa USD 13bn dei proventi petroliferi, e Trump ha detto che gli US avrebbero «run» il paese. Il Trump Corollary, che doveva tenere fuori gli estranei, ha fatto di Washington l'amministratore di Caracas: l'impegno senza fine nella sola regione che la strategia rivendica come propria.
- hash: c7d8ef88
  it: |
    Il primato pagato nella valuta che consuma. Dazi, pressioni sulla Fed e la messa in dubbio pubblica della sicurezza dei Treasuries sono gli strumenti del primato economico; il dollaro che dovrebbero servire è sceso del 10% in due ondate che coincidono esattamente con l'introduzione dei dazi e le minacce sulla Groenlandia, i rendimenti sono saliti quando è stata messa in discussione l'indipendenza della Fed, e l'elenco dei mezzi della NSS inizia proprio con lo status di riserva. Brookings ritiene che il calo, finora, sia benigno e che il «tipping point» dei dazi non sia ancora stato raggiunto: il paradosso è latente, non compiuto.
- hash: ed599bab
  it: |
    Un canale negoziale che alimenta la guerra. La linea bilaterale con Mosca (Riad, Anchorage, la bozza in 28 punti tratta da un documento russo) è stata ottenuta esercitando pressione su Kiev e non ha prodotto alcun cessate il fuoco; l'Europa ha risposto costruendo una propria garanzia (la Paris Declaration) e pagando armi americane tramite PURL, così che a luglio 2026 Washington concedeva in licenza la produzione di Patriot per l'Ucraina e nello stesso trimestre acquistava diesel russo. Il mediatore finisce per essere l'arsenale di una parte e il cliente dell'altra, e Rubio e Lavrov si accusano a vicenda di fare un passo indietro rispetto a «a proposal, not an agreement».
- hash: 5ea2b6f4
  it: |
    Nell'ottobre 2026 gli Stati Uniti perseguono la grand strategy più esplicita che abbiano pubblicato dalla guerra fredda, e quella più in contrasto con i propri mezzi. I fini sono scritti: un emisfero tenuto sotto un Trump Corollary, il commercio riequilibrato con i dazi, la Cina mantenuta come rivale «within bounds», la difesa europea affidata agli europei, il Medio Oriente gestito senza «forever wars», la migrazione fermata. A livello tecnico gli strumenti funzionano: la frontiera è più tranquilla che da cinquant'anni, gli alleati hanno promesso migliaia di miliardi e il 5% del GDP, Maduro è in una cella a Brooklyn, Khamenei è morto. A livello di grand strategy il quadro si rovescia, come Luttwak dice che deve accadere quando una strategia riesce: la coercizione usata con tutti ha raggiunto il suo punto culminante in un solo anno (Davos, Spagna, la Supreme Court), gli alleati che hanno pagato si sono trasformati in soggetti che si cautelano, la guerra di scelta contro l'Iran ha consumato l'anno riservato all'emisfero e alla Cina, e lo stesso emisfero ha prodotto un Venezuela che Washington ora amministra. Tre segnali che non sono righe: la NDS non nomina mai Taiwan; l'USMCA è stato lasciato senza rinnovo il 1 luglio senza alcun piano per il seguito; e lo stesso governo che ha sanzionato Rosneft acquista diesel russo. Le posizioni di Washington si leggono di conseguenza: un avversario (Iran), due rivali con cui parla più che con i propri alleati (Cina, Russia), e una cerchia di alleati di trattato classificati come alleati riluttanti non perché resistano all'alleanza ma perché lo fa Washington: la prima grande potenza dell'atlante il cui attrito con gli alleati dipende in gran parte da sé stessa.
- hash: 7cd8a95d
  it: |
    Tenere al sicuro il regime e la successione: la costituzione del 2023 del presidente Mirziyoyev ha azzerato il conteggio dei mandati e ha esteso la presidenza a sette anni (90.2% di «yes» con un'affluenza dell'84.5% il 30 apr 2023), così che può governare fino agli anni Trenta, forse fino al 2040. L'apertura al mondo dal 2016 è il mezzo; il controllo politico è il fine.
- hash: 244ab70b
  it: |
    Trasformare una posizione doppiamente senza sbocco sul mare in valore di transito: essere il punto di attraversamento della ferrovia Cina-Kirghizistan-Uzbekistan (costruzione iniziata a fine 2024, completata al 17% nell'ago 2026), la ferrovia transafghana verso il Pakistan (accordo quadro del 17 lug 2025), il Middle Corridor e la rotta Iran-India via Chabahar. Uno stato che non può raggiungere il mare fa di sé la cosa che gli altri devono attraversare.
- hash: 77ce7032
  it: |
    Mantenere ogni grande potenza come partner e nessuna come padrona (politica multivettoriale ereditata da Karimov): osservatore, non membro, dell'Eurasian Economic Union (dicembre 2020); nessun CSTO; partner dei BRICS dal 2025 e membro della SCO, mentre corteggia Washington (C5+1, 6 nov 2025) e Bruxelles (EPCA, ottobre 2025); neutralità sull'Ucraina.
- hash: 36dc8b0f
  it: |
    Garantire acqua ed energia: a valle dell'Amu Darya (il canale Qosh Tepa dell'Afghanistan, 285 km, completamento previsto per il 2028), importatore netto di gas dal 2023 dopo che la produzione è scesa da 61.6 bcm (2018) a 44.6 bcm (2024), così Tashkent acquista gas russo e turkmeno, energia idroelettrica tagika (Rogun, contratto ventennale), nucleare russo (primo getto di calcestruzzo il 24 mar 2026) e costruisce impianti solari ed eolici finanziati dal Golfo.
- hash: db48fcaf
  it: |
    Fare di Tashkent l'organizzatrice di un'Asia centrale che si gestisce da sola: porre fine ai contenziosi con i vicini, definire i confini (trattato kirghiso-tagiko del 13 mar 2025 dopo la mediazione uzbeka, trattato sul punto di triplice confine a Khujand il 31 mar 2025), firmare Treaties on Allied Relations con Kazakistan (2022), Tagikistan (2024) e Kirghizistan (2026), e ospitare il formato dei leader che ora comprende anche l'Azerbaigian.
- hash: a924faa2
  it: |
    Trasformare il peso demografico in crescita e occupazione: 38.2 million di abitanti al 1 gen 2026 (il censimento di gen-feb 2026 ne ha contati 39.0 million), un'età mediana intorno ai 27 anni e circa 1.34 million di lavoratori con brevetti russi; adesione alla WTO prevista per il 2026, capitali del Golfo, coreani e giapponesi, e una riserva accumulata di USD 70-77bn nel 2026 (in gran parte oro) per attutire il distacco dalle rimesse (USD 18.9bn nel 2025, circa il 14% del GDP nel 2024).
- hash: b98e2dd5
  it: |
    Treaties on Allied Relations (non patti di difesa) con i tre vicini turcici e tagiko: Kazakistan (firmato il 22 dic 2022), Tagikistan (18 apr 2024), Kirghizistan (visita di Stato dal 30 lug all'1 ago 2026), più una quota di mediazione: la sistemazione del confine kirghiso-tagiko del 2025 è attribuita alla mediazione di Tashkent.
- hash: 05fa11b1
  it: |
    La neutralità come moneta di scambio: Tashkent riconosce l'integrità territoriale dell'Ucraina e non le «repubbliche» di Donetsk e Luhansk, si è astenuta sulla risoluzione della General Assembly del marzo 2022, e riceve da Putin i ringraziamenti per una linea «clearly neutral» (giugno 2024) mentre firma accordi con Mosca, Bruxelles e Washington. La linea dei media statali è una politica di «near and distant countries, the East and the West».
- hash: dd6da10d
  it: |
    Nessuna adesione al CSTO e nessuna base straniera segnalata: equipaggiamento russo ed esercitazioni (riprese dopo una pausa di dodici anni nel 2016-21), un filone di coproduzione per la difesa con l'India concordato nell'agosto 2026. Hard power è piccola per scelta; la leva sono il transito e un mercato da 38-million.
- hash: 49a91c1c
  it: |
    Oro, gas e ferrovie come strumenti: le riserve d'oro valutate USD 67.7bn hanno portato le riserve a USD 77.1bn il 1 mar 2026 (riserve in aumento di USD 25.1bn nel 2025), e la banca centrale trattiene l'oro dall'esportazione (quota dell'oro sulle esportazioni 12.3% nel gen-ago 2026 contro il 35.2% di un anno prima); il gas è importato dalla Russia (6.48 bcm nel 2025) e dal Turkmenistan; i corridoi ferroviari sono venduti a Cina, Pakistan e Afghanistan allo stesso modo.
