  en: 'El Salvador''s government rests on one proof of performance, the crackdown on the gangs under a state of emergency, and turns it into a claim to stay in office: the 2025 reform removes the term limit
    that the proof was meant to justify. Its links with the outside world are transactional and, in this card, rest on one arrangement with Washington for deportees. The weak point is the one the card cannot
    yet measure well: whether a state that depends on US migration cooperation can keep a crackdown that a prominent rights group now calls repression.'
