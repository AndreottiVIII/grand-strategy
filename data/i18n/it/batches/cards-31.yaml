# Translate every `en` into it. Write the translations to the file cards-31.out.yaml next to this one,
# as `items:` of `- hash: <same hash>` / `it: <translation>`, appending one item at a time (valid YAML at
# every step), never editing this file. Keep names, dates, numbers and quotes; register of a foreign-office
# brief: dry, precise, no flourish.
lang: it
items:
- hash: 8452bf3f
  kind: cards
  en: 'End the war in Ukraine on Moscow''s terms: Ukraine out of the rest of Donetsk, the front frozen in Kherson and Zaporizhzhia, the annexations recognised, no NATO membership and no NATO-country troops
    in Ukraine, a capped army, official status for Russian and the Moscow Patriarchate, sanctions lifted. The terms were set by Putin on 14 Jun 2024, repeated in Istanbul (May 2025), at Anchorage (Aug 2025),
    in Abu Dhabi and Geneva (Jan-Feb 2026), and have not moved.'
  it: ''
- hash: 9d367346
  kind: cards
  en: 'Deny Ukraine statehood as currently constituted: Putin''s ''one people'' doctrine, ''all of Ukraine is ours'' (June 2025), and the demand for a government in Kyiv that Moscow can live with. This
    is the aim that makes Ukraine the atlas''s one European ''adversary'' of Russia.'
  it: ''
- hash: e585a3ae
  kind: cards
  en: 'Break the Western coalition rather than defeat it: separate Washington from Europe (Riyadh, Anchorage, the 28-point plan drafted with Dmitriev), keep the EU without an envoy, punish the frontline
    states with hybrid pressure while offering the thaw to whoever asks (Fico, Stubb''s ''mental preparation'', Costa''s channel).'
  it: ''
- hash: d4d06204
  kind: cards
  en: 'Keep the near abroad in orbit: Belarus absorbed into the Union State''s defence (Dec 2024 treaty, nuclear weapons, Oreshnik), Georgia drifting back, Armenia punished for leaving the CSTO, Kazakhstan
    held by the CPC pipeline, Moldova denied a compliant settlement, Abkhazia and South Ossetia integrated (May 2026 treaty).'
  it: ''
- hash: a873a7e8
  kind: cards
  en: 'Replace the lost Western market and arsenal with the East and South: China as buyer, banker and supplier (USD 234bn trade in 2025, 57% of imports, Power of Siberia 2 memorandum Sept 2025), North
    Korea as shell and troop supplier (June 2024 treaty), Iran as drone source, India as oil buyer, BRICS as the diplomatic frame (''a model of the multipolar world'').'
  it: ''
- hash: d876e918
  kind: cards
  en: 'Return as a great power outside Europe: the Syrian bases kept under al-Sharaa (Aug 2026 memorandum), Africa Corps as the state''s expeditionary arm in Mali, Niger, Burkina Faso, Libya and the CAR,
    Rosatom plants from Akkuyu to Dabaa, the Northern Sea Route as a China-Russia corridor (37 Mt in 2025), and the Arctic and OPEC+ as leverage over prices.'
  it: ''
- hash: 9c76c729
  kind: cards
  en: 'A bilateral channel to Washington over Europe''s head: Riyadh (18 Feb 2025), Witkoff''s Moscow visits, Anchorage (15 Aug 2025), the 28-point plan drafted in Miami with Dmitriev (Oct 2025), Witkoff
    and Kushner in the Kremlin (2 Dec 2025), trilateral rounds in Abu Dhabi and Geneva (Jan-Feb 2026), envoys again in Moscow (Sept 2026).'
  it: ''
- hash: 12ef867a
  kind: cards
  en: 'The non-Western frame: BRICS (Kazan 2024, Rio 2025, New Delhi 2026, where the declaration dropped Ukraine), the SCO (Bishkek, Sept 2026), Victory Day as a summit (Xi, Fico, Vucic, Diaz-Canel, Tokayev
    in May 2025) and the Beijing parade of 3 Sept 2025 beside Xi and Kim.'
  it: ''
- hash: 0310b55e
  kind: cards
  en: 'Hybrid pressure on Europe below the threshold of war: sabotage and arson through ''one-time agents'' (Germany 165+ suspected incidents in 2026, Milrem in Tallinn, IKEA in Vilnius, Leyton in London),
    GNSS jamming from Kaliningrad and Kola, drones over Danish and Belgian airports, election money in Moldova and Romania, the Orthodox Church as a channel (Estonia''s church law, the Kirill listing Bulgaria
    vetoed).'
  it: ''
- hash: 174eecdb
  kind: cards
  en: 'Attrition on the ground: 4,336 sq km taken in 2025 (19.25% of Ukraine occupied at the start of 2026), Kursk recovered by 26 Apr 2025 with North Korean troops, winter strike campaigns of over 10,000
    drones and bombs a month, Oreshnik used on Dnipro (Nov 2024), Lviv (Jan 2026) and Kyiv (May 2026).'
  it: ''
- hash: bfdb0820
  kind: cards
  en: 'Nuclear signalling and the end of arms control: the Nov 2024 doctrine and the Belarus umbrella (Dec 2024 treaty), Oreshnik on combat duty in Belarus (Dec 2025), the INF moratorium abandoned (4 Aug
    2025), New START allowed to expire on 5 Feb 2026 after a one-year observance offer Washington did not answer.'
  it: ''
- hash: 4f4a34e4
  kind: cards
  en: 'Expeditionary presence by proxy and by state: Africa Corps under the Defence Ministry replaced Wagner in Mali (June 2025), holds Niamey''s airport (Feb 2026) and the Niger junta (Aug 2026), Libya''s
    air bases for Haftar, the Syrian coast under a joint-centre formula; the shadow fleet of 600-1,300 tankers keeps the oil moving.'
  it: ''
- hash: e8b7e46c
  kind: cards
  en: 'Energy as a lever on the rest of Europe: TurkStream gas to Hungary, Slovakia, Serbia and Bosnia; Druzhba crude to Hungary and Slovakia; Kaliningrad transit through Lithuania to 2030; Rosatom''s Paks
    II, Akkuyu, Metsamor and Dabaa; discounted gas for Armenia tied to staying out of the EU; Gazprom''s refusal of a long-term contract to Serbia.'
  it: ''
- hash: 3e011587
  kind: cards
  en: 'A war economy settled in yuan: over a third of exports paid in yuan (2024), Chinese cars 57% of the market (2025), the shadow fleet and India as the outlet for crude, defence and security about 40%
    of the 2025 budget, war financed partly off-budget through preferential loans.'
  it: ''
- hash: 69a68eb5
  kind: cards
  en: 'The economy has reached the culminating point of the war boom: investment is collapsing outside the defence sector (Re:Russia, Oct 2026), the key rate peaked at 21% and was only at 14% in Sept 2026,
    oil and gas revenues fell 22% in the first eleven months of 2025, the 2026 budget will not balance even with higher oil prices, and a petrol crisis followed Ukrainian refinery strikes.'
  it: ''
- hash: ba450a81
  kind: cards
  en: About EUR 210bn of central-bank reserves are immobilised indefinitely in the EU (EUR 185bn at Euroclear), by qualified majority since Dec 2025; the Moscow court judgments against Euroclear are not
    recognised in the EU, and the reparations-loan plan was revived in Aug 2026.
  it: ''
- hash: 4ffe58e5
  kind: cards
  en: 'Sanctions keep tightening on both sides of the Atlantic: 21 EU packages (the 21st on 23 Jul 2026, the largest in four years), 632 shadow-fleet tankers listed, a maritime-services ban in preparation,
    Russian gas banned from the EU by 30 Sep 2027, US sanctions on Rosneft and Lukoil (22 Oct 2025) that cut Indian purchases, UK boardings in the Channel.'
  it: ''
- hash: aa507b52
  kind: cards
  en: 'Dependence on China: 57% of imports and 31% of exports (2024), 90% of machine-tool imports, payments at the mercy of Chinese banks that cut off sanctioned lenders in 2024, a gas pipeline whose price
    Beijing has not agreed, and a trade that fell in 2025 for the first time in five years.'
  it: ''
- hash: 219ed628
  kind: cards
  en: 'Manpower and allies that cost: a record-low 3% unemployment and emigration, 16,000-22,000 North Korean troops needed to retake Kursk at the price of USD 10-14bn in arms purchases that fund Pyongyang,
    Cubans and others recruited abroad, and an air-defence export that failed in Venezuela because specialists and parts went to Ukraine.'
  it: ''
- hash: bbfb7e9b
  kind: cards
  en: 'The partners it cannot defend: Assad fled to Moscow (8 Dec 2024) and the bases survive only by Damascus''s consent; Iran got condemnation and mediation offers, not weapons, in June 2025, and its
    Supreme Leader was killed on 28 Feb 2026; Maduro was seized by US forces on 3 Jan 2026; the Alaska ''spirit'' was exhausted by October 2025 and Washington kept the sanctions.'
  it: ''
- hash: a5238eac
  kind: cards
  en: The war against dependence on the West produced dependence on China. Moscow invaded to escape a Western-ordered Europe and ended with 57% of its imports, its settlement currency, its car market and
    its machine tools in Beijing's hands, and a gas pipeline waiting on a Chinese price. The 'junior partner' question is the one Russian officials will not answer.
  it: ''
- hash: aaa34dee
  kind: cards
  en: The weight Moscow put on the scale produced the coalition it feared. The invasion meant to stop NATO at Ukraine's border added 1,340 km of NATO border in Finland and Sweden's fleet in the Baltic,
    made Germany plan for a Russian attack 'by 2029', put Poland at 4.8% of GDP on defence, and gave NATO Eastern Sentry and Baltic Sentry. Peskov's complaint that Finland and Sweden 'reduced relations
    to zero' is the paradox stated from inside.
  it: ''
- hash: 4d14c7cc
  kind: cards
  en: 'Attrition has a culminating point and Russia is near it. The advance of 2025 (4,336 sq km, 0.72% of Ukraine) cost a defence budget of 40% of state spending, a 21% key rate, collapsing civilian investment
    and a Korean expeditionary corps; the same pressure that brings Kyiv to Abu Dhabi and Geneva is the pressure that Re:Russia expects to turn into falling incomes in 2026-27. Luttwak''s rule: the strategy
    that works stops working because it works.'
  it: ''
- hash: 257784f8
  kind: cards
  en: 'Great-state autism in the near abroad: the methods that keep Belarus bound (nuclear weapons, a succession clause, Oreshnik) are the ones that pushed Armenia out of the CSTO, Azerbaijan into a year
    of open quarrel after the AZAL shoot-down, and Kazakhstan to call for a freeze of the war in Putin''s presence. Each lever pulled on a neighbour is read by the next neighbour as a warning.'
  it: ''
- hash: 3f375440
  kind: cards
  en: The thaw with Washington is bought with the thing that makes the thaw worthless. Every US concession (Riyadh, Anchorage, the 28-point draft) was obtained by holding the Donbas demand, and the same
    demand is why no concession becomes a settlement; by June 2026 Lavrov accused Rubio of stepping back and Rubio replied that Alaska held 'a proposal, not an agreement'. Moscow's leverage over Trump is
    the war; ending it would spend the leverage.
  it: ''
- hash: 370d9821
  kind: cards
  en: The partner Moscow cannot defend becomes the partner Moscow must repay. Iran armed the drone war and got nothing in June 2025; by March 2026 Russia was handing Tehran targeting intelligence against
    US forces and offering to stop only if Washington cut Ukraine off, a trade that linked Russia's Ukraine aims to a war it did not choose. The treaty with no defence clause produced the obligation it
    was written to avoid.
  it: ''
- hash: d394926e
  kind: cards
  en: 'Russia in 2026 runs a grand strategy with one fixed aim - a Ukraine that is not a

    state in the Western sense - and a shrinking set of means to reach it. At the

    technical and tactical levels the war is being won slowly: Kursk retaken, 0.72% of

    Ukraine gained in 2025, Oreshnik over Kyiv. At the level of theatre strategy it has

    stalled: the front moves by villages, the price is a budget 40% military, a 21% key

    rate and civilian investment in collapse, and the manpower comes from Pyongyang. At

    the level of grand strategy the picture inverts, as Luttwak says it must: the move

    meant to push NATO back brought Finland and Sweden in and Germany to rearm; the move

    meant to free Russia from the West handed its trade, its currency and its machine

    tools to China; the levers that hold Belarus pushed Armenia and Azerbaijan away. The

    one genuine success since 2025 is diplomatic - the bilateral channel to Washington,

    Riyadh to Anchorage to the 28-point plan - and it rests on a paradox too: the demand

    for the Donbas is what keeps Trump talking and what keeps any talk from ending. Three

    signals that are not rows: Ushakov quietly dropped the ''spirit of Anchorage'' slogan

    in mid-2026; the New Delhi BRICS declaration dropped Ukraine altogether; and Vucic

    stayed away from the 2026 parade while Fico came and did not watch it. The culminating

    point of this attrition war is visible from Moscow as from Kyiv; what Moscow has not

    yet decided is whether the thaw with Washington is a way to stop before it or a way

    to pass it.'
  it: ''
- hash: d5ddd9b7
  kind: cards
  en: 'Keep the RPF system and Paul Kagame in power. Kagame won a fourth term with 99.18% on 15 July 2024 after the electoral commission and the courts kept his main critics off the ballot (Ingabire, Ntaganda),
    was sworn in in August 2024, and the 2015 referendum lets him rule to 2034. No source found names or discusses a successor: succession is the unwritten page of the card.'
  it: ''
- hash: d25f1a47
  kind: cards
  en: Destroy the FDLR as a threat on its border, and keep that mission as the stated reason for operating in the Congo. Kigali calls its deployments 'defensive measures' and says they stay until Kinshasa
    neutralises the FDLR; Kagame told Jeune Afrique (April 2026) that they include 'troop deployments and operations beyond its territory'. The Washington Accords (4 December 2025) tie Rwandan disengagement
    to Congolese operations against the FDLR, and the US asked Kinshasa on 13 October 2026 to speed them (more than 120 ex-combatants and family repatriated with UN help).
  it: ''
- hash: 724cb558
  kind: cards
  en: Hold a decisive position in the Kivus through the RDF and AFC/M23. The UN group of experts finds that Rwanda exercises command and control over M23 and judges that Kigali's 'final objective' is territory
    and resources; AFC/M23 and the RDF took Goma (27 January 2025), Bukavu (February 2025) and Uvira (10 December 2025, six days after the Washington Accords; evacuated by February 2026). Kigali denies
    backing M23 and says the AFC is 'not a proxy'.
  it: ''
- hash: b30b3b76
  kind: cards
  en: 'Make Washington pay for peace in minerals and migrants instead of punishing the war: the Washington peace agreement (27 June 2025) and Accords (4 December 2025) with their regional economic integration
    framework and a strategic-minerals framework with the US, up to 250 US deportees accepted (August 2025). This is the minerals-for-security logic. Kigali refuses the ''immediate and unconditional'' withdrawal
    that the US representative demanded at the Security Council on 13 October 2026.'
  it: ''
- hash: f2216216
  kind: cards
  en: Sell security abroad to buy immunity at home. About 6,300 soldiers and police are in Cabo Delgado (Mozambique) since 2021, the area TotalEnergies' USD 20bn LNG project relaunched in January 2026;
    the EU's EUR 20m support under the European Peace Facility ended in May 2026 and Kigali says Mozambique now pays. Rwanda also runs a bilateral force in the Central African Republic and is a large UN
    and AU peacekeeper; a 2022 deal to send 350 troops to Benin was agreed but no deployment is confirmed.
  it: ''
- hash: 308bb02e
  kind: cards
  en: Live without aid and with a hedge book. Foreign grants fall to about 7% of the 2026/27 budget (8.3% in 2025/26, 12.7% the year before); the IMF approved a 38-month programme of about USD 250m on 8
    June 2026; gold exports reached USD 1.5bn in 2024 (88% of mineral earnings); Qatar Airways took 60% of the Bugesera airport (2019); China (trade of USD 849m in 2025, Rwandan media figure) and Russia
    (nuclear cooperation, Lavrov meetings in December 2025 and April 2026) are the counterweights to Western conditionality.
  it: ''
- hash: 34f481c8
  kind: cards
  en: 'Sign everything, concede little. Kigali put its name to the Washington peace agreement (27 June 2025) and Accords (4 December 2025), accepts the Doha track between Kinshasa and AFC/M23 as a spectator,
    restored relations with Belgium on 22 September 2026 through a Qatari channel, and keeps France close (Macron-Kagame at the Elysee on 11 September 2026, a Genocide memorial unveiled in France in June).
    It rejects the UN experts'' findings wholesale (Kagame, 4 July 2025: the reports were ''written long ago'') and uses Qatar, China and Russia to show it is not isolated.'
  it: ''
- hash: 39fc4085
  kind: cards
  en: Genocide memory as doctrine. Kwibuka 32 (April 2026) was framed as 'Rwanda will not die twice'; the state press argues that memory is a tool of survival and security that cannot rest on others' mercy;
    at the Security Council Kigali puts the FDLR, a force founded by remnants of the 1994 perpetrators, at the centre of every debate on the Congo. The same memory covers the denial that Rwanda commands
    M23, and the framing of the AFC as a Kabila-linked Congolese movement (Kagame, April 2026).
  it: ''
- hash: aab7d31b
  kind: cards
  en: The Rwanda Defence Force as the instrument of the whole strategy. The UN experts counted 3,000-4,000 RDF troops in eastern Congo (2024 report, no new figure in 2025), directing M23's decisions to
    seize or leave territory (the April 2025 withdrawal from Walikale) and supplying equipment including air-defence systems; a second front of the same army sits in Cabo Delgado (about 6,300 with police)
    and a third in the CAR. The US sanctioned the RDF and four senior officers on 2 March 2026.
  it: ''
- hash: 6a3a1aaf
  kind: cards
  en: 'The mineral channel and the export hub. Gold (USD 1.5bn in 2024) and tin, tungsten and tantalum (exports up 46% in 2025) pass through Rwanda; the UN experts say coltan looted from M23-held mines
    is smuggled in and passed off as Rwandan output, and Treasury says Kabarebe coordinates the exports. The EU sanctioned the head of the Rwanda Mines, Petroleum and Gas Board and the Gasabo Gold Refinery
    on 17 March 2025; UAE-based firms keep importing Rwandan gold. A second economic arm is state-linked security contracting (reported: Isco Segurança guards the Total site).'
  it: ''
- hash: cc240649
  kind: cards
  en: 'Sanctions and conditionality now come from every Western partner at once: the US (Kabarebe, 20 February 2025; the RDF and four officers, 2 March 2026), the EU (17 March 2025, security consultations
    suspended, the raw-materials MoU ''under review'', EPF support ended May 2026), the UK (bilateral aid paused February 2025, defence training suspended). The bite is limited because grants are about
    7% of the budget; it is sharp where it hits the RDF, the asset Kigali hires out.'
  it: ''
- hash: 74f475c8
  kind: cards
  en: A landlocked economy that needs its neighbours' ports and roads. About 70% of Rwandan cargo went through Dar es Salaam in 2018 (later press estimates say 80% of imports; the rest Mombasa), yet Rwanda-Tanzania
    ties are described as 'on the rocks'; the Burundian border has been shut since January 2024 and the Ugandan one was shut from February 2019 to 2022.
  it: ''
- hash: 914a6a11
  kind: cards
  en: 'A hostile arc around the buffer. Burundi fields about 20,000 troops in South Kivu on Kigali''s count and, with the Congolese army, fights RED-Tabara and the AFC/M23-RDF coalition; Burundi''s president
    told the BBC (March 2025) that Rwanda planned to attack. Uganda, the other outside patron in the Kivus and Ituri, is a rival rather than an ally: the UN experts say the UPDF built a buffer in North
    Kivu and Ituri that shielded M23.'
  it: ''
- hash: 6c10b0c1
  kind: cards
  en: The security export lives on other people's money. The EU's EUR 20m under the European Peace Facility ended in May 2026 and Kigali's spokeswoman says the real cost is far higher; Mozambique's replacement
    funding is Kigali's claim, with no disclosed amount or term; Rwanda itself threatened in March 2026 to withdraw if funding was not sustainable. The force TotalEnergies' site relies on is the force the
    US has sanctioned.
  it: ''
- hash: e1516c58
  kind: cards
  en: One broker holds both the reward and the penalty. Washington brokered the Accords, takes the minerals and migrants, and also sanctions the RDF and tells the Security Council (13 October 2026) that
    Rwanda 'must immediately and unconditionally withdraw'. The Doha track, which Qatar chairs, is the other half of the settlement and Kigali has no seat in it.
  it: ''
- hash: 687b5834
  kind: cards
  en: 'A personalised regime in a small state: legitimacy rests on the 1994 memory and one man, the opposition was removed from the 2024 ballot, and no successor or succession mechanism appears in any source
    found. Any shock to Kagame is a shock to the whole strategy.'
  it: ''
- hash: 92bc874d
  kind: cards
  en: 'The army that is sold abroad to buy immunity is the army the West now sanctions. After the US designated the RDF (2 March 2026), Nduhungirehe threatened on X to pull the Rwandan force out of Cabo
    Delgado, which protects the TotalEnergies project: Kigali used its clients as hostages for its own protection and the EU, the funder of the Mozambique mission, stopped paying in May. Security exports
    were meant to buy goodwill in Paris, Maputo and Washington; they have become the lever by which Kigali is sanctioned and, if it carries out the threat, by which it loses the goodwill.'
  it: ''
- hash: 9e1b41b6
  kind: cards
  en: The memory that shields Rwanda is spent each time it justifies a war. 'Never again' and the FDLR give Kigali its moral credit with the West and its stated reason to hold ground in the Kivus; the UN
    experts read the same operations as a drive for territory and minerals, and the US now treats the 'defensive measures' as a violation. The more the genocide is invoked to explain Goma and Bukavu, the
    cheaper the invocation becomes for the audiences whose guilt it was meant to keep.
  it: ''
- hash: 62e5ec04
  kind: cards
  en: The buffer grows the front it was meant to shorten. Pushing into South Kivu brought M23 to Uvira, on the Burundian border, six days after the Washington Accords; Burundi answered with about 20,000
    troops (Kigali's count), closed its crossings and hardened a border that was already shut to Rwanda, while the UN experts record RED-Tabara and FNL fighters joining the AFC/M23-RDF coalition near Sange.
    A security policy built on the FDLR threat has produced a second enemy state.
  it: ''
- hash: b718a0a7
  kind: cards
  en: The accord that was to buy immunity became the yardstick of punishment. Rwanda signed the Washington Accords on 4 December 2025; M23 entered Uvira on 10 December, and on 2 March 2026 the US (announced
    by the State Department, designated by OFAC) sanctioned the RDF, saying M23 took Uvira 'in clear violation of the Washington Accords'. By signing, Kigali gave Washington a text against which to measure
    its conduct, and the minerals framework that was to pay it is tied to the same text.
  it: ''
- hash: 1a1fa934
  kind: cards
  en: The mineral rent that funds independence draws the sanctions that threaten it. Mineral exports (gold USD 1.5bn in 2024) are the answer to falling grants, but the UN experts trace smuggled Congolese
    coltan and gold through Rwanda, the EU sanctioned the head of the mines board and the Gasabo Gold Refinery (17 March 2025) and put the 2024 raw-materials MoU under review, and Treasury names Kabarebe
    as manager of the revenue. The same trade that replaces aid invites the donor and sanctions attention Kigali can least afford.
  it: ''
- hash: dbf596ea
  kind: cards
  en: Denial protects the deal and blocks it. Kigali denies commanding M23 (the AFC 'is not a proxy', Kagame, April 2026) while its foreign ministry presents AFC/M23's counterattacks as 'forced responses'
    and Kagame acknowledges 'operations beyond its territory'. Deniability keeps Washington talking, but the Accords' withdrawal clause cannot be verified, and so cannot be closed, against a force whose
    existence is officially denied.
  it: ''
- hash: 6929b1cd
  kind: cards
  en: 'Rwanda is Luttwak''s small state that turns its vulnerability into a regional offensive and then sells security abroad to buy immunity at home. The vulnerability is real - a landlocked state of the
    1994 survivors, with the perpetrators'' successors (the FDLR) next door and a Congolese army that has used them - and Kigali has made it the license for a forward defence in the Kivus, run through the
    RDF and AFC/M23 (UN experts: command and control; Goma, Bukavu, Uvira). The surplus the offensive creates is spent twice: at home as rent (gold, tin, tantalum, mineral transit) that replaces falling
    aid, and abroad as a service (Cabo Delgado, the CAR, UN missions) that makes the West, Paris, Maputo and now Washington need the army it sanctions. The Washington Accords of 4 December 2025 were the
    best expression of that logic: peace for minerals, deportees and goodwill. But the accord has become a measuring rod, the US sanctioned the RDF on 2 March 2026 and on 13 October 2026 demanded unconditional
    withdrawal, the EU stopped paying for Mozambique, and the offensive has produced a second adversary in Burundi. Where Luttwak''s paradox bites hardest is in the memory: the genocide is both the moral
    capital that buys immunity and the thing the offensive spends. The grade toward the DRC is rival, not adversary: Kigali''s declared aim is security and leverage, not the end of the Congolese state,
    and it signed an accord with Tshisekedi; the FDLR is the real adversary, and AFC/M23 the instrument. Not verified for this card: the text of the Washington Accords (read through press), a 2026 UN experts''
    report, the number of RDF troops in 2026, the Benin deployment (the 2022 agreement is on record, a deployment is not), Rwandan policy toward Kenya and Tanzania in 2026, the Mozambique SOFA reported
    for August 2025, and any succession arrangement.'
  it: ''
- hash: edaa9186
  kind: cards
  en: Keep the kingdom, its capital and its oil system out of the line of fire. Since 28 Feb 2026 Iranian missiles and drones, Iraqi militias and now the Houthis have hit Riyadh, Ras Tanura, Yanbu and the
    southern airports; Riyadh wants the Iran war ended on terms that reopen Hormuz, a Houthi front it can close, and no repetition of the 8-10 Oct 2026 airport strikes that killed at least 13 and wounded
    about 300 in Riyadh.
  it: ''
- hash: 1dc64ad0
  kind: cards
  en: 'Deliver the Vision 2030 transformation while the money tightens: a 2026 budget planned at a deficit of SAR 165bn (3.3% of GDP, down from 5.3% in 2025), a PIF 2026-2030 strategy approved on 15 Apr
    2026 that cuts and reshapes the giga-projects (The Line frozen until after 2030) and shifts weight to industry, minerals, AI and tourism, with Expo 2030 and the 2034 World Cup as the fixed dates.'
  it: ''
- hash: cf108fe9
  kind: cards
  en: 'Keep the United States as the guarantor while building a second line of defence that does not depend on it: a US Strategic Defense Agreement, major non-NATO ally status, an F-35 commitment and a
    civil nuclear 123 agreement in Congress, alongside the Sept 2025 mutual defence agreement with Pakistan (about 8,000 Pakistani troops in the kingdom), the Aug 2026 Makkah pact with Turkey and Pakistan
    and a counter-drone deal with Ukraine.'
  it: ''
- hash: ac4d622f
  kind: cards
  en: 'Turn oil into revenue and leverage under wartime conditions: hold OPEC+ discipline (the seven core members froze output for November on 4 Oct 2026), push crude around Hormuz through the East-West
    pipeline (5.8 mb/d reported on 6 Oct) and keep the Aramco dividend (USD 21.9bn declared for Q2 2026) funding the state.'
  it: ''
- hash: 807544df
  kind: cards
  en: 'Set the order around the kingdom: a Saudi-run Red Sea and Bab el-Mandeb (14-state maritime coalition headquartered in the kingdom, 30 Jul 2026), a friendly Yemeni government in the south and the
    army side in Sudan, Syria and Lebanon under states and not militias, and Palestine on Riyadh''s terms - a two-state path co-chaired with France, normalisation with Israel only after statehood.'
  it: ''
- hash: d768a492
  kind: cards
  en: 'Stop the UAE building a rival Gulf pole at Saudi expense in Yemen, Sudan and the Horn without breaking the GCC: Riyadh forced the UAE-backed STC back and the Emirati forces out of Yemen in Dec 2025-Jan
    2026, then moved to a public show of unity by July-October 2026 while the Emirates left OPEC (1 May 2026).'
  it: ''
- hash: c6c5585e
  kind: cards
  en: 'Convening power around the kingdom: the 14-nation Red Sea maritime coalition (43 states and the EU attended), the emergency GCC leaders'' meeting in Jeddah (April 2026), co-chairing the New York
    two-state conference with France (July 2025), host of the second EU-GCC summit (24 Oct 2026) and a Quad seat on Sudan. A defence web with Pakistan and Turkey (Makkah Joint Defense Agreement, 7 Aug 2026).'
  it: ''
- hash: 829b6f78
  kind: cards
  en: 'The official line is de-escalation with a promise of response: the Defence Ministry said on 29 Jul 2026 that the kingdom ''does not seek escalation but will respond to any aggression'', the foreign
    ministry warned Iran it would ''bear the heaviest consequences'', and state media framed the strikes in Iraq as a CENTCOM-coordinated reply to militia drones. Riyadh denies reports that the crown prince
    urged the US-Israeli attack on Iran.'
  it: ''
- hash: f9bf5318
  kind: cards
  en: 'A kingdom that now fights: the coalition air campaign in Yemen (82 Houthi sites claimed in Saada, Hodeidah, Jawf and Marib), joint Saudi-US strikes on Iraqi militias (29 Jul 2026) and earlier reported
    Saudi strikes on Iran-linked targets, imported depth (Pakistan: about 8,000 troops, a JF-17 squadron and a Chinese HQ-9 battery at King Abdulaziz Air Base, fully paid by Riyadh; Turkish technical support)
    and Ukrainian counter-drone know-how.'
  it: ''
- hash: c79acf08
  kind: cards
  en: 'Checkbook diplomacy and market power: USD 600bn of investment pledged to Trump in May 2025 (raised toward USD 1 trillion in Nov 2025), the largest US arms package on record (about USD 142bn announced),
    USD 1bn to the Gaza Board of Peace, a USD 6.4bn Syria package and more in Feb 2026, aid to Eritrea and Djibouti, and the oil weapon through OPEC+ and Aramco''s loading offers outside Hormuz.'
  it: ''
- hash: 18fa031c
  kind: cards
  en: 'Geography: the Gulf coast loads most crude and Iran can close Hormuz. Output fell about a quarter in Q2 2026 even at USD 108 oil, the East-West pipeline (nameplate 7 mb/d, 5.8 mb/d reported) and
    the Yanbu berths are the only exit, and a drone attack on the pipeline in 2026 showed that the bypass is itself a target.'
  it: ''
- hash: d21a735d
  kind: cards
  en: 'Money: a first-half 2026 deficit of SAR 160bn, 97% of the full-year plan (Q2 alone SAR 34.3bn, narrowed by the wartime oil price), borrowing planned at SAR 217bn, and an economy shrunk by the war.
    The kingdom cannot at once fund NEOM, a Gaza pledge, Syria and a war.'
  it: ''
- hash: 857c9609
  kind: cards
  en: 'Air defence that did not hold: Riyadh''s King Khalid airport was hit on 8 and 10 Oct 2026 and stayed closed, and the kingdom buys interceptors from Ukraine and has brought in a Chinese HQ-9 battery
    with the Pakistani contingent.'
  it: ''
- hash: 55657dcc
  kind: cards
  en: 'A guarantor that is not a treaty ally: the United States gave Riyadh a Strategic Defense Agreement and non-NATO ally status in Nov 2025 but no mutual defence treaty, did not consult it on the Feb
    2026 war, and the 123 nuclear agreement faces a Senate vote after the midterms (before 13 Dec 2026).'
  it: ''
- hash: e7f8f155
  kind: cards
  en: 'Gulf disunity: the UAE called the GCC''s wartime response ''the weakest in history'', left OPEC on 1 May 2026, backs the other side in Sudan and did not sign the Red Sea coalition statement; Oman
    did not either. The Saudi sphere is a coalition of the willing, not the GCC.'
  it: ''
- hash: 920d69fe
  kind: cards
  en: 'The Palestine bar: Saudi public line since 2024 is no relations with Israel without a Palestinian state on the 1967 lines; Israeli officials rule a state out, and CSIS finds no US incentive has moved
    Riyadh. The Iran war raised the cost of visible proximity to Israel.'
  it: ''
- hash: 37174eac
  kind: cards
  en: The war that fills the treasury empties the barrels. Aramco's Q2 profit rose 33% and the wartime price (about USD 108) shrank the first-half deficit, yet production fell about a quarter and shipments
    to China ran at a record-low 333,000 b/d in June against 1.39 mb/d in 2025. Riyadh needs the crisis priced in and over.
  it: ''
- hash: 2f37d8c0
  kind: cards
  en: Pushing the UAE out of Yemen left Riyadh alone with the Houthis. The Dec 2025-Jan 2026 campaign against the UAE-backed STC removed Emirati forces and the southern separatists, but the Houthis then
    took the western coast to Bab el-Mandeb, declared a naval blockade (20 Jul 2026) and hit four Saudi airports in October; Riyadh now asks Turkey, Pakistan and even Damascus for help.
  it: ''
- hash: 3d2bac3a
  kind: cards
  en: Vision 2030 needs a calm region, and the kingdom now strikes three countries. The 2023 Beijing détente with Iran bought the quiet that tourism, Expo 2030 and foreign investment need; once Iranian
    drones hit Ras Tanura and Riyadh, Saudi Arabia expelled Iranian officers (21 Mar), bombed militias in Iraq (29 Jul) and backs the Yemeni offensive - and its flagship airport is shut.
  it: ''
- hash: 39aae987
  kind: cards
  en: Insisting on a Palestinian state keeps Riyadh without the US treaty it wanted. The Biden-era design tied a US defence pact to normalisation with Israel; Riyadh kept the condition, got a Strategic
    Defense Agreement and no treaty, and hedged with Pakistan and Turkey - whose guarantee is not a substitute for US air power, as the CSIS authors argue.
  it: ''
- hash: 61b301c2
  kind: cards
  en: Defending the oil price pushed a producer out of the cartel. Saudi-led OPEC+ restraint and its priority on price over volume were among the reasons the UAE, with spare capacity and a wish to pump,
    left OPEC and OPEC+ on 1 May 2026 - about 12% of OPEC output - and can now grow outside the quotas once Hormuz reopens.
  it: ''
- hash: ded41720
  kind: cards
  en: 'Withholding the bases to avoid being a target weakened the guarantor Riyadh needs. In May 2026 Saudi Arabia reportedly denied overflight and basing to the US ''Operation Freedom'' (the operation
    was dropped two days later) after Iran had struck Prince Sultan Air Base, then restored access: it protected itself in the short run and told Washington how conditional its hosting is.'
  it: ''
- hash: 353392ad
  kind: cards
  en: 'Saudi Arabia is a rich state that has become a front-line state without

    changing its aim, which is to buy time for an economy that will outlast oil.

    Everything in the card is a trade of one scarce thing for another: US

    protection against Israeli normalisation, a Pakistani and Turkish guarantee

    against dependence on Washington, the UAE''s exit from Yemen against a Houthi

    front of its own, a wartime oil price against lost volume and market share.

    The Luttwakian pattern is that each safeguard creates the next exposure: the

    February 2026 war put Iranian missiles on Ras Tanura and Riyadh, the

    answers (strikes in Iraq, an offensive in Yemen) brought the Houthis to the

    capital''s airport, and the hedges (Makkah pact, Pakistani troops) show a

    kingdom unsure that the United States will fight for it. The thaw with Abu Dhabi

    (July-October 2026) is tactical, since Yemen''s south, Sudan and the Horn

    remain contested. Signals that are not rows: the postponement, at Riyadh''s

    request, of the Hormuz talks between Gulf states and Iran in Sept 2026

    (Saudi Arabia would rather the US negotiates than the Gulf legitimises

    Iranian control of the strait); Egypt declining the Makkah pact while saying

    Gulf security is its own; and the fiscal arithmetic that makes the 2026 deficit look

    better only because the war lifts the price. Open gaps in this pass: the

    OIC and Arab League as instruments, Afghanistan, Jordan, Kuwait, Oman, the

    Horn beyond commentary, and an official Saudi source for the Houthi truce

    breakdown (reports date the renewed fighting from June or July 2026).'
  it: ''
- hash: 8e6aa51f
  kind: cards
  en: Defeat the Rapid Support Forces as an armed force and keep Sudan one state under the army. Burhan refuses any truce that leaves the militia where it stands, called on the UN in 2023 to declare the
    RSF a terrorist organisation, and in 2026 told Foreign Policy that pauses only let the RSF and its backers regroup. The army holds Khartoum and most of the north, east and centre; in September-October
    2026 it pressed on in Kordofan (al-Mazroub, 2 Oct) while the RSF kept almost all of Darfur.
  it: ''
- hash: 138593a6
  kind: cards
  en: 'Be the only recognised government of Sudan: beat the RSF''s rival Government of Peace and Unity (charter signed in Nairobi, Feb 2025; announced by Hemedti on 15 Apr 2025; seat Nyala) and rebuild
    a civilian-fronted state - Kamil Idris appointed prime minister on 19 May 2025, the government back in Khartoum on 11 Jan 2026. The African Union Peace and Security Council, the Arab League, Saudi Arabia,
    Qatar and Egypt all rejected the parallel government; Washington says neither the army nor the RSF ''represent legitimate, constitutional governance''.'
  it: ''
- hash: 6bf12c19
  kind: cards
  en: Keep the patrons that arm and shield the army, and break the one that arms the RSF. On one side Egypt (drones flown from East Oweinat), Turkey (Baykar), Iran (Mohajer-6), Qatar and Saudi Arabia; on
    the other the UAE, which Khartoum took to the ICJ (dismissed 5 May 2025), expelled 15 diplomats of (Dec 2023) and cut relations with (6 May 2025).
  it: ''
- hash: 369c1a35
  kind: cards
  en: 'Hold the economic base that pays for the war and deny it to the RSF: the Heglig oilfield and the South Sudan pipeline to Port Sudan, gold, the Red Sea ports. The RSF took Heglig on 8 Dec 2025 (output
    about 20,000 barrels a day against 64,000 before the war); the army pulled back into South Sudan and accepted a South Sudanese garrison rather than see the field destroyed or held by the RSF. A minister
    accused the RSF of looting 1,273 kg of gold from the Sudan Gold Refinery at the start of the war.'
  it: ''
- hash: ab03ff35
  kind: cards
  en: 'Close the RSF''s rear. Four supply routes are reported: eastern Libya (Kufra, with Haftar''s forces), Chad (the subject of Sudan''s Nov 2024 complaint to the African Commission), Ethiopia (a camp
    near Asosa in Benishangul-Gumuz that Reuters says held about 4,300 fighters in January 2026) and the South Sudan border (Amnesty). Khartoum answers with a Horn alignment of Egypt, Eritrea and Somalia
    (El Alamein summit, 4 Oct 2026).'
  it: ''
- hash: 8d3698fc
  kind: cards
  en: Refuse a Quad or US truce that freezes the lines, without losing Washington and Riyadh. Burhan called the Quad's Nov 2025 text 'the worst yet' and objected to the UAE's seat in it; in Sept 2026 Washington
    is reported to be withholding his UN visa until he accepts the Boulos 90-day ceasefire, while the army asks that the RSF withdraw from civilian areas first.
  it: ''
- hash: df873a84
  kind: cards
  en: 'Lawfare and forums: the ICJ genocide case against the UAE (hearings 10 Apr 2025, dismissed 5 May for lack of jurisdiction), a complaint to the African Commission on Human and Peoples'' Rights against
    Chad (Nov 2024), documents given to the Security Council on UK-made equipment found with the RSF (Oct 2025), and accusations that the UAE shields the RSF in international forums.'
  it: ''
- hash: 05d65f99
  kind: cards
  en: 'Coercion of hosts and mediators: Sudan recalled its ambassador from Kenya (20 Feb 2025) and banned all Kenyan imports (14 Mar 2025) after Nairobi hosted the RSF''s founding charter, condemned Uganda
    for receiving Hemedti in Entebbe (Feb 2026), and rejects the UAE as mediator. The Horn alignment is its counter-bloc: Egypt, Eritrea, Somalia and Sudan met at El Alamein on 4 Oct 2026.'
  it: ''
- hash: 40eae1df
  kind: cards
  en: 'Naming and shaming: the UAE a ''state of aggression'' (6 May 2025), the RSF a militia of foreign mercenaries and terrorists, captured crates of Emirati arms shown as proof (Oct 2024), the May 2026
    accusation that the drones that hit Khartoum were Emirati and launched from Bahir Dar in Ethiopia (denied by both).'
  it: ''
- hash: 41bcf0b7
  kind: cards
  en: 'A drone and air war bought from several suppliers: Turkish TB2 and Akinci drones under a reported USD 120m Baykar contract (Akinci adopted June 2026), Iranian Mohajer-6 drones, Egyptian Akincis flown
    from East Oweinat, about 100 Pakistani Mohafiz-V armoured cars (Aug 2026), plus Islamist brigades (Al-Baraa bin Malik) fighting under army command and an Eritrean-backed eastern front.'
  it: ''
- hash: f36a86a5
  kind: cards
  en: 'Choke points the state still holds: the pipeline that carries South Sudan''s crude to Port Sudan (Heglig can process up to 130,000 barrels a day of it), the Port Sudan naval base agreed with Russia
    in 2020 and not shown ratified since, new banknotes printed since Nov 2024, and the gold refinery claims. Gold is the RSF''s counterweight: the UAE is reported to be the main buyer of gold from RSF
    areas (Le Monde diplomatique, confidence C).'
  it: ''
- hash: 6af9b366
  kind: cards
  en: Patrons whose interests diverge from the army's. Egypt sits in the Quad with the UAE and depends on Emirati finance; Riyadh co-wrote the Sept 2025 roadmap, put the USD 1.5bn Pakistani arms deal on
    hold in April 2026 over who would fund it, and with Cairo presses Burhan to limit Islamists; Turkey sells Akincis to Egypt too and, by FDD's account, deals with both sides. Each patron holds a different
    veto.
  it: ''
- hash: cc5d422f
  kind: cards
  en: The humanitarian catastrophe. The IPC counted about 19.5 million people (over 40% of the population) in acute hunger in May 2026, with 14 areas at risk of famine; the war has spread to 13 of 18 states
    and displaced 14 million people; about 825,000 children face severe acute malnutrition this year. The Sudanese pound lost nearly half its value in army-held territory between early summer and Sept 2026.
  it: ''
- hash: 42b6ee40
  kind: cards
  en: A split currency and treasury. The RSF banned the army's new banknotes in May 2026, appointed a governor of a parallel central bank in Nyala on 21 May 2026 and began printing its own; the oil that
    paid for the state is down (Heglig about 20,000 barrels a day against 64,000 before the war).
  it: ''
- hash: f59205cc
  kind: cards
  en: Western legal pressure that names the army as well as the RSF. Treasury sanctioned Burhan personally (16 Jan 2025), the US determined the army used chemical weapons (May 2025) and designated the Sudanese
    Muslim Brotherhood as terrorist (9 Mar 2026); in Sept 2026 a US proposal to extend the Darfur arms embargo to the whole country is described by Burhan's backers as a penalty on the army.
  it: ''
- hash: 8d96fcbc
  kind: cards
  en: A coalition that is not one. The army's coalition holds Islamists (the National Congress Party, the Al-Baraa bin Malik brigade that Washington calls the armed wing of the Muslim Brotherhood), some
    of whom voiced support for Iran during the 2026 Iran war; Saudi Arabia, Egypt and the US press Burhan to choose, and he has warned members against foreign-policy positions of their own.
  it: ''
- hash: 46fb0518
  kind: cards
  en: Reach and depth. The RSF holds almost all of Darfur and parts of Kordofan; El Fasher fell on 28 Oct 2025 and Babanusa and Heglig in Dec 2025; RSF drones have hit Port Sudan (first time, early May
    2025) and Khartoum (May 2026, per the army). The army leans on Egyptian and Turkish air power and Eritrean support to cover what it cannot reach itself.
  it: ''
- hash: 588eaad9
  kind: cards
  en: The state at war with its own instrument. The Janjaweed became the Rapid Support Forces in 2013 and an 'independent security force' by law in 2017, built by Bashir to coup-proof the regime against
    its own army; Burhan and Hemedti then took power together in October 2021. The generals who allowed the instrument to grow now cannot win without destroying it nor settle with it standing, and the RSF
    has answered with a rival government and a rival bank.
  it: ''
- hash: c05ce03f
  kind: cards
  en: The patrons who built it sit at the table. The UAE had backed the army and promoted Hemedti's economic role before the war and is the RSF's reported patron; Egypt and Saudi Arabia, the army's backers,
    share the Quad with Abu Dhabi. Burhan rejects the Quad because of the UAE, yet the Quad is where Cairo and Riyadh act for him, and the one platform with the US. Refusing it costs him his protectors'
    diplomatic cover; accepting it seats his accused enemy at the settlement.
  it: ''
- hash: 4738e5be
  kind: cards
  en: The infantry that holds ground costs the diplomatic cover. Islamist brigades such as Al-Baraa bin Malik fight beside the army, but on 9 Mar 2026 the US designated the Sudanese Muslim Brotherhood and
    tied its fighters to Iran's IRGC, and Riyadh and Cairo are reported to press for limits on them. Burhan has had to arrest an Islamist who backed Iran (15 Mar) and warn coalition members off foreign
    policy of their own; the more the army relies on them, the more the Gulf and Washington hedge.
  it: ''
- hash: d4f06cc9
  kind: cards
  en: Arms from suppliers the paymasters distrust. Iranian drones and Russian arms are credited in reporting with helping the 2024-25 counter-offensive, but they invite US prosecution (an Iranian arms-broker
    case in Los Angeles in April 2026) and Saudi vetoes (the Pakistani deal put on hold after Riyadh objected); Burhan has condemned Iranian strikes on Gulf states (including the attack on Saudi Arabia's
    Jubail), while part of his Islamist base cheers Tehran. The edge on the battlefield is paid for with the backing needed for the day after.
  it: ''
- hash: f3cbe346
  kind: cards
  en: Refusing the truce hands the RSF the moral ground. The RSF accepted the Quad's humanitarian ceasefire the day after Burhan rejected it, and the State Department now says neither side represents legitimate
    governance and that it will 'raise the cost' for all belligerents, while the UN visa is reportedly being used as leverage. The army's strongest card, its claim to be the state, is weakened each time
    it refuses what the world calls peace.
  it: ''
- hash: fb7ffbbd
  kind: cards
  en: 'Retaking the capital deepened the partition. The army reclaimed Khartoum in March 2025 and the government returned on 11 Jan 2026, but its new banknotes (printed since Nov 2024) drew the RSF''s ban
    in May 2026 and a parallel central bank in Nyala: two monies, two governments, two armies. Each step of state-building on the army''s side hardens the de facto split it exists to prevent.'
  it: ''
- hash: 78ca0fb5
  kind: cards
  en: 'Sudan is the Luttwak case of a state at war with its own instrument. The RSF was raised by the regime to guard it against its own army, and the generals who let it grow (Burhan took power together
    with Hemedti in October 2021) can neither win without destroying it nor accept a truce that leaves it standing. The Gulf and Egypt, which dealt with both generals before the war (the UAE promoted Hemedti''s
    economic role), are now divided inside the Quad, so the army''s strategy is a negotiation with its own sponsors: keep Cairo, Riyadh, Ankara and Doha, shut out Abu Dhabi, and avoid being sold a freeze
    of the lines by Washington. October 2026 finds it with momentum in Kordofan and on the wrong side of the US visa desk. Two signals that are not rows: the Russian naval base at Port Sudan, agreed in
    December 2020, has no source showing it ratified or built, so Moscow is a supplier and a reserve, not an anchor; and Burhan''s postponed trip to the UN General Assembly in September, with his US visa
    reportedly withheld until he accepts a ceasefire, which shows that the state''s own head is now a bargaining object for Washington. The paradoxes share one shape: each lever that wins ground (Islamist
    brigades, Iranian and Turkish drones, refusing the Quad) buys the army less standing with the people who will write the settlement.'
  it: ''
- hash: 551000dc
  kind: cards
  en: 'Restore public finances after the hidden-debt revelation: win IMF Board approval for a new programme (a staff-level agreement of about USD 2.2bn was reported on 1 September 2026, with Board approval
    still pending in the sources found) and manage the debt by reprofiling rather than formal restructuring, in the words of Prime Minister Lo.'
  it: ''
- hash: 6b03df89
  kind: cards
  en: 'Turn the oil and gas start-ups into the new economy and the revenue base for the debt: Sangomar oil (operated by Woodside, 82%; 17.9 million barrels in the first half of 2026, per the energy ministry)
    and the Grand Tortue Ahmeyim (GTA) LNG field shared with Mauritania, producing since early 2025. The link to debt service is our inference.'
  it: ''
- hash: 2397c8e1
  kind: cards
  en: 'Reset the French partnership after the end of all foreign military presence: President Faye announced in December 2024 that foreign military presence would end in 2025, and the French base at Camp
    Geille and the Dakar airfield were handed over on 17 July 2025.'
  it: ''
- hash: 44629e67
  kind: cards
  en: 'Oil and gas: Sangomar has a capacity of 100,000 barrels a day (allAfrica, February 2026), and Kosmos reported 12% production growth in Q2 2026 with GTA among the drivers; GTA gross output was about
    2.65 million tonnes a year in that quarter (Kosmos figures as reported, not checked against the primary release). The sources found give no revenue split for Senegal.'
  it: ''
- hash: eb77b3f5
  kind: cards
  en: 'Military: Senegalese troops entered The Gambia in January 2017 to back the elected leader Adama Barrow. Since the last French base closed in July 2025, the army is the state''s only military instrument
    on its own soil (our reading).'
  it: ''
- hash: 8fa70684
  kind: cards
  en: Debt is the binding constraint. Hidden debt surfaced in 2024-25 and ran to billions of dollars (TimesLive, July 2025). The IMF had outstanding purchases and loans of SDR 829.65 million on 31 March
    2026 (IMF). The new programme is agreed at staff level but, in the sources found, not yet approved, and the Prime Minister says arrears must be cleared before the finances can stabilise.
  it: ''
- hash: 9ef03301
  kind: cards
  en: The Sahel border is not Senegal's to secure alone. JNIM's fuel blockade of Mali, from September 2025, targeted tankers on the Senegal-Mali route, and trucks were burned on it. Senegal can guard its
    own trucks but cannot end the blockade (our reading).
  it: ''
- hash: f761f778
  kind: cards
  en: Ending all foreign military presence was meant to show sovereignty (announced December 2024, completed July 2025), but the Dakar-Bamako road that Senegal still depends on is where trucks were burned
    in 2025. The exit from France's security role did not end Senegal's exposure to the Sahel war.
  it: ''
- hash: 257dabe8
  kind: cards
  en: 'Senegal''s grand strategy is to turn a debt crisis and a new oil and gas economy into sovereignty: it ended all foreign military presence, keeps the Dakar corridor to Mali open, and is rebuilding
    its IMF deal while reprofiling rather than formally restructuring. The binding constraint is the debt that the hidden-debt revelation exposed, which turns each lever (IMF approval, arrears, the new
    oil and gas revenue) into a condition rather than a choice. Not verified in this pass: the 2026 Faye-Sonko rift, the US aid cut and MCC, China''s 2024 upgrade, the EU fisheries agreement, Russia, Turkey
    and the Gulf, the 2025 Casamance peace and the Thiaroye memory.'
  it: ''
- hash: e20d7d6d
  kind: cards
  en: 'Stay sovereign and free to choose: a region not dominated by one power, rules that ''apply equally to all'' (the small state''s only shield), and no forced choice between Washington and Beijing.
    Wong, April 2025: for a small open economy the global shifts are ''deeply worrying''; September 2025: Singapore wants to engage all major powers and not be ''forced to choose sides''.'
  it: ''
- hash: 67d37981
  kind: cards
  en: 'Make itself useful to both great powers without being used by either: lodge US forces under the 1990 MoU (renewed in 2019 for 15 years, to about 2035) while China stays the first trading partner
    under the 2023 ''all-round high-quality future-oriented partnership''. Balakrishnan, April 2026: ''We will be useful, but we will not be made use of.'''
  it: ''
- hash: b621fbe0
  kind: cards
  en: 'Protect the open trading model - entrepot, chips, pharmaceuticals, finance - from tariffs and decoupling: negotiate US exemptions (pharmaceuticals and semiconductors were outside the 10% baseline
    and the Section 122 tariffs, pending Section 232), keep access to high-end AI chips, and stack free-trade and digital agreements (EU, India, Japan) as insurance.'
  it: ''
- hash: c85a2bf5
  kind: cards
  en: 'Buy or build what the island lacks - water, gas, land to train on - by contract and diversification: Johor water to 2061 while NEWater and desalination grow, pipeline gas from Malaysia and Indonesia
    plus LNG from several suppliers, and SAF training areas in Australia, the United States and Taiwan.'
  it: ''
- hash: c10a08f9
  kind: cards
  en: 'Renew the domestic bargain that makes the strategy possible: the PAP won 65.57% of the vote and 87 of 97 seats on 3 May 2025, Wong''s first election after succeeding Lee Hsien Loong in 2024, while
    the resident fertility rate fell to 0.87 in 2025.'
  it: ''
- hash: 854fca81
  kind: cards
  en: 'A ladder of partnerships with everyone: China (2023 all-round high-quality future-oriented partnership; Xi received Wong in Beijing in June 2025 and Li Qiang visited in October 2025), India (comprehensive
    strategic partnership, September 2024), Vietnam (comprehensive strategic partnership, March 2025), Australia (CSP 2.0, October 2025), Japan (strategic partnership, March 2026), the EU (free-trade agreement
    2019, digital trade agreement in force 1 February 2026).'
  it: ''
- hash: 32d750dd
  kind: cards
  en: 'A small, high-tech, expensive armed force: defence budget about S$24.93bn in 2026 (+6.4%), held near 3% of GDP, 20 F-35s ordered for about US$4.06bn (first four due from late 2026), overseas training
    areas because the island is too small (Australia, the United States, Taiwan), and the FPDA with Malaysia, Australia, New Zealand and the UK as a consultative frame.'
  it: ''
- hash: 89173b88
  kind: cards
  en: 'Sovereign capital and a financial centre used as an instrument: Temasek''s portfolio stood at S$518bn at 31 March 2026 (20-year return 6.8%), GIC''s 20-year real return was 3.4% (down from 3.8%),
    and the government''s net investment returns fund part of the Budget. The same centre carried the 2022 sanctions on Russian banks and crypto channels, and is the venue of the AI-server fraud prosecutions.'
  it: ''
- hash: e7127f07
  kind: cards
  en: 'Water: the 1962 Johor River agreement runs to 2061 (up to 250 million gallons a day), and the 1990 agreement also to 2061; Singapore''s plan is to replace imports with NEWater and desalination, but
    until then the tap sits in another state. Wong, January 2025: water is ''not a pressing issue'' but yield and quality of the Johor River are a shared interest; the Joint Technical Committee keeps working.'
  it: ''
- hash: 9ae07416
  kind: cards
  en: 'Energy: no domestic fuel. Gas generates more than 90% of electricity; in 2025 piped gas from Malaysia and Indonesia was 43% of gas imports and LNG 57%, of which Qatar about 47%. QatarEnergy declared
    force majeure on 4 March 2026 and Singapore bought replacement cargoes through 2026; the Indonesian pipeline contracts end by 2028 and the Malaysian ones may end by 2027.'
  it: ''
- hash: 592fb532
  kind: cards
  en: 'Demography: resident fertility fell to 0.87 in 2025 (0.97 in 2024); the citizen population could shrink by the early 2040s; 21.4% of citizens are 65 or older, and non-residents (1.98 million of 6.21
    million people in June 2026) fill the labour gap that the model needs.'
  it: ''
- hash: 3a11244c
  kind: cards
  en: 'Size and depth: no natural resources, no hinterland, and not enough land, sea or airspace to train a modern force, which is why the SAF trains in Australia, the United States and Taiwan - and why
    each of those hosts holds a lever.'
  it: ''
- hash: 4013fd2e
  kind: cards
  en: 'The US-China technology war: Washington presses on AI-chip diversion (Commerce Secretary Lutnick raised export controls with Trade Minister Gan in 2025), the US baseline tariff has been 10% since
    April 2025 with a 15% rate announced in February 2026 but not yet directed in March, and Beijing-linked cyber operations against Singapore''s critical infrastructure (UNC3886, July 2025) test the line
    between the two.'
  it: ''
- hash: 84a8fb2e
  kind: cards
  en: Indispensability is the exposure. The more Singapore lodges both great powers in its economy and its bases - US access at Changi and the F-35s, China as first trading partner and a rising source of
    investment - the more each can demand and the more it loses when they collide. Wong foresees US-China trade grinding to a halt and warns of a miscalculation over Taiwan; Balakrishnan calls Hormuz a
    possible dry run for the Pacific. The small state that cannot choose is the first to be squeezed when choosing is forced.
  it: ''
- hash: 4faa04fd
  kind: cards
  en: Solving the land problem abroad creates levers at home. The SAF trains in Taiwan (since 1975), Australia and the United States because the island is too small; when Hong Kong customs seized nine Terrex
    vehicles returning from Taiwan in November 2016, Beijing used the training as a diplomatic weapon and the vehicles were returned only in January 2017. The more of the force lives overseas, the more
    its hosts - and the hosts' enemies - hold a hostage.
  it: ''
- hash: 381b30c8
  kind: cards
  en: The rule that protects the small state binds its own hand. Singapore sanctioned Russia in 2022 because it 'cannot accept' violations of sovereignty and territorial integrity - and was put on Moscow's
    list of unfriendly states within days - yet Israeli defence firms exhibited at its Airshow in 2024 and 2026 while its foreign minister called Israel's Gaza conduct 'unconscionable'. Applying the principle
    equally is costly; applying it selectively weakens the claim that rules should apply equally to all.
  it: ''
- hash: 32bb0942
  kind: cards
  en: 'Singapore is Luttwak''s small state that cannot win a contest of weight and so plays

    the other game: it makes itself indispensable to everyone. It lodges the American navy

    at Changi, buys American F-35s, trades more with China than with anyone, signs a

    partnership with every capital that matters and keeps a budget near 3% of GDP for a

    force that trains on other people''s land. The logic is sound while the great powers

    compete at a distance; it inverts when they collide, because the state that served

    both is the first place where each can be denied to the other (the chip diversion

    cases and the cyber intrusion are early tremors). Wong''s doctrine for a disordered

    world is to say so openly - rules for all, no forced choice, ''useful but not used'' -

    and to spend the political capital of a 65.57% mandate on shock absorbers: stored

    wealth, replacement LNG, a 2061 water horizon and a Johor zone that turns the

    neighbour from a lever into a stakeholder. What the strategy cannot fix is the

    arithmetic underneath: a fertility rate of 0.87 and a labour force that must keep

    arriving from abroad.'
  it: ''
