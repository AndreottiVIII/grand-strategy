  reading: |
    Vanuatu is a small Pacific state that wins where size counts least: at the UN and the ICJ, where its campaign produced the July 2025 advisory opinion and the May 2026 resolution. Its binding limits are money and sovereignty: it needs Chinese and Australian finance, so it bargains over clauses (no foreign base, consultation rather than a veto) instead of aligning, and its coalitions change often enough to stall treaties. Open items: whether the Luganville wharf loan carries a debt-for-equity clause (the sources conflict), the text of the Namele agreement, the status of the Peace Corps programme, and the earthquake recovery after late 2025.
