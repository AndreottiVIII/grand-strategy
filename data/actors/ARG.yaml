      text: "Stabilise the peso and roll the debt over without default, with two large external lifelines: a USD 20bn IMF Extended Fund Facility approved in April 2025 (SDR 15.267bn) and a USD 20bn Treasury currency swap announced on 9 October 2025 and signed on 20 October 2025. The IMF second review of May 2026 reports about USD 15.8bn disbursed under the arrangement (USD 1bn at that review), although the end-December reserves target was missed. Milei said the swap could cover 2026 foreign-currency debt payments if markets did not refinance. Update of 2026-10-16: Treasury reported that Argentina drew USD 2.5bn of the swap in the fourth quarter of 2025 and had repaid it by 9 January 2026, so the swap is a backstop that was used once, not a standing loan."
