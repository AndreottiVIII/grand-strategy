    - text: "The Mercosur bloc limits what Milei can do alone. Brazil's Lula has clashed with Milei repeatedly and skipped the Asuncion ceremony for the EU deal; Brazil and Argentina contest the bloc's direction at the June 2026 summit. Our reading: a bilateral US deal sits uneasily inside a bloc with a common external tariff (C)."
