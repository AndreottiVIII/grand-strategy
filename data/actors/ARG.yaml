    - text: "The China trade and the American alliance pull in opposite directions: Beijing buys Argentine soybeans, beef and wheat and holds a swap line of more than USD 19bn, while the US rescue was announced with its own interest in the trade. The renewal of the China swap in August 2026 shows that the government needs both. Our reading (C), not a source's word."
