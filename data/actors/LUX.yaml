    - text: "The defence bill grows faster than the budget can carry: the Conseil national des finances publiques estimated the extra cost of the path to 5% by 2035 at EUR 13.4bn, with spending rising from EUR 1.18bn in 2025 to EUR 4.63bn in 2035. The 2% benchmark is measured on GNI, which is smaller than GDP and so lowers the bill."
