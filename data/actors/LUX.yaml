    - text: "Dependence on commuters and on neighbours' nuclear policy: about 47% of salaried workers are cross-border (129,000 from France, 52,000 from Belgium, 51,000 from Germany), and the government's push to close the Cattenom plant in France and the Tihange and Doel plants in Belgium is pursued against the states whose workers it needs."
