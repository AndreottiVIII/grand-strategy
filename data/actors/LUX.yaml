    - rank: 3
      text: "Meet the NATO spending benchmark cheaply and with an economic return: 2% of GNI was claimed for 2025 (brought forward from 2030 by the State of the Nation of May 2025), and the government now plans 2.3% of GNI by 2029, with the satellite capacity bought from a joint venture with SES rather than foreign hardware."
