      text: "Keep the financial centre and the EU seats in Luxembourg: the Court of Justice and the European Investment Bank are seated there, Eurostat has a directorate in the city, and foreign banks (Chinese ones among them) use the Grand Duchy as their European hub. Every security choice is measured against what it does to that base."
