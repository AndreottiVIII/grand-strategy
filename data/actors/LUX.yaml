      text: "Financial services as an instrument of statecraft: an EU passport for foreign banks (Bank of China and ICBC branches; ICBC designated renminbi clearing bank for Luxembourg), the SES satellite operator and the custody of securities (Clearstream), which gives the state a lever on capital flows and on the Russian assets held in the country."
