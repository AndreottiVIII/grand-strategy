    text: 'Take the state in Khartoum by force and replace the army-led government with its own. The RSF built a parallel Government of Peace and Unity (charter signed in Nairobi in Feb 2025, announced by Hemedti on 15 Apr 2025, seat Nyala). On 22 Sep 2026 Reuters reported Hemedti telling his troops that the time for fighting had come. The aim is the state, not a truce: its humanitarian truce of 6 Nov 2025 was a tactical pause.'
