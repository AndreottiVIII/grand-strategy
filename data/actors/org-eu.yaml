  reading: 'The Union acts as a grand strategist only by accident. It has no army, no single voice and no budget that anyone loves; what it has is a market, a rulebook, a currency and the right to say yes
    or no to its neighbours. Read through Luttwak, that is a strategy of the second level: it exports order by attraction (enlargement, association, Growth Plan money, visa-free travel) and by exclusion
    (sanctions, frozen assets, trade defence), and it moves only when 27 governments consent. In 2026 the logic of consent has hardened into a posture: Russia is the declared threat, the United States has
    become a ''necessary partner'' that cannot be left and cannot be trusted, China is a rival managed through quotas and licences, and the neighbourhood is a queue. The paradoxes all come from the same
    root - the Union is strongest where its rules are least contested and most exposed where it needs speed. It has just shown it can finance a war (EUR 90bn), outlast a spoiler (Orban''s defeat on 12 Apr
    2026) and ban a fuel (Russian gas), and it still cannot appoint an envoy, use the assets it froze or guarantee its own borders without Washington. The reading for the next year is whether the Ankara-era
    bargain - a more European NATO, a Union that pays - turns into capacity, or whether the 2028-34 budget, the Turnberry steel clause and the Hungarian reversal are only a pause.'
