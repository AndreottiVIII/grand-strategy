    - text: "No route into the EEA. Membership is open only to EU and EFTA members, and the Commission's 2013 report judged small-state participation not viable at present. The single-market access that Liechtenstein has through the EEA must therefore come from a bilateral Association Agreement, which is slower and still unratified."
