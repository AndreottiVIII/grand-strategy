      text: "Turn the Association Agreement with the EU into a single-market deal without full membership. The Council authorised its signing on 16 July 2026, signing is expected in late September 2026, the European Parliament must still consent, and the government has promised a referendum on a text that polls split almost evenly. The EU is the only route to market access beyond the two neighbours."
