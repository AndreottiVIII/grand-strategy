      text: "Customs union with the EU since 1 July 1991, which treats manufactured goods as inside the union, and the euro as currency under a monetary agreement signed in 2011 and in force since 2012, with Andorran euro coins issued from 2015. Both are the instruments that let a state without its own currency or tariffs trade and sell."
