    - rank: 2
      text: "Keep the co-principality and the two neighbours as the frame of the state. The French president and the Bishop of Urgell share the head of state under the constitution, and France and Spain are the only land routes in and out. Security, mobility and visas are run with them: the 2003 Franco-Spanish-Andorran convention coordinates visa and residence rules, and in June 2026 Andorra signed a 2026-2030 work plan with Catalonia on airport hours and mobility."
