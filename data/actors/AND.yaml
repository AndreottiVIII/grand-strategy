      text: "Multilateral presence far above its size: a full UN member since 1993, with the Council of Europe and the OSCE as its European forums. It buys visibility with small voluntary contributions, such as EUR 10,000 to the Council of Europe Action Plan for Ukraine signed in June 2025, and with humanitarian grants routed through international agencies."
