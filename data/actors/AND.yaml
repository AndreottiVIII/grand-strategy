  reading: |
    Andorra borrows its security and its mobility from the two neighbours that are also its co-princes, and sells tourism and duty-free shopping inside a customs union with the EU. Its structural problem is that the banking side, which paid for much of the state, now has to meet EU and US standards to keep market access, and the Association Agreement is the price of that access. Monaco stalled in 2023 while Andorra and San Marino went on, so the microstate track is not a fixed club; the 2026 signature and the referendum that follows are the test.
