grand_strategy:
  objectives:
    - rank: 1
      text: "Make an attack on Latvia unthinkable by keeping allied troops on its soil and the US-led Article 5 guarantee credible: the Canadian-led NATO Multinational Brigade at Adazi (about 3,000 soldiers, 3,500 for exercises, Canadian presence confirmed until 2031) is the tripwire that Latvia's own army cannot replace."
