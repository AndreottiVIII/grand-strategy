      text: "Cut the physical and economic ties to Russia and Belarus: no Russian gas since 2023, desynchronisation from the Russian grid in February 2025, imports from Russia down 68% in 2025 (EUR 125.6m), a ban on a widening list of Russian and Belarusian goods from 1 September 2026, and a shut Silene crossing with Belarus."
