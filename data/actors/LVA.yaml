    - rank: 2
      text: "Build a national defence that raises the price of aggression: a 2026 defence budget of EUR 2.16bn (4.91% of GDP, target 5%), conscription restored in 2023, six HIMARS and IRIS-T air defence ordered, and the Baltic Defence Line on the eastern border (EUR 303m over five years)."
