    - rank: 5
      text: "Close the gap between a state of 1.9 million people and the cost of its security by using the EU and the Nordic-Baltic neighbours as force multipliers: SAFE defence loans (EUR 3.49bn requested and approved), Rail Baltica as a military-mobility corridor, joint procurement and a Baltic Regional Military Mobility Area."
