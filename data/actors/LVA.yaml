  paradoxes:
    - text: "The border that was sealed became a transit lane under siege. The Belarus barrier was finished in 2024 and Silene is closed, yet attempts rose to about 10,000 in the first eight months of 2026 (12,046 in all of 2025) and moved underground: two tunnels in August 2026. Latvia is not a destination, so it spends its scarce guards stopping people bound for Lithuania and Germany, and Minsk, which gains from the pressure, loses nothing by it."
