    - domain: informational
      text: "Counter-intelligence and public exposure: the State Security Service (VDD) publishes the Russian and Belarusian threat in detail (annual report of February 2026 names Russian services the main threat, with Belarusian and Chinese services also flagged), prosecutes sabotage cells recruited from ex-convicts and the drug-dependent, and screens Russian citizens' residence through the language exam."
