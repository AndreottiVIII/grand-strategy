    - rank: 3
      text: "Russia must not win in Ukraine, and the Russian threat must be contained for a generation: military aid of 0.25% of GDP a year (almost EUR 1bn since 2022), co-leadership with the UK of the Drone Capability Coalition, and the use of frozen Russian assets for Ukraine."
