      text: "Ballistic and cruise missiles, drones, explosive boats and, from 2025, sinking of merchant ships (Eternity C, July 2025); a ground arm that takes mountains over the coast, uses local fighters first and elite units after, and children in 'human waves'; amphibious drills on the Hudaydah coast in late 2025. In 2026 the targets moved from Israel to Saudi Arabia: Abha, Jazan, Yanbu, Najran, King Khalid airport in Riyadh (10 October 2026, 13 killed). On 25 and 27 October the attacks came back to Riyadh and the south: the coalition said it intercepted a ballistic missile aimed at the capital and ten ballistic missiles fired toward the south (25 October), and debris from two downed missiles damaged a building, a construction site and a car in Riyadh (27 October, no casualties). Armed with Iranian supply and, by Yemeni government accounts, direct IRGC guidance."
