    - rank: 1
      text: "Keep and consolidate one-group rule over Sanaa and the populous north (the Houthis have held the capital since September 2014): no power-sharing that dilutes it, no return of the Presidential Leadership Council to Sanaa. The 2023 Saudi roadmap was acceptable only because, in the reading of Sana'a Center analysts, it would have left the Houthis in unilateral control of the north."
