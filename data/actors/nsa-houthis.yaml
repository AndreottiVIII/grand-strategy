    - rank: 5
      text: "Be the Arab front of the 'axis of resistance' and, with Hezbollah broken and Iran bruised, its centre of gravity: attacks on Israel 'in support of Gaza' (2023 - October 2025, resumed on 28 March 2026 in the Iran war), a growing presence in Iraq and Lebanon, training of allied militants from Sudan to Iraq, ties with al-Shabaab. The aim is status and leverage, not a mandate from Tehran: analysts stress the decision to act is the Houthis' own."
