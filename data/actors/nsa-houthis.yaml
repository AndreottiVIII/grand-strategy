        - {url: "https://sanaacenter.org/publications/perspectives-and-analyses/26607", title: "The Iran War is a Defining Moment for the Future of the Houthis", publisher: "Sana'a Center for Strategic Studies", date: 2026-03-11, tier: 2}
    - rank: 6
      text: "Keep Iran as patron but not as master, and widen the circle of backers: China and Russia (contacts on ship passage, 2026), Oman as window and mediator, and the tribes at home. The group is 'fiercely nationalist and protective of its autonomy', and Iran may trade it away in a deal with Washington, so the hedge is structural."
