    - rank: 2
      text: "Turn military leverage into a settlement with Riyadh on Houthi terms: an end to what Sanaa calls the Saudi 'blockade' (airspace, ports, banks), payment of public salaries from a share of Yemen's oil and gas revenue, the roadmap of 2023, and in effect tacit recognition as Yemen's government in the north. The July 2026 escalation was read by Sana'a Center experts as a bid to close this deal before any US-Iran settlement."
      confidence: B
