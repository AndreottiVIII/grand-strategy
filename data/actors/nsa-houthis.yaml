      text: "A centralised extraction system run since 2014: taxes, customs, zakat, endowment revenue, fuel sales, 'war effort' levies. The Mokha Center put the parallel economy at about USD 2.5bn a year (USD 800m taxes and customs, 600m fees and levies, 300m war contributions, 100m mobilisation events, 700m indirect costs to business); the Sana'a Center reports 4,225 trade agencies stripped of licences in 2026 in favour of affiliated firms. The US Treasury alleged in January 2026 that Iranian oil, partly free of charge and routed through Dubai companies, earns the group over USD 2bn a year; the Houthis deny it. Hudaydah and Al-Salif ports (hit by Israel in 2025) remain the gate, with clandestine landings along the coast."
