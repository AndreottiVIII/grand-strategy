  paradoxes:
    - text: "The deal they wanted died of the pressure that was meant to win it. Sana'a Center experts read the July-October 2026 escalation as a bid to force Riyadh back to the 2023 roadmap before a US-Iran deal; the result was Riyadh's switch 'from containment and negotiated roadmaps to sustained pressure' (a Saudi-organised naval coalition, a doubled arms flow, air strikes on Sanaa airport, and on Mocha according to Houthi media), and the roadmap is, in the Sana'a Center's words of April, 'no longer viable'. The harder they hit the Kingdom, the less it can pay. The fighting reopened in October: Houthi missiles at Riyadh and the south, and a Saudi airstrike on an Al-Jawf market on 28 October that killed 14 civilians (AP), while the coalition statements name no goal beyond the interceptions (Al Jazeera, 25 October)."
