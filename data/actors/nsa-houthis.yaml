    - rank: 3
      text: "Take the rest of Yemen that matters: the Red Sea coast (done, 3-11 September 2026: Mocha, Dhubab, Mayyun/Perim, the Hanish islands), then Taiz city and Marib with its oil and gas. Against it the government's Operation Dawn (4 October 2026) and the Saudi air campaign are the first serious attempt since 2022 to push them back."
