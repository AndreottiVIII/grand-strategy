    - rank: 4
      text: "Own the terms of passage through Bab al-Mandab. After the Gaza-justified campaign of November 2023 - 2025, the 2026 aim is a permanent chokepoint position: a Hudaydah coordination centre that claims exclusive authority over ship dealings (statement of 1 August 2026), a blockade declared on Saudi Arabia (20 July 2026), assurances to China and Russia that their ships are safe, and Mayyun island in the middle of the strait."
      confidence: B
      sources:
