    The Gambia is small and dependent: its post-2017 order rests on Senegal, and its best-known foreign instrument is the ICJ case against Myanmar, which gives a small state a voice in The Hague. The older diplomacy (the 2016 switch from Taipei to Beijing, and the 2017-2018 Commonwealth return) is sourced here only at the level of the event, not of the lasting ties. Not verified in this pass, and therefore not in the card: the 2026 presidential election and the third-term question, the TRRC and Jammeh's legacy, the EU and migration deals, Turkey and the Gulf, ECOWAS and the ECOMIG force, and the Senegal ferry and bridge.
