  reading: |
    Kiribati plays the great powers against each other: it switched recognition from Taipei to Beijing in 2019, takes Chinese naval and police help, and still depends on Australian and New Zealand ties and on the fees foreign fleets pay for tuna. The Maamau government's bet is on the sea, reopening the Phoenix Islands reserve to fishing, and the sources give that revenue only as government figures, so the bet is hard to test. The sharpest exposure is the patrons: the policing dispute with Canberra and the visit row with Wellington show that Chinese help costs goodwill exactly where the aid and the ties come from.
