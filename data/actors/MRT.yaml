  reading: |
    Mauritania is paid to be a border: Europe buys its enforcement against migrants heading north, while the Malian crisis puts about 150,000 refugees on its eastern side. Its UN votes follow a conventional line, with yes on the 2022 Ukraine aggression resolution and abstention on the 2025 peace text. The card is thin: the 2024 Mali border incidents, the Morocco and Algeria dossiers and the China, US, Russia and Gulf positions remain open gaps.
