  reading: |
    Guinea-Bissau's strategy is to run a military-led transition on its own timetable, with a presidency strengthened for whoever wins the December vote, in a state too weak to police its own coast. Its outside links are narrow: a suspended ECOWAS seat, a Portuguese channel the junta has just rejected, and a Senegalese neighbour that co-leads the mediation. Gaps: Russia's 2025 contacts, the ECOMIB withdrawal, the Casamance rear (our inference, not sourced here) and any current cashew or cocaine figure are not verified in this pass.
