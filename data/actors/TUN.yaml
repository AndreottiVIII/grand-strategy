  reading: |
    Saied has turned Tunisia's presidency into a regime that tries its opponents, and it pays for its survival with the two things its neighbours and Europe will buy: migration control and a gas and credit line from Algeria. Refusing the IMF keeps the subsidies but leaves the state on bilateral money, so Tunis sells services rather than alignment. Its Libya, Italy and China ties repeat the same bargain, with each buyer getting one service and none getting a seat at the core.
