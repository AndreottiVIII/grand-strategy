  paradoxes:
    - text: "A foreign-policy identity that does not outlast the election. Golob's government spent the UN seat, the 2024 recognition of Palestine and the 2025 entry bans and arms embargo on Israel to make Slovenia a principled voice; within six months of the seat's end Janša's government let the embargo lapse, lifted the bans and took the Palestinian flag off the government building, so the capital built on the seat is partly spent and Slovenian policy reads as a pendulum rather than a line."
      confidence: B
