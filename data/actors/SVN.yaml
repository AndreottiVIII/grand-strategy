    - text: "Betting on a patron who fell. Janša, a close ally of Viktor Orbán (whose circle financed Slovenian right-wing media, per RSF), returned to office a month after Orbán lost the April 2026 Hungarian election to Péter Magyar; the Hungarian axis that was to shield Ljubljana in the EPP and the Council is gone, and the Israel line now costs him a hearing in Berlin."
