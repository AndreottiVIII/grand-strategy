      text: "Buy security at the lowest domestic price inside NATO and the EU: after being the alliance's laggard (a 2025 parliamentary vote on spending, then Golob's threat of a NATO-membership referendum), Janša's government has committed to reach 2% of GDP in 2026 and the NATO path of 3.5% core defence by 2035."
