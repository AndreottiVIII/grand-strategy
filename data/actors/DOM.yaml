  reading: |
    Santo Domingo treats Haiti as a border to be fenced and policed rather than a neighbour to be governed, and it pays part of its security bill with Washington, which thanks it publicly and sets the agenda. The wall, the troops and the tougher penalties are the visible answer to the crisis next door, while the mission that might end that crisis runs on other countries' contingents. Confidence C throughout: the sources read cover the 2025 measures, the February 2025 visit and the 2026 mission rotation, not yet the economy, Spain, the EU, China or the Caribbean bloc.
