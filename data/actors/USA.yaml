    text: >-
      Primacy in the Western Hemisphere - the 'Trump Corollary' to the Monroe Doctrine: deny non-hemispheric
      competitors forces, ports and 'strategically vital assets', control migration and the cartels with lethal
      force, hold the Panama Canal, Greenland and the 'Gulf of America' as key terrain, and 'enlist' aligned
      governments (the Shield of the Americas, Doral, 7 Mar 2026). The 2026 National Defense Strategy ranks the
      homeland and the hemisphere above the Indo-Pacific; the seizure of Maduro on 3 Jan 2026 is read by Carnegie
      and CFR as the doctrine's first implementation.
