  reading: >-
    The United States in October 2026 runs the most explicit grand strategy it has published since the
    Cold War, and the one most at odds with its own means. The ends are written down: a hemisphere
    held under a Trump Corollary, trade rebalanced by tariff, China kept a rival 'within bounds',
    Europe's defence handed to Europeans, the Middle East managed without forever wars, migration
    ended. At the technical level the instruments work - the border is quieter than in fifty years,
    allies have pledged trillions and 5% of GDP, Maduro sits in a Brooklyn cell, Khamenei is dead.
    At the level of grand strategy the picture inverts, as Luttwak says it must when a strategy
    succeeds: coercion used on everyone reached its culminating point in a year (Davos, Spain, the
    Supreme Court), the allies who paid became hedgers, the war of choice against Iran consumed the
    year that was reserved for the hemisphere and China, and the hemisphere itself produced a
    Venezuela that Washington now administers. Three signals that are not rows: the NDS never names
    Taiwan; the USMCA was left unrenewed on 1 July without any plan for what follows; and the same
    government that sanctioned Rosneft is buying Russian diesel. Washington's stances read accordingly:
    two adversaries (Iran and Hamas), fifteen rivals of which the two it talks to more than to its allies are China and Russia, and a ring of
    treaty allies graded reluctant not because they resist the alliance but because Washington does -
    the first great power in the atlas whose friction with its allies is mostly its own.
