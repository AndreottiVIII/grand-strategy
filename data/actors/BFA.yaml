  reading: |
    Burkina Faso's grand strategy is sovereignty by rupture: it has left ECOWAS and France, built a confederation with Mali and Niger, and taken Russian instructors to guard the regime while the state takes over the gold mines to pay for the war. The ruptures buy autonomy at the cost of the channels that once held its security and its capital, and the mine takeover frightens the investors that the mines need. The war against JNIM is the test that the sovereignty doctrine has not yet passed, and this card rests on 2024 to mid-2026 sources without verified 2026 battlefield data, so the transition timetable and the 2025 US aid cut are not confirmed here.
