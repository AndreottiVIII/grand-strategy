    - text: "No regional or Western cover. The three juntas left ECOWAS, which asked that their passports stay recognised and their citizens keep visa-free rights only until further notice. The exit removes the bloc's mediation, its financing and its legitimacy from the security problem. Our reading: what remains is bilateral money and the Russian guard, both of which are hard to sustain without a trade outlet."
