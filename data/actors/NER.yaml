    - text: "The guard that cannot hold the gate. The Africa Corps protects the capital and its airport, yet the ISSP attack on Niamey airport in January 2026 and JNIM's raid in June 2026 both reached the same airport, which hosts Air Base 101 and the Russian force, and ISSP killed dozens of soldiers in the bases of Inates and Banibangou. Russia's protection is for the capital; the war is in the provinces."
