  reading: |
    Niger's junta has traded the old French security partnership for a Russian guard and a regional bloc of juntas, and it has tried to pay for its isolation by taking the uranium and the oil out of foreign hands. Its two real problems are geography and war: a landlocked state whose only outlets run through Benin and the Nigerian frontier, and a Tillabéri border where JNIM and the Islamic State's Sahel province strike the bases and the capital's airport. The paradox is that each act of sealing the state off, from the Benin border to the ECOWAS exit to the expulsions, shrinks the outlets the uranium and the oil need, while the Russian guard protects the capital and not the provinces where the state is losing. Luttwak's reading is a regime that chose isolation as a defence and must now buy its way back out through partners it has already expelled.
