  paradoxes:
    - text: "Sealing the state off as a defence, then buying the way out. The Benin border closure, kept on the Nigerien side even after ECOWAS lifted its sanctions, was meant to punish a neighbour; it cut the state off from its only sea route and from its own pipeline revenue, and the reopening Niamey now negotiates is the price of that isolation."
