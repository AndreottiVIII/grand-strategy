    - text: "Taking the mine from Orano turns a French asset into a court case. The junta answers Orano's 86.3 per cent of output with a nationalisation and a sovereign win at home, but Orano replies with arbitration and lawsuits, so the state must now defend a mine it runs in courts abroad and at home."
