grand_strategy:
  objectives:
    - rank: 1
      text: "Hollow out the Bosnian state from inside and recover for the entity the competences transferred to it since 2000 - army, border police, intelligence, the indirect-tax system and the judiciary - while ending the High Representative's role; the formal aim is 'Dayton as originally written', the working aim is a status of the entity that Banja Luka, not Sarajevo or the OHR, defines. The RS Assembly's declaration of 7 July 2026 says so in terms."
