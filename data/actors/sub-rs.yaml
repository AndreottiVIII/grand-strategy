    - text: "Belgrade's support is real but bounded: Vucic called the verdict 'a destabilising factor' and said Serbia 'stands by Republika Srpska', but Serbia's formal line is respect for Dayton, it has not backed secession, and Serbia's own EU path and its Washington channel both depend on not owning a Bosnian secession."
      confidence: B
      sources:
