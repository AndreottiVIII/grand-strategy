    - text: "The foreign garrison is not Banja Luka's to dismiss: EUFOR Althea (Chapter VII mandate, renewed unanimously on 31 Oct 2025, due again by 31 Oct 2026) received about 300 reserve troops in March 2025 when the Dodik crisis worsened, and Germany's Bundestag approved its participation again on 11 Jun 2026."
