    - rank: 2
      text: "Keep SNSD and Milorad Dodik in command of the entity whatever the courts rule. Dodik was convicted (26 Feb 2025), removed from the presidency by the Central Election Commission (6 Aug 2025) and barred from office for six years, yet his candidate Sinisa Karan won the snap presidential election of 23 Nov 2025 and the 8 Feb 2026 rerun, and on 4 Oct 2026 SNSD kept the entity (Savo Minic elected RS president) with Zeljka Cvijanovic re-elected to the state Presidency."
