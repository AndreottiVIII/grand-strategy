  constraints:
    - text: "The legal cage: the entity's powers come from the Dayton constitution, and each attempt to exceed them has been undone - the Constitutional Court suspended the laws of 27 Feb 2025 on 7 March and annulled them on 29 May; the State Court verdict was upheld on 1 Aug 2025; the CEC removed the president; the Assembly repealed the laws on 18 Oct 2025. The Security Council reaffirmed Bosnia's territorial integrity on 29 Dec 2025."
      confidence: A
      sources:
        - {url: "https://www.securitycouncilreport.org/monthly-forecast/2026-05/bosnia-and-herzegovina-15.php", title: "Bosnia and Herzegovina - May 2026 monthly forecast", publisher: "Security Council Report", date: 2026-05, tier: 2}
