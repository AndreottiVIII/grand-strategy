  paradoxes:
    - text: "Every secession threat strengthens the state institutions that react to it. The laws of 27 Feb 2025 that banned the State Court, prosecutors and police from the entity drew the Constitutional Court's suspension and annulment, a reinforcement of EUFOR by about 300 troops, German and Austrian entry bans, a funding cut to SNSD by the High Representative, and a Security Council statement on territorial integrity - and in the end the Assembly repealed the laws itself on 18 Oct 2025. The entity left the exchange with a precedent that the state can execute a verdict against its president."
