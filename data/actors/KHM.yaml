  reading: |
    Cambodia runs a dynastic strategy: Hun Sen's Senate presidency and his son's premiership work as one system, and the state's currency is access, Chinese capital and naval facilities on one side and the scam-centre crackdown on the other. The paradox is that the money that built the state (Chinese credit, scam revenue) also gives Bangkok a pretext for strikes and gives Washington grounds for sanctions. Its real test is whether the border ceasefire, with Malaysia and the United States as brokers, can hold while Chinese debt and the Ream base keep Phnom Penh tied to Beijing.
