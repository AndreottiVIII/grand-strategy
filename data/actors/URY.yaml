    text: "Sell beef and other goods to China on better terms: the government in 2023 sought a bilateral free trade agreement with Beijing, because Uruguayan beef faced a 12% tariff there against 0% for New Zealand. Orsi's own line on China was not read in this card; the sourced push is from the Lacalle Pou government, and its continuation under Orsi is our reading (C)."
