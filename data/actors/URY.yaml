  - text: "Mercosur membership as the frame for every trade move: Uruguay is a full member and pushes the bloc to let members negotiate bilateral deals, while the EU agreement is the bloc's shared gain. Membership is recorded from the Mercosur member list (dataset row, tier 1)."
