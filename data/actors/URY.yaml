    text: "Hold the EU-Mercosur partnership on course: Uruguay ratified it on 26 February 2026, and the interim trade part has applied provisionally since 1 May 2026 with Argentina and Uruguay as the ratifying members. The deal is the market Montevideo needs beyond China and the one Brazil and Argentina share with it."
