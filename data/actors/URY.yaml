  reading: |
    Uruguay is a small, open economy that sells beef, cellulose and soy mostly to China and depends on Mercosur for its legal frame and for the EU deal that the bloc signed together. Its strategy since 2022 has been to push the bloc towards flexibility so that it can sign its own China deal, and Argentina, Brazil and Paraguay have answered by opposing it. This card rests on tier 3 and 4 sources; the Orsi government's own line on China and on the United States was not read, and the US partner row is a gap logged in the JOURNAL.
