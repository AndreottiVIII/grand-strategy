  reading: 'Sweden after 2022 runs the strategy of a small, rich, technologically capable state that has given up the protection of neutrality for the protection of numbers, and is spending to make the swap pay. The organising idea is the Baltic as a NATO lake: Finland, Poland and Denmark are treated as one theatre, the Gripen, the A26 and the CV90 are the instruments of alignment as much as of defence, and the United States is kept inside the system by treaty (the DCA) while Europe is built up for the day it steps back. The Luttwakian pattern is that every step that raises Sweden''s value to the alliance also raises its exposure and its bills (the front-line host, the donated Gripens, the loans behind 3.5%), and that the bargains that bought the membership (Turkey, Hungary) taught others that a veto has a price. Two signals are not rows. First, the 13 September 2026 vote ended the Tidö era without producing a successor: the next government will probably keep NATO, Ukraine and the 3.5% target (all large Riksdag majorities) but will change the Israel line and perhaps the EU budget posture, so the card''s stability is higher on security than on foreign economic policy. Second, the brief''s ''Ukraine 100-year partnership'' is not in the record: Sweden''s agreement with Ukraine is a ten-year security agreement of May 2024; a 100-year format belongs to the United Kingdom. The Kurdish question behind the accession has faded from the news but not from the memorandum Ankara still holds.'
