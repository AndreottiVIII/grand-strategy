  reading: |
    Angola's grand strategy is to turn oil money and a continental chair into a regional and Western role while the Chinese loans of the last two decades are paid down. Its tools are the AU presidency, the Luanda venue and the Lobito corridor, and its limits are the oil output that fell from 1.42 to 1.1 million barrels a day and the 2025 fuel riots, which show how little room subsidy reform has. Not verified in this pass: the Soviet-era legacy and the cooling with Moscow, the 2027 succession, the Trump-era posture beyond the Lobito funding, the Zambian trend (the ZMB card reads warming, not carried here), and diamonds as an export, all of which need their own sources.
