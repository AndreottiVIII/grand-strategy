    - text: "The oil-backed loans are still being paid and new ones are sought. Owed to China, the oil-backed debt falls as output does, and in February 2026 Sonangol was reported to be seeking a USD 4.8bn Chinese loan for a refinery at Lobito: the state still borrows against oil while it says it wants less of it."
