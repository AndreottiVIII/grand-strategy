      text: "Use the African Union chair and the Luanda process to make Angola the broker of Central Africa's wars. President Lourenco chaired the AU in 2025. Angola ran the DRC-Rwanda talks from the 2022 Luanda Roadmap and in March 2025 announced it was stepping back as mediator to focus on the AU presidency. It tried to return in February 2026 with a ceasefire proposal that the M23 rejected."
