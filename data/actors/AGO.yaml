      text: "The AU chair and the Luanda venue. Lourenco chaired the African Union in 2025, and Luanda hosted the 2022 DRC-Rwanda roadmap that de-escalated tensions. The mediator's chair was given up in March 2025, so the means is now a title and a venue, not a standing negotiating role."
