    - domain: economic
      text: "Oil is the rent that pays for the state. Output fell from 1.42 to 1.1 million barrels a day between 2019 and 2023, and China takes nearly 72% of Angolan oil exports. Angola left OPEC on 1 January 2024 after a quota dispute: OPEC+ set its 2024 target at 1.11m barrels a day, below the 1.18m Angola had asked for."
