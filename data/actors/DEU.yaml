  reading: 'Germany is a trading state that has to become a military power without having the people, the habits or the political consensus for it. Its grand strategy since 2022 is to
    buy security from three directions at once: from itself (the debt-brake carve-out and a Bundeswehr meant to be the strongest conventional force in Europe), from Washington (nuclear
    sharing, Patriot, F-35, and the hope that the troop drawdown stops at 5,000) and from a Europe it tries to organise around Paris and Warsaw. Each channel undermines another: autonomy
    hastens American retreat, American purchases weaken the Franco-German industrial project, spending outruns recruitment, and the domestic price, an AfD that wins eastern states while
    the centre governs with a thin majority, limits how much of this the electorate will fund. Its handling of Russia is the clearest part: Moscow is the declared ''greatest threat'',
    hybrid attacks are treated as such, aid to Ukraine is the largest in Europe but stops short of Taurus and of troops. Toward China, Israel and Turkey the same Germany behaves less
    like a leader than like an exporter with a guilty conscience: de-risking is proclaimed and the trade deficit grows, Staatsraeson is proclaimed and then conditioned, a difficult NATO
    partner becomes the bet in the eastern Mediterranean. The pattern a Luttwak reader would flag is that Berlin''s choices are rational one by one and self-defeating together; the test
    of 2027 is whether the Lithuania brigade, the F-35s and the budget become forces in being before the American drawdown and the AfD set the terms.

