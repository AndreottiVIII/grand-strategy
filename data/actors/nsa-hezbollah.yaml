  reading: 'Hezbollah in October 2026 is a movement that has lost the war it was built to deter and has not yet lost the argument that justifies its weapons. Luttwak''s logic shows twice. First,
    deterrence is a paradoxical good: an arsenal big enough to frighten Israel was also big enough to make destroying it Israel''s priority, and the ''support front'' of October 2023 handed Jerusalem
    the moment. Second, relational manoeuvre - the hidden, dispersed, community-embedded network, tied to Iran by a land bridge - beat Israeli firepower for eighteen years until Israeli intelligence
    penetrated the network itself: the pagers of 17 September 2024 and the decapitation that followed were less a military victory than the demonstration that the network had been read. Since
    then its position is that of a besieged political party with an army: the land route through Syria is shut by a hostile neighbour, Iranian cash comes by courier, the Lebanese state has banned
    its military activity and signed a framework that trades Israeli withdrawal for its disarmament, and its constituency is displaced and occupied. What keeps it from collapse is not strength
    but structure: a confessional system that cannot decide against the Shia community, an army that will not fight it, Amal as a brake on the state, and an Israeli occupation that supplies the
    justification. The open question for the next stage is whether the Lebanese state, with Gulf, US and European money behind its army, can turn the pilot zones into a precedent without provoking
    the clash both sides say they want to avoid, or whether Israel''s tunnels-and-demolition campaign forces Hezbollah to choose between its arms and its place in the state.'
