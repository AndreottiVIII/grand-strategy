  paradoxes:
  - text: "The Falepili Union protects the state but binds the choices it most wants. Tuvalu agrees with Australia any new defence or security engagement with third parties, so a stronger treaty with Taiwan, or any security step outside the Australian orbit, needs Canberra's assent."
