    text: "Hold Australia's security and mobility guarantees in place. The Falepili Union (in force 28 August 2024) obliges Australia to respond when Tuvalu asks for help in a major disaster, a pandemic or military aggression, and opens a pathway for up to 280 Tuvaluans a year."
