  - rank: 3
    text: "Keep statehood in perpetuity despite sea-level rise, and carry the climate case to the UN. Pre-visit reporting of November 2025 describes a treaty framework with Taiwan to secure recognition of Tuvalu's statehood as the sea rises; the UN has been its platform since the 2009 Copenhagen protocol."
