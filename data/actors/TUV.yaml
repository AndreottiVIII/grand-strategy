    - {url: "https://nit.com.au/18-11-2025/21343/tuvalu-treasures-special-relationship-with-taiwan", title: "Tuvalu treasures 'special relationship' with Taiwan", publisher: "NIT (AAP report)", date: '2025-11-18', tier: 3}

  reading: |
    Tuvalu's strategy is survival through recognition and treaty, not power: it keeps Taipei against Beijing's pull, binds itself to Canberra through the Falepili Union, and turns the climate case into a claim to statehood in perpetuity. Its budget rests on tuna access, which shrinks as the fish move, on a .tv lease, and on donors it cannot replace, so its freedom of action is largely borrowed. The paradox is that the treaty which keeps the state secure also needs Australia's agreement for any new security step, so the stronger the Taiwan ties become, the more Canberra's assent matters.
