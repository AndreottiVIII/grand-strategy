    - url: https://citynews.com.au/2025/murderous-putin-not-welcome-in-australias-region
      title: '''Murderous'' Putin not welcome in Australia''s region'
      publisher: CityNews (AAP)
      date: '2025-04-15'
      tier: 3
  reading: 'Australia is the ally that pays for a guarantor that may not come, and the regional order it is building is the insurance on that premium. Everything since 2023 reads as one move: lock the United States in with submarines, minerals and a statute that survived a Pentagon review (AUKUS, endorsed December 2025; the framework signed on 20 Oct 2025), while turning every neighbour into a treaty partner that screens out China - Papua New Guinea as a mutual-defence ally (2025), Fiji as the fourth ally (6 Jul 2026), vetoes in Nauru and Tuvalu, no foreign bases in Vanuatu, a treaty bid for the Solomon Islands, a security treaty with Indonesia. The Albanese government has a free hand to do this: re-elected in May 2025 with 94 of 150 seats, it faces an opposition that attacks it for weakness on China rather than for the direction. The Luttwakian pattern is in the gap between the two halves. The guarantee is bought at the price of entanglement (an Australian crew aboard the submarine that sank the Dena) and is still conditional (3.5% asked, a Taiwan pre-commitment reportedly asked for, a 10% tariff in April 2025, a five-month review of the flagship programme), while the insurance is built by buying sovereignty from the very islands it is meant to protect, who answer by bargaining. Two signals that are not rows: Albanese''s first reply to the Tasman drills was to stress that China had complied with international law, and the New Delhi Quad meeting of May 2026 spoke of tolls in the Strait of Hormuz and the Red Sea, which points to the Iran war rather than the Taiwan Strait. The question for 2027 is whether the ring of treaties and the submarine timetable hold long enough to outlast the guarantor''s moods; the first stress test is the Solomon Islands treaty, which a Solomon Islands minister floated for the end of 2026.'
