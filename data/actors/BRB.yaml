    - {url: "https://philstar.com/headlines/climate-and-environment/2023/04/07/2257368/climate-hit-island-pushes-to-reshape-world-bank-imf", title: "Climate-hit island pushes to reshape World Bank, IMF", publisher: "Philstar (syndicated wire)", date: 2023-04-07, tier: 3}
  - text: "The Commonwealth link to London. Barbados became a republic in 2021 but stays in the Commonwealth and keeps a High Commission in London; it is the UK's fourth-largest export market in the Caribbean. The shared history (1627-1966) gives the channel its weight."
    confidence: C
    sources:
    - {url: "https://en.wikipedia.org/wiki/Barbados%E2%80%93United_Kingdom_relations", title: "Barbados-United Kingdom relations", publisher: "Wikipedia", date: 2026-10-16, tier: 4}
  constraints:
  - text: "A small state asking large shareholders for money. The Bridgetown reform needs the votes and capital of the large economies that run the World Bank and IMF. Its ideas have gained traction among them, but the sources say they are still being debated, and one German-language source calls parts of them contested."
    confidence: C
    sources:
    - {url: "https://dialogue.earth/en/climate-energy/367248-barbados-prime-minister-leads-push-to-transform-global-finance/", title: "Barbados prime minister leads push to transform global finance", publisher: "Dialogue Earth", date: 2023, tier: 3}
  - text: "A split region on the US file. Trinidad and Tobago's prime minister played down talk of aggression and called the USS Gravely's visit part of planned cooperation with Washington, so the Caribbean does not speak with one voice on the US deployment."
    confidence: C
    sources:
