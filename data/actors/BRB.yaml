grand_strategy:
  objectives:
  - rank: 1
    text: "Turn climate finance into a reform of the World Bank and IMF. The Bridgetown Initiative, first set out in 2022 by a group led by Prime Minister Mia Mottley, asks for emergency liquidity against debt crises, about US$1 trillion more multilateral lending for climate and social development, and guarantees to draw private capital into climate projects. Its later version, 3.0, was launched at the Small Island Developing States conference in Antigua and Barbuda."
    confidence: C
    sources:
    - {url: "https://philstar.com/headlines/climate-and-environment/2023/04/07/2257368/climate-hit-island-pushes-to-reshape-world-bank-imf", title: "Climate-hit island pushes to reshape World Bank, IMF", publisher: "Philstar (syndicated wire)", date: 2023-04-07, tier: 3}
    - {url: "https://dialogue.earth/en/climate-energy/367248-barbados-prime-minister-leads-push-to-transform-global-finance/", title: "Barbados prime minister leads push to transform global finance", publisher: "Dialogue Earth", date: 2023, tier: 3}
  - rank: 2
    text: "Keep the Caribbean out of a US military frame. In September 2025 Mottley told the UN General Assembly that the Caribbean 'must remain a zone of peace' and warned that the build-up of military assets 'could occasion just an accident'. In October she called the situation 'extremely dangerous and untenable' and urged regional leaders to reject US strikes on alleged drug traffickers, which she called extrajudicial killings."
    confidence: C
    sources:
    - {url: "https://barbadostoday.bb/2025/09/27/rising-military-tensions-risk-destabilising-region-pm-warns-un/amp", title: "Rising military tensions risk destabilising region, PM warns UN", publisher: "Barbados Today", date: 2025-09-27, tier: 3}
    - {url: "https://jamaica-gleaner.com/article/lead-stories/20251027/untenable-situation-southern-caribbean", title: "Untenable situation in southern Caribbean", publisher: "Jamaica Gleaner", date: 2025-10-27, tier: 3}
  means:
  - text: "The UN and climate stages. Mottley's General Assembly speech and the Bridgetown name make a small state heard far beyond its size. In the same speech she praised Kenya's leadership of the Haiti security mission and asked the UN Security Council and the OAS for more support."
