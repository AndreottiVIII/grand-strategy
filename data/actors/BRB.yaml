  reading: |
    Barbados under Mottley plays a small state's game: its weight comes from a climate and debt agenda carried through UN and multilateral stages, and from a regional line against militarisation that puts it at odds with the US deployment and with Trinidad and Tobago. Its tie to London is the Commonwealth and history rather than a treaty, and the reparations claim, the China loans, the CARICOM files on Haiti and Venezuela and the weight of tourism are not sourced in this pass. Hurricanes and the debt level, the two constraints a Caribbean card would normally lead with, are also unverified here and stay open until a source is read.
