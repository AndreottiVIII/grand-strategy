  paradoxes:
  - text: "Her climate case runs through the institutions whose governance is set by large shareholders, the governments whose military posture she calls 'untenable'. Pressing Washington on the Caribbean build-up while needing its support for the World Bank and IMF reform pulls two ways. This is our reading; no source states the US weight in those votes."
