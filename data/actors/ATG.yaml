  reading: |
    Antigua and Barbuda plays a hedge with a small toolkit: a vote in CARICOM, an embassy in Beijing, and a passport programme that keeps a seat at Washington's table only while it is reformed. In 2026 the United States answered that hedge with visa restrictions tied to the programme; the government's response has been to request a review and promise tighter residency rules, not to change its line. The card is thin on the UK, Ukraine and Gaza, and on current trade and tourism shares, because those sources were not available within the flash budget.
