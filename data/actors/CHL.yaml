      text: "Win exclusions from the US 12.5% surcharge without amending the 2004 free trade agreement. In July 2026 the United States confirmed, from a Section 301 forced-labour investigation, a 12.5% surcharge on Chile and some 59 other economies (Argentina and El Salvador got 10%); copper and lithium were left out, and the Foreign Ministry puts the exposed share of Chilean exports to the US at about 40% (salmon, grapes, wine, timber, poultry). Washington's two conditions for lifting it are rules on imports from third countries without forced-labour controls, read as aimed at China, and a written agreement fixing 10% on certain products, which would modify the FTA; Santiago called the second unacceptable. The first negotiating round with deputy trade representative Jeffrey Goettman was held on 24-25 August 2026; no later round was found."
