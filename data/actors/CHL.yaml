      text: "Hold the far south as settled Chilean ground while keeping Milei as a partner. On 2 September 2026, touring Magallanes, Kast said the Strait is Chilean and that Argentina has and will have no sovereignty or control over it, and that he would not ask Milei to sign the repeal of Argentina's Decree 457 (a 2021 decree) because the treaties settle the matter. The Defence Ministry is weighing a first cabinet council in the Chilean Antarctic Territory in late January 2027, possibly with King Felipe VI, and a Chamber defence committee session was set for Punta Arenas on 25 September. The Antarctic claim itself is frozen, not settled: Article IV of the Antarctic Treaty keeps every claim as it stood, and Kast calls Antarctica the continent of the future."
