      text: "Keep the Atacama lithium inside a state-led partnership while opening it to private capital. The Codelco-SQM joint venture NovaAndino Litio, closed on 27 December 2025, gives Codelco 50% plus one share, leaves SQM operating until 2031 and secures production at the salar to 2060; Kast, as president-elect, questioned the lack of a fresh tender, and the incoming government saw the new framework as a way to attract private investment and speed up permits. The partnership transferred more than USD 530m to the state in the first quarter of 2026. The next project, Salar Futuro, is put by the press at USD 2-3.5bn and 280,000-300,000 t of lithium carbonate equivalent a year before 2030 (estimates)."
