  reading: |
    Chile under Kast is trying to turn its copper and lithium into a position it can hold between the United States and China, while it tightens the northern border as the proof that its security policy works. The balancing line is real but thin: the US coalition is joined with explicit limits, China is needed as a buyer, and the regional minerals pact with Argentina, Bolivia and Peru is the first sign that the neighbours can be partners on resources as well as on migration. The weak point is the border itself, whose results depend on the controls of Peru and Bolivia and on a Congress that has already rejected part of the plan. Not verified for this card: the EU modernised agreement (2024), the Venezuela and Tren de Aragua line, the 2025 US copper tariff, and the Bolivian sea claim and Silala dispute, which need their own sources.
