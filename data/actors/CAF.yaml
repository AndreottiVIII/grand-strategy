  paradoxes:
  - text: "The guard that keeps Touadera in power makes him dependent on the patrons who take the minerals. The government's own account of the foreign deployment is an alleged coup bid that it blamed on former president Bozize's backing of militias (Naharnet); the threat it names is what keeps the guards in place."
