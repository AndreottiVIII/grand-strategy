  reading: |
    Guatemala under Arevalo trades migration services for US money and security, and keeps Taiwan as a diplomatic card it has not spent on Beijing. Its economy is remittances, a corridor Washington taxes and can tighten, so the deportation deal is a lever it cannot easily refuse. The attorney general and the courts, shielded from quick removal, are the constraint that decides how far the president can move.
