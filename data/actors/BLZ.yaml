  reading: |
    Belize's strategy is to keep its 1859 boundary by making law the arena: since the 2008 pact the claim has been before the ICJ, and Guatemala has not accepted the treaty that settled the line. Its money is tourism and a debt swap that bought room without ending its dependence on outside creditors and on the British garrison for protection. Briceño's PUP was re-elected on 12 March 2025 with 26 of 31 seats (Jamaica Observer, search summary), so the policy of waiting for the court is set to run through the next term.
