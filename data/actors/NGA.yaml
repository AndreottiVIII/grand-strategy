    - rank: 3
      text: "Keep ECOWAS as the regional instrument and win the Sahel back: the AES exit leaves the bloc without its Sahel flank, Abuja wants the AES back 'under a different status' so that ECOWAS survives, and the Lake Chad task force (MNJTF) against Boko Haram and ISWAP has had no regional operation since July 2024."
