    - text: "The partners' leverage is turning from carrot to stick. The US kept Nigeria on the CPC list after the 12 August 2026 working group, listed it under the Child Soldiers Prevention Act in the 2026 trafficking report (cuts to US military training, sales and financing possible unless the president waives them; the waiver status is not reported), suspended some visa categories from 1 January 2026, and the UK plans to halve its aid from GBP 136.62m (2025-26) to GBP 68m by 2028-29."
