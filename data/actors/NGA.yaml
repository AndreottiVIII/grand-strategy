    - rank: 5
      text: "Stay inside Washington's security tent while Washington brands the state: keep the joint campaign against ISWAP and the health compact (nearly USD 2bn of US grants for 2026-2030, against 6% of budgets spent on health), and get the 'Country of Particular Concern' designation lifted or left without sanctions. Tinubu: 'We will overcome the CPC designation'; the second Joint Working Group met in Washington on 12 August 2026 with no change to the listing."
