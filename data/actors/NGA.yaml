  constraints:
    - text: "Debt service on a dollar budget. External debt is about USD 54.5bn in mid-2026; the World Bank's IDA (35%) and Eurobond holders (34%) are the largest creditors and China Exim (about 9%) the largest bilateral one. The naira stood at about N1,322 to the dollar in early September 2026, so every dollar of crude that stays at home is a dollar the debt does not get."
      confidence: C
