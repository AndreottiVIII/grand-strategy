    - text: "The giant that cannot project its weight. A state of Nigeria's weight could not stop a Burkinabe junta from holding a Nigerian C-130 and 11 personnel after an emergency landing in Bobo-Dioulasso (8 December 2025): the AES statement called the landing an unfriendly act and authorised its members to 'neutralise' aircraft violating their airspace, and Foreign Minister Tuggar flew to Ouagadougou to apologise for the irregular clearance. A state that sends jets to save Benin's government in the same week cannot fly home through a neighbour's sky, and it fights ISWAP with American and Turkish help."
