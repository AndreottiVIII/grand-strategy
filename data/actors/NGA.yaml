    - text: "The regional instrument is unfunded and late. The ECOWAS Standby Force's counter-terrorism brigade (1,650 troops, endorsed again at the Freetown summit of July 2026) is due to be operational in July 2027, the force's activation is estimated at EUR 2.26bn, three members have left, and the Lake Chad task force has not run a regional operation since July 2024. Abuja leads a bloc that cannot yet field what it promised."
