    - text: "A budget built on crude it does not pump. Crude was 62.89% of exports in the first quarter of 2025; the 2026 budget assumes 1.84 million bpd including condensates and Nigeria has stayed below it every month from May to August (Nairametrics); inflation was still 15.39% in August 2026 and debt service is 23.14% of the N68.32 trillion 2026 appropriation (Intelpoint). The state has little room to spend on the north, the army or the election at once."
