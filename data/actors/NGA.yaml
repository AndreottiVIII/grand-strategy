    - rank: 4
      text: "Keep the claim to lead Africa against South Africa's co-claim: Nigeria's case rests on its population, its oil, its role in founding ECOWAS and its peacekeeping, and South Africa now competes for the same standing through its G20 seat and its ICJ case against Israel."
      confidence: B
