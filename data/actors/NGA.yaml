      text: "Convert size into rank and spread the risk: a permanent seat on the UN Security Council ('Nigeria must have a permanent seat', Tinubu's address read by the vice president on 24 September 2025), BRICS partner status since January 2025, a continuous seat on the AU Peace and Security Council since 2004 (chair in May 2026), and new security and trade partners in Turkey, the Gulf and Brazil so that no single patron holds the key."
