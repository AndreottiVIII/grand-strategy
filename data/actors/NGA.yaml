    - rank: 2
      text: "Turn the oil into dollars and hold the naira: production at the OPEC quota (1.53 million bpd in September 2026 per OPEC's report of October, against a quota of 1.5 million and a budget target of 1.84 million including condensates), while the Dangote refinery takes domestic crude that would otherwise be exported. Sharpened on 2026-10-16: the first draft said 'above the quota, 1.573 million bpd in August'; the 13 October report, citing OPEC, gives 1.50 million for August and 1.53 million for September, so the earlier figure was a secondary-source estimate that OPEC's later data contradicts."
