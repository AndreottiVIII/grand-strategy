    - text: "The partner whose joint campaign proves the charge. Washington accuses Abuja of tolerating the killing of Christians (CPC designation, 31 October 2025), then strikes ISIS sites in Sokoto with Abuja's consent and kills al-Minuki with it; each joint success shows the state needs foreign force to protect its own people, which is the claim the designation makes, while Abuja's defence that Muslims die too (the information minister's line) is the one thing its partner will not grant. The cooperation Abuja needs to fix the problem is what keeps the label alive; the August 2026 working group left the listing unchanged and the October 2026 Child Soldiers Act listing adds a second."
