  reading: |
    Guyana runs its strategy on three levers: the 1899 line argued at The Hague, oil revenue held in a fund, and an Exxon-led operator that carries the output. Its weakness is that the same oil makes the disputed territory worth claiming, so each step of its growth is also a step in the Venezuelan dispute. Its strength is that a legal case backed by a fund is slow but durable, and the outside partners (Brazil, the United States, the UK, CARICOM, China) are not yet graded because their cards and sources are not written.
