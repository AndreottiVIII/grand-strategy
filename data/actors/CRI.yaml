  reading: |
    Costa Rica under Laura Fernández is a security government first, the successor of Rodrigo Chaves who won on the homicide rise and promises the Bukele method to reverse it. Its partners are judged on that test: Washington praises the tough line on drug trafficking, while Beijing congratulates her in the language it uses for any relation it wants to keep smooth. The paradox is that the agenda she inherits is the one that did not stop the murders, so the security promise both opens the door to Washington and leaves the economy and the homicide rate exposed to the same trafficking routes. This card is a first draft from one wire-style source per leg; the full picture of the United States, Nicaragua, Panama, the EU and the OECD is still to be sourced.
