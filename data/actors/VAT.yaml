  reading: |
    The Holy See has no army and no military allies, so its grand strategy is diplomatic and moral: keep 184 states talking to it, keep the Church alive where it is restricted, and make the pope's voice count in wars it cannot stop. Under Leo XIV, elected on 8 May 2025 as the first American-born pope, the line continues Francis but is sharper on migration and Gaza, and it accepts cooler relations with Washington as the price. The weak points are money (a structural deficit covered by Peter's Pence) and China, where the 2018 deal is the main file and the clearest case of a channel kept open at the cost of its text. Recognition is the currency it trades: Taiwan (one of the few states with relations with the Republic of China), Palestine since 2015, and the Lebanon and Turkey trip of late 2025 as a way to speak to Middle East Christians. Non-events to watch: no US visit was planned for 2026, and the Ukraine talks offer in Vatican City has not been accepted by Moscow.
