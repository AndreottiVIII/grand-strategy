  reading: |
    São Tomé and Príncipe plays a small hand between Lisbon, which the re-election of Carlos Vila Nova reinforces through language and aid, and Beijing, the recognition it chose in 2016 after dropping Taiwan. Its one large lever is the shared offshore zone with Nigeria, and that lever has so far paid its own authority more than the state. The tests of the coming years are whether the Portuguese summit turns into money and whether the zone ever produces commercial output.
