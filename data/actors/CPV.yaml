  reading: |
    Cape Verde's 17 May 2026 election ended the MpD's bid for a third term: the PAICV won 37 of 72 seats, and Francisco Carvalho was named prime minister-designate, with 19 June given as the swearing-in date by one search summary that no second source confirmed. The state's external ties that the sources read here run through Lisbon (the AIR Centre and Portuguese investment), with China and the United States present but not sourced in this pass. The EU, ECOWAS, Brazil and the CPLP, the Chinese port and debt, the MCC compacts and the remittance and tourism figures are open gaps for a second pass.
