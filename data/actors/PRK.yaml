  paradoxes:
    - text: "Selling usefulness to Russia raises North Korea's price and ties its fortune to a war it does not control. The treaty, the troops and the shell trade bought food, oil, cash and technology and ended the diplomatic quarantine, but every item on the receipt falls due only while Moscow needs them; a ceasefire in Ukraine ends the windfall while leaving the troops' losses, the sanctions and the dependence on China intact."
      confidence: B
      sources:
        - {url: "https://www.bloomberg.com/graphics/2026-north-korea-windfall/", title: "North Korea's windfall", publisher: "Bloomberg", date: 2026-08-07, tier: 3}
        - {url: "https://www.cfr.org/article/how-north-korea-has-bolstered-russias-war-ukraine", title: "How North Korea Has Bolstered Russia's War in Ukraine", publisher: "Council on Foreign Relations", date: 2025-11, tier: 2}
    - text: "Leaning on Russia to dilute China's weight made China court it back. The 2024 distance from Beijing (trade down 5%) ended in the September 2025 parade, a record 2025 trade year and Xi's visit in June 2026, whose stated aim, per analysts, is to keep Pyongyang from drifting toward Moscow: the Russian card bought Kim a competition between patrons, but also a Chinese attempt to re-establish itself as 'the principal actor' in the North."
      confidence: B
      sources:
        - {url: "https://www.aljazeera.com/amp/news/2026/6/8/chinas-xi-jinping-arrives-in-north-korea-on-rare-state-visit", title: "China's Xi Jinping arrives in North Korea on rare state visit", publisher: "Al Jazeera", date: 2026-06-08, tier: 3}
        - {url: "https://www.businessday.co.za/world/asia/2026-01-20-chinas-2025-trade-with-north-korea-rebounds-to-pre-covid-levels/", title: "China's 2025 trade with North Korea rebounds to pre-Covid levels", publisher: "Reuters (via BusinessDay)", date: 2026-01-20, tier: 3}
    - text: "A deterrent declared irreversible leaves nothing to trade. Washington is told that talks are possible only if it accepts the arsenal, so the sole thing sanctions relief could buy, the arsenal's reduction, is withdrawn from the table; meanwhile each new disclosure (Hwasong-20, the June 2026 enrichment plant) strengthens the Seoul-Washington-Tokyo deterrence that the weapon was supposed to make unnecessary."
      confidence: B
      sources:
        - {url: "https://www.pbs.org/newshour/world/north-korean-leader-recalls-good-personal-memories-of-trump-urges-u-s-to-drop-denuclearization-demands", title: "North Korean leader recalls good personal memories of Trump, urges U.S. to drop denuclearization demands", publisher: "PBS NewsHour / AP", date: 2025-09-22, tier: 3}
        - {url: "https://www.armscontrol.org/node/15391", title: "North Korea Unveils New Enrichment Facility", publisher: "Arms Control Association", date: 2026-06, tier: 2}
    - text: "Cutting Korea in two removes the argument that justified the northern state. A regime founded on the claim to be the true Korea now writes 'South Korea' into its constitution as a neighbouring state, and Seoul's unification ministry has answered with a 'peaceful two-state' policy (white paper of May 2026) that accepts the division without paying for it; the fortified line itself produces incidents (mines on 21 Sep 2026, some 30 line crossings in September on Seoul's count)."
      confidence: B
      sources:
        - {url: "https://www.koreaherald.com/article/10732099", title: "N. Korea removes 'unification' reference from constitution", publisher: "The Korea Herald / Yonhap", date: 2026-05-06, tier: 3}
        - {url: "https://www.koreatimes.co.kr/amp/foreignaffairs/northkorea/20260518/unification-white-paper-pivots-to-peaceful-two-state-coexistence-with-n-korea", title: "Unification white paper pivots to peaceful 'two-state' coexistence with N. Korea", publisher: "The Korea Times", date: 2026-05-18, tier: 3}
        - {url: "https://www.euronews.com/2026/09/30/north-korea-slams-souths-claim-it-was-behind-dmz-mine-blasts-calling-it-a-farce", title: "North Korea slams South's claim it was behind DMZ mine blasts, calling it a farce", publisher: "Euronews", date: 2026-09-30, tier: 3}
    - text: "Killing the UN panel created a stronger monitor. Russia's veto of March 2024 freed Pyongyang from a body that needed Chinese and Russian consent, but the eleven states that built the Multilateral Sanctions Monitoring Team in response answer to no veto, name the Russia-DPRK arms trade and the cyber networks, and feed Treasury's designations."
      confidence: B
      sources:
        - {url: "https://www.armscontrol.org/act/2024-05/news/russia-ends-north-korean-sanctions-panel", title: "Russia Ends North Korean Sanctions Panel", publisher: "Arms Control Association", date: 2024-05, tier: 2}
        - {url: "https://www.mofa.go.jp/press/release/pressite_000001_01321.html", title: "Release of the First Report of the Multilateral Sanctions Monitoring Team (MSMT)", publisher: "Ministry of Foreign Affairs of Japan", date: 2025-05-29, tier: 1}
    - text: "The money that keeps the state alive is the money that most exposes it. Crypto theft (USD 2.02bn in 2025), workers on student visas and IT freelancers are sanctions-evasion by design, so the more they yield, the more the US, Japan, South Korea and the monitoring team concentrate on them; Treasury's 12 Mar 2026 designations reached facilitators in Vietnam, Laos and Spain, countries Pyongyang courts."
      confidence: B
