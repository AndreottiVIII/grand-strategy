        - {url: "https://www.koreatimes.co.kr/southkorea/defense/20261003/cover-story-north-koreas-border-fortification-raises-questions-over-dmz-buffer-role", title: "North Korea's border fortification raises questions over DMZ buffer role", publisher: "The Korea Times", date: 2026-10-03, tier: 3}
    - rank: 4
      text: "Rebuild the civilian economy outside Pyongyang while keeping the party's control: the 2026-2030 five-year plan (manufacturing, power, the '20x10' regional factories and hospitals). The Bank of Korea counts 3.5% growth in 2025, the third year above 3%, with output above its 2017 (pre-sanctions) level."
      confidence: B
      sources:
