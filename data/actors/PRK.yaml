    - rank: 3
      text: "Close the Korean question on Pyongyang's terms: no reunification, no dialogue, South Korea a separate 'most hostile' state. The doctrine announced in December 2023 and January 2024 is now in the constitution (March 2026, territory defined as bordering South Korea, all unification wording removed) and on the ground (roads and rails cut, fences, mines and a cleared strip along the line)."
