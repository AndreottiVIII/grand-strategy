        - {url: "https://www.koreaherald.com/article/10732099", title: "N. Korea removes 'unification' reference from constitution", publisher: "The Korea Herald / Yonhap", date: 2026-05-06, tier: 3}
    - rank: 2
      text: "Turn military usefulness into money, food, fuel and technology: troops, shells and missiles for Russia's war, and keep China's trade lifeline open at the same time. Russia is now the second patron, the one that pays; China remains the one that feeds the economy (98% of official trade in 2024)."
