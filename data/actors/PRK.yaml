    - rank: 5
      text: "Hand the dynasty on: South Korea's intelligence service said on 12 Feb 2026 that Kim Ju Ae had entered a 'successor-designation stage' (a year earlier: 'successor training'); she was at his side in Beijing in September 2025. No formal title has been reported."
      confidence: C
