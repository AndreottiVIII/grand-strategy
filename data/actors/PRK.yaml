grand_strategy:
  objectives:
    - rank: 1
      text: "Regime survival under a nuclear deterrent that is declared irreversible, and recognition of the country as a nuclear-weapon state. Kim told the Supreme People's Assembly on 21 Sep 2025 that there can 'never, under any circumstances' be denuclearisation; the Ninth Party Congress (February 2026) wrote the status into party policy and the nuclear command into the 2026 constitution; on 13 Jun 2026 Pyongyang called the arsenal 'irreversibly finalized'."
