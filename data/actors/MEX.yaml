        - {url: "https://www.semafor.com/article/08/08/2025/mexicos-sheinbaum-rejects-us-invasion-after-reports-of-trump-ordering-military-force-against-drug-cartels", title: "Mexico's Sheinbaum rejects US invasion after reports of Trump ordering military force against drug cartels", publisher: "Semafor", date: 2025-08-08, tier: 3}
        - {url: "https://www.aljazeera.com/amp/news/2026/7/15/sheinbaum-rejects-us-claim-that-mexicos-government-is-linked-to-cartels", title: "Sheinbaum rejects US claim that Mexico's government is linked to cartels", publisher: "Al Jazeera", date: 2026-07-15, tier: 3}
    - rank: 2
      text: "Keep the USMCA and the tariff exemption alive through the 2026 review: Washington did not agree to extend the agreement at the joint review (USTR, 1 July 2026), so it now runs on annual reviews while bilateral rounds continue, and USMCA-compliant goods stay outside the general US tariffs. Sharpened 2026-10-16: the 25% fentanyl tariff this objective was first written against no longer exists. The US Supreme Court struck down the IEEPA tariffs on 20 Feb 2026 (6-3, Learning Resources v. Trump); a 10% Section 122 surcharge ran from 24 Feb; a 10% Section 301 tariff replaced it on 24 Jul 2026 for non-USMCA goods (Mexican government: it replaces, not adds to, the Section 122 duty). What Mexico now bargains for is relief from the sectoral Section 232 duties (steel and aluminium up to 50%, autos 25%) and the rules of origin: it asks for zero tariffs on vehicles or quotas no tighter than the EU's and South Korea's (Mexico Business News, Sep 2026). As of 12 Oct 2026 the talks are reported stalled, with Trump pressing for energy deals with US companies (FT, via Mexico News Daily headline)."
      confidence: B
      sources:
