    - text: "Pemex is a debt carrier: financial debt of about USD 79-80bn at the end of Q1 2026, the lowest since 2014 but still large, three consecutive quarterly losses, and a Moody's B1 rating held at stable only because the state is expected to support it; Mexico's own sovereign was cut to Baa3 by Moody's. The state cannot spend its way out and cannot let Pemex fail."
