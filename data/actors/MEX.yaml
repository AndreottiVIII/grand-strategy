    - text: "Dependence on the northern market: the United States is Mexico's largest trading partner and the first export market, and the USD 61.8bn of remittances come almost entirely from there. Every choice toward Washington is made with the USMCA unrenewed and the remittance tax in force; the room to refuse is small. Sharpened 2026-10-16 with the figure: exports were a record USD 664.84bn in 2025 and more than 80% went to the US market (INEGI, via Mexico Business News); the US takes 84.03% of non-oil exports (July 2025 data)."
