    - domain: diplomatic
      text: "Asylum, non-intervention and the UN as a sovereignty shield: the Estrada-era tradition of non-intervention is applied selectively but visibly. Mexico granted asylum to former Peruvian prime minister Betssy Chavez (Peru broke relations on 3 Nov 2025, restored 7 Aug 2026 under Keiko Fujimori, with safe conduct for Chavez under the 1954 Caracas Convention), condemned the US operation in Venezuela on 3 Jan 2026 and the Cuba embargo at the UN (voted for the General Assembly resolution ending it, Oct 2025, 165 to 7), and keeps backing Michelle Bachelet for Secretary-General. It costs little with Washington and builds the regional credit Mexico has no army to buy."
