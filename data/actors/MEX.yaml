grand_strategy:
  objectives:
    - rank: 1
      text: "Keep the security cooperation with Washington under Mexican control: cartel figures handed over, CIA flights and National Guard at the border accepted, but no US troops and no unilateral strikes on Mexican soil ('we operate in Mexico, no one else', Sheinbaum, 2025-2026). Every other choice below is priced against the risk that Washington turns cooperation into intervention."
      confidence: B
      sources:
