    - text: "The cartels hold ground the army cannot take without paying for it: the killing of CJNG's El Mencho on 22 Feb 2026 set off burnings and road blocks in Jalisco and other states, and US and Canadian embassies issued shelter-in-place warnings. A government that is judged by Washington on the cartel file has to keep delivering blows whose price is violence in its own cities, and a successor structure (the OSAC assessment of 9 Oct 2026 asks whether the cartel changed at all) may be as bad."
