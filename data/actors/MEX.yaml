    - rank: 6
      text: "Keep a principled, non-interventionist voice in Latin America at no cost to the US track: condemn the US operation in Venezuela (3 Jan 2026) as a violation of the UN Charter, grant diplomatic asylum (Betssy Chavez, Lima, 2025), and back Michelle Bachelet for UN Secretary-General when Chile withdrew its own support (Mar 2026). The voice is loud on Venezuela and asylum and quiet where Washington's interests bite (the Cuban oil pause, the cartel designations)."
