    - rank: 4
      text: "Diversify the trade base away from the United States without alignment with anyone: the modernised EU agreement signed on 22 May 2026, and, on the Asian side, tariffs on cars and other imports from countries without a free-trade agreement, aimed first at China and in force from 1 January 2026. Sharpened 2026-10-16: the 50% figure was the September 2025 proposal; the Senate passed the enacted text 76-5 on 10 Dec 2025 with most lines capped at 35% (passenger cars 20% to 35%, steel articles 15% to 35%), 50% remaining on some auto, textile, plastic and steel lines (Thomson Reuters). Diversification is pursued by treaty with Brussels and by duties on Beijing, not by a bloc."
      confidence: B
      sources:
