      text: "Cooperation as the currency of sovereignty: cartel figures transferred to US custody in three batches, 29 on 27 February 2025, 26 in August 2025 and 37 on 20 January 2026 (92 in all; sharpened 2026-10-16 from the earlier wording 'dozens more', NBC News), 10,000 National Guard at the border, and intelligence sharing that Mexico calls collaboration. Each transfer is presented as sovereign and autonomous, which is how Mexico keeps troops out while giving Washington what it asks."
