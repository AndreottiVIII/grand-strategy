    - domain: military
      text: "The National Guard and the army as the price of the tariff pause: 10,000 Guard troops sent to the northern border after the call of 3 Feb 2025 that paused the first 25% tariffs (about 1,650 to Ciudad Juarez and 1,949 to Tijuana at the start), and Mexican special forces, with US intelligence support, killed CJNG leader Nemesio 'El Mencho' Oseguera on 22 Feb 2026 in Tapalpa, Jalisco. Sheinbaum says no US troops took part. The force is real and aimed where Washington points; the retaliation, vehicles burned and roads blocked in several states, is paid at home."
