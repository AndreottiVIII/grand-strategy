  means:
    - domain: economic
      text: "Tariff wall on non-FTA imports: duties from 5% up to 50% on automobiles, auto parts, textiles, plastics and steel from China, South Korea, India, Vietnam, Thailand, Indonesia and others, over 1,400 product lines, passed by Congress in late 2025 (Senate 76-5, 10 Dec) and in force from 1 Jan 2026; most lines are capped at 35% and passenger cars sit at 20% to 35% (sharpened 2026-10-16, Thomson Reuters). The US, Canada, Japan and the EU are exempt through existing agreements, which is the point: the tariffs are a price for Washington's review."
