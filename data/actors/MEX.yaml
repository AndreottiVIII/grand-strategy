      text: "The morning press conference as the sovereignty channel: Sheinbaum answers every US claim at the daily mananera, on the record and the same day. Examples: the rejection of US troops (May 2025), of a US invasion (Aug 2025), of the US claim that the Mexican government is linked to cartels (Jul 2026), and of Milei's claim that Mexico funded an 'anti-Argentina campaign' during the World Cup (27 Jul 2026: 'it is false'). Denial is the narrative cover under which the cooperation of the other means goes on."
