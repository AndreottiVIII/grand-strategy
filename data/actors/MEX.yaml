    - text: "The input chain runs through China: Mexico's trade deficit with China reached a record USD 119.86bn in 2024 (imports USD 129.8bn, exports USD 9.9bn, INEGI) and 76.8% of Mexican imports in Jan-Jul 2025 were intermediate goods. The tariff wall on Asia and the rules-of-origin demand in the review both hit the inputs that Mexican exporters to the US need; Beijing opened a trade-barrier investigation in September 2025 and called the measure 'coercion'. Mexico cannot cut China out without cutting its own export base."
