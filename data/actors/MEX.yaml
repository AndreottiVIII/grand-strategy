    - rank: 3
      text: "Keep the remittance flow and the migrant corridor intact: remittances received in Mexico fell to USD 61.8bn in 2025 (Banxico), the first annual fall in eleven years, under deportations and the 1% US remittance tax, and Mexico cannot afford a rupture that would cut it further."
