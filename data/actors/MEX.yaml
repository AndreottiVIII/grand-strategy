    - rank: 5
      text: "Hold the nearshoring investment that carries the economy through the tariff years: foreign direct investment reached a record USD 40.871bn in 2025 (Secretaria de Economia; +10.8%, fifth annual rise), 38.8% of it from the United States and 10.8% from Spain, but 67.7% was reinvested profits and only 18% new money, and the last quarter of 2025 was a net outflow of USD 5.0bn. Plan Mexico is the instrument; the objective is to keep investors inside the USMCA perimeter while Washington decides its terms."
