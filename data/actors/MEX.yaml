    - text: "The sectoral US tariffs stay while the general ones fall: Section 232 duties of 25% to 50% on steel, aluminium, vehicles and parts were carved out of the July 2026 Section 301 action and remain, and USTR Greer said in April 2026 that Mexico's auto and steel sectors would probably not see their tariffs removed. Mexico can win the exemption for compliant goods but not the sectors that carry its industrial base; its retaliation option, a 25% tariff on US steel and aluminium, Sheinbaum says she would rather not use because it would raise prices at home."
