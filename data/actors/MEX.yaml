  constraints:
    - text: "Judicial reform and investor doubt: the 2024 reform elects Supreme Court justices from candidates nominated by the president, Congress and sitting justices, and foreign companies have reportedly held back about USD 35bn of investment over the uncertainty (WSJ, as cited by Aberdeen); nearshoring, which the economy needs, depends on the legal certainty and arbitration the reform puts in doubt. Date of the Aberdeen piece not confirmed. Added 2026-10-16: the first judicial elections were held on 1 June 2025 with about 13% turnout, reducing the Supreme Court from eleven to nine justices with twelve-year terms (AP and Guardian, as cited by Wikipedia; the Wikipedia page is the pointer, the two press reports the basis); a bipartisan US congressional concern (four senators' letter of 27 Aug 2024, House resolution H.Res. 454 of May 2025) ties the reform to the USMCA review, and the Wilson Center argues it raises the stakes of the review."
