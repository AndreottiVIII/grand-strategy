  reading: |
    Sudan is the Luttwak case of a state at war with its own instrument. The RSF was raised by the regime to guard it against its own army, and the generals who let it grow (Burhan took power together with Hemedti in October 2021) can neither win without destroying it nor accept a truce that leaves it standing. The Gulf and Egypt, which dealt with both generals before the war (the UAE promoted Hemedti's economic role), are now divided inside the Quad, so the army's strategy is a negotiation with its own sponsors: keep Cairo, Riyadh, Ankara and Doha, shut out Abu Dhabi, and avoid being sold a freeze of the lines by Washington. October 2026 finds it with momentum in Kordofan and on the wrong side of the US visa desk. Two signals that are not rows: the Russian naval base at Port Sudan, agreed in December 2020, has no source showing it ratified or built, so Moscow is a supplier and a reserve, not an anchor; and Burhan's postponed trip to the UN General Assembly in September, with his US visa reportedly withheld until he accepts a ceasefire, which shows that the state's own head is now a bargaining object for Washington. The paradoxes share one shape: each lever that wins ground (Islamist brigades, Iranian and Turkish drones, refusing the Quad) buys the army less standing with the people who will write the settlement.
