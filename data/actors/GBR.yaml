    - text: "Courting Trump to keep the American umbrella, then losing his goodwill by obeying the law. The state visit, the Tech Prosperity Deal and GBP 150bn of pledges (September 2025) were the price of protection, but the March 2026 refusal of bases for the first strikes on Iran - taken on legal advice to protect British standing and forces - brought Trump's 'the relationship is obviously not what it was', talk of a Pentagon review of the Falklands position, and a US that withholds consent on Chagos. Doing what the alliance's own rules require costs the alliance."
