  paradoxes:
    - text: "The country that organises Europe's 'coalition' layer cannot fund the force it organises. The UK leads the Coalition of the Willing, the JEF and the Estonia battlegroup, and signed treaties with France, Germany and Poland, but its own spending path (2.7% of GDP by 2029-30) is below the Hague pledge, a Defence Secretary resigned in June over exactly this, and the prime minister who inherited the problem will not date the 3%. Leadership by treaties is paid for in promises."
