  reading: |
    Bahrain's card rests on a US security umbrella and a formal opening to Israel, and Iran is the structural rival: the 2016 rupture was followed by direct strikes on Bahrain in 2026. Its diplomatic hedges are the 2020 Israel tie and a UN Security Council seat for 2026-27. This card is minor and thin: Saudi Arabia, the Houthis, the Qatar blockade and the 2011 deployment, the 2024-25 Iran talks, the June 2025 war and the British base are not written because no source was found for them in this session.
