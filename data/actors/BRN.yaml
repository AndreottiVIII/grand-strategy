  reading: |
    Brunei is a small, rich sultanate whose economy rests on one resource, oil and gas, with LNG sold to Japan since 1972. Its strategy is defensive and borrowed: it keeps its Islamic-monarchic identity at home (the 2014 sharia penal code, stoning in force since 2019), buys its security abroad (a British garrison and Singapore's jungle camp), and buys diversification from outside (Hengyi, Chinese capital at Pulau Muara Besar). The sharia code is the price it has chosen to pay for legitimacy, and the boycott it drew is the cost. The Limbang claim against Malaysia stays dormant rather than pressed.
