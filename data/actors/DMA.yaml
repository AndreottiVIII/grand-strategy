  reading: |
    Dominica is a small state whose foreign policy is a set of separate deals rather than an alignment: Beijing bought recognition in 2004 with aid, Washington and London hold the older ties through assistance channels and treaties, and the Caribbean bodies (CARICOM and the OECS) are where it speaks as one of many. Its strategic weight is low, so its moves are chosen for what they bring in, and the card can say little about the economy (citizenship by investment, the geothermal project) or the hurricane constraint until those are sourced. The gaps are the point of this first pass: the 2025 US posture and the China debt are not yet read in a source that could support them.
