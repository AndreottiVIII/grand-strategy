  reading: |
    Timor-Leste is a small, young state whose money is an oil fund spent faster than it grows, and whose one large asset is a gas field across a sea border settled in 2018 that it still cannot turn into revenue. Its foreign policy is a small state's hedging: Indonesia is the market and the former occupier, Australia the paymaster with an open grievance over the 2004 spying case, China the source of finance it has mostly not signed for, and Portugal the language and identity it shares with the CPLP. ASEAN membership (October 2025) is the frame that makes it a regional state rather than a dependent one, and the bet is Greater Sunrise: if Canberra pays for a pipeline to the south coast, the gas becomes a bridge out of the fund; if it waits past the fund, Dili has no second currency.
