      text: "Stay out of other people's wars and keep the sultanate intact under Sultan Haitham: neutrality is not a posture but the survival strategy of a small Gulf state with Iran across the Strait of Hormuz, Saudi Arabia on its land border and the United States on its ports. The test of the doctrine is the 2026 Iran war, in which Oman condemned the US-Israeli strikes of 28 Feb ('undermining active and serious negotiations'), was itself hit by Iranian drones at Duqm, Salalah and Sohar, and still refused to join either camp."
