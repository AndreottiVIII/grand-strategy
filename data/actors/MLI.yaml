  reading: |
    Mali plays the strategy of a junta that has swapped its old friends for new patrons: it expelled France and left ECOWAS, took Russian soldiers and drones, and bet its revenue on gold that the state now runs itself. The bet holds at the centre and fails at the edges, where the Africa Corps has left Kidal, the JNIM blockade chokes the Dakar and Abidjan corridors, and the Azawad front takes the north. Sovereignty is the regime's only proof of legitimacy, so every concession to a neighbour or to Algeria reads at home as a loss, and that is why the rift with Algiers lasted a year. Watch whether Moscow and Ankara keep paying for the north when the gold and the corridor no longer cover the cost.
