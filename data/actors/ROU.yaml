        - {url: "https://www.aljazeera.com/news/2026/9/30/romanian-political-crisis-intensifies-as-parliament-rejects-pro-eu-pm", title: "Romania's political crisis intensifies as Parliament rejects pro-EU PM", publisher: "Al Jazeera", date: 2026-09-30, tier: 3}
    - text: "Austerity bought the rating and brought down the government. The tax rises and freezes that kept Romania off junk and unlocked EU funds split the four-party coalition: the Social Democrats left in April 2026 and joined the far right to remove Bolojan on 5 May. The vacuum now threatens the 2027-28 consolidation, which is the reason S&P gives for its negative outlook."
      confidence: B
      sources:
        - {url: "https://www.jurist.org/news/?p=312241", title: "Romania dispatch: Bolojan government removed by successful vote of no confidence", publisher: "JURIST", date: 2026-05-14, tier: 3}
        - {url: "https://agerpres.ro/english/2026/10/03/standard-poor-s-affirms-romania-bbb--a-3-ratings-outlook-negative--1599689", title: "Standard & Poor's affirms Romania at BBB-/A-3, outlook negative", publisher: "Agerpres (state agency)", date: 2026-10-03, tier: 1}
    - text: "Making itself indispensable to Washington has not bought a fixed garrison. Romania lent Kogalniceanu to the Iran operation within 24 hours (11 Mar 2026) and Rutte praised it on Fox News, Iran accused NATO of complicity (June 2026), yet the US had already pulled the rotational brigade (Oct 2025). The more Bucharest hosts, the more it exposes itself to Tehran without a guarantee of more US troops."
      confidence: B
      sources:
        - {url: "https://www.stripes.com/theaters/europe/2026-03-11/us-romania-airbase-iran-21025925.html", title: "US to use Romanian air base for Iran operations", publisher: "Stars and Stripes", date: 2026-03-11, tier: 3}
        - {url: "https://www.bursa.ro/iranul-acuza-nato-de-complicitate-romania-si-italia-numite-explicit-de-rutte-drept-tari-participante-la-operatiunea-8222epic-fury-05993950", title: "Iran accuses NATO of complicity; Romania and Italy named by Rutte as participants in Operation Epic Fury", publisher: "Bursa (citing AFP)", date: 2026-06-25, tier: 3, lang: ro}
        - {url: "https://www.stripes.com/theaters/europe/2025-10-29/romania-us-forces-reduction-19584091.html", title: "Romania says US forces will be reduced", publisher: "Stars and Stripes", date: 2025-10-29, tier: 3}
    - text: "Backing Ukraine pulls the war onto Romanian soil and the minority quarrel weakens the partner it needs. The Patriot donation, Danube transit and drone co-production make Romania a target (Galati, Tulcea, Buzau) while Kyiv's school-law bill puts the Romanian community and the 1997 treaty on the agenda in the same weeks as the March 2026 strategic partnership."
      confidence: B
