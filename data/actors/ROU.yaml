    - text: "Public finances: ESA deficit 7.9% of GDP in 2025 (9.3% in 2024), debt 59.3% of GDP (48.1% in 2022), interest bill rising to about 3.2% of GDP in 2026. S&P (2 Oct 2026) and Fitch (31 Jul 2026) hold BBB- with a negative outlook, S&P warning that a long government formation could hinder the 2027-28 consolidation. One notch from junk, with large external financing needs and high non-resident holdings of debt."
      confidence: A
