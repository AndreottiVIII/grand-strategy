  paradoxes:
    - text: "Annulling the election to protect the system fed the forces it was meant to stop. The Constitutional Court cancelled the vote (6 Dec 2024) on declassified evidence of a Russian-backed campaign for Georgescu, yet George Simion of the AUR led the re-run's first round with 40.96% (4 May 2025) and the AUR now holds about a third of Parliament, enough to topple a government with the Social Democrats. Dan won the runoff 53.6 to 46.4 and still governs against that bloc."
      confidence: B
      sources:
        - {url: "https://pism.pl/publications/constitutional-court-nullifies-romanias-presidential-election", title: "Constitutional Court nullifies Romania's presidential election", publisher: "PISM", date: 2024-12, tier: 2}
