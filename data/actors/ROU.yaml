  constraints:
    - text: "No government with full powers since 5 May 2026. The Bolojan cabinet fell to a no-confidence vote (281 to 4) moved by the AUR with the Social Democrats; a second nominee, Siegfried Muresan, got 182 of the 233 votes needed on 30 Sep 2026; the fourth nominee, Luca Niculescu, was named on 5 Oct. The far right holds about a third of Parliament and Dan refuses a cabinet with it. Dissolution conditions are met but Dan calls it a last resort."
      confidence: A
      sources:
