      text: "Keep the United States and NATO anchored on the Black Sea flank: US troops and bases (Mihail Kogalniceanu, Deveselu), US arms (F-35, Patriot, HIMARS) and a NATO command role in the Black Sea. Bucharest says it sees 'no risk' of a US pullback from the eastern flank while the Pentagon has already ended the rotational brigade."
