    - text: "Washington decides the posture: the 2nd Brigade of the 101st Airborne was not replaced (announced 29 Oct 2025), about 1,000 US troops remain, and the House and Senate Armed Services chairs said they were not consulted. Romania can lobby but not compel; the base it is building for NATO's largest hub has no guaranteed tenants."
