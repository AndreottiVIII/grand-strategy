    - text: "The force is funded and staffed below plan and its contributors are leaving: Kenya brought its second contingent home in March 2026 and Chad is replacing it. Haiti's own police cannot yet hold the ground the force takes. The biggest attack on the force since it began operating came on 18 October in Croix-des-Bouquets, and the mission's envoy told the Security Council that the gangs were testing it, with reprisal killings and advances into Kenscoff and the Artibonite (AP, 19 October)."
