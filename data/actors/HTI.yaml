grand_strategy:
  objectives:
    - rank: 1
      text: "Get back an elected government. The Transitional Presidential Council, formed in April 2024 to hold power until an election or 7 February 2026, dissolved on that date with no presidential election held and no successor structure agreed. The prime minister, Alix Didier Fils-Aime, governs with the backing of Washington, which threatened 'serious consequences' against any move to oust him. The provisional electoral council (CEP) published a calendar on 27 July 2026 for a general election in December 2026 (13 December in the Wikipedia summary read, with a runoff on 21 February 2027 listed). The election is conditional on security and funding, and the 30 August date set earlier was dropped; elections have slipped since 2019, so the date is a target, not a fact."
