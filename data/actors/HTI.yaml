  means:
    - domain: military
      text: "A foreign-manned force, not a Haitian one: the GSF works with the Haitian National Police and the Armed Forces of Haiti. Personnel were pledged by Kenya (until its exit), Chad, Jamaica, the Bahamas, Guyana, Barbados, Antigua and Barbuda, Bangladesh and Benin. Pledges are not deployments; the troops in place are more than 2,000 (AP, 22 October), against about 1,500 reported at the renewal of the mandate on 29 September (Reuters). El Salvador is in the force too, with pilots and technical staff for medical evacuation by its president's account, and four of its personnel went missing after the ambush of 18 October (AP, 21 October)."
