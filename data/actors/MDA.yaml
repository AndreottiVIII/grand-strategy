  reading: 'Moldova is a state whose strategy is to turn its geography into a European fact before Russia turns it into a Russian one. PAS and Sandu hold three keys at once: a parliamentary majority renewed on 28 September 2025 despite a funded opposition, a candidate status that became real negotiations in June 2026, and a security web (EU, Romania, Ukraine, the US in Congress) that substitutes for the alliance that neutrality forbids. The central Luttwakian pattern is that every victory in the East is paid for on the Transnistrian and Gagauz flanks: cutting Gazprom and Cuciurgan freed the right bank from blackmail but ruined the left bank it hopes to reintegrate; defending elections with courts and bans hardens the audience Moscow has always had in Comrat; and tying accession to Ukraine''s carries both momentum and the Hungarian veto. Two signals that are not rows: the decision to recall the ambassador from Moscow rather than expel the Russian embassy, which keeps the channel that Russia''s own embassy says it wants; and Sandu''s June 2026 call to put the Russian withdrawal into any Ukraine settlement, which her own foreign minister resists. Whether Moscow is an adversary is a question the ontology answers by structure: Russia''s declared aim in Chișinău is a compliant government, not the end of Moldova, and Moldova''s aim is a Russian departure, not Russian defeat, so the grade is rival, the hardest rival on the map.'
