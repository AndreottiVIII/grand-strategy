    - text: "Pressure on Israel closes the Dutch door to the Palestinians. The entry ban on Ben-Gvir and Smotrich (Jul 2025), the settlement-goods ban (in force 22 Sep 2026) and the EU sanctions push were meant to protect a two-state outcome, but on 27 Sep 2026 Israel stripped the status of the Dutch diplomats in Ramallah, the Kingdom's channel to the Palestinian Authority, and in August removed Dutch staff from the Gaza coordination centre."
