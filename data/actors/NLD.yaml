    - text: "Capacity limits and a shallow stock: the defence minister says the country is 'at its limit' on new Patriot missiles for Ukraine, the NATO estimate for 2025 is 2.6% of GDP against a 3.5% target, and Ukraine's air defence still depends on American Patriot missiles that the US war on Iran has made scarce."
