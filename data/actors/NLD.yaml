    - text: "Integration with Germany multiplies a small army and subordinates it. The 11th, 43rd and 13th brigades fight inside German divisions, which gives three divisions' worth of capability, but Dutch land power now depends on German readiness, procurement and political will - while The Hague also tells itself that deployment decisions stay national."
