    - rank: 2
      text: "Make Russia pay and keep Ukraine in the fight: about EUR 9.1bn spent on military aid and EUR 11.6bn earmarked (July 2026), F-16s delivered, a 2024 ten-year bilateral security agreement, a leading place in the Coalition of the Willing and in the ten-nation air-defence initiative; and justice for MH17 through the ICAO Council (12 May 2025) and the European Court of Human Rights (9 Jul 2025)."
