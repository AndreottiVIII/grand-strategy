    - text: "Geography of the Kingdom: Aruba, Bonaire and Curaçao lie under 80 km from Venezuela, a Dutch general warned that the US build-up there far exceeds counter-narcotics needs, and the Kingdom can defend the islands only with the small units it keeps on them."
