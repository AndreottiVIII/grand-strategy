  paradoxes:
    - text: "Seizing Nexperia to keep chip know-how in Europe produced a Chinese export ban that nearly stopped European carmakers, a retreat (the order was suspended on 19 Nov 2025), and a Chinese Nexperia that in August 2026 announced its own 12-inch wafer lines and said it no longer needs Europe - the intervention accelerated the leak it was meant to prevent."
      confidence: B
      sources:
