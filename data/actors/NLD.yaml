    - text: "Staying out of the Venezuela operation protected the Kingdom's position and cost its cover. The Netherlands refused US use of Curaçao and halted joint counter-drug operations in January 2026, yet the Kingdom's islands sit under a US build-up with a carrier about 100 km away, and the Dutch Caribbean must now guard its own waters without the partner that had been doing most of the work."
