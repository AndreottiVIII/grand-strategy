  constraints:
    - text: "A minority government. The Jetten cabinet (D66, CDA, VVD; sworn in 23 Feb 2026, 117 days after the election) holds 66 of 150 seats and 22 of 75 in the Senate, the first minority cabinet without a support agreement since 1918, and has to find votes issue by issue - including for the 3.5% defence law and its 'freedom tax'."
      confidence: A
      sources:
