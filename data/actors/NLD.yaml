    - text: "Exposure to both great powers at once. The United States dictates the semiconductor-control line (ASML's China share was about 33% in 2025 and is guided to about 20% in 2026; the MATCH Act would extend controls to servicing), while China showed on Nexperia that it can halt European car lines within days."
