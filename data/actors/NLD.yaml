        - {url: "https://www.government.nl/latest/news/2025/07/09/european-court-of-human-rights-russia-responsible-for-downing-of-flight-mh17", title: "European Court of Human Rights: Russia responsible for downing of flight MH17", publisher: "Government of the Netherlands", date: 2025-07-09, tier: 1}
