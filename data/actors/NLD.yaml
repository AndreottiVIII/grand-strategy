    - text: "Legal reach: the Dutch government can act against shadow-fleet tankers in its ports but needs new laws for ships in the exclusive economic zone, and bills were only due before the summer of 2026; the rest of the EU budget, migration and energy files are decided by unanimity or qualified majority with partners who differ."
      confidence: B
