      sources:
        - {url: "https://www.eurointegration.com.ua/eng/news/2026/07/7/7241103/index.amp", title: "Netherlands says it has exhausted its capacity to provide military aid to Ukraine", publisher: "Evropeiska Pravda", date: 2026-07-07, tier: 3}
