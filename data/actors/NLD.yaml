        - {url: "https://www.atlanticcouncil.org/dispatches/what-rob-jettens-new-minority-government-means-for-dutch-and-european-defense/", title: "What Rob Jetten's new minority government means for Dutch and European defense", publisher: "Atlantic Council", date: 2026-03-13, tier: 2}
    - text: "A divided electorate on the old questions. The PVV left the Schoof coalition on 3 Jun 2025 over asylum, the election of 29 Oct 2025 ended in a tie of 26 seats between D66 and Wilders' PVV, and Wilders sits in opposition; the 2025 NSC exit (22 Aug) showed that Israel policy can break a cabinet."
      confidence: A
