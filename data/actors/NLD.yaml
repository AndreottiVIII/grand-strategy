    - text: "The Hague summit bought the Americans' commitment and a bill The Hague cannot yet pay. The Netherlands hosted the 5% pledge, but the 3.5% core target needs EUR 16-19bn a year more than the 2% baseline, a minority cabinet has to fund it through a 'freedom tax' that parties from left to right criticise, and in January 2026 Trump threatened tariffs on the Netherlands over its Greenland contingent."
      confidence: B
