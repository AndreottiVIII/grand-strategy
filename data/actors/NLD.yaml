    - text: "Following Washington on ASML protects the American alliance and erodes the Dutch champion: licences for the advanced DUV machines (2023) and for servicing (2024) cut China's share of ASML sales from about 33% in 2025 to a guided 20% in 2026, Beijing started domestic DUV output in July 2026, and the proposed MATCH Act would make The Hague extend the controls again - the more the Netherlands aligns, the less the policy is its own."
      confidence: B
      sources:
