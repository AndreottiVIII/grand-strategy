  means:
    - domain: diplomatic
      text: "Host and norm entrepreneur: the Hague summit of 24-25 June 2025 (Rutte's first as NATO Secretary General), the seats of the ICJ, the ICC and the Specialist Chambers, MH17 litigation, and a record of using law as a weapon - ICAO and the ECtHR found Russia responsible, and the Israeli ministers Ben-Gvir and Smotrich were declared persona non grata on 28 Jul 2025."
