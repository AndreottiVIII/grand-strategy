      sources:
        - {url: "https://www.atlanticcouncil.org/dispatches/what-rob-jettens-new-minority-government-means-for-dutch-and-european-defense/", title: "What Rob Jetten's new minority government means for Dutch and European defense", publisher: "Atlantic Council", date: 2026-03-13, tier: 2}
