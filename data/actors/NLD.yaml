grand_strategy:
  objectives:
    - rank: 1
      text: "Keep the United States inside European security while building a European pillar around it: the Jetten coalition agreement calls NATO the cornerstone, the US the power with which the Netherlands shares most interests, and a stronger European pillar within NATO its main security goal (including a European buying mechanism and an opening to French-led talks on nuclear deterrence)."
