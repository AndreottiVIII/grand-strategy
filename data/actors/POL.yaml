  reading: 'Poland is a frontline state that has turned geography into rank: it spends the most in NATO, hosts about 10,000 US troops and the logistics hub of the Ukraine war, and treats Russia not as a rival but as the standing
    threat. Its grand strategy is a double reinsurance. The Atlantic leg (American troops, F-35s, Patriot, hopes of a permanent base and of nuclear sharing) is run mostly by President Nawrocki; the European leg (SAFE money,
    the German pact, French deterrence talks, a revived Visegrad) is run by Tusk''s government. They are complementary on paper and rivalrous in practice, and the Luttwak logic bites exactly there: the more Warsaw tries to
    be everyone''s indispensable ally, the more each guarantor discounts a promise that two offices make differently. The same logic runs through its neighbours. Poland needs Ukraine standing but taxes it with grain bans and
    Volhynia; it needs Germany but keeps a reparations claim; it seals the Belarus border and in doing so cuts the Chinese rail traffic that crosses it. The grade of Russia is ''adversary'' rather than ''rival'' because Warsaw''s
    own officials call Russian sabotage state terrorism and Russia the main threat to Poland and Central Europe, and because the Kremlin itself says relations have ''deteriorated completely''; against that, Poland has no aim
    of regime change in Russia, which is why the grade carries confidence B and not A. Ukraine is a ''reluctant ally'' - indispensable, aligned by necessity, with an open historical wound - and Belarus a ''rival'' that is
    warming only because Washington brokered a prisoner swap. The central uncertainty is what Poland is in 2027: a country whose security depends on a US president''s mood, or one that has bought, built and borrowed enough
    to depend on itself.'
