  reading: |
    Saint Kitts and Nevis sells its passport and its Caribbean tourism, and its foreign policy rests on a long recognition of Taipei since 1983, the British and Commonwealth tie, and a US visa door that now narrows for immigrants. The passport trade is both its revenue and the thing that draws pressure, so US visa rules and the investment market are read together. China's pressure and the Nevis secession question are not sourced in this pass and stay open.
