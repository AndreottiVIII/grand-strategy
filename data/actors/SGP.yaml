  paradoxes:
    - text: "Indispensability is the exposure. The more Singapore lodges both great powers in its economy and its bases - US access at Changi and the F-35s, China as first trading partner and a rising source of investment - the more each can demand and the more it loses when they collide. Wong foresees US-China trade grinding to a halt and warns of a miscalculation over Taiwan; Balakrishnan calls Hormuz a possible dry run for the Pacific. The small state that cannot choose is the first to be squeezed when choosing is forced."
