      text: "Stay sovereign and free to choose: a region not dominated by one power, rules that 'apply equally to all' (the small state's only shield), and no forced choice between Washington and Beijing. Wong, April 2025: for a small open economy the global shifts are 'deeply worrying'; September 2025: Singapore wants to engage all major powers and not be 'forced to choose sides'."
