  reading: |
    Madagascar's grand strategy in 2026 is to turn a military takeover into a managed transition: an elected successor by late 2027, the African Union back in the room, and the Scattered Islands kept on the agenda against Paris. Its levers are the powers already present on the island: France, with the islands and an Élysée channel used in February 2026; China, its largest trading partner; the United States, whose AGOA preference is still in renewal; and the EU, whose budget aid, frozen since 2010, only began to thaw in November 2025. The paradox is that the officers who give the regime its strength are also why the AU, the donors and the protesters are not yet persuaded.
