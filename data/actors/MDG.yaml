grand_strategy:
  objectives:
    - rank: 1
      text: "Carry the military takeover of October 2025 to a civilian-branded exit. Col. Michael Randrianirina, a military leader, took over after the Gen Z protests (the Guardian headline of 15 October 2025: 'military leader set to be sworn in as president'). His two-year roadmap, released at the end of February 2026, sets consultations to the end of 2026, a new constitution, and presidential elections due in late 2027. In March 2026 he dismissed the prime minister and the cabinet without giving a reason, and the Gen Z movement voiced concern about the 'militarisation' of the regime."
