    text: Remain the sole UN-recognised government, and in office, until an election on terms Dbeibah can survive. The GNU was installed through a UN process in 2021 for elections that were set for December
      2021 and never held; the House of Representatives voted on 13 Aug 2024 to end its term and appointed a rival government in Benghazi, yet the UN protocol list still names Dbeibah as prime minister,
      and he stayed in office after thousands demanded his resignation on 16 May 2025.
