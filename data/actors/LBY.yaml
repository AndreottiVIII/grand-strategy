recognition:
  note: 'Two rival governments. This card is the internationally recognised Government of National Unity in Tripoli (prime minister Abdulhamid Dbeibah), listed by the United Nations as Libya''s government.
    The House of Representatives voted on 13 Aug 2024 to end its term and backs a rival Government of National Stability in Benghazi (the Hammad government), whose military arm is Khalifa Haftar''s Libyan
    National Army; Haftar''s camp holds most of the oilfields. The eastern authority has no actor of its own in the atlas: it is recorded through this card''s objectives, constraints and actions, and through
    the other cards that deal with it.'
  source: https://www.un.org/dgacm/sites/www.un.org.dgacm/files/Documents_Protocol/hspmfmlist.pdf
