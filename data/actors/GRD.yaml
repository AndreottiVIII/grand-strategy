  reading: |
    Grenada's strategy, as far as the sources read show it, is small-state survival through the regional bloc: CARICOM partners are its first call for relief and security, and its own means are a request for a helicopter, a storm-battered outer island and a passport it sells to investors. Its one clear external line in 2026 is to press diplomacy and sovereignty against the US operation in Venezuela, while Washington asks it for a security favour. Recovery from Beryl, not foreign policy, remains the binding constraint of 2024-26. Confidence C throughout: the Wikipedia index was read, but press summaries of July 2024 and January 2026 are the only sources opened, and the UK, the Taiwan switch, CARICOM as a bloc, the nutmeg and tourism economy and the Ukraine and Gaza positions are still open and unwritten.
