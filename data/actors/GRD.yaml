  reading: |
    Grenada's strategy, as far as the sources read show it, is small-state survival through the regional bloc: CARICOM partners are its first call for relief and security, and its own means are a request for a helicopter and a storm-battered outer island. The one hard fact the sources give is the scale of Beryl's damage on Carriacou, which makes recovery, not foreign policy, the binding constraint of 2024-26. Confidence C throughout: only press summaries of July 2024 were read, so the United States, China, the United Kingdom, the CARICOM chairmanship, the citizenship-by-investment scheme, the nutmeg and tourism economy and the paradox are still open and unwritten.
