    Suriname's strategy in 2026 is to bridge from a debt-and-IMF present to the 2028 oil start, with the Netherlands kept close as the partner that has kinship under it. The sources here are thin: one tier-3 wire report covers the oil, debt and IMF, and the Dutch card's tier-1 Royal House page covers the visit. China, Guyana, France, India and the United States have not been read from Paramaribo's side, so their postures are not yet written.
