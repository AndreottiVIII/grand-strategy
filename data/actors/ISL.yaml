  reading: |
    Iceland is a NATO state with no army whose security rests on Washington, and in 2026 that dependence became a source of friction: after Trump's Davos gaffe and the September map post, Reykjavík summoned the US ambassador but did not change course. Its answer to the EU question is the same caution: Icelanders voted on 29 August 2026 not to restart accession talks, and the government set membership aside until 2028 while keeping the EEA. The Arctic role grows through NATO and the UK-led Joint Expeditionary Force rather than through forces of its own. Open gaps: the outcome of the US force-posture review and the size of the US presence at Keflavík were not found.
