  reading: |
    Palau holds three cards out of proportion to its size: a Taipei recognition that Beijing wants, a US Compact and military access that Washington needs in the western Pacific, and the Forum meeting it hosted in 2026. Its money comes from Washington under the Compact and from tourists, a large share of them Chinese, so the government that refuses Beijing's price depends on Beijing's visitors. The paradox sits at the centre of the card: the cards that keep Palau's standing with Washington and Taipei are the ones that expose its economy to Beijing's pressure.
