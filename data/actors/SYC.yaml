  reading: |
    Seychelles has no treaty ally and keeps several partners at once: India for coast-guard and maritime security, China for the Belt and Road and its fifty years of ties, the United States and the United Kingdom for security and economic partnership, and Qatari capital for a hotel on Assomption. The 2025 runoff, won by Patrick Herminie, was fought partly over a lease that critics said favoured foreign interests, and his government has since pursued the Indian, Chinese and American files at once. Every partner meets the same veto: a foreign base stalled in 2018 under public fears for sovereignty, and the Assomption lease shows that foreign money in the islands carries the same cost.
