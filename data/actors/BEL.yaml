      text: "Stay inside the Western security order while rearming from the bottom of the NATO table: the Strategic Vision 2025 (approved 18 Jul 2025) sets the budget at 2% of GDP in 2025 (EUR 12.8bn, up from 1.29% in 2024), rising to EUR 21.3bn in 2034, 11 more F-35s (45 in all), NASAMS air defence and a third frigate. In July 2026 Francken committed to hold 2% until 2029 and to draw a roadmap to the NATO 3.5% core target, which he calls 'particularly difficult' in the current budget climate; the government also counts 'resilience' spending (railways, cyber) to claim a total of about 3.4%."
