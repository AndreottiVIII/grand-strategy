  reading: |
    Papua New Guinea buys security from its partners (a mutual defence treaty with Australia in 2025, access for US forces since 2023) while its economy stays in foreign hands: LNG and nickel are run by foreign operators, and Chinese money finances the mines. The central constraint is Bougainville: its independence can only be decided by a national parliament that has not yet voted, so the state's future shape is settled in Port Moresby's own politics first. This is a first pass. Tribal violence, the state's own capacity, the Solomon Islands, Fiji, the Philippines, New Zealand and the Ukraine and Gaza positions are not yet sourced.
