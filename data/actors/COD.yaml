      text: "Recover the eastern provinces: push the AFC/M23 out of Goma and Bukavu, taken in January and February 2025, and the Rwandan Defence Force out of the Kivus, through the Washington track (framework of 27 June 2025, Washington Accords of 4 December 2025) and the Doha track (framework of 15 November 2025). Kinshasa wants withdrawal and implementation, not the defeat of Rwanda; its own calendar is the ceasefire verification and the eight Doha protocols, of which only two were signed by early 2026."
