  reading: |
    Kinshasa has lost its two largest eastern cities to a rebellion that its neighbour backs, and it cannot retake them alone, so it has spent 2025-2026 buying partners: Burundian troops in South Kivu, Ugandan operations against the ADF, Qatar's Doha track, Washington's minerals-for-security deal and an Angolan mediation that has come and gone. Every track gives it a seat and gives its enemies one too, which is why the strategy works by keeping the initiative with others rather than by winning on the ground. The minerals are the currency of the whole effort and the reason the outside powers are present, with China already holding most of the cobalt through Sicomines and the United States now seeking access. The 2028 succession has moved the decisive contest from the eastern front to the capital, where the Catholic bishops and the opposition are the only national forces able to stop a third term, and that is the constraint no foreign mediator can remove.
