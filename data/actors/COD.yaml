      text: "Turn the subsoil into security and capital: cobalt and copper from the Katanga belt, coltan from the Kivus, sold to the buyers who bring infrastructure and protection. The 2008 Sicomines contract with China, renegotiated to USD 7bn of infrastructure, and the minerals-for-security partnership with the United States of 4 December 2025 are the two instruments; the mines stay Congolese in law and mostly Chinese in operation."
