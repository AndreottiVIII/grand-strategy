  reading: |
    Ecuador's grand strategy is to hold the state together against gangs that now fight it as an armed conflict, and to find a stronger patron for that fight than its own police and army. The route it wanted, US bases, was refused by voters in November 2025, and the other tools it used, the raid on the Mexican embassy and the tariff war with Colombia, produced a rupture and then a truce. Not verified for this card: oil and bananas as the economy, the debt, the 2025-26 energy crisis, the Chinese FTA and loans, the EU, Peru, and the US tariff.
