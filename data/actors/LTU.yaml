        - {url: "https://lrt.lt/en/news-in-english/19/2838117/lithuania-earmarks-further-eur223m-for-ukraine-this-year-defence-minister", title: "Lithuania earmarks further EUR 223m for Ukraine this year", publisher: "LRT", date: 2026-02-13, tier: 3}
        - {url: "https://www.gov.pl/web/diplomacy/minister-radoslaw-sikorski-hosts-lublin-triangle-foreign-ministers-meeting", title: "Minister Radoslaw Sikorski hosts Lublin Triangle foreign ministers meeting", publisher: "Ministry of Foreign Affairs of Poland", date: 2025-07-16, tier: 1}
    - rank: 4
      text: "Isolate Belarus while it backs Russia's war and runs Astravets below nuclear-safety standards, and shut hybrid pressure (smuggling balloons, migrants) at the border - without letting Washington's transactional line on Minsk (potash sanctions lifted in March 2026) undo the EU sanctions wall that Vilnius guards."
      confidence: B
      sources:
