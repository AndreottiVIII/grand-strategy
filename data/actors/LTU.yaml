    - rank: 6
      text: "Repair relations with China without giving up the Taiwan link that provoked the 2021 coercion: the Sinkevicius programme (July 2026) seeks to normalise ties and restore representation to the level of other EU states, while President Nauseda insists that only Taipei can rename its representative office and warns that reopening the question could cost the office altogether."
