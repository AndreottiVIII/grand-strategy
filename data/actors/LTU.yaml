    - domain: military
      text: "A land-power build-up: 44 Leopard 2A8 tanks (EUR 950m, delivery by 2030, the first armoured unit Lithuania has had), 8 HIMARS launchers (USD 495m, with ATACMS), NASAMS deliveries from 2026, a national division headquarters by 2030, Baltic Defence Line fortifications, and a German brigade of about 5,000 at Rukla and Rudninkai under which NATO's multinational battlegroup was placed on 4 Feb 2026."
      confidence: A
      sources:
        - {url: "https://www.edrmagazine.eu/lithuania-procures-leopard-2-a8-main-battle-tanks-from-knds", title: "Lithuania procures Leopard 2 A8 main battle tanks from KNDS", publisher: "EDR Magazine", date: 2024-12, tier: 3}
