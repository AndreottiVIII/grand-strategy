grand_strategy:
  objectives:
    - rank: 1
      text: "Deter and, if deterrence fails, hold the line against Russia on a frontier that is only a few hundred kilometres wide: the Suwalki corridor between Kaliningrad and Belarus. The state's own intelligence says Russia could be ready for a limited conflict in the Baltic region within 3-5 years of a ceasefire in Ukraine (1-2 years if sanctions are lifted), so the aim is to be a costlier target than the neighbours."
      confidence: A
      sources:
        - {url: "https://kam.lt/wp-content/uploads/2026/03/National-Threat-Assesment-2026.pdf", title: "National Threat Assessment 2026", publisher: "VSD and AOTD (Lithuanian intelligence)", date: 2026-03, tier: 1}
        - {url: "https://www.baltictimes.com/lithuanian_intelligence_warns_russia_could_target_baltic_region_within_years", title: "Lithuanian intelligence warns Russia could target Baltic region within years", publisher: "Baltic Times", date: 2026-03, tier: 3}
    - rank: 2
      text: "Keep the allies physically on the ground and bind them with money: a permanent German brigade (full by 2027), a rotational US presence that Vilnius now offers to pay for as a permanent base, NATO's forward land forces, and a national division by 2030 financed by EU loans. Defence spending is the currency - 5.38% of GDP in 2026 and at least about 5% planned for 2027."
      confidence: A
      sources:
        - {url: "https://www.osw.waw.pl/en/publikacje/analyses/2026-07-15/new-government-lithuania-third-social-democratic-cabinet", title: "A new government in Lithuania: the third Social Democratic cabinet", publisher: "OSW", date: 2026-07-15, tier: 2}
        - {url: "https://www.lrt.lt/en/news-in-english/19/3076225/lithuania-plans-eur4-8-billion-for-defence-in-2027-substantial-budget-deficit", title: "Lithuania plans EUR 4.8 billion for defence in 2027, substantial budget deficit", publisher: "LRT", date: 2026-10-08, tier: 3}
        - {url: "https://www.defensenews.com/global/europe/2026/10/06/lithuania-says-it-would-pay-the-cost-if-us-establishes-military-base/", title: "Lithuania says it would pay the cost if US establishes military base", publisher: "Defense News (Reuters)", date: 2026-10-06, tier: 3}
    - rank: 3
      text: "Make Ukraine's survival and Euro-Atlantic anchoring part of Lithuania's own security: military aid fixed by law at 0.25% of GDP a year (EUR 223m earmarked for 2026), non-recognition of any Russian annexation, and backing for Ukrainian EU and NATO membership - the Lublin Triangle with Poland is the political frame."
      confidence: B
      sources:
