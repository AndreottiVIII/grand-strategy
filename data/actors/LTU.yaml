  paradoxes:
    - text: "The more Lithuania secures itself by treaty exit and fortification, the more it gives Moscow and Minsk to point at. Leaving the cluster-munitions and Ottawa conventions and moving to lift the constitutional ban on nuclear weapons buy capability and a seat in NATO's deterrent, but each step is cited in Moscow as proof of aggression (Russia criticised the nuclear amendment and the proposed US base in the same week) and costs the moral standing Lithuania uses to lead on Ukraine and sanctions."
