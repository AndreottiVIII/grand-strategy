        - {url: "https://www.osw.waw.pl/en/publikacje/analyses/2026-07-15/new-government-lithuania-third-social-democratic-cabinet", title: "A new government in Lithuania: the third Social Democratic cabinet", publisher: "OSW", date: 2026-07-15, tier: 2}
    - rank: 5
      text: "Complete the break with the Russian and Belarusian energy systems and become a hub rather than a periphery: Baltic grid synchronised with continental Europe (9 Feb 2025), Klaipeda LNG terminal, Via Baltica and Rail Baltica, the Polish-owned Mazeikiai refinery kept running. Dependence now runs west and north, to Poland, Germany, the Nordics and the EU budget."
