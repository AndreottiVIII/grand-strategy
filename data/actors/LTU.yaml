    - domain: diplomatic
      text: "Treaty exits as signalling and capability: the Convention on Cluster Munitions (effective 6 Mar 2025) and the Ottawa mine-ban convention (effective 27 Dec 2025), the latter jointly urged by the defence ministers of Lithuania, Latvia, Estonia and Poland with Finland following; and a first Seimas vote (106-18, Oct 2026) to strike Article 137 from the constitution so that allied nuclear-armed aircraft and ships can enter."
