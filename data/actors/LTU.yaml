    - domain: economic
      text: "EU money and a deficit it is willing to run: a EUR 6.375bn SAFE defence loan (45 years, 10-year deferral; first EUR 956m paid in June 2026), most of it earmarked for the national division, and a 2027 general-government deficit planned at about 3.8% of GDP, above the EU limit. Sanctions as economic policy: the 2022 ban on Belarusian potash transit through Klaipeda, held against US pressure."
