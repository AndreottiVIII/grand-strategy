  means:
    - domain: diplomatic
      text: "Agenda-setting inside NATO and the EU out of proportion to size: a Lithuanian is the EU's defence commissioner (Kubilius), Vilnius pushes sanctions on Belarus and on Russian grain transit (proposal of 8 Oct 2026), holds the veto on EU potash sanctions, and the Seimas has called for Russia to be recognised internationally as a terrorist state."
      confidence: B
      sources:
        - {url: "https://www.lrt.lt/en/news-in-english/19/1943303/lithuanian-parliament-calls-for-international-recognition-of-russia-as-terrorist-state", title: "Lithuanian parliament calls for international recognition of Russia as terrorist state", publisher: "LRT", date: 2023-03-21, tier: 3}
