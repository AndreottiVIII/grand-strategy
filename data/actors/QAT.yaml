    text: 'Make an attack on Qatar too costly to repeat: a US guarantee in writing (Executive Order 14353 of 29 Sep 2025 treats any armed attack on Qatar''s territory, sovereignty or critical infrastructure as a threat to US peace and security), the major non-NATO ally status of 2022, Al Udeid, Turkish troops at Tariq bin Ziyad, Patriot and counter-drone purchases and, since the Iran war, a declared aim of Gulf ''self-sufficiency in security''. Regime survival and sovereignty come before every other aim after the Israeli strike on Doha (9 Sep 2025) and Iran''s attacks (June 2025, 28 Feb 2026 onwards).'
