  reading: |
    Federated States of Micronesia runs its foreign policy inside a treaty: the Compact with the United States, renewed and funded in 2024 with US$3.3 billion over 20 years, is the anchor, and the one stance here sourced at B. Its second relation, with Beijing since 1989, is a small trade and aid tie whose recent record this pass did not read, and the other two Compact states (Marshall Islands and Palau), Japan, Australia and the Pacific Islands Forum are open gaps. The one dated action read so far, the September 2025 vote against the New York Declaration, shows the Compact alignment at work in the UN.
