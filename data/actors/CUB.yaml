  reading: |
    Cuba's strategy is to outlast the fuel blockade without changing its political order, and it keeps every channel open, from a Russian tanker and Vietnamese rice to a Mexican offer and Vatican mediation, while refusing to negotiate the system itself. Its means are thin: tourism run by foreign chains and a few diplomatic channels, against a US that has turned the fuel supply itself into the lever. The paradox is structural: the pressure meant to make Havana bend works through its suppliers, so each partner who hesitates leaves the grid darker and pushes more Cubans out.
