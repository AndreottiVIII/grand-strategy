    - text: "A single buyer for the mineral chain. Most of Zimbabwe's lithium output goes to China and Chinese firms own the largest mines, so Beijing's processors set the terms of the value chain the export ban is meant to build. The 2022 USD 180m purchase of Bikita Minerals by Sinomine is the best-known case."
      confidence: C
      sources:
