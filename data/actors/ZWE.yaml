  paradoxes:
    - text: "The export ban meant to keep value at home favours the Chinese-financed plants that can afford processing. A Bikita community leader sees no tangible jobs from value addition, and smaller miners warn that processing plants, unreliable power and scarce finance keep them out, so the policy meant to widen the base may concentrate it."
      confidence: C
