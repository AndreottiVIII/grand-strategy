    - rank: 2
      text: "Turn lithium and other raw minerals into processing income at home. Harare suspended exports of raw minerals and lithium concentrate in February 2026 to push local processing, and officials say the policy drew more than USD 1bn into the lithium value chain. The ban is reported from search results; the article itself was not opened in this pass."
