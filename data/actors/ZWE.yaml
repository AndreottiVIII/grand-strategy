    - domain: informational
      text: "Control of the legal rules. The term extension moves the choice of president from the electorate to parliament. Critics call it a constitutional coup; search results (articles not opened in this pass) also report arrests of activists who opposed it and a court challenge dismissed on procedural grounds."
      confidence: B
      sources:
