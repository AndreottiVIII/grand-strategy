  reading: |
    Zimbabwe's grand strategy is the survival of the ZANU-PF system under Mnangagwa: the 2026 amendment extends his rule to 2030 by moving the choice of president from voters to parliament. Its money comes from minerals, above all lithium, that flow mostly to China, which funds and buys the extraction, while the Western sanctions that remain (the 2024 Global Magnitsky listings and ZIDERA) keep the other door narrow. The export ban is the state's attempt to turn that dependence into domestic value, and the paradox is that the Chinese-financed plants are the ones best placed to benefit from it.
