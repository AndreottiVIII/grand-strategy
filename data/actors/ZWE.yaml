      text: "Keep Emmerson Mnangagwa in office to 2030. The Senate passed a constitutional amendment on 24 June 2026 by 75 votes to 4, lengthening presidential terms from five to seven years, ending direct election of the president (parliament elects him) and keeping him in office until 2030. The bill still needed his signature in the source read; the signature date is not verified."
