    - text: "Much alignment with Beijing on the Arctic. After meeting Xi, Carney said he found 'much alignment' with China on the sovereignty of Greenland and its people, while Canada's 2024 defence policy names Chinese and Russian ambitions in the Arctic as the threat that justifies the new spending."
