      text: "Meet NATO's spending and the Arctic: Canada reached 2% of GDP on defence in 2025 (NATO's annual report, March 2026), Carney has committed to 5% by 2035, about USD 150bn a year, and raised the Arctic presence to 365 days a year with over-the-horizon radar against Russia, which he called 'without question' a threat in the Arctic (January 2026)."
