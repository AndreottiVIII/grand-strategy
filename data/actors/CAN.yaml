      text: "Get the oil to a second coast: an Indigenous co-owned bitumen pipeline from Alberta to the British Columbia coast, declared a project of national interest in the November 2025 memorandum with Alberta, then an implementation agreement of 15 May 2026 that set an Alberta application for 1 July 2026 and a federal national-interest designation by 1 October 2026."
