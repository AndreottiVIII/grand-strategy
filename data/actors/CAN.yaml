      text: "Keep the North American frame intact (CUSMA, NORAD, NATO) while Washington coerces it: on 1 July 2026 the United States declined to renew CUSMA 'in its current form', which triggers annual joint reviews while the pact runs to 2036, and a Section 338 duty of 50% on about USD 20bn of Canadian goods applies from 22 August 2026. Carney's line is that the pact survives without any new deal, so the frame is the first objective and the most exposed one."
