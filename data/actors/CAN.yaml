    - text: "A divided domestic consensus. The Alberta pipeline needs British Columbia, where Premier David Eby calls the project 'fictional' and says it threatens the social licence of other coastal projects, and Quebec's Bloc Quebecois opposes it, while a national poll of October 2025 found a majority favourable to a pipeline to the B.C. coast. Ontario's Premier Doug Ford fights the China EV quota as a threat to the car industry."
