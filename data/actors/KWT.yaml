    - rank: 4
      text: "Keep the oil state solvent and diversify it: oil is about 90% of government revenue and nearly all crude, products and condensate leave through Hormuz; output fell to 580,000 b/d in May 2026 and recovered to about 1.97 mb/d in July. The tools are the March 2025 debt law (KD30bn, about USD 97bn, bonds up to fifty years), the revised Vision 2035 (a northern Gulf gateway around Mubarak Al-Kabeer port and Silk City), foreign capital (a USD 16bn KKR-Kuwait Oil Company deal in July 2026) and the Kuwait Investment Authority (assets estimated at USD 1 trillion). The IMF expects a 0.6% contraction in 2026."
