    - rank: 2
      text: "Defend the territory and the infrastructure against Iran and Iraq. Since 28 Feb 2026 Kuwait has been struck by hundreds of Iranian missiles and drones (airport, Mina al-Ahmadi refinery, power and desalination plants, ports, US bases); on 9 Mar 2026 the Emir called it an unprovoked attack by a neighbouring Muslim state, said Kuwait had allowed no use of its land, airspace or waters against it and asserted the right of proportionate self-defence. On the other flank Iraq filed new maritime coordinates at the UN in January-February 2026 that Kuwait and the Gulf states reject."
      confidence: B
