grand_strategy:
  objectives:
    - rank: 1
      text: "Keep the ruling family in control and the succession orderly by governing without the National Assembly: the Emir dissolved parliament on 15 Feb 2024, suspended it and seven articles of the 1962 constitution on 10 May 2024 for up to four years (a restoration window to May 2028), and the Emir and the government now exercise legislative power by decree. The citizenship campaign (a December 2024 law allowing revocation for 'moral turpitude' or acts threatening state security; about 42,000 revoked in six months by March 2025, at least 50,000 by December 2025 on Middle East Eye's count, campaigners say up to 200,000) is part of the same project: narrowing the body of citizens who share the welfare state."
      confidence: B
      sources:
        - {url: "https://constitutionnet.org/news/kuwaits-monarch-dissolves-parliament-and-suspends-constitutional-provisions", title: "Kuwait's monarch dissolves parliament and suspends constitutional provisions", publisher: "ConstitutionNet (International IDEA)", date: 2024-05-13, tier: 2}
