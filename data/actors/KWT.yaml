    - rank: 3
      text: "Keep the United States as the guarantor of last resort while building a second layer of security partners: the Pakistan defence cooperation agreement (signed 11 Jun 2023, ratified late July 2026) is explicitly a framework with no obligation to defend Kuwait, a Joint Defence Committee with India held its inaugural meeting in August 2026, and the UK sent a Rapid Sentry air-defence battery in the 2026 war. AGSI: officials know no other power can replace Washington."
      confidence: B
      sources:
