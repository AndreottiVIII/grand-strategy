      text: "Gas as the bankable asset. The US Export-Import Bank board voted on 13 March 2025 to proceed with a loan of up to USD 4.7bn for the LNG project, after a four-year delay. The loan is what Maputo can show creditors as foreign money already committed, though no source ties it to the IMF talks."
