  reading: |
    Mozambique is a state that sells its gas perimeter and rents its army. The LNG project, relaunched in 2026 with US export credit behind it, is the reason foreign forces stand in Cabo Delgado, and the Rwandan force is now paid for with money Maputo does not yet have, while it answers to Kigali. The IMF deal and the debt restructuring that follows will show whether the state can keep the gas and the paying partners after the EU money and the SADC force have left.
