    - text: "Legitimacy and aid. The October 2024 result is contested; the inauguration in January 2025 drew protests and clashes after Mondlane's return from exile, and Mondlane is largely outside the national dialogue that is to report in November 2026. The regional force left in 2024 and US aid was cut sharply in 2025, so the gap is filled by paid partners."
