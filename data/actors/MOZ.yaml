  paradoxes:
    - text: "Maputo buys its gas security from a force Washington has sanctioned. The US designated the Rwandan defence force on 2 March 2026, and Rwanda has threatened to stop protecting the US-financed gas project if its paid mission is not sustained. The security the state buys protects the export-credit project, and the same force is the one that puts that project at risk."
