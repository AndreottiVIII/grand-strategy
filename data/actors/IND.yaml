  reading: 'India''s grand strategy is relational manoeuvre among the great powers. In Luttwak''s terms it is the strategy of a state strong enough to refuse a patron and not strong enough to ignore any
    of them: it extracts from each - US technology and defence frameworks, Russian oil and arms, Chinese inputs and a quiet border, European markets, Gulf energy and money, Japanese capital - by being too
    large to coerce and too useful to lose. The paradoxical logic is that each of these relations is also a pressure point, and the pressures are not independent. The week of 11-17 September 2026 shows
    the shape: Putin in Delhi on the 11th, Xi on the 12th, the US Congress passing a tariff authority on Russian oil buyers on the 17th. The culminating point of manoeuvre is reached when all three pull
    at once and the price of waiting - a tariff, a border incident, a sanction - overtakes the benefit of keeping options open; in July, with the Hormuz war on, Russian imports hit 2.8 million barrels a
    day just when Washington sought less of them, and the US-India trade agreement that would reward a shift remains unsigned. The Pakistan file is read here as rivalry, not mortal enmity: New Delhi''s
    declared aim is deterrence of terrorism, with a reversible lever (the Indus treaty) and an accepted ceasefire, and it does not seek the end of the Pakistani state - which is what separates it from Israel
    and Iran. The neighbourhood is where the strategy is least comfortable: the instruments of primacy (credit lines, hydropower, refuge for Hasina) generate reactions that open space for China. Confidence
    in this reading is moderate: it rests on tier-3 press for most 2026 events, and several figures (Indonesian and Vietnamese BrahMos values, the Rafale and submarine contracts, the status of the US sanctions
    act) are unconfirmed.'
