  reading: |
    Burundi's grand strategy is to keep the CNDD-FDD in power, which the 2018 referendum and the 2020 election secured for the long term, and to keep the Congo war off its own soil by fighting beside Kinshasa. That alignment puts Bujumbura against the side Kigali is described as backing, so the rivalry with Rwanda now runs through the M23 war as well as through the 2015 coup accusation. The weak point is the economy, a farm-based state of about USD 6.75bn that hosts the refugees the war pushes across its border; the 2025 legislative election, the Rwanda border closure and the sanctions record are not yet verified here.
