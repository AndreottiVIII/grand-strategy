    - rank: 2
      text: "Settle the Cambodian frontier on Thai terms and keep it bilateral: hold the positions taken in 2025, send boundary questions only to the Joint Boundary Commission, and make demining, no new violations and action on the scam compounds the price of normal relations. Bangkok cannot be seen to concede: the leaked call with Hun Sen cost Paetongtarn her office, and the Cambodian fighting was the setting in which Anutin called his election."
