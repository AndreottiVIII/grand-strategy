    - rank: 1
      text: "Keep the established order at home intact: a monarchy protected by the lese-majeste law, and an army, courts and Senate that can remove or dissolve what the voters elect, with a conservative-business coalition in government. The 2025-26 cycle is the proof: Paetongtarn Shinawatra was removed by the Constitutional Court (6-3, 29 Aug 2025), Anutin Charnvirakul took over (5 Sep 2025), called a snap election and won it (Bhumjaithai 192 of 499 seats on 8 Feb 2026), and an amnesty law in force from 24 Aug 2026 covers political offences from 2005 to July 2025 but excludes Section 112."
