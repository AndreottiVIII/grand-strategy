  reading: |
    Solomon Islands sells its logs mostly to China and borrows from it, while its police and security are shared out between Beijing (the 2022 pact and the 2023 policing deal) and Canberra (the 2017 treaty and the A$190 million package of December 2024). Its leverage is the forum it hosted in 2025: as Pacific Islands Forum host it kept every dialogue partner out, and the CSIS analysis reads that compromise as shaped by Chinese pressure, with Taiwan among the excluded. The Manele government, which had resisted closer ties with Australia, fell by no-confidence vote; Matthew Wale took office on 15 May 2026, calls the China pact under review and seeks a comprehensive strategic treaty with Australia, while the July 2026 shiprider deal with the US shows a government that no longer wants to choose one patron.
