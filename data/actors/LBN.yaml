  reading: |
    Lebanon's grand strategy since Aoun's election (9 January 2025) and Salam's government (February 2025) is the strategy of a state trying to become the owner of its own war and peace. The aim is simple to state: one army, one decision on war, Israel out, money in. The means are borrowed: American brokerage, Saudi and Qatari money, European training, Egyptian ideas, a UN mandate that is ending. The 2026 war showed the gap between the declared monopoly and the actual one: Hezbollah fired on 2 March in spite of the cabinet's own ban, and the state paid in dead, displaced and territory. Beirut's answer is not to fight Hezbollah (the army will not, and the state would not survive it) but to move the country's major patrons into a sequence in which Israeli withdrawal, army deployment and donor money arrive together. That is why it signed a framework with a state it does not recognise and why it avoids the word normalisation. It is a strategy of patience and bargaining from weakness, and its test is the pilot zones: if Israel does not withdraw from a place the army has actually cleared, the Shia community will keep its arms for good and the state's whole case will fall. Syria and the Gulf matter because they take the land and sea borders and the money out of Iran's hands; Russia, China and Turkey are marginal. This card is dated 12 October 2026, before the next round of Israel-Lebanon military talks planned for 20-21 October and the EU's formal decision on the army mission.
