grand_strategy:
  objectives:
    - rank: 1
      text: "Close the genocide question with Germany on Namibian terms. The 2021 joint declaration (recognition of the 1904-1908 killings and about EUR 1.1bn over 30 years, framed as development aid) was rejected in Namibia and never signed. President Nandi-Ndaitwah says the revised text is nearly finished, will go to parliament, and should be concluded by the end of 2026."
      confidence: B
      sources:
        - {url: "https://allafrica.com/stories/202604090063.html", title: "Namibia: Genocide Issue Nearly Finalised - Nandi-Ndaitwah", publisher: "allAfrica (The Namibian)", date: "2026-04-08", tier: 3}
    - rank: 2
      text: "Turn Orange Basin oil and green hydrogen into the new economy. TotalEnergies is operator of the Venus block (PEL 56); the company has said it is ready to take a final investment decision once talks with the government are finished, which is not confirmed in the sources found. The EU green partnership was renewed for 2026-2030 in May 2026."
      confidence: C
      sources:
        - {url: "https://thebrief.com.na/2022/02/totalenergies-makes-a-significant-oil-discovery-offshore-namibia/", title: "TotalEnergies makes a significant oil discovery offshore Namibia", publisher: "The Brief", date: "2022-02", tier: 3}
        - {url: "https://www.riotimesonline.com/namibia-oil-green-hydrogen-2026/", title: "Namibia oil green hydrogen 2026 (pointer; single source for operatorship and FID timing)", publisher: "Rio Times", date: "2026", tier: 4}
        - {url: "https://www.republikein.com.na/mw-main/namibia-and-eu-reset-for-the-long-game-NMH010800-3015-12856", title: "Namibia and EU reset for the long game", publisher: "Republikein", date: "2026-05", tier: 3}

  means:
    - domain: economic
      text: "Mineral exports to the United States (N$5.52bn in 2024, up from N$1.09bn in 2023, mostly minerals) and Chinese equity in uranium, the largest being the Husab mine, which New Era reports as China's largest single investment in Africa. Ownership figures differ across sources, and the Walvis Bay port link is not verified in this pass."
      confidence: C
      sources:
        - {url: "https://bilaterals.org/namibia-eyes-new-trade-pact-with", title: "Namibia eyes new trade pact with US after AGOA ended", publisher: "Bilaterals (quoting Windhoek Observer)", date: "2025", tier: 3}
        - {url: "https://neweralive.na/?p=214216", title: "Husab uranium mine and Chinese investment", publisher: "New Era", date: "2025", tier: 3}
    - domain: diplomatic
      text: "Multi-alignment on the energy file: a green hydrogen pipeline assembled for Team Europe financing (HyIron, Hyphen, Zhero, Cleanergy, Daures) and a 2026-2030 renewal with the EU, while Nandi-Ndaitwah met China's foreign minister as president-elect (January 2025) and discussed nuclear cooperation with a Russian deputy prime minister (spring 2025)."
      confidence: C
      sources:
        - {url: "https://www.republikein.com.na/mw-main/namibia-and-eu-reset-for-the-long-game-NMH010800-3015-12856", title: "Namibia and EU reset for the long game", publisher: "Republikein", date: "2026-05", tier: 3}
        - {url: "https://www.fmprc.gov.cn/esp/zxxx/202501/t20250108_11528957.html", title: "Chinese foreign ministry readout of Wang Yi meeting Namibia's president-elect (Spanish version)", publisher: "Chinese Foreign Ministry", date: "2025-01-08", tier: 1}
        - {url: "https://namibiansun.com/international-ns/chinese-ambassador-congratulates-nandi-ndaitwah2025-04-16", title: "Chinese ambassador congratulates Nandi-Ndaitwah", publisher: "Namibian Sun", date: "2025-04-16", tier: 3}

  constraints:
    - text: "The United States has tightened the door it used to keep open. A 21% reciprocal tariff on Namibian goods was announced in 2025 and the government warned it could override AGOA; AGOA lapsed on 30 September 2025 and was reauthorised for one year, to 31 December 2026 (a later single report says 2028; not verified). A new bilateral trade pact is being sought."
      confidence: B
      sources:
        - {url: "https://www.namibian.com.na/trumps-21-tariff-shakes-namibias-exports-threatens-agoa-trade-benefits/", title: "Trump's 21% tariff shakes Namibia's exports, threatens Agoa trade benefits", publisher: "The Namibian", date: "2025", tier: 3}
        - {url: "https://www.ewn.co.za/2026/02/04/us-senate-approves-one-year-agoa-extension", title: "US Senate approves one-year AGOA extension", publisher: "EWN", date: "2026-02-04", tier: 3}
    - text: "The German deal must pass a domestic test. The Landless People's Movement and eleven traditional authorities have asked the government attorney to set the joint declaration aside, and the Ovaherero Genocide Foundation opposes it; affected communities contest the government's monopoly on the negotiation. The National Assembly has been asked to be patient until the revised text is tabled."
      confidence: B
      sources:
        - {url: "https://allafrica.com/stories/202604090063.html", title: "Namibia: Genocide Issue Nearly Finalised - Nandi-Ndaitwah", publisher: "allAfrica (The Namibian)", date: "2026-04-08", tier: 3}

  paradoxes:
    - text: "The oil that pays for the state is also the fossil dependency that the EU green partnership is meant to replace. Namibia courts European green finance and Chinese and Western upstream capital at the same time, so the decarbonisation partner also profits from the new oil."
      confidence: C
      sources:
        - {url: "https://www.republikein.com.na/mw-main/namibia-and-eu-reset-for-the-long-game-NMH010800-3015-12856", title: "Namibia and EU reset for the long game", publisher: "Republikein", date: "2026-05", tier: 3}
        - {url: "https://www.riotimesonline.com/namibia-oil-green-hydrogen-2026/", title: "Namibia oil green hydrogen 2026 (pointer; single source for the FID timing)", publisher: "Rio Times", date: "2026", tier: 4}

  reading: |
    Namibia's strategy under Nandi-Ndaitwah is to convert its minerals and its new offshore oil into a revenue base while keeping every large patron in play: China for uranium capital, the EU for green hydrogen finance, the United States for trade access, and Germany for the historical settlement it cannot close without its own communities. The constraint that binds most tightly is domestic, since the genocide settlement and the land question require consensus that the government does not yet have. The land question is not researched in this pass and stays open.
