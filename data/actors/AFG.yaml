recognition:
  note: "The Islamic Emirate under the Taliban has been formally recognised by one state, Russia (July 2025). Gulf, Central Asian and Turkish governments accept Taliban-appointed diplomats without recognition, and India upgraded its Kabul mission to an embassy in October 2025 without recognising the government. The UN General Assembly seat is still held by the credentials of the former republic's mission; the Credentials Committee has deferred the Taliban claim every year since 2021 and Zelin (August 2026) calls the seat 'the last gate' the government has not passed."
  source: https://www.washingtoninstitute.org/policy-analysis/five-years-taliban-diplomacy-recognition-without-concessions

