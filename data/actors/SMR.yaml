  reading: 'San Marino has no currency of its own and no independent trade policy, since the euro and the customs union bind it to Italian and EU rules. Its grand strategy is to keep the Italian and EU
    frameworks that guarantee its existence while turning its financial sector from a source of distinction into a regulated market. The Captains Regent speak for the state and the Secretariat carries the
    work. Its most important move, the Association Agreement, has been concluded but is not yet signed or ratified, so the reading of the 2026 steps stays provisional.

    '
