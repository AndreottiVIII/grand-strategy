    text: 'Keep the financial centre viable under EU and Italian pressure: finish the banking reform the IMF has recognised as under way, win the dialogue with the ECB and Bank of Italy the Association
      Agreement requires, and attract qualified investors to a sector still short of capital and efficiency.'
