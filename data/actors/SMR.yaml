    text: Secure access to the EU single market and its financial sector through the Association Agreement, without full EU membership. Negotiations concluded December 2023; the Council authorised signature
      on 16 July 2026; signing is scheduled for 19 October 2026 in Brussels and the Council conclusion still needs European Parliament consent.
