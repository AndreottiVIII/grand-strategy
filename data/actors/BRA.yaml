        - {url: "https://en.mercopress.com/2026/10/26/trump-questions-lula-s-victory-as-most-of-the-region-including-the-right-congratulates-him", title: "Trump questions Lula's victory as most of the region, including the right, congratulates him", publisher: "MercoPress", date: 2026-10-26, tier: 3}
    - rank: 2
      text: "Sell to Europe and Asia without losing the Mercosur bloc: the EU-Mercosur partnership agreement was signed on 17 January 2026, provisionally applied from 1 May 2026, and referred by the European Parliament to the EU's top court on 21 January. Argentina's Milei pulls the bloc towards the US and the EU instead of Asia."
      confidence: C
      sources:
        - {url: "https://en.wikipedia.org/wiki/EU%E2%80%93Mercosur_Partnership_Agreement", title: "EU-Mercosur Partnership Agreement (as cited by Wikipedia: Euractiv, 17 Jan 2026; Politico, 1 May 2026; Reuters, 21 Jan 2026)", publisher: "Wikipedia (citations to Euractiv, Politico, Reuters)", date: 2026-05, tier: 4}
