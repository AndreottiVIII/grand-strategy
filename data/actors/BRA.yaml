    - rank: 6
      text: "Keep the minerals and the energy on Brazilian terms: Lula pitches Brazil as a reliable supplier of critical raw materials (niobium, graphite, rare earths) but wants them processed at home, refuses exclusivity, and has left the US request for a federal critical-minerals agreement without a 'political response'; the Chamber passed a critical-minerals bill in May 2026 (343-97), now with the Senate. Partners courted in parallel: Germany, India, Japan."
