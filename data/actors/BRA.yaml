grand_strategy:
  objectives:
    - rank: 1
      text: "Keep the Lula line in office: done on 25 October 2026. In the first round on 4 October Flávio Bolsonaro led with 47.03% to Lula's 45.16%, but Lula won the runoff with about 51.8% to 48.2% (electoral court count as reported), a fourth term from 2027, the first candidate to win a runoff after finishing second in the first round. Flávio Bolsonaro says he will not recognise the result and will seek its annulment. The objective now becomes governing with a strong right-wing bloc in Congress and a foreign line already tested by the vote."
      confidence: B
      sources:
        - {url: "https://www.bbc.com/news/articles/ck1l34ed592no", title: "First-round result, 2026 Brazilian general election (BBC, as cited by Wikipedia)", publisher: "BBC News", date: 2026-10-04, tier: 3}
