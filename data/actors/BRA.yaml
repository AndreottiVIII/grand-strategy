        - {url: "https://en.wikipedia.org/wiki/EU%E2%80%93Mercosur_Partnership_Agreement", title: "EU-Mercosur Partnership Agreement (as cited by Wikipedia: Politico, 9 Jan and 1 May 2026; Euractiv, 17 Jan 2026; Reuters, 21 Jan 2026)", publisher: "Wikipedia (citations to Politico, Euractiv, Reuters)", date: 2026-05, tier: 4}
