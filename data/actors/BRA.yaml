        - {url: "https://www.intellinews.com/brazil-unveils-125bn-tropical-forest-fund-ahead-of-cop30-summit-410145/", title: "Brazil unveils USD 125bn tropical forest fund ahead of COP30 summit", publisher: "bne IntelliNews", date: 2025-11, tier: 3}
    - domain: economic
      text: "The bloc as a trade-negotiating vehicle: Brazil's Senate approved the EU-Mercosur agreement unanimously on 4 March 2026 and it has applied provisionally since 1 May 2026 (Mercosur removes 93% of tariffs on EU goods over up to 15 years; the EU opens a 99,000 t beef quota at 7.5%); Mercosur launched economic partnership talks with Japan on 30 June 2026, a second market opened through the same bloc. It is the most direct answer to the US tariff of 2025."
      confidence: B
      sources:
