        - {url: "https://www.reporteminero.cl/noticia/noticias/2026/05/brasil-ley-minerales-criticos-lula-trump-tierras-raras", title: "Brazil: critical minerals law, Lula, Trump and rare earths", title_original: "Brasil: ley de minerales criticos, Lula, Trump y tierras raras", lang: es, publisher: "Reporte Minero", date: 2026-05, tier: 4}

  means:
    - domain: economic
      text: "Agribusiness: soybeans and beef sold to China, which replaced American soybean buyers in 2025 and is the largest trading partner. China's 55% tariff on Brazilian beef after the quota was reached (30 Sep 2026) shows the lever runs both ways."
