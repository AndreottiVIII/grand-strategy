    - text: "The tariff war that feeds the rival it was meant to starve: Washington's 50% tariff of 2025 cut Brazilian exports to the US (-20.3% in September 2025) while exports to China grew 14.7% in the same month and China took nearly 80% of the soybean exports through October 2025. Pressure meant to bring Brazil back towards the US market pushed the farm sector into the arms of Beijing, which in turn hit Brazilian beef with a 55% duty on 30 September 2026. The US coercion made the second dependency, and Brazil now owes both."
      confidence: B
      sources:
