    - domain: military
      text: "A defence industry that buys autonomy slowly: SIPRI puts 2025 spending at USD 23.9bn (+13% in real terms, the largest in South America, 1.1% of GDP). The assets are the French-built Riachuelo-class submarines and the nuclear-powered boat under construction at Itaguai (first steel cut June 2025), 36 Saab Gripen assembled at Embraer's Gaviao Peixoto line (a heads of agreement for 20 more signed 21 July 2026) and the KC-390 transport (Embraer defence backlog USD 6.1bn in Q2 2026). The means are long-dated and none is a deterrent against a great power."
      confidence: B
      sources:
        - {url: "https://www.opovo.com.br/agencia/bbc/2026/08/06/por-que-ministro-da-defesa-diz-que-brasil-teria-que-so-abrir-o-portao-aos-eua-em-caso-de-ataque-mesmo-apos-alta-de-13-nos-gastos-militares.html", title: "Why the defence minister says Brazil would only have to open the gate to the US in case of attack, even after a 13% rise in military spending", title_original: "Por que ministro da Defesa diz que Brasil teria que so abrir o portao aos EUA em caso de ataque mesmo apos alta de 13% nos gastos militares", lang: pt, publisher: "BBC News Brasil (via O Povo)", date: 2026-08-06, tier: 3}
