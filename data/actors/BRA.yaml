        - {url: "https://www.janes.com/osint-insights/defence-news/industry/brazil-reaches-submarine-programme-milestones", title: "Brazil reaches submarine programme milestones", publisher: "Janes", date: 2026, tier: 3}
    - domain: diplomatic
      text: "The forest as a diplomatic credential: COP30 in Belem (November 2025) launched the Tropical Forest Forever Facility, with more than USD 5.5bn pledged at launch (Norway USD 3bn, Indonesia and Brazil USD 1bn each, France EUR 500m; Germany EUR 1bn announced later), 53 countries endorsing the declaration and a target of USD 125bn (USD 25bn sponsors, USD 100bn private). Brazil's finance minister expects USD 10bn before the COP presidency passes on in November 2026."
