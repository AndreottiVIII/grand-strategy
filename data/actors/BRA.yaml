    - domain: diplomatic
      text: "Multilateral platforms: a BRICS co-founder (Rio summit July 2025; the New Delhi declaration of September 2026 dropped any mention of Ukraine), Mercosur, and the COP30 host. Brazil abstained on the UN General Assembly text on Ukraine of 24 February 2026."
      confidence: B
      sources:
        - {url: "https://digitallibrary.un.org/record/4103179", title: "A/RES/ES-11/10 Support for lasting peace in Ukraine - voting record (Brazil abstained)", publisher: "United Nations", date: 2026-02-24, tier: 1}
