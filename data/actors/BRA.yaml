    - rank: 3
      text: "Make the Amazon the leadership card: a joint pledge with France (March 2024) to halt Amazon deforestation by 2030 with EUR 1 billion over four years for the Brazilian and Guyanese Amazon, and COP30 hosted in Belém in November 2025 as the stage."
      confidence: C
      sources:
        - {url: "https://www.pressreader.com/philippines/philippine-daily-inquirer-1109/20240328/281895893246207", title: "Brazil, France launch $1.1-B program to protect Amazon rainforest", publisher: "Philippine Daily Inquirer (via PressReader)", date: 2024-03-28, tier: 3}
    - rank: 4
      text: "Contain the US coercion of 2025-2026 without a rupture: the 50% tariff of 30 July 2025 over the Bolsonaro trial, partly rolled back, and the 25% Section 301 duty of 15 July 2026 are the costs; the delisting of Justice de Moraes (12 Dec 2025) is the sign that the pressure can be negotiated."
      confidence: B
