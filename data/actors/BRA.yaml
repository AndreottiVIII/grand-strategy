        - {url: "https://lapatilla.com/2026/07/21/lula-da-silva-no-preve-asistir-a-investiduras-presidenciales-de-abelardo-de-la-espriella-ni-keiko-fujimori/", title: "Lula da Silva does not plan to attend the inaugurations of Abelardo de la Espriella or Keiko Fujimori", title_original: "Lula da Silva no preve asistir a investiduras presidenciales de Abelardo de la Espriella ni Keiko Fujimori", lang: es, publisher: "La Patilla", date: 2026-07-21, tier: 3}
    - text: "Energy that lives in the neighbours' hands: Bolivia is Brazil's largest gas supplier (a 3,150 km pipeline of up to 30 million cubic metres a day) while Petrobras now operates only 25% of Bolivian gas output against 60% once, and the Itaipu tariff (Annex C review, 50 years after the treaty) is still open with Paraguay, which wants to sell its surplus on the Brazilian free market. Lula reportedly will not raise the Itaipu price before the vote, so the dossier waits."
