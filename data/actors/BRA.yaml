    - rank: 5
      text: "Turn weight into a seat at the top table: a permanent place on a reformed UN Security Council (with Germany, India and Japan in the G4) and the BRICS as the vehicle for reforming global governance. Lula opened the 81st General Assembly debate on 22 September 2026, the tenth time, with multilateralism, sovereignty and Security Council reform as the themes."
