  constraints:
    - text: "The vote of 25 October settled which foreign policy line the next government carries (Lula's, re-elected with about 51.8%), but not the argument: the loser contests the result, Trump has questioned it, and Lula faces a strong right-wing bloc in Congress that limits his room for manoeuvre. Every choice above was a bet on his re-election; it paid, narrowly."
