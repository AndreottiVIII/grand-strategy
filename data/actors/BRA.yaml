    - text: "Dependence on China as a buyer: China takes the soybeans and beef that carry the trade balance, and it can hit them with tariffs (the 55% beef duty of 30 Sep 2026). Brasilia cannot choose freely between Washington and Beijing on trade."
      confidence: B
      sources:
        - {url: "https://www.reuters.com/world/china/china-adds-55-tariff-brazil-beef-imports-2026-09-30/", title: "China adds 55% tariff on Brazil beef imports after quota is reached", publisher: "Reuters", date: 2026-09-30, tier: 3}
    - text: "US market access: the 2025 tariff was partly rolled back, but the Section 301 case ended in a 25% duty on Brazilian goods (15 July 2026). Washington chooses the sectors and the timing of the pressure."
      confidence: B
      sources:
        - {url: "https://ustr.gov/about/policy-offices/press-office/press-releases/2026/july/ustr-section-301-action-brazils-unreasonable-acts-policies-and-practices", title: "USTR Section 301 action on Brazil's unreasonable acts, policies, and practices", publisher: "Office of the United States Trade Representative", date: 2026-07-15, tier: 1}
    - text: "A hollow sword: the defence minister said on 4 August 2026 that if the US invaded Brazil would have to 'open the gate', for it has neither the equipment nor the money to repair it. A budget decree froze BRL 4.36bn of discretionary defence spending in May 2026, a November 2025 law allows up to BRL 30bn over six years outside the fiscal limit (a ceiling, not a transfer), and spending is 1.1% of GDP (1.3% in 2016). Brasilia can resist Washington in words and in trade, not by force."
      confidence: B
      sources:
        - {url: "https://www.opovo.com.br/agencia/bbc/2026/08/06/por-que-ministro-da-defesa-diz-que-brasil-teria-que-so-abrir-o-portao-aos-eua-em-caso-de-ataque-mesmo-apos-alta-de-13-nos-gastos-militares.html", title: "Why the defence minister says Brazil would only have to open the gate to the US in case of attack, even after a 13% rise in military spending", title_original: "Por que ministro da Defesa diz que Brasil teria que so abrir o portao aos EUA em caso de ataque mesmo apos alta de 13% nos gastos militares", lang: pt, publisher: "BBC News Brasil (via O Povo)", date: 2026-08-06, tier: 3}
    - text: "A neighbourhood turning right: Argentina, Chile, Paraguay, Bolivia and Ecuador are governed from the right, Colombia (Abelardo de la Espriella, inaugurated in August) and Peru (Keiko Fujimori, 28 July) have joined, Kast chose Argentina for his first trip as a 'conservative axis' against Brazil and Milei met Fujimori in Lima weeks after calling Lula a 'thief'. Lula skipped the Chilean, Colombian and Peruvian inaugurations. Brazil's regional leadership is a hand the neighbours can decline to take."
      confidence: C
