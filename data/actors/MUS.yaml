  reading: |
    Mauritius wants the Chagos back and has the 2025 treaty as its best instrument, but ratification now waits on a US consent that Washington withholds and that London has accepted it cannot secure for now. Meanwhile Port Louis plays the two Asian powers against each other for money and security, India through funding and an enhanced partnership, China through a loan and a free trade agreement, without an alliance with either. The test is whether London and Washington rework the deal in a form Port Louis can sign, and whether the Safe City questions at home cost the government room to negotiate.
