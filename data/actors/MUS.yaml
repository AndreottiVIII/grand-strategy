    text: "Recover the Chagos Archipelago, Diego Garcia included, through the treaty signed with the UK on 22 May 2025: sovereignty to Mauritius, with a 99-year lease of the base back to London. Ratification has stalled: the Bill ran out of time in the Lords, London has accepted that US consent cannot be secured for now, and the handover was shelved in April 2026."
