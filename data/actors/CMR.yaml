  reading: |
    On the sources read, Cameroon's grand strategy is the survival of the Biya system through a succession with no confirmed arrangement: an eighth term won in an October 2025 election that EWN calls controversial, after which the main opposition leader fled the country (allAfrica). Its external supports are narrower than the regime needs: a US trade framework extended only to December 2026, a Nigeria border settled by treaty and handed over in 2013, and a Far North front that the Institute for Security Studies has read as aimed at the state since 2021. France, Russia, China beyond the 2007 loans, the EU, Chad, the Central African Republic, the Anglophone war, CEMAC and the CFA franc, and the oil, cocoa and timber economy are not sourced in this card and are the first gaps to fill.
