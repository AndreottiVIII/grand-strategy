      text: "Oil under licence. Venezuela's oil is sold through PDVSA under US general licences that Treasury can revoke at any time; payments to the government go to Foreign Government Deposit Funds accounts or to others the Treasury designates. The licences, not the barrels, are the instrument, and the barrels are the price of the government's survival."
