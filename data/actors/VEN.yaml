      text: "Hold the Essequibo, the two-thirds of Guyana's territory that Venezuela has claimed since the 1899 arbitral award it rejects. The claim is pressed in a court Caracas says it does not recognise: the ICJ has ruled it competent and issued provisional measures against elections in the region (May 2025), while Venezuela still argues that the 1966 Geneva Agreement requires direct talks. Judgment is expected between November 2026 and January 2027."
