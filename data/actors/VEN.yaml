      text: "Keep the government of Delcy Rodriguez standing without a second strike and without an election date it does not control. The US seized Maduro in the Caracas raid of 3 January 2026, then chose to work with her government (sworn in as interim president on 5 January) and cancelled a second wave of strikes for 'cooperation' on 9 January. At the UN on 24 September 2026 she promised elections without giving a date."
