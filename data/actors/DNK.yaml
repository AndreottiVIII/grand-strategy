    Denmark is a small state whose grand strategy has been reduced, since January 2025, to one question: how to stay in the American security system while an American president claims part of its territory. The Danish answer has three layers. Keep the formal position unmovable (sovereignty over Greenland and the Faroes, self-determination for Greenlanders), pay the price in usable goods (bases, F-35s, an Arctic build-up of tens of billions of kroner), and move the quarrel into NATO and Europe, where Rutte and the European leaders can absorb it. The 22 September 2026 trilateral agreement shows the method working and its cost: the crisis is calmer, the Kingdom's flag still flies, and both sides publish opposite readings of the same text. Behind the Greenland file stands the second pillar, which is Russia: a country that sits on the Baltic's only exit, takes the hybrid blows (drones over airports, flares at a helicopter, cables) and is both one of Ukraine's leading European donors (the Kiel tracker names it, with the Netherlands, right behind Germany for May-June 2026) and a builder of a European floor under NATO. The weakness is domestic and structural: a minority coalition, a Greenland that is no longer a colony to be spoken for, and an export economy that lives on American and German markets. The grades on this card follow the structure: the United States is a reluctant ally (a treaty ally with an open grievance, not a rival), Russia a rival (not an adversary, because Denmark seeks Moscow's restraint rather than its fall), China a reluctant partner.
