  reading: 'Greece runs the strategy of a status-quo power with a longer coast than its allies'' attention. Its whole grand strategy is deterrence by alliance: the single threat is Turkey, the
    single legal case is the law of the sea, and the instruments are borrowed - French treaty text, American bases and aircraft, Israeli air defence, EU money, Egyptian and Cypriot signatures.
    Mitsotakis has chosen to run it on two tracks at once, a managed calm with Erdogan (Athens Declaration, Ankara summit, foreign-minister channel) and a quiet build-up of the ring around him,
    and the pattern Luttwak would recognise is that each track feeds the other: the calm gives Athens room to arm and plan its seas, the planning and the arms give Ankara reasons to legislate
    the Blue Homeland and decree parks. 2026 is the year in which the two tracks collided: the F-35 and CAATSA signals from Trump in Ankara, the marine parks of 15 August, the drone off Alexandroupolis,
    the Israeli contract of 31 August, and the renewed Franco-Greek defence agreement of 25 April, all within eight months of the Ankara summit. Signals that are not rows: Athens has not recognised
    Palestine (''at the right time''), the Greek foreign ministry''s line on Piraeus is ''aligned with the US but will respect past agreements'', and the Blue Homeland bill has been reported since
    spring but not confirmed as tabled. The domestic horizon is a spring 2027 election with the governing party near 30%, which pushes Mitsotakis toward visible firmness on the sea and toward
    the promise of calm on the ground.'
