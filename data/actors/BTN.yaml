    - domain: informational
      text: "Gross National Happiness and carbon negativity as the external brand: the constitution (Article 5) requires at least 60% forest cover, and Bhutan presents itself as carbon negative and GNH as a development model. The carbon accounts conflict (Daily Bhutan: about 2.2 Mt CO2 emitted a year against trees absorbing more than three times that; Carbon Credits: about 9 Mt sequestered against 2 Mt generated in 2020), so this is a government claim, not a measured balance."
