    - rank: 2
      text: "Settle the undelineated northern boundary with China on the three-step roadmap without giving ground: MoU of 14 Oct 2021, 24 rounds of talks since 1984, and the joint demarcation team set up at the 13th Expert Group Meeting in Beijing (Aug 2023). China meanwhile built villages in the disputed north and west."
