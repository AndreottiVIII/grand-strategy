    - rank: 1
      text: "Keep the sovereignty India's 2007 treaty guarantees while letting India carry security and the large infrastructure. The revised treaty dropped the 1949 clause that made Bhutan follow India's advice on external relations, but Thimphu still builds its foreign policy around Delhi, and India intervened in Doklam in 2017 at Bhutan's request."
