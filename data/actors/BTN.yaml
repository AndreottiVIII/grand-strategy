    - domain: diplomatic
      text: "A deliberately thin diplomatic network: relations with 62 of the 192 other UN members and with none of the five permanent Security Council members; Bhutan has embassies in only six countries, and only Bangladesh, India and Kuwait have embassies in Thimphu."
