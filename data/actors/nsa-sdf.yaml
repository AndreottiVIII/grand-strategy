      text: "Stay indispensable to a patron. From 2015 the SDF's whole security rested on being the US ground force against ISIS (about 2,000 US troops in Dec 2024, under 1,000 after 2025, none after 16 Apr 2026). Washington's envoy said on 20 Jan 2026 that the SDF's 'original purpose' as the primary anti-ISIS force 'had largely expired'; the SDF now tries to convert the counter-ISIS record into standing with France, the Barzani family in Erbil and the US Congress."
