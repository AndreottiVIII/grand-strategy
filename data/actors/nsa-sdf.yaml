    - rank: 2
      text: "Write Kurdish language and political rights, and a decentralised state, into the constitution that Damascus is drafting. Abdi told Rudaw on 15 Aug 2026 that centralisation had failed and said after the dissolution that the struggle for the people's rights in the constitution 'will continue'; al-Sharaa's decree of 16 Jan 2026 (Kurdish a national language, Nowruz a holiday, citizenship for the stateless) is a decree, not a constitutional guarantee, and Kurdish-language education was still being negotiated in September 2026."
