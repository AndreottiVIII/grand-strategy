grand_strategy:
  objectives:
    - rank: 1
      text: "Keep a Kurdish-run security and administrative core alive inside the Syrian state it has just joined: the January 2026 deal left Kurdish security forces in the cities of Hasakah and Qamishli, a Kobani brigade, a Hasakah governor chosen by the SDF (Noureddin Issa Ahmed, confirmed 13 Feb 2026) and a deputy defence minister (Sipan Hamo, 10 Mar 2026). Abdi announced the SDF's dissolution as an independent force on 25 Aug 2026 and became an adviser to the presidency on 27-28 Aug; the aim is now to turn those posts into permanent guarantees."
