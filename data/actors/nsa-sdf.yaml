  paradoxes:
    - text: "Usefulness was the security. The SDF lived on being the ground force of a coalition fighting ISIS; the better it did that job (Raqqa, Baghuz), the less the coalition needed it, and the moment the host state itself joined the coalition (10 Nov 2025) its protection was void. Barrack's 'original purpose had largely expired' (20 Jan 2026) is Luttwak's patron logic in one sentence: a client that cannot survive its patron's exit was never an ally, only an instrument."
      confidence: B
      sources:
