    - text: "Delay to win decentralisation bought a worse settlement. The 10 Mar 2025 deal had an end-2025 deadline; the SDF used the year to push a decentralised line (the Hasakah components conference, 8-9 Aug 2025, which Damascus said 'dealt a blow' to the talks and answered by skipping the Paris round) while clashes in Aleppo in October and December 2025 hardened the opposite line. The January 2026 terms (individual absorption, no autonomy, all fields and prisons) were harsher than those of March 2025."
