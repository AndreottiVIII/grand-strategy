    - text: "The territory won from ISIS decided its fate. East of the Euphrates the SDF governed Arab provinces that gave it oil and a claim to speak for 'North and East Syria'; in January 2026 the same Arab tribes and defecting Arab units took Raqqa, Deir ez-Zor and the fields with little SDF defence, and the Kurdish core was left with Hasakah."
