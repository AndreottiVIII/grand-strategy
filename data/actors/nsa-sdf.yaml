  means:
    - domain: military
      text: "The YPG/YPJ core and an Arab-majority wider force built and trained under the US-led coalition since 2015: it took Raqqa (2017) and Baghuz (2019), held Tishrin Dam and Kobani against the SNA and Turkish drones in December 2024-April 2025, then chose not to fight the government in January 2026 - Abdi withdrew from Deir Hafer on 16-17 Jan 'on calls from friendly countries' and from Raqqa and Deir ez-Zor on 18 Jan 'to prevent civil war'. About 6,000 members had entered the army by July 2026 (a government source) and four brigades by 3 Aug."
