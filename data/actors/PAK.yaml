  paradoxes:
    - text: "The army that guarantees the state hollows out the civilian state it needs. The 27th amendment secures Munir as Chief of Defence Forces (five years, command of the nuclear arm, lifelong immunity, removable only by a two-thirds vote) just when the IMF, the EU's GSP+ review (the EU takes about 28% of exports; the Commission's assessment of 16 Jul 2026 and the EU ambassador's September warning say access is not assured) and Western partners judge Pakistan on institutions and rule of law. The more power is concentrated in one man, the more the foreign money that pays for the army depends on his personal standing."
