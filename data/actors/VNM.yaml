  reading: |
    Vietnam is the state that fought the two great powers of the twentieth century and now sells its neutrality to both of them, plus everyone in between. Luttwak's logic of strategy predicts a small state next to a giant to either bandwagon or build a coalition; Hanoi does something third: it builds a web of eleven comprehensive strategic partnerships, refuses every alliance, and spends its leverage on becoming indispensable rather than protected. Indispensability is real - it is the electronics platform of Samsung and other foreign groups, the Spratly claimant with the most reclaimed land after China, the rice and seafood exporter, the 100-million-strong market - but it is paid for in dependence on both markets: China supplies 40% of its imports, the US takes the largest share of its exports. The 2026 novelty is domestic. To Lam's double crown (Party chief since August 2024 and State President since 7 April 2026, the 14th Congress behind him, the districts abolished) lets Hanoi decide faster and hedge more loudly - Washington in February, Beijing in April, ASEAN capitals in May and June, Moscow and Paris in September - and with the same speed it removes the collective brake that made the balance credible. Two signals are not rows: the Supreme Court's February 2026 ruling that cancelled the legal basis of the 20% tariff left Vietnam holding a deal whose price Washington can rebuild by other means, and the August 2026 Chinese completion of Antelope Reef shows that Hanoi's own island-building did not deter Beijing. Hanoi's bet is that Beijing will keep tolerating a smaller neighbour that is good for Chinese manufacturing; its fear is that the Americans will treat it as a transshipment point and the Russians as a customer. Open question for 2027: whether the partners other than China will stay content with signed documents, or start to demand that Vietnam choose a side.
