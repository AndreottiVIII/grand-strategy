  reading: 'Morocco runs the strategy of a state that has turned a territorial claim into a currency and gets its partners to pay in it: the price of a warm relationship with Rabat

    is a sentence on the autonomy plan, and between 2020 and 2026 Washington, Madrid, Paris, London, Brussels and Bamako paid it, with the Security Council text of 31 October 2025 as

    the receipt. That is Luttwak''s relational manoeuvre in its cleanest form. The side that is weaker in arms (USD 5.5bn against Algeria''s 21.8bn) did not match the budget; it widened
    the circle

    around the dispute until the rival''s position became the minority one, and it spends on infrastructure that serves the claim (Dakhla, the highway, the pipeline) rather than on tanks.

    The paradoxes show where the currency inflates. The migration valve that buys European votes set off the Ceuta crossing of July 2026 and a Spanish refusal to discuss sovereignty;

    the Israeli bargain gave Algiers its encirclement story; integrating the territory widens every partner''s legal exposure after the Court of Justice rulings of October 2024; and
    the showcase

    politics of AFCON and 2030 sit beside a youth that took to the streets over hospitals and schools. Signals that are not rows: the US imposed a 12.5% tariff on Morocco on 24 July
    2026,

    three weeks after the king announced a highway to be named for Trump, so a patron''s goodwill on the Sahara does not buy tariff relief; Algeria''s absence from the Council vote is
    a refusal

    to be bound, not a concession; and the next test is the MINURSO renewal due before 31 October 2026 and whether the framework agreement the US wanted before the summer ever takes
    shape.'
