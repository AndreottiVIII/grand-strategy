  reading: |
    Laos is a landlocked one-party state whose main asset is water: its dams sell power to Vietnam, and the high-voltage grid that carries it is now majority-controlled through a Chinese company, the price of a debt that the IMF still treats as distressed. Its policy is to hold the Vietnamese special relationship as the political anchor and to spread its partners so that none of them sets its choices. The record reserves of 2026 buy time; they do not solve the debt.
