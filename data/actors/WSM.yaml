  reading: |
    Samoa is a small state whose security sits in a 1962 treaty with New Zealand, whose money comes from remittances and from Australian and Chinese lending, and whose labour schemes send thousands of its people to work in New Zealand and Australia. The 2025 crisis changed who governs without changing that frame: Fiame Naomi Mataafa's government lost its budget vote 34-16 on 27 May 2025, a snap election on 29 August gave FAST 30 seats (31 with a later defector) out of 51, and the FAST faction led by Laauli Leuatea Schmidt, which had split from Mataafa in January, became the government on 16 September. The stage is the Commonwealth summit of October 2024 in Apia, where Samoa asserted its ocean and climate agenda, and no sourced foreign-policy line from the Schmidt government has been found beyond its March 2026 dispute with New Zealand over a matai title.
