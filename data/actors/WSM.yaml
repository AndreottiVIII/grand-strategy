  reading: |
    Samoa is a small state whose security sits in a 1962 treaty with New Zealand, whose money comes from remittances and from Australian and Chinese lending, and whose labour schemes send thousands of its people to work in New Zealand and Australia. The 2025 crisis changed who governs without changing that frame: Fiame Naomi Mataafa's government lost its budget vote on 27 May 2025, a snap election on 29 August gave FAST 30 seats (31 with a later defector) out of 51, and the FAST faction led by Laauli Leuatea Schmidt, which had split from Mataafa earlier in 2025, became the government on 16 September. At the UN the atlas records yes votes on all six Ukraine landmark resolutions from 2022 to 2026 and an abstention on the September 2024 resolution ending Israel's presence in the occupied Palestinian territory. The stage is the Commonwealth summit that Samoa hosted in Apia in October 2024, and no sourced foreign-policy line from the Schmidt government has been found beyond its March 2026 dispute with New Zealand over a matai title.
