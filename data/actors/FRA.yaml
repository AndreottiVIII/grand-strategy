  reading: 'France runs the strategy of a medium power with a first-rank vocabulary: nuclear, permanent seat, an army meant to be ''feared'' (Macron, July 2025), and a claim that Europe must become sovereign.
    The pattern in Luttwak''s terms is that each assertion of autonomy needs a partner it cannot dominate. The 2 March 2026 offer of forward deterrence needs Germany and Poland, who also want Washington;
    the Coalition of the Willing needs the United States for the ceasefire; the arms-export drive needs EU money that Mercosur and the deficit make harder to unite. Since 2022 the centre of gravity has
    moved north and east (Finland, Romania, Poland, Denmark, Greenland) as the African position collapsed, and the Mediterranean (Greece, Cyprus, Lebanon, Morocco) is the compensation. Two signals that
    are not rows: the 2027 election is the main unknown, with Macron the least popular president since 2017 and Marine Le Pen eligible and leading, so every commitment made in 2025-26 (Paris Declaration,
    nuclear talks, Greece pact) will be tested by a successor; and no French ambassador has been reported back in Algiers despite the thaw. The fiscal squeeze is the single constraint that touches every
    objective.'
