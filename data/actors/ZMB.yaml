  constraints:
    - text: "The IMF and the creditors set the budget. The programme cycle ended without an extension in January 2026, and the IMF has twice trimmed its 2026 growth outlook, to 4.3%, citing weaker mining output and energy constraints. Reports conflict on whether the programme is complete; the IMF's own page was not checked."
      confidence: C
      sources:
        - {url: "https://www.zambiamonitor.com/again-imf-warns-power-shortages-may-stall-zambias-2025-economic-rebound-seeks-acceleration-of-structural-reforms/", title: "Again, IMF warns power shortages may stall Zambia's 2025 economic rebound", publisher: "Zambia Monitor", date: "2026", tier: 4}
