    - domain: diplomatic
      text: "Corridor diplomacy: let two powers bid for the same rail routes. The US-backed Lobito corridor has a USD 553m DFC loan to the LAR consortium; the China-backed TAZARA concession of about USD 1.4bn (30 years) was signed in Beijing on 29 September 2025. Lusaka sits at the centre of both and keeps its seats in the African Union, SADC and the Commonwealth, the forums where it is a frontline-state voice rather than a client."
      confidence: C
