  paradoxes:
    - text: "The copper plan needs power, yet both corridors Lusaka courts depend on the same grid that the drought has cut: the Chambishi smelter lost a fifth of its output to power shortages in 2024 while Zambia bid for a US line and a Chinese line at once. The more rails Lusaka secures, the more it needs megawatts to fill them."
