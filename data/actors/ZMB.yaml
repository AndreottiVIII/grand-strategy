      text: "Turn copper into revenue without depending on one rail line or one buyer. Zambia is Africa's second-largest copper producer (Al Jazeera). Lusaka keeps two export routes open at once: the US-backed Lobito corridor to the Atlantic and the China-backed TAZARA revival to Dar es Salaam. The 2026 election was fought on the cost of living, which only copper output and reliable power can pay for."
