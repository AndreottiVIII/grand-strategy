  means:
    - domain: economic
      text: "Copper and the mines. Copper is the economy and the export earner; Lusaka's lever is the mines' output and the price, and the state utility ZESCO decides how much of it runs. Power is the bottleneck: the state utility rationed electricity to mining firms as Lake Kariba fell, and the Chambishi smelter (CNMC) cut a fifth of its output in March 2024 for lack of power. The reported 2025 power deficit was about 707 MW (a press figure, not checked against the utility)."
