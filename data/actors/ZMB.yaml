  reading: |
    Zambia's grand strategy is to turn world demand for copper into revenue and room to manoeuvre: keep the American Atlantic route and the Chinese route to Dar es Salaam open at once, so that no single rail line, lender or buyer holds the mines. The binding limits are physical and financial rather than diplomatic, since the drought-hit hydro grid and the IMF cycle decide how much copper moves and how much reform Hichilema, re-elected on 18 August 2026 with about 61% in a contested count, can afford. The paradox is that the two corridors depend on the same power the drought has cut, so the strategy is only as strong as the next dry season.
