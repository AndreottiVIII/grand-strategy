  reading: |
    Sassou Nguesso's aim is to keep the system he has run for decades in power to 2031, and the oil income that pays for it is also the tightest constraint: more than 80% of export revenue against debt near 98% of GDP. He plays the great powers against each other for money and cover, Paris for aid and a long tie that also carries its own legal exposure over the family's assets, Beijing as oil buyer and creditor, and Moscow for the 2024 pipeline, and none of them is a treaty patron. The test of the next years is whether the refinancing buys enough time for oil to hold its price, and the paradox is that the buyer who funds the state is also a creditor whose claims it must manage.
