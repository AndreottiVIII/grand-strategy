        - {url: "https://www.axios.com/2026/01/21/trump-drops-greenland-tariff-invasion-threats", title: "Trump backs off Greenland tariff threat based on new 'solution'", publisher: "Axios", date: 2026-01-21, tier: 3}
    - text: "The arithmetic of 5%: only five allies are above 3.5% on core defence in 2026, ten sit slightly above 2%, Slovenia is the only ally still below the 2014 target (1.61%), and the 1.5% 'related' category invites relabelling (Italy tried to count the EUR 13.5bn Messina bridge before the US ambassador objected)."
      confidence: B
      sources:
        - {url: "https://www.internazionale.it/ultime-notizie-reuters/2026/07/07/five-nato-members-seen-to-spend-over-3-5-of-gdp-on-core-defence-this-year-alliance-estimates-show", title: "Five NATO members seen to spend over 3.5% of GDP on core defence this year, alliance estimates show", publisher: "Reuters (via Internazionale)", date: 2026-07-07, tier: 3}
