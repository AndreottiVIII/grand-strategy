    - text: "NATO has no army or budget of its own: every brigade, jet and euro is a member's, and the critical enablers - intelligence, air defence, long-range fires, strategic lift, nuclear forces - are disproportionately American. The US is about 57% of alliance spending (USD 1.03tn of USD 1.8tn estimated for 2026)."
      confidence: B
      sources:
        - {url: "https://aa.com.tr/en/world/nato-defense-spending-projected-to-top-18t-in-2026/3989627", title: "NATO defense spending projected to top $1.8T in 2026", publisher: "Anadolu Agency", date: 2026, tier: 3}
