    - text: "The reliability of the guarantor. President Trump's comments before Ankara appeared to question Article 5, he said 'NATO WASN'T THERE WHEN WE NEEDED THEM' after allies would not join the Iran war, the Pentagon announced on 1 May 2026 that 5,000 troops would leave Germany, and Washington's Greenland claim set a treaty ally against the leader of the alliance until the Davos 'framework' of 21 Jan 2026 and the trilateral agreement of 22 Sep 2026."
      confidence: B
      sources:
        - {url: "https://en.majalla.com/node/331985", title: "One big happy family? NATO 'survives' Trump in Ankara", publisher: "The Majalla", date: 2026-07, tier: 3}
