    - text: "Out of area it is not a party: in the US-Israeli war on Iran the Secretary General said NATO would not join, yet allies' bases in Romania, Italy, Germany and Britain were used and Iran accused the alliance of complicity; the Ankara text only says Iran 'must never have a nuclear weapon' and urges freedom of navigation in the Strait of Hormuz."
