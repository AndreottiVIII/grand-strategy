  paradoxes:
    - text: "The more Europe rearms to keep America in, the more it enables America to leave. Every dollar of the Hague 5% was bought to hold Trump; the Pentagon answered with 'NATO 3.0' (Europe takes primary responsibility for conventional defence), cut its Force Model contribution in May 2026, and in September weighed withdrawing 25,000-40,000 troops. Grynkewich's July report that Europe had 'backfilled most gaps' is the proof of success that justifies the next cut."
      confidence: B
      sources:
        - {url: "https://www.defensenews.com/global/europe/2026/06/03/us-tells-europe-canada-to-boost-nato-air-and-naval-forces/", title: "US tells Europe, Canada to boost NATO air and naval forces", publisher: "Defense News", date: 2026-06-03, tier: 3}
        - {url: "https://lasvegassun.com/news/2026/jul/03/nato-commander-says-europe-has-backfilled-most-gap/", title: "NATO commander says Europe has backfilled most gaps from US cutbacks on military equipment", publisher: "AP via Las Vegas Sun", date: 2026-07-03, tier: 3}
        - {url: "https://aa.com.tr/en/world/pentagon-weighs-pulling-at-least-25-000-us-troops-from-europe-report/4060679", title: "Pentagon weighs pulling at least 25,000 US troops from Europe (NBC report)", publisher: "Anadolu Agency", date: 2026-09-18, tier: 3}
        - {url: "https://www.aljazeera.com/amp/news/2026/2/12/us-urges-europe-to-take-the-lead-on-defence-in-nato", title: "US urges Europe to take the lead on defence in NATO", publisher: "Al Jazeera", date: 2026-02-12, tier: 3}
    - text: "Deterrence is credible only with the ally who doubts it. Nuclear deterrence is American ('the ultimate guarantor of our security', Rutte) and only Washington can make Article 5 believable to Moscow, yet it is the US president who hints at conditions, ties US contributions to allies' performance (Hegseth, June 2026) and pressed a treaty ally over Greenland. A deterrent that depends on the doubts of its own guarantor invites the tests it is meant to prevent: drones over Poland, MiG-31s over Estonia."
      confidence: B
      sources:
        - {url: "https://san.com/cc/hegseth-dreams-of-a-nato-3-0-heres-what-that-might-look-like/", title: "Hegseth dreams of a NATO 3.0. Here's what that might look like", publisher: "Straight Arrow News", date: 2026-06, tier: 3}
        - {url: "https://en.majalla.com/node/331985", title: "One big happy family? NATO 'survives' Trump in Ankara", publisher: "The Majalla", date: 2026-07, tier: 3}
        - {url: "https://www.globalsecurity.org/military/library/news/2025/09/mil-250923-nato01.htm", title: "Statement by the North Atlantic Council on recent airspace violations by Russia (23 Sep 2025)", publisher: "NATO (via GlobalSecurity)", date: 2025-09-23, tier: 1}
    - text: "Enlargement stretched the front it was meant to shorten. Finland (2023) and Sweden (2024) closed the Baltic and added a land border with Russia; the price is a longer perimeter to garrison - a land command at Mikkeli, Forward Land Forces Finland, three Sentry operations, battlegroups in eight countries - at the moment the US withdraws brigades and the Force Model shrinks. The northern flank is stronger and thinner at once."
      confidence: B
