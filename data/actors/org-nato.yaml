    - text: "The open door is jammed from both sides: Ukraine and Georgia cannot be invited while the war lasts and while Washington and several allies refuse, yet the formula of Bucharest 2008 and 'irreversible' of Washington 2024 cannot be withdrawn without conceding Moscow's point; Georgia's package was reviewed after the 2024 election."
      confidence: B
      sources:
        - {url: "https://www.nato.int/cps/en/natohq/official_texts_227678.htm", title: "Washington Summit Declaration, para. 16", publisher: "NATO", date: 2024-07-10, tier: 1}
