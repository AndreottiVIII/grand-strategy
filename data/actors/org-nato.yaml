grand_strategy:
  objectives:
    - rank: 1
      text: "Deter Russia and, if deterrence fails, defend every inch of Allied territory (Article 5, 'ironclad' at The Hague 2025 and again at Ankara, 7-8 Jul 2026). The instruments are the regional defence plans, the NATO Force Model of high-readiness forces, forward land forces in eight countries and the three 'Sentry' operations (Baltic Sentry, Jan 2025; Eastern Sentry, Sep 2025; Arctic Sentry, Feb 2026). The 2022 Strategic Concept names Russia 'the most significant and direct threat'; the Ankara declaration calls it 'the long-term threat'. The aim is deterrence, not Russia's defeat."
      confidence: A
      sources:
        - {url: "https://www.nato.int/cps/en/natohq/topics_210907.htm", title: "NATO 2022 Strategic Concept (Madrid, 29 June 2022)", publisher: "NATO", date: 2022-06-29, tier: 1}
        - {url: "https://foreignpolicy.com/2026/07/08/nato-ankara-summit-declaration-full-text-trump-ukraine-russia/", title: "The Ankara Summit Declaration (full text, paras 1-2)", publisher: "Foreign Policy", date: 2026-07-08, tier: 3}
        - {url: "https://www.nato.int/en/about-us/official-texts-and-resources/official-texts/2025/06/25/the-hague-summit-declaration", title: "The Hague Summit Declaration", publisher: "NATO", date: 2025-06-25, tier: 1}
        - {url: "https://theaviationist.com/2025/09/13/nato-launches-operation-eastern-sentry/", title: "NATO launches Operation Eastern Sentry after drone incursions", publisher: "The Aviationist", date: 2025-09-13, tier: 3}
        - {url: "https://www.defensenews.com/global/europe/2026/02/11/nato-kicks-off-arctic-sentry-operation-following-greenland-brouhaha/", title: "NATO kicks off Arctic Sentry operation following Greenland brouhaha", publisher: "Defense News", date: 2026-02-11, tier: 3}
    - rank: 2
      text: "Rearm Europe: 5% of GDP by 2035, of which 3.5% on core defence and up to 1.5% on defence-related spending (resilience, infrastructure, industry), with annual national plans and a review in 2029. NATO estimates for 2026 show only five allies above 3.5% on core defence (Lithuania, Estonia, Latvia, Poland, Greece), an alliance average of 2.86%, and Spain, Slovakia and Czechia as open reluctants; Ankara asked every ally for 'credible plans'."
      confidence: A
      sources:
        - {url: "https://www.nato.int/en/about-us/official-texts-and-resources/official-texts/2025/06/25/the-hague-summit-declaration", title: "The Hague Summit Declaration (5%, 3.5%+1.5%, 2035, review in 2029)", publisher: "NATO", date: 2025-06-25, tier: 1}
        - {url: "https://www.internazionale.it/ultime-notizie-reuters/2026/07/07/five-nato-members-seen-to-spend-over-3-5-of-gdp-on-core-defence-this-year-alliance-estimates-show", title: "Five NATO members seen to spend over 3.5% of GDP on core defence this year, alliance estimates show", publisher: "Reuters (via Internazionale)", date: 2026-07-07, tier: 3}
        - {url: "https://www.aljazeera.com/news/2026/7/6/nato-urges-members-to-deliver-plans-for-reaching-defence-spending-targets", title: "NATO urges members to deliver plans for reaching defence spending targets", publisher: "Al Jazeera", date: 2026-07-06, tier: 3}
        - {url: "https://icds.ee/en/natos-new-defence-spending-target-whos-planning-what-in-2026/", title: "NATO's new defence spending target: who's planning what in 2026", publisher: "International Centre for Defence and Security (ICDS)", date: 2026-09-14, tier: 2}
    - rank: 3
      text: "Keep the United States in, above all its nuclear umbrella and the enablers Europe cannot yet replace, while the Pentagon moves to 'NATO 3.0' (Europeans take primary responsibility for conventional defence). The price Rutte pays is visible: the 5% pledge in 2025, a 'more European NATO' in 2026, and the acceptance of US cuts to the Force Model and of a six-month posture review that weighs withdrawing 25,000-40,000 of the roughly 80,000 US troops in Europe."
      confidence: B
      sources:
        - {url: "https://www.aljazeera.com/amp/news/2026/2/12/us-urges-europe-to-take-the-lead-on-defence-in-nato", title: "US urges Europe to take the lead on defence in NATO", publisher: "Al Jazeera", date: 2026-02-12, tier: 3}
        - {url: "https://www.euronews.com/my-europe/2026/02/12/nato-30-us-and-europe-appear-to-agree-rebalancing-of-power-is-needed", title: "NATO 3.0: US and Europe appear to agree rebalancing of power is needed", publisher: "Euronews", date: 2026-02-12, tier: 3}
        - {url: "https://aa.com.tr/en/world/pentagon-weighs-pulling-at-least-25-000-us-troops-from-europe-report/4060679", title: "Pentagon weighs pulling at least 25,000 US troops from Europe (NBC report)", publisher: "Anadolu Agency", date: 2026-09-18, tier: 3}
        - {url: "https://www.defensenews.com/global/europe/2026/06/03/us-tells-europe-canada-to-boost-nato-air-and-naval-forces/", title: "US tells Europe, Canada to boost NATO air and naval forces", publisher: "Defense News", date: 2026-06-03, tier: 3}
    - rank: 4
      text: "Support Ukraine without admitting it: EUR 70bn of aid pledged at Ankara for 2026 and at least as much for 2027, the NSATU command in Wiesbaden that took over coordination of aid from the US-led Ramstein format, and PURL, the scheme by which allies pay for American weapons. Membership stays 'irreversible' in the 2024 Washington text, absent from The Hague text and from the six paragraphs of Ankara."
      confidence: B
      sources:
        - {url: "https://foreignpolicy.com/2026/07/08/nato-ankara-summit-declaration-full-text-trump-ukraine-russia/", title: "The Ankara Summit Declaration (full text, para 4)", publisher: "Foreign Policy", date: 2026-07-08, tier: 3}
        - {url: "https://www.nato.int/cps/en/natohq/official_texts_227678.htm", title: "Washington Summit Declaration, para. 16", publisher: "NATO", date: 2024-07-10, tier: 1}
        - {url: "https://kyivindependent.com/ukraines-nato-membership-remains-irreversible-despite-possible-communique-omission-rutte-says/", title: "Ukraine's NATO membership remains irreversible despite possible communique omission, Rutte says", publisher: "Kyiv Independent", date: 2025-06, tier: 3}
        - {url: "https://www.kmu.gov.ua/en/news/rik-purl-maizhe-7-mlrd-dlia-postavok-krytychnoho-ozbroiennia-dlia-ukrainy", title: "A year of PURL: nearly USD 7 billion for deliveries of critical weapons to Ukraine", publisher: "Cabinet of Ministers of Ukraine", date: 2026-07, tier: 1}
    - rank: 5
      text: "Resilience against hybrid war: protect undersea cables, airspace and critical infrastructure from sabotage, drones and balloons below the Article 5 threshold. The Hague pledge reserves up to 1.5% of GDP for it, and Article 4 consultations were held twice in September 2025 (Poland, 10 Sep; Estonia, 23 Sep)."
      confidence: B
      sources:
        - {url: "https://www.defensenews.com/global/europe/2025/01/14/nato-launches-baltic-patrol-mission-eyes-standard-for-detaining-ships/", title: "NATO launches Baltic patrol mission, eyes standard for detaining ships", publisher: "Defense News", date: 2025-01-14, tier: 3}
        - {url: "https://www.globalsecurity.org/military/library/news/2025/09/mil-250923-nato01.htm", title: "Statement by the North Atlantic Council on recent airspace violations by Russia (23 Sep 2025)", publisher: "NATO (via GlobalSecurity)", date: 2025-09-23, tier: 1}
        - {url: "https://www.pbs.org/newshour/world/nato-allies-held-article-4-consultations-after-russian-drone-incursion-heres-what-that-means", title: "NATO allies held Article 4 consultations after Russian drone incursion", publisher: "PBS NewsHour", date: 2025-09-10, tier: 3}
    - rank: 6
      text: "Stabilise the edges without opening new fronts: the Southern Neighbourhood Action Plan (Washington 2024; a Special Representative who visited Rabat for the third time on 6-7 Oct 2026), the Western Balkans (KFOR being cut from 4,739 toward 3,000-3,500, Bosnia kept in a stalled membership track), the Black Sea, and the Indo-Pacific partners (IP4) kept close while the 2022 'systemic challenge' language on China is left unrepeated in the 2025 and 2026 declarations."
      confidence: B
      sources:
        - {url: "https://www.nato.int/en/news-and-events/articles/news/2026/10/08/natos-special-representative-for-the-southern-neighbourhood-visits-morocco", title: "NATO's Special Representative for the Southern Neighbourhood visits Morocco", publisher: "NATO", date: 2026-10-08, tier: 1}
        - {url: "https://www.nato.int/content/dam/nato/webready/documents/factsheets/kfor/KFOR-Placemat.pdf", title: "KFOR Placemat, June 2026", publisher: "NATO", date: 2026-06, tier: 1}
        - {url: "https://www.cna.org/analyses/2026/08/natos-ankara-summit-the-indo-pacific-dimensions", title: "NATO's Ankara summit: the Indo-Pacific dimensions", publisher: "CNA", date: 2026-08, tier: 2}

  means:
    - domain: diplomatic
      text: "The consensus machine: the North Atlantic Council decides unanimously, the Secretary General (Mark Rutte, since 2024) brokers between Washington and the rest - the Davos 'framework' with Trump on 21 Jan 2026 that ended the Greenland tariff threat and produced Arctic Sentry is the model - and Article 4 consultations signal collective concern without committing force."
      confidence: B
      sources:
        - {url: "https://www.koreajoongangdaily.com/world/trump-says-he-will-not-impose-greenlandrelated-tariffs-on-8-nato-allies/12150007", title: "Trump says he will not impose Greenland-related tariffs on 8 NATO allies", publisher: "Korea JoongAng Daily (wire)", date: 2026-01-21, tier: 3}
        - {url: "https://www.globalsecurity.org/military/library/news/2025/09/mil-250923-nato01.htm", title: "Statement by the North Atlantic Council on recent airspace violations by Russia (23 Sep 2025)", publisher: "NATO (via GlobalSecurity)", date: 2025-09-23, tier: 1}
    - domain: diplomatic
      text: "Partnerships as an outer ring: Partnership for Peace (Serbia, Moldova), aspirant partners (Georgia, Bosnia, Ukraine), the four Indo-Pacific partners (Japan, South Korea, Australia, New Zealand, met by Rutte at Ankara on 7 Jul 2026) and a division of labour with the EU (NATO for command, capabilities and standards; the EU for industry and investment), 23 of whose 27 members are allies."
      confidence: B
      sources:
        - {url: "https://www.mod.go.jp/en/article/2026/07/5b1b1a333d818f3bba12873c5c6c13c30fff26e9.html", title: "Meeting between NATO Secretary General Rutte and Indo-Pacific Partners (Overview)", publisher: "Ministry of Defense of Japan", date: 2026-07, tier: 1}
        - {url: "https://de.euronews.com/2026/07/07/von-der-leyen-und-rutte-nato-muss-europaischer-werden", title: "Von der Leyen und Rutte: NATO muss europaischer werden", publisher: "Euronews (DE)", date: 2026-07-07, tier: 3}
        - {url: "https://www.nato.int/issues/nato-moldova/index.html", title: "Relations with the Republic of Moldova", publisher: "NATO", date: 2025, tier: 1}
    - domain: informational
      text: "Short, signable texts: The Hague declaration (June 2025) ran to five paragraphs and the Ankara declaration to six, written to be accepted by a US president who had threatened to skip Article 5. Ukraine's membership, China and the Indo-Pacific were left out so that the unity of the sentence survives; the 2022 Strategic Concept stays the only agreed text on them. Words are graded: Russia is 'the long-term threat', not an adversary."
      confidence: B
      sources:
        - {url: "https://foreignpolicy.com/2026/07/08/nato-ankara-summit-declaration-full-text-trump-ukraine-russia/", title: "The Ankara Summit Declaration (full text)", publisher: "Foreign Policy", date: 2026-07-08, tier: 3}
        - {url: "https://www.cna.org/analyses/2026/08/natos-ankara-summit-the-indo-pacific-dimensions", title: "NATO's Ankara summit: the Indo-Pacific dimensions (China absent from the declaration)", publisher: "CNA", date: 2026-08, tier: 2}
        - {url: "https://euromaidanpress.com/2025/06/18/ukraine-nato-summit-2025/", title: "No invitation - not even a mention: Ukraine to be left out of NATO's summit statement", publisher: "Euromaidan Press", date: 2025-06-18, tier: 3}
    - domain: military
      text: "Command and force structure: SACEUR Gen. Alexus Grynkewich (also head of US European Command) runs the Sentry operations, the regional plans and the Force Model, forward land forces in eight countries (Forward Land Forces Finland stood up on 6 Jun 2026), NSATU in Wiesbaden and KFOR; nuclear deterrence rests on 'an appropriate mix of nuclear, conventional, and missile defence capabilities'."
      confidence: B
      sources:
        - {url: "https://www.defensenews.com/global/europe/2026/06/03/us-tells-europe-canada-to-boost-nato-air-and-naval-forces/", title: "US tells Europe, Canada to boost NATO air and naval forces (Grynkewich)", publisher: "Defense News", date: 2026-06-03, tier: 3}
        - {url: "https://valtioneuvosto.fi/en/-/236553176/nato-forward-land-forces-finland-to-start-operations-on-6-june", title: "NATO Forward Land Forces Finland to start operations on 6 June", publisher: "Finnish Government / Ministry of Defence", date: 2026-06, tier: 1}
        - {url: "https://foreignpolicy.com/2026/07/08/nato-ankara-summit-declaration-full-text-trump-ukraine-russia/", title: "The Ankara Summit Declaration (full text, para 3)", publisher: "Foreign Policy", date: 2026-07-08, tier: 3}
    - domain: military
      text: "Burden-shifting inside the structure: Grynkewich told allies in June 2026 that the Force Model had an 'unhealthy co-dependence' on US forces that 'will change', and in July said Europe had backfilled most of the gaps left by American cuts (a third fewer US fighter jets, fewer destroyers, no submarines in the crisis pool, fewer drones)."
      confidence: B
      sources:
        - {url: "https://www.defensenews.com/global/europe/2026/06/03/us-tells-europe-canada-to-boost-nato-air-and-naval-forces/", title: "US tells Europe, Canada to boost NATO air and naval forces", publisher: "Defense News", date: 2026-06-03, tier: 3}
        - {url: "https://lasvegassun.com/news/2026/jul/03/nato-commander-says-europe-has-backfilled-most-gap/", title: "NATO commander says Europe has backfilled most gaps from US cutbacks on military equipment", publisher: "AP via Las Vegas Sun", date: 2026-07-03, tier: 3}
    - domain: economic
      text: "Money as the lever: the 5% target and annual plans, the PURL channel through which European allies and Canada buy US weapons for Ukraine (about USD 6.7bn in the first year), over USD 50bn of new joint procurements announced at Ankara (A400M and MRTT fleets, MQ-4C Triton, an AWACS successor) and a defence-industrial push (more than USD 139bn added to core defence by European allies and Canada in 2025)."
      confidence: B
      sources:
        - {url: "https://www.kmu.gov.ua/en/news/rik-purl-maizhe-7-mlrd-dlia-postavok-krytychnoho-ozbroiennia-dlia-ukrainy", title: "A year of PURL: nearly USD 7 billion for deliveries of critical weapons to Ukraine", publisher: "Cabinet of Ministers of Ukraine", date: 2026-07, tier: 1}
