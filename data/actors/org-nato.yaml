        - {url: "https://en.majalla.com/node/331985", title: "One big happy family? NATO 'survives' Trump in Ankara", publisher: "The Majalla", date: 2026-07, tier: 3}

  constraints:
    - text: "Unanimity makes every member a veto and every grievance a toll. Hungary and Turkey held up Finland's and Sweden's accession until January-March 2024; Slovakia's Fico opposes the 5% target and said on 18 Sep 2026 he does not want Slovakia in a conflict 'because of some Article 5'; Spain refuses the target and denied the US its bases for the Iran war."
      confidence: B
      sources:
        - {url: "https://www.nato.int/en/news-and-events/articles/news/2024/03/07/sweden-officially-joins-nato", title: "Sweden officially joins NATO", publisher: "NATO", date: 2024-03-07, tier: 1}
