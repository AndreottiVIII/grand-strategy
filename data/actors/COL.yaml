    - text: "A border it does not hold: the ELN moves between Venezuela and Catatumbo, and cooperation with the government in Caracas is partial and conditional, so the armed groups on the frontier cannot be cleared from one side."
      sources:
        - {url: "https://insightcrime.org/es/?p=233348", title: "ELN binational structure in Venezuela (InSight Crime profile)", publisher: "InSight Crime", date: 2026, tier: 2, lang: es}
