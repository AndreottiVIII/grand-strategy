    - text: "Security and intelligence with the United States: the armed forces and police, the Plan Colombia legacy, and a US security package after the swearing-in. The new government also proposes to let US forces operate from Colombian territory, to bomb cocaine labs in the jungle and to speed extraditions of armed-group leaders wanted in the US."
      sources:
