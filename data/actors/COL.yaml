  constraints:
    - text: "Cocaine output at record levels, as the US memo of Sept 2025 stated, so force alone does not shrink supply. The new government's tools (fumigation, shoot-downs of suspect planes, bombing of labs) have not yet been tested; the coca-spraying question is contested, Petro arguing that demand must be cut."
      sources:
        - {url: "https://www.npr.org/2025/09/16/nx-s1-5543055/colombia-drugs-u-s-trump-petro", title: "US decertifies Colombia as ally in drugs fight", publisher: "NPR", date: 2025-09-16, tier: 3}
