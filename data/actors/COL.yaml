    - rank: 2
      text: "Recover the security and trade partnership with the United States after the 2025-26 rupture: US aid, the Shield of the Americas bloc, and an end to decertification. Under Petro, Washington decertified Colombia as a counternarcotics partner (Sept 2025) and sanctioned the president and his support network (OFAC, 24 Oct 2025); the new government has pledged to join the Shield of the Americas from its first day."
