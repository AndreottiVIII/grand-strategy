  paradoxes:
    - text: "Petro's sovereignty stand against the boat strikes brought the decertification, the sanctions on the president and the loss of aid, leaving Bogotá less able to fight the cocaine economy that his own policy wanted to end by negotiation."
      sources:
        - {url: "https://home.treasury.gov/news/press-releases/sb0292", title: "Treasury sanctions Colombian President Gustavo Petro and his support network", publisher: "US Department of the Treasury", date: 2025-10-24, tier: 1}
        - {url: "https://www.npr.org/2025/09/16/nx-s1-5543055/colombia-drugs-u-s-trump-petro", title: "US decertifies Colombia as ally in drugs fight", publisher: "NPR", date: 2025-09-16, tier: 3}
    - text: "Its tariff war with Ecuador, justified by Bogotá's lack of drug-control reciprocity, was fought with the lever that hurt Colombia's own exports: the electricity cut, plus 30% reciprocal tariffs on Ecuadorian goods, while Colombia's crude still depends on Ecuador's pipeline."
      sources:
        - {url: "https://forbes.co/2026/08/05/economia-y-finanzas/colombia-reanuda-las-exportaciones-de-energia-hacia-ecuador/", title: "Colombia reanuda las exportaciones de energía hacia Ecuador", publisher: "Forbes Colombia", date: 2026-08-05, tier: 3, lang: es}
        - {url: "https://elmercurio.com.ec/principal/2026/01/22/ecuador-colombia-guerra-comercial-aranceles/", title: "Guerra comercial entre Ecuador y Colombia escala con aranceles recíprocos", publisher: "El Mercurio (Ecuador)", date: 2026-01-22, tier: 3, lang: es}
  reading: |
    Colombia changed its partner in 2026 without changing its problem: the cocaine economy and the armed groups on the Venezuelan border are the same, and a hard-line Trump ally sworn in on 7 Aug 2026 has bet that Washington's force can do what negotiation did not. The reset reverses the Petro-era rupture (decertification, sanctions on the president, the tariff war with Ecuador), and the energy lever is back in use, while the Belt and Road pact of May 2025 is a non-binding letter that the new government has not yet addressed in any source found. The paradox is that the rupture cost Colombia its aid and its standing, and the reset buys security cooperation at a price that the policy itself may push across the borders, into Venezuela and Ecuador (an inference, not yet sourced).
