    - rank: 4
      text: "Win recognition for the Srebrenica genocide and block its denial and the glorification of war criminals: the UN General Assembly day of remembrance (A/RES/78/282, 23 May 2024) and the diplomatic response to Mladic's September 2026 funeral in Belgrade (two Serbian diplomats expelled, most Bosnian embassy staff withdrawn, the good-neighbourly memorandum unsigned)."
