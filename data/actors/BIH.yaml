    - rank: 3
      text: "Keep the external guarantee in place: the Office of the High Representative and its Bonn powers, the UN-mandated EU force EUFOR Althea, and Security Council unity on Bosnia's sovereignty (presidential statement of 29 Dec 2025). Sarajevo needs the guarantor because it cannot enforce the constitutional order inside the entity on its own - and the guarantor is in flux (Schmidt resigned in May 2026; the US wants his successor to hand powers to Bosnian institutions)."
