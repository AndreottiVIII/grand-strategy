    - rank: 5
      text: "Anchor the state in NATO as the second guarantee after the EU. Bosnia was invited into a Membership Action Plan in 2010, but NATO did not activate it because Republika Srpska refuses to register defence property as state property; in October 2025 NATO and Bosnia agreed a new Individually Tailored Partnership Programme. Membership is not on the table while the entity blocks it."
