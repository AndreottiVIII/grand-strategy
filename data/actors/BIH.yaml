    - rank: 6
      text: "Keep the economy and the population from draining away: capture the EU Growth Plan money (EUR 976.6m still available, EUR 373.9m at risk after 31 Dec 2026), cut dependence on the single Russian gas supply through the Southern Interconnection with Croatia (due by end-2027, ahead of the EU ban on Russian gas), and hold the remittance-fed economy together while the population falls."
