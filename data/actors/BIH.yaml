grand_strategy:
  objectives:
    - rank: 1
      text: "Keep the state alive against one of its own entities. The objective of the state-level institutions (the Bosniak-led majority in the Presidency and the Council of Ministers' Troika coalition, the Constitutional Court, the State Court, the Central Election Commission) is to defend the Dayton order, territorial integrity and the writ of state justice against the Republika Srpska leadership, which after Dodik's 26 Feb 2025 conviction banned the state judiciary and police from the entity (the OHR said this 'hint[s] at de facto secession') and now asks for the army, border police, intelligence and fiscal system back. These are not the objectives of the Serb member of the Presidency or of the HDZ BiH leadership (see reading)."
      confidence: A
      sources:
        - {url: "https://www.securitycouncilreport.org/monthly-forecast/2026-05/bosnia-and-herzegovina-15.php", title: "Bosnia and Herzegovina - May 2026 monthly forecast", publisher: "Security Council Report", date: 2026-05, tier: 2}
