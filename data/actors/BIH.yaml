        - {url: "https://n1info.ba/english/news/bih-constitutional-court-rejects-dodiks-appeal-confirms-loss-of-rs-presidency-mandate", title: "BiH Constitutional Court rejects Dodik's appeal, confirms loss of RS presidency mandate", publisher: "N1 BiH", date: 2025-11, tier: 3}
    - rank: 2
      text: "Join the EU: the only goal that all three constituent peoples nominally share and the main anchor of reform. Candidate status came in December 2022 and the Council decided to open negotiations in March 2024, but the first intergovernmental conference has not been held, no chief negotiator has been named and the negotiating framework waits for judicial-reform laws."
      confidence: A
      sources:
        - {url: "https://www.eeas.europa.eu/delegations/bosnia-and-herzegovina/two-years-green-light-accession-negotiations-%E2%80%93-there-still-political-will-bosnia-and-herzegovina_en", title: "Two years since the green light for accession negotiations - is there still political will in Bosnia and Herzegovina?", publisher: "EU Delegation to Bosnia and Herzegovina (EEAS)", date: 2026, tier: 1}
