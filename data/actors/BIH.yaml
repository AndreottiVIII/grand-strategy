  paradoxes:
    - text: "The state defends itself by borrowing an unelected foreigner's powers. The OHR's Bonn powers gave Sarajevo its strongest tool against the entity, but every use lets Banja Luka, Moscow and Beijing call Bosnia a protectorate; Russia says the OHR is 'incompatible with the sovereignty of [BiH]', and when the guarantor weakens - Schmidt out in May 2026, Washington 'no longer pursuing nation-building' - the state discovers that its capacity was on loan."
