  reading: |
    Rwanda is Luttwak's small state that turns its vulnerability into a regional offensive and then sells security abroad to buy immunity at home. The vulnerability is real - a landlocked state of the 1994 survivors, with the perpetrators' successors (the FDLR) next door and a Congolese army that has used them - and Kigali has made it the license for a forward defence in the Kivus, run through the RDF and AFC/M23 (UN experts: command and control; Goma, Bukavu, Uvira). The surplus the offensive creates is spent twice: at home as rent (gold, tin, tantalum, mineral transit) that replaces falling aid, and abroad as a service (Cabo Delgado, the CAR, UN missions) that makes the West, Paris, Maputo and now Washington need the army it sanctions. The Washington Accords of 4 December 2025 were the best expression of that logic: peace for minerals, deportees and goodwill. But the accord has become a measuring rod, the US sanctioned the RDF on 2 March 2026 and on 13 October 2026 demanded unconditional withdrawal, the EU stopped paying for Mozambique, and the offensive has produced a second adversary in Burundi. Where Luttwak's paradox bites hardest is in the memory: the genocide is both the moral capital that buys immunity and the thing the offensive spends. The grade toward the DRC is rival, not adversary: Kigali's declared aim is security and leverage, not the end of the Congolese state, and it signed an accord with Tshisekedi; the FDLR is the real adversary, and AFC/M23 the instrument. Not verified for this card: the text of the Washington Accords (read through press), a 2026 UN experts' report, the number of RDF troops in 2026, the Benin deployment (the 2022 agreement is on record, a deployment is not), Rwandan policy toward Kenya and Tanzania in 2026, the Mozambique SOFA reported for August 2025, and any succession arrangement.
