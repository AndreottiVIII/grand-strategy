  reading: |
    Senegal's grand strategy is to turn a debt crisis and a new oil and gas economy into sovereignty: it ended all foreign military presence, keeps the Dakar corridor to Mali open, and is rebuilding its IMF deal while reprofiling rather than formally restructuring. The binding constraint is the debt that the hidden-debt revelation exposed, which turns each lever (IMF approval, arrears, the new oil and gas revenue) into a condition rather than a choice. Not verified in this pass: the 2026 Faye-Sonko rift, the US aid cut and MCC, China's 2024 upgrade, the EU fisheries agreement, Russia, Turkey and the Gulf, the 2025 Casamance peace and the Thiaroye memory.
