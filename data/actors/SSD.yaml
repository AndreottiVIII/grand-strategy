  reading: |
    Juba's survival strategy is to keep the army and the oil revenue under one roof, remove the one rival able to contest the December 2026 vote, and buy protection with Ugandan troops and Emirati credit rather than with a settlement. Its weak point is the single pipe: every barrel crosses a Sudanese war in which South Sudan has no say, so the oil that keeps the state alive is also the lever Khartoum and the RSF hold. The 2018 agreement survives only as the diplomatic frame donors still use, and each move against Machar wears it down further.
