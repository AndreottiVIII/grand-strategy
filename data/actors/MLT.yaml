  reading: |
    Malta sells a flag, a licence and a harbour, and its grand strategy is to keep the EU's structure around those sales while refusing to be a military ally. Neutrality makes it useful as a host of talks and a Chair of the OSCE, and gives it a reason to stay out of the EU defence money; the Libyan maritime file and the Italian energy link matter more to it than any great power. The 2025 CJEU ruling on citizenship and the shadow-fleet reputation problem show the price of selling instruments of the state. Malta recognised Palestine on 22 September 2025 (recorded in the recognition dataset, not repeated here), a stance that sits with the EU line rather than against it.
