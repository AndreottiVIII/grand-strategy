    - text: "Export exposure. Copper and gold are the economy, and the US copper tariff is set in Washington: Andina reported a 50% copper tariff in July 2025, and the 2026 rates in the sources found conflict (a 50% and a 53% figure on commercial tariff sites, a proposed phased universal tariff in a CFR brief). Rates not verified; the constraint is the dependence, not the figure."
      confidence: C
      sources:
