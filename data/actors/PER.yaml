  paradoxes:
    - text: "Chancay brings the Chinese money and the Chinese trade, and the Chinese link became a political liability. President Jerí was removed by Congress in February 2026 for undisclosed meetings with Zhihua Yang, a Chinese businessman under government scrutiny. The investment the state needs is also what brings its leaders down."
      confidence: C
