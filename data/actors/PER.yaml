      text: "A stable executive after a run of removals. Congress removed Boluarte in October 2025 and José Jerí in February 2026; José María Balcázar succeeded Jerí as interim president; Keiko Fujimori (Fuerza Popular) won the 7 June 2026 runoff with 50.14% against 49.87% for Roberto Sánchez, a margin of 49,641 votes; the electoral jury (JNE) proclaimed her on 3 July and she was sworn in on 28 July 2026 for 2026-2031, 'the ninth president in a decade' in AP's count. Luis Galarreta, her first vice president, is prime minister; Elmer Cuba (a former central bank head) is at Economy and Carlos Espá at Foreign Affairs. Stability is the aim as we read the sequence."
