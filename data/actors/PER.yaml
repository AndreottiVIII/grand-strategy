    Peru is governed since 28 July 2026 by Keiko Fujimori, who won the runoff by 49,641 votes after Congress removed Boluarte (October 2025) and Jerí (February 2026): a right-wing president with the largest bloc in a new Senate but not a majority, a prime minister who is her vice president, and a cabinet built on investment and security. Peru is a minerals economy with two markets: China took 36.2% of 2025 exports, much of it through COSCO's Chancay, and the United States, the second market, now puts a 12.5% tariff on Peru, so Lima has to keep both open at once; its answer so far is to call the US a strategic partner, repair Mexico and Venezuela, and say nothing public on China. The strategy is held back less by enemies than by its own Congress and by borders it cannot close (Chile, Venezuelan migration), and the Chinese port is a political risk as well as a trade gain. Not verified for this card: Boluarte's and Jerí's removals and the Zhihua Yang meetings beyond the Wikipedia index, the Iran trade figures, the Section 232 copper tariff in force today, the Brazil, Spain, UK and APEC legs, illegal mining and the Shining Path remnants (no source read), and whether Peru's Congress ratified the Ilo protocol.
