  constraints:
    - text: "Congress is the constraint. The 1993 constitution's vague 'moral incapacity' ground lets Congress remove the president, and it has done so: Castillo in December 2022, Boluarte in October 2025 and Jerí in February 2026. Each removal resets the executive's agenda, and the 2026 transition came under Balcázar, an interim president chosen by Congress."
      confidence: C
      sources:
