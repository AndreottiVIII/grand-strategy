  means:
    - domain: economic
      text: "Chancay, the COSCO Shipping Ports terminal (60% owned, a 30-year concession, 1 million TEU a year), the first COSCO terminal in South America, inaugurated by video link by Xi and Boluarte on 14 Nov 2024. Copper and gold are the export base."
      confidence: A
