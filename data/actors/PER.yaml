      text: "Sell the minerals on two markets at once: Chinese trade through the Chancay port, and copper into the United States under the tariff threat. Minerals are the economy; the rest follows from them. China took 36.2% of 2025 exports (Mincetur, as reported; an earlier snippet gave 32%, see the relations note); mining was US$61.8bn of the record US$90.1bn exported, copper 45% and gold 38% of it (SNMPE); copper to the US is under 5% of copper exports, but the US sets the tariff and bought US$10.15bn of all goods in 2025."
