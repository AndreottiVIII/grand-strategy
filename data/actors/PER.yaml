    - rank: 2
      text: "A stable executive after a run of removals. Congress removed Boluarte in October 2025 and José Jerí in February 2026; José María Balcázar succeeded Jerí; Keiko Fujimori was certified the winner of the 7 June runoff on 29 June 2026 after a 50,000-vote margin, and the constitutional date of office is 28 July 2026 (not confirmed in the sources read). Stability is the aim as we read the sequence."
      confidence: C
