grand_strategy:
  objectives:
    - rank: 1
      text: "Sell the minerals on two markets at once: Chinese trade through the Chancay port, and copper into the United States under the tariff threat. Minerals are the economy; the rest follows from them. China took about a third of 2025 exports (32%, trade ministry as reported); copper to the US is under 5% of copper exports, but the US sets the tariff."
