    - text: "The Bolivian sea question puts Peru on both sides. Under the 1929 Treaty of Lima Bolivia's access to the Pacific is blocked by Chile and by Peru (background in the sources read, the treaty text not read); in 2010 Peru and Bolivia signed the Ilo protocol, a 99-year duty-free maritime zone for Bolivia at Peru's own port (its Peruvian ratification is unverified). In January 2026 President Paz said the Pacific, 'through Chile or Peru', has to be Bolivia's gateway, and on 28 August 2026 Peru signed the minerals declaration with Chile and Bolivia. Peru offers Bolivia the sea it can give from its own coast while a Bolivian claim on the Chilean coast would reopen the settlement of 1929 that Lima also signed."
