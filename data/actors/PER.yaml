  reading: |
    Peru is a minerals economy with two markets: China buys through Chancay and took about a third of 2025 exports, and the United States buys copper under a tariff set in Washington, so Lima has to keep both open at once. Its strategy is held back less by enemies than by its own Congress, which has removed three presidents since 2022 and turned the Chinese port into a political risk as well as a trade gain. Not verified for this card: the Chile, Ecuador, Bolivia, EU and Venezuela-migrant questions (no fetched source), the 1998 Ecuador accord, Bolivia's sea claim, the April 2026 first-round figures, and the Iran rupture of 1 September 2026, whose reasons the sources read do not give.
