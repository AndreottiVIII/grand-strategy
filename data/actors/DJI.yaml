  reading: |
    Djibouti sells position. Its state is one port, one railway and a set of rented bases, and its strategy is to be the place every outside power and every landlocked neighbour must pass through, so that no single patron gets it. The threats are the ones that would shrink that position: Ethiopia's search for a sea outlet at Assab, the Berbera project backed by the UAE and Israel, and the Houthi war at the Bab al-Mandab. Water and heat limit any growth beyond rent, and the IGAD seat it hosts is the forum in which it keeps its weight.
