  reading: |
    New Zealand is a small, trade-dependent state whose security has rested on Australia and, at arm's length since the 1986 rift, on the United States, the nuclear-free law being the price it chose to pay. Its real frontier is the Pacific: the Cook Islands' partnership with China and the Chinese naval live-fire drill in the Tasman Sea in February 2025 show where its strategy is tested, and it answers with money, a defence build-up toward 2% of GDP and a closer defence relationship with Australia. Its commitments further afield (Ukraine training, Russia sanctions, the Philippines visiting-forces pact, the India trade deal) are real but modest, and on Palestine it held back recognition in September 2025.
