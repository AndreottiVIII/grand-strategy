    text: 'Keep the regime whole: a civilian presidency with the army behind it. Tebboune was re-elected on 7 Sep 2024 with 84.3% on an official 46.1% turnout that all three campaigns, his own included,
      called irregular; the July 2026 parliament was elected on about 21% turnout after roughly a third of prospective candidates were barred. Legitimacy is thin, so the order rests on the security apparatus
      (defence takes 21% of public spending) and on hydrocarbon rents; a constitutional revision to lengthen the presidential term beyond 2029 was reported in preparation.'
