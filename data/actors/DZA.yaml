  reading: 'Algeria runs the grand strategy of a rentier state whose army is the regime and whose two standing antagonists, Morocco and France, are the two neighbours it cannot choose: one across a border
    closed since 1994, the other across a sea that carries its gas, its diaspora and its memory. The 1962 identity of anti-colonial sovereignty, the Sahrawi referendum and the colonisation law substitute
    for the votes it does not get (46.1% disputed in 2024, about 21% in 2026), so every rupture is domestic currency as much as foreign policy. The paradoxical logic shows at each step: the tap that was
    meant to punish (the Maghreb pipeline, Spain in 2022) was also the only income, so it ran on; each door shut (Morocco, the UAE, France''s embassy premises, Mali''s airspace) removes a seat at the table
    where Washington, Paris and Rabat then decide without Algiers. Two signals that are not rows: Algiers did not vote on Resolution 2797 and has not answered the US push for talks with Rabat, and the chief
    of staff''s reported absence from the December 2025 council on a term-extending revision (Yabiladi, single source) is a possible seam inside the regime. The thaws of 2026 (Spain, Mali, France) are not
    reconciliation; they are the rentier state discovering that its leverage is bounded by its customers. Grading note: Morocco stays a rival, not an adversary, by the ontology''s own test: the aim Algiers
    declares is Sahrawi self-determination and security, not Moroccan defeat, and the Kabylie charge is the nearest it comes to an existential accusation.'
