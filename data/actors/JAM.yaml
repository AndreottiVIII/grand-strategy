  reading: |
    Jamaica is a small, indebted state whose rebuild after Hurricane Melissa now runs through lenders and CARICOM rather than its own means. Its clearest foreign-policy act, ending the Cuban medical programme, is read in Havana as Washington's price, and Kingston denies it, which is the ambiguity a small state buys with. This card is thin on purpose: the United States, United Kingdom, China and CARICOM postures, and the economy and gangs, wait for sources the card has not yet read.
