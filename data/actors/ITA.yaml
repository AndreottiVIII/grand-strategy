  reading: 'Italy is a middle power that lives by position rather than mass: a G7 and euro-area economy with a 137% debt, a security guarantee it does not pay for, and a coastline that makes Libya, Tunisia
    and the Hormuz strait domestic questions. Meloni''s strategy, in Luttwak''s terms, is to convert geography and access into rank - first on Trump, then on Brussels, then on Africa - while spending little
    force. It worked in 2025 (the first European at the White House, Mercosur and the Russian assets shaped in Rome, a thaw with Berlin and Paris) and strains in 2026, when Washington turned from courting
    her to attacking her and the Iran war made basing, energy and migration one problem. The structure beneath is stable: NATO and the EU are not negotiable, so rhetoric moves around them (the refusal of
    troops for Ukraine, conditional recognition of Palestine, the Israel freeze) but never out. The real test is financial: the 5% pledge, the deficit procedure and an energy bill set by third parties leave
    little room for the posture of ''bridge''.'
