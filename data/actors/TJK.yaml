    - domain: diplomatic
      text: "Border settlement as a tool: a Treaty on Allied Relations with Uzbekistan (18 Apr 2024), and the Kyrgyz border treaty of 13 Mar 2025, which closes the most dangerous frontier in the region after the 2021-22 clashes."
