    - text: "A frontier it cannot hold alone. The Afghan border saw the first direct firefight with the Taliban since 2021 (24 Aug 2025, Panj River), further clashes in October and December 2025, and an attack that killed Chinese workers on 26 Nov 2025. Dushanbe depends on Russian and Chinese help to police it."
