    - text: "Debt to its first creditor. China holds the largest share of external debt, over USD 700m of about USD 3.04bn at 1 Oct 2026 (Times of Central Asia; share in 2016 was about half). The Chinese loans are the reason Beijing has leverage in Dushanbe."
