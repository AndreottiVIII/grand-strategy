    - rank: 2
      text: "Keep Afghan soil from serving the armed opposition. The NRF (mostly ethnic Tajik, leadership reported in Tajikistan) and Jamaat Ansarullah fight in the north-east of Afghanistan, and Dushanbe wants Kabul to stop the harbouring and cross-border raids that reach its own frontier."
      confidence: B
      sources:
