      text: "Russia's 201st base, about 7,000 Russian troops in Dushanbe, Qurghonteppa and Kulob under a lease to at least 2042, plus a reported Chinese security installation at Shaimak in Gorno-Badakhshan that both governments deny. The base is the only large foreign garrison in the country; the Chinese post is reported, not confirmed."
