  paradoxes:
    - text: "Russia guards the regime and the border and also takes the wages that feed it. Its 201st base and CSTO membership keep Rahmon in power, while Russia's post-Crocus crackdown on migrants (raids, expulsions) cuts the remittances that carry the budget; the protector is also the squeeze."
