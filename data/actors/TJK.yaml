    - rank: 1
      text: "Keep the Rahmon line and hand it to the family. Rustam Emomali, Dushanbe mayor since 2017 and Senate chairman since April 2020, is the constitutional successor if his father cannot serve; a 2025 personnel reshuffle is read as a glide path toward him. Rahmon, 73, has no successor outside the family."
