    - domain: economic
      text: "Labour exports and hydropower. Remittances, about 48% of GDP in 2024 and mostly earned in Russia, keep the budget and households afloat; Rogun is the state's bid to sell power downstream, with Uzbekistan contracting 20 years at USD 0.034/kWh (the price per Fergana and Eurasianet reporting, not verified against the contract)."
