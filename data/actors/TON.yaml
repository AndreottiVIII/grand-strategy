  reading: |
    Tonga's strategy is survival by balancing, not alignment: no treaty ties it to any patron, which is why every stance it holds is partner. Its money comes from Chinese loans it wants to shrink, Australian and New Zealand labour schemes and budget support it cannot do without, and remittances that make its economy a function of others' payrolls. The King is the fixed point of Tongan politics; governments change by parliamentary vote inside the room the monarchy leaves them, and the eruption recovery and the China debt are the two tests of the next years.
