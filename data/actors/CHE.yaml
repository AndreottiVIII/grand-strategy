  reading: |
    Switzerland holds its position by being useful to everyone: venue, protecting power and financial centre to the West, tariff-deal partner to Washington, free-trade partner to Beijing. The 2026 votes (population cap and neutrality both rejected, EU package advancing) show a public that wants to keep both its market access and its neutral label, which is why Bern aligns with EU sanctions while insisting it is not aligned. The unresolved tests are the referendum on the EU package, the US tariff regime and the Patriot/F-35 dependency.
