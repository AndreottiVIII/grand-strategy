grand_strategy:
  objectives:
    - rank: 1
      text: "Keep the customs union and the monetary and diplomatic arrangements with Switzerland: the customs union has run since 1924, the franc has been the currency since 1920, and Switzerland represents Liechtenstein abroad unless it chooses otherwise. Without the Swiss tie the state has no army, no foreign service of its own and no market of its own."
      confidence: A
      sources:
        - {url: "https://historisches-lexikon.li/Zollanschlussvertrag", title: "Zollanschlussvertrag (customs union treaty)", publisher: "Historisches Lexikon des Fürstentums Liechtenstein (Marxer)", date: 2011-12-31, tier: 2}
        - {url: "http://www.wto.org/english/tratop_e/tpr_e/tp150_e.htm", title: "Switzerland and Liechtenstein (trade policy review)", publisher: "WTO", date: 2000-12-06, tier: 1}
