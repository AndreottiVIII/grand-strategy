      text: "EU membership, but on terms that no longer reopen identity, language or history. The government wants the negotiating clusters opened without first writing Bulgarians into the constitution; Mickoski says no amendment is possible while he is prime minister unless (1) the Macedonian community in Bulgaria gets its rights under international law and (2) there are guarantees on identity and language and no further bilateral vetoes. On 2 Oct 2026 he and von der Leyen agreed 'a first step' to break the deadlock, with the foreign minister going to Sofia."
