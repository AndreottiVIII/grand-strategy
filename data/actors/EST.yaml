  reading: 'Estonia runs the grand strategy of a front-line state that has decided to spend its way to being un-attackable rather than hope for a guarantor: 5.43% of GDP, a fortified border, a deep-strike arsenal and a dense net of partners (UK, Finland, Poland, Germany, Korea) around an American umbrella it publicly trusts and privately hedges. The Luttwak pattern is that each hardening has a cost that returns on the same front: the forward posture raises exposure, enforcement at sea shows the limits of the law, grid independence concentrates risk in cables, and the defence of the nation-state against Russian leverage on the minority hands Moscow a grievance narrative. Russia is graded a rival, not an adversary: Estonia seeks deterrence, a Russian defeat in Ukraine and a Russia that pays, not the end of the Russian state, and keeps an embassy and a border regime open. The Kremlin''s line that Russia ''poses no threat'' to Estonia and the Estonian intelligence judgement that Moscow has no
    intention of attacking in the coming year are signals, not rows: both sides are reading the other''s limits. The open question for 2027 is the American presence after the end-2026 rotation and an election that a weak coalition may lose.'
