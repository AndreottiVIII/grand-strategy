  note: 'The actor of this card is the State Administration Council that took power on 1 Feb 2021, now fronted by President Min Aung Hlaing (sworn in 10 Apr 2026) after the military-run election
    of Dec 2025-Jan 2026. Its standing is contested: the UN Credentials Committee deferred the junta''s bid to replace Myanmar''s ambassador in Dec 2021 (Associated Press of Pakistan, https://www.app.com.pk/global/un-committee-defer-action-on-bid-by-taliban-myanmar-junta-to-appoint-envoys-to-world-body;
    2026 position of the UN seat not verified), ASEAN keeps it out of summits, and an AFP-quoted analyst counts recognition from India, China, Russia and Thailand as the ones that matter. The
    NUG, formed in exile in 2021, claims to be the legitimate government.'
  source: https://www.nst.com.my/amp/world/region/2026/08/1505432/myanmar-ex-junta-chief-first-thailand-trip-civilian-leader
