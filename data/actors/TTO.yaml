  reading: |
    Trinidad and Tobago plays for gas. Its LNG plant runs below capacity, and the field it needs, Dragon, is shared with Venezuela, so the strategy is to buy Venezuelan molecules with a visible loyalty to Washington. That loyalty brought a US licence and a warship visit, and Caracas answered in the same month by freezing the accord; the first deliveries, due in 2027, depend on a neighbour Port of Spain has angered and a patron it has courted.
