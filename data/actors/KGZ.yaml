  reading: |
    Kyrgyzstan is a small, landlocked state whose regime has concentrated power around Japarov since he sacked Tashiev in February 2026, ahead of a presidential election on 27 January 2027, after a 2025 crackdown on the independent press. Its security and its labour market both run through Russia (CSTO, Kant, remittances), while China (railway and financing), Uzbekistan and Tajikistan (border treaties of 2023 and 2025) and the United States (trade and visas) offer room to balance. Its levers are gold, transit and water; its binding constraint is Moscow.
