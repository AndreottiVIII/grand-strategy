  reading: 'Japan is the case of a power that rearmed by naming its contingency, and then met the coalition the naming provoked. Luttwak''s logic of strategy says that what is declared is not what is deterred: Takaichi''s
    sentence of 7 November 2025 turned a quiet ambiguity into a position, and a position can be answered. Beijing answered on every lever that Japan had left exposed (tourists, seafood, rare earths, dual-use exports), recruited
    Moscow in a single sentence about ''militarism'', and then waited; eleven months later the retraction it demands has not come and neither has the thaw (Wang Yi to Iwaya, 28 September 2026). Tokyo''s compensation is the
    oldest one in its strategy, the American alliance, now bought with USD 550bn and paid in installments, and a ring of lesser partnerships (Manila, Canberra, New Delhi, London and Rome, Seoul) that each add a little weight
    and none a guarantee. The constraint that matters is not Article 9, which the February 2026 landslide has put in play, but arithmetic: a shrinking population, a debt of 230% of GDP, a yen at 160, and a Strait of Hormuz
    that closed in March. The grand strategy therefore has the shape of a lever with a short arm: the deterrent is credible, the base that pays for it is not yet. The test of the next twelve months is whether the rewritten
    security documents (due by the end of 2026) and a possible Xi-Takaichi meeting at the APEC summit in Shenzhen (18-19 November) can turn the naming into a negotiated line before the bill comes due.'
