  reading: |
    Sierra Leone under Bio turns a fragile domestic position into regional standing: the ECOWAS chair since June 2025 and a Western investment frame give it a voice beyond its size. The November 2023 armoury attack shows that the main constraint is at home, inside the security forces, and that the regional rules it now chairs apply to it too. Not verified in this pass: the UN Security Council seat, the 2023 election dispute, the 2025 US visa and aid cuts, the Chinese fishing harbour, Guinea and Yenga, Liberia beyond the 2007 pact, and the kush epidemic.
