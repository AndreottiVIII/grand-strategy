      text: "Stay the government of record. President Hassan Sheikh Mohamud's four-year term ran out on 15 May 2026 by the opposition's count; parliament's amendments of March 2026 turn it into a five-year term, so he says he serves to 15 May 2027, and the plan is a one-person-one-vote election in place of the clan-based indirect vote. The opposition (Puntland's Deni, former president Sharif Sheikh Ahmed, the Somali Future Council) calls the amendments unilateral and no longer recognises him; US- and UK-mediated talks at Halane collapsed on 15 May."
