  paradoxes:
    - text: "Survival contracted out to a dozen patrons buys time and sells pieces. Turkey gets a base, the oil blocks, a spaceport and missile range and a mandate to 2028; Egypt a pact aimed past Mogadishu at Ethiopia; Qatar and Saudi Arabia a stake against the UAE; China a vote against Taiwan; Washington strikes but not aid. Each is paid in sovereignty, and the patrons' quarrels (Turkey and the UAE, Egypt and Ethiopia, Israel and Turkey) are then fought on Somali ground. Luttwak's client system with no hegemon: the clients are many, the patron is none."
      confidence: B
