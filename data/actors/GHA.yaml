  reading: |
    Mahama's government, in office since January 2025, inherits an IMF programme that closes in July 2026 with the debt restructuring largely done, but the fiscal room it buys is narrow and rests on gold prices. Its external currency is transactional: a UK trade framework from 2021 and a 2025 US deportation arrangement, while the northern border is where the Sahel juntas reach Accra. The sources in this pass do not cover the AES outreach, the ECOWAS neighbours, the EU, China, the Gulf or the 2025 anti-LGBT bill, so those rows and stances are open gaps.
