    - rank: 2
      text: "Finish the external debt restructuring with the commercial creditors who remain: about US$2.7bn, under 5% of pre-restructuring public debt, as the IMF put it in the 2025 review. Domestic restructuring was completed in 2023 and the Eurobonds in October 2024; bilateral deals are largely in place."
      confidence: B
      sources:
