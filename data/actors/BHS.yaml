  reading: |
    The Bahamas is a small, tourism-dependent state whose government was renewed in May 2026 with a large majority, so its aim is continuity and control of migration rather than a change of course. Its sharpest test is with Haiti and the United States: Nassau removes Haitians at scale and bars Haitian visa applicants, in line with Washington's entry rules, while it refuses to take US deportees. This card holds only what was sourced in this pass; its positions on Cuba, China, CARICOM and Ukraine or Gaza are not written, because no source for them was read.
