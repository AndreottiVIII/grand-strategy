  reading: 'Norway runs the strategy of a rich small state on the edge of a hostile great power: its security is borrowed from the Atlantic alliance, its wealth comes from the thing Europe needs most, and
    both are now wielded under pressure. Since 2022 it has turned its income into the three things it can use: gas for Europe''s grid, the Nansen programme for Ukraine, and a defence budget heading for
    3.5% of GDP. The classic Luttwakian pattern is that each lever works against the next: gas and the fund make Norway central and rich, but also a target and, for Washington, an object to press (tariffs,
    the fund''s ethics, the Greenland episode). In response it is pluralising its guarantors (UK frigates and Lunna House, German submarines, the EU defence partnership, Nordic integration with Sweden and
    Finland), while remaining dependent on US aircraft and US reinforcement. With Russia the policy is firm and unromantic: sanctions, public naming of GPS jamming and espionage, but also a fisheries regime
    and a Svalbard Treaty that Oslo wants to keep working. The seizure of the Professor Molchanov on 2 Sep 2026 shows the limits of that dual policy; it will be tested next by the Russian appeal and by
    how far Moscow pushes Svalbard. Domestically the Støre minority government depends on left parties whose priorities (oil phase-out, divestment from Israel) cut across the fund and the energy exports
    that give Norway its influence; the 2027 budget will test it again. Two signals that are not rows: Norway refused a seat on the Board of Peace on principle, and its Arctic Council chairship ended in
    May 2025 with Russia still excluded from political dialogue, so the forum Norway invested in is now under Danish-Greenlandic stewardship in the middle of the Greenland dispute. Gaps: the rate of the
    US tariff now in force, the US Marine rotation (only prepositioning and exercises are sourced), the 2024-25 restrictions on Chinese investment (no source found; only Security Act screening, the Telenor-Huawei
    decision of 2019 and the 2026 threat assessments are documented), and the US share of the fund''s equity.'
