  reading: |
    Ireland is a small EU member outside NATO, with a neutral military tradition, a Partnership for Peace relationship, and an economy built on US multinationals. Its strategy uses the EU as its anchor and the 2026 Council presidency as its lever, keeps the UK relationship stable through the Northern Ireland framework, and takes a visible line on Gaza that has cost it an embassy relationship with Israel. Its thin defence means the Russia question is handled mainly through EU sanctions and partner monitoring of undersea cables.
