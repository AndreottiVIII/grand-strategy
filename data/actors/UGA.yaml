  paradoxes:
    - text: "Operation Shujaa is meant to contain the ADF, yet the UN panel reports (leaked July 2025 report) that Ugandan units expanded their presence in eastern DRC on their own initiative, forming a buffer that shielded M23 from counter-attacks. The 2024 panel had reported active support from some officers; Uganda denies it. The campaign that secures the border feeds the war on the other side of it."
      sources:
        - {url: "https://www.aljazeera.com/news/2025/7/18/un-experts-cast-blame-on-rwanda-and-uganda-what-are-they-doing-in-drc", title: "UN experts cast blame on Rwanda and Uganda. What are they doing in DRC?", publisher: "Al Jazeera", date: 2025-07-18, tier: 3}
        - {url: "https://thedefensepost.com/2024/07/10/uganda-dismisses-backing-m23/amp/", title: "Uganda dismisses backing M23 (2024 UN panel report as reported)", publisher: "The Defense Post", date: 2024-07-10, tier: 4}
    - text: "The gold hub adds export income but draws the scrutiny that cost Uganda its AGOA access: a declared export surplus above its own output is exactly the pattern the UN panel calls smuggled DRC gold. The same trade that pays for the state invites the donor and sanctions attention the state can least afford."
      sources:
        - {url: "https://www.africanews.com/2026/07/02/gold-smuggling-from-drcs-ituri-province-to-uganda-on-the-rise-says-un/", title: "Gold smuggling from DRC's Ituri province to Uganda on the rise, says UN", publisher: "Africanews", date: 2026-07-02, tier: 3}

  reading: |
    Uganda's grand strategy is the survival of the Museveni system, now being handed on to Muhoozi, and it pays for that by becoming a regional security power (Juba, Somalia, eastern DRC) and the corridor for Lake Albert oil and for gold. The 2026 election and the 2025 military courts law show a regime that wins at home by control of information and courts while its donors cool (AGOA lost, aid thin). The army is its strength and its trap: each deployment that secures the regime also ties Uganda to the wars on its borders and to the gold trade the UN now traces. Refugees (about two million, largest in Africa) are the regional weight it cannot shed, funded at a fraction of need. Not verified for this card: Israel and Russia (only a 2019 nuclear agreement and a 2025 letter found), the 2025 US sanctions and aid cuts, Turkey, Saudi Arabia and the Gulf beyond gold, and the Ebola outbreak of 2025.
