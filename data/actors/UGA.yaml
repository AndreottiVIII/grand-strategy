    - domain: economic
      text: "Gold trading hub. Declared 2025 gold exports of USD 5.8bn (central bank; USD 3.3bn in 2024), a figure the UN panel puts at USD 6.4bn and above Uganda's own output; 31 t of gold went to the UAE in 2024 (SWISSAID, from UN Comtrade data). The UN finding ties much of the surplus to gold smuggled from Ituri, DRC."
      confidence: C
