      text: "The UPDF as the region's expeditionary force: special forces in Juba since March 2025; a joint campaign in eastern DRC; about 4,500 troops on the AUSSOM list in Somalia, the largest contributor. The army is the regime's core and Muhoozi commands it."
      confidence: B
