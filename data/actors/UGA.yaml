grand_strategy:
  objectives:
    - rank: 1
      text: "Keep the Museveni system and hand it on inside the family. Museveni won a seventh term (71.65%, election of 15 Jan 2026, official count as reported) and was sworn in in May 2026. His son Gen. Muhoozi Kainerugaba has been Chief of Defence Forces since March 2024 and announced in August 2026 a bid for the presidency in 2031."
