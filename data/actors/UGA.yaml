    - rank: 2
      text: "Hold the eastern DRC frontier and the ADF ground through Operation Shujaa, a joint UPDF-FARDC campaign against the ADF launched in November 2021. Congo-focused research reads it also as protection of the Lake Albert oil area and of roads for Ugandan goods."
      confidence: B
      sources:
