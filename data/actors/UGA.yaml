    - text: "Refugees: about 2.0 million refugees and asylum-seekers, the largest population in Africa (1,999,576 at 31 March 2026, UNHCR; 2,003,369 registered by 13 April 2026, EU and OCHA update), mostly South Sudanese and Congolese. The 2026 UNHCR appeal was about 14% funded by 31 March 2026; asylum policy changed in February 2026 (individual status determination for all nationalities)."
      confidence: A
      sources:
