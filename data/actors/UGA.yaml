    - rank: 3
      text: "Turn Lake Albert crude into export revenue through the East African Crude Oil Pipeline (EACOP), 1,443 km from Hoima to Chongoleani near Tanga. The pipeline was 79% complete at end-2025; start-up was targeted for 31 July 2026 and first crude from Tanga for October 2026. Neither date is confirmed in sources found."
