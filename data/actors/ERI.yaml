  reading: |
    Eritrea runs the strategy of a garrison state that has turned isolation into method: an army with no end date, a constitution never applied, and a ring of partners (Egypt, Somalia, Sudan, with Russia at the UN) built to keep Ethiopia off the Red Sea. The structural problem is that it holds the coast and the port that Ethiopia wants, so each Ethiopian move on Assab reads in Asmara as an attack, and each Eritrean move in Tigray reads in Addis as an invasion. The 1-2 October 2026 rupture shows the paradox at full size: the ring is Addis Ababa's proof of encirclement, and the 'no war, no peace' that Asmara kept from 2000 to 2018 is ending on the border.
