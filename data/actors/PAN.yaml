  reading: |
    Panama's strategy is to keep the canal Panamanian and its revenue flowing, and in 2025 the only protector of both was the power that had threatened to take the canal back. Mulino paid for US cover with a military presence and a rupture with Beijing's Belt and Road, and kept the Chinese-linked ports under review rather than seized. The cost shows at home in the strike, the emergency and the word 'invasion', so the next test is whether neutrality of the canal survives a patron that is also its loudest claimant.
