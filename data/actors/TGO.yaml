grand_strategy:
  objectives:
    - rank: 1
      text: "Be the bridge between the Sahel and the Gulf of Guinea: the Togo-Sahel strategy for 2026-2028, presented in Lomé on 18 April 2026 under the patronage of Council President Faure Gnassingbé, replaces the 2021 plan, aims to strengthen political dialogue with the Sahel states and presents Togo as a credible mediator."
      confidence: C
      sources:
        - {url: "https://fr.allafrica.com/stories/202604160457.html", title: "West Africa: A new diplomatic roadmap", title_original: "Afrique de l'Ouest: Une nouvelle feuille de route diplomatique", publisher: "AllAfrica (Togonews)", date: 2026-04-16, tier: 3, lang: fr}
    - rank: 2
      text: "Keep jihadist violence on the northern border from spreading south: the strategy names the persistent terrorist threat and its spread toward the coastal Gulf of Guinea states as the reason for updating its Sahel policy."
      confidence: C
      sources:
        - {url: "https://fr.allafrica.com/stories/202604160457.html", title: "West Africa: A new diplomatic roadmap", title_original: "Afrique de l'Ouest: Une nouvelle feuille de route diplomatique", publisher: "AllAfrica (Togonews)", date: 2026-04-16, tier: 3, lang: fr}

  means:
    - domain: diplomatic
      text: "Mediation and dialogue: a six-session meeting in Lomé in April 2026 with governments, regional and international organisations, special envoys and civil society, meant to present the strategy and build political dialogue with the Sahel states."
      confidence: C
      sources:
        - {url: "https://fr.allafrica.com/stories/202604160457.html", title: "West Africa: A new diplomatic roadmap", title_original: "Afrique de l'Ouest: Une nouvelle feuille de route diplomatique", publisher: "AllAfrica (Togonews)", date: 2026-04-16, tier: 3, lang: fr}

  constraints:
    - text: "The terrorist threat is on its own border: the same strategy says insecurity is spreading toward the coastal states, so Togo's Sahel diplomacy is also a security problem it must manage with the states it is talking to."
      confidence: C
      sources:
        - {url: "https://fr.allafrica.com/stories/202604160457.html", title: "West Africa: A new diplomatic roadmap", title_original: "Afrique de l'Ouest: Une nouvelle feuille de route diplomatique", publisher: "AllAfrica (Togonews)", date: 2026-04-16, tier: 3, lang: fr}

  paradoxes:
    - text: "The bridge runs to the states whose exit from ECOWAS and whose insecurity the strategy names as the problem: the strategy's own reasons are the persistent terrorist threat, its spread toward the coast, and the Sahel states' departure from ECOWAS. The closer Lomé draws to the AES, the more it takes on the exposure it wants to manage from outside."
      confidence: C
      sources:
        - {url: "https://fr.allafrica.com/stories/202604160457.html", title: "West Africa: A new diplomatic roadmap", title_original: "Afrique de l'Ouest: Une nouvelle feuille de route diplomatique", publisher: "AllAfrica (Togonews)", date: 2026-04-16, tier: 3, lang: fr}

  reading: |
    Togo's strategy, as far as the sources opened for this card show, is to turn a small Gulf of Guinea state into the broker between the Sahel juntas and the coastal states, so that the jihadist war on its northern border is handled through talks rather than only through troops. The card is thin: one government-announced strategy (April 2026) is the only source opened, and the constitution and the 2025 protests, the Alliance of Sahel States membership question, the Port of Lomé's role for landlocked Sahel states, and the Nigeria, ECOWAS, Ghana, Benin, France and China relations are not yet sourced at the level the card needs. Those are the gaps for the next pass.
