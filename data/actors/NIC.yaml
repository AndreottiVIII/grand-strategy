  reading: |
    Nicaragua is a regime that has chosen control over the Church and the exiles, and pays for it in its one large market, the United States, which is now proposing to close or tax it. Its answer is the patronage of Russia and China, but neither can replace the US trade it needs, so the strategy is survival by protest and litigation rather than by growth. The CAFTA decision and the Church file are the two tests to watch; the co-presidency of Ortega and Murillo and the exiles' nationality are not sourced in this thin card (gaps in the journal).
