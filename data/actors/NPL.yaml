  reading: |
    Nepal is a landlocked hedger between India and China, and its grand strategy has been to get paid for its water and its people while keeping its border claims alive. The September 2025 Gen Z uprising, which brought down Oli and put Sushila Karki in charge of a six-month interim, ended with the March 2026 election, won outright by the Rastriya Swatantra Party (182 of 275 seats) and its prime minister Balendra Shah. The new government has to show that the India-China balance survives its own warmer reset with Delhi and the Lipulekh friction, and that the power and labour economy can carry the state through the next earthquake or flood.
