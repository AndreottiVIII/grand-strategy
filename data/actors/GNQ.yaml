  reading: |
    On the sources read here, Equatorial Guinea runs two tracks: it takes its border dispute with Gabon to court when the law can be made to favour it, and it enforces control at sea with the means it has, which has since become a tribunal suit. The card is thin because the sources read here do not cover the Obiang succession, China's port and debt, the United States, France, Spain, Cameroon, CEMAC or the decline of oil and gas; those gaps are logged in JOURNAL, not filled from memory. Until they are sourced, read this card as the island and sea file only.
