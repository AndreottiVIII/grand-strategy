  reading: |
    Gabon under Oligui Nguema is trying to turn a French-era security relationship and a single extractive commodity into a sovereign model: the camp is shrinking into a Gabonese training hub, and manganese is to be processed at home rather than exported raw. The relationships with China and the United States are not yet written: no source for them was read in this pass, and the gap is logged in the journal. The two constraints the card cannot yet price, oil decline and public debt, are the first things to read before the card can be called complete.
