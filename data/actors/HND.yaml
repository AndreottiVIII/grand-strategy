  reading: |
    Honduras is a partner of both Washington and Beijing with no alignment to either, and since January 2026 its new president has reviewed the March 2023 switch to China rather than reversed it. The Taiwan question is open: a return to Taipei would undo that switch, and Asfura says the US tie, with its remittances, TPS and maquila jobs, comes first. The paradox sits in the review itself, which courts US investment by examining the Chinese deals the country still runs, so the check on Beijing may cost the projects that make Honduras worth courting.
