  means:
  - text: "Textile exports as the lever. Textiles are the largest private employer (about 40,000 jobs) and about 90% of manufacturing exports; US exports under AGOA are about a tenth of GDP. That value to Washington is the only card the country holds, and the 2025 tariff was aimed at it."
    confidence: C
    sources:
      - {url: "https://www.businessday.co.za/bd/world/africa/2025-07-09-lesotho-reels-as-tariff-uncertainty-causes-order-cancellations-mass-lay-offs/", title: "Lesotho reels as tariff uncertainty causes order cancellations, mass lay-offs", publisher: "BusinessDay", date: 2025-07-09, tier: 3}
      - {url: "https://www.timeslive.co.za/news/africa/2025-07-10-trump-tariffs-create-national-disaster-for-tiny-lesotho/", title: "WATCH | Trump tariffs create national disaster for tiny Lesotho", publisher: "TimesLIVE", date: 2025-07-10, tier: 3}
  - text: "Emergency powers. The state of disaster lets the government redirect funds to recovery programmes and take all necessary measures to reduce the effect of the disaster, without waiting for ordinary budget procedure."
    confidence: C
    sources:
      - {url: "https://www.africanews.com/2025/07/10/lesotho-declares-two-year-state-of-disaster-amid-us-tariff-fallout//", title: "Lesotho declares two-year state of disaster amid US tariff fallout (search snippet; page not fetched, server refused)", publisher: "Africanews", date: 2025-07-10, tier: 3}
  constraints:
  - text: "Concentration. Textiles dominate private employment and manufacturing exports, so one order decision can cost thousands of jobs; the 2025 cancellations and the closure of a 1,300-worker factory showed it."
    confidence: C
    sources:
      - {url: "https://www.businessday.co.za/bd/world/africa/2025-07-09-lesotho-reels-as-tariff-uncertainty-causes-order-cancellations-mass-lay-offs/", title: "Lesotho reels as tariff uncertainty causes order cancellations, mass lay-offs", publisher: "BusinessDay", date: 2025-07-09, tier: 3}
  - text: "Thin room in the budget. Unemployment near 30% overall leaves little margin for an emergency that is financed by moving existing funds rather than by new revenue."
    confidence: C
    sources:
      - {url: "https://www.africanews.com/2025/07/10/lesotho-declares-two-year-state-of-disaster-amid-us-tariff-fallout//", title: "Lesotho declares two-year state of disaster amid US tariff fallout (search snippet; page not fetched, server refused)", publisher: "Africanews", date: 2025-07-10, tier: 3}
  paradoxes:
  - text: "The economy's strongest export is also its weakest point: the textile sector built on US access is the largest private employer, so a tariff on that sector becomes a threat to the state itself, which is why Maseru answered with an emergency rather than a trade dispute."
    sources:
      - {url: "https://www.businessday.co.za/bd/world/africa/2025-07-09-lesotho-reels-as-tariff-uncertainty-causes-order-cancellations-mass-lay-offs/", title: "Lesotho reels as tariff uncertainty causes order cancellations, mass lay-offs", publisher: "BusinessDay", date: 2025-07-09, tier: 3}
  reading: |
    Lesotho has no treaty with any great power and no military ambition; its strategy is to keep the US, China and the UK willing to buy its textiles and to keep the wider South African neighbourhood quiet. The 2025 tariff showed that one sector carrying most of the export economy can be cut by a decision in Washington, and the reply was an emergency rather than a new strategy. The test for 2026-2027 is whether AGOA access or a replacement market can come back fast enough to stop the state of disaster becoming a permanent dependence.
