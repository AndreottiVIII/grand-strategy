  reading: |
    Botswana's grand strategy is to turn diamond dependence into state control: a bigger stake in De Beers, a say over sales, and a budget that survives the slump, with Debswana carrying about 90% of national diamond sales. The lab-grown glut and the US tariff erode the value of that stake faster than negotiation can raise it, so Gaborone is reported to be settling for about 25% rather than the majority it wanted. South Africa is the partner it leans on (SACU, the rand, the ports); Namibia, Zimbabwe, the EU and the UK are not yet read from sources, and the card is thinner than its tier because the call budget ran out.
