  reading: |
    Nauru has a small economy, and its budget and its migration business come from Canberra; its one lever outside Australia is the seabed sponsorship, which waits on rules the International Seabed Authority has not written. The January 2024 switch from Taipei to Beijing shows that recognition is sold to whoever pays, but the December 2024 treaty capped the new patron by giving Australia a veto over security, banking and telecoms. Nauru therefore sells to several buyers while Canberra keeps the veto, and the Regional Processing Centre is at once its economy and its lever.
