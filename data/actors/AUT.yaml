  paradoxes:
    - text: "Neutrality buys no safety and costs a seat. Austria cannot join NATO or any mutual-defence pact, but it sits under the EU's Article 42(7) clause and buys its air shield from a German-led club; it therefore depends on the alliance it will not join for the protection it needs, while the party that promises to protect neutrality (FPÖ) would take it out of Sky Shield and so make the Bundesheer both weaker and costlier (estimated EUR 100m extra for leaving)."
