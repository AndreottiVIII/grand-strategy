      text: "Keep permanent neutrality as the working definition of national security while buying protection inside the EU's tent: no NATO, no mutual-assistance treaty, no foreign bases, but air defence bought jointly with Germany (European Sky Shield Initiative, a non-binding memorandum), a defence budget rising toward 2% of GDP by 2032 and a Bundesheer rebuilt under the 'Aufbauplan 2032+'. The Stocker coalition (ÖVP, SPÖ, NEOS, sworn in March 2025) kept Austria in Sky Shield after the FPÖ's first place in 2024 had put it in doubt."
