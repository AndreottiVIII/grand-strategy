    Austria is a middle-sized trading state that has made a security policy out of not having one, and the two things that held that bargain up - cheap Russian gas and a post-1989 buffer of friendly neighbours - are gone. The gas is gone by the company's own choice and the market's help (December 2024); the buffer is being rebuilt through the Slavkov format, the Magyar reset in Hungary, the Balkan enlargement file and a Germany that now agrees with Vienna on borders. Neutrality remains untouchable at 75% public support, so the Stocker government, squeezed by an FPÖ polling at 34-36%, does what the Cold War Austria did: it moves with the West in everything except the vocabulary (EU sanctions yes, weapons no; Sky Shield yes, NATO no; a 2% defence goal on paper and about 1.2% in the budget). The real strategic exposure is economic, not military: Germany for the market, the United States for the second-largest outlet, China for the deficit, and the Brenner for the lorries. The Russia file shows the paradox best: the espionage cases (Ott, the embassy antennas) are taken to court and the diplomats expelled, but Raiffeisen's Russian bank and its EUR 3.15bn claim keep one Austrian foot in Moscow. For the atlas, Austria is a partner of almost everyone and an ally of a few by treaty, and its grade toward each follows the structure (EU membership, trade, geography), not the declaration of neutrality.
