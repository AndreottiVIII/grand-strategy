  reading: |
    Eswatini is an absolute monarchy with no treaty partner to protect it, so it trades what it has: a recognition of Taiwan that Beijing would like to buy, and a place for deportees that Washington pays for in secret. Taipei is the patron the state has kept since 1968, and the United States is the new one, paying for a service no one else is offering. The weak point is that both bargains rest on others' airspace, courts and goodwill rather than on anything Eswatini controls.
