  reading: |
    Under President Hilda Heine, the Marshall Islands runs its foreign policy inside a treaty it cannot leave cheaply: the Compact pays for the state and carries its defence, and the 2023 extension bought twenty years, not a settlement of the nuclear grievance. Inside that frame it has three instruments it actually uses: the Taipei tie, one of three Pacific recognitions left; a flag registry, second largest in the world as of 2017, whose foreign-owned ships the United States said it would not defend at sea; and the visa-free right to live and work in America, which makes emigration a lever. The sea is the one constraint no treaty can renegotiate: the country averages seven feet above sea level, and a US$1 billion radar site at Kwajalein is on the list of what rising seas could threaten.
