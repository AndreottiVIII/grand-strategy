  reading: |
    Samia Suluhu Hassan's government has answered the 2025 election protests with the security forces and a tighter grip on the opposition, and has paid for it with the Western money that its own ports and railways need. It is building a transit state: Dar es Salaam takes the Uganda and DRC cargo, and the concessions to DP World and CCECC tie the infrastructure to Gulf and Chinese capital, which it can take in place of the aid. The test is whether that capital can replace the Western aid lost since 2025 without the price in legitimacy and in the East African trade that the same policy strains, and whether a regional military role is possible again once the SADC mission has gone.
