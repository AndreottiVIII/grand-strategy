    - text: "The regional military reach is short. SADC leaders ended the SAMIDRC mandate on 13 March 2025 and the phased withdrawal began on 29 April, with the Tanzanian contingent going home overland through Rwanda, which had to consent to the transit. Tanzania cannot keep a force in eastern DRC without a regional mandate and a neighbour's agreement."
