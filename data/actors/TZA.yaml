      text: "Hold power and close the 2025 protest wave. The electoral commission declared Samia Suluhu Hassan the winner with 97.66% on 1 November 2025, after the main opposition party Chadema was disqualified (12 April 2025) and its leader Tundu Lissu was charged with treason. Samia called the unrest an attempted coup and defended the security forces. Two claims on the dead, not one number: the opposition says about 2,000 (CNN, 5 Nov 2025), the UN and rights groups say hundreds (OPB, Dec 2025); the government has published no toll."
