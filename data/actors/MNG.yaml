grand_strategy:
  objectives:
    - rank: 1
      text: "Stay sovereign between two giants by spreading ties to third neighbours. The phrase is current: in Washington on 2 Aug 2023 PM Oyun-Erdene called the United States an 'important strategic third neighbor' and said that a landlocked Mongolia would suffer if great-power rivalry turned into a new Cold War. The same logic brings Japan, South Korea, the EU, India and Turkey into the picture, none of which can replace the two neighbours for trade or fuel."
