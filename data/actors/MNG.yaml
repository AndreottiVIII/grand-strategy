    - rank: 2
      text: "Turn the mining boom into state revenue without letting one buyer take it all: coal and copper go to China, the Ganqimaodu-Gashuunsukhait rail link (agreed 14 Feb 2025, track-laying from 1 Sep 2025, target 2027) is meant to lift coal exports from about 83 to 165 Mt a year, and the state holds 34% of Oyu Tolgoi while pressing Rio Tinto for more revenue and earlier dividends."
