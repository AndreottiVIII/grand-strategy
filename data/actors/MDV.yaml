  reading: |
    Male buys time with money, not force. The India Out campaign of 2023-24 ended in a debt-driven repair with New Delhi, which now lends the currency reserves and the credit lines, while China stays the largest bilateral creditor and the source of defence assistance and a trade deal in force since 2025. Tourism is the economy that pays for both, which makes the state hostage to the arrivals it must keep open, and the sea that threatens it is the argument for every climate loan it asks for. Its line is to be useful to every big lender at once; its paradox is that the campaign against Indian presence brought India's money back in.
