  reading: 'Hungary is a mid-sized state whose grand strategy for sixteen years was to extract rents from every patron at once - Russian gas and a Rosatom reactor, Chinese factories, Gulf and Azerbaijani deals, an American president''s goodwill
    - while using the EU veto as the currency of that bargaining. The April 2026 election replaced that model with its opposite, and the transition is the real story of the card: Magyar''s Hungary wants to be a normal member of NATO and the EU
    (money, trust, a V4 that talks to Poland again), yet it inherits every dependency the old model built. What has changed is the tone, the people and a dozen decisions already taken - the ICC exit reversed, Russian diplomats expelled, the veto
    on Ukraine''s clusters lifted, funds unlocked, Chinese plants inspected. What has not changed is the structure underneath: Russian crude and gas still arrive, Paks II is under review but not cancelled, the Serbian partnership and MOL''s NIS
    deal survive the change of leader, Fico remains Hungary''s closest ally in the region, the border fence stays, and the old minority grievances are only being handled differently. Luttwak''s logic bites hardest on the new government: every
    concession to Brussels spends a lever, every audit of an Orban-era deal risks the counterpart who keeps the lights on. The next tests are dated: the Council vote on funds (13 Oct), the US waiver (21 Nov), OFAC and NIS (30 Oct), and whether
    Netanyahu lands in Budapest on 23 Oct.'
