# Landmark General Assembly votes: the ones that become action rows (type un_vote) for
# every member, directed at the actors listed in `about`. Everything else in the UNGA
# dataset feeds only the voting-affinity figures. Symbols must exist in data/datasets/unga/.
landmarks:
  - symbol: A/RES/ES-11/1
    label: Aggression against Ukraine
    about: [UKR, RUS]
  - symbol: A/RES/ES-11/4
    label: Territorial integrity of Ukraine (annexations)
    about: [UKR, RUS]
  - symbol: A/RES/ES-11/5
    label: Remedy and reparation for aggression against Ukraine
    about: [UKR, RUS]
  - symbol: A/RES/ES-11/6
    label: Principles of a just and lasting peace in Ukraine
    about: [UKR, RUS]
  - symbol: A/RES/ES-11/7
    label: Advancing a comprehensive, just and lasting peace in Ukraine (third anniversary)
    about: [UKR, RUS]
  - symbol: A/RES/ES-11/10
    label: Support for lasting peace in Ukraine
    about: [UKR, RUS]
  - symbol: A/RES/ES-10/21
    label: Protection of civilians in Gaza (humanitarian truce)
    about: [ISR, PSE]
  - symbol: A/RES/ES-10/22
    label: Humanitarian ceasefire in Gaza
    about: [ISR, PSE]
  - symbol: A/RES/ES-10/24
    label: End Israel's unlawful presence in the Occupied Palestinian Territory
    about: [ISR, PSE]
  - symbol: A/RES/78/282
    label: International Day of Reflection and Commemoration of the 1995 Genocide in Srebrenica
    about: [BIH, SRB]
  - symbol: A/RES/81/1
    label: Participation of the State of Palestine in the General Assembly
    about: [PSE, ISR]
