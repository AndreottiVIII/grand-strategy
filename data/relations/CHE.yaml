    layer: action
    type: incident
    summary: "Direct arms supply and re-export of Swiss-origin weapons stay barred by the War Material Act and neutrality (Berset, Mar 2023); the National Council voted 98 to 96 for re-export conditional on a UN Security Council finding that Russia's war is illegal, and a committee bill to allow indirect exports is before parliament (status not confirmed)."
