  - to: RUS
    layer: action
    type: sanction
    summary: "Frozen Russian assets in Switzerland: about CHF 7.4bn of listed private persons and companies and CHF 7.45bn of the Russian central bank, roughly CHF 15bn in all (SECO report to March 2025)."
