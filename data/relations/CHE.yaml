  - to: RUS
    layer: action
    type: sanction
    summary: "On 19 Aug 2026 the Federal Council adopted the measures of the EU's 20th package (energy, trade, finance; first use of the anti-circumvention tool; ban on Russian crypto platforms), in force 20 Aug; earlier, on 22 May 2026, it listed 115 persons and entities and 46 vessels. About 2,790 persons and entities are under asset freezes."
