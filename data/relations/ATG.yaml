  # ---------- action ----------
  - to: USA
    layer: action
    type: incident
    summary: "Partial US visa and entry restrictions on Antigua and Barbuda nationals under Presidential Proclamation 10998 (December 2025), in effect from 1 January 2026 for new business, visitor and student visas and for immigrant visas, citing the citizenship-by-investment programme. Existing visas are largely unaffected; no lifting was reported in the latest coverage read."
    since: 2026-01-01
    until: null
    last_verified: 2026-10-16
    confidence: C
    note: "A US measure against Antigua's nationals, recorded as the event this row is about, not as an act of Antigua. Dominica is named in the same proclamation."
    sources:
      - {url: "https://antiguaobserver.com/?p=326422", title: "'New partial restrictions' re US visas for nationals of A&B now in effect", publisher: "Antigua Observer", date: 2026-01, tier: 3}
