  - to: USA
    layer: action
    type: agreement
    summary: "Mexico transferred 29 cartel figures to US custody on 27 Feb 2025 (NYT), and dozens more in January 2026 (NPR), presented by Sheinbaum as sovereign and autonomous cooperation, the means behind the cooperation objective above."
