  - to: ESP
    layer: action
    type: visit
    summary: "Sheinbaum welcomed King Felipe VI's acknowledgement of 'much abuse' during the conquest (Madrid, Mar 2026); the King visited her in Mexico City in June 2026, ending the rift opened by AMLO's 2019 demand for an apology and the 2024 inauguration snub. Mirror of the ESP visit row, read from the host side."
