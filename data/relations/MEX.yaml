    layer: action
    type: sanction
    summary: "Tariffs of up to 50% on cars, auto parts, textiles, plastics and steel from countries without a free-trade agreement, aimed first at China, approved by Congress in late 2025 and in force in 2026, covering more than 1,400 product categories. Recorded as 'sanction' because the vocabulary has no trade-measure type; a question for Davide (see JOURNAL)."
    since: 2026-01-01
    until: null
    last_verified: 2026-10-16
    confidence: B
