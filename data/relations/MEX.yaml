  - to: org-eu
    layer: action
    type: agreement
    summary: "The modernised Global Agreement and the interim Trade Agreement signed at the 8th EU-Mexico Summit in Mexico City on 22 May 2026. The trade pillar removes most high Mexican tariffs, including on EU agri-food, and protects EU geographical indications."
    since: 2026-05-22
    until: null
    last_verified: 2026-10-16
    confidence: B
    sources:
