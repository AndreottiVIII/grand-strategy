      - {url: "https://www.intellinews.com/turkey-confirms-it-expects-1-3-bcm-of-turkmen-gas-flows-by-end-2025-368749", title: "Turkey confirms it expects 1.3 bcm of Turkmen gas flows by end-2025", publisher: "bne IntelliNews", date: 2025, tier: 3}
  - to: AFG
    layer: dependency
    type: energy_export
    value: 101
    unit: km_tapi_pipeline_laid_in_herat_by_6_jul_2026
    summary: "The Afghan leg of TAPI, a gas pipeline to Pakistan and India, was under construction from September 2024; the Taliban Ministry of Mines and Petroleum reported 101 km of pipe laid in Herat by 6 July 2026 (self-reported). Turkmen officials expect the 130-km Herat segment by end-2026."
    since: 2024-09
    until: null
