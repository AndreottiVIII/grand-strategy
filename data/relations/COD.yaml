from: COD
relations:
  # ---------- objectives ----------
  - to: RWA
    layer: objective
    type: influence_goal
    summary: "Kinshasa wants the Rwandan Defence Force out of the Kivus and the Washington framework implemented: the withdrawal is the aim, not the end of the Rwandan state. Mirror of the RWA row, same sources."
    since: "2025-01"
    until: null
    last_verified: 2026-10-16
    confidence: B
    sources:
      - {url: "https://www.aljazeera.com/news/2025/7/18/un-experts-cast-blame-on-rwanda-and-uganda-what-are-they-doing-in-drc", title: "UN experts cast blame on Rwanda and Uganda. What are they doing in DRC?", publisher: "Al Jazeera", date: "2025-07-18", tier: 3}
      - {url: "https://peopledaily.digital/news/us-urges-rwanda-to-withdraw-troops-from-dr-congo-end-m23-support", title: "US urges Rwanda to withdraw troops from DR Congo, end M23 support", publisher: "People Daily (Kenya)", date: "2026-10-14", tier: 3}

  - to: nsa-m23
    layer: objective
    type: influence_goal
    summary: "Reverse the M23's control of Goma and Bukavu and end its military presence in the Kivus; the AFC's political leaders aim to topple the government in Kinshasa, which Kinshasa answers with a death sentence in absentia for its president (August 2025, Crisis Group). Mirror of the M23 reading, same sources."
    since: "2025-01"
    until: null
    last_verified: 2026-10-16
    confidence: B
    sources:
      - {url: "https://www.crisisgroup.org/africa/democratic-republic-congo-rwanda/320-m23-offensive-elusive-peace-great-lakes", title: "The M23 Offensive: Elusive Peace in the Great Lakes (Africa Report N°320)", publisher: "International Crisis Group", date: "2025-12-19", tier: 2}
      - {url: "https://www.thenewhumanitarian.org/analysis/2025/03/20/after-fall-goma-and-bukavu-where-dr-congos-m23-war-headed", title: "After the Fall of Goma and Bukavu, Where Is DR Congo's M23 War Headed?", publisher: "The New Humanitarian", date: "2025-03-20", tier: 3}

  # ---------- alignments ----------
  - to: RWA
    layer: alignment
    type: treaty
    summary: "The Washington peace agreement between the two foreign ministers (27 Jun 2025) and the Washington Accords signed by Tshisekedi and Kagame before Trump (4 Dec 2025), with an economic integration framework. A treaty of peace, not a defence pact; the row is the same instrument as the RWA row, mirrored."
    since: "2025-06-27"
    until: null
    last_verified: 2026-10-16
    confidence: B
    sources:
      - {url: "https://www.aljazeera.com/news/2025/8/2/drc-rwanda-agree-economic-framework-outline-as-part-of-peace-deal", title: "DRC, Rwanda agree economic framework outline as part of peace deal", publisher: "Al Jazeera", date: "2025-08-02", tier: 3}
      - {url: "https://allafrica.com/stories/202512040542.html", title: "Congo-Kinshasa: Rwanda's Kagame and Tshisekedi of the DRC sign peace deal", publisher: "AllAfrica", date: "2025-12-04", tier: 3}

  - to: BDI
    layer: alignment
    type: security_guarantee
    summary: "De facto military alignment: Burundian troops fight beside the FARDC in South Kivu against the M23 (Reuters, January 2025). No treaty or guarantee instrument was found; the type is our reading, confidence C. Mirror of the BDI row, same source."
    since: "2025-01"
    until: null
    last_verified: 2026-10-16
    confidence: C
    sources:
      - {url: "https://www.yahoo.com/news/m23-rebels-face-burundian-forces-173819912.html", title: "M23 rebels face Burundian forces", publisher: "Reuters (via Yahoo News)", date: "2025-01-31", tier: 3}

  # ---------- actions ----------
  - to: nsa-m23
    layer: action
    type: agreement
    summary: "Doha Framework for a Comprehensive Peace Agreement between the DRC and AFC/M23, signed 15 Nov 2025 (eight protocols still to negotiate); terms of reference for a ceasefire verification mechanism on 2 Feb 2026; the talks moved to Switzerland in 2026 and a roadmap was agreed in August 2026. Mirror of the QAT row, same sources."
    since: "2025-11-15"
    until: null
    last_verified: 2026-10-16
    confidence: A
    sources:
      - {url: "https://ewn.co.za/2025/11/15/m23-dr-congo-ink-fresh-roadmap-to-peace-in-doha", title: "M23, DR Congo ink fresh roadmap to peace in Doha", publisher: "EWN (South Africa)", date: "2025-11-15", tier: 3}
      - {url: "https://www.ungeneva.org/en/news-media/news/2026/02/115581/m23-rebels-un-sees-progress-talks-warns-violence-persists", title: "M23 rebels: UN sees progress in talks but warns violence persists", publisher: "UN Geneva (UNOG)", date: "2026-02-05", tier: 1}
      - {url: "https://newsonair.gov.in/dr-congo-govt-and-m23-rebel-group-agree-on-roadmap-for-peace-negotiations/", title: "DR Congo govt and M23 rebel group agree on roadmap for peace negotiations", publisher: "All India Radio (newsonair)", date: "2026-08", tier: 3}

  - to: UGA
    layer: action
    type: exercise
    summary: "Operation Shujaa, a joint UPDF-FARDC campaign against the ADF launched in November 2021 and accepted by Kinshasa; the Congolese government cooperates out of necessity. Mirror of the UGA row, same sources."
    since: "2021-11"
    until: null
    last_verified: 2026-10-16
    confidence: B
    sources:
      - {url: "https://www.monitor.co.ug/uganda/special-reports/gains-losses-as-operation-shujja-marks-2-years--4456670", title: "Gains, losses as Operation Shujaa marks 2 years", publisher: "Daily Monitor (Uganda)", date: "2023-11", tier: 3}

  - to: UGA
    layer: action
    type: incident
    summary: "A UN experts' report (July 2025) says Ugandan units expanded their presence in eastern DRC on their own initiative, forming a buffer that shielded the M23 from counter-attacks; Uganda denies backing the M23. Kinshasa's side of the dated fact, confidence C because the report is a leaked UN account as reported."
    since: "2025-07"
    until: null
    last_verified: 2026-10-16
    confidence: C
    sources:
      - {url: "https://www.aljazeera.com/news/2025/7/18/un-experts-cast-blame-on-rwanda-and-uganda-what-are-they-doing-in-drc", title: "UN experts cast blame on Rwanda and Uganda. What are they doing in DRC?", publisher: "Al Jazeera", date: "2025-07-18", tier: 3}

  - to: KEN
    layer: action
    type: agreement
    summary: "The EAC-SADC summit of February 2025 merged the Nairobi process (facilitated by former president Uhuru Kenyatta) with the Luanda process and asked for direct talks with the M23 under the merged track; Kenyatta complained that Nairobi had been sidelined. Mirror of the KEN row, same sources."
    since: "2025-02"
    until: null
    last_verified: 2026-10-16
    confidence: B
    sources:
      - {url: "https://peopledaily.digital/news/eac-sadc-summit-directs-resumption-of-direct-negotiations-with-drc-m23-rebels-under-merged-luanda-nairobi-process", title: "EAC-SADC Summit directs resumption of direct negotiations with DRC M23 rebels under merged Luanda/Nairobi process", publisher: "People Daily (Kenya)", date: "2025-02", tier: 3}
      - {url: "https://allafrica.com/stories/202502070033.html", title: "Kenyatta Defends 'Sidelined' Nairobi Peace Process, Urges Fresh Momentum", publisher: "AllAfrica", date: "2025-02-07", tier: 3}

  - to: AGO
    layer: action
    type: visit
    summary: "Tshisekedi made repeated visits to Luanda in early 2026 to revive Angola's role as a mediator; Lourenço announced on 11 February 2026 a ceasefire to start on 18 February, which the M23 disputed. Our reading of the visits, confidence B on the dated facts."
    since: "2026-02"
    until: null
    last_verified: 2026-10-16
    confidence: B
    sources:
      - {url: "https://www.verangola.net/va/en/022026/Politics/47711/Angola-proposes-a-ceasefire-between-the-DRC-government-and-M23-starting-on-February-18th.htm", title: "Angola proposes a ceasefire between the DRC government and M23 starting on February 18th", publisher: "Angola Press (VerAngola)", date: "2026-02", tier: 3}
      - {url: "https://www.securitycouncilreport.org/monthly-forecast/2026-03/democratic-republic-of-the-congo-33.php", title: "March 2026 Monthly Forecast: Democratic Republic of the Congo", publisher: "Security Council Report", date: "2026-03", tier: 2}

  - to: USA
    layer: action
    type: agreement
    summary: "The US-DRC strategic partnership signed in Washington on 4 December 2025: preferential access to critical minerals and US defence cooperation in return for security, alongside the Washington accord with Rwanda. Confidence C: the press and analysis were read, not the text."
    since: "2025-12-04"
    until: null
    last_verified: 2026-10-16
    confidence: C
    sources:
      - {url: "https://allafrica.com/stories/202512040542.html", title: "Congo-Kinshasa: Rwanda's Kagame and Tshisekedi of the DRC sign peace deal", publisher: "AllAfrica", date: "2025-12-04", tier: 3}
      - {url: "https://www.news24.com/world/analysis-why-minerals-for-security-deals-wont-save-the-drc-20260422-0613", title: "Analysis: why minerals-for-security deals won't save the DRC", publisher: "News24", date: "2026-04-22", tier: 3}

  # ---------- dependencies ----------
  - to: CHN
    layer: dependency
    type: investment
    value: 7
    unit: usd_bn_infrastructure
    summary: "The Sicomines contract of 2008 (Sinohydro, China Railway), renegotiated by the Tshisekedi government to USD 7bn of Chinese infrastructure (2024); Chinese companies (CMOC, Huayou and others) run most of the cobalt mining of a country that produces over 70% of the world's supply, most of it shipped to China. Mirror of the CHN row, same sources; the value is the renegotiated figure, not a share."
    since: "2008-04"
    until: null
    last_verified: 2026-10-16
    confidence: B
    sources:
      - {url: "https://eiti.org/blog-post/sicomines-how-eiti-drc-helped-secure-4-billion-additional-revenue", title: "Sicomines: how the EITI in DRC helped secure 4 billion in additional revenue", publisher: "Extractive Industries Transparency Initiative", date: "2024-03-25", tier: 2}
      - {url: "https://www.scmp.com/news/china/diplomacy/article/3145065/why-china-making-big-play-congolese-cobalt-and-other-critical", title: "Why China is making a big play for Congolese cobalt and other critical minerals", publisher: "South China Morning Post", date: "2021-08-15", tier: 3}

  - to: TZA
    layer: dependency
    type: trade_share
    value: 0.53
    unit: share_of_transit_tonnage
    summary: "DRC cargo through Dar es Salaam rose 30% to 7.77m tonnes in 2025/26, more than half of the port's 14.61m tonnes of transit traffic; the DRC depends on the Dar route as an alternative to the Mombasa and Rwandan routes. The share is our arithmetic on Tanzanian figures (confidence C). Mirror of the TZA row, same sources."
    since: "2025-07"
    until: null
    last_verified: 2026-10-16
    confidence: C
    sources:
      - {url: "https://www.monitor.co.ug/uganda/news/national/uganda-eyes-dar-es-salaam-as-second-route-to-sea-as-tanzania-expands-port-5622310", title: "Uganda eyes Dar es Salaam as second route to sea as Tanzania expands port", publisher: "Daily Monitor (Uganda)", date: "2026", tier: 3}
      - {url: "https://www.theeastafrican.co.ke/tea/business-tech/dar-heats-up-rivalry-with-mombasa-via-free-storage-offer-5213474", title: "Dar heats up rivalry with Mombasa via free storage offer", publisher: "The EastAfrican", date: "2026", tier: 3}
