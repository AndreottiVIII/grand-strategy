    type: influence_goal
    summary: "Amman wants to stop Israeli annexation of the West Bank (Abdullah's 'red line'; the Jordan Valley and Area C are the cases that matter), block any transfer of Palestinians to Jordan and keep the Hashemite custodianship of the holy sites in Jerusalem. Contingency planning reportedly includes nullifying the treaty, closing the King Hussein Bridge, deploying troops to the border and asking Washington to threaten basing rights."
