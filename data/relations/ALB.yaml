    type: influence_goal
    summary: "Rama and Vucic jointly ask for Serbia's and Albania's phased entry into the single market and Schengen without a vote, a commissioner or MEPs (FAZ, Feb 2026); the Commission and member states rejected the formula. For Tirana it is a way to get benefits of the Union ahead of full membership and to keep Serbia in the same lane."
