  - to: GRC
    layer: objective
    type: territorial_claim
    summary: "The Ionian maritime boundary is unresolved. The 2009 delimitation deal was annulled by Albania's Constitutional Court (2010); in Oct 2020 Dendias and Rama agreed to go to the ICJ, but no joint text exists and Greek diplomatic sources say delimitation is no longer an immediate priority (May 2026), contradicting Rama's claim at Delphi."
