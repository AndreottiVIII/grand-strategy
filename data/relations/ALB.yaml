  - to: org-eu
    layer: objective
    type: membership_goal
    summary: "All negotiating clusters opened by 2025 and the first three chapters (25, 26, 30) provisionally closed on 14 Jul 2026; the government aims to finish talks by end-2027 and join by 2030, which Commissioner Kos calls realistic if rule-of-law standards hold."
    since: 2014
    until: null
    last_verified: 2026-10-12
    confidence: A
    sources:
      - {url: "https://europeanwesternbalkans.com/2026/07/15/albania-closes-its-first-three-negotiating-chapters/", title: "Albania closes its first three negotiating chapters", publisher: "European Western Balkans", date: 2026-07-15, tier: 3}
