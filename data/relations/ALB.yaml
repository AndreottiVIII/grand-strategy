  - to: USA
    layer: objective
    type: influence_goal
    summary: "Tirana seeks a personal channel to the Trump administration - the Board of Peace founding seat without the USD 1bn fee (parliament voted 110 of 140 on 22 Jan 2026), Rama in Washington for the 19 Feb inaugural meeting, and the Kushner family's resort concession - against thin economic ties (10% tariff, exports to the US down about 30% in April 2025)."
