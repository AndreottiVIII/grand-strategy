  - to: USA
    layer: action
    type: sanction
    summary: "US reciprocal tariff of 24% on Brunei exports, announced on 3 April 2025 with a 10% universal tariff; raised to 25% in August 2025 (one table gives 21% for April, a conflict). The US Supreme Court voided the IEEPA-based reciprocal tariffs on 20 February 2026. Vocabulary note: a tariff is a trade measure, not a sanction; the type is borrowed because the ontology has no trade type."
    since: '2025-04-03'
    until: null
