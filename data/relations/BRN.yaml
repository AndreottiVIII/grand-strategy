    type: territorial_claim
    summary: "Limbang: Brunei's claim to the Limbang district of Sarawak, dormant since the 2009 exchange of letters. Malaysian press reported in March 2009 that Brunei had dropped it; Brunei denied this, saying the Limbang question was never discussed in the exchange of letters. Dormant, not withdrawn."
    since: '2009-03-16'
    until: null
    last_verified: '2026-10-12'
    confidence: C
    sources:
      - {url: "https://www.thestar.com.my/news/nation/2009/03/16/brunei-drops-claim-over-limbang-in-sarawak-update3/", title: "Brunei drops claim over Limbang in Sarawak", publisher: "The Star (Malaysia)", date: '2009-03-16', tier: 3}
