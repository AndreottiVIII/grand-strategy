  # ---------- action ----------
  - to: GBR
    layer: action
    type: sanction
    summary: "On 3 September 2026 Milei announced sanctions on the companies behind the Sea Lion oil project north of the Falklands (Navitas Petroleum, operator with 65%; Rockhopper; Eco Atlantic, which holds an adjacent licence) and a bill to toughen Law 26,659 of 2011, which bars unauthorised hydrocarbon activity on the claimed shelf for 5 to 20 years and can reach shareholders, directors and suppliers; the decree names the Foreign Ministry as enforcer and requires compliance declarations from firms seeking incentives or permits. By 8 September Argentina had opened proceedings against 60 people and companies (45 announced the week before, 15 added) and filed a criminal complaint against Navitas, its subsidiaries and directors; Halliburton, SLB and Baker Hughes said they will not work on Sea Lion. Phase 1 is planned at 50,000 barrels a day with first oil in 2028. London calls the activity legitimate under the islands' law. Record output of 916,200 b/d from Vaca Muerta in July 2026 is the leverage Milei threatened to use (exclusion of oil companies)."
    since: '2026-09-03'
    until: null
    last_verified: '2026-10-16'
    confidence: B
    sources:
