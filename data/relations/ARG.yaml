    layer: action
    type: incident
    summary: "The fisheries side of the claim. The Falklands fishery earned GBP 30.5m of licence fees in 2022 and accounts for over 60% of the islands' GDP (Eurofish, 2023; no 2025 figure found); the fisheries director issued individual transferable quotas in a resolution of 31 May 2022 for 25 years from 1 January 2023 (so to 2047), to companies flagged in Spain, South Korea, Vanuatu and the UK, which Argentine commentary calls illegal under Law 26,659. Taiwan-flagged squid fleets have not accepted British licensing since 2010. The ITQs are the economic anchor that makes the Sea Lion oil case a second front rather than the first."
