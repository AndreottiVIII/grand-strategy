from: UGA
relations:
  # ---------- objective ----------
  - to: COD
    layer: objective
    type: influence_goal
    summary: "Hold the eastern DRC frontier against the ADF through Operation Shujaa, a joint UPDF-FARDC campaign launched in November 2021. Research reads it also as protection of the Lake Albert oil area and of roads for Ugandan goods; that reading is an inference (C)."
    since: '2021-11'
    until: null
    last_verified: '2026-10-16'
    confidence: B
    sources:
      - {url: "https://www.monitor.co.ug/uganda/special-reports/gains-losses-as-operation-shujja-marks-2-years--4456670", title: "Gains, losses as Operation Shujaa marks 2 years", publisher: "Daily Monitor", date: "2023-11", tier: 3}
      - {url: "https://cic.nyu.edu/publications/uganda’s-operation-shujaa-democratic-republic-congo-fighting-adf-or-securing-economic", title: "Uganda's Operation Shujaa in the Democratic Republic of Congo: Fighting the ADF or Securing Economic Interests?", publisher: "NYU Center on International Cooperation", date: "2025", tier: 2}

  - to: SSD
    layer: objective
    type: regime_goal
    summary: "Kampala's account: the UPDF deployed in March 2025 to save Kiir and Juba. Keeping Kiir's government in power is the aim as we read it from that account (C)."
    since: '2025-03-11'
    until: null
    last_verified: '2026-10-16'
    confidence: C
    sources:
      - {url: "https://www.radiotamazuj.org/en/news/article/ugandas-army-chief-says-updf-has-deployed-to-save-kiir-juba", title: "Uganda's Army Chief says UPDF has deployed to save Kiir, Juba", publisher: "Radio Tamazuj", date: "2025-03", tier: 3}
      - {url: "https://www.aljazeera.com/amp/news/2025/3/11/uganda-deploys-troops-in-south-sudan-as-civil-war-fears-grow", title: "Uganda deploys troops in South Sudan as civil war fears grow", publisher: "Al Jazeera", date: "2025-03-11", tier: 3}

  # ---------- alignment ----------
  - to: SSD
    layer: alignment
    type: security_guarantee
    summary: "A military pact with Uganda, originally against the LRA: Ugandan special forces have been in Juba since March 2025, which Juba calls technical and support units under that pact. No formal guarantee instrument was found."
    since: '2025-03-11'
    until: null
    last_verified: '2026-10-16'
    confidence: C
    sources:
      - {url: "https://www.aljazeera.com/amp/news/2025/3/11/uganda-deploys-troops-in-south-sudan-as-civil-war-fears-grow", title: "Uganda deploys troops in South Sudan as civil war fears grow", publisher: "Al Jazeera", date: "2025-03-11", tier: 3}
