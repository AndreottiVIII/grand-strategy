  - to: COD
    layer: action
    type: incident
    summary: "A UN experts' report (leaked, July 2025) says Ugandan units expanded their presence in eastern DRC on their own initiative, forming a buffer that shielded M23 from counter-attacks. Uganda denies backing M23; the 2024 panel had reported active support by some officers."
    since: '2025-07'
    until: null
    last_verified: '2026-10-16'
    confidence: C
    sources:
