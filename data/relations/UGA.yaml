  - to: RWA
    layer: action
    type: visit
    summary: "Gen. Muhoozi, Uganda's Chief of Defence Forces, made a defence cooperation visit to Kigali from 25 July 2026 and met President Kagame; both sides framed it as security and bilateral cooperation. Relations had been broken by the 2019 border closure; military talks followed in 2025."
    since: '2026-07-25'
    until: null
    last_verified: '2026-10-16'
    confidence: C
    sources:
