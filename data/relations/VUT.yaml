  - to: AUS
    layer: action
    type: visit
    summary: "Prime Minister Jotham Napat's first official visit to Australia since taking office, on 29 June 2026, the day the revised Nakamal Agreement was signed in Canberra; Albanese called strengthening ties with Vanuatu central to the shared ambition."
    since: 2026-06-29
    until: null
    last_verified: 2026-10-12
    confidence: A
    sources:
      - {url: "https://www.pm.gov.au/media/visit-australia-prime-minister-vanuatu", title: "Visit to Australia by the Prime Minister of Vanuatu", publisher: "Australian Government, Prime Minister", date: 2026-06-27, tier: 1}
