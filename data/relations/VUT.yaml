      - {url: "https://www.mfa.gov.cn/eng/gjhdq_665435/2797_665439/3442_664940/3444_664944/202503/t20250321_11579644.html", title: "Special Envoy Qian Bo visits Vanuatu (PRC Ministry of Foreign Affairs)", publisher: "Ministry of Foreign Affairs of the PRC", date: 2025-03-21, tier: 1}
  - to: IDN
    layer: action
    type: incident
    summary: "At the 81st UN General Assembly, Jakarta used its right of reply on 28 September 2026 to reject as one-sided the criticism of West Papua by Vanuatu and Solomon Islands; Pacific leaders had asked for an unrestricted visit by the UN High Commissioner for Human Rights."
    since: 2026-09-28
    until: null
    last_verified: 2026-10-12
    confidence: B
    sources:
      - {url: "https://nit.com.au/29-09-2026/26695/pacific-states-urge-jakarta-to-allow-un-access-to-west-papua-at-new-york-general-assembly", title: "Pacific states urge Jakarta to allow UN access to West Papua at New York general assembly", publisher: "NIT", date: 2026-09-29, tier: 3}
