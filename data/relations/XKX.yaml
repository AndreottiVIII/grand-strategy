from: XKX
relations:
  # ---------- objective ----------
  - to: SRB
    layer: objective
    type: recognition_sought
    summary: Pristina seeks Serbia's recognition, or at least de facto acceptance of Kosovo's statehood, as the end of the EU-facilitated normalisation; Vucic says recognition 'will not happen'. Recognition tallies are contested.
    since: 2008-02-17
    until: null
    last_verified: 2026-10-12
    confidence: B
    claims:
      - by: XKX
        text: about 120 states recognise Kosovo, about 20 recognitions reconfirmed and 4 new (Osmani, Jan 2026)
        source: https://english.gazetatema.net/kosovo-region/president-osmani-says-kosovo-has-restored-20-recognitions-i343710
      - by: SRB
        text: 28 states have withdrawn recognition
        source: https://kossev.info/en/vucic-otkrio-imena-zemalja-koje-su-povukle-priznanje-kosova/
    sources:
      - {url: "https://www.tanjug.rs/english/politics/189590/vucic-no-one-should-hope-for-recognition-of-kosovo-by-serbia-that-will-not-happen/amp", title: "Vucic: no one should hope for recognition of Kosovo by Serbia, that will not happen", publisher: "Tanjug (state agency, official statement)", date: 2025-09-04, tier: 1}
      - {url: "https://www.securitycouncilreport.org/monthly-forecast/2026-10/kosovo-17.php", title: "Kosovo - October 2026 monthly forecast", publisher: "Security Council Report", date: 2026-10, tier: 2}
  - to: org-un
    layer: objective
    type: recognition_sought
    summary: Kosovo is not a member of the United Nations; a seat is blocked in the Security Council by Russia and China, which do not recognise it and back Serbia's territorial integrity. 110 UN members are cited by Wikipedia's index; Pristina counts about 120.
    since: 2008-02-17
    until: null
    last_verified: 2026-10-12
    confidence: A
    sources:
      - {url: "https://www.securitycouncilreport.org/monthly-forecast/2026-10/kosovo-17.php", title: "Kosovo - October 2026 monthly forecast (Council dynamics)", publisher: "Security Council Report", date: 2026-10, tier: 2}
  - to: org-eu
    layer: objective
    type: membership_goal
    summary: Membership application filed 15 Dec 2022; the European Parliament (17 Jun 2026) asks the Council to move toward candidate status once the criteria are met. Five EU members do not recognise Kosovo.
    since: 2022-12-15
    until: null
    last_verified: 2026-10-12
    confidence: A
    sources:
      - {url: "https://oeil.europarl.europa.eu/oeil/en/document-summary?id=1905961", title: "2025 Commission report on Kosovo - European Parliament resolution (procedure 2025/2252(INI))", publisher: "European Parliament", date: 2026-06-17, tier: 1}
