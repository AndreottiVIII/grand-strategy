    type: territorial_claim
    summary: "Bolivia seeks sovereign access to the Pacific Ocean from Chile. The ICJ found on 1 Oct 2018 (12 votes to 3) that Chile has no obligation to negotiate it; the claim itself is older and is not resolved in law."
    since: '2018-10-01'
    until: null
    last_verified: '2026-10-16'
    confidence: A
