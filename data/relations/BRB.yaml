  # ---------- objective ----------
  - to: org-imf
    layer: objective
    type: influence_goal
    summary: "Barbados pushes the IMF and the World Bank to reform climate and debt lending through the Bridgetown Initiative, first set out in 2022: emergency liquidity against debt crises, about US$1 trillion more multilateral lending, and guarantees to draw private capital. The search summary records 'debt pause clauses' in some loans as an effect; some proposals remain contested. Version 3.0 was launched later at the SIDS conference in Antigua and Barbuda."
    since: 2022
    until: null
    last_verified: 2026-10-16
    confidence: C
    sources:
      - {url: "https://philstar.com/headlines/climate-and-environment/2023/04/07/2257368/climate-hit-island-pushes-to-reshape-world-bank-imf", title: "Climate-hit island pushes to reshape World Bank, IMF", publisher: "Philstar (syndicated wire)", date: 2023-04-07, tier: 3}
      - {url: "https://dialogue.earth/en/climate-energy/367248-barbados-prime-minister-leads-push-to-transform-global-finance/", title: "Barbados prime minister leads push to transform global finance", publisher: "Dialogue Earth", date: 2023, tier: 3}

