    layer: action
    type: incident
    summary: "At the UN General Assembly in September 2025 Mottley voiced concern at the increased US naval deployment in the southern Caribbean and warned of accidental conflict; in October she called the situation 'extremely dangerous and untenable' and urged regional leaders to reject US strikes on alleged drug traffickers. The vocabulary has no statement type, so the speech is logged as an incident."
    since: 2025-09
    until: null
    last_verified: 2026-10-16
    confidence: C
    sources:
