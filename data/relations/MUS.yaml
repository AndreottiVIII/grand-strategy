from: MUS
relations:
  # ---------- objective ----------
  - to: sub-chagos
    layer: objective
    type: territorial_claim
    summary: "Mauritius claims the Chagos Archipelago, Diego Garcia included. The treaty of 22 May 2025 would transfer sovereignty to Mauritius with a 99-year lease of the base back to the UK; ratification stalled in 2026."
    since: 2025-05-22
    until: null
    last_verified: 2026-10-16
    confidence: B
    sources:
      - {url: "https://www.chathamhouse.org/2026/01/uk-ratification-chagos-archipelago-treaty-will-not-violate-international-law", title: "UK ratification of the Chagos Archipelago treaty will not violate international law", publisher: "Chatham House", date: 2026-01, tier: 2}
      - {url: "https://www.e-ir.info/2026/02/02/opinion-will-the-chagos-deal-survive/", title: "Opinion - Will the Chagos Deal Survive?", publisher: "E-International Relations", date: 2026-02-02, tier: 3}

  # ---------- alignment ----------
  - to: CHN
    layer: alignment
    type: recognition
    summary: "Mauritius recognises the People's Republic of China; the joint communique establishing diplomatic relations is dated 15 April 1972."
    since: 1972-04-15
    until: null
    last_verified: 2026-10-16
    confidence: B
    sources:
      - {url: "https://lawinfochina.com/display.aspx?id=7505&lib=tax&SearchKeyword=&SearchCKeyword=", title: "Joint Communique on the Establishment of Diplomatic Relations between the People's Republic of China and Mauritius", publisher: "LawInfoChina (text of the joint communique)", date: 1972-04-15, tier: 1}

  - to: CHN
    layer: alignment
    type: treaty
    summary: "Free trade agreement signed in Beijing in October 2019, in force 1 January 2021: duty-free access to 7,504 tariff lines at entry into force, 723 more lines phased out over five to seven years, and a 50,000-tonne sugar quota phased in over eight years. Sources disagree on the product counts (one gives 8,227 lines, 96% of Chinese tariff lines); the figure in the sources read is kept."
    since: 2021-01-01
    until: null
    last_verified: 2026-10-16
    confidence: B
    sources:
      - {url: "https://www.mauritiustrade.mu/en/trade-agreements/china", title: "Mauritius - China FTA", publisher: "Government of Mauritius (trade portal)", date: 2021-01, tier: 1}
      - {url: "https://www.mcci.org/en/media-news-events/business-updates/the-mauritius-china-fta-has-come-into-force-on-01-january-2021/", title: "The Mauritius-China FTA has come into force on 01 January 2021", publisher: "Mauritius Chamber of Commerce and Industry", date: 2021-01, tier: 3}

  # ---------- dependency ----------
  - to: CHN
    layer: dependency
    type: debt
    summary: "China Eximbank preferential buyer's credit of US$73,687,000 for the Safe City surveillance system, signed in April 2018 with Mauritius Telecom: 2% interest, 20-year maturity, 7-year grace, backed by a sovereign guarantee. Opposition MPs questioned the project in March 2025. This is the only Chinese loan figure read in this flash card; no debt-to-GDP share was sourced."
    value: 73.687
    unit: usd_millions_loan
    since: 2018-04
    until: null
    last_verified: 2026-10-16
    confidence: B
    sources:
      - {url: "https://china.aiddata.org/projects/55627", title: "Safe City project record: China Eximbank buyer's credit to Mauritius (AidData)", publisher: "AidData (William & Mary)", date: 2018-04, tier: 2}
      - {url: "https://fr.allafrica.com/stories/202503190228.html", title: "Mauritius: Safe City - a multi-billion project under fire", title_original: "Ile Maurice: Safe City - Un projet à plusieurs milliards sous le feu des critiques", lang: fr, publisher: "AllAfrica", date: 2025-03-19, tier: 3}

  # ---------- action ----------
  - to: GBR
    layer: action
    type: agreement
    summary: "Chagos treaty signed 22 May 2025: sovereignty over the Chagos Archipelago to Mauritius, a 99-year lease of Diego Garcia to the UK, and continued long-term operation of the UK-US base. Not ratified."
    since: 2025-05-22
    until: null
    last_verified: 2026-10-29
    confidence: B
    sources:
      - {url: "https://www.e-ir.info/2026/02/02/opinion-will-the-chagos-deal-survive/", title: "Opinion - Will the Chagos Deal Survive?", publisher: "E-International Relations", date: 2026-02-02, tier: 3}
