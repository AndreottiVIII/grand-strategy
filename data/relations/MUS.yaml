  - to: IND
    layer: action
    type: agreement
    summary: "State visit of Prime Minister Modi to Mauritius, 11-12 March 2025: ties upgraded to an 'enhanced strategic partnership', with a joint vision and eight agreements (maritime security and trade in local currencies among them). The eight agreements are reported, not read in full."
    since: 2025-03-12
    until: null
