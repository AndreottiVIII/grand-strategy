  - to: CHN
    layer: action
    type: incident
    summary: "Mauritius revoked overflight approval for Taiwan's president Lai's aircraft in April 2026, cancelling his planned Eswatini trip. The Taiwanese Presidential Office says China pressed Mauritius, Seychelles and Madagascar; no Mauritian or Chinese statement was read."
    since: 2026-04
    until: null
