      - {url: "https://aa.com.tr/en/world/uk-delays-debate-on-chagos-deal-after-trump-backlash-reports/3809359", title: "UK delays debate on Chagos deal after Trump backlash", publisher: "Anadolu Agency", date: 2026, tier: 3}

