  # ---------- objective ----------
  - to: SRB
    layer: objective
    type: influence_goal
    summary: Zagreb makes Serbia's EU path conditional on the war legacy - above all the 1,725 people still missing from 1991-95 (fate of 1,341 unknown) and access to Serbian archives - and refuses Vucic a stage in Croatia. Serbia says Zagreb does not cooperate on its own missing from Operation Storm.
    since: 1995
    until: null
    last_verified: 2026-10-12
    confidence: B
    claims:
      - by: HRV
        text: Serbia is not cooperating on the missing; its archives hold the data; Serbia cannot finish EU accession until the war-legacy issues are resolved (Veterans' Minister Medved)
        source: https://n1info.rs/english/news/croatian-minister-search-for-missing-a-priority-despite-lack-of-cooperation-from-serbia/
      - by: SRB
        text: Zagreb is not cooperating in the search for and identification of Serbian missing and victims of Operation Storm (Odalovic, August 2026)
        source: https://www.kosovo-online.com/en/news/society/odalovic-serbian-victims-do-not-exist-pristina-and-zagreb-28-8-2026
    sources:
      - {url: "https://n1info.rs/english/news/croatian-minister-search-for-missing-a-priority-despite-lack-of-cooperation-from-serbia/", title: "Croatian minister: Search for missing a priority despite lack of cooperation from Serbia", publisher: "N1", date: 2026, tier: 3}
      - {url: "https://www.kosovo-online.com/en/news/society/odalovic-serbian-victims-do-not-exist-pristina-and-zagreb-28-8-2026", title: "Odalovic: Serbian victims do not exist for Pristina and Zagreb", publisher: "Kosovo Online", date: 2026-08-28, tier: 3}
