  - to: SVN
    layer: objective
    type: territorial_claim
    summary: The Piran Bay and land border are unsettled. The 2017 arbitration award gave Slovenia most of the bay and a junction to the high seas; Croatia withdrew from the process in 2015 and does not implement the award. In 2023 the two prime ministers agreed to keep the dispute out of daily politics.
    since: 2015
    until: null
    last_verified: 2026-10-12
    confidence: A
    claims:
      - by: SVN
        text: the arbitration award is binding on both states (Slovenia's National Assembly accepted it)
        source: https://vlada.gov.hr/traditionally-good-and-friendly-relations-between-croatia-and-slovenia-the-border-dispute-takes-time-to-resolve/42330
      - by: HRV
        text: the proceedings were contaminated and the award null; the Sabor rejected it entirely (Plenkovic, July 2023)
        source: https://vlada.gov.hr/traditionally-good-and-friendly-relations-between-croatia-and-slovenia-the-border-dispute-takes-time-to-resolve/42330
    sources:
      - {url: "https://english.sta.si/2404120/slovenia-gets-bulk-of-piran-bay-junction-access-to-high-seas", title: "Slovenia gets bulk of Piran Bay, 'junction' access to high seas", publisher: "Slovenian Press Agency (STA)", date: 2017-06-29, tier: 3}
