  - to: TCD
    layer: action
    type: agreement
    summary: "The UPC and 3R accord, signed on 19 April 2025 in N'Djamena and brokered by Chadian President Mahamat Idriss Deby: the two groups disbanded their political and military wings, fit fighters are to join the national army (FACA), and the rest enter community reintegration, at five cantonment sites."
    since: '2025-04-19'
    until: null
    last_verified: '2026-10-16'
    confidence: C
