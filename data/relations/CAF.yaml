  - to: RWA
    layer: alignment
    type: security_guarantee
    summary: "Mirror of the RWA card's row: a bilateral Rwandan force operates in the Central African Republic outside MINUSCA, under an agreement between the two presidents, protecting the Touadera government. The Bangui side of the guarantee."
    since: '2020'
    until: null
    last_verified: '2026-10-16'
    confidence: C
    note: "Mirrored from data/relations/RWA.yaml (to: CAF, same sources, same date and grade), written from the CAF side as the receiving government. The RWA card is the source of record; this row is provisional until the reverse pass confirms it."
    sources:
