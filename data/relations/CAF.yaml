from: CAF
relations:
  # ---------- alignment ----------
  - to: RUS
    layer: alignment
    type: security_guarantee
    summary: "Russian military advisers have guarded the regime since 2018, widely believed to be Wagner; Africa Corps was to succeed Wagner in 2026 under a security deal Touadera finalised in Moscow in March 2026. No treaty text was found."
    since: '2018-03'
    until: null
    last_verified: '2026-10-16'
    confidence: C
    note: "The type is our reading of a stable de facto security alignment. The Africa Corps date rests on one outlet's report of the March 2026 visit and is not confirmed; the USD 15m a month figure is single-source and not used."
    sources:
      - {url: "https://en.wikipedia.org/wiki/Foreign_relations_of_the_Central_African_Republic", title: "Foreign relations of the Central African Republic", publisher: "Wikipedia (index only)", date: "2026-10-16", tier: 4}
