    type: incident
    summary: "Mali's junta holds 46 Ivorian soldiers arrested in 2022 (three women freed in September 2022). A Bamako court gave them 20-year terms in late December 2022; a pardon followed in early January 2023, and they reached Abidjan that month. Abidjan calls them a backup force for MINUSMA; Bamako calls them mercenaries."
    since: '2022-07'
    until: '2023-01'
    last_verified: '2026-10-16'
    confidence: C
    sources:
