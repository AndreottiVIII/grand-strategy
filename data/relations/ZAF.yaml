  # ---------- action: the ICJ case ----------
  - to: org-icj
    layer: action
    type: incident
    summary: "South Africa v. Israel (case 192): the application under the Genocide Convention was filed on 29 December 2023; Palestine filed a declaration of intervention on 3 June 2024; Nicaragua withdrew (April 2025) and Colombia withdrew its declaration (22 September 2026); the case is in the written phase. Dates as in the PSE and ISR rows."
    since: 2023-12-29
    until: null
    last_verified: 2026-10-16
    confidence: B
    sources:
      - {url: "https://www.icj-cij.org/case/192", title: "South Africa v. Israel: Application of the Genocide Convention in the Gaza Strip (case page)", publisher: "International Court of Justice", date: 2026-09-22, tier: 1}

  - to: ISR
    layer: action
    type: incident
    summary: "The ICJ calendar: Israel filed its counter-memorial in March 2026, objecting to the Court's jurisdiction; by an order of 21 May 2026 the Court set South Africa's reply for 22 November 2027 and Israel's rejoinder for 22 May 2029, so the case outlasts the present government; the 2024 provisional orders remain in force."
    since: 2026-03
    until: null
    last_verified: 2026-10-29
    confidence: B
    sources:
      - {url: "https://www.gov.za/news/media-statements/presidency-notes-icj-order-south-africa-and-israel-case-02-jun-2026", title: "Presidency notes ICJ Order on South Africa and Israel case", publisher: "Government of South Africa (Presidency)", date: 2026-06-02, tier: 1}
      - {url: "https://ewn.co.za/2026/06/03/icj-sets-new-deadlines-for-sa-israel-genocide-case", title: "ICJ sets new deadlines for SA-Israel genocide case", publisher: "Eyewitness News", date: 2026-06-03, tier: 3}

  - to: EGY
    layer: action
    type: agreement
    summary: "Egypt announced on 12 May 2024 that it would back South Africa's genocide case by intervening at the ICJ. Whether the intervention was actually filed is not confirmed in the sources read; the ICJ case page was not checked for it."
    since: 2024-05-12
    until: null
    last_verified: 2026-10-16
    confidence: C
    sources:
      - {url: "https://www.news24.com/world/egypt-says-it-will-support-south-africas-icj-genocide-case-against-israel-20240512", title: "Egypt says it will support South Africa's ICJ genocide case against Israel", publisher: "News24", date: 2024-05-12, tier: 3}
      - {url: "https://www.newarab.com/news/egypt-joins-south-africa-israel-genocide-case-icj", title: "Egypt joins South Africa in Israel genocide case at the ICJ", publisher: "The New Arab", date: 2024-05, tier: 3}

  # ---------- action: the United States ----------
  - to: USA
    layer: action
    type: expulsion
    summary: "Secretary of State Rubio declared Ambassador Ebrahim Rasool persona non grata on 14 March 2025 after remarks at a Johannesburg think-tank webinar, and he had to leave by 21 March. Pretoria called the expulsion regrettable and asked for diplomatic decorum. A US act, recorded on Pretoria's side of the pair."
    since: 2025-03-14
    until: 2025-03-21
    last_verified: 2026-10-16
    confidence: B
    sources:
      - {url: "https://allafrica.com/stories/202503150001.html", title: "South Africa's Ambassador to U.S. 'Persona Non Grata' - U.S. Secretary of State Marco Rubio", publisher: "AllAfrica", date: 2025-03-15, tier: 3}
      - {url: "https://thecitizen.co.tz/tanzania/news/africa/us-declares-south-africa-s-ambassador-persona-non-grata-4965556", title: "US declares South Africa's ambassador persona non grata", publisher: "The Citizen (Tanzania)", date: 2025-03, tier: 3}

  - to: USA
    layer: action
    type: incident
    summary: "The G20 boycott: the US stayed away from the Johannesburg summit of 22-23 November 2025, the White House calling South Africa's handling of the presidency an 'instrumentalisation'; Pretoria refused to hand the presidency to a low-ranking US chargé and passed it at DIRCO to an embassy official, which Trump said was a refusal; on 26 November 2025 Trump wrote that South Africa would not receive an invitation to the 2026 G20 in Miami."
    since: 2025-11-22
    until: null
    last_verified: 2026-10-29
    confidence: B
    sources:
