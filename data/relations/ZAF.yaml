  - to: RUS
    layer: action
    type: incident
    summary: "The Lady R affair: the US said weapons and ammunition were loaded for Russia at Simon's Town on 6-8 December 2022; Pretoria denied the account, asked for the intelligence, and opened a judicial inquiry in May 2023. Outcome: see the row of 3 September 2023 (the panel found no evidence of weapons loaded)."
