      - {url: "https://businessreport.co.za/business/economy/2026-02-04-agoa-extension-signed-into-law-but-south-africa-remains-on-the-tariff-frontline", title: "AGOA extension signed into law but South Africa remains on the tariff frontline", publisher: "Business Report", date: 2026-02-04, tier: 3}

  - to: USA
    layer: action
    type: incident
    summary: "Trump threatened in July 2025, as the Rio BRICS summit met, an extra 10% tariff on countries aligning with BRICS's 'anti-American policies'; Pretoria answered that it is not anti-American and still awaited formal word on a trade deal, and the rand slipped (about 1% in one report). A threat, not an applied measure."
    since: 2025-07
    until: 2025-07
    last_verified: 2026-10-16
    confidence: C
    sources:
      - {url: "https://www.yahoo.com/news/south-africa-says-not-anti-090626077.html", title: "South Africa says it is not anti-American after Trump's BRICS tariff threat", publisher: "Reuters (via Yahoo News)", date: 2025-07, tier: 3}
      - {url: "https://newscentraltv.com/?p=347416", title: "Rand dips 1% after Trump BRICS tariff threat", publisher: "News Central TV", date: 2025-07, tier: 3}

  - to: USA
    layer: dependency
    type: trade_share
    value: 0.071
    unit: share_of_exports_2025
    summary: "The US took 7.1% of South African exports in 2025, down from 7.7% in 2024 and 7.9% in 2010, and fell from second to third place as a destination; vehicles and transport equipment were hit hardest by the 25% tariff of April 2025 and the 30% reciprocal tariff of August 2025. BNP Paribas gives 7.5% for a later 2025 window (vehicles 22% of exports to the US in 2024, farm goods 7%); the SARB figure is used (official basis wins)."
    since: '2025'
    until: null
