  - to: NGA
    layer: objective
    type: influence_goal
    summary: "Pretoria's claim to lead Africa is contested by Nigeria; SAIIA (2025) argues South Africa now co-claims the standing through its G20 seat and its ICJ case, and the 2012 AU Commission contest was the rivalry's clearest test."
