      - {url: "https://www.whitehouse.gov/presidential-actions/2025/02/addressing-egregious-actions-of-the-republic-of-south-africa/", title: "Addressing egregious actions of the Republic of South Africa (Executive Order 14204)", publisher: "The White House", date: 2025-02-07, tier: 1}

  - to: USA
    layer: action
    type: agreement
    summary: "AGOA was reauthorised and signed on 3 February 2026, retroactive to the 30 September 2025 lapse and running only to 31 December 2026; South Africa remains eligible, and the trade ministry says it is negotiating an Agreement on Reciprocal Tariffs to cut the 30% rate. Under AGOA vehicles pay 0% against 2.5% at MFN, but an Absa economist says that with the reciprocal tariffs AGOA is no longer a major advantage."
