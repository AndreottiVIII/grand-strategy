  - to: USA
    layer: action
    type: incident
    summary: "The Afrikaner refugee order: Executive Order 14204 of 7 February 2025 turned US refugee policy toward Afrikaners; the US admitted nearly 4,500 South African refugees from October 2025 to April 2026 against three from everywhere else (CBC), and the 2026 refugee ceiling was set at 7,500, mostly for white South Africans (Guardian, 30 October 2025). Pretoria rejects the persecution claim."
