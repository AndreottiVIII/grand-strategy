    layer: action
    type: visit
    summary: "Zelensky's first visit to South Africa, in 2025 (the page gives only 'Thursday'; cut short after a deadly strike on Kyiv): Ramaphosa welcomed Ukraine's acceptance of an unconditional ceasefire, urged talks without preconditions on the model of South Africa's own transition, and said he had spoken to Putin and Trump; Zelensky handed over a list of 400 Ukrainian children said to be held in Russia. No agreement was signed."
