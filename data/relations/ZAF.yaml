  - to: USA
    layer: objective
    type: influence_goal
    summary: "Win back US market access after the 2025 break: AGOA lapsed on 30 September 2025 and was renewed only to the end of 2026 (signed 3 February 2026, applied back to the lapse), while the 30% tariff of 7 August 2025 still applies. Pretoria negotiates for relief."
