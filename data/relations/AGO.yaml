    layer: action
    type: visit
    summary: "Montenegro made official visits to Luanda in July 2024 and November 2025 (the second before the EU-African Union summit), and Lourenco pledged Angola's support for Portugal's Security Council bid. Same sources as the PRT card; not re-researched."
