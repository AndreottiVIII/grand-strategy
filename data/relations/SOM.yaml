  # ---------------------------------------------------------------- objectives
  - to: sub-somaliland
    layer: objective
    type: territorial_claim
    summary: "Mogadishu treats Somaliland as an integral part of Somalia and has not controlled it since the 1991 declaration of independence; the claim is backed by the AU line, the OIC, China, Turkey, Saudi Arabia, Egypt and Djibouti and by a joint statement of 21 states against Israel's recognition."
    since: 1991-05
    until: null
    last_verified: 2026-10-12
    confidence: B
    sources:
      - {url: "https://www.mfa.gov.cn/mfa_eng/wjbzhd/202601/t20260112_11811365.html", title: "Readout of Wang Yi's call with the Somali foreign minister of 12 January 2026 (Somaliland an inalienable part of Somalia)", publisher: "Ministry of Foreign Affairs of the PRC", date: 2026-01-12, tier: 1}
