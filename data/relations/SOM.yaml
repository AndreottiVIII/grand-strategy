    layer: alignment
    type: treaty
    summary: "Defence and economic cooperation agreement of February 2024 (terms undisclosed; sources differ on the date) and a hydrocarbon framework of March 2024. Turkey trains the army at TURKSOM, supplies drones and helicopters and runs Mogadishu's port and airport; the press itself speaks of the Somalia-Turkey alliance."
