  - to: sub-jubaland
    layer: objective
    type: influence_goal
    summary: "Replace Jubaland's hold on Gedo with a federal-aligned administration: a parallel Jubaland administration in Gedo (a 45-day plan of October 2025) that Ethiopia opposed as a direct threat to its security. Jubaland rejected the March 2026 constitutional amendments and by 10 Oct 2026 held Balad Hawo, Dolow, Luuq and El Wak; federal-aligned forces held Bardere and Garbaharey."
