  - to: ETH
    layer: objective
    type: influence_goal
    summary: "Hold Ethiopia to the Ankara Declaration (sea access only under Somali sovereign authority), keep its 2,500 troops inside AUSSOM and avoid a war. On 5 Oct 2026, a day after El Alamein, Hassan Sheikh congratulated Abiy and said Somalia does not object to Ethiopian Red Sea access through Somali territory if it is negotiated officially. The MoU with Somaliland has never been withdrawn."
    since: 2024-12-11
    until: null
    last_verified: 2026-10-12
    confidence: B
    sources:
