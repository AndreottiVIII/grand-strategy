  - to: nsa-al-shabaab
    layer: objective
    type: regime_goal
    summary: "Destroy al-Shabaab as an armed and governing force, with other people's troops, drones and air strikes. The group's 2025 offensive in Hiran and Middle Shabelle reversed most of the 2022-23 government gains; allied and federal forces claimed at least 54 militants killed in strikes in April 2026 (the ministry's unverified count)."
    since: 2006
    until: null
    last_verified: 2026-10-16
    confidence: B
    sources:
