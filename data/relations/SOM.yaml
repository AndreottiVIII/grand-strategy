      - {url: "https://www.dawan.africa/news/somali-forces-partners-kill-54-al-shabaab-militants-in-airstrikes", title: "Somali forces, partners kill 54 al-Shabaab militants in airstrikes", publisher: "Dawan Africa", date: 2026-04, tier: 3}

  - to: USA
    layer: objective
    type: influence_goal
    summary: "Keep Washington engaged. Hassan Sheikh's letter to President Trump (reported 28 Mar 2025) offered exclusive use of the Balidogle and Berbera air bases and the Berbera and Bosaso ports, to keep outside rivals out of the corridor; Berbera lies in Somaliland, whose foreign minister said Washington would deal with Hargeisa. No acceptance was found."
    since: 2025-03-28
    until: null
    last_verified: 2026-10-16
    confidence: B
    sources:
      - {url: "https://www.yahoo.com/news/somalia-offers-us-exclusive-control-195104782.html", title: "Somalia offers US exclusive control of air bases, ports", publisher: "Reuters (via Yahoo News)", date: 2025-03-28, tier: 3}
