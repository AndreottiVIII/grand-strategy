  - to: sub-somaliland
    layer: objective
    type: recognition_denied
    summary: "Mogadishu is working to stop and reverse third-state recognition of Somaliland: it called Israel's recognition of 26 Dec 2025 'state aggression', demanded its withdrawal and took the case to the OIC, the AU and the Security Council; Djibouti closed Somaliland's liaison office; a new Taiwan-Somaliland office opened in June 2026 and draws Beijing's warnings. Washington has discussed a naval-base-for-recognition swap and has not recognised."
    since: 2025-12-26
    until: null
    last_verified: 2026-10-12
    confidence: B
    sources:
