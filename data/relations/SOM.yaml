  - to: sub-puntland
    layer: objective
    type: influence_goal
    summary: "Bring Puntland back under the federal constitutional order after it withdrew its recognition of the federal government in March-April 2024. Mogadishu's levers are the amended constitution and the electoral law and mediated talks (Halane in May 2026, Turkish-brokered talks of 7-8 Jul 2026), none of which has produced an agreement: Puntland sent no delegates in July and questioned Ankara's neutrality."
