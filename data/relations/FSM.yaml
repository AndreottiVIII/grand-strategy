  # ---------- action ----------
  - to: org-un
    layer: action
    type: un_vote
    summary: "The FSM was one of ten states that voted against the General Assembly endorsement of the New York Declaration on the two-state solution, on 12 September 2025: 142 in favour, 12 abstentions. The other states against were Israel, the US, Argentina, Hungary, Nauru, Palau, Papua New Guinea, Paraguay and Tonga. Mirrored from the Palestine card's row, same UN News record."
    since: 2025-09-12
    until: null
    last_verified: 2026-10-16
    confidence: A
    sources:
      - {url: "https://news.un.org/en/story/2025/09/1165835", title: "General Assembly endorses New York Declaration on two-State solution (142 in favour, 10 against, 12 abstentions)", publisher: "UN News", date: 2025-09-12, tier: 1}
