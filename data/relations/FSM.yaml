    type: treaty
    summary: "Compact of Free Association with the United States, renewed and funded in 2024: US$3.3 billion to the FSM over 20 years, through 2043 (Interior Department). The row carries the economic package; the vocabulary has no aid type, so the money is logged under the treaty, as the Tonga card logs relief. The original 1986 entry into force is not read in this pass; since is the renewal year. The defence and visa terms are not written: no source for them was read."
    since: 2024
    until: null
    last_verified: 2026-10-16
    confidence: B
