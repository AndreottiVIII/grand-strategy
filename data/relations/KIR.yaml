  - to: CHN
    layer: action
    type: incident
    summary: "From early 2024 uniformed Chinese police worked with Kiribati police on community policing, training and a crime database, up to a dozen at a time on six-month rotations. The Chinese embassy confirmed the presence but said no police station had been set up; the US warned that importing PRC security forces risks regional tension."
    since: 2024
    until: null
    last_verified: 2026-10-16
    confidence: C
    sources:
      - {url: "https://www.rnz.co.nz/news/world/510310/us-cautions-after-hawaii-neighbour-kiribati-gets-chinese-police", title: "US cautions after Hawaii neighbour Kiribati gets Chinese police", publisher: "RNZ", date: 2024, tier: 3}

  - to: AUS
    layer: action
    type: incident
    summary: "Police talks with Australia were shelved at Kiribati's behest, the president wanting to wait until a new government was elected in 2024. Australia's Pacific minister argued that China should have 'no role' in Pacific policing."
    since: 2024
    until: null
    last_verified: 2026-10-16
    confidence: C
    sources:
      - {url: "https://rnz.co.nz/international/pacific-news/521858/australia-s-ongoing-struggles-with-kiribati", title: "Australia's ongoing struggles with Kiribati", publisher: "RNZ", date: 2024, tier: 3}

  - to: NZL
    layer: action
    type: incident
    summary: "New Zealand cancelled a visit to Kiribati because Winston Peters specifically wanted to meet President Maamau; RNZ headlines the episode as a snub of Peters, defended by a Kiribati MP."
    since: 2025
    until: null
    last_verified: 2026-10-16
    confidence: C
