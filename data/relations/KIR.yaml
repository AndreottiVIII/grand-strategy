  # ---------- objective ----------
  - to: CHN
    layer: objective
    type: influence_goal
    summary: "Maamau's government seeks Chinese security and aid partnership after the 2019 switch: a naval hospital ship at Tarawa (2023) and uniformed Chinese police working with Kiribati police from early 2024. This is read from the actions below, not a stated goal."
    since: 2019-09-27
    until: null
    last_verified: 2026-10-16
    confidence: C
    sources:
      - {url: "https://www.rnz.co.nz/news/world/510310/us-cautions-after-hawaii-neighbour-kiribati-gets-chinese-police", title: "US cautions after Hawaii neighbour Kiribati gets Chinese police", publisher: "RNZ", date: 2024, tier: 3}
