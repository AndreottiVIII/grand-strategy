    summary: "China is the largest bilateral creditor. Loans and state guarantees under the 2013-2018 government were estimated at USD 1.4-3.1bn (ORF; the low end is used as the value). Relief agreed in January 2024, bilateral arrangement finalised in October 2025, terms not public."
