    type: debt
    summary: "India's currency swaps: USD 400m and INR 30bn (October 2024, USD 760m in total). The INR 30bn drawdown was renewed in April 2026 after the previous one expired on 23 April 2026. The Maldives repaid the USD 400m facility before drawing again. Mirror of India's row."
