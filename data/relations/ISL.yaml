  summary: "Accession talks were not restarted. On 29 August 2026 the 'no' camp won 52.8% against 47.2% (turnout 82.5%) in a referendum on resuming talks; the Frostadóttir government set membership aside until 2028 and left any formal withdrawal of the 2009 application to parliament. Iceland stays in the EEA and Schengen. Fisheries and agriculture remain the sticking points, as the enlargement commissioner noted."
