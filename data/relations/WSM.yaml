from: WSM
relations:
  # ---------- objective ----------
  - to: NZL
    layer: objective
    type: influence_goal
    summary: "Samoa presses New Zealand on the citizenship lost under the Western Samoa Citizenship Act 1982 (overturning a 1982 Privy Council ruling); NZ passed a law on 20 Nov 2024 restoring the right for Samoans born 1924-1949, a claim Samoa pressed as a matter of trust and fairness."
    since: '1982'
    until: '2024-11-20'
    last_verified: '2026-10-12'
    confidence: B
    sources:
      - {url: "https://www.rnz.co.nz/international/pacific-news/534339/685-s-to-the-world-restoring-citizenship-bill-passes-with-unanimous-support", title: "'685's to the world:' Restoring Citizenship Bill passes with unanimous support", publisher: "Radio New Zealand", date: 2024-11-20, tier: 3}
      - {url: "https://www.rnz.co.nz/international/pacific-news/513986/not-looking-for-money-samoa-citizenship-bill-about-trust-and-fairness-community-leader", title: "'Not looking for money': Samoa citizenship bill 'about trust and fairness' - community leader", publisher: "Radio New Zealand", date: 2024, tier: 3}

  - to: AUS
    layer: objective
    type: influence_goal
    summary: "Keep Samoan workers in Australia's Pacific Labour Scheme on Samoan terms: Samoa capped PALM contracts at three years after a 2021 review; in Feb 2026 Wong said Samoa controls how workers are selected and how many go."
    since: '2018'
    until: null
    last_verified: '2026-10-12'
    confidence: C
    sources:
      - {url: "https://devpolicy.org/samoas-participation-in-nz-and-australias-pacific-labour-schemes-20221107/", title: "Growing pains: Samoa's participation in New Zealand and Australia's Pacific labour schemes", publisher: "Devpolicy Blog (Development Policy Centre)", date: 2022-11-07, tier: 3}
      - {url: "https://www.samoaobserver.ws/category/samoa/118681", title: "It's up to Samoa: Wong on labour mobility", publisher: "Samoa Observer", date: 2026-02, tier: 3}

  # ---------- alignment ----------
  - to: NZL
    layer: alignment
    type: treaty
    summary: "1962 Treaty of Friendship, signed at independence: a special relationship under which Samoa may ask NZ to consider defence assistance; Samoa keeps no formal military."
    since: '1962-08'
    until: null
    last_verified: '2026-10-12'
    confidence: A
    sources:
      - {url: "https://treaties.un.org/doc/Publication/UNTS/Volume%20453/volume-453-I-6515-English.pdf", title: "New Zealand and Western Samoa: Treaty of Friendship", publisher: "UN Treaty Series", date: 1962-08, tier: 1}

  # ---------- dependency ----------
  - to: NZL
    layer: dependency
    type: remittances
    value: 0.24
    unit: share_of_gdp
    summary: "Personal remittances were 24.0% of GDP in 2024 (World Bank series), down from a 31.5% peak in 2022. Most traces to Samoan PALM and RSE workers abroad, but the government does not split seasonal pay from other private transfers; the recent 2024/25 inflow was reported above ST$900m."
    since: '2024'
    until: null
    last_verified: '2026-10-12'
    confidence: C
    sources:
      - {url: "https://statisticsoftheworld.com/country/samoa/BX.TRF.PWKR.DT.GD.ZS", title: "Personal remittances received (% of GDP), Samoa (World Bank series)", publisher: "Statistics of the World (World Bank data)", date: 2025, tier: 4}
      - {url: "https://devpolicy.org/samoas-new-fees-implications-for-palm-and-rse-employers-20250819/", title: "Samoa's new fees: implications for PALM and RSE employers", publisher: "Devpolicy Blog (Development Policy Centre)", date: 2025-08-19, tier: 3}

  - to: CHN
    layer: dependency
    type: debt
    value: 0.37
    unit: share_of_external_debt
    summary: "China was owed $299.8m of $810.4m total external debt at end-2023, about 37% (our calculation from the government figures; Japan was owed $56.9m). The ratio is ours, not the report's."
    since: '2023-12'
    until: null
    last_verified: '2026-10-12'
    confidence: C
    sources:
      - {url: "https://www.samoaobserver.ws/category/samoa/108377", title: "Total external debt was $810.4 million; China is owed $299.8 million", publisher: "Samoa Observer", date: 2024-03-10, tier: 3}

  - to: AUS
    layer: dependency
    type: investment
    value: 105.5
    unit: aud_million_direct_budget_support
    summary: "Australian direct budget support of A$105.5m, plus flagship programmes Tautai (governance, A$45m, 2022-30) and Tautua (human development, A$40m, 2021-29) and A$30m toward a Legislative Assembly building. Filed as investment because the dependency vocabulary has no aid type: an open question for the ontology."
    since: '2021'
    until: null
    last_verified: '2026-10-12'
    confidence: B
    sources:
