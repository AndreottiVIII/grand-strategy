    layer: action
    type: visit
    summary: "Nandi-Ndaitwah met China's foreign minister Wang Yi as president-elect in January 2025, per the Chinese foreign ministry readout. Cooperation was then reaffirmed by the Chinese ambassador and the president in April 2025."
