from: NRU
relations:
  # ---------- alignment ----------
  - to: AUS
    layer: alignment
    type: treaty
    summary: "Nauru-Australia treaty (December 2024): mutual agreement required for any engagement in Nauru's security, banking and telecommunications sectors, with A$100m for the budget and A$40m for policing and security over five years. The same treaty is recorded in data/relations/AUS.yaml with the same sources. PINA: an 'effective veto'; ASPI: 'friends to all'. Entry into force not confirmed in the sources read."
    since: 2024-12-09
    until: null
    last_verified: 2026-10-16
    confidence: B
    sources:
      - {url: "https://pina.com.fj/2024/12/09/australia-gains-effective-veto-over-nauru-security-pact/", title: "Australia gains effective veto over Nauru security pact", publisher: "PINA (Pacific Islands News Association)", date: 2024-12-09, tier: 3}
      - {url: "https://www.aspistrategist.org.au/friends-to-all-nauru-australia-security-treaty-brings-confidence-and-stability/", title: "Friends to all: Nauru-Australia security treaty brings confidence and stability", publisher: "ASPI (The Strategist)", date: 2024-12, tier: 2}

  - to: CHN
    layer: alignment
    type: recognition
    summary: "Nauru recognises the People's Republic of China again, after severing relations with Taipei on 15 January 2024. The restoration date (24 January 2024) comes from a Wikipedia citation to Reuters (25 January 2024), not opened; the Business Standard source gives the severance."
    since: 2024-01-24
    until: null
    last_verified: 2026-10-16
    confidence: C
    sources:
      - {url: "https://www.business-standard.com/world-news/taiwan-s-pacific-influence-dwindles-as-china-gains-ground-in-island-nations-125090800161_1.html", title: "Taiwan's Pacific influence dwindles as China gains ground in island nations", publisher: "Business Standard", date: 2025-09-08, tier: 3}

  - to: org-pif
    layer: alignment
    type: membership
    summary: "Full member of the Pacific Islands Forum. Not in the Wikidata membership rows. The source is the Forum's member-states page, the same page the dataset cites for Australia; Nauru's line on the page was not read in this run, so confidence is C. The since date is the Forum's founding year (1971), not Nauru's own entry, which was not checked."
    since: 1971
    until: null
    last_verified: 2026-10-16
    confidence: C
    sources:
      - {url: "https://forumsec.org/who-we-are", title: "Pacific Islands Forum - member states", publisher: "Pacific Islands Forum", date: 2026-10-12, tier: 1}

