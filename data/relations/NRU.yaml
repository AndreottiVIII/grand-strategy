    type: agreement
    summary: "Memorandum of understanding signed in Nauru in late August 2025 by Australia's Home Affairs Minister, Tony Burke, and the government of President David Adeang: Nauru takes people from Australia's NZYQ cohort (people freed after the High Court's ruling against indefinite detention), under long-term visas. The press reported about 280 people. Legal challenges followed in Australia."
