  - to: org-imf
    layer: dependency
    type: debt
    summary: Ghana borrowed about US$3bn from the IMF under a 39-month Extended Credit Facility approved in May 2023; the sixth and final review on 27 July 2026 released about US$371m and closed the arrangement, which a 36-month non-financing Policy Coordination Instrument now follows.
    since: '2023-05'
    until: '2026-07'
    last_verified: 2026-10-16
    confidence: B
    value: 3.0
    unit: usd_bn
    note: "Figure is the total disbursed under the facility, given as roughly US$3 billion in the IMF release. Residual external commercial creditors (about US$2.7bn in the 2025 review, under 5% of pre-restructuring public debt) are not an actor and are not written as a row; they sit in the card's objectives."
    sources:
      - {url: "https://www.imf.org/en/news/articles/2026/07/27/pr25260-ghana-imf-exec-board-completes-6th-rev-arr-ecf-concludes-2026-aiv-consult-rev-req-36mo-pci", title: "IMF Executive Board Completes the Sixth Review of Ghana's Arrangement Under the Extended Credit Facility, Concludes the 2026 Article IV Consultation, and Reviews Request of a 36-Month Policy Coordination Instrument for Ghana", publisher: "International Monetary Fund", date: 2026-07-27, tier: 1}
      - {url: "https://www.imf.org/en/news/articles/2025/12/17/pr-25429-ghana-imf-completes-the-fifth-review-under-the-ecf-arrangement", title: "IMF Executive Board Completes the Fifth Review under the Extended Credit Facility Arrangement with Ghana", publisher: "International Monetary Fund", date: 2025-12-17, tier: 1}

