- to: org-pif
  layer: dependency
  type: trade_share
  value: 43
  unit: usd_million
  summary: "Tuna access and licence receipts, the largest earner: US$43 million in 2023 (Australian Army country guide), about three-fifths of locally generated government income (APIBC, 2025), down about 40% over five years as stocks move into international waters. The access is sold under the Pacific regime (Nauru Agreement, Forum Fisheries Agency) and the US Tuna Treaty, so the counterparty is the regional arrangement, not one state. Note: no export type fits a fishing-access fee; the value is licence receipts, not trade."
  since: '2023'
  until: null
