  # ---------- alignment ----------
  - to: USA
    layer: alignment
    type: treaty
    summary: "Compact of Free Association with the United States. Its first financial period runs from 1986 (DOI); amended by Public Law 108-188 in 2003; the 2023 extension is in the action row below. The Compact gives Marshallese citizens visa-free residence, work and study in the United States (Ninth Circuit, quoting the Compact)."
    since: 1986
    until: null
    last_verified: 2026-10-16
    confidence: A
    sources:
      - {url: "https://www.doi.gov/oia/compacts-of-free-association", title: "Compacts of Free Association (undated page, read 2026-10-16)", publisher: "U.S. Department of the Interior, Office of Insular Affairs", date: 2026-10-16, tier: 1}
