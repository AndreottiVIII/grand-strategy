  # ---------- dependency ----------
  - to: CHN
    layer: dependency
    type: trade_share
    value: 0.33
    unit: share_of_tourist_arrivals
    summary: "Chinese visitors were 19,060 of 57,370 international arrivals in January to October 2025 (about 33%, computed here), up 25% and back at the top market after halving in 2024 (AP put China at about 30% of tourists then). Tourism is a services export and the vocabulary has no tourism type, so it is filed under trade_share. The tourism share of GDP is about 40% (AP) against more than half (RNZ, 2024): the atlas uses AP and does not reconcile the two."
    since: 2024
    until: null
    last_verified: 2026-10-16
    confidence: C
    sources:
      - {url: "https://abcnews.go.com/International/wireStory/palaus-president-china-weaponizing-lucrative-tourism-refusal-break-112884974", title: "Palau's president says China weaponizing lucrative tourism over refusal to break Taiwan ties (AP)", publisher: "ABC News (AP)", date: 2024, tier: 3}
      - {url: "https://www.mvariety.com/?p=22746", title: "Palau sees significant tourism growth (headline matched to the 2025 arrivals figures, from a search summary; not opened)", publisher: "Marianas Variety", date: 2025, tier: 3}

  - to: USA
    layer: dependency
    type: investment
    value: 889
    unit: usd_millions_over_20_years
    summary: "Compact economic assistance: US$889 million for Palau over 20 years through 2043 under the 2023 review agreements, enacted in March 2024. It is aid, not investment; the vocabulary has no aid type (the gap the Tonga card also records), so it is filed under investment as the nearest type."
    since: 2024-03
    until: null
    last_verified: 2026-10-16
    confidence: B
    sources:
