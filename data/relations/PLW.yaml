  # ---------- alignment ----------
  - to: USA
    layer: alignment
    type: treaty
    summary: "Compact of Free Association with the United States, with diplomatic relations and the Compact both from 1 October 1994. The 2023 review agreements, enacted in March 2024, renewed the economic assistance (see the dependency row)."
