  # ---------- action ----------
  - to: MAR
    layer: action
    type: agreement
    summary: "The African Atlantic gas pipeline: a memorandum with ECOWAS (September 2022), an intergovernmental agreement reported for 2026, and the ECOWAS summit's signed backing in July 2026; about USD 25bn, about 5,600 km offshore, first gas expected in 2031. Mirror of the Morocco card's sources."
