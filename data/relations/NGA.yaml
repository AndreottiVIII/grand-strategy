from: NGA
relations:
  # ---------- alignment ----------
  - to: CMR
    layer: alignment
    type: treaty
    summary: "The Greentree Agreement (2006) settled the Bakassi Peninsula dispute: Nigerian troops withdrew and the peninsula passed to Cameroon's administration in August 2013. Mirror of the Cameroon card's row: one treaty, the same source."
    since: '2006'
    until: null
    last_verified: 2026-10-16
    confidence: B
    sources:
      - {url: "https://www.loc.gov/lawweb/servlet/lloc_news?disp3_l205403677_text", title: "Cameroon; Nigeria: Bakassi Peninsula Transition Completed", publisher: "Library of Congress", date: "2013-08-13", tier: 1}

  # ---------- objective ----------
  - to: ZAF
    layer: objective
    type: influence_goal
    summary: "Nigeria's claim to lead Africa is contested by South Africa. SAIIA (2025) argues that Pretoria now co-claims or usurps the continental standing through its G20 seat and its ICJ case against Israel; the 2012 AU Commission contest was the rivalry's clearest test."
    since: '2012'
    until: null
    last_verified: 2026-10-16
    confidence: B
    sources:
      - {url: "https://saiia.org.za/research/has-south-africa-overtaken-nigeria-as-africas-giant/", title: "Has South Africa Overtaken Nigeria as Africa's Giant?", publisher: "SAIIA", date: 2025-07-30, tier: 2}
      - {url: "https://mg.co.za/news/africa/2012-06-07-why-nigeria-hates-sa-gloves-off-to-be-champion-of-africa/", title: "Why Nigeria hates SA: gloves off to be champion of Africa", publisher: "Mail & Guardian", date: 2012-06-07, tier: 3}

  - to: org-aes
    layer: objective
    type: membership_goal
    summary: "Abuja wants ECOWAS to survive, with the AES states able to return 'under a different status'. The AES exit is read as a loss for Nigeria, which helped found the bloc, and as a threat to Lake Chad security. Our reading of the analysis, not an official Nigerian statement."
    since: '2025'
    until: null
    last_verified: 2026-10-16
    confidence: C
    sources:
      - {url: "https://allafrica.com/stories/202502100296.html", title: "West Africa: Scenarios of Ecowas-AES Relationships - Nigeria's Strategic Autonomy As a Major Dynamic", publisher: "AllAfrica", date: 2025-02-10, tier: 3}

  # ---------- dependency ----------
  - to: PRT
    layer: dependency
    type: energy_export
    summary: "Nigeria supplied about half of Portugal's LNG deliveries in 2024 (51%, ERSE figures) against about 40% from the US; in 2025 Nigeria accounted for 50% of Sines discharges, the US 43% and Russia 7%. Mirror of the Portugal card's row: the same source."
    value: 0.51
    unit: share_of_lng_deliveries_2024
    since: '2024'
    until: null
    last_verified: 2026-10-16
    confidence: B
    sources:
      - {url: "https://www.gasprocessingnews.com/news/2025/01/portugal-to-import-more-us-nigerian-lng-aims-to-end-russian-supply/", title: "Portugal to import more US, Nigerian LNG, aims to end Russian supply", publisher: "Reuters (via Gas Processing News)", date: 2025-01, tier: 3}
      - {url: "https://www.rtp.pt/noticias/economia/sines-recebeu-95-do-gas-que-entrou-em-portugal-e-tres-navios-russos-em-2025_n1764920", title: "Sines received 95% of the gas that entered Portugal and three Russian ships in 2025", title_original: "Sines recebeu 95% do gas que entrou em Portugal e tres navios russos em 2025", lang: pt, publisher: "RTP (ERSE report)", date: 2026, tier: 3}

  - to: USA
    layer: dependency
    type: military_presence
    summary: "Nigeria's counter-ISWAP campaign depended on US advisers: an advance team arrived on 3 February 2026 and grew to about 200 trainers; AFRICOM withdrew almost all personnel by 3 July 2026 and kept intelligence assets. Dependency on US help, not a basing agreement."
    value: 200
    unit: us_trainers_peak_2026
    since: '2026-02-03'
    until: '2026-07-03'
    last_verified: 2026-10-16
    confidence: C
    sources:
      - {url: "https://www.militarytimes.com/news/pentagon-congress/2026/07/03/us-withdrew-forces-from-nigeria-after-operation-against-isis-africom-chief-says/", title: "US withdrew forces from Nigeria after operation against ISIS, AFRICOM chief says", publisher: "Military Times (Reuters)", date: 2026-07-03, tier: 3}
      - {url: "https://www.nytimes.com/2026/05/16/world/africa/trump-isis-nigeria-al-minuki.html", title: "Trump says a top ISIS leader was killed in a U.S.-Nigerian mission", publisher: "The New York Times", date: 2026-05-16, tier: 3}

  - to: CHN
    layer: dependency
    type: debt
    summary: "China Exim Bank is Nigeria's largest bilateral creditor: USD 4.91bn outstanding, about 9% of external debt in June 2026. The World Bank's IDA (35%) and Eurobond holders (34%) are larger creditors. Figures differ by report; the DMO is the primary source and was not opened."
    value: 0.0901
    unit: share_of_external_debt_2026-06
    since: '2026-06'
    until: null
    last_verified: 2026-10-16
    confidence: C
