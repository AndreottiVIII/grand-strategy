    type: recognition_sought
    summary: "Whether the entity seeks independence is two claims, not a fact: Dodik has said that Republika Srpska and Kosovo 'want the same thing - independence' and, per Sarajevo, asked Washington in February 2026 to help define the entity's status and abolish the OHR, while the entity's line is that it seeks the original Dayton and not secession; the OHR said the laws of 27 Feb 2025 'hint at de facto secession'."
    since: 2019
    until: null
    last_verified: 2026-10-12
    confidence: C
    claims:
      - by: sub-rs
        text: secession is not on the agenda; the entity wants the original Dayton competences back (Dodik)
