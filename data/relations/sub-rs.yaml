      - by: BIH
        text: the entity's laws of Feb 2025 hint at de facto secession and Dodik lobbied the US for independence and the abolition of the OHR
        source: https://fena.ba/article/1665134/konakovic-dodik-sought-lobbying-in-the-u-s-for-rs-independence-and-the-abolition-of-ohr
    note: "Dodik's quote on independence is from 2019 and the Fena 'no secession' piece is undated in our search; the Konakovic claim is the foreign minister's assertion, not independently verified."
