  - to: BIH
    layer: action
    type: incident
    summary: "On 12 Aug 2025 the State Court replaced Dodik's one-year prison term with a fine of about EUR 18,660 at the defence's request, leaving the six-year ban in place. The Central Election Commission had already stripped him of the RS presidency (6 Aug 2025, after the final verdict), the Constitutional Court rejected his appeal in November, and on 18 Oct 2025 the Assembly installed Ana Trisic-Babic as acting president and repealed the annulled laws. No plea agreement with the State Prosecutor's Office was found in any source."
    since: 2025-08-06
    until: 2025-11
    last_verified: 2026-10-12
    confidence: B
    note: "The brief's plea-deal element could not be verified: searches in English and Bosnian returned nothing. A pardon by the state Presidency (three-member consensus, prior opinion of the State Court) was being debated in Bosnian media in October 2026; no pardon has been granted."
