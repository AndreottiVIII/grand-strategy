    layer: action
    type: incident
    summary: "In April 2025 High Representative Schmidt suspended public funding to SNSD and its coalition partner after the conviction, a Bonn-powers decision Germany publicly backed; Schmidt then announced his resignation on 10-11 May 2026, the Peace Implementation Council failed on 4 June and 30 June to agree a successor (the US backed Antonio Zanardi Landi, France, the UK and Germany Rene Troccaz), and US diplomat Louis Crishock became acting High Representative on 1 July 2026. No permanent successor was confirmed in any source reached."
