    layer: objective
    type: influence_goal
    summary: "The entity's leadership wants the competences transferred to the state since 2000 returned to Banja Luka - army, border police, intelligence, the indirect-tax system, the judiciary - and the High Representative's role ended; the RS Assembly's declaration of 7 July 2026 says so. Mirrors the state's own objective row toward sub-rs."
    since: 2025-02-27
    until: null
    last_verified: 2026-10-12
    confidence: B
    sources:
