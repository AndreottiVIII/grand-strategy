    type: military_presence
    summary: "Rwandan troops and police in Cabo Delgado since July 2021, guarding the TotalEnergies LNG area. Kigali's spokeswoman put the force at about 6,300 (April 2026); a new contingent was briefed in Kigali on 30 July 2026 to rotate with the present one. The evidence is the same, the figure is Kigali's, and the sources conflict (6,200 and 5,000 elsewhere)."
    value: 6300
    unit: rwandan_troops_and_police_in_cabo_delgado_2026
    since: 2021-07
    until: null
    last_verified: 2026-10-29
    confidence: B
    note: "Figures conflict: Washington Examiner gives 6,200; other press about 5,000; the most recent official-source figure (Kigali's spokeswoman) is kept."
