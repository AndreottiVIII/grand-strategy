from: SGP
relations:
  # ---------- objective ----------
  - to: USA
    layer: objective
    type: influence_goal
    summary: "Keep the United States anchored in Southeast Asia as the counterweight that lets a small state avoid choosing: basing and logistics access under the 1990 MoU, F-35s, rotational US deployments. Wong, September 2025: 'America is a Pacific power. You have considerable stakes here.'"
    since: 1990-11
    until: null
    last_verified: 2026-10-16
    confidence: B
    sources:
      - {url: "https://www.pmo.gov.sg/newsroom/pm-lawrence-wong-in-an-interview-with-the-wall-street-journal-sep-2025/", title: "PM Lawrence Wong in an interview with The Wall Street Journal (Sep 2025)", publisher: "Prime Minister's Office, Singapore", date: 2025-09-17, tier: 1}
      - {url: "https://www.mindef.gov.sg/news-and-events/latest-releases/24sep19_fs/", title: "Fact Sheet: 2019 Protocol of Amendment to the 1990 Memorandum of Understanding", publisher: "Ministry of Defence, Singapore", date: 2019-09-24, tier: 1}
  - to: CHN
    layer: objective
    type: influence_goal
    summary: "Keep China engaged, invested and unprovoked without being 'forced to choose sides': the 2023 partnership, Wong's June 2025 visit to Beijing, and the line that China 'will still remain a very important manufacturing engine' while Singapore hedges against a decoupled world split into US- and China-centred ecosystems."
    since: 2023
    until: null
    last_verified: 2026-10-16
    confidence: B
    sources:
      - {url: "https://www.pmo.gov.sg/newsroom/pm-lawrence-wong-in-an-interview-with-the-wall-street-journal-sep-2025/", title: "PM Lawrence Wong in an interview with The Wall Street Journal (Sep 2025)", publisher: "Prime Minister's Office, Singapore", date: 2025-09-17, tier: 1}
