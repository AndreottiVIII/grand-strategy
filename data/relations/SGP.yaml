  - to: MYS
    layer: alignment
    type: treaty
    summary: "The Five Power Defence Arrangements (1971) tie Singapore and Malaysia, with Australia, New Zealand and the UK, in consultation on their external defence; the defence ministers met on 31 May 2025 at the Shangri-La Dialogue and expected the UK Carrier Strike Group to join Exercise Bersama Lima 2025. A consultative arrangement, not a mutual-defence treaty."
    since: 1971
    until: null
    last_verified: 2026-10-16
    confidence: A
    sources:
