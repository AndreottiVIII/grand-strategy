      - {url: "https://www.fortune.com/2026/04/22/strait-of-hormuz-chaos-dry-run-us-china-conflict-pacific-singapore-foreign-minister-vivian-balakrishnan/", title: "Hormuz chaos a dry run for a US-China conflict in the Pacific, says Singapore's foreign minister Vivian Balakrishnan", publisher: "Fortune", date: 2026-04-22, tier: 3}
  - to: org-asean
    layer: objective
    type: influence_goal
    summary: "Use ASEAN as the frame in which no single superpower dominates the region: Wong, September 2025, 'we do not want a region that is dominated by just one superpower'; Singapore says it is redoubling existing partnerships in Southeast Asia and beyond and forging new frameworks with like-minded countries."
