  # ---------- alignment ----------
  - to: USA
    layer: alignment
    type: treaty
    summary: "Not an alliance, but the nearest thing without a treaty: the 1990 MoU on US use of Singapore's air and naval facilities (Changi Naval Base added in 1998), the 2005 Strategic Framework Agreement (Major Security Cooperation Partner), and a Protocol of Amendment signed 24 Sep 2019 that renews the MoU for another 15 years, to about 2035."
    since: 1990-11
    until: 2035
    last_verified: 2026-10-16
    confidence: A
    sources:
      - {url: "https://www.mindef.gov.sg/news-and-events/latest-releases/24sep19_fs/", title: "Fact Sheet: 2019 Protocol of Amendment to the 1990 Memorandum of Understanding", publisher: "Ministry of Defence, Singapore", date: 2019-09-24, tier: 1}
