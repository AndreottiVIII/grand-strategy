    since: 2025-11-27
    until: 2025-11-30
    last_verified: 2026-10-12
    confidence: C
    sources:
      - {url: "https://www.asianews.it/en/middle-east/lebanon/leo-xiv-to-visit-turkey-and-lebanon-on-his-first-apostolic-trip", title: "Leo XIV to visit Turkey and Lebanon on his first apostolic trip", publisher: "AsiaNews", date: 2025-10-07, tier: 3}
