  - to: LBN
    layer: action
    type: visit
    summary: Visit to Lebanon, 30 Nov-2 Dec 2025, at the invitation of President Joseph Aoun, with meetings at Baabda, a call for peace and political unity amid Israeli strikes and the Hezbollah disarmament dispute.
