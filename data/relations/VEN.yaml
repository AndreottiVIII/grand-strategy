  # ---------- objective ----------
  - to: GUY
    layer: objective
    type: territorial_claim
    summary: "Venezuela claims the Essequibo, about two-thirds of Guyana's territory, under the 1966 Geneva Agreement reading that voids the 1899 arbitral award; it rejects the ICJ's competence in Guyana's case (filed 2018), and the judgment is expected between November 2026 and January 2027. The court's provisional measures of 2023 and May 2025 forbade changing the situation or holding elections in the region."
    since: 1899
    until: null
    last_verified: 2026-10-16
    confidence: B
    sources:
      - {url: "https://oilnow.gy/featured/guyana-government-expects-world-court-ruling-as-early-as-november-2026-in-essequibo-border-case/", title: "Guyana government expects world court ruling as early as November 2026 in Essequibo border case", publisher: "OilNOW", date: 2026, tier: 3}
