  - to: FRA
    layer: objective
    type: influence_goal
    summary: "Take the state's uranium and its mining revenue out of French hands: the junta expelled France's ambassador in August 2023 and nationalised the Somair mine, where Orano held 63.4 per cent, on 19 June 2025."
    since: '2023-08-25'
    until: null
    last_verified: '2026-10-16'
    confidence: C
    sources:
