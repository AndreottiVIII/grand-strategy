  - to: RUS
    layer: alignment
    type: security_guarantee
    summary: "Africa Corps as the junta's guard: Moscow confirmed its forces helped repel the ISIL attack on Niamey airport (3 February 2026) and helped put down an attempted coup (August 2026). No defence treaty is named; the grade is partner with a de facto alignment. Mirror of the Russia card's incident row, same sources."
