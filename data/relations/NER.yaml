  # ---------- alignment ----------
  - to: MLI
    layer: alignment
    type: treaty
    summary: "The Alliance of Sahel States: Niger and Mali (with Burkina Faso) left ECOWAS together, effective 29 January 2025, and launched a joint passport and a joint military arrangement. The date of the confederation treaty itself is not verified in this pass; since is the exit date that the joint arrangement followed."
