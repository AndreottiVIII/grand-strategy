  - to: BEN
    layer: action
    type: incident
    summary: "Niamey kept its side of the border closed after ECOWAS lifted its sanctions, and in May 2024 Benin blocked Niger's crude loading until Niger reopened its side. Mirror of the Benin card's rows, same sources."
