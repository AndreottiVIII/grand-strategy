  - to: USA
    layer: action
    type: agreement
    summary: "The junta revoked the 2012 military cooperation agreement that allowed US personnel in Niger in March 2024, calling the US military presence no longer justified; the US left Air Base 101 in Niamey in July 2024 and Air Base 201 in Agadez by 5 August 2024."
    since: '2024-03-17'
    until: '2024-08-05'
    last_verified: '2026-10-16'
    confidence: C
    sources:
