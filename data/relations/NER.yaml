  - to: BEN
    layer: action
    type: agreement
    summary: "On 2 June 2026 Niamey hosted Benin's President Wadagni, and the joint communique committed both sides to remove obstacles to cooperation, notably the border's reopening; an expert committee was given 15 days to report. The outcome is not verified. Mirror of the Benin card's agreement row."
