    until: null
    last_verified: '2026-10-16'
    confidence: C
    sources:
      - {url: "https://allafrica.com/stories/202502060018.html", title: "Sahel States Exit Ecowas, Launch Regional Passport and Joint Military", publisher: "AllAfrica", date: "2025-02-06", tier: 3}
