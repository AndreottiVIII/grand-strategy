  - to: CHN
    layer: action
    type: visit
    summary: Deputy Prime Minister and Foreign Minister Ian Borg visited China in July 2025; in January 2026 Beijing said it wanted deeper cooperation with Malta on shipping and port logistics and "strategic alignment". China Merchants Port Holdings holds a stake in Malta Freeport.
    since: '2025-07'
    until: null
    last_verified: '2026-10-12'
    confidence: B
    sources:
      - {url: "https://www.fmprc.gov.cn/mfa_eng/gjhdq_665435/3265_665445/3331_664660/", title: "China-Malta bilateral relations (Chinese Ministry of Foreign Affairs)", publisher: "Chinese Ministry of Foreign Affairs", date: 2026, tier: 1}
