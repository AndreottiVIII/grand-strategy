  - to: org-eu
    layer: action
    type: incident
    summary: The Court of Justice of the EU ruled on 29 April 2025 (Commission v Malta, C-181/23) that the investor citizenship scheme commercialised the grant of Union citizenship and breached EU law; Malta said it would respect the ruling and study how to align its framework with it. The Commission can seek fines if Malta does not comply.
    since: '2025-04-29'
    until: null
    last_verified: '2026-10-12'
    confidence: A
    sources:
      - {url: "https://www.lawsociety.ie/gazette/top-stories/2025/april/maltas-golden-passport-breaches-eu-law/", title: "Malta's golden passport breaches EU law", publisher: "Law Society Gazette (Ireland)", date: 2025-04-29, tier: 3}
      - {url: "https://www.occrp.org/en/news/eu-court-rules-maltas-golden-passport-program-is-illegal", title: "EU court rules Malta's golden passport program is illegal", publisher: "OCCRP", date: 2025-04, tier: 3}

  - to: RUS
    layer: action
    type: incident
    summary: Greek-owned Malta-flagged tankers were sold to a Hanoi-based buyer for carrying sanctioned Russian crude and moved to the Panama register, which does not apply sanctions on Russian oil; Malta-flagged ships were also found at Novorossiysk.
    since: '2025-02-07'
    until: null
    last_verified: '2026-10-12'
    confidence: B
    sources:
      - {url: "https://theshiftnews.com/2025/02/07/tankers-abandon-malta-register-to-join-russian-fleet-busting-oil-sanctions/", title: "Tankers abandon Malta register to join Russian fleet busting oil sanctions", publisher: "The Shift", date: 2025-02-07, tier: 3}

  - to: RUS
    layer: action
    type: sanction
    summary: Malta backs EU sanctions against shadow-fleet tankers carrying Russian oil, after first worrying about the effect on its maritime sector; Deputy PM Ian Borg says Malta has widened monitoring of vessel histories, cargoes and ownership and set up a Global Centre for Maritime Sanctions Monitoring. Both reports are undated; the since date is the date this card first recorded them.
    since: '2026-10-12'
    until: null
    last_verified: '2026-10-12'
    confidence: C
    sources:
      - {url: "https://maltatoday.com.mt/news/national/123636/malta_supports_sanctions_against_shadow_tankers_moving_russian_oil", title: "Malta supports sanctions against 'shadow' tankers moving Russian oil [undated]", publisher: "MaltaToday", date: 2026-10-12, tier: 3}
      - {url: "https://www.italpress.com/malta-urges-tighter-action-on-russias-shadow-fleet/", title: "Malta urges tighter action on Russia's shadow fleet [undated]", publisher: "Italpress", date: 2026-10-12, tier: 3}

  - to: UKR
    layer: action
    type: visit
    summary: Malta hosted, in October 2023, the national-security-advisers' meeting on Ukraine's peace formula (about 65 countries, Russia absent). Malta gives non-lethal aid through the European Peace Facility and says it supports Ukraine within its constitutional neutrality. No 2025 peace summit hosted by Malta was found in the sources.
    since: '2023-10-28'
    until: null
    last_verified: '2026-10-12'
    confidence: B
    sources:
      - {url: "https://www.malaymail.com/news/world/2023/10/28/ukraine-holds-peace-formula-talks-in-malta-russia-absent/98931", title: "Ukraine holds peace formula talks in Malta, Russia absent", publisher: "Malay Mail (AFP)", date: 2023-10-28, tier: 3}
