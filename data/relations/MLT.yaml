  - to: CHN
    layer: dependency
    type: trade_share
    summary: China exported USD 2.90bn of goods to Malta in 2025 (down 28.6%) and imported USD 0.52bn (up 8.3%); total trade fell 24.7% from USD 4.54bn in 2024 to USD 3.42bn in 2025. The Chinese figures are the Chinese side's; Maltese data may differ.
    value: 2.90
    unit: usd_bn_china_exports_to_malta_2025
