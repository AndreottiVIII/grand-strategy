from: MLT
relations:
  - to: LBY
    layer: objective
    type: territorial_claim
    summary: Malta contests Tripoli's unilateral claim to lodge its maritime outer limits with the UN and wants the maritime border settled by negotiation; talks were agreed in Valletta in September 2025 (the year is inferred from the article).
    since: '2025-09-10'
    until: null
    last_verified: '2026-10-12'
    confidence: B
    sources:
      - {url: "https://northafricapost.com/?p=90492", title: "Libya and Malta to open talks on maritime borders, migration, regional stability", publisher: "North Africa Post", date: 2025-09-10, tier: 3}

  - to: org-osce
    layer: objective
    type: influence_goal
    summary: Malta chaired the OSCE in 2024 as an eleventh-hour compromise after Estonia's planned chairmanship was vetoed by Russia and Belarus; its programme put Ukraine at the top and pressed for an end to Russia's war. The chair passed to Finland (2025) and Switzerland (2026).
    since: '2024-01-01'
    until: '2024-12-31'
    last_verified: '2026-10-12'
    confidence: A
    sources:
      - {url: "https://osce.org/chairpersonship/561403", title: "Malta takes over OSCE Chair", publisher: "OSCE", date: 2024-01-01, tier: 1}
      - {url: "https://news.err.ee/1609183132/malta-confirmed-as-osce-chair-nation-for-2024", title: "Malta confirmed as OSCE chair nation for 2024 [undated]", publisher: "ERR", date: 2026-10-12, tier: 3}

  - to: LBY
    layer: alignment
    type: treaty
    summary: Memorandum of understanding on migration signed by Abela and the Government of National Accord leader in 2020; two coordination centres, one in Tripoli and one in Valletta, funded by Malta and limited to support and coordination. Three-year term; renewal not found in the sources.
    since: '2020-06'
    until: null
    last_verified: '2026-10-12'
    confidence: A
    sources:
      - {url: "https://www.statewatch.org/news/2020/jun/malta-libya-mou-immigration.pdf", title: "Malta-Libya memorandum of understanding on migration (2020)", publisher: "Statewatch", date: 2020, tier: 1}

  - to: ITA
    layer: dependency
    type: energy_import
    summary: Malta partly relies on electricity imported from Italy; a second 200 MW cable parallel to the Ragusa interconnector was targeted for completion in 2025. No completion was confirmed in the sources.
    value: 200
    unit: mw_second_interconnector_planned
    since: '2025'
    until: null
    last_verified: '2026-10-12'
    confidence: C
    sources:
      - {url: "https://trade.gov/country-commercial-guides/malta-energy", title: "Malta Country Commercial Guide - energy [undated]", publisher: "US International Trade Administration", date: 2026-10-12, tier: 1}

  - to: ITA
    layer: dependency
    type: energy_import
    summary: Melita TransGas plans a 159 km gas pipeline from Delimara to Gela (Sicily), hydrogen-ready, with an initial flow from Italy to Malta of up to 1.2 bcm a year; it is to replace the LNG floating unit at Delimara. Still at tender and not built, per the sources; the cost is quoted at USD 400m (trade.gov) or EUR 350-400m (other sources).
    value: 1.2
    unit: bcm_per_year_planned_initial_flow
    since: '2020'
    until: null
    last_verified: '2026-10-12'
    confidence: C
