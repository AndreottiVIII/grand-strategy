  # ---------- objective ----------
  - to: AFG
    layer: objective
    type: influence_goal
    summary: "Tashkent engages the Taliban without recognising them to make Afghanistan a corridor (Termez, the Hairatan line, the Trans-Afghan railway) and a quiet southern border; the Amu Darya is the other side of the same file. No Central Asian state recognises the Taliban, so no legal water agreement is possible."
    since: 2021-08
    until: null
    last_verified: 2026-10-12
    confidence: B
    sources:
      - {url: "https://timesca.com/uzbekistan-sees-opportunities-in-afghanistan/", title: "Uzbekistan sees opportunities in Afghanistan", publisher: "Times of Central Asia", date: 2026, tier: 3}
      - {url: "https://timesca.com/afghanistans-qosh-tepa-canal-sparks-water-security-concerns-in-central-asia/", title: "Afghanistan's Qosh Tepa canal sparks water security concerns in Central Asia", publisher: "Times of Central Asia", date: 2026, tier: 3}
  - to: AFG
    layer: objective
    type: influence_goal
    summary: "Mirror of the Afghan row: Uzbekistan is the downstream state of the Qosh Tepa canal (285 km planned, first 108-km section commissioned, completion foreseen for 2028, an estimated 20-30% of the Amu Darya's flow); Mirziyoyev proposed a joint working group in 2023 and Tashkent signed a river-management framework with Balkh in May 2025, seeking urgent water talks."
    since: 2022-03
    until: null
    last_verified: 2026-10-12
    confidence: B
    sources:
