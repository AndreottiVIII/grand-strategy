      - {url: "https://timesca.com/afghanistan-advances-qosh-tepa-canal-while-urging-regional-water-cooperation/", title: "Afghanistan advances Qosh Tepa canal while urging regional water cooperation", publisher: "Times of Central Asia", date: 2026-04, tier: 3}
  - to: org-wto
    layer: objective
    type: membership_goal
    summary: "Presidential decree set 2026 for full WTO accession; the WTO Director-General hoped for membership by March 2026 and the 14th Ministerial Conference (26-29 Mar 2026) was to adopt it, but in March 2026 Tashkent was still negotiating 3-8 year transition periods for sensitive industries. No later outcome found."
