  - to: USA
    layer: objective
    type: influence_goal
    summary: "Tashkent presses Congress to repeal the Jackson-Vanik amendment and grant permanent normal trade relations; identical bills S.3103 and H.R.5917 were introduced in November 2025, Secretary Rubio backed repeal in January 2026, and a bipartisan sponsor release of 29 Jul 2026 says the amendment still applies. Not enacted."
