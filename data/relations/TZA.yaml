  - to: KEN
    layer: action
    type: incident
    summary: "A Tanzanian levy on Kenyan-made matchboxes is reported to take effect in May 2026 despite a suspension ordered by the East African Court of Justice. The 30 June 2026 deadline to clear non-tariff barriers lapsed with little progress."
    since: '2026-05'
    until: null
    last_verified: '2026-10-16'
    confidence: C
    note: "The matchbox case rests on one outlet (Dawan Africa); no Tanzanian government response was found. The deadline lapse is from The East African and Capital FM (May 2026 deadline set)."
    sources:
      - {url: "https://www.dawan.africa/news/tanzania-allegedly-defies-regional-court-order-in-escalating-matchbox-tax-dispute-with-kenya", title: "Tanzania allegedly defies regional court order in escalating matchbox tax dispute with Kenya", publisher: "Dawan Africa", date: '2026', tier: 3}
