  - to: COD
    layer: action
    type: incident
    summary: "SADC leaders end the SAMIDRC mandate on 13 March 2025. The Tanzanian contingent withdraws in phases from 29 April 2025, returning overland through Rwanda, which had to consent to the transit."
    since: '2025-03-13'
    until: null
    last_verified: '2026-10-16'
    confidence: C
    note: "No closer action type in the vocabulary, so 'incident', as in the Cambodia card. The SADC mission was not Tanzania's alone: South Africa and Malawi also withdrew."
    sources:
      - {url: "https://www.dailymaverick.co.za/article/2025-04-29-south-african-and-other-sadc-troops-finally-begin-withdrawal-from-war-torn-drc.md", title: "South African and other SADC troops finally begin withdrawal from war-torn DRC", publisher: "Daily Maverick", date: '2025-04-29', tier: 3}
