  - to: org-eu
    layer: action
    type: incident
    summary: "Samia Suluhu Hassan rejects Western criticism of the 2025 election as interference, after the EU statement of 4 November 2025 had voiced serious concern over the violence and the internet shutdown."
    since: '2025-12'
    until: null
    last_verified: '2026-10-16'
    confidence: B
    note: "The date is the reporting date (OPB, 7 December 2025), not the date of the speech, which is not pinned. The EU statement is tier 1; Samia's reply is from tier 3 reporting."
    sources:
