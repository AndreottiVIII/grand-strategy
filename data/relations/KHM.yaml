    unit: usd_bn
    since: '2000'
    until: null
    last_verified: '2026-10-16'
    confidence: C
    note: "The figures are taken from a secondary summary of the AidData profile, whose title covers 2000-2023. The end-2024 share and the 7% of GDP must be checked against the PDF before any public use. A further, larger share of exposure is private or opaque (bank and joint-venture loans); not counted here, not verified."
    sources:
      - {url: "https://docs.aiddata.org/ad4/pdfs/chinese-development-finance-profiles/2026/Cambodia_2000_2023_China_Development_Finance_Profile.pdf", title: "Cambodia 2000-2023 China Development Finance Profile", publisher: "AidData", date: '2026', tier: 2}

