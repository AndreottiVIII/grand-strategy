  - to: THA
    layer: objective
    type: territorial_claim
    summary: "Cambodia and Thailand both claim the Preah Vihear temple area and the border zones. The July 2025 clash and the fighting of December 2025 reopened the dispute; by April 2026 Phnom Penh was asking Bangkok to resume talks."
    since: '2025-07'
    until: null
    last_verified: '2026-10-16'
    confidence: B
    sources:
      - {url: "https://www.cfr.org/blog/thai-cambodian-border-clashes-help-revive-hun-sens-power", title: "Thai-Cambodian border clashes help revive Hun Sen's power", publisher: "Council on Foreign Relations", date: '2025-07-28', tier: 2}
      - {url: "https://www.csis.org/analysis/fraud-frontlines-scam-centers-caught-cambodia-thailand-conflict", title: "From Fraud to the Frontlines: Scam Centers Caught in the Cambodia-Thailand Conflict", publisher: "CSIS", date: '2026-01-15', tier: 2}
