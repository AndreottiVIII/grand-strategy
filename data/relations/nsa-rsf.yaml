  summary: 'On 7 Jan 2025 the US determined that the RSF and allied militias committed genocide in Sudan and sanctioned Hemedti (State Department and Treasury: entry ban and assets frozen under Executive Order 14098). After the army rejected the US-backed Quad plan in Nov 2025, the RSF declared its own humanitarian truce, the 6 Nov 2025 pause that the SDN card reads as tactical. Sanctions and finding are the structural friction; the truce is the RSF''s answer in practice.'
