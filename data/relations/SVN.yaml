      - {url: "https://www.gov.si/en/news/2025-12-01-slovenia-assumes-the-un-security-council-presidency-for-the-second-time/", title: "Slovenia assumes the UN Security Council presidency for the second time", publisher: "Government of Slovenia", date: 2025-12-01, tier: 1}
