from: SVN
relations:
  # ---------- objective ----------
  - to: HRV
    layer: objective
    type: territorial_claim
    summary: "Slovenia treats the 2017 Piran Bay arbitration award (most of the bay and a junction to the high seas) as binding; Croatia withdrew from the process in 2015 and does not implement it. In 2023 the two prime ministers agreed to keep the dispute out of daily politics. Mirrors Croatia's row toward Slovenia with the same sources."
    since: 2015
    until: null
    last_verified: 2026-10-12
    confidence: A
    claims:
      - by: SVN
        text: the arbitration award is binding on both states (Slovenia's National Assembly accepted it)
        source: https://vlada.gov.hr/traditionally-good-and-friendly-relations-between-croatia-and-slovenia-the-border-dispute-takes-time-to-resolve/42330
      - by: HRV
        text: the proceedings were contaminated and the award null; the Sabor rejected it entirely (Plenkovic, July 2023)
        source: https://vlada.gov.hr/traditionally-good-and-friendly-relations-between-croatia-and-slovenia-the-border-dispute-takes-time-to-resolve/42330
    sources:
      - {url: "https://english.sta.si/2404120/slovenia-gets-bulk-of-piran-bay-junction-access-to-high-seas", title: "Slovenia gets bulk of Piran Bay, 'junction' access to high seas", publisher: "Slovenian Press Agency (STA)", date: 2017-06-29, tier: 3}
      - {url: "https://vlada.gov.hr/traditionally-good-and-friendly-relations-between-croatia-and-slovenia-the-border-dispute-takes-time-to-resolve/42330", title: "Traditionally good and friendly relations between Croatia and Slovenia, the border dispute takes time to resolve", publisher: "Government of Croatia", date: 2023-07-14, tier: 1}

  # ---------- dependency ----------
  - to: HRV
    layer: dependency
    type: trade_share
    summary: "Slovenia sold Croatia EUR 5.4bn of goods in 2025 (12.0% of Croatian imports) and bought EUR 3.0bn from it. Mirrors Croatia's trade row; the Slovenian-side figure for 2025 (Comtrade, US$5.46bn, up from US$5.10bn in 2024) agrees."
    value: 5.4
    unit: eur_bn_goods_exports_to_partner_2025
    since: 2025
    until: null
    last_verified: 2026-10-12
    confidence: A
    note: "Croatian customs-statistics figure (DZS table, EUR 5,409m); Slovenia's own statistics office release was not reached. Croatia was about 7.8% of Slovenian goods exports in 2023 (Statistics Slovenia via ACCIÓ)."
    sources:
      - {url: "https://podaci.dzs.hr/media/q3spz1yd/vt-2026-1-2-foreign-trade-in-goods-of-the-republic-of-croatia-2025.pdf", title: "Foreign trade in goods of the Republic of Croatia, 2025 (final data)", publisher: "Croatian Bureau of Statistics (DZS)", date: 2026-05-29, tier: 1}
      - {url: "https://tradeportal.accio.gencat.cat/ca/mercats-potencials/eslovenia/perfil-comerc", title: "Slovenia: economic and political overview (trade profile, Statistics Slovenia data)", title_original: "Eslovènia: Visió econòmica i política", lang: ca, publisher: "ACCIÓ (Government of Catalonia trade agency)", date: 2024, tier: 3}
  - to: HRV
    layer: dependency
    type: investment
    summary: "The Krsko nuclear plant is owned jointly by Slovenia's GEN Energija and Croatia's HEP; a second unit (JEK2, EUR 9.3-15.4bn estimated) was to go to a consultative referendum on 24 Nov 2024, which the National Assembly cancelled on 24 Oct 2024 (60 for, 1 against, 1 abstention) citing a lack of public information on the project."
    value: 0.5
    unit: share_of_krsko_plant_owned_by_slovenia
    since: 2024-10-24
    until: null
    last_verified: 2026-10-12
    confidence: B
    note: "The cited article says the plant is 'jointly owned' by HEP and GEN Energija; the 50/50 split is the standard description of the plant's ownership but is not stated in that article. The share of Slovenian electricity from Krsko was not sourced."
    sources:
      - {url: "https://www.intellinews.com/slovenia-cancels-referendum-on-krsko-nuclear-power-plant-expansion-350065", title: "Slovenia cancels referendum on Krsko nuclear power plant expansion", publisher: "bne IntelliNews", date: 2024-10, tier: 3}
  - to: DEU
    layer: dependency
    type: trade_share
    summary: "Germany took 13.5% of Slovenian goods exports in 2023, the largest EU destination; on Comtrade 2025 data it was US$8.2bn, about 10% of a total inflated by Swiss flows."
    value: 0.135
    unit: share_of_goods_exports_2023
    since: 2023
    until: null
    last_verified: 2026-10-12
    confidence: B
    note: "SURS-based 2023 shares as reported by ACCIÓ; the Comtrade 2025 series (via Trading Economics) is not Slovenia's statistics office and is used only as a cross-check of ranking."
    sources:
      - {url: "https://tradeportal.accio.gencat.cat/ca/mercats-potencials/eslovenia/perfil-comerc", title: "Slovenia: economic and political overview (trade profile, Statistics Slovenia data)", title_original: "Eslovènia: Visió econòmica i política", lang: ca, publisher: "ACCIÓ (Government of Catalonia trade agency)", date: 2024, tier: 3}
      - {url: "https://da.tradingeconomics.com/slovenia/exports-by-country", title: "Slovenia exports by country (UN Comtrade)", publisher: "Trading Economics / UN Comtrade", date: 2025, tier: 4}
  - to: ITA
    layer: dependency
    type: trade_share
    summary: "Italy took 8.6% of Slovenian goods exports in 2023 (Comtrade 2025: US$5.1bn, up from US$4.8bn). Trieste and Koper port competition and the Italian minority were not sourced."
    value: 0.086
    unit: share_of_goods_exports_2023
    since: 2023
    until: null
    last_verified: 2026-10-12
    confidence: B
    sources:
      - {url: "https://tradeportal.accio.gencat.cat/ca/mercats-potencials/eslovenia/perfil-comerc", title: "Slovenia: economic and political overview (trade profile, Statistics Slovenia data)", title_original: "Eslovènia: Visió econòmica i política", lang: ca, publisher: "ACCIÓ (Government of Catalonia trade agency)", date: 2024, tier: 3}
      - {url: "https://da.tradingeconomics.com/slovenia/exports-by-country", title: "Slovenia exports by country (UN Comtrade)", publisher: "Trading Economics / UN Comtrade", date: 2025, tier: 4}
  - to: CHE
    layer: dependency
    type: trade_share
    summary: "Switzerland is Slovenia's largest goods-export destination, 27.3% in 2023 and, on Comtrade data, US$34.1bn of US$80.8bn in 2025 (about 42%), up from US$22.5bn in 2024."
    value: 0.273
    unit: share_of_goods_exports_2023
    since: 2023
    until: null
    last_verified: 2026-10-12
    confidence: B
    note: "An unusually large flow for a country of its size; the composition behind it (re-exports, pharmaceutical or gold trade) was not checked and no inference is drawn."
    sources:
      - {url: "https://tradeportal.accio.gencat.cat/ca/mercats-potencials/eslovenia/perfil-comerc", title: "Slovenia: economic and political overview (trade profile, Statistics Slovenia data)", title_original: "Eslovènia: Visió econòmica i política", lang: ca, publisher: "ACCIÓ (Government of Catalonia trade agency)", date: 2024, tier: 3}
      - {url: "https://da.tradingeconomics.com/slovenia/exports-by-country", title: "Slovenia exports by country (UN Comtrade)", publisher: "Trading Economics / UN Comtrade", date: 2025, tier: 4}

  # ---------- action ----------
  - to: ISR
    layer: action
    type: sanction
    summary: "In July 2025 Golob's government banned Israel's National Security Minister Ben-Gvir and Finance Minister Smotrich from entering Slovenia for inciting violence (17 Jul 2025, the first such measure by an EU member, per Fajon), then announced a full arms embargo (exports, imports and transit, with an exception for Slovenia's own security) and a ban on imports from settlements; Netanyahu was also barred in some reports. Lifted by Janša's government on 11 Jun 2026."
    since: 2025-07-17
    until: 2026-06-11
    last_verified: 2026-10-12
    confidence: B
    sources:
      - {url: "https://www.jns.org/israel-news/slovenia-imposes-arms-embargo-on-israel", title: "Slovenia imposes arms embargo on Israel", publisher: "Jewish News Syndicate (JNS)", date: 2025-08, tier: 3}
      - {url: "https://www.arabnews.pk/node/2646850/world", title: "Slovenia lifts entry ban on Israeli PM, arms embargo", publisher: "Arab News / AFP", date: 2026-06-12, tier: 3}
  - to: ISR
    layer: action
    type: agreement
    summary: "On 11 Jun 2026 the new government lifted the entry bans on Netanyahu, Ben-Gvir and Smotrich, let the arms embargo expire (calling it unnecessary given national law and EU export criteria) and ended the settlement-import ban, to 'restore the conditions for a normal political dialogue'; it also removed the Palestinian flag from the government building. Israel announced an embassy in Ljubljana the week before."
    since: 2026-06-11
    until: null
    last_verified: 2026-10-12
    confidence: B
    sources:
      - {url: "https://www.arabnews.pk/node/2646850/world", title: "Slovenia lifts entry ban on Israeli PM, arms embargo", publisher: "Arab News / AFP", date: 2026-06-12, tier: 3}
      - {url: "https://buttondown.com/frontpageseu/archive/slovenia-foreign-policy-media-control-backlash/", title: "Slovenia: Foreign policy, media control backlash (press digest of Delo, Mladina, Dnevnik)", publisher: "FrontPages.EU", date: 2026-09-05, tier: 4}
  - to: org-nato
    layer: action
    type: incident
    summary: "On 4 Jul 2025 parliament voted 46-42 for a Levica resolution to hold a consultative referendum on raising defence spending to 3% of GDP by 2030; Golob answered that the choice was to pay NATO dues or leave and announced a NATO-membership referendum; the National Assembly cancelled the spending referendum on 18 Jul 2025."
    since: 2025-07-04
    until: 2025-07-18
    last_verified: 2026-10-12
    confidence: B
    sources:
      - {url: "https://www.defensenews.com/global/europe/2025/07/24/slovenia-scraps-defense-spending-vote-seeks-new-kit-with-eye-on-nato/", title: "Slovenia scraps defense-spending vote, seeks new kit with eye on NATO", publisher: "Defense News", date: 2025-07-24, tier: 3}
      - {url: "https://militaeraktuell.at/en/slovenia-nato-membership-suddenly-up-for-a-vote/", title: "Slovenia: NATO membership suddenly up for a vote", publisher: "Militär Aktuell", date: 2025-07, tier: 3}
  - to: org-nato
    layer: action
    type: agreement
    summary: "After the July 2026 Ankara summit (5% of GDP by 2035, of which 3.5% core defence) Prime Minister Janša committed Slovenia to reach 2% of GDP in 2026 through a revised budget and to follow the 2035 targets; on 14 Sep 2026 he said Slovenia strengthens its defence for its own security, not because NATO requires it."
    since: 2026-07-08
    until: null
    last_verified: 2026-10-12
    confidence: B
    sources:
      - {url: "https://www.gov.si/en/news/2026-09-14-prime-minister-janez-jansa-we-are-strengthening-our-defence-capabilities-to-ensure-slovenias-security/", title: "Prime Minister Janez Janša: We are strengthening our defence capabilities to ensure Slovenia's security", publisher: "Government of Slovenia", date: 2026-09-14, tier: 1}
      - {url: "https://www.gov.si/en/news/2026-07-08-prime-minister-janez-jansa-after-nato-summit-if-nato-did-not-exist-we-would-have-to-reinvent-it/", title: "Prime Minister Janez Janša after the NATO summit: if NATO did not exist we would have to reinvent it", publisher: "Government of Slovenia", date: 2026-07-08, tier: 1}
  - to: USA
    layer: action
    type: visit
    summary: "In June 2026 Janša met Viktor Knavs, Melania Trump's father, at the US 250th-anniversary event in Ljubljana; in September he attended the Trumps' reception for delegation heads at the UN General Assembly in New York and says he invited Trump to Slovenia, who promised to come (Janša's account)."
    since: 2026-06
    until: null
    last_verified: 2026-10-12
    confidence: B
    sources:
      - {url: "https://n1info.si/novice/slovenija/premier-jansa-donalda-trumpa-povabil-v-slovenijo-ta-mu-je-obljubil-da-jo-bo-obiskal/", title: "Prime Minister Janša invited Donald Trump to Slovenia, he promised to visit", title_original: "Premier Janša Donalda Trumpa povabil v Slovenijo, ta mu je obljubil, da jo bo obiskal", lang: sl, publisher: "N1 Slovenia", date: 2026-09, tier: 3}
      - {url: "https://n1info.si/novice/slovenija/jansa-prispel-v-new-york-s-soprogo-se-bo-udelezil-sprejema-pri-trumpu/", title: "Janša arrived in New York, with his wife he will attend the reception at Trump's", title_original: "Janša prispel v New York, s soprogo se bo udeležil sprejema pri Trumpu", lang: sl, publisher: "N1 Slovenia", date: 2026-09, tier: 3}
      - {url: "https://www.24ur.com/novice/slovenija/o-cem-sta-govorila-viktor-knavs-in-janez-jansa.html", title: "What Viktor Knavs and Janez Janša talked about", title_original: "O čem sta govorila Viktor Knavs in Janez Janša", lang: sl, publisher: "24ur.com", date: 2026-06, tier: 3}
  - to: RUS
    layer: action
    type: expulsion
    summary: "Two Russian illegals posing as Argentine citizens, arrested in Ljubljana in December 2022, pleaded guilty in a closed trial to espionage and fake documents and were sentenced on 30-31 Jul 2024 to 19 months (time served); banned for five years, they were flown to Moscow in the 1 Aug 2024 prisoner swap. One reported target was the EU energy regulator ACER, based in Ljubljana."
    since: 2022-12
    until: 2024-08
    last_verified: 2026-10-12
    confidence: B
    sources:
      - {url: "https://themoscowtimes.com/2024/07/31/slovenia-expels-russian-couple-convicted-of-spying-a85893", title: "Slovenia expels Russian couple convicted of spying", publisher: "The Moscow Times", date: 2024-07-31, tier: 3}
      - {url: "https://abcnews.go.com/International/wireStory/russian-couple-pleads-guilty-spying-charges-released-slovenian-112440094", title: "Russian couple pleads guilty to spying charges and are released from Slovenian prison on time served", publisher: "ABC News / AP", date: 2024-07-31, tier: 3}
      - {url: "https://sloveniatimes.com/40716/russian-spies-sentenced-to-prison", title: "Russian spies sentenced to prison", publisher: "The Slovenia Times", date: 2024-07, tier: 3}
  - to: org-un
    layer: action
    type: un_vote
    summary: "Elected member of the UN Security Council in 2024-25 with presidencies in September 2024 and December 2025; it tabled five draft resolutions, four on Gaza, of which only Resolution 2728 (March 2024) was adopted; voted for Palestine's full UN membership in April 2024 and was one of 77 co-sponsors of the General Assembly resolution that passed 143-9-25."
    since: 2024-01-01
    until: 2025-12-31
    last_verified: 2026-10-12
