    layer: objective
    type: influence_goal
    summary: "Brazil campaigns for a permanent seat on a reformed Security Council (the G4 with Germany, India and Japan) and for multilateral reform. Lula opened the 81st General Assembly debate on 22 September 2026, the tenth time he has done so; the speech was received with applause when he said Brazil 'doesn't fit in anyone's backyard' (press report). The specific reform proposals made on the day were not seen in the sources read."
