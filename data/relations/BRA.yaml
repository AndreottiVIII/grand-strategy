  - to: org-mercosur
    layer: objective
    type: influence_goal
    summary: "Brazil uses Mercosur as the vehicle for its trade opening: the EU agreement (Senate approval 4 March 2026, promulgation 17 March, provisional application 1 May) and the economic partnership negotiations with Japan launched on 30 June 2026, all inside the bloc and against the pull of Argentina's bilateral line. Bolivia and Paraguay attended the June summit in Paraguay where Lula met Paz and Kast."
