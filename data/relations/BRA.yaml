  - to: PSE
    layer: objective
    type: influence_goal
    summary: "Brazil pushes the creation of a Palestinian state through the UN: at the General Assembly in September 2025 Lula argued that the UN should have the same strength to create the Palestinian state that it had to create Israel, and the Foreign Ministry hoped the two-state conference convened by France and Saudi Arabia would bring more recognitions. Brazil has recognised Palestine since 1 December 2010 (dataset row)."
