  - to: VEN
    layer: objective
    type: influence_goal
    summary: "Brazil wants a say in Venezuela's transition and presents itself as the government that talks to whoever governs Caracas: after the US removal of Maduro in January 2026 Lula called the acting president Delcy Rodríguez and offered dialogue and cooperation. Mirror of the VEN side, same sources; the recognition reported by one outlet is not used."
    since: 2026-01
    until: null
    last_verified: 2026-10-16
    confidence: C
    sources:
