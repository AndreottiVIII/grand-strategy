    layer: alignment
    type: recognition
    summary: "On 4 January 2026 Brazil's acting foreign minister, Maria Laura da Rocha, said Brasilia recognises Delcy Rodríguez as head of state in Maduro's absence and opposes any territorial aggression; Lula called the US operation a grave affront to Venezuela's sovereignty and asked the UN for a strong response. This is recognition of a government, not of the state, and the Venezuelan card cites the same reports."
