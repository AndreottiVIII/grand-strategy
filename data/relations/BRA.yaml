    layer: action
    type: sanction
    summary: "China's beef safeguard: a 55% duty on imports above a country quota, on top of the 12% base rate; Brazil's quota is 1.106 million tonnes in 2026 (1.128 in 2027, 1.151 in 2028). Brazil had filled 65.4% of it by the end of May, and the 55% duty began on 30 September 2026 once the quota was reached (Reuters). China took 47.67% of Brazil's beef exports on average in 2025 (46.3% in January 2026); the beef association projects a fall of about 10% in 2026 exports, and packers halted output as the limit neared."
