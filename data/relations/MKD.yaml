from: MKD
relations:
  # ---------- objective ----------
  - to: org-eu
    layer: objective
    type: membership_goal
    summary: "Negotiating framework adopted in July 2022 on the basis of the French proposal, but no cluster opened; the Commission's 2025 Report records that no attempt was made to adopt the constitutional changes of the Council Conclusions of 18 July 2022. Von der Leyen and Mickoski agreed on 2 Oct 2026 'a first step' to break the deadlock."
    since: 2022-07-18
    until: null
    last_verified: 2026-10-12
    confidence: A
    sources:
      - {url: "https://enlargement-infohub.eu/wp-content/uploads/2025/11/north-macedonia-report-2025.pdf", title: "North Macedonia 2025 Report (SWD(2025) 753)", publisher: "European Commission", date: 2025-11-04, tier: 1}
      - {url: "https://www.eunews.it/en/?p=466721", title: "Von der Leyen in Skopje: a first step next week to break the deadlock", publisher: "Eunews", date: 2026-10-02, tier: 3}
  - to: BGR
    layer: objective
    type: recognition_denied
    summary: "Mickoski says there will be no constitutional amendment adding Bulgarians while he is prime minister unless Bulgaria first guarantees rights for the Macedonian community and the EU guarantees no further bilateral vetoes; on 28 May 2026 he said the government was ready to 'pay the price' of delayed accession. Sofia says it adds no condition to the 2022 proposal."
    since: 2024-06
    until: null
    last_verified: 2026-10-12
    confidence: B
    sources:
      - {url: "https://www.bta.bg/en/news/balkans/1053499-north-macedonia-pm-mickoski-sets-two-conditions-for-constitutional-amendments", title: "North Macedonia PM Mickoski sets two conditions for constitutional amendments", publisher: "BTA", date: 2026-01-29, tier: 3}
      - {url: "https://novinite.com/view_news.php?id=238709", title: "North Macedonia EU deadlock deepens as Mickoski hardens stance, opposition demands referendum", publisher: "Novinite", date: 2026-05-28, tier: 3}
      - {url: "https://www.bta.bg/en/news/balkans/1018537-pm-zhelyazkov-bulgaria-is-not-setting-new-conditions-for-republic-of-north-mace", title: "PM Zhelyazkov: Bulgaria is not setting new conditions for Republic of North Macedonia's EU path", publisher: "BTA", date: 2025-10, tier: 3}
  - to: BGR
    layer: objective
    type: recognition_sought
    summary: "Skopje's first condition for any amendment is that the Macedonian community in Bulgaria receives the rights guaranteed by international law and human-rights conventions; Mickoski said he was not asking for a change to Bulgaria's constitution. Foreign minister Mucunski in April 2026 asked for 'minimal reciprocity'."
    since: 2026-01-29
    until: null
    last_verified: 2026-10-12
    confidence: B
    sources:
      - {url: "https://www.bta.bg/en/news/balkans/1053499-north-macedonia-pm-mickoski-sets-two-conditions-for-constitutional-amendments", title: "North Macedonia PM Mickoski sets two conditions for constitutional amendments", publisher: "BTA", date: 2026-01-29, tier: 3}
      - {url: "https://www.novinite.com/view_news.php?id=238262", title: "North Macedonia FM sets conditions for progress with Bulgaria, citing trust and 'reciprocity'", publisher: "Novinite", date: 2026-04, tier: 3}
  - to: GRC
    layer: objective
    type: recognition_sought
    summary: "Mickoski and President Siljanovska-Davkova use 'Macedonia' in domestic speech while using the constitutional name abroad; Mickoski calls it a personal constitutional right and invites Athens to go to the International Court of Justice if it sees a breach. Athens calls it a 'flagrant violation' of the Prespa Agreement."
