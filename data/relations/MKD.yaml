  - to: BGR
    layer: alignment
    type: treaty
    summary: "Treaty of Friendship, Good Neighbourliness and Cooperation signed in August 2017 and ratified by Bulgaria on 18 January 2018, with a protocol and a joint commission on historical and educational issues; the Commission asks both sides to implement it in good faith."
