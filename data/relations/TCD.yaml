    layer: objective
    type: membership_goal
    summary: "Hold the Lake Chad front through the MNJTF with Cameroon and Nigeria, mandated against Boko Haram and ISWAP. The June 2026 preview says Chad has threatened to reduce or pull out; the membership objective is what the threat puts in question."
