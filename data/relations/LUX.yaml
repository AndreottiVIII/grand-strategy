from: LUX
relations:
  # ---------- objective ----------
  - to: FRA
    layer: objective
    type: influence_goal
    summary: Luxembourg wants the Cattenom nuclear plant in France closed (with Tihange and Doel in Belgium); the government opposes EDF's plan to run Cattenom past 40 years. Prime Minister Frieden kept the closure line in March 2024 while saying Luxembourg cannot impose its view on other countries.
    since: 2023
    until: null
    last_verified: 2026-10-12
    confidence: C
    note: "Closure line taken from the 2023-28 coalition agreement as reported by the press; the coalition agreement itself was not retrieved. Confidence C: tier-3 reporting."
    sources:
      - {url: "https://luxtoday.lu/en/technology-innovation-energy/nuclear-conflict-luxembourg-opposes-extension-of-cattenom-npp-operation", title: "Nuclear conflict: Luxembourg opposes extension of Cattenom NPP operation", publisher: "Luxtoday", date: 2026, tier: 3}

  # ---------- alignment (mirror of BEL.yaml: one treaty, same sources) ----------
  - to: BEL
    layer: alignment
    type: treaty
    summary: The Belgium-Luxembourg Economic Union (treaty of 25 Jul 1921, renewed in 1982, 1992 and a new convention in 2002) is the oldest tie and the forerunner of the Benelux Union; the three Benelux prime ministers also share a defence steering group.
    since: 1921-07-25
    until: null
    last_verified: 2026-10-12
    confidence: A
    sources:
      - {url: "https://gouvernement.lu/fr/actualites/toutes_actualites/communiques/2021/11-novembre/17-centenaire-uebl.html", title: "Centenary of the Belgium-Luxembourg Economic Union", title_original: "Centenaire de l'Union économique belgo-luxembourgeoise", lang: fr, publisher: "Government of Luxembourg", date: 2021-11-17, tier: 1}
      - {url: "https://www.rijksoverheid.nl/documenten/2025/09/10/benelux-prime-ministers-summit-joint-declaration-luxembourg-10-september-2025", title: "Benelux Prime Ministers Summit joint declaration, Luxembourg, 10 September 2025", publisher: "Government of the Netherlands", date: 2025-09-10, tier: 1}

  # ---------- dependency ----------
  - to: FRA
    layer: dependency
    type: remittances
    summary: About 129,000 salaried workers who live in France commute into Luxembourg, the largest group of the cross-border workforce (about 232,000 of about 494,000 salaried jobs, 47%, at end 2025). Typed as remittances because the vocabulary has no labour-flow type - these are wages earned in Luxembourg and spent in France.
    value: 129000
    unit: salaried_cross_border_workers_from_france_2025
    since: 2025
    until: null
    last_verified: 2026-10-12
    confidence: C
    note: "STATEC figures as reported by secondary coverage (Moovijob, citing STATEC); the STATEC tables were not accessed. A second STATEC aggregate (all workers, 522,200 in 2025) uses another denominator and is not mixed in here."
    sources:
      - {url: "https://en.moovijob.com/blog/article/a-look-back-at-the-key-figures-from-luxembourgs-labour-market-in-2025", title: "A look back at the key figures from Luxembourg's labour market in 2025 (STATEC figures)", publisher: "Moovijob", date: 2026, tier: 3}
