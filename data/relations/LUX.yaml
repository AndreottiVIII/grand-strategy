  - to: inst-govsat
    layer: dependency
    type: investment
    summary: The state holds half of LuxGovSat, the joint venture with SES that operates the military-grade satellites; the company pre-commits a block of its capacity to NATO. Each partner put in EUR 50m, and the company also took a EUR 125m bank loan for the first satellite (launched 31 Jan 2018). A follow-on satellite (GovSat-2) is being financed by the state; the figure is reported as EUR 301m (or USD 350m) over 12 years, which sources do not agree on.
    value: 50
    unit: eur_million_state_equity
    since: 2018-01-31
    until: null
    last_verified: 2026-10-12
    confidence: C
    note: "Equity figure from search summaries, not from the parliamentary text; to be checked against the government's GovSat-2 documents before use. The GovSat-2 figure is deliberately not written as a number because sources disagree."
    sources:
      - {url: "https://govsat.lu/?p=50", title: "Our Mission (LuxGovSat)", publisher: "LuxGovSat", date: 2026, tier: 3}
      - {url: "https://www.ses.com/press-release/ses-nato-ground-surveillance-contract-awarded-govsat", title: "SES: NATO ground surveillance contract awarded to GovSat", publisher: "SES", date: 2016, tier: 3}
  - to: RUS
    layer: dependency
    type: investment
    summary: Russian central-bank assets immobilised in Luxembourg, custodied mainly through Clearstream. The estimate of EUR 5.5bn is from an older Commission figure reported by Paperjam; a September 2025 Parliament figure of about EUR 10bn could not be retrieved. EU Regulation 2025/2600 (13 Dec 2025) immobilised the assets indefinitely; Luxembourg says it is not directly affected by the 2024 depository rules.
    value: 5.5
    unit: eur_billion_immobilised_russian_assets_lu_estimate
    since: 2025-12-13
    until: null
    last_verified: 2026-10-12
    confidence: C
    note: "Figures conflict across sources (EUR 5.5bn older Commission figure; about EUR 10bn in a Parliament briefing that was not retrieved; the Clearstream headline figure of EUR 68bn was not confirmed). The lower sourced figure is kept. Clearstream's own disclosures were not verified."
    sources:
      - {url: "https://en.paperjam.lu/article/russian-assets-worth-5-5bn-blo", title: "Russian assets worth 5.5bn blocked (Luxembourg)", publisher: "Paperjam", date: 2025, tier: 3}
      - {url: "https://www.mayerbrown.com/ja/insights/publications/2025/12/eu-fast-tracks-new-russia-and-belarus-sanctions-while-indefinitely-immobilizing-russian-sovereign-assets", title: "EU fast-tracks new Russia and Belarus sanctions while indefinitely immobilizing Russian sovereign assets", publisher: "Mayer Brown", date: 2025-12, tier: 3}

