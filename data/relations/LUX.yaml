  - to: UKR
    layer: action
    type: agreement
    summary: Ten-year bilateral security agreement signed by Prime Minister Frieden and President Zelensky on 10 Jul 2024 in Washington (consultation within 24 hours of an armed attack; intelligence and cyber training; defence-industry integration). Military aid - EUR 74.4m (2022), EUR 96m (2023), EUR 80m for 2024, rising to EUR 120m in 2025 according to Ukrainian sources.
    since: 2024-07-10
    until: null
    last_verified: 2026-10-12
    confidence: C
    note: "Two tier-3 sources agree on the signing; the aid figures are from the agreement text as reported by Ukrainian media and were not checked against Luxembourg's budget documents."
    sources:
      - {url: "https://www.pravda.com.ua/eng/news/2024/07/10/7465047", title: "Ukraine signs security agreement with Luxembourg", publisher: "Ukrainska Pravda", date: 2024-07-10, tier: 3}
      - {url: "https://www.chronicle.lu/category/abroad/50643-luxembourg-ukraine-sign-bilateral-security-cooperation-agreement", title: "Luxembourg and Ukraine sign bilateral security cooperation agreement", publisher: "Luxembourg Chronicle", date: 2024-07, tier: 3}
  - to: USA
    layer: action
    type: visit
    summary: Prime Minister Frieden made a working trip to Boston and then Ottawa in early February 2026; the French-language press framed it as a possible 'rupture' with the United States and a push to deepen ties with Canada.
    since: 2026-02
    until: null
    last_verified: 2026-10-12
    confidence: C
    note: "Exact dates and the government's own statement on the trip were not retrieved. Tier-3 press."
    sources:
