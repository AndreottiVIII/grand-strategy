from: PNG
relations:
  # ---------- objective ----------
  - to: CHN
    layer: objective
    type: influence_goal
    summary: "Wants Chinese capital for the economy (Belt and Road membership since 2018, the Ramu nickel mine) while keeping China out of the security sector: the Chinese policing deal was shelved in 2024."
    since: 2018
    until: null
    last_verified: 2026-10-16
    confidence: B
    sources:
      - {url: "https://www.everycrsreport.com/files/2025-09-11_IF11255_e300bc759d187773bb6c53acc1b0d7f6d3bb3940.html", title: "U.S.-Papua New Guinea Relations: Issues for Congress", publisher: "Congressional Research Service", date: 2025-09-11, tier: 1}
      - {url: "https://pina.com.fj/2024/02/08/png-rules-out-china-pact-as-pm-arrives-in-australia/", title: "PNG rules out China pact as PM arrives in Australia", publisher: "PINA", date: 2024-02-08, tier: 3}

  - to: AUS
    layer: objective
    type: influence_goal
    summary: "Seeks Australian security cover and police capacity: the Pukpuk treaty, Australian Federal Police advisers in the constabulary, and the funded NRL franchise are what Port Moresby asks of the partnership."
    since: 2025-10-06
    until: null
    last_verified: 2026-10-16
    confidence: B
    sources:
      - {url: "https://www.pm.gov.au/media/joint-communique-papua-new-guinea-and-australia-mutual-defence-treaty", title: "Joint communique - Papua New Guinea and Australia on a Mutual Defence Treaty", publisher: "Prime Minister of Australia (joint communique)", date: 2025-09, tier: 1}
