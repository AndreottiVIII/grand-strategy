  # ---------- alignment ----------
  - to: AUS
    layer: alignment
    type: treaty
    summary: "Pukpuk Mutual Defence Treaty, signed 6 Oct 2025 in Canberra: an armed attack on either country is a danger to both, and neither may enter arrangements with third parties that would undermine it. The first alliance for PNG, Australia's first in more than 70 years. Entry into force not confirmed in the sources read."
    since: 2025-10-06
    until: null
    last_verified: 2026-10-16
    confidence: B
    sources:
      - {url: "https://www.pm.gov.au/media/joint-communique-papua-new-guinea-and-australia-mutual-defence-treaty", title: "Joint communique - Papua New Guinea and Australia on a Mutual Defence Treaty", publisher: "Prime Minister of Australia (joint communique)", date: 2025-09, tier: 1}
