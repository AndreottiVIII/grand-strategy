    sources:
      - {url: "https://www.everycrsreport.com/files/2025-09-11_IF11255_e300bc759d187773bb6c53acc1b0d7f6d3bb3940.html", title: "U.S.-Papua New Guinea Relations: Issues for Congress", publisher: "Congressional Research Service", date: 2025-09-11, tier: 1}

  - to: AUS
    layer: action
    type: agreement
    summary: "Australia funds a Port Moresby NRL franchise due to enter in 2028, with about A$600 million over ten years. SBS reports the deal is conditional on Australia staying PNG's security partner of choice over China."
