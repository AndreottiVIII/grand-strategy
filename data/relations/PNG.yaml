  - to: USA
    layer: action
    type: agreement
    summary: "Defence Cooperation Agreement signed in May 2023, replacing the status of forces agreement; not an alliance. PNG's foreign minister puts US spending at over US$864 million over ten years; the US embassy says the agreement carries no dollar figure. Both claims are recorded, neither adopted."
    since: 2023-05
    until: null
    last_verified: 2026-10-16
    confidence: B
    sources:
      - {url: "https://www.everycrsreport.com/files/2025-09-11_IF11255_e300bc759d187773bb6c53acc1b0d7f6d3bb3940.html", title: "U.S.-Papua New Guinea Relations: Issues for Congress", publisher: "Congressional Research Service", date: 2025-09-11, tier: 1}
