  note: 'Until December 2025 the UAE was the second pillar of the coalition and the patron of the STC, which sat inside the PLC (al-Zubaidi was a vice-president). When the STC seized Hadramawt and al-Mahra, al-Alimi terminated the Joint Defence Agreement with the UAE, ordered all Emirati forces out within 24 hours (done by early January), expelled al-Zubaidi from the PLC (7 Jan) and charged him with treason; the Saudi coalition struck an Emirati-linked shipment at Mukalla on 30 Dec. The UAE denies backing any Yemeni party and the STC''s spokesman still speaks from Abu Dhabi. Rival, not `reluctant_ally`: no common framework remains in Yemen and the PLC treats al-Zubaidi as a traitor; not adversary: the aim is to remove Emirati influence, not the UAE. The Saudi-Emirati thaw of July-October 2026 and the UAE''s condemnation of the Houthi strikes on Saudi airports (see the UAE card) make the trend stable. The sources use ''rift'' and ''rivalry''. Bond - grievance: 2015-2025 comrades in arms ended by an expulsion.'
