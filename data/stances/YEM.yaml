  note: 'Mirrors Saudi Arabia''s own card (ally, same sources). De facto alliance rather than a treaty: the coalition has fought for the government since 26 Mar 2015, Riyadh pays salaries and grants (USD 347m budget grant, USD 90m salary package, USD 507m for projects in 2026), sponsors the units Abu Dhabi used to fund, and its aircraft cover the offensive of 4 Oct 2026, which al-Alimi called the work of ''a true partner''. Friction exists - Riyadh set a budget as a condition of aid, the 2023 roadmap came out of direct Saudi-Houthi talks, and the Sana''a Center asks Riyadh to act as partner rather than patron and to avoid indiscriminate air strikes - but it is voiced by analysts, not by the government, whose line is thanks; the structure is alliance, not `reluctant_ally`. Warming because Riyadh now owns the anti-Houthi side outright. Bond - affinity: neighbours with tribal and border ties (our reading).'
