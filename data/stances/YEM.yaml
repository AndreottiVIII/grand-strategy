  note: 'Each side seeks the other''s end. The government''s National Defence Council designated the Houthi movement a terrorist organisation on 23 Oct 2022, and on 4 Oct 2026 al-Alimi announced operations to retake every Houthi-held area including Sanaa, Hodeidah and Saada; the April 2022 truce unravelled in July-September 2026 (the Houthis blame government violations), the Houthis took Mokha, Mayyun and the Hanish islands in September and hold 73 UN staff. The grade is not rhetoric: this is the only actor on the card whose claim to the state excludes ours. Saudi Arabia grades the same movement `rival` (its own aim is to push the Houthis back, not to destroy them) - the asymmetry is deliberate, the Yemeni government cannot settle for less than the end of the Houthi authority. The sources use ''terrorist organisation'' (2022) and ''decisive phase'' (2026); ''adversary'' is our reading of the structure. The truce of 2022 and the prisoner agreement of 14 May 2026 show the line stays open; trend cooling because the war resumed in July-October 2026. Bond - grievance: civil war since 2014-15.'
