  note: 'The southern separatist movement that sat inside the PLC (al-Zubaidi was a vice-president) and in December 2025 seized Hadramawt and al-Mahra. The government expelled al-Zubaidi on 7 Jan 2026 and charged him with high treason, the STC announced its dissolution on 9 Jan (denied by its UAE-based spokesman), the Attorney General froze all STC funds on 17 Jun and Yemen''s UN envoy asked the Council to sanction al-Zubaidi; yet loyalists rallied in Aden on the founding anniversary (4 May) and said the movement would rename itself the Arab South Transitional Council. Rival, not adversary: the government wants it disbanded and disarmed and has taken the Giants Brigades onto its own side, but its southern base (and the promised dialogue) is something to be co-opted, not destroyed; the sources never grade it. The grade is our reading (confidence C) and moves to adversary if STC loyalists take up arms again. Bond - grievance: the December 2025 seizure and the Saudi-STC violence of January.'
