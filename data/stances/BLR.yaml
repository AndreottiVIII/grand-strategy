  - toward: LVA
    grade: rival
    trend: stable
    bond: none
    since: 2023-09
    last_verified: 2026-10-12
    confidence: C
    note: "Latvia suspended the Silene crossing on 19 Sep 2023 and kept it closed (Feb 2024 decision); more than 9,000 illegal-crossing attempts were stopped in 2026, a tunnel was found on 11 Aug 2026, and the Interior Ministry proposed on 4 Aug to suspend Paternieki, the last crossing, as a 'tool of hybrid pressure' - the government declined on 5 Aug. Latvia is a NATO frontline facing the same Belarusian methods as Poland and Lithuania, but there is no personal issue (no Tsikhanouskaya office, no seized trucks), hence stable and bond none. No source uses the word 'rival': our reading (confidence C)."
    sources:
      - {url: "https://www.lrt.lt/en/news-in-english/19/3011074/latvia-proposes-closing-the-belarus-border-to-the-general-public-and-freight-transport", title: "Latvia proposes closing the Belarus border to the general public and freight transport", publisher: "LRT", date: 2026-08-04, tier: 3}
