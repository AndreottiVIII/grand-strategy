    note: "Belarus hosts Russian nuclear weapons and Oreshnik as 'a deterrent against potential aggressors' (Lukashenko, Jun 2023), and Zapad-2025 included nuclear-use planning; NATO states have closed borders and Poland invoked Article 4 after the 9-10 Sep 2025 drone incursion. But Belarus is not at war with NATO and Lukashenko declares no aim to defeat it: rival, not adversary. No Belarusian source gives the grade; our reading (confidence C)."
