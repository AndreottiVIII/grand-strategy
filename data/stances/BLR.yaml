      - {url: "https://www.ktvh.com/world/europe/russian-drones-breach-nato-airspace-in-poland-prompting-alliance-response", title: "Russian drones breach NATO airspace in Poland, prompting alliance response", publisher: "AP", date: 2025-09-10, tier: 3}
