  - toward: POL
    grade: rival
    trend: warming
    bond: grievance
    since: 2020-08
    last_verified: 2026-10-12
    confidence: C
    note: "Poland is the NATO and EU frontline that sheltered the exiled opposition (Tsikhanouskaya moved her office to Warsaw in Feb 2026), the jailed Polish-Belarusian journalist Poczobut was the main hostage, and the 2021 migrant crisis, the 2023 Wagner scare and the Sep 2025 closure of all crossings during Zapad-2025 define the rivalry; Russian drones entered Polish airspace partly from Belarus on 9-10 Sep 2025. Warming because of the 28 Apr 2026 prisoner swap (Poczobut for the archaeologist Butyagin, brokered with Washington), the 17 Nov 2025 reopening of Kuznica and Bobrowniki, and Sikorski's call for a 'new stage' - he also warned of a 'false dawn'. No source uses the word 'rival': our reading (confidence C). Bond - grievance: the Poczobut case, the Polish minority and 2021."
    sources:
      - {url: "https://www.aljazeera.com/amp/news/2026/4/28/belarus-eyes-western-ties-as-it-frees-journalist-andrzej-poczobut", title: "Belarus eyes Western ties as it frees journalist Andrzej Poczobut", publisher: "Al Jazeera", date: 2026-04-28, tier: 3}
