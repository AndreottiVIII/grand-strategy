  - toward: USA
    grade: partner
    trend: warming
    bond: none
    since: 2025-09
    last_verified: 2026-10-12
    confidence: B
    note: "Transactional channel, not an alignment: Trump's phone call to Lukashenko in Aug 2025 (the first by a US president in his 31 years), envoy Coale's Minsk visits, and three rounds of prisoners-for-sanctions deals (Belavia and 52 freed in Sep 2025; potash and 123 in Dec 2025; banks, Finance Ministry, Development Bank, potash producers and 250 on 19 Mar 2026), with embassy reopening and a Lukashenko trip to the US discussed. It is partner and not ally because Belarus is also treaty-bound to the power Washington is confronting, and Carnegie warns that Trump's interest may fade. Bond - none: interests only; the US closed its embassy after the 2022 staging."
    sources:
      - {url: "https://carnegieendowment.org/russia-eurasia/politika/2025/08/belarus-usa-trump-benefits", title: "Belarus and the USA: what Trump and Lukashenko can get from each other", publisher: "Carnegie Politika", date: 2025-08, tier: 2}
      - {url: "https://www.lrt.lt/en/news-in-english/19/2872355/trump-envoy-says-us-seeks-improved-belarus-lithuania-ties-as-minsk-releases-more-prisoners", title: "Trump envoy says US seeks improved Belarus-Lithuania ties as Minsk releases more prisoners", publisher: "LRT", date: 2026-03-19, tier: 3}
      - {url: "https://euromaidanpress.com/2026/03/19/250-belarusians-freed-after-washington-lifts-sanctions/", title: "250 Belarusians freed after Washington lifts sanctions on banks and potash", publisher: "Euromaidan Press", date: 2026-03-19, tier: 3}

  - toward: CHN
    grade: partner
    trend: stable
    bond: affinity
    since: 2024-07-04
    last_verified: 2026-10-12
    confidence: B
    alignment: de_facto
    note: "Second trading partner after Russia (USD 8.85bn goods trade in 2025, about 11% of external trade, with a USD 5.53bn Belarusian deficit), SCO co-member since the Astana summit of 4 Jul 2024, Lukashenko twice in China in 2025 and a declared 'all-weather strategic partnership'. Partner, not ally: no security commitment, Great Stone's results are described as minimal, Chinese direct investment is a fraction of what goes to Russia, and China pushed Minsk to talk to Poland when Warsaw closed rail transit. Bond - affinity: anti-Western solidarity and an authoritarian model Minsk admires."
    sources:
      - {url: "https://nmn.media/yearbook/2026/en/page10.html", title: "Belarus - China relations: ambitious goals, dour achievements, uncertain outlook", publisher: "Belarusian Yearbook 2026", date: 2026-03, tier: 2}
