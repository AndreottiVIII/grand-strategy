actor: BLR
stances:
  - toward: RUS
    grade: ally
    trend: stable
    bond: kin
    since: 1999-12
    last_verified: 2026-10-12
    confidence: A
    note: "Treaty ally in the Union State, bound since the 6 Dec 2024 security-guarantees treaty (in force 2025: mutual defence, Russian nuclear umbrella over Belarus, support for each other's constitutional order) and host of Russian tactical nuclear weapons and the Oreshnik. Friction is real and visible - Lukashenko told Putin on 2 Oct 2026 he has 'my own understanding' of the war, Russia's SPOT shipment-confirmation system (Feb 2026) can complicate trade, Minsk's courtship of Washington - but the regime depends on Russia for markets, crude, loans (USD 800m deferred) and its own protection, so the structure is alliance, not 'reluctant' hedging. Bond - kin: shared language, Soviet history and a common-state project; Minsk presents it as brotherhood."
    sources:
      - {url: "https://kyivindependent.com/belarus-weekly-belarus-russia-ratify-security-pact-expanding-nuclear-umbrella-military-integration/", title: "Belarus Weekly: Belarus, Russia ratify security pact, expanding nuclear umbrella, military integration", publisher: "Kyiv Independent", date: 2025-03, tier: 3}
      - {url: "https://www.themoscowtimes.com/2026/10/02/lukashenko-vows-belarus-full-support-for-putin-on-ukraine-a93858", title: "Lukashenko vows Belarus' full support for Putin on Ukraine", publisher: "The Moscow Times", date: 2026-10-02, tier: 3}
      - {url: "https://isans.org/analysis/belarus-review/belarus-review-by-isans-june-1-2026.html", title: "Belarus Review by iSANS - June 1, 2026 (Lukashenko on SPOT)", publisher: "iSANS", date: 2026-06-01, tier: 2}

  - toward: UKR
    grade: rival
    trend: stable
    bond: none
    since: 2022-02-24
    last_verified: 2026-10-12
    confidence: C
    note: "Decided from evidence as rival, not adversary. Against adversary: Belarusian troops have not entered Ukraine and Lukashenko says they will not unless attacked (Moscow Times, 2 Oct 2026); Minsk has no declared aim to defeat Ukraine or change its regime; after Kyiv's complaint relay stations on Belarusian soil stopped operating from 22 Jun 2026 and rhetoric between the two eased (AP, Jul 2026). Against partner or neutral: Belarusian territory was the staging area of 24 Feb 2022 (missiles, the Chernobyl axis), it hosts the Russian forces and weapons Kyiv fortifies against along 1,084 km of border, and Minsk accuses Kyiv of daily drone violations (claims called 'absurd' by Ukraine's border service). Zelensky said in Nov 2025 that Lukashenko 'will pay'; Ukraine opened a Mission of Democratic Belarus in Kyiv on 27 May 2026. The pair is asymmetric on purpose: Kyiv's reading of Minsk is harsher than Minsk's of Kyiv. No source uses the word 'rival' - our reading of the structure (confidence C). Bond - none: the regime's language of brotherhood is rhetoric; the standing wound is Ukraine's, not Minsk's."
    sources:
      - {url: "https://www.themoscowtimes.com/2026/10/02/lukashenko-vows-belarus-full-support-for-putin-on-ukraine-a93858", title: "Lukashenko vows Belarus' full support for Putin on Ukraine", publisher: "The Moscow Times", date: 2026-10-02, tier: 3}
