  - toward: org-eu
    grade: rival
    trend: stable
    bond: grievance
    since: 2020-08
    last_verified: 2026-10-12
    confidence: C
    note: "Deliberately not the default 'partner for non-members': the EU runs a sanctions regime on Belarus (renewed 26 Feb 2026 until 28 Feb 2027: 312 persons, 57 entities, sectoral measures), does not recognise Lukashenko's legitimacy (Kallas, Jan 2025), calls the 2021 migrant push and the balloons hybrid attacks, and Lukashenko said he 'does not give a damn about the West'. Not an adversary: Minsk seeks normalisation (Macron call of 24 May 2026, Sakreta's diplomatic contacts), and 52% of Belarusians want it. No source uses 'rival'; our reading (confidence C). Bond - grievance: the 2020 crackdown, sanctions, the exile base in the EU."
    sources:
      - {url: "https://euneighbourseast.eu/news/latest-news/belarus-eu-prolongs-restrictive-measures-for-another-year/", title: "Belarus: EU prolongs restrictive measures for another year", publisher: "EU Neighbours East", date: 2026-02-26, tier: 1}
