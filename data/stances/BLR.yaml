  - toward: LTU
    grade: rival
    trend: cooling
    bond: grievance
    since: 2020-08
    last_verified: 2026-10-12
    confidence: C
    note: "Lithuania is Belarus's sharpest neighbour: it hosted Tsikhanouskaya's office since 2020, closed Klaipeda to Belarusian potash, is the veto-holder on the EU potash question (Budrys, 26 May 2026) and was the target of the smuggling balloons that shut Vilnius airport (Oct 2025, Jan and Apr 2026). It closed its last two crossings on 27-29 Oct 2025 until 20 Nov, and Minsk answered by holding Lithuanian trucks (about 200 still detained in May 2026) and by a EUR 12bn arbitration claim. Cooling, not adversary: the crossings reopened, Washington is pressing for better Belarus-Lithuania ties (Coale, Mar 2026) and Vilnius is divided on easing (47/46 in an LRT poll). No source uses the word 'rival': our reading (confidence C). Bond - grievance: sanctions on potash and the exile base."
    sources:
      - {url: "https://www.osw.waw.pl/en/publikacje/analyses/2025-10-30/lithuania-closes-its-border-belarus-a-month", title: "Lithuania closes its border with Belarus for a month", publisher: "OSW", date: 2025-10-30, tier: 2}
      - {url: "https://www.aa.com.tr/en/europe/lithuania-calls-for-tougher-sanctions-on-belarus-over-smuggler-balloons-seized-trucks/3752755", title: "Lithuania calls for 'tougher sanctions' on Belarus over smuggler balloons, seized trucks", publisher: "Anadolu Agency", date: 2025-11, tier: 3}
      - {url: "https://isans.org/analysis/belarus-review/belarus-review-by-isans-june-1-2026.html", title: "Belarus Review by iSANS - June 1, 2026", publisher: "iSANS", date: 2026-06-01, tier: 2}
