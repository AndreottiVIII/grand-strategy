  - toward: HUN
    grade: partner
    trend: stable
    bond: affinity
    since: 2025-01
    last_verified: 2026-10-12
    confidence: C
    note: "The one EU government that has shielded Minsk in Brussels: Hungary blocked a joint EU-member statement condemning the 26 Jan 2025 election, forcing Kallas to speak alone. Partner rather than ally: no treaty, and Hungary is in NATO and the EU, whose sanctions it implements. Single-source and one episode, hence confidence C. Bond - affinity: two leaders at odds with Brussels."
