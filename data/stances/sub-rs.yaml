    note: "Banja Luka's patron: the Agreement on Special Parallel Relations of 2006, renewed in spirit by the All-Serb Assembly declaration (8 June 2024, adopted by the RS Assembly on 2 July and by the Serbian parliament by 139 votes to 9) and by the RS Assembly's declaration of 7 July 2026 on deepening the relations 'including security'. Vucic after the conviction (Feb 2025): Serbia will always be with Republika Srpska; he rejected the appeals verdict on 1 Aug 2025. The alliance is de facto, not a treaty of mutual defence, and Belgrade's support is bounded (formal respect for Dayton, no endorsement of secession), hence 'ally' rather than a patron's blank cheque. Mirrors Serbia's own stance toward sub-rs; the pair is deliberately symmetric. Bond kin: nation, church, language."
