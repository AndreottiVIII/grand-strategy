  - toward: RUS
    grade: ally
    trend: stable
    bond: kin
    since: 2023-06
    last_verified: 2026-10-12
    confidence: B
    note: "No treaty, but a stable de facto alignment with visible content: a RS delegation at Putin's table on 9 May 2026 (Dodik, president Karan, Speaker Stevandic, premier Minic), Dodik's repeated Moscow trips under a Bosnian arrest warrant (April-May 2025), the Order of Alexander Nevsky conferred on Dodik in 2023 against the Order of Republika Srpska given to Putin, Russian state ownership of the entity's oil sector, Dodik's claim that the entity prevents Bosnia from joining sanctions on Russia (his assertion, unverified), and Moscow's call for the OHR's closure. No friction found; the pair RUS-sub-rs is deliberately asymmetric in structure (Moscow's priority is Serbia, not the entity). 'Ally' not 'partner' because the alignment is open and political, not transactional; since is the June 2023 decoration, the oldest dated act in the sources. The grade rests on the structure and no source uses the word 'ally' (confidence B on the evidence, the grade is our reading). Bond kin: Orthodox and Slavic identification."
    sources:
