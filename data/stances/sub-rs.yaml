  - toward: USA
    grade: partner
    trend: warming
    bond: grievance
    since: 2025-10-29
    last_verified: 2026-10-12
    confidence: B
    note: "From 2017 to 2025 Washington was the entity's sanctioner (Dodik designated in 2017 and again on 5 Jan 2022 under E.O. 14033; his children in Oct 2023; a financial network in Dec 2024); on 29 Oct 2025 OFAC removed Dodik, his family and associates - 48 persons and entities, including Cvijanovic and Speaker Stevandic - after a Western Balkans policy review and the entity's repeal of its laws, called a 'responsive measure'. Since then Dodik, Trisic-Babic and Cvijanovic were received in Washington (6 Feb 2026), and the entity's government has paid more than USD 4m to Trump-linked lobbyists. Transactional partner, not ally: no alignment, a bipartisan group in Congress asked on 27 Mar 2026 for the sanctions to be reimposed, and the State Department warned Sarajevo in June 2026 about Russian gas. Bond grievance: the eight years of sanctions (2017-25) on the entity's leaders. Mirrors BIH's reading of the lifting."
