  - toward: BIH
    grade: rival
    trend: stable
    bond: grievance
    since: 2025-02-27
    last_verified: 2026-10-12
    confidence: C
    note: "As Banja Luka sees the state: a framework it formally invokes (Dayton, the entity's powers) and works to hollow out - the laws of 27 Feb 2025 banned the State Court, prosecutors and police from the entity; the Constitutional Court suspended them on 7 March and annulled them in May; the Assembly repealed them on 18 Oct 2025; the 7 July 2026 declaration demands the competences back and the end of the High Representative's role. Not 'adversary': the entity's leadership does not call for the state's destruction in law and keeps its seat in the Presidency (Cvijanovic, re-elected 4 Oct 2026). Not 'own_territory': the entity is a part of the state, and the grade applies to the state institutions as the RS leadership sees them. No source uses the grade word (confidence C). Mirrors BIH's stance toward sub-rs (rival, cooling); the symmetry is deliberate. Trend stable because the escalation of 2025 was followed by a calculated retreat and a second electoral win. Bond grievance: the 1992-95 war and the entity's origin."
