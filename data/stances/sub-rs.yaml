    note: "The entity formally sits inside a candidate state and takes EU money and trade, but it resists alignment: it will not join sanctions on Russia, it keeps the veto-holders in Budapest and Bratislava on its side, and Dodik insulted the EU's foreign-policy chief after the verdict. The EU has answered with the Frontex and EUFOR instruments, with bilateral entry bans by Germany and Austria in 2025 (EU-level sanctions were blocked by Hungary), and with the statement that the appeals verdict 'is binding and must be respected'. Cooling because Orban's fall in April 2026 removes a veto-holder and the Commission's growth-plan money is conditional. No source calls it 'reluctant'; our reading of the structure (confidence C). Bond none."
