  note: 'Rival, not adversary, read from Kinshasa''s side. For adversary: the RDF fights inside the DRC alongside AFC/M23 (UN experts: 3,000-4,000 troops in 2024), took Goma and Bukavu in January-February 2025 with the rebels, the US sanctioned Minister Kabarebe (20 Feb 2025) and the RDF (2 Mar 2026), and the Congolese government calls Rwanda''s presence an invasion. Against: Kinshasa''s declared aim is the Rwandan withdrawal and the Washington framework, not the end of the Rwandan state; it signed the Washington framework (27 Jun 2025) and the Accords (4 Dec 2025) with Kigali, and its ceasefire complaints go to the Washington mechanism, not to a war aim. The same reading the RWA card gives from the other side, with the same sources. Bond grievance: the wars of 1996-2003 and the 1994 refugee camps. State of play, 14 Oct 2026: the US asked Rwanda to withdraw and end its M23 support.'
