- toward: UGA
  grade: reluctant_partner
  trend: stable
  bond: grievance
  since: 2021-11
  last_verified: 2026-10-16
  confidence: B
  note: 'Cooperates out of necessity while resisting alignment, read from Kinshasa''s side. Necessity: Operation Shujaa, the joint UPDF-FARDC campaign against the ADF, which the Congolese government accepted from November 2021. Resistance: the ICJ judgment of 9 February 2022 ordered Uganda to pay USD 325m for its 1998-2003 occupation (the first instalment was paid in September 2022), and the UN experts say Ugandan units shielded the M23 (July 2025; Uganda denies it). The UGA card reads the same pair from the other side with the same sources. Bond grievance: the ICJ case and the occupation. Later instalments, due from 1 September 2026, are not verified.'
