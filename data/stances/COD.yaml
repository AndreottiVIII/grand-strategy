  note: 'The former coloniser and still a main partner: a development programme of about EUR 50m a year (2023-27, as the BEL card reads it), and Belgian positions that defend the DRC''s territorial integrity against the M23 and urge an inclusive national dialogue. The wound is open: a Brussels court ruled on 17 March 2026 that Étienne Davignon will stand trial for the 1961 killing of Patrice Lumumba, a trial expected in 2027. Partner, not ally: no alignment or guarantee. Bond grievance: the colonial past, per the BEL card. Mirror: the BEL card reads the pair from Brussels'' side with the same sources.'
