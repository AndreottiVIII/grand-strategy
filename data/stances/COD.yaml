  since: 2025-01
  last_verified: 2026-10-16
  confidence: C
  note: 'Ally in the sense of a de facto military alignment: Burundian troops fight beside the FARDC in South Kivu (Reuters, January 2025), and refugees crossed from the DRC into Burundi after the M23 took Uvira in December 2025. No treaty or guarantee was found and no source uses the word ally, so the grade is our reading (hence C). Mirror: the BDI card reads the pair from Bujumbura''s side with the same sources, graded ally on the same reasoning. Bond none: nothing sourced names kinship or affinity. Gap: the 2023 start of the deployment and any 2025-26 withdrawal are not verified.'
