  confidence: C
  note: 'Partner, cooling, read from Kinshasa''s side (our reading, C). Tanzania''s contingent in the SADC mission SAMIDRC was withdrawn in phases from 29 April 2025, after the SADC leaders ended the mandate on 13 March 2025 and the M23 had taken Goma. The SADC withdrawal cools a commitment; it is not a dispute. Not hostile: the DRC is the largest user of the Dar es Salaam transit route, 7.77m tonnes of 14.61m in 2025/26 (about 53%, our arithmetic on Tanzanian figures), and the Dar route is the one Kinshasa''s imports rely on. Mirror: the TZA card reads the pair from Dodoma''s side with the same sources.'
