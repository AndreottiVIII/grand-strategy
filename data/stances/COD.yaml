- toward: nsa-m23
  grade: adversary
  trend: stable
  bond: grievance
  since: 2025-01
  last_verified: 2026-10-16
  confidence: B
  note: 'Adversary in the mortal sense, read from Kinshasa''s side, and the only adversary in this file. The test of the ontology is met on both sides: the AFC''s political leadership openly aims to topple the government in Kinshasa (its president Corneille Nangaa: ''our objective is neither Goma nor Bukavu but Kinshasa''), and Kinshasa''s court sentenced Nangaa to death in absentia in August 2025 (Crisis Group). The government''s aim is the rebels'' defeat and disarmament, not a settlement that keeps them. Confidence B: the aim is stated by the AFC and reported by Crisis Group and Reuters, while the Congolese aim is read from the Doha framework and the court sentence. Bond grievance: the M23 is the armed face of the 2009 CNDP integration deal that Kinshasa did not honour (our reading, not sourced here). Trend stable: the Doha roadmap of August 2026 has not ended the fighting.'
