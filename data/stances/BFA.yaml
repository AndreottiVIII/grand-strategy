  - toward: nsa-jnim
    grade: adversary
    trend: stable
    bond: grievance
    since: '2024-08'
    last_verified: '2026-10-16'
    confidence: C
    note: "Adversary is our reading, and no source uses the word. The structure is mortal: JNIM fights to take the state's territory and the junta fights to destroy the group, so each side's aim is the other's defeat. The Barsalogho attack (August 2024) is the dated marker; the start of the war is not dated here. Mirror: the BEN card's ACLED source says JNIM uses Tapoa and Kompienga provinces in Burkina Faso for raids into Benin; that is about the group's use of Burkinabe ground, not an act of the state. Bond grievance is our reading of an open war with massacres on both sides. Gaps: the Djibo attack is not verified (the search found only Barsalogho); the junta's own casualty figures are not published here."
