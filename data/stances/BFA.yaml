    note: "Burkina broke off diplomatic relations with France on 26 June 2026, through its communications minister, citing non-interference and accusing France of supporting 'subversive networks' and 'terrorists'. Paris called the move hostile and unfounded and is weighing reciprocal measures. The French foreign ministry's own statement was seen in search results but not opened; the Reuters copy was read. Rival, not adversary: both sides keep the break at state level and the junta says the people's ties stand. Bond grievance is our reading: the colonial past and the 2023 expulsion of French forces. The 2023 expulsion and the media bans are not sourced in this pass; the cooling since January 2023 rests on Wikipedia's citation of Reuters, not opened."
