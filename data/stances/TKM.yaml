actor: TKM
stances:
- toward: CHN
  grade: partner
  trend: warming
  bond: none
  since: 1992-01-06
  last_verified: 2026-10-12
  confidence: B
  note: "Largest buyer by far: more than three-quarters of Turkmen gas exports go to China through the Central Asia-China pipeline (OSW, 2023), and the 2026 production plan of about 76 bcm is again built around China (PGJ Online, April 2026). Diplomatic relations since 6 January 1992 (Wikipedia index; tier 4 pointer). Bond - none: pure interest; Ashgabat's neutrality keeps it from any Chinese bloc. Trend warming on the gas volume is our reading of the production plan; a 2025 fall of 7 per cent in Turkmen flows to China (Interfax, June 2025) is noted but does not reverse it."
  sources:
  - {url: "https://osw.waw.pl/en/publikacja/31766/pdf", title: "Centre for Eastern Studies analysis on Turkmen gas exports to China", publisher: "OSW (Centre for Eastern Studies)", date: 2023, tier: 2}
  - {url: "https://pgjonline.com/news/2026/april/turkmenistan-targets-76-bcm-gas-output-in-2026-as-exports-to-china-continue", title: "Turkmenistan targets 76 bcm gas output in 2026 as exports to China continue", publisher: "PGJ Online", date: 2026-04, tier: 3}
- toward: RUS
  grade: partner
  trend: stable
  bond: none
  since: 2019-04
  last_verified: 2026-10-12
  confidence: C
  note: "Transactional, with no alignment: Russia has an embassy in Ashgabat and Turkmenistan one in Moscow, but Turkmenistan is outside the CSTO and keeps its neutrality. Gas is the only thick tie: Gazprom stopped buying in January 2016 over price and resumed in April 2019 (IntelliNews, tier 3). We found no 2025-2026 report of Gazprom volumes from Turkmenistan, so the gas status today is unverified. Russia is the former colonial power, but Soviet history is not a standing tie in Ashgabat's own framing, hence bond none. Grade is structural (no treaty, no troops), not rhetorical."
  sources:
  - {url: "https://www.intellinews.com/russia-restarts-turkmen-gas-imports-after-3-year-stoppage-159716", title: "Russia restarts Turkmen gas imports after 3-year stoppage", publisher: "bne IntelliNews", date: 2019-04, tier: 3}
  - {url: "https://en.wikipedia.org/wiki/Foreign_relations_of_Turkmenistan", title: "Foreign relations of Turkmenistan (pointer only: Russia ceased buying in 2016, resumed small purchases in 2019)", publisher: "Wikipedia", date: 2026, tier: 4}
- toward: IRN
  grade: partner
  trend: stable
  bond: none
  since: 1992-02-18
  last_verified: 2026-10-12
  confidence: B
  note: "A gas-for-gas swap: Turkmen gas goes to Iran and an equal amount of Iranian gas reaches Turkey. The BOTAS-Turkmengas deal of 10 February 2025 started on 1 March 2025 (S&P Global, March 2025), with 1.3 bcm expected by end-2025. The Iran cut-off of 2017 over arrears (Wikipedia, tier 4 pointer) shows the limit of the tie. Caspian boundary tension and Iran's theocracy keep it from friendship (Wikipedia index). Bond none: a joint Körpeje-Kordkuy pipeline and the Dostluk dam are interest, not kinship. Trend stable: the swap is the same logistics as before."
  sources:
  - {url: "https://www.spglobal.com/commodity-insights/en/news-research/latest-news/natural-gas/030325-turkey-begins-receiving-gas-from-turkmenistan-under-iran-swap-deal-minister", title: "Turkey begins receiving gas from Turkmenistan under Iran swap deal", publisher: "S&P Global Commodity Insights", date: 2025-03-03, tier: 3}
  - {url: "https://daryo.uz/en/2025/02/12/turkiye-and-turkmenistan-seal-natural-gas-deal-to-boost-energy-cooperation-1209968/", title: "Türkiye and Turkmenistan seal natural gas deal to boost energy cooperation", publisher: "Daryo", date: 2025-02-12, tier: 3}
- toward: UZB
  grade: partner
  trend: stable
  bond: affinity
  since: 1993-02-07
  last_verified: 2026-10-12
  confidence: B
  note: "The gas customer next door: Turkmenistan supplies up to 2 bcm a year to Uzbekistan under the 2023 agreement. Frictions are real and old: the Amu Darya water sharing and the shared Kokdumalak condensate field (Jamestown, older analysis). We found no 2025-2026 report of a water or border agreement. Bond - affinity: Turkic, Central Asian and Muslim, sympathy without a shared state project. Trend warming on the gas track only."
  sources:
  - {url: "https://beta.kun.uz/en/news/2023/08/25/turkmenistan-to-supply-up-to-2-billion-cubic-meters-of-gas-to-uzbekistan-per-year", title: "Turkmenistan to supply up to 2 billion cubic meters of gas to Uzbekistan per year", publisher: "Kun.uz", date: 2023-08-25, tier: 3}
