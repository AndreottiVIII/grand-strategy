- toward: AFG
  grade: partner
  trend: warming
  bond: none
  since: 2024-09
  last_verified: 2026-10-29
  confidence: C
  note: "Work on the TAPI pipeline in Herat resumed in September 2024, and Turkmen officials expect the 130-km Herat segment by end-2026. Ashgabat has not recognised the Taliban state but has let the Taliban appoint diplomats to the Afghan embassy in Ashgabat (Eurasianet, 2022, cited in Wikipedia, not opened). Bond none: a transit and gas relationship with no shared identity. Trend warming: the pipeline is physical progress and the Taliban are the host; the security of the border is the open risk."
