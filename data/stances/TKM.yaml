- toward: USA
  grade: partner
  trend: warming
  bond: none
  since: 1992-04-10
  last_verified: 2026-10-12
  confidence: B
  note: "Serdar Berdimuhamedov attended the Central Asia plus US summit in Washington in early November 2025 (dates vary by source, 6-7 November), met the US President separately and adopted two statements of intent on economic cooperation and cultural heritage. Turkmen state media frame the trip as positive neutrality (official statement, tier 1 for the statement only). The open disagreement is on reform: Washington has pressed privatisation and market opening, which Turkmenistan has not adopted (Wikipedia index, tier 4 pointer). Bond none: pure interest. Trend warming on the summit track only."
