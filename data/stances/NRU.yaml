  confidence: B
  note: "Ally by treaty, not by defence. The December 2024 treaty gives Australia a say over Nauru's security, banking and telecommunications: no third-party engagement without Canberra's agreement. The ontology's own test for ally is a treaty, and the grade is Nauru's view of its own position, not Australia's. Australia's card reads the same treaty as partner ('not an alliance', no mutual defence); that is its reading of its side, and the two grades can differ. No source calls the relation reluctant, so reluctant ally is not used. Bond none: the tie is money and a veto, with no kinship, affinity or open grievance in the sources. Trend warming: the treaty was signed in December 2024 and the August 2025 memorandum extended it to the NZYQ cohort. Confidence B: one tier-2 and one tier-3 report of the treaty (ASPI, PINA), the treaty text not read; the 2025 memorandum rests on tier-3 press."
