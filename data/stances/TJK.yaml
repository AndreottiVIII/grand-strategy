  note: 'Normalisation after the 2009-16 embargoes: Mirziyoyev''s 2018 visit reopened ten border crossings and the Termez-Bokhtar railway (9 Mar 2018), and Uzbekistan dropped its opposition to Rogun. Since
    then it is a treaty partner (Treaty on Allied Relations, 18 Apr 2024, not a defence pact) and a power and transit partner. The 2025 Kyrgyz-Tajik border settlement was credited to Tashkent''s mediation
    (UZB card). Bond - none: pure interest in water, power and transit, not kinship. Trend warming from the 2016-18 low; no source calls it a rivalry now (grade by structure, not rhetoric).'
