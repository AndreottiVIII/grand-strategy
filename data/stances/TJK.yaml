- toward: KGZ
  grade: partner
  trend: warming
  bond: grievance
  since: 2021
  last_verified: 2026-10-12
  confidence: B
  note: 'Border clashes in 2021 and 2022 left scores dead and thousands displaced (sources differ on the scale; they were a series of clashes rather than one war). The Treaty on the Kyrgyz-Tajik State Border,
    signed in Bishkek on 13 Mar 2025 with 16 documents during Rahmon''s visit, ratified by Kyrgyzstan in June-July 2025, and the first border pillars installed on 14 Jul 2025, make Bishkek a partner now.
    No alignment treaty; Tajikistan keeps its CSTO and Russian ties. Bond - grievance: the 2021-22 clashes, the closed frontier and the Vorukh enclave. Trend warming since the March 2025 treaty; if the
    demarcation stalls, the grade should be read again.'
