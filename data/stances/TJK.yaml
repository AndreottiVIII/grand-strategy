  note: 'Treaty alignment: the CSTO (dataset floor, replaced here by the reading) and the 201st base, under a lease agreed in October 2012 to at least 2042, with about 7,000 Russian troops. Friction is
    visible but does not change the structure: Dushanbe protested the treatment of its citizens in Russia after the Crocus attack (March 2024) and advised them in April 2024 to avoid travel unless necessary,
