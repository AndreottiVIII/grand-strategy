- toward: AFG
  grade: rival
  trend: stable
  bond: grievance
  since: 2021-08-15
  last_verified: 2026-10-12
  confidence: B
  note: 'Dushanbe was the only neighbour to oppose the Taliban''s return publicly, and no recognition of the Emirate was found in any source held. Friction is real: a firefight at the Panj River on 24 Aug
    2025 (the first direct armed encounter with the Taliban since 2021), further clashes in October and December 2025, and attacks that killed Chinese workers in November 2025. Its soil hosts the NRF leadership
    (mostly ethnic Tajiks), and UN monitors (February 2025) found Jamaat Ansarullah camps in the Afghan north-east. No stated aim of ending the Taliban state, so rival, not adversary. Bond - grievance:
    the Tajik Taliban question and the Panjshir resistance. Trend stable.'
