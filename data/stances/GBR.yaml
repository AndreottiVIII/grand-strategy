    is alliance. But the friction is now visible and two-sided: London refused the US the use of its bases for the first strikes on Iran (28 Feb 2026; Diego Garcia then opened for ''specific and limited
    defensive purposes'') and Trump said the relationship was ''obviously not what it was''; the UK paused Caribbean intelligence sharing in Nov 2025 over the boat strikes; Washington has withheld consent
    on Chagos; a leaked Pentagon email in April 2026 suggested a review of the Falklands position (the State Department then said ''neutrality''); the IEEPA tariffs fell in Feb 2026 and Section 301 action
    naming the UK followed on 23 Jul. Diplomats quoted in the press call the relationship ''very damaged''; Burnham met Trump at the UN on 22 Sep 2026 and both described it warmly, while Burnham says he
    will call Trump out when Britain''s interest requires. Reluctant ally because the dependency (Trident, F-35A, GPS and intelligence) keeps the UK aligned against its present preference. Bond - affinity:
    language, history, intelligence and nuclear kinship; no grievance.'
