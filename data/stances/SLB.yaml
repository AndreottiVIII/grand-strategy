- toward: CHN
  grade: partner
  trend: cooling
  bond: none
  since: 2019-09
  last_verified: 2026-10-12
  confidence: B
  note: 'Argued grade: not an ally, although the 2022 security pact is a treaty. Its text was not published, and the Wale government (since 15 May 2026) has said it will review the pact under a nondisclosure clause. The 2023 police deal and the US$66 million Huawei loan are transactional. Beijing calls the policing cooperation a positive contribution and says it will work with the new government; that is rhetoric, so it does not move the grade. Bond none: no kinship, no sympathy cited in sources (the "look north" policy is in the index only, so affinity is not recorded). Trend cooling from the change of government. The since date follows the September 2019 switch from Taipei. CSIS calls China the closest security partner (via the Business Standard mirror).'
