- toward: USA
  grade: partner
  trend: warming
  bond: none
  since: 2023-01
  last_verified: 2026-10-12
  confidence: B
  note: 'Transactional. The US embassy in Honiara reopened in early 2023 (official effective date 27 January, public ceremony 2 February), framed by Washington as a response to China. The shiprider agreement signed in Honiara in late July 2026 lets Solomon officers board designated US Coast Guard vessels in the EEZ; the government says it has no nondisclosure clause and the text will be published, and the opposition leader Manasseh Sogavare says it could compromise sovereignty. Bond none: no kinship or grievance cited.'
