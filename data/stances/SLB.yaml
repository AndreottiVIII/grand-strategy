- toward: TWN
  grade: rival
  trend: stable
  bond: none
  since: 2019-09
  last_verified: 2026-10-12
  confidence: C
  note: 'Honiara ended recognition of Taipei in September 2019 and sided with Beijing. In 2025 it kept Taiwan out of the Forum with all partners; CSIS reads that as a probable compromise shaped by Chinese pressure, and Taiwan is the excluded party. Our reading, not a source word: competing interests and friction, with no will to destroy, so rival and not adversary (confidence C, as with the Kosovo card). Malaita is not counted: its premier said the province refused a Beijing bribe (2021) and the province pushed for independence over China (2020), but no source ties that resistance to Taiwan.'
