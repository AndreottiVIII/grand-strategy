- toward: PNG
  grade: partner
  trend: warming
  bond: kin
  since: 2025-09
  last_verified: 2026-10-12
  confidence: C
  note: 'No alliance. Leader-level talks in August 2025 and updated border frameworks finalised in Honiara in September 2025, which keep traditional rights for border communities. Bond kin is our reading: the border is shared by communities, and the Choiseul provincial premier has said his province intends to join PNG autonomous region once Bougainville becomes a state, so the Melanesian neighbour is not treated as foreign. The sources do not use the word kin (confidence C). Bougainville leaders recommended 1 September 2030 as the independence date in July 2026; that question stays with PNG.'
