  confidence: B
  note: 'A bilateral security treaty (August 2017, after RAMSI ended in 2017) makes this an alignment, with visible friction: DFAT lists several disagreements, including the Julian Moti affair and the 2022 Chinese security pact, and AP reported that Manele resisted closer ties. Warming since the December 2024 police package (announced, not signed, per the PM transcript) and the June 2026 Wale-Albanese agreement to negotiate a comprehensive strategic treaty, which both governments called a reset. Bond none: no shared identity or open wound is cited in these sources; RAMSI is not treated as a grievance here.'
