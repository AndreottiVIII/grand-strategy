  note: 'Cooperation out of dependence, without alignment: no treaty of alliance is in our sources. Russia supplies about 95% of petroleum products (ministry figure, end 2025), and Mongolia signed a memorandum of intent with Gazprom in August 2025 and a legally binding memorandum on the Power of Siberia 2 transit route on 2 Sep 2025 (gas of 50 bcm a year for 30 years, price not agreed). Putin visited Ulaanbaatar on 3 Sep 2024 despite the ICC warrant, and Mongolia did not arrest him. Trend stable: the transit deal and the visit point up, the fuel dependence and the 2026 supply crisis point down. Since is the date of the latest dated move, not the start of the relation (not sourced). Bond - affinity, our reading: no shared identity claim, a Soviet-era protector and a neighbour with Buddhist and Buryat ties. Confidence B: one tier-1 ministry statement and tier-3 reporting.'
