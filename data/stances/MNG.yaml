  note: 'Transactional and structural: China takes about 91-92% of exports (91.9% in Jan-May 2025, 91.2% in Jan-Sep 2025, secondary summaries of customs and central-bank data; the NSO release was not retrieved), coal is about 46-48% and copper about 35-37% of exports in the same months. The Ganqimaodu-Gashuunsukhait rail link was signed and ratified on 14 Feb 2025 and track-laying began on 1 Sep 2025 (completion targeted 2027). Mongolia does not align with Beijing: there is no treaty of alliance in our sources, and the government''s concern for its language and script is kept mostly in domestic policy. Grievance is the bond in the live wound of the 2020 Inner Mongolia Mandarin-schooling protests, which Mongolia watches for its own script and language. Confidence C: tier-3 and secondary figures only. The grade is partner not reluctant partner: no source in our set uses the word reluctant for this pair.'
