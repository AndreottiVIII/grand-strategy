  note: 'The third neighbour in use: PM Oyun-Erdene met Vice President Harris at the White House on 2 Aug 2023 and called the US an important strategic third neighbour, with cooperation pledged on security, space and critical minerals including rare earths (an MoU of June 2023 between the mining ministry and the State Department). The Open Skies aviation agreement was signed on 4 Aug 2023, letting the national carrier MIAT fly direct to a US airport. Partner, not ally: the pledges are economic and transactional. No 2025 or 2026 US visit was found in the sources, so the warming rests on 2023 alone. Bond - none: pure interest. Confidence C: tier-3 reporting only.'
