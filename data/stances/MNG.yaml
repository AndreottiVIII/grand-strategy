  note: 'Labour and investment, transactional. About 54,800 Mongolians lived in South Korea at the end of 2023, the 11th-largest foreign group (about 4,600 under the Employment Permit System, about 18,500 undocumented; the two totals in the same presentation differ by a thousand). A 2016 state visit agreed 14 projects worth about 4.49 billion USD (urban development, power, rail, transmission). A Korean supply deal for oil products is reported as signed (tier-4 commentary), the fuel diversification away from Russia being the new use of the tie. Relations since 26 Mar 1990 (Mongolian foreign ministry list, date only). Bond - none. Confidence C: older reporting and one 2024 presentation.'
