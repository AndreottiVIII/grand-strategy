  confidence: B
  note: 'The EU is partner for a non-member under the ontology, even though Liechtenstein is inside the EEA (since 1 May 1995) and an associate of Schengen (since December 2011): the EEA is recorded as a treaty row, not as an ally grade. Liechtenstein adopts most EU single-market rules and follows EU sanctions through the EEA. Bond - none: interest-based membership, no sympathy or kinship claimed in the sources.'
