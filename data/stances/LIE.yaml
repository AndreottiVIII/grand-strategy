  note: 'Diplomatic relations since 10 Feb 1997 and a 2014 FATCA agreement signed in Vaduz to keep access to US capital markets. Structurally transactional: the state accepts US tax and sanctions demands to keep its financial centre working, and in 2025 US secondary-sanctions pressure pushed fiduciaries out of Russian-linked trusts. Trend stable, not cooling: Vaduz still complies rather than resists. Bond - none: pure interest, nothing underneath. No source uses the word "partner" for this pair; the grade is our reading (confidence C).'
