  note: 'Diplomatic relations since 6 Feb 1992. Support is financial and diplomatic, not military: CHF 8 million for rapid recovery and CHF 800,000 for EBRD capital announced in April 2025 (figures as reported by the Ukrainian government), a Council of Europe contribution of CHF 115,000 signed 13 Nov 2025, and an honorary consulate opened in Vaduz in June 2024. Ukraine\'s foreign minister praised the "consistent backing" in January 2026: that is Kyiv\'s statement, tier 1 for the statement, not for the grade. Warming because the 2025 funding and ministerial contacts are new. Bond - affinity: sympathy for a state under attack, no kinship.'
