  confidence: B
  note: 'Customs union in force since 1924 and franc currency since 1920, with Switzerland representing Liechtenstein abroad unless Vaduz chooses otherwise (treaty-based, so the grade is "ally" in the ontology sense). No defence guarantee: the Federal Council reaffirmed in February 2025 that Switzerland would not defend Liechtenstein directly. Bond - affinity: shared language and a shared neutrality tradition; the sources do not describe kinship, so the bond is our reading.'
