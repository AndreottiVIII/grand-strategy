  note: 'Neighbour with no treaty of alliance and no defence tie. Courts are modelled on Austrian rules and police training runs partly in Austria, but Liechtenstein is left out of the Swiss-Austrian air-policing arrangement. The grade is our reading of a transactional neighbourhood (confidence C): no source uses the word "partner" for this pair. Bond - affinity: shared German-speaking legal and cultural space, not kinship.'
