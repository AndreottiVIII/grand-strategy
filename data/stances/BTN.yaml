actor: BTN
stances:
- toward: IND
  grade: ally
  trend: warming
  bond: affinity
  since: 2007-03-02
  last_verified: 2026-10-12
  confidence: A
  note: 'The 2007 Friendship Treaty (signed 8 Feb 2007, in force 2 Mar 2007) replaced the 1949 treaty and removed the clause that Bhutan follow India''s advice on external relations; Article 2 bars either side from letting its territory be used against the other. That is a treaty alignment, hence ally. Warming: the 2024 Modi visit with INR 10,000 crore for the 13th Plan, the Punatsangchhu-II completion (2025), the Kokrajhar-Gelephu rail approval (Sept 2025). Friction is structural, not open: Doklam 2017 (India halted the PLA road in June, citing a request from Bhutan and its own security concerns; Bhutan protested the road, India''s and China''s statements did not name Bhutan). The ngultrum is pegged at par to the rupee. Bond - affinity: no kinship, but sympathy and a long protected-state history, not shared identity.'
  sources:
