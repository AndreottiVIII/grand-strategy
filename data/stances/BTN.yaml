- toward: NPL
  grade: neutral
  trend: stable
  bond: grievance
  since: 1992
  last_verified: 2026-10-12
  confidence: C
  note: 'Relations established 1983 and tense since 1992 over the repatriation of Nepali-origin refugees from Bhutan (107,000 in seven camps in south-east Nepal, with resettlement offers from the US for 60,000 and six other countries for 10,000 each). The grade is neutral, not rival: there is no competing interest in play today, only a legacy. Bond - grievance: the expulsions of the 1990s are the open wound. Source is the Wikipedia index only (tier 4); the refugee figures and the 1992 date need a primary source before this stance is raised.'
  sources:
    - {url: "https://en.wikipedia.org/wiki/Foreign_relations_of_Bhutan", title: "Foreign relations of Bhutan (index only, citations not followed)", publisher: "Wikipedia", date: 2026-10-12, tier: 4}
- toward: BGD
  grade: partner
  trend: stable
  bond: affinity
  since: 1971
  last_verified: 2026-10-12
  confidence: C
  note: 'Transactional, not aligned. Bhutan was the first country to recognise Bangladeshi independence (1971) and has a resident embassy in Thimphu, one of only three. The cooperation on the table is hydropower through India: the trilateral MoU with Bangladesh and India (Dorjilung, 1,024 MW in one version) was reported as endorsed by Bhutan and Bangladesh while India''s consent was still awaited, and the Bhutanese ambassador in Dhaka described it as still in discussion. No signed deal found. Bond - affinity: shared SAARC and BIMSTEC membership and the 1971 recognition, not kinship. Sources are the Wikipedia index (tier 4) and one undated Bhutanese report, hence C.'
  sources:
    - {url: "https://en.wikipedia.org/wiki/Foreign_relations_of_Bhutan", title: "Foreign relations of Bhutan (index only, citations not followed)", publisher: "Wikipedia", date: 2026-10-12, tier: 4}
