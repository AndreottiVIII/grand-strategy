- toward: USA
  grade: neutral
  trend: stable
  bond: none
  since: 2025
  last_verified: 2026-10-12
  confidence: C
  note: 'No diplomatic relations; the two sides describe warm informal relations and consular ties, and the US embassy in New Delhi is accredited to Bhutan (Wikipedia index). The 2025 contact found is the 10% baseline tariff on Bhutanese exports, which an ADB economist put at about 0.1% of GDP; Thimphu imposed no counter-tariff. Dated to 2025 because that is the first dated action in our sources; the relation itself has no start date in them. Neutral because there is no significant posture, rather than partner, since no transactional arrangement exists. Bond - none: pure interest, nothing underneath. US resettlement of Nepali-origin refugees (1990s-2000s) is the historic tie, not a current one. The US 2025 contacts beyond the tariff were not found.'
  sources:
    - {url: "https://en.wikipedia.org/wiki/Foreign_relations_of_Bhutan", title: "Foreign relations of Bhutan (index only, citations not followed)", publisher: "Wikipedia", date: 2026-10-12, tier: 4}
