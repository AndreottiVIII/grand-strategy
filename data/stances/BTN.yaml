- toward: org-eu
  grade: partner
  trend: warming
  bond: none
  since: 2025
  last_verified: 2026-10-12
  confidence: B
  note: 'Transactional cooperation without alignment, which the ontology calls partner for a non-member of the EU. Official evidence: the 13th Annual Consultations between Bhutan and the EU held in Thimphu on 22 Apr 2025, and EU grants (EUR 31m 2021-24 per the EU portal; the EEAS gives EUR 11m for 2025-27 where the portal gives EUR 17m, so the figures conflict and are not used as numbers here). Most EU money is loans and guarantees (an EIB framework loan for mini-hydro and solar). Warming: dated to the 2025 consultations; the start of the relation is not in our sources. Bond - none.'
  sources:
