  note: 'Russia is still Armenia''s treaty ally on paper (CSTO membership, which the dataset turns into an ''ally'' floor; the 1997 friendship treaty; the 102nd base in Gyumri, lease to 2044) and its largest
    trading partner (35.5% of foreign trade), gas monopolist and remittance source. In structure it is no longer an alliance: the CSTO has been frozen since February 2024, Pashinyan says Armenia will not
    return in the next five years and that he would be ''very pleased'' to be expelled, Russian border guards left Zvartnots on 31 Jul 2024, Russia''s share of arms procurement fell from over 96% to about
    10%, Pashinyan says ''we are not Russia''s allies on Ukraine'' and that the Gyumri base ''adds nothing'', and Moscow answers with import bans (spring 2026), a notified threat to denounce the gas agreement
    (27 May 2026) and Medvedev''s ''second Ukraine'' (Oct 2026). Carnegie reports Putin now deals with Pashinyan ''as a partner, albeit a problematic one, not as an ally''. Hence ''partner'' (transactional,
    unaligned) rather than ''reluctant_ally'' or ''rival''. Bond - grievance: the lasting wound is Russia''s non-intervention in 2021-23 and the Karabakh loss, laid on top of deep economic and human ties
    (a large diaspora and workers in Russia). Armenia is not Russia''s mortal enemy and Russia is not Armenia''s.'
