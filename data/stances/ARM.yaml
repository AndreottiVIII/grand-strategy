  note: 'Until 2023 the pair was the ontology''s reference case of ''adversary''. Since the loss of Nagorno-Karabakh (offensive of 19-20 Sep 2023, more than 100,000 people fled in ten days) Yerevan has
    accepted Baku''s terms: treaty text agreed 13 Mar 2025, initialled in Washington on 8 Aug 2025, Minsk Group dissolved on 1 Sep 2025, transit ban lifted 21 Oct 2025, Pashinyan saying in October 2026
    that ''peace is established''. Not ''partner'' because the treaty is unsigned and conditional on a constitutional referendum, 19 Armenians are in Baku''s prisons (Vardanyan, 20 years, Feb 2026), the
    Shaki shooting of Oct 2026 is open, and the Armenian opposition calls the preamble demand imposed by Baku. Not ''adversary'' because Armenia seeks recognition of borders, not Azerbaijan''s defeat. Asymmetry
    risk: Baku is likely to grade Armenia lower than ''rival'' warming; its card is not yet written. Serbia''s card grades Azerbaijan ''partner'' (strategic partners, defence contract, gas); it holds nothing
    on Armenia, so there was nothing to mirror for this pair.'
