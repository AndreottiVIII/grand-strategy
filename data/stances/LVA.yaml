  - toward: USA
    grade: ally
    trend: cooling
    bond: affinity
    since: 2004-03-29
    last_verified: 2026-10-12
    confidence: B
    note: "NATO Article 5 is the floor and the Latvian government says it has 'no doubt' the US would come to help (Defence Minister Sprud, 23 Apr 2026), while buying six HIMARS and ATACMS munitions (about USD 180m, from 2027). Cooling is on Washington's side, not Riga's: relations between the US and its allies were at a 'historic low' in April 2026, Washington warned Nordic and Baltic buyers of delays to approved weapons, and the Pentagon's posture review left Lithuania and Estonia with rotation gaps in June-July 2026 (no Latvian gap is reported). President Rinkevics said after the Ankara summit (July 2026) that 'contentious rhetoric' will not disappear. Ally and not reluctant_ally because Latvia does not resist the alignment; the friction is the US's reliability. Bond - affinity: the United States never recognised the 1940 annexation."
