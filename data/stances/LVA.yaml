actor: LVA
stances:
  - toward: RUS
    grade: rival
    trend: cooling
    bond: grievance
    since: 2022-08-11
    last_verified: 2026-10-29
    confidence: B
    note: "Rival, not adversary, for consistency with Estonia and Lithuania; 'adversary' is reserved for actors seeking each other's destruction (Iran-Israel). The Saeima's 'state sponsor of terrorism' declaration and the chargé-level relations are the hardest posture in NATO, but Riga's aim is deterrence and a Russian defeat in Ukraine, not the end of the Russian state. The Latvian state itself uses the vocabulary of the mortal enemy: the State Security Service (VDD) puts Russia's services at the head of the threats to the state and a secondary account of its February 2026 report calls Russia an existential threat; the Saeima declared Russia a state sponsor of terrorism on 11 Aug 2022 (67 votes, none against); relations were cut to charge d'affaires level on 24 Feb 2023; and Latvian soil has seen Russian-directed arson cells (cases of 2023-25), GPS jamming from Kaliningrad, and Russian rail crossings shut from 1 Jul 2026. Adversary rather than rival because the declared Latvian aim is Russia's defeat in Ukraine and the Russian state is named the threat to Latvia's existence, not a competitor. The case against: Riga seeks no change of regime in Moscow, keeps an embassy, and still sold EUR 962.5m of goods to Russia in 2025 (4.9% of exports), so the grade is the harder of two readings (the 'rival' reading is the fallback). Bond - grievance: the 1940 occupation and the Soviet deportations, and more than a third of residents who are not ethnic Latvians, mostly Russian-speaking."
    sources:
      - {url: "https://vdd.gov.lv/en/news/press-releases/vdd-publishes-its-annual-report", title: "VDD publishes its Annual Report on the identified threats and implemented countermeasures", publisher: "State Security Service of Latvia (VDD)", date: 2026-02, tier: 1}
