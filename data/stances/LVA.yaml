  - toward: BLR
    grade: rival
    trend: cooling
    bond: none
    since: 2023-09-19
    last_verified: 2026-10-29
    confidence: C
    note: "Latvia closed Silene on 19 Sep 2023 and has kept it shut, stopped nearly 10,000 illegal crossing attempts in the first eight months of 2026 (12,046 in all of 2025), found two tunnels in August 2026, opened a criminal case in mid-July 2026 against Belarusian border officials for moving migrants in state vehicles, and the Interior Ministry proposed on 4 Aug to close Paternieki, the last crossing, as 'hybrid pressure' (the government declined on 5 Aug). The VDD reads Belarusian services as an extension of Russian ones. Rival and not adversary: the aim is to stop a pressure, not to remove the Minsk regime, and Riga keeps one crossing open and EUR 132.5m of exports (0.7%). No source uses the word 'rival': our reading (confidence C). Cooling because 2026 is the heaviest year yet."
