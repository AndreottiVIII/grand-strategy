  note: 'Rival or partner, read as reluctant partner. In January 2026 Carney went to Beijing to offset the damage of US tariffs: a quota for up to 49,000 Chinese EVs at a 6.1% rate (rising toward about 70,000 over five years) against Chinese duties on canola seed cut from 84% to 15%. Cooperation out of necessity, resisting alignment: the 2025 interference inquiry names China the most active perpetrator, Carney raised interference with Xi and then had to correct a parliamentary record that said he had not. Warming on trade; the security axis is unchanged. Bond none: pure interest. Confidence C: the sources are press.'
