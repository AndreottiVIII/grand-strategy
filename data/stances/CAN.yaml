  note: 'Kin in the Commonwealth sense (shared Crown, language, history) and a partner that is moving closer on defence: Canada applied in September 2026 to join the UK-led Joint Expeditionary Force as a full-time member, which London supports, and the two governments are in talks to merge the Canadian Defence, Security and Resilience Bank with the UK Multilateral Defence Mechanism. Not ally: no treaty of mutual defence between the two, and their shared military ties run through NATO. Warming since the June 2025 Ottawa meeting. The Carney-Burnham meeting in Liverpool on 16 September 2026 is the first with the new British prime minister. Confidence C: press reports of a readout, no official text retained here.'
