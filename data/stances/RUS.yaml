  note: "The one 'adversary' in Russia's Europe, and the structural case the ontology was written for: Moscow's declared aim is not a border but the end of Ukraine as currently constituted - 'one people', 'all of Ukraine is ours' (Putin, June 2025), neutrality, a capped army and a government Moscow can accept (ISW's reading of the Kremlin position, Feb 2026), with 'denazification' never defined. The terms of 14 Jun 2024 (the four oblasts in full, no NATO, recognition, sanctions lifted) were repeated unchanged in Istanbul, Anchorage, Abu Dhabi and Geneva, and the Kremlin suspended trilateral talks until Ukraine leaves the rest of Donetsk. Stable: the aim has not moved while the means (Kursk retaken, Oreshnik on Kyiv) have. Bond - kin, from Moscow's side: the Kremlin's claim of a shared people is the argument for denying the state, which is why Kyiv's own bond is grievance; the pair is deliberately asymmetric in bond and symmetric in grade."
