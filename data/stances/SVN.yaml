  - toward: PSE
    grade: partner
    trend: cooling
    bond: none
    since: 2024-06-04
    last_verified: 2026-10-12
    confidence: B
    note: "Slovenia recognised the State of Palestine and established diplomatic relations on 4-5 Jun 2024 and, on the Security Council, voted for Palestine's full UN membership and co-sponsored the General Assembly resolution (143-9-25). Cooling since June 2026: the Janša government, which opposed the recognition, took the Palestinian flag off the government building and lifted the Israel measures. The recognition itself is not reversed in any source found."
