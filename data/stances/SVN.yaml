  - toward: HRV
    grade: reluctant_ally
    trend: stable
    bond: grievance
    since: 2015
    last_verified: 2026-10-12
    confidence: B
    note: "Mirrors Croatia's own reading (HRV toward SVN: ally, stable, affinity) with the same sources, and adds Ljubljana's side. NATO and EU co-members (Art. 5, Art. 42(7)) and neighbours trading EUR 5.4bn a year, but Slovenia treats the 2017 Piran Bay award as binding while Croatia has rejected it since 2015: that open legal wound is why Slovenia's grade is 'reluctant' where Zagreb's is plain 'ally'. The two governments park it (2023 agreement to keep it out of daily politics; border-bridges agreement signed 23 Jun 2025 by Golob and Plenkovic) and co-own the Krsko plant. No source uses the phrase 'reluctant ally': the grade is our reading of the structure. Bond - grievance: the unimplemented award. Janša's government (from June 2026) has made no found statement on the border."
    sources:
