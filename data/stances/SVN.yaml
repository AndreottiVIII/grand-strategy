  - toward: RUS
    grade: rival
    trend: stable
    bond: none
    since: 2022-12
    last_verified: 2026-10-12
    confidence: C
    note: "Not adversary: no declared aim against Russia's existence or regime. Slovenia is an EU and NATO member under the EU sanctions regime, and a Russian intelligence network was found on its soil: two Russian 'illegals' posing as Argentine citizens were arrested in December 2022 and sentenced in July 2024 before leaving in the 1 Aug 2024 prisoner swap; one reported target was the EU energy regulator ACER in Ljubljana. Further 2022-26 spy cases were not found. No source uses the word 'rival': the grade is our reading (confidence C). Slovenia's gas and oil exposure to Russia was not sourced."
    sources:
