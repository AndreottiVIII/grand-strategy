  - toward: org-nato
    grade: reluctant_ally
    trend: warming
    bond: affinity
    since: 2004-03-29
    last_verified: 2026-10-12
    confidence: B
    note: "Treaty member whose spending lagged: in July 2025 parliament voted (46-42, on a resolution by the Levica party) for a consultative referendum on raising defence spending to 3% of GDP by 2030, Golob answered by threatening a NATO-membership referendum and the vote was cancelled on 18 Jul 2025. Janša's government (June 2026) says Slovenia will reach 2% this year in the revised budget and follow the 3.5% core-defence path agreed for 2035; he said Slovenia is not doing it because NATO requires it. Reluctant because the friction is domestic and visible (Levica wants out, support for membership polled at about 52%); warming because the new government reverses the Golob-era stance. No source uses 'reluctant ally'; the grade is our reading from Defense News and the government's own statements."
