  - toward: ISR
    grade: partner
    trend: warming
    bond: affinity
    since: 2026-06-11
    last_verified: 2026-10-12
    confidence: B
    note: "Reversed in 2026. Under Golob (2025) Slovenia banned Ben-Gvir and Smotrich from entry, imposed an arms embargo and banned settlement imports - at that point a 'rival'. On 11 Jun 2026 Janša's government lifted the bans on Netanyahu and the two ministers, let the embargo lapse and lifted the settlement-import ban, 'to restore the conditions for a normal political dialogue'; Israel announced an embassy in Ljubljana. Janša strongly supports Israel and criticised the 2024 recognition of Palestine. Partner, not ally: no alignment, an EU member whose public and partners (Berlin) are critical of the line. Bond - affinity: the Janša government's sympathy, not a Slovenian national consensus (Mladina asks who supports his foreign policy)."
    sources:
      - {url: "https://www.arabnews.pk/node/2646850/world", title: "Slovenia lifts entry ban on Israeli PM, arms embargo", publisher: "Arab News / AFP", date: 2026-06-12, tier: 3}
