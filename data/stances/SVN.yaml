  - toward: HUN
    grade: ally
    trend: stable
    bond: affinity
    since: 2004-05-01
    last_verified: 2026-10-12
    confidence: C
    note: "NATO and EU co-member. Janša has been Orbán's closest partner in the EU (Orbán endorsed him on Slovenian TV in 2018 and Hungarian business circles bought into Slovenian right-wing media, per RSF; the Hungarian stake in Nova24TV was reported sold in 2022), which is the affinity. Orbán lost the April 2026 election to Péter Magyar, so the personal channel that defined the bond is gone; no Janša-Magyar statement was found, hence 'stable' and confidence C. Under Golob (2022-26) the two governments were distant, so 'ally' here is the co-membership floor plus the Janša affinity, not a Slovenia-wide alignment. The Hungarian loan referred to in the brief was not found in any source reached."
    sources:
