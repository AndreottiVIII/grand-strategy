  note: 'China is the largest creditor and buyer of Angolan oil: oil-backed debt fell by almost a quarter in 2025 to about USD 7.7bn (from 10.1bn), and Luanda has been reducing its exposure to resource-backed loans. Cooling is our reading from that repayment and the stated wish to borrow less against oil. The February 2026 Sonangol request for a USD 4.8bn Chinese refinery loan is a counter-signal, so the trend is only cooling on the debt, not on the relationship. Transactional, no alignment: partner. Bond none is our reading. Gap: the 2025 finance-ministry figure comes from secondary reporting and the original Reuters interview was not read.'
