  note: 'Luanda was the DRC-Rwanda mediator from the July 2022 Luanda Roadmap, and it announced in March 2025 that it was stepping back to focus on the AU presidency. The Lobito corridor extends the rail into the DRC mining region, so the two share a commercial interest. Transactional cooperation without alignment: partner is our reading (C); no source uses the word. Trend warming is our reading: Luanda gave up the mediator''s chair in March 2025 and came back in February 2026 with a ceasefire proposal that the M23 rejected (sources mirrored from the COD card). Bond none is our reading. Gap: Kinshasa''s own view of Luanda is not in a cited source.'
