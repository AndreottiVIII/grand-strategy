    note: "Luanda was the DRC-Rwanda mediator from the July 2022 Luanda Roadmap, and it announced in March 2025 that it was stepping back to focus on the AU presidency. The Lobito corridor extends the rail into the DRC mining region, so the two share a commercial interest. Transactional cooperation without alignment: partner is our reading (C); no source uses the word. Trend stable is our reading: the mediation role was given up but the relationship and the corridor continue. Bond none is our reading. Gap: Kinshasa's own view of Luanda, and any 2026 Angolan ceasefire proposal, are not confirmed in a cited source."
