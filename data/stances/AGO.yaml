    note: "Mirror of the PRT card's stance toward AGO (partner, kin, same sources, not re-researched). Luanda is the Lusophone market Portugal depends on and backs Portugal's Security Council bid for 2027-28; the Portuguese government records Montenegro's Luanda visits. Friction, in the PRT card's own sources: Portuguese exporters to Angola fell by 713 since 2021 and Luanda sided with the PALOP bloc in a CPLP presidency row. Bond kin is shared language and colonial history, as the PRT card reads it; this pass adds no Angolan source for the kin reading. The Wikipedia foreign-relations index mentions Portugal and Brazil only in general terms (tier 4, pointer)."
