  note: 'Argued from Algiers'' side. Algeria cut diplomatic relations on 24 Aug 2021 over Morocco''s ''hostile actions'' (it blamed the August 2021 wildfires on the MAK, which it labels terrorist, and accused
    Rabat of backing it), the border has been shut since 1994, the Maghreb-Europe gas contract was left to lapse on 31 Oct 2021, Tebboune said in Mar 2023 that ties had passed ''the point of no return'',
    the airspace was closed to Moroccan aircraft on 22 Sep 2021 and visas were imposed on Moroccans on 26 Sep 2024, and in Nov 2025 Attaf said bilateral dialogue with Morocco ''is not on the agenda'' while
    Washington mediates; S/RES/2797 names Algeria among the parties it asks to negotiate. The Kabylie charge is the nearest Algiers comes to an existential accusation. But the ontology''s test for adversary
    is a declared aim of the other''s defeat or disappearance: Algiers declares Sahrawi self-determination, border security and the military balance, not Moroccan partition or regime change; the king has
    repeatedly offered to talk; Carnegie and Crisis Group speak of a rivalry (Carnegie: extending into the Sahel) and SIPRI of a long-running tension that drives arms imports, not of a war aim. Rival, stable
    (frozen); the grade would move to adversary only if Algiers stated an aim against Moroccan integrity or Rabat''s MAK backing were proved and acted on. Bond - grievance: Western Sahara, the Sand War
    legacy and mutual accusation.'
