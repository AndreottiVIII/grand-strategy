  note: 'Lomé''s April 2026 strategy aims to intensify political dialogue with the Sahel states (the AES) and to position Togo as their mediator. That is transactional cooperation with no alignment: partner, with no defence clause. Warming is our reading of the step from the 2021 plan to the 2026-2028 strategy. Bond none is our reading; no source names kinship or affinity. Gaps, not recorded as stances: Nigeria and ECOWAS (reluctant_partner, bridge role), Ghana and Benin (kin), France (partner, cooling) and China (partner, port) have no source opened in this pass that uses those readings; the AES membership question is not settled in any opened source.'
