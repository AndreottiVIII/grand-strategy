  confidence: B
  note: "A transactional partnership that Trump's second term has made intimate: C5+1 summit at the White House (6 Nov 2025, 29 agreements worth about USD 17bn including Boeing, John Deere and the Cove tungsten venture), Kazakhstan's accession to the Abraham Accords announced the same day, a founding seat on the Board of Peace (22 Jan 2026) and Tokayev in Washington for its first meeting (20 Feb 2026). Chevron holds 50% of Tengizchevroil, which the 2025 expansion lifted to 1 Mboe/d. Still not an alliance: the Jackson-Vanik repeal for Kazakhstan was only a bill in July 2026, there is no defence treaty, and five days after Washington Tokayev signed the 'alliance' declaration in Moscow. Bond - none: interest only; the Abraham Accords step is Tokayev's offer for Trump's attention."
