  note: "Largest trading partner (record USD 49bn in 2025, Tokayev to Xi in Shanghai on 16 Jul 2026, with more than USD 30bn of Chinese investment) and the host of the 2nd China-Central Asia summit (Astana, 16-18 Jun 2025, where Xi signed a treaty of permanent good-neighbourliness with the five states). The official label is 'permanent comprehensive strategic partnership' (since 2019), which is a partnership, not an alliance: no defence commitment and no CSTO-type security bind, and Beijing lost the nuclear-plant bid to Rosatom. Bond - none: pure interest, with ethnic Kazakhs in Xinjiang as a point on which Astana is silent and a public wary of Chinese presence. Two independent sources (the Chinese foreign ministry and the Kazakh government) use the 'strategic partnership' reading."
