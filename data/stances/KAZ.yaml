  last_verified: 2026-10-12
  confidence: B
  note: "Aligned by treaty and by debt, with visible friction. Both sides use the word: the Moscow declaration of 12 Nov 2025 raised ties to 'comprehensive strategic partnership and alliance' and Tokayev hailed 'allied relations' again with Putin in Astana on 28 May 2026 (CSTO and EAEU co-members; the dataset floor would be plain 'ally'). The friction is on the record: Astana refused to recognise the Donetsk and Luhansk 'republics' in Putin's presence (June 2022), calls itself 'not a mediator' on Ukraine, and the Kremlin's levers are the CPC (80% of oil exports), the reported halt of Druzhba transit to Germany from 1 May 2026 and Russian television's attacks of 2022. The 2022 CSTO intervention is the debt that explains the instalments of loyalty (the declaration, the Rosatom plant). Trend stable rather than cooling or warming: the formal ties thickened in 2025-26 while the hedge toward Washington and Beijing thickened at the same time. Bond - affinity: Soviet history, Russian language and a 15% Russian minority, but no kinship; Russian elites' view of Kazakh statehood keeps it from kin. No asymmetry with Ukraine: Kyiv does not grade Kazakhstan an adversary."
