  note: "The EU is the largest trade partner (32.4% of Kazakhstan's trade in 2024, about USD 50bn) and buys most Kazakh crude and products (about 60% of oil exports by OSW). The Enhanced Partnership and Cooperation Agreement has applied since 2016 and is in force since 1 Mar 2020; the Global Gateway Investment Package for Central Asia (EUR 12bn, Samarkand, April 2025), the critical-raw-materials roadmap and Tokayev's Brussels visit (concluded 23 Jun 2026: USD 12bn of agreements including 50 Airbus aircraft for EUR 7.1bn) deepen it. Non-member, hence partner, whatever the rhetoric of strategic partnership. Friction: EU sanctions listings of Kazakh firms for Russia re-export and a visa facilitation agreement still under negotiation. Bond - none."
