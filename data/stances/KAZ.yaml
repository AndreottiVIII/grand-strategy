  note: "Bound by the Treaty on Allied Relations signed in Tashkent on 22 Dec 2022 together with a border demarcation agreement (Uzbekistan ratified on 30 Nov 2023, Kazakhstan's Senate on 25 Apr 2024); it covers political, trade, transit and energy cooperation and security coordination against terrorism and extremism, with no mutual-defence clause that sources mention, which is why some would read it as a partnership; the treaty's own title and the foreign ministry's 'strategic tandem' wording are the readings used. Mirziyoyev was in Astana in April 2026 and Kazakhstan's foreign minister in Tashkent in March 2026. Uzbekistan is outside the CSTO, so the two are allied in Central Asia but not in the same alliance. Bond - kin: Turkic, shared Soviet and Central Asian history."
