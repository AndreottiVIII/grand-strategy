  note: 'Rival, not adversary: Estonia''s aim is deterrence, a Russian defeat in Ukraine and payment of damages, not the end of the Russian state or its regime; it keeps a border regime and diplomatic contact (chargé d''affaires summoned). The friction is the sharpest in the Baltic: MiG-31 intrusion and Article 4 request (19 Sep 2025), the Jaguar/Su-35 episode (May 2025), GPS jamming, the Milrem arson blamed on Russian services (Sep 2026), the Estlink 2 cut. Estonian foreign intelligence calls Russia the main threat but judges it has no intention to attack in the coming year; the Kremlin says it poses no threat to Estonia. No source uses ''rival'': the grade is our reading of the structure (confidence C), and Moscow''s side (RUS card) is expected to grade Estonia more harshly - an asymmetric pair that is deliberate. Bond - grievance: the Soviet occupation and Russian claim to protect Russian speakers.'
