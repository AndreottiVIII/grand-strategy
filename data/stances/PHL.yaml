  note: 'Rival, not adversary. The test is whether a declared aim is the other''s defeat or disappearance, and neither side states one: Manila''s aim is to keep what it holds and the award''s zone, not to end the Chinese state, and it keeps the channel open while it protests (Lazaro met Wang Yi on 22 Jul 2026, the first foreign-minister bilateral in two years, raised the Ayungin baton incident and reaffirmed the One China policy in the same meeting). Beijing''s aim at the shoals is control, removal of the Sierra Madre and, at Scarborough, a ''national nature reserve'' (State Council, Sep 2025) - coercion short of war, not Manila''s destruction. The friction is the sharpest in the region: Second Thomas Shoal baton assault (20 Jul 2026), water cannon at Scarborough on 23-24 Jul 2026, the Sabina ramming of 31 Aug 2024, a Chinese platform inside the Scarborough lagoon (May-June 2026). The pair is also tied by trade: China supplies 28.6% of Philippine imports. No source uses the word ''rival'':
    the grade is our reading of the structure (confidence C), as for Kosovo toward Serbia. Trend stable: a first ministerial bilateral in two years, but incidents continue. Bond - grievance: the 2016 award that Beijing calls null, and the shoals taken in 2012.'
