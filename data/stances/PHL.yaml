  note: 'Treaty ally under the 1951 Mutual Defense Treaty. The 29 Mar 2025 joint statement of Hegseth and Teodoro says the treaty covers armed attacks on armed forces, aircraft and public vessels, coast guards included, anywhere in the South China Sea; nine EDCA sites, Task Force Philippines and, since 2024, Typhon and NMESIS launchers stay on Philippine soil (a Tomahawk was fired from Tacloban in May 2026). Friction is real and rising: Foreign Policy notes that the 2025 US National Security Strategy omitted the Philippines and that Trump seeks stable ties with Beijing; the 19% tariff of 2025 became 12.5% under Section 301 on 24 Jul 2026. Grade ally, not reluctant ally: Manila asks for more of the alliance, not less. Trend stable: military integration up, trade and strategy cooler. Bond - affinity: colonial history to 1946 and a diaspora that sends 39.7% of cash remittances.'
