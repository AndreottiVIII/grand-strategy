  note: 'Patron, not partner and not quite ally. Beijing endorsed the Dec 2025-Jan 2026 election, Wang Yi was the first senior Chinese political visitor to the new president (Naypyidaw, 25 Apr 2026), Min Aung Hlaing went to China in June and the joint statement of 17 Jun 2026 speeds up Kyaukphyu, the CMEC railway and the oil and gas pipelines, adds a BRI plan and a yuan-kyat settlement, and Myanmar reaffirmed One China. China is also the largest supplier of arms after Russia (USD 267m in 2021-22). Not ''ally'': there is no treaty, and the alignment is by necessity with visible friction - Beijing broke the northern alliance by blockading and detaining MNDAA leaders until Lashio came back (22 Apr 2025), keeps its own channel to the KIA (the rare-earth belt) and joined the Thai-Myanmar scam-centre crackdown it had pressed for. The grade is the atlas''s reading (C): no source uses the phrase. Bond none: pure interest. Luttwak reading: the junta survives by being useful to its patron against
    its own people, and the patron''s calculus is a quiet border, open pipelines and no Western-aligned Naypyidaw, not a junta victory.'
