  note: 'The former colonial-era power: the Sugauli treaty of 1816 is the origin of the boundary Nepal now disputes, and the 1947 tripartite agreement with India and the UK still governs Gurkha recruitment.
    Today: the UK remains Nepal''s largest bilateral donor (minister, Sept 2025), with a 1993 investment agreement and a development partnership; aid is smaller than in past years, and the Gurkha pension
    gap for men retired before 1997 is a live issue in Westminster. Trend stable. Bond - affinity: 200 years of relations and the Gurkha regiments, not kinship.'
