  note: 'Our reading (confidence C), added 2026-10-29 after the ambush of 18 October. The grade rests on the government''s own words as AP reported them: Bukele announced a rescue operation on 21 October and warned the gangs of a harsher response, and on 22 October told the gangs, as AP quoted him, "we can finish with you too", after saying the crackdown had already finished them at home. A declared aim of the other side''s defeat is the test for adversary. Trend cooling: the hostage-taking escalated the conflict. Bond grievance, dated from the hostage-taking; no older wound was found in the sources read. Bukele did not name the group holding the men, so the grade covers the Haitian gang coalition as the counterpart until a holder is confirmed.'
