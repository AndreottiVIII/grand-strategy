  note: 'Why not rival: the BNP government wants the relationship repaired (Rahman''s adviser asked for a ''complete reset'', the foreign minister went to New Delhi on 7-8 Apr 2026, Dhaka reopened visas for Indians within three days of taking office and asks for more diesel and fertiliser), and Bangladesh cannot do without Indian power (15.6% of supply in 2025), fuel, transit and water. Why not partner: Dhaka resists any alignment (''Bangladesh First'', sovereign equality), holds Hasina''s extradition (death sentence of 17 Nov 2025; India ''examining'' the request in April, July and August 2026) as the price of Rahman''s first visit, protests the BSF''s border killings (at least 34 in the first 11 months of the interim government) and the pushbacks, and read India''s 2025 import restrictions (about USD 770m of trade) as coercion. Cooling since 5 Aug 2026 (Hasina''s virtual press conference; the India trip put on hold; BRICS invitation declined 10 Sep). No source uses the exact label; Al
    Jazeera''s reading (''there is no alternative'' to dialogue; initial warmth gave way to nationalist rhetoric on both sides) and WPR''s (''mild to severe turbulence'') are the closest, so the grade is our structural reading (C). Indian-side commentary and ORF are flagged as the Indian view. Bond - grievance: 1971 gratitude has been replaced by a decade of perceived Indian patronage of the Hasina regime, the Ganges and Teesta waters and border deaths.'
