  note: 'Partner with friction, no treaty. Washington''s charge that Christians are being killed (the November 2025 threat to ''prepare for possible action'', as the USA card records) became a joint campaign:
    US strikes on ISIS sites in Sokoto on 25-26 December 2025 with Abuja''s consent, an advance team in February 2026, a joint operation that killed al-Minuki (15 May 2026, per Trump''s statement), and
    the withdrawal of almost all US personnel by 3 July 2026 while intelligence assets stayed. Military Times describes ''structured security cooperation''. Bond grievance is our reading: the persecution
    charge is the open wound, the cooperation the necessity. Stable trend. Abuja''s own statements are not in this pass.'
