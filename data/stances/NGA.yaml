    of bilateral debt service. The comprehensive strategic partnership (September 2024) and trade of about USD 22bn in 2025 make the warming, but the second source is a tier-4 pointer. Bond none is our
    reading: the sources record interest, not kinship; affinity was not sourced. Gaps: the Lekki deep-sea port (not sourced in this pass), the DMO''s official figures and Beijing''s own statements.'
