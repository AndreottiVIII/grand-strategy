  note: 'No source calls Russia a rival: this is our reading of the structure (confidence C). Ireland applies EU sanctions and backs Ukraine (21st package, July 2026; the Aughinish Alumina plant, owned by Russia''s Rusal, exported about 45% of 2025 sales to Russia and the government would not list it yet). Russia is a maritime and cable threat: a 2022 naval live-fire exercise 250 km off Cork was moved outside Irish waters after protest, and a Russia-bound cargo ship dragged its anchor near subsea cables off Mayo in 2025. Russia is not a mortal enemy: Dublin keeps an embassy in Moscow. Bond - none: no kinship, no grievance.'
