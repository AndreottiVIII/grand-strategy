  note: "Open maritime and territorial dispute. The ICJ judgment of 8 October 2007 fixed the Caribbean sea boundary between Honduras and Nicaragua. The Nicaragua card lists three territorial disputes with Honduras before the court. A 2026 press report says El Salvador protested a Honduras-Nicaragua maritime treaty, but we could not confirm the treaty or its status. Our reading: rival, not adversary, since the dispute goes through the court and no source reads a war aim. Bond grievance, not kinship: the wound is a court dispute, and no shared identity is claimed here. Trend stable, no new settlement found by November 2026. Bond differs from the other Central American pairs on purpose."
