  note: "Transactional cooperation inside the Central American integration track. In April 2026 the ministers of Guatemala, Honduras and El Salvador met under the Deep Integration Process, and they updated the exception lists for free movement of goods between Guatemala and Honduras. Asfura and Arevalo met in Costa Rica and discussed trade and security. In April 2026 the two governments agreed a roadmap against irregular migration. Our reading: partner, with no alignment. Bond kin: shared Central American identity, not a treaty. Trend stable: cooperation is steady, and no source reads a turn in either direction. No free movement of people changed in 2026 that we found."
