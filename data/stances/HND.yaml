- toward: SLV
  grade: rival
  trend: stable
  bond: kin
  since: 1992-09-11
  last_verified: 2026-11-19
  confidence: C
  note: "Competing claims over the Gulf of Fonseca and Conejo Island, with brotherly rhetoric on top. The ICJ chamber of 11 September 1992 gave the gulf waters beyond the three-mile belt to the joint sovereignty of the three coastal states and placed Meanguera under El Salvador. In July 2026 Asfura said Conejo belongs to Honduras, and Bukele answered that brotherhood outweighs land and that the gulf operations go on. Our reading: rival, not adversary, because both governments de-escalate. Bond kin: the states share Central American identity, and both presidents speak of a brother people. Trend stable: the dispute stays open with no settlement."
