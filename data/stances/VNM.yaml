  note: 'Argued: reluctant_partner, not rival. Vietnam trades with China at a structural deficit (40% of imports, USD 104bn deficit in Jan-Nov 2025), signs rail, security-hotline, AI and party-cooperation documents (To Lam in Beijing 14-17 Apr 2026, ''major common perceptions to raise relations to a new level'') and supports ''socialism in each country'', yet resists alignment: it protests Chinese works on Antelope Reef and Yagong (March and 28 Aug 2026), reclaims every Spratly feature it holds, buys BrahMos and diversifies its partners. ''Rival'' (the US toward China) would require competition as the dominant posture and an arms race; Vietnam''s competition is real but sits inside a managed party relationship. Marston (Lowy): Hanoi will ''prioritise its relationship with China'' because of the border and the history. Bond - grievance, not affinity: the Paracels taken in 1974 and the 1979 and 1988 clashes are the standing wound under the party kinship. Trend stable: the April visit and the
    August protests cancel out.'
