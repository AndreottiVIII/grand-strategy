  confidence: C
  note: 'Andorra aligns with EU Russia sanctions by government decree, since 2022: the 22 May 2026 decree brings in the EU 19th and 20th packages, with annexes of 2,469 individuals and 1,636 entities. No source calls Russia a rival, and Andorra does not seek Russia''s defeat or regime change, so adversary does not apply. The grade is our reading of the structure (confidence C): sanctions are applied against a state whose clients have laundered money through Andorran banks (the 2015 BPA case, with Russian criminal clients named by FinCEN), and the financial centre must now isolate them. Bond - none.'
