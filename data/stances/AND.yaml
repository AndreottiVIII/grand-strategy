- toward: FRA
  grade: ally
  trend: stable
  bond: affinity
  since: 1993-06-03
  last_verified: 2026-10-12
  confidence: B
  note: 'Treaty-based: the 1993 Treaty of Good Neighbourliness, Friendship and Cooperation with Spain and France, and the constitution that makes the French president one of the two co-princes. The co-princely link is older (the 1607 edict, the 1278 pareatge), but the 1993 treaty is the standing legal tie, so since is 1993. France and Andorra have had diplomatic relations since 3 June 1993. Bond - affinity: a shared Romance-language and cultural space and a long habit of co-sovereignty, not kinship. The French co-prince holds the office by virtue of being president of France; Andorran voters do not choose either co-prince.'
