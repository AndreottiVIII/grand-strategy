  last_verified: 2026-10-12
  confidence: B
  note: 'The EU is partner for a non-member, under the ontology, even though Andorra is inside the customs union for manufactured goods since 1 July 1991. The 2026 Council authorisation to sign the Association Agreement is the warming: the agreement is the aim, not membership, which the government has not sought. Bond - none: interest-based cooperation, no kinship or grievance in the sources. The trend is warming because the signing is scheduled for late September 2026, but the European Parliament and a referendum still stand between text and law.'
