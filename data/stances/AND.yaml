- toward: ESP
  grade: ally
  trend: stable
  bond: kin
  since: 1993-06-03
  last_verified: 2026-10-12
  confidence: B
  note: 'Treaty-based, same 1993 treaty as France, and the second co-prince is the Bishop of Urgell, a Spanish see in Catalonia. Spain supplies about 58 percent of Andorran imports (2025). Bond - kin: the Andorran people are descended from the Catalans and Catalan is the only official language, so the bond is shared identity, not just interest. Grade follows the structure, not the rhetoric: the Catalan government signs its own 2026-2030 plan with Andorra, which is a sub-state tie, not a Madrid one.'
