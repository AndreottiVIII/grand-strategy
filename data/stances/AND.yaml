  note: 'Transactional and thin: diplomatic relations since 21 February 1995 according to the Andorran foreign ministry table (Wikipedia gives 1996 for formal relations; the ministry table is the earlier and more official date). The US is the power that matters for the banks: FinCEN named Banca Privada d''Andorra in March 2015 and the government took the bank over. Andorra is not in the Treasury FATCA intergovernmental-agreement table on the page read. No source calls the pair partners; the grade is our reading of an arms-length relation (confidence C). Bond - none.'
