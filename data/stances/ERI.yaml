  note: "Lavrov's surprise visit to Asmara (27 January 2023) sought Eritrean support on Ukraine; Isaias made an official visit to Moscow in May-June 2023 and attended the Russia-Africa summit in St Petersburg in July 2023. Partner, not ally: no treaty. The UN record (dataset, not written here) has Eritrea voting with Russia on five of six Ukraine landmark votes, including 2 March 2022, when Eritrea, Russia, Belarus, DPRK and Syria voted no; on ES-11/4 (October 2022) Eritrea abstained while Russia voted no. Its voting affinity with Russia (0.69, 2022-26) is below the all-member average (about 0.78). Bond affinity: shared hostility to a 'unipolar' order (Isaias, Moscow 2023), not kinship. Trend warming on the 2023 visits."
