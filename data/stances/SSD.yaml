  - toward: USA
    grade: reluctant_partner
    trend: cooling
    bond: affinity
    since: '2011-07-09'
    last_verified: '2026-10-12'
    confidence: C
    note: "The United States recognised the state on 9 July 2011 (State Department, tier 1), the midwife of independence. Since April 2025 the link has cooled: visas were cancelled for all passport holders on 5 April 2025 after Juba refused a deportee, and in May 2025 targeted visa restrictions hit transitional-government figures. Washington pressed for the 2026 arms-embargo renewal. No source uses the word reluctant: the grade is our reading (C). Aid cuts in 2025 are not researched (gap)."
