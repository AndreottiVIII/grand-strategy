    since: '2011-07-09'
    last_verified: '2026-10-12'
    confidence: C
    note: "Sudan is the only outlet for South Sudan's crude, so the two cooperate on the pipeline: transit deals, repairs in 2025 and the Heglig security arrangement of December 2025. The open wound is the 2012 border war over oil fields (BBC), and the RSF control of Heglig makes Khartoum a partner whose checkpoints Juba does not command. No source uses the word reluctant: the grade is our reading of the structure (C). The SAF-SPLM ties are not researched (gap)."
