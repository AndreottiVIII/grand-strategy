    note: "Kenya is the mediator of the Tumaini track: Kiir asked Ruto in late 2023 to take over from Sant'Egidio, and the talks restarted in Nairobi in January 2025 but stalled (Radio Tamazuj). The grade partner is transactional cooperation without alignment. Bond none is our reading. Kenya trade figures and Kiir family interests in Kenya are not researched (gap)."
