  note: 'A partner whose year was a stress test. The 2025 US tariffs reached 50% in Aug 2025 (25% ''reciprocal'' plus 25% for buying Russian oil) and put ties ''at their lowest in nearly two decades'' (Tribune);
    the 100,000-dollar H-1B fee (19 Sep 2025) hit the pipeline of Indian engineers (Indians were 71% of 2024 approvals). Repair followed: the 10-year Framework for the US-India Major Defence Partnership
    signed in Kuala Lumpur on 31 Oct 2025, the 2 Feb 2026 deal cutting the rate to 18% in exchange for restricting Russian oil and buying more American goods, the Quad foreign ministers in New Delhi on
    26 May 2026. But the Supreme Court struck down the IEEPA tariffs on 20 Feb 2026, the first-phase trade agreement is still unsigned (Goyal in June: ''99 percent'' settled), the Quad leaders'' summit
    India was to host has no date, and on 17 Sep 2026 Congress passed an act authorising tariffs of up to 100% on buyers of Russian energy, to which the MEA answered it will ''take all necessary measures
    to protect its trade and economic interests''. Net direction: neither warming nor cooling, with the US pulling harder on Russian oil than at any time since 2022. Not an ally: no treaty, no basing, India
    refuses mediation on Pakistan and keeps Russia. Bond - affinity: diaspora, technology, shared China concern.'
