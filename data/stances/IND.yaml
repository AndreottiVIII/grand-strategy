  note: 'Structural rival: an undemarcated 3,500 km boundary with heavy deployments on both sides, a goods deficit of USD 112bn in FY2025-26 on USD 131.6bn of imports, China as Pakistan''s arms supplier
    (Lt Gen Rahul Singh, July 2025: 81% of Pakistan''s hardware is Chinese and Pakistan received ''live inputs'' from China during Operation Sindoor; Beijing later confirmed on-site technical support),
    Chinese curbs on rare-earth magnets and fertiliser in 2025, and the Medog dam upstream on the Brahmaputra. The trend is warming because of what followed the 2020 Galwan clash: the Oct 2024 patrolling
    deal for Depsang and Demchok and the Modi-Xi meeting in Kazan, the Tianjin SCO meeting on 31 Aug 2025 (''partners, not rivals''), the resumption of direct flights in Oct 2025, and Xi''s first visit
    to India since 2019 for the BRICS summit (12 Sep 2026, a ''reset'' without a breakthrough). Delhi''s own words are ''development partners and not rivals'', but the grade follows the structure, not the
    formula. It is not an adversary: no one seeks the other''s end. Bond - grievance (1962, 2020).'
