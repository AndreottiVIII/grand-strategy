  note: 'The oldest partner and the one that costs the most. Russian crude is the swing source of India''s energy security (about 1.74 million barrels a day in Sept 2026 by Kpler, a record 2.8 million in
    July by CREA, against the 2 Feb 2026 pledge to restrict purchases), S-400 (three of five units delivered, two due in 2026-27) and Su-57 talk are the arms link, and Putin came to Delhi on 4-5 Dec 2025
    (a trade target of USD 100bn by 2030) and again for the BRICS summit on 11 Sep 2026, where Modi accepted an invitation to the 24th annual summit in Russia. India does not condemn the invasion, abstains
    in the UN (see the dataset rows) and says ''dialogue and diplomacy''. Partner, not ally: no mutual-defence clause, and India is choosing French Rafale rather than Russian aircraft for its next fighters
    (see FRA). Trend stable: Moscow is leaning on India more as its own partners shrink, but New Delhi is reducing exposure on arms, not on oil. Bond - affinity: Soviet-era friendship and a shared reading
    of multipolarity, but no kinship.'
