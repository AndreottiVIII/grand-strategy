  note: 'The ontology''s adversary test: does New Delhi seek the end of the Pakistani state or its regime? The record says no. After the Pahalgam attack (22 Apr 2025, 26 killed, claimed by TRF, which India
    calls a Lashkar-e-Taiba front) India struck nine ''terrorist sites'' in Operation Sindoor on 7 May 2025, fought four days of missile, drone and artillery exchanges, and then accepted a ceasefire agreed
    between the two DGMOs on 10 May; it targets terror infrastructure and the army''s sponsorship of it, calls the new line ''if Pakistan fires, we fire'', and keeps the Pakistani state as the counterpart
    it holds responsible. The Indus Waters Treaty is ''in abeyance'' since 23 Apr 2025 ''until Pakistan credibly and irrevocably abjures cross-border terrorism'' (MEA, 3 Jul 2026) - leverage with a stated
    exit condition, not an end-state. India does claim all of Jammu and Kashmir including Pakistan-held territory, and engagement is now limited to terrorism and PoK. After the Red Fort car bomb in Delhi
    (10 Nov 2025, 12-15 killed, a Jaish-e-Mohammed link noted by the UN monitoring team in Feb 2026) India did not formally blame Pakistan or retaliate, which shows the threshold is attribution, not each
    incident. That is a rivalry with a nuclear shadow and an arms race, not a war of existence, so `rival`, not `adversary`; the Pakistani side (Munir''s army, the Saudi pact, Chinese kit) reads India as
    the existential threat, which is why the pair is asymmetric in feeling but not in grade. Mediation is refused (Kashmir is bilateral; India denies the US brokered the ceasefire). Bond - grievance: partition,
    four wars, Kashmir. Confidence B because the grade is our structural reading of sources that describe the pair as rivals and India''s own posture as deterrence.'
