  note: 'Transactional partner with the largest external financing and the railway. Bishkek ratified the Central Asia-China treaty on good-neighbourliness (September 2025) and the railway works began on 27 December 2024. The 1996 and 1999 border agreements that would have ceded about 125,000 hectares sparked a parliamentary revolt in 2025, a reminder that the bond is interest, not kinship. Its grade follows structure, not rhetoric: it is not an ally.'
