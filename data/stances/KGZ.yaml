  note: 'CSTO member (treaty alliance, with the Kant air base under the CSTO framework) and EAEU member. Bond is affinity, not kin: Russian language and Soviet legacy, but a multi-vector state that keeps its own elite and its own trade with China. The labour and remittance dependence (about a quarter of GDP) is a constraint on the posture, not a reason to downgrade it. The 2024-25 migrant crackdown is friction in the labour channel, not a change of alignment.'
