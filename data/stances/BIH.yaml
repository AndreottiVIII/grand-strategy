  note: 'Review 2026-10-12: regraded rival - Republika Srpska is an entity of the state (own territory in law); the actor graded here is its leadership, which competes with the state. Territorial grades apply to territories, not actors. As Sarajevo''s state institutions see it: Republika Srpska is an entity of the state, within the territorial integrity the Security Council reaffirmed on 29 Dec 2025, but its leadership has banned state judiciary and police (27 Feb 2025, annulled by the Constitutional Court), keeps its own police and budget, and demands the army, border police, intelligence and fiscal system back. Claimed, not fully controlled: the state did execute the Dodik verdict and the entity repealed the laws on 18 Oct 2025 under pressure, so ''own_territory'' is the alternative reading. Not ''adversary'': the state does not seek the entity''s end, and the entity''s leadership formally invokes Dayton. No source uses the grade word (confidence C). Cooling because SNSD won again on 4
    Oct 2026 and US sanctions were lifted. Bond grievance: the 1992-95 war and the entity''s origin. Serbia grades RS ''ally'', so the pair SRB-RS is deliberate. Mirrors the evidence in SRB''s stance toward sub-rs and XKX''s toward sub-rs.'
