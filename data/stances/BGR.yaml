    note: "Review rule: co-members of NATO with visible friction are reluctant allies, not rivals (ONTOLOGY scale; the dataset would derive 'ally' from NATO alone), and Skopje grades Sofia the same. Sofia has blocked the opening of EU negotiations since November 2020 and requires the constitutional naming of Bulgarians (July 2022 French proposal); Zhelyazkov said in Oct 2025 that Bulgaria adds no new condition, and Radev as prime minister (18 Jun 2026) refused to meet Mickoski, saying there was 'nothing more to discuss' until the arson of Bulgarian embassy cars (15 Jun) is punished. The 2017 friendship treaty and Corridor 8 run in parallel. Trend cooling: no movement on the constitution, a new Bulgarian line that links rule of law to the veto. Bond - kin: Bulgaria treats the Macedonian language and national identity as Bulgarian in origin, which Skopje calls denial; kinship claimed is not kinship accepted (mirrored from Skopje's card, same sources)."
