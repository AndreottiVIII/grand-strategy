    note: "Not an ally: no treaty guarantee binds Sofia to Kyiv. A partner whose support is now being withdrawn on the state side: 13 aid packages delivered, but Radev froze government-supplied military aid (9 Jun 2026), said on 9 Jul that 'this year there is no such capability', and left the Coalition of the Willing (14 Jul); commercial arms sales continue and Bulgaria offers repair of Ukrainian equipment. Bulgaria has not blocked Ukraine's EU accession talks, unlike Hungary. Cooling for the state, stable for the industry (von der Leyen: about a third of EU weapons for Ukraine came from Bulgaria). Bond - affinity: Bessarabian Bulgarians in Ukraine and the 2022 solidarity wave, but Radev has called Crimea 'currently Russian' and clashed with Zelensky."
