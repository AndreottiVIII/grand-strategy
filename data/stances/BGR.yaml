  - toward: RUS
    grade: rival
    trend: stable
    bond: kin
    since: 2022-02-24
    last_verified: 2026-10-12
    confidence: C
    note: "No source calls the relationship 'rival'; the grade is our reading of the structure (confidence C). Bulgaria is a NATO and EU member that expelled Russian diplomats in 2020-22, put Lukoil's Bulgarian subsidiaries under a state special manager under US sanctions (Nov 2025), is moving Kozloduy off Russian fuel and carries Russian gas only as a transit state; Zakharova said on 29 May 2026 that Sofia showed 'no sign' of restoring dialogue. Not 'adversary': nothing in Sofia's stated aim is Russia's defeat, Radev wants 'pragmatic' relations and blocked the Kirill and Alekperov listings. Not 'neutral': it is inside the sanctions regime and the NATO frontline. Trend stable: the Radev line softens tone and sanctions votes without changing the structure, and Moscow itself reads Sofia as 'too weak', not turning. Bond - kin: Slavic and Orthodox ties, the 1878 liberation narrative and the Russophile electorate (Vazrazhdane 12 seats, BSP) that make a clean break impossible."
