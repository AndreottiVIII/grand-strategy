  note: 'N''Djamena ended the defence accord with France in November 2024 (Le Monde, 29 Nov 2024: ''un camouflet pour Paris''). France handed over its Faya base on 26 Dec 2024 and finished withdrawal in January 2025 (Stratfor). Chad still keeps its embassy in Paris and French aid, so the two cooperate, but Chad resists alignment: reluctant_partner is our reading of that structure, and no source uses the word. Trend cooling from the 2024 break. Bond none: no kinship and no sourced open wound (the ''foreign meddling'' language on Wikipedia has no usable source). Gap: French aid figures since 2025 are not found.'
