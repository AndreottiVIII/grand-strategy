  note: 'Mirror of the COL card, read from Ecuador''s side. Ecuador announced a 30% security tariff on Colombian imports in January 2026, citing Colombia''s lack of reciprocity against trafficking on the 600 km border. Colombia answered with reciprocal tariffs and a suspension of electricity exports on 22 January 2026. Ecuador raised its tariff to 100% from 1 May 2026 and repealed it on 31 May 2026; electricity resumed on 5 August 2026. Grade: the brief framed Colombia as partner with friction; we grade rival because a tariff war with electricity cut-offs is open economic coercion, the same reading COL makes of Ecuador (C). Warming is the 2026 de-escalation. Bond none is our reading. Gaps: the 2024-25 border and gang frictions are not sourced here; the SOTE transit fee on Colombian crude is in the COL card only, from one Spanish-language report.'
