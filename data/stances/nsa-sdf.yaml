  note: "The alignment of the minorities against Damascus was a 2025 project: the Hasakah 'unity of components' conference (8-9 Aug 2025) heard the Druze leader Sheikh Hikmat al-Hijri and the Alawite sheikh Ghazal Ghazal by video call for a decentralised or federal state and called the SDF a 'necessary nucleus' of a future army; Damascus replied that the conference 'dealt a blow' to talks, held the SDF fully responsible and skipped the Paris round. Druze protesters demonstrated for the SDF in January 2026. Partner, cooling: the alignment never became a military pact and the SDF's integration removed its main instrument; Suwayda has its own track (Israel, Jordan) with Damascus. Bond - affinity (shared minority fear). No source calls it an alliance."
