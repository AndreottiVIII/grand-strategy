    note: "The most pro-Israel government in the EU: the coalition programme speaks of a 'special relationship', Foreign Minister Macinka said in December 2025 that the embassy should move to Jerusalem in 2026 (he said in May that he wants it in his mandate but it is a cabinet decision), Sa'ar met Babiš on 19 Jan 2026 and called him 'courageous and exceptional', and Prague opened a Jerusalem office in 2021. Czechia abstained (not voted no) on the 12 Sep 2025 UNGA endorsement of the New York two-state declaration, objecting that Israel was not involved. Graded partner, not ally: there is no treaty or guarantee and no source calls it an alliance. Bond - affinity: a long record of pro-Israel positions (the lone European no vote on Palestine's UN upgrade in 2012, the unanimous parliamentary resolution of Oct 2023 urging the embassy move)."
