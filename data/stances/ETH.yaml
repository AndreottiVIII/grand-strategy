  confidence: B
  note: 'Argued grade, and mutual: the Eritrean card (review regrade of 2026-10-16) reads Ethiopia as adversary too, at confidence C. Not a partner to be repaired: on 1 Oct 2026 Ethiopia shut its embassy
    in Asmara and expelled 10 Eritrean diplomats citing ''direct and indirect acts of hostility and belligerence'', Eritrea severed relations, and on 8-9 Oct Addis Ababa told the UN Security Council that
    Eritrean troops had advanced up to 60 km into Tigray (''a blatant act of aggression'' engaging its Article 51 right of self-defence), while it says Asmara finances, arms and directs the armed groups
    whose declared aim is the overthrow of the government. Eritrea answers that Ethiopia has ''declared war'' to seize Assab. Why adversary and not rival: on Addis Ababa''s own account the other side is
    a sponsor of a coalition seeking to remove the regime and an invader, the diplomatic channel is closed, and an analyst (Gardner, The Economist) places the moment as the most dangerous since the 1998-2000
    war and reads Ethiopia''s goal as including the removal of Eritrea''s government from the picture. Why only B: the Eritrean incursion and the sponsorship are Addis Ababa''s allegations, unverified (Rompel),
    Abiy publicly says no bullet will be fired at Eritrea and no source shows a declared aim to end the Eritrean state; the grade falls to rival if the embassies reopen or the UN channel produces a withdrawal.
    Bond grievance: 1998-2000, Eritrea''s exclusion from Pretoria and its brief 2020-22 alliance, which Gardner calls an exception.'
