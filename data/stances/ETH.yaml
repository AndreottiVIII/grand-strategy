  note: 'Mirror of the Egyptian file, with Addis Ababa''s side added. The Nile is the oldest quarrel: the GERD (inaugurated 9 Sep 2025, USD 5bn, after the Egyptian and Sudanese foreign ministers had urged
    Ethiopia to change course) is built, three more Blue Nile dams were announced in March 2026, and on 1 Oct 2026 Ethiopia expelled an Egyptian diplomat on the day it accused Egypt, Eritrea and Sudan of
    backing the seven-group opposition alliance (Egypt denies it and expelled an Ethiopian counsellor). Addis Ababa''s reading is that Egypt is encircling it - the Somalia pact of Aug 2024, AUSSOM troops,
    Eritrea, Sudan, the El Alamein summit of 4 Oct - and its foreign ministry answers that talks on the Nile and the Red Sea must reflect geography. Rival, not adversary: Addis Ababa contests Egypt''s veto
    over the Nile, not Egypt''s existence or regime, and says it stays committed to dialogue; Cairo likewise asks for ''dialogue, not confrontation''. Trump offered to restart GERD mediation at Davos (Jan
    2026). Bond grievance: the water.'
