  note: 'Transactional cooperation after a rupture: the MoU with Somaliland (1 Jan 2024) broke relations, the Turkish-mediated Ankara Declaration (11 Dec 2024) restored them with Ethiopia pledging respect
    for Somalia''s sovereignty and Somalia a sea-access route under its own authority, and Ethiopian troops stayed in AUSSOM (2,500 allocated). Hassan Sheikh Mohamud attended the GERD launch (Sept 2025),
    sat in the Jigjiga trilateral (31 Jan 2026) and met Abiy in Addis Ababa the day before his Djibouti talks of 30 Sep (about 29 Sep), but then signed at El Alamein (4 Oct) a text rejecting any support
    for Somaliland and writing the ''coastal states only'' Red Sea principle - hence cooling. The counter-signal came the next day: he congratulated Abiy on his oath and said Somalia does not object to
    Ethiopian access to the Red Sea through Somali territory if it is negotiated formally. Addis Ababa''s own red line is Gedo: it warned in Oct 2025 that a rival Jubaland administration there would be
    a direct threat. Partner, not reluctant partner: Addis Ababa neither resists nor seeks alignment, it needs Mogadishu out of the Egyptian camp. The Somali card reads Ethiopia as a reluctant partner with
    a grievance bond, stable (mirrored: same sources), and Egypt''s own file grades Somalia a partner and a client: Mogadishu sits at both tables. Bond none.'
