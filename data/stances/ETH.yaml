  note: 'Sudan''s army government recalled its ambassador from Addis Ababa on 5 May 2026, accused Ethiopia and the UAE of drone attacks launched from Bahir Dar (three drones from 1 March, one downed near
    El Obeid on 17 March, one on Khartoum airport in May) and its foreign minister said Sudan was ''ready to enter into an open confrontation''; Addis Ababa called the accusations ''baseless'' and, for
    the first time, accused the Sudanese army of arming ''mercenaries'' against the central government in Tigray. Behind the drones lies the RSF war: Reuters reported on 10 Feb 2026 a secret camp in Ethiopia
    (Menge district, Benishangul-Gumuz) training thousands of RSF fighters with Emirati money, and a Yale Humanitarian Research Lab report of April 2026 read satellite images of the Asosa base as consistent
    with military assistance to the RSF; Ethiopia denies hosting RSF camps or allowing attacks from its soil, and the UAE role is unverified. Khartoum''s card reads Ethiopia as a rival with a grievance
    bond (al-Fashaga, the GERD) and cooling, and names Ethiopian-backed militia incursions in al-Fashaga (Jul 2025). Sudan stands at El Alamein (4 Oct), on the Egyptian side, and the old al-Fashaga farmland
    dispute remains unresolved, with the Sudanese army reinforcing the Gedaref frontier in May. Rival, not adversary: Ethiopia publicly calls for dialogue among Sudan''s warring parties, and neither side
    declares an aim of ending the other - each accuses the other of arming its enemies, a proxy quarrel short of mortal enmity. Bond grievance (changed from none at the 2026-10-16 review, mirroring the
    Sudanese card): the unresolved al-Fashaga border district and the Nile.'
