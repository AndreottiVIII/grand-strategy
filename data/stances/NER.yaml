  # ---------- outside powers ----------
  - toward: FRA
    grade: rival
    trend: cooling
    bond: grievance
    since: '2023-08-25'
    last_verified: '2026-10-16'
    confidence: C
    note: "The junta gave the French ambassador 48 hours to leave on 25 August 2023 and he left in late September; Paris ordered its troops out in the following months, and the junta nationalised the Somair uranium mine in June 2025 as the spat with Orano worsened (Al Jazeera). Rival, not adversary: the aim is expulsion and control of resources, not France's destruction; the junta's grievances are over French interference, not a declared aim to end the French state. Cooling: each step since 2023 has deepened the quarrel. Bond grievance: the open wound of the colonial mining and security relationship. Confidence C: tier-3 reporting. Gap: the date of the French troop withdrawal is not sourced in this pass."
