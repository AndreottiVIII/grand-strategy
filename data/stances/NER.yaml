  - toward: CHN
    grade: partner
    trend: cooling
    bond: none
    since: '2025-03-14'
    last_verified: '2026-10-16'
    confidence: C
    note: "Transactional partner, cooling. The oil and the Benin pipeline keep Beijing in the state's economy, but in March 2025 the junta gave the Niger-based heads of CNPC, WAPCO and the SORAZ refinery 48 hours to leave, citing a pay gap between expatriate and local staff; a tourism decree revoked a Chinese-run hotel's licence the same week. The government's stated reason is a pay dispute; the Alliance of Sahel States called the companies' conduct a 'flagrant disregard' for sovereignty (Capital FM, as reported). Partner, not reluctant: no source reads the pair as forced on Niamey. Bond none: interest only. Confidence C: tier-3 reporting; the reasons differ by source and are recorded here as reported."
