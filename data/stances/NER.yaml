  # ---------- Sahel bloc ----------
  - toward: MLI
    grade: ally
    trend: stable
    bond: affinity
    since: '2025-01'
    last_verified: '2026-10-16'
    confidence: C
    note: "Ally by a written alignment rather than kinship: Niger, Mali and Burkina Faso left ECOWAS together, the exit effective 29 January 2025, and launched a joint passport and a joint military arrangement (AllAfrica, Feb 2025). The Alliance of Sahel States is the bloc of juntas that sets Niamey's foreign line. Bond affinity is our reading: the three share coup-led governments and an anti-French line in every source, and none names kinship. Confidence C: all sources are tier-3 reporting. Mali's own card, written in parallel, carries its own reading of the pair."
    sources:
      - {url: "https://allafrica.com/stories/202502060018.html", title: "Sahel States Exit Ecowas, Launch Regional Passport and Joint Military", publisher: "AllAfrica", date: "2025-02-06", tier: 3}
