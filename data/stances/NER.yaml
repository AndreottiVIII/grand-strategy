    note: "The junta revoked the 2012 military cooperation agreement in March 2024 and called the US military presence 'no longer justified'; the US then withdrew from Air Base 101 in Niamey (early July 2024) and from Air Base 201 in Agadez (completed 5 August 2024). Rival, not adversary: the dispute is over a military presence and its legal basis, with no declared aim of the other's end. Stable: sources in this pass record no change of posture in 2025-26 (a US reading of renewed engagement is unsourced here and not used). Bond grievance: a forced exit after a coup the US declared a coup. Confidence C: tier-3 reporting only."
