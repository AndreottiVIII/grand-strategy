    note: "Cooperates out of necessity while resisting alignment: Abuja extended an olive branch in 2025, reaffirming Niger's sovereignty and inviting talks, and a Nigerian foreign-minister visit to Niamey was planned for April 2025 on cross-border security. The reading is reluctant because Niamey alleged Nigerian involvement in an armed group's attack (arise.tv, 2025) and the friction has not been resolved. Stable: no source in this pass shows a decisive change in 2026. Bond none: no kinship or affinity is named. Gap: the 2023 severing of ties reported by secondary sources is not verified here; the Nigeria card (written in parallel) should be checked against it."
