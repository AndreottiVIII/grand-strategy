  - toward: BEN
    grade: rival
    trend: warming
    bond: none
    since: '2023-07'
    last_verified: '2026-10-16'
    confidence: C
    note: "Mirror of the Benin card (BEN toward NER, rival, warming, same sources): the same reading from the Niamey side. The border has been shut since the July 2023 coup, Niamey kept its side closed after ECOWAS lifted its sanctions, and in May 2024 Benin blocked Niger's crude loading until Niger reopened its side. Warming: the 2 June 2026 visit to Niamey and the expert committee given 15 days to recommend a reopening. Rival, not adversary: the dispute is over trade and the pipeline, with no declared aim of the other state's end. Bond none: no kinship or affinity is named. Confidence C: tier-3 reporting; the committee's outcome is not verified."
