    trend: warming
    bond: none
    since: '2025-04-06'
    last_verified: '2026-10-16'
    confidence: C
    note: "Friction and necessity at once. Niger withdrew its ambassador from Algiers on 6 April 2025, with Mali and Burkina Faso, over the downing of a drone (France 24). Warming: Tiani travelled to Algiers on 15-16 February 2026, read as a search for another outlet given the Benin pipeline dispute (AllAfrica, Feb 2026). Reluctant rather than rival because the trip reads as need, not as a declared rivalry; the Algeria card holds the mirror as neutral and the build will show the asymmetry. Confidence C: tier-3 reporting; whether Niamey's ambassador returned alongside Mali in July 2026 is a gap, as the Algeria card notes."
