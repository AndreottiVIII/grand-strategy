  note: 'Tested against ''partner, cooling'' and moved to rival: Washington sanctioned Burhan personally (16 Jan 2025), determined the army used chemical weapons (May 2025), designated the Sudanese Muslim
    Brotherhood on 9 Mar 2026 (naming the Al-Baraa bin Malik brigade as its armed wing), is reported to be withholding Burhan''s UN visa until he accepts a 90-day ceasefire (22 Sept 2026) and says neither
    the army nor the RSF ''represent legitimate, constitutional governance''. The Reuters report frames it as a low point of the relationship. Not an adversary: the US wants the war ended, not the army
    broken, mediates through Massad Boulos and the Quad (his Nov 2025 text, sent for the Quad, was rejected by Burhan), and would work with ''anyone who is a serious partner for peace''; the army still
    seeks its acceptance. The competing aim is the settlement itself - a truce that freezes the lines against the army''s aim of ending the RSF. Bond grievance: sanctions and the Islamist base''s hostility
    to Washington (our reading). The same US determined on 7 Jan 2025 that the RSF committed genocide, so the pressure falls on both camps.'
