  note: 'Argued from Khartoum''s side: Abu Dhabi is the RSF''s patron (UN experts, Reuters and Le Monde/RFI report Emirati supply by air through eastern Libya''s Kufra airstrip, about 600 flights in 2025,
    and Sudan lodged a complaint over Chad as a transit; the UAE denies it all). Khartoum expelled 15 Emirati diplomats (10 Dec 2023), took the UAE to the ICJ (dismissed 5 May 2025 only because of the UAE''s
    reservation to Article IX of the Genocide Convention, not on the merits), cut relations on 6 May 2025 calling the UAE a ''state of aggression'', refuses the Quad because the UAE sits in it, and in May
    2026 blamed Emirati drones launched from Bahir Dar in Ethiopia for strikes on Khartoum. Rival, not adversary: Khartoum wants the UAE out of the war and called to account, not the Emirati state ended,
    and the UAE (whose own card grades Sudan ''rival'') does not seek the end of the Sudanese state. Symmetric pair. Bond grievance: the open wound is the war itself and the accusation of complicity in
    genocide.'
