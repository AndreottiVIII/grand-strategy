  note: 'Egypt is the army''s main backer and rear base: Cairo''s presidency named Sudan''s territorial integrity and the rejection of ''parallel entities'' as national-security red lines (Dec 2025), Reuters
    and the New York Times place Akinci drones at the East Oweinat airstrip near the Sudanese border, reportedly striking for the army (Cairo does not confirm), Prime Minister Idris made Cairo his first
    foreign stop (Aug 2025) and Burhan joined Sisi, Isaias and Hassan Sheikh Mohamud at El Alamein on 4 Oct 2026. Ally by stable de facto alignment, not by treaty. Friction is real: Egypt sits in the Quad
    with the UAE and relies on Emirati money, and with Riyadh presses Burhan to limit the Islamists. Cairo grades Sudan ''partner'' (asymmetric pair): Egypt is the patron, Sudan the dependent; the Nile
    and Red Sea alignment against Ethiopia is the second tie, and Egypt carries the refugee burden (about 852,000 registered Sudanese on 30 Jun 2026, UNHCR). Bond kin: the Nile valley, language, history.'
