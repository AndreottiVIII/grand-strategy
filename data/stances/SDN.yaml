    while talking of a Red Sea base (Jamestown, Middle East Eye). The Port Sudan base agreement of Dec 2020 (25 years, up to 300 personnel, four ships) was never ratified; the army reviewed it in 2021 and
    2023, and in Feb 2025 the foreign minister told Moscow that only ratification was missing. No source seen shows ratification or construction by Oct 2026, so Russia is a supplier and a reserve, not an
