    the government (Aden, Presidential Leadership Council under Rashad al-Alimi) announced Operation Dawn on 4 October 2026 and vows to ''liberate Sanaa'', while its forces say the aim is to eliminate the
    Houthi threat. Truce-era deals exist (a 1,680-detainee prisoner swap signed 14 May 2026, now postponed) but do not change the structure; the 2022 truce is dead. Bond - grievance: a twelve-year civil
    war, executions after ''espionage'' trials (19 death sentences on 17 May 2026) and, on the Houthi side, the claim that the government is a Saudi creature. The grade is the one named in the brief, supported
    by sources that describe a war of mutual elimination; confidence B.'
