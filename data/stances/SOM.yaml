    Sheikh congratulated Abiy on 5 Oct 2026, saying Somalia does not object to Ethiopian access to the Red Sea through Somali territory if it is negotiated officially. But the MoU with Somaliland has never
    been withdrawn, Ethiopia warned in October 2025 that a rival administration in Gedo would be a ''direct threat'' to its security, and on 4 Oct 2026 Mogadishu sat in the Egypt-Eritrea-Sudan summit that
