  note: 'AUSSOM is the foreign army on which the Somali state stands. The Security Council authorised it in resolution 2767 on 27 Dec 2024 (14 votes to none, the United States abstaining) and renewed it
    unanimously in resolution 2809 on 23 Dec 2025 to 31 Dec 2026, with a ceiling of 11,826 uniformed personnel including 680 police; the 2025 allocation is Uganda 4,500, Ethiopia 2,500, Djibouti 1,520,
    Kenya 1,410 and Egypt 1,091 (delayed). Ally and not partner: a stable de facto alignment on Somali soil against the same enemy, with the host government''s consent and no alternative to it. The friction
    is over money, not posture: arrears to contributors of about USD 94m for 2022-24 (ISS), the US decision of 1 Jul 2026 to stop paying UNSOS and block its renewal, an EU bridge of EUR 75m, the closure
    of the UN political mission UNTMIS on 31 Oct 2026 and the mandate''s expiry on 31 Dec 2026. Trend stable: Mogadishu''s posture toward the mission does not move; the means beneath it are eroding, which
    is the culminating point of this alliance and not (yet) a change of grade. Bond none: a mission, not a kin.'
