    note: "The Belgium-Luxembourg Economic Union of 1921 is the oldest tie and the forerunner of Benelux; the three prime ministers signed a joint declaration at Bourglinster on 10 Sep 2025 reaffirming defence cooperation through the Benelux Steering Group. Shared exposure on the Russian assets is the one friction point. Bond - kin."
