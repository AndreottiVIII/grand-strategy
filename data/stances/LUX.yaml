  - toward: org-eu
    grade: ally
    trend: stable
    bond: affinity
    since: 1957-03-25
    last_verified: 2026-10-12
    confidence: B
    note: "Founding member and host: the Court of Justice and the European Investment Bank are seated in Luxembourg by the protocol on seats, and Eurostat has its directorate there. Luxembourg took part in the EU discussions on the immobilised Russian assets while stating it was not directly affected by the 2024 securities-depository rules. Bond - affinity (a founding member's loyalty to the community method, no kinship). Membership since 1957 is in the Wikidata dataset rows."
    sources:
      - {url: "https://luxembourg.public.lu/en/society-and-culture/international-openness/eu-institutions.html", title: "EU institutions in Luxembourg", publisher: "Luxembourg.public.lu (government portal)", date: 2026, tier: 1}
      - {url: "https://en.paperjam.lu/article/luxembourg-remains-unaffected-", title: "Luxembourg remains unaffected", publisher: "Paperjam", date: 2025, tier: 3}
  - toward: USA
    grade: reluctant_ally
    trend: cooling
    bond: affinity
    since: 2026-02
    last_verified: 2026-10-29
    confidence: C
    note: "Reluctant ally - Luxembourg and the United States are NATO treaty co-members, so friction (the Feb 2026 'rupture' trip, tax and Greenland) makes a reluctant ally, never a partner. Since is the earliest dated sign of the current posture (Feb 2026 trip), not the start of diplomatic relations (1903, not separately sourced here). Transactional, not aligned by treaty beyond NATO: Luxembourg's Prime Minister travelled to Boston and Ottawa in early February 2026 and the French-language press framed it as a possible 'rupture' with the US, with a push to strengthen other partnerships. The US is a financial and tax partner (no tax-treaty source gathered yet). Greenland: no Luxembourg role found in the sources. Grade is our reading of the structure (confidence C); no source uses the word 'partner' for Luxembourg-US. Bond - none."
    sources:
      - {url: "https://www.lesfrontaliers.lu/?p=1216878", title: "Luc Frieden wants closer ties with Canada and speaks of a 'rupture' with the United States", title_original: "Luc Frieden veut se rapprocher du Canada, et évoque une « rupture » avec les États-Unis", lang: fr, publisher: "Les Frontaliers", date: 2026-02, tier: 3}
  - toward: RUS
    grade: rival
    trend: stable
    bond: none
    since: 2025-12-13
    last_verified: 2026-10-12
    confidence: C
    note: "Since is the EU immobilisation regulation of 13 Dec 2025 (the current sanctions posture), not the start of diplomatic relations (1891, not separately sourced here). Sanctions and assets rather than enmity: Luxembourg implements EU sanctions and holds Russian central-bank assets through Clearstream and the financial system; the EU regulation of Dec 2025 immobilised them indefinitely, and Luxembourg's exposure is contested (estimates range from EUR 5.5bn in an older Commission figure to about EUR 10bn in a Parliament briefing we could not retrieve). No sourced statement calls Russia a rival; the grade is our reading of the structure. Bond - none; no kinship or grievance."
    sources:
      - {url: "https://en.paperjam.lu/article/russian-assets-worth-5-5bn-blo", title: "Russian assets worth 5.5bn blocked (Luxembourg)", publisher: "Paperjam", date: 2025, tier: 3}
      - {url: "https://www.mayerbrown.com/ja/insights/publications/2025/12/eu-fast-tracks-new-russia-and-belarus-sanctions-while-indefinitely-immobilizing-russian-sovereign-assets", title: "EU fast-tracks new Russia and Belarus sanctions while indefinitely immobilizing Russian sovereign assets", publisher: "Mayer Brown", date: 2025-12, tier: 3}
  - toward: UKR
    grade: ally
    trend: warming
    bond: affinity
    since: 2024-07-10
    last_verified: 2026-10-12
    confidence: C
    note: "Ten-year bilateral security agreement signed by Prime Minister Frieden with Zelensky on 10 Jul 2024 at the NATO summit in Washington (consultation clause within 24 hours of an armed attack; intelligence, cyber training and defence-industry integration). Military aid: EUR 74.4m (2022), EUR 96m (2023), EUR 80m allocated for 2024, with the same pace for the duration of the agreement; Ukrainian sources report EUR 120m for 2025. Treated as a treaty-level alignment. Bond - affinity: no kinship, sympathy for a state under attack. Confidence C because the sources are tier 3 press and Ukrainian government statements."
    sources:
