  note: Trade partner under conditions. GSP+ was restored in 2017 on a commitment to amend the Prevention of Terrorism Act. The EU staff assessment of July 2026 covers 2023-2025; renewal is under review
    under new criteria for the period after 2027. Sri Lanka reports keeping all 27 ratifications without reservation; the EU notes reporting delays and says civic space has somewhat improved since the 2024
    elections. Partner rather than reluctant partner because the link is trade, not security. Bond - none.
