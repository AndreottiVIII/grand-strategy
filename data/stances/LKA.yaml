  since: 2024-12
  last_verified: 2026-10-12
  confidence: B
  note: 'Transactional cooperation without alignment. Dissanayake''s first trip as president (Dec 2024) ended with a pledge that Sri Lankan territory would not be used in ways detrimental to India. The
    April 2025 visit added a five-year defence umbrella arrangement, a grid interconnection agreement and a trilateral Trincomalee energy hub with the UAE. Not an ally: there is no treaty of alliance and
    Colombo keeps its neutral line. Cooling pressure comes from the Palk Strait fishermen arrests and from Tamil politics. Bond - affinity: our reading (confidence C), shared Buddhist and cultural ties
    and the Indian Ocean neighbourhood; no kinship is claimed.'
