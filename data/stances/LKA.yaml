  confidence: B
  note: 'Trade friction managed by negotiation. The US reciprocal tariff on Sri Lankan goods came down from 44% to 20% after talks with the US Trade Representative; the 20% rate took effect on 7 August
    2025. Since is the start of the tariff regime, not of the relationship. Adani withdrew a US$553m DFC loan request for the Colombo West terminal in December 2024, after US bribery charges against its
    chairman; Colombo said it had no objection. An aid-cut premise was not found in the sources and is not recorded. A report of a 10% bracket after a July 2026 forced-labour import ban rests on one explainer
    and is not recorded. Bond - none: transactional.'
