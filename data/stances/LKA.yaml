  confidence: B
  note: 'Cooperates on trade and Commonwealth business but resists the accountability track the UK leads. Resolution 46/1 (2021) created the evidence project. The UK-led text A/HRC/60/L.1/Rev.1 (October
    2025) renewed it for two years without a vote; Colombo rejected it, calling its reference to 51/1 an unprecedented, ad hoc expansion of the mandate. The grade is reluctant because the friction is structural
    (the state''s own war record), not a trade quarrel. Bond - affinity: former colonial power and Commonwealth member, our reading (C).'
