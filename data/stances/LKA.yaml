  note: 'Debt-linked cooperation without alignment. Hambantota went under a 99-year lease in July 2017 after Chinese loans. The Sinopec refinery deal was fast-tracked in January 2025 (US$3.7bn, 200,000
    barrels a day; work expected in 2025, not confirmed in later reporting). The one-year ban on foreign research vessels lapsed at the end of 2024 without a finished SOP. In 2025 entry was handled case
    by case: the navy denied the UN-chartered vessel in May and the President approved it in June. That is a lapse, not a formal relaxation. Bond - none: pure interest and debt, our reading (C). The debt
    figure is not reconciled (about US$6bn in some reports, US$8bn in others).'
