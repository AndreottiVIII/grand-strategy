  note: 'Reconciled at Al-Ula on 5 Jan 2021 after the 2017-21 Saudi-led blockade (13 demands including closing Al Jazeera and curbing ties with Iran, which Doha rejected); a Saudi-Qatari Coordination Council
    followed, and the emir attended the emergency GCC meeting in Jeddah (April 2026). Mirror of Riyadh''s reading (Saudi Arabia grades Qatar `partner`, stable, bond kin). Partner, not ally: no bilateral
    defence treaty, and Doha keeps its own channels (Hamas, Iran, Turkey) and its own US guarantee, which is what the blockade taught it. Bond `grievance`: the blockade is the formative wound of Qatari
    foreign policy even though the Gulf Arab and tribal kinship is real (Riyadh''s side of the same tie is kin).'
