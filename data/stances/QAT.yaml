  note: 'Qatar shares the world''s largest gas field (the North Field, called South Pars in Iran) with Iran and has cultivated Tehran as insurance for decades, yet the 2025-26 wars made it a target: Iran
    fired missiles at Al Udeid on 23 Jun 2025 (telegraphed, all intercepted by Qatari claim), 66 missiles at Qatar on 28 Feb 2026 (16 injured by debris), hit Ras Laffan in March (about 17% of LNG capacity
    out for 3-5 years), had two Su-24 sorties shot down on 2 Mar, and struck a Qatari LNG tanker on 7-8 Jul. Qatar expelled Iran''s military and security attaches on 18-19 Mar, summoned the deputy ambassador
    in July, and then sent its prime minister to Tehran on 27 Aug 2026 to discuss a Hormuz shipping corridor and joint demining; it keeps relaying US-Iran messages (foreign ministry briefing of 6 Oct 2026)
    and sent a delegation to Khamenei''s funeral. `reluctant_partner` because it cooperates out of necessity (Hormuz carries about 93% of its LNG, the field is shared) while resisting Iranian coercion;
    not `rival` because Doha seeks de-escalation and not Iran''s defeat, not `adversary` for the same reason. Qatar declined in March to lead the mediation ''so that attacking Qatar does not earn Iran better
    terms'', then returned to it by August. Bond none.'
