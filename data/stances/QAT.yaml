  note: 'Qatar is Hamas''s interlocutor and host of its political leadership in Doha, and the channel through which the October 2023 hostage exchanges, the Oct 2025 Sharm el-Sheikh ceasefire and the 31
    Jul 2026 phased-disarmament agreement were negotiated. Cooling: the 9 Sep 2025 Israeli strike put the Doha office at risk (Qatar had already weighed its future in Nov 2023), Hamas leaders reject disarmament
    and ''foreign rule'' (Meshal, Feb 2026) and voiced ''unease'' with the Board of Peace in Aug 2026, while Qatar now presses Hamas as guarantor and publicly blames Israel for the delays. Partner, not
    ally: Doha uses Hamas as an interlocutor rather than an instrument, and the two do not share aims on disarmament or the Gaza governance plan. Bond affinity: shared Muslim Brotherhood-adjacent politics,
    not kinship.'
