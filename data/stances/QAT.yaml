  note: 'No diplomatic relations (an earlier Qatari bid to restore ties was rebuffed by Israel) and an open wound since the Israeli airstrike on a residential compound in Doha on 9 Sep 2025, which killed
    five Hamas members and a Qatari security officer while the Hamas delegation discussed a US ceasefire proposal. Netanyahu said removing the Hamas chiefs in Qatar removed the ''main obstacle'', then warned
    Israel might strike again, then apologised in a call arranged by Trump on 29 Sep 2025; Qatar''s emir convened an Arab-Islamic summit (15 Sep) and still kept mediating. Rival, not adversary: Doha wants
    the strikes not to recur and Israel''s behaviour constrained, not Israel''s end, and it keeps negotiating with Israel through the Gaza track (Sharm el-Sheikh, Oct 2025; disarmament agreement of 31 Jul
    2026), where in August 2026 it blamed Israel for obstructing implementation. Israel''s own stance toward Qatar is not yet written.'
