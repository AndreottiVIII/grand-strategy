  note: 'The grade rests on three official facts. Executive Order 14353 (29 Sep 2025) makes any armed attack on Qatar''s territory, sovereignty or critical infrastructure a threat to the peace and security
    of the United States, with joint contingency planning and diplomatic, economic and, if necessary, military response; Qatar was designated a major non-NATO ally on 10 Mar 2022; and Al Udeid, the largest
    US base in the region (about 10,000 personnel), sits on its soil. Qatar buys the alliance with money: USD 243.5bn of announced deals during Trump''s visit of May 2025 (arms of about USD 3bn), a Qatari
    Air Force facility at Mountain Home (Oct 2025), emergency-fast-tracked Patriot and APKWS replenishment (May 2026), a gifted 747 for Air Force One. It is `ally` rather than `reluctant_ally` because Doha
    chose and pays for the arrangement; the friction is real but does not change the structure: a US partner struck its capital on 9 Sep 2025 with Washington on notice, the order is an executive act, not
    a Senate treaty, and Qatar''s spokesman now says the US alliance is ''important but insufficient'' and that security self-sufficiency is ''the only way forward'' while it deepens ties with Turkey and
    Pakistan. Bond none: interest, not kinship.'
