  note: 'Pakistan was the Taliban''s patron and sanctuary; since 9 Oct 2025 (first Pakistani strike on Kabul) it is the Emirate''s main military enemy: border war in October 2025, Doha/Istanbul ceasefire talks that failed, ''open war'' declared by Khawaja Asif on 26-27 Feb 2026 with strikes on Kabul and Kandahar, a truce from 18 Mar, talks in Urumqi in April, new strikes on 24 Sep 2026; borders mostly closed since 12 Oct 2025; over 2.4 million Afghans returned from Pakistan since 2023. Zelin (WINEP, Aug 2026) says Pakistan went ''from patron to adversary'' - a source that uses the stronger word. Adversary test: the grade stays rival because neither side''s declared aim is the other''s disappearance. Islamabad says borders reopen on ''decisive and verifiable action'' against the TTP and keeps attending China-, Qatar-, Turkey- and Saudi-mediated talks; Kabul says it is ''open to talks'', sends delegations, and treats the TTP as Pakistan''s internal affair. Asif''s ''obliterate'' and ''open
    war'' lines and the Taliban''s claim that Pakistan backs anti-Taliban fronts are the argument for adversary and are the reason the trend is cooling and the confidence C; the grade would change if Pakistan stated a regime-change aim or Kabul sought Pakistani territory. Bond - grievance: the TTP sanctuary, deportations, the Durand Line, the trade closures. Pakistan''s card grades Kabul rival too (cooling).'
