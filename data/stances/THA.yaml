  note: "Partner, not ally: the 16-20 Jul 2026 visit produced a joint statement reaffirming the 'community with a shared future', a new 2+2 mechanism for foreign-affairs and defence consultations (first meeting in Thailand), expanded defence-industry cooperation, scam and fraud data sharing, and commitments to speed up phase 1 of the Bangkok-Nakhon Ratchasima high-speed railway (250 km, target 2030) and the free-trade upgrade. Defence ties are deepening (a Chinese S26T submarine, delivery expected end-2028; the engine saga is a paradox of the card), and China is the first trading partner. Friction: the Uyghur deportation of Feb 2025, which pleased Beijing and angered Washington, and the Chinese EV drive on the Thai car industry. Bond - affinity: large Sino-Thai population and decades of royal and commercial ties."
