- toward: USA
  grade: ally
  trend: stable
  bond: affinity
  since: 1954
  last_verified: 2026-10-12
  confidence: B
  note: "A treaty ally (Manila Pact of 1954, the basis for what the Thai defence minister calls 'the oldest treaty ally in Southeast Asia') and a Major Non-NATO Ally since 2003; Cobra Gold 2026 (24 Feb-6 Mar, about 8,000 troops from 30 nations) was co-hosted as usual, and a trade framework of 26 Oct 2025 keeps the 19% reciprocal rate in return for zero tariffs on about 99% of US goods, though the agreement is still unsigned and the US imposed a 12.5% tariff in July 2026. Friction is real but has not changed the structure: the air force bought Swedish Gripen instead of F-16s despite US lobbying (Aug 2025), the deportation of 40 Uyghurs to China (27 Feb 2025) brought US visa restrictions on Thai officials (14 Mar 2025), and Trump pressed Thailand and Cambodia alike in July 2025. Not graded reluctant_ally because nothing suggests Bangkok is aligned out of necessity. Bond - affinity: seven decades of treaty ties, Cobra Gold, the Vietnam-era base legacy."
