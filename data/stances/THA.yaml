  note: "Adversary or rival: rival. The July 2025 war (24-28 Jul, at least 43 dead, over 300,000 displaced) and the December 2025 round (at least 47 dead, over a million displaced in three weeks) were the deadliest fighting between the two in decades, and Cambodia says Thailand illegally occupies its territory. But neither government seeks the other's end or regime: both signed the 26 Oct 2025 Kuala Lumpur declaration, both defence ministers signed the 27 Dec 2025 ceasefire statement (direct lines, frozen positions, demarcation through the Joint Boundary Commission), the leaders met on ASEAN sidelines in 2026, and Crisis Group's October 2026 report is titled 'Toward a Thaw'. Thailand keeps the high ground and sees little reason to change the status quo; trade is down 40%. No source uses the word 'rival': the grade is our reading of the structure (confidence C). Bond - grievance: the Preah Vihear clashes and the ambassadors recalled in Nov 2009, the 2025 war, and the scam compounds."
