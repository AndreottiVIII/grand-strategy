  note: "Bangkok deals with the junta because it holds the border, not because it endorses it: the foreign minister's line is 'it's not about legitimacy, it's about reality' (Al Jazeera, Aug 2026), analysts expect a 'dual-track' approach with both sides of the border (NST), and the Special Advisory Council for Myanmar says Thailand has 'torched its credibility'. The thaw is recent: in Feb 2025 Thailand cut power, internet and fuel to five junta-side border areas to pressure the scam compounds; in April 2026 Anutin was the first ASEAN leader to congratulate Min Aung Hlaing as president and in August he hosted him, and the chiefs of defence met on 20 Aug. Reluctant partner, not ally: no treaty, cooperation limited to drugs, scams, counter-terrorism, disaster relief and the border. Bond - none: interest only."
