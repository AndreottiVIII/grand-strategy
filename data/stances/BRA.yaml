  note: 'Mercosur partners who cooperate out of necessity (the bloc still runs, per Paraguay''s president) while the presidents feud openly. Milei called Lula a ''thief'' and a ''convict'' at a July 2026 rally in Sao Paulo for Flávio Bolsonaro; Brasilia recalled its ambassador from Buenos Aires for consultations. Peña calls the differences irreconcilable but says the bloc works. Cooling: no sign of a turn as of August 2026. No Argentine card existed when this was drafted; the ARG card now grades Brazil partner / cooling / bond none, so the two readings differ only in the necessity word. Bond none: no kinship or affinity is cited. Sharpened 2026-10-16: the recall, first reported without a primary source, is now confirmed by four Brazilian outlets (Itamaraty called Ambassador Julio Bitelli for consultations on 26 July and summoned the Argentine ambassador; Milei repeated the accusations on 2 August; Bitelli was told to stay in Brazil indefinitely). The outlets disagree on whether Brazil downgraded
    the embassy to a chargé d''affaires (Brazil Journal says yes, Estadão says no), so that is not recorded. Argentina''s foreign minister said a rupture is out of the question, Brazil being its main trading partner. Added 2026-10-29: the runoff of 25 October went to Lula, whom Milei had openly opposed; most of South America, including right-wing presidents, congratulated Lula while Milei issued no congratulations and was the last South American leader not to recognise the win (MercoPress and Buenos Aires Times, 26 Oct); a La Politica Online headline later says he acknowledged the result grudgingly. The trend stays cooling and the grade reluctant partner: the feud has no sign of ending and Brazil''s re-elected president now faces him for four more years.'
