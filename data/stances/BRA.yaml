  note: 'Brazil''s side of a pair the US card reads as rival (USA stance toward BRA, same sources). Brasilia cooperates out of necessity - the US is the market that the 2025 tariff and the 2026 Section 301 duty target - and resists alignment: it condemned the US removal of Maduro in January 2026 as an ''unacceptable line''. Warming on the same facts as the USA card: the Moraes delisting of 12 Dec 2025 and the partial rollback of the tariff. Bond - grievance: the 50% tariff was imposed over the Bolsonaro trial, an open wound. No Brazilian official statement on the tariff itself is cited here; the grade is a reading, confidence C. Sharpened 2026-10-16: the trend is moved from warming to stable. The sources read after the first draft contradict a thaw: the 7 May 2026 Lula-Trump meeting set a 30-day window for the tariffs, yet the 25% Section 301 duty still came on 15 July (in force from 22 July, with a separate 12.5% forced-labour surcharge reported), Brazil is preparing a response under its
    Reciprocity Law, Lula barred the US official Darren Beattie in March after he sought to visit Jair Bolsonaro in prison, and the defence minister said on 4 August that Brazil could not stop a US invasion. Beef, coffee, aircraft and rare earths are exempt from the new duty, so it is not a rupture. The USA card still reads warming on its own side; the two trends differ on purpose. Updated 2026-10-29 after the runoff of 25 October: the trend is moved from stable to cooling, grade unchanged. Lula won and framed the win as a defeat of foreign interference ("Brazil is nobody''s backyard", Ynetnews, 2026-10); Trump questioned the result without evidence on 26 October (MercoPress, Buenos Aires Herald), and Amorim is reported to rule out joining the US "Shield of the Americas" (SCMP). No change to the tariffs or to the Section 301 duty has been found, so the structural position is the same and the grade stays reluctant partner.'
