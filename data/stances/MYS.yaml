  note: 'Partner, not reluctant partner: Kuala Lumpur does not resist China, it declines to align with it (Anwar, September 2026: Malaysia stays neutral under US pressure and Beijing understood). China has been the largest trading partner for 17 consecutive years (US$132.5bn in 2025, 17.7% of trade) and, level with Singapore, the largest source of approved FDI (MYR58.0bn of a record MYR426.7bn in 2025); Xi''s state visit of 15-17 Apr 2025 produced 45 documents and Anwar''s Shanghai and Hangzhou trip of September 2026 MYR28.6bn of potential investment and an in-principle extension of the East Coast Rail Link to the Thai border (not yet approved). The friction is kept quiet: Chinese coast guard vessels sit beside Kasawari and the Luconia Shoals and Petronas keeps drilling. Warming on the evidence of 2025-26. Bond affinity is our reading (Anwar called Xi an ''outstanding leader'' in June 2024; a large ethnic Chinese minority); no source calls it kinship.'
