  note: 'Partner, not ally: no treaty, no basing, and the neutral line is stated in public. The 2025 high - Trump at the ASEAN-US summit on 26 Oct 2025, a critical-minerals memorandum, the Agreement on Reciprocal Trade at a 19% rate, a permit rule for US-origin AI chips from 14 Jul 2025 - became a managed distance: the agreement was never ratified, Malaysia declared it void in March 2026 after the Supreme Court''s IEEPA ruling, the Section 301 rate is 10% since 24 Jul 2026 and an excess-capacity finding is still pending. Anwar also condemned the US operation in Venezuela (4 Jan 2026) and refused two US requests to designate Hamas (Nov 2023). Cooling on that sequence; the tariff relief of 2025 was bought with commitments Malaysia has since disowned. Bond none: pure interest.'
