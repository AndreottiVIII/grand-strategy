  note: 'Mirrors Singapore''s own card. Partner in the sense that matters: the Johor-Singapore Special Economic Zone (MOU 11 Jan 2024, agreement signed in January 2025, welcomed at the 12th leaders'' retreat on 4 Dec 2025; S$5.5bn of Singapore-based commitments since January 2024), the RTS Link, both are FPDA members, and Singapore stands level with China as the top FDI source in 2025. The old wounds are open: water under the 1962 agreement to 2061, airspace and the maritime boundary in the Johor Strait were still ''unresolved'' in December 2025; Pedra Branca went to Singapore at the ICJ in 2008 (Wikipedia pointer, tier 4). Bond grievance rather than kin, as on the Singapore side: the separation of 1965 and the disputes it left, our reading; the family ties are real but have never ended a dispute. Warming because of the zone and the rail link.'
