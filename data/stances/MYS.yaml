  note: 'Argued: rival, not adversary. The ontology reserves ''adversary'' for a declared aim of the other''s defeat or disappearance; Kuala Lumpur does not seek Israel''s end - Communications Minister Fahmi said in December 2023 that the port ban signals that Malaysia does not recognise Israel, the government advocates a two-state solution and says it will establish relations only after a peace agreement with the State of Palestine. But it is far more than neutral: Israel has never been recognised and there are no relations; ZIM and Israeli-flagged ships have been barred and Israel-bound cargo cannot be loaded since December 2023 (no sign it was lifted; not re-verified for 2026); Anwar called the Gaza strikes ''the height of barbarism'' (Oct 2023), met Hamas leaders in Doha (May 2024) and mourned Sinwar (Oct 2024), and Wisma Putra called the interception of the Global Sumud Flotilla on 2 Oct 2025 ''criminal and cowardly acts of aggression''. No source uses the word ''rival'': the grade is our reading of the structure (confidence C). Bond grievance: Palestine as a standing cause in Malay-Muslim politics.'
