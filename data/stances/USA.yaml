    Ally by stable de facto alignment, not by treaty: the 2016 MOU (USD 38bn to 2028), 68% of Israel's arms
    imports, a war on Iran fought together from 28 Feb 2026 after Netanyahu argued for the joint killing of
    Khamenei, a USD 25.8bn emergency arms package in May 2026, and the NSS's 'that Israel remain secure' among
    the core interests. The friction is Washington's as much as Jerusalem's - Vance called the Knesset's
    annexation bill 'a very stupid political stunt' and Trump warned Israel would lose US support (23 Oct 2025);
    Trump signed an Iran memorandum Israel says does not bind it; Netanyahu rejected the Board of Peace roadmap
    of 31 Jul 2026; talks opened on 5 Jun 2026 to phase out direct aid - but no source questions the commitment,
    so not reluctant_ally. Stable: leader-level quarrels against deeper military integration. Bond - affinity:
    Congress, the diaspora, shared politics. Mirrors ISR's grade of the US (ally, stable, affinity).
