  note: >-
    The atlas's reference case for 'rival' (ONTOLOGY: 'the US toward China'), read from Washington: the NSS
    names China the near-peer whose 'predatory' practices must be ended and whose domination of Asia must be
    deterred by denial along the First Island Chain, and the NDS says the goal 'is not to dominate China; nor to
    strangle or humiliate them'. No will to destroy the other state, a chip embargo and a tariff wall held as
    bargaining chips, a truce extended two months at a time. Warming because three summits in eleven months
    (Busan 30 Oct 2025, Beijing 14-16 May 2026, Xi in Washington 23-25 Sep 2026) cut tariffs on about USD 30bn
    of goods, launched a Board of Trade and an AI dialogue, restored military channels and let Nvidia sell H200s
    for a cut; the NYT reads the turn as 'embracing it as a peer power'. Not partner: each side keeps its weapon
    (rare-earth licences, the affiliates rule, the arms package to Taiwan 'in abeyance'). Bond - grievance, in
    Washington's own telling: a trade relationship 'fundamentally unbalanced' since 1979, 'grand-scale
    intellectual property theft', fentanyl precursors - the NSS writes the wound into the strategy. Mirrors
    CHN's grade of the US (rival, warming, grievance).
