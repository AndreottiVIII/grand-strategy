  note: >-
    Rival with a thaw, not a partner. The structure has not moved: Washington is still the author of the
    sanctions (extended Feb 2025; Rosneft and Lukoil listed 22 Oct 2025; a Senate act authorising 100% tariffs
    on buyers of Russian oil passed 86-11), the supplier of the Patriots Ukraine fires (through PURL) and, since
    Ankara (Jul 2026), of a production licence; New START was allowed to expire on 5 Feb 2026 with no successor.
    What changed is the channel - Trump's first call (12 Feb 2025), Riyadh, Witkoff in Moscow, Anchorage, the
    28-point draft taken from a Russian paper, envoys again in Sep 2026, a Russian-diesel purchase in Oct 2026
    that the Senate calls illegal - and the NSS's aim of 'strategic stability with Russia' and an end to NATO as
    a 'perpetually expanding alliance'. Warming measured from 2024; the Rubio-Lavrov exchange of June 2026
    ('a proposal, not an agreement') marks the ceiling. Bond - none: Trump's Washington treats Moscow as a deal
    counterpart; the grievance (2016, Ukraine) belongs to Congress and to Europe, not to the White House, which
    is why the bond is asymmetric with Moscow's own 'grievance'. Mirrors RUS's grade of the US (rival, warming).
