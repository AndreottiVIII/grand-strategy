  note: 'The one ''adversary'' of the card and the test case for the grade. For: Washington opened a war on 28 Feb 2026 whose stated reasons, in the President''s own statement, included regime change; Trump
    had called for regime change on 17 Jan (''it''s time''); the first strikes killed the Supreme Leader; a naval blockade was imposed on 13 Apr and reinstated on 13 Jul after a signed memorandum (17 Jun)
    collapsed; Tehran''s new leader promises vengeance ''until fully achieved''. The NSS wants Gulf energy kept from ''an outright enemy'' - its one use of the word. Against: Hegseth said it was not ''a
    so-called regime-change war'', the June memorandum and the October demands (a ''meaningful'' cut in enrichment, Hormuz reopened) are the terms of a settlement, and the State Department''s legal note
    frames the operation as self-defence. The atlas reads it as a war between two states each of which would accept the other''s defeat, with talks as an instrument of the war; if a settlement on enrichment
    and Hormuz holds, the grade becomes rival. Stable: the aim has not moved since February while the means have (blockade, strikes, memorandum, strikes again). Bond - grievance: 1979, the embassy, Beirut
    1983, and now the base attacks (6,700 missiles and drones on US-hosting states by May 2026). Mirrors IRN''s grade of the US (adversary, stable, grievance).'
