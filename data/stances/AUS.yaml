  note: 'Our reading of the structure, not a label any source uses (the brief for this card suggested ''partner''; the structural rule of ONTOLOGY.md points the other way and the reviewer should decide).
    For: China takes almost a third of Australia''s trade; Albanese was in Beijing on 12-18 Jul 2025 for the Annual Leaders'' Meeting with Li Qiang, after Beijing had removed the trade barriers that cost
    Australian exporters more than A$20bn a year; no source records a stated aim of defeating China. Against ''partner'': AUKUS, the Quad and the whole Pacific treaty web (vetoes on third-party security
    in the Nauru and Tuvalu treaties, a ban on foreign bases in the Vanuatu agreement, a treaty bid for Solomon Islands against the 2022 China policing pact) are built to deny Beijing a foothold; the PLA
    Navy''s live-fire exercise in the Tasman Sea (21-22 Feb 2025, 49 flights diverted) was a show of reach; Albanese reasserted in January 2026 the election pledge to return Port Darwin to Australian control,
    and Ambassador Xiao Qian warned that Beijing would feel obliged to take measures to protect the Chinese company''s legitimate interests. The Diplomat''s 2024 phrase ''frenemies'' sums the mix. Warming
    because the leader-level thaw since 2022 has outrun the structural hedge, and the trade is flowing. Not adversary: the aim is deterrence and denial, not Beijing''s defeat. Bond - none: pure interest.'
