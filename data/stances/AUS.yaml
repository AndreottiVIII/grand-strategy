  note: 'ANZUS (1951), AUKUS and the AUSMIN process make this the structural alliance, and in 2025-26 the formal ties grew: the Pentagon''s review ended in December 2025 with an endorsement of the sale
    of at least three Virginia-class boats from 2032 and ''critical deadlines'' for all three capitals; on 20 Oct 2025 Trump told Albanese the programme was going ''full steam ahead'' and the two signed
    a critical-minerals framework (at least US$1bn of co-financing in six months, a US$8.5bn pipeline). The friction is recorded and real - the 10% ''Liberation Day'' tariff (Albanese: ''not the act of
    a friend''), Hegseth''s request at Shangri-La 2025 for 3.5% of GDP, Elbridge Colby''s reported push for a pre-commitment on Taiwan, Trump''s public rebuke of Ambassador Rudd - but each time Canberra
    paid or deferred rather than distanced itself (the April 2026 defence strategy sets 3% by 2033 under NATO accounting, not 3.5%), and ADF personnel were aboard a US submarine in the 2026 Iran war. Held
    at ally, not reluctant ally: no source reads Canberra''s side as grudging, and the Wong line on the June 2025 US strikes on Iran was support. Stable because the treaty layer thickened while the trust
    question (will the guarantor come?) did not move. Bond - kin: Anglosphere, Five Eyes, war memory. The USA card is being written in parallel; reconcile the pair after it lands.'
