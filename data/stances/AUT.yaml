  note: 'Not an adversary: Austria wants no change of regime in Moscow, stays neutral in the military sense and kept the Gazprom contract until OMV ended it itself. But it backs every EU sanctions package, sends Ukraine non-military aid, convicted Egisto Ott for espionage for Moscow (May 2026) and expelled three Russian diplomats on 4 May 2026 over an antenna array on embassy roofs, bringing the total to 14 since 2020; the foreign minister called the abuse of diplomatic immunity ''unacceptable''. Cooling because the gas break (16 Nov 2024) removed the last big material tie and the espionage cases keep coming; the Raiffeisen bank and the EUR 3.15bn Rasperia claim are the remaining entanglement. The FPÖ (first in 2024) wants an end to sanctions, so the line depends on the coalition. Bond - none: an interest-only relation since the 1955 State Treaty ended the occupation.'
