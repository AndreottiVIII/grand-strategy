  note: 'Rival and the one neighbour on which Beijing has unlearned the lesson of 2025: Takaichi''s ''survival-threatening situation'' sentence (7 Nov 2025) was answered with a travel advisory (14 Nov),
    the seafood ban re-imposed (19 Nov), a dual-use export ban on military end-users (6 Jan 2026) with 20 entities listed (24 Feb), a joint statement with Moscow against Japanese ''militarism'' (Dec 2025),
    a refusal to reaffirm the 1972 communique and the demand, repeated to Iwaya on 28 Sep 2026, that the remarks be ''corrected''. No Xi-Takaichi meeting is fixed for APEC Shenzhen. Tokyo''s white paper
    calls China the ''greatest strategic challenge''; Beijing calls that ''hyping up''. Rival, not adversary: Beijing wants a Japan that stays out of a Taiwan contingency, not the end of the Japanese state,
    and keeps selling (23.6% of Japan''s imports). Cooling: eleven months without the retraction or the thaw. Bond - grievance: 1937-45 is Beijing''s standing narrative (the 2025 parade was the ''80th anniversary
    of victory'') and the Diaoyu/Senkaku claim its daily practice (357 days of coast-guard presence in 2025).'
