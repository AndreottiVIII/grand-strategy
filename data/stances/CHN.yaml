  note: 'Claimed, not controlled: the Anti-Secession Law of 14 Mar 2005 reserves ''non-peaceful means'' (Article 8), the Taiwan Affairs Office calls Lai''s speeches ''full of lies'', and Beijing''s declared
    aim is the end of Taiwan''s separateness, which is why Taipei''s own card grades the pair asymmetrically (rival from its side). The squeeze is the method: Strait Thunder (Apr 2025) and Justice Mission
    (29-31 Dec 2025, the closest live fire so far, a Type 075 for the first time), the ''diehard'' list (14 names and 12 accomplices by 7 Jan 2026, death penalty in absentia under the June 2024 guidelines),
    cable incidents, and the KMT received by Xi (10 Apr 2026) while the DPP government is refused. Stable, not cooling: air sorties in 2026 are about half of 2025 and no named exercise followed the two
    Trump summits, because the American channel is now the main instrument - Xi asked Trump in Washington to ''oppose'' independence and the second arms package sits ''in abeyance''. Bond - kin: ''one family'',
    the civil war, language; a feud in the atlas''s terms.'
