  # ---------- the United States and the claimed island ----------
  - toward: USA
    grade: rival
    trend: warming
    bond: grievance
    since: 2018-07-06
    last_verified: 2026-10-16
    confidence: A
    note: "Rival, the atlas's reference case for the grade (ONTOLOGY: 'the US toward China'), read here from Beijing: competition over technology, trade, Taiwan and the order, no will to destroy the other. Beijing's own words are 'healthy competition kept within bounds' and no 'Thucydides trap' (Xi, Washington, 24 Sep 2026); its structure is a chip embargo it cannot answer in kind, an 'affiliates rule' and a 47% tariff wall answered with rare-earth licences and the market. Warming because three summits in eleven months (Busan 30 Oct 2025, Beijing 14-16 May 2026, Washington 23-25 Sep 2026) each extended the truce, launched a Board of Trade and an AI dialogue, cut tariffs on about USD 30bn of goods and put military-to-military channels back; Brookings reads Xi as preferring 'anemic stability to no stability at all'. Not partner: the truce is a pause on each side's weapons (soybeans excluded, magnets 20% below trend, the arms package to Taiwan 'in abeyance' but not withdrawn), not an alignment. Bond - grievance: the Taiwan Relations Act and arms sales since 1979, the 1999 Belgrade embassy bombing and the 'containment' narrative are the standing wound in Beijing's reading, whatever the mood of the summit."
