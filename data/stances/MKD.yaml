    note: "Review 2026-10-12: regraded reluctant_ally - co-members of NATO/EU with visible friction are allies by necessity, not rivals (ONTOLOGY scale). Prespa Agreement in force since February 2019; Greece is a NATO co-member, a major investor and the partner of the Gevgelija-Negotino gas interconnector and the Markova Noga-Lemos border crossing (Commission: cooperation 'intensified'). But Athens holds the other veto: it accuses Mickoski and President Siljanovska-Davkova of 'flagrant violation' by using 'Macedonia' in domestic contexts, says it will not ratify three cooperation memoranda until Skopje complies, and the government spokesman again tied the EU road to Greece in early October 2026. Partner rather than ally despite common NATO membership (the dataset would derive 'ally'): the name is a standing grievance and Mickoski treats Prespa as a mistake he will not repeat. Not rival, because the cooperation on energy and borders is real and Skopje asks for 'unconditional' Greek support. Trend cooling: 2024-26 friction, nothing resolved."
