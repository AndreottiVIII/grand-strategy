    note: "Review 2026-10-12: regraded reluctant_ally - co-members of NATO/EU with visible friction are allies by necessity, not rivals (ONTOLOGY scale). Bulgaria is the first obstacle on Skopje's EU path: it has blocked the opening of negotiations since 2020 and, with the 2022 French proposal, requires the constitution to name Bulgarians (Zhelyazkov, Oct 2025: Sofia adds no new condition to the 2022 proposal). Skopje answers with two conditions (rights for Macedonians in Bulgaria; no further bilateral vetoes) and the Commission notes that no steps have been taken. Incidents keep the wound open: the Ivan Mihailov club sentence (Jun 2025), the arson of two Bulgarian embassy cars in Skopje (15 Jun 2026, suspect detained, motive unknown). The grade is rival, not ally, although both are NATO members (the dataset would derive 'ally'): Sofia's claim that Macedonian language and history are Bulgarian is a contest over identity, and the bilateral friendship treaty of 2017 and Corridor 8 are working in parallel. Trend stable: von der Leyen's visit of 2 Oct 2026 produced a first step, but no movement on the constitution. Bond - grievance: history, language, the 1943 Vatasha anniversary a day after the arson."
