  - toward: ALB
    grade: partner
    trend: stable
    bond: kin
    since: 2020-03-27
    last_verified: 2026-10-12
    confidence: C
    note: "Albania is the motherland of North Macedonia's large ethnic Albanian community, and a NATO co-member (the dataset would derive 'ally'). The Commission says relations 'remained good' with agreements on security, defence, infrastructure and energy, and a 400 kV interconnector line is under implementation. Partner, not ally: no bilateral alliance, and the Mickoski government has a recurring friction with Tirana-adjacent politics - students and politicians from Albania and Kosovo joined the April-May 2026 bar-exam protests, DUI's Trajanov called that 'impermissible external influence', and Albania left the cross-border programme without a Joint Technical Secretariat in July 2024 (Commission). Grade C because no source calls the state-to-state relation by name; the stance is the structural reading. Bond - kin: language and ethnicity of a large part of the electorate, a standing tie."
    sources:
      - {url: "https://enlargement-infohub.eu/wp-content/uploads/2025/11/north-macedonia-report-2025.pdf", title: "North Macedonia 2025 Report (regional relations; energy networks; IPA cross-border programme)", publisher: "European Commission", date: 2025-11-04, tier: 1}
