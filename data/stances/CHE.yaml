  note: 'Transactional, not an alliance: a 39% US tariff from 1 Aug 2025 (cut to a 15% framework on 14 Nov 2025, with a USD 200bn Swiss investment pledge to 2028) was upended by the Supreme Court''s IEEPA
    ruling on 20 Feb 2026; no final deal as of 30 Jun 2026. Swiss politicians called to cancel the F-35 over the tariff, Patriot deliveries slip four to five years with payments frozen, and the Federal
    Council stopped new arms-export licences to the US in March 2026 (neutrality, Iran war). Cooling for those reasons; bond - affinity (shared democratic and business ties; the US is the second-largest
    export market).'
