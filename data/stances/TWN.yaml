  since: 1979-04-10
  last_verified: 2026-10-12
  confidence: C
  note: 'Ally by structure, reluctant by friction. There is no treaty (the 1954 defence pact ended in 1979), but the Taiwan Relations Act, arms sales (a record USD 11.1bn notified in Dec 2025, USD 14bn
    approved by Congress in Jan 2026 and now held by Trump ''in abeyance''), training and the USD 250bn investment deal of Jan 2026 make the alignment stable and de facto; there is no alternative guarantor,
    which is why it is not a mere partner. The friction is visible and rising: Trump called the package ''a very good negotiating chip'' after the Beijing summit (14-16 May 2026), said he is ''not looking
    to have somebody go independent'', raised the Six Assurances question, hosted Xi on 23-25 Sep 2026 (Beijing says Xi asked the US to oppose independence; the White House fact sheet is silent on Taiwan),
    and Lutnick wants 40% of the chip chain moved to the US while the 15% tariff stays negotiable. Washington''s own line is ''unchanged'' (Rubio). Grade is our reading of structure (confidence C): sources
    describe the relationship as unofficial, strategic ambiguity and, since May, as transactional. Bond - affinity: democratic kinship, Congress and the Taiwanese diaspora; no grievance.'
