  note: 'Rival and not adversary, on purpose. Beijing claims the island, rehearses its blockade (Joint Sword 2024, Strait Thunder-2025A on 1-2 Apr 2025, Justice Mission-2025 on 29-31 Dec 2025, the closest
    live fire so far), punishes ''Taiwan independence diehards'' (14 named plus 12 accomplices by 7 Jan 2026, rules of 21 Jun 2024 that allow the death penalty in absentia) and presses in the grey zone
    (cable cuts, coast guard). Taipei''s own government calls China a ''foreign hostile force'' (17 measures, 13 Mar 2025), which is the strongest source for the hostility, but its declared aim is to be
    left as it is and to talk ''on an equal and dignified footing'' (Lai, 1 Jan 2026), not to end the Chinese state or its regime, so the mortal-enemy grade does not fit from Taipei''s side; the ROC constitution''s
    claim over the mainland is dormant, so claimed_territory does not apply either. The pair is asymmetric: Beijing''s aim is the end of Taiwan''s separateness. Trend stable: air activity in 2026 is half
    of 2025 while ships stay, Xi met KMT chair Cheng on 10 Apr 2026, and no named exercise has followed the Trump-Xi summits. No source uses the word ''rival''; the hostile reading itself rests on Taipei''s
    own designation of China as a ''foreign hostile force'' (13 Mar 2025), so confidence B (review, 2026-10-16): the atlas''s placement is only between rival and adversary. Bond - kin: language, history
    and a shared civil war, which makes the pair a feud; Xi calls Taiwanese ''one family''.'
