  note: 'No diplomatic relations and no treaty, so partner and not ally, but the closest of the unofficial ties and warming fast: on 7 Nov 2025 Prime Minister Takaichi told the Diet that a Chinese blockade
    or use of force against Taiwan could be a ''survival-threatening situation'' for Japan, refused to retract it, and took the Chinese reply (seafood ban, travel advisories, dual-use export bans on 20
    Japanese firms in Feb 2026, a refused Li Qiang meeting) rather than back down; Tokyo then fixed a date, fiscal 2030, for surface-to-air missiles on Yonaguni, 110 km from Taiwan. The Chinese retaliation
    is also the reason the warmth is limited: Takaichi says her position did not change and the 2026 Bluebook is said to downgrade China from ''most important'' relationship. Bond - affinity: shared democracy
    and a common worry about the strait; no source calls it kin.'
