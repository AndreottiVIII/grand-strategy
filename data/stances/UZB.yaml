  note: 'Both capitals call it a ''comprehensive strategic partnership and alliance'' (Mirziyoyev-Putin, St Petersburg, 4 Jun 2026, trade up 20% since January), but the structure is partnership: no CSTO
    membership, only observer status in the EAEU (Dec 2020, still the line in Oct 2024), neutrality on Ukraine thanked by Putin (Jun 2024). The ties that bind are material - remittances (72.4% of inflows
    from Russia in Q1 2026), gas (6.48 bcm in 2025), Rosatom (first concrete 24 Mar 2026) and more than a quarter of gasoline - and the friction is real (June 2025 protest at the treatment of Uzbek migrants).
    Carnegie reads it as Russia failing to deliver in specific sectors, which is why Tashkent diversifies. Not ''ally'': no mutual defence and the ''alliance'' wording is rhetoric. Bond - affinity: Soviet
    legacy, language and 1.34 million Uzbeks working in Russia, without kinship.'
