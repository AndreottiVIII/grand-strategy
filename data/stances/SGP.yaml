  note: "Founding member and the frame for the strategy: Wong, September 2025: 'we do not want a region that is dominated by just one superpower.' ASEAN is the vehicle through which Singapore keeps the US and China in the region without choosing; it is not an alliance, hence partner (as the Philippines and Vietnam grade it). Singapore's first sanctions and its Hormuz and chips stances show where it will act outside ASEAN consensus. Bond - affinity, our reading."
