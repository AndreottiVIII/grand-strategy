  note: 'Treaty ally under the 1961 Treaty of Friendship, Cooperation and Mutual Assistance, whose 65th anniversary Xi invoked in Pyongyang on 8-9 Jun 2026; Kim called ties the ''top strategic priority''.
    The posture has gone cool and then warm: Pyongyang''s turn to Moscow in 2022-24 thinned Chinese contact and trade fell 5% in 2024 (USD 2.1bn); Kim attended Beijing''s parade on 3 Sep 2025 and met Xi
    on 4 Sep (their sixth meeting), trade rose 25% to USD 2.7bn in 2025, and Xi made his first visit in seven years. Analysts read Xi''s trip as Beijing reasserting itself as ''the principal actor'' in
    the North; the treaty and the 98% share of official trade are why this stays an alliance despite the resentment a dependent partner carries. Not graded reluctant_ally because the 2024 friction has been
    repaired in both leaders'' public acts. Bond - affinity: party ties and the Korean War, not kinship.'
