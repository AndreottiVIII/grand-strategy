  note: 'Rival, not adversary - argued. Pyongyang''s stated aim is acceptance of its arsenal and an end to ''hostile policy'', not the end of the American state; Kim told the SPA on 21 Sep 2025 that he
    has ''a good memory'' of Trump and that there is ''no reason not to sit down'' if Washington drops the ''absurd obsession with denuclearising'', and the Ninth Congress repeated that the two could ''get
    along'' on that condition. What would make it adversary is the regime-change fear, and Kim cites it (US action in Venezuela, per analysts) as the reason the arsenal is permanent; but no document sets
    the American state''s defeat as an aim. Warming from the Trump outreach (Trump on 19 Aug 2026: he will meet Kim ''later this year'', Kim Yo Jong denies any contact); not warm enough to be a partner:
    the sanctions (OFAC designations of 12 Mar 2026), the ICBM and enrichment disclosures and the Bybit heist all point the other way. Hanoi legacy: the second summit collapsed on 28 Feb 2019 and Kim suspended
    nearly all cooperation with the South afterward (AP). Bond - grievance: the Korean War and ''hostile policy''.'
