  note: 'Treaty ally. The Comprehensive Strategic Partnership Treaty signed in Pyongyang on 19 Jun 2024 (ratified in Moscow on 6 Nov 2024) obliges each side to military assistance if the other is attacked;
    Pyongyang used it by sending the Kursk force (confirmed by Moscow on 26 Apr 2025 and by Pyongyang on 28 Apr), a missile unit and about 12 million shells, and receives cash, oil above the UN cap, food
    and technology (USD 10-14bn on Bloomberg''s count). Kim and Putin met again in Beijing on 3 Sep 2025 and the first road bridge opened in Sep 2026. Sources mirrored from Russia''s card (same links).
    Friction is thin: the Ninth Congress report did not mention Russia, and the terms are Moscow''s to end with the war, which is why this is a paradox and not a plain gain. Bond - affinity: Soviet-era
    patronage renewed, not kinship.'
