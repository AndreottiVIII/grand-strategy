  note: 'Rival, not adversary - argued. For: Kim calls South Korea the ''most hostile'' state and ''principal enemy'', threatens to ''completely destroy'' it if threatened, has cut roads and rails, fortified
    the line since 2024 and has made the doctrine constitutional. Against: the ontology reserves ''adversary'' for a declared aim of the other''s defeat or disappearance, and the doctrine of December 2023
    says the opposite - Pyongyang gave up absorbing the South, wrote reunification out of the constitution (March 2026), defines the South as a bordering state and seeks separation, the destruction threat
    being conditional on attack. A state that fences itself off and denies the other state''s claim to kinship is a rival with an arms race, not a mortal enemy; Seoul''s own ''peaceful two-state'' white
    paper (May 2026) treats it the same way. Cooling because the 2025-26 steps (Party Congress, border works, mines of 21 Sep 2026, rejection of every Seoul overture by Kim Yo Jong and the SPA speech) hardened
    the separation, not because of any thaw. Bond - kin: language, history and the 1948 founding claim; Pyongyang formally repudiates it, so the pair is a feud in Luttwak''s sense and Pyongyang''s repudiation
    is the bet, not yet the fact. The USA-PRK pair below is the real test of adversary and stays rival too.'
  sources:
