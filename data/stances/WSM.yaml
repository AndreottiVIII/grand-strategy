- toward: AUS
  grade: partner
  trend: stable
  bond: affinity
  since: 2018
  last_verified: '2026-10-12'
  confidence: B
  note: "Partner, not ally: no defence treaty with Australia. The relation is aid, policing and labour mobility. Australia's 2025-26 budget set a record A$2.2bn for Pacific development (Samoan press report). Samoa's flagship programmes: Tautai (governance, A$45m, 2022-30) and Tautua (human development, A$40m, 2021-29), plus A$105.5m direct budget support and A$30m toward a Legislative Assembly building. Policing: the Samoa-Australia Policing Partnership turned 15 in 2024; the Nafanua III patrol boat was handed over in Nov 2023; the Pacific Policing Initiative made its first deployment at the Apia CHOGM. Labour: Samoa joined Australia's Pacific Labour Scheme in 2018 (Nauru Forum), reviewed its take-up in 2021 and capped contracts at three years; in Feb 2026 Wong said Samoa sets the numbers. Stable. Bond - affinity: Pacific and Commonwealth ties and a large diaspora, not kinship."
