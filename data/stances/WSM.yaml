- toward: USA
  grade: partner
  trend: stable
  bond: none
  since: 1971-07
  last_verified: '2026-10-16'
  confidence: C
  note: "Partner, light: cordial relations, formal diplomatic relations since 14 July 1971 (recognition on independence, 1 January 1962), the largest export market at nearly half of exports (per the US Embassy, as summarised in a search result), a Peace Corps programme since 1967, an embassy in Apia since 1988, and a 2012 shiprider agreement letting Samoan officers ride US Coast Guard ships. The American Samoa tuna cannery at Pago Pago (StarKist) draws on Samoan labour: about 1,700 workers at the January 2026 restart, per a trade-press report not checked against the company. The 2023-25 engagement asked for in the brief was NOT found in any source opened here. The US Embassy page refused the fetch (HTTP 403), so it is cited as the official page only, not as read. Stable. Bond - none: no kinship or grievance claim in the sources used."
