- toward: NZL
  grade: reluctant_ally
  trend: stable
  bond: affinity
  since: 1962-08
  last_verified: '2026-10-16'
  confidence: B
  note: "Aligned by necessity, with visible friction. Samoa keeps no armed forces, and the 1962 Treaty of Friendship makes New Zealand the channel for defence help, so the alignment is structural. Friction is recurrent: the Western Samoa Citizenship Act 1982 overrode a 1982 Privy Council ruling for Samoans born 1924-1949, and NZ law restored that right on 20 Nov 2024; the Manawanui wreck off Upolu (Oct 2024) left a compensation grievance; and in March 2026 Samoa's prime minister said Luxon had sought a matai title, which Luxon's office denied and Apia later confirmed he had not requested. Not graded 'ally': Fiji's card reads its NZ framework as partnership, and Samoa's treaty is closer to alliance than that, so the call is a judgement and is marked B. Stable: the treaty holds, the friction recurs. Bond - affinity: 182,721 people of Samoan ethnicity lived in NZ at the 2018 census (Stats NZ, as cited on Wikipedia): affinity with a large diaspora, not kinship with the state."
  sources:
