- toward: CHN
  grade: partner
  trend: warming
  bond: none
  since: 1976
  last_verified: '2026-10-16'
  confidence: C
  note: "Partner, transactional: no alignment, pure interest. Diplomatic relations date from 1976 (Wikipedia); another line on the same page says Samoa recognised the PRC from 1975, so the start date is not settled. Warming: the May 2022 agreement signed by Mataafa and Wang Yi covered climate change, COVID-19 and security; in Feb 2025 China gave WST$50,000 (NZ$30,000) to Safata villages after the Manawanui wreck. Money: China was owed $299.8m of $810.4m external debt at end-2023, about 37% (our calculation). Police: the 2025 police cooperation named in the brief is NOT confirmed. The only 2025 item found is a multilateral China-Pacific police dialogue (Lianyungang, 18 Sept 2025) that does not say Samoa signed anything. What exists: the 2022 pact, which SBS reported as including a fingerprint laboratory and talks on a police training centre (not opened), and the Dec 2023 Beijing dialogue where China offered law-enforcement and security cooperation. Chinese-built buildings: the eight-storey government office block on Apia's waterfront (1992-94, Chinese soft loan, shown on the $50 tala note per CGTN); a Mulinu'u justice and parliament-office complex under a Chinese loan (RNZ, not opened). Bond - none."
