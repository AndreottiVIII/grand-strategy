    note: "China has been Madagascar's largest trading partner for nine consecutive years, by China's own WTO statement (a tier 1 statement by the Chinese government, not checked by a second source). That is transactional trade, so partner, with no alignment. Bond none is our reading: no kinship or affinity appears in the sources. Trend stable. Context, not part of this grade: Madagascar revoked overflight approval for Taiwan's president's aircraft in April 2026, which Taipei says Beijing pressed for (see the TWN row in the relations file). Gap: no Malagasy trade figure, loan or infrastructure project is verified in this pass; the CHN card is not written, so nothing is mirrored."
