  - toward: USA
    grade: partner
    trend: cooling
    bond: none
    since: '2025-08'
    last_verified: '2026-10-16'
    confidence: C
    note: "AGOA, the duty-free preference for the US market, was due to lapse at the end of September 2025. Madagascar's trade minister went to Washington in September 2025 to plead for renewal, and the renewal was still pending before the House in February 2026. Partner is our reading of that trade tie; cooling because the preference was at risk and still unrenewed in the sources. Bond none is our reading. Gap: the US aid suspension of 2025 reported in news summaries is not sourced here, and the US posture on the military transition is not researched; the USA card is not written, so nothing is mirrored."
    sources:
