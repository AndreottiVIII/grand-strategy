  note: 'The AU Peace and Security Council suspended Madagascar from all its activities and organs on 15 October 2025, after the military takeover. Madagascar answers by pleading its case rather than leaving: Malagasy press reported in February 2026 that it was pleading for its return, while the military leader denies the takeover was a coup. Reluctant partner is our reading of cooperation under necessity with visible contest over the verdict; no source uses the phrase. Trend stable: the suspension was still reported in late July 2026 search excerpts (those pages were not opened), so no change is sourced. Bond none is our reading. Gap: the PSC communiqué text was not opened in this pass; the AU card is a stub, so nothing is mirrored.'
