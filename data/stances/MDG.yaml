  - toward: FRA
    grade: partner
    trend: stable
    bond: grievance
    since: '2025-04'
    last_verified: '2026-10-16'
    confidence: C
    note: "Former colonial power and the partner Antananarivo keeps talking to, with an open grievance over the Scattered Islands. Partner is our reading: Malagasy coverage frames the February 2026 Paris trip as economic, which is transactional cooperation without alignment. The grievance is the sovereignty dispute: Macron refused restitution in April 2025 and the joint commission made no progress in June 2025. Trend stable. Madagascar stripped former president Rajoelina of Malagasy citizenship in October 2025, the reported ground being his French nationality; this adds friction but is not a stance on its own. Bond grievance is our reading of the dispute. Gap: the French side's view of Madagascar is not in the atlas yet, so nothing is mirrored; the FRA card is not written."
