  note: 'Not an alliance and not a client: Oman keeps Iran as the neighbour it must live with across the Strait of Hormuz and as the interlocutor no other Arab state can reach. Iran chose Oman as venue
    for the 2025 and Feb 2026 talks, Sultan Haitham was the first Arab leader to congratulate Mojtaba Khamenei (9 Mar 2026), Tehran pledged to double trade to USD 5bn (Sep 2025), and on 17 Aug 2026 the
    two announced an ''understanding'' on a Hormuz transit map. Trend stable, not warming: Iranian drones hit Duqm, Salalah and Sohar in March 2026 and the IRGC struck Duqm on 12 Jul (Oman summoned the
    ambassador, ''irresponsible acts''), the worst crisis in decades per Iran International, which still calls Oman Iran''s ''most valuable Arab partner''. Build warning (Iran grades Oman ''partner'' while
    Oman has a treaty row with the US, which Iran grades adversary): answered - the 1980 and 2019 US texts are facilities-access agreements with no mutual-defence clause, Oman is bound by no defence treaty
    to Iran''s enemies (the UK defence agreements aside), and Tehran itself chose Oman as venue for the 2025-26 talks. Bond affinity: decades of Qaboos-era contact and a shared Strait.'
