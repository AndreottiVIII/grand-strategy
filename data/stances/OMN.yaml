  note: 'The oldest Arab tie to Washington (Treaty of Amity and Commerce, 1833), formal US access since 1980 and Duqm and Salalah since 2019, a free trade agreement in force since 2009 - but no mutual-defence
    treaty, so ''partner'' (transactional, no alignment) rather than ally. The grade is held back by the 2026 strain: Trump threatened Oman on 27 May (''behave ... or we will have to blow them up'') and
    again in the week of 17 Aug; former ambassador Marc Sievers says Oman ''has not behaved as a neutral mediator''; Albusaidi wrote on 18 Mar that the US had ''lost control of its own foreign policy''.
    AGSI''s Jacobs: the US ''needs Oman'' on Hormuz. The 12 Jul IRGC strike on Duqm hit the US-facing facilities. Cooling, not broken. Bond affinity: two centuries of treaty relations and US training and
    arms, tempered by the Albusaidi criticism.'
