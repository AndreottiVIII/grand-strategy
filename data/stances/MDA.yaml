  note: 'Moldova''s 2023 national security strategy names Russia the main threat (Jamestown''s headline calls it an ''existential threat'') and says Russian troops are ''illegally stationed''; Sandu told the nation in Sep 2025 that the Kremlin was spending hundreds of millions of euros on a plan for unrest and ''a springboard to Odesa''; on 11 Aug 2026 Chișinău recalled its ambassador over the Crocmaz drone. But the ontology reserves ''adversary'' for a mortal enemy whose declared aim is the other''s defeat or disappearance. Moldova''s aim is withdrawal of the Russian garrison and a stop to interference, not Russia''s defeat; embassies remain open and Russia''s own embassy (11 Aug 2026) says it is open to dialogue; Russia''s aim in Chișinău is a compliant government, not the abolition of the state. The structure is the hardest rival, not an adversary. No source uses the word ''rival'': the grade is our reading (confidence C). Bond - grievance: 1992 war, a 30-year occupation, subversion.'
