  note: 'The hardest edge case in the atlas. Pakistan declared ''open war'' on 27 Feb 2026 (Defence Minister Asif; Operation Ghazab lil-Haq) and has struck Kabul, Kandahar and the border provinces since,
    so the posture is hostile; but the aim, in the Middle East Institute''s reading, is to force a ''behavioural change'' in the Taliban leadership, not to remove it, and Islamabad keeps negotiating (Doha
    and Istanbul in Oct 2025, Urumqi in April 2026, Eid truces mediated by Saudi Arabia, Qatar and Turkey). Reports that Pakistan is ''planning for regime change'' rest on anonymous sources and are read
    by analysts as emotion rather than strategy. Hence rival, not adversary; reopen if the Taliban leadership becomes the declared target. The Taliban deny sheltering the TTP and Crisis Group says Pakistan
    is the state worst hit by their takeover. About 2.4 million Afghans were deported or returned since 2023 (Pakistani figure). The Durand Line is not graded here for lack of a source. Bond - grievance:
    sanctuary for the TTP, deportations and the air strikes.'
