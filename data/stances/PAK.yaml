    of 23-26 May 2026 produced a CPEC 2.0 joint statement (Karakoram Highway, Gwadar). Friction is real and structural: about 20 Chinese nationals killed in 14 attacks since 2021, Chinese power producers
    owed Rs560bn, and Beijing publicly claimed to be ''not familiar'' with the use of its jets. The grade stays ally because China is Pakistan''s security supplier and diplomatic shield; Indian claims that
    Beijing gave ''live inputs'' in May 2025 are unproven. Bond - affinity: shared hostility to India and ''iron brothers'' rhetoric, not kinship.'
