  note: 'The ontology test for ''adversary'' is a declared aim of the other''s destruction or regime change, and it fails on both sides. Pakistan''s aim is deterrence, Kashmir and water: the defence minister
    and the PM threaten force only if India attacks again or diverts the Indus (''act of war'', UN, Sept 2026); the May 2025 war was four days of limited strikes ended by a ceasefire (10 May) through the
    military hotline, and Track-2 meetings in Muscat, Doha and London are reported. India''s own measures (Indus Waters Treaty in abeyance since 23 Apr 2025, trade and visas suspended) are coercion, not
    a bid to end the Pakistani state. Everything else is rivalry at its sharpest: nuclear-armed, no official dialogue, an arms race (Fatah-IV, Rocket Force) and a water lever that Pakistan calls an existential
    threat. If India diverts flow or strikes the leadership, the grade should be reopened. Bond - grievance: partition, four wars and Kashmir.'
