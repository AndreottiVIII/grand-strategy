    neutrality on Ukraine was undercut; Pretoria said US intelligence had not been shared and opened a judicial inquiry, and the defence minister said the cargo was an old consignment offloaded. Not ally:
    no treaty appears in the sources. Trend stable: no 2025-26 source on the outcome of the inquiry or on the Johannesburg summit of August 2023, which the ICC warrant against Putin complicated and which
    is not sourced here. Bond none: the Soviet-era tie is not sourced. Confidence C: the accusation is a tier 1 statement, the rest is 2023 reporting. Sharpened 2026-10-16: the outcome of the inquiry is now sourced. The independent panel chaired by Judge Mojapelo found no evidence that any cargo of weapons was loaded for export onto the Lady R, only the offloading of a 2018 Armscor order for the SANDF (summary of 3 September 2023; the full report stays classified). That weakens the US account but not the structural reading: Russia also took part in the China-led BRICS+ naval exercise in South African waters in January 2026 (China facilitated the invitations, South Africa gave its waters), and Ramaphosa said in 2025 that he spoke with Putin about a Ukraine settlement. Grade and confidence unchanged.'
