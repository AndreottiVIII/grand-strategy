    note: "Partner, with the bloc's failure in view: the SADC summit of 13 March 2025 ended the SAMIDRC mandate in eastern DRC after 14 South African soldiers died in January, and the withdrawal began on 29 April 2025 with M23 still in the field. Cooling: South Africa's commitment to bloc-wide force shrank. Our reading (confidence C). Bond none."
