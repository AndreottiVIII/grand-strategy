stances:
  # ---------- the great powers and the rivals ----------
  - toward: USA
    grade: rival
    trend: cooling
    bond: grievance
    since: 2025-02-07
    last_verified: 2026-10-16
    confidence: B
    note: "Rival, not adversary: aid, trade and the refugee question are contested, and neither side seeks the other's end. Mirror of the USA card, same sources: Executive Order 14204 cut aid (7 Feb 2025), the Ramaphosa-Trump White House meeting of 21 May 2025 turned on claims of white-farmer killings, the 30% tariff applied from 7 August 2025, AGOA lapsed on 30 September 2025 and was renewed only to the end of 2026, and South Africa was left out of the 2026 G20 in Miami (Truth Social, 26 Nov 2025). Trend cooling. Bond grievance, South Africa's side (our reading): the aid cut and the Afrikaner refugee order are read in Pretoria as an attack on the state. The expulsion of the US ambassador is in the USA card but no source for it is cited here, so it is not counted."
    sources:
      - {url: "https://www.whitehouse.gov/presidential-actions/2025/02/addressing-egregious-actions-of-the-republic-of-south-africa/", title: "Addressing egregious actions of the Republic of South Africa (Executive Order 14204)", publisher: "The White House", date: 2025-02-07, tier: 1}
