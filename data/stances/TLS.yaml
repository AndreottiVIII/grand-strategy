- toward: CHN
  grade: partner
  trend: warming
  bond: none
  since: 2023-09
  last_verified: 2026-10-12
  confidence: B
  note: "Partner, transactional: a comprehensive strategic partnership announced in Sept 2023 (Gusmao met Xi at the Hangzhou Asian Games), then a Belt and Road cooperation plan and several agreements (agriculture, digital economy, infrastructure, the Global Development Initiative) at Ramos-Horta's state visit to Beijing in July 2024, the first by a Timorese president. Finance is mostly pledged, not signed: the Eximbank pledges for the Suai highway and Dili airport never became finalised loan agreements (AidData), No alliance text. Trend warming on the 2023-24 steps; the 2025 contacts were not found in this pass. Bond none: interest without shared identity."
  sources:
    - {url: "https://rsis.edu.sg/rsis-publication/rsis/chinas-engagement-with-timor-leste-amid-geopolitical-tensions/", title: "China's engagement with Timor-Leste amid geopolitical tensions", publisher: "RSIS", date: 2024-07-10, tier: 2}
