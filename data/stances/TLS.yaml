- toward: IDN
  grade: partner
  trend: warming
  bond: grievance
  since: 2025-10-26
  last_verified: 2026-10-12
  confidence: B
  note: "Partner, with the 1975-99 occupation and the 1999 referendum violence underneath (bond grievance). What holds the relation is trade and the border: about 70% of goods on the market are Indonesian-origin (Trade Minister Budi Santoso, 2025), bilateral trade reached US$391.3m in 2024, the land-boundary talks were pushed in Oct 2024, and a 21-year-old border trade pact is being revised. Indonesia backed the ASEAN bid and Prabowo signed the admission declaration on 26 Oct 2025. Trend warming because the 2024-26 steps run one way. Not an ally: nothing in the sources is a security alignment."
