- toward: AUS
  grade: partner
  trend: stable
  bond: grievance
  since: 2026-01-28
  last_verified: 2026-10-12
  confidence: B
  note: "Partner with a grievance. Australia's bugging of Dili's cabinet during the 2004 Timor Sea talks (the Witness K case, alleged) has not been apologised for: the charges against Bernard Collaery were dropped in July 2022, which Dili welcomed, but Canberra has not admitted the operation and no 2025 apology was found (HRLC, Jan 2024). The Albanese visit of 28-29 Jan 2026 produced a joint declaration, 'a new partnership for a new era': US$220m for human development, US$80m for private-sector development, US$8.2m for ASEAN and WTO participation, a 10% share of combined future upstream Greater Sunrise revenue to a Timor-Leste infrastructure fund (other reporting gives a larger share; not resolved here), and 10,000 Timorese workers in Australia by 2027-28. The friction is the field: Dili wants a pipeline to its south coast, Woodside prefers Darwin, and first gas has slipped to 2034-35. Grade partner rather than reluctant partner because the cooperation is broad and no source calls it grudging; trend stable because the declaration and the slipping gas talks pull in opposite directions."
  sources:
    - {url: "https://www.pm.gov.au/media/strengthening-our-partnership-timor-leste", title: "Strengthening our partnership with Timor-Leste", publisher: "Office of the Prime Minister of Australia", date: 2026-01-29, tier: 1}
