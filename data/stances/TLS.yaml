- toward: PRT
  grade: partner
  trend: stable
  bond: kin
  since: 2002-07-05
  last_verified: 2026-10-12
  confidence: B
  note: "Kin: language and the colonial past. Timor-Leste opened its first embassy abroad in Lisbon on 5 July 2002. Portugal's four-year framework of EUR 75m (EUR 5m more than the last) is centred on education and the teaching of Portuguese (announced in 2025). Inside the CPLP, Timor-Leste, Portugal and Brazil opposed Equatorial Guinea's bid for the 2027-29 presidency, which the PALOP countries back; Timor-Leste was elected to a temporary CPLP presidency in Dec 2025 and its president led the CPLP mission to Bissau after the Nov 2025 coup. Partner, not ally: broad cooperation without a security alignment, and the impasse is still open (Aug 2026)."
