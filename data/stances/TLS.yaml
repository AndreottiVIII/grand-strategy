    - {url: "https://china.aiddata.org/projects/85849", title: "China Eximbank pledges loan for Dili Airport Rehabilitation Project", publisher: "AidData", date: 2015, tier: 2}
- toward: USA
  grade: partner
  trend: cooling
  bond: none
  since: 2025-02-05
  last_verified: 2026-10-12
  confidence: B
  note: "Partner in the transactional sense: no grievance and no alliance text. The 2025 aid suspension and the dismantling of USAID, a significant funder, were met calmly by Ramos-Horta ('won't hurt Timor-Leste', Feb 2025), but by Nov 2025 the USAID compound in Dili stood vacated and programmes for health, rural economies and sanitation were in doubt (Pulitzer Center). Sources differ on the size of the USAID programme, so no figure is used. Trend cooling: the aid cut is the move, and the replacements come from Australia and Japan. Bond none."
  sources:
    - {url: "https://en.tatoli.tl/2025/02/05/trumps-foreign-aid-suspension-wont-hurt-timor-leste/19/", title: "Trump's foreign aid suspension won't hurt Timor-Leste", publisher: "Tatoli (state agency)", date: 2025-02-05, tier: 1}
    - {url: "https://pulitzercenter.org/node/35811", title: "USAID's Dili compound and the aid cut in Timor-Leste", publisher: "Pulitzer Center", date: 2025-11, tier: 3}
- toward: org-asean
  grade: ally
  trend: warming
  bond: affinity
  since: 2025-10-26
  last_verified: 2026-10-12
  confidence: B
  note: "Alignment in a rules-based association, not a military alliance (the same reading as the IDN card). Full member, the eleventh, since the Declaration on Admission at the 47th ASEAN Summit in Kuala Lumpur on 26 Oct 2025, the first enlargement in over 25 years. Japan pledged continued support for Timor-Leste's ASEAN integration in Aug 2026. Trend warming because the membership is new and the integration programme is running. Bond affinity: the region."
