- toward: USA
  grade: reluctant_ally
  trend: cooling
  bond: none
  since: 2021-03-17
  last_verified: 2026-10-12
  confidence: B
  note: "The grade follows the structure, not the labels. CRS calls Jordan a 'key U.S. partner' and says security cooperation is 'arguably the foundation' of the relationship; VOA called it a 'key Arab ally'. The structure is an alliance in fact: a Defense Cooperation Agreement in force since 17 Mar 2021, nearly 4,000 US troops (Dec 2024), a USD 1.45bn a year MoU for FY2023-2029 (USD 10.15bn), F-16 Block 70 on order, Muwaffaq Salti used to strike Iran. It is `reluctant` because friction is visible and growing: Trump pressed Jordan on 11 Feb 2025 to take Gazans and floated aid cuts, the US and Israel are said (Middle East Eye, May 2026, unnamed sources) to be working to strip the Al-Aqsa custodianship, Jordanians fear Washington would side with Israel on annexation, a petition of more than 100 activists asks US forces to leave after the 17 Jul 2026 strike, and Amman insists the US presence is 'defensive'. Bond - none (a client relationship of interest). The USA card is a stub; its own grade of Jordan is still to be written."
