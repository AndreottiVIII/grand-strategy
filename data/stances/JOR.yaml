  note: "Treaty partner since the 1994 peace treaty (CRS: 'at peace since 1994'), but the relationship is at its lowest since before the treaty: no ambassadors on either side since November 2023 (Jordan refuses the return of Israel's and will not send its own), the water-for-energy swap refused in 2023, annexation of the West Bank called the King's 'red line', Jordanian planners reportedly weighing abrogation, and the Foreign Policy reading that Amman sees a bigger threat in Israel than in Iran. Not `rival` because the treaty, gas supply, the bridges, Gaza-aid coordination and the shared air screen against Iran still operate, and Amman aims its criticism at the current Israeli government, not the state; not `adversary` because nothing seeks Israel's destruction. `reluctant_partner` is the grade that records cooperation out of necessity while resisting alignment. Sources conflict on the energy deals: Foreign Policy says 'energy and water deals were canceled' (the 2021 swap is), while Jordan News (Oct 2026) still describes coordination on gas. Bond - grievance: the Palestinian question and the fear of an 'alternative homeland'. Israel's own grade of Jordan is not yet written."
