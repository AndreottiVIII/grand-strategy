- toward: PSE
  grade: partner
  trend: stable
  bond: kin
  since: 1988-11-16
  last_verified: 2026-10-12
  confidence: B
  note: "Kin and custodian, but partner rather than ally: Jordan recognised Palestine in 1988 (dataset row), has a population that is an estimated 55-70% of Palestinian origin (CRS), trains Palestinian police at JIPTC and supplies Gaza through the Allenby corridor, and the King repeats a two-state solution with East Jerusalem as the capital. The structural limit is that Jordan's first red line is that the Palestinian question not be settled on its territory: it refused Trump's displacement idea on 11 Feb 2025 (offering only 2,000 sick children), rejects confederation or a security 'substitute' role in the West Bank, and its interest in Palestinian statehood is also its interest in keeping Palestinians out. Bond - kin: language, religion, demography, the 1948-67 history."
