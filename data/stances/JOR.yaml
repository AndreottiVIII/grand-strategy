- toward: SYR
  grade: partner
  trend: cooling
  bond: affinity
  since: 2024-12-23
  last_verified: 2026-10-29
  confidence: B
  note: "A warming partnership with the post-Assad government, built on border security rather than trust: foreign minister Safadi met al-Sharaa on 23 Dec 2024 ('stand by our Syrian brothers'), a joint security committee on border threats and drug smuggling was set up in January 2025, the King met al-Sharaa on 26 Feb 2025, Jordan hosted the Suwayda trilateral with Syria and the US (19 Jul, 12 Aug and 16 Sep 2025), and the water-sharing agreement of July 2025. Jordan struck smuggling sites in southern Syria on 24 Dec 2025 'in coordination with regional partners', and the second session of the Jordan-Syria Higher Coordination Council in Amman on 12 Apr 2026 signed 10 MoUs and a cooperation agreement and agreed a joint roadmap for Suwayda and the south (mirrored from the SYR card, whose reading of Jordan is partner / warming / bond none; a third session is set for Damascus in October 2026). Jordan is also a corridor for Qatari gas and Arab Gas Pipeline supplies. CRS adds that Amman publicly criticises Israeli incursions in Syria but privately assures Israel it will block Iran-backed groups, and that an electricity and gas deal could be revived after the repeal of the Caesar Act. Refugees: about 460,000 registered in Nov 2025, 173,000 returned in a year, about 345,000 in Oct 2026. Bond - affinity: Arab neighbour, tribal and trade ties. Update 29 Oct 2026 (trend moves from warming to cooling; grade unchanged): on 26 Oct Jordan's military struck what it called militant hideouts in Daraa and Suwayda and claimed more than 20 Islamic State militants killed (Reuters, 27 Oct). Syria said seven people died, three of them children and a woman, that the strikes were made without prior coordination and violated its sovereignty, and it closed the Nasib crossing to passengers and trade (Reuters, 27 Oct; Anadolu, 26 Oct). Amman says it acted in coordination with Damascus; Damascus denies it. The trend turns because the channel that carried the warming (border committees, the Higher Coordination Council) is now publicly disputed and the main crossing is shut. The grade stays partner because Damascus itself still announces a joint border security committee (Reuters, 27 Oct) and no source read describes rejection or reluctance. No reopening of the crossing was found in sources read up to 29 Oct 2026; no statement by the Jordanian foreign minister after the strikes was found (gap)."
