- toward: CHN
  grade: partner
  trend: stable
  bond: none
  since: 1972-04-15
  last_verified: 2026-10-16
  confidence: B
  note: "Transactional. Diplomatic relations date from the joint communique of 15 April 1972. The free trade agreement (in force 1 January 2021) and the 2018 China Eximbank buyer's credit of US$73.7m for the Safe City system bind the two governments through money, not alignment. Safe City is under parliamentary questioning (March 2025), and Mauritius was one of three states that revoked overflight for Taiwan's president in April 2026, which Taipei blames on Chinese pressure (Taiwan card, unverified by Beijing or Port Louis): a cooperative reading, not a partnership of values. Trend stable: the FTA and credit point to warming, the scrutiny of Safe City to cooling. Bond none: no kinship and no open grievance."
