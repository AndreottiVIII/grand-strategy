  note: "Partner with grievance. The 22 May 2025 treaty makes London and Port Louis counterparts on the islands, but it is unratified and creates no alignment, so the grade stays partner. The grievance is the British claim to the Chagos that the treaty would end. Trend cooling: the Bill ran out of time in the Lords and the handover was shelved in April 2026; in September 2026 Trump called the deal 'terrible', and the UK said it would revisit the deal with the annual payments on hold. Bond grievance is the structure under the posture. Confidence B: one tier 2 source (Chatham House) plus tier 3 reporting; the UK card's row toward MUS is mirrored here with the same sources."
