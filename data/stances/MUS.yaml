- toward: sub-chagos
  grade: claimed_territory
  trend: stable
  bond: grievance
  since: 2025-05-22
  last_verified: 2026-10-16
  confidence: B
  note: "Claimed, not controlled. Mauritius claims the whole Chagos Archipelago, Diego Garcia included, while the UK administers it and the base is used by the UK and US. Diego Garcia is graded inside that claim, not as own territory: the treaty would pass sovereignty to Mauritius, but with the base leased back to the UK for 99 years, so even on the treaty's own terms Port Louis would not control the base; own_territory would apply only to the rest of the archipelago once the handover took effect, and only after ratification. The since date is the 2025 treaty, the earliest dated source; the claim itself is older. Trend stable: the claim is restated in the treaty and in the 2026 shelving, not withdrawn. Bond grievance: an open wound the treaty is meant to close. Confidence B: one tier 2 source (Chatham House) plus tier 3 reporting."
  sources:
  - {url: "https://www.chathamhouse.org/2026/01/uk-ratification-chagos-archipelago-treaty-will-not-violate-international-law", title: "UK ratification of the Chagos Archipelago treaty will not violate international law", publisher: "Chatham House", date: 2026-01, tier: 2}
