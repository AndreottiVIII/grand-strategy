- toward: IND
  grade: partner
  trend: warming
  bond: affinity
  since: 2025-03-12
  last_verified: 2026-10-16
  confidence: B
  note: "Partner, not ally: the state visit of 11-12 March 2025 upgraded ties to an 'enhanced strategic partnership' with eight agreements, a framework rather than a treaty of alliance. India funded the Agalega airstrip and jetty (opened by video link in February 2024); Mauritius says it is no base, and local protests read it as a sovereignty cost. Warming because the partnership was upgraded in 2025 and the cooperation list is wide (maritime security, local-currency trade). Bond affinity: a shared Indian Ocean position and close ties, no treaty kinship; Modi's 'family' language is not counted as kin. Confidence B: one tier 1 source of each government, both from the Indian side; no Mauritian statement read."
