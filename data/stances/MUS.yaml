  note: "Partner, no treaty. Diplomatic relations date from 12 March 1968 (US State Department record; the access date recorded by Wikipedia's citation is 2023-07). The US is the decisive actor on Chagos: it uses the base and it has not given the consent the UK says the handover needs. Trump called the deal a 'terrible deal' on 22 September 2026, the UK shelved ratification in April 2026 under US pressure, and US Senator Kennedy urged the King in April 2026 to protect the base. Trend stable: Port Louis has not moved against Washington; the cooling is Washington's, not Mauritius's. Bond none: no shared identity and no grievance aimed at the US itself. Confidence B: a tier 1 record of the relation, tier 3 reporting on the posture."
