    note: "Neutral: no bilateral treaty, alliance or dispute found between Yaounde and Brazzaville in 2026. The two meet mainly as CEMAC members (the extraordinary summit in Brazzaville on 22 January 2026 was multilateral). The one bilateral item is a planned 149 km railway between the two countries, under a build-operate-transfer agreement signed in Brazzaville on 5 December 2023 with a Chinese consortium; the snippet does not show Cameroon as a party, so it is not treated as a posture. Grade is our reading (C). Bond none: no kinship, affinity or grievance in the sources. Gap: no Cameroonian or Congolese bilateral statement for 2026 was read, and the 2026 Tshisekedi-Sassou meetings concern the DRC, not Cameroon."
