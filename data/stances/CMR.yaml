    note: "A defence partnership agreement signed in Yaounde on 4 September 2025 secures the common border, and a bilateral meeting on cross-border security took place in Moutcheboum on 18 June 2026. The treaty is the reason for ally rather than partner. Border crime and illicit gold trade remain the shared problem, and the Bangui-Bouar-Beloko corridor runs to the Cameroon frontier. Bond affinity: neighbourly dependence on the corridor, not kinship. Single source for the treaty, dated."
