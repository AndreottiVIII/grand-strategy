  note: "Partner: the New Zealand-Tuvalu Statement of Partnership (3 March 2019, signed by Foreign Minister Peters and Prime Minister Sopoaga) commits both governments to work together on climate change, workforce development and regional security. It is cooperation without a treaty or an alliance, so partner rather than ally. Bond affinity: Pacific family and shared Commonwealth membership. Only one tier-1 source was read for the statement itself, hence confidence B."
