- toward: USA
  grade: partner
  trend: stable
  bond: none
  since: '1979-05-10'
  last_verified: '2026-10-16'
  confidence: B
  note: "Partner: the 1979 Treaty of Friendship (ratified by the US Senate in 1983) ended the US claim to four Tuvaluan islands (Funafuti, Nukufetau, Nukulaelae, Niulakita), so it is a settlement, not a defence pact, and not an alliance. The working relationship is fisheries (the South Pacific Tuna Treaty, in force 1988, with Tuvalu as a party alongside the US and other Pacific parties) and development. The 2023 engagement could not be confirmed: the September 2023 embassy openings named the Cook Islands and Niue, not Tuvalu, and no Tuvalu-specific 2023 action was found in the sources read. Bond none: the claim is settled and the relationship is transactional. Left open for review."
  sources:
