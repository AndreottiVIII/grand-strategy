- toward: CHN
  grade: rival
  trend: stable
  bond: none
  since: '2024-03'
  last_verified: '2026-10-16'
  confidence: C
  note: "Rival, not neutral: Tuvalu keeps no ties with the PRC and holds a posture against it, not an absence of one. Beijing presses the state to switch recognition; Teo's government refused the move and the 'two-China' option in 2024, and the Taiwan tie remains the contested line (Reuters, 2019). That is a competition over one recognition, with friction and no will to destroy, which is the rival reading. No source uses the word 'rival' for this pair, so the grade rests on reporting of the contest and stays at confidence C. Bond none: interest only, no kinship or grievance. Since 2024-03 is the current government's line, the contest itself is older."
  sources:
  - {url: "https://www.pressreader.com/usa/arkansas-democrat-gazette/20240303/281573770648058", title: "Tuvalu to keep Taiwan ties", publisher: "Arkansas Democrat-Gazette (AP wire)", date: '2024-03-03', tier: 3}
