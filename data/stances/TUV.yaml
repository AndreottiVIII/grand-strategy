- toward: TWN
  grade: partner
  trend: warming
  bond: affinity
  since: '2013-03'
  last_verified: '2026-10-16'
  confidence: C
  note: "Partner, not ally, for now. Recognition has been kept since Teo's government took office in February 2024: Teo told the AP in March 2024 that the ties stay, citing shared democratic values, and ruled out Beijing. His first official state visit to Taipei (November 2025) was welcomed by President Lai with a military ceremony and was reported with a treaty framework to secure statehood. The reports disagree on whether the treaty was signed (CNA: three pacts signed; AAP: planned), and no signed treaty could be confirmed in the sources read; recognition alone is a diplomatic tie, not a security alignment. Upgrade to ally if the treaty is confirmed as signed. Trend warming on the 2025 visit and the deepening language. Since 2013-03 is the Taiwan embassy's opening, the earliest dated fact in the sources read; the recognition itself is older and undated here."
  sources:
  - {url: "https://www.pressreader.com/usa/arkansas-democrat-gazette/20240303/281573770648058", title: "Tuvalu to keep Taiwan ties", publisher: "Arkansas Democrat-Gazette (AP wire)", date: '2024-03-03', tier: 3}
  - {url: "https://nit.com.au/18-11-2025/21343/tuvalu-treasures-special-relationship-with-taiwan", title: "Tuvalu treasures 'special relationship' with Taiwan", publisher: "NIT (AAP report)", date: '2025-11-18', tier: 3}
