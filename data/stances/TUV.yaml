- toward: AUS
  grade: ally
  trend: stable
  bond: affinity
  since: '2024-08-28'
  last_verified: '2026-10-16'
  confidence: A
  note: "Ally by treaty: the Falepili Union is a binding treaty (signed 9-10 November 2023 - the dates differ by source - in force 28 August 2024). It obliges Australia to respond when Tuvalu asks for help in a major disaster, a pandemic or military aggression, and requires Tuvalu to agree with Australia any new defence or security engagement with third parties. The ontology reads a treaty as ally. Canberra grades Tuvalu partner, because DFAT counts four alliances (US, NZ, PNG, Fiji) and Tuvalu is not one of them; the gap between the text and the list is recorded, not resolved. Bond affinity: climate and Pacific-family framing."
