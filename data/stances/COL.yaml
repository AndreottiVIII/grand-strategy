    note: 'Reluctant partner: Colombia cooperates with Caracas on the border out of necessity and resists alignment. After the US strike on Caracas (3 Jan 2026) the ELN pulled back from Venezuela into Catatumbo, and the Petro government threatened joint military action with Venezuela against the group if it did not leave; that is the border cooperation of necessity, not an alliance. Bond - none: no kinship or affinity is documented, the tie is the frontier and the drug routes. The grade rests on one tier-2 research profile of the binational ELN structure and on tier-3 reporting of the January 2026 posture of the Petro government. No source after the 7 Aug 2026 change of government was found: the grade is the previous government''s reading, to be re-checked.'
