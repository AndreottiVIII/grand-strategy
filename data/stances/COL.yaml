    note: 'Rival, warming - a reading, not a label (confidence C, tier-3 sources only). Ecuador announced a 30% security tariff on Colombian imports at Davos (Jan 2026), citing Colombia''s lack of reciprocity against drug trafficking on the 600 km border; Bogotá suspended electricity exports on 22 Jan 2026 and imposed reciprocal tariffs. Escalation to 100% from 1 May 2026; Ecuador repealed its 100% tariffs on 31 May 2026 and Colombia followed; electricity exports resumed on 5 Aug 2026. Ecuador keeps the raised fee on Colombian crude through the SOTE pipeline, so the friction is not fully closed. Rival, not adversary: competing interests and open friction, no will to destroy. Bond - none. The 2024-25 frictions named in the brief were not found in the sources; the dispute of record is the 2026 one.'
