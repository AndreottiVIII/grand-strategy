    and the Petro government threatened joint military action with Venezuela against the group if it did not leave; that is the border cooperation of necessity, not an alliance. Bond - none: no kinship
    or affinity is documented, the tie is the frontier and the drug routes. The grade rests on one tier-2 research profile of the binational ELN structure and on tier-3 reporting of the January 2026 posture
    of the Petro government. Update of 16 Oct 2026 (sharpened, the earlier note said no post-7-Aug source existed): the VEN card of the atlas holds the new government''s line, which this card now mirrors
    - de la Espriella said in the campaign that Bogotá would not deal directly with the chavista government, only through the US State Department (El Observador, 3 Aug 2026), and Delcy Rodríguez congratulated
    him and asked that the past be left behind (24 Jun 2026). Trend changed from stable to cooling for that reason: the direct channel Petro opened (the Caracas meeting of 24 Apr 2026) is closed in principle.
