    two decades of the closest security tie in South America. The grade rests on tier-3 reporting of the inauguration and on the Treasury record of the rupture (tier 1). Update of 16 Oct 2026, nothing above
    contradicted: the reset has so far bought a probation, not a recertification (second decertification with a national-interest waiver on 16 Sep 2026, a review promised within a year), Rubio met the president
    in Barranquilla on 8 Sep, a US announcement of authorised joint operations is reported (headline only), and the sanctions on Petro stand (still on the SDN list on 7 Oct). Mirror: this card reuses the
