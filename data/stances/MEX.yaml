  note: 'Read from Mexico City, the mirror of the USA card, where Washington holds Mexico as partner with bond none. Mexico cooperates out of necessity and resists alignment: cartel figures handed over
    (Feb 2025, Jan 2026), CIA flights and the National Guard at the border accepted, but Sheinbaum rejects US troops (May 2025) and any US military action on Mexican soil ("no invasion", Aug 2025), and
    calls the CIA operations of May 2026 a breach she does not accept. The grade is structural: the tariffs of 4 Mar 2025 and the USMCA left unrenewed (1 Jul 2026) are not rupture, and Mexico is not rival
    because it does not seek Washington''s defeat. Trend cooling: the new cartel designations (July 2026) and the rejection of the US claim that the Mexican government is linked to cartels (July 2026), and by 12 Oct 2026 the USMCA talks are reported stalled while Trump presses for energy deals with US firms (FT, via Mexico News Daily headline). The 25% tariffs of 4 Mar 2025 named above ended on 20 Feb 2026 when the Supreme Court struck down the IEEPA tariffs (6-3); a 10% Section 122 surcharge followed on 24 Feb and a 10% Section 301 duty on non-USMCA goods from 24 Jul 2026, with Section 232 sectoral duties (steel and aluminium up to 50%, autos 25%) unchanged and USMCA-compliant goods exempt. The USA card still describes the 25% tariffs as current; that stance is not edited here. Why not worse than reluctant: Mexico still transferred 92 cartel figures in three batches (29, 26, 37 on 20 Jan 2026) and sent 10,000 Guard troops to the border (3 Feb 2025).
    Bond grievance, not none: the 1914 occupation of Veracruz (index pointer, the Tampico incident) is the historical wound, and Pew (2026, via Wikipedia) finds 55% of Mexicans with a negative view of the
    US. Tier-4 pointer for the bond; the grade rests on tier-3 reporting.'
