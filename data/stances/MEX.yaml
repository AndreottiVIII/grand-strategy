  note: 'Partner, cooling. Mexico supported the Cuban government from the early 1960s, abstained rather than backed the 1964 OAS expulsion, and kept relations when the rest of the hemisphere broke them:
    an ideological affinity, the basis of bond affinity. The cooling is the oil: Pemex shipped nearly 20,000 barrels a day to Cuba in Jan-Sep 2025, then Sheinbaum announced a pause on 27 Jan 2026, calling
    it a sovereign decision and declining to link it to US pressure after the Venezuela operation. Partner, not reluctant partner: the support is not forced on Mexico; the pause is the sign of how far the
    affinity bends under Washington. Confidence B on the 2026 pause; the 1960s affinity rests on the index (tier 4).'
