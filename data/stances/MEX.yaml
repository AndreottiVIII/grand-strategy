  note: "Neutral and warming: a rupture healing. Peru severed relations on 3 Nov 2025 after Mexico granted asylum in its Lima embassy to former prime minister Betssy Chavez, accused of rebellion for Castillo's 2022 attempt to dissolve Congress; foreign minister De Zela called it an unfriendly act and the presidency accused Mexico of repeated interference; Sheinbaum called the break disproportionate (Andina, CP24). Keiko Fujimori, who took office in 2026, said in July she would restore relations, and on 7 Aug 2026 the two governments resumed them: Peru issued safe conduct for Chavez, under the 1954 Caracas Convention, and reserved the right to ask for her extradition (Reuters via Internazionale, Caretas). Mexico's Senate ratified Lydia Antonio de la Garza as ambassador to Peru on 13 Oct 2026 (Cronica); the Peruvian ambassador is unconfirmed (gap). The pair had no ambassadors since early 2023 per Reuters. Neutral and not rival: ties are back and no further act is read; bond grievance because the asylum wound is not closed (the extradition reservation) and echoes the Ecuador embassy case. Confidence B on the facts, the grade is our reading. It reads Mexico as reluctant_partner, warming, bond grievance; same trend and bond as here, and it adds that Peru's Congress had declared Sheinbaum persona non grata, that the 7 Aug restoration was a joint foreign-ministry statement citing ties of brotherhood, friendship and cooperation, and that Mexico also hosts Castillo's wife and children. Mexico's grade stays neutral because Mexico did not resist the restoration and shows no wish for distance, so reluctant_partner does not describe its side."
