  note: 'Partner with friction, and the friction is Washington''s doing. Mexico has recognised the People''s Republic since the early 1970s and China is one of its largest trading partners, the basis of
    the nearshoring plan. The cooling is the tariff wall of 2025-2026: duties of up to 50% on cars, auto parts, textiles, plastics and steel from non-FTA countries, aimed first at China, tied in the reporting
    to the USMCA review. Beijing''s Ministry of Commerce said it would monitor the regime and that such measures substantially harm trade (reported). Partner not reluctant partner: Mexico trades with China
    on its own terms and takes no security line with it. Bond none: interest only. The enacted rates are lower than the 50% first proposed in September 2025: the Senate passed the text 76-5 on 10 Dec 2025, in force 1 Jan 2026, most lines capped at 35% and passenger cars 20% to 35%, with 50% only on some auto, textile, plastic and steel lines (Thomson Reuters). China answered with a Ministry of Commerce trade-barrier investigation (Sept 2025), and its embassy and foreign ministry called the measure coercion. The structural tie behind the partner grade is the input chain: a record deficit of USD 119.86bn with China in 2024 (imports USD 129.8bn, INEGI), mostly intermediate goods for export manufacturing. Confidence stays B on the posture.'
