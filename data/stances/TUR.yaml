    note: "Transactional partnership with limits: a large trade deficit (China was the largest source of Turkish imports, about 13.7% in early 2026, one source; exports are raw materials), investment courted through the Middle Corridor, Erdogan-Xi meetings (Beijing, July 2024; SCO Tianjin, 31 Aug 2025), and a restrained line on the Uyghurs despite Turkey's large Uyghur diaspora. The brief's BRICS bid could not be verified in the source set, so no stance depends on it. Partner and not neutral because of the sustained leader-level contact; confidence C because the figures come from think-tank and trade-press pieces and no official customs series was found. Bond - none."
