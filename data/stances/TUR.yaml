    grade: reluctant_ally
    trend: warming
    bond: grievance
    since: 2019-07-17
    last_verified: 2026-10-12
    confidence: B
    note: "NATO co-member with visible friction, so reluctant_ally (not a plain ally). The grievance is structural: the F-35 expulsion of 2019, CAATSA sanctions of December 2020 and Washington's past support for the Syrian Kurds. The trend is warming under Trump: Erdogan was received at the White House on 25 Sep 2025 (and cut Russian crude after Trump's appeal), Trump said in Ankara on 7 Jul 2026 'we're going to be taking the sanctions off', Erdogan says he got 'a promise' on the F-35, and on 2 Oct Trump still gave no timetable. The legal barrier (congressionally mandated sanctions, the S-400 still in Turkey) is why this is a promise and not yet a change of structure. Bond - grievance."
