  confidence: A
  note: 'Treaty ally (Mutual Defense Treaty of 1 Oct 1953; 28,500 US troops, a floor written into the FY2026 NDAA; wartime operational control still American). Cooling because the guarantor now charges for the guarantee: a 25%-to-15% tariff deal bought with a USD 350bn pledge (USD 150bn shipbuilding, USD 200bn strategic sectors; first projects 30 Sep 2026), USD 25bn of US arms and USD 33bn for USFK support in the 14 Nov 2025 fact sheet, repeated tariff threats (Jan and Sep 2026), Patriot batteries moved to the Middle East, and Ulchi Freedom Shield cut short by Trump without warning to Seoul. Against that, the fact sheet approved Korean nuclear-powered submarines and backs a path to civil enrichment; the nuclear talks opened on 2-3 Jun 2026. Reluctant ally was considered; no source calls it that and Seoul''s own line is a ''comprehensive alliance'', so the friction is carried by the trend. Bond - affinity: the 1950-53 war and seven decades of dependence.'
