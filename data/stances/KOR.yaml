  note: 'The ontology''s test is whether Seoul''s declared aim is the other''s defeat or disappearance, and it is not: the Lee government''s line is that Seoul respects the North''s system, seeks no unification by absorption and commits no hostile acts (Unification Ministry, per PISM), has silenced the loudspeakers, expressed official regret for civilian drone flights, and proposed talks to formally end the war (15 Aug 2026). The hostility is real but it is on Pyongyang''s side: Kim''s ''hostile states'' doctrine (Dec 2023), the Ninth Party Congress (Feb 2026), a border being fortified and crossed (about 20 MDL crossings in August, 30 in September, mines south of the line, a blast on 21 Sep that hurt three soldiers). Even Pyongyang''s March 2026 constitution avoids calling the South an enemy by name (38 North), so ''adversary'' would claim a mortal enmity that neither side''s written aims state. ''Rival'', then, with the trend cooling because the other side keeps closing doors. No source
    uses the word ''rival'': the grade is our reading of the structure (confidence C), like Kosovo''s toward Serbia. Bond - kin: one nation divided, which is why the pair is a feud (kin plus rival) in the faults grid.'
