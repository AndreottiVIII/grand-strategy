  note: 'The Essequibo: Venezuela claims the two-thirds of Guyana that the 1899 arbitral award gave to British Guiana, and rejects the award. The claim is what the state says it is for: the ICJ case Guyana
    brought in 2018 is contested by Caracas, which says the 1966 Geneva Agreement requires direct talks and denies the court competence; the court issued provisional measures in 2023 and May 2025 against
    changing the situation or holding elections in the region, and one source says Venezuela held them anyway. Judgment expected Nov 2026 to Jan 2027. Stable: nothing in the 2026 record gives up the claim.
    Bond grievance: the 1899 award and the 1966 agreement. Mirror: Guyana has no card yet, so no Guyanese reading exists; the claim is graded from Caracas alone.'
