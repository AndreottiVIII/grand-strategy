  bond: affinity
  since: 2026-01
  last_verified: 2026-10-16
  confidence: C
  note: 'The old alliance turned into a transaction under pressure. Cuba was Venezuela''s oil client under the 2000 accord (oil for services; 26,500 bpd in 2025, about a third of the island''s need, per
    a secondary analysis that is not audited), and 32 Cuban security personnel died in the raid of 3 Jan 2026. From January Venezuela stopped sending crude to Cuba under US pressure, and Washington threatened
    tariffs on any third country that supplies Cuban oil (executive order of 29 Jan 2026, as recorded on the USA card). Partner, not ally, because the accord has no living oil flow and Caracas now has no
    oil to give (our reading). Cooling because the supply stopped. Bond affinity: the shared revolutionary inheritance, the security ties and the Cuban dead. Confidence C: no Venezuelan statement on the
    cut was read; the grade is our reading of the structure, and the Cuban card will check it from the other side.'
