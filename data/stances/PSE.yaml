  note: 'Decided from the evidence: rival, not adversary. The PLO accepts Israel and the two-state outcome (Abbas to the UN, 24 Sep 2026: a two-state solution on international law) and the PA still lives
    inside the Oslo security and customs architecture, so it does not seek Israel''s destruction; the coordination it has never fully ended (Arab Center: dense, and kept going through earlier suspensions)
    is the opposite of an adversary''s posture. The hostility is real and one-sided in intent: the occupation (ICJ 2024: unlawful), the withholding of clearance revenues since May 2025, the E1 tenders of
    Aug 2026, the first Area A land seizure for settlements, settler violence at record levels (UN: about 1,430 incidents to 10 Aug 2026), and, per PISM, a coalition aim of blocking statehood and, if the
    far right wins, dismantling the PA. Israel''s own grade of the PA may be harsher (build will flag the asymmetry if Jerusalem''s card says adversary). No source uses the word ''rival'': the grade is
    our reading of the structure (confidence C). Cooling: the Israeli election of 27 Oct 2026 is contested by blocs most of which oppose a Palestinian state (Al Jazeera). Bond - grievance: occupation, 1948
    and 1967.'
