  note: 'The Union''s own formula since the 12 Mar 2019 strategic outlook is partner, competitor and ''systemic rival'', and the 2025-26 record leans toward the last two: countervailing duties of 7.8-35.3%
    on Chinese EVs since Oct 2024 (now softened into minimum-price undertakings, first accepted 10 Feb 2026), Beijing''s rare-earth licensing used as leverage (only just over half of about 2,000 priority
    EU applications processed by Oct 2025), the Nexperia seizure and counter-seizure (Dutch order of 30 Sep 2025, Chinese court freeze of Nexperia BV''s stakes on 31 Aug 2026), and a July 2025 Beijing summit
    that produced a climate statement and little else. Not partner: the structure is competition over technology and norms. Not adversary: trade is worth far too much, and on 8-9 Oct 2026 the two sides
    agreed a ten-point trade list, fast-track rare-earth magnet licences and hybrid-vehicle terms. Stable: managed rivalry. Bond - none.'
