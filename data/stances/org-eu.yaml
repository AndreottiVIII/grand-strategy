  note: 'The Union cooperates with Washington out of necessity - the guarantee, US LNG (26.2% of EU gas imports in 2025, 57.9% of LNG), the largest trade partner - while resisting alignment: Turnberry fixed
    a 15% US tariff ceiling on 27 Jul 2025 but the steel and aluminium duties stayed at up to 50% (the Parliament added a sunrise clause, a suspension right and a sunset); in Jan 2026 Trump threatened 10%
    then 25% tariffs on eight European states over Greenland and Brussels readied EUR 93bn of counter-tariffs without triggering the Anti-Coercion Instrument; Washington attacked the EUR 120m DSA fine on
    X. Not reluctant_ally: the EU has no treaty with the US (the guarantee is NATO''s, graded separately). Not rival: no one in Brussels seeks the US''s defeat, and ECFR''s May 2026 poll finds half of Europeans
    calling it a ''necessary partner'', only 11% an ally. Cooling: US troop-review and the 22 Sep 2026 US-Denmark Greenland deal followed the Ankara summit. Bond - affinity: values and history, strained.'
