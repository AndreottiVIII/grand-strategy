  last_verified: 2026-10-12
  confidence: C
  note: 'Diplomatic relations since 15 Dec 1979 (Djibouti foreign ministry, undated page). Estimates put 90-95% of Ethiopia''s foreign trade through Djibouti (the 95% figure is attributed to a think-tank in press pieces and not pinned to its original text); port fees are a large cost for Addis. Feb 2026 accord to deepen cooperation at Doraleh; Abiy visited Djibouti in Jan 2026. The existential risk is Ethiopia''s sea-access push: Abiy again demanded an outlet to the sea in October 2026, and state media ran a campaign for Assab in July 2026. Djibouti offered a 60% stake in the Tadjoura port; Addis declined, wanting a corridor on top of equity. Partner: transactional and deep, no alignment treaty found. Bond - none: sources describe dependence and interest, not kinship.'
