  note: 'Defence treaty signed in 2011 and in force from 2014 (National Assembly committee file); renewed on 24 Jul 2024 for twenty years, with the fixed annual payment rising from EUR 30m to EUR 85m; the largest French base abroad (about 1,500 personnel), with the Heron islet to return to Djiboutian control by late 2026. Ratification of the 2024 text is not confirmed in our sources (a bill was on the cabinet agenda on 26 Mar 2025). French chief of defence visit in Jan 2026. Ally by treaty, not by rhetoric. Bond - affinity: our reading of a former colonial power with a long military tie; no source characterises the bond.'
