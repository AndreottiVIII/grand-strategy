- toward: ARE
  grade: rival
  trend: cooling
  bond: none
  since: 2018-02
  last_verified: 2026-10-12
  confidence: B
  note: 'In February 2018 Djibouti seized DP World''s Doraleh Container Terminal. The London Court of International Arbitration ruled for DP World; the final award of October 2025 found the seizure unlawful, and Djibouti has refused to pay the awards (about USD 685m) while DP World''s 50-year concession stands. DP World is Dubai-based; the state link to the UAE is our reading. Berbera: the UAE''s 25-year lease (2017) and DP World''s port compete with Djibouti for Ethiopian trade (Crisis Group 2018, the same source the UAE card uses). After Israel recognised Somaliland, Guelleh named the UAE as Israel''s main route into the region (2026, reported). Rival, not adversary: competing ports and a live arbitration, no aim to destroy. Trend cooling from the 2026 statements. Bond - none: pure interest.'
