- toward: ERI
  grade: rival
  trend: stable
  bond: grievance
  since: 2008-06
  last_verified: 2026-10-12
  confidence: C
  note: 'Ras Doumeira clashes in June 2008 over the border at the Bab al-Mandab; the UN Security Council demanded in 2009 that Eritrea withdraw; a Qatar-brokered accord of 6 Jun 2010 brought the withdrawal, but the border was never demarcated. Friction revived in 2017 (Djibouti alleged an incursion), then a 2018 thaw: Eritrea''s foreign minister visited and Djibouti hailed a new era. No source uses the word rival: the grade is our reading of an unsettled border and an open grievance without a stated aim to destroy the regime (confidence C). Trend stable: no 2025-26 source was read for this pair, the 2018 thaw is the latest. Bond - grievance: the 2008 fighting.'
