- toward: CHN
  grade: partner
  trend: cooling
  bond: none
  since: 2023-01
  last_verified: '2026-10-12'
  confidence: C
  note: "Partner, not reluctant partner: the cooperation is transactional (fisheries, police training) and Fiji resists Chinese officers inside its force, not alignment itself. Cooling: in January 2023 the Rabuka government moved to end the 2011 police MoU; the Home Affairs Minister then said it was under review with six months' notice, and by March 2024 Chinese officers stationed in Fiji had been ruled out, short-term deployments ended and intelligence sharing curtailed, while the MoU itself stayed in force under six-monthly review. Rabuka cited Australia and NZ as partners with comparable systems (SCMP). A 2025 Chinese-side release says more than 100 Chinese vessels use Fiji as a base; it is promotional and tier 4. No 2025 high-level China-Fiji contact was found in this pass. Bond - none: pure interest."
