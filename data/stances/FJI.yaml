  note: "Partner, transactional, from the former colonial power: Fijians have served in the British Army since the 1961 recruiting drive, and the UK remains a top source of tourists (UK arrivals up 10.6% in 2025). No treaty and no alignment. Stable. Bond - affinity: Commonwealth membership and a shared colonial past, with no open grievance. Headcounts of Fijians in the British Army are contested and undated, so none is used here. The since date (1970, independence) is not sourced in this pass and should be checked."
