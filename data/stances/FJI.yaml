- toward: NZL
  grade: partner
  trend: stable
  bond: affinity
  since: 2023-06
  last_verified: '2026-10-12'
  confidence: B
  note: "Partner under the Duavata Partnership, with a 2023 framework for military cooperation on each other's territory; NZ Police officers work in the Fiji Police Partnership Program (third group arrived January 2025). Rabuka and Luxon met on the sidelines of the Honiara Forum in September 2025, and NZ backed the Ocean of Peace. The partnership was renewed in Auckland on 16 July 2026 for five years, signed by the foreign ministers, with a target of NZ$2bn two-way trade by 2030. Stable because renewal is routine. Bond - affinity: shared Pacific identity and the Duavata term, not kinship."
