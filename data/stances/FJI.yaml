- toward: USA
  grade: partner
  trend: stable
  bond: none
  since: 2025-04
  last_verified: '2026-10-12'
  confidence: C
  note: "Partner, transactional. Cooling on aid: the 2025 State Department freeze named a US$1.5m clean-energy programme run by the SPC Fiji office, and Rabuka went to Washington in February 2025 to ask it to reconsider the freeze and to rejoin the Paris Agreement. Warming on trade: the US reciprocal tariff on Fiji-origin goods was 32% in April 2025, cut to 15% from 8 August 2025, then ended with the IEEPA ruling in February 2026; the Foreign Ministry says Fijian exports are no longer under the Section 122 surcharge that expired in July 2026, while some calculators still show it. A Zero List negotiation is open. Stable because the two push opposite ways. Bond - none."
