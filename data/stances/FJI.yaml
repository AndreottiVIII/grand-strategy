- toward: AUS
  grade: partner
  trend: warming
  bond: affinity
  since: 2022-12
  last_verified: '2026-10-12'
  confidence: B
  note: "Partner, not ally: no treaty is signed. The Vuvale Partnership was elevated in July 2025 (Albanese and Rabuka), with treaty negotiations due to start at the Defence Ministers' Meeting in Suva on 3 Oct 2025; a security agreement is in drafting and Fiji is posting police and defence attaches to Canberra. The 2025-29 development package is reported at about A$500m, with AFP officers working inside the Fiji police and A$12m for container screening at Lautoka and Suva. Warming because each step is larger than the last. Bond - affinity: shared Pacific and Commonwealth ties, not kinship. The 'friends to all' line (ASPI) is the reason this is not an alliance."
