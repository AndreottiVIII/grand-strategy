- toward: IND
  grade: partner
  trend: warming
  bond: kin
  since: 2017
  last_verified: '2026-10-12'
  confidence: C
  note: "Partner with kin: Rabuka's first visit to India as PM (24-26 August 2025, talks at Hyderabad House on 25 August) rested on a 2017 defence memorandum and a first Joint Working Group on Defence (peacekeeping, military medicine, white shipping data). India is opening a defence attache post in Suva, plans a naval port call and a 100-bed super-speciality hospital. Warming. Bond - kin: Indian officials say almost a third of Fijians trace their roots to India (indenture from 1879); Hindi is an official language. Modi did not visit Fiji in 2025; the last Indian PM visit reported in the sources is 2014 (not sourced in a row). Trade is lopsided and the figures conflict (see the USD 65m row)."
