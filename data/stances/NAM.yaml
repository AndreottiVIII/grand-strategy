  note: 'Germany is Namibia''s development partner, and the 2021 joint declaration on the 1904-1908 genocide is the open wound: rejected in Namibia in 2021 and never signed. In April 2026 the president
    said the revised text had been reviewed by the chiefs'' forum and a technical task force, was nearing conclusion and would be tabled in parliament, with the target of the end of 2026. Warming is our
    reading of that movement; partner is our reading of the structure (transactional, no alignment), not a source''s word. Bond grievance is the historical wound, which stays open while communities contest
    the deal. Gap: the German side''s 2026 position is not sourced in this pass.'
