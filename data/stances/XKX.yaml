    note: "Stabilisation and Association Agreement in force since April 2016, visa-free travel since 1 Jan 2024, full voluntary alignment with CFSP, membership application of Dec 2022 - but the EU is not an ally (no guarantee) and five members do not recognise Kosovo. Warming because all 2023 punitive measures were lifted by March 2026 (the Commission said it would 'fully re-engage'); the European Parliament in June 2026 asked for candidate status once criteria are met. France and Italy had resisted lifting the measures earlier. Bond - affinity: a stated strategic goal, not kinship."
