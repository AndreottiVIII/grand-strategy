  note: 'Jubaland is Kenya''s buffer and its client: Kenyan peacekeepers have been accused since 2013 of building a buffer state around Kismayo, Jubaland fighters beaten at Balad Hawo in 2021 fled to Mandera and Jubaland troops were reported there again in 2026 (SOM card), and Nairobi is accused of keeping Madobe in power; it denies arming militias (Kenya government spokesman, 2021). Graded partner and not ally because no treaty or public commitment exists and Nairobi still deals with Mogadishu as the sovereign it hosts troops for; not rival because it never opposes Jubaland. The Somali card reads the same pair from the other side as rival (Mogadishu toward Kismayo), so the seam between federal host and local client runs through Nairobi. Confidence C: every source is an accusation or a denial; Kenya has never stated the backing. Trend stable: the 2026 loss of three Gedo towns by federal forces strengthens Madobe without Kenya acting. Bond none: interest.'
