  note: 'Cooperative neighbour and corridor partner: the LAPSSET commitment of August 2023, Ruto''s announcement in February 2025 that Ethiopian imports would move through Lamu, Kenya''s offer in September 2025 (at the GERD inauguration) to sign a further power purchase for any spare GERD output, and a grid that carries Ethiopian power south, which is also Kenya''s own need: Ethiopia supplied 1,274 GWh, 83% of Kenya''s electricity imports, in the year covered by the energy regulator''s data (allAfrica, October 2025; figures taken from a search extract because the page could not be retrieved), and the same extracts report that Kenya Power plans to draw 400 MW under the contract from December 2026. On the Nile Nairobi is quietly pro-Ethiopian in language (Ruto: no country should be denied the opportunity to unlock a resource like GERD) without a written alliance; Lamu''s share of Ethiopian freight is marginal. Not ally: no defence text, no shared enemy besides al-Shabaab. Mirror: Addis Ababa
