  note: 'Uganda is Kenya''s first trading partner (The EastAfrican, May 2026) and the EAC neighbour with the thickest ties: Museveni''s state visit to Nairobi in July 2025 ended with eight memoranda on trade and cooperation, and Ruto sent his deputy to Museveni''s swearing-in in May 2026. Friction is real but contained: the abduction of Kizza Besigye in Nairobi on 16 November 2024 (Kenya called it an abduction not sanctioned by Nairobi and opened an inquiry; the US asked for answers). Partner, not ally: no common defence text. Mirror: Kampala grades the pair partner, stable, none (UGA card) on the same Citizen Digital source. The trade weight is now in the evidence: Uganda is Kenya''s largest single export market, KSh 162.4bn in 2025 or 14.5% of export earnings, up 28.8% (2026 Economic Survey of the national statistics office, as reported by The Star). Gap: Kenya''s imports from Uganda and total two-way trade were not found. Bond none.'
