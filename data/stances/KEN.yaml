  confidence: B
  note: 'Partner with friction, in two movements that cancel out. Diplomacy is warm: Ruto addressed Tanzania''s parliament in Dodoma on 5 May 2026 (the second Kenyan head of state to do so, after Moi in 2002) to reset ties. The substance is cooler: Kenya-Tanzania trade fell 9.4% in 2025 to KSh 114.1bn, the first fall in almost a decade; Tanzania banned Kenyan poultry and cigarettes, barred foreigners from 14 mining services in April 2026, deported Kenyan and Ugandan activists in May 2025 (Boniface Mwangi says he was tortured) and killed at least 518 people in the October 2025 election violence according to The EastAfrican, several of them Kenyans. Nairobi has not retaliated. Stable because the reset and the grievances offset; partner and not rival because the two share EAC rules and Tanzania is Kenya''s second-largest trading partner after Uganda. Mirror: Dodoma''s own reading of the pair is colder, reluctant_partner, cooling, bond none (TZA card, confidence C, our reading there too), on
    evidence that Nairobi shares: Kenya objected in July 2025 to a Tanzanian law on non-citizens, Tanzania is blamed for 39% of EAC non-tariff barriers, a Tanzanian levy on Kenyan matchboxes was reported in May 2026 despite an East African Court of Justice suspension, and the 30 June 2026 deadline to clear barriers lapsed with little progress. These came after Ruto''s reset visit, so the risk to this reading is cooling; it stays stable only because Nairobi itself keeps the tone of a partner and has not retaliated. Bond none.'
