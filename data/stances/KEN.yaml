  note: 'Reluctant ally, argued. For ally: Biden announced Major Non-NATO Ally status on 23 May 2024, the first for a sub-Saharan state, citing counter-terrorism cooperation and shared support for Ukraine as Kenya prepared to send forces to Haiti (the sources do not show Congress completing the designation); Kenya then led the mission Washington designed (Rubio, December 2025: the gang suppression force ''would not have been possible'' without it), and on 4 December 2025 signed the first government-to-government health compact in Africa (USD 1.6bn over five years, Kenya adding USD 850m). For reluctant: the 10% tariff of April 2025, the AGOA lapse of 30 September 2025 (15-42% duties for four months) renewed only to 31 December 2026 and now under a US review of Ruto''s governance record (July 2026), the USAID exit (the health compact fills the gap, Eastleigh Voice), an embassy that had no substantive head for 19 months according to the 2026 AGOA coverage, and Ruto''s own hedge (''bridge between
    East and West'' in Beijing, April 2025). The reading of a favourite sliding out of favour (The EastAfrican, April 2025) is an analyst''s phrase, not a grade. Not partner: the Haiti command and the MNNA label are alignment, not a market exchange; not ally: there is no treaty and Kenya abstained on the Ukrainian children vote (December 2025), against the US line. Trend stable: the December 2025 compact and February 2026 trade talks offset the 2026 review. Bond affinity: a long American patronage of the Kenyan army and elite (our reading).'
