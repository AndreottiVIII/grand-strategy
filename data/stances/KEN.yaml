  note: 'Partner with friction, and the friction is structural. Kenya is an AUSSOM contributor (1,410 troops allocated), endorsed the new mission with Hassan Sheikh in October 2024, received the Somali president at Narok in June 2026 over AUSSOM funding and joined the 27 Dec 2025 calls backing Somalia''s unity after Israel recognised Somaliland. But Nairobi rejected the ICJ''s October 2021 maritime ruling ''in totality'' after leaving the case, has backed Madobe''s Jubaland for more than a decade, and in June 2026 Ruto publicly questioned the status of Somalia''s federal institutions. Not rival: Kenya needs a functioning federal host for its troops and has no wish to see the state fall; not reluctant_partner: the cooperation is not forced on Kenya, it chose to send troops to AUSSOM. Cooling because the 2026 constitutional crisis puts Madobe''s cause and Villa Somalia''s on opposite sides, and Mogadishu again accuses Nairobi of arming militias (Kenya denies it). Mirror: Mogadishu''s own reading
    of the pair is partner, cooling, grievance (SOM card, same sources). Bond grievance: the unimplemented ruling and the Jubaland buffer.'
