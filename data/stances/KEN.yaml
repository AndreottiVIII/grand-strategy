  note: 'The only adversary in Kenya''s file, graded on structure and not on a word in any source (hence C): Kenyan troops have been fighting the group in southern Somalia since 2011 under a mandate to reduce its threat (AUSSOM, Security Council resolution 2809), and the group kills Kenyan soldiers and police on Kenyan soil on a rolling basis (three KDF soldiers in Lamu on 15 July 2025, five security personnel in Mandera in late July 2026, a roadside bomb on the Mandera-Elwak road in August 2026, twelve dead in the Garissa and Lamu attacks of June 2023). It passes the ontology''s test, a mortal enemy whose defeat or removal from Kenya''s border is the aim of one side and whose war on Kenya is continuous. No channel of talks with the group exists on Kenya''s side. Stable: attacks on Kenyan security forces recur year after year in the same three border counties. Bond grievance: the open wound of a war that began with the Kenyan entry into Somalia (our reading).'
