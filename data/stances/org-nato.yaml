  note: 'The member that is also the question. Structurally the United States is the guarantor and the founder (Article 5, the nuclear umbrella, about 80,000 troops in Europe, 57% of alliance spending), so this is an alliance and not a rivalry; the grade is reluctant_ally because the alignment is held by necessity under visible friction: the Pentagon''s ''NATO 3.0'' (Colby, Feb 2026), the cut to the Force Model (May-June 2026), 5,000 troops leaving Germany (announced 1 May 2026) and a posture review weighing 25,000-40,000 withdrawals, Trump''s ''NATO WASN''T THERE WHEN WE NEEDED THEM'' over the Iran war, doubts about Article 5 before Ankara and the Greenland coercion of Denmark (settled on paper on 22 Sep 2026). Counter-signals keep it from rival: Trump signed the ''ironclad'' Article 5 at Ankara and the US still supplies the PURL stocks and the nuclear deterrent. No source applies the word ''reluctant'' to NATO''s side: our reading (confidence C), consistent with how DNK, GBR and NLD are
    graded toward the USA. Cooling since 2025. Bond - affinity: 77 years of shared institution.'
