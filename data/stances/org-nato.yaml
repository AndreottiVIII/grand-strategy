  note: 'Rival, not adversary, in the ontology''s terms. The 2022 Strategic Concept names Russia ''the most significant and direct threat'' and the Ankara declaration (8 Jul 2026) ''the long-term threat'', Eastern Sentry (12 Sep 2025), Baltic Sentry (Jan 2025) and two Article 4 sessions in September 2025 (Poland, Estonia) show the contest; NATO suspended practical cooperation in April 2014 and expelled eight Russian officials in October 2021, after which Moscow closed its mission. But NATO''s declared aim is deterrence and defence, not the end of the Russian state or regime, and the channel for dialogue is kept formally open; Peskov himself said Moscow stays open to dialogue when there is a chance for constructive engagement. A threat label in an official text is the source for the hostile reading, the grade follows the structure (a standing deterrence contest, no allied war aim against Russia). Trend cooling: airspace violations (Estonia MiG-31s, 19 Sep 2025) and Russian drones in Poland
    rose in 2025-26. Bond - grievance: Moscow''s reading of enlargement as encirclement, and NATO''s of 2014 and 2022 as betrayal.'
