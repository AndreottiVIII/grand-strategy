  note: 'Ally by stable de facto alignment, not by treaty: the 2016 MOU (USD 38bn to 2028), 68% of Israel''s arms imports in 2021-25 (SIPRI), the war on Iran fought together from 28
    Feb 2026 (''Netanyahu''s war alliance with Trump'', Reuters), and a USD 25.8bn emergency arms package in May 2026. Friction is real and public - Trump rebuked the Lebanon campaign
    and signed an Iran memorandum in June that Israeli ministers say does not bind Israel; Gallup (Feb 2026) found more Americans sympathising with Palestinians than with Israelis; talks
    on the MOU''s successor opened on 5 Jun 2026 with Netanyahu himself backing a phase-out of direct aid - but no Israeli source questions the commitment, so not `reluctant_ally`. Stable:
    leader-level friction and a shrinking aid frame are offset by deeper military integration. Bond - affinity: shared politics and a large diaspora; no listed bond fits better. The
    United States has no card of its own, so its grade of Israel is not yet written.'
