- toward: USA
  grade: partner
  trend: warming
  bond: none
  since: 2023-05-09
  last_verified: 2026-10-16
  confidence: C
  note: "Partner, no treaty and no guarantee. The US embassy in Nuku'alofa opened on 9 May 2023, presented in Washington as a counterweight to China's reach in the Pacific. The enhanced maritime security agreement of 27 February 2026 (Coast Guard cooperation against illegal fishing and drug smuggling) adds a security tie, which is why the trend reads warming. Bond none: no shared identity or open grievance. Confidence C: tier 3 press only; no State Department or Tongan statement read, and the accord date comes from the press report."
