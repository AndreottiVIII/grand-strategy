- toward: AUS
  grade: partner
  trend: stable
  bond: affinity
  since: 2022-01
  last_verified: 2026-10-16
  confidence: B
  note: "Patron, not ally: no treaty. Australia's aid flights after the January 2022 eruption, its PALM labour scheme (2,680 Tongans in December 2025, down from about 6,035 in April 2022) and A$30 million of extra budget support (Lowy, 2024) bind Tonga to Canberra. Canberra said there was no Chinese role in Pacific policing, and Tonga's government welcomed one in 2024: the friction is over security, not over the patronage. Trend stable: labour flows shrink while aid and budget support continue. Bond affinity: Commonwealth membership and the shared Pacific forum, no kinship."
