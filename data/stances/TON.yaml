- toward: NZL
  grade: partner
  trend: stable
  bond: affinity
  since: 2022-01
  last_verified: 2026-10-16
  confidence: C
  note: "Second patron, also without a treaty. New Zealand sent ships and military supply flights after the 2022 eruption and runs the RSE seasonal scheme, which took about 1,676 Tongans in 2025/26 (1News), while the Deputy Prime Minister put the intake at about 1,000 in July 2025, down from about 2,400 before Covid, blamed on farm automation: the two figures conflict and both are kept. Tonga's share of RSE arrivals fell from 18.4% a decade earlier to 10.3% in 2023-24 (Devpolicy). Confidence C: tier 2 and tier 3 sources, no New Zealand government statement read. Bond affinity, no kinship."
