- toward: CHN
  grade: partner
  trend: stable
  bond: none
  since: 1998-11-02
  last_verified: 2026-10-16
  confidence: B
  note: "Transactional. Tonga recognised the People's Republic on 2 November 1998 and broke with Taiwan. The 2008 EXIM Bank loan for rebuilding Nuku'alofa after the 2006 riots, and its deferrals in 2013, 2018 and 2020, make China Tonga's largest creditor: over US$120 million, roughly a quarter of GDP in 2024 (Lowy). Partner, not reluctant partner: no source read calls the relation reluctant, so the grade stays on the transactional reading. Bond none: no shared identity and no open grievance. Trend stable: China refused further renegotiation in early 2023 (Lowy), while the government welcomed Chinese police help in 2024; the two directions cancel out."
  sources:
