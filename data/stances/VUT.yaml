  note: "Founding MSG members with Solomon Islands, under the Agreed Principles signed in Port Vila on 14 March 1988: a treaty-based alignment, hence aligned in form. The friction is visible: in 2015 Fiji's prime minister backed Indonesia's bid for associate membership of the MSG, which the leaders approved in Honiara, while Vanuatu was pressing West Papua's claims. Bond kin: shared Melanesian identity. Fiji (a member since 1996) is recorded in the relations file under the same MSG membership."
