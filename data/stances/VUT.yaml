  note: "Partner on security and money: the US embassy in Port Vila formally opened on 19 July 2024, a decade of Coast Guard ship-rider patrols led by Vanuatu officers, and a commitment of VT185 million to weather forecasting and early warning (July 2026). Peace Corps volunteers have served since 1990 and a return was signalled in 2023-24, but I found no confirmation of their status in 2025-26. Divergence: the United States voted against the May 2026 General Assembly resolution that Vanuatu led to endorse the ICJ opinion, per press summaries. Bond none."
