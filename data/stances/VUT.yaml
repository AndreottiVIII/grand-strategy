  note: "Transactional: a China Eximbank loan for the Luganville wharf, a China-funded presidential palace handed over in July 2024, Chinese police equipment, and the Namele development agreement, still unsigned. Napat calls Namele development cooperation, not a security pact, and says it will be published only after Beijing clears it. Trend warming on the March 2025 envoy visit and the police gift. Friction on record: China said Vanuatu-Australia cooperation should not target any third party, and its embassy denied influencing the Nakamal talks. Bond none: no kinship or sympathy found. The 2023 police vehicles cited by one secondary index are not confirmed by the press piece used, which lists motorbikes and drones."
