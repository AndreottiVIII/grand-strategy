- toward: FRA
  grade: rival
  trend: cooling
  bond: grievance
  since: "2024-05"
  last_verified: 2026-10-12
  confidence: C
  note: "No source uses the word rival: the grade is our reading of the structure (C). The sources show Vanuatu's government opposing France's handling of New Caledonia inside the MSG: its prime minister, Charlot Salwai, who was then MSG chair, said the May 2024 unrest could have been avoided had the French government listened, and the MSG opposed France's constitutional amendment (BenarNews, 15 May 2024). At the MSG leaders' caucus on the sidelines of the 2024 Pacific Islands Forum in Tonga, leaders called for a robust and unified approach to New Caledonia and reiterated support for the FLNKS; the article does not single out Vanuatu as the driver (Islands Business, 2 September 2024). France declared a state of emergency in effect from 16 May 2024 and sent military reinforcements; the source gives no troop figure. Trend cooling is our reading: no source states a trend. Not an adversary: the sources describe a dispute over New Caledonia's status and over how France handled the unrest, with no hostile act between the two states recorded in them. Bond grievance is our reading too: the Kanak independence question is the contested issue; no source calls it a wound between Vanuatu and France."
