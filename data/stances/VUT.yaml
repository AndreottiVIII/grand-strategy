  note: "Rival at most, never adversary: Vanuatu seeks Indonesian access and compliance (a UN human-rights visit to West Papua), not Indonesia's end. Friction is escalating: parliament backed West Papua's independence claims in June 2010, Jakarta publicly rebuked Vanuatu at the UN in September 2020, and in September 2026 Vanuatu and Solomon Islands demanded UN access, to which Jakarta replied under right of reply, calling the charges one-sided. No source calls it rivalry, so the grade is our reading (C). Bond grievance: the West Papua dispute itself."
