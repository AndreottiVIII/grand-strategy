    note: "Mali's junta held 46 Ivorian soldiers after their 2022 arrest (three women were freed in September 2022). A Bamako court gave them 20-year terms in late December 2022, and Goita pardoned the group in early January 2023. ECOWAS set Mali a deadline and did not impose sanctions. Abidjan said the men were a backup force for MINUSMA; Bamako called them mercenaries. Rival is our reading (C): a serious dispute with no sign of a will to destroy the other state; no source uses the word. Bond grievance is our reading of the trial as an open wound. Trend stable is a placeholder: no source after January 2023 was read, so the present direction is a gap. Gap: bilateral relations since 2023 are not researched."
