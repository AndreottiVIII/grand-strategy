    note: "Traore accused Abidjan of welcoming Burkina's destabilisers in April 2024. In April 2025 the junta announced a foiled plot it blamed on masterminds in Ivory Coast (junta claim, AFP copy); in September 2025 the head of state named neighbouring countries, Ivory Coast among them. Rival is our reading (C): friction and mutual charges, with no sign of a will to destroy the other regime; no source uses the word. Abidjan rejects the charges and says Burkina has offered no proof. Trend cooling from the 2024 to 2025 escalation. Bond grievance is our reading (the accusations and the detentions as an open wound). Gaps: the six Ivorian officials reported detained in late August 2025 come from search summaries and are not confirmed at source (the allAfrica article returned HTTP 403); JNIM attacks on the northern border are not sourced here."
