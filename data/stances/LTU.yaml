  note: "Reserved for mortal enemies, and the evidence is a declared view of Russia's regime, not rhetoric: the Seimas voted in May 2022 that Russia supports and perpetrates terrorism, and in March 2023 asked the world to recognise it as a terrorist state; the 2026 national threat assessment treats Russia as the primary threat and dates a limited Baltic war to 3-5 years after a Ukraine ceasefire. Hostile action is documented on Lithuanian soil (IKEA arson sentenced Nov 2025, 36 GPS-spoofing antennas in Kaliningrad). Lithuania does not seek Russia's disappearance, which is why this is the edge of the grade; the Russian regime's behaviour is the problem, and it backs Ukraine's victory by law (0.25% of GDP). Cooling: 'cooling' here means hardening. Residual commerce (Kaliningrad gas transit to 2030) is a legal obligation, not a bond. Bond - grievance: the 1940-91 occupation. The reciprocal Russian stance has not been written."
