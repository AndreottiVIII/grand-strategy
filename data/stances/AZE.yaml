  - toward: TUR
    grade: ally
    trend: stable
    bond: kin
    since: 2010-08-16
    last_verified: 2026-10-12
    confidence: A
    note: "Treaty alliance: the 2010 Agreement on Strategic Partnership and Mutual Assistance and the Shusha Declaration on Allied Relations (15 Jun 2021), under which the two coordinate their armed forces if a third state threatens either's independence or territorial integrity. Kin (Turkic, 'one nation, two states'). Joint exercises (Unwavering Brotherhood, 26 Mar-1 Apr 2026), defence-industry talks at ADEX (30 Sep 2026), Erdogan's call after the Nakhchivan strike. The one visible friction is Ankara's normalisation with Armenia (direct trade preparations completed on 11 May 2026), which Turkey has tied to a peace deal acceptable to Baku, so it does not cut against the alliance."
    sources:
      - {url: "https://president.az/en/articles/view/52122", title: "Shusha Declaration on Allied Relations between the Republic of Azerbaijan and the Republic of Turkey", publisher: "Presidential Administration of Azerbaijan", date: 2021-06-15, tier: 1}
