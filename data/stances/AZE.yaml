  - toward: USA
    grade: partner
    trend: warming
    bond: none
    since: 2025-08-08
    last_verified: 2026-10-12
    confidence: B
    note: "Charter on Strategic Partnership signed by Vance and Aliyev in Baku on 10 Feb 2026 (defence sales, AI, energy, counter-terrorism), Section 907 waived again at the 8 Aug 2025 Washington summit, TRIPP development rights for a US-controlled company, founding membership of the Board of Peace on 22 Jan 2026. No treaty guarantee and no US troops, so partner not ally; the 907 restriction is still law, waived rather than repealed. Earlier Congress-driven grievance has faded, hence bond 'none'."
