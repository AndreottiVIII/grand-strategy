  - toward: RUS
    grade: reluctant_partner
    trend: warming
    bond: none
    since: 2024-12-25
    last_verified: 2026-10-12
    confidence: C
    note: "Baku cooperates (Russian grain and fertiliser transit to Armenia through Azerbaijan, intergovernmental economic commission in Astrakhan in August 2025, a deputy prime minister in Baku on 2 Mar 2026, a joint statement on 15 Apr 2026 settling the AZAL case, Lavrov-Bayramov on 17 Jul 2026) while resisting alignment: it did not attend the 9 May 2025 parade, raided Sputnik Azerbaijan in June 2025 and dropped the demand to punish those responsible only to restore working relations. In mid-2025, after the AZAL shoot-down (25 Dec 2024) and the Yekaterinburg deaths (27 Jun 2025), the relationship was closer to 'rival'; the trend since Dushanbe (9 Oct 2025) is a warming from that low, with no Russian base and no peacekeepers (left 12 Jun 2024) to hold Baku. The grade is ours (a 'cooling' and a 'reconciliation' are both used by sources), hence confidence C."
