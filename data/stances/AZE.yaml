actor: AZE
stances:
  - toward: ARM
    grade: rival
    trend: warming
    bond: grievance
    since: 2023-09-20
    last_verified: 2026-10-12
    confidence: C
    note: "Until 2023 the pair were mortal enemies (the ontology's reference case for 'adversary'). Since the Karabakh offensive of 19-20 Sep 2023 and the exodus of about 100,000 Armenians, Baku's aim is no longer Armenia's defeat but a settlement on its terms: the treaty was initialled in Washington on 8 Aug 2025, transit restrictions were lifted on 21 Oct 2025 and fuel exports to Armenia run at USD 17.6m in January-August 2026. Still not a partner: the constitution is a precondition for signing, 'Western Azerbaijan' is in official use, Armenian churches are being demolished and the Karabakh leaders were sentenced in February 2026 (Vardanyan 20 years). Warming because of the Washington text, the transit and the June 2026 Armenian election, which left Civil Contract short of a constitutional majority."
    sources:
      - {url: "https://events.ceip.org/russia-eurasia/politika/2026/06/azerbaijan-armenia-elections", title: "Who Does Azerbaijan Want to See Win Armenia's Elections?", publisher: "Carnegie Politika", date: 2026-06-05, tier: 2}
