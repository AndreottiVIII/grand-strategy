  - toward: ISR
    grade: partner
    trend: stable
    bond: none
    since: 1992
    last_verified: 2026-10-12
    confidence: B
    note: "The deepest transactional partnership Baku has: Israel supplied about 69% of Azerbaijani arms imports in 2016-2021 (SIPRI via RFE/RL) and Azerbaijan supplies more than half of Israel's crude through BTC (46-65% depending on the year). No treaty and no shared ideology, so 'partner' and bond 'none', not ally. The relationship carries a cost in Tehran and Baku denies, on the record, that its territory is used against Iran (embassy in Washington, March 2026; CNN's report of Israeli troops rests on anonymous sources)."
    sources:
      - {url: "https://www.rferl.org/a/azerbaijan-iran-azeris-israel-attacks-war-weapons/33449040.html", title: "Israel's Barrage Of Iran Is Furious. Azerbaijan, To Iran's North, Is Treading Lightly.", publisher: "RFE/RL", date: 2025-06-19, tier: 3}
