  - toward: IRN
    grade: rival
    trend: stable
    bond: grievance
    since: 1991
    last_verified: 2026-10-12
    confidence: B
    note: "Competing interests and open friction, but no will to destroy the other: Baku accuses Iran of the Nakhchivan drone strike of 5 Mar 2026 (Aliyev demanded an apology and accountability, pulled diplomats from Tehran and Tabriz on 6 Mar, the security service reported foiled IRGC-linked plots against the BTC pipeline) while still meeting Pezeshkian in Bishkek on 31 Aug 2026 and hosting an Iranian military delegation at ADEX on 30 Sep 2026. Grievances: Iran's Armenia alignment, Azeri irredentism in both directions, Baku's Israeli ties. Not 'adversary': both sides keep talking and Baku refuses to host operations against Iran."
    sources:
      - {url: "https://jamestown.substack.com/p/irans-drone-attacks-strain-tensions", title: "Iran's Drone Attacks Strain Tensions between Baku and Tehran", publisher: "Jamestown Foundation", date: 2026-03-12, tier: 2}
