    note: "Kinshasa agreed to Operation Shujaa with the UPDF from November 2021, so the two cooperate against the ADF out of necessity. Uganda resists alignment: the ICJ ordered it to pay USD 325m in reparations for its 1998-2003 occupation (judgment of 9 February 2022, payable in five USD 65m instalments; the first was paid in September 2022). Later instalments, due to 1 September 2026, are not verified. The UN experts say Ugandan units shielded M23 (July 2025 report as reported); Uganda denies it. reluctant_partner is our reading of that structure, not a source's word. Bond grievance: the ICJ case is an open wound. Gap: whether the 2026 instalments were paid."
