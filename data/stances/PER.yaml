  note: 'Peru broke diplomatic relations on 1 Sep 2026 (consular ties kept), by a note delivered through Iran''s embassy in Ecuador, which serves Peru. The foreign ministry gave four grounds: the deterioration
    of human rights as denounced by UN mechanisms, Iran''s obstruction of IAEA inspectors, Iranian restrictions on shipping through the Strait of Hormuz since March, and Iran''s ''incitement'' of escalation
    in the Middle East, as the war restarted after new US attacks on Iran. Rival, not adversary: a severance of relations aimed at deterrence, with no aim of destroying the Iranian state (ontology rule);
    the grade is our reading, B on the strength of a government statement and an agency report of the act. Trade was only US$1.3m in 2025 (BNE IntelliNews, opinion piece, tier 4), which is why one commentary
    reads the break as a signal to Washington rather than a step about Tehran; that reading is the commentator''s, not ours. Bond none.'
