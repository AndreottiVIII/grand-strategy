  note: 'Lima''s side of the Chancay relation. The sources are mirrored from the CHN card (same URLs): the Chancay inauguration by video link on 14 Nov 2024 with Xi and Boluarte, a COSCO-owned terminal
    (60%, 30-year concession). Partner, not ally: no defence clause or alignment instrument was found. Warming on the volumes is our reading from the export figures (China 32% of 2025 exports, reported;
    not verified against the trade ministry). Friction sits under the posture: Congress removed President Jerí in February 2026 over undisclosed meetings with a Chinese businessman under scrutiny (Wikipedia
    pointer, tier 4). Update 2026-10-16: China took 36.2% of 2025 exports (Mincetur, via Infomercado; US$17.39bn in January-May 2026, +44.3%, Andina), Chancay handled 336,200 TEU in 2025 against a target
    above 350,000 and lost US$10.8m, and in early 2026 a Peruvian judge barred the regulator Ositran from supervising the port beyond its tariffs, drawing a US State Department warning and China''s ''strong
    dissatisfaction''; Lima said the port must obey Peruvian rules. The new foreign minister Espa said nothing about China in the Reuters report of 31 Jul 2026 (silence, not a signal). No Peruvian government
    statement on China was fetched; the grade is our reading of the structure (C) on top of the mirrored B evidence. Bond none: no kinship or grievance found.'
