  note: 'Peru''s side of the Bolivian sea question. In October 2010 Alan Garcia and Evo Morales signed the Ilo protocol, a 99-year duty-free maritime zone for Bolivia at Peru''s port (Peruvian Times, El
    Universo; Peruvian ratification not verified), and in January 2026 President Paz said that the Pacific, through Chile or Peru, has to be Bolivia''s gateway (Gestion). Under the 1929 Treaty of Lima Bolivia''s
    access is blocked by both Chile and Peru (background in the search results, treaty text not read). On 28 Aug 2026 Peru and Bolivia signed with Chile and Argentina the strategic-minerals declaration
    (Euronews, the same source as the BOL card). Partner is our reading (C): Lima accommodates Bolivia on its own coast while it does not back a Bolivian claim on Chilean territory; trend stable (nothing
    dated since 2010 on the Peruvian side besides the August declaration); bond none. Gaps: Fujimori government line on Bolivia''s outlet, and the status of the Ilo zone in practice.'
