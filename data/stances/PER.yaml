  note: "Peru cut relations on 3 Nov 2025 after Mexico granted asylum in its Lima embassy to ex-prime minister Betssy Chavez (rebellion charges over Castillo's 2022 attempt to dissolve Congress); foreign minister De Zela called it an unfriendly act, Congress declared Sheinbaum persona non grata, and Sheinbaum called the break disproportionate (Andina, CP24, mirrored from the MEX card). Fujimori announced in July that she would restore ties; on 7 Aug 2026 a joint foreign-ministry statement did so, Peru gave Chavez safe-conduct as a goodwill gesture (Sheinbaum's word) and reserved the right to ask for her extradition; Mexico's Senate ratified Lydia Antonio de la Garza as ambassador on 13 Oct 2026, the Peruvian ambassador being unconfirmed. Mexico grades the pair neutral and warming; from Lima's side reluctant_partner, because the asylum wound is not closed (the extradition reservation) and Mexico also shelters Castillo's wife and children while he serves 11 years. Both the grade and the bond are our reading (C)."
