  note: 'Transaction, not alignment. The United States is named by Wikipedia as Peru''s number one trade partner in total trade (tier 4 pointer), and the two cooperate on counter-narcotics and under the
    Rio Pact. Cooling: the 2025 push on copper tariffs (Andina reported a 50% copper rate in July 2025), and the Boluarte-era rift over US condemnation of rights abuses (Wikipedia pointer). Public opinion
    cools too: a CFR brief links the tariffs to a sour view of the US in Peru. Peru sends under 5% of its copper to the US, so the tariff is more narrative than volume (CFR, as seen in search results).
    The grade is our reading (C); no source names it. Bond none: no kinship or grievance found in the sources read. Update 2026-10-16: the tariff is now verified. On 24 Jul 2026 the US put an additional
    12.5% tariff on Peru under Section 301 (forced-labour import bans; 10% or 12.5% for 60 economies), replacing the 10% Section 122 surcharge that expired that day, with 2,000+ products excluded (45% of
    the value of US imports from Peru); Mincetur says it will seek a review and has sent Congress a forced-labour bill. Against that, the Fujimori government (since 28 Jul) calls the US a "strategic partner"
    (Espa to Reuters, 31 Jul), expects a tariff review and is moving to join the US-backed Shield of the Americas against transnational crime; and in February 2026 the State Department warned that Peru
    could lose oversight of Chancay. Trend moved from cooling to stable: the trade friction and the political warming offset each other, our reading. US bought US$10.15bn of Peruvian goods in 2025 (Reuters
    via Hiru).'
