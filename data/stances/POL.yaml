  note: 'The closest neighbour and the logistics hub of the war (Rzeszow), aligned by necessity with open friction: the Volhynia massacres and the May 2026 row over a Ukrainian army unit named after the UPA led President Nawrocki to strip Zelensky of the Order of the White Eagle; Zelensky skipped the Gdansk reconstruction conference of 25 Jun 2026; 51.9% of Poles say the naming hurt their view of Ukraine. Poland gives about EUR 5.9bn (about 1% of GDP, Kiel, April 2026), will not send troops even as peacekeepers, keeps its grain ban and tied the 800+ child benefit to work. No bilateral treaty of alliance in this atlas, so ''reluctant ally'', not ''ally''. Trend cooling: Tusk is conciliatory and a Warsaw diplomat told Reuters that Ukraine''s EU and NATO policy remains the government''s, but the president''s line sets the tone before the 2027 election. Bond - grievance: the historical wound.'
