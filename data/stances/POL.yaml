  note: 'Poland is the NATO and EU frontline that shelters the exiled opposition (Tsikhanouskaya''s office moved to Warsaw in Jan-Feb 2026), the 2021 migrant crisis, the 2023 Wagner scare and the 12 Sep 2025 closure of every crossing for Zapad-2025 define the rivalry, and Russian drones entered Polish airspace partly from Belarus on 9-10 Sep 2025. Warming because of the 28 Apr 2026 prisoner swap (Poczobut for the Russian archaeologist Butyagin, brokered with Washington) and the 17 Nov 2025 reopening of Kuznica and Bobrowniki; Sikorski also warned of a ''false dawn''. Not ''adversary'': Warsaw''s aim is containment and a free Belarus, not the end of the Belarusian state, and a swap shows a working channel. No source uses the word ''rival'': our reading, confidence C. Bond - grievance: the Poczobut case, the Polish minority, 2021. Symmetry check: Minsk grades Warsaw ''rival'' as well.'
