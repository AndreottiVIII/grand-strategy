  note: 'Warsaw''s own officials use the language of an enemy: the foreign minister called the Nov 2025 railway blast on the Warsaw-Lublin line ''an act of state terrorism'' and closed the last Russian consulate (Gdansk, after Kraków and Poznań); the president calls Russia the main threat to Poland and Central Europe (NATO summit, Ankara, Jul 2026) and says it stays Europe''s top threat after the Ukraine war; Tusk told parliament on 17 Sep 2026 that Russia plans hybrid drone and missile strikes on Ukraine''s allies; Peskov said relations had ''deteriorated completely''. We chose ''adversary'', not ''rival'' because the dispute is no longer about interests but about Poland''s security order and Russian services act on Polish soil; the cautionary point is that Warsaw states no aim of regime change in Russia, hence confidence B (a source saying ''adversary'' in the ontology''s sense does not exist; the reading is ours). Trend: cooling (worsening) in every quarter since 2024. Bond - grievance:
    partitions, 1939, 1945.'
