  note: 'Member since 1995 (EU Article 42(7) mutual assistance clause). The Orpo government is a pro-security, anti-debt member: it rejects a 2028-34 budget near EUR 2 trillion and any common-debt instrument, insists on conditionality, and joins the net-contributor group, yet pushes the EU hardest on Ukraine finance and the use of immobilised Russian assets. That is friction on the price, not on the structure, so it stays ally and not reluctant ally. The migration policy of the coalition (stricter asylum, time-limited protection) is national. Bond - affinity: the EU is the economic anchor and the second security layer.'
