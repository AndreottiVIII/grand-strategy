  confidence: B
  note: 'The treaty ally and patron: NATO Article 5, the DCA (15 sites, in force 1 Sep 2024, passed by Parliament unanimously), the F-35 (64 aircraft), the Arctic cutter deal signed by Trump and Stubb on 9 Oct 2025. There is visible friction - the January 2026 tariff threat over Greenland, the 15% US tariff on EU goods - which is why the trend is not warming; Stubb calls Greenland the hardest issue for Finland. The presidential channel to Trump is personal (golf, Mar-a-Lago, the White House) and is the reason the grade holds. Bond - affinity: no historical kinship, but a strong sympathy and a security bet that Finland has no alternative to.'
