  note: Pragmatic and narrowing. Finland follows the EU formula of cooperation, competition and systemic rivalry; it blocked Chinese purchases on security grounds, and the 2025-29 action plan agreed on Stubb's state visit (Oct 2024) is leaner and avoids the Arctic. China is the third source of Finnish imports (9.4%) and fifth export market (4.5%, the lowest since 2009). The Newnew Polar Bear dragged its anchor over the Balticconnector (8 Oct 2023); China called it a storm accident, and the captain is on trial in Hong Kong. Wang Yi met Stubb in Turku on 5 Jul 2026 and Valtonen in Helsinki, with talk of more exchanges. A source using the word partner is the Chinese readout; the grade is our reading of the structure (hence C). Bond - none.
