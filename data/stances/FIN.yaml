  note: 'Why rival and not adversary: Finland''s own line is that Russia is not an enemy but its actions and breaches of international law are opposed (Valtonen, April 2025), and the declared strategy is to support Ukraine, weaken Russia through sanctions and strengthen defence - deterrence and containment, not an aim of Russia''s defeat or regime. Yet the Government Defence Report (Dec 2024) calls Russia a long-term threat that will outlast the war, Supo names it the main threat, the eastern border has been shut since December 2023, Russia closed five rail crossings on 1 Jul 2026, and Peskov says Finland and Sweden ''reduced relations to zero''. Stubb (31 Mar 2025) says Finns must prepare mentally for an eventual thaw, so the door is not closed. Bond - grievance: Winter War memory and the 1,340 km border, now sharpened by hybrid pressure (instrumentalised migration, GNSS jamming, cable incidents). Our reading of the grade is C-level on the word itself; the structure is documented by tier
    1 sources.'
