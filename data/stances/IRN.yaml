  note: 'Graded adversary, not rival, and this is the least comfortable grade of the card. For: the US and Israel opened the war on 28 Feb 2026 with the declared aim of regime change (Reuters, 4 Mar: ''at
    the outset, Trump and Netanyahu both said regime change was the goal''), killed Ali Khamenei, kept a naval blockade of Iranian ports from 13 Apr (reinstated 13 Jul) and resumed strikes on 8 Jul; Mojtaba
    Khamenei''s first message demanded that ''all US bases in the region must close'' and promised vengeance; Iran fired at Al Udeid in June 2025 and at US-hosting Gulf states from 28 Feb 2026 (6,700+ missiles
    and drones by 17 May, per the CRS). Against: Hegseth said the operation was not ''a so-called regime-change war'', Trump moved to missiles, navy and the bomb, Vance asks for a ''meaningful'' cut in
    enrichment, and the two presidents signed the Pakistan-brokered memorandum of 17 Jun. The atlas reads it as a war between two states each of which would accept the other''s defeat, with talks as an
    instrument of the war, not a thaw. If a settlement on enrichment and Hormuz holds, the right grade becomes rival. Bond - grievance since the 1979 embassy seizure, and now the dead leader.'
